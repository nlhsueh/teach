<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 340" width="1080" height="340">
  <rect width="1080" height="340" rx="12" fill="#f8fafc"/>

  <!-- Column 1: RQ1 -->
  <rect x="16" y="16" width="336" height="308" rx="12" fill="#ffffff" stroke="#1b365d" stroke-width="2"/>
  <rect x="16" y="16" width="336" height="44" rx="12" fill="#1b365d"/>
  <rect x="16" y="48" width="336" height="12" fill="#1b365d"/>
  <text x="184" y="44" text-anchor="middle" font-family="Noto Sans TC, PingFang TC, sans-serif" font-size="15.5" font-weight="800" fill="#ffffff">RQ1：直接路徑效應</text>

  <rect x="34" y="74" width="300" height="58" rx="8" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="184" y="100" text-anchor="middle" font-family="Noto Sans TC, PingFang TC, sans-serif" font-size="21" font-weight="800" fill="#1b365d">R² = 0.771（高解釋力）</text>
  <text x="184" y="121" text-anchor="middle" font-family="Noto Sans TC, PingFang TC, sans-serif" font-size="12" fill="#475569">7 條假設路徑中有 4 條達顯著 (N = 217)</text>

  <g font-family="Noto Sans TC, PingFang TC, sans-serif" font-size="12.5" fill="#334155">
    <text x="36" y="158" font-weight="700" fill="#0f766e">✓ 自我評量 ➔ 期末成績</text>
    <text x="332" y="158" text-anchor="end" font-weight="800" fill="#0f766e">β = 0.819**</text>

    <text x="36" y="186" font-weight="700" fill="#1b365d">✓ 上線時間 ➔ 自我評量</text>
    <text x="332" y="186" text-anchor="end" font-weight="800" fill="#1b365d">β = 0.302**</text>

    <text x="36" y="214" font-weight="700" fill="#1b365d">✓ 影片觀看 ➔ 成績／評量</text>
    <text x="332" y="214" text-anchor="end" font-weight="800" fill="#1b365d">0.113** / 0.157*</text>

    <line x1="34" y1="232" x2="334" y2="232" stroke="#e2e8f0" stroke-width="1.5"/>

    <text x="36" y="256" font-weight="700" fill="#8c1d40">✗ 上線時間 ➔ 成績（直接）</text>
    <text x="332" y="256" text-anchor="end" font-weight="700" fill="#8c1d40">p = 0.163（不顯著）</text>

    <text x="36" y="284" font-weight="700" fill="#8c1d40">✗ 線上文件 ➔ 兩項目標</text>
    <text x="332" y="284" text-anchor="end" font-weight="700" fill="#8c1d40">p &gt; 0.51（不顯著）</text>
  </g>

  <!-- Column 2: RQ2 -->
  <rect x="372" y="16" width="336" height="308" rx="12" fill="#ffffff" stroke="#0f766e" stroke-width="2"/>
  <rect x="372" y="16" width="336" height="44" rx="12" fill="#0f766e"/>
  <rect x="372" y="48" width="336" height="12" fill="#0f766e"/>
  <text x="540" y="44" text-anchor="middle" font-family="Noto Sans TC, PingFang TC, sans-serif" font-size="15.5" font-weight="800" fill="#ffffff">RQ2：認知投入中介效應</text>

  <rect x="390" y="74" width="300" height="58" rx="8" fill="#f0fdfa" stroke="#5eead4"/>
  <text x="540" y="100" text-anchor="middle" font-family="Noto Sans TC, PingFang TC, sans-serif" font-size="20" font-weight="800" fill="#0f766e">自我評量為關鍵橋樑</text>
  <text x="540" y="121" text-anchor="middle" font-family="Noto Sans TC, PingFang TC, sans-serif" font-size="12" fill="#475569">3 條間接路徑中有 2 條達統計顯著</text>

  <g font-family="Noto Sans TC, PingFang TC, sans-serif" font-size="12.5" fill="#334155">
    <rect x="390" y="144" width="300" height="54" rx="7" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="402" y="165" font-weight="800" fill="#0f766e">✓ 上線時間 ➔ 自我評量 ➔ 成績</text>
    <text x="402" y="185" font-size="12">間接效應 = 0.248 (t = 5.352, p = 0.000**)</text>

    <rect x="390" y="206" width="300" height="54" rx="7" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="402" y="227" font-weight="800" fill="#0f766e">✓ 影片觀看 ➔ 自我評量 ➔ 成績</text>
    <text x="402" y="247" font-size="12">間接效應 = 0.128 (t = 2.389, p = 0.017*)</text>

    <rect x="390" y="268" width="300" height="42" rx="7" fill="#fdf2f5" stroke="#fecdd3"/>
    <text x="402" y="294" font-weight="700" fill="#8c1d40">✗ 線上文件 ➔ 評量 ➔ 成績（p = 0.512）</text>
  </g>

  <!-- Column 3: RQ3 -->
  <rect x="728" y="16" width="336" height="308" rx="12" fill="#ffffff" stroke="#8c1d40" stroke-width="2"/>
  <rect x="728" y="16" width="336" height="44" rx="12" fill="#8c1d40"/>
  <rect x="728" y="48" width="336" height="12" fill="#8c1d40"/>
  <text x="896" y="44" text-anchor="middle" font-family="Noto Sans TC, PingFang TC, sans-serif" font-size="15.5" font-weight="800" fill="#ffffff">RQ3：IPMA 關鍵驅動因子</text>

  <rect x="746" y="74" width="300" height="58" rx="8" fill="#fdf2f5" stroke="#fda4af"/>
  <text x="896" y="100" text-anchor="middle" font-family="Noto Sans TC, PingFang TC, sans-serif" font-size="20" font-weight="800" fill="#8c1d40">第一驅動力：自我評量</text>
  <text x="896" y="121" text-anchor="middle" font-family="Noto Sans TC, PingFang TC, sans-serif" font-size="12" fill="#475569">重要性 = 0.82 · 表現分數 = 62.43</text>

  <g font-family="Noto Sans TC, PingFang TC, sans-serif" font-size="12.5" fill="#334155">
    <text x="748" y="158" font-weight="700" fill="#0f766e">★ Unit_test（雙冠王）</text>
    <text x="1044" y="158" text-anchor="end" font-weight="800" fill="#0f766e">I=0.36 · P=86.0</text>

    <text x="748" y="186" font-weight="700" fill="#0f766e">★ Game_test（高重要高表現）</text>
    <text x="1044" y="186" text-anchor="end" font-weight="800" fill="#0f766e">I=0.28 · P=77.0</text>

    <rect x="746" y="200" width="300" height="56" rx="7" fill="#fff7ed" stroke="#fdba74"/>
    <text x="758" y="221" font-weight="800" fill="#9a3412">🎯 優先改善標的（高重要、低表現）：</text>
    <text x="758" y="242" font-size="12" fill="#7c2d12">OJ_test (P=47.9) 與 Online_days (P=33.4)</text>

    <text x="748" y="284" font-weight="700" fill="#64748b">⚠ Doc_count（最低）</text>
    <text x="1044" y="284" text-anchor="end" font-weight="700" fill="#64748b">I=0.01 · P=9.2</text>
  </g>
</svg>
