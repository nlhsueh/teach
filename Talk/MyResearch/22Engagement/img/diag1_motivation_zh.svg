<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 320" width="960" height="320">
  <defs>
    <filter id="shadow" x="-4%" y="-4%" width="108%" height="112%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
  </defs>
  <rect width="960" height="320" rx="12" fill="#f8fafc"/>

  <!-- Left Card -->
  <g filter="url(#shadow)">
    <rect x="24" y="20" width="420" height="280" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
    <rect x="24" y="20" width="420" height="44" rx="12" fill="#8c1d40"/>
    <rect x="24" y="50" width="420" height="14" fill="#8c1d40"/>
    <text x="234" y="48" text-anchor="middle" font-family="Noto Sans TC, PingFang TC, sans-serif" font-size="16" font-weight="800" fill="#ffffff">傳統 LMS 與獨立 OJ 系統之盲點</text>
  </g>
  <g font-family="Noto Sans TC, PingFang TC, sans-serif" font-size="13.5" fill="#334155">
    <rect x="44" y="82" width="380" height="54" rx="8" fill="#fdf2f5" stroke="#fecdd3"/>
    <text x="58" y="105" font-weight="700" fill="#8c1d40">✗ 無法洞察程式實作行為</text>
    <text x="58" y="125" font-size="12.5">傳統 LMS 僅記錄點擊，難以分析寫程式的學習歷程。</text>

    <rect x="44" y="148" width="380" height="54" rx="8" fill="#fdf2f5" stroke="#fecdd3"/>
    <text x="58" y="171" font-weight="700" fill="#8c1d40">✗ 只見低分、不知原因</text>
    <text x="58" y="191" font-size="12.5">獨立 OJ 僅回報答對與否，易使初學者喪失信心。</text>

    <rect x="44" y="214" width="380" height="66" rx="8" fill="#fff1f2" stroke="#fda4af"/>
    <text x="58" y="238" font-weight="700" fill="#8c1d40">✗ 缺乏因果路徑與優先級診斷</text>
    <text x="58" y="258" font-size="12.5">難以釐清看影片、讀教材、做測驗何者真正驅動成績。</text>
  </g>

  <!-- Center Arrow -->
  <g>
    <circle cx="480" cy="160" r="24" fill="#1b365d"/>
    <text x="480" y="167" text-anchor="middle" font-family="Inter, sans-serif" font-size="22" font-weight="800" fill="#ffffff">➔</text>
  </g>

  <!-- Right Card -->
  <g filter="url(#shadow)">
    <rect x="516" y="20" width="420" height="280" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <rect x="516" y="20" width="420" height="44" rx="12" fill="#0f766e"/>
    <rect x="516" y="50" width="420" height="14" fill="#0f766e"/>
    <text x="726" y="48" text-anchor="middle" font-family="Noto Sans TC, PingFang TC, sans-serif" font-size="16" font-weight="800" fill="#ffffff">本研究方法：OpenEdu + PLS-SEM + IPMA</text>
  </g>
  <g font-family="Noto Sans TC, PingFang TC, sans-serif" font-size="13.5" fill="#334155">
    <rect x="536" y="82" width="380" height="54" rx="8" fill="#f0fdfa" stroke="#99f6e4"/>
    <text x="550" y="105" font-weight="700" fill="#0f766e">✓ 整合跨平台細粒度學習日誌</text>
    <text x="550" y="125" font-size="12.5">匯整 OpenEdu 影片／文件事件，以及單元、遊戲與 OJ 測驗。</text>

    <rect x="536" y="148" width="380" height="54" rx="8" fill="#f0fdfa" stroke="#99f6e4"/>
    <text x="550" y="171" font-weight="700" fill="#0f766e">✓ 行為投入 ➔ 認知投入 ➔ 成績因果模型</text>
    <text x="550" y="191" font-size="12.5">運用 PLS-SEM 同時檢驗直接效應與自我評量中介機制。</text>

    <rect x="536" y="214" width="380" height="66" rx="8" fill="#eff6ff" stroke="#bfdbfe"/>
    <text x="550" y="238" font-weight="700" fill="#1b365d">✓ IPMA 重要性—表現矩陣精準導航</text>
    <text x="550" y="258" font-size="12.5">鎖定「高重要性、低表現」之關鍵教學改善標的。</text>
  </g>
</svg>
