<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 320" width="1100" height="320">
  <defs>
    <marker id="arr-m" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#1b365d"/>
    </marker>
    <marker id="arr-t" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0f766e"/>
    </marker>
    <marker id="arr-r" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#8c1d40"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1100" height="320" rx="12" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- Step 1 -->
  <rect x="22" y="95" width="196" height="130" rx="10" fill="#ffffff" stroke="#1b365d" stroke-width="2.2"/>
  <text x="120" y="122" text-anchor="middle" font-family="Inter, sans-serif" font-size="13" font-weight="700" fill="#1b365d">1. Space Bounds</text>
  <text x="36" y="146" font-family="Inter, sans-serif" font-size="11.5" fill="#334155">Find minimal set M_ss</text>
  <text x="36" y="164" font-family="Inter, sans-serif" font-size="11.5" fill="#334155">and minimal space S_ss</text>
  <text x="36" y="186" font-family="JetBrains Mono, monospace" font-size="12" font-weight="700" fill="#0f172a">S_as = S_s - S_ss</text>
  <text x="36" y="206" font-family="Inter, sans-serif" font-size="11" fill="#64748b">(Remaining available space)</text>

  <line x1="218" y1="160" x2="254" y2="160" stroke="#1b365d" stroke-width="2.2" marker-end="url(#arr-m)"/>

  <!-- Step 2: Candidate Pruning -->
  <rect x="262" y="95" width="210" height="130" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2.2"/>
  <text x="367" y="122" text-anchor="middle" font-family="Inter, sans-serif" font-size="13" font-weight="700" fill="#0f766e">2. Candidate Pruning</text>
  <text x="276" y="146" font-family="Inter, sans-serif" font-size="11.5" fill="#334155">Exclude views with S_i &gt; S_as</text>
  <text x="276" y="166" font-family="Inter, sans-serif" font-size="11.5" fill="#334155">Remaining = M_cs (size S_cs)</text>
  <text x="276" y="190" font-family="JetBrains Mono, monospace" font-size="12.5" font-weight="700" fill="#0f766e">Mid-point r = S_cs / 2</text>
  <text x="276" y="210" font-family="Inter, sans-serif" font-size="11" fill="#64748b">Prevents misjudging mid-point</text>

  <line x1="472" y1="160" x2="508" y2="160" stroke="#1b365d" stroke-width="2.2" marker-end="url(#arr-m)"/>

  <!-- Decision Diamond -->
  <polygon points="590,94 666,160 590,226 514,160" fill="#ffffff" stroke="#1b365d" stroke-width="2.5"/>
  <text x="590" y="154" text-anchor="middle" font-family="Inter, sans-serif" font-size="13" font-weight="800" fill="#1b365d">r &gt;= S_as?</text>
  <text x="590" y="174" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" fill="#475569">Compare to</text>
  <text x="590" y="188" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" fill="#475569">cutting point</text>

  <!-- Upper Branch: YES -> Add via Gain -->
  <path d="M 590 94 L 590 58 L 710 58" fill="none" stroke="#0f766e" stroke-width="2.2" marker-end="url(#arr-t)"/>
  <text x="646" y="48" text-anchor="middle" font-family="Inter, sans-serif" font-size="11.5" font-weight="700" fill="#0f766e">YES (Tight space)</text>

  <rect x="718" y="18" width="358" height="122" rx="10" fill="#f0fdfa" stroke="#0f766e" stroke-width="2.2"/>
  <text x="897" y="42" text-anchor="middle" font-family="Inter, sans-serif" font-size="13.5" font-weight="700" fill="#0f766e">Addition Path (Start from M_ss)</text>
  <text x="734" y="66" font-family="Inter, sans-serif" font-size="12" fill="#0f172a">Iteratively ADD view v maximizing Gain Metric:</text>
  <text x="734" y="90" font-family="JetBrains Mono, monospace" font-size="12.5" font-weight="700" fill="#1b365d">Gain(v) = [Cost(mv) - Cost(mv+{v})] / S_v</text>
  <text x="734" y="114" font-family="Inter, sans-serif" font-size="11.5" fill="#475569">Stop when no candidate fits remaining space S_rs.</text>

  <!-- Lower Branch: NO -> Delete via Loss -->
  <path d="M 590 226 L 590 262 L 710 262" fill="none" stroke="#8c1d40" stroke-width="2.2" marker-end="url(#arr-r)"/>
  <text x="646" y="280" text-anchor="middle" font-family="Inter, sans-serif" font-size="11.5" font-weight="700" fill="#8c1d40">NO (Ample space)</text>

  <rect x="718" y="178" width="358" height="122" rx="10" fill="#fdf2f5" stroke="#8c1d40" stroke-width="2.2"/>
  <text x="897" y="202" text-anchor="middle" font-family="Inter, sans-serif" font-size="13.5" font-weight="700" fill="#8c1d40">Deletion Path (Start from M_ss + M_cs)</text>
  <text x="734" y="226" font-family="Inter, sans-serif" font-size="12" fill="#0f172a">Iteratively REMOVE view v minimizing Loss Metric:</text>
  <text x="734" y="250" font-family="JetBrains Mono, monospace" font-size="12.5" font-weight="700" fill="#8c1d40">Loss(v) = [Cost(mv-{v}) - Cost(mv)] / S_v</text>
  <text x="734" y="274" font-family="Inter, sans-serif" font-size="11.5" fill="#475569">Stop as soon as total space S_mv &lt;= S_s.</text>
</svg>
