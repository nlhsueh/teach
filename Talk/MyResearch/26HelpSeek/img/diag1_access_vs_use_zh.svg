<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 390" font-family="'Noto Sans TC','PingFang TC','Inter',sans-serif">
  <defs>
    <marker id="arr-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 1 L10 5 L0 9 z" fill="#64748b"/>
    </marker>
    <marker id="arr-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 1 L10 5 L0 9 z" fill="#0f766e"/>
    </marker>
  </defs>

  <!-- Left Panel: Assumption -->
  <rect x="14" y="12" width="520" height="300" rx="14" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
  <rect x="14" y="12" width="520" height="44" rx="14" fill="#64748b"/>
  <rect x="14" y="42" width="520" height="14" fill="#64748b"/>
  <text x="274" y="40" text-anchor="middle" fill="#ffffff" font-size="17" font-weight="700">常見假設：提供 AI 工具 = 自動改善學習</text>

  <rect x="54" y="76" width="440" height="50" rx="9" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.8"/>
  <text x="274" y="107" text-anchor="middle" fill="#334155" font-size="16" font-weight="600">開放 24/7 LLM 概念澄清</text>
  <line x1="274" y1="126" x2="274" y2="152" stroke="#64748b" stroke-width="2.5" marker-end="url(#arr-gray)"/>

  <rect x="54" y="156" width="440" height="50" rx="9" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.8"/>
  <text x="274" y="187" text-anchor="middle" fill="#334155" font-size="16" font-weight="600">學生遇錯主動提問釐清</text>
  <line x1="274" y1="206" x2="274" y2="232" stroke="#64748b" stroke-width="2.5" marker-end="url(#arr-gray)"/>

  <rect x="54" y="236" width="440" height="54" rx="9" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.8" stroke-dasharray="6 4"/>
  <text x="274" y="269" text-anchor="middle" fill="#475569" font-size="16" font-weight="700">後續寫程式明顯更順更快</text>

  <!-- VS Badge -->
  <circle cx="560" cy="162" r="24" fill="#8c1d40" stroke="#ffffff" stroke-width="3"/>
  <text x="560" y="168" text-anchor="middle" fill="#ffffff" font-size="16" font-weight="800">VS</text>

  <!-- Right Panel: Reality -->
  <rect x="586" y="12" width="520" height="300" rx="14" fill="#f0fdfa" stroke="#0f766e" stroke-width="2.2"/>
  <rect x="586" y="12" width="520" height="44" rx="14" fill="#1b365d"/>
  <rect x="586" y="42" width="520" height="14" fill="#1b365d"/>
  <text x="846" y="40" text-anchor="middle" fill="#ffffff" font-size="17" font-weight="700">真實課堂實證發現（N = 732 次補救歷程）</text>

  <rect x="614" y="76" width="464" height="50" rx="9" fill="#fdf2f5" stroke="#8c1d40" stroke-width="2"/>
  <text x="846" y="107" text-anchor="middle" fill="#8c1d40" font-size="16" font-weight="700">78.0% 純重測慣性（忽略 AI 澄清）</text>
  <line x1="846" y1="126" x2="846" y2="152" stroke="#0f766e" stroke-width="2.5" marker-end="url(#arr-teal)"/>

  <rect x="614" y="156" width="464" height="50" rx="9" fill="#ffffff" stroke="#0f766e" stroke-width="2"/>
  <text x="846" y="187" text-anchor="middle" fill="#0f766e" font-size="16" font-weight="700">僅 22.0% 求助，且 86.3% 集中在第 1 輪</text>
  <line x1="846" y1="206" x2="846" y2="232" stroke="#0f766e" stroke-width="2.5" marker-end="url(#arr-teal)"/>

  <rect x="614" y="236" width="464" height="54" rx="9" fill="#1b365d"/>
  <text x="846" y="269" text-anchor="middle" fill="#ffffff" font-size="15.2" font-weight="700">及早澄清縮短補救輪數（2 vs 4），但程式效率無顯著差異</text>

  <!-- Bottom Banner -->
  <rect x="14" y="328" width="1092" height="48" rx="10" fill="#eef2ff" stroke="#1b365d" stroke-width="1.8"/>
  <text x="560" y="358" text-anchor="middle" fill="#1b365d" font-size="16.5" font-weight="800">核心轉向：從「有沒有用 AI」轉為「何時使用 × 在哪一階段產生價值」</text>
</svg>
