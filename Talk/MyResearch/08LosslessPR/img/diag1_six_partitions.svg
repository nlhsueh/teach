<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 320" font-family="Inter, -apple-system, BlinkMacSystemFont, sans-serif">
  <defs>
    <marker id="arr-b" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#1b365d"/>
    </marker>
  </defs>

  <rect width="920" height="320" rx="12" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- Left: 6 Adaptive Partition Candidates -->
  <text x="26" y="30" fill="#1b365d" font-size="13.5" font-weight="800">6 ADAPTIVE PARTITION CANDIDATES (PER EMBEDDING PLANE)</text>

  <!-- Horizontal 1x3 box -->
  <rect x="24" y="44" width="286" height="122" rx="8" fill="#ffffff" stroke="#1b365d" stroke-width="1.5"/>
  <text x="38" y="66" fill="#1b365d" font-size="12.5" font-weight="700">BO = 0: Horizontal (1 x 3)</text>
  <!-- Type-0 -->
  <text x="38" y="90" fill="#475569" font-size="11" font-weight="600">BT=0 (t=0):</text>
  <rect x="114" y="76" width="54" height="20" rx="3" fill="#dbeafe" stroke="#1b365d"/>
  <text x="141" y="90" text-anchor="middle" fill="#1b365d" font-size="10" font-weight="700">b0 b1 b2</text>
  <rect x="172" y="76" width="54" height="20" rx="3" fill="#dbeafe" stroke="#1b365d"/>
  <text x="199" y="90" text-anchor="middle" fill="#1b365d" font-size="10" font-weight="700">b3 b4 b5</text>
  <rect x="230" y="76" width="54" height="20" rx="3" fill="#dbeafe" stroke="#1b365d"/>
  <text x="257" y="90" text-anchor="middle" fill="#1b365d" font-size="10" font-weight="700">b6 b7 b8</text>
  <!-- Type-1 -->
  <text x="38" y="118" fill="#475569" font-size="11" font-weight="600">BT=1 (t=1):</text>
  <rect x="114" y="104" width="16" height="20" rx="2" fill="#e2e8f0"/>
  <rect x="134" y="104" width="54" height="20" rx="3" fill="#ccfbf1" stroke="#0f766e"/>
  <text x="161" y="118" text-anchor="middle" fill="#0f766e" font-size="10" font-weight="700">b1 b2 b3</text>
  <rect x="192" y="104" width="54" height="20" rx="3" fill="#ccfbf1" stroke="#0f766e"/>
  <text x="219" y="118" text-anchor="middle" fill="#0f766e" font-size="10" font-weight="700">b4 b5 b6</text>
  <!-- Type-2 -->
  <text x="38" y="146" fill="#475569" font-size="11" font-weight="600">BT=2 (t=2):</text>
  <rect x="114" y="132" width="32" height="20" rx="2" fill="#e2e8f0"/>
  <rect x="150" y="132" width="54" height="20" rx="3" fill="#fce7f3" stroke="#8c1d40"/>
  <text x="177" y="146" text-anchor="middle" fill="#8c1d40" font-size="10" font-weight="700">b2 b3 b4</text>
  <rect x="208" y="132" width="54" height="20" rx="3" fill="#fce7f3" stroke="#8c1d40"/>
  <text x="235" y="146" text-anchor="middle" fill="#8c1d40" font-size="10" font-weight="700">b5 b6 b7</text>

  <!-- Vertical 3x1 box -->
  <rect x="24" y="178" width="286" height="122" rx="8" fill="#ffffff" stroke="#0f766e" stroke-width="1.5"/>
  <text x="38" y="200" fill="#0f766e" font-size="12.5" font-weight="700">BO = 1: Vertical (3 x 1)</text>
  <text x="38" y="222" fill="#475569" font-size="11">Type-0 (row offset 0)</text>
  <text x="38" y="242" fill="#475569" font-size="11">Type-1 (row offset 1)</text>
  <text x="38" y="262" fill="#475569" font-size="11">Type-2 (row offset 2)</text>
  <text x="38" y="286" fill="#64748b" font-size="10.5">Utilizes edge pixels across planes</text>

  <!-- Mini vertical blocks graphic -->
  <rect x="202" y="206" width="24" height="72" rx="3" fill="#dbeafe" stroke="#1b365d"/>
  <text x="214" y="246" text-anchor="middle" fill="#1b365d" font-size="10" font-weight="700">T0</text>
  <rect x="236" y="216" width="24" height="72" rx="3" fill="#ccfbf1" stroke="#0f766e"/>
  <text x="248" y="256" text-anchor="middle" fill="#0f766e" font-size="10" font-weight="700">T1</text>
  <rect x="270" y="226" width="24" height="64" rx="3" fill="#fce7f3" stroke="#8c1d40"/>
  <text x="282" y="262" text-anchor="middle" fill="#8c1d40" font-size="10" font-weight="700">T2</text>

  <!-- Arrow to Selection -->
  <line x1="316" y1="172" x2="366" y2="172" stroke="#1b365d" stroke-width="2.5" marker-end="url(#arr-b)"/>

  <!-- Middle: Block Difference & Peak Selection -->
  <rect x="372" y="54" width="252" height="236" rx="10" fill="#ffffff" stroke="#1b365d" stroke-width="1.8"/>
  <rect x="372" y="54" width="252" height="34" rx="10" fill="#1b365d"/>
  <rect x="372" y="76" width="252" height="12" fill="#1b365d"/>
  <text x="498" y="76" text-anchor="middle" fill="#ffffff" font-size="12.5" font-weight="700">Block Difference Histogram</text>

  <text x="498" y="112" text-anchor="middle" fill="#0f172a" font-size="12.5" font-weight="700">Block i = (bi0, bi1, bi2)</text>
  <text x="498" y="132" text-anchor="middle" fill="#334155" font-size="11.5">di0 = |bi0 - bi1|,  di1 = |bi1 - bi2|</text>

  <!-- Mini histogram bars -->
  <line x1="396" y1="214" x2="600" y2="214" stroke="#64748b" stroke-width="1.5"/>
  <rect x="408" y="166" width="18" height="48" fill="#94a3b8"/>
  <rect x="432" y="144" width="18" height="70" fill="#8c1d40"/>
  <rect x="456" y="172" width="18" height="42" fill="#0f766e"/>
  <rect x="480" y="186" width="18" height="28" fill="#0f766e"/>
  <rect x="504" y="198" width="18" height="16" fill="#0f766e"/>
  <rect x="528" y="206" width="18" height="8" fill="#0f766e"/>
  <rect x="556" y="211" width="18" height="3" fill="#cbd5e1"/>
  <text x="441" y="228" text-anchor="middle" fill="#8c1d40" font-size="10.5" font-weight="700">M</text>
  <text x="565" y="228" text-anchor="middle" fill="#475569" font-size="10.5" font-weight="700">m</text>
  <text x="498" y="250" text-anchor="middle" fill="#0f766e" font-size="11" font-weight="700">Pick (BO, BT) maximizing g(M)</text>
  <text x="498" y="268" text-anchor="middle" fill="#64748b" font-size="10.5">Shift (M, m) by +1; embed at M</text>

  <!-- Arrow to Key of Four -->
  <line x1="630" y1="172" x2="674" y2="172" stroke="#1b365d" stroke-width="2.5" marker-end="url(#arr-b)"/>

  <!-- Right: Key of Four (19 bits) -->
  <rect x="680" y="54" width="218" height="236" rx="10" fill="#ffffff" stroke="#8c1d40" stroke-width="1.8"/>
  <rect x="680" y="54" width="218" height="34" rx="10" fill="#8c1d40"/>
  <rect x="680" y="76" width="218" height="12" fill="#8c1d40"/>
  <text x="789" y="76" text-anchor="middle" fill="#ffffff" font-size="12.5" font-weight="700">Key of Four (19 Bits Total)</text>

  <rect x="698" y="102" width="182" height="32" rx="6" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="710" y="122" fill="#1b365d" font-size="12" font-weight="700">BO</text>
  <text x="752" y="122" fill="#334155" font-size="11.5">1 bit (Horiz / Vert)</text>

  <rect x="698" y="142" width="182" height="32" rx="6" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="710" y="162" fill="#1b365d" font-size="12" font-weight="700">BT</text>
  <text x="752" y="162" fill="#334155" font-size="11.5">2 bits (Type 0/1/2)</text>

  <rect x="698" y="182" width="182" height="32" rx="6" fill="#fdf2f5" stroke="#fecdd3"/>
  <text x="710" y="202" fill="#8c1d40" font-size="12" font-weight="700">M</text>
  <text x="752" y="202" fill="#334155" font-size="11.5">8 bits (Peak diff)</text>

  <rect x="698" y="222" width="182" height="32" rx="6" fill="#f0fdfa" stroke="#99f6e4"/>
  <text x="710" y="242" fill="#0f766e" font-size="12" font-weight="700">m</text>
  <text x="752" y="242" fill="#334155" font-size="11.5">8 bits (Zero/min diff)</text>

  <text x="789" y="274" text-anchor="middle" fill="#64748b" font-size="10.5" font-weight="600">Only 3 bits for (BO, BT) -> +100s..1000s bits!</text>
</svg>
