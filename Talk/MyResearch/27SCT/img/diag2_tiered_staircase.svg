<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 355" width="1120" height="355">
  <defs>
    <marker id="arr-up" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#1b365d"/>
    </marker>
  </defs>
  <style>
    text { font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; }
    .lvl { font-size: 17px; font-weight: 800; fill: #ffffff; }
    .tax { font-size: 13px; font-weight: 700; }
    .name { font-size: 13.5px; font-weight: 700; fill: #0f172a; }
    .desc { font-size: 11.5px; fill: #475569; }
  </style>

  <!-- Guardrail Ceiling Line -->
  <rect x="20" y="12" width="1080" height="34" rx="8" fill="#fdf2f5" stroke="#8c1d40" stroke-width="1.8" stroke-dasharray="7,4"/>
  <text x="560" y="34" text-anchor="middle" font-size="14" font-weight="800" fill="#8c1d40">
    EXPLICIT FEEDBACK BOUNDARY (ALL LEVELS): NO DIRECT COMPLETE SUBMITTABLE CODE
  </text>

  <!-- Staircase Steps (L0 to L4) -->
  <!-- L0 -->
  <rect x="25" y="210" width="198" height="104" rx="10" fill="#f0fdfa" stroke="#0f766e" stroke-width="2"/>
  <rect x="25" y="210" width="198" height="34" rx="10" fill="#0f766e"/>
  <rect x="25" y="232" width="198" height="12" fill="#0f766e"/>
  <text x="42" y="233" class="lvl">L0</text>
  <text x="208" y="232" text-anchor="end" class="tax" fill="#ccfbf1">Tax: 0%</text>
  <text x="124" y="264" text-anchor="middle" class="name">No AI Hints</text>
  <text x="124" y="283" text-anchor="middle" class="desc">Autonomous baseline;</text>
  <text x="124" y="299" text-anchor="middle" class="desc">OJ test feedback only</text>

  <!-- L1 -->
  <rect x="243" y="176" width="198" height="138" rx="10" fill="#f8fafc" stroke="#475569" stroke-width="2"/>
  <rect x="243" y="176" width="198" height="34" rx="10" fill="#475569"/>
  <rect x="243" y="198" width="198" height="12" fill="#475569"/>
  <text x="260" y="199" class="lvl">L1</text>
  <text x="426" y="198" text-anchor="end" class="tax" fill="#e2e8f0">Tax: 5%</text>
  <text x="342" y="232" text-anchor="middle" class="name">Runtime Error Hints</text>
  <text x="342" y="254" text-anchor="middle" class="desc">Explains compile &amp;</text>
  <text x="342" y="271" text-anchor="middle" class="desc">runtime error messages</text>
  <text x="342" y="288" text-anchor="middle" class="desc">&amp; possible root causes</text>

  <!-- L2 -->
  <rect x="461" y="142" width="198" height="172" rx="10" fill="#f1f5f9" stroke="#294c7a" stroke-width="2"/>
  <rect x="461" y="142" width="198" height="34" rx="10" fill="#294c7a"/>
  <rect x="461" y="164" width="198" height="12" fill="#294c7a"/>
  <text x="478" y="165" class="lvl">L2</text>
  <text x="644" y="164" text-anchor="end" class="tax" fill="#dbeafe">Tax: 10%</text>
  <text x="560" y="202" text-anchor="middle" class="name">Logic Error Hints</text>
  <text x="560" y="226" text-anchor="middle" class="desc">Directional debugging</text>
  <text x="560" y="244" text-anchor="middle" class="desc">hints for WA / PA</text>
  <text x="560" y="262" text-anchor="middle" class="desc">based on code &amp;</text>
  <text x="560" y="280" text-anchor="middle" class="desc">test coverage</text>

  <!-- L3 -->
  <rect x="679" y="106" width="198" height="208" rx="10" fill="#eff6ff" stroke="#1b365d" stroke-width="2"/>
  <rect x="679" y="106" width="198" height="34" rx="10" fill="#1b365d"/>
  <rect x="679" y="128" width="198" height="12" fill="#1b365d"/>
  <text x="696" y="129" class="lvl">L3</text>
  <text x="862" y="128" text-anchor="end" class="tax" fill="#bfdbfe">Tax: 15%</text>
  <text x="778" y="168" text-anchor="middle" class="name">AI Tutor Q&amp;A</text>
  <text x="778" y="194" text-anchor="middle" class="desc">Multi-turn chat</text>
  <text x="778" y="213" text-anchor="middle" class="desc">for problem clarity,</text>
  <text x="778" y="232" text-anchor="middle" class="desc">conceptual Q&amp;A &amp;</text>
  <text x="778" y="251" text-anchor="middle" class="desc">strategic guidance</text>

  <!-- L4 -->
  <rect x="897" y="68" width="198" height="246" rx="10" fill="#fdf2f5" stroke="#8c1d40" stroke-width="2.2"/>
  <rect x="897" y="68" width="198" height="34" rx="10" fill="#8c1d40"/>
  <rect x="897" y="90" width="198" height="12" fill="#8c1d40"/>
  <text x="914" y="91" class="lvl">L4</text>
  <text x="1080" y="90" text-anchor="end" class="tax" fill="#fecdd3">Tax: 20%</text>
  <text x="996" y="134" text-anchor="middle" class="name">Full AI Assistance</text>
  <text x="996" y="162" text-anchor="middle" class="desc">High-intensity support:</text>
  <text x="996" y="182" text-anchor="middle" class="desc">• Process decomposition</text>
  <text x="996" y="202" text-anchor="middle" class="desc">• Strategy comparison</text>
  <text x="996" y="222" text-anchor="middle" class="desc">• Pseudocode structure</text>
  <text x="996" y="264" text-anchor="middle" font-size="11.5" font-weight="700" fill="#8c1d40">Highest Compensatory</text>
  <text x="996" y="280" text-anchor="middle" font-size="11.5" font-weight="700" fill="#8c1d40">Scaffolding</text>

  <!-- Bottom Progression Axis -->
  <line x1="40" y1="336" x2="1075" y2="336" stroke="#1b365d" stroke-width="2.5" marker-end="url(#arr-up)"/>
  <text x="560" y="330" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1b365d">
    Progressive Escalation: Higher Guidance Depth &amp; Higher Assessment Cost (AI Tax = Highest Level Reached)
  </text>
</svg>
