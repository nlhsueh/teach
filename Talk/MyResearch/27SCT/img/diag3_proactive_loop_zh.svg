<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 330" width="1120" height="330">
  <defs>
    <marker id="arr-n" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#1b365d"/>
    </marker>
    <marker id="arr-t" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0f766e"/>
    </marker>
    <marker id="arr-a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#8c1d40"/>
    </marker>
  </defs>
  <style>
    text { font-family: 'Noto Sans TC', 'PingFang TC', -apple-system, sans-serif; }
    .phase { font-size: 13px; font-weight: 800; }
    .box-t { font-size: 14px; font-weight: 700; fill: #0f172a; }
    .box-s { font-size: 11.8px; fill: #475569; }
    .lbl { font-size: 11.5px; font-weight: 700; }
  </style>

  <rect x="12" y="10" width="600" height="310" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="32" y="34" class="phase" fill="#1b365d">階段一 · 解題過程中（主動式學習調節）</text>

  <rect x="634" y="10" width="474" height="310" rx="12" fill="#f0fdfa" stroke="#99d6cd" stroke-width="1.5"/>
  <text x="654" y="34" class="phase" fill="#0f766e">階段二 · 通過測資後（超越單題答對）</text>

  <rect x="34" y="76" width="166" height="84" rx="10" fill="#ffffff" stroke="#1b365d" stroke-width="2"/>
  <text x="117" y="106" text-anchor="middle" class="box-t">撰寫程式與 OJ 測資</text>
  <text x="117" y="126" text-anchor="middle" class="box-s">預設從 L0 開始</text>
  <text x="117" y="144" text-anchor="middle" class="box-s">提交測試與除錯</text>

  <rect x="242" y="76" width="174" height="84" rx="10" fill="#ffffff" stroke="#8c1d40" stroke-width="2"/>
  <text x="329" y="104" text-anchor="middle" class="box-t" fill="#8c1d40">停滯狀態偵測</text>
  <text x="329" y="124" text-anchor="middle" class="box-s">重複錯誤、連續失敗</text>
  <text x="329" y="142" text-anchor="middle" class="box-s">與停滯時間累積</text>

  <rect x="454" y="76" width="142" height="84" rx="10" fill="#8c1d40"/>
  <text x="525" y="106" text-anchor="middle" font-size="13.5" font-weight="700" fill="#ffffff">主動式提示</text>
  <text x="525" y="126" text-anchor="middle" font-size="11.5" fill="#fecdd3">僅提醒可用輔助</text>
  <text x="525" y="144" text-anchor="middle" font-size="11.5" fill="#ffffff">（絕不自動給答案）</text>

  <rect x="190" y="214" width="276" height="78" rx="10" fill="#1b365d"/>
  <text x="328" y="244" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">保留學習者自主決策權</text>
  <text x="328" y="266" text-anchor="middle" font-size="12" fill="#cbd5e1">繼續自主除錯 或 自行選擇 L1–L4</text>

  <line x1="200" y1="118" x2="238" y2="118" stroke="#1b365d" stroke-width="2.2" marker-end="url(#arr-n)"/>
  <line x1="416" y1="118" x2="450" y2="118" stroke="#8c1d40" stroke-width="2.2" marker-end="url(#arr-a)"/>
  <path d="M 525 160 L 525 253 L 470 253" fill="none" stroke="#8c1d40" stroke-width="2.2" marker-end="url(#arr-a)"/>
  <path d="M 190 253 L 117 253 L 117 164" fill="none" stroke="#1b365d" stroke-width="2.2" marker-end="url(#arr-n)"/>
  <text x="154" y="244" text-anchor="middle" class="lbl" fill="#1b365d">持續修正</text>

  <rect x="656" y="84" width="124" height="68" rx="34" fill="#0f766e"/>
  <text x="718" y="114" text-anchor="middle" font-size="15" font-weight="800" fill="#ffffff">達成 AC</text>
  <text x="718" y="134" text-anchor="middle" font-size="11.5" fill="#ccfbf1">測資全數通過</text>

  <path d="M 117 76 L 117 56 L 718 56 L 718 80" fill="none" stroke="#0f766e" stroke-width="2.4" marker-end="url(#arr-t)"/>
  <rect x="330" y="44" width="176" height="22" rx="11" fill="#ffffff" stroke="#0f766e" stroke-width="1.4"/>
  <text x="418" y="59" text-anchor="middle" class="lbl" fill="#0f766e">成功通過評測（AC）</text>

  <rect x="822" y="68" width="264" height="94" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/>
  <text x="954" y="96" text-anchor="middle" class="box-t" fill="#0f766e">1. 概念檢核（Concept Checks）</text>
  <text x="954" y="118" text-anchor="middle" class="box-s">依據題目核心與弱點概念出題</text>
  <text x="954" y="136" text-anchor="middle" class="box-s">確認是否真正理解，</text>
  <text x="954" y="153" text-anchor="middle" class="box-s">及早揭露潛在迷思概念</text>

  <rect x="822" y="192" width="264" height="100" rx="10" fill="#ffffff" stroke="#1b365d" stroke-width="2"/>
  <text x="954" y="220" text-anchor="middle" class="box-t" fill="#1b365d">2. 反思導向回饋（Reflection）</text>
  <text x="954" y="242" text-anchor="middle" class="box-s">結合答題歷程與錯誤紀錄，</text>
  <text x="954" y="260" text-anchor="middle" class="box-s">引導學生回顧解題策略選擇，</text>
  <text x="954" y="278" text-anchor="middle" class="box-s">促進穩定概念建構與知識遷移</text>

  <line x1="780" y1="118" x2="818" y2="118" stroke="#0f766e" stroke-width="2.2" marker-end="url(#arr-t)"/>
  <path d="M 718 152 L 718 242 L 818 242" fill="none" stroke="#1b365d" stroke-width="2.2" marker-end="url(#arr-n)"/>
</svg>
