<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 250" width="1120" height="250">
  <defs>
    <marker id="arr-t2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0f766e"/>
    </marker>
    <marker id="arr-n2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#1b365d"/>
    </marker>
    <marker id="arr-a2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#8c1d40"/>
    </marker>
  </defs>
  <style>
    text { font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; }
    .ctitle { font-size: 14px; font-weight: 800; }
    .csub { font-size: 11.5px; fill: #475569; font-weight: 600; }
    .nd { font-size: 12px; font-weight: 800; fill: #ffffff; }
    .nd-off { font-size: 12px; font-weight: 700; fill: #94a3b8; }
    .res { font-size: 13px; font-weight: 800; }
  </style>

  <!-- Card 1: Gradual -->
  <rect x="10" y="10" width="352" height="230" rx="10" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.8"/>
  <text x="186" y="36" text-anchor="middle" class="ctitle" fill="#0f766e">Path A: Gradual Escalation</text>
  <text x="186" y="55" text-anchor="middle" class="csub">Dense path · Sequential help-seeking</text>

  <circle cx="56" cy="116" r="20" fill="#0f766e"/><text x="56" y="121" text-anchor="middle" class="nd">L1</text>
  <circle cx="142" cy="116" r="20" fill="#0f766e"/><text x="142" y="121" text-anchor="middle" class="nd">L2</text>
  <circle cx="228" cy="116" r="20" fill="#0f766e"/><text x="228" y="121" text-anchor="middle" class="nd">L3</text>
  <circle cx="314" cy="116" r="20" fill="#0f766e"/><text x="314" y="121" text-anchor="middle" class="nd">L4</text>

  <line x1="76" y1="116" x2="119" y2="116" stroke="#0f766e" stroke-width="2.5" marker-end="url(#arr-t2)"/>
  <line x1="162" y1="116" x2="205" y2="116" stroke="#0f766e" stroke-width="2.5" marker-end="url(#arr-t2)"/>
  <line x1="248" y1="116" x2="291" y2="116" stroke="#0f766e" stroke-width="2.5" marker-end="url(#arr-t2)"/>

  <rect x="36" y="162" width="300" height="58" rx="8" fill="#ffffff" stroke="#99d6cd"/>
  <text x="186" y="185" text-anchor="middle" font-size="12.5" font-weight="600" fill="#334155">s = 1,  f = 4,  m = 4 (0 levels skipped)</text>
  <text x="186" y="207" text-anchor="middle" class="res" fill="#0f766e">EPC = 0.25  ➔  LADI = 8.50</text>

  <!-- Card 2: Skip-Step -->
  <rect x="384" y="10" width="352" height="230" rx="10" fill="#f8fafc" stroke="#1b365d" stroke-width="1.8"/>
  <text x="560" y="36" text-anchor="middle" class="ctitle" fill="#1b365d">Path B: Skip-Step Leap</text>
  <text x="560" y="55" text-anchor="middle" class="csub">Sparse path · Skips intermediate tiers</text>

  <circle cx="430" cy="116" r="20" fill="#1b365d"/><text x="430" y="121" text-anchor="middle" class="nd">L1</text>
  <circle cx="516" cy="116" r="20" fill="#e2e8f0" stroke="#94a3b8" stroke-dasharray="3,2"/><text x="516" y="121" text-anchor="middle" class="nd-off">L2</text>
  <circle cx="602" cy="116" r="20" fill="#e2e8f0" stroke="#94a3b8" stroke-dasharray="3,2"/><text x="602" y="121" text-anchor="middle" class="nd-off">L3</text>
  <circle cx="688" cy="116" r="20" fill="#1b365d"/><text x="688" y="121" text-anchor="middle" class="nd">L4</text>

  <path d="M 442 98 C 495 54, 623 54, 676 96" fill="none" stroke="#1b365d" stroke-width="2.5" marker-end="url(#arr-n2)"/>

  <rect x="410" y="162" width="300" height="58" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="560" y="185" text-anchor="middle" font-size="12.5" font-weight="600" fill="#334155">s = 1,  f = 4,  m = 2 (2 levels skipped)</text>
  <text x="560" y="207" text-anchor="middle" class="res" fill="#1b365d">EPC = 0.40  ➔  LADI = 8.80</text>

  <!-- Card 3: Immediate L4 -->
  <rect x="758" y="10" width="352" height="230" rx="10" fill="#fdf2f5" stroke="#8c1d40" stroke-width="1.8"/>
  <text x="934" y="36" text-anchor="middle" class="ctitle" fill="#8c1d40">Path C: Immediate High Reliance</text>
  <text x="934" y="55" text-anchor="middle" class="csub">High starting level · Direct L4 activation</text>

  <circle cx="804" cy="116" r="20" fill="#f1f5f9" stroke="#cbd5e1" stroke-dasharray="3,2"/><text x="804" y="121" text-anchor="middle" class="nd-off">L1</text>
  <circle cx="890" cy="116" r="20" fill="#f1f5f9" stroke="#cbd5e1" stroke-dasharray="3,2"/><text x="890" y="121" text-anchor="middle" class="nd-off">L2</text>
  <circle cx="976" cy="116" r="20" fill="#f1f5f9" stroke="#cbd5e1" stroke-dasharray="3,2"/><text x="976" y="121" text-anchor="middle" class="nd-off">L3</text>
  <circle cx="1062" cy="116" r="22" fill="#8c1d40"/><text x="1062" y="121" text-anchor="middle" class="nd">L4</text>

  <path d="M 1062 66 L 1062 91" fill="none" stroke="#8c1d40" stroke-width="2.5" marker-end="url(#arr-a2)"/>
  <text x="1018" y="82" text-anchor="end" font-size="11.5" font-weight="700" fill="#8c1d40">Starts directly at L4</text>

  <rect x="784" y="162" width="300" height="58" rx="8" fill="#ffffff" stroke="#e2a8b8"/>
  <text x="934" y="185" text-anchor="middle" font-size="12.5" font-weight="600" fill="#334155">s = 4,  f = 4,  m = 1 (Initial leap)</text>
  <text x="934" y="207" text-anchor="middle" class="res" fill="#8c1d40">EPC = 1.00  ➔  LADI = 10.00</text>
</svg>
