<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 350" width="1120" height="350">
  <defs>
    <marker id="arr-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#64748b"/>
    </marker>
    <marker id="arr-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#8c1d40"/>
    </marker>
    <marker id="arr-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0f766e"/>
    </marker>
    <marker id="arr-navy" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#1b365d"/>
    </marker>
  </defs>

  <style>
    text { font-family: 'Noto Sans TC', 'PingFang TC', -apple-system, sans-serif; }
    .panel-title { font-size: 16px; font-weight: 800; }
    .node-title { font-size: 14.5px; font-weight: 700; fill: #0f172a; }
    .node-sub { font-size: 12px; font-weight: 500; fill: #475569; }
    .badge-txt { font-size: 12.5px; font-weight: 700; fill: #ffffff; }
    .score-txt { font-size: 15px; font-weight: 800; }
  </style>

  <!-- LEFT PANEL -->
  <rect x="10" y="10" width="530" height="330" rx="12" fill="#fdf2f5" stroke="#e2a8b8" stroke-width="1.5"/>
  <rect x="10" y="10" width="530" height="40" rx="12" fill="#8c1d40"/>
  <rect x="10" y="38" width="530" height="12" fill="#8c1d40"/>
  <text x="275" y="36" text-anchor="middle" class="panel-title" fill="#ffffff">未控管開放 AI ＋ 傳統線上評測（OJ）</text>

  <rect x="30" y="76" width="155" height="68" rx="8" fill="#ffffff" stroke="#0f766e" stroke-width="2"/>
  <text x="107" y="104" text-anchor="middle" class="node-title">學生 A</text>
  <text x="107" y="124" text-anchor="middle" class="node-sub">獨立解題完成</text>

  <rect x="30" y="196" width="155" height="68" rx="8" fill="#ffffff" stroke="#8c1d40" stroke-width="2"/>
  <text x="107" y="224" text-anchor="middle" class="node-title">學生 B</text>
  <text x="107" y="244" text-anchor="middle" class="node-sub">高度依賴 AI 協助</text>

  <rect x="235" y="124" width="120" height="92" rx="10" fill="#334155"/>
  <text x="295" y="158" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">線上評測系統</text>
  <text x="295" y="179" text-anchor="middle" font-size="12" fill="#cbd5e1">僅看測資結果</text>
  <text x="295" y="198" text-anchor="middle" font-size="11" fill="#94a3b8">（無 AI 使用紀錄）</text>

  <path d="M 185 110 C 210 110, 210 155, 232 155" fill="none" stroke="#64748b" stroke-width="2.2" marker-end="url(#arr-gray)"/>
  <path d="M 185 230 C 210 230, 210 185, 232 185" fill="none" stroke="#64748b" stroke-width="2.2" marker-end="url(#arr-gray)"/>

  <line x1="355" y1="170" x2="395" y2="170" stroke="#8c1d40" stroke-width="2.5" marker-end="url(#arr-red)"/>
  <rect x="400" y="114" width="122" height="112" rx="10" fill="#ffffff" stroke="#8c1d40" stroke-width="2.2" stroke-dasharray="5,3"/>
  <text x="461" y="144" text-anchor="middle" class="score-txt" fill="#8c1d40">同為 100 分</text>
  <text x="461" y="166" text-anchor="middle" font-size="13" font-weight="700" fill="#8c1d40">(AC / AC)</text>
  <text x="461" y="191" text-anchor="middle" font-size="11.5" font-weight="600" fill="#64748b">分數高度集中</text>
  <text x="461" y="210" text-anchor="middle" font-size="11.5" font-weight="700" fill="#8c1d40">評量鑑別度低</text>

  <text x="275" y="316" text-anchor="middle" font-size="13.5" font-weight="700" fill="#8c1d40">相同分數掩蓋了真實能力與 AI 依賴差異</text>

  <circle cx="560" cy="175" r="19" fill="#1b365d"/>
  <text x="560" y="180" text-anchor="middle" font-size="13" font-weight="800" fill="#ffffff">VS</text>

  <!-- RIGHT PANEL -->
  <rect x="580" y="10" width="530" height="330" rx="12" fill="#f0fdfa" stroke="#99d6cd" stroke-width="1.5"/>
  <rect x="580" y="10" width="530" height="40" rx="12" fill="#1b365d"/>
  <rect x="580" y="38" width="530" height="12" fill="#1b365d"/>
  <text x="845" y="36" text-anchor="middle" class="panel-title" fill="#ffffff">Smart Coding Tutor（SCT）分層 AI 輔助機制</text>

  <rect x="600" y="76" width="145" height="68" rx="8" fill="#ffffff" stroke="#0f766e" stroke-width="2"/>
  <text x="672" y="104" text-anchor="middle" class="node-title">學生 A</text>
  <text x="672" y="124" text-anchor="middle" class="node-sub">自主解題（L0）</text>

  <rect x="600" y="196" width="145" height="68" rx="8" fill="#ffffff" stroke="#8c1d40" stroke-width="2"/>
  <text x="672" y="224" text-anchor="middle" class="node-title">學生 B</text>
  <text x="672" y="244" text-anchor="middle" class="node-sub">高強度引導（L4）</text>

  <rect x="785" y="76" width="130" height="68" rx="8" fill="#0f766e"/>
  <text x="850" y="103" text-anchor="middle" class="badge-txt">L0 · 稅率 0%</text>
  <text x="850" y="123" text-anchor="middle" font-size="11.5" fill="#ccfbf1">LADI = 0.00</text>

  <rect x="785" y="196" width="130" height="68" rx="8" fill="#1b365d"/>
  <text x="850" y="223" text-anchor="middle" class="badge-txt">L4 · 稅率 20%</text>
  <text x="850" y="243" text-anchor="middle" font-size="11.5" fill="#cbd5e1">LADI = 8.5–10.0</text>

  <line x1="745" y1="110" x2="781" y2="110" stroke="#0f766e" stroke-width="2.2" marker-end="url(#arr-teal)"/>
  <line x1="745" y1="230" x2="781" y2="230" stroke="#1b365d" stroke-width="2.2" marker-end="url(#arr-navy)"/>

  <line x1="915" y1="110" x2="951" y2="110" stroke="#0f766e" stroke-width="2.2" marker-end="url(#arr-teal)"/>
  <rect x="956" y="76" width="136" height="68" rx="8" fill="#ffffff" stroke="#0f766e" stroke-width="2.2"/>
  <text x="1024" y="104" text-anchor="middle" class="score-txt" fill="#0f766e">調整後：100</text>
  <text x="1024" y="125" text-anchor="middle" font-size="11.5" font-weight="600" fill="#0f766e">獨立精熟表現</text>

  <line x1="915" y1="230" x2="951" y2="230" stroke="#1b365d" stroke-width="2.2" marker-end="url(#arr-navy)"/>
  <rect x="956" y="196" width="136" height="68" rx="8" fill="#ffffff" stroke="#1b365d" stroke-width="2.2"/>
  <text x="1024" y="224" text-anchor="middle" class="score-txt" fill="#1b365d">調整後：80</text>
  <text x="1024" y="245" text-anchor="middle" font-size="11.5" font-weight="600" fill="#475569">AI 輔助下通過</text>

  <text x="845" y="316" text-anchor="middle" font-size="13.5" font-weight="700" fill="#0f766e">可控、可紀錄且具可解釋性的評量機制</text>
</svg>
