<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 185" width="1120" height="185">
  <style>
    text { font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; }
    .band-lbl { font-size: 12.5px; font-weight: 800; fill: #ffffff; }
    .tick { font-size: 12px; font-weight: 700; fill: #334155; }
    .pin { font-size: 11.5px; font-weight: 700; }
  </style>

  <!-- Scale bands: x from 60 to 1060 (width = 1000, so 100px per 1.0 LADI unit) -->
  <!-- Band [0,2) -->
  <rect x="60" y="74" width="200" height="36" rx="4" fill="#0f766e"/>
  <text x="160" y="97" text-anchor="middle" class="band-lbl">Autonomous / Low [0, 2)</text>

  <!-- Band [2,4) -->
  <rect x="262" y="74" width="198" height="36" rx="4" fill="#64748b"/>
  <text x="361" y="97" text-anchor="middle" class="band-lbl">L1 Anchor [2, 4)</text>

  <!-- Band [4,6) -->
  <rect x="462" y="74" width="198" height="36" rx="4" fill="#3b5b8a"/>
  <text x="561" y="97" text-anchor="middle" class="band-lbl">L2 Anchor [4, 6)</text>

  <!-- Band [6,8) -->
  <rect x="662" y="74" width="198" height="36" rx="4" fill="#1b365d"/>
  <text x="761" y="97" text-anchor="middle" class="band-lbl">L3 Anchor [6, 8)</text>

  <!-- Band [8,10] -->
  <rect x="862" y="74" width="198" height="36" rx="4" fill="#8c1d40"/>
  <text x="961" y="97" text-anchor="middle" class="band-lbl">L4 Anchor [8, 10]</text>

  <!-- Ticks -->
  <text x="60" y="130" text-anchor="middle" class="tick">0</text>
  <text x="260" y="130" text-anchor="middle" class="tick">2</text>
  <text x="460" y="130" text-anchor="middle" class="tick">4</text>
  <text x="660" y="130" text-anchor="middle" class="tick">6</text>
  <text x="860" y="130" text-anchor="middle" class="tick">8</text>
  <text x="1060" y="130" text-anchor="middle" class="tick">10</text>

  <!-- Plotted Trajectory Pins -->
  <!-- 0.00 -->
  <circle cx="60" cy="74" r="6" fill="#ffffff" stroke="#0f766e" stroke-width="3"/>
  <line x1="60" y1="68" x2="60" y2="38" stroke="#0f766e" stroke-width="2"/>
  <rect x="14" y="12" width="128" height="26" rx="6" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.5"/>
  <text x="78" y="29" text-anchor="middle" class="pin" fill="#0f766e">L0 only: 0.00</text>

  <!-- 8.50 -->
  <circle cx="910" cy="74" r="6" fill="#ffffff" stroke="#0f766e" stroke-width="3"/>
  <line x1="910" y1="68" x2="845" y2="38" stroke="#0f766e" stroke-width="1.8"/>
  <rect x="742" y="12" width="152" height="26" rx="6" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.5"/>
  <text x="818" y="29" text-anchor="middle" class="pin" fill="#0f766e">Gradual L1→L4: 8.50</text>

  <!-- 8.80 -->
  <circle cx="940" cy="110" r="6" fill="#ffffff" stroke="#1b365d" stroke-width="3"/>
  <line x1="940" y1="116" x2="890" y2="148" stroke="#1b365d" stroke-width="1.8"/>
  <rect x="772" y="148" width="166" height="26" rx="6" fill="#f1f5f9" stroke="#1b365d" stroke-width="1.5"/>
  <text x="855" y="165" text-anchor="middle" class="pin" fill="#1b365d">Skip L1→L4: 8.80</text>

  <!-- 10.00 -->
  <circle cx="1060" cy="74" r="6" fill="#ffffff" stroke="#8c1d40" stroke-width="3"/>
  <line x1="1060" y1="68" x2="1032" y2="38" stroke="#8c1d40" stroke-width="1.8"/>
  <rect x="920" y="12" width="184" height="26" rx="6" fill="#fdf2f5" stroke="#8c1d40" stroke-width="1.5"/>
  <text x="1012" y="29" text-anchor="middle" class="pin" fill="#8c1d40">Immediate L4: 10.00</text>

  <!-- Bottom Caption -->
  <text x="380" y="166" text-anchor="middle" font-size="12" font-weight="600" fill="#64748b">
    Primary Anchor = 2f (determines the 2-point tier band) · Fine-Grained Shift = +2 EPC (within-band escalation)
  </text>
</svg>
