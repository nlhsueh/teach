<h2 id="opening-hook-what-if-using-ai-came-with-an-ai-tax">Opening Hook: What If Using AI Came With an &quot;AI Tax&quot;?</h2>
<div class="fig-box" style="padding: 6px; margin-bottom: 10px; background: #fbf9f2;">
<img src="./img/ai_tax_hook.jpg" alt="Humorous illustration of AI Tax in a programming exam" style="max-height: 415px; border-radius: 6px;" />
</div>
<div class="callout" style="margin-top: 6px; padding: 9px 16px;">
<strong>The Big Idea:</strong> Don't close the highway — <strong>put a tollbooth on the AI Express Lane!</strong> Students can still request tiered AI guidance when stuck, while an explicit <strong>AI Tax (0%–20%)</strong> keeps scores fair, transparent, and interpretable.
</div>
<footer>Nien-Lin Hsueh &amp; Ying-Chang Lu · Feng Chia University · Smart Coding Tutor (SCT)</footer>

<h2 id="11-motivation-the-assessment-dilemma-in-ai-assisted-learning">1.1 Motivation: The Assessment Dilemma in AI-Assisted Learning</h2>
<div class="fig-box" style="padding: 10px 12px; margin-bottom: 10px;">
<img src="./img/diag1_assessment_dilemma.svg" alt="Conceptual contrast: Open AI vs. Tiered AI Assessment" style="max-height: 365px;" />
</div>
<div class="callout">
<strong>Core Design Philosophy:</strong> The goal is <strong>not to prohibit AI</strong>, but to transform AI assistance into a <strong>controllable, tiered, and recordable</strong> instructional intervention that preserves assessment interpretability.
</div>

<h2 id="12-research-objectives--four-research-questions">1.2 Research Objectives &amp; Four Research Questions</h2>
<p>To evaluate whether <strong>Smart Coding Tutor (SCT)</strong> balances scaffolding with assessment integrity, we investigate <strong>four core questions</strong> <em>(revealed step-by-step)</em>:</p>
<div class="rq-stage">
<ul>
<li data-marpit-fragment="1">
<div class="rq-card teal"><img src="./img/rq1_icon.svg" alt="RQ1 Unmask Mastery" /><div><div class="rq-hook"><span class="rq-tag" style="background:#0f766e;">RQ1</span> Can we unmask true mastery?</div><div class="rq-q">Can a tiered AI assistance mechanism improve the <strong>discriminative power</strong> of programming task assessment?</div></div></div>
</li>
<li data-marpit-fragment="2">
<div class="rq-card"><img src="./img/rq2_icon.svg" alt="RQ2 Tiered Boost" /><div><div class="rq-hook"><span class="rq-tag" style="background:#1b365d;">RQ2</span> Do higher tiers rescue stuck learners?</div><div class="rq-q">What are the <strong>support effects</strong> of different AI assistance levels (L<sub>0</sub>–L<sub>4</sub>) during the problem-solving process?</div></div></div>
</li>
<li data-marpit-fragment="3">
<div class="rq-card accent"><img src="./img/rq3_icon.svg" alt="RQ3 AI Tax Strategy" /><div><div class="rq-hook"><span class="rq-tag">RQ3</span> How do students budget their "AI Tax"?</div><div class="rq-q">What <strong>AI usage strategies and behavioral patterns</strong> emerge when support carries an explicit assessment cost?</div></div></div>
</li>
<li data-marpit-fragment="4">
<div class="rq-card"><img src="./img/rq4_icon.svg" alt="RQ4 LADI vs Mastery" /><div><div class="rq-hook"><span class="rq-tag" style="background:#1b365d;">RQ4</span> Does mastery reduce AI dependency?</div><div class="rq-q">What is the relationship between students' <strong>AI dependency (LADI)</strong> and their conceptual learning outcomes?</div></div></div>
</li>
</ul>
</div>
<footer>Nien-Lin Hsueh &amp; Ying-Chang Lu · Feng Chia University · Smart Coding Tutor (SCT)</footer>
</section>

<h2 id="31-five-level-tiered-ai-tutor--ai-tax-rate">3.1 Five-Level Tiered AI Tutor &amp; AI Tax Rate</h2>
<p>Each problem begins at <strong>L<sub>0</sub></strong>. Students choose when to escalate, while explicit feedback boundaries prevent direct submittable code generation.</p>
<div class="fig-box" style="padding: 10px 12px; margin: 6px 0 8px 0;">
<img src="./img/diag2_tiered_staircase.svg" alt="Five-Level Tiered AI Tutor Staircase and AI Tax Rate" style="max-height: 350px;" />
</div>
<div class="callout">
<strong>AI Tax Rate Rule:</strong> Calculated by the <strong>highest assistance level reached</strong> per problem (rather than call frequency), capturing the maximum external support mobilized and translating it into an observable assessment cost.
</div>
<footer>Nien-Lin Hsueh &amp; Ying-Chang Lu · Feng Chia University · Smart Coding Tutor (SCT)</footer>

<h2 id="32-proactive-learning-support--post-completion-consolidation">3.2 Proactive Learning Support &amp; Post-Completion Consolidation</h2>
<p>Inspired by Yan et al.'s <strong>Proactive Assistant</strong> role [12], SCT couples <strong>stagnation-triggered reminders</strong> during problem solving with <strong>post-AC conceptual consolidation</strong>.</p>
<div class="fig-box" style="padding: 10px 12px; margin: 8px 0 10px 0;">
<img src="./img/diag3_proactive_loop.svg" alt="Proactive Learning Support and Post-Completion Consolidation Loop" style="max-height: 335px;" />
</div>
<div class="callout">
<strong>Key Pedagogical Principle:</strong> Proactive prompts preserve <strong>learner agency</strong> (never auto-solving), while post-completion checks shift learning from <em>passing test cases</em> toward <strong>durable conceptual mastery</strong>.
</div>

oding Tutor (SCT);--theme:gaia;" data-marpit-pagination-total="21" data-size="16:9">

<h2 id="33-quantifying-escalation-escalation-profile-coefficient-epc">3.3 Quantifying Escalation: Escalation Profile Coefficient (EPC)</h2>
<p>Observing only the <em>final level</em> cannot distinguish <strong>gradual help-seeking</strong> from <strong>abrupt high-level reliance</strong> (<code>s</code>: start level, <code>f</code>: final level, <code>m</code>: effective levels experienced, <code>λ = 0.3</code>).</p>
<div class="formula-box" style="padding: 10px 18px; margin: 6px 0 10px 0; font-size: 1.15em;">
<i>EPC</i> &nbsp;=&nbsp;
<span class="frac"><span class="frac-num"><i>s</i></span><span class="frac-den">4</span></span>
&nbsp;+&nbsp; <i>λ</i> &nbsp;( 1 −
<span class="frac"><span class="frac-num"><i>m</i></span><span class="frac-den"><i>f</i> − <i>s</i> + 1</span></span>
)
</div>
<div class="fig-box" style="padding: 8px 10px;">
<img src="./img/diag4_escalation_paths.svg" alt="Three Escalation Paths Ending at L4" style="max-height: 255px;" />
</div>
<div class="callout" style="margin-top: 8px; padding: 8px 14px;">
<strong>Two Behavioral Signals:</strong> <code>s / 4</code> captures <strong>initial dependency</strong>; <code>1 − m / (f − s + 1)</code> measures <strong>escalation sparsity</strong> (skipping intermediate tiers increases the dependency leap).
</div>
<footer>Nien-Lin Hsueh &amp; Ying-Chang Lu · Feng Chia University · Smart Coding Tutor (SCT)</footer>
</section>

<h2 id="34-level-anchored-dependency-index-ladi">3.4 Level-Anchored Dependency Index (LADI)</h2>
<p>LADI maps multi-level AI usage onto a continuous <strong><code>[0, 10]</code></strong> scale, using final intensity <code>2f</code> as the primary band anchor and <code>+2 EPC</code> to capture within-band escalation behavior.</p>
<div class="formula-box" style="padding: 10px 18px; margin: 6px 0 10px 0; font-size: 1.12em;">
<div class="piecewise">
<span><i>LADI</i> &nbsp;=</span>
<span class="brace">{</span>
<div class="cases">
<span>0, &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp; <i>f</i> = 0</span>
<span>2<i>f</i> + 2<i>EPC</i>, &nbsp;&nbsp;&nbsp;&nbsp;&nbsp; <i>f</i> ∈ {1, 2, 3, 4}</span>
</div>
</div>
</div>
<div class="fig-box" style="padding: 8px 10px; margin-bottom: 10px;">
<img src="./img/diag5_ladi_scale.svg" alt="Continuous LADI [0, 10] Scale and Band Anchors" style="max-height: 190px;" />
</div>
<div class="callout" style="margin-top: 6px; padding: 8px 14px;">
<strong>Analytical Advantage:</strong> Two students both reaching <strong>L<sub>4</sub></strong> are cleanly separated by process trajectory (<code>8.50</code> gradual vs. <code>8.80</code> skip-step vs. <code>10.00</code> immediate), with <code>λ</code> tunable across course contexts.
</div>
<footer>Nien-Lin Hsueh &amp; Ying-Chang Lu · Feng Chia University · Smart Coding Tutor (SCT)</footer>
</section>

<h2 id="53-rq2-hierarchical-support-effects-across-ai-levels">5.3 RQ2: Hierarchical Support Effects Across AI Levels</h2>
<p>Completion ratio = percentage of records accessing a level that reached <code>AC</code> <strong>at that exact level</strong> without further upgrading.</p>

<div class="bar-row">

</div>

</div>

</div>
<div class="bar-row">

<div class="bar-track"><div class="bar-fill accent" style="width: 80.41%;"></div></div>

<strong>Finding (RQ2):</strong> 32.39% of valid records stayed at <strong>L<sub>0</sub></strong> (autonomous baseline, 81.55% <code>AC</code>). Among AI-assisted records, completion ratios rose monotonically from <strong>21.05% (L<sub>1</sub>) to 80.41% (L<sub>4</sub>)</strong>, confirming distinct hierarchical and compensatory support effects.
</div>

<h2 id="54-rq3-usage-strategies--four-quadrant-analysis">5.4 RQ3: Usage Strategies &amp; Four-Quadrant Analysis</h2>
<div class="split55">
<div class="left">
<div class="fig-box">
<img src="./img/fig3_ai_tax_quadrant.png" alt="Fig. 3: Relationship between AI tax rate and learning outcomes" style="max-height: 430px;" />
<div class="fig-cap">Fig. 3: Four-quadrant analysis (medians: Tax = 0.125, Score = 80)</div>
</div>
</div>
<div class="right small-text">
<h3 id="%F0%9F%8E%AF-differentiated-trade-off-patterns"><img class="emoji" draggable="false" alt="🎯" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f3af.svg" data-marp-twemoji=""/> Differentiated Trade-Off Patterns</h3>
<ul>
<li>Average AI level negatively correlates with conceptual understanding (<strong><code>r = −0.368</code></strong>) ➔ usage reflects learning needs, not random clicks.</li>
<li><strong>AI-Boosted High Performers (30.36%)</strong>: High tax, high output — leverage deep AI guidance effectively.</li>
<li><strong>High-Efficiency Users (25.00%)</strong>: Low tax, high output — strong independent mastery.</li>
<li><strong>Low Investment, Low Return (25.89%)</strong>: Low tax, low output — under-utilization or delayed escalation.</li>
<li><strong>AI Tax-Burdened Users (18.75%)</strong>: High tax, low output — struggle to translate AI hints into working code.</li>
</ul>
</div>

<h2 id="56-rq4-ladi-vs-conceptual-understanding-performance">5.6 RQ4: LADI vs. Conceptual Understanding Performance</h2>

<div class="left">
<div class="fig-box">

</ul>
</li>

<li>2nd-year: <code>r = −0.350</code> | 1st-year: <code>r = +0.150</code></li>

<h2 id="57-discussion--pedagogical-implications">5.7 Discussion &amp; Pedagogical Implications</h2>
<div class="two-col">
<div class="card small-text">
<h3 id="%F0%9F%8F%AB-instructional--assessment-insights"><img class="emoji" draggable="false" alt="🏫" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f3eb.svg" data-marp-twemoji=""/> Instructional &amp; Assessment Insights</h3>
<ul>
<li><strong>Restoring Fairness Without Bans</strong>: Linking tiered AI support to explicit AI tax rates preserves student access to scaffolding while keeping scores interpretable.</li>
<li><strong>Tailoring Support for Non-IT Novices</strong>: Lower correlation (<code>r = −0.187</code>) among non-IT students suggests conceptual gains alone do not eliminate syntax/debugging barriers.</li>
<li><strong>Early Risk Identification</strong>: Four-quadrant profiles help instructors spot <em>Tax-Burdened</em> (18.75%) and <em>Under-Utilizing</em> (25.89%) students early.</li>
</ul>
</div>
<div class="card accent small-text">
<h3 id="%F0%9F%94%AC-methodological-reflections--limits"><img class="emoji" draggable="false" alt="🔬" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f52c.svg" data-marp-twemoji=""/> Methodological Reflections &amp; Limits</h3>
<ul>
<li><strong>Correlational, Not Causal</strong>: LADI shows preliminary criterion-related validity (<code>r = −0.383</code>), but cannot yet establish causal direction between dependency and mastery.</li>
<li><strong>Proactive Timing Gap</strong>: Student satisfaction with proactive prompt timing averaged only <strong><code>2.96 / 5.0</code></strong>, indicating stagnation thresholds and trigger frequency need calibration.</li>
<li><strong>Single-Course Context</strong>: Generalizability of <code>λ = 0.3</code> and tier tax weights requires cross-course validation.</li>
</ul>
</div>
</div>
<footer>Nien-Lin Hsueh &amp; Ying-Chang Lu · Feng Chia University · Smart Coding Tutor (SCT)</footer>

    e.stopPropagation();
    const dd = btn.closest('.nav-dropdown');
    const wasOpen = dd.classList.contains('open');
    document.querySelectorAll('.nav-dropdown.open').forEach(el => el.classList.remove('open'));
    if (!wasOpen) dd.classList.add('open');
    return;
  }
  document.querySelectorAll('.nav-dropdown.open').forEach(el => el.classList.remove('open'));

// Dynamic bounded in-place hover zoom (max 2.15x, strictly within 1280x720 safe area)
document.querySelectorAll('.split64 .fig-box img, .split55 .fig-box img, .split46 .fig-box img, .split73 .fig-box img, .two-col .fig-box img, .three-col .fig-box img').forEach((img) => {
  const box = img.closest('.fig-box');
  img.addEventListener('mouseenter', () => {
    const sec = img.closest('section');
    if (!sec) return;
    img.style.transform = '';
    const sr = sec.getBoundingClientRect();
    const ir = img.getBoundingClientRect();
    if (!ir.width || !ir.height) return;
    const padX = sr.width * (24 / 1280);
    const padTop = sr.height * (52 / 720);
    const padBot = sr.height * (22 / 720);
    const safeL = sr.left + padX;
    const safeR = sr.right - padX;
    const safeT = sr.top + padTop;
    const safeB = sr.bottom - padBot;
    const maxW = safeR - safeL;
    const maxH = safeB - safeT;
    const s = Math.min(2.15, (maxW / ir.width) * 0.98, (maxH / ir.height) * 0.98);
    if (s <= 1.03) return;
    const L = Math.max(0, ir.left - safeL);
    const R = Math.max(0, safeR - ir.right);
    const T = Math.max(0, ir.top - safeT);
    const B = Math.max(0, safeB - ir.bottom);
    const ox = (L + R) > 0 ? (L / (L + R)) * 100 : 50;
    const oy = (T + B) > 0 ? (T / (T + B)) * 100 : 50;
    img.style.transformOrigin = ox.toFixed(1) + '% ' + oy.toFixed(1) + '%';
    img.style.transform = 'scale(' + s.toFixed(3) + ')';
    img.classList.add('is-zoomed');
    if (box) box.classList.add('is-zoomed');
  });
  img.addEventListener('mouseleave', () => {
    img.style.transform = '';
    img.classList.remove('is-zoomed');
    if (box) box.classList.remove('is-zoomed');
  });
});

</script>
