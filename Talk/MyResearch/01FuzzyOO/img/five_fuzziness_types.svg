<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 350" width="880" height="350">
  <rect width="880" height="350" rx="12" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- Center Hub -->
  <rect x="315" y="130" width="250" height="86" rx="12" fill="#1b365d"/>
  <text x="440" y="164" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="800" fill="#ffffff">Fuzzy Object-Oriented</text>
  <text x="440" y="186" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="800" fill="#ffffff">Modeling (FOOM)</text>
  <text x="440" y="205" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="11.5" fill="#cbd5e1">5 Core Dimensions of Fuzziness</text>

  <!-- Connectors -->
  <line x1="255" y1="75" x2="345" y2="130" stroke="#8c1d40" stroke-width="2"/>
  <line x1="625" y1="75" x2="535" y2="130" stroke="#0f766e" stroke-width="2"/>
  <line x1="235" y1="275" x2="345" y2="216" stroke="#1b365d" stroke-width="2"/>
  <line x1="440" y1="262" x2="440" y2="216" stroke="#8c1d40" stroke-width="2"/>
  <line x1="645" y1="275" x2="535" y2="216" stroke="#0f766e" stroke-width="2"/>

  <!-- Box 1: Top-Left -->
  <rect x="24" y="20" width="275" height="82" rx="8" fill="#ffffff" stroke="#8c1d40" stroke-width="2"/>
  <rect x="24" y="20" width="28" height="82" rx="6" fill="#8c1d40"/>
  <text x="38" y="67" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="800" fill="#ffffff">1</text>
  <text x="64" y="44" font-family="Inter, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#8c1d40">Imprecise Class Boundaries</text>
  <text x="64" y="64" font-family="Inter, Arial, sans-serif" font-size="11.5" fill="#334155">Objects with similar attributes,</text>
  <text x="64" y="81" font-family="Inter, Arial, sans-serif" font-size="11.5" fill="#334155">operations &amp; relationships</text>

  <!-- Box 2: Top-Right -->
  <rect x="581" y="20" width="275" height="82" rx="8" fill="#ffffff" stroke="#0f766e" stroke-width="2"/>
  <rect x="581" y="20" width="28" height="82" rx="6" fill="#0f766e"/>
  <text x="595" y="67" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="800" fill="#ffffff">2</text>
  <text x="621" y="44" font-family="Inter, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#0f766e">Linguistic Rules in Classes</text>
  <text x="621" y="64" font-family="Inter, Arial, sans-serif" font-size="11.5" fill="#334155">Encapsulated fuzzy rules linking</text>
  <text x="621" y="81" font-family="Inter, Arial, sans-serif" font-size="11.5" fill="#334155">attributes via linguistic terms</text>

  <!-- Box 3: Bottom-Left -->
  <rect x="20" y="248" width="265" height="82" rx="8" fill="#ffffff" stroke="#1b365d" stroke-width="2"/>
  <rect x="20" y="248" width="28" height="82" rx="6" fill="#1b365d"/>
  <text x="34" y="295" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="800" fill="#ffffff">3</text>
  <text x="60" y="272" font-family="Inter, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#1b365d">Fuzzy Attribute Ranges</text>
  <text x="60" y="292" font-family="Inter, Arial, sans-serif" font-size="11.5" fill="#334155">Linguistic or typical values</text>
  <text x="60" y="309" font-family="Inter, Arial, sans-serif" font-size="11.5" fill="#334155">defining allowed domain sets</text>

  <!-- Box 4: Bottom-Center -->
  <rect x="304" y="248" width="272" height="82" rx="8" fill="#ffffff" stroke="#8c1d40" stroke-width="2"/>
  <rect x="304" y="248" width="28" height="82" rx="6" fill="#8c1d40"/>
  <text x="318" y="295" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="800" fill="#ffffff">4</text>
  <text x="344" y="272" font-family="Inter, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#8c1d40">ISA &amp; AKO Degrees [0, 1]</text>
  <text x="344" y="292" font-family="Inter, Arial, sans-serif" font-size="11.5" fill="#334155">Object-Class (ISA) &amp; Subclass-</text>
  <text x="344" y="309" font-family="Inter, Arial, sans-serif" font-size="11.5" fill="#334155">Superclass (AKO) membership</text>

  <!-- Box 5: Bottom-Right -->
  <rect x="595" y="248" width="265" height="82" rx="8" fill="#ffffff" stroke="#0f766e" stroke-width="2"/>
  <rect x="595" y="248" width="28" height="82" rx="6" fill="#0f766e"/>
  <text x="609" y="295" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="800" fill="#ffffff">5</text>
  <text x="635" y="272" font-family="Inter, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#0f766e">Partial Associations</text>
  <text x="635" y="292" font-family="Inter, Arial, sans-serif" font-size="11.5" fill="#334155">Object instances participate in</text>
  <text x="635" y="309" font-family="Inter, Arial, sans-serif" font-size="11.5" fill="#334155">class associations to a degree</text>
</svg>
