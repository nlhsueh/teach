<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 340" width="880" height="340">
  <defs>
    <marker id="a1" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#1b365d"/>
    </marker>
  </defs>
  <rect width="880" height="340" rx="12" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- Top Confluence Banner -->
  <rect x="130" y="18" width="250" height="46" rx="8" fill="#8c1d40"/>
  <text x="255" y="46" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#ffffff">Fuzzy Set Theory (Zadeh)</text>

  <text x="440" y="48" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="800" fill="#1b365d">+</text>

  <rect x="500" y="18" width="250" height="46" rx="8" fill="#1b365d"/>
  <text x="625" y="46" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#ffffff">Object-Oriented Modeling</text>

  <!-- Branching lines -->
  <line x1="440" y1="68" x2="440" y2="96" stroke="#1b365d" stroke-width="2"/>
  <line x1="150" y1="96" x2="730" y2="96" stroke="#1b365d" stroke-width="2"/>
  <line x1="150" y1="96" x2="150" y2="122" stroke="#1b365d" stroke-width="2" marker-end="url(#a1)"/>
  <line x1="440" y1="96" x2="440" y2="122" stroke="#1b365d" stroke-width="2" marker-end="url(#a1)"/>
  <line x1="730" y1="96" x2="730" y2="122" stroke="#1b365d" stroke-width="2" marker-end="url(#a1)"/>

  <!-- Pillar 1: Database Systems -->
  <rect x="24" y="128" width="254" height="192" rx="10" fill="#ffffff" stroke="#1b365d" stroke-width="2"/>
  <rect x="24" y="128" width="254" height="36" rx="8" fill="#1b365d"/>
  <text x="151" y="151" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#ffffff">1. Database Systems (Table I)</text>
  <text x="40" y="186" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="700" fill="#1b365d">Core Focus:</text>
  <text x="40" y="205" font-family="Inter, Arial, sans-serif" font-size="11.5" fill="#334155">- Fuzzy queries (FA-algebra, FOQL)</text>
  <text x="40" y="223" font-family="Inter, Arial, sans-serif" font-size="11.5" fill="#334155">- Uncertainty in class hierarchies</text>
  <text x="40" y="241" font-family="Inter, Arial, sans-serif" font-size="11.5" fill="#334155">- Imprecise data &amp; semantic models</text>
  <text x="40" y="268" font-family="Inter, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#8c1d40">Key Mechanisms:</text>
  <text x="40" y="286" font-family="Inter, Arial, sans-serif" font-size="11" fill="#475569">Possibility dist., Similarity relations,</text>
  <text x="40" y="302" font-family="Inter, Arial, sans-serif" font-size="11" fill="#475569">Fuzzy graphs, Prioritized conjunction</text>

  <!-- Pillar 2: Software Modeling -->
  <rect x="313" y="128" width="254" height="192" rx="10" fill="#ffffff" stroke="#8c1d40" stroke-width="2"/>
  <rect x="313" y="128" width="254" height="36" rx="8" fill="#8c1d40"/>
  <text x="440" y="151" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#ffffff">2. Software Modeling (Tables II-III)</text>
  <text x="329" y="186" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="700" fill="#8c1d40">Two Sub-Streams:</text>
  <text x="329" y="205" font-family="Inter, Arial, sans-serif" font-size="11.5" fill="#334155">- Fuzzy RE: RTA, GDUC, Fuzzy Z</text>
  <text x="329" y="223" font-family="Inter, Arial, sans-serif" font-size="11.5" fill="#334155">- Fuzzy OOM: UFO, FOOM, Fuzzy Types</text>
  <text x="329" y="241" font-family="Inter, Arial, sans-serif" font-size="11.5" fill="#334155">- Spatiotemporal UML extensions</text>
  <text x="329" y="268" font-family="Inter, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#1b365d">Key Mechanisms:</text>
  <text x="329" y="286" font-family="Inter, Arial, sans-serif" font-size="11" fill="#475569">Fuzzy-and/or, Fuzzy inclusion, alpha-cut,</text>
  <text x="329" y="302" font-family="Inter, Arial, sans-serif" font-size="11" fill="#475569">Static &amp; dynamic property evaluation</text>

  <!-- Pillar 3: AI Systems -->
  <rect x="602" y="128" width="254" height="192" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2"/>
  <rect x="602" y="128" width="254" height="36" rx="8" fill="#0f766e"/>
  <text x="729" y="151" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#ffffff">3. AI Knowledge Rep. (Table IV)</text>
  <text x="618" y="186" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="700" fill="#0f766e">Core Focus:</text>
  <text x="618" y="205" font-family="Inter, Arial, sans-serif" font-size="11.5" fill="#334155">- Approximate reasoning &amp; prototypes</text>
  <text x="618" y="223" font-family="Inter, Arial, sans-serif" font-size="11.5" fill="#334155">- Expert system shells &amp; control</text>
  <text x="618" y="241" font-family="Inter, Arial, sans-serif" font-size="11.5" fill="#334155">- Computing with words (KOOFI)</text>
  <text x="618" y="268" font-family="Inter, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#1b365d">Key Mechanisms:</text>
  <text x="618" y="286" font-family="Inter, Arial, sans-serif" font-size="11" fill="#475569">Weighted slots, Proximity metrics,</text>
  <text x="618" y="302" font-family="Inter, Arial, sans-serif" font-size="11" fill="#475569">Certainty factors, Sugeno fuzzy rules</text>
</svg>
