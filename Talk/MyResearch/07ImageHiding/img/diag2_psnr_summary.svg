<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 310" width="640" height="310">
  <rect x="0" y="0" width="640" height="310" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="20" y="28" font-family="Inter, sans-serif" font-size="14" font-weight="700" fill="#1b365d">Payload Capacity (bpp) Across Four 512x512 Test Images (Table 1)</text>

  <!-- Legend -->
  <rect x="20" y="42" width="14" height="12" rx="2" fill="#0f766e"/>
  <text x="40" y="52" font-family="Inter, sans-serif" font-size="11.5" font-weight="600" fill="#334155">At PSNR &gt;= 30 dB (High Quality)</text>
  <rect x="255" y="42" width="14" height="12" rx="2" fill="#1b365d"/>
  <text x="275" y="52" font-family="Inter, sans-serif" font-size="11.5" font-weight="600" fill="#334155">At 20 Difference Planes (PSNR &gt; 23.6 dB)</text>

  <!-- Axes -->
  <line x1="96" y1="258" x2="600" y2="258" stroke="#334155" stroke-width="1.5"/>
  <line x1="96" y1="74" x2="96" y2="258" stroke="#334155" stroke-width="1.5"/>

  <!-- Grid ticks: 0, 0.5, 1.0, 1.5, 2.0 bpp (width 500px => 250px per 1.0 bpp) -->
  <line x1="221" y1="74" x2="221" y2="258" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="346" y1="74" x2="346" y2="258" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="471" y1="74" x2="471" y2="258" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="596" y1="74" x2="596" y2="258" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="96" y="276" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" fill="#64748b">0.0</text>
  <text x="221" y="276" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" fill="#64748b">0.5</text>
  <text x="346" y="276" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" fill="#64748b">1.0</text>
  <text x="471" y="276" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" fill="#64748b">1.5</text>
  <text x="596" y="276" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" fill="#64748b">2.0 bpp</text>

  <!-- Airplane: 1.35 (30.43 dB, DP 10), 1.85 (25.20 dB, DP 20) -->
  <text x="86" y="102" text-anchor="end" font-family="Inter, sans-serif" font-size="12.5" font-weight="700" fill="#0f172a">Airplane</text>
  <rect x="96" y="82" width="337.5" height="15" rx="3" fill="#0f766e"/>
  <text x="440" y="94" font-family="Inter, sans-serif" font-size="11" font-weight="700" fill="#0f766e">1.35 bpp (30.43 dB)</text>
  <rect x="96" y="100" width="462.5" height="15" rx="3" fill="#1b365d"/>
  <text x="564" y="112" font-family="Inter, sans-serif" font-size="11" font-weight="700" fill="#1b365d">1.85</text>

  <!-- Gold: 1.02 (30.32 dB, DP 10), 1.48 (24.60 dB, DP 20) -->
  <text x="86" y="148" text-anchor="end" font-family="Inter, sans-serif" font-size="12.5" font-weight="700" fill="#0f172a">Gold</text>
  <rect x="96" y="128" width="255" height="15" rx="3" fill="#0f766e"/>
  <text x="357" y="140" font-family="Inter, sans-serif" font-size="11" font-weight="700" fill="#0f766e">1.02 bpp (30.32 dB)</text>
  <rect x="96" y="146" width="370" height="15" rx="3" fill="#1b365d"/>
  <text x="472" y="158" font-family="Inter, sans-serif" font-size="11" font-weight="700" fill="#1b365d">1.48 bpp (24.60 dB)</text>

  <!-- Lena: 0.96 (30.35 dB, DP 10), 1.37 (24.78 dB, DP 20) -->
  <text x="86" y="194" text-anchor="end" font-family="Inter, sans-serif" font-size="12.5" font-weight="700" fill="#0f172a">Lena</text>
  <rect x="96" y="174" width="240" height="15" rx="3" fill="#0f766e"/>
  <text x="342" y="186" font-family="Inter, sans-serif" font-size="11" font-weight="700" fill="#0f766e">0.96 bpp (30.35 dB)</text>
  <rect x="96" y="192" width="342.5" height="15" rx="3" fill="#1b365d"/>
  <text x="444" y="204" font-family="Inter, sans-serif" font-size="11" font-weight="700" fill="#1b365d">1.37 bpp (24.78 dB)</text>

  <!-- Baboon: 0.61 (30.13 dB, DP 9), 1.10 (23.61 dB, DP 20) -->
  <text x="86" y="240" text-anchor="end" font-family="Inter, sans-serif" font-size="12.5" font-weight="700" fill="#0f172a">Baboon</text>
  <rect x="96" y="220" width="152.5" height="15" rx="3" fill="#0f766e"/>
  <text x="254" y="232" font-family="Inter, sans-serif" font-size="11" font-weight="700" fill="#0f766e">0.61 bpp (30.13 dB)</text>
  <rect x="96" y="238" width="275" height="15" rx="3" fill="#1b365d"/>
  <text x="377" y="250" font-family="Inter, sans-serif" font-size="11" font-weight="700" fill="#1b365d">1.10 bpp (23.61 dB)</text>

  <text x="346" y="298" text-anchor="middle" font-family="Inter, sans-serif" font-size="11.5" font-weight="700" fill="#8c1d40">20-DP Average across 4 images: 1.45 bpp (PSNR &gt; 23.6 dB); Smoother images yield higher E(P)</text>
</svg>
