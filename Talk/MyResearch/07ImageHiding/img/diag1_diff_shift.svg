<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 310" width="1100" height="310">
  <defs>
    <marker id="arr-ih" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#1b365d"/>
    </marker>
    <marker id="arr-ih-t" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0f766e"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1100" height="310" rx="12" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- Left: Difference Histogram -->
  <rect x="22" y="24" width="320" height="262" rx="10" fill="#ffffff" stroke="#1b365d" stroke-width="2.2"/>
  <text x="182" y="50" text-anchor="middle" font-family="Inter, sans-serif" font-size="13.5" font-weight="700" fill="#1b365d">1. Zigzag Difference Histogram E(d)</text>
  <!-- Axes -->
  <line x1="56" y1="226" x2="316" y2="226" stroke="#334155" stroke-width="1.8"/>
  <line x1="56" y1="226" x2="56" y2="74" stroke="#334155" stroke-width="1.8"/>
  <!-- Bars: d=0, d=1 (P, peak!), d=2, d=3, d=4, d=5 -->
  <rect x="72" y="136" width="28" height="90" rx="2" fill="#94a3b8"/>
  <rect x="110" y="84" width="28" height="142" rx="2" fill="#8c1d40"/>
  <rect x="148" y="120" width="28" height="106" rx="2" fill="#1b365d"/>
  <rect x="186" y="154" width="28" height="72" rx="2" fill="#1b365d"/>
  <rect x="224" y="180" width="28" height="46" rx="2" fill="#1b365d"/>
  <rect x="262" y="198" width="28" height="28" rx="2" fill="#1b365d"/>
  <!-- Labels -->
  <text x="86" y="243" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="11" fill="#475569">0</text>
  <text x="124" y="243" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="11" font-weight="800" fill="#8c1d40">P</text>
  <text x="162" y="243" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="11" fill="#1b365d">P+1</text>
  <text x="200" y="243" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="11" fill="#1b365d">P+2</text>
  <text x="238" y="243" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="11" fill="#1b365d">P+3</text>
  <text x="276" y="243" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="11" fill="#1b365d">...</text>
  <text x="124" y="76" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" font-weight="700" fill="#8c1d40">Peak E(P)</text>
  <text x="224" y="106" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" font-weight="700" fill="#1b365d">Shift right (+1)</text>
  <line x1="168" y1="114" x2="278" y2="114" stroke="#1b365d" stroke-width="1.8" marker-end="url(#arr-ih)"/>
  <text x="182" y="268" text-anchor="middle" font-family="Inter, sans-serif" font-size="11.5" fill="#475569">d = |x_i - x_{i-1}| (Sharp peak near 0-1)</text>

  <!-- Arrow 1->2 -->
  <line x1="342" y1="155" x2="378" y2="155" stroke="#1b365d" stroke-width="2.5" marker-end="url(#arr-ih)"/>

  <!-- Middle: Embedding Rule Eq(1) -->
  <rect x="386" y="24" width="332" height="262" rx="10" fill="#ffffff" stroke="#8c1d40" stroke-width="2.2"/>
  <text x="552" y="50" text-anchor="middle" font-family="Inter, sans-serif" font-size="13.5" font-weight="700" fill="#8c1d40">2. Pixel Modification (Eq. 1)</text>

  <rect x="404" y="68" width="296" height="62" rx="7" fill="#fdf2f5" stroke="#8c1d40" stroke-width="1.5"/>
  <text x="416" y="90" font-family="Inter, sans-serif" font-size="12" font-weight="700" fill="#8c1d40">Embed bit b_j when d == P:</text>
  <text x="416" y="112" font-family="JetBrains Mono, monospace" font-size="12" fill="#0f172a">x'_i = x_i + b_j (x_i &gt;= x_{i-1})</text>
  <text x="416" y="126" font-family="JetBrains Mono, monospace" font-size="12" fill="#0f172a">x'_i = x_i - b_j (x_i &lt;  x_{i-1})</text>

  <rect x="404" y="140" width="296" height="62" rx="7" fill="#f1f5f9" stroke="#1b365d" stroke-width="1.5"/>
  <text x="416" y="162" font-family="Inter, sans-serif" font-size="12" font-weight="700" fill="#1b365d">Shift outward when d &gt; P:</text>
  <text x="416" y="184" font-family="JetBrains Mono, monospace" font-size="12" fill="#0f172a">x'_i = x_i + 1 (x_i &gt;= x_{i-1})</text>
  <text x="416" y="198" font-family="JetBrains Mono, monospace" font-size="12" fill="#0f172a">x'_i = x_i - 1 (x_i &lt;  x_{i-1})</text>

  <rect x="404" y="212" width="296" height="58" rx="7" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="416" y="234" font-family="Inter, sans-serif" font-size="12" font-weight="700" fill="#475569">Keep unchanged when d &lt; P or x_i in {0,255}:</text>
  <text x="416" y="254" font-family="Inter, sans-serif" font-size="11.5" fill="#334155">Max change per plane: +/- 1 gray level!</text>

  <!-- Arrow 2->3 -->
  <line x1="718" y1="155" x2="754" y2="155" stroke="#0f766e" stroke-width="2.5" marker-end="url(#arr-ih-t)"/>

  <!-- Right: Exact Extraction & Recovery -->
  <rect x="762" y="24" width="316" height="262" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2.2"/>
  <text x="920" y="50" text-anchor="middle" font-family="Inter, sans-serif" font-size="13.5" font-weight="700" fill="#0f766e">3. Lossless Extraction (Eq. 2-3)</text>

  <rect x="780" y="68" width="280" height="84" rx="7" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.5"/>
  <text x="792" y="90" font-family="Inter, sans-serif" font-size="12" font-weight="700" fill="#0f766e">Extract bit from d' = |x_{i-1} - x'_i|:</text>
  <text x="792" y="112" font-family="JetBrains Mono, monospace" font-size="12" fill="#0f172a">d' == P     =&gt; bit "0"</text>
  <text x="792" y="130" font-family="JetBrains Mono, monospace" font-size="12" fill="#0f172a">d' == P + 1 =&gt; bit "1"</text>
  <text x="792" y="146" font-family="JetBrains Mono, monospace" font-size="11.5" fill="#64748b">otherwise   =&gt; no bit</text>

  <rect x="780" y="164" width="280" height="106" rx="7" fill="#f8fafc" stroke="#1b365d" stroke-width="1.5"/>
  <text x="792" y="186" font-family="Inter, sans-serif" font-size="12" font-weight="700" fill="#1b365d">Restore exact original pixel x_i:</text>
  <text x="792" y="208" font-family="JetBrains Mono, monospace" font-size="12" fill="#0f172a">If d' &gt; P &amp; x_{i-1} &gt; x'_i: x'_i + 1</text>
  <text x="792" y="226" font-family="JetBrains Mono, monospace" font-size="12" fill="#0f172a">If d' &gt; P &amp; x_{i-1} &lt; x'_i: x'_i - 1</text>
  <text x="792" y="248" font-family="Inter, sans-serif" font-size="11.5" font-weight="700" fill="#0f766e">100% bit-exact host restoration!</text>
</svg>
