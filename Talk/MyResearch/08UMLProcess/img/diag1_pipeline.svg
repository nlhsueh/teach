<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 310" width="1120" height="310">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#1b365d"/>
    </marker>
    <marker id="arr-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#8c1d40"/>
    </marker>
    <marker id="arr-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0f766e"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1120" height="310" rx="12" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- Stage 1 -->
  <rect x="24" y="34" width="230" height="176" rx="10" fill="#ffffff" stroke="#1b365d" stroke-width="2.5"/>
  <rect x="24" y="34" width="230" height="38" rx="10" fill="#1b365d"/>
  <rect x="24" y="60" width="230" height="12" fill="#1b365d"/>
  <text x="139" y="58" text-anchor="middle" font-family="Inter, sans-serif" font-size="14" font-weight="700" fill="#ffffff">1. Process Definition (PMP)</text>
  <text x="38" y="96" font-family="Inter, sans-serif" font-size="12.5" font-weight="600" fill="#0f172a">UML Profile (Rational XDE)</text>
  <text x="38" y="118" font-family="Inter, sans-serif" font-size="11.5" fill="#334155">- Class Diagram: Static structure</text>
  <text x="38" y="138" font-family="Inter, sans-serif" font-size="11.5" fill="#334155">- Statechart: Artifact lifecycle</text>
  <text x="38" y="158" font-family="Inter, sans-serif" font-size="11.5" fill="#334155">- Activity Diagram: Swimlanes</text>
  <text x="38" y="182" font-family="Inter, sans-serif" font-size="11.5" font-weight="700" fill="#8c1d40">Embeds CMMI ML2/ML3 hierarchy</text>

  <!-- Arrow 1->2 -->
  <line x1="254" y1="122" x2="294" y2="122" stroke="#1b365d" stroke-width="2.5" marker-end="url(#arr)"/>

  <!-- Stage 2 -->
  <rect x="302" y="34" width="235" height="176" rx="10" fill="#ffffff" stroke="#8c1d40" stroke-width="2.5"/>
  <rect x="302" y="34" width="235" height="38" rx="10" fill="#8c1d40"/>
  <rect x="302" y="60" width="235" height="12" fill="#8c1d40"/>
  <text x="419" y="58" text-anchor="middle" font-family="Inter, sans-serif" font-size="14" font-weight="700" fill="#ffffff">2. OCL Verification</text>
  <text x="316" y="96" font-family="Inter, sans-serif" font-size="12.5" font-weight="600" fill="#0f172a">Automated Model Checking</text>
  <text x="316" y="118" font-family="Inter, sans-serif" font-size="11.5" fill="#334155">- Process Rules: Multiplicity,</text>
  <text x="326" y="134" font-family="Inter, sans-serif" font-size="11.5" fill="#334155">Entry/Exit criteria, Performer</text>
  <text x="316" y="156" font-family="Inter, sans-serif" font-size="11.5" fill="#334155">- CMMI Rules: PA, Goal, SP/GP</text>
  <text x="316" y="182" font-family="Inter, sans-serif" font-size="11.5" font-weight="700" fill="#0f766e">Instant error &amp; compliance alerts</text>

  <!-- Arrow 2->3 -->
  <line x1="537" y1="122" x2="577" y2="122" stroke="#1b365d" stroke-width="2.5" marker-end="url(#arr)"/>

  <!-- Stage 3 -->
  <rect x="585" y="34" width="240" height="176" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="2.5"/>
  <rect x="585" y="34" width="240" height="38" rx="10" fill="#0f766e"/>
  <rect x="585" y="60" width="240" height="12" fill="#0f766e"/>
  <text x="705" y="58" text-anchor="middle" font-family="Inter, sans-serif" font-size="14" font-weight="700" fill="#ffffff">3. XML -&gt; SimSE Transform</text>
  <text x="599" y="96" font-family="Inter, sans-serif" font-size="12.5" font-weight="600" fill="#0f172a">Two-Step Simulation Build</text>
  <text x="599" y="118" font-family="Inter, sans-serif" font-size="11.5" fill="#334155">- Auto XML export -&gt; SimSE</text>
  <text x="599" y="138" font-family="Inter, sans-serif" font-size="11.5" fill="#334155">- Map Actions, Employees, Rules</text>
  <text x="599" y="158" font-family="Inter, sans-serif" font-size="11.5" fill="#334155">- Manual refinement: triggers,</text>
  <text x="609" y="174" font-family="Inter, sans-serif" font-size="11.5" fill="#334155">energy, productivity, errorRate</text>

  <!-- Arrow 3->4 -->
  <line x1="825" y1="122" x2="865" y2="122" stroke="#0f766e" stroke-width="2.5" marker-end="url(#arr-teal)"/>

  <!-- Stage 4 -->
  <rect x="873" y="34" width="223" height="176" rx="10" fill="#ffffff" stroke="#1b365d" stroke-width="2.5"/>
  <rect x="873" y="34" width="223" height="38" rx="10" fill="#1b365d"/>
  <rect x="873" y="60" width="223" height="12" fill="#1b365d"/>
  <text x="984" y="58" text-anchor="middle" font-family="Inter, sans-serif" font-size="14" font-weight="700" fill="#ffffff">4. Validation &amp; Education</text>
  <text x="887" y="96" font-family="Inter, sans-serif" font-size="12.5" font-weight="600" fill="#0f172a">Pre-Pilot Dry Run (OIT)</text>
  <text x="887" y="118" font-family="Inter, sans-serif" font-size="11.5" fill="#334155">- Stakeholders play virtual game</text>
  <text x="887" y="138" font-family="Inter, sans-serif" font-size="11.5" fill="#334155">- Score: ProcessUnderstanding</text>
  <text x="887" y="158" font-family="Inter, sans-serif" font-size="11.5" fill="#334155">- Detect defects before pilot</text>
  <text x="887" y="182" font-family="Inter, sans-serif" font-size="11.5" font-weight="700" fill="#0f766e">Reuse as training simulator</text>

  <!-- Feedback loop -->
  <path d="M 984 210 L 984 264 L 139 264 L 139 218" fill="none" stroke="#8c1d40" stroke-width="2.2" stroke-dasharray="7,5" marker-end="url(#arr-red)"/>
  <rect x="405" y="248" width="315" height="30" rx="15" fill="#fdf2f5" stroke="#8c1d40" stroke-width="1.5"/>
  <text x="562" y="268" text-anchor="middle" font-family="Inter, sans-serif" font-size="12" font-weight="700" fill="#8c1d40">Iterative Revision Loop (Before Costly Pilot Project)</text>
</svg>
