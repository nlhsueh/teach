<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 330" width="640" height="330">
  <rect x="0" y="0" width="640" height="330" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="20" y="28" font-family="Inter, sans-serif" font-size="14" font-weight="700" fill="#1b365d">OIT EPG Survey Results (n = 8 Project Leaders, 5-Point Likert Scale)</text>

  <!-- Grid lines for 1..5 -->
  <line x1="270" y1="45" x2="270" y2="288" stroke="#cbd5e1" stroke-width="1"/>
  <line x1="336" y1="45" x2="336" y2="288" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="402" y1="45" x2="402" y2="288" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="468" y1="45" x2="468" y2="288" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="4,3"/>
  <line x1="534" y1="45" x2="534" y2="288" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="600" y1="45" x2="600" y2="288" stroke="#cbd5e1" stroke-width="1"/>

  <!-- Scale labels -->
  <text x="270" y="306" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" fill="#64748b">0</text>
  <text x="336" y="306" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" fill="#64748b">1</text>
  <text x="402" y="306" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" fill="#64748b">2</text>
  <text x="468" y="306" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" font-weight="700" fill="#8c1d40">3 (Neutral)</text>
  <text x="534" y="306" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" fill="#64748b">4</text>
  <text x="600" y="306" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" fill="#64748b">5</text>

  <!-- Q6: 4.75 (top highlight) -->
  <text x="260" y="70" text-anchor="end" font-family="Inter, sans-serif" font-size="12" font-weight="700" fill="#0f766e">Q6. Learn activity sequence</text>
  <rect x="270" y="54" width="313.5" height="22" rx="4" fill="#0f766e"/>
  <text x="588" y="70" font-family="Inter, sans-serif" font-size="12" font-weight="800" fill="#0f766e">4.75</text>

  <!-- Q2: 3.75 -->
  <text x="260" y="110" text-anchor="end" font-family="Inter, sans-serif" font-size="12" fill="#334155">Q2. Ease of playing simulator</text>
  <rect x="270" y="94" width="247.5" height="22" rx="4" fill="#1b365d"/>
  <text x="524" y="110" font-family="Inter, sans-serif" font-size="12" font-weight="700" fill="#1b365d">3.75</text>

  <!-- Q1: 3.63 -->
  <text x="260" y="150" text-anchor="end" font-family="Inter, sans-serif" font-size="12" fill="#334155">Q1. Enjoyment while playing</text>
  <rect x="270" y="134" width="239.6" height="22" rx="4" fill="#1b365d"/>
  <text x="516" y="150" font-family="Inter, sans-serif" font-size="12" font-weight="700" fill="#1b365d">3.63</text>

  <!-- Q3: 3.63 -->
  <text x="260" y="190" text-anchor="end" font-family="Inter, sans-serif" font-size="12" fill="#334155">Q3. Process-to-game alignment</text>
  <rect x="270" y="174" width="239.6" height="22" rx="4" fill="#1b365d"/>
  <text x="516" y="190" font-family="Inter, sans-serif" font-size="12" font-weight="700" fill="#1b365d">3.63</text>

  <!-- Q4: 3.50 -->
  <text x="260" y="230" text-anchor="end" font-family="Inter, sans-serif" font-size="12" fill="#334155">Q4. Process completeness/approval</text>
  <rect x="270" y="214" width="231.0" height="22" rx="4" fill="#3b608c"/>
  <text x="508" y="230" font-family="Inter, sans-serif" font-size="12" font-weight="700" fill="#334155">3.50</text>

  <!-- Q5: 3.50 -->
