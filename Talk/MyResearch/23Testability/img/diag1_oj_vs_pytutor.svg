<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 380">
  <defs>
    <marker id="arr-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#8c1d40"/>
    </marker>
    <marker id="arr-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0f766e"/>
    </marker>
  </defs>

  <!-- Left Panel: Traditional OJ -->
  <rect x="16" y="14" width="522" height="352" rx="14" fill="#fdf2f5" stroke="#8c1d40" stroke-width="2.2"/>
  <rect x="16" y="14" width="522" height="46" rx="14" fill="#8c1d40"/>
  <rect x="16" y="44" width="522" height="16" fill="#8c1d40"/>
  <text x="277" y="44" text-anchor="middle" font-family="Inter, sans-serif" font-size="18" font-weight="800" fill="#ffffff">Traditional Online Judge (Code-Only Grading)</text>

  <!-- Flow inside Left -->
  <rect x="44" y="84" width="136" height="66" rx="10" fill="#ffffff" stroke="#8c1d40" stroke-width="1.8"/>
  <text x="112" y="112" text-anchor="middle" font-family="Inter, sans-serif" font-size="14" font-weight="700" fill="#1b365d">Write Code</text>
  <text x="112" y="132" text-anchor="middle" font-family="Inter, sans-serif" font-size="12" fill="#64748b">Skip self-testing</text>

  <line x1="180" y1="117" x2="212" y2="117" stroke="#8c1d40" stroke-width="2.5" marker-end="url(#arr-red)"/>

  <rect x="218" y="84" width="136" height="66" rx="10" fill="#ffffff" stroke="#8c1d40" stroke-width="1.8"/>
  <text x="286" y="112" text-anchor="middle" font-family="Inter, sans-serif" font-size="14" font-weight="700" fill="#8c1d40">Blind Submit</text>
  <text x="286" y="132" text-anchor="middle" font-family="Inter, sans-serif" font-size="12" fill="#64748b">Hidden Tests only</text>

  <line x1="354" y1="117" x2="386" y2="117" stroke="#8c1d40" stroke-width="2.5" marker-end="url(#arr-red)"/>

  <rect x="392" y="84" width="122" height="66" rx="10" fill="#fff1f2" stroke="#8c1d40" stroke-width="1.8"/>
  <text x="453" y="112" text-anchor="middle" font-family="Inter, sans-serif" font-size="14" font-weight="700" fill="#8c1d40">Pass / Fail</text>
  <text x="453" y="132" text-anchor="middle" font-family="Inter, sans-serif" font-size="12" fill="#64748b">Binary score only</text>

  <!-- Problems list -->
  <rect x="44" y="176" width="470" height="168" rx="10" fill="#ffffff" stroke="#fecdd3" stroke-width="1.5"/>
  <text x="64" y="206" font-family="Inter, sans-serif" font-size="15" font-weight="800" fill="#8c1d40">Key Educational Blind Spots:</text>
  <text x="64" y="236" font-family="Inter, sans-serif" font-size="14" fill="#334155">✗  Overlooks software-testing &amp; test-case design skills</text>
  <text x="64" y="266" font-family="Inter, sans-serif" font-size="14" fill="#334155">✗  Encourages trial-and-error submissions without reflection</text>
  <text x="64" y="296" font-family="Inter, sans-serif" font-size="14" fill="#334155">✗  Pure scores ignore setbacks, complexity, and persistence</text>
  <text x="64" y="326" font-family="Inter, sans-serif" font-size="14" fill="#334155">✗  Cannot link testing habits to video-watching &amp; exam outcomes</text>

  <!-- VS Badge -->
  <circle cx="560" cy="190" r="22" fill="#1b365d" stroke="#ffffff" stroke-width="3"/>
  <text x="560" y="196" text-anchor="middle" font-family="Inter, sans-serif" font-size="15" font-weight="800" fill="#ffffff">VS</text>

  <!-- Right Panel: Pytutor -->
  <rect x="582" y="14" width="522" height="352" rx="14" fill="#f0fdfa" stroke="#0f766e" stroke-width="2.2"/>
  <rect x="582" y="14" width="522" height="46" rx="14" fill="#0f766e"/>
  <rect x="582" y="44" width="522" height="16" fill="#0f766e"/>
  <text x="843" y="44" text-anchor="middle" font-family="Inter, sans-serif" font-size="18" font-weight="800" fill="#ffffff">Pytutor (Testing-Aware Online Judge)</text>

  <!-- Flow inside Right -->
  <rect x="610" y="84" width="136" height="66" rx="10" fill="#ffffff" stroke="#0f766e" stroke-width="1.8"/>
  <text x="678" y="112" text-anchor="middle" font-family="Inter, sans-serif" font-size="14" font-weight="700" fill="#1b365d">Code + OTC</text>
  <text x="678" y="132" text-anchor="middle" font-family="Inter, sans-serif" font-size="12" fill="#64748b">Public sanity check</text>

  <line x1="746" y1="117" x2="778" y2="117" stroke="#0f766e" stroke-width="2.5" marker-end="url(#arr-teal)"/>

  <rect x="784" y="84" width="144" height="66" rx="10" fill="#ccfbf1" stroke="#0f766e" stroke-width="2"/>
  <text x="856" y="112" text-anchor="middle" font-family="Inter, sans-serif" font-size="14" font-weight="800" fill="#0f766e">Design DTCs</text>
  <text x="856" y="132" text-anchor="middle" font-family="Inter, sans-serif" font-size="12" fill="#0f766e">Coverage + Mutation</text>

  <line x1="928" y1="117" x2="958" y2="117" stroke="#0f766e" stroke-width="2.5" marker-end="url(#arr-teal)"/>

  <rect x="964" y="84" width="118" height="66" rx="10" fill="#ffffff" stroke="#1b365d" stroke-width="1.8"/>
  <text x="1023" y="112" text-anchor="middle" font-family="Inter, sans-serif" font-size="14" font-weight="700" fill="#1b365d">HTC &amp; Logs</text>
  <text x="1023" y="132" text-anchor="middle" font-family="Inter, sans-serif" font-size="12" fill="#64748b">r · PAI · TEI</text>

  <!-- Strengths list -->
  <rect x="610" y="176" width="472" height="168" rx="10" fill="#ffffff" stroke="#99f6e4" stroke-width="1.5"/>
  <text x="630" y="206" font-family="Inter, sans-serif" font-size="15" font-weight="800" fill="#0f766e">Pytutor Core Innovations:</text>
  <text x="630" y="236" font-family="Inter, sans-serif" font-size="14" fill="#334155">✓  Supports Open (OTC), Defining (DTC) &amp; Hidden (HTC) tests</text>
  <text x="630" y="266" font-family="Inter, sans-serif" font-size="14" fill="#334155">✓  Cautionary Principle (−3 pts/submit) rewards pre-submission testing</text>
  <text x="630" y="296" font-family="Inter, sans-serif" font-size="14" fill="#334155">✓  Evaluates DTCs via branch coverage &amp; mutation testing (TEI)</text>
  <text x="630" y="326" font-family="Inter, sans-serif" font-size="14" fill="#334155">✓  Normalizes coding ability (PAI) by resilience (r) &amp; complexity</text>
</svg>
