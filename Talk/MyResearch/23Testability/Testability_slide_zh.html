<h2 id="%E7%A0%B4%E9%A1%8C%E6%80%9D%E8%80%83%E7%9C%8B%E8%B5%B7%E4%BE%86%E6%B2%92%E5%95%8F%E9%A1%8C%E7%9B%B4%E6%8E%A5%E4%BA%A4%E2%8B%AF%E2%8B%AF%E4%BD%A0%E7%9C%9F%E7%9A%84%E6%B8%AC%E9%81%8E%E8%87%AA%E5%B7%B1%E7%9A%84%E7%A8%8B%E5%BC%8F%E5%97%8E">破題思考：「看起來沒問題，直接交！」⋯⋯你真的測過自己的程式嗎？</h2>
<div class="fig-box" style="padding: 6px; margin-bottom: 10px; background: #fbf9f2;">
<img src="./img/testability_hook.jpg" alt="傳統線上評測盲目提交 vs Pytutor 自訂測資先抓蟲" style="max-height: 415px; border-radius: 6px;" />
</div>
<div class="callout" style="margin-top: 6px; padding: 9px 16px;">
<strong>核心洞見：</strong>傳統線上評測（OJ）只用隱藏測資打分數，導致高達 <strong>23% 的題次在未經任何測試下便盲目提交</strong>。<strong>Pytutor</strong> 導入<strong>自訂測試案例（DTC）</strong>、分支覆蓋率與突變測試，全面培養並量化學習者的軟體測試能力。
</div>
<footer>薛念林（Nien-Lin Hsueh）、Lien-Chi Lai &amp; Wei-Hsiang Tseng · 逢甲大學資訊工程學系 · Electronics 2023</footer>

<h2 id="%E7%B0%A1%E5%A0%B1%E5%A4%A7%E7%B6%B1">簡報大綱</h2>
<div class="outline-grid">
<div class="outline-item">
<div class="outline-num">1</div>
<div class="outline-body">
<p><a href="#4"><strong>研究動機與三個研究問題（RQ1–RQ3）</strong></a><br />
為何傳統 OJ 系統忽略軟體測試，以及本研究欲探討的三大面向。</p>
</div>
</div>
<div class="outline-item">
<div class="outline-num">2</div>
<div class="outline-body">
<p><a href="#6"><strong>文獻回顧與研究缺口</strong></a><br />
比較現有程式教學 OJ 系統與軟體測試自動化評量研究。</p>
</div>
</div>
<div class="outline-item">
<div class="outline-num">3</div>
<div class="outline-body">
<p><a href="#7"><strong>Pytutor 平台設計與能力指標</strong></a><br />
Django + Docker 沙箱、OTC/DTC/HTC 流程，以及答題韌性 (<i>r</i>)、PAI 與 TEI。</p>
</div>
</div>
<div class="outline-item">
<div class="outline-num">4</div>
<div class="outline-body">
<p><a href="#11"><strong>課程實驗設計與 RQ1–RQ3 實證結果</strong></a><br />
7 週線上 Python 課程（61 位有效學生、50 題練習）、分組檢定與相關性分析。</p>
</div>
</div>
<div class="outline-item">
<div class="outline-num">5</div>
<div class="outline-body">
<p><a href="#17"><strong>與前人比較、研究限制與教學啟示</strong></a><br />
與 Yang et al. (2020) 對照、三項研究限制與具體課程改善建議。</p>
</div>
</div>
<div class="outline-item">
<div class="outline-num">6</div>
<div class="outline-body">
<p><a href="#19"><strong>結論與未來研究方向</strong></a><br />
RQ1–RQ3 實證結論視覺化總結，以及 AI 助教與實驗對照組展望。</p>
</div>
</div>

<h2 id="11-%E7%A0%94%E7%A9%B6%E5%8B%95%E6%A9%9F%E7%82%BA%E4%BD%95%E5%82%B3%E7%B5%B1%E7%B7%9A%E4%B8%8A%E8%A9%95%E6%B8%ACoj%E5%BF%BD%E7%95%A5%E8%BB%9F%E9%AB%94%E6%B8%AC%E8%A9%A6">1.1 研究動機：為何傳統線上評測（OJ）忽略軟體測試？</h2>
<div class="fig-box" style="padding: 10px 12px; margin-bottom: 10px;">
<img src="./img/diag1_oj_vs_pytutor_zh.svg" alt="傳統 OJ 與 Pytutor 整合軟體測試平台之對照" style="max-height: 365px;" />
</div>
<div class="callout">
<strong>軟體測試在程式教育中的價值：</strong>撰寫測試案例有助於理解問題規格、提升程式碼品質與可靠性（Lemos et al., 2018；Fidge &amp; Hogan, 2013）。然而傳統教學用 OJ 往往<em>只檢核學生程式碼</em>，卻忽略培養「設計有效測資」的關鍵能力。
</div>
<footer>薛念林（Nien-Lin Hsueh）、Lien-Chi Lai &amp; Wei-Hsiang Tseng · 逢甲大學資訊工程學系 · Electronics 2023</footer>
</section>

<header><div class="hdr-wrap"><span class="hdr-title">Pytutor：線上程式設計平台與學習者測試能力研究</span><div class="nav-dropdown"><button class="nav-btn">章節導覽 ▾</button><div class="nav-menu"><a href="#2">破題：盲目提交 vs. 自訂測資</a><a href="#3">簡報大綱</a><a href="#4">1. 研究動機與問題</a><a href="#6">2. 文獻回顧與缺口</a><a href="#7">3. Pytutor 與能力指標</a><a href="#11">4. 課程實驗與 RQ1–RQ3</a><a href="#17">5. 比較、限制與教學啟示</a><a href="#19">6. 結論與未來研究</a></div></div></div></header>
<h2 id="12-%E7%A0%94%E7%A9%B6%E7%9B%AE%E6%A8%99%E8%88%87%E4%B8%89%E5%80%8B%E7%A0%94%E7%A9%B6%E5%95%8F%E9%A1%8Crq1%E2%80%93rq3">1.2 研究目標與三個研究問題（RQ1–RQ3）</h2>
<p>我們將 <strong>Pytutor</strong> 與非同步 <strong>OpenEdu</strong> 線上 Python 課程結合，深入剖析學習者的軟體工程能力與學習行為*（逐項揭示）*：</p>
<div class="rq-stage">
<ul>
<li data-marpit-fragment="1">
<div class="rq-card teal"><img src="./img/rq1_behavior.svg" alt="RQ1 能力指標與學習行為" /><div><div class="rq-hook"><span class="rq-tag" style="background:#0f766e;">RQ1</span> 初學者在線上寫程式、做測試與看教學影片的真實樣貌為何？</div><div class="rq-q"><strong>學習者在軟體工程能力指標（<i>r</i>、PAI、TEI）與線上學習行為</strong>上的整體表現為何？</div></div></div>
</li>
<li data-marpit-fragment="2">
<div class="rq-card accent"><img src="./img/rq2_groups.svg" alt="RQ2 群體差異比較" /><div><div class="rq-hook"><span class="rq-tag">RQ2</span> 資訊相關科系學生的測試能力，真的比非資訊科系更好嗎？</div><div class="rq-q"><strong>不同群體學習者在程式能力與測試能力上有何差異</strong>（依科系背景、形成性評量與總結性評量分組）？</div></div></div>
</li>
<li data-marpit-fragment="3">
<div class="rq-card"><img src="./img/rq3_corr.svg" alt="RQ3 相關性分析" /><div><div class="rq-hook"><span class="rq-tag" style="background:#1b365d;">RQ3</span> 多寫測試案例或認真看完影片，真的能幫助提升學習成績嗎？</div><div class="rq-q"><strong>各項能力指標與學習行為</strong>（影片完看率、播放倍速）及最終學習成效之間是否存在關聯？</div></div></div>
</li>
</ul>
</div>
<footer>薛念林（Nien-Lin Hsueh）、Lien-Chi Lai &amp; Wei-Hsiang Tseng · 逢甲大學資訊工程學系 · Electronics 2023</footer>
</section>

<h2 id="31-pytutor-%E7%B3%BB%E7%B5%B1%E6%9E%B6%E6%A7%8Bdocker-%E6%B2%99%E7%AE%B1%E8%88%87%E4%B8%89%E9%A1%9E%E6%B8%AC%E8%B3%87%E8%A8%AD%E8%A8%88">3.1 Pytutor 系統架構、Docker 沙箱與三類測資設計</h2>
<div class="fig-box" style="padding: 8px 10px; margin-bottom: 10px;">
<img src="./img/diag2_pytutor_pipeline_zh.svg" alt="Pytutor Django MVT 架構與軟體測試分析流程" style="max-height: 255px;" />
</div>
<div class="two-col">
<div class="card small-text">
<h3 id="%F0%9F%A7%AA-%E4%B8%89%E7%A8%AE%E6%B8%AC%E8%A9%A6%E6%A1%88%E4%BE%8Btest-cases"><img class="emoji" draggable="false" alt="🧪" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f9ea.svg" data-marp-twemoji=""/> 三種測試案例（Test Cases）</h3>
<ul>
<li><strong>公開測資（OTC）</strong>：教師提供之公開範例（每題 2 組），供基本功能驗證。</li>
<li><strong>自訂測資（DTC）</strong>：<strong>由學生自行設計</strong>之測試資料，在測試模式中主動發掘邊界錯誤。</li>
<li><strong>隱藏測資（HTC）</strong>：教師預先設計之評分測資（每題 5 組），於正式提交時計分。</li>
</ul>
</div>
<div class="card accent small-text">
<h3 id="%E2%9A%96%EF%B8%8F-%E5%85%A9%E5%A4%A7%E4%BD%9C%E7%AD%94%E8%A8%AD%E8%A8%88%E5%8E%9F%E5%89%87%E8%88%87%E5%AE%89%E5%85%A8%E6%A9%9F%E5%88%B6"><img class="emoji" draggable="false" alt="⚖️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/2696.svg" data-marp-twemoji=""/> 兩大作答設計原則與安全機制</h3>
<ul>
<li><strong>完成原則（Completion）</strong>：允許學生多次嘗試，直到通過所有隱藏測資。</li>
<li><strong>謹慎原則（Cautionary）</strong>：每次正式提交固定<strong>扣 3 分</strong>，遏止盲目試錯並鼓勵先用 DTC 驗證。</li>
<li><strong>Docker 隔離沙箱</strong>：每次執行獨立建立容器、數秒內自動銷毀，防範無窮迴圈與惡意程式。</li>
</ul>
</div>
</div>
<footer>薛念林（Nien-Lin Hsueh）、Lien-Chi Lai &amp; Wei-Hsiang Tseng · 逢甲大學資訊工程學系 · Electronics 2023</footer>

</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="9" data-paginate="true" data-header="&lt;div class=&quot;hdr-wrap&quot;&gt;&lt;span class=&quot;hdr-title&quot;&gt;Pytutor：線上程式設計平台與學習者測試能力研究&lt;/span&gt;&lt;div class=&quot;nav-dropdown&quot;&gt;&lt;button class=&quot;nav-btn&quot;&gt;章節導覽 ▾&lt;/button&gt;&lt;div class=&quot;nav-menu&quot;&gt;&lt;a href=&quot;#2&quot;&gt;破題：盲目提交 vs. 自訂測資&lt;/a&gt;&lt;a href=&quot;#3&quot;&gt;簡報大綱&lt;/a&gt;&lt;a href=&quot;#4&quot;&gt;1. 研究動機與問題&lt;/a&gt;&lt;a href=&quot;#6&quot;&gt;2. 文獻回顧與缺口&lt;/a&gt;&lt;a href=&quot;#7&quot;&gt;3. Pytutor 與能力指標&lt;/a&gt;&lt;a href=&quot;#11&quot;&gt;4. 課程實驗與 RQ1–RQ3&lt;/a&gt;&lt;a href=&quot;#17&quot;&gt;5. 比較、限制與教學啟示&lt;/a&gt;&lt;a href=&quot;#19&quot;&gt;6. 結論與未來研究&lt;/a&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;" data-footer="薛念林（Nien-Lin Hsueh）、Lien-Chi Lai &amp; Wei-Hsiang Tseng · 逢甲大學資訊工程學系 · Electronics 2023" data-theme="gaia" lang="C" data-marpit-pagination="9" style="--paginate:true;--header:&lt;div class=&quot;hdr-wrap&quot;&gt;&lt;span class=&quot;hdr-title&quot;&gt;Pytutor：線上程式設計平台與學習者測試能力研究&lt;/span&gt;&lt;div class=&quot;nav-dropdown&quot;&gt;&lt;button class=&quot;nav-btn&quot;&gt;章節導覽 ▾&lt;/button&gt;&lt;div class=&quot;nav-menu&quot;&gt;&lt;a href=&quot;#2&quot;&gt;破題：盲目提交 vs. 自訂測資&lt;/a&gt;&lt;a href=&quot;#3&quot;&gt;簡報大綱&lt;/a&gt;&lt;a href=&quot;#4&quot;&gt;1. 研究動機與問題&lt;/a&gt;&lt;a href=&quot;#6&quot;&gt;2. 文獻回顧與缺口&lt;/a&gt;&lt;a href=&quot;#7&quot;&gt;3. Pytutor 與能力指標&lt;/a&gt;&lt;a href=&quot;#11&quot;&gt;4. 課程實驗與 RQ1–RQ3&lt;/a&gt;&lt;a href=&quot;#17&quot;&gt;5. 比較、限制與教學啟示&lt;/a&gt;&lt;a href=&quot;#19&quot;&gt;6. 結論與未來研究&lt;/a&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;;--footer:薛念林（Nien-Lin Hsueh）、Lien-Chi Lai &amp; Wei-Hsiang Tseng · 逢甲大學資訊工程學系 · Electronics 2023;--theme:gaia;" data-marpit-pagination-total="20" data-size="16:9">
<header><div class="hdr-wrap"><span class="hdr-title">Pytutor：線上程式設計平台與學習者測試能力研究</span><div class="nav-dropdown"><button class="nav-btn">章節導覽 ▾</button><div class="nav-menu"><a href="#2">破題：盲目提交 vs. 自訂測資</a><a href="#3">簡報大綱</a><a href="#4">1. 研究動機與問題</a><a href="#6">2. 文獻回顧與缺口</a><a href="#7">3. Pytutor 與能力指標</a><a href="#11">4. 課程實驗與 RQ1–RQ3</a><a href="#17">5. 比較、限制與教學啟示</a><a href="#19">6. 結論與未來研究</a></div></div></div></header>
<h2 id="33-%E7%A8%8B%E5%BC%8F%E8%83%BD%E5%8A%9B%E9%87%8F%E5%8C%96%E6%8C%87%E6%A8%99%E7%AD%94%E9%A1%8C%E9%9F%8C%E6%80%A7iri%E8%88%87-pai">3.3 程式能力量化指標：答題韌性（<i>r</i>）與 PAI</h2>
<p>單純的作業分數無法區分「一次寫對」與「反覆試錯」的差距。本研究結合題目複雜度與挫折次數定義<strong>答題韌性（<i>r</i>）</strong>（取 `k = 0.1<code>）：</p>
<div class="formula-strip-3">
<div class="formula-box accent">
<i>r</i> &nbsp;=&nbsp; <i>e</i><sup><i>k</i> × (<i>tr</i> − <i>ch<sub>p</sub></i>)</sup>
</div>
<div class="formula-box">
<i>s</i> &nbsp;=&nbsp; <i>base</i> + (100 − <i>base</i>) × <i>p</i>
</div>
<div class="formula-box teal">
<i>PAI</i> &nbsp;=&nbsp; <span class="frac"><span class="frac-num"><i>s</i></span><span class="frac-den"><i>r</i></span></span>
</div>
</div>
<div class="split55">
<div class="left">
<div class="fig-box">
<img src="./img/fig6_pai.png" alt="圖 6：答題韌性 r 對程式能力指標 PAI 之影響" style="max-height: 315px;" />
<div class="fig-cap">圖 6：答題韌性 <i>r</i> 與程式能力指標（PAI）之函數曲線</div>
</div>
</div>
<div class="right small-text">
<h3 id="%F0%9F%93%88-%E6%8C%87%E6%A8%99%E5%AE%9A%E7%BE%A9%E8%88%87%E8%A7%A3%E8%AE%80"><img class="emoji" draggable="false" alt="📈" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4c8.svg" data-marp-twemoji=""/> 指標定義與解讀</h3>
<ul>
<li><strong></code>tr`</strong>：挫折嘗試次數（包含語法錯誤與未通過全部 HTC 之提交）。</li>
<li><strong><code>ch<sub>p</sub></code></strong>：題目挑戰度（依程式 <code>p</code> 之決策數／迴圈複雜度計算）。</li>
<li><strong>韌性原點（<code>tr = ch<sub>p</sub></code>，<code>r = 1</code>）</strong>：<code>r &gt; 1</code> 表示遭遇顯著挫折仍堅持嘗試；<code>r &lt; 1</code> 表示解題效率優於預期。</li>
<li><strong>雙重意涵</strong>：同分下遭遇越少挫折者 <code>PAI = s / r</code> 越高，代表程式寫作越穩健。</li>
<li><strong>課程平均</strong>：全體平均 <code>PAI = 121.80</code>（大於滿分 100），顯示多數題目能高效率完成。</li>
</ul>
</div>
</div>
<footer>薛念林（Nien-Lin Hsueh）、Lien-Chi Lai &amp; Wei-Hsiang Tseng · 逢甲大學資訊工程學系 · Electronics 2023</footer>

</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="10" data-paginate="true" data-header="&lt;div class=&quot;hdr-wrap&quot;&gt;&lt;span class=&quot;hdr-title&quot;&gt;Pytutor：線上程式設計平台與學習者測試能力研究&lt;/span&gt;&lt;div class=&quot;nav-dropdown&quot;&gt;&lt;button class=&quot;nav-btn&quot;&gt;章節導覽 ▾&lt;/button&gt;&lt;div class=&quot;nav-menu&quot;&gt;&lt;a href=&quot;#2&quot;&gt;破題：盲目提交 vs. 自訂測資&lt;/a&gt;&lt;a href=&quot;#3&quot;&gt;簡報大綱&lt;/a&gt;&lt;a href=&quot;#4&quot;&gt;1. 研究動機與問題&lt;/a&gt;&lt;a href=&quot;#6&quot;&gt;2. 文獻回顧與缺口&lt;/a&gt;&lt;a href=&quot;#7&quot;&gt;3. Pytutor 與能力指標&lt;/a&gt;&lt;a href=&quot;#11&quot;&gt;4. 課程實驗與 RQ1–RQ3&lt;/a&gt;&lt;a href=&quot;#17&quot;&gt;5. 比較、限制與教學啟示&lt;/a&gt;&lt;a href=&quot;#19&quot;&gt;6. 結論與未來研究&lt;/a&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;" data-footer="薛念林（Nien-Lin Hsueh）、Lien-Chi Lai &amp; Wei-Hsiang Tseng · 逢甲大學資訊工程學系 · Electronics 2023" data-theme="gaia" lang="C" data-marpit-pagination="10" style="--paginate:true;--header:&lt;div class=&quot;hdr-wrap&quot;&gt;&lt;span class=&quot;hdr-title&quot;&gt;Pytutor：線上程式設計平台與學習者測試能力研究&lt;/span&gt;&lt;div class=&quot;nav-dropdown&quot;&gt;&lt;button class=&quot;nav-btn&quot;&gt;章節導覽 ▾&lt;/button&gt;&lt;div class=&quot;nav-menu&quot;&gt;&lt;a href=&quot;#2&quot;&gt;破題：盲目提交 vs. 自訂測資&lt;/a&gt;&lt;a href=&quot;#3&quot;&gt;簡報大綱&lt;/a&gt;&lt;a href=&quot;#4&quot;&gt;1. 研究動機與問題&lt;/a&gt;&lt;a href=&quot;#6&quot;&gt;2. 文獻回顧與缺口&lt;/a&gt;&lt;a href=&quot;#7&quot;&gt;3. Pytutor 與能力指標&lt;/a&gt;&lt;a href=&quot;#11&quot;&gt;4. 課程實驗與 RQ1–RQ3&lt;/a&gt;&lt;a href=&quot;#17&quot;&gt;5. 比較、限制與教學啟示&lt;/a&gt;&lt;a href=&quot;#19&quot;&gt;6. 結論與未來研究&lt;/a&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;;--footer:薛念林（Nien-Lin Hsueh）、Lien-Chi Lai &amp; Wei-Hsiang Tseng · 逢甲大學資訊工程學系 · Electronics 2023;--theme:gaia;" data-marpit-pagination-total="20" data-size="16:9">
<header><div class="hdr-wrap"><span class="hdr-title">Pytutor：線上程式設計平台與學習者測試能力研究</span><div class="nav-dropdown"><button class="nav-btn">章節導覽 ▾</button><div class="nav-menu"><a href="#2">破題：盲目提交 vs. 自訂測資</a><a href="#3">簡報大綱</a><a href="#4">1. 研究動機與問題</a><a href="#6">2. 文獻回顧與缺口</a><a href="#7">3. Pytutor 與能力指標</a><a href="#11">4. 課程實驗與 RQ1–RQ3</a><a href="#17">5. 比較、限制與教學啟示</a><a href="#19">6. 結論與未來研究</a></div></div></div></header>
<h2 id="34-%E6%B8%AC%E8%A9%A6%E8%83%BD%E5%8A%9B%E9%87%8F%E5%8C%96%E6%8C%87%E6%A8%99tqi-%E8%88%87-tei">3.4 測試能力量化指標：TQI 與 TEI</h2>
<p>結合<strong>分支覆蓋率（<code>b<sub>t</sub></code>）<strong>與</strong>突變分數（<code>ms<sub>t</sub></code>）</strong>，衡量學習者自訂測資（DTC）相對於公開測資（OTC）所帶來的品質提升與效率：</p>
<div class="formula-strip-3">
<div class="formula-box">
<i>TQI<sub>t</sub></i> &nbsp;=&nbsp; √(<i>b<sub>t</sub></i> × <i>ms<sub>t</sub></i>)
</div>
<div class="formula-box">
<i>TQI</i><sup>+</sup> &nbsp;=&nbsp; <span class="frac"><span class="frac-num"><i>TQI<sub>OD</sub></i></span><span class="frac-den"><i>TQI<sub>O</sub></i></span></span>
</div>
<div class="formula-box teal">
<i>TEI</i> = 1 (<i>te</i>=<i>te<sub>o</sub></i>) &nbsp;|&nbsp; <i>TQI</i><sup>+</sup>(1 + <i>e</i><sup>−<i>k</i>(<i>te</i>−<i>ch<sub>t</sub></i>)</sup>)
</div>
</div>
<div class="split55">
<div class="left">
<div class="fig-box">
<img src="./img/fig7_tei.png" alt="圖 7：參數 k 與測資數量對 TEI 之影響" style="max-height: 315px;" />
<div class="fig-cap">圖 7：權重係數 <i>k</i> (= 0.1) 與測資數量對測試效率指標（TEI）之影響</div>
</div>
</div>
<div class="right small-text">
<h3 id="%F0%9F%8E%AF-tqisupsup-%E8%88%87-tei-%E8%A8%AD%E8%A8%88%E5%B7%A7%E6%80%9D"><img class="emoji" draggable="false" alt="🎯" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f3af.svg" data-marp-twemoji=""/> TQI<sup>+</sup> 與 TEI 設計巧思</h3>
<ul>
<li><strong><code>TQI<sub>OD</sub> / TQI<sub>O</sub></code></strong>：量化加入學生自訂測資（DTC）後，分支覆蓋與突變抓錯能力的增益倍率。</li>
<li><strong>基礎保障機制</strong>：僅使用公開測資（<code>te = te<sub>o</sub></code>）預設 <code>TEI = 1</code>；公式採 <code>1 + e<sup>−k(te−ch<sub>t</sub>)</sup></code> 確保願意自訂測資者不會反而低於基準值 1。</li>
<li><strong>精準效率加權</strong>：能以<strong>較少測資</strong>（<code>te &lt; ch<sub>t</sub></code>）達成同等 <code>TQI<sup>+</sup></code> 者，獲得更高 <code>TEI</code>。</li>
<li><strong>課程平均</strong>：全體平均 <code>TEI = 1.89</code>，反映多數題次測試意願或效率仍偏低。</li>
</ul>
</div>
</div>

<header><div class="hdr-wrap"><span class="hdr-title">Pytutor：線上程式設計平台與學習者測試能力研究</span><div class="nav-dropdown"><button class="nav-btn">章節導覽 ▾</button><div class="nav-menu"><a href="#2">破題：盲目提交 vs. 自訂測資</a><a href="#3">簡報大綱</a><a href="#4">1. 研究動機與問題</a><a href="#6">2. 文獻回顧與缺口</a><a href="#7">3. Pytutor 與能力指標</a><a href="#11">4. 課程實驗與 RQ1–RQ3</a><a href="#17">5. 比較、限制與教學啟示</a><a href="#19">6. 結論與未來研究</a></div></div></div></header>
<h2 id="41-%E8%AA%B2%E7%A8%8B%E5%AF%A6%E9%A9%97%E8%A8%AD%E8%A8%88%E5%8F%83%E8%88%87%E8%80%85%E8%88%87-50-%E9%A1%8C-tqi-%E5%88%86%E4%BD%88">4.1 課程實驗設計、參與者與 50 題 TQI 分佈</h2>
<div class="split55">
<div class="left small-text">
<h3 id="%F0%9F%93%9A-7-%E9%80%B1%E9%9D%9E%E5%90%8C%E6%AD%A5%E7%B7%9A%E4%B8%8A-python-%E8%AA%B2%E7%A8%8B"><img class="emoji" draggable="false" alt="📚" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4da.svg" data-marp-twemoji=""/> 7 週非同步線上 Python 課程</h3>
<ul>
<li><strong>課程架構</strong>：<strong>OpenEdu</strong> 7 大單元（<strong>64 支教學影片</strong>）＋ <strong>Pytutor</strong>（<strong>50 道練習題</strong>）＋ 5 次實體討論會 ＋ MS Teams 即時問答。</li>
<li><strong>題庫規格</strong>：平均迴圈複雜度 <strong>4.06</strong>；每題含 <strong>2 組 OTC</strong> 與 <strong>5 組 HTC</strong>（公開測資平均分支覆蓋率 <strong>0.92</strong>、突變分數 <strong>0.75</strong>）。</li>
<li><strong>參與對象</strong>：共 <strong>69 人選修</strong>（資訊系 27 人、非資訊系 42 人；54 人曾學過程式、15 人學過 Python）；排除後期無活動者後，有效分析 <strong>61 人</strong>（資訊 26 人、非資訊 35 人）。</li>
<li><strong>雙軌評量</strong>：<strong>形成性評量</strong>（50 題平均）與<strong>總結性評量</strong>（40 分鐘 4 題期末上機考）。</li>
</ul>
</div>
<div class="right">
<div class="fig-box">
<img src="./img/fig8_tqi_dist.png" alt="圖 8：50 道練習題之公開測資 TQI 分佈" style="max-height: 335px;" />
<div class="fig-cap">圖 8：50 道題目原始 OTC 之 TQI 分佈（部分低 TQI 題目亟需學生自訂 DTC 補強）</div>
</div>
</div>
</div>

<h2 id="44-rq2b-%E5%AF%A6%E8%AD%89%E7%B5%90%E6%9E%9C%E5%BD%A2%E6%88%90%E6%80%A7%E8%A9%95%E9%87%8F%E5%B9%B3%E6%99%82%E7%B7%B4%E7%BF%92%E9%9A%8E%E6%AE%B5">4.4 RQ2b 實證結果：形成性評量（平時練習階段）</h2>
<p>依形成性評量中位數（<strong>84.08 分</strong>）將 61 位學生分為<strong>高分組（31 人）<strong>與</strong>低分組（30 人）</strong>：</p>
<div class="split55">
<div class="left">
<div class="fig-box">
<img src="./img/fig13_formative_cats.png" alt="圖 13：形成性評量高低分組於四類能力之人數分佈" style="max-height: 300px;" />
<div class="fig-cap">圖 13：形成性評量高分組 31 人中，高達 21 人具備高測試能力（HT）</div>
</div>
</div>
<div class="right">
<div class="fig-box">
<img src="./img/fig14_formative_box.png" alt="圖 14：形成性評量高低分組之指標盒鬚圖" style="max-height: 300px;" />
<div class="fig-cap">圖 14：Mann–Whitney U — <i>r</i>: <i>p</i> = 0.153 · <b>PAI: <i>p</i> = 0.035*</b> · <b>TEI: <i>p</i> = 0.036*</b></div>
</div>
</div>
</div>
<div class="callout" style="margin-top: 8px;">
<strong>RQ2b 發現：</strong>在 50 題形成性練習階段，<strong>程式能力（PAI, <i>p</i> = 0.035）與測試能力（TEI, <i>p</i> = 0.036）皆與高分顯著相關</strong>。即使程式能力較弱，只要具備高測試能力，仍能拿下優異平時成績（<strong>LPHT 組有 12 人進入高分組</strong>）！
</div>

<h2 id="45-rq2c-%E5%AF%A6%E8%AD%89%E7%B5%90%E6%9E%9C%E7%B8%BD%E7%B5%90%E6%80%A7%E8%A9%95%E9%87%8F%E9%99%90%E6%99%82%E6%9C%9F%E6%9C%AB%E4%B8%8A%E6%A9%9F%E8%80%83">4.5 RQ2c 實證結果：總結性評量（限時期末上機考）</h2>
<p>依期末考中位數（<strong>77.93 分</strong>；限時 <strong>40 分鐘</strong>完成 4 題）分為<strong>高分組（31 人）<strong>與</strong>低分組（30 人）</strong>：</p>
<div class="split55">
<div class="left">
<div class="fig-box">
<img src="./img/fig15_summative_cats.png" alt="圖 15：總結性評量高低分組於四類能力之人數分佈" style="max-height: 300px;" />
<div class="fig-cap">圖 15：期末考高分組 31 人中，高程式能力（HP）佔 18 人</div>
</div>
</div>
<div class="right">
<div class="fig-box">
<img src="./img/fig16_summative_box.png" alt="圖 16：總結性評量高低分組之指標盒鬚圖" style="max-height: 300px;" />
<div class="fig-cap">圖 16：Mann–Whitney U — <i>r</i>: <i>p</i> = 0.105 · <b>PAI: <i>p</i> = 0.016*</b> · TEI: <i>p</i> = 0.93 (n.s.)</div>
</div>
</div>
</div>
<div class="callout" style="margin-top: 8px;">
<strong>RQ2c 發現：</strong>在嚴格的 **40 分鐘期末考時間壓力**下，僅**程式能力（PAI, <i>p</i> = 0.016）**呈現顯著差異，TEI 則無差異（<i>p</i> = 0.93）。因作答時間緊迫，學生較難設計高品質 DTC，使寫作熟練度成為勝負關鍵。
</div>
<footer>薛念林（Nien-Lin Hsueh）、Lien-Chi Lai &amp; Wei-Hsiang Tseng · 逢甲大學資訊工程學系 · Electronics 2023</footer>

<div class="split55">
<div class="left">
<div class="fig-box">
<img src="./img/fig17_corr_ability.png" alt="圖 17：能力指標間之 Spearman 等級相關熱圖" style="max-height: 310px;" />
<div class="fig-cap">圖 17：<i>r</i>、PAI 與 TEI 三項能力指標之 Spearman 相關熱圖</div>

</div>

<div class="fig-box">

</div>
</div>
<div class="callout" style="margin-top: 8px;">
<strong>核心相關脈絡：</strong>
(1) <b><i>r</i> ↔ TEI (+0.50)</b>：出錯頻率越高越會透過多輪測試除錯；<b>PAI ↔ TEI (−0.39)</b> 證實寫作與測試屬不同能力。
(2) <b>影片完看率 ↔ TEI (+0.33)</b>：完整看片者更願意仔細測試；<b>播放倍速 ↔ PAI (−0.24)</b>：過度快轉看片容易導致寫程式出錯。

<header><div class="hdr-wrap"><span class="hdr-title">Pytutor：線上程式設計平台與學習者測試能力研究</span><div class="nav-dropdown"><button class="nav-btn">章節導覽 ▾</button><div class="nav-menu"><a href="#2">破題：盲目提交 vs. 自訂測資</a><a href="#3">簡報大綱</a><a href="#4">1. 研究動機與問題</a><a href="#6">2. 文獻回顧與缺口</a><a href="#7">3. Pytutor 與能力指標</a><a href="#11">4. 課程實驗與 RQ1–RQ3</a><a href="#17">5. 比較、限制與教學啟示</a><a href="#19">6. 結論與未來研究</a></div></div></div></header>
<h2 id="51-%E8%88%87%E5%89%8D%E4%BA%BA%E7%A0%94%E7%A9%B6%E4%B9%8B%E6%AF%94%E8%BC%83%E8%88%87%E7%A0%94%E7%A9%B6%E9%99%90%E5%88%B6">5.1 與前人研究之比較與研究限制</h2>
<div class="two-col">
<div class="card teal small-text">
<h3 id="%F0%9F%94%8D-%E8%88%87-yang-et-al-2020-11-%E4%B9%8B%E5%B0%8D%E7%85%A7"><img class="emoji" draggable="false" alt="🔍" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f50d.svg" data-marp-twemoji=""/> 與 Yang et al. (2020) [11] 之對照</h3>
<ul>
<li><strong>一致的核心結論</strong>：兩研究皆證實<strong>程式能力強不代表測試能力強</strong>——近半數程式好手測試能力偏低，而程式較弱者亦可能展現優異測試力。</li>
<li><strong>前人情境</strong>：Yang et al. 以具備測試訓練的資工系大學生為對象，於限時內完成 <strong>3 項作業</strong>並以單元測試評分。</li>
<li><strong>本研究突破</strong>：在 Pytutor 上擴展至 <strong>50 題隨時可練之題庫</strong>，涵蓋<strong>資訊與非資訊初學者</strong>，並串聯 OpenEdu 影音歷程進行全方位剖析。</li>
</ul>
</div>
<div class="card accent small-text">
<h3 id="%E2%9A%A0%EF%B8%8F-%E4%B8%89%E9%A0%85%E7%A0%94%E7%A9%B6%E9%99%90%E5%88%B6"><img class="emoji" draggable="false" alt="⚠️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/26a0.svg" data-marp-twemoji=""/> 三項研究限制</h3>
<ol>
<li><strong>公開測資基準偏高</strong>：部分題目之原始 <code>TQI<sub>O</sub></code> 已超過 80，使學生自訂 DTC 之提升空間受限，壓縮 <code>TEI</code> 變化幅度。</li>
<li><strong>未正式教授測試方法</strong>：課程僅教導基礎 Python，尚未融入邊界值或等價類等測試理論，故 TEI 反映的是「自然測試敏感度」。</li>
<li><strong>本機端開發行為盲區</strong>：系統目前無法記錄學生是否在**本機編輯器（IDE）**寫完並測試完畢後，才貼上平台提交。</li>
</ol>
</div>
</div>

<header><div class="hdr-wrap"><span class="hdr-title">Pytutor：線上程式設計平台與學習者測試能力研究</span><div class="nav-dropdown"><button class="nav-btn">章節導覽 ▾</button><div class="nav-menu"><a href="#2">破題：盲目提交 vs. 自訂測資</a><a href="#3">簡報大綱</a><a href="#4">1. 研究動機與問題</a><a href="#6">2. 文獻回顧與缺口</a><a href="#7">3. Pytutor 與能力指標</a><a href="#11">4. 課程實驗與 RQ1–RQ3</a><a href="#17">5. 比較、限制與教學啟示</a><a href="#19">6. 結論與未來研究</a></div></div></div></header>
<h2 id="52-%E5%B0%8D%E7%A8%8B%E5%BC%8F%E8%A8%AD%E8%A8%88%E6%95%99%E5%AD%B8%E4%B9%8B%E4%B8%89%E9%A0%85%E5%85%B7%E9%AB%94%E5%BB%BA%E8%AD%B0">5.2 對程式設計教學之三項具體建議</h2>
<p>根據 61 位學生於 50 道練習題的實證證據，本研究對程式設計教師與課程設計者提出以下建議：</p>
<div class="three-col" style="margin-top: 10px;">
<div class="card small-text">
<h3 id="1-%E4%B8%8D%E5%88%86%E7%A7%91%E7%B3%BB%E5%85%A8%E9%9D%A2%E8%9E%8D%E5%85%A5%E6%B8%AC%E8%A9%A6%E6%95%99%E5%AD%B8">1. 不分科系全面融入測試教學</h3>
<ul>
<li>在臺灣現行教育脈絡下，資訊系學生的測試能力<strong>並未優於非資訊系</strong>（<code>p = 0.277</code>）。</li>
<li>應在初階程式課同步教授黑箱與邊界測試觀念，協助程式較弱的學習者透過測試補齊實力。</li>
</ul>
</div>
<div class="card teal small-text">
<h3 id="2-%E5%B0%87%E6%95%99%E5%AD%B8%E5%BD%B1%E7%89%87%E6%8B%86%E5%88%86%E7%82%BA%E5%BE%AE%E7%9F%A5%E8%AD%98%E5%96%AE%E5%85%83">2. 將教學影片拆分為微知識單元</h3>
<ul>
<li>學習者平均僅看 <strong>56%</strong> 影片且開 <strong>2.08 倍速</strong>，而快轉與程式能力呈負相關（<code>−0.24</code>）。</li>
<li>建議將長影片依<strong>單一知識點切分為精短微單元</strong>，維持專注度並減少觀念遺漏。</li>
</ul>
</div>
<div class="card accent small-text">
<h3 id="3-%E8%A8%AD%E8%A8%88%E9%9C%80%E8%A6%81%E8%87%AA%E8%A8%82%E6%B8%AC%E8%B3%87%E7%9A%84%E7%B7%B4%E7%BF%92%E9%A1%8C">3. 設計「需要自訂測資」的練習題</h3>
<ul>
<li>適度控制公開測資覆蓋率（如 <code>TQI<sub>O</sub> &lt; 70</code>），引導學生主動思考遺漏情境並撰寫 DTC。</li>
<li>結合**謹慎原則（扣 3 分）**與即時測試覆蓋回饋，讓「先測再交」內化為開發習慣。</li>
</ul>
</div>
</div>

<h2 id="6-%E7%B5%90%E8%AB%96%E8%88%87%E6%9C%AA%E4%BE%86%E7%A0%94%E7%A9%B6%E6%96%B9%E5%90%91">6. 結論與未來研究方向</h2>
<div class="fig-box" style="padding: 8px 10px; margin-bottom: 8px;">
<img src="./img/diag3_rq_conclusions_zh.svg" alt="Pytutor RQ1-RQ3 實證結論視覺化總結" style="max-height: 355px;" />
</div>
<div class="future-strip">
<div class="future-pill"><strong>🤖 1. AI 虛擬教學助理</strong><br />導入生成式 AI 扮演蘇格拉底式引導助教，啟發學生思考邊界測資，而非直接給予標準答案。</div>
<div class="future-pill"><strong>💻 2. 強化線上編輯器與細部歷程</strong><br />提升網頁端寫程式體驗以留住學生於平台內開發，蒐集更細緻的編輯與除錯行為資料。</div>
<div class="future-pill"><strong>🧪 3. 實驗組 vs. 對照組實證</strong><br />於未來課程進行分組對照實驗，嚴謹驗證「融入測試概念之 OJ 系統」對學習成效的因果貢獻。</div>
</div>
