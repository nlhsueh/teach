<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" width="110" height="110">
  <rect x="3" y="3" width="104" height="104" rx="14" fill="#eff6ff" stroke="#bfdbfe" stroke-width="2"/>
  <!-- Balance scale: Quality vs Token Cost -->
  <line x1="55" y1="22" x2="55" y2="78" stroke="#1b365d" stroke-width="2.8"/>
  <line x1="36" y1="78" x2="74" y2="78" stroke="#1b365d" stroke-width="3" stroke-linecap="round"/>
  <line x1="22" y1="36" x2="88" y2="28" stroke="#1b365d" stroke-width="2.6"/>
  <!-- Left pan (Quality) -->
  <line x1="26" y1="36" x2="26" y2="54" stroke="#0f766e" stroke-width="1.8"/>
  <rect x="14" y="54" width="26" height="16" rx="4" fill="#0f766e"/>
  <text x="27" y="65" text-anchor="middle" font-family="Inter, sans-serif" font-size="8.5" font-weight="800" fill="#ffffff">IRE</text>
  <!-- Right pan (Cost) -->
  <line x1="84" y1="29" x2="84" y2="48" stroke="#8c1d40" stroke-width="1.8"/>
  <rect x="70" y="48" width="28" height="16" rx="4" fill="#8c1d40"/>
  <text x="84" y="59" text-anchor="middle" font-family="Inter, sans-serif" font-size="8.5" font-weight="800" fill="#ffffff">$$$</text>
  <text x="55" y="97" text-anchor="middle" font-family="Inter, sans-serif" font-size="10" font-weight="800" fill="#1b365d">COST-BENEFIT</text>
</svg>
