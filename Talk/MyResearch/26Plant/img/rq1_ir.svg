<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" width="110" height="110">
  <rect x="3" y="3" width="104" height="104" rx="14" fill="#f0fdfa" stroke="#99d6cd" stroke-width="2"/>
  <!-- Iceberg tip (explicit) vs underwater (implicit NFRs) -->
  <line x1="12" y1="48" x2="98" y2="48" stroke="#0f766e" stroke-width="2" stroke-dasharray="4,2"/>
  <polygon points="55,18 39,48 71,48" fill="#cbd5e1" stroke="#475569" stroke-width="1.8"/>
  <polygon points="39,48 71,48 86,82 24,82" fill="#0f766e" fill-opacity="0.22" stroke="#0f766e" stroke-width="2.2"/>
  <!-- Magnifying glass on underwater part -->
  <circle cx="55" cy="64" r="11" fill="#ffffff" fill-opacity="0.85" stroke="#8c1d40" stroke-width="2.6"/>
  <line x1="63" y1="72" x2="73" y2="82" stroke="#8c1d40" stroke-width="3.2" stroke-linecap="round"/>
  <text x="55" y="97" text-anchor="middle" font-family="Inter, sans-serif" font-size="10" font-weight="800" fill="#0f766e">IMPLICIT IRs</text>
</svg>
