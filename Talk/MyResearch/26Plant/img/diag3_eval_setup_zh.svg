<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 225" width="1120" height="225">
  <defs>
    <marker id="arr-e" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#1b365d"/>
    </marker>
  </defs>
  <style>
    text { font-family: 'Noto Sans TC', 'PingFang TC', -apple-system, sans-serif; }
    .sh { font-size: 12px; font-weight: 800; fill: #ffffff; }
    .sb { font-size: 19px; font-weight: 800; }
    .st { font-size: 13px; font-weight: 700; fill: #0f172a; }
    .ss { font-size: 11.5px; fill: #475569; }
  </style>

  <rect x="10" y="12" width="248" height="200" rx="10" fill="#f0fdfa" stroke="#0f766e" stroke-width="2"/>
  <rect x="10" y="12" width="248" height="30" rx="10" fill="#0f766e"/>
  <rect x="10" y="32" width="248" height="10" fill="#0f766e"/>
  <text x="134" y="32" text-anchor="middle" class="sh">1. RQ1 基準資料集</text>
  <text x="134" y="76" text-anchor="middle" class="sb" fill="#0f766e">5 系統 · 103 隱性需求</text>
  <text x="134" y="100" text-anchor="middle" class="st">擴充版 ReqElicitGym</text>
  <text x="134" y="124" text-anchor="middle" class="ss">• 股市、醫院、訂票、單字學習</text>
  <text x="134" y="144" text-anchor="middle" class="ss">• ＋ 外送平台案例（19 IRs）</text>
  <text x="134" y="164" text-anchor="middle" class="ss">• 依 ISO 25010 擴充 NFR 面向</text>
  <text x="134" y="190" text-anchor="middle" font-size="11.5" font-weight="700" fill="#0f766e">涵蓋 9 大需求品質面向</text>

  <line x1="258" y1="112" x2="288" y2="112" stroke="#1b365d" stroke-width="2.4" marker-end="url(#arr-e)"/>

  <rect x="294" y="12" width="248" height="200" rx="10" fill="#fdf2f5" stroke="#8c1d40" stroke-width="2"/>
  <rect x="294" y="12" width="248" height="30" rx="10" fill="#8c1d40"/>
  <rect x="294" y="32" width="248" height="10" fill="#8c1d40"/>
  <text x="418" y="32" text-anchor="middle" class="sh">2. RQ2 衝突基準集</text>
  <text x="418" y="76" text-anchor="middle" class="sb" fill="#8c1d40">100 組需求配對</text>
  <text x="418" y="100" text-anchor="middle" class="st">CN 資料集 ＋ 自建平衡集</text>
  <text x="418" y="124" text-anchor="middle" class="ss">• 醫院管理：70 組配對</text>
  <text x="418" y="144" text-anchor="middle" class="ss">  （35 衝突 / 35 中性）</text>
  <text x="418" y="164" text-anchor="middle" class="ss">• 外送平台：30 組配對</text>
  <text x="418" y="190" text-anchor="middle" font-size="11.5" font-weight="700" fill="#8c1d40">各獨立執行 3 次（Mean ± Std）</text>

  <line x1="542" y1="112" x2="572" y2="112" stroke="#1b365d" stroke-width="2.4" marker-end="url(#arr-e)"/>

  <rect x="578" y="12" width="248" height="200" rx="10" fill="#f8fafc" stroke="#1b365d" stroke-width="2"/>
  <rect x="578" y="12" width="248" height="30" rx="10" fill="#1b365d"/>
  <rect x="578" y="32" width="248" height="10" fill="#1b365d"/>
  <text x="702" y="32" text-anchor="middle" class="sh">3. 公平控制設定</text>
  <text x="702" y="76" text-anchor="middle" class="sb" fill="#1b365d">雙底層 LLM 測試</text>
  <text x="702" y="100" text-anchor="middle" class="st">GPT-4.1 ＆ Gemini 3 Flash</text>
  <text x="702" y="124" text-anchor="middle" class="ss">• Temperature = 0、上限 20 輪</text>
  <text x="702" y="144" text-anchor="middle" class="ss">• 關閉 HITL（0 次人工介入）</text>
  <text x="702" y="164" text-anchor="middle" class="ss">• 獨立 GPT-5.2 擔任裁判</text>
  <text x="702" y="190" text-anchor="middle" font-size="11.5" font-weight="700" fill="#1b365d">對比同底層單一代理人基線</text>

  <line x1="826" y1="112" x2="856" y2="112" stroke="#1b365d" stroke-width="2.4" marker-end="url(#arr-e)"/>

  <rect x="862" y="12" width="248" height="200" rx="10" fill="#eff6ff" stroke="#1b365d" stroke-width="2"/>
  <rect x="862" y="12" width="248" height="30" rx="10" fill="#1b365d"/>
  <rect x="862" y="32" width="248" height="10" fill="#1b365d"/>
  <text x="986" y="32" text-anchor="middle" class="sh">4. 量化評估指標</text>
  <text x="986" y="74" text-anchor="middle" class="st">三大核心量測面向</text>
  <text x="880" y="104" class="ss">• <tspan font-weight="700" fill="#0f766e">RQ1：</tspan>Turns、IRE (%)、TKQR (%)</text>
  <text x="880" y="128" class="ss">• <tspan font-weight="700" fill="#8c1d40">RQ2：</tspan>總體 Macro F1 與</text>
  <text x="892" y="146" class="ss">衝突類別 Precision / Recall / F1</text>
  <text x="880" y="170" class="ss">• <tspan font-weight="700" fill="#1b365d">RQ3：</tspan>Tokens、耗時、API 費用</text>
  <text x="892" y="188" class="ss">與每百萬 Token IRE 增益</text>
</svg>
