<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 340" width="1120" height="340">
  <defs>
    <marker id="arr-r" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#8c1d40"/>
    </marker>
    <marker id="arr-t" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0f766e"/>
    </marker>
  </defs>
  <style>
    text { font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; }
    .pt { font-size: 15.5px; font-weight: 800; fill: #ffffff; }
    .nt { font-size: 13.5px; font-weight: 700; fill: #0f172a; }
    .ns { font-size: 11.8px; fill: #475569; }
    .pill { font-size: 11.5px; font-weight: 700; }
  </style>

  <!-- LEFT: Single-Agent Bottleneck -->
  <rect x="10" y="10" width="530" height="320" rx="12" fill="#fdf2f5" stroke="#e2a8b8" stroke-width="1.6"/>
  <rect x="10" y="10" width="530" height="40" rx="12" fill="#8c1d40"/>
  <rect x="10" y="38" width="530" height="12" fill="#8c1d40"/>
  <text x="275" y="36" text-anchor="middle" class="pt">Single-Agent LLM Paradigm (Baseline)</text>

  <rect x="34" y="74" width="150" height="72" rx="8" fill="#ffffff" stroke="#8c1d40" stroke-width="2"/>
  <text x="109" y="104" text-anchor="middle" class="nt">Single LLM</text>
  <text x="109" y="124" text-anchor="middle" class="ns">1 Role · ~6 Turns</text>

  <line x1="184" y1="110" x2="226" y2="110" stroke="#8c1d40" stroke-width="2.4" marker-end="url(#arr-r)"/>

  <rect x="232" y="68" width="286" height="84" rx="8" fill="#ffffff" stroke="#e2a8b8" stroke-width="1.6"/>
  <text x="375" y="92" text-anchor="middle" font-size="13" font-weight="800" fill="#8c1d40">Two Cognitive Failure Modes</text>
  <text x="248" y="114" class="ns">• <tspan font-weight="700" fill="#0f172a">Sycophancy Bias:</tspan> aligns with 1 viewpoint</text>
  <text x="248" y="136" class="ns">• <tspan font-weight="700" fill="#0f172a">Premature Convergence:</tspan> stops at surface UI</text>

  <!-- Missed NFR boxes -->
  <rect x="34" y="176" width="484" height="106" rx="10" fill="#ffffff" stroke="#8c1d40" stroke-width="1.6" stroke-dasharray="5,3"/>
  <text x="276" y="200" text-anchor="middle" font-size="13" font-weight="800" fill="#8c1d40">Blind Spots in Early Requirements Engineering</text>
  <rect x="52" y="216" width="138" height="46" rx="6" fill="#fdf2f5" stroke="#e2a8b8"/>
  <text x="121" y="236" text-anchor="middle" class="pill" fill="#8c1d40">0% Reliability</text>
  <text x="121" y="253" text-anchor="middle" font-size="11" fill="#64748b">&amp; Safety NFRs</text>

  <rect x="206" y="216" width="138" height="46" rx="6" fill="#fdf2f5" stroke="#e2a8b8"/>
  <text x="275" y="236" text-anchor="middle" class="pill" fill="#8c1d40">20–38% Missed</text>
  <text x="275" y="253" text-anchor="middle" font-size="11" fill="#64748b">Subtle Conflicts</text>

  <rect x="360" y="216" width="142" height="46" rx="6" fill="#fdf2f5" stroke="#e2a8b8"/>
  <text x="431" y="236" text-anchor="middle" class="pill" fill="#8c1d40">No Traceability</text>
  <text x="431" y="253" text-anchor="middle" font-size="11" fill="#64748b">No Design Rationale</text>

  <text x="275" y="310" text-anchor="middle" font-size="12.8" font-weight="700" fill="#8c1d40">Fast coding cannot fix incomplete or conflicting SRS</text>

  <!-- VS -->
  <circle cx="560" cy="170" r="19" fill="#1b365d"/>
  <text x="560" y="175" text-anchor="middle" font-size="13" font-weight="800" fill="#ffffff">VS</text>

  <!-- RIGHT: PLANT Multi-Agent Team -->
  <rect x="580" y="10" width="530" height="320" rx="12" fill="#f0fdfa" stroke="#99d6cd" stroke-width="1.6"/>
  <rect x="580" y="10" width="530" height="40" rx="12" fill="#1b365d"/>
  <rect x="580" y="38" width="530" height="12" fill="#1b365d"/>
  <text x="845" y="36" text-anchor="middle" class="pt">PLANT Multi-Agent Requirements Team</text>

  <!-- 6 Role Badges -->
  <rect x="600" y="68" width="154" height="50" rx="8" fill="#ffffff" stroke="#0f766e" stroke-width="1.8"/>
  <text x="677" y="90" text-anchor="middle" font-size="12.5" font-weight="800" fill="#0f766e">User (SSP)</text>
  <text x="677" y="107" text-anchor="middle" font-size="11" fill="#475569">Multi-Stakeholders</text>

  <rect x="768" y="68" width="154" height="50" rx="8" fill="#ffffff" stroke="#1b365d" stroke-width="1.8"/>
  <text x="845" y="90" text-anchor="middle" font-size="12.5" font-weight="800" fill="#1b365d">Analyst</text>
  <text x="845" y="107" text-anchor="middle" font-size="11" fill="#475569">Scope &amp; Conflicts</text>

  <rect x="936" y="68" width="154" height="50" rx="8" fill="#ffffff" stroke="#8c1d40" stroke-width="1.8"/>
  <text x="1013" y="90" text-anchor="middle" font-size="12.5" font-weight="800" fill="#8c1d40">Expert</text>
  <text x="1013" y="107" text-anchor="middle" font-size="11" fill="#475569">Domain &amp; NFR Audit</text>

  <rect x="600" y="130" width="154" height="50" rx="8" fill="#ffffff" stroke="#1b365d" stroke-width="1.8"/>
  <text x="677" y="152" text-anchor="middle" font-size="12.5" font-weight="800" fill="#1b365d">Modeler</text>
  <text x="677" y="169" text-anchor="middle" font-size="11" fill="#475569">PlantUML Validation</text>

  <rect x="768" y="130" width="154" height="50" rx="8" fill="#1b365d"/>
  <text x="845" y="152" text-anchor="middle" font-size="12.5" font-weight="800" fill="#ffffff">Mediator</text>
  <text x="845" y="169" text-anchor="middle" font-size="11" fill="#cbd5e1">Adaptive Comm + HITL</text>

  <rect x="936" y="130" width="154" height="50" rx="8" fill="#ffffff" stroke="#0f766e" stroke-width="1.8"/>
  <text x="1013" y="152" text-anchor="middle" font-size="12.5" font-weight="800" fill="#0f766e">Documenter</text>
  <text x="1013" y="169" text-anchor="middle" font-size="11" fill="#475569">IEEE 29148 SRS &amp; DR</text>

  <line x1="845" y1="184" x2="845" y2="210" stroke="#0f766e" stroke-width="2.4" marker-end="url(#arr-t)"/>

  <rect x="600" y="216" width="490" height="66" rx="10" fill="#0f766e"/>
  <text x="845" y="242" text-anchor="middle" font-size="14" font-weight="800" fill="#ffffff">High-Coverage NFRs · 95.6–100% Conflict Recall</text>
  <text x="845" y="264" text-anchor="middle" font-size="12" fill="#ccfbf1">Traceable Meeting Minutes (MoM) + Design Rationale + IEEE 29148 SRS</text>

  <text x="845" y="310" text-anchor="middle" font-size="12.8" font-weight="700" fill="#0f766e">Structured specialization overcomes single-agent blind spots</text>
</svg>
