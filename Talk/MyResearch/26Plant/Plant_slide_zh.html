<h2 id="12-%E7%A0%94%E7%A9%B6%E7%9B%AE%E6%A8%99%E8%88%87%E4%B8%89%E5%A4%A7%E7%A0%94%E7%A9%B6%E5%95%8F%E9%A1%8Crq1%E2%80%93rq3">1.2 研究目標與三大研究問題（RQ1–RQ3）</h2>
<p>本研究聚焦於兩大上游需求核心任務與計算成本權衡，進行嚴謹量化評估 <em>（逐步揭曉）</em>：</p>
<div class="rq-stage">
<ul>
<li data-marpit-fragment="1">
<div class="rq-card teal"><img src="./img/rq1_ir.svg" alt="RQ1 挖掘隱性需求" /><div><div class="rq-hook"><span class="rq-tag" style="background:#0f766e;">RQ1</span> 專業分工的 AI 團隊，能挖出客戶「忘了說」的需求嗎？</div><div class="rq-q"><strong>PLANT 發掘隱性需求（Implicit Requirements）的成效為何？</strong>特別是容易被忽略的非功能性需求（NFRs）。</div></div></div>
</li>
<li data-marpit-fragment="2">
<div class="rq-card accent"><img src="./img/rq2_conflict.svg" alt="RQ2 辨識需求衝突" /><div><div class="rq-hook"><span class="rq-tag">RQ2</span> 多角色交叉審議，能否抓出暗藏的規格矛盾？</div><div class="rq-q"><strong>PLANT 辨識需求衝突（Requirement Conflicts）的準確度與召回率</strong>，相較單一代理人表現為何？</div></div></div>
</li>
<li data-marpit-fragment="3">
<div class="rq-card"><img src="./img/rq3_cost.svg" alt="RQ3 成本效益權衡" /><div><div class="rq-hook"><span class="rq-tag" style="background:#1b365d;">RQ3</span> 多代理人協作多花的時間與 Token，到底划不划算？</div><div class="rq-q"><strong>PLANT 在需求開發中的成本效益為何？</strong>（Token 消耗、執行時間、API 費用與單位需求成本）</div></div></div>
</li>
</ul>
</div>

<h2 id="31-plant-%E6%A1%86%E6%9E%B6%E7%B8%BD%E8%A6%BD%E8%88%87%E5%85%AD%E5%A4%A7%E5%B0%88%E6%A5%AD%E4%BB%A3%E7%90%86%E4%BA%BA%E8%A7%92%E8%89%B2">3.1 PLANT 框架總覽與六大專業代理人角色</h2>
<div class="split64">
<div class="left">
<div class="fig-box">
<img src="./img/fig1_overview.png" alt="Fig. 1: PLANT 框架架構總覽" style="max-height: 400px;" />
<div class="fig-cap">Fig. 1：PLANT 多代理人需求工程框架總覽</div>
</div>
</div>
<div class="right small-text">
<h3 id="%F0%9F%A4%96-%E5%85%AD%E5%A4%A7%E5%B0%88%E6%A5%AD%E4%BB%A3%E7%90%86%E4%BA%BA%E8%A7%92%E8%89%B2table-2"><img class="emoji" draggable="false" alt="🤖" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f916.svg" data-marp-twemoji=""/> 六大專業代理人角色（Table 2）</h3>
<ul>
<li><strong>User</strong>：模擬多方利害關係人第一人稱視角（使用情境與痛點）。</li>
<li><strong>Analyst</strong>：結構化需求、界定系統範疇（In/Out-of-Scope）並揪出衝突。</li>
<li><strong>Expert</strong>：檢索外部文件庫，稽核領域法規、個資保護與 ISO 25010。</li>
<li><strong>Modeler</strong>：繪製並以工具驗證 PlantUML（使用案例、類別、循序圖）。</li>
<li><strong>Mediator</strong>：規劃議程、動態切換溝通模式、遇僵局啟動 HITL 裁決。</li>
<li><strong>Documenter</strong>：彙整會議紀錄（MoM），產出 <strong>IEEE 29148 SRS</strong> 與設計理由（DR）。</li>
</ul>
</div>
</div>

<header><div class="hdr-wrap"><span class="hdr-title">PLANT：透過多代理人 AI 框架提升需求工程效率</span><div class="nav-dropdown"><button class="nav-btn">章節導覽 ▾</button><div class="nav-menu"><a href="#2">破題：單打獨鬥 vs. 團隊協作</a><a href="#3">簡報大綱</a><a href="#4">1. 研究動機與問題</a><a href="#6">2. 文獻回顧與比較</a><a href="#7">3. PLANT 框架設計</a><a href="#12">4. 實證評估與結果</a><a href="#19">5. 結論與未來研究</a></div></div></div></header>
<h2 id="32-%E5%9B%9B%E9%9A%8E%E6%AE%B5%E8%BF%AD%E4%BB%A3%E9%9C%80%E6%B1%82%E5%8D%94%E4%BD%9C%E6%B5%81%E7%A8%8B">3.2 四階段迭代需求協作流程</h2>
<div class="split55">
<div class="left">
<div class="fig-box">
<img src="./img/fig2_process.png" alt="Fig. 2: PLANT 四階段需求開發流程" style="max-height: 390px;" />
<div class="fig-cap">Fig. 2：PLANT 四階段迭代協作與產出物更新流程</div>
</div>
</div>
<div class="right small-text">
<h3 id="%F0%9F%94%84-%E5%91%8A%E5%88%A5%E5%96%AE%E6%AC%A1%E7%94%9F%E6%88%90%E7%9A%84%E8%BF%AD%E4%BB%A3%E7%B2%BE%E7%85%89"><img class="emoji" draggable="false" alt="🔄" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f504.svg" data-marp-twemoji=""/> 告別「單次生成」的迭代精煉</h3>
<ol>
<li><strong>階段一 · 同步利害關係人引出（SSP）</strong>：從初步構想出發，由 <code>User</code> 同步模擬多方角色，廣泛收集期待與痛點。</li>
<li><strong>階段二 · 多視角分析、知識稽核與建模</strong>：<code>Analyst</code> 界定範疇與衝突、<code>Expert</code> 查核法規、<code>Modeler</code> 驗證 PlantUML 並行運作。</li>
<li><strong>階段三 · 調解者引導之迭代協商</strong>：於上限 <code>r</code> 輪內由 <code>Mediator</code> 調度討論、寫入 <code>MoM</code> 並同步更新草案與模型。</li>
<li><strong>階段四 · 規格與設計理由產出</strong>：收斂後由 <code>Documenter</code> 產出符合 <strong>IEEE 29148</strong> 之 SRS 並串聯完整設計理由（DR）。</li>
</ol>
</div>
</div>

<h2 id="33-%E5%90%8C%E6%AD%A5%E5%88%A9%E5%AE%B3%E9%97%9C%E4%BF%82%E4%BA%BA%E6%8F%90%E7%A4%BAssp%E8%88%87%E5%A4%96%E9%83%A8%E7%9F%A5%E8%AD%98%E9%A9%97%E8%AD%89">3.3 同步利害關係人提示（SSP）與外部知識驗證</h2>
<div class="fig-box" style="padding: 8px 12px; margin-bottom: 10px;">
<img src="./img/fig3_ssp.png" alt="Fig. 3: Simultaneous Stakeholder Prompting (SSP)" style="max-height: 185px;" />
<div class="fig-cap">Fig. 3：同步利害關係人提示（SSP）— 獨立多角色並行發想</div>
</div>
<div class="two-col">
<div class="card small-text">
<h3 id="%F0%9F%97%A3%EF%B8%8F-%E9%81%BF%E5%85%8D%E5%81%8F%E8%AA%A4%E7%9A%84%E5%A4%9A%E8%A7%92%E8%89%B2%E4%B8%A6%E8%A1%8C%E5%BC%95%E5%87%BAssp"><img class="emoji" draggable="false" alt="🗣️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f5e3.svg" data-marp-twemoji=""/> 避免偏誤的多角色並行引出（SSP）</h3>
<ul>
<li>延伸 Solo Performance Prompting（SPP）[19]，採 <strong>Simultaneous-Talk</strong> [4] 讓不同角色（如消費者、外送員、餐廳業者）互不干擾地獨立提出需求，避免被先發言者帶偏。</li>
</ul>
</div>
<div class="card teal small-text">
<h3 id="%F0%9F%93%9A-%E5%A4%96%E9%83%A8%E9%A0%98%E5%9F%9F%E7%9F%A5%E8%AD%98%E8%88%87-plantuml-%E4%B8%80%E8%87%B4%E6%80%A7%E6%AA%A2%E6%9F%A5"><img class="emoji" draggable="false" alt="📚" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4da.svg" data-marp-twemoji=""/> 外部領域知識與 PlantUML 一致性檢查</h3>
<ul>
<li><strong>Expert</strong> 於初審與協商兩階段檢索文件庫（ISO 29148、ISO 25010、個資法規），引用具體條文佐證建議。</li>
<li><strong>Modeler</strong> 透過 PlantUML 語法與流程檢查揭露遺漏例外（例如<em>外送員接單逾時自動轉派機制</em>）。</li>
</ul>
</div>
</div>

<header><div class="hdr-wrap"><span class="hdr-title">PLANT：透過多代理人 AI 框架提升需求工程效率</span><div class="nav-dropdown"><button class="nav-btn">章節導覽 ▾</button><div class="nav-menu"><a href="#2">破題：單打獨鬥 vs. 團隊協作</a><a href="#3">簡報大綱</a><a href="#4">1. 研究動機與問題</a><a href="#6">2. 文獻回顧與比較</a><a href="#7">3. PLANT 框架設計</a><a href="#12">4. 實證評估與結果</a><a href="#19">5. 結論與未來研究</a></div></div></div></header>
<h2 id="34-%E8%AA%BF%E8%A7%A3%E8%80%85%E5%BC%95%E5%B0%8E%E4%B9%8B%E5%8D%94%E5%95%86%E6%B5%81%E7%A8%8Bmediator-guided-negotiation">3.4 調解者引導之協商流程（Mediator-Guided Negotiation）</h2>
<div class="split55">
<div class="left">
<div class="fig-box">
<img src="./img/fig4_negotiation.png" alt="Fig. 4: 調解者引導之協商流程" style="max-height: 410px;" />
<div class="fig-cap">Fig. 4：調解者引導之有限輪數協商與 HITL 升級機制</div>
</div>
</div>
<div class="right small-text">
<h3 id="%E2%9A%96%EF%B8%8F-%E7%B5%90%E6%A7%8B%E5%8C%96%E8%AD%B0%E7%A8%8B%E8%88%87%E6%9C%89%E9%99%90%E8%BC%AA%E6%95%B8%E6%94%B6%E6%96%82"><img class="emoji" draggable="false" alt="⚖️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/2696.svg" data-marp-twemoji=""/> 結構化議程與有限輪數收斂</h3>
<ul>
<li>每輪開始（<code>1 ≤ t ≤ r</code>），<strong>Mediator</strong> 檢視最新草案與衝突報告，將議題分為四大類：
<ol>
<li>開放問題探索（Open Question）</li>
<li>新需求補充（New Requirement）</li>
<li>需求權衡評估（Trade-off）</li>
<li>需求衝突解決（Conflict Discussion）</li>
</ol>
</li>
<li><strong>達成共識</strong> ➔ 記錄於會議紀錄（<code>MoM</code>），驅動草案與 UML 同步更新。</li>
<li><strong>持續僵局／重大商業權衡</strong> ➔ 彙整各方論點與候選方案，交由<strong>人類專家（HITL）</strong>裁決。</li>
</ul>
</div>
</div>

<h2 id="42-rq1-%E6%A1%88%E4%BE%8B%E5%89%96%E6%9E%90%E5%A4%96%E9%80%81%E5%B9%B3%E5%8F%B0%E4%B9%8B%E5%A4%9A%E8%A6%96%E8%A7%92%E6%B7%B1%E5%BA%A6%E6%8E%A2%E5%8B%98table-5">4.2 RQ1 案例剖析：外送平台之多視角深度探勘（Table 5）</h2>
<p>在 <strong>Simultaneous-Talk</strong> 模式下，三位代理人針對同一異常訂單情境，從各自專業視角獨立提問：</p>
<table>
<thead>
<tr>
<th style="text-align:left">代理人角色</th>
<th style="text-align:left">獨立探勘提問角度</th>
<th style="text-align:left">成功引出之利害關係人真實需求</th>
</tr>
</thead>
<tbody>
<tr>
<td style="text-align:left"><strong>Analyst</strong></td>
<td style="text-align:left">異常處理選項（聯繫客服／取消訂單）應適用於所有異常，或僅限延遲與外送員爽約？</td>
<td style="text-align:left"><em>任何異常情境下「聯繫客服」皆須可用，其餘視情況提供。</em></td>
</tr>
<tr>
<td style="text-align:left"><strong>Expert</strong></td>
<td style="text-align:left">若系統<strong>隱藏雙方真實電話號碼</strong>，改採 App 內建聊天或匿名轉接通話，是否符合需求？</td>
<td style="text-align:left"><strong>命中隱性需求！</strong> <em>不應直接暴露顧客與外送員電話，須改採 App 內匿名通話並留存爭議紀錄。</em></td>
</tr>
<tr>
<td style="text-align:left"><strong>Modeler</strong></td>
<td style="text-align:left">異常即時處理選項是否應依<strong>訂單生命週期狀態</strong>限制（例如特定階段禁止取消）？</td>
<td style="text-align:left"><em>取消權限依訂單狀態與退款政策決定，但須清楚呈現原因。</em></td>
</tr>

<header><div class="hdr-wrap"><span class="hdr-title">PLANT：透過多代理人 AI 框架提升需求工程效率</span><div class="nav-dropdown"><button class="nav-btn">章節導覽 ▾</button><div class="nav-menu"><a href="#2">破題：單打獨鬥 vs. 團隊協作</a><a href="#3">簡報大綱</a><a href="#4">1. 研究動機與問題</a><a href="#6">2. 文獻回顧與比較</a><a href="#7">3. PLANT 框架設計</a><a href="#12">4. 實證評估與結果</a><a href="#19">5. 結論與未來研究</a></div></div></div></header>
<h2 id="46-%E5%90%84%E5%85%83%E4%BB%B6%E8%B2%A2%E7%8D%BB%E5%88%86%E6%9E%90%E8%88%87%E6%9C%AA%E4%BE%86%E6%B6%88%E8%9E%8D%E5%AF%A6%E9%A9%97%E8%A6%8F%E5%8A%83">4.6 各元件貢獻分析與未來消融實驗規劃</h2>
<p>雖受資源限制尚未進行全組合消融實驗，但從面向細分數據（Table 7）與對話軌跡可清楚推論各關鍵元件之貢獻：</p>
<div class="two-col">
<div class="card small-text">
<h3 id="%F0%9F%A7%A9-%E5%83%85-analyst--user-vs-%E5%8A%A0%E5%85%A5-expert-%E8%88%87-modeler"><img class="emoji" draggable="false" alt="🧩" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f9e9.svg" data-marp-twemoji=""/> 僅 Analyst + User vs. 加入 Expert 與 Modeler</h3>
<ul>
<li><strong>單一基線</strong>近似僅有 <em>Analyst + User</em>：主要命中表層<em>互動</em>與<em>內容</em>（GPT-4.1 佔 11/17），在<em>可靠度</em>、<em>效能</em>與<em>安全性</em>全數掛零（<code>0</code>）。</li>
<li>加入 <strong>Expert</strong> 後直接驅動<em>資安</em>（<strong>9–10/12</strong>）、<em>安全性</em>（<strong>2–3/3</strong>）與法規<em>相容性</em>之發現。</li>
<li>加入 <strong>Modeler</strong> 後透過 PlantUML 流程驗證，有效揭露<em>可靠度</em>（<strong>2–5/7</strong>）與狀態轉換邊界例外。</li>
</ul>
</div>
<div class="card accent small-text">
<h3 id="%F0%9F%A7%AD-mediator-%E8%88%87%E6%B7%B7%E5%90%88%E6%BA%9D%E9%80%9A%E6%A8%A1%E5%BC%8F%E4%B9%8B%E9%97%9C%E9%8D%B5%E8%A7%92%E8%89%B2"><img class="emoji" draggable="false" alt="🧭" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f9ed.svg" data-marp-twemoji=""/> Mediator 與混合溝通模式之關鍵角色</h3>
<ul>
<li>若缺乏 <strong>Mediator</strong> 統整待解議題並動態切換溝通策略：
<ul>
<li>全程僅用 <em>One-by-One</em> 發想易產生<strong>早期錨定</strong>與從眾效應。</li>
<li>無調度的並行對話則容易重複提問、難以收斂僵局。</li>
</ul>
</li>
<li>後續將於<strong>固定輪數與固定 Token 預算</strong>下進行四組受控消融實驗。</li>
</ul>
</div>
</div>

</section>

<h2 id="47-%E7%A0%94%E7%A9%B6%E6%95%88%E5%BA%A6%E5%A8%81%E8%84%85threats-to-validity">4.7 研究效度威脅（Threats to Validity）</h2>
<div class="three-col">
<div class="card small-text">
<h3 id="%F0%9F%94%8D-%E5%85%A7%E9%83%A8%E6%95%88%E5%BA%A6internal"><img class="emoji" draggable="false" alt="🔍" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f50d.svg" data-marp-twemoji=""/> 內部效度（Internal）</h3>
<ul>
<li><strong>互動深度與預算</strong>：PLANT 執行 13–17 輪（基線約 6 輪）並消耗較多 Token，成效反映「角色分工」與「互動深度」之綜合效果。</li>
<li><strong>外部檢索變異</strong>：雖本地文件庫固定（<code>temp = 0</code>），未來將快取即時網路搜尋結果以提升重現性。</li>
</ul>
</div>
<div class="card accent small-text">
<h3 id="%F0%9F%8E%AF-%E6%A7%8B%E5%BF%B5%E6%95%88%E5%BA%A6construct"><img class="emoji" draggable="false" alt="🎯" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f3af.svg" data-marp-twemoji=""/> 構念效度（Construct）</h3>
<ul>
<li><strong>模擬用戶與 LLM 裁判</strong>：模擬用戶可能較真實客戶配合，單一裁判模型亦可能有偏好；後續將引入多裁判與真人受試者訪談。</li>
<li><strong>召回導向與範疇</strong>：IRE 不懲罰過度延伸問題（實務賴範疇過濾與 HITL 收斂）；下游 SRS 與 UML 品質尚未納入本次量化評分。</li>
</ul>
</div>
<div class="card teal small-text">
<h3 id="%F0%9F%8C%90-%E5%A4%96%E9%83%A8%E6%95%88%E5%BA%A6external"><img class="emoji" draggable="false" alt="🌐" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f310.svg" data-marp-twemoji=""/> 外部效度（External）</h3>
<ul>
<li><strong>資料集規模</strong>：本次涵蓋 5 大跨領域系統（金融、醫療、交通、教育、外送物流，共 103 IRs）與 100 組衝突配對。</li>
<li><strong>更多基線比較</strong>：未來將擴展至大型產業需求庫與更多多代理人基準系統。</li>
</ul>
</div>
</div>

<script>
document.addEventListener('click', (e) => {
  const btn = e.target.closest('.nav-btn');
  if (btn) {
    e.stopPropagation();
    const dd = btn.closest('.nav-dropdown');
    const wasOpen = dd.classList.contains('open');
    document.querySelectorAll('.nav-dropdown.open').forEach(el => el.classList.remove('open'));
    if (!wasOpen) dd.classList.add('open');
    return;
  }
  document.querySelectorAll('.nav-dropdown.open').forEach(el => el.classList.remove('open'));
});

// Dynamic bounded in-place hover zoom (max 2.15x, strictly within 1280x720 safe area)
document.querySelectorAll('.split64 .fig-box img, .split55 .fig-box img, .split46 .fig-box img, .split73 .fig-box img, .two-col .fig-box img, .three-col .fig-box img').forEach((img) => {
  const box = img.closest('.fig-box');
  img.addEventListener('mouseenter', () => {
    const sec = img.closest('section');
    if (!sec) return;
    img.style.transform = '';
    const sr = sec.getBoundingClientRect();
    const ir = img.getBoundingClientRect();
    if (!ir.width || !ir.height) return;
    const padX = sr.width * (24 / 1280);
    const padTop = sr.height * (52 / 720);
    const padBot = sr.height * (22 / 720);
    const safeL = sr.left + padX;
    const safeR = sr.right - padX;
    const safeT = sr.top + padTop;
    const safeB = sr.bottom - padBot;
    const maxW = safeR - safeL;
    const maxH = safeB - safeT;
    const s = Math.min(2.15, (maxW / ir.width) * 0.98, (maxH / ir.height) * 0.98);
    if (s <= 1.03) return;
    const L = Math.max(0, ir.left - safeL);
    const R = Math.max(0, safeR - ir.right);
    const T = Math.max(0, ir.top - safeT);
    const B = Math.max(0, safeB - ir.bottom);
    const ox = (L + R) > 0 ? (L / (L + R)) * 100 : 50;
    const oy = (T + B) > 0 ? (T / (T + B)) * 100 : 50;
    img.style.transformOrigin = ox.toFixed(1) + '% ' + oy.toFixed(1) + '%';
    img.style.transform = 'scale(' + s.toFixed(3) + ')';
    img.classList.add('is-zoomed');
    if (box) box.classList.add('is-zoomed');
  });
  img.addEventListener('mouseleave', () => {
    img.style.transform = '';
    img.classList.remove('is-zoomed');
    if (box) box.classList.remove('is-zoomed');
  });
});

</script>
