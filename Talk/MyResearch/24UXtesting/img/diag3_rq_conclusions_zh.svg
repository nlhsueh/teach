<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 350" width="1100" height="350">
  <rect width="1100" height="350" rx="12" fill="#f8fafc"/>

  <!-- Top Banner -->
  <rect x="20" y="16" width="1060" height="54" rx="10" fill="#1b365d"/>
  <text x="550" y="40" text-anchor="middle" font-family="Noto Sans TC, PingFang TC, sans-serif" font-size="16" font-weight="800" fill="#ffffff">核心貢獻：啟發式理論驅動的自動化 UX 測試（Rapi + GPT-4 + Nielsen 六大準則）</text>
  <text x="550" y="59" text-anchor="middle" font-family="Noto Sans TC, PingFang TC, sans-serif" font-size="12.5" fill="#cbd5e1">結合低成本自動化錄製與認知可用性理論，並透過九大網球課程預約情境完成嚴謹實證驗證</text>

  <!-- Left Card: RQ1 Synthesis -->
  <rect x="20" y="88" width="516" height="244" rx="12" fill="#ffffff" stroke="#0f766e" stroke-width="2.5"/>
  <rect x="20" y="88" width="516" height="40" rx="12" fill="#0f766e"/>
  <rect x="20" y="114" width="516" height="14" fill="#0f766e"/>
  <text x="278" y="113" text-anchor="middle" font-family="Noto Sans TC, PingFang TC, sans-serif" font-size="15" font-weight="800" fill="#ffffff">RQ1 · 多模態提示詞資訊對偵測效能之影響</text>

  <!-- RQ1 KPI Strip -->
  <rect x="38" y="142" width="150" height="62" rx="8" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1.5"/>
  <text x="113" y="168" text-anchor="middle" font-family="Inter, sans-serif" font-size="20" font-weight="800" fill="#0f766e">0.84 vs 0.71</text>
  <text x="113" y="189" text-anchor="middle" font-family="Noto Sans TC, PingFang TC, sans-serif" font-size="11.5" font-weight="600" fill="#334155">精確率（+0.13）</text>

  <rect x="203" y="142" width="150" height="62" rx="8" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1.5"/>
  <text x="278" y="168" text-anchor="middle" font-family="Inter, sans-serif" font-size="20" font-weight="800" fill="#0f766e">0.55 vs 0.50</text>
  <text x="278" y="189" text-anchor="middle" font-family="Noto Sans TC, PingFang TC, sans-serif" font-size="11.5" font-weight="600" fill="#334155">召回率（+0.05）</text>

  <rect x="368" y="142" width="150" height="62" rx="8" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1.5"/>
  <text x="443" y="168" text-anchor="middle" font-family="Inter, sans-serif" font-size="20" font-weight="800" fill="#0f766e">0.66 vs 0.64</text>
  <text x="443" y="189" text-anchor="middle" font-family="Noto Sans TC, PingFang TC, sans-serif" font-size="11.5" font-weight="600" fill="#334155">F1 分數（+0.02）</text>

  <text x="38" y="232" font-family="Noto Sans TC, PingFang TC, sans-serif" font-size="13" font-weight="700" fill="#0f172a">• 動態互動與複雜流程：</text>
  <text x="52" y="252" font-family="Noto Sans TC, PingFang TC, sans-serif" font-size="12.5" fill="#334155">加入 JSON 操作腳本顯著提升錯誤處理（r = 0.51）、</text>
  <text x="52" y="270" font-family="Noto Sans TC, PingFang TC, sans-serif" font-size="12.5" fill="#334155">課程搜尋（r = 0.31）與載入狀態提示之偵測力。</text>
  <text x="38" y="295" font-family="Noto Sans TC, PingFang TC, sans-serif" font-size="13" font-weight="700" fill="#0f172a">• 靜態介面版面元素：</text>
  <text x="52" y="315" font-family="Noto Sans TC, PingFang TC, sans-serif" font-size="12.5" fill="#334155">純截圖即足以評估按鈕配色與配置（S03、S04、S09）。</text>

  <!-- Right Card: RQ2 Synthesis -->
  <rect x="564" y="88" width="516" height="244" rx="12" fill="#ffffff" stroke="#8c1d40" stroke-width="2.5"/>
  <rect x="564" y="88" width="516" height="40" rx="12" fill="#8c1d40"/>
  <rect x="564" y="114" width="516" height="14" fill="#8c1d40"/>
  <text x="822" y="113" text-anchor="middle" font-family="Noto Sans TC, PingFang TC, sans-serif" font-size="15" font-weight="800" fill="#ffffff">RQ2 · GPT-4 與人類評估者之效能比較</text>

  <!-- RQ2 KPI Strip -->
  <rect x="582" y="142" width="150" height="62" rx="8" fill="#fdf2f5" stroke="#fecdd3" stroke-width="1.5"/>
  <text x="657" y="168" text-anchor="middle" font-family="Inter, sans-serif" font-size="20" font-weight="800" fill="#8c1d40">0.66 vs 0.16</text>
  <text x="657" y="189" text-anchor="middle" font-family="Noto Sans TC, PingFang TC, sans-serif" font-size="11.5" font-weight="600" fill="#334155">F1 分數（4.1 倍）</text>

  <rect x="747" y="142" width="150" height="62" rx="8" fill="#fdf2f5" stroke="#fecdd3" stroke-width="1.5"/>
  <text x="822" y="168" text-anchor="middle" font-family="Inter, sans-serif" font-size="20" font-weight="800" fill="#8c1d40">0.55 vs 0.10</text>
  <text x="822" y="189" text-anchor="middle" font-family="Noto Sans TC, PingFang TC, sans-serif" font-size="11.5" font-weight="600" fill="#334155">召回率（5.5 倍）</text>

  <rect x="912" y="142" width="150" height="62" rx="8" fill="#fdf2f5" stroke="#fecdd3" stroke-width="1.5"/>
  <text x="987" y="168" text-anchor="middle" font-family="Inter, sans-serif" font-size="20" font-weight="800" fill="#8c1d40">0.84 vs 0.50</text>
  <text x="987" y="189" text-anchor="middle" font-family="Noto Sans TC, PingFang TC, sans-serif" font-size="11.5" font-weight="600" fill="#334155">精確率（+0.34）</text>

  <text x="582" y="232" font-family="Noto Sans TC, PingFang TC, sans-serif" font-size="13" font-weight="700" fill="#0f172a">• 系統化與高一致性的缺陷識別：</text>
  <text x="596" y="252" font-family="Noto Sans TC, PingFang TC, sans-serif" font-size="12.5" fill="#334155">GPT-4 顯著檢出 5/10 項 TIS 與 4/10 項非預期一致性；</text>
  <text x="596" y="270" font-family="Noto Sans TC, PingFang TC, sans-serif" font-size="12.5" fill="#334155">人類受試者易適應不良介面（2/10 TIS、0/10 非預期）。</text>
  <text x="582" y="295" font-family="Noto Sans TC, PingFang TC, sans-serif" font-size="13" font-weight="700" fill="#0f172a">• 最佳實務——人機協作互補：</text>
  <text x="596" y="315" font-family="Noto Sans TC, PingFang TC, sans-serif" font-size="12.5" fill="#334155">結合 GPT-4 早期全面篩檢與人類專家之脈絡與情感判斷。</text>
</svg>
