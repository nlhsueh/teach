<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 370" width="1100" height="370">
  <defs>
    <marker id="arr-navy" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#1b365d"/>
    </marker>
    <marker id="arr-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0f766e"/>
    </marker>
  </defs>
  <rect width="1100" height="370" rx="12" fill="#f8fafc"/>

  <!-- Column 1: Manual UX Testing -->
  <rect x="20" y="20" width="320" height="330" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
  <rect x="20" y="20" width="320" height="44" rx="12" fill="#8c1d40"/>
  <rect x="20" y="48" width="320" height="16" fill="#8c1d40"/>
  <text x="180" y="48" text-anchor="middle" font-family="Inter, sans-serif" font-size="16" font-weight="800" fill="#ffffff">1. Traditional Manual UX Testing</text>

  <rect x="38" y="82" width="284" height="58" rx="8" fill="#fdf2f5" stroke="#fecdd3" stroke-width="1.5"/>
  <text x="52" y="106" font-family="Inter, sans-serif" font-size="14" font-weight="700" fill="#8c1d40">High Cost &amp; Slow Turnaround</text>
  <text x="52" y="127" font-family="Inter, sans-serif" font-size="12.5" fill="#334155">Recruiting users, lab sessions &amp; coding logs</text>

  <rect x="38" y="154" width="284" height="58" rx="8" fill="#fdf2f5" stroke="#fecdd3" stroke-width="1.5"/>
  <text x="52" y="178" font-family="Inter, sans-serif" font-size="14" font-weight="700" fill="#8c1d40">Subjective &amp; Inconsistent</text>
  <text x="52" y="199" font-family="Inter, sans-serif" font-size="12.5" fill="#334155">Self-report bias &amp; observer effect [8]</text>

  <rect x="38" y="226" width="284" height="58" rx="8" fill="#fdf2f5" stroke="#fecdd3" stroke-width="1.5"/>
  <text x="52" y="250" font-family="Inter, sans-serif" font-size="14" font-weight="700" fill="#8c1d40">Forgiving Human Testers</text>
  <text x="52" y="271" font-family="Inter, sans-serif" font-size="12.5" fill="#334155">Users adapt to bad UI &amp; miss subtle flaws</text>

  <rect x="52" y="300" width="256" height="34" rx="17" fill="#fee2e2"/>
  <text x="180" y="322" text-anchor="middle" font-family="Inter, sans-serif" font-size="13" font-weight="700" fill="#991b1b">Result: Slow, Expensive &amp; Low Recall</text>

  <!-- Column 2: Conventional Automated Tools -->
  <rect x="366" y="20" width="320" height="330" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
  <rect x="366" y="20" width="320" height="44" rx="12" fill="#475569"/>
  <rect x="366" y="48" width="320" height="16" fill="#475569"/>
  <text x="526" y="48" text-anchor="middle" font-family="Inter, sans-serif" font-size="16" font-weight="800" fill="#ffffff">2. Existing Automated Tools</text>

  <rect x="384" y="82" width="284" height="58" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="398" y="106" font-family="Inter, sans-serif" font-size="14" font-weight="700" fill="#1e293b">Functional &amp; Speed Focus Only</text>
  <text x="398" y="127" font-family="Inter, sans-serif" font-size="12.5" fill="#334155">Measures latency, broken links &amp; load [13–15]</text>

  <rect x="384" y="154" width="284" height="58" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="398" y="178" font-family="Inter, sans-serif" font-size="14" font-weight="700" fill="#1e293b">Blind to Cognitive Experience</text>
  <text x="398" y="199" font-family="Inter, sans-serif" font-size="12.5" fill="#334155">Cannot judge clarity, affordance or emotion</text>

  <rect x="384" y="226" width="284" height="58" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="398" y="250" font-family="Inter, sans-serif" font-size="14" font-weight="700" fill="#1e293b">No Usability Theory Grounding</text>
  <text x="398" y="271" font-family="Inter, sans-serif" font-size="12.5" fill="#334155">Nielsen's &amp; Norman's heuristics unintegrated</text>

  <rect x="398" y="300" width="256" height="34" rx="17" fill="#e2e8f0"/>
  <text x="526" y="322" text-anchor="middle" font-family="Inter, sans-serif" font-size="13" font-weight="700" fill="#334155">Result: Technical Checks, Not Real UX</text>

  <!-- Arrow to Column 3 -->
  <line x1="690" y1="185" x2="722" y2="185" stroke="#0f766e" stroke-width="4" marker-end="url(#arr-teal)"/>

  <!-- Column 3: Our Approach -->
  <rect x="730" y="20" width="350" height="330" rx="12" fill="#ffffff" stroke="#0f766e" stroke-width="2.5"/>
  <rect x="730" y="20" width="350" height="44" rx="12" fill="#0f766e"/>
  <rect x="730" y="48" width="350" height="16" fill="#0f766e"/>
  <text x="905" y="48" text-anchor="middle" font-family="Inter, sans-serif" font-size="16" font-weight="800" fill="#ffffff">3. Our Approach: Rapi + GPT-4</text>

  <rect x="748" y="82" width="314" height="58" rx="8" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1.5"/>
  <text x="762" y="106" font-family="Inter, sans-serif" font-size="14" font-weight="700" fill="#0f766e">Multimodal Interaction Capture</text>
  <text x="762" y="127" font-family="Inter, sans-serif" font-size="12.5" fill="#334155">Rapi records static screenshots + dynamic logs</text>

  <rect x="748" y="154" width="314" height="58" rx="8" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1.5"/>
  <text x="762" y="178" font-family="Inter, sans-serif" font-size="14" font-weight="700" fill="#0f766e">Nielsen's 6 Heuristics Embedded</text>
  <text x="762" y="199" font-family="Inter, sans-serif" font-size="12.5" fill="#334155">Structured NS01–NS06 criteria inside prompt</text>

  <rect x="748" y="226" width="314" height="58" rx="8" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1.5"/>
  <text x="762" y="250" font-family="Inter, sans-serif" font-size="14" font-weight="700" fill="#0f766e">Scores + Qualitative Explanations</text>
  <text x="762" y="271" font-family="Inter, sans-serif" font-size="12.5" fill="#334155">Consistent 1–5 scoring &amp; actionable rationale</text>

  <rect x="762" y="300" width="286" height="34" rx="17" fill="#1b365d"/>
  <text x="905" y="322" text-anchor="middle" font-family="Inter, sans-serif" font-size="13" font-weight="700" fill="#ffffff">Fast, Objective &amp; Heuristic-Grounded UX</text>
</svg>
