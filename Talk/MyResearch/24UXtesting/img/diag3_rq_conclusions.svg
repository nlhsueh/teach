<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 350" width="1100" height="350">
  <rect width="1100" height="350" rx="12" fill="#f8fafc"/>

  <!-- Top Banner -->
  <rect x="20" y="16" width="1060" height="54" rx="10" fill="#1b365d"/>
  <text x="550" y="40" text-anchor="middle" font-family="Inter, sans-serif" font-size="16" font-weight="800" fill="#ffffff">Core Contribution: Automated Heuristic-Driven UX Testing (Rapi + GPT-4 + Nielsen's NS01–NS06)</text>
  <text x="550" y="59" text-anchor="middle" font-family="Inter, sans-serif" font-size="12.5" fill="#cbd5e1">Bridges low-cost automation with cognitive usability theory — validated on a 9-story Tennis Course Reservation case study</text>

  <!-- Left Card: RQ1 Synthesis -->
  <rect x="20" y="88" width="516" height="244" rx="12" fill="#ffffff" stroke="#0f766e" stroke-width="2.5"/>
  <rect x="20" y="88" width="516" height="40" rx="12" fill="#0f766e"/>
  <rect x="20" y="114" width="516" height="14" fill="#0f766e"/>
  <text x="278" y="113" text-anchor="middle" font-family="Inter, sans-serif" font-size="15" font-weight="800" fill="#ffffff">RQ1 · Multimodal Prompt Engineering Impact</text>

  <!-- RQ1 KPI Strip -->
  <rect x="38" y="142" width="150" height="62" rx="8" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1.5"/>
  <text x="113" y="168" text-anchor="middle" font-family="Inter, sans-serif" font-size="20" font-weight="800" fill="#0f766e">0.84 vs 0.71</text>
  <text x="113" y="189" text-anchor="middle" font-family="Inter, sans-serif" font-size="11.5" font-weight="600" fill="#334155">Precision (+0.13)</text>

  <rect x="203" y="142" width="150" height="62" rx="8" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1.5"/>
  <text x="278" y="168" text-anchor="middle" font-family="Inter, sans-serif" font-size="20" font-weight="800" fill="#0f766e">0.55 vs 0.50</text>
  <text x="278" y="189" text-anchor="middle" font-family="Inter, sans-serif" font-size="11.5" font-weight="600" fill="#334155">Recall (+0.05)</text>

  <rect x="368" y="142" width="150" height="62" rx="8" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1.5"/>
  <text x="443" y="168" text-anchor="middle" font-family="Inter, sans-serif" font-size="20" font-weight="800" fill="#0f766e">0.66 vs 0.64</text>
  <text x="443" y="189" text-anchor="middle" font-family="Inter, sans-serif" font-size="11.5" font-weight="600" fill="#334155">F1 Score (+0.02)</text>

  <text x="38" y="232" font-family="Inter, sans-serif" font-size="13" font-weight="700" fill="#0f172a">• Dynamic &amp; Complex Flows:</text>
  <text x="52" y="252" font-family="Inter, sans-serif" font-size="12.5" fill="#334155">Adding JSON operation logs boosts error-handling (r = 0.51),</text>
  <text x="52" y="270" font-family="Inter, sans-serif" font-size="12.5" fill="#334155">search (r = 0.31), and loading-prompt detection.</text>
  <text x="38" y="295" font-family="Inter, sans-serif" font-size="13" font-weight="700" fill="#0f172a">• Static Visual Elements:</text>
  <text x="52" y="315" font-family="Inter, sans-serif" font-size="12.5" fill="#334155">Screenshots alone suffice for layout/buttons (S03, S04, S09).</text>

  <!-- Right Card: RQ2 Synthesis -->
  <rect x="564" y="88" width="516" height="244" rx="12" fill="#ffffff" stroke="#8c1d40" stroke-width="2.5"/>
  <rect x="564" y="88" width="516" height="40" rx="12" fill="#8c1d40"/>
  <rect x="564" y="114" width="516" height="14" fill="#8c1d40"/>
  <text x="822" y="113" text-anchor="middle" font-family="Inter, sans-serif" font-size="15" font-weight="800" fill="#ffffff">RQ2 · GPT-4 vs. Human Evaluators</text>

  <!-- RQ2 KPI Strip -->
  <rect x="582" y="142" width="150" height="62" rx="8" fill="#fdf2f5" stroke="#fecdd3" stroke-width="1.5"/>
  <text x="657" y="168" text-anchor="middle" font-family="Inter, sans-serif" font-size="20" font-weight="800" fill="#8c1d40">0.66 vs 0.16</text>
  <text x="657" y="189" text-anchor="middle" font-family="Inter, sans-serif" font-size="11.5" font-weight="600" fill="#334155">F1 Score (4.1×)</text>

  <rect x="747" y="142" width="150" height="62" rx="8" fill="#fdf2f5" stroke="#fecdd3" stroke-width="1.5"/>
  <text x="822" y="168" text-anchor="middle" font-family="Inter, sans-serif" font-size="20" font-weight="800" fill="#8c1d40">0.55 vs 0.10</text>
  <text x="822" y="189" text-anchor="middle" font-family="Inter, sans-serif" font-size="11.5" font-weight="600" fill="#334155">Recall (5.5×)</text>

  <rect x="912" y="142" width="150" height="62" rx="8" fill="#fdf2f5" stroke="#fecdd3" stroke-width="1.5"/>
  <text x="987" y="168" text-anchor="middle" font-family="Inter, sans-serif" font-size="20" font-weight="800" fill="#8c1d40">0.84 vs 0.50</text>
  <text x="987" y="189" text-anchor="middle" font-family="Inter, sans-serif" font-size="11.5" font-weight="600" fill="#334155">Precision (+0.34)</text>

  <text x="582" y="232" font-family="Inter, sans-serif" font-size="13" font-weight="700" fill="#0f172a">• Superior Heuristic Consistency:</text>
  <text x="596" y="252" font-family="Inter, sans-serif" font-size="12.5" fill="#334155">GPT-4 detects 5/10 TIS &amp; 4/10 unexpected AIS–TIS issues,</text>
  <text x="596" y="270" font-family="Inter, sans-serif" font-size="12.5" fill="#334155">whereas humans adapt to poor UI (2/10 TIS, 0/10 unexpected).</text>
  <text x="582" y="295" font-family="Inter, sans-serif" font-size="13" font-weight="700" fill="#0f172a">• Optimal Path — Hybrid Synergy:</text>
  <text x="596" y="315" font-family="Inter, sans-serif" font-size="12.5" fill="#334155">Pair GPT-4 screening with human contextual &amp; emotional insight.</text>
</svg>
