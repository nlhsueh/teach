<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" width="960" height="360">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#1b365d"/>
    </marker>
    <marker id="arrTeal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0f766e"/>
    </marker>
    <marker id="arrAcc" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#8c1d40"/>
    </marker>
  </defs>
  <rect width="960" height="360" fill="#ffffff" rx="10"/>

  <!-- Box 1: Version Dj -->
  <rect x="20" y="24" width="235" height="200" rx="8" fill="#f8fafc" stroke="#1b365d" stroke-width="2"/>
  <rect x="20" y="24" width="235" height="32" rx="8" fill="#1b365d"/>
  <rect x="20" y="46" width="235" height="10" fill="#1b365d"/>
  <text x="137" y="45" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="700" fill="#ffffff">Design Dj: PAC(Strategy, Dj)</text>

  <rect x="38" y="72" width="198" height="28" rx="5" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="137" y="90" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="600" fill="#0f172a">DataCompression  [RC: Context]</text>

  <rect x="38" y="112" width="198" height="28" rx="5" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="137" y="130" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="600" fill="#0f172a">CompressionTool  [RS: Strategy]</text>

  <rect x="38" y="156" width="92" height="28" rx="5" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="84" y="174" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="700" fill="#1e3a8a">ZIP [RCS]</text>

  <rect x="144" y="156" width="92" height="28" rx="5" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="190" y="174" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="700" fill="#1e3a8a">RAR [RCS]</text>

  <text x="137" y="210" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="11" fill="#64748b">Baseline Pattern Instance</text>

  <!-- Arrow Dj -> Dj+1 -->
  <line x1="255" y1="124" x2="320" y2="124" stroke="#1b365d" stroke-width="2.5" marker-end="url(#arr)"/>
  <text x="287" y="114" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#1b365d">Evolution</text>
  <text x="287" y="142" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="11" fill="#64748b">Delta PAC</text>

  <!-- Box 2: Version Dj+1 -->
  <rect x="328" y="24" width="255" height="200" rx="8" fill="#f0fdfa" stroke="#0f766e" stroke-width="2"/>
  <rect x="328" y="24" width="255" height="32" rx="8" fill="#0f766e"/>
  <rect x="328" y="46" width="255" height="10" fill="#0f766e"/>
  <text x="455" y="45" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="700" fill="#ffffff">Design Dj+1: PAC(Strategy, Dj+1)</text>

  <rect x="346" y="72" width="218" height="28" rx="5" fill="#ffffff" stroke="#99f6e4" stroke-width="1.5"/>
  <text x="455" y="90" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="600" fill="#0f172a">DataCompression  [RC: Context]</text>

  <rect x="346" y="112" width="218" height="28" rx="5" fill="#ffffff" stroke="#99f6e4" stroke-width="1.5"/>
  <text x="455" y="130" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="600" fill="#0f172a">CompressionTool  [RS: Strategy]</text>

  <rect x="346" y="156" width="66" height="28" rx="5" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="379" y="174" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#334155">ZIP</text>

  <rect x="420" y="156" width="66" height="28" rx="5" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="453" y="174" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#334155">RAR</text>

  <rect x="494" y="156" width="70" height="28" rx="5" fill="#8c1d40" stroke="#8c1d40" stroke-width="1.5"/>
  <text x="529" y="174" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#ffffff">+ 7-ZIP</text>

  <text x="455" y="210" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="600" fill="#0f766e">Added ConcreteStrategy (+ RCS)</text>

  <!-- Arrow to PAE Check -->
  <line x1="583" y1="124" x2="642" y2="124" stroke="#0f766e" stroke-width="2.5" marker-end="url(#arrTeal)"/>

  <!-- Box 3: PAE Verification & DoU -->
  <rect x="650" y="24" width="290" height="200" rx="8" fill="#fdf2f5" stroke="#8c1d40" stroke-width="2"/>
  <rect x="650" y="24" width="290" height="32" rx="8" fill="#8c1d40"/>
  <rect x="650" y="46" width="290" height="10" fill="#8c1d40"/>
  <text x="795" y="45" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="700" fill="#ffffff">PAE Conformance &amp; DoU Metric</text>

  <text x="668" y="80" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="700" fill="#8c1d40">Expected Evolution (PAE):</text>
  <text x="668" y="100" font-family="JetBrains Mono, monospace" font-size="11.5" fill="#0f172a">PAE(Strategy) = { &lt;RCS, +&gt;, &lt;RCS, -&gt; }</text>

  <text x="668" y="130" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="700" fill="#0f766e">Conformance Predicate:</text>
  <text x="668" y="150" font-family="Inter, Arial, sans-serif" font-size="11.5" fill="#0f172a">Delta PAC = { &lt;7-ZIP, RCS, +&gt; } conforms</text>
  <text x="668" y="168" font-family="Inter, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#0f766e">Result: Utilized at version Dj+1 (True)</text>

  <rect x="668" y="182" width="254" height="30" rx="5" fill="#ffffff" stroke="#8c1d40" stroke-width="1.5"/>
  <text x="795" y="201" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="700" fill="#1b365d">DoU = # Utilized Apps / # Evolutions</text>

  <!-- Bottom Timeline Bar -->
  <rect x="20" y="246" width="920" height="94" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="38" y="270" font-family="Inter, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#1b365d">Multi-Version Evolution Tracking Example (V1 to V8 = 7 Evolution Steps):</text>

  <rect x="38" y="284" width="195" height="42" rx="6" fill="#ffffff" stroke="#1b365d" stroke-width="1.5"/>
  <text x="135" y="302" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#1b365d">dp1 (V1-V8 alive)</text>
  <text x="135" y="319" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="11" fill="#334155">2 utilized / 7 steps = 0.286</text>

  <rect x="248" y="284" width="195" height="42" rx="6" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.5"/>
  <text x="345" y="302" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#0f766e">dp2 (V1-V8 alive)</text>
  <text x="345" y="319" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="11" fill="#334155">3 utilized / 7 steps = 0.429</text>

  <rect x="458" y="284" width="145" height="42" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="530" y="302" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#334155">dp3 (V3-V8)</text>
  <text x="530" y="319" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="11" fill="#334155">1 / 5 = 0.200</text>

  <rect x="618" y="284" width="145" height="42" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="690" y="302" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#334155">dp4 (removed V5)</text>
  <text x="690" y="319" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="11" fill="#334155">1 / 2 = 0.500</text>

  <rect x="778" y="284" width="145" height="42" rx="6" fill="#fdf2f5" stroke="#8c1d40" stroke-width="1.5"/>
  <text x="850" y="302" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#8c1d40">dp5 (never used)</text>
  <text x="850" y="319" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="11" fill="#8c1d40">0 / 5 = 0.000</text>
</svg>
