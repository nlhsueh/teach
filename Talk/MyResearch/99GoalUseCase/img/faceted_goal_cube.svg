<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 330" width="860" height="330">
  <defs>
    <marker id="arr99" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#1b365d"/>
    </marker>
  </defs>
  <rect width="860" height="330" rx="12" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="430" y="30" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="800" fill="#1b365d">GDUC Three-Facet Goal Classification Scheme (Competence x View x Content)</text>

  <!-- 3 Facet Cards -->
  <rect x="24" y="48" width="256" height="145" rx="9" fill="#ffffff" stroke="#1b365d" stroke-width="2"/>
  <rect x="24" y="48" width="256" height="32" rx="7" fill="#1b365d"/>
  <text x="152" y="69" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="700" fill="#ffffff">Facet 1: Competence</text>
  <text x="38" y="102" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="700" fill="#1b365d">Rigid (R):</text>
  <text x="102" y="102" font-family="Inter, Arial, sans-serif" font-size="11.5" fill="#334155">Must be 100% satisfied</text>
  <text x="38" y="120" font-family="Inter, Arial, sans-serif" font-size="11" fill="#64748b">(minimum system requirement)</text>
  <line x1="38" y1="132" x2="266" y2="132" stroke="#e2e8f0" stroke-width="1"/>
  <text x="38" y="152" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="700" fill="#8c1d40">Soft (S):</text>
  <text x="95" y="152" font-family="Inter, Arial, sans-serif" font-size="11.5" fill="#334155">Satisfied to a degree</text>
  <text x="38" y="170" font-family="Inter, Arial, sans-serif" font-size="11" fill="#64748b">(weakly dependent on rigid goal)</text>

  <rect x="302" y="48" width="256" height="145" rx="9" fill="#ffffff" stroke="#8c1d40" stroke-width="2"/>
  <rect x="302" y="48" width="256" height="32" rx="7" fill="#8c1d40"/>
  <text x="430" y="69" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="700" fill="#ffffff">Facet 2: View</text>
  <text x="316" y="102" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="700" fill="#1b365d">Actor-Specific (A):</text>
  <text x="316" y="120" font-family="Inter, Arial, sans-serif" font-size="11.5" fill="#334155">User's objective in using system</text>
  <line x1="316" y1="132" x2="544" y2="132" stroke="#e2e8f0" stroke-width="1"/>
  <text x="316" y="152" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="700" fill="#8c1d40">System-Specific (Y):</text>
  <text x="316" y="170" font-family="Inter, Arial, sans-serif" font-size="11.5" fill="#334155">Service property across all users</text>

  <rect x="580" y="48" width="256" height="145" rx="9" fill="#ffffff" stroke="#0f766e" stroke-width="2"/>
  <rect x="580" y="48" width="256" height="32" rx="7" fill="#0f766e"/>
  <text x="708" y="69" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="700" fill="#ffffff">Facet 3: Content</text>
  <text x="594" y="102" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="700" fill="#1b365d">Functional (F):</text>
  <text x="594" y="120" font-family="Inter, Arial, sans-serif" font-size="11.5" fill="#334155">Achieved via sequence of ops</text>
  <line x1="594" y1="132" x2="822" y2="132" stroke="#e2e8f0" stroke-width="1"/>
  <text x="594" y="152" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="700" fill="#0f766e">Nonfunctional (N):</text>
  <text x="594" y="170" font-family="Inter, Arial, sans-serif" font-size="11.5" fill="#334155">Constraints qualifying F-goals</text>

  <!-- Arrows down -->
  <line x1="250" y1="193" x2="250" y2="225" stroke="#1b365d" stroke-width="2" marker-end="url(#arr99)"/>
  <line x1="610" y1="193" x2="610" y2="225" stroke="#1b365d" stroke-width="2" marker-end="url(#arr99)"/>

  <!-- Bottom 2 Derived Goal Roles -->
  <rect x="44" y="232" width="365" height="78" rx="9" fill="#1b365d"/>
  <text x="226" y="257" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13.5" font-weight="800" fill="#ffffff">Original Goal = (Rigid, Actor-Specific, Functional)</text>
  <text x="226" y="278" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="11.5" fill="#e2e8f0">Drives Original Use Cases (Basic + Recovery/Failure courses)</text>
  <text x="226" y="296" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="11" fill="#93c5fd">e.g., MeetingRequestSatisfied (R, A, F) -> Plan a meeting</text>

  <rect x="451" y="232" width="365" height="78" rx="9" fill="#8c1d40"/>
  <text x="633" y="257" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13.5" font-weight="800" fill="#ffffff">Extension Goal = Soft / System-Specific / Nonfunctional</text>
  <text x="633" y="278" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="11.5" fill="#fde2e8">Drives Extension Use Cases (Optimize / Maintain / Achieve)</text>
  <text x="633" y="296" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="11" fill="#fecdd3">e.g., MaxConvenientSchedule (S, A, N), SupportFlexibility (S, Y, F)</text>
</svg>
