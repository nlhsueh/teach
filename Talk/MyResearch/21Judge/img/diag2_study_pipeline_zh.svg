<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 320" width="1100" height="320">
  <defs>
    <filter id="sh2z" x="-4%" y="-6%" width="108%" height="114%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
    <marker id="arrz" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#1b365d"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1100" height="320" rx="14" fill="#f8fafc"/>

  <!-- Stage 1 -->
  <rect x="20" y="24" width="240" height="272" rx="12" fill="#ffffff" stroke="#1b365d" stroke-width="2" filter="url(#sh2z)"/>
  <rect x="20" y="24" width="240" height="44" rx="12" fill="#1b365d"/>
  <rect x="20" y="54" width="240" height="14" fill="#1b365d"/>
  <text x="140" y="51" text-anchor="middle" font-family="Noto Sans TC, PingFang TC, sans-serif" font-size="14.5" font-weight="800" fill="#ffffff">1. 混成翻轉課程（第 1–6 週）</text>
  <text x="36" y="92" font-family="Noto Sans TC, PingFang TC, sans-serif" font-size="13" font-weight="700" fill="#1b365d">逢甲資料科學（3 學分）</text>
  <text x="36" y="114" font-family="Noto Sans TC, PingFang TC, sans-serif" font-size="12" fill="#334155">• 2021 春季班，約 300 位修課生</text>
  <text x="36" y="135" font-family="Noto Sans TC, PingFang TC, sans-serif" font-size="12" fill="#334155">• 每週 2 小時線上自主學習：</text>
  <text x="46" y="153" font-family="Noto Sans TC, PingFang TC, sans-serif" font-size="11.5" fill="#475569">影片 ＋ 隨堂測驗 ＋ OJ 練習</text>
  <text x="36" y="174" font-family="Noto Sans TC, PingFang TC, sans-serif" font-size="12" fill="#334155">• 每週 1 小時實體答疑互動</text>
  <text x="36" y="195" font-family="Noto Sans TC, PingFang TC, sans-serif" font-size="12" fill="#334155">• OpenEdu 單一登入 ＋ 助教論壇</text>
  <rect x="36" y="216" width="208" height="62" rx="8" fill="#f0fdfa" stroke="#99f6e4"/>
  <text x="140" y="240" text-anchor="middle" font-family="Noto Sans TC, PingFang TC, sans-serif" font-size="12.5" font-weight="700" fill="#0f766e">6 單元中有 5 單元遊戲化</text>
  <text x="140" y="261" text-anchor="middle" font-family="Noto Sans TC, PingFang TC, sans-serif" font-size="11.5" fill="#334155">通過當前關卡方可解鎖下一單元</text>

  <!-- Arrow 1->2 -->
  <line x1="264" y1="160" x2="294" y2="160" stroke="#1b365d" stroke-width="2.8" marker-end="url(#arrz)"/>

  <!-- Stage 2 -->
  <rect x="300" y="24" width="235" height="272" rx="12" fill="#ffffff" stroke="#0f766e" stroke-width="2" filter="url(#sh2z)"/>
  <rect x="300" y="24" width="235" height="44" rx="12" fill="#0f766e"/>
  <rect x="300" y="54" width="235" height="14" fill="#0f766e"/>
  <text x="417" y="51" text-anchor="middle" font-family="Noto Sans TC, PingFang TC, sans-serif" font-size="14.5" font-weight="800" fill="#ffffff">2. 問卷施測收集（第 7 週）</text>
  <text x="316" y="92" font-family="Noto Sans TC, PingFang TC, sans-serif" font-size="13" font-weight="700" fill="#0f766e">n = 187 份有效自願填答</text>
  <text x="316" y="114" font-family="Noto Sans TC, PingFang TC, sans-serif" font-size="12" fill="#334155">• 總計 22 題結構化問項</text>
  <text x="316" y="135" font-family="Noto Sans TC, PingFang TC, sans-serif" font-size="12" fill="#334155">• 五點李克特量表（1–5 分）</text>
  <text x="316" y="156" font-family="Noto Sans TC, PingFang TC, sans-serif" font-size="12" fill="#334155">• 涵蓋 8 大潛在構面：</text>
  <text x="326" y="174" font-family="Noto Sans TC, PingFang TC, sans-serif" font-size="11.5" fill="#475569">PE, EE, SI, FC, HM, SE, ANX, BI</text>
  <text x="316" y="195" font-family="Noto Sans TC, PingFang TC, sans-serif" font-size="12" fill="#334155">• 個人背景與主修科系（MJR）</text>
  <rect x="316" y="216" width="203" height="62" rx="8" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="417" y="240" text-anchor="middle" font-family="Noto Sans TC, PingFang TC, sans-serif" font-size="12.5" font-weight="700" fill="#1b365d">採用經實證驗證量表</text>
  <text x="417" y="261" text-anchor="middle" font-family="Noto Sans TC, PingFang TC, sans-serif" font-size="11.5" fill="#475569">Venkatesh [12,13], Huang [17]</text>

  <!-- Arrow 2->3 -->
  <line x1="539" y1="160" x2="569" y2="160" stroke="#1b365d" stroke-width="2.8" marker-end="url(#arrz)"/>

  <!-- Stage 3 -->
  <rect x="575" y="24" width="240" height="272" rx="12" fill="#ffffff" stroke="#1b365d" stroke-width="2" filter="url(#sh2z)"/>
  <rect x="575" y="24" width="240" height="44" rx="12" fill="#1b365d"/>
  <rect x="575" y="54" width="240" height="14" fill="#1b365d"/>
  <text x="695" y="51" text-anchor="middle" font-family="Noto Sans TC, PingFang TC, sans-serif" font-size="14.5" font-weight="800" fill="#ffffff">3. 測量模型檢定（外部模型）</text>
  <text x="591" y="92" font-family="Noto Sans TC, PingFang TC, sans-serif" font-size="13" font-weight="700" fill="#1b365d">SmartPLS 3.0 信效度驗證</text>
  <text x="591" y="114" font-family="Noto Sans TC, PingFang TC, sans-serif" font-size="12" fill="#334155">• 題項信度：因素負荷 CL ≥ 0.70</text>
  <text x="591" y="135" font-family="Noto Sans TC, PingFang TC, sans-serif" font-size="12" fill="#334155">• 內部一致性：</text>
  <text x="601" y="153" font-family="Noto Sans TC, PingFang TC, sans-serif" font-size="11.5" fill="#475569">Cronbach's α ≥ 0.70, CR ≥ 0.70</text>
  <text x="591" y="174" font-family="Noto Sans TC, PingFang TC, sans-serif" font-size="12" fill="#334155">• 收斂效度：AVE &gt; 0.50</text>
  <text x="591" y="195" font-family="Noto Sans TC, PingFang TC, sans-serif" font-size="12" fill="#334155">• 區別效度：</text>
  <text x="601" y="213" font-family="Noto Sans TC, PingFang TC, sans-serif" font-size="11.5" fill="#475569">Fornell-Larcker 準則檢驗</text>
  <rect x="591" y="230" width="208" height="48" rx="8" fill="#f0fdfa" stroke="#0f766e"/>
  <text x="695" y="259" text-anchor="middle" font-family="Noto Sans TC, PingFang TC, sans-serif" font-size="12.5" font-weight="800" fill="#0f766e">✓ 全面通過信效度門檻</text>

  <!-- Arrow 3->4 -->
  <line x1="819" y1="160" x2="849" y2="160" stroke="#1b365d" stroke-width="2.8" marker-end="url(#arrz)"/>

  <!-- Stage 4 -->
  <rect x="855" y="24" width="225" height="272" rx="12" fill="#ffffff" stroke="#8c1d40" stroke-width="2" filter="url(#sh2z)"/>
  <rect x="855" y="24" width="225" height="44" rx="12" fill="#8c1d40"/>
  <rect x="855" y="54" width="225" height="14" fill="#8c1d40"/>
  <text x="967" y="51" text-anchor="middle" font-family="Noto Sans TC, PingFang TC, sans-serif" font-size="14.5" font-weight="800" fill="#ffffff">4. 結構模型檢定（內部模型）</text>
  <text x="871" y="92" font-family="Noto Sans TC, PingFang TC, sans-serif" font-size="13" font-weight="700" fill="#8c1d40">路徑係數與調節效果分析</text>
  <text x="871" y="114" font-family="Noto Sans TC, PingFang TC, sans-serif" font-size="12" fill="#334155">• 無母數拔靴法（Bootstrapping）</text>
  <text x="881" y="132" font-family="Noto Sans TC, PingFang TC, sans-serif" font-size="11.5" fill="#475569">（雙尾檢定，t &gt; 1.96, p &lt; 0.05）</text>
  <text x="871" y="154" font-family="Noto Sans TC, PingFang TC, sans-serif" font-size="12" fill="#334155">• 盲折法預測相關性：Q² &gt; 0</text>
  <text x="871" y="175" font-family="Noto Sans TC, PingFang TC, sans-serif" font-size="12" fill="#334155">• 模型解釋力：R²</text>
  <text x="871" y="196" font-family="Noto Sans TC, PingFang TC, sans-serif" font-size="12" fill="#334155">• 驗證 H1–H12（8 直接 ＋</text>
  <text x="881" y="214" font-family="Noto Sans TC, PingFang TC, sans-serif" font-size="11.5" fill="#475569">4 項主修科系調節路徑）</text>
  <rect x="871" y="230" width="193" height="48" rx="8" fill="#fdf2f5" stroke="#8c1d40"/>
  <text x="967" y="259" text-anchor="middle" font-family="Noto Sans TC, PingFang TC, sans-serif" font-size="12.5" font-weight="800" fill="#8c1d40">R² = 0.754 · Q² = 0.532</text>
</svg>
