<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 320" width="1100" height="320">
  <defs>
    <filter id="sh2" x="-4%" y="-6%" width="108%" height="114%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#1b365d"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1100" height="320" rx="14" fill="#f8fafc"/>

  <!-- Stage 1 -->
  <rect x="20" y="24" width="240" height="272" rx="12" fill="#ffffff" stroke="#1b365d" stroke-width="2" filter="url(#sh2)"/>
  <rect x="20" y="24" width="240" height="44" rx="12" fill="#1b365d"/>
  <rect x="20" y="54" width="240" height="14" fill="#1b365d"/>
  <text x="140" y="51" text-anchor="middle" font-family="Inter, sans-serif" font-size="14.5" font-weight="800" fill="#ffffff">1. Blended Course (Wks 1–6)</text>
  <text x="36" y="92" font-family="Inter, sans-serif" font-size="13" font-weight="700" fill="#1b365d">FCU Data Science (3 cr)</text>
  <text x="36" y="114" font-family="Inter, sans-serif" font-size="12" fill="#334155">• ~300 undergrads (Spring 2021)</text>
  <text x="36" y="135" font-family="Inter, sans-serif" font-size="12" fill="#334155">• 2 hr/wk online self-learning:</text>
  <text x="46" y="153" font-family="Inter, sans-serif" font-size="11.5" fill="#475569">Videos + Self-tests + OJ tasks</text>
  <text x="36" y="174" font-family="Inter, sans-serif" font-size="12" fill="#334155">• 1 hr/wk in-class Q&amp;A</text>
  <text x="36" y="195" font-family="Inter, sans-serif" font-size="12" fill="#334155">• OpenEdu SSO + TA Forum</text>
  <rect x="36" y="216" width="208" height="62" rx="8" fill="#f0fdfa" stroke="#99f6e4"/>
  <text x="140" y="240" text-anchor="middle" font-family="Inter, sans-serif" font-size="12.5" font-weight="700" fill="#0f766e">5 of 6 Units Gamified</text>
  <text x="140" y="261" text-anchor="middle" font-family="Inter, sans-serif" font-size="11.5" fill="#334155">Pass current unit to unlock next</text>

  <!-- Arrow 1->2 -->
  <line x1="264" y1="160" x2="294" y2="160" stroke="#1b365d" stroke-width="2.8" marker-end="url(#arr)"/>

  <!-- Stage 2 -->
  <rect x="300" y="24" width="235" height="272" rx="12" fill="#ffffff" stroke="#0f766e" stroke-width="2" filter="url(#sh2)"/>
  <rect x="300" y="24" width="235" height="44" rx="12" fill="#0f766e"/>
  <rect x="300" y="54" width="235" height="14" fill="#0f766e"/>
  <text x="417" y="51" text-anchor="middle" font-family="Inter, sans-serif" font-size="14.5" font-weight="800" fill="#ffffff">2. Survey Collection (Wk 7)</text>
  <text x="316" y="92" font-family="Inter, sans-serif" font-size="13" font-weight="700" fill="#0f766e">n = 187 Voluntary Responses</text>
  <text x="316" y="114" font-family="Inter, sans-serif" font-size="12" fill="#334155">• 22 total questionnaire items</text>
  <text x="316" y="135" font-family="Inter, sans-serif" font-size="12" fill="#334155">• 5-point Likert scale (1–5)</text>
  <text x="316" y="156" font-family="Inter, sans-serif" font-size="12" fill="#334155">• 8 latent constructs:</text>
  <text x="326" y="174" font-family="Inter, sans-serif" font-size="11.5" fill="#475569">PE, EE, SI, FC, HM, SE, ANX, BI</text>
  <text x="316" y="195" font-family="Inter, sans-serif" font-size="12" fill="#334155">• Demographics &amp; Major (MJR)</text>
  <rect x="316" y="216" width="203" height="62" rx="8" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="417" y="240" text-anchor="middle" font-family="Inter, sans-serif" font-size="12.5" font-weight="700" fill="#1b365d">Validated Adapted Scales</text>
  <text x="417" y="261" text-anchor="middle" font-family="Inter, sans-serif" font-size="11.5" fill="#475569">Venkatesh [12,13], Huang [17]</text>

  <!-- Arrow 2->3 -->
  <line x1="539" y1="160" x2="569" y2="160" stroke="#1b365d" stroke-width="2.8" marker-end="url(#arr)"/>

  <!-- Stage 3 -->
  <rect x="575" y="24" width="240" height="272" rx="12" fill="#ffffff" stroke="#1b365d" stroke-width="2" filter="url(#sh2)"/>
  <rect x="575" y="24" width="240" height="44" rx="12" fill="#1b365d"/>
  <rect x="575" y="54" width="240" height="14" fill="#1b365d"/>
  <text x="695" y="51" text-anchor="middle" font-family="Inter, sans-serif" font-size="14.5" font-weight="800" fill="#ffffff">3. Outer Model (PLS-SEM)</text>
  <text x="591" y="92" font-family="Inter, sans-serif" font-size="13" font-weight="700" fill="#1b365d">SmartPLS 3.0 Verification</text>
  <text x="591" y="114" font-family="Inter, sans-serif" font-size="12" fill="#334155">• Item Reliability: CL ≥ 0.70</text>
  <text x="591" y="135" font-family="Inter, sans-serif" font-size="12" fill="#334155">• Internal Consistency:</text>
  <text x="601" y="153" font-family="Inter, sans-serif" font-size="11.5" fill="#475569">Cronbach's α ≥ 0.70, CR ≥ 0.70</text>
  <text x="591" y="174" font-family="Inter, sans-serif" font-size="12" fill="#334155">• Convergent Validity: AVE &gt; 0.50</text>
  <text x="591" y="195" font-family="Inter, sans-serif" font-size="12" fill="#334155">• Discriminant Validity:</text>
  <text x="601" y="213" font-family="Inter, sans-serif" font-size="11.5" fill="#475569">Fornell-Larcker Criterion</text>
  <rect x="591" y="230" width="208" height="48" rx="8" fill="#f0fdfa" stroke="#0f766e"/>
  <text x="695" y="259" text-anchor="middle" font-family="Inter, sans-serif" font-size="12.5" font-weight="800" fill="#0f766e">✓ All Thresholds Passed</text>

  <!-- Arrow 3->4 -->
  <line x1="819" y1="160" x2="849" y2="160" stroke="#1b365d" stroke-width="2.8" marker-end="url(#arr)"/>

  <!-- Stage 4 -->
  <rect x="855" y="24" width="225" height="272" rx="12" fill="#ffffff" stroke="#8c1d40" stroke-width="2" filter="url(#sh2)"/>
  <rect x="855" y="24" width="225" height="44" rx="12" fill="#8c1d40"/>
  <rect x="855" y="54" width="225" height="14" fill="#8c1d40"/>
  <text x="967" y="51" text-anchor="middle" font-family="Inter, sans-serif" font-size="14.5" font-weight="800" fill="#ffffff">4. Inner Model Testing</text>
  <text x="871" y="92" font-family="Inter, sans-serif" font-size="13" font-weight="700" fill="#8c1d40">Path &amp; Moderation Analysis</text>
  <text x="871" y="114" font-family="Inter, sans-serif" font-size="12" fill="#334155">• Nonparametric Bootstrapping</text>
  <text x="881" y="132" font-family="Inter, sans-serif" font-size="11.5" fill="#475569">(two-tailed, t &gt; 1.96, p &lt; 0.05)</text>
  <text x="871" y="154" font-family="Inter, sans-serif" font-size="12" fill="#334155">• Blindfolding: Q² &gt; 0</text>
  <text x="871" y="175" font-family="Inter, sans-serif" font-size="12" fill="#334155">• Explanatory Power: R²</text>
  <text x="871" y="196" font-family="Inter, sans-serif" font-size="12" fill="#334155">• Tests H1–H12 (8 direct +</text>
  <text x="881" y="214" font-family="Inter, sans-serif" font-size="11.5" fill="#475569">4 MJR moderation paths)</text>
  <rect x="871" y="230" width="193" height="48" rx="8" fill="#fdf2f5" stroke="#8c1d40"/>
  <text x="967" y="259" text-anchor="middle" font-family="Inter, sans-serif" font-size="12.5" font-weight="800" fill="#8c1d40">R² = 0.754 · Q² = 0.532</text>
</svg>
