<h2 id="%E7%A0%B4%E9%A1%8C%E7%AC%AC-12-%E6%AC%A1%E6%8F%90%E4%BA%A4%E9%82%84%E6%98%AF-wa%E9%82%A3%E5%AD%B8%E7%94%9F%E7%82%BA%E4%BD%95%E4%BB%8D%E9%A1%98%E6%84%8F%E7%94%A8-online-judge">破題：「第 12 次提交還是 WA！」……那學生為何仍願意用 Online Judge？</h2>
<div class="fig-box" style="padding: 6px; margin-bottom: 10px; background: #fbf9f2;">
<img src="./img/judge_hook.jpg" alt="嚴格的線上評測系統 vs 真正驅動學生接受的關鍵因素" style="max-height: 410px; border-radius: 6px;" />
</div>
<div class="callout" style="margin-top: 6px; padding: 9px 16px;">
<strong>出乎意料的發現：</strong>多一個空白（<code>" 12"</code> vs. <code>"12"</code>）就會直接被判錯誤，但<strong>效率與易用性竟然不是關鍵</strong>！真正讓學生買單的是<strong>學習樂趣（享樂動機）</strong>、<strong>解題自信（自我效能）</strong>與<strong>師生同儕支持（社會影響）</strong>——且對資工與非資工學生一體適用。
</div>
<footer>Daramsenge Bilegjargal ＆ 薛念林（Nien-Lin Hsueh） · 逢甲大學資訊工程學系 · IEEE Access (2021)</footer>

<h2 id="%E7%B0%A1%E5%A0%B1%E5%A4%A7%E7%B6%B1">簡報大綱</h2>
<div class="outline-grid">
<div class="outline-item">
<div class="outline-num">1</div>
<div class="outline-body">
<p><a href="#4"><strong>研究動機與核心問題</strong></a><br />
為何遠距程式課程中的 Online Judge 接受度亟待研究，以及兩大研究問題（RQ1–RQ2）。</p>
</div>
</div>
<div class="outline-item">
<div class="outline-num">2</div>
<div class="outline-body">
<p><a href="#6"><strong>文獻回顧與研究缺口</strong></a><br />
線上評測系統（OJ）、UTAUT2 科技接受度模型與 PLS-SEM 小樣本因果建模。</p>
</div>
</div>
<div class="outline-item">
<div class="outline-num">3</div>
<div class="outline-body">
<p><a href="#7"><strong>研究模型與 12 項假設</strong></a><br />
延伸 UTAUT2（納入自我效能、焦慮感與主修科系）及 H1–H12 假設推演。</p>
</div>
</div>
<div class="outline-item">
<div class="outline-num">4</div>
<div class="outline-body">
<p><a href="#10"><strong>課程情境、問卷與樣本</strong></a><br />
逢甲大學 6 週翻轉式資料科學課程、22 題問卷（n = 187）與兩階段 PLS-SEM 流程。</p>
</div>
</div>
<div class="outline-item">
<div class="outline-num">5</div>
<div class="outline-body">
<p><a href="#12"><strong>PLS-SEM 測量與結構模型結果</strong></a><br />
信效度驗證、R<sup>2</sup> = 0.754、直接驅動因素（RQ1）與主修科系調節檢定（RQ2）。</p>
</div>
</div>
<div class="outline-item">
<div class="outline-num">6</div>
<div class="outline-body">
<p><a href="#15"><strong>深度討論、實務建議與結論</strong></a><br />
為何 8 項假設未成立、系統與教學設計指南、研究限制與未來方向。</p>
</div>
</div>
</div>
<footer>Daramsenge Bilegjargal ＆ 薛念林（Nien-Lin Hsueh） · 逢甲大學資訊工程學系 · IEEE Access (2021)</footer>
</section>

<h2 id="11-%E7%A0%94%E7%A9%B6%E5%8B%95%E6%A9%9F%E8%87%AA%E5%8B%95%E5%8C%96%E6%89%B9%E6%94%B9%E4%B8%8D%E7%AD%89%E6%96%BC%E5%AD%B8%E7%94%9F%E9%A1%98%E6%84%8F%E6%8E%A1%E7%94%A8">1.1 研究動機：自動化批改不等於學生願意採用</h2>
<div class="fig-box" style="padding: 10px 12px; margin-bottom: 10px;">
<img src="./img/diag1_oj_motivation_zh.svg" alt="系統導向之 OJ 工程與學習者導向之接受度建模對比" style="max-height: 365px;" />
</div>
<div class="callout">
<strong>研究重要性：</strong>雖然 Codeforces、UVa、SPOJ 與 Edgar 等自動化程式評測系統（APAS）大幅減輕教師批改負擔，但學界至今<strong>尚無實證研究</strong>探討學生在線上程式課程中對 OJ 系統的接受度成因。
</div>
<footer>Daramsenge Bilegjargal ＆ 薛念林（Nien-Lin Hsueh） · 逢甲大學資訊工程學系 · IEEE Access (2021)</footer>

;" data-marpit-pagination-total="19" data-size="16:9">

<h2 id="12-%E5%85%A9%E5%A4%A7%E6%A0%B8%E5%BF%83%E7%A0%94%E7%A9%B6%E5%95%8F%E9%A1%8Cresearch-questions">1.2 兩大核心研究問題（Research Questions）</h2>
<p>本研究以 <strong>UTAUT2 ＋ PLS-SEM</strong> 針對混成式程式設計課程中的 OJ 接受度提出兩大研究問題 <em>(逐步揭曉)</em>：</p>
<div class="rq-stage">
<ul>
<li data-marpit-fragment="1">
<div class="rq-card teal"><img src="./img/rq1_factors.svg" alt="RQ1 關鍵驅動因素" /><div><div class="rq-hook"><span class="rq-tag" style="background:#0f766e;">RQ1</span> 究竟是哪些關鍵因素，真正驅動學生接受 Online Judge？</div><div class="rq-q">在線上程式設計課程中，<strong>哪些構面</strong>（績效預期、努力預期、社會影響、促成條件、享樂動機、自我效能、焦慮感與主修科系）對學生的 <strong>OJ 系統接受度與使用意願（Behavioral Intention）</strong>具有顯著影響？</div></div></div>
</li>
<li data-marpit-fragment="2">
<div class="rq-card accent"><img src="./img/rq2_major.svg" alt="RQ2 主修科系調節效果" /><div><div class="rq-hook"><span class="rq-tag">RQ2</span> 資工與非資工主修背景，會改變這些因素的影響力嗎？</div><div class="rq-q"><strong>主修科系（Academic Major, MJR）是否扮演調節變項</strong>，進而改變各候選因素（EE、HM、SE、ANX）與學生使用 OJ 系統之<strong>行為意願</strong>之間的因果關係？</div></div></div>
</li>
</ul>
</div>
<footer>Daramsenge Bilegjargal ＆ 薛念林（Nien-Lin Hsueh） · 逢甲大學資訊工程學系 · IEEE Access (2021)</footer>
</section>

<h2 id="2-%E6%96%87%E7%8D%BB%E5%9B%9E%E9%A1%A7online-judgeutaut2-%E8%88%87-pls-sem">2. 文獻回顧：Online Judge、UTAUT2 與 PLS-SEM</h2>
<p>既有 OJ 文獻偏重系統工程與學習成效，而 UTAUT2 教育應用多聚焦於一般數位學習平台，尚未切入自動化程式評測情境。</p>
<table>
<thead>
<tr>
<th style="text-align:left">研究脈絡</th>
<th style="text-align:left">代表性文獻</th>
<th style="text-align:left">核心發現與焦點</th>
<th style="text-align:left">本研究填補之缺口</th>
</tr>
</thead>
<tbody>
<tr>
<td style="text-align:left"><strong>線上評測系統（OJ）</strong></td>
<td style="text-align:left">Mekterovic <em>et al.</em> (<em>Edgar</em>, 2020)；Petit <em>et al.</em> (<em>Jutge.org</em>, 2018)；Aleman (2011)；Galan <em>et al.</em> (2019)</td>
<td style="text-align:left">跨語言自動評測、競賽趣味性、提升留存率與作業完成度之成績正相關</td>
<td style="text-align:left">缺乏行為接受度實證模型，未能解釋學生<em>為何</em>願意持續使用 OJ</td>
</tr>
<tr>
<td style="text-align:left"><strong>教育科技之 UTAUT2</strong></td>
<td style="text-align:left">Venkatesh <em>et al.</em> (2003, 2012)；Huang (2020)；Jakkaew &amp; Hemrungrote (2017)；Salloum <em>et al.</em> (2019)</td>
<td style="text-align:left">整合 8 大理論（TRA、TPB、TAM 等）；PE、HM、SE 與趣味性顯著影響 VR、Google Classroom 與 LMS 採用</td>
<td style="text-align:left">首次將 UTAUT2 與主修調節機制應用於<strong>線上程式評測系統</strong></td>
</tr>
<tr>
<td style="text-align:left"><strong>PLS-SEM 統計建模</strong></td>
<td style="text-align:left">Hair <em>et al.</em> (2011, 2017)；Lin <em>et al.</em> (2019)；Wong (2013)</td>
<td style="text-align:left">無母數拔靴法；不須常態分佈假設、適用小樣本；採外部＋內部兩階段檢定</td>
<td style="text-align:left">最適合單學期課程實證調查（<code>n = 187</code>）與探索性預測建模</td>
</tr>
</tbody>
</table>
<div class="callout teal">
<strong>理論貢獻：</strong>首篇結合<strong>延伸 UTAUT2 模型</strong>（納入自我效能、焦慮感與主修科系）與 <strong>PLS-SEM</strong> 探討自動化程式評測接受度之實證研究。
</div>

<h2 id="31-%E7%90%86%E8%AB%96%E5%9F%BA%E7%A4%8E%E5%B0%87-utaut2-%E8%AA%BF%E9%81%A9%E8%87%B3%E7%B7%9A%E4%B8%8A%E7%A8%8B%E5%BC%8F%E8%A9%95%E6%B8%AC%E6%83%85%E5%A2%83">3.1 理論基礎：將 UTAUT2 調適至線上程式評測情境</h2>
<div class="split55">
<div class="left">
<div class="fig-box">
<img src="./img/fig1_utaut2.png" alt="圖 1：UTAUT2 概念架構" style="max-height: 390px;" />
<div class="fig-cap">圖 1：原始 UTAUT2 概念架構（Venkatesh et al., 2012 [13]）</div>
</div>
</div>
<div class="right small-text">
<h3 id="%F0%9F%8E%AF-%E4%BE%9D%E8%AA%B2%E7%A8%8B%E6%83%85%E5%A2%83%E9%80%B2%E8%A1%8C%E6%A7%8B%E9%9D%A2%E8%AA%BF%E9%81%A9"><img class="emoji" draggable="false" alt="🎯" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f3af.svg" data-marp-twemoji=""/> 依課程情境進行構面調適</h3>
<ul>
<li><strong>保留核心 UTAUT2 構面（5 項）</strong>：
<ul>
<li>績效預期（<code>PE</code>）、努力預期（<code>EE</code>）、社會影響（<code>SI</code>）、促成條件（<code>FC</code>）、享樂動機（<code>HM</code>）</li>
</ul>
</li>
<li><strong>排除不適用構面（3 項）</strong>：
<ul>
<li><em>價格價值（Price Value）</em>：校內教學用 OJ <strong>完全免費</strong>。</li>
<li><em>習慣（Habit）</em>：屬課程階段性工具，非日常消費軟體。</li>
<li><em>實際使用行為（Use Behavior）</em>：屬必修課程情境，故以 <code>BI</code> 預測未來自主使用意願（如 LeetCode）。</li>
</ul>
</li>
<li><strong>新增程式學習關鍵變項（3 項）</strong>：
<ul>
<li><strong>自我效能（<code>SE</code>）</strong>、<strong>焦慮感（<code>ANX</code>）<strong>與</strong>主修科系（<code>MJR</code>）</strong>（資工／電機／其他科系）。</li>
</ul>
</li>
</ul>
</div>
</div>
<footer>Daramsenge Bilegjargal ＆ 薛念林（Nien-Lin Hsueh） · 逢甲大學資訊工程學系 · IEEE Access (2021)</footer>
</section>

<h2 id="32-%E6%9C%AC%E7%A0%94%E7%A9%B6%E6%A8%A1%E5%9E%8B%E8%88%87-12-%E9%A0%85%E5%81%87%E8%A8%ADh1%E2%80%93h12">3.2 本研究模型與 12 項假設（H1–H12）</h2>
<div class="split55">
<div class="left">
<div class="fig-box">
<img src="./img/fig2_research_model.png" alt="圖 2：本研究延伸 UTAUT2 模型與 H1-H12 假設" style="max-height: 395px;" />
<div class="fig-cap">圖 2：延伸版 UTAUT2 研究模型（粗黑線代表主修科系之調節路徑）</div>
</div>
</div>
<div class="right small-text">
<h3 id="%F0%9F%93%8B-%E7%AC%AC%E4%B8%80%E7%B5%84%E5%B0%8D%E8%A1%8C%E7%82%BA%E6%84%8F%E9%A1%98%E4%B9%8B%E7%9B%B4%E6%8E%A5%E5%BD%B1%E9%9F%BF8-%E6%A2%9D"><img class="emoji" draggable="false" alt="📋" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4cb.svg" data-marp-twemoji=""/> 第一組：對行為意願之直接影響（8 條）</h3>
<ul>
<li><strong>H1</strong>：<code>PE ➔ BI</code> (+) · <strong>H2</strong>：<code>EE ➔ BI</code> (+)</li>
<li><strong>H4</strong>：<code>SI ➔ BI</code> (+) · <strong>H5</strong>：<code>FC ➔ BI</code> (+)</li>
<li><strong>H6</strong>：<code>HM ➔ BI</code> (+) · <strong>H8</strong>：<code>SE ➔ BI</code> (+)</li>
<li><strong>H10</strong>：<code>ANX ➔ BI</code> (−) · <strong>H12</strong>：<code>MJR ➔ BI</code> (+)</li>
</ul>
<h3 id="%F0%9F%8E%93-%E7%AC%AC%E4%BA%8C%E7%B5%84%E4%B8%BB%E4%BF%AE%E7%A7%91%E7%B3%BB%E4%B9%8B%E8%AA%BF%E7%AF%80%E6%95%88%E6%9E%9C4-%E6%A2%9D"><img class="emoji" draggable="false" alt="🎓" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f393.svg" data-marp-twemoji=""/> 第二組：主修科系之調節效果（4 條）</h3>
<ul>
<li><strong>H3</strong>：<code>MJR × EE ➔ BI</code>（既定開發環境熟悉度）</li>
<li><strong>H7</strong>：<code>MJR × HM ➔ BI</code>（資工背景對寫程式的興趣）</li>
<li><strong>H9</strong>：<code>MJR × SE ➔ BI</code>（過往解題累積之自信心）</li>
<li><strong>H11</strong>：<code>MJR × ANX ➔ BI</code>（面對試誤之焦慮敏感度）</li>
</ul>

<h2 id="33-%E6%A7%8B%E9%9D%A2%E6%8E%A8%E8%AB%96%E8%88%87-oj-%E8%AA%B2%E5%A0%82%E7%9C%9F%E5%AF%A6%E7%97%9B%E9%BB%9E">3.3 構面推論與 OJ 課堂真實痛點</h2>
<div class="two-col">
<div class="card small-text">
<h3 id="%F0%9F%9B%A0%EF%B8%8F-%E6%A0%B8%E5%BF%83-utaut-%E6%A7%8B%E9%9D%A2pe-ee-si-fc"><img class="emoji" draggable="false" alt="🛠️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f6e0.svg" data-marp-twemoji=""/> 核心 UTAUT 構面（PE, EE, SI, FC）</h3>
<ul>
<li><strong>績效預期（<code>PE</code>）</strong>：即時編譯與測試回饋有助於學生反覆修正程式碼品質，直到通過所有測資。</li>
<li><strong>努力預期（<code>EE</code>）</strong>：介面結構單純，但整合 OpenEdu 單一登入與嚴格測資判讀仍增加學習門檻。</li>
<li><strong>社會影響（<code>SI</code>）</strong>：逢甲資工自建 OJ 並鼓勵<strong>學長姐、助教與同儕</strong>於系統上互助解題。</li>
<li><strong>促成條件（<code>FC</code>）</strong>：嚴格字元比對（如 <code>&quot; 12&quot;</code> ≠ <code>&quot;12&quot;</code>）極易引發挫敗感，凸顯指引與資源之重要性。</li>
</ul>
</div>
<div class="card teal small-text">
<h3 id="%F0%9F%A7%A0-%E5%BF%83%E7%90%86%E8%88%87%E8%83%8C%E6%99%AF%E6%A7%8B%E9%9D%A2hm-se-anx-mjr"><img class="emoji" draggable="false" alt="🧠" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f9e0.svg" data-marp-twemoji=""/> 心理與背景構面（HM, SE, ANX, MJR）</h3>
<ul>
<li><strong>享樂動機（<code>HM</code>）</strong>：<strong>6 個單元中有 5 個融入遊戲化關卡</strong>，學生須通過當前單元才能解鎖下一關，維持學習動力。</li>
<li><strong>自我效能（<code>SE</code>）</strong>：遠距自主練習時，無老師在旁也能獨立排錯與完成任務的自信心。</li>
<li><strong>焦慮感（<code>ANX</code>）</strong>：平均需提交 <strong>12 次</strong>才通過、擔心誤按遺失程式碼，加上<strong>公開排行榜</strong>可能加劇成績壓力。</li>
<li><strong>主修科系（<code>MJR</code>）</strong>：資工系將寫程式視為核心職能，電機系具中度經驗，外系則多屬初學者。</li>
</ul>
</div>
</div>

<img src="./img/diag2_study_pipeline_zh.svg" alt="逢甲大學混成翻轉課程與兩階段 PLS-SEM 分析流程" style="max-height: 310px;" />

<h3 id="%E2%9A%96%EF%B8%8F-%E7%84%A1%E8%AA%BF%E7%AF%80%E6%95%88%E6%9E%9Ch3-h7-h9-h11-%E6%8B%92%E7%B5%95"><img class="emoji" draggable="false" alt="⚖️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/2696.svg" data-marp-twemoji=""/> 無調節效果（<code>H3, H7, H9, H11</code> 拒絕）</h3>
<ul>
<li>無論是<strong>資工、電機或其他科系</strong>，學習樂趣（<code>HM</code>）與解題自信（<code>SE</code>）皆以同等強度驅動使用意願。</li>
<li>資工與非資工學生同樣未覺得系統特別便利（<code>H3</code>），也同樣未因使用 OJ 而感到焦慮（<code>H11</code>）。</li>

<h3 id="%F0%9F%8E%AF-%E4%BD%86%E5%85%B7%E9%A1%AF%E8%91%97%E7%9B%B4%E6%8E%A5%E6%95%88%E6%9E%9Ch12-p--0026"><img class="emoji" draggable="false" alt="🎯" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f3af.svg" data-marp-twemoji=""/> 但具顯著直接效果（<code>H12</code>, p = 0.026*）</h3>
<ul>
<li>主修科系仍<strong>直接影響基準使用意願</strong>（<code>t = 2.239</code>），反映職涯對程式練習（如未來使用 LeetCode）的需求差異。</li>
<li><strong>正向啟示</strong>：只要具備動機、自信與支持，非資工學生同樣能在 OJ 課程中脫穎而出！</li>
</ul>

<h2 id="61-%E6%B7%B1%E5%BA%A6%E8%A8%BA%E6%96%B7%E7%82%BA%E4%BD%95%E6%9C%89-8-%E9%A0%85%E5%81%87%E8%A8%AD%E6%9C%AA%E6%88%90%E7%AB%8B">6.1 深度診斷：為何有 8 項假設未成立？</h2>
<p>將「不顯著」的統計結果，轉化為具體的 <strong>OJ 系統體驗與課程設計診斷</strong>：</p>
<table>
<thead>
<tr>
<th style="text-align:left">未成立假設</th>
<th style="text-align:center">檢定結果</th>
<th style="text-align:left">訪談與課程脈絡之根因診斷</th>
<th style="text-align:left">具體設計啟示</th>
</tr>
</thead>
<tbody>
<tr>
<td style="text-align:left"><strong>H1：<code>PE ➔ BI</code></strong></td>
<td style="text-align:center"><code>p = 0.373</code> (NS)</td>
<td style="text-align:left">與專業 IDE 相比，OJ 缺乏<strong>除錯資訊（debug info）</strong>，削弱學生對開發效率的期待</td>
<td style="text-align:left">於 OJ 內建階段性<strong>除錯提示與錯誤診斷</strong>功能</td>
</tr>
<tr>
<td style="text-align:left"><strong>H2：<code>EE ➔ BI</code></strong></td>
<td style="text-align:center"><code>p = 0.648</code> (NS)</td>
<td style="text-align:left">網頁編輯器體驗不佳：例如按 Enter <strong>自動縮排</strong>卻須手動刪除，否則 Python 直接編譯錯誤</td>
<td style="text-align:left">改善程式碼編輯器縮排與現代化 IDE 體驗</td>
</tr>
<tr>
<td style="text-align:left"><strong>H5：<code>FC ➔ BI</code></strong></td>
<td style="text-align:center"><code>p = 0.922</code> (NS)</td>
<td style="text-align:left">線上課程事前已提供清楚操作指引與提醒，基本門檻已被消弭（天花板效應）</td>
<td style="text-align:left">持續維護簡明的新手操作指南與 FAQ</td>
</tr>
<tr>
<td style="text-align:left"><strong>H10：<code>ANX ➔ BI</code></strong></td>
<td style="text-align:center"><code>p = 0.778</code> (NS)</td>
<td style="text-align:left">教師事前錄製之<strong>排錯指引影片</strong>有效降低各系學生焦慮——「不好用」不等於「會害怕」</td>
<td style="text-align:left">保留短影音排錯教學，穩定自主學習信心</td>
</tr>
<tr>
<td style="text-align:left"><strong>H3, H7, H9, H11</strong></td>
<td style="text-align:center"><code>p = 0.325–0.977</code></td>
<td style="text-align:left">資工生嫌 OJ 不如專業 IDE、外系生覺得操作仍有難度；但樂趣與自信對全體學生皆關鍵</td>
<td style="text-align:left">打造<strong>跨科系通用之遊戲化與鷹架支持</strong>設計</td>
</tr>
</tbody>
</table>

<h2 id="62-%E5%AF%A6%E5%8B%99%E5%BB%BA%E8%AD%B0%E7%B5%A6-oj-%E9%96%8B%E7%99%BC%E8%80%85%E8%88%87%E6%8E%88%E8%AA%B2%E6%95%99%E5%B8%AB%E7%9A%84%E8%A1%8C%E5%8B%95%E6%8C%87%E5%8D%97">6.2 實務建議：給 OJ 開發者與授課教師的行動指南</h2>
<div class="two-col">
<div class="card small-text">
<h3 id="%F0%9F%92%BB-%E7%B5%A6-oj-%E7%B3%BB%E7%B5%B1%E9%96%8B%E7%99%BC%E8%80%85%E8%88%87%E5%A4%A7%E5%AD%B8%E6%B1%BA%E7%AD%96%E8%80%85"><img class="emoji" draggable="false" alt="💻" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4bb.svg" data-marp-twemoji=""/> 給 OJ 系統開發者與大學決策者</h3>
<ol>
<li><strong>深化遊戲化機制（<code>HM</code>, β = 0.400）</strong>：
<ul>
<li>強化闖關式單元、進度條、徽章與任務回饋，維持遠距學習的持續動機。</li>
</ul>
</li>
<li><strong>補齊除錯支援功能（<code>PE</code>）</strong>：
<ul>
<li>提供結構化的編譯／執行期除錯資訊，取代冰冷單一的 <code>Wrong Answer</code> 結果。</li>
</ul>
</li>
<li><strong>消除編輯器操作摩擦（<code>EE</code>）</strong>：
<ul>
<li>修正如 Python 自動縮排誤判等編輯器缺陷，優化單一登入與提交流程。</li>
</ul>
</li>
<li><strong>降低評測焦慮設計（<code>ANX</code>）</strong>：
<ul>
<li>加入草稿自動儲存，並審慎設計常駐公開排行榜以避免過度成績焦慮。</li>
</ul>
</li>
</ol>
</div>
<div class="card teal small-text">
<h3 id="%F0%9F%91%A9%E2%80%8D%F0%9F%8F%AB-%E7%B5%A6%E7%A8%8B%E5%BC%8F%E8%A8%AD%E8%A8%88%E6%95%99%E5%B8%AB%E8%88%87%E8%AA%B2%E7%A8%8B%E8%A8%AD%E8%A8%88%E8%80%85"><img class="emoji" draggable="false" alt="👩‍🏫" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f469-200d-1f3eb.svg" data-marp-twemoji=""/> 給程式設計教師與課程設計者</h3>
<ol>
<li><strong>刻意培養自我效能（<code>SE</code>, β = 0.316）</strong>：
<ul>
<li>錄製簡短<strong>排錯教學影片</strong>並設計由淺入深的題組，幫助學生建立獨立解決問題的自信。</li>
</ul>
</li>
<li><strong>強化正向社會支持（<code>SI</code>, β = 0.245）</strong>：
<ul>
<li>善用<strong>課程討論區、助教即時回覆、電子郵件、通訊軟體與學長姐互助</strong>，維繫學習歸屬感。</li>
</ul>
</li>
<li><strong>友善跨科系學習者（<code>MJR</code>）</strong>：
<ul>
<li>勿預設非資工學生無法適應 OJ：清楚指引 ＋ 遊戲化題目 ＋ 師生支持即可跨越科系門檻。</li>
</ul>
</li>
</ol>
</div>
</div>
<footer>Daramsenge Bilegjargal ＆ 薛念林（Nien-Lin Hsueh） · 逢甲大學資訊工程學系 · IEEE Access (2021)</footer>

<h2 id="7-%E7%A0%94%E7%A9%B6%E9%99%90%E5%88%B6%E8%88%87%E6%95%88%E5%BA%A6%E5%A8%81%E8%84%85">7. 研究限制與效度威脅</h2>
<div class="three-col">
<div class="card small-text">
<h3 id="%F0%9F%8F%AB-%E5%96%AE%E4%B8%80%E8%AA%B2%E7%A8%8B%E6%A8%A3%E6%9C%AC%E7%AF%84%E5%9C%8D"><img class="emoji" draggable="false" alt="🏫" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f3eb.svg" data-marp-twemoji=""/> 單一課程樣本範圍</h3>
<ul>
<li>受試者（<code>n = 187</code>）皆來自台灣逢甲大學之<strong>單一大學部課程</strong>。</li>
<li><strong>83.4%</strong> 為資工系學生且 <strong>80.2%</strong> 曾用過 OJ，推論至全初學者或人文社科族群時仍須審慎驗證。</li>
</ul>
</div>
<div class="card accent small-text">
<h3 id="%F0%9F%93%85-%E5%B9%B4%E9%BD%A1%E8%88%87%E8%83%8C%E6%99%AF%E5%90%8C%E8%B3%AA%E6%80%A7"><img class="emoji" draggable="false" alt="📅" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4c5.svg" data-marp-twemoji=""/> 年齡與背景同質性</h3>
<ul>
<li>由於大學部受試者年齡高度集中，無法檢驗 UTAUT2 基本調節變項之一——<strong>年齡（Age）</strong>的效果。</li>
<li>未來可擴大納入跨年齡層樣本（如 <strong>MOOCs 磨課師</strong>學習者）檢驗年齡調節效應。</li>
</ul>
</div>
<div class="card teal small-text">
<h3 id="%F0%9F%93%88-%E4%BD%BF%E7%94%A8%E6%84%8F%E9%A1%98-vs-%E9%95%B7%E6%9C%9F%E5%AF%A6%E9%9A%9B%E4%BD%BF%E7%94%A8"><img class="emoji" draggable="false" alt="📈" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4c8.svg" data-marp-twemoji=""/> 使用意願 vs. 長期實際使用</h3>
<ul>
<li>本研究於 6 週練習後測量<strong>行為意願（<code>BI</code>）</strong>，尚未追蹤課後長期自主使用行為（如持續刷 LeetCode）。</li>
<li>未來結合<strong>問卷資料與 OJ 系統提交日誌</strong>，將能更完整驗證意願與實際行為之連結。</li>
</ul>
</div>
</div>
<footer>Daramsenge Bilegjargal ＆ 薛念林（Nien-Lin Hsueh） · 逢甲大學資訊工程學系 · IEEE Access (2021)</footer>
</section>

<h2 id="8-%E7%B5%90%E8%AB%96%E8%88%87%E6%9C%AA%E4%BE%86%E7%A0%94%E7%A9%B6%E6%96%B9%E5%90%91">8. 結論與未來研究方向</h2>
<div class="fig-box" style="padding: 8px 10px; margin-bottom: 8px;">
<img src="./img/diag3_rq_conclusions_zh.svg" alt="RQ1 與 RQ2 實證結論視覺總覽" style="max-height: 355px;" />
</div>
<div class="future-strip">
<div class="future-pill"><strong>🌐 1. 擴大跨校與 MOOCs 樣本</strong><br />將調查對象延伸至跨校課程與大型開放式線上課程（MOOCs），提升外部效度。</div>
<div class="future-pill"><strong>👥 2. 年齡調節與長期追蹤</strong><br />納入多元年齡層檢驗年齡調節效果，並串接 OJ 提交紀錄追蹤長期實際使用行為。</div>
<div class="future-pill"><strong>🎮 3. 遊戲化 ＋ 除錯型新一代 OJ</strong><br />結合更豐富的遊戲化元素、內建除錯輔助與流暢編輯器，全面提升學生接受度。</div>
</div>

<script>
document.addEventListener('click', (e) => {
  const btn = e.target.closest('.nav-btn');
  if (btn) {
    e.stopPropagation();
    const dd = btn.closest('.nav-dropdown');
    const wasOpen = dd.classList.contains('open');
    document.querySelectorAll('.nav-dropdown.open').forEach(el => el.classList.remove('open'));
    if (!wasOpen) dd.classList.add('open');
    return;
  }
  document.querySelectorAll('.nav-dropdown.open').forEach(el => el.classList.remove('open'));
});

// Dynamic bounded in-place hover zoom (max 2.15x, strictly within 1280x720 safe area)
document.querySelectorAll('.split64 .fig-box img, .split55 .fig-box img, .split46 .fig-box img, .split73 .fig-box img, .two-col .fig-box img, .three-col .fig-box img').forEach((img) => {
  const box = img.closest('.fig-box');
  img.addEventListener('mouseenter', () => {
    const sec = img.closest('section');
    if (!sec) return;
    img.style.transform = '';
    const sr = sec.getBoundingClientRect();
    const ir = img.getBoundingClientRect();
    if (!ir.width || !ir.height) return;
    const padX = sr.width * (24 / 1280);
    const padTop = sr.height * (52 / 720);
    const padBot = sr.height * (22 / 720);
    const safeL = sr.left + padX;
    const safeR = sr.right - padX;
    const safeT = sr.top + padTop;
    const safeB = sr.bottom - padBot;
    const maxW = safeR - safeL;
    const maxH = safeB - safeT;
    const s = Math.min(2.15, (maxW / ir.width) * 0.98, (maxH / ir.height) * 0.98);
    if (s <= 1.03) return;
    const L = Math.max(0, ir.left - safeL);
    const R = Math.max(0, safeR - ir.right);
    const T = Math.max(0, ir.top - safeT);
    const B = Math.max(0, safeB - ir.bottom);
    const ox = (L + R) > 0 ? (L / (L + R)) * 100 : 50;
    const oy = (T + B) > 0 ? (T / (T + B)) * 100 : 50;
    img.style.transformOrigin = ox.toFixed(1) + '% ' + oy.toFixed(1) + '%';
    img.style.transform = 'scale(' + s.toFixed(3) + ')';
    img.classList.add('is-zoomed');
    if (box) box.classList.add('is-zoomed');
  });
  img.addEventListener('mouseleave', () => {
    img.style.transform = '';
    img.classList.remove('is-zoomed');
    if (box) box.classList.remove('is-zoomed');
  });
});

</script>
