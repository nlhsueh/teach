<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 340" width="960" height="340">
  <rect width="960" height="340" fill="#ffffff" rx="10"/>

  <!-- Left Panel: Sliding Window Token Optimizer -->
  <rect x="18" y="18" width="450" height="304" rx="8" fill="#f8fafc" stroke="#1b365d" stroke-width="2"/>
  <rect x="18" y="18" width="450" height="32" rx="8" fill="#1b365d"/>
  <rect x="18" y="40" width="450" height="10" fill="#1b365d"/>
  <text x="243" y="39" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#ffffff">TBB Pipeline 5-Token Sliding-Window Optimizer</text>

  <text x="36" y="74" font-family="Inter, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#334155">Groups 5 consecutive token counts to locate minimum mean latency:</text>

  <!-- Mini Bar Chart for Windows -->
  <text x="38" y="108" font-family="JetBrains Mono, monospace" font-size="11.5" font-weight="700" fill="#334155">Tokens 1-5</text>
  <rect x="135" y="93" width="240" height="22" rx="4" fill="#94a3b8"/>
  <text x="384" y="109" font-family="Inter, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#334155">17.6 ms</text>

  <text x="38" y="142" font-family="JetBrains Mono, monospace" font-size="11.5" font-weight="700" fill="#334155">Tokens 2-6</text>
  <rect x="135" y="127" width="169" height="22" rx="4" fill="#64748b"/>
  <text x="314" y="143" font-family="Inter, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#334155">12.4 ms</text>

  <text x="38" y="176" font-family="JetBrains Mono, monospace" font-size="11.5" font-weight="700" fill="#0f766e">Tokens 3-7</text>
  <rect x="135" y="161" width="161" height="22" rx="4" fill="#0f766e"/>
  <text x="306" y="177" font-family="Inter, Arial, sans-serif" font-size="11.5" font-weight="800" fill="#0f766e">11.8 ms (OPT)</text>

  <text x="38" y="210" font-family="JetBrains Mono, monospace" font-size="11.5" font-weight="700" fill="#8c1d40">Tokens 4-8</text>
  <rect x="135" y="195" width="169" height="22" rx="4" fill="#8c1d40"/>
  <text x="314" y="211" font-family="Inter, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#8c1d40">12.4 ms (Rise)</text>

  <rect x="36" y="236" width="414" height="70" rx="6" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.5"/>
  <text x="243" y="256" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#0f766e">Recommended Tokens (1280x1024 Image Pipeline)</text>
  <text x="243" y="276" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="11.5" fill="#0f172a">1 Core: 5-9  |  2 Cores: 6-10  |  3 Cores: 7-11  |  4 Cores: 8-12</text>
  <text x="243" y="295" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="10.5" fill="#475569">Avoids both under-parallelism (&lt;5) and excess buffer overhead</text>

  <!-- Right Panel: Interrupt Response Scaling -->
  <rect x="490" y="18" width="452" height="304" rx="8" fill="#fdf2f5" stroke="#8c1d40" stroke-width="2"/>
  <rect x="490" y="18" width="452" height="32" rx="8" fill="#8c1d40"/>
  <rect x="490" y="40" width="452" height="10" fill="#8c1d40"/>
  <text x="716" y="39" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#ffffff">Interrupt-Driven Video Streaming (ARM11 1-4 Cores)</text>

  <text x="508" y="74" font-family="Inter, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#334155">6-Stage Video Pipeline (512x384) + 20 Thinning Interrupts:</text>

  <rect x="508" y="92" width="416" height="44" rx="6" fill="#ffffff" stroke="#fda4af" stroke-width="1.5"/>
  <text x="524" y="111" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="700" fill="#8c1d40">1 Core Processor</text>
  <text x="524" y="128" font-family="Inter, Arial, sans-serif" font-size="11" fill="#334155">Manageable only when interrupt interval &gt;= 4 sec</text>

  <rect x="508" y="146" width="416" height="44" rx="6" fill="#ffffff" stroke="#fbbf24" stroke-width="1.5"/>
  <text x="524" y="165" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="700" fill="#b45309">2 Core Processors</text>
  <text x="524" y="182" font-family="Inter, Arial, sans-serif" font-size="11" fill="#334155">Manageable when interrupt interval &gt;= 2 sec (2x capacity)</text>

  <rect x="508" y="200" width="416" height="44" rx="6" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.5"/>
  <text x="524" y="219" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="700" fill="#0f766e">3 &amp; 4 Core Processors</text>
  <text x="524" y="236" font-family="Inter, Arial, sans-serif" font-size="11" fill="#0f172a">Smooth video execution; stays intact under heavy interrupts</text>

  <rect x="508" y="256" width="416" height="50" rx="6" fill="#1b365d"/>
  <text x="716" y="276" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#ffffff">Practical Engineering Value</text>
  <text x="716" y="294" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="10.5" fill="#cbd5e1">Right-size minimum-cost embedded hardware for real-time SLA</text>
</svg>
