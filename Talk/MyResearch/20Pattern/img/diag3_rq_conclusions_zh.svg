<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 350" width="1120" height="350">
  <!-- Top banner -->
  <rect x="8" y="6" width="1104" height="40" rx="10" fill="#1b365d"/>
  <text x="560" y="32" text-anchor="middle" font-family="'Noto Sans TC', 'PingFang TC', Inter, sans-serif" font-size="16" font-weight="800" fill="#ffffff">實證總結：11 種設計模式 · 15 個開源軟體專案 · 296 次版本演化</text>

  <!-- Card 1: RQ1 (Teal) -->
  <rect x="8" y="60" width="356" height="222" rx="12" fill="#f0fdfa" stroke="#0f766e" stroke-width="2.2"/>
  <rect x="24" y="76" width="160" height="24" rx="12" fill="#0f766e"/>
  <text x="104" y="92" text-anchor="middle" font-family="'Noto Sans TC', 'PingFang TC', Inter, sans-serif" font-size="11.5" font-weight="800" fill="#ffffff">RQ1 · 設計模式類型</text>
  <text x="24" y="128" font-family="'Noto Sans TC', 'PingFang TC', Inter, sans-serif" font-size="19" font-weight="800" fill="#1b365d">類型間無顯著差異</text>
  <rect x="24" y="140" width="324" height="32" rx="7" fill="#ffffff" stroke="#99f6e4" stroke-width="1.5"/>
  <text x="186" y="161" text-anchor="middle" font-family="JetBrains Mono,monospace" font-size="13" font-weight="700" fill="#0f766e">F = 1.569 · p = 0.146 (&gt; 0.05)</text>
  <text x="26" y="200" font-family="'Noto Sans TC', 'PingFang TC', Inter, sans-serif" font-size="13" font-weight="600" fill="#334155">• 各類模式平均 DoU 普遍低於 0.20</text>
  <text x="26" y="226" font-family="'Noto Sans TC', 'PingFang TC', Inter, sans-serif" font-size="13" font-weight="600" fill="#334155">• Visitor 皆為 0；Prototype 最高僅 0.060</text>
  <text x="26" y="252" font-family="'Noto Sans TC', 'PingFang TC', Inter, sans-serif" font-size="13" font-weight="600" fill="#334155">• 套用決策常受開發者習慣與熟悉度影響</text>

  <!-- Card 2: RQ2 (Crimson) -->
  <rect x="382" y="60" width="356" height="222" rx="12" fill="#fdf2f5" stroke="#8c1d40" stroke-width="2.2"/>
  <rect x="398" y="76" width="160" height="24" rx="12" fill="#8c1d40"/>
  <text x="478" y="92" text-anchor="middle" font-family="'Noto Sans TC', 'PingFang TC', Inter, sans-serif" font-size="11.5" font-weight="800" fill="#ffffff">RQ2 · 開源軟體專案</text>
  <text x="398" y="128" font-family="'Noto Sans TC', 'PingFang TC', Inter, sans-serif" font-size="19" font-weight="800" fill="#8c1d40">專案間具極顯著差異</text>
  <rect x="398" y="140" width="324" height="32" rx="7" fill="#ffffff" stroke="#fecdd3" stroke-width="1.5"/>
  <text x="560" y="161" text-anchor="middle" font-family="JetBrains Mono,monospace" font-size="13" font-weight="700" fill="#8c1d40">F = 5.704 · p &lt; 0.001 (Scheffé)</text>
  <text x="400" y="200" font-family="'Noto Sans TC', 'PingFang TC', Inter, sans-serif" font-size="13" font-weight="600" fill="#334155">• FreeMind 顯著優於其他 8 個開源專案</text>
  <text x="400" y="226" font-family="'Noto Sans TC', 'PingFang TC', Inter, sans-serif" font-size="13" font-weight="600" fill="#334155">• 最高值：JHotDraw 的 Observer (0.350)</text>
  <text x="400" y="252" font-family="'Noto Sans TC', 'PingFang TC', Inter, sans-serif" font-size="13" font-weight="600" fill="#334155">• MVC 圖形介面領域高度發揮 Observer/Decorator</text>

  <!-- Card 3: Practical Impact (Navy) -->
  <rect x="756" y="60" width="356" height="222" rx="12" fill="#f8fafc" stroke="#1b365d" stroke-width="2.2"/>
  <rect x="772" y="76" width="160" height="24" rx="12" fill="#1b365d"/>
  <text x="852" y="92" text-anchor="middle" font-family="'Noto Sans TC', 'PingFang TC', Inter, sans-serif" font-size="11.5" font-weight="800" fill="#ffffff">實務應用價值</text>
  <text x="772" y="128" font-family="'Noto Sans TC', 'PingFang TC', Inter, sans-serif" font-size="19" font-weight="800" fill="#1b365d">演化導向的維護決策支援</text>
  <rect x="772" y="140" width="324" height="32" rx="7" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="934" y="161" text-anchor="middle" font-family="'Noto Sans TC', 'PingFang TC', Inter, sans-serif" font-size="13" font-weight="700" fill="#1b365d">PUA 自動化診斷工具</text>
  <text x="774" y="200" font-family="'Noto Sans TC', 'PingFang TC', Inter, sans-serif" font-size="13" font-weight="600" fill="#334155">• 開發者：即時掌握已部署模式之實際使用率</text>
  <text x="774" y="226" font-family="'Noto Sans TC', 'PingFang TC', Inter, sans-serif" font-size="13" font-weight="600" fill="#334155">• 分析師：決策重構活化或移除冗餘設計模式</text>
  <text x="774" y="252" font-family="'Noto Sans TC', 'PingFang TC', Inter, sans-serif" font-size="13" font-weight="600" fill="#334155">• 管理者：定位需求變更與原始設計規劃的落差</text>

  <!-- Bottom takeaway bar -->
  <rect x="8" y="296" width="1104" height="46" rx="10" fill="#eef2ff" stroke="#1b365d" stroke-width="1.8"/>
  <text x="560" y="325" text-anchor="middle" font-family="'Noto Sans TC', 'PingFang TC', Inter, sans-serif" font-size="14.5" font-weight="800" fill="#1b365d">💡 核心啟示：套用設計模式不等於自動獲得維護效益 — 真正決定使用度的是專案領域與紀律性的架構演化。</text>
</svg>