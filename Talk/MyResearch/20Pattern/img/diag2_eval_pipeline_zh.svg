<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 355" width="1120" height="355">
  <defs>
    <marker id="an" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="#1b365d"/>
    </marker>
    <marker id="at" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="#0f766e"/>
    </marker>
    <marker id="ac" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="#8c1d40"/>
    </marker>
  </defs>

  <!-- Track A container -->
  <rect x="8" y="10" width="705" height="155" rx="12" fill="#f8fafc" stroke="#1b365d" stroke-width="2"/>
  <rect x="8" y="10" width="705" height="34" rx="12" fill="#1b365d"/>
  <rect x="8" y="30" width="705" height="14" fill="#1b365d"/>
  <text x="26" y="33" font-family="'Noto Sans TC', 'PingFang TC', Inter, sans-serif" font-size="14.5" font-weight="800" fill="#ffffff">路徑 A · 理論層：設計模式分析（定義預期使用方式）</text>

  <!-- Track A boxes -->
  <rect x="24" y="62" width="198" height="84" rx="9" fill="#ffffff" stroke="#1b365d" stroke-width="1.8"/>
  <text x="123" y="96" text-anchor="middle" font-family="'Noto Sans TC', 'PingFang TC', Inter, sans-serif" font-size="14" font-weight="800" fill="#1b365d">1. 模式角色分類</text>
  <text x="123" y="122" text-anchor="middle" font-family="'Noto Sans TC', 'PingFang TC', Inter, sans-serif" font-size="12" fill="#475569">四大角色 → 篩選品質改善者</text>
  <line x1="224" y1="104" x2="256" y2="104" stroke="#1b365d" stroke-width="2.4" marker-end="url(#an)"/>

  <rect x="260" y="62" width="198" height="84" rx="9" fill="#ffffff" stroke="#1b365d" stroke-width="1.8"/>
  <text x="359" y="96" text-anchor="middle" font-family="'Noto Sans TC', 'PingFang TC', Inter, sans-serif" font-size="14" font-weight="800" fill="#1b365d">2. 品質意圖拆解</text>
  <text x="359" y="122" text-anchor="middle" font-family="'Noto Sans TC', 'PingFang TC', Inter, sans-serif" font-size="12" fill="#475569">區分功能 (FR) 與非功能 (NFR)</text>
  <line x1="460" y1="104" x2="492" y2="104" stroke="#1b365d" stroke-width="2.4" marker-end="url(#an)"/>

  <rect x="496" y="62" width="198" height="84" rx="9" fill="#eef2ff" stroke="#1b365d" stroke-width="2.2"/>
  <text x="595" y="96" text-anchor="middle" font-family="'Noto Sans TC', 'PingFang TC', Inter, sans-serif" font-size="14.5" font-weight="800" fill="#1b365d">3. 定義 EPU(dp)</text>
  <text x="595" y="122" text-anchor="middle" font-family="JetBrains Mono,monospace" font-size="11.5" font-weight="600" fill="#1e40af">{&lt;角色, +&gt;, &lt;角色, −&gt;}</text>

  <!-- Track B container -->
  <rect x="8" y="188" width="705" height="155" rx="12" fill="#f0fdfa" stroke="#0f766e" stroke-width="2"/>
  <rect x="8" y="188" width="705" height="34" rx="12" fill="#0f766e"/>
  <rect x="8" y="208" width="705" height="14" fill="#0f766e"/>
  <text x="26" y="211" font-family="'Noto Sans TC', 'PingFang TC', Inter, sans-serif" font-size="14.5" font-weight="800" fill="#ffffff">路徑 B · 實證層：軟體演化分析（追蹤跨版本變更）</text>

  <!-- Track B boxes -->
  <rect x="24" y="240" width="198" height="84" rx="9" fill="#ffffff" stroke="#0f766e" stroke-width="1.8"/>
  <text x="123" y="274" text-anchor="middle" font-family="'Noto Sans TC', 'PingFang TC', Inter, sans-serif" font-size="14" font-weight="800" fill="#0f766e">1. 收集多版本開源碼</text>
  <text x="123" y="300" text-anchor="middle" font-family="'Noto Sans TC', 'PingFang TC', Inter, sans-serif" font-size="12" fill="#475569">15 個專案 · 296 次演化</text>
  <line x1="224" y1="282" x2="256" y2="282" stroke="#0f766e" stroke-width="2.4" marker-end="url(#at)"/>

  <rect x="260" y="240" width="198" height="84" rx="9" fill="#ffffff" stroke="#0f766e" stroke-width="1.8"/>
  <text x="359" y="274" text-anchor="middle" font-family="'Noto Sans TC', 'PingFang TC', Inter, sans-serif" font-size="14" font-weight="800" fill="#0f766e">2. 自動模式偵測</text>
  <text x="359" y="300" text-anchor="middle" font-family="'Noto Sans TC', 'PingFang TC', Inter, sans-serif" font-size="12" fill="#475569">Tsantalis 圖形相似度演算法</text>
  <line x1="460" y1="282" x2="492" y2="282" stroke="#0f766e" stroke-width="2.4" marker-end="url(#at)"/>

  <rect x="496" y="240" width="198" height="84" rx="9" fill="#ccfbf1" stroke="#0f766e" stroke-width="2.2"/>
  <text x="595" y="274" text-anchor="middle" font-family="'Noto Sans TC', 'PingFang TC', Inter, sans-serif" font-size="14.5" font-weight="800" fill="#0f766e">3. 萃取 PAC(dp, D)</text>
  <text x="595" y="300" text-anchor="middle" font-family="'Noto Sans TC', 'PingFang TC', Inter, sans-serif" font-size="11.5" font-weight="600" fill="#0f766e">逐版本建立 {&lt;元素, 角色&gt;}</text>

  <!-- Converging arrows to Conformance Engine -->
  <path d="M 696 104 L 732 104 L 732 158 L 752 158" fill="none" stroke="#1b365d" stroke-width="2.6" marker-end="url(#an)"/>
  <path d="M 696 282 L 732 282 L 732 198 L 752 198" fill="none" stroke="#0f766e" stroke-width="2.6" marker-end="url(#at)"/>

  <!-- Conformance Engine -->
  <rect x="756" y="106" width="166" height="144" rx="12" fill="#fdf2f5" stroke="#8c1d40" stroke-width="2.4"/>
  <rect x="756" y="106" width="166" height="36" rx="12" fill="#8c1d40"/>
  <rect x="756" y="128" width="166" height="14" fill="#8c1d40"/>
  <text x="839" y="130" text-anchor="middle" font-family="'Noto Sans TC', 'PingFang TC', Inter, sans-serif" font-size="14" font-weight="800" fill="#ffffff">使用度比對引擎</text>
  <text x="839" y="178" text-anchor="middle" font-family="JetBrains Mono,monospace" font-size="12.5" font-weight="700" fill="#8c1d40">Δ(PAC_j, PAC_j+1)</text>
  <text x="839" y="206" text-anchor="middle" font-family="'Noto Sans TC', 'PingFang TC', Inter, sans-serif" font-size="12.5" font-weight="700" fill="#334155">是否符合 EPU(dp)？</text>
  <text x="839" y="232" text-anchor="middle" font-family="Inter,sans-serif" font-size="11" font-weight="700" fill="#64748b">PUA Tool</text>

  <line x1="924" y1="178" x2="950" y2="178" stroke="#8c1d40" stroke-width="2.8" marker-end="url(#ac)"/>

  <!-- Output DoU -->
  <rect x="954" y="96" width="158" height="164" rx="12" fill="#1b365d"/>
  <text x="1033" y="136" text-anchor="middle" font-family="'Noto Sans TC', 'PingFang TC', Inter, sans-serif" font-size="14.5" font-weight="800" fill="#ffffff">模式使用程度 (DoU)</text>
  <rect x="962" y="152" width="142" height="44" rx="7" fill="rgba(255,255,255,0.14)" stroke="rgba(255,255,255,0.35)"/>
  <text x="1033" y="179" text-anchor="middle" font-family="'Noto Sans TC', 'PingFang TC', Inter, sans-serif" font-size="10.2" font-weight="700" fill="#bae6fd">DoU = 使用次數 / 演化次數</text>
  <text x="1033" y="228" text-anchor="middle" font-family="'Noto Sans TC', 'PingFang TC', Inter, sans-serif" font-size="12" font-weight="700" fill="#fef08a">單因子 ANOVA 檢定</text>
</svg>