<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 360">
  <defs>
    <marker id="arr-r" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#8c1d40"/>
    </marker>
    <marker id="arr-t" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#0f766e"/>
    </marker>
  </defs>
  <rect width="1120" height="360" rx="12" fill="#f8fafc"/>

  <!-- Left Panel: General-Purpose LLM -->
  <rect x="20" y="18" width="510" height="324" rx="10" fill="#ffffff" stroke="#fecdd3" stroke-width="2"/>
  <rect x="20" y="18" width="510" height="44" rx="10" fill="#8c1d40"/>
  <rect x="20" y="48" width="510" height="14" fill="#8c1d40"/>
  <text x="275" y="46" text-anchor="middle" fill="#ffffff" font-family="Inter,sans-serif" font-size="16" font-weight="800">Unconstrained General-Purpose LLM Tutor</text>

  <rect x="44" y="84" width="136" height="62" rx="8" fill="#fdf2f5" stroke="#8c1d40" stroke-width="1.5"/>
  <text x="112" y="111" text-anchor="middle" fill="#8c1d40" font-family="Inter,sans-serif" font-size="13" font-weight="700">Novice Student</text>
  <text x="112" y="131" text-anchor="middle" fill="#475569" font-family="Inter,sans-serif" font-size="11.5">"How do I solve this?"</text>

  <line x1="180" y1="115" x2="216" y2="115" stroke="#8c1d40" stroke-width="2.5" marker-end="url(#arr-r)"/>

  <rect x="220" y="84" width="140" height="62" rx="8" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
  <text x="290" y="111" text-anchor="middle" fill="#0f172a" font-family="Inter,sans-serif" font-size="13" font-weight="700">Single Chat LLM</text>
  <text x="290" y="131" text-anchor="middle" fill="#475569" font-family="Inter,sans-serif" font-size="11.5">No stage awareness</text>

  <line x1="360" y1="115" x2="394" y2="115" stroke="#8c1d40" stroke-width="2.5" marker-end="url(#arr-r)"/>

  <rect x="398" y="84" width="112" height="62" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="454" y="111" text-anchor="middle" fill="#991b1b" font-family="Inter,sans-serif" font-size="13" font-weight="700">Full Code</text>
  <text x="454" y="131" text-anchor="middle" fill="#7f1d1d" font-family="Inter,sans-serif" font-size="11.5">Copy &amp; Paste</text>

  <rect x="44" y="168" width="466" height="152" rx="8" fill="#fff1f2" stroke="#fda4af" stroke-width="1.5"/>
  <text x="64" y="196" fill="#8c1d40" font-family="Inter,sans-serif" font-size="14" font-weight="800">Three Pedagogical Breakdowns:</text>
  <text x="64" y="224" fill="#334155" font-family="Inter,sans-serif" font-size="13">✗  Bypasses problem interpretation &amp; algorithmic planning</text>
  <text x="64" y="252" fill="#334155" font-family="Inter,sans-serif" font-size="13">✗  Conceals diagnostic reasoning behind complete code fixes</text>
  <text x="64" y="280" fill="#334155" font-family="Inter,sans-serif" font-size="13">✗  Ignores post-AC code quality, readability &amp; idioms</text>
  <text x="64" y="306" fill="#8c1d40" font-family="Inter,sans-serif" font-size="12.5" font-weight="700">➔ Violates Scaffolding [5] &amp; Productive Failure [6]</text>

  <!-- Center VS Badge -->
  <circle cx="560" cy="180" r="24" fill="#1b365d"/>
  <text x="560" y="186" text-anchor="middle" fill="#ffffff" font-family="Inter,sans-serif" font-size="14" font-weight="800">VS</text>

  <!-- Right Panel: AT-TPL -->
  <rect x="590" y="18" width="510" height="324" rx="10" fill="#ffffff" stroke="#99f6e4" stroke-width="2"/>
  <rect x="590" y="18" width="510" height="44" rx="10" fill="#0f766e"/>
  <rect x="590" y="48" width="510" height="14" fill="#0f766e"/>
  <text x="845" y="46" text-anchor="middle" fill="#ffffff" font-family="Inter,sans-serif" font-size="16" font-weight="800">AI Tutor Triad Pattern Language (AT-TPL)</text>

  <rect x="614" y="84" width="142" height="72" rx="8" fill="#f0fdfa" stroke="#0f766e" stroke-width="2"/>
  <text x="685" y="108" text-anchor="middle" fill="#0f766e" font-family="Inter,sans-serif" font-size="13" font-weight="800">1. Guidance</text>
  <text x="685" y="127" text-anchor="middle" fill="#334155" font-family="Inter,sans-serif" font-size="11.5">Hints &amp; pseudo-code</text>
  <text x="685" y="144" text-anchor="middle" fill="#0f766e" font-family="Inter,sans-serif" font-size="11" font-weight="700">No executable code</text>

  <rect x="774" y="84" width="142" height="72" rx="8" fill="#fdf2f5" stroke="#8c1d40" stroke-width="2"/>
  <text x="845" y="108" text-anchor="middle" fill="#8c1d40" font-family="Inter,sans-serif" font-size="13" font-weight="800">2. Debugging</text>
  <text x="845" y="127" text-anchor="middle" fill="#334155" font-family="Inter,sans-serif" font-size="11.5">Root cause + 1 fix hint</text>
  <text x="845" y="144" text-anchor="middle" fill="#8c1d40" font-family="Inter,sans-serif" font-size="11" font-weight="700">Reads diagnostics</text>

  <rect x="934" y="84" width="142" height="72" rx="8" fill="#f1f5f9" stroke="#1b365d" stroke-width="2"/>
  <text x="1005" y="108" text-anchor="middle" fill="#1b365d" font-family="Inter,sans-serif" font-size="13" font-weight="800">3. Optimization</text>
  <text x="1005" y="127" text-anchor="middle" fill="#334155" font-family="Inter,sans-serif" font-size="11.5">Idioms &amp; quality review</text>
  <text x="1005" y="144" text-anchor="middle" fill="#1b365d" font-family="Inter,sans-serif" font-size="11" font-weight="700">No full rewrite</text>

  <rect x="614" y="176" width="462" height="144" rx="8" fill="#f0fdfa" stroke="#5eead4" stroke-width="1.5"/>
  <text x="634" y="204" fill="#0f766e" font-family="Inter,sans-serif" font-size="14" font-weight="800">Pattern-Driven Pedagogical Guardrails:</text>
  <text x="634" y="232" fill="#334155" font-family="Inter,sans-serif" font-size="13">✓  Matches help strictly to learner task state (Plan / Fail / AC)</text>
  <text x="634" y="260" fill="#334155" font-family="Inter,sans-serif" font-size="13">✓  Operationalized via RACE (Role, Action, Context, Expectation)</text>
  <text x="634" y="288" fill="#334155" font-family="Inter,sans-serif" font-size="13">✓  Documents forces, trade-offs &amp; non-linear transitions</text>
  <text x="634" y="311" fill="#0f766e" font-family="Inter,sans-serif" font-size="12.5" font-weight="700">➔ Enables progress while keeping coding agency with student</text>
</svg>
