<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 360">
  <defs>
    <marker id="arr-r" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#8c1d40"/>
    </marker>
  </defs>
  <rect width="1120" height="360" rx="12" fill="#f8fafc"/>

  <!-- Left Panel -->
  <rect x="20" y="18" width="510" height="324" rx="10" fill="#ffffff" stroke="#fecdd3" stroke-width="2"/>
  <rect x="20" y="18" width="510" height="44" rx="10" fill="#8c1d40"/>
  <rect x="20" y="48" width="510" height="14" fill="#8c1d40"/>
  <text x="275" y="46" text-anchor="middle" fill="#ffffff" font-family="Noto Sans TC,PingFang TC,sans-serif" font-size="16" font-weight="800">無約束的通用型 LLM 助教</text>

  <rect x="44" y="84" width="136" height="62" rx="8" fill="#fdf2f5" stroke="#8c1d40" stroke-width="1.5"/>
  <text x="112" y="111" text-anchor="middle" fill="#8c1d40" font-family="Noto Sans TC,PingFang TC,sans-serif" font-size="13" font-weight="700">程式初學者</text>
  <text x="112" y="131" text-anchor="middle" fill="#475569" font-family="Noto Sans TC,PingFang TC,sans-serif" font-size="11.5">「這題要怎麼寫？」</text>

  <line x1="180" y1="115" x2="216" y2="115" stroke="#8c1d40" stroke-width="2.5" marker-end="url(#arr-r)"/>

  <rect x="220" y="84" width="140" height="62" rx="8" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
  <text x="290" y="111" text-anchor="middle" fill="#0f172a" font-family="Noto Sans TC,PingFang TC,sans-serif" font-size="13" font-weight="700">單一對話介面</text>
  <text x="290" y="131" text-anchor="middle" fill="#475569" font-family="Noto Sans TC,PingFang TC,sans-serif" font-size="11.5">缺乏學習階段感知</text>

  <line x1="360" y1="115" x2="394" y2="115" stroke="#8c1d40" stroke-width="2.5" marker-end="url(#arr-r)"/>

  <rect x="398" y="84" width="112" height="62" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="454" y="111" text-anchor="middle" fill="#991b1b" font-family="Noto Sans TC,PingFang TC,sans-serif" font-size="13" font-weight="700">完整程式碼</text>
  <text x="454" y="131" text-anchor="middle" fill="#7f1d1d" font-family="Noto Sans TC,PingFang TC,sans-serif" font-size="11.5">直接複製貼上</text>

  <rect x="44" y="168" width="466" height="152" rx="8" fill="#fff1f2" stroke="#fda4af" stroke-width="1.5"/>
  <text x="64" y="196" fill="#8c1d40" font-family="Noto Sans TC,PingFang TC,sans-serif" font-size="14" font-weight="800">三大教學失效問題：</text>
  <text x="64" y="224" fill="#334155" font-family="Noto Sans TC,PingFang TC,sans-serif" font-size="13">✗  跳過題目理解與演算法規劃，剝奪獨立推理機會</text>
  <text x="64" y="252" fill="#334155" font-family="Noto Sans TC,PingFang TC,sans-serif" font-size="13">✗  直接給出修正後完整程式，掩蓋錯誤診斷過程</text>
  <text x="64" y="280" fill="#334155" font-family="Noto Sans TC,PingFang TC,sans-serif" font-size="13">✗  忽略通過測試（AC）後的程式品質與重構反思</text>
  <text x="64" y="306" fill="#8c1d40" font-family="Noto Sans TC,PingFang TC,sans-serif" font-size="12.5" font-weight="700">➔ 違背鷹架理論（Scaffolding）[5] 與有效失敗原則 [6]</text>

  <!-- Center VS -->
  <circle cx="560" cy="180" r="24" fill="#1b365d"/>
  <text x="560" y="186" text-anchor="middle" fill="#ffffff" font-family="Inter,sans-serif" font-size="14" font-weight="800">VS</text>

  <!-- Right Panel -->
  <rect x="590" y="18" width="510" height="324" rx="10" fill="#ffffff" stroke="#99f6e4" stroke-width="2"/>
  <rect x="590" y="18" width="510" height="44" rx="10" fill="#0f766e"/>
  <rect x="590" y="48" width="510" height="14" fill="#0f766e"/>
  <text x="845" y="46" text-anchor="middle" fill="#ffffff" font-family="Noto Sans TC,PingFang TC,sans-serif" font-size="16" font-weight="800">AI 助教三元模式語言（AT-TPL）</text>

  <rect x="614" y="84" width="142" height="72" rx="8" fill="#f0fdfa" stroke="#0f766e" stroke-width="2"/>
  <text x="685" y="108" text-anchor="middle" fill="#0f766e" font-family="Noto Sans TC,PingFang TC,sans-serif" font-size="13" font-weight="800">1. 引導模式</text>
  <text x="685" y="127" text-anchor="middle" fill="#334155" font-family="Noto Sans TC,PingFang TC,sans-serif" font-size="11.5">提示與虛擬碼引導</text>
  <text x="685" y="144" text-anchor="middle" fill="#0f766e" font-family="Noto Sans TC,PingFang TC,sans-serif" font-size="11" font-weight="700">嚴禁提供可執行碼</text>

  <rect x="774" y="84" width="142" height="72" rx="8" fill="#fdf2f5" stroke="#8c1d40" stroke-width="2"/>
  <text x="845" y="108" text-anchor="middle" fill="#8c1d40" font-family="Noto Sans TC,PingFang TC,sans-serif" font-size="13" font-weight="800">2. 除錯模式</text>
  <text x="845" y="127" text-anchor="middle" fill="#334155" font-family="Noto Sans TC,PingFang TC,sans-serif" font-size="11.5">根因分析＋單一修正提示</text>
  <text x="845" y="144" text-anchor="middle" fill="#8c1d40" font-family="Noto Sans TC,PingFang TC,sans-serif" font-size="11" font-weight="700">示範解讀錯誤訊息</text>

  <rect x="934" y="84" width="142" height="72" rx="8" fill="#f1f5f9" stroke="#1b365d" stroke-width="2"/>
  <text x="1005" y="108" text-anchor="middle" fill="#1b365d" font-family="Noto Sans TC,PingFang TC,sans-serif" font-size="13" font-weight="800">3. 最佳化模式</text>
  <text x="1005" y="127" text-anchor="middle" fill="#334155" font-family="Noto Sans TC,PingFang TC,sans-serif" font-size="11.5">慣用語法與品質審查</text>
  <text x="1005" y="144" text-anchor="middle" fill="#1b365d" font-family="Noto Sans TC,PingFang TC,sans-serif" font-size="11" font-weight="700">不代為完整改寫</text>

  <rect x="614" y="176" width="462" height="144" rx="8" fill="#f0fdfa" stroke="#5eead4" stroke-width="1.5"/>
  <text x="634" y="204" fill="#0f766e" font-family="Noto Sans TC,PingFang TC,sans-serif" font-size="14" font-weight="800">模式驅動之教學護欄設計：</text>
  <text x="634" y="232" fill="#334155" font-family="Noto Sans TC,PingFang TC,sans-serif" font-size="13">✓  依據學習任務狀態精準配對（規劃 / 失敗 / 通過）</text>
  <text x="634" y="260" fill="#334155" font-family="Noto Sans TC,PingFang TC,sans-serif" font-size="13">✓  透過 RACE 框架落實角色、任務、情境與輸出限制</text>
  <text x="634" y="288" fill="#334155" font-family="Noto Sans TC,PingFang TC,sans-serif" font-size="13">✓  明確記錄設計張力（Forces）、權衡與非線性切換</text>
  <text x="634" y="311" fill="#0f766e" font-family="Noto Sans TC,PingFang TC,sans-serif" font-size="12.5" font-weight="700">➔ 提供即時協助，同時將解題主導權保留給學生</text>
</svg>
