<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 375">
  <defs>
    <marker id="a-navy" markerWidth="11" markerHeight="11" refX="9" refY="5.5" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0,1 L10,5.5 L0,10 Z" fill="#1b365d"/>
    </marker>
    <marker id="a-crimson" markerWidth="11" markerHeight="11" refX="9" refY="5.5" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0,1 L10,5.5 L0,10 Z" fill="#8c1d40"/>
    </marker>
    <marker id="a-teal" markerWidth="11" markerHeight="11" refX="9" refY="5.5" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0,1 L10,5.5 L0,10 Z" fill="#0f766e"/>
    </marker>
  </defs>
  <rect width="1120" height="375" rx="12" fill="#f8fafc"/>

  <!-- Pattern 1 Box -->
  <rect x="30" y="66" width="295" height="164" rx="12" fill="#ffffff" stroke="#0f766e" stroke-width="2.5"/>
  <rect x="30" y="66" width="295" height="38" rx="10" fill="#0f766e"/>
  <rect x="30" y="92" width="295" height="12" fill="#0f766e"/>
  <text x="177" y="91" text-anchor="middle" fill="#ffffff" font-family="Inter,sans-serif" font-size="15" font-weight="800">Guidance Pattern (Guidey)</text>
  <text x="48" y="128" fill="#0f766e" font-family="Inter,sans-serif" font-size="12.5" font-weight="700">State: Problem, no plan yet</text>
  <text x="48" y="150" fill="#334155" font-family="Inter,sans-serif" font-size="12">• Incremental step-by-step hints</text>
  <text x="48" y="170" fill="#334155" font-family="Inter,sans-serif" font-size="12">• Concepts &amp; pseudo-code allowed</text>
  <text x="48" y="190" fill="#8c1d40" font-family="Inter,sans-serif" font-size="12" font-weight="700">• Guardrail: Strictly no Python code</text>
  <text x="48" y="214" fill="#64748b" font-family="Inter,sans-serif" font-size="11">↻ Iterate: act on hint ➔ ask next hint</text>

  <!-- Pattern 2 Box -->
  <rect x="412" y="66" width="296" height="164" rx="12" fill="#ffffff" stroke="#8c1d40" stroke-width="2.5"/>
  <rect x="412" y="66" width="296" height="38" rx="10" fill="#8c1d40"/>
  <rect x="412" y="92" width="296" height="12" fill="#8c1d40"/>
  <text x="560" y="91" text-anchor="middle" fill="#ffffff" font-family="Inter,sans-serif" font-size="15" font-weight="800">Debugging Pattern (Debuggy)</text>
  <text x="430" y="128" fill="#8c1d40" font-family="Inter,sans-serif" font-size="12.5" font-weight="700">State: Failing code + error / WA</text>
  <text x="430" y="150" fill="#334155" font-family="Inter,sans-serif" font-size="12">• 1. Root Cause Analysis (line + msg)</text>
  <text x="430" y="170" fill="#334155" font-family="Inter,sans-serif" font-size="12">• 2. Single targeted Correction Hint</text>
  <text x="430" y="190" fill="#8c1d40" font-family="Inter,sans-serif" font-size="12" font-weight="700">• Guardrail: No replacement program</text>
  <text x="430" y="214" fill="#64748b" font-family="Inter,sans-serif" font-size="11">⚠ Boundary: WA has no traceback</text>

  <!-- Pattern 3 Box -->
  <rect x="795" y="66" width="295" height="164" rx="12" fill="#ffffff" stroke="#1b365d" stroke-width="2.5"/>
  <rect x="795" y="66" width="295" height="38" rx="10" fill="#1b365d"/>
  <rect x="795" y="92" width="295" height="12" fill="#1b365d"/>
  <text x="942" y="91" text-anchor="middle" fill="#ffffff" font-family="Inter,sans-serif" font-size="15" font-weight="800">Optimization Pattern (Opti)</text>
  <text x="813" y="128" fill="#1b365d" font-family="Inter,sans-serif" font-size="12.5" font-weight="700">State: Working / Accepted (AC)</text>
  <text x="813" y="150" fill="#334155" font-family="Inter,sans-serif" font-size="12">• 1. Code Quality Summary</text>
  <text x="813" y="170" fill="#334155" font-family="Inter,sans-serif" font-size="12">• 2. Named Best-Practice Idiom</text>
  <text x="813" y="190" fill="#334155" font-family="Inter,sans-serif" font-size="12">• 3. Non-executable Alt. Hint</text>
  <text x="813" y="214" fill="#8c1d40" font-family="Inter,sans-serif" font-size="11" font-weight="700">• Guardrail: No complete rewrite</text>

  <!-- Primary Forward Arrows -->
  <line x1="325" y1="145" x2="408" y2="145" stroke="#1b365d" stroke-width="3" marker-end="url(#a-navy)"/>
  <text x="366" y="132" text-anchor="middle" fill="#1b365d" font-family="Inter,sans-serif" font-size="11" font-weight="700">Code fails</text>

  <line x1="708" y1="145" x2="791" y2="145" stroke="#1b365d" stroke-width="3" marker-end="url(#a-navy)"/>
  <text x="749" y="132" text-anchor="middle" fill="#1b365d" font-family="Inter,sans-serif" font-size="11" font-weight="700">Passes (AC)</text>

  <!-- Non-Linear Return Arrows (Top) -->
  <path d="M560 66 C560 22, 177 22, 177 62" fill="none" stroke="#0f766e" stroke-width="2.2" stroke-dasharray="6,4" marker-end="url(#a-teal)"/>
  <rect x="278" y="14" width="182" height="22" rx="6" fill="#f0fdfa" stroke="#99f6e4"/>
  <text x="369" y="29" text-anchor="middle" fill="#0f766e" font-family="Inter,sans-serif" font-size="11" font-weight="700">Missing concept ➔ Return</text>

  <path d="M942 66 C942 22, 585 22, 585 62" fill="none" stroke="#8c1d40" stroke-width="2.2" stroke-dasharray="6,4" marker-end="url(#a-crimson)"/>
  <rect x="664" y="14" width="196" height="22" rx="6" fill="#fdf2f5" stroke="#fecdd3"/>
  <text x="762" y="29" text-anchor="middle" fill="#8c1d40" font-family="Inter,sans-serif" font-size="11" font-weight="700">Refactor breaks code ➔ Return</text>

  <!-- Bottom Shared Forces Bar -->
  <rect x="30" y="254" width="1060" height="104" rx="10" fill="#1b365d"/>
  <text x="560" y="279" text-anchor="middle" fill="#ffffff" font-family="Inter,sans-serif" font-size="13.5" font-weight="800">THREE SHARED FORCES BALANCED ACROSS THE PATTERN LANGUAGE</text>

  <rect x="48" y="292" width="328" height="52" rx="7" fill="rgba(255,255,255,0.12)"/>
  <text x="212" y="313" text-anchor="middle" fill="#5eead4" font-family="Inter,sans-serif" font-size="12" font-weight="800">1. Timeliness vs. Agency</text>
  <text x="212" y="332" text-anchor="middle" fill="#e2e8f0" font-family="Inter,sans-serif" font-size="11">Concrete help without replacing student reasoning</text>

  <rect x="396" y="292" width="328" height="52" rx="7" fill="rgba(255,255,255,0.12)"/>
  <text x="560" y="313" text-anchor="middle" fill="#fda4af" font-family="Inter,sans-serif" font-size="12" font-weight="800">2. Specificity vs. Copyability</text>
  <text x="560" y="332" text-anchor="middle" fill="#e2e8f0" font-family="Inter,sans-serif" font-size="11">Useful hints/pseudo-code, never copyable full code</text>

  <rect x="744" y="292" width="328" height="52" rx="7" fill="rgba(255,255,255,0.12)"/>
  <text x="908" y="313" text-anchor="middle" fill="#93c5fd" font-family="Inter,sans-serif" font-size="12" font-weight="800">3. Focus vs. Broad Coverage</text>
  <text x="908" y="332" text-anchor="middle" fill="#e2e8f0" font-family="Inter,sans-serif" font-size="11">Single actionable focus; switch patterns as needed</text>
</svg>
