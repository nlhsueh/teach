<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 230" width="1120" height="230">
  <defs>
    <marker id="arr-n" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#1b365d"/>
    </marker>
  </defs>
  <style>
    text { font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; }
    .sh { font-size: 13px; font-weight: 800; fill: #ffffff; }
    .st { font-size: 13.5px; font-weight: 800; fill: #1b365d; }
    .sd { font-size: 11.4px; fill: #475569; }
  </style>

  <!-- Stage 1 -->
  <rect x="10" y="14" width="242" height="200" rx="12" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.8"/>
  <rect x="10" y="14" width="242" height="34" rx="12" fill="#475569"/>
  <rect x="10" y="34" width="242" height="14" fill="#475569"/>
  <text x="131" y="36" text-anchor="middle" class="sh">Stage 1 · Traditional In-Person</text>
  <text x="24" y="76" class="st">Classroom Lectures &amp; Labs</text>
  <text x="24" y="102" class="sd">• Bound by fixed class hours</text>
  <text x="24" y="124" class="sd">• Wide gap in learning paces</text>
  <text x="24" y="146" class="sd">• No pre-class review or replay</text>
  <text x="24" y="178" class="sd" fill="#64748b">Foundation: core lecture notes</text>

  <line x1="252" y1="114" x2="288" y2="114" stroke="#1b365d" stroke-width="2.5" marker-end="url(#arr-n)"/>

  <!-- Stage 2 -->
  <rect x="295" y="14" width="242" height="200" rx="12" fill="#eff6ff" stroke="#1b365d" stroke-width="2"/>
  <rect x="295" y="14" width="242" height="34" rx="12" fill="#1b365d"/>
  <rect x="295" y="34" width="242" height="14" fill="#1b365d"/>
  <text x="416" y="36" text-anchor="middle" class="sh">Stage 2 · Flipped Online Preview</text>
  <text x="309" y="76" class="st">Short Videos + Trinket Labs</text>
  <text x="309" y="102" class="sd">• Concise pre-class concept clips</text>
  <text x="309" y="124" class="sd">• Embedded Trinket code snippets</text>
  <text x="309" y="146" class="sd">• Class time for Q&amp;A &amp; practice</text>
  <text x="309" y="178" class="sd" fill="#1b365d">Key: clear audio, plan quiz points</text>

  <line x1="537" y1="114" x2="573" y2="114" stroke="#1b365d" stroke-width="2.5" marker-end="url(#arr-n)"/>

  <!-- Stage 3 -->
  <rect x="580" y="14" width="242" height="200" rx="12" fill="#f0fdfa" stroke="#0f766e" stroke-width="2"/>
  <rect x="580" y="14" width="242" height="34" rx="12" fill="#0f766e"/>
  <rect x="580" y="34" width="242" height="14" fill="#0f766e"/>
  <text x="701" y="36" text-anchor="middle" class="sh">Stage 3 · 13-5 Async Blended</text>
  <text x="594" y="76" class="st" fill="#0f766e">Auto-Grading (Online Judge)</text>
  <text x="594" y="102" class="sd">• 13 weeks async online study</text>
  <text x="594" y="124" class="sd">• 5 in-person: setup, exams, demo</text>
  <text x="594" y="146" class="sd">• Rhythm: 1-(3-1)3-4-1 schedule</text>
  <text x="594" y="178" class="sd" fill="#0f766e">Adopted Coding Corner auto-judge</text>

  <line x1="822" y1="114" x2="858" y2="114" stroke="#1b365d" stroke-width="2.5" marker-end="url(#arr-n)"/>

  <!-- Stage 4 -->
  <rect x="865" y="14" width="245" height="200" rx="12" fill="#fdf2f5" stroke="#8c1d40" stroke-width="2.2"/>
  <rect x="865" y="14" width="245" height="34" rx="12" fill="#8c1d40"/>
  <rect x="865" y="34" width="245" height="14" fill="#8c1d40"/>
  <text x="987" y="36" text-anchor="middle" class="sh">Stage 4 · Full-Scale MOOCs</text>
  <text x="879" y="76" class="st" fill="#8c1d40">OpenEdu Scaled Delivery</text>
  <text x="879" y="102" class="sd">• Clear syllabus &amp; pacing rules</text>
  <text x="879" y="124" class="sd">• Proactive weekly email nudges</text>
  <text x="879" y="146" class="sd">• Interactive modules + capstone</text>
  <text x="879" y="178" class="sd" fill="#8c1d40">Rich log data for learning analytics</text>
</svg>
