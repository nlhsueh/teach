<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 230" width="1120" height="230">
  <defs>
    <marker id="arr-n" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#1b365d"/>
    </marker>
  </defs>
  <style>
    text { font-family: 'Noto Sans TC', 'PingFang TC', -apple-system, sans-serif; }
    .sh { font-size: 13.5px; font-weight: 800; fill: #ffffff; }
    .st { font-size: 14px; font-weight: 800; fill: #1b365d; }
    .sd { font-size: 11.8px; fill: #475569; }
  </style>

  <!-- Stage 1 -->
  <rect x="10" y="14" width="242" height="200" rx="12" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.8"/>
  <rect x="10" y="14" width="242" height="34" rx="12" fill="#475569"/>
  <rect x="10" y="34" width="242" height="14" fill="#475569"/>
  <text x="131" y="36" text-anchor="middle" class="sh">階段一 · 傳統實體面授</text>
  <text x="26" y="76" class="st">全課堂講述與上機</text>
  <text x="26" y="102" class="sd">• 受限於固定教室與時數</text>
  <text x="26" y="124" class="sd">• 學生吸收速度差異大</text>
  <text x="26" y="146" class="sd">• 缺乏課前預習與重複回看</text>
  <text x="26" y="178" class="sd" fill="#64748b">起點：建立核心講義基礎</text>

  <line x1="252" y1="114" x2="288" y2="114" stroke="#1b365d" stroke-width="2.5" marker-end="url(#arr-n)"/>

  <!-- Stage 2 -->
  <rect x="295" y="14" width="242" height="200" rx="12" fill="#eff6ff" stroke="#1b365d" stroke-width="2"/>
  <rect x="295" y="14" width="242" height="34" rx="12" fill="#1b365d"/>
  <rect x="295" y="34" width="242" height="14" fill="#1b365d"/>
  <text x="416" y="36" text-anchor="middle" class="sh">階段二 · 線上預習翻轉</text>
  <text x="311" y="76" class="st">短影片 ＋ Trinket 練習</text>
  <text x="311" y="102" class="sd">• 課前觀看精簡概念影片</text>
  <text x="311" y="124" class="sd">• 內嵌 Trinket 局部程式碼練習</text>
  <text x="311" y="146" class="sd">• 課堂聚焦討論與實作解惑</text>
  <text x="311" y="178" class="sd" fill="#1b365d">關鍵：清楚聲音、預想隨堂測驗</text>

  <line x1="537" y1="114" x2="573" y2="114" stroke="#1b365d" stroke-width="2.5" marker-end="url(#arr-n)"/>

  <!-- Stage 3 -->
  <rect x="580" y="14" width="242" height="200" rx="12" fill="#f0fdfa" stroke="#0f766e" stroke-width="2"/>
  <rect x="580" y="14" width="242" height="34" rx="12" fill="#0f766e"/>
  <rect x="580" y="34" width="242" height="14" fill="#0f766e"/>
  <text x="701" y="36" text-anchor="middle" class="sh">階段三 · 13-5 非同步混成</text>
  <text x="596" y="76" class="st" fill="#0f766e">導入自動評量（OJ）</text>
  <text x="596" y="102" class="sd">• 13 週線上非同步自主學習</text>
  <text x="596" y="124" class="sd">• 5 次實體：安裝、複習考、專題</text>
  <text x="596" y="146" class="sd">• 節奏：1-(3-1)3-4-1 結構</text>
  <text x="596" y="178" class="sd" fill="#0f766e">導入 Coding Corner 自動評測</text>

  <line x1="822" y1="114" x2="858" y2="114" stroke="#1b365d" stroke-width="2.5" marker-end="url(#arr-n)"/>

  <!-- Stage 4 -->
  <rect x="865" y="14" width="245" height="200" rx="12" fill="#fdf2f5" stroke="#8c1d40" stroke-width="2.2"/>
  <rect x="865" y="14" width="245" height="34" rx="12" fill="#8c1d40"/>
  <rect x="865" y="34" width="245" height="14" fill="#8c1d40"/>
  <text x="987" y="36" text-anchor="middle" class="sh">階段四 · 全線上 MOOCs</text>
  <text x="881" y="76" class="st" fill="#8c1d40">OpenEdu 規模化營運</text>
  <text x="881" y="102" class="sd">• 建立清楚的修課須知與進度</text>
  <text x="881" y="124" class="sd">• 每週 Email 主動關心與提醒</text>
  <text x="881" y="146" class="sd">• 多元互動元件＋期末專題</text>
  <text x="881" y="178" class="sd" fill="#8c1d40">累積完整學習歷程數據供分析</text>
</svg>
