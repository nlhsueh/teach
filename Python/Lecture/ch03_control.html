    :root {

      --text-main: #0f172a;
      --text-muted: #64748b;
      --border: #e2e8f0;

    body.dark-mode {

      --primary-dark: #0284c7;
      --primary-light: #082f49;
      --accent: #fbbf24;

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Plus Jakarta Sans', 'Noto Sans TC', system-ui, -apple-system, sans-serif;
      background-color: var(--background);
      color: var(--text-main);
      line-height: 1.75;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      transition: background-color 0.2s ease, color 0.2s ease;
    }

    #progressBar {
      position: fixed;
      top: 0;
      left: 0;
      height: 3px;

      width: 0%;
      z-index: 9999;
      transition: width 0.1s ease-out;
    }

    .top-navbar {
      position: sticky;
      top: 0;
      z-index: 1000;
      background: rgba(255, 255, 255, 0.94);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);

      padding: 10px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      box-shadow: var(--shadow-sm);

    body.dark-mode .top-navbar {

    }

    .nav-left {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .btn-back {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: var(--text-main);

      font-size: 13.5px;
      font-weight: 700;

      border-radius: 8px;
      background: #f1f5f9;
      transition: all 0.15s ease;

    body.dark-mode .btn-back { background: #334155; }
    .btn-back:hover { background: var(--primary-light); color: var(--primary-dark); }

    .chapter-select {
      padding: 6px 12px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--surface);

      font-size: 13.5px;
      font-weight: 600;
      outline: none;
      cursor: pointer;

      display: inline-flex;
      align-items: center;
      gap: 5px;
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text-muted);
      padding: 6px 12px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      text-decoration: none;
      cursor: pointer;
      transition: all 0.15s ease;

      border-color: #93c5fd;
      background: var(--primary-light);
    }

      font-weight: 700;
      text-transform: uppercase;

      });

      header.appendChild(copyBtn);
      pre.parentNode.insertBefore(wrapper, pre);
      wrapper.appendChild(header);
      wrapper.appendChild(pre);
    });

    // Mermaid & KaTeX
    mermaid.initialize({ startOnLoad: false, theme: document.body.classList.contains('dark-mode') ? 'dark' : 'default' });
    document.querySelectorAll('#contentArea .language-mermaid').forEach(async (el) => {
      const graphDefinition = el.innerText;
      const container = document.createElement('div');
      container.className = 'mermaid';
      container.innerHTML = graphDefinition;
      el.parentNode.replaceChild(container, el);
    });
    mermaid.run();

    if (window.renderMathInElement) {
      renderMathInElement(contentArea, {
        delimiters: [
          { left: '$$', right: '$$', display: true },
          { left: '$', right: '$', display: false }
        ],
        throwOnError: false
      });
    }

    // Scroll Progress Bar
    window.addEventListener('scroll', () => {
      const scrollTop = window.scrollY || document.documentElement.scrollTop;
      const docHeight = document.documentElement.scrollHeight - document.documentElement.clientHeight;
      const progress = docHeight > 0 ? (scrollTop / docHeight) * 100 : 0;
      document.getElementById('progressBar').style.width = progress + '%';
    });

    // Dark Mode Toggle
    function toggleDarkMode() {
      document.body.classList.toggle('dark-mode');
      const isDark = document.body.classList.contains('dark-mode');
      document.getElementById('darkIcon').textContent = isDark ? '☀️' : '🌙';
      localStorage.setItem('teach_python_dark', isDark ? 'true' : 'false');
    }

    if (localStorage.getItem('teach_python_dark') === 'true') {
      document.body.classList.add('dark-mode');
      document.getElementById('darkIcon').textContent = '☀️';
    }
  </script>

</body>

</html>
