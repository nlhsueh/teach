<header>Python 程式設計 | 第六章：資料處理 (Pandas)</header>
<h2 id="%E6%9C%AC%E7%AB%A0%E5%AD%B8%E7%BF%92%E9%87%8D%E9%BB%9E">本章學習重點</h2>
<ul>
<li data-marpit-fragment="1"><strong>6.1 基礎 Pandas 介紹</strong>
<ul>
<li>Pandas 簡介、Series 與 DataFrame 概念</li>
<li>DataFrame 建立、索引設定與 loc/iloc 存取</li>
<li>資料的頭尾、隨機、切片與過濾</li>
<li>資料排序與分群計量 (groupby)</li>
</ul>
</li>
<li data-marpit-fragment="2"><strong>6.2 進階 Pandas 資料處理</strong>
<ul>
<li>遺失資料處理 (dropna, fillna)</li>
<li>現代 Pandas 新特性 (Copy-on-Write, Nullable Types)</li>
<li>資料表合併 (concat, merge)</li>
</ul>
</li>
<li data-marpit-fragment="3"><strong>6.3 圖表繪製 (Visualization)</strong>
<ul>
<li>Matplotlib 中文字型設定、基礎折線圖與長條圖</li>
</ul>
</li>
<li data-marpit-fragment="4"><strong>6.4 應用實例</strong>
<ul>
<li>新北 YouBike 開放資料分析</li>
<li>大專院校學生人數與男女比例分析</li>
</ul>
</li>
</ul>

<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-python"><span class="hljs-comment"># 使用 name 欄位作為索引值</span>

<h2 id="concept-check-question-ccq-1">Concept Check Question (CCQ 1)</h2>
<div class="ccq-columns">
  <div class="ccq-text">
<p><strong>在 Pandas 中，若我們建立了 Series <code>s = pd.Series([10, 20, 30], index=['a', 'b', 'c'])</code>，下列哪一種存取方式會回傳 <code>20</code>？</strong></p>
<ul>
<li data-marpit-fragment="1">
<p><strong>A.</strong> 只有 <code>s['b']</code> 與 <code>s.loc['b']</code></p>
</li>
<li data-marpit-fragment="2">
<p><strong>B.</strong> 只有 <code>s[1]</code> 與 <code>s.iloc[1]</code></p>
</li>
<li data-marpit-fragment="3">
<p><strong>C.</strong> 只有 <code>s['b']</code>、<code>s.loc['b']</code> 與 <code>s.iloc[1]</code></p>
</li>
<li data-marpit-fragment="4">
<p><strong>D.</strong> 四種方式 <code>s['b']</code>、<code>s[1]</code>、<code>s.loc['b']</code>、<code>s.iloc[1]</code> 皆會回傳 <code>20</code>。</p>
</div>

</div>
</li>
</ul>

<p><strong>解析</strong>：</p>
<ul>
<li data-marpit-fragment="2"><code>df.loc['x', 'B']</code> 是<strong>標籤型存取</strong>（列標籤為 <code>'x'</code>，欄標籤為 <code>'B'</code>），對應到的值為 <code>2</code>。</li>
<li data-marpit-fragment="3"><code>df.iloc[0, 1]</code> 是<strong>位置型存取</strong>（列位置為 0 即第一列 <code>'x'</code>，欄位置為 1 即第二欄 <code>'B'</code>），對應到的值同樣為 <code>2</code>。</li>
<li data-marpit-fragment="4">因此，兩個表達式都指向同一個儲存格，回傳的值都是 <code>2</code>。</li>
</ul>

<li><strong><code>df.sample(n)</code></strong>：隨機抽取 <code>n</code> 筆資料</li>
</ul>
</li>
</ul>

<h2 id="%E8%B3%87%E6%96%99%E9%81%8E%E6%BF%BE-filtering">資料過濾 (Filtering)</h2>
<ul>
<li data-marpit-fragment="1">透過對欄位進行條件判斷，產生一個布林 Series，再用它來篩選 DataFrame：</li>

<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-python"><span class="hljs-comment"># 產生布林條件 (過濾出 c1 欄位值大於 10 的 True/False 序列)</span>

<span class="hljs-built_in">print</span>(g)

<span class="hljs-comment"># 使用布林 Series 過濾 DataFrame</span>
<span class="hljs-built_in">print</span>(df[g]) 

<span class="hljs-comment"># 常用的精簡寫法</span>
<span class="hljs-built_in">print</span>(df[df.c1 &gt; <span class="hljs-number">10</span>])
</code></pre>

<header>Python 程式設計 | 第六章：資料處理 (Pandas)</header>
<h2 id="ccq-3---%E7%AD%94%E6%A1%88%E8%88%87%E8%A7%A3%E6%9E%90">CCQ 3 - 答案與解析</h2>
<div class="ccq-columns">

<h3 id="%E6%AD%A3%E7%A2%BA%E7%AD%94%E6%A1%88a"><strong>正確答案：A</strong></h3>
<ul>
<li data-marpit-fragment="1">
<p><strong>解析</strong>：</p>
<ul>
<li data-marpit-fragment="2">在 Pandas 中，過濾資料最標準的方式是使用<strong>布林索引 (Boolean Indexing)</strong>。</li>
<li data-marpit-fragment="3"><code>df[&quot;Age&quot;] &gt; 30</code> 會先針對每一列進行條件判斷，產生一個由 <code>True</code> 和 <code>False</code> 組成的 Series。</li>
<li data-marpit-fragment="4">將此布林 Series 作為索引傳入 <code>df[...]</code> 中，DataFrame 就會篩選出所有對應值為 <code>True</code> 的 Rows。</li>
</ul>
</div>

</div>
</li>
</ul>

<h2 id="%E8%B3%87%E6%96%99%E6%8E%92%E5%BA%8F-sorting">資料排序 (Sorting)</h2>
<ul>
<li data-marpit-fragment="1">使用 <code>df.sort_values(by='col')</code> 來對特定欄位進行排序。</li>
<li data-marpit-fragment="2">可傳入 List 進行多重欄位排序。</li>
</ul>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-python">df = pd.DataFrame({
    <span class="hljs-string">&#x27;c1&#x27;</span>: [<span class="hljs-string">&#x27;A&#x27;</span>, <span class="hljs-string">&#x27;A&#x27;</span>, <span class="hljs-string">&#x27;B&#x27;</span>, <span class="hljs-string">&#x27;Z&#x27;</span>, <span class="hljs-string">&#x27;D&#x27;</span>, <span class="hljs-string">&#x27;C&#x27;</span>],
    <span class="hljs-string">&#x27;c2&#x27;</span>: [<span class="hljs-number">2</span>, <span class="hljs-number">1</span>, <span class="hljs-number">9</span>, <span class="hljs-number">8</span>, <span class="hljs-number">7</span>, <span class="hljs-number">4</span>],
    <span class="hljs-string">&#x27;c3&#x27;</span>: [<span class="hljs-number">0</span>, <span class="hljs-number">1</span>, <span class="hljs-number">9</span>, <span class="hljs-number">4</span>, <span class="hljs-number">2</span>, <span class="hljs-number">3</span>],
    <span class="hljs-string">&#x27;c4&#x27;</span>: [<span class="hljs-string">&#x27;a&#x27;</span>, <span class="hljs-string">&#x27;B&#x27;</span>, <span class="hljs-string">&#x27;c&#x27;</span>, <span class="hljs-string">&#x27;D&#x27;</span>, <span class="hljs-string">&#x27;e&#x27;</span>, <span class="hljs-string">&#x27;F&#x27;</span>]})

<span class="hljs-comment"># 依 c1 排序 (升冪)</span>
<span class="hljs-built_in">print</span>(df.sort_values(by=<span class="hljs-string">&#x27;c1&#x27;</span>))

<span class="hljs-comment"># 依 c1 排序，若相同則依 c2 排序</span>
df2 = df.sort_values(by=[<span class="hljs-string">&#x27;c1&#x27;</span>, <span class="hljs-string">&#x27;c2&#x27;</span>])
<span class="hljs-built_in">print</span>(df2)
</code></pre>

<h2 id="%E9%81%BA%E5%A4%B1%E8%B3%87%E6%96%99%E4%B9%8B%E8%99%95%E7%90%86">遺失資料之處理</h2>
<ul>
<li data-marpit-fragment="1">資料收集時難免會有遺失值（在 Pandas 中通常顯示為 <code>NaN</code> 或 <code>None</code>）。</li>
<li data-marpit-fragment="2">常見處理策略：
<ol>
<li><strong>刪除空值</strong>：<code>df.dropna()</code></li>
<li><strong>填補空值</strong>：<code>df.fillna(value)</code> (可用常數、字典指定各欄填補值，或用 <code>ffill</code>/<code>bfill</code>)</li>
</ol>
</li>
</ul>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-python"><span class="hljs-comment"># 刪除含有任何空值的資料列</span>
df.dropna()

<span class="hljs-comment"># 各欄位填補不同預設值</span>
df.fillna({<span class="hljs-string">&#x27;price&#x27;</span>: <span class="hljs-number">0</span>, <span class="hljs-string">&#x27;quantity&#x27;</span>: <span class="hljs-number">10</span>})

<span class="hljs-comment"># 向後傳遞填補 (使用後一筆非空值來填補前一筆空值)</span>
<span class="hljs-comment"># 舊版 method=&#x27;bfill&#x27;，新版建議用：</span>
df.bfill()
</code></pre>

<header>Python 程式設計 | 第六章：資料處理 (Pandas)</header>
<h2 id="nullable-data-types-pandas-20">Nullable Data Types (Pandas 2.0+)</h2>
<ul>
<li data-marpit-fragment="1">傳統 Pandas 在整數欄位若有 <code>NaN</code> 會自動將整數轉為 <code>float</code>。</li>
<li data-marpit-fragment="2">現代 Pandas 引入了<strong>大寫開頭的 Nullable 型態</strong>（如 <code>Int64</code>、<code>boolean</code>、<code>string</code>），允許整數與空值共存而不改變型態。</li>
</ul>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-python"><span class="hljs-comment"># 傳統做法：含有空值的整數欄位會轉為 float64，無可避免精度遺失或混淆</span>
<span class="hljs-comment"># 現代做法：使用 convert_dtypes() 自動轉換為可含空值的原生型態</span>
df_modern = df.convert_dtypes()
<span class="hljs-built_in">print</span>(df_modern.dtypes)
<span class="hljs-comment"># 原本 float64 的空值整數欄位會成功轉換成 Int64</span>
</code></pre>

<header>Python 程式設計 | 第六章：資料處理 (Pandas)</header>
<h2 id="%E5%AF%AB%E5%85%A5%E6%99%82%E8%A4%87%E8%A3%BD-copy-on-write-cow">寫入時複製 (Copy-on-Write, CoW)</h2>
<ul>
<li data-marpit-fragment="1">Pandas 2.0+ 引入且即將在 Pandas 3.0 成為預設的效能與安全機制。</li>
<li data-marpit-fragment="2"><strong>概念</strong>：當複製 DataFrame 或選取子集時，並不會立即複製底層資料（共享同個記憶體），只有在其中一個 DataFrame <strong>被修改時</strong>，才會真正執行複製。</li>
<li data-marpit-fragment="3">徹底解決了惱人的 <code>SettingWithCopyWarning</code> 警告，讓資料操作更加安全。</li>
</ul>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-python"><span class="hljs-comment"># 啟用 CoW </span>
pd.options.mode.copy_on_write = <span class="hljs-literal">True</span>

df2 = df.copy()  <span class="hljs-comment"># 極快，底層指向同一個記憶體</span>
df2.iloc[<span class="hljs-number">0</span>, <span class="hljs-number">0</span>] = <span class="hljs-number">99</span>  <span class="hljs-comment"># 此時修改才真正分裂複製</span>
</code></pre>

<h2 id="ccq-4---%E7%AD%94%E6%A1%88%E8%88%87%E8%A7%A3%E6%9E%90">CCQ 4 - 答案與解析</h2>

<h3 id="%E6%AD%A3%E7%A2%BA%E7%AD%94%E6%A1%88a-1"><strong>正確答案：A</strong></h3>
<ul>
<li data-marpit-fragment="1">
<p><strong>解析</strong>：</p>
<ul>
<li data-marpit-fragment="2"><code>df.groupby(&quot;Department&quot;)</code>：先以 <code>&quot;Department&quot;</code> 欄位作為分組基準。</li>
<li data-marpit-fragment="3"><code>[&quot;Salary&quot;]</code>：接著從分組後的資料中選取 <code>&quot;Salary&quot;</code> 欄位。</li>
<li data-marpit-fragment="4"><code>.mean()</code>：最後呼叫 <code>mean()</code> 函式計算每一組的平均值。</li>
<li data-marpit-fragment="5">這是 Pandas 中進行分組聚合（Aggregation）的最標準寫法。其他選項如 <code>average()</code> 並非 Pandas 的內建聚合函式。</li>
</ul>

<header>Python 程式設計 | 第六章：資料處理 (Pandas)</header>
<h2 id="%E5%90%84%E6%A0%A1%E7%B8%BD%E5%AD%B8%E7%94%9F%E4%BA%BA%E6%95%B8%E6%8E%92%E5%BA%8F%E8%88%87%E6%8F%8F%E8%BF%B0">各校總學生人數排序與描述</h2>
<ul>
<li data-marpit-fragment="1">將同校但不同學制學程的列合併 (<code>groupby</code>)，再對橫向進行欄位加總。</li>
</ul>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-python">df107 = init_data()

<span class="hljs-comment"># 依學校名稱分群並加總</span>
df = df107.groupby(by=<span class="hljs-string">&#x27;學校名稱&#x27;</span>).<span class="hljs-built_in">sum</span>()

<span class="hljs-comment"># 橫向加總所有年級欄位 (axis=1)</span>
df[<span class="hljs-string">&#x27;tot&#x27;</span>] = df[df.columns[<span class="hljs-number">0</span>:]].<span class="hljs-built_in">sum</span>(axis=<span class="hljs-number">1</span>)

<span class="hljs-comment"># 依據總人數排序</span>
df = df.sort_values(<span class="hljs-string">&#x27;tot&#x27;</span>)
<span class="hljs-built_in">print</span>(df[<span class="hljs-string">&#x27;tot&#x27;</span>].describe())

<span class="hljs-comment"># 檢視人數最多與最少的學校</span>
<span class="hljs-built_in">print</span>(df.head(<span class="hljs-number">5</span>)[<span class="hljs-string">&#x27;tot&#x27;</span>])  <span class="hljs-comment"># 最少 (如：法鼓文理學院)</span>
<span class="hljs-built_in">print</span>(df.tail(<span class="hljs-number">5</span>)[<span class="hljs-string">&#x27;tot&#x27;</span>])  <span class="hljs-comment"># 最多 (如：台灣大學)</span>
</code></pre>

<ul>
<li data-marpit-fragment="1">使用字串篩選方法 <code>str.contains('國立')</code> 來區分國立與私立學校。</li>

<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-python"><span class="hljs-comment"># groupby 且不將名稱作為 index (保留為欄位)</span>

df_p = df[~df[<span class="hljs-string">&#x27;學校名稱&#x27;</span>].<span class="hljs-built_in">str</span>.contains(<span class="hljs-string">&#x27;國立&#x27;</span>)]

<h2 id="%E7%94%B7%E5%A5%B3%E6%AF%94%E4%BE%8B%E5%88%86%E6%9E%90--%E8%B3%87%E6%96%99%E6%BA%96%E5%82%99">男女比例分析 — 資料準備</h2>
<ul>
<li data-marpit-fragment="1">利用迴圈，分別將所有年級的男生、女生人數加總，建立 Male/Female 欄位。</li>

<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-python"><span class="hljs-keyword">def</span> <span class="hljs-title function_">gender</span>(<span class="hljs-params">df</span>):
    gender_df = df.copy()
    boy = <span class="hljs-string">&quot;一年級男生 二年級男生 三年級男生 四年級男生 五年級男生 六年級男生 七年級男生 延修生男生&quot;</span>.split()
    gender_df[<span class="hljs-string">&#x27;Male&#x27;</span>] = <span class="hljs-number">0</span>
    <span class="hljs-keyword">for</span> i <span class="hljs-keyword">in</span> boy:
        gender_df[<span class="hljs-string">&#x27;Male&#x27;</span>] = gender_df[<span class="hljs-string">&#x27;Male&#x27;</span>] + gender_df[i]

    girl = <span class="hljs-string">&quot;一年級女生 二年級女生 三年級女生 四年級女生 五年級女生 六年級女生 七年級女生 延修生女生&quot;</span>.split()
    gender_df[<span class="hljs-string">&#x27;Female&#x27;</span>] = <span class="hljs-number">0</span>
    <span class="hljs-keyword">for</span> i <span class="hljs-keyword">in</span> girl:
        gender_df[<span class="hljs-string">&#x27;Female&#x27;</span>] = gender_df[<span class="hljs-string">&#x27;Female&#x27;</span>] + gender_df[i]
    <span class="hljs-keyword">return</span> gender_df
</code></pre>

<h2 id="%E7%94%B7%E5%A5%B3%E6%AF%94%E4%BE%8B%E5%88%86%E6%9E%90--%E7%B5%90%E6%9E%9C%E9%81%8E%E6%BF%BE">男女比例分析 — 結果過濾</h2>
<ul>
<li data-marpit-fragment="1">計算比例：<code>Rate = Male / Female</code>。利用條件篩選找出男女比例極端的學校。</li>
</ul>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-python">df_gender = gender(df107).groupby(by=<span class="hljs-string">&#x27;學校名稱&#x27;</span>).<span class="hljs-built_in">sum</span>()
df_gender[<span class="hljs-string">&#x27;Rate&#x27;</span>] = (df_gender.Male / df_gender.Female).<span class="hljs-built_in">round</span>(<span class="hljs-number">2</span>)

<span class="hljs-comment"># 篩選比例均衡 (0.9 ~ 1.1) 的學校</span>
balance = df_gender[<span class="hljs-string">&#x27;Rate&#x27;</span>].between(<span class="hljs-number">0.9</span>, <span class="hljs-number">1.1</span>)
<span class="hljs-built_in">print</span>(df_gender[balance][<span class="hljs-string">&#x27;Rate&#x27;</span>])

<span class="hljs-comment"># 男女比率描述性統計</span>
<span class="hljs-built_in">print</span>(df_gender[<span class="hljs-string">&#x27;Rate&#x27;</span>].describe())

<span class="hljs-comment"># 遞減排序看男生比例極高與極低(女生極多)的學校</span>
df_gender.sort_values(by=<span class="hljs-string">&#x27;Rate&#x27;</span>, ascending=<span class="hljs-literal">False</span>, inplace=<span class="hljs-literal">True</span>)
<span class="hljs-built_in">print</span>(df_gender.head(<span class="hljs-number">5</span>)[<span class="hljs-string">&#x27;Rate&#x27;</span>]) <span class="hljs-comment"># 例如：虎尾科大、台北科大</span>
<span class="hljs-built_in">print</span>(df_gender.tail(<span class="hljs-number">5</span>)[<span class="hljs-string">&#x27;Rate&#x27;</span>]) <span class="hljs-comment"># 例如：護專</span>
</code></pre>

<span class="hljs-comment"># 依縣市計數</span>
df_city = df_city_u.groupby(by=<span class="hljs-string">&#x27;縣市名稱&#x27;</span>).count()
df_city = pd.DataFrame(df_city[[<span class="hljs-string">&#x27;學校名稱&#x27;</span>]])
df_city.columns = [<span class="hljs-string">&#x27;學校個數&#x27;</span>]

<span class="hljs-comment"># 繪製長條圖</span>
df_city.plot.bar(figsize=(<span class="hljs-number">10</span>,<span class="hljs-number">6</span>), title=<span class="hljs-string">&#x27;各縣市大學個數&#x27;</span>)
