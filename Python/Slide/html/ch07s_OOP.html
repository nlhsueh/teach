<header>Python 程式設計 | 第七章：物件導向程式設計 (OOP)</header>
<h2 id="%E6%9C%AC%E7%AB%A0%E5%AD%B8%E7%BF%92%E9%87%8D%E9%BB%9E">本章學習重點</h2>
<ul>
<li><strong>7.1 類別與物件 (Class &amp; Object)</strong>
<ul>
<li>物件導向 vs 功能導向、藍圖與實例概念</li>
<li>類別宣告、物件封裝設計與 Data Classes (Python 3.7+)</li>
</ul>
</li>
<li><strong>7.2 屬性與封裝 (Attribute &amp; Encapsulation)</strong>
<ul>
<li>物件屬性 vs 類別屬性、私有屬性與名稱修飾 (Name Mangling)</li>
<li>特性與裝飾器 (<code>@property</code>、<code>@setter</code>)、動態屬性</li>
</ul>
</li>
<li><strong>7.3 繼承與多型 (Inheritance &amp; Polymorphism)</strong>
<ul>
<li>基礎類別與衍生類別、方法覆寫 (Override) 與 <code>super()</code> 呼叫</li>
</ul>
</li>
<li><strong>7.4 特殊方法與抽象類別 (Special Methods &amp; Abstract Classes)</strong>
<ul>
<li>雙底線特殊方法 (dunder methods)、自訂有理數 Rational 類別</li>
<li>抽象類別宣告 (<code>abc.ABCMeta</code>) 與抽象方法 (<code>@abstractmethod</code>)</li>
</ul>
</li>
</ul>

<h2 id="%E7%89%A9%E4%BB%B6%E5%B0%8E%E5%90%91%E8%A8%AD%E8%A8%88-object-oriented-design">物件導向設計 (Object-Oriented Design)</h2>
<ul>
<li><strong>功能導向</strong>：將大系統切割成小函式，以函式為最小單元來解決複雜性。</li>
<li><strong>物件導向</strong>：以<strong>物件</strong>為最小單元。物件內部<strong>封裝了資料以及對應的操作方法</strong>。</li>
</ul>

<ul>
<li><strong>高內聚 (High Cohesion)</strong>：資料與其行為緊密包裝。</li>
<li><strong>降低複雜度</strong>：透過物件邊界與接口，讓程式結構更加清晰、容易組裝與維護。</li>
</ul>

      <span class="hljs-variable language_">self</span>.x = x  <span class="hljs-comment"># 初始化物件變數</span>
      <span class="hljs-variable language_">self</span>.y = y

   <span class="hljs-keyword">def</span> <span class="hljs-title function_">getX</span>(<span class="hljs-params">self</span>):
      <span class="hljs-keyword">return</span> <span class="hljs-variable language_">self</span>.x

<span class="hljs-comment"># 物件的生成 (實例化)</span>

<h2 id="%E5%B0%81%E8%A3%9D%E7%9A%84%E5%A5%BD%E8%99%95%E4%BB%A5-people-%E9%A1%9E%E5%88%A5%E7%82%BA%E4%BE%8B">封裝的好處：以 People 類別為例</h2>
<ul>
<li>透過物件將「資料」與「行為」封裝，可使程式碼更加簡潔，避免參數過多的混亂設計。</li>
</ul>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-python"><span class="hljs-keyword">class</span> <span class="hljs-title class_">People</span>:
    <span class="hljs-keyword">def</span> <span class="hljs-title function_">__init__</span>(<span class="hljs-params">self, name, tall, weight</span>):
        <span class="hljs-variable language_">self</span>.name = name
        <span class="hljs-variable language_">self</span>.tall = tall
        <span class="hljs-variable language_">self</span>.weight = weight

    <span class="hljs-keyword">def</span> <span class="hljs-title function_">get_bmi</span>(<span class="hljs-params">self</span>):
        <span class="hljs-keyword">return</span> <span class="hljs-variable language_">self</span>.weight / (<span class="hljs-variable language_">self</span>.tall ** <span class="hljs-number">2</span>)

<span class="hljs-comment"># 物件導向設計：只需傳入兩個 People 物件</span>
<span class="hljs-keyword">def</span> <span class="hljs-title function_">better</span>(<span class="hljs-params">p1, p2</span>):
    <span class="hljs-keyword">return</span> p1.name <span class="hljs-keyword">if</span> p1.get_bmi() &lt; p2.get_bmi() <span class="hljs-keyword">else</span> p2.name

<span class="hljs-comment"># 傳統設計：參數過多，不夠簡潔</span>
<span class="hljs-comment"># def better(n1, h1, w1, n2, h2, w2):</span>
</code></pre>

<h2 id="%E7%8F%BE%E4%BB%A3-python%E8%B3%87%E6%96%99%E9%A1%9E%E5%88%A5-data-classes">現代 Python：資料類別 (Data Classes)</h2>
<ul>
<li>自 Python 3.7 起引入 <code>@dataclass</code>，專門簡化「單純儲存資料」類別的宣告，自動生成建構子、字串表達及比較方法。</li>
</ul>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-python"><span class="hljs-keyword">from</span> dataclasses <span class="hljs-keyword">import</span> dataclass

<span class="hljs-meta">@dataclass</span>
<span class="hljs-keyword">class</span> <span class="hljs-title class_">Student</span>:
    name: <span class="hljs-built_in">str</span>
    student_id: <span class="hljs-built_in">str</span>
    grades: <span class="hljs-built_in">list</span>[<span class="hljs-built_in">int</span>]

<span class="hljs-comment"># 自動生成 __init__</span>
s1 = Student(<span class="hljs-string">&#x27;Nick&#x27;</span>, <span class="hljs-string">&#x27;S9201201&#x27;</span>, [<span class="hljs-number">90</span>, <span class="hljs-number">72</span>, <span class="hljs-number">100</span>])
s2 = Student(<span class="hljs-string">&#x27;Nick&#x27;</span>, <span class="hljs-string">&#x27;S9201201&#x27;</span>, [<span class="hljs-number">90</span>, <span class="hljs-number">72</span>, <span class="hljs-number">100</span>])

<span class="hljs-comment"># 自動生成友善的 __repr__</span>
<span class="hljs-built_in">print</span>(s1)  <span class="hljs-comment"># 輸出: Student(name=&#x27;Nick&#x27;, student_id=&#x27;S9201201&#x27;, grades=[90, 72, 100])</span>

<span class="hljs-comment"># 自動生成 __eq__ (比較內容而非記憶體地址)</span>
<span class="hljs-built_in">print</span>(s1 == s2)  <span class="hljs-comment"># 輸出: True</span>
</code></pre>

<header>Python 程式設計 | 第七章：物件導向程式設計 (OOP)</header>
<h2 id="%E7%89%A9%E4%BB%B6%E7%9B%B8%E9%97%9C%E8%BC%94%E5%8A%A9%E5%87%BD%E5%BC%8F">物件相關輔助函式</h2>
<ul>
<li>Python 提供了數個內建函式用來查詢與操作物件：
<ul>
<li><code>type(obj)</code>：返回物件所屬的類別。</li>
<li><code>dir(obj)</code>：列出物件的所有方法和屬性。</li>
<li><code>id(obj)</code>：取得物件的唯一識別值（記憶體位置）。</li>
<li><code>hasattr(obj, name)</code>：檢查屬性是否存在於物件中。</li>
<li><code>getattr(obj, name, default)</code>：安全地獲取屬性值。</li>
<li><code>callable(obj)</code>：檢查物件是否可被呼叫（如函數或類別）。</li>
</ul>
</li>
</ul>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-python"><span class="hljs-keyword">class</span> <span class="hljs-title class_">BMI</span>:
    <span class="hljs-keyword">def</span> <span class="hljs-title function_">__init__</span>(<span class="hljs-params">self, w, h</span>):
        <span class="hljs-variable language_">self</span>.weight = w
        <span class="hljs-variable language_">self</span>.height = h

b = BMI(<span class="hljs-number">70</span>, <span class="hljs-number">1.7</span>)
<span class="hljs-built_in">print</span>(<span class="hljs-built_in">hasattr</span>(b, <span class="hljs-string">&#x27;weight&#x27;</span>))  <span class="hljs-comment"># True</span>
<span class="hljs-built_in">print</span>(<span class="hljs-built_in">getattr</span>(b, <span class="hljs-string">&#x27;age&#x27;</span>, <span class="hljs-number">18</span>)) <span class="hljs-comment"># 18 (安全取得屬性)</span>
</code></pre>

<header>Python 程式設計 | 第七章：物件導向程式設計 (OOP)</header>
<h2 id="%E7%89%A9%E4%BB%B6%E5%B1%AC%E6%80%A7-vs-%E9%A1%9E%E5%88%A5%E5%B1%AC%E6%80%A7">物件屬性 vs 類別屬性</h2>
<ul>
<li><strong>物件屬性 (實體屬性)</strong>：在 <code>__init__</code> 中以 <code>self.xxx</code> 定義，每個實例獨立擁有。</li>
<li><strong>類別屬性</strong>：直接在類別區塊中定義，所有實例共享。</li>
</ul>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-python"><span class="hljs-keyword">class</span> <span class="hljs-title class_">Car</span>:
    kind = <span class="hljs-string">&#x27;燃油車&#x27;</span>             <span class="hljs-comment"># 類別變數 (所有 Car 共用)</span>

    <span class="hljs-keyword">def</span> <span class="hljs-title function_">__init__</span>(<span class="hljs-params">self, car_id</span>):
        <span class="hljs-variable language_">self</span>.car_id = car_id    <span class="hljs-comment"># 物件變數 (各別 Car 獨立)</span>

c1 = Car(<span class="hljs-string">&#x27;c1&#x27;</span>)
c2 = Car(<span class="hljs-string">&#x27;c2&#x27;</span>)
<span class="hljs-built_in">print</span>(c1.kind, c2.kind) <span class="hljs-comment"># 燃油車 燃油車</span>

Car.kind = <span class="hljs-string">&#x27;電動車&#x27;</span>      <span class="hljs-comment"># 修改類別變數，所有實例的 kind 皆改變</span>
<span class="hljs-built_in">print</span>(c1.kind, c2.kind) <span class="hljs-comment"># 電動車 電動車</span>
</code></pre>

<ul>
<li>
<p><strong>解析</strong>：</p>
<ul>
<li><code>Counter.count</code> 存取的是定義在類別層級的<strong>類別屬性</strong>，其值為 <code>0</code>。它被所有實例共用，但不能透過實例進行直接覆寫（除非特別指定）。</li>
<li><code>c.count</code> 存取的是實例 <code>c</code> 初始化時在 <code>__init__</code> 中建立的<strong>實例屬性</strong>，其值為 <code>1</code>。</li>
<li>實例屬性與類別屬性同名時，實例屬性會<strong>遮蔽 (shadow)</strong> 類別屬性，因此存取 <code>c.count</code> 會優先返回實例屬性的值 <code>1</code>。</li>
</ul>

        <span class="hljs-variable language_">self</span>.__balance = money  <span class="hljs-comment"># 私有屬性</span>

            <span class="hljs-keyword">raise</span> Exception(<span class="hljs-string">&#x27;餘額不足&#x27;</span>)
        <span class="hljs-variable language_">self</span>.__balance -= money

<h3 id="%E6%AD%A3%E7%A2%BA%E7%AD%94%E6%A1%88c"><strong>正確答案：C</strong></h3>
<ul>
<li>
<p><strong>解析</strong>：</p>
<ul>
<li>在 Python 中，以兩個底線開頭但不用兩個底線結尾的屬性名稱（例如 <code>__code</code>），會觸發 <strong>名稱修飾 (Name Mangling)</strong> 機制。</li>
<li>直譯器會自動將這個屬性重新命名為 <code>_ClassName__attributeName</code>（即 <code>_Secretive__code</code>），以避免在繼承關係中意外衝突。</li>
<li>因此，在外部直接透過 <code>s.__code</code> 存取該屬性時，會因為找不到此名稱而引發 <code>AttributeError: 'Secretive' object has no attribute '__code'</code>。</li>
</ul>

        <span class="hljs-variable language_">self</span>.__balance = money
        <span class="hljs-variable language_">self</span>.__riskLevel = <span class="hljs-number">0</span>

<span class="hljs-meta">    @property</span>
    <span class="hljs-keyword">def</span> <span class="hljs-title function_">riskLevel</span>(<span class="hljs-params">self</span>): <span class="hljs-comment"># getter 宣告，直接以屬性名命名</span>

        <span class="hljs-keyword">return</span> level[<span class="hljs-variable language_">self</span>.__riskLevel]

<h2 id="%E7%B9%BC%E6%89%BF-inheritance">繼承 (Inheritance)</h2>
<ul>
<li>繼承允許子類別 (衍生類別) 取得父類別 (基礎類別) 的屬性與功能，提高程式碼重用性。</li>
</ul>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-python"><span class="hljs-keyword">class</span> <span class="hljs-title class_">Person</span>:
    <span class="hljs-keyword">def</span> <span class="hljs-title function_">__init__</span>(<span class="hljs-params">self, name, <span class="hljs-built_in">id</span></span>):
        <span class="hljs-variable language_">self</span>.name = name
        <span class="hljs-variable language_">self</span>.<span class="hljs-built_in">id</span> = <span class="hljs-built_in">id</span>
    <span class="hljs-keyword">def</span> <span class="hljs-title function_">walk</span>(<span class="hljs-params">self</span>):
        <span class="hljs-built_in">print</span>(<span class="hljs-variable language_">self</span>.name, <span class="hljs-string">&#x27;is walking&#x27;</span>)

<span class="hljs-comment"># Engineer 繼承 Person</span>
<span class="hljs-keyword">class</span> <span class="hljs-title class_">Engineer</span>(<span class="hljs-title class_ inherited__">Person</span>):
    <span class="hljs-keyword">def</span> <span class="hljs-title function_">__init__</span>(<span class="hljs-params">self, name, <span class="hljs-built_in">id</span>, skill</span>):
        <span class="hljs-built_in">super</span>().__init__(name, <span class="hljs-built_in">id</span>) <span class="hljs-comment"># 呼叫父類別建構子</span>
        <span class="hljs-variable language_">self</span>.skill = skill         <span class="hljs-comment"># 子類別新增屬性</span>
    <span class="hljs-keyword">def</span> <span class="hljs-title function_">fix</span>(<span class="hljs-params">self</span>):                 <span class="hljs-comment"># 子類別新增方法</span>
        <span class="hljs-built_in">print</span>(<span class="hljs-variable language_">self</span>.name, <span class="hljs-string">&#x27;is fixing bug&#x27;</span>)
</code></pre>

<h2 id="%E6%96%B9%E6%B3%95%E8%A6%86%E5%AF%AB-override-%E8%88%87%E5%A4%9A%E5%9E%8B">方法覆寫 (Override) 與多型</h2>
<ul>
<li>子類別可以重新定義父類別中同名的方法，以展現其專屬行為，這即是<strong>方法覆寫 (Override)</strong>：</li>
</ul>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-python"><span class="hljs-keyword">class</span> <span class="hljs-title class_">Manager</span>(<span class="hljs-title class_ inherited__">Person</span>):
    <span class="hljs-comment"># Override 父類別的方法</span>
    <span class="hljs-keyword">def</span> <span class="hljs-title function_">walk</span>(<span class="hljs-params">self</span>):
        <span class="hljs-built_in">print</span>(<span class="hljs-variable language_">self</span>.name, <span class="hljs-string">&#x27;is walking and thinking&#x27;</span>)
    <span class="hljs-keyword">def</span> <span class="hljs-title function_">plan</span>(<span class="hljs-params">self</span>):
        <span class="hljs-built_in">print</span>(<span class="hljs-variable language_">self</span>.name, <span class="hljs-string">&#x27;is planning for new project&#x27;</span>)

Jack = Engineer(<span class="hljs-string">&#x27;Jack&#x27;</span>, <span class="hljs-string">&#x27;S1234&#x27;</span>, <span class="hljs-string">&#x27;Python&#x27;</span>)
Mary = Manager(<span class="hljs-string">&#x27;Mary&#x27;</span>, <span class="hljs-string">&#x27;S5678&#x27;</span>)
Nick = Person(<span class="hljs-string">&#x27;Nick&#x27;</span>, <span class="hljs-string">&#x27;R9012&#x27;</span>)

group = [Jack, Mary, Nick]
<span class="hljs-keyword">for</span> p <span class="hljs-keyword">in</span> group:
    p.walk() <span class="hljs-comment"># 展現多型特徵，各別物件執行對應版本的 walk()</span>
</code></pre>

</ul>

<header>Python 程式設計 | 第七章：物件導向程式設計 (OOP)</header>
<h2 id="python-%E7%89%B9%E6%AE%8A%E6%96%B9%E6%B3%95-magic-methods">Python 特殊方法 (Magic Methods)</h2>
<ul>
<li>特殊方法（或稱魔法方法，Dunder Methods）是以雙底線開頭與結尾的方法。</li>
<li>它們定義了物件與 Python 內建運算子（如 <code>+</code>, <code>-</code>, <code>==</code>, <code>len()</code>, <code>str()</code>）的行為。</li>
</ul>
<table>
<thead>
<tr>
<th>特殊方法</th>
<th>呼叫時機</th>
</tr>
</thead>
<tbody>
<tr>
<td><code>__init__(self, ...)</code></td>
<td>創建對象（構造函數）時</td>
</tr>
<tr>
<td><code>__str__(self)</code></td>
<td>使用 <code>str(obj)</code> 或 <code>print(obj)</code> 時</td>
</tr>
<tr>
<td><code>__repr__(self)</code></td>
<td>互動式命令列中輸入物件名稱時</td>
</tr>
<tr>
<td><code>__add__(self, other)</code></td>
<td>使用 <code>+</code> 加法運算時</td>
</tr>
<tr>
<td><code>__sub__(self, other)</code></td>
<td>使用 <code>-</code> 減法運算時</td>
</tr>
<tr>
<td><code>__eq__(self, other)</code></td>
<td>使用 <code>==</code> 等於運算時</td>
</tr>
</tbody>
</table>

<h2 id="%E7%89%B9%E6%AE%8A%E6%96%B9%E6%B3%95%E6%87%89%E7%94%A8%E6%9C%89%E7%90%86%E6%95%B8-rational-%E9%A1%9E%E5%88%A5">特殊方法應用：有理數 Rational 類別</h2>
<ul>
<li>自訂 Rational (分數) 類別，透過實作特殊方法，使其能與內建數值般進行運算：</li>

<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-python"><span class="hljs-keyword">class</span> <span class="hljs-title class_">Rational</span>:
    <span class="hljs-keyword">def</span> <span class="hljs-title function_">__init__</span>(<span class="hljs-params">self, n, d</span>):
        <span class="hljs-variable language_">self</span>.numer = n
        <span class="hljs-variable language_">self</span>.denom = d
    
    <span class="hljs-keyword">def</span> <span class="hljs-title function_">__str__</span>(<span class="hljs-params">self</span>): <span class="hljs-comment"># 定義 print(obj) 的格式</span>
        <span class="hljs-keyword">return</span> <span class="hljs-string">f&quot;<span class="hljs-subst">{self.numer}</span>/<span class="hljs-subst">{self.denom}</span>&quot;</span>
    
    <span class="hljs-keyword">def</span> <span class="hljs-title function_">__add__</span>(<span class="hljs-params">self, that</span>): <span class="hljs-comment"># 定義 + 運算</span>
        <span class="hljs-keyword">return</span> Rational(<span class="hljs-variable language_">self</span>.numer * that.denom + that.numer * <span class="hljs-variable language_">self</span>.denom, 
                        <span class="hljs-variable language_">self</span>.denom * that.denom)
    
    <span class="hljs-keyword">def</span> <span class="hljs-title function_">__eq__</span>(<span class="hljs-params">self, that</span>): <span class="hljs-comment"># 定義 == 運算</span>
        <span class="hljs-keyword">return</span> <span class="hljs-variable language_">self</span>.numer * that.denom == that.numer * <span class="hljs-variable language_">self</span>.denom
