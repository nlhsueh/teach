<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-python"><span class="hljs-comment"># 1. Input: 取得使用者輸入的名子</span>
name = <span class="hljs-built_in">input</span>(<span class="hljs-string">&quot;What is your name: &quot;</span>) 
<span class="hljs-comment"># 2. Process: 字串串接與運算</span>
helloToYou = <span class="hljs-string">&quot;Hello &quot;</span> + name
<span class="hljs-comment"># 3. Output: 輸出問候字串</span>
<span class="hljs-built_in">print</span> (helloToYou)

<span class="hljs-comment"># 使用變數儲存資料進行計算</span>

weight = <span class="hljs-number">65</span>
height = <span class="hljs-number">1.7</span>
<span class="hljs-comment"># 計算 BMI</span>

<h2 id="221-%E4%BB%80%E9%BA%BC%E6%98%AF%E8%AE%8A%E6%95%B8-variable">2.2.1 什麼是變數 (Variable)</h2>
<ul>
<li>用來<strong>儲存特定資料值</strong>的記憶體容器，以供後續程式重複調用與處理。</li>
<li>在 Python 中，<strong>不需要事先宣告變數的型態</strong>，變數會自動根據賦予的值決定型態（動態型態）。</li>
<li><strong>賦值運算子 (<code>=</code>)</strong>：將右邊的資料值指定給左邊的變數。<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-python">x = <span class="hljs-number">100</span>       <span class="hljs-comment"># 宣告一個整數變數 x</span>
y = <span class="hljs-number">200</span>       <span class="hljs-comment"># 宣告一個整數變數 y</span>
p = q = <span class="hljs-number">100</span>   <span class="hljs-comment"># 多重宣告：將 p 和 q 都設定為 100</span>
name, eng, math = <span class="hljs-string">&quot;Nick&quot;</span>, <span class="hljs-number">92</span>, <span class="hljs-number">88</span> <span class="hljs-comment"># 同時宣告多個變數並賦值</span>
</code></pre>
</li>
</ul>

<h2 id="%E6%AA%A2%E6%9F%A5%E5%9E%8B%E6%85%8B%E8%88%87-isinstance">檢查型態與 isinstance</h2>
<ul>
<li>使用 <code>type()</code> 查詢變數型態；使用 <code>isinstance()</code> 檢驗物件是否屬於某類別。</li>
</ul>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-python">grade = <span class="hljs-number">89</span>
temperature = <span class="hljs-number">32.5</span>
isTeacher = <span class="hljs-literal">True</span>

<span class="hljs-built_in">print</span>(<span class="hljs-built_in">type</span>(grade))        <span class="hljs-comment"># 輸出: &lt;class &#x27;int&#x27;&gt;</span>
<span class="hljs-built_in">print</span>(<span class="hljs-built_in">type</span>(temperature))  <span class="hljs-comment"># 輸出: &lt;class &#x27;float&#x27;&gt;</span>

<span class="hljs-comment"># 檢驗型態是否符合</span>
<span class="hljs-built_in">print</span>(<span class="hljs-built_in">type</span>(grade) == <span class="hljs-built_in">int</span>)      <span class="hljs-comment"># 輸出: True </span>
<span class="hljs-built_in">print</span>(<span class="hljs-built_in">isinstance</span>(grade, <span class="hljs-built_in">float</span>)) <span class="hljs-comment"># 輸出: False</span>
<span class="hljs-built_in">print</span>(<span class="hljs-built_in">isinstance</span>(<span class="hljs-string">&#x27;two&#x27;</span>, <span class="hljs-built_in">str</span>))   <span class="hljs-comment"># 輸出: True</span>
<span class="hljs-built_in">print</span>(<span class="hljs-built_in">isinstance</span>(<span class="hljs-number">2</span>==<span class="hljs-number">2</span>, <span class="hljs-built_in">bool</span>))   <span class="hljs-comment"># 輸出: True</span>
</code></pre>

<h2 id="%E5%9E%8B%E6%85%8B%E8%BD%89%E6%8F%9B-type-casting">型態轉換 (Type Casting)</h2>
<ul>
<li>將資料從一種型態強制轉換為另一種型態：</li>
</ul>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-python"><span class="hljs-built_in">float</span>(<span class="hljs-number">2</span>)   <span class="hljs-comment"># 整數 2 轉為浮點數 2.0</span>
<span class="hljs-built_in">int</span>(<span class="hljs-number">2.9</span>)   <span class="hljs-comment"># 浮點數 2.9 轉為整數 2 (直接捨去小數點，不四捨五入)</span>
<span class="hljs-built_in">str</span>(<span class="hljs-number">2.9</span>)   <span class="hljs-comment"># 浮點數 2.9 轉為字串 &#x27;2.9&#x27;</span>

<span class="hljs-comment"># 布林轉換：數值零、None、空的容器(字串、串列)會被轉換為 False</span>
<span class="hljs-built_in">bool</span>(<span class="hljs-number">0</span>)     <span class="hljs-comment"># False</span>
<span class="hljs-built_in">bool</span>(<span class="hljs-literal">None</span>)  <span class="hljs-comment"># False</span>
<span class="hljs-built_in">bool</span>(<span class="hljs-string">&#x27;&#x27;</span>)    <span class="hljs-comment"># False</span>

<span class="hljs-comment"># 非零、非空的物件都會被轉換為 True</span>
<span class="hljs-built_in">bool</span>(<span class="hljs-number">2</span>)     <span class="hljs-comment"># True</span>
<span class="hljs-built_in">bool</span>(<span class="hljs-string">&#x27;two&#x27;</span>) <span class="hljs-comment"># True</span>
</code></pre>

<ul>
<li>利用 <code>ord()</code> 取得 <code>'a'</code> 的編碼，再以迴圈將數字轉回字元印出：</li>
</ul>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-python">a_code = <span class="hljs-built_in">ord</span>(<span class="hljs-string">&#x27;a&#x27;</span>) <span class="hljs-comment"># 取得 &#x27;a&#x27; 的 ASCII 碼 97</span>
<span class="hljs-built_in">print</span>(<span class="hljs-string">&#x27;The ASCII code of a is&#x27;</span>, a_code)

<span class="hljs-comment"># 遍歷 97 ~ 122，轉換並印出字元</span>
<span class="hljs-keyword">for</span> i <span class="hljs-keyword">in</span> <span class="hljs-built_in">range</span>(a_code, a_code + <span class="hljs-number">26</span>):
    <span class="hljs-built_in">print</span>(<span class="hljs-built_in">chr</span>(i), end=<span class="hljs-string">&#x27; &#x27;</span>)

<span class="hljs-comment"># 輸出結果：</span>
<span class="hljs-comment"># The ASCII code of a is 97</span>
<span class="hljs-comment"># a b c d e f g h i j k l m n o p q r s t u v w x y z</span>

<h2 id="round-%E9%8A%80%E8%A1%8C%E5%AE%B6%E6%8D%A8%E5%85%A5%E6%B3%95-bankers-rounding">round() 銀行家捨入法 (Banker's Rounding)</h2>
<ul>
<li>Python 採用的 <code>round()</code> 機制是 <strong>「銀行家捨入法」</strong>，又稱 <strong>「四捨六入五成雙」</strong>：
<ul>
<li><strong>小數點後 &gt; 0.5</strong>：向上進位（例：<code>round(3.51)</code> -&gt; <code>4</code>）。</li>
<li><strong>小數點後 &lt; 0.5</strong>：向下捨去（例：<code>round(3.49)</code> -&gt; <code>3</code>）。</li>
<li><strong>小數點後恰等於 0.5</strong>：捨入到最接近的 <strong>「偶數」</strong>。
<ul>
<li><code>round(2.5)</code> -&gt; <strong><code>2</code></strong> (2 是偶數)</li>
<li><code>round(3.5)</code> -&gt; <strong><code>4</code></strong> (4 是最近的偶數)</li>
<li><code>round(4.5)</code> -&gt; <strong><code>4</code></strong> (4 是偶數)</li>
</ul>
</li>
</ul>
</li>
<li><strong>設計目的</strong>：避免累計捨入誤差在統計時系統性偏高，使大數據求和時更平準接近真實值。</li>
</ul>

<ul>
<li>算出太空飛行共需幾天、幾小時、幾分、幾秒：</li>
</ul>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-python">dist = <span class="hljs-number">384400</span> <span class="hljs-comment"># 地球到月球距離</span>
speed = <span class="hljs-number">1225</span>  <span class="hljs-comment"># 馬赫時速</span>
total_hours = dist / speed <span class="hljs-comment"># 小時</span>

<span class="hljs-comment"># 1. 傳統除法與餘數</span>
days = total_hours // <span class="hljs-number">24</span>
hours = total_hours % <span class="hljs-number">24</span>

<span class="hljs-comment"># 2. 使用 divmod() 同時求商與餘數</span>
days, hours = <span class="hljs-built_in">divmod</span>(total_hours, <span class="hljs-number">24</span>)
xmins = <span class="hljs-number">60</span> * (hours - <span class="hljs-built_in">int</span>(hours))
mins, secs = <span class="hljs-built_in">divmod</span>(xmins, <span class="hljs-number">60</span>)
secs = <span class="hljs-number">60</span> * (secs - <span class="hljs-built_in">int</span>(secs))

<span class="hljs-built_in">print</span>(<span class="hljs-string">&#x27;共需 {} 天 {} 小時 {} 分 {} 秒&#x27;</span>.<span class="hljs-built_in">format</span>(days, <span class="hljs-built_in">int</span>(hours), <span class="hljs-built_in">int</span>(xmins), <span class="hljs-built_in">int</span>(secs)))
<span class="hljs-comment"># 輸出：共需 13.0 天 1 小時 47 分 45 秒</span>
</code></pre>

<h2 id="232-%E5%AD%97%E4%B8%B2%E9%81%8B%E7%AE%97-string-operators">2.3.2 字串運算 (String Operators)</h2>
<table>
<thead>
<tr>
<th style="text-align:center">運算子</th>
<th style="text-align:left">說明</th>
<th style="text-align:left">範例</th>

</thead>
<tbody>
<tr>
<td style="text-align:center"><code>+</code></td>
<td style="text-align:left">字串串接</td>
<td style="text-align:left"><code>&quot;Hello, &quot; + &quot;world&quot;</code> -&gt; <code>&quot;Hello, world&quot;</code></td>
</tr>
<tr>
<td style="text-align:center"><code>*</code></td>
<td style="text-align:left">重複字串</td>
<td style="text-align:left"><code>&quot;abc&quot; * 3</code> -&gt; <code>&quot;abcabcabc&quot;</code></td>
</tr>
<tr>
<td style="text-align:center"><code>[]</code></td>
<td style="text-align:left">索引取得單一字元</td>
<td style="text-align:left"><code>&quot;Python&quot;[0]</code> -&gt; <code>&quot;P&quot;</code></td>
</tr>
<tr>
<td style="text-align:center"><code>[:]</code></td>
<td style="text-align:left"><strong>切片取得子字串（左閉右開）</strong></td>
<td style="text-align:left"><code>&quot;Python&quot;[1:4]</code> -&gt; <code>&quot;yth&quot;</code> (不包含索引4)</td>

<tr>
<td style="text-align:center"><code>in</code></td>
<td style="text-align:left">檢查是否包含子字串</td>

<h2 id="%E5%AD%97%E4%B8%B2%E9%81%8B%E7%AE%97%E8%88%87%E5%88%87%E7%89%87%E7%AF%84%E4%BE%8B">字串運算與切片範例</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-python">name = <span class="hljs-string">&quot;Nick&quot;</span>
<span class="hljs-built_in">print</span>(name * <span class="hljs-number">3</span>)    <span class="hljs-comment"># 輸出: NickNickNick</span>
<span class="hljs-built_in">print</span>(<span class="hljs-string">&#x27;N&#x27;</span> <span class="hljs-keyword">in</span> name) <span class="hljs-comment"># 輸出: True</span>

<span class="hljs-comment"># 字串索引與切片</span>
s = <span class="hljs-string">&quot;0123456789&quot;</span>
<span class="hljs-built_in">print</span>(s[<span class="hljs-number">5</span>])        <span class="hljs-comment"># 輸出: 5 (從 0 開始數起)</span>
<span class="hljs-built_in">print</span>(s[<span class="hljs-number">3</span>:<span class="hljs-number">6</span>])      <span class="hljs-comment"># 輸出: 345 (只取得索引 3, 4, 5 的字元)</span>

<span class="hljs-comment"># 字串基本函式</span>
hello = <span class="hljs-string">&quot;Hello, Nick&quot;</span>

<h3 id="%E6%AD%A3%E7%A2%BA%E7%AD%94%E6%A1%88a-yth"><strong>正確答案：A. &quot;yth&quot;</strong></h3>

<li>
<p><strong>解析</strong>：</p>

<h2 id="233-%E9%97%9C%E4%BF%82%E9%81%8B%E7%AE%97%E8%88%87%E9%82%8F%E8%BC%AF%E9%81%8B%E7%AE%97">2.3.3 關係運算與邏輯運算</h2>
<ul>
<li><strong>關係運算</strong>：用於比較兩個值，回傳 <code>True</code> 或 <code>False</code>：<br />
<code>==</code> (等於)、<code>!=</code> (不等於)、<code>&lt;</code> (小於)、<code>&gt;</code> (大於)、<code>&lt;=</code> (小於等於)、<code>&gt;=</code> (大於等於)</li>
<li><strong>邏輯運算</strong>：用於組合多個布林條件：
<ul>
<li><strong><code>and</code></strong>：兩者皆為 True，結果才為 True。</li>
<li><strong><code>or</code></strong>：兩者只要有一者為 True，結果即為 True。</li>
<li><strong><code>not</code></strong>：邏輯反轉（True 變 False，False 變 True）。</li>
</ul>
</li>
</ul>

<li><strong><code>%</code> 運算子</strong>：C 語言風格（例：<code>&quot;%s 歲數是 %d&quot; % (name, age)</code>）。</li>
</ul>
</li>
</ul>

<h2 id="%E6%8E%92%E7%89%88%E5%B0%8D%E9%BD%8A%E8%A8%AD%E5%AE%9A-alignment--padding">排版對齊設定 (Alignment &amp; Padding)</h2>
<ul>
<li>在格式化輸出中，可控制欄位寬度、對齊方向及小數點位數：</li>
</ul>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-python"><span class="hljs-comment"># 1. 舊式 % 排版</span>
<span class="hljs-built_in">print</span>(<span class="hljs-string">&quot;&#x27;%5d&#x27;&quot;</span> % <span class="hljs-number">12</span>)       <span class="hljs-comment"># 右對齊，寬度 5 格 -&gt; &#x27;   12&#x27;</span>
<span class="hljs-built_in">print</span>(<span class="hljs-string">&quot;&#x27;%-5d&#x27;&quot;</span> % <span class="hljs-number">12</span>)      <span class="hljs-comment"># 左對齊，寬度 5 格 -&gt; &#x27;12   &#x27;</span>
<span class="hljs-built_in">print</span>(<span class="hljs-string">&quot;&#x27;%8.2f&#x27;&quot;</span> % <span class="hljs-number">3.1415</span>) <span class="hljs-comment"># 浮點數，小數 2 位，寬度 8 格 -&gt; &#x27;    3.14&#x27;</span>

<span class="hljs-comment"># 2. format() 排版</span>
<span class="hljs-built_in">print</span>(<span class="hljs-string">&quot;{:&gt;5d}&quot;</span>.<span class="hljs-built_in">format</span>(<span class="hljs-number">12</span>)) <span class="hljs-comment"># 右對齊，寬 5 -&gt; &#x27;   12&#x27;</span>
<span class="hljs-built_in">print</span>(<span class="hljs-string">&quot;{:&lt;5d}&quot;</span>.<span class="hljs-built_in">format</span>(<span class="hljs-number">12</span>)) <span class="hljs-comment"># 左對齊，寬 5 -&gt; &#x27;12   &#x27;</span>
<span class="hljs-built_in">print</span>(<span class="hljs-string">&quot;{:8.2f}&quot;</span>.<span class="hljs-built_in">format</span>(<span class="hljs-number">3.1415</span>)) <span class="hljs-comment"># 寬 8，小數 2 位 -&gt; &#x27;    3.14&#x27;</span>
<span class="hljs-built_in">print</span>(<span class="hljs-string">&quot;{:&lt;10s}&quot;</span>.<span class="hljs-built_in">format</span>(<span class="hljs-string">&quot;hello&quot;</span>)) <span class="hljs-comment"># 字串左對齊，寬 10 -&gt; &#x27;hello     &#x27;</span>

<h2 id="245-%E6%AA%94%E6%A1%88%E8%AE%80%E5%AF%AB-with-open">2.4.5 檔案讀寫 (with open)</h2>

<ul>

</ul>
</li>
<li><strong>讀取模式 (<code>'r'</code>)</strong>：
<ul>
<li><code>f.readline()</code>：一次讀取檔案的一行資料（會連帶讀入換行符號 <code>\n</code>）。</li>
</ul>
</li>
</ul>

<h2 id="%E6%AA%94%E6%A1%88%E8%AE%80%E5%AF%AB%E5%AF%A6%E5%8B%99%E7%AF%84%E4%BE%8B">檔案讀寫實務範例</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-python"><span class="hljs-comment"># 1. 寫入學生成績檔</span>
<span class="hljs-keyword">with</span> <span class="hljs-built_in">open</span>(<span class="hljs-string">&quot;grade.txt&quot;</span>, <span class="hljs-string">&quot;w&quot;</span>, encoding=<span class="hljs-string">&quot;utf-8&quot;</span>) <span class="hljs-keyword">as</span> f:
    <span class="hljs-built_in">print</span>(<span class="hljs-string">&#x27;張三&#x27;</span>, file=f)
    <span class="hljs-built_in">print</span>(<span class="hljs-string">&#x27;100, 20, 40&#x27;</span>, file=f)
    <span class="hljs-built_in">print</span>(<span class="hljs-string">&#x27;李四&#x27;</span>, file=f)
    <span class="hljs-built_in">print</span>(<span class="hljs-string">&#x27;90, 50, 100&#x27;</span>, file=f)

<span class="hljs-comment"># 2. 讀取學生成績並計算平均</span>
<span class="hljs-keyword">with</span> <span class="hljs-built_in">open</span>(<span class="hljs-string">&quot;grade.txt&quot;</span>, <span class="hljs-string">&quot;r&quot;</span>, encoding=<span class="hljs-string">&quot;utf-8&quot;</span>) <span class="hljs-keyword">as</span> f2:
    st1 = f2.readline().replace(<span class="hljs-string">&#x27;\n&#x27;</span>, <span class="hljs-string">&#x27;&#x27;</span>)  <span class="hljs-comment"># 讀取 &#x27;張三&#x27;</span>
    st1a, st1b, st1c = <span class="hljs-built_in">eval</span>(f2.readline()) <span class="hljs-comment"># 讀取三科成績</span>
    st1d = (st1a + st1b + st1c) / <span class="hljs-number">3</span>
    <span class="hljs-built_in">print</span>(<span class="hljs-string">&quot;{} 的平均成績為: {:5.1f}&quot;</span>.<span class="hljs-built_in">format</span>(st1, st1d))
    
    st2 = f2.readline().replace(<span class="hljs-string">&#x27;\n&#x27;</span>, <span class="hljs-string">&#x27;&#x27;</span>)  <span class="hljs-comment"># 讀取 &#x27;李四&#x27;</span>
    st2a, st2b, st2c = <span class="hljs-built_in">eval</span>(f2.readline()) <span class="hljs-comment"># 讀取三科成績</span>
    st2d = (st2a + st2b + st2c) / <span class="hljs-number">3</span>
    <span class="hljs-built_in">print</span>(<span class="hljs-string">&quot;{} 的平均成績為: {:5.1f}&quot;</span>.<span class="hljs-built_in">format</span>(st2, st2d))
</code></pre>
<h2 id="concept-check-question-ccq-6">Concept Check Question (CCQ 6)</h2>
<div class="ccq-columns">
  <div class="ccq-text">
<p><strong>在 Python 中進行檔案讀寫時，使用 <code>with open(...)</code> 的主要優點是什麼？</strong></p>
<ul>
<li>
<p><strong>A.</strong> 檔案的寫入速度會比傳統 <code>open()</code> 快速很多。</p>
</li>
<li>
<p><strong>B.</strong> 能自動將寫入的資料進行壓縮，節省硬碟空間。</p>
</li>
<li>
<p><strong>C.</strong> 無論程式是否正常結束或發生異常，都會自動關閉檔案。</p>
</li>
<li>
<p><strong>D.</strong> 能夠自動修正程式碼中的語法錯誤。</p>
</div>

<ul>
<li><strong>語法錯誤 (Syntax Error)</strong>：程式碼不符合語法規則，直譯器無法解譯執行。（例：少括號、少冒號）</li>
<li><strong>執行期錯誤 (Runtime Error)</strong>：語法完全正確，但在特定條件或輸入下因為無效操作崩潰。（例：除以零、轉型失敗）</li>
<li><strong>邏輯錯誤 (Logic Error)</strong>：程式能順利執行到底，但運算公式寫錯，導致輸出結果並非預期。（例：加寫成乘）</li>
</ul>

<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-python"><span class="hljs-comment"># 1. 語法錯誤 (Syntax Error)</span>
radius = <span class="hljs-built_in">int</span>(<span class="hljs-built_in">input</span>(<span class="hljs-string">&quot;The radius? &quot;</span>) <span class="hljs-comment"># <img class="emoji" draggable="false" alt="❌" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/274c.svg" data-marp-twemoji=""/> 括號不匹配，會直接報 SyntaxError</span>
</code></pre>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-python"><span class="hljs-comment"># 2. 執行期錯誤 (Runtime Error)</span>
radius = <span class="hljs-built_in">int</span>(<span class="hljs-built_in">input</span>(<span class="hljs-string">&quot;The radius? &quot;</span>)) <span class="hljs-comment"># 如果使用者輸入 &quot;1.1&quot;，整數轉型失敗崩潰</span>
<span class="hljs-comment"># 修正為：</span>

</code></pre>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-python"><span class="hljs-comment"># 3. 邏輯錯誤 (Logic Error)</span>

<ul>
<li><strong>單行註解</strong>：在程式碼行上方，以 <code>#</code> 開頭。</li>

<li><strong>多行/區塊註解</strong>：以三個單引號 <code>'''</code> 或雙引號 <code>&quot;&quot;&quot;</code> 包裹。</li>
</ul>
</li>
</ul>

by Nick Hsueh

<span class="hljs-comment"># 單行註解：隨機的產生10個數字</span>

<span class="hljs-built_in">print</span>(a)     <span class="hljs-comment"># 行內註解：印出原始資料</span>

p = <span class="hljs-built_in">round</span>(d * <span class="hljs-number">3.14</span>, <span class="hljs-number">2</span>)     <span class="hljs-comment"># 周長</span>

  max-height: 100%;
  object-fit: contain;
}

}

<span class="hljs-comment"># 計算兩點距離公式</span>
