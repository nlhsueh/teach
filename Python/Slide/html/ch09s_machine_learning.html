<h1 id="91-%E6%A9%9F%E5%99%A8%E5%AD%B8%E7%BF%92%E5%9F%BA%E7%A4%8E%E8%A7%80%E5%BF%B5">9.1 機器學習基礎觀念</h1>
<ul>
<li data-marpit-fragment="1"><strong>AI vs ML vs DL</strong>：
<ul>
<li><strong>AI</strong> (人工智慧)：模擬人類智慧。</li>
<li><strong>ML</strong> (機器學習)：從歷史數據中「自我學習」規律。</li>
<li><strong>DL</strong> (深度學習)：利用多層神經網路處理複雜非線性結構。</li>
</ul>
</li>
<li data-marpit-fragment="2"><strong>監督式學習 (Supervised)</strong>：
<ul>
<li>有給定標籤。如：<strong>分類</strong>（預測類別）與<strong>迴歸</strong>（預測數值）。</li>
</ul>
</li>
<li data-marpit-fragment="3"><strong>非監督式學習 (Unsupervised)</strong>：
<ul>
<li>無給定標籤。如：<strong>分群</strong>。</li>
</ul>
</li>
</ul>

<h1 id="92-%E7%9B%A3%E7%9D%A3%E5%BC%8F%E5%AD%B8%E7%BF%92%E5%88%86%E9%A1%9E%E4%BB%BB%E5%8B%99%E8%88%87%E8%B6%85%E5%8F%83%E6%95%B8%E8%AA%BF%E6%A0%A1">9.2 監督式學習：分類任務與超參數調校</h1>
<ul>
<li data-marpit-fragment="1"><strong>K-近鄰演算法 (KNN)</strong>：
<ul>
<li>依據最近的 <mjx-container class="MathJax" jax="SVG"><svg style="vertical-align: 0;" xmlns="http://www.w3.org/2000/svg" width="2.011ex" height="1.545ex" role="img" focusable="false" viewBox="0 -683 889 683"><g stroke="currentColor" fill="currentColor" stroke-width="0" transform="scale(1,-1)"><g data-mml-node="math"><g data-mml-node="mi"><path data-c="1D43E" d="M285 628Q285 635 228 637Q205 637 198 638T191 647Q191 649 193 661Q199 681 203 682Q205 683 214 683H219Q260 681 355 681Q389 681 418 681T463 682T483 682Q500 682 500 674Q500 669 497 660Q496 658 496 654T495 648T493 644T490 641T486 639T479 638T470 637T456 637Q416 636 405 634T387 623L306 305Q307 305 490 449T678 597Q692 611 692 620Q692 635 667 637Q651 637 651 648Q651 650 654 662T659 677Q662 682 676 682Q680 682 711 681T791 680Q814 680 839 681T869 682Q889 682 889 672Q889 650 881 642Q878 637 862 637Q787 632 726 586Q710 576 656 534T556 455L509 418L518 396Q527 374 546 329T581 244Q656 67 661 61Q663 59 666 57Q680 47 717 46H738Q744 38 744 37T741 19Q737 6 731 0H720Q680 3 625 3Q503 3 488 0H478Q472 6 472 9T474 27Q478 40 480 43T491 46H494Q544 46 544 71Q544 75 517 141T485 216L427 354L359 301L291 248L268 155Q245 63 245 58Q245 51 253 49T303 46H334Q340 37 340 35Q340 19 333 5Q328 0 317 0Q314 0 280 1T180 2Q118 2 85 2T49 1Q31 1 31 11Q31 13 34 25Q38 41 42 43T65 46Q92 46 125 49Q139 52 144 61Q147 65 216 339T285 628Z"></path></g></g></g></svg></mjx-container> 個鄰居的多數決決定類別。</li>
<li>核心數學：歐氏距離與曼哈頓距離。</li>

<li data-marpit-fragment="2"><strong>決策樹 (Decision Tree)</strong>：

<h2 id="ccq-2---%E7%AD%94%E6%A1%88%E8%88%87%E8%A7%A3%E6%9E%90">CCQ 2 - 答案與解析</h2>
<div class="ccq-columns">
  <div class="ccq-text">
<h3 id="%E6%AD%A3%E7%A2%BA%E7%AD%94%E6%A1%88c-%E6%B1%BA%E7%AD%96%E6%A8%B9%E6%9C%83%E9%81%8E%E5%BA%A6%E5%88%86%E8%A3%82%E6%A5%B5%E6%98%93%E7%94%A2%E7%94%9F%E9%81%8E%E6%93%AC%E5%90%88-overfitting-%E4%B8%A6%E5%96%AA%E5%A4%B1%E6%B3%9B%E5%8C%96%E8%83%BD%E5%8A%9B"><strong>正確答案：C. 決策樹會過度分裂，極易產生過擬合 (Overfitting) 並喪失泛化能力</strong></h3>
<ul>
<li data-marpit-fragment="1">
<p><strong>解析</strong>：</p>
<ul>
<li>不設最大深度的樹會一直分裂到所有葉節點都只包含單一類別（即 100% 純淨），這會使其記住訓練集中微小的隨機噪聲，降低新樣本預測能力。</li>
<li>通常需要透過限制樹深度（Pre-pruning）來做正規化，故選 C。</li>
</ul>
</div>

</ul>

</li>
<li data-marpit-fragment="2"><strong>L1 &amp; L2 正規化 (Regularization)</strong>：
<ul>
<li><strong>脊迴歸 (Ridge / L2)</strong>：加上權重平方懲罰項，均勻縮小所有權重。</li>
<li><strong>套索迴歸 (Lasso / L1)</strong>：加上權重絕對值懲罰，強制將不重要權重歸 0。</li>
</ul>
</li>

<h1 id="94-%E9%9D%9E%E7%9B%A3%E7%9D%A3%E5%BC%8F%E5%AD%B8%E7%BF%92k-means-%E8%B3%87%E6%96%99%E5%88%86%E7%BE%A4%E8%88%87%E8%82%98%E9%83%A8%E6%B3%95">9.4 非監督式學習：K-Means 資料分群與肘部法</h1>
<ul>
<li data-marpit-fragment="1"><strong>K-Means 聚類演算法</strong>：
<ul>
<li>重複計算群心並更新資料點分配，目標是最小化點至群心之距離和。</li>
</ul>
</li>
<li data-marpit-fragment="2"><strong>肘部法 (Elbow Method)</strong>：
<ul>
<li>計算不同 <mjx-container class="MathJax" jax="SVG"><svg style="vertical-align: 0;" xmlns="http://www.w3.org/2000/svg" width="2.011ex" height="1.545ex" role="img" focusable="false" viewBox="0 -683 889 683"><g stroke="currentColor" fill="currentColor" stroke-width="0" transform="scale(1,-1)"><g data-mml-node="math"><g data-mml-node="mi"><path data-c="1D43E" d="M285 628Q285 635 228 637Q205 637 198 638T191 647Q191 649 193 661Q199 681 203 682Q205 683 214 683H219Q260 681 355 681Q389 681 418 681T463 682T483 682Q500 682 500 674Q500 669 497 660Q496 658 496 654T495 648T493 644T490 641T486 639T479 638T470 637T456 637Q416 636 405 634T387 623L306 305Q307 305 490 449T678 597Q692 611 692 620Q692 635 667 637Q651 637 651 648Q651 650 654 662T659 677Q662 682 676 682Q680 682 711 681T791 680Q814 680 839 681T869 682Q889 682 889 672Q889 650 881 642Q878 637 862 637Q787 632 726 586Q710 576 656 534T556 455L509 418L518 396Q527 374 546 329T581 244Q656 67 661 61Q663 59 666 57Q680 47 717 46H738Q744 38 744 37T741 19Q737 6 731 0H720Q680 3 625 3Q503 3 488 0H478Q472 6 472 9T474 27Q478 40 480 43T491 46H494Q544 46 544 71Q544 75 517 141T485 216L427 354L359 301L291 248L268 155Q245 63 245 58Q245 51 253 49T303 46H334Q340 37 340 35Q340 19 333 5Q328 0 317 0Q314 0 280 1T180 2Q118 2 85 2T49 1Q31 1 31 11Q31 13 34 25Q38 41 42 43T65 46Q92 46 125 49Q139 52 144 61Q147 65 216 339T285 628Z"></path></g></g></g></svg></mjx-container> 值對應之 Inertia (群內誤差平方和)。</li>
<li>在折線圖上手肘彎折的轉折點即為最合理的 <mjx-container class="MathJax" jax="SVG"><svg style="vertical-align: 0;" xmlns="http://www.w3.org/2000/svg" width="2.011ex" height="1.545ex" role="img" focusable="false" viewBox="0 -683 889 683"><g stroke="currentColor" fill="currentColor" stroke-width="0" transform="scale(1,-1)"><g data-mml-node="math"><g data-mml-node="mi"><path data-c="1D43E" d="M285 628Q285 635 228 637Q205 637 198 638T191 647Q191 649 193 661Q199 681 203 682Q205 683 214 683H219Q260 681 355 681Q389 681 418 681T463 682T483 682Q500 682 500 674Q500 669 497 660Q496 658 496 654T495 648T493 644T490 641T486 639T479 638T470 637T456 637Q416 636 405 634T387 623L306 305Q307 305 490 449T678 597Q692 611 692 620Q692 635 667 637Q651 637 651 648Q651 650 654 662T659 677Q662 682 676 682Q680 682 711 681T791 680Q814 680 839 681T869 682Q889 682 889 672Q889 650 881 642Q878 637 862 637Q787 632 726 586Q710 576 656 534T556 455L509 418L518 396Q527 374 546 329T581 244Q656 67 661 61Q663 59 666 57Q680 47 717 46H738Q744 38 744 37T741 19Q737 6 731 0H720Q680 3 625 3Q503 3 488 0H478Q472 6 472 9T474 27Q478 40 480 43T491 46H494Q544 46 544 71Q544 75 517 141T485 216L427 354L359 301L291 248L268 155Q245 63 245 58Q245 51 253 49T303 46H334Q340 37 340 35Q340 19 333 5Q328 0 317 0Q314 0 280 1T180 2Q118 2 85 2T49 1Q31 1 31 11Q31 13 34 25Q38 41 42 43T65 46Q92 46 125 49Q139 52 144 61Q147 65 216 339T285 628Z"></path></g></g></g></svg></mjx-container> 值選擇。</li>
</ul>
</li>
<li data-marpit-fragment="3"><strong>K-Means 限制</strong>：
<ul>
<li>必須預先指定分群數。</li>
<li>假設資料呈現球狀圓形分佈。新月形或非均質密度資料分群建議採用 <strong>DBSCAN</strong>。</li>
</ul>
</li>
</ul>

<h2 id="ccq-4---%E7%AD%94%E6%A1%88%E8%88%87%E8%A7%A3%E6%9E%90">CCQ 4 - 答案與解析</h2>
<div class="ccq-columns">
  <div class="ccq-text">
<h3 id="%E6%AD%A3%E7%A2%BA%E7%AD%94%E6%A1%88b-%E8%BD%89%E6%8A%98%E9%BB%9E%E4%BB%A3%E8%A1%A8%E5%9C%A8%E6%AD%A4%E7%BE%A4%E6%95%B8%E4%B9%8B%E5%BE%8C%E5%A2%9E%E5%8A%A0%E7%BE%A4%E6%95%B8%E6%89%80%E8%83%BD%E9%99%8D%E4%BD%8E%E7%9A%84%E7%BE%A4%E5%85%A7%E8%AA%A4%E5%B7%AE%E5%92%8C%E5%B9%85%E5%BA%A6%E6%98%8E%E9%A1%AF%E8%AE%8A%E5%B0%8F"><strong>正確答案：B. 轉折點代表在此群數之後，增加群數所能降低的群內誤差和幅度明顯變小</strong></h3>
<ul>
<li data-marpit-fragment="1">
<p><strong>解析</strong>：</p>
<ul>
<li>在肘部彎曲之前，增加 <mjx-container class="MathJax" jax="SVG"><svg style="vertical-align: 0;" xmlns="http://www.w3.org/2000/svg" width="2.011ex" height="1.545ex" role="img" focusable="false" viewBox="0 -683 889 683"><g stroke="currentColor" fill="currentColor" stroke-width="0" transform="scale(1,-1)"><g data-mml-node="math"><g data-mml-node="mi"><path data-c="1D43E" d="M285 628Q285 635 228 637Q205 637 198 638T191 647Q191 649 193 661Q199 681 203 682Q205 683 214 683H219Q260 681 355 681Q389 681 418 681T463 682T483 682Q500 682 500 674Q500 669 497 660Q496 658 496 654T495 648T493 644T490 641T486 639T479 638T470 637T456 637Q416 636 405 634T387 623L306 305Q307 305 490 449T678 597Q692 611 692 620Q692 635 667 637Q651 637 651 648Q651 650 654 662T659 677Q662 682 676 682Q680 682 711 681T791 680Q814 680 839 681T869 682Q889 682 889 672Q889 650 881 642Q878 637 862 637Q787 632 726 586Q710 576 656 534T556 455L509 418L518 396Q527 374 546 329T581 244Q656 67 661 61Q663 59 666 57Q680 47 717 46H738Q744 38 744 37T741 19Q737 6 731 0H720Q680 3 625 3Q503 3 488 0H478Q472 6 472 9T474 27Q478 40 480 43T491 46H494Q544 46 544 71Q544 75 517 141T485 216L427 354L359 301L291 248L268 155Q245 63 245 58Q245 51 253 49T303 46H334Q340 37 340 35Q340 19 333 5Q328 0 317 0Q314 0 280 1T180 2Q118 2 85 2T49 1Q31 1 31 11Q31 13 34 25Q38 41 42 43T65 46Q92 46 125 49Q139 52 144 61Q147 65 216 339T285 628Z"></path></g></g></g></svg></mjx-container> 值能大幅縮小 Inertia ；彎折點之後，誤差縮減速度明顯放緩，此處為邊際效應最佳折衷點，故選 B。</li>

<h1 id="95-%E9%97%9C%E9%8D%B5%E8%A7%80%E5%BF%B5%E8%88%87%E7%89%B9%E5%BE%B5%E5%B7%A5%E7%A8%8B-feature-engineering">9.5 關鍵觀念與特徵工程 (Feature Engineering)</h1>
<ul>
<li data-marpit-fragment="1"><strong>特徵縮放 (Feature Scaling)</strong>：
<ul>
<li><strong>StandardScaler</strong> (Z-Score)：縮放為平均 0、標準差 1。適用於距離型算法 (KNN, SVM) 與梯度下降法。</li>
<li><strong>MinMaxScaler</strong>：壓縮至 0 ~ 1。</li>
</ul>
</li>
<li data-marpit-fragment="2"><strong>獨熱編碼 (One-Hot Encoding)</strong>：
<ul>
<li>用於將無順序關係的類別特徵轉換為二進位獨立向量。</li>
<li>防止模型假設類別特徵具有大小數值大小偏見。</li>
</ul>
</li>
</ul>

<h2 id="concept-check-question-ccq-5">Concept Check Question (CCQ 5)</h2>
<div class="ccq-columns">
  <div class="ccq-text">
<p><strong>在處理無序「類別特徵（如科系、班級）」時，為什麼通常建議使用 One-Hot Encoding 而非直接數字對照（如電機=1, 機械=2）？</strong></p>
<ul>
<li data-marpit-fragment="1">
<p><strong>A.</strong> 因為 Scikit-Learn 的模型只支援 0 或 1 的輸入</p>
</li>
<li data-marpit-fragment="2">
<p><strong>B.</strong> 避免模型錯誤地假設這些類別特徵之間存在數值順序或倍數關係</p>
</li>
<li data-marpit-fragment="3">
<p><strong>C.</strong> One-Hot Encoding 可以自動刪除重複的特徵</p>
</li>
<li data-marpit-fragment="4">
<p><strong>D.</strong> 整數對照編碼會佔用十倍以上的記憶體</p>
</div>
