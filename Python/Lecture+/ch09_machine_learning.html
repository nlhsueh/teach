    :root {
      --primary: #0284c7;
      --primary-dark: #0369a1;
      --primary-light: #e0f2fe;
      --accent: #f59e0b;
      --surface: #ffffff;
      --background: #f8fafc;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --border: #e2e8f0;
      --radius: 12px;
      --shadow-sm: 0 1px 3px rgba(0, 0, 0, 0.05);
      --shadow-md: 0 4px 10px -1px rgba(2, 132, 199, 0.08);
    }

    body.dark-mode {
      --primary: #38bdf8;
      --primary-dark: #0284c7;
      --primary-light: #082f49;
      --accent: #fbbf24;
      --surface: #1e293b;
      --background: #0f172a;
      --text-main: #f1f5f9;
      --text-muted: #94a3b8;
      --border: #334155;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Plus Jakarta Sans', 'Noto Sans TC', system-ui, -apple-system, sans-serif;
      background-color: var(--background);
      color: var(--text-main);
      line-height: 1.75;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      transition: background-color 0.2s ease, color 0.2s ease;
    }

    #progressBar {
      position: fixed;
      top: 0;
      left: 0;
      height: 3px;
      background: linear-gradient(90deg, #0284c7 0%, #f59e0b 100%);
      width: 0%;
      z-index: 9999;
      transition: width 0.1s ease-out;
    }

    .top-navbar {
      position: sticky;
      top: 0;
      z-index: 1000;
      background: rgba(255, 255, 255, 0.94);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      padding: 10px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      box-shadow: var(--shadow-sm);
    }

    body.dark-mode .top-navbar {
      background: rgba(30, 41, 59, 0.92);
    }

    .nav-left {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .btn-back {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: var(--text-main);
      text-decoration: none;
      font-size: 13.5px;
      font-weight: 700;
      padding: 6px 12px;
      border-radius: 8px;
      background: #f1f5f9;
      transition: all 0.15s ease;
      white-space: nowrap;
    }

    body.dark-mode .btn-back { background: #334155; }
    .btn-back:hover { background: var(--primary-light); color: var(--primary-dark); }

    .chapter-select {
      padding: 6px 12px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text-main);
      font-family: inherit;
      font-size: 13.5px;
      font-weight: 600;
      outline: none;
      cursor: pointer;
      max-width: 280px;
    }

    .nav-right {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .btn-nav-action {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text-muted);
      padding: 6px 12px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      text-decoration: none;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .btn-nav-action:hover {
      color: var(--primary);
      border-color: #93c5fd;
      background: var(--primary-light);
    }

    .layout-container {
      max-width: 1380px;
      width: 100%;
      margin: 0 auto;
      padding: 32px 24px 80px 24px;
      display: flex;
      gap: 36px;
      align-items: flex-start;
      flex: 1;

    .document-body {
      flex: 1;
      min-width: 0;
      background: var(--surface);
      border-radius: var(--radius);
      border: 1px solid var(--border);
      padding: 44px 52px;
      box-shadow: var(--shadow-sm);

    @media (max-width: 768px) {

    }

    .toc-sidebar {
      width: 290px;
      flex-shrink: 0;
      position: sticky;
      top: 75px;
      max-height: calc(100vh - 100px);
      overflow-y: auto;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 20px;
      box-shadow: var(--shadow-sm);
    }

    @media (max-width: 1060px) {
      .toc-sidebar { display: none; }
    }

    .toc-title {
      font-size: 13px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--text-muted);
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .toc-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .toc-item a {
      color: var(--text-muted);
      text-decoration: none;
      display: block;
      padding: 4px 8px;
      border-radius: 6px;
      transition: all 0.15s ease;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      font-size: 13px;
    }

    .toc-item a:hover {
      color: var(--primary);
      background-color: var(--primary-light);
    }

    .toc-item.active a {
      color: var(--primary);
      font-weight: 700;
      background-color: var(--primary-light);
      border-left: 3px solid var(--primary);

    .toc-level-3 { padding-left: 12px; font-size: 12.5px; }
    .toc-level-4 { padding-left: 20px; font-size: 12px; }

    #contentArea h1 {

      overflow: hidden;
      background: #f8fafc;

    .code-header {

      font-size: 12px;

      padding: 3px 8px;
      font-size: 11.5px;
      cursor: pointer;
      font-weight: 600;

    #contentArea pre {

      font-size: 13.5px;
      line-height: 1.55;

      padding: 2px 6px;
      border-radius: 4px;

    body.dark-mode #contentArea code:not(pre code) {

      color: #38bdf8;
      border-color: #475569;
    }

    .bottom-nav {

    .btn-step:hover {

    const binStr = atob(b64Data);
    const bytes = new Uint8Array(binStr.length);
    for (let i = 0; i < binStr.length; i++) {
      bytes[i] = binStr.charCodeAt(i);
    }
    const rawMarkdown = new TextDecoder('utf-8').decode(bytes);

    // Render immediately
    marked.setOptions({
      highlight: function(code, lang) {
        if (lang && hljs.getLanguage(lang)) {
          return hljs.highlight(code, { language: lang }).value;
        }
        return hljs.highlightAuto(code).value;
      },
      breaks: true,
      gfm: true
    });

    const contentArea = document.getElementById('contentArea');
    contentArea.innerHTML = marked.parse(rawMarkdown);

    // Build Table of Contents
    const tocList = document.getElementById('tocList');
    const headings = contentArea.querySelectorAll('h2, h3, h4');
    if (headings.length === 0) {
      document.getElementById('tocSidebar').style.display = 'none';
    } else {
      headings.forEach((heading, index) => {
        let id = heading.id;
        if (!id) {
          id = 'heading-' + index + '-' + heading.textContent.toLowerCase().replace(/[^a-z0-9\u4e00-\u9fa5]+/g, '-');
          heading.id = id;
        }

        const li = document.createElement('li');
        li.className = 'toc-item toc-level-' + heading.tagName.toLowerCase().charAt(1);
        li.dataset.targetId = id;

        const a = document.createElement('a');
        a.href = '#' + id;
        a.textContent = heading.textContent.trim();
        a.addEventListener('click', (e) => {
          e.preventDefault();
          document.getElementById(id).scrollIntoView({ behavior: 'smooth' });
          history.pushState(null, null, '#' + id);
        });

        li.appendChild(a);
        tocList.appendChild(li);
      });

      const observer = new IntersectionObserver((entries) => {
        entries.forEach(entry => {
          if (entry.isIntersecting) {
            const id = entry.target.id;
            tocList.querySelectorAll('.toc-item').forEach(item => {
              item.classList.toggle('active', item.dataset.targetId === id);
            });
          }
        });
      }, { rootMargin: '-80px 0px -75% 0px' });

      headings.forEach(h => observer.observe(h));
    }

    // Enhance Code Blocks with Copy Buttons
    document.querySelectorAll('#contentArea pre').forEach(pre => {
      const code = pre.querySelector('code');
      if (!code) return;

      let lang = 'CODE';
      const classes = code.className.split(' ');
      for (let c of classes) {
        if (c.startsWith('language-')) {
          lang = c.replace('language-', '').toUpperCase();
          break;
        }
      }

      const wrapper = document.createElement('div');
      wrapper.className = 'code-wrapper';

      const header = document.createElement('div');
      header.className = 'code-header';
      header.innerHTML = '<span>' + lang + '</span>';

      const copyBtn = document.createElement('button');
      copyBtn.className = 'btn-copy';
      copyBtn.textContent = '📋 複製程式碼';
      copyBtn.addEventListener('click', () => {
        navigator.clipboard.writeText(code.innerText).then(() => {
          copyBtn.textContent = '✅ 已複製！';
          setTimeout(() => { copyBtn.textContent = '📋 複製程式碼'; }, 2000);
        });
      });

      header.appendChild(copyBtn);
      pre.parentNode.insertBefore(wrapper, pre);
      wrapper.appendChild(header);
      wrapper.appendChild(pre);
    });

    // Mermaid & KaTeX
    mermaid.initialize({ startOnLoad: false, theme: document.body.classList.contains('dark-mode') ? 'dark' : 'default' });
    document.querySelectorAll('#contentArea .language-mermaid').forEach(async (el) => {
      const graphDefinition = el.innerText;
      const container = document.createElement('div');
      container.className = 'mermaid';
      container.innerHTML = graphDefinition;
      el.parentNode.replaceChild(container, el);
    });
    mermaid.run();

    if (window.renderMathInElement) {
      renderMathInElement(contentArea, {
        delimiters: [
          { left: '$$', right: '$$', display: true },
          { left: '$', right: '$', display: false }
        ],
        throwOnError: false
      });
    }

    // Scroll Progress Bar
    window.addEventListener('scroll', () => {
      const scrollTop = window.scrollY || document.documentElement.scrollTop;
      const docHeight = document.documentElement.scrollHeight - document.documentElement.clientHeight;
      const progress = docHeight > 0 ? (scrollTop / docHeight) * 100 : 0;
      document.getElementById('progressBar').style.width = progress + '%';
    });

    // Dark Mode Toggle
    function toggleDarkMode() {
      document.body.classList.toggle('dark-mode');
      const isDark = document.body.classList.contains('dark-mode');
      document.getElementById('darkIcon').textContent = isDark ? '☀️' : '🌙';
      localStorage.setItem('teach_python_dark', isDark ? 'true' : 'false');
    }

    if (localStorage.getItem('teach_python_dark') === 'true') {
      document.body.classList.add('dark-mode');
      document.getElementById('darkIcon').textContent = '☀️';
    }
  </script>
