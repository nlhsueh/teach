<header>課堂遊戲：尼爾森原則闖關挑戰</header>
<h3 id="%F0%9F%8E%AE-%E9%97%96%E9%97%9C%E7%AC%AC-01-%E9%97%9C%E5%A4%A7%E6%AA%94%E6%A1%88%E4%B8%8A%E5%82%B3%E8%88%87%E5%8D%B3%E6%99%82%E5%9B%9E%E9%A5%8B"><img class="emoji" draggable="false" alt="🎮" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f3ae.svg" data-marp-twemoji=""/> 闖關第 01 關：【大檔案上傳與即時回饋】</h3>
<div class="card">
<p><strong>情境描述</strong> ：<br />
使用者在雲端硬碟上傳 1GB 的影片檔，系統在右下角以浮動視窗顯示圓形百分比進度、已上傳容量（如 450MB / 1GB）、即時傳輸速度與預估剩餘時間。</p>
<p><strong>請問這項設計最直接落實了哪一項易用性原則？</strong></p>
<ul>
<li><strong>(A)</strong> NS01 清楚的系統狀態能見度 (Visibility of System Status)</li>
<li><strong>(B)</strong> NS03 使用者控制與自由 (User Control and Freedom)</li>
<li><strong>(C)</strong> NS07 彈性與使用效率 (Flexibility and Efficiency of Use)</li>
<li><strong>(D)</strong> NS08 優雅簡潔的設計 (Aesthetic and Minimalist Design)</li>
</ul>
</div>
<footer>薛念林 教授 | 逢甲大學資訊工程學系</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="70" data-paginate="true" data-footer="薛念林 教授 | 逢甲大學資訊工程學系" data-header="課堂遊戲：尼爾森原則闖關挑戰" data-theme="ux-theme" lang="C" data-marpit-pagination="70" style="--paginate:true;--footer:薛念林 教授 | 逢甲大學資訊工程學系;--header:課堂遊戲：尼爾森原則闖關挑戰;--theme:ux-theme;" data-marpit-pagination-total="99" data-transition-back="{&quot;name&quot;:&quot;fade&quot;,&quot;builtinFallback&quot;:true}" data-transition="{&quot;name&quot;:&quot;fade&quot;,&quot;builtinFallback&quot;:true}" data-size="16:9">
<header>課堂遊戲：尼爾森原則闖關挑戰</header>
<h3 id="%F0%9F%8E%AE-%E9%97%96%E9%97%9C%E7%AC%AC-02-%E9%97%9C%E5%AF%A6%E9%AB%94%E9%96%B1%E8%AE%80%E9%9A%B1%E5%96%BB%E8%88%87%E6%9B%B8%E6%9E%B6%E8%A8%AD%E8%A8%88"><img class="emoji" draggable="false" alt="🎮" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f3ae.svg" data-marp-twemoji=""/> 闖關第 02 關：【實體閱讀隱喻與書架設計】</h3>
<div class="card">
<p><strong>情境描述</strong> ：<br />
電子書閱讀 App 在使用者翻頁時提供紙張翻摺陰影與沙沙紙張翻頁聲，並使用「書籤」、「螢光筆劃記」與「書架」來組織收藏，介面詞彙亦使用讀者熟悉的「章節」、「目錄」而非底層工程術語。</p>
<p><strong>請問這項設計最直接體現了哪一項易用性原則？</strong></p>
<ul>
<li><strong>(A)</strong> NS01 清楚的系統狀態能見度 (Visibility of System Status)</li>
<li><strong>(B)</strong> NS02 與真實世界對應 (Match Between System and Real World)</li>
<li><strong>(C)</strong> NS04 一致性與標準 (Consistency and Standards)</li>
<li><strong>(D)</strong> NS06 易於識別而非記憶 (Recognition Rather Than Recall)</li>
</ul>
</div>
<footer>薛念林 教授 | 逢甲大學資訊工程學系</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="71" data-paginate="true" data-footer="薛念林 教授 | 逢甲大學資訊工程學系" data-header="課堂遊戲：尼爾森原則闖關挑戰" data-theme="ux-theme" lang="C" data-marpit-pagination="71" style="--paginate:true;--footer:薛念林 教授 | 逢甲大學資訊工程學系;--header:課堂遊戲：尼爾森原則闖關挑戰;--theme:ux-theme;" data-marpit-pagination-total="99" data-transition-back="{&quot;name&quot;:&quot;fade&quot;,&quot;builtinFallback&quot;:true}" data-transition="{&quot;name&quot;:&quot;fade&quot;,&quot;builtinFallback&quot;:true}" data-size="16:9">
<header>課堂遊戲：尼爾森原則闖關挑戰</header>
<h3 id="%F0%9F%8E%AE-%E9%97%96%E9%97%9C%E7%AC%AC-03-%E9%97%9C%E6%89%B9%E6%AC%A1%E6%93%8D%E4%BD%9C%E7%9A%84%E7%B7%8A%E6%80%A5%E5%87%BA%E5%8F%A3"><img class="emoji" draggable="false" alt="🎮" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f3ae.svg" data-marp-twemoji=""/> 闖關第 03 關：【批次操作的緊急出口】</h3>
<div class="card">
<p><strong>情境描述</strong> ：<br />
使用者在照片管理工具中勾選了 50 張照片並點擊「全數封存」，畫面底部立即彈出 SnackBar 提示：「已封存 50 張照片」，並在旁邊提供明顯的「復原 (Undo)」按鈕，且提供 10 秒的反悔猶豫期。</p>
<p><strong>請問這項設計最直接符合哪一項易用性原則？</strong></p>
<ul>
<li><strong>(A)</strong> NS02 與真實世界對應 (Match Between System and Real World)</li>
<li><strong>(B)</strong> NS03 使用者控制與自由 (User Control and Freedom)</li>
<li><strong>(C)</strong> NS05 錯誤預防 (Error Prevention)</li>
<li><strong>(D)</strong> NS08 優雅簡潔的設計 (Aesthetic and Minimalist Design)</li>
</ul>
</div>
<footer>薛念林 教授 | 逢甲大學資訊工程學系</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="72" data-paginate="true" data-footer="薛念林 教授 | 逢甲大學資訊工程學系" data-header="課堂遊戲：尼爾森原則闖關挑戰" data-theme="ux-theme" lang="C" data-marpit-pagination="72" style="--paginate:true;--footer:薛念林 教授 | 逢甲大學資訊工程學系;--header:課堂遊戲：尼爾森原則闖關挑戰;--theme:ux-theme;" data-marpit-pagination-total="99" data-transition-back="{&quot;name&quot;:&quot;fade&quot;,&quot;builtinFallback&quot;:true}" data-transition="{&quot;name&quot;:&quot;fade&quot;,&quot;builtinFallback&quot;:true}" data-size="16:9">
<header>課堂遊戲：尼爾森原則闖關挑戰</header>
<h3 id="%F0%9F%8E%AE-%E9%97%96%E9%97%9C%E7%AC%AC-04-%E9%97%9C%E5%85%A8%E7%AB%99%E6%8C%89%E9%88%95%E8%A6%8F%E7%AF%84%E8%88%87%E5%B9%B3%E5%8F%B0%E6%A8%99%E6%BA%96"><img class="emoji" draggable="false" alt="🎮" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f3ae.svg" data-marp-twemoji=""/> 闖關第 04 關：【全站按鈕規範與平台標準】</h3>
<div class="card">
<p><strong>情境描述</strong> ：<br />
某跨平台購物系統在 iOS App 遵循蘋果 HIG 規範將導覽標籤放在底部，在 Web 則遵循常見的頂部 Header 導航；全站無論在哪個頁面，「加入購物車」一律是深橘色按鈕、「立即結帳」一律是綠色按鈕，危險操作一律是紅色文字。</p>
<p><strong>請問這項設計最直接符合哪一項易用性原則？</strong></p>
<ul>
<li><strong>(A)</strong> NS03 使用者控制與自由 (User Control and Freedom)</li>
<li><strong>(B)</strong> NS04 一致性與標準 (Consistency and Standards)</li>
<li><strong>(C)</strong> NS06 易於識別而非記憶 (Recognition Rather Than Recall)</li>
<li><strong>(D)</strong> NS07 彈性與使用效率 (Flexibility and Efficiency of Use)</li>
</ul>
</div>
<footer>薛念林 教授 | 逢甲大學資訊工程學系</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="73" data-paginate="true" data-footer="薛念林 教授 | 逢甲大學資訊工程學系" data-header="課堂遊戲：尼爾森原則闖關挑戰" data-theme="ux-theme" lang="C" data-marpit-pagination="73" style="--paginate:true;--footer:薛念林 教授 | 逢甲大學資訊工程學系;--header:課堂遊戲：尼爾森原則闖關挑戰;--theme:ux-theme;" data-marpit-pagination-total="99" data-transition-back="{&quot;name&quot;:&quot;fade&quot;,&quot;builtinFallback&quot;:true}" data-transition="{&quot;name&quot;:&quot;fade&quot;,&quot;builtinFallback&quot;:true}" data-size="16:9">
<header>課堂遊戲：尼爾森原則闖關挑戰</header>
<h3 id="%F0%9F%8E%AE-%E9%97%96%E9%97%9C%E7%AC%AC-05-%E9%97%9C%E6%96%B0%E6%89%8B%E8%A6%96%E8%A6%BA%E6%8C%89%E9%88%95%E8%88%87%E5%B0%88%E5%AE%B6%E5%BF%AB%E6%8D%B7%E9%8D%B5"><img class="emoji" draggable="false" alt="🎮" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f3ae.svg" data-marp-twemoji=""/> 闖關第 05 關：【新手視覺按鈕與專家快捷鍵】</h3>
<div class="card">
<p><strong>情境描述</strong> ：<br />
現代程式碼編輯器（如 VS Code）為新手提供視覺化的功能選單與側邊欄按鈕，同時為資深工程師提供強大的快捷鍵（如 <code>Cmd + P</code> 快速開檔、<code>Cmd + Shift + L</code> 多游標編輯），並允許自訂程式碼片段 (Snippets) 與巨集。</p>
<p><strong>請問這項設計最直接符合哪一項易用性原則？</strong></p>
<ul>
<li><strong>(A)</strong> NS03 使用者控制與自由 (User Control and Freedom)</li>
<li><strong>(B)</strong> NS05 錯誤預防 (Error Prevention)</li>
<li><strong>(C)</strong> NS07 彈性與使用效率 (Flexibility and Efficiency of Use)</li>
<li><strong>(D)</strong> NS09 清楚的錯誤處理 (Help Users Recognize, Diagnose, and Recover from Errors)</li>
</ul>
</div>
<footer>薛念林 教授 | 逢甲大學資訊工程學系</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="74" data-paginate="true" data-footer="薛念林 教授 | 逢甲大學資訊工程學系" data-header="課堂遊戲：尼爾森原則闖關挑戰" data-theme="ux-theme" lang="C" data-marpit-pagination="74" style="--paginate:true;--footer:薛念林 教授 | 逢甲大學資訊工程學系;--header:課堂遊戲：尼爾森原則闖關挑戰;--theme:ux-theme;" data-marpit-pagination-total="99" data-transition-back="{&quot;name&quot;:&quot;fade&quot;,&quot;builtinFallback&quot;:true}" data-transition="{&quot;name&quot;:&quot;fade&quot;,&quot;builtinFallback&quot;:true}" data-size="16:9">
<header>課堂遊戲：尼爾森原則闖關挑戰</header>
<h3 id="%F0%9F%8E%AE-%E9%97%96%E9%97%9C%E7%AC%AC-06-%E9%97%9Cai-ux-%E6%A6%82%E5%BF%B51-10-100-%E5%93%81%E8%B3%AA%E6%88%90%E6%9C%AC%E6%B3%95%E5%89%87"><img class="emoji" draggable="false" alt="🎮" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f3ae.svg" data-marp-twemoji=""/> 闖關第 06 關：【AI-UX 概念：1-10-100 品質成本法則】</h3>
<div class="card">
<p><strong>情境描述</strong> ：<br />
開發團隊在專案初期運用 AI 生成前端原型時，即在提示詞中明確定義防呆約束與錯誤復原指引，及早發現並修復體驗瑕疵。相較於系統上線後因使用者客訴才動員十倍人力進行重構修復，這種在前端即落實 UX 的做法最直接體現了哪一項核心定律？</p>
<p><strong>請問下列哪一項是正確的軟體工程與品質法則？</strong></p>
<ul>
<li><strong>(A)</strong> 摩爾定律 (Moore's Law)</li>
<li><strong>(B)</strong> 1-10-100 品質成本法則 (Cost of Quality Rule)</li>
<li><strong>(C)</strong> 阿姆達爾定律 (Amdahl's Law)</li>
<li><strong>(D)</strong> 康威定律 (Conway's Law)</li>
</ul>
</div>
<footer>薛念林 教授 | 逢甲大學資訊工程學系</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="75" data-paginate="true" data-footer="薛念林 教授 | 逢甲大學資訊工程學系" data-header="課堂遊戲：尼爾森原則闖關挑戰" data-theme="ux-theme" lang="C" data-marpit-pagination="75" style="--paginate:true;--footer:薛念林 教授 | 逢甲大學資訊工程學系;--header:課堂遊戲：尼爾森原則闖關挑戰;--theme:ux-theme;" data-marpit-pagination-total="99" data-transition-back="{&quot;name&quot;:&quot;fade&quot;,&quot;builtinFallback&quot;:true}" data-transition="{&quot;name&quot;:&quot;fade&quot;,&quot;builtinFallback&quot;:true}" data-size="16:9">
<header>課堂遊戲：尼爾森原則闖關挑戰</header>
<h3 id="%F0%9F%8E%AE-%E9%97%96%E9%97%9C%E7%AC%AC-07-%E9%97%9Cai-ux-%E6%8F%90%E7%A4%BA%E5%B7%A5%E7%A8%8Brtcf-%E6%A1%86%E6%9E%B6%E4%B8%AD%E7%9A%84-ux-%E7%B4%84%E6%9D%9F"><img class="emoji" draggable="false" alt="🎮" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f3ae.svg" data-marp-twemoji=""/> 闖關第 07 關：【AI-UX 提示工程：RTCF 框架中的 UX 約束】</h3>
<div class="card">
<p><strong>情境描述</strong> ：<br />
工程師撰寫提示詞：「你是一位 UI 設計師（Role），請設計電商購物車結帳頁（Task）。 <strong>【約束：載入時必須顯示骨架屏 (Skeleton Screen) 消除等待焦慮，且 API 斷線時必須以白話說明並提供重試按鈕，嚴禁僅拋出無說明的狀態碼】</strong> （Constraints），請以 React 輸出（Format）。」</p>
<p><strong>請問提示詞中針對 Constraints 的具體要求，最主要是為了確保 AI 生成的介面滿足哪兩項尼爾森原則？</strong></p>
<ul>
<li><strong>(A)</strong> NS02 (與真實世界對應) 與 NS04 (一致性與標準)</li>
<li><strong>(B)</strong> NS01 (系統狀態能見度) 與 NS09 (清楚的錯誤處理)</li>
<li><strong>(C)</strong> NS06 (易於識別而非記憶) 與 NS08 (優雅簡潔的設計)</li>
<li><strong>(D)</strong> NS03 (使用者控制權) 與 NS07 (彈性與使用效率)</li>
</ul>
</div>
<footer>薛念林 教授 | 逢甲大學資訊工程學系</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="76" data-paginate="true" data-footer="薛念林 教授 | 逢甲大學資訊工程學系" data-header="課堂遊戲：尼爾森原則闖關挑戰" data-theme="ux-theme" lang="C" data-marpit-pagination="76" style="--paginate:true;--footer:薛念林 教授 | 逢甲大學資訊工程學系;--header:課堂遊戲：尼爾森原則闖關挑戰;--theme:ux-theme;" data-marpit-pagination-total="99" data-transition-back="{&quot;name&quot;:&quot;fade&quot;,&quot;builtinFallback&quot;:true}" data-transition="{&quot;name&quot;:&quot;fade&quot;,&quot;builtinFallback&quot;:true}" data-size="16:9">
<header>課堂遊戲：尼爾森原則闖關挑戰</header>
<h3 id="%F0%9F%8E%AF-%E9%97%96%E9%97%9C%E6%8C%91%E6%88%B0-7-%E9%A1%8C%E5%AE%8C%E6%95%B4%E8%A7%A3%E7%AD%94%E8%88%87%E6%A0%B8%E5%BF%83%E8%A7%A3%E6%9E%90"><img class="emoji" draggable="false" alt="🎯" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f3af.svg" data-marp-twemoji=""/> 闖關挑戰 7 題完整解答與核心解析</h3>
<div class="two-columns">
<div class="card" style="font-size: 18px;" data-marpit-fragment>
<ul>
<li><strong>第 01 題 (A)</strong> ： <strong>NS01 狀態能見度</strong> —— 百分比與進度條即時回饋，消除等待焦慮。</li>
<li><strong>第 02 題 (B)</strong> ： <strong>NS02 與真實世界對應</strong> —— 書架、書籤與紙張翻頁隱喻。</li>
<li><strong>第 03 題 (B)</strong> ： <strong>NS03 使用者控制與自由</strong> —— SnackBar Undo 10 秒反悔復原機制。</li>
<li><strong>第 04 題 (B)</strong> ： <strong>NS04 一致性與標準</strong> —— 遵循 iOS HIG/Web 平台規範與統一色彩意圖。</li>
</ul>
</div>
<div class="card" style="font-size: 18px;" data-marpit-fragment>
<ul>
<li><strong>第 05 題 (C)</strong> ： <strong>NS07 彈性與使用效率</strong> —— 鍵盤加速鍵兼顧初學者與資深專家操作速度。</li>
<li><strong>第 06 題 (B)</strong> ： <strong>1-10-100 品質成本法則</strong> —— 早期以 UX 約束生成原型，修復成本遠低於上線後客訴返工。</li>
<li><strong>第 07 題 (B)</strong> ： <strong>RTCF 之 UX 約束落地</strong> —— 將 NS01 (狀態) 與 NS09 (錯誤指引) 注入提示詞直接規範 AI 原型。</li>
</ul>
</div>
</div>
<footer>薛念林 教授 | 逢甲大學資訊工程學系</footer>
</section>

</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="78" data-paginate="true" data-footer="薛念林 教授 | 逢甲大學資訊工程學系" data-header="從 Prompting 到 Agent 典範轉移" data-theme="ux-theme" lang="C" data-marpit-pagination="78" style="--paginate:true;--footer:薛念林 教授 | 逢甲大學資訊工程學系;--header:從 Prompting 到 Agent 典範轉移;--theme:ux-theme;" data-marpit-pagination-total="99" data-transition-back="{&quot;name&quot;:&quot;fade&quot;,&quot;builtinFallback&quot;:true}" data-transition="{&quot;name&quot;:&quot;fade&quot;,&quot;builtinFallback&quot;:true}" data-size="16:9">
<header>從 Prompting 到 Agent 典範轉移</header>
<h2 id="%E5%BE%9E-prompting-%E5%88%B0-agentai-%E9%AB%94%E9%A9%97%E8%A8%AD%E8%A8%88%E7%9A%84%E5%85%B8%E7%AF%84%E8%BD%89%E7%A7%BB">從 Prompting 到 Agent：AI 體驗設計的典範轉移</h2>
<div class="two-columns">
<div class="card" data-marpit-fragment>
<h3 id="%F0%9F%92%AC-%E5%82%B3%E7%B5%B1-prompting-%E7%9A%84%E5%B1%80%E9%99%90-chat-based"><img class="emoji" draggable="false" alt="💬" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4ac.svg" data-marp-twemoji=""/> 傳統 Prompting 的局限 (Chat-based)</h3>
<ul>
<li><strong>上下文孤島</strong> ：對話框無法感知整個專案的檔案架構與既有組件庫。</li>
<li><strong>手動拼裝負擔</strong> ：產出的片段程式碼需工程師手動複製貼上、修復依賴與樣式衝突。</li>
<li><strong>無法自主閉環</strong> ：無法自動運行專案、無法看見渲染成果、無法自主除錯。</li>
</ul>
</div>
<div class="card" data-marpit-fragment>
<h3 id="%F0%9F%A4%96-agentic-ux-workflow-%E4%BB%A3%E7%90%86%E4%BA%BA%E5%B7%A5%E4%BD%9C%E6%B5%81"><img class="emoji" draggable="false" alt="🤖" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f916.svg" data-marp-twemoji=""/> Agentic UX Workflow (代理人工作流)</h3>
<ul>
<li><strong>具備全專案視野</strong> ：能自主檢索目錄、閱讀系統設計與相關文件。</li>
<li><strong>主動規劃與推演</strong> ：不直接盲目寫程式碼，而是先擬定結構化實施計畫 (Plan)。</li>
<li><strong>多檔案自主重構</strong> ：自動修改關聯組件、加入狀態機、執行終端機驗證。</li>
<li><strong>感知式工具調用</strong> ：能啟動本機伺服器、透過瀏覽器自主走查使用者操作路徑。</li>
</ul>
</div>
</div>
<footer>薛念林 教授 | 逢甲大學資訊工程學系</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="79" data-paginate="true" data-footer="薛念林 教授 | 逢甲大學資訊工程學系" data-header="從 Prompting 到 Agent 典範轉移" data-theme="ux-theme" lang="C" data-marpit-pagination="79" style="--paginate:true;--footer:薛念林 教授 | 逢甲大學資訊工程學系;--header:從 Prompting 到 Agent 典範轉移;--theme:ux-theme;" data-marpit-pagination-total="99" data-transition-back="{&quot;name&quot;:&quot;fade&quot;,&quot;builtinFallback&quot;:true}" data-transition="{&quot;name&quot;:&quot;fade&quot;,&quot;builtinFallback&quot;:true}" data-size="16:9">
<header>從 Prompting 到 Agent 典範轉移</header>
<h3 id="%E4%BB%A5-antigravity-ide-%E7%82%BA%E4%BE%8B%E7%8F%BE%E4%BB%A3-agentic-ux-%E5%AF%A6%E8%B8%90%E7%92%B0%E5%A2%83">以 Antigravity IDE 為例：現代 Agentic UX 實踐環境</h3>
<blockquote>
<p><strong>Google Antigravity IDE</strong> 提供專為工程師與設計師打造的深度 Agentic 協同環境：</p>
</blockquote>
<div class="three-columns">
<div class="card" data-marpit-fragment>
<h3 id="%F0%9F%93%8B-%E8%A6%8F%E5%8A%83%E5%84%AA%E5%85%88-planning-mode"><img class="emoji" draggable="false" alt="📋" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4cb.svg" data-marp-twemoji=""/> 規劃優先 (Planning Mode)</h3>
<ul>
<li>遇到複雜 UX 需求時，主動進入 Planning Mode。</li>
<li>自動生成詳細的 <code>implementation_plan.md</code> ，將使用者旅程、狀態圖與驗證方案列出供審查。</li>
</ul>
</div>
<div class="card" data-marpit-fragment>
<h3 id="%F0%9F%A7%A0-%E5%B0%88%E6%A1%88%E8%A6%8F%E7%AF%84%E6%84%9F%E7%9F%A5-agentsmd"><img class="emoji" draggable="false" alt="🧠" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f9e0.svg" data-marp-twemoji=""/> 專案規範感知 (AGENTS.md)</h3>
<ul>
<li>Agent 自動遵守專案自訂之設計守則（如色彩主題、排版間距、中英混排空白規範）。</li>
<li>確保跨組件、跨頁面的視覺與行為高度一致 (NS04)。</li>
</ul>
</div>
<div class="card" data-marpit-fragment>
<h3 id="%F0%9F%9B%A0%EF%B8%8F-%E5%85%A8%E8%87%AA%E5%8B%95%E9%A9%97%E8%AD%89%E5%B7%A5%E5%85%B7%E9%8F%88"><img class="emoji" draggable="false" alt="🛠️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f6e0.svg" data-marp-twemoji=""/> 全自動驗證工具鏈</h3>
<ul>
<li>整合終端機指令、靜態檢查與瀏覽器子代理 (Browser Subagent)。</li>
<li>能自主啟動畫面預覽、自動點擊走查、即時修正渲染異常。</li>
</ul>
</div>
</div>
<footer>薛念林 教授 | 逢甲大學資訊工程學系</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="80" data-paginate="true" data-footer="薛念林 教授 | 逢甲大學資訊工程學系" data-header="從 Prompting 到 Agent 典範轉移" data-theme="ux-theme" lang="C" data-marpit-pagination="80" style="--paginate:true;--footer:薛念林 教授 | 逢甲大學資訊工程學系;--header:從 Prompting 到 Agent 典範轉移;--theme:ux-theme;" data-marpit-pagination-total="99" data-transition-back="{&quot;name&quot;:&quot;fade&quot;,&quot;builtinFallback&quot;:true}" data-transition="{&quot;name&quot;:&quot;fade&quot;,&quot;builtinFallback&quot;:true}" data-size="16:9">
<header>從 Prompting 到 Agent 典範轉移</header>
<h3 id="%E5%B0%88%E6%A1%88%E8%A6%8F%E7%AF%84%E8%88%87%E6%8A%80%E8%83%BD%E5%BA%ABagentsmd-vs-agents">專案規範與技能庫：AGENTS.md vs .agents</h3>
<div style="text-align: center; margin-top: 15px;">
<img src="../../img/antigravity_agents_architecture.png" style="max-height: 470px; width: auto; border-radius: 8px; box-shadow: 0 4px 14px rgba(0,0,0,0.06);" />
</div>

</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="81" data-marpit-scope-pBA1kNq2="" data-paginate="true" data-footer="薛念林 教授 | 逢甲大學資訊工程學系" data-header="從 Prompting 到 Agent 典範轉移" data-theme="ux-theme" lang="C" data-marpit-pagination="81" style="--paginate:true;--footer:薛念林 教授 | 逢甲大學資訊工程學系;--header:從 Prompting 到 Agent 典範轉移;--theme:ux-theme;" data-marpit-pagination-total="99" data-transition-back="{&quot;name&quot;:&quot;fade&quot;,&quot;builtinFallback&quot;:true}" data-transition="{&quot;name&quot;:&quot;fade&quot;,&quot;builtinFallback&quot;:true}" data-size="16:9">
<header>從 Prompting 到 Agent 典範轉移</header>
<h3 id="%E5%AF%A6%E6%88%B0%E7%AF%84%E4%BE%8Bagentsmd-%E8%B7%A8%E5%B0%88%E6%A1%88%E9%80%9A%E7%94%A8%E5%AE%88%E5%89%87">實戰範例：AGENTS.md 跨專案通用守則</h3>
<div class="card">
<h3 id="%F0%9F%93%9D-%E5%B0%88%E6%A1%88%E6%A0%B9%E7%9B%AE%E9%8C%84-agentsmd-%E7%AF%84%E6%9C%AC%E6%AF%8F%E6%AC%A1%E5%B0%8D%E8%A9%B1%E5%85%A8%E9%87%8F%E5%B8%B8%E9%A7%90%E6%B3%A8%E5%85%A5"><img class="emoji" draggable="false" alt="📝" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4dd.svg" data-marp-twemoji=""/> 專案根目錄 <code>AGENTS.md</code> 範本（每次對話全量常駐注入）</h3>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-markdown"><span class="hljs-section"># 跨專案通用工程與 UX 準則</span>

<span class="hljs-section">## 1. 協同與溝通原則</span>
<span class="hljs-bullet">-</span> 複雜重構前必須先擬定計畫，確認影響範圍與邊界再動工。
<span class="hljs-bullet">-</span> 使用臺灣繁體中文與標準軟體工程用語（嚴禁用代碼，一律用程式碼）。

<span class="hljs-section">## 2. 核心 UX 與前端設計守則 (NS01, NS05, NS09)</span>
<span class="hljs-bullet">-</span> 非同步操作按鈕必須實作 Loading 與 Disabled 狀態，防重複點擊。
<span class="hljs-bullet">-</span> 破壞性操作（刪除、重置、覆蓋）必須提供二次確認或 Toast 復原機制。
<span class="hljs-bullet">-</span> 遵循 WCAG AA 規範：色彩對比度充足、所有互動元件必須具備鍵盤焦點態。

<span class="hljs-section">## 3. 程式碼品質與安全守則</span>
<span class="hljs-bullet">-</span> 禁止將 API Key、Token 或機敏憑證硬編碼在前端程式碼中。
<span class="hljs-bullet">-</span> 外部請求必須實作錯誤處理並提供明確的狀態碼與錯誤碼反饋。
</code></pre>
</div>
<footer>薛念林 教授 | 逢甲大學資訊工程學系</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="82" data-marpit-scope-QKrSyMp0="" data-paginate="true" data-footer="薛念林 教授 | 逢甲大學資訊工程學系" data-header="從 Prompting 到 Agent 典範轉移" data-theme="ux-theme" lang="C" data-marpit-pagination="82" style="--paginate:true;--footer:薛念林 教授 | 逢甲大學資訊工程學系;--header:從 Prompting 到 Agent 典範轉移;--theme:ux-theme;" data-marpit-pagination-total="99" data-transition-back="{&quot;name&quot;:&quot;fade&quot;,&quot;builtinFallback&quot;:true}" data-transition="{&quot;name&quot;:&quot;fade&quot;,&quot;builtinFallback&quot;:true}" data-size="16:9">
<header>從 Prompting 到 Agent 典範轉移</header>
<h3 id="%E5%AF%A6%E6%88%B0%E7%AF%84%E4%BE%8Bagents-%E6%A8%A1%E7%B5%84%E5%8C%96%E6%8A%80%E8%83%BD-skills-%E5%B0%81%E8%A3%9D">實戰範例：.agents 模組化技能 (Skills) 封裝</h3>
<div class="card">
<h3 id="%F0%9F%9B%A0%EF%B8%8F-%E6%A8%A1%E7%B5%84%E6%AA%94%E6%A1%88-agentsskillsux-auditskillmd-%E7%AF%84%E6%9C%AC%E4%BB%BB%E5%8B%99%E8%A7%B8%E7%99%BC%E5%8B%95%E6%85%8B%E8%BC%89%E5%85%A5"><img class="emoji" draggable="false" alt="🛠️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f6e0.svg" data-marp-twemoji=""/> 模組檔案 <code>.agents/skills/ux-audit/SKILL.md</code> 範本（任務觸發動態載入）</h3>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-markdown">---
name: ux-audit
description: &gt;-
<span class="hljs-section"> 當使用者要求對前端頁面進行無障礙 (a11y) 或 Nielsen 易用性走查時使用此技能。
---</span>

<span class="hljs-section">### UX 易用性自動化走查流程</span>

<span class="hljs-section">## 執行步驟</span>
<span class="hljs-bullet">1.</span> 執行靜態無障礙檢查腳本：<span class="hljs-code">`./scripts/run-axe.sh`</span>
<span class="hljs-bullet">2.</span> 檢查頁面焦點順序、ARIA 標籤與鍵盤導航是否完整。
<span class="hljs-bullet">3.</span> 若檢測到違規項，對照 <span class="hljs-code">`references/wcag.md`</span> 提出具體修復方案。
<span class="hljs-bullet">4.</span> 整理走查結果，於專案目錄自動產出 <span class="hljs-code">`ux_audit_report.md`</span>。
</code></pre>
</div>
<footer>薛念林 教授 | 逢甲大學資訊工程學系</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="83" data-paginate="true" data-footer="薛念林 教授 | 逢甲大學資訊工程學系" data-header="從 Prompting 到 Agent 典範轉移" data-theme="ux-theme" lang="C" data-marpit-pagination="83" style="--paginate:true;--footer:薛念林 教授 | 逢甲大學資訊工程學系;--header:從 Prompting 到 Agent 典範轉移;--theme:ux-theme;" data-marpit-pagination-total="99" data-transition-back="{&quot;name&quot;:&quot;fade&quot;,&quot;builtinFallback&quot;:true}" data-transition="{&quot;name&quot;:&quot;fade&quot;,&quot;builtinFallback&quot;:true}" data-size="16:9">
<header>從 Prompting 到 Agent 典範轉移</header>
<h3 id="%E9%96%8B%E6%BA%90%E7%94%9F%E6%85%8B%E8%88%87%E7%A4%BE%E7%BE%A4%E7%AF%84%E6%9C%AC%E5%BA%AB%E7%9B%B4%E6%8E%A5%E5%BC%95%E7%94%A8%E7%9A%84%E9%96%8B%E6%BA%90%E8%B3%87%E6%BA%90">開源生態與社群範本庫：直接引用的開源資源</h3>
<div class="three-columns">
<div class="card" data-marpit-fragment>
<h3 id="%F0%9F%8C%90-%E8%A6%8F%E5%89%87%E5%BA%AB-rules-hub"><img class="emoji" draggable="false" alt="🌐" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f310.svg" data-marp-twemoji=""/> 規則庫 (Rules Hub)</h3>
<ul>
<li><strong>Awesome Cursorrules</strong> ：最大開源社群庫 (<code>cursorrules.org</code>)。</li>
<li><strong>技術棧支援</strong> ：支援 React, Vue, Tailwind 等，可直接改名為 <code>AGENTS.md</code>。</li>
<li><strong>Claude Prompts</strong> ：Anthropic 官方與社群之專案規範模板。</li>
</ul>
</div>
<div class="card" data-marpit-fragment>
<h3 id="%F0%9F%94%8C-%E5%B7%A5%E5%85%B7%E5%BA%AB-mcp-servers"><img class="emoji" draggable="false" alt="🔌" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f50c.svg" data-marp-twemoji=""/> 工具庫 (MCP Servers)</h3>
<ul>
<li><strong>Model Context Protocol</strong> ：官方開源庫 (<code>modelcontextprotocol</code>)。</li>
<li><strong>Glama MCP Directory</strong> ：收錄數百款現成工具 (<code>glama.co/mcp</code>)。</li>
<li><strong>常用工具鏈</strong> ：Git 整合、PostgreSQL、Puppeteer 走查、Figma 設計稿。</li>
</ul>
</div>
<div class="card" data-marpit-fragment>
<h3 id="%F0%9F%93%9A-%E6%8A%80%E8%83%BD%E8%88%87%E6%A8%99%E6%BA%96-skills"><img class="emoji" draggable="false" alt="📚" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4da.svg" data-marp-twemoji=""/> 技能與標準 (Skills)</h3>
<ul>
<li><strong>Built-in Skills</strong> ：Antigravity 內建技能包（SOP 範本）。</li>
<li><strong>llms.txt 標準倡議</strong> ：根目錄標準化 AI 索引檔 (<code>llmstxt.org</code>)。</li>
<li><strong>生態價值</strong> ：加速理解相依套件與第三方函式庫。</li>
</ul>
</div>
</div>
<footer>薛念林 教授 | 逢甲大學資訊工程學系</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="84" data-marpit-scope-kQ8craU1="" data-paginate="true" data-footer="薛念林 教授 | 逢甲大學資訊工程學系" data-header="從 Prompting 到 Agent 典範轉移" data-theme="ux-theme" lang="C" data-marpit-pagination="84" style="--paginate:true;--footer:薛念林 教授 | 逢甲大學資訊工程學系;--header:從 Prompting 到 Agent 典範轉移;--theme:ux-theme;" data-marpit-pagination-total="99" data-transition-back="{&quot;name&quot;:&quot;fade&quot;,&quot;builtinFallback&quot;:true}" data-transition="{&quot;name&quot;:&quot;fade&quot;,&quot;builtinFallback&quot;:true}" data-size="16:9">
<header>從 Prompting 到 Agent 典範轉移</header>
<h3 id="antigravity-ide-%E5%AF%A6%E6%88%B0%E6%B5%81%E7%A8%8B%E8%87%AA%E4%B8%BB-ux-%E8%B5%B0%E6%9F%A5%E8%88%87%E9%98%B2%E5%91%86%E9%87%8D%E6%A7%8B">Antigravity IDE 實戰流程：自主 UX 走查與防呆重構</h3>
<div class="two-columns">
<div class="card" data-marpit-fragment>
<h3 id="%F0%9F%93%8B-%E9%9A%8E%E6%AE%B5%E4%B8%80%E8%84%88%E7%B5%A1%E8%A8%BA%E6%96%B7%E8%88%87%E6%9E%B6%E6%A7%8B%E8%A8%88%E7%95%AB-plan"><img class="emoji" draggable="false" alt="📋" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4cb.svg" data-marp-twemoji=""/> 階段一：脈絡診斷與架構計畫 (Plan)</h3>
<ul>
<li>
<p><strong>步驟 1【全專案脈絡走訪與診斷】</strong> ：</p>
<ul>
<li>開發者指派任務：<em>「請對購物車結帳模組進行 Nielsen 易用性健檢。」</em></li>
<li>Agent 主動跨檔案分析組件關聯，偵測出送出按鈕缺少 Loading 狀態 ( <strong>NS01</strong>) 以及刪除項目無二次確認防呆 (<strong>NS05</strong> )。</li>
</ul>
</li>
<li>
<p><strong>步驟 2【產出變更計畫書 (<code>implementation_plan.md</code>)】</strong> ：</p>
<ul>
<li>明確條列受影響檔案、組件依賴關係與狀態邏輯改動點。</li>
<li>落實 <strong>人機協同 (Human-in-the-Loop)</strong> ：暫停並等待人類審核批准。</li>
</ul>
</li>
</ul>
</div>
<div class="card" data-marpit-fragment>
<h3 id="%F0%9F%9A%80-%E9%9A%8E%E6%AE%B5%E4%BA%8C%E7%B2%BE%E6%BA%96%E9%87%8D%E6%A7%8B%E8%88%87%E9%A9%97%E8%AD%89%E4%BA%A4%E4%BB%98-execute"><img class="emoji" draggable="false" alt="🚀" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f680.svg" data-marp-twemoji=""/> 階段二：精準重構與驗證交付 (Execute)</h3>
<ul>
<li><strong>步驟 3【自主程式碼重構與防呆注入】</strong> ：
<ul>
<li>獲得授權後，Agent 調用工具精準修改前端程式碼檔案。</li>
<li>實作按鈕 Disabled 防重複送出、注入防呆 Modal，並新增 SnackBar 提供 10 秒 Undo 復原反悔機制 ( <strong>NS03</strong> )。</li>
</ul>
</li>
<li><strong>步驟 4【自動化工具鏈驗證與交付 (<code>walkthrough.md</code>)】</strong> ：
<ul>
<li>背景調用終端機指令編譯專案、自動排查語法錯誤並透過瀏覽器確認渲染。</li>
<li>輸出改動對照走查報告，清楚呈現體驗升級成果供團隊驗收。</li>
</ul>
</li>
</ul>
</div>
</div>
<footer>薛念林 教授 | 逢甲大學資訊工程學系</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="85" data-marpit-fragments="1" data-paginate="true" data-footer="薛念林 教授 | 逢甲大學資訊工程學系" data-header="從 Prompting 到 Agent 典範轉移" data-theme="ux-theme" lang="C" data-marpit-pagination="85" style="--paginate:true;--footer:薛念林 教授 | 逢甲大學資訊工程學系;--header:從 Prompting 到 Agent 典範轉移;--theme:ux-theme;" data-marpit-pagination-total="99" data-transition-back="{&quot;name&quot;:&quot;fade&quot;,&quot;builtinFallback&quot;:true}" data-transition="{&quot;name&quot;:&quot;fade&quot;,&quot;builtinFallback&quot;:true}" data-size="16:9">
<header>從 Prompting 到 Agent 典範轉移</header>
<h3 id="%E4%BA%BA%E6%A9%9F%E5%8D%94%E5%90%8C-human-in-the-loop-%E7%9A%84%E6%9C%80%E4%BD%B3%E5%AF%A6%E8%B8%90">人機協同 (Human-in-the-Loop) 的最佳實踐</h3>
<div class="two-columns">
<div class="card" data-marpit-fragment>
<h3 id="%F0%9F%A4%96-ai-agent-%E5%B0%88%E7%B2%BE%E7%9A%84%E7%AF%84%E7%96%87-heavy-lifting"><img class="emoji" draggable="false" alt="🤖" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f916.svg" data-marp-twemoji=""/> AI Agent 專精的範疇 (Heavy Lifting)</h3>
<ul>
<li>邊界狀態（Loading、Empty、Error、Retry）的全覆蓋程式設計。</li>
<li>既有 Design System 的命名規範、無障礙標籤 (ARIA) 嚴格遵守。</li>
<li>跨多個檔案同步重構與重複性程式碼撰寫。</li>
<li>自動化指令執行與編譯除錯。</li>
</ul>
</div>
<div class="card" data-marpit-fragment>
<h3 id="%F0%9F%A7%91%E2%80%8D%F0%9F%8E%A8-%E4%BA%BA%E9%A1%9E%E5%B0%88%E5%AE%B6%E5%B0%88%E6%B3%A8%E7%9A%84%E7%AF%84%E7%96%87-high-value-decision"><img class="emoji" draggable="false" alt="🧑‍🎨" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f9d1-200d-1f3a8.svg" data-marp-twemoji=""/> 人類專家專注的範疇 (High-Value Decision)</h3>
<ul>
<li>核心業務目標與使用者同理心洞察。</li>
<li>審查 Agent 提出的 <code>implementation_plan.md</code> ，把關架構方向。</li>
<li>最終美學品味、微互動細節感受與倫理決策。</li>
<li>「信任但驗證」：確保技術方案真正解決使用者痛點。</li>
</ul>
</div>
</div>
<ul>
<li data-marpit-fragment="1">
<blockquote>
<p><strong>Prompt 讓你與 AI 對話，而 Agent 讓你與 AI 並肩建立卓越的軟體產品！</strong></p>
</blockquote>
</li>
</ul>
<footer>薛念林 教授 | 逢甲大學資訊工程學系</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="86" data-paginate="true" data-footer="薛念林 教授 | 逢甲大學資訊工程學系" data-header="實作活動：AI-Coding BMI 系統對照實驗" data-theme="ux-theme" lang="C" data-marpit-pagination="86" style="--paginate:true;--footer:薛念林 教授 | 逢甲大學資訊工程學系;--header:實作活動：AI-Coding BMI 系統對照實驗;--theme:ux-theme;" data-marpit-pagination-total="99" data-transition-back="{&quot;name&quot;:&quot;fade&quot;,&quot;builtinFallback&quot;:true}" data-transition="{&quot;name&quot;:&quot;fade&quot;,&quot;builtinFallback&quot;:true}" data-size="16:9">
<header>實作活動：AI-Coding BMI 系統對照實驗</header>

<h2 id="%F0%9F%9B%A0%EF%B8%8F-%E5%AF%A6%E4%BD%9C%E6%BC%94%E7%B7%B4ai-coding-%E5%AD%B8%E7%94%9F-bmi-%E7%B3%BB%E7%B5%B1%E5%B0%8D%E7%85%A7%E5%AF%A6%E9%A9%97"><img class="emoji" draggable="false" alt="🛠️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f6e0.svg" data-marp-twemoji=""/> 實作演練：AI-Coding 學生 BMI 系統對照實驗</h2>
<div class="two-columns">
<div class="card" data-marpit-fragment>
<h3 id="%F0%9F%8E%AF-%E5%AF%A6%E4%BD%9C%E4%BB%BB%E5%8B%99%E8%88%87%E9%9C%80%E6%B1%82-prompt"><img class="emoji" draggable="false" alt="🎯" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f3af.svg" data-marp-twemoji=""/> 實作任務與需求 Prompt</h3>
<p>請在終端或 AI 編輯器中輸入以下需求，建立一個學生體位分析系統：</p>
<blockquote>
<p><em>「建立一個 BMI 的網頁系統（採用 HTML, CSS, JavaScript）。可以連續的輸入學生的姓名，身高體重，算出每一個人的 BMI，並且進行分析（過重，過輕等）」</em></p>
</blockquote>
<ul>
<li><strong>技術範疇</strong> ：純前端 HTML5 / CSS3 / Vanilla JavaScript。</li>
<li><strong>核心功能</strong> ：連續輸入、即時試算 BMI、體位判斷與班級清單。</li>
</ul>
</div>
<div class="card" data-marpit-fragment>
<h3 id="%F0%9F%94%AC-ab-%E5%B0%8D%E7%85%A7%E5%AF%A6%E9%A9%97%E8%A8%AD%E8%A8%88"><img class="emoji" draggable="false" alt="🔬" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f52c.svg" data-marp-twemoji=""/> A/B 對照實驗設計</h3>
<ul>
<li><strong>對照組【 noGuide 】（無規範引導）</strong> ：
<ul>
<li>僅提供上述需求 Prompt ，直接讓 AI 生成單頁應用。</li>
<li><img class="emoji" draggable="false" alt="🔗" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f517.svg" data-marp-twemoji=""/> <a href="../../demoBMI/noGuide/index.html">開啟 noGuide 實作網頁</a></li>
</ul>
</li>
<li><strong>實驗組【 yesGuide 】（注入 agents.md 引導）</strong> ：
<ul>
<li>在專案工作區注入包含 <strong>尼爾森原則</strong> 規範的 <code>agents.md</code> ，交由 AI Agent 自主實現。</li>
<li><img class="emoji" draggable="false" alt="🔗" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f517.svg" data-marp-twemoji=""/> <a href="../../demoBMI/yesGuide/index.html">開啟 yesGuide 實作網頁</a></li>
</ul>
</li>
<li><strong>核心探討</strong> ：兩者在 <strong>易用性細節</strong> 、 <strong>錯誤防呆</strong> 與 <strong>軟體工程架構</strong> 上有何差異？</li>
</ul>
</div>
</div>
<footer>薛念林 教授 | 逢甲大學資訊工程學系</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="87" data-paginate="true" data-footer="薛念林 教授 | 逢甲大學資訊工程學系" data-header="實作活動：AI-Coding BMI 系統對照實驗" data-theme="ux-theme" lang="C" data-marpit-pagination="87" style="--paginate:true;--footer:薛念林 教授 | 逢甲大學資訊工程學系;--header:實作活動：AI-Coding BMI 系統對照實驗;--theme:ux-theme;" data-marpit-pagination-total="99" data-transition-back="{&quot;name&quot;:&quot;fade&quot;,&quot;builtinFallback&quot;:true}" data-transition="{&quot;name&quot;:&quot;fade&quot;,&quot;builtinFallback&quot;:true}" data-size="16:9">
<header>實作活動：AI-Coding BMI 系統對照實驗</header>
<h3 id="%F0%9F%93%8A-%E7%94%A2%E5%87%BA%E6%AF%94%E8%BC%83noguide-vs-yesguide-%E9%AB%94%E9%A9%97%E8%90%BD%E5%B7%AE"><img class="emoji" draggable="false" alt="📊" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4ca.svg" data-marp-twemoji=""/> 產出比較：noGuide vs. yesGuide 體驗落差</h3>
<div class="two-columns">
<div class="card" data-marpit-fragment>
<h3 id="%F0%9F%9A%AB-noguide-%E7%84%A1%E5%BC%95%E5%B0%8E%E5%8A%9F%E8%83%BD%E5%8F%8A%E6%A0%BC%E4%BD%86%E9%AB%94%E9%A9%97%E5%86%B0%E5%86%B7"><img class="emoji" draggable="false" alt="🚫" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f6ab.svg" data-marp-twemoji=""/> noGuide （無引導：功能及格但體驗冰冷）</h3>
<ul>
<li><strong>狀態能見度 (NS01)</strong> ：無即時試算預覽，必須點擊送出後才能在下方表格看到結果。</li>
<li><strong>操作效率 (NS07)</strong> ：無鍵盤加速流，每次新增後焦點丟失，需依賴滑鼠重新點選輸入框。</li>
<li><strong>控制權與容錯 (NS03/05)</strong> ：單筆刪除立即永久移除（無 Undo 復原機制）；邊界數值缺乏即時防呆。</li>
<li><strong>視覺與規範 (NS04/08)</strong> ：無統整 Design Tokens，狀態顏色隨意且缺乏語意，程式碼混亂。</li>
</ul>
</div>
<div class="card" data-marpit-fragment>
<h3 id="%E2%9C%A8-yesguide-agentsmd-%E5%BC%95%E5%B0%8E%E7%94%9F%E7%94%A2%E7%B4%9A%E6%A5%B5%E8%87%B4%E9%AB%94%E9%A9%97"><img class="emoji" draggable="false" alt="✨" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/2728.svg" data-marp-twemoji=""/> yesGuide （agents.md 引導：生產級極致體驗）</h3>
<ul>
<li><strong>即時狀態反饋 (NS01)</strong> ：鍵入數值時呈現「即時動態試算條」；全班 Dashboard 儀表板與堆疊比例圖即時連動。</li>
<li><strong>極速連續輸入 (NS07)</strong> ：支援 <kbd>Enter</kbd> 一鍵送出， <strong>自動清空並自動聚焦姓名欄位</strong> ，雙手不離鍵盤連打全班！</li>
<li><strong>容錯與反悔 (NS03/05)</strong> ：單筆刪除提供「Toast 5 秒 Undo 撤銷按鈕」；清空全班具備防呆二階段確認。</li>
<li><strong>標準與美學 (NS04/08)</strong> ：遵循衛福部 6 級標準切點與專屬語意色；點擊圖表長條可直接篩選特定體位學生。</li>
</ul>
</div>
</div>
<footer>薛念林 教授 | 逢甲大學資訊工程學系</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="88" data-paginate="true" data-footer="薛念林 教授 | 逢甲大學資訊工程學系" data-header="實作活動：AI-Coding BMI 系統對照實驗" data-theme="ux-theme" lang="C" data-marpit-pagination="88" style="--paginate:true;--footer:薛念林 教授 | 逢甲大學資訊工程學系;--header:實作活動：AI-Coding BMI 系統對照實驗;--theme:ux-theme;" data-marpit-pagination-total="99" data-transition-back="{&quot;name&quot;:&quot;fade&quot;,&quot;builtinFallback&quot;:true}" data-transition="{&quot;name&quot;:&quot;fade&quot;,&quot;builtinFallback&quot;:true}" data-size="16:9">
<header>實作活動：AI-Coding BMI 系統對照實驗</header>
<h3 id="%F0%9F%94%8D-%E6%B7%B1%E5%85%A5%E6%AA%A2%E8%A6%96agentsmd-%E5%A6%82%E4%BD%95%E5%85%B7%E9%AB%94%E8%90%BD%E5%9C%B0%E5%B0%BC%E7%88%BE%E6%A3%AE%E5%8E%9F%E5%89%87"><img class="emoji" draggable="false" alt="🔍" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f50d.svg" data-marp-twemoji=""/> 深入檢視：agents.md 如何具體落地尼爾森原則</h3>
<table>
<thead>
<tr>
<th style="text-align:left">尼爾森啟發式原則</th>
<th style="text-align:left"><img class="emoji" draggable="false" alt="❌" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/274c.svg" data-marp-twemoji=""/> noGuide （無規範引導）</th>
<th style="text-align:left"><img class="emoji" draggable="false" alt="✅" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/2705.svg" data-marp-twemoji=""/> yesGuide （agents.md 規範引導）</th>
</tr>
</thead>
<tbody>
<tr>
<td style="text-align:left"><strong>NS01 系統狀態能見度</strong></td>
<td style="text-align:left">送出後僅靜態新增列，無動態反饋</td>
<td style="text-align:left">即時動態試算預覽、新增 Toast 提示、即時分佈看板</td>
</tr>
<tr>
<td style="text-align:left"><strong>NS02 與真實世界對應</strong></td>
<td style="text-align:left">簡易體位文字，缺乏權威標準依據</td>
<td style="text-align:left">遵循衛福部國健署最新成人標準、單位標示與健康建議</td>
</tr>
<tr>
<td style="text-align:left"><strong>NS03 使用者控制權</strong></td>
<td style="text-align:left">刪除單筆立即銷毀，無法撤銷挽回</td>
<td style="text-align:left">刪除配備 <strong>5 秒 SnackBar Undo 反悔</strong> ，提供清空重設</td>
</tr>
<tr>
<td style="text-align:left"><strong>NS04 一致性與標準</strong></td>
<td style="text-align:left">顏色與間距無系統，各自為政</td>
<td style="text-align:left">封裝 CSS 變數 Design System，狀態色全站語意統一</td>
</tr>
<tr>
<td style="text-align:left"><strong>NS05 錯誤預防</strong></td>
<td style="text-align:left">僅依賴瀏覽器簡易原生提示</td>
<td style="text-align:left">嚴格數值邊界約束、清空全班二階段確認防呆彈窗</td>
</tr>
<tr>
<td style="text-align:left"><strong>NS06 易於識別非記憶</strong></td>
<td style="text-align:left">使用者需自行記憶各體位 BMI 切點</td>
<td style="text-align:left">常駐國健署標準對照抽屜，點擊圖表長條直接即時過濾</td>
</tr>
<tr>
<td style="text-align:left"><strong>NS07 彈性與使用效率</strong></td>
<td style="text-align:left">每次送出需頻繁切換滑鼠點擊</td>
<td style="text-align:left"><strong>鍵盤流連續輸入</strong> ：Enter 送出且自動返回姓名焦點</td>
</tr>
<tr>
<td style="text-align:left"><strong>NS09 協助辨識與復原</strong></td>
<td style="text-align:left">阻斷式警告或無定位的錯誤字串</td>
<td style="text-align:left">欄位就地即時繁中指引，自動聚焦錯誤欄位就地修正</td>
</tr>
</tbody>
</table>
<footer>薛念林 教授 | 逢甲大學資訊工程學系</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="89" data-paginate="true" data-footer="薛念林 教授 | 逢甲大學資訊工程學系" data-header="實作活動：AI-Coding BMI 系統對照實驗" data-theme="ux-theme" lang="C" data-marpit-pagination="89" style="--paginate:true;--footer:薛念林 教授 | 逢甲大學資訊工程學系;--header:實作活動：AI-Coding BMI 系統對照實驗;--theme:ux-theme;" data-marpit-pagination-total="99" data-transition-back="{&quot;name&quot;:&quot;fade&quot;,&quot;builtinFallback&quot;:true}" data-transition="{&quot;name&quot;:&quot;fade&quot;,&quot;builtinFallback&quot;:true}" data-size="16:9">
<header>實作活動：AI-Coding BMI 系統對照實驗</header>
<h3 id="%F0%9F%92%A1-ai-coding-%E6%A0%B8%E5%BF%83%E5%95%9F%E7%A4%BAprompt-%E7%B5%A6%E4%BA%88%E8%83%BD%E5%8A%9Bagentsmd-%E8%B3%A6%E4%BA%88%E9%9D%88%E9%AD%82"><img class="emoji" draggable="false" alt="💡" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4a1.svg" data-marp-twemoji=""/> AI-Coding 核心啟示：Prompt 給予能力，agents.md 賦予靈魂</h3>
<div class="two-columns">
<div class="card" data-marpit-fragment>
<h3 id="%F0%9F%A4%96-%E5%BE%9E-code-completion-%E5%88%B0-agentic-quality"><img class="emoji" draggable="false" alt="🤖" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f916.svg" data-marp-twemoji=""/> 從 Code Completion 到 Agentic Quality</h3>
<ul>
<li><strong>Prompt 的天花板</strong> ：
<ul>
<li>純 Prompt 只能告訴 AI「做什麼 (What)」，AI 預設只會滿足 Happy Path，產出能動但粗糙的「玩具原型」。</li>
</ul>
</li>
<li><strong>agents.md 的決定性力量</strong> ：
<ul>
<li>作為常駐的「AI 心智模型與憲章」，它定義了「如何做到卓越 (How to Excel)」，引導 Agent 主動實踐邊界狀態、無障礙與人因細節。</li>
</ul>
</li>
<li><strong>架構與軟體工程規格</strong> ：
<ul>
<li>模組化職責分離、CSS 變數 Design Tokens、狀態管理與臺灣標準繁中軟體工程術語。</li>
</ul>
</li>
</ul>
</div>
<div class="card" data-marpit-fragment>
<h3 id="%F0%9F%A7%91%E2%80%8D%F0%9F%92%BB-%E6%96%B0%E6%99%82%E4%BB%A3%E8%BB%9F%E9%AB%94%E5%B7%A5%E7%A8%8B%E5%B8%AB%E7%9A%84%E6%A0%B8%E5%BF%83%E5%83%B9%E5%80%BC"><img class="emoji" draggable="false" alt="🧑‍💻" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f9d1-200d-1f4bb.svg" data-marp-twemoji=""/> 新時代軟體工程師的核心價值</h3>
<ul>
<li><strong>角色典範躍遷</strong> ：
<ul>
<li>不再耗費大量時間「手刻每行 HTML/CSS 樣板程式碼」。</li>
<li>升級為 <strong>「系統規範制定者 (Rule Maker)」</strong> 與 <strong>「體驗架構師 (UX Architect)」</strong> 。</li>
</ul>
</li>
<li><strong>AI-Coding 效能階梯</strong> ：
<ul>
<li><strong>Level 1 (Chat/Prompt)</strong> ：碎片程式碼、複製貼上、無上下文。</li>
<li><strong>Level 2 (Agent Autonomy)</strong> ：自主執行但若欠缺約束易失控。</li>
<li><strong>Level 3 (Agent + agents.md)</strong> ：注入人因準則與工程規範，持續自主交付生產級卓越品質！</li>
</ul>
</li>
</ul>
</div>
</div>
<footer>薛念林 教授 | 逢甲大學資訊工程學系</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="90" data-marpit-fragments="3" data-paginate="true" data-footer="薛念林 教授 | 逢甲大學資訊工程學系" data-header="課堂遊戲：從 Prompting 到 Agent 闖關挑戰" data-theme="ux-theme" lang="C" data-marpit-pagination="90" style="--paginate:true;--footer:薛念林 教授 | 逢甲大學資訊工程學系;--header:課堂遊戲：從 Prompting 到 Agent 闖關挑戰;--theme:ux-theme;" data-marpit-pagination-total="99" data-transition-back="{&quot;name&quot;:&quot;fade&quot;,&quot;builtinFallback&quot;:true}" data-transition="{&quot;name&quot;:&quot;fade&quot;,&quot;builtinFallback&quot;:true}" data-size="16:9">
<header>課堂遊戲：從 Prompting 到 Agent 闖關挑戰</header>

<h2 id="%F0%9F%99%8B-%E8%AA%B2%E5%A0%82%E9%81%8A%E6%88%B2%E5%BE%9E-prompting-%E5%88%B0-agent-%E5%85%B8%E7%AF%84%E8%BD%89%E7%A7%BB%E9%97%96%E9%97%9C%E6%8C%91%E6%88%B0-game02"><img class="emoji" draggable="false" alt="🙋" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f64b.svg" data-marp-twemoji=""/> 課堂遊戲：從 Prompting 到 Agent 典範轉移闖關挑戰 (Game02)</h2>
<div class="two-columns-64">
<div class="card">
<h3 id="%F0%9F%8F%86-%E9%81%8A%E6%88%B2%E4%BB%BB%E5%8B%99%E8%AA%AA%E6%98%8E-1"><img class="emoji" draggable="false" alt="🏆" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f3c6.svg" data-marp-twemoji=""/> 遊戲任務說明</h3>
<ul>
<li data-marpit-fragment="1"><strong>挑戰目標</strong> ：深刻體會從傳統 Chat 對話框到現代 Agentic 自主工作流的關鍵思維升級。</li>
<li data-marpit-fragment="2"><strong>搶答規則</strong> ：共 <strong>5 道實戰單選題</strong> ，每題限時搶答！請選出最符合現代 Agentic UX 的最佳實踐。</li>
<li data-marpit-fragment="3"><strong>操作方式</strong> ：請拿起手機或平板掃描右側 QR Code，或點擊下方連結進入遊戲間。</li>
</ul>

</div>
<div class="card-img">
<p><a href="https://nlhsueh.github.io/nickedupocket/#/student/ux-ch03-game1" target="_blank"><img src="../../img/ch03/ux-ch03-game1.png" alt="QR Code" style="max-height: 280px;" /></a></p>
</div>
</div>
<footer>薛念林 教授 | 逢甲大學資訊工程學系</footer>

</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="91" data-paginate="true" data-footer="薛念林 教授 | 逢甲大學資訊工程學系" data-header="課堂遊戲：從 Prompting 到 Agent 闖關挑戰" data-theme="ux-theme" lang="C" data-marpit-pagination="91" style="--paginate:true;--footer:薛念林 教授 | 逢甲大學資訊工程學系;--header:課堂遊戲：從 Prompting 到 Agent 闖關挑戰;--theme:ux-theme;" data-marpit-pagination-total="99" data-transition-back="{&quot;name&quot;:&quot;fade&quot;,&quot;builtinFallback&quot;:true}" data-transition="{&quot;name&quot;:&quot;fade&quot;,&quot;builtinFallback&quot;:true}" data-size="16:9">
<header>課堂遊戲：從 Prompting 到 Agent 闖關挑戰</header>
<h3 id="%F0%9F%8E%AE-%E9%97%96%E9%97%9C%E7%AC%AC-01-%E9%97%9Cchat-based-prompting-%E7%9A%84%E4%B8%8A%E4%B8%8B%E6%96%87%E5%AD%A4%E5%B3%B6"><img class="emoji" draggable="false" alt="🎮" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f3ae.svg" data-marp-twemoji=""/> 闖關第 01 關：【Chat-based Prompting 的上下文孤島】</h3>
<div class="card">
<p><strong>情境描述</strong> ：<br />
工程師在傳統對話框中輸入「請幫我寫一個符合 NS01 的購物車組件」，AI 給出了一段語法正確的 React 程式碼。然而當工程師複製進專案時，卻發現該組件無法辨識專案既有的 Pinia/Redux 狀態機，CSS 變數亦與全域 Design System 衝突，還缺漏了必要的依賴套件。</p>
<p><strong>請問這最能說明傳統對話型 Prompting 的哪一項核心局限？</strong></p>
<ul>
<li><strong>(A)</strong> 大型語言模型的推理速度過慢</li>
<li><strong>(B)</strong> 上下文孤島 (Context Silo) 與缺乏全專案視野</li>
<li><strong>(C)</strong> 模型欠缺基本的程式碼語法檢查能力</li>
<li><strong>(D)</strong> 對話介面無法輸出超過 50 行的文字</li>
</ul>
</div>
<footer>薛念林 教授 | 逢甲大學資訊工程學系</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="92" data-paginate="true" data-footer="薛念林 教授 | 逢甲大學資訊工程學系" data-header="課堂遊戲：從 Prompting 到 Agent 闖關挑戰" data-theme="ux-theme" lang="C" data-marpit-pagination="92" style="--paginate:true;--footer:薛念林 教授 | 逢甲大學資訊工程學系;--header:課堂遊戲：從 Prompting 到 Agent 闖關挑戰;--theme:ux-theme;" data-marpit-pagination-total="99" data-transition-back="{&quot;name&quot;:&quot;fade&quot;,&quot;builtinFallback&quot;:true}" data-transition="{&quot;name&quot;:&quot;fade&quot;,&quot;builtinFallback&quot;:true}" data-size="16:9">
<header>課堂遊戲：從 Prompting 到 Agent 闖關挑戰</header>
<h3 id="%F0%9F%8E%AE-%E9%97%96%E9%97%9C%E7%AC%AC-02-%E9%97%9Cagent-%E7%9A%84%E8%A6%8F%E5%8A%83%E5%84%AA%E5%85%88%E5%8E%9F%E5%89%87-planning-mode"><img class="emoji" draggable="false" alt="🎮" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f3ae.svg" data-marp-twemoji=""/> 闖關第 02 關：【Agent 的規劃優先原則 (Planning Mode)】</h3>
<div class="card">
<p><strong>情境描述</strong> ：<br />
當我們指派 AI Agent 一個涉及 5 個前端組件、全站深色模式變數以及結帳狀態機的複雜 UX 重構任務時，一個成熟的 Agentic 協同工作流應該採取的第一步動作為何？</p>
<p><strong>請問下列哪一項是最佳實踐？</strong></p>
<ul>
<li><strong>(A)</strong> 立即以多執行緒同時盲目改寫 5 個前端程式碼檔案</li>
<li><strong>(B)</strong> 自動覆寫既有檔案並強制執行 <code>git push --force</code> 推送至遠端</li>
<li><strong>(C)</strong> 優先進入規劃模式 (Plan)，主動分析相依性並產出結構化實施計畫書，等待人類審查批准</li>
<li><strong>(D)</strong> 自動關閉終端機並拒絕執行跨檔案操作</li>
</ul>
</div>
<footer>薛念林 教授 | 逢甲大學資訊工程學系</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="93" data-paginate="true" data-footer="薛念林 教授 | 逢甲大學資訊工程學系" data-header="課堂遊戲：從 Prompting 到 Agent 闖關挑戰" data-theme="ux-theme" lang="C" data-marpit-pagination="93" style="--paginate:true;--footer:薛念林 教授 | 逢甲大學資訊工程學系;--header:課堂遊戲：從 Prompting 到 Agent 闖關挑戰;--theme:ux-theme;" data-marpit-pagination-total="99" data-transition-back="{&quot;name&quot;:&quot;fade&quot;,&quot;builtinFallback&quot;:true}" data-transition="{&quot;name&quot;:&quot;fade&quot;,&quot;builtinFallback&quot;:true}" data-size="16:9">
<header>課堂遊戲：從 Prompting 到 Agent 闖關挑戰</header>
<h3 id="%F0%9F%8E%AE-%E9%97%96%E9%97%9C%E7%AC%AC-03-%E9%97%9C%E9%96%89%E7%92%B0%E9%A9%97%E8%AD%89%E8%88%87%E8%87%AA%E4%B8%BB%E8%B5%B0%E6%9F%A5-feedback-loop"><img class="emoji" draggable="false" alt="🎮" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f3ae.svg" data-marp-twemoji=""/> 闖關第 03 關：【閉環驗證與自主走查 (Feedback Loop)】</h3>
<div class="card">
<p><strong>情境描述</strong> ：<br />
AI Agent 在完成購物車刪除防呆 Modal (NS05) 的前端程式碼改動後，自主調用終端機指令編譯專案、開啟瀏覽器走查工具模擬點擊結帳流程，並在瀏覽器控制台檢測有無未捕捉之 JavaScript 錯誤。</p>
<p><strong>請問這項特徵體現了 Agent 與傳統 Prompting 的哪項本質差異？</strong></p>
<ul>
<li><strong>(A)</strong> 單一對話的提示詞長度能無限擴展</li>
<li><strong>(B)</strong> 外部工具調用與自主閉環走查驗證 (Tool Calling &amp; Feedback Loop)</li>
<li><strong>(C)</strong> 取代人類產品經理的所有商業決策</li>
<li><strong>(D)</strong> 完全不需要依賴任何底層大型語言模型</li>
</ul>
</div>
<footer>薛念林 教授 | 逢甲大學資訊工程學系</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="94" data-paginate="true" data-footer="薛念林 教授 | 逢甲大學資訊工程學系" data-header="課堂遊戲：從 Prompting 到 Agent 闖關挑戰" data-theme="ux-theme" lang="C" data-marpit-pagination="94" style="--paginate:true;--footer:薛念林 教授 | 逢甲大學資訊工程學系;--header:課堂遊戲：從 Prompting 到 Agent 闖關挑戰;--theme:ux-theme;" data-marpit-pagination-total="99" data-transition-back="{&quot;name&quot;:&quot;fade&quot;,&quot;builtinFallback&quot;:true}" data-transition="{&quot;name&quot;:&quot;fade&quot;,&quot;builtinFallback&quot;:true}" data-size="16:9">
<header>課堂遊戲：從 Prompting 到 Agent 闖關挑戰</header>
<h3 id="%F0%9F%8E%AE-%E9%97%96%E9%97%9C%E7%AC%AC-04-%E9%97%9C%E4%BA%BA%E6%A9%9F%E5%8D%94%E5%90%8C-human-in-the-loop-%E7%9A%84%E8%A7%92%E8%89%B2%E6%BC%94%E9%80%B2"><img class="emoji" draggable="false" alt="🎮" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f3ae.svg" data-marp-twemoji=""/> 闖關第 04 關：【人機協同 (Human-in-the-Loop) 的角色演進】</h3>
<div class="card">
<p><strong>情境描述</strong> ：<br />
在現代 Agentic UX 開發模式下，AI Agent 能自主負擔繁重的跨檔案重構、樣式微調與自動化測試驗證。</p>
<p><strong>請問在此典範轉移下，人類工程師與設計師最關鍵的核心職責轉變為何？</strong></p>
<ul>
<li><strong>(A)</strong> 專職手動輸入終端機編譯指令</li>
<li><strong>(B)</strong> 意圖定義、架構審核、關鍵決策批准與最終體驗驗收 (Reviewer &amp; Orchestrator)</li>
<li><strong>(C)</strong> 完全退出軟體開發流程，由 AI 獨立交付與部署上線</li>
<li><strong>(D)</strong> 僅負責幫 AI 支付 API 費用與伺服器硬體維護</li>
</ul>
</div>
<footer>薛念林 教授 | 逢甲大學資訊工程學系</footer>
</section>

<h2 id="%E7%B5%90%E5%90%88%E5%8F%AF%E7%94%A8%E6%80%A7%E5%8E%9F%E5%89%87%E8%88%87-ai-%E6%8F%90%E7%A4%BA%E6%89%93%E9%80%A0%E6%A5%B5%E8%87%B4%E9%AB%94%E9%A9%97">結合可用性原則與 AI 提示，打造極致體驗</h2>
<p><strong>Q &amp; A / 交流討論</strong></p>
<script>
(function() {
  function initHeaderDropdown() {
    const sections = [];
    const seenTitles = new Set();
    const slideSections = document.querySelectorAll('section[id]');
    
    // 1. Scan unique section titles and their slide IDs
    slideSections.forEach(sec => {
      const header = sec.querySelector('header');
      if (!header) return;
      
      let title = header.textContent.trim();
      title = title.replace(/^[◄◀]\s*/, '').replace(/\s*[►▶]$/, '').trim();
      if (!title || seenTitles.has(title)) return;
      
      seenTitles.add(title);
      sections.push({
        id: sec.id,
        title: title
      });
    });

    if (sections.length === 0) return;

    // Helper to create the dropdown DOM
    function createDropdownWrapper(currentTitle) {
      const wrapper = document.createElement('span');
      wrapper.className = 'header-nav-wrapper';
      
      const titleSpan = document.createElement('span');
      titleSpan.className = 'header-nav-title';
      titleSpan.title = '點擊固定或懸停查看所有章節快速跳轉';
      titleSpan.innerHTML = currentTitle + '<span class="nav-caret"> ▾</span>';
      
      // Click on title toggles pinned state
      titleSpan.addEventListener('click', function(e) {
        e.stopPropagation();
        const wasOpen = wrapper.classList.contains('is-open');
        document.querySelectorAll('.header-nav-wrapper.is-open').forEach(w => w.classList.remove('is-open'));
        if (!wasOpen) {
          wrapper.classList.add('is-open');
        }
      });
      
      const dropdown = document.createElement('div');
      dropdown.className = 'nav-dropdown';
      
      // Prevent clicks inside dropdown from bubbling and closing
      dropdown.addEventListener('click', function(e) {
        e.stopPropagation();
      });
      
      const dropHeader = document.createElement('div');
      dropHeader.className = 'nav-dropdown-header';
      dropHeader.innerHTML = '<span>📑 快速跳轉章節目錄</span><span style="font-size:11px;font-weight:normal;color:#64748b;">共 ' + sections.length + ' 個章節</span>';
      dropdown.appendChild(dropHeader);
      
      const grid = document.createElement('div');
      grid.className = 'nav-dropdown-grid';
      
      sections.forEach(s => {
        const item = document.createElement('a');
        const isActive = (s.title === currentTitle);
        item.className = 'nav-dropdown-item' + (isActive ? ' active' : '');
        item.href = '#' + s.id;
        item.innerHTML = '<span class="badge">#' + s.id.padStart(2, '0') + '</span><span class="item-text" title="' + s.title + '">' + s.title + '</span>';
        
        item.addEventListener('click', function(e) {
          wrapper.classList.remove('is-open');
          dropdown.style.display = 'none';
          window.location.hash = '#' + s.id;
          setTimeout(() => { dropdown.style.display = ''; }, 350);
        });
        
        grid.appendChild(item);
      });
      
      dropdown.appendChild(grid);
      wrapper.appendChild(titleSpan);
      wrapper.appendChild(dropdown);
      return wrapper;
    }

    // Close any pinned dropdown when clicking anywhere outside
    document.addEventListener('click', function(e) {
      if (!e.target.closest('.header-nav-wrapper')) {
        document.querySelectorAll('.header-nav-wrapper.is-open').forEach(w => w.classList.remove('is-open'));
      }
    });

    // 2. Enhance each header element across all slides
    slideSections.forEach(sec => {
      const header = sec.querySelector('header');
      if (!header || header.dataset.navEnhanced) return;
      header.dataset.navEnhanced = 'true';
      
      let title = header.textContent.trim();
      title = title.replace(/^[◄◀]\s*/, '').replace(/\s*[►▶]$/, '').trim();
      if (!title) return;
      
      header.innerHTML = '';
      const wrapper = createDropdownWrapper(title);
      header.appendChild(wrapper);
    });
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', initHeaderDropdown);
  } else {
    initHeaderDropdown();
  }
  setTimeout(initHeaderDropdown, 400);
})();
</script>
