<header>1. 什麼是 AI for UX？</header>

<h2 id="%E4%BB%80%E9%BA%BC%E6%98%AF-ai-for-ux">什麼是 AI for UX？</h2>
<blockquote>
<p><strong>AI for UX</strong> 是應用生成式 AI 協助使用體驗設計，在系統開發的起點就注入專業的可用性與人因規範。</p>
</blockquote>
<div class="two-columns">
<div class="card" data-marpit-fragment>
<h3 id="%E5%82%B3%E7%B5%B1-uiux-%E8%A8%AD%E8%A8%88%E6%B5%81%E7%A8%8B%E7%9A%84%E7%97%9B%E9%BB%9E">傳統 UI/UX 設計流程的痛點</h3>
<ul>
<li><strong>溝通代溝</strong> ：沒有畫面與雛形，成品往往與預期嚴重脫節。</li>
<li><strong>繁複設計</strong> ：手繪草圖 ➔ Wireframe ➔ 靜態 Mockup ➔ 標註交付 ➔ 前端撰寫。</li>
<li><strong>週期漫長</strong> ：等看到第一個可操作版本時，已耗費數週開發時間。</li>
</ul>
</div>
<div class="card" data-marpit-fragment>
<h3 id="ai-for-ux-%E7%9A%84%E5%85%B8%E7%AF%84%E8%BD%89%E7%A7%BB-paradigm-shift">AI for UX 的典範轉移 (Paradigm Shift)</h3>
<ul>
<li><strong>意圖即介面</strong> ：用結構化自然語言直接生成可操作原型，降低溝通失誤。</li>
<li><strong>可用性內生化</strong> ：將 UX 原則轉化為 Prompt 規則，讓 AI 生成的程式碼「天生具備好 UX」。</li>
<li><strong>敏捷反饋閉環</strong> ：快速完成從發想到可互動原型的驗證。</li>
</ul>
</div>
</div>
<footer>薛念林 教授 | 逢甲大學資訊工程學系</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="5" data-marpit-fragments="1" data-paginate="true" data-footer="薛念林 教授 | 逢甲大學資訊工程學系" data-header="1. 什麼是 AI for UX？" data-theme="ux-theme" lang="C" data-marpit-pagination="5" style="--paginate:true;--footer:薛念林 教授 | 逢甲大學資訊工程學系;--header:1. 什麼是 AI for UX？;--theme:ux-theme;" data-marpit-pagination-total="99" data-transition-back="{&quot;name&quot;:&quot;fade&quot;,&quot;builtinFallback&quot;:true}" data-transition="{&quot;name&quot;:&quot;fade&quot;,&quot;builtinFallback&quot;:true}" data-size="16:9">
<header>1. 什麼是 AI for UX？</header>
<h3 id="ai-for-ux-%E7%9A%84%E4%B8%89%E5%A4%A7%E5%AF%A6%E5%8B%99%E6%95%88%E7%9B%8A">AI for UX 的三大實務效益</h3>
<div class="two-columns">
<div class="card" data-marpit-fragment>
<h3 id="%E2%9A%A1-%E9%96%8B%E7%99%BC%E6%95%88%E7%8E%87%E8%88%87%E8%BF%AD%E4%BB%A3%E9%80%9F%E5%BA%A6%E5%80%8D%E5%A2%9E"><img class="emoji" draggable="false" alt="⚡" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/26a1.svg" data-marp-twemoji=""/> 開發效率與迭代速度倍增</h3>
<ul>
<li>從數週縮短至數分鐘，支援即時會議中現場修改、現場驗證。</li>
<li>開發團隊能有更多時間專注於核心業務架構與使用者洞察。</li>
</ul>
<h3 id="%F0%9F%93%90-%E4%BB%8B%E9%9D%A2%E6%A8%99%E6%BA%96%E5%8C%96%E8%88%87%E8%A8%AD%E8%A8%88%E7%B3%BB%E7%B5%B1%E8%90%BD%E5%9C%B0"><img class="emoji" draggable="false" alt="📐" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4d0.svg" data-marp-twemoji=""/> 介面標準化與設計系統落地</h3>
<ul>
<li>將專案的色彩、佈局、通用組件規格寫入 Prompt。</li>
<li>杜絕多位工程師各寫各的按鈕樣式與錯誤彈窗。</li>
</ul>
</div>
<div class="card" data-marpit-fragment>
<h3 id="%F0%9F%92%B0-1-10-100-%E6%88%90%E6%9C%AC%E6%B3%95%E5%89%87-cost-of-quality"><img class="emoji" draggable="false" alt="💰" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4b0.svg" data-marp-twemoji=""/> 1-10-100 成本法則 (Cost of Quality)</h3>
<ul>
<li><strong>$1 (雛形階段)</strong> ：在 AI 雛形中發現可用性問題，修改僅需調整 Prompt 或幾行程式碼。</li>
<li><strong>$10 (開發階段)</strong> ：進入前端與後端整合後，修改需重構邏輯與資料庫關聯。</li>
<li><strong>$100 (上線營運)</strong> ：系統上線後使用者抱怨流失，修復成本高達百倍！</li>
</ul>
<ul>
<li data-marpit-fragment="1">
<blockquote>
<p><strong>AI for UX 讓高品質的「前期確認」變得容易可行！</strong></p>
</blockquote>
</li>
</ul>
</div>
</div>
<footer>薛念林 教授 | 逢甲大學資訊工程學系</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="6" data-marpit-fragments="2" data-paginate="true" data-footer="薛念林 教授 | 逢甲大學資訊工程學系" data-header="2. Prompt 做法：從 RTF 到 RTCF" data-theme="ux-theme" lang="C" data-marpit-pagination="6" style="--paginate:true;--footer:薛念林 教授 | 逢甲大學資訊工程學系;--header:2. Prompt 做法：從 RTF 到 RTCF;--theme:ux-theme;" data-marpit-pagination-total="99" data-transition-back="{&quot;name&quot;:&quot;fade&quot;,&quot;builtinFallback&quot;:true}" data-transition="{&quot;name&quot;:&quot;fade&quot;,&quot;builtinFallback&quot;:true}" data-size="16:9">
<header>2. Prompt 做法：從 RTF 到 RTCF</header>

<h2 id="%E4%BD%BF%E7%94%A8-prompt-%E7%9A%84%E5%81%9A%E6%B3%95%E8%A7%92%E8%89%B2-%E4%BB%BB%E5%8B%99-%E7%B4%84%E6%9D%9F-%E6%A0%BC%E5%BC%8Frtcf">使用 Prompt 的做法：角色-任務-約束-格式(RTCF)</h2>
<ul>
<li data-marpit-fragment="1">
<blockquote>
<p>避免模糊無效的提示詞：<img class="emoji" draggable="false" alt="❌" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/274c.svg" data-marp-twemoji=""/> <em>「請幫我寫一個登入頁面」</em></p>
</blockquote>
</li>
<li data-marpit-fragment="2">
<blockquote>
<p>採用軟體工程與體驗設計的 <strong>RTCF 提示詞架構</strong> （業界 RTF ＋ UX 約束）：</p>
</blockquote>
</li>
</ul>
<div class="two-columns">
<div class="card" data-marpit-fragment>
<h3 id="1-%E8%A7%92%E8%89%B2-role---r">1. 角色 (Role - R)</h3>
<ul>
<li>明確賦予資深 UI/UX 專家與軟體架構師視角。</li>
<li>例：<em>「你是一位具備 20 年經驗、專精防呆設計的資深 UX 架構師。」</em></li>
</ul>
<h3 id="2-%E4%BB%BB%E5%8B%99-task---t">2. 任務 (Task - T)</h3>
<ul>
<li>清楚交代使用者目標、操作載具與業務流程。</li>
<li>例：<em>「設計外送點餐結帳表單，需考量單手操作與網路不穩情境。」</em></li>
</ul>
</div>
<div class="card" data-marpit-fragment>
<h3 id="3-ux-%E7%B4%84%E6%9D%9F-constraints---c">3. UX 約束 (Constraints - C)</h3>
<ul>
<li><strong>主動帶入尼爾森原則作為非功能性需求</strong> ：</li>
<li>必須包含即時表單驗證 (NS05)</li>
<li>避免沒有進度反饋 (NS01)</li>
<li>支援 Toast 一鍵復原 (NS03)</li>
</ul>
<h3 id="4-%E8%BC%B8%E5%87%BA%E6%A0%BC%E5%BC%8F-format---f">4. 輸出格式 (Format - F)</h3>
<ul>
<li>規範組件技術棧（React/Tailwind），並要求條列標註應用的原則。</li>
</ul>
</div>
</div>
<footer>薛念林 教授 | 逢甲大學資訊工程學系</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="7" data-paginate="true" data-footer="薛念林 教授 | 逢甲大學資訊工程學系" data-header="尼爾森 10 大原則總覽" data-theme="ux-theme" lang="C" data-marpit-pagination="7" style="--paginate:true;--footer:薛念林 教授 | 逢甲大學資訊工程學系;--header:尼爾森 10 大原則總覽;--theme:ux-theme;" data-marpit-pagination-total="99" data-transition-back="{&quot;name&quot;:&quot;fade&quot;,&quot;builtinFallback&quot;:true}" data-transition="{&quot;name&quot;:&quot;fade&quot;,&quot;builtinFallback&quot;:true}" data-size="16:9">
<header>尼爾森 10 大原則總覽</header>

<h2 id="%E5%B0%BC%E7%88%BE%E6%A3%AE-10-%E5%A4%A7%E5%8E%9F%E5%89%87%E7%B8%BD%E8%A6%BD-nielsens-heuristics">尼爾森 10 大原則總覽 (Nielsen's Heuristics)</h2>
<div class="two-columns">
<div class="card" data-marpit-fragment>
<ul>
<li><strong>NS01</strong> 清楚的系統狀態 (Visibility of System Status)</li>
<li><strong>NS02</strong> 與真實世界對應 (Match Between System &amp; Real World)</li>
<li><strong>NS03</strong> 使用者控制權 (User Control &amp; Freedom)</li>
<li><strong>NS04</strong> 一致的風格 (Consistency &amp; Standards)</li>
<li><strong>NS05</strong> 錯誤預防 (Error Prevention)</li>
</ul>
</div>
<div class="card" data-marpit-fragment>
<ul>
<li><strong>NS06</strong> 易於識別 (Recognition Rather Than Recall)</li>
<li><strong>NS07</strong> 彈性與效率 (Flexibility &amp; Efficiency of Use)</li>
<li><strong>NS08</strong> 優雅簡潔設計 (Aesthetic &amp; Minimalist Design)</li>
<li><strong>NS09</strong> 清楚錯誤處理 (Error Recovery)</li>
<li><strong>NS10</strong> 適當的說明 (Help &amp; Documentation)</li>
</ul>
</div>
</div>
<footer>薛念林 教授 | 逢甲大學資訊工程學系</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="8" data-marpit-fragments="3" data-paginate="true" data-footer="薛念林 教授 | 逢甲大學資訊工程學系" data-header="NS01 清楚的系統狀態 (Visibility)" data-theme="ux-theme" lang="C" data-marpit-pagination="8" style="--paginate:true;--footer:薛念林 教授 | 逢甲大學資訊工程學系;--header:NS01 清楚的系統狀態 (Visibility);--theme:ux-theme;" data-marpit-pagination-total="99" data-transition-back="{&quot;name&quot;:&quot;fade&quot;,&quot;builtinFallback&quot;:true}" data-transition="{&quot;name&quot;:&quot;fade&quot;,&quot;builtinFallback&quot;:true}" data-size="16:9">
<header>NS01 清楚的系統狀態 (Visibility)</header>

<h2 id="ns01-%E6%B8%85%E6%A5%9A%E7%9A%84%E7%B3%BB%E7%B5%B1%E7%8B%80%E6%85%8B-visibility-of-system-status">NS01 清楚的系統狀態 (Visibility of System Status)</h2>
<blockquote>
<p><em>“The system should always keep users informed about what is going on, through appropriate <strong>feedback</strong> within a reasonable time.”</em></p>
</blockquote>
<ul>
<li data-marpit-fragment="1">
<blockquote>
<p><em>「系統應始終在合理的時間內透過適當的 <strong>反饋</strong> ，讓使用者即時掌握正在發生的事情與 <strong>當前狀態</strong> 。」</em></p>
</blockquote>
</li>
</ul>
<div class="card">
<h3 id="%E6%A0%B8%E5%BF%83%E6%A6%82%E5%BF%B5%E9%81%A9%E6%99%82%E5%8F%8D%E9%A5%8B%E6%B6%88%E9%99%A4%E7%84%A6%E6%85%AE">核心概念：適時反饋、消除焦慮</h3>
<ul>
<li>系統必須在 <strong>合理的時間內</strong> 給予適當反饋，始終讓使用者了解當前進度與狀態。</li>
<li>凸顯重要資訊，建立使用者的情境掌控感。</li>
</ul>
<ul>
<li data-marpit-fragment="2"><img class="emoji" draggable="false" alt="👍" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f44d.svg" data-marp-twemoji=""/> <strong>優良實踐</strong> ：提供上傳進度條、按鈕點擊後立即顯示目前狀態、步驟指示器（Step 2 of 4）。</li>
<li data-marpit-fragment="3"><img class="emoji" draggable="false" alt="👎" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f44e.svg" data-marp-twemoji=""/> <strong>不良設計</strong> ：點擊無反應、畫面凍結、讓使用者猜測「系統是不是當機了？」。</li>
</ul>
</div>
<footer>薛念林 教授 | 逢甲大學資訊工程學系</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="9" data-paginate="true" data-footer="薛念林 教授 | 逢甲大學資訊工程學系" data-header="NS01 清楚的系統狀態 (Visibility)" data-theme="ux-theme" lang="C" data-marpit-pagination="9" style="--paginate:true;--footer:薛念林 教授 | 逢甲大學資訊工程學系;--header:NS01 清楚的系統狀態 (Visibility);--theme:ux-theme;" data-marpit-pagination-total="99" data-transition-back="{&quot;name&quot;:&quot;fade&quot;,&quot;builtinFallback&quot;:true}" data-transition="{&quot;name&quot;:&quot;fade&quot;,&quot;builtinFallback&quot;:true}" data-size="16:9">
<header>NS01 清楚的系統狀態 (Visibility)</header>
<h3 id="ns01-%E6%A1%88%E4%BE%8B%E8%A7%A3%E6%9E%90%E8%88%87%E5%AF%A6%E5%8B%99%E6%87%89%E7%94%A8">NS01 案例解析與實務應用</h3>
<div class="two-columns">
<div class="card" data-marpit-fragment>
<h3 id="%E6%AA%94%E6%A1%88%E4%B8%8A%E5%82%B3%E7%8B%80%E6%85%8B">檔案上傳狀態</h3>

</code></pre>
<ul>
<li>清楚交代每一項任務的進度。</li>
<li>使用者完全安心。</li>
</ul>
</div>
<div class="card" data-marpit-fragment>
<h3 id="%E5%8D%B3%E6%99%82%E8%A1%A8%E5%96%AE%E8%88%87%E6%9C%AA%E8%AE%80%E9%80%9A%E7%9F%A5">即時表單與未讀通知</h3>
<ul>
<li><img class="emoji" draggable="false" alt="🔔" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f514.svg" data-marp-twemoji=""/> 未讀訊息數字徽章</li>
<li><img class="emoji" draggable="false" alt="📧" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4e7.svg" data-marp-twemoji=""/> Email 格式輸入錯誤時 <strong>即時</strong> 紅字提示</li>
<li><img class="emoji" draggable="false" alt="🛒" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f6d2.svg" data-marp-twemoji=""/> 商品各尺寸之 <strong>庫存即時狀態</strong> 提示</li>
</ul>
</div>
</div>
<footer>薛念林 教授 | 逢甲大學資訊工程學系</footer>

</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="12" data-paginate="true" data-footer="薛念林 教授 | 逢甲大學資訊工程學系" data-header="NS01 清楚的系統狀態 (Visibility)" data-theme="ux-theme" lang="C" data-marpit-pagination="12" style="--paginate:true;--footer:薛念林 教授 | 逢甲大學資訊工程學系;--header:NS01 清楚的系統狀態 (Visibility);--theme:ux-theme;" data-marpit-pagination-total="99" data-transition-back="{&quot;name&quot;:&quot;fade&quot;,&quot;builtinFallback&quot;:true}" data-transition="{&quot;name&quot;:&quot;fade&quot;,&quot;builtinFallback&quot;:true}" data-size="16:9">
<header>NS01 清楚的系統狀態 (Visibility)</header>
<h3 id="ai-for-uxns01-%E7%B3%BB%E7%B5%B1%E7%8B%80%E6%85%8B%E8%83%BD%E8%A6%8B%E5%BA%A6-visibility-of-system-status">AI for UX：NS01 系統狀態能見度 (Visibility of System Status)</h3>
<div class="two-columns">
<div class="prompt-box" data-marpit-fragment>
<h3 id="%F0%9F%92%A1-prompt-%E8%A8%AD%E8%A8%88%E6%A1%86%E6%9E%B6"><img class="emoji" draggable="false" alt="💡" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4a1.svg" data-marp-twemoji=""/> Prompt 設計框架</h3>
<ul>
<li><strong>角色 (Role)</strong>: 資深前端與 UX 專家。</li>
<li><strong>任務 (Task)</strong>: 當系統執行非同步操作（如 API 請求或資料處理）時，提供即時反饋讓使用者掌握進度。</li>
<li><strong>約束 (Constraint)</strong>: 必須包含明確進度與預估時間；避免毫無說明的空白畫面或無指示的 Spinner。</li>
</ul>
</div>
<div class="prompt-box" data-marpit-fragment>
<h3 id="%F0%9F%93%9D-%E6%8F%90%E7%A4%BA%E8%A9%9E%E7%AF%84%E6%9C%AC"><img class="emoji" draggable="false" alt="📝" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4dd.svg" data-marp-twemoji=""/> 提示詞範本</h3>
<blockquote>
<p>你是一個資深前端工程師。在設計匯入大型檔案的 UI 時，請確保提供一個即時進度條（Progress Bar），包含目前處理百分比（如 45%）、已處理筆數與剩餘預估秒數。禁止在背景默默運算而不給任何進度指示。</p>
</blockquote>
</div>
</div>
<footer>薛念林 教授 | 逢甲大學資訊工程學系</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="13" data-paginate="true" data-footer="薛念林 教授 | 逢甲大學資訊工程學系" data-header="NS01 清楚的系統狀態 (Visibility)" data-class="full-img" data-theme="ux-theme" lang="C" class="full-img" data-marpit-pagination="13" style="--paginate:true;--footer:薛念林 教授 | 逢甲大學資訊工程學系;--header:NS01 清楚的系統狀態 (Visibility);--class:full-img;--theme:ux-theme;" data-marpit-pagination-total="99" data-transition-back="{&quot;name&quot;:&quot;fade&quot;,&quot;builtinFallback&quot;:true}" data-transition="{&quot;name&quot;:&quot;fade&quot;,&quot;builtinFallback&quot;:true}" data-size="16:9">

</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="14" data-marpit-fragments="3" data-paginate="true" data-footer="薛念林 教授 | 逢甲大學資訊工程學系" data-header="NS02 與真實世界的對應 (Match Real World)" data-theme="ux-theme" lang="C" data-marpit-pagination="14" style="--paginate:true;--footer:薛念林 教授 | 逢甲大學資訊工程學系;--header:NS02 與真實世界的對應 (Match Real World);--theme:ux-theme;" data-marpit-pagination-total="99" data-transition-back="{&quot;name&quot;:&quot;fade&quot;,&quot;builtinFallback&quot;:true}" data-transition="{&quot;name&quot;:&quot;fade&quot;,&quot;builtinFallback&quot;:true}" data-size="16:9">
<header>NS02 與真實世界的對應 (Match Real World)</header>

<h2 id="ns02-%E8%88%87%E7%9C%9F%E5%AF%A6%E4%B8%96%E7%95%8C%E7%9A%84%E5%B0%8D%E6%87%89-match-system--real-world">NS02 與真實世界的對應 (Match System &amp; Real World)</h2>
<blockquote>
<p><em>“The system should speak the users’ language, with words, phrases, and concepts familiar to the user, rather than system-oriented terms.”</em></p>
</blockquote>
<ul>
<li data-marpit-fragment="1">
<blockquote>
<p><em>「系統應使用 <strong>使用者的語言</strong> ，採用使用者熟悉的詞彙、短語與概念，而非系統導向的專業術語。」</em></p>
</blockquote>
</li>
</ul>
<div class="card">
<h3 id="%E6%A0%B8%E5%BF%83%E6%A6%82%E5%BF%B5%E8%AA%AA%E4%BD%BF%E7%94%A8%E8%80%85%E7%9A%84%E8%A9%B1%E9%81%B5%E5%BE%AA%E6%97%A5%E5%B8%B8%E7%BF%92%E6%85%A3">核心概念：說使用者的話、遵循日常習慣</h3>
<ul>
<li>使用使用者熟悉的日常單詞與概念，避免工程師導向的專業術語。</li>
<li>資訊排列順序應符合現實邏輯與心理模型。</li>
</ul>
<ul>
<li data-marpit-fragment="2"><img class="emoji" draggable="false" alt="👍" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f44d.svg" data-marp-twemoji=""/> <strong>優良實踐</strong> ：「每天食用止痛藥不要超過 4 顆」</li>
<li data-marpit-fragment="3"><img class="emoji" draggable="false" alt="👎" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f44e.svg" data-marp-twemoji=""/> <strong>不良設計</strong> ：「每日乙醯胺酚攝取上限為 2000mg」（過度術語化）</li>
</ul>
</div>
<footer>薛念林 教授 | 逢甲大學資訊工程學系</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="15" data-paginate="true" data-footer="薛念林 教授 | 逢甲大學資訊工程學系" data-header="NS02 與真實世界的對應 (Match Real World)" data-theme="ux-theme" lang="C" data-marpit-pagination="15" style="--paginate:true;--footer:薛念林 教授 | 逢甲大學資訊工程學系;--header:NS02 與真實世界的對應 (Match Real World);--theme:ux-theme;" data-marpit-pagination-total="99" data-transition-back="{&quot;name&quot;:&quot;fade&quot;,&quot;builtinFallback&quot;:true}" data-transition="{&quot;name&quot;:&quot;fade&quot;,&quot;builtinFallback&quot;:true}" data-size="16:9">
<header>NS02 與真實世界的對應 (Match Real World)</header>
<h3 id="ns02-%E6%A1%88%E4%BE%8B%E8%A7%A3%E6%9E%90%E7%89%A9%E7%90%86%E9%9A%B1%E5%96%BB%E8%88%87%E7%9B%B4%E8%A6%BA%E5%B0%8D%E6%87%89">NS02 案例解析：物理隱喻與直覺對應</h3>
<div class="two-columns">
<div class="card" data-marpit-fragment>
<h3 id="%E7%89%A9%E7%90%86%E5%B0%8D%E6%87%89-natural-mapping">物理對應 (Natural Mapping)</h3>
<ul>
<li><strong>瓦斯爐旋鈕</strong> ：控制器的排列位置應與四個爐嘴的空間位置完全一致。</li>
<li><strong>機車方向燈</strong> ：左轉撥左、右轉撥右（若改成上下按鍵將極難直覺對應）。</li>
<li><strong>Tesla 換檔</strong> ：螢幕向上滑前進 (D)、向下滑倒車 (R)、點擊 P 停車。</li>
</ul>
</div>
<div class="card" data-marpit-fragment>
<h3 id="%E4%BA%BA%E6%80%A7%E5%8C%96%E6%8F%90%E7%A4%BA%E5%AD%97">人性化提示字</h3>
<ul>
<li><strong>註冊按鈕</strong> ：不寫生硬的 &quot;Sign Up&quot;，改為「是的，我想立即提升業績！」。</li>
<li><strong>終端機輸入</strong> ：</li>
<li><img class="emoji" draggable="false" alt="👎" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f44e.svg" data-marp-twemoji=""/> <code>press -9 to stop</code> (工程師程式碼邏輯)</li>
<li><img class="emoji" draggable="false" alt="👍" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f44d.svg" data-marp-twemoji=""/> <code>Press STOP to finish</code> (高可讀性日常邏輯)</li>
</ul>
</div>
</div>
<footer>薛念林 教授 | 逢甲大學資訊工程學系</footer>

<header>NS02 與真實世界的對應 (Match Real World)</header>
<h3 id="ai-for-uxns02-%E7%B3%BB%E7%B5%B1%E8%88%87%E7%9C%9F%E5%AF%A6%E4%B8%96%E7%95%8C%E7%9A%84%E5%B0%8D%E7%85%A7-match-between-system--real-world">AI for UX：NS02 系統與真實世界的對照 (Match Between System &amp; Real World)</h3>
<div class="two-columns">
<div class="prompt-box" data-marpit-fragment>
<h3 id="%F0%9F%92%A1-prompt-%E8%A8%AD%E8%A8%88%E6%A1%86%E6%9E%B6-1"><img class="emoji" draggable="false" alt="💡" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4a1.svg" data-marp-twemoji=""/> Prompt 設計框架</h3>
<ul>
<li><strong>角色 (Role)</strong>: 產品經理與資深 UX 設計師。</li>
<li><strong>任務 (Task)</strong>: 撰寫系統操作回饋與付款失敗提示文案。</li>
<li><strong>約束 (Constraint)</strong>: 必須使用日常真實世界語言並提供下一步指引；避免拋出冷冰冰的程式技術術語（如 <code>NullPointerException</code>）。</li>
</ul>
</div>
<div class="prompt-box" data-marpit-fragment>
<h3 id="%F0%9F%93%9D-%E6%8F%90%E7%A4%BA%E8%A9%9E%E7%AF%84%E6%9C%AC-1"><img class="emoji" draggable="false" alt="📝" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4dd.svg" data-marp-twemoji=""/> 提示詞範本</h3>
<blockquote>
<p>你是一位專為電商平台撰寫文案的資深 UX 設計師。當使用者付款失敗時，請寫出友好的提示。 <strong>避免</strong> 使用 &quot;交易異常 403&quot; 或 &quot;Connection timeout&quot; 等技術詞彙，應改用 &quot;目前付款通道繁忙，我們無法完成扣款，請您稍候再試或更換信用卡。&quot; 並提供直接的下一步建議。</p>
</blockquote>
</div>
</div>
<footer>薛念林 教授 | 逢甲大學資訊工程學系</footer>

<header>NS03 使用者擁有控制權 (User Control)</header>

<h2 id="ns03-%E4%BD%BF%E7%94%A8%E8%80%85%E6%93%81%E6%9C%89%E6%8E%A7%E5%88%B6%E6%AC%8A-user-control--freedom">NS03 使用者擁有控制權 (User Control &amp; Freedom)</h2>
<blockquote>
<p><em>“Users often choose system functions by mistake and will need a clearly marked ‘emergency exit’ to leave the unwanted state. Support undo and redo.”</em></p>
</blockquote>
<ul>
<li data-marpit-fragment="1">
<blockquote>
<p><em>「使用者經常會誤觸系統功能，需要一個標示明確的「緊急出口」來離開 <strong>非預期的狀態</strong> 。系統應支援 <strong>復原</strong> (Undo) 與 <strong>重做</strong> (Redo)。」</em></p>
</blockquote>
</li>
</ul>
<div class="card">
<h3 id="%E6%A0%B8%E5%BF%83%E6%A6%82%E5%BF%B5%E6%8F%90%E4%BE%9B%E7%B7%8A%E6%80%A5%E5%87%BA%E5%8F%A3%E8%88%87%E5%8F%8D%E6%82%94%E6%A9%9F%E6%9C%83">核心概念：提供「緊急出口」與反悔機會</h3>
<ul>
<li>使用者經常手滑誤觸功能，系統必須提供顯眼的 <strong>緊急出口</strong> ，無需繁瑣對話框。</li>
<li>必備按鈕：<code>[Back]</code>, <code>[Cancel]</code>, <code>[Close]</code>, <code>[Undo]</code>, <code>[Redo]</code>。</li>
<li><img class="emoji" draggable="false" alt="⚠️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/26a0.svg" data-marp-twemoji=""/> <strong>謹慎使用 [Reset]</strong> ：一鍵清空整個表單容易造成災難性誤刪。</li>
</ul>
</div>
<footer>薛念林 教授 | 逢甲大學資訊工程學系</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="20" data-paginate="true" data-footer="薛念林 教授 | 逢甲大學資訊工程學系" data-header="NS03 使用者擁有控制權 (User Control)" data-theme="ux-theme" lang="C" data-marpit-pagination="20" style="--paginate:true;--footer:薛念林 教授 | 逢甲大學資訊工程學系;--header:NS03 使用者擁有控制權 (User Control);--theme:ux-theme;" data-marpit-pagination-total="99" data-transition-back="{&quot;name&quot;:&quot;fade&quot;,&quot;builtinFallback&quot;:true}" data-transition="{&quot;name&quot;:&quot;fade&quot;,&quot;builtinFallback&quot;:true}" data-size="16:9">
<header>NS03 使用者擁有控制權 (User Control)</header>
<h3 id="ns03-%E6%A1%88%E4%BE%8B%E8%A7%A3%E6%9E%90%E5%B8%B8%E7%94%A8%E7%9A%84%E7%B7%8A%E6%80%A5%E5%87%BA%E5%8F%A3">NS03 案例解析：常用的緊急出口</h3>
<div class="three-columns">
<div class="card" data-marpit-fragment>
<h3 id="undo-%E5%AF%84%E4%BF%A1%E8%88%87%E5%88%AA%E9%99%A4">[Undo] 寄信與刪除</h3>
<ul>
<li>Gmail 寄出信件後，底部浮現 <strong>5 秒內「復原 (Undo)」</strong> 。</li>
<li>丟到垃圾桶時提供反悔復原按鈕。</li>
</ul>
</div>
<div class="card" data-marpit-fragment>
<h3 id="cancel-%E7%95%99%E8%A8%80%E8%88%87%E8%A1%A8%E5%96%AE">[Cancel] 留言與表單</h3>
<ul>
<li>放棄填寫留言時，提供取消按鈕快速回到上一層。</li>
<li>允許中途退出流程而不死鎖畫面。</li>
</ul>
</div>
<div class="card" data-marpit-fragment>
<h3 id="back--close">[Back / Close]</h3>
<ul>
<li>進入錯誤頁面能按 Back 返回。</li>
<li>彈出式廣告或視窗提供明確且容易點擊的 <code>[✕]</code> 關閉鍵。</li>
</ul>
</div>
</div>
<footer>薛念林 教授 | 逢甲大學資訊工程學系</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="21" data-paginate="true" data-footer="薛念林 教授 | 逢甲大學資訊工程學系" data-header="NS03 使用者擁有控制權 (User Control)" data-class="full-img" data-theme="ux-theme" lang="C" class="full-img" data-marpit-pagination="21" style="--paginate:true;--footer:薛念林 教授 | 逢甲大學資訊工程學系;--header:NS03 使用者擁有控制權 (User Control);--class:full-img;--theme:ux-theme;" data-marpit-pagination-total="99" data-transition-back="{&quot;name&quot;:&quot;fade&quot;,&quot;builtinFallback&quot;:true}" data-transition="{&quot;name&quot;:&quot;fade&quot;,&quot;builtinFallback&quot;:true}" data-size="16:9">

</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="22" data-paginate="true" data-footer="薛念林 教授 | 逢甲大學資訊工程學系" data-header="NS03 使用者擁有控制權 (User Control)" data-theme="ux-theme" lang="C" data-marpit-pagination="22" style="--paginate:true;--footer:薛念林 教授 | 逢甲大學資訊工程學系;--header:NS03 使用者擁有控制權 (User Control);--theme:ux-theme;" data-marpit-pagination-total="99" data-transition-back="{&quot;name&quot;:&quot;fade&quot;,&quot;builtinFallback&quot;:true}" data-transition="{&quot;name&quot;:&quot;fade&quot;,&quot;builtinFallback&quot;:true}" data-size="16:9">
<header>NS03 使用者擁有控制權 (User Control)</header>
<h3 id="ai-for-uxns03-%E4%BD%BF%E7%94%A8%E8%80%85%E6%8E%A7%E5%88%B6%E8%88%87%E8%87%AA%E7%94%B1-user-control--freedom">AI for UX：NS03 使用者控制與自由 (User Control &amp; Freedom)</h3>
<div class="two-columns">
<div class="prompt-box" data-marpit-fragment>
<h3 id="%F0%9F%92%A1-prompt-%E8%A8%AD%E8%A8%88%E6%A1%86%E6%9E%B6-2"><img class="emoji" draggable="false" alt="💡" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4a1.svg" data-marp-twemoji=""/> Prompt 設計框架</h3>
<ul>
<li><strong>角色 (Role)</strong>: 互動設計師。</li>
<li><strong>任務 (Task)</strong>: 設計操作誤觸時的「緊急出口」與反悔機制。</li>
<li><strong>約束 (Constraint)</strong>: 必須提供顯眼的 Undo 撤銷或取消機制；避免強迫使用者走完流程或無反悔退路。</li>
</ul>
</div>
<div class="prompt-box" data-marpit-fragment>
<h3 id="%F0%9F%93%9D-%E6%8F%90%E7%A4%BA%E8%A9%9E%E7%AF%84%E6%9C%AC-2"><img class="emoji" draggable="false" alt="📝" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4dd.svg" data-marp-twemoji=""/> 提示詞範本</h3>
<blockquote>
<p>你是一位網頁互動設計師。當使用者在行事曆上拖拉並移動會議時間後，請設計一個 Toast 提示框，包含 &quot;已將會議移動至 10:00&quot; 以及一個明顯的 &quot;復原 (Undo)&quot; 按鈕，讓使用者能在 5 秒內一鍵撤銷剛才的移動。避免讓使用者必須手動把會議拖拉回去。</p>
</blockquote>
</div>
</div>
<footer>薛念林 教授 | 逢甲大學資訊工程學系</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="23" data-paginate="true" data-footer="薛念林 教授 | 逢甲大學資訊工程學系" data-header="NS03 使用者擁有控制權 (User Control)" data-class="full-img" data-theme="ux-theme" lang="C" class="full-img" data-marpit-pagination="23" style="--paginate:true;--footer:薛念林 教授 | 逢甲大學資訊工程學系;--header:NS03 使用者擁有控制權 (User Control);--class:full-img;--theme:ux-theme;" data-marpit-pagination-total="99" data-transition-back="{&quot;name&quot;:&quot;fade&quot;,&quot;builtinFallback&quot;:true}" data-transition="{&quot;name&quot;:&quot;fade&quot;,&quot;builtinFallback&quot;:true}" data-size="16:9">

<p><img src="../../img/ns_ai_03.jpg" alt="" /></p>

</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="24" data-marpit-fragments="3" data-paginate="true" data-footer="薛念林 教授 | 逢甲大學資訊工程學系" data-header="NS04 一致的風格與標準 (Consistency)" data-theme="ux-theme" lang="C" data-marpit-pagination="24" style="--paginate:true;--footer:薛念林 教授 | 逢甲大學資訊工程學系;--header:NS04 一致的風格與標準 (Consistency);--theme:ux-theme;" data-marpit-pagination-total="99" data-transition-back="{&quot;name&quot;:&quot;fade&quot;,&quot;builtinFallback&quot;:true}" data-transition="{&quot;name&quot;:&quot;fade&quot;,&quot;builtinFallback&quot;:true}" data-size="16:9">
<header>NS04 一致的風格與標準 (Consistency)</header>

<h2 id="ns04-%E4%B8%80%E8%87%B4%E7%9A%84%E9%A2%A8%E6%A0%BC%E8%88%87%E6%A8%99%E6%BA%96-consistency--standards">NS04 一致的風格與標準 (Consistency &amp; Standards)</h2>
<blockquote>
<p><em>“Users should not have to wonder whether different words, situations, or actions mean the same thing. Follow platform conventions.”</em></p>
</blockquote>
<ul>
<li data-marpit-fragment="1">
<blockquote>
<p><em>「使用者不應懷疑不同的用詞、情境或操作是否代表同一件事。系統應遵循平台與業界既定 <strong>慣例</strong> 。」</em></p>
</blockquote>
</li>
</ul>
<div class="card">
<h3 id="%E6%A0%B8%E5%BF%83%E6%A6%82%E5%BF%B5%E9%99%8D%E4%BD%8E%E5%AD%B8%E7%BF%92%E6%88%90%E6%9C%AC">核心概念：降低學習成本</h3>
<ul>
<li data-marpit-fragment="2"><strong>內部一致性</strong> ：同一系統或產品家族內，文字、按鈕顏色、圖示與排版風格保持統一。</li>
<li data-marpit-fragment="3"><strong>外部一致性</strong> ：遵循平台與業界既定慣例（如 iOS HIG, Material Design, <code>Ctrl+C</code> 複製）。</li>
</ul>
</div>
<footer>薛念林 教授 | 逢甲大學資訊工程學系</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="25" data-marpit-fragments="2" data-paginate="true" data-footer="薛念林 教授 | 逢甲大學資訊工程學系" data-header="NS04 一致的風格與標準 (Consistency)" data-theme="ux-theme" lang="C" data-marpit-pagination="25" style="--paginate:true;--footer:薛念林 教授 | 逢甲大學資訊工程學系;--header:NS04 一致的風格與標準 (Consistency);--theme:ux-theme;" data-marpit-pagination-total="99" data-transition-back="{&quot;name&quot;:&quot;fade&quot;,&quot;builtinFallback&quot;:true}" data-transition="{&quot;name&quot;:&quot;fade&quot;,&quot;builtinFallback&quot;:true}" data-size="16:9">
<header>NS04 一致的風格與標準 (Consistency)</header>
<h3 id="ns04-%E6%A1%88%E4%BE%8B%E8%A7%A3%E6%9E%90%E4%B8%8D%E4%B8%80%E8%87%B4%E5%B8%B6%E4%BE%86%E7%9A%84%E6%B7%B7%E4%BA%82">NS04 案例解析：不一致帶來的混亂</h3>
<div class="two-columns">
<div class="card" data-marpit-fragment>
<h3 id="%E7%94%A8%E8%A9%9E%E4%B8%8D%E4%B8%80%E8%87%B4">用詞不一致</h3>
<ul>
<li>同一個操作在不同頁面寫成：<br />
<code>[提交]</code>、<code>[Submit]</code>、<code>[確認]</code>、<code>[OK]</code>、<code>[Done]</code></li>
</ul>
<ul>
<li data-marpit-fragment="1">使用者會懷疑功能是否不同。</li>
</ul>
</div>
<div class="card" data-marpit-fragment>
<h3 id="%E7%A9%BA%E9%96%93%E8%A8%98%E6%86%B6%E7%A0%B4%E5%A3%9E-spatial-memory">空間記憶破壞 (Spatial Memory)</h3>
<ul>
<li>「確認」與「取消」按鈕在不同彈窗 <strong>忽左忽右</strong> 。</li>
<li>確認按鈕的顏色一下藍、一下綠、一下紅。</li>
</ul>
<ul>
<li data-marpit-fragment="2">使用者容易手快誤按。</li>
</ul>
</div>
</div>
<footer>薛念林 教授 | 逢甲大學資訊工程學系</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="26" data-paginate="true" data-footer="薛念林 教授 | 逢甲大學資訊工程學系" data-header="NS04 一致的風格與標準 (Consistency)" data-theme="ux-theme" lang="C" data-marpit-pagination="26" style="--paginate:true;--footer:薛念林 教授 | 逢甲大學資訊工程學系;--header:NS04 一致的風格與標準 (Consistency);--theme:ux-theme;" data-marpit-pagination-total="99" data-transition-back="{&quot;name&quot;:&quot;fade&quot;,&quot;builtinFallback&quot;:true}" data-transition="{&quot;name&quot;:&quot;fade&quot;,&quot;builtinFallback&quot;:true}" data-size="16:9">
<header>NS04 一致的風格與標準 (Consistency)</header>
<h3 id="ai-for-uxns04-%E4%B8%80%E8%87%B4%E6%80%A7%E8%88%87%E6%A8%99%E6%BA%96-consistency--standards">AI for UX：NS04 一致性與標準 (Consistency &amp; Standards)</h3>
<div class="two-columns">
<div class="prompt-box" data-marpit-fragment>
<h3 id="%F0%9F%92%A1-prompt-%E8%A8%AD%E8%A8%88%E6%A1%86%E6%9E%B6-3"><img class="emoji" draggable="false" alt="💡" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4a1.svg" data-marp-twemoji=""/> Prompt 設計框架</h3>
<ul>
<li><strong>角色 (Role)</strong>: UI/UX 專家。</li>
<li><strong>任務 (Task)</strong>: 規範全系統之按鈕命名、色彩語意、圖示與操作手勢。</li>
<li><strong>約束 (Constraint)</strong>: 必須遵循平台通用慣例與專案設計系統；避免同一動作在不同頁面使用 <strong>歧異名稱</strong> 。</li>
</ul>
</div>
<div class="prompt-box" data-marpit-fragment>
<h3 id="%F0%9F%93%9D-%E6%8F%90%E7%A4%BA%E8%A9%9E%E7%AF%84%E6%9C%AC-3"><img class="emoji" draggable="false" alt="📝" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4dd.svg" data-marp-twemoji=""/> 提示詞範本</h3>
<blockquote>
<p>你是一位 UI/UX 專家。請為我們的 SaaS 後台檢視所有的確認動作。請統一使用 &quot;確定&quot; 作為主按鈕文字，並套用綠色（#10b981）語意；取消動作一律使用 &quot;取消&quot; 灰色按鈕。避免在部分頁面使用 &quot;送出&quot;、&quot;確認&quot; 等混淆命名，確保全站一致性。</p>
</blockquote>
</div>
</div>
<footer>薛念林 教授 | 逢甲大學資訊工程學系</footer>
</section>

</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="28" data-marpit-fragments="4" data-paginate="true" data-footer="薛念林 教授 | 逢甲大學資訊工程學系" data-header="NS05 錯誤預防 (Error Prevention)" data-theme="ux-theme" lang="C" data-marpit-pagination="28" style="--paginate:true;--footer:薛念林 教授 | 逢甲大學資訊工程學系;--header:NS05 錯誤預防 (Error Prevention);--theme:ux-theme;" data-marpit-pagination-total="99" data-transition-back="{&quot;name&quot;:&quot;fade&quot;,&quot;builtinFallback&quot;:true}" data-transition="{&quot;name&quot;:&quot;fade&quot;,&quot;builtinFallback&quot;:true}" data-size="16:9">
<header>NS05 錯誤預防 (Error Prevention)</header>

<h2 id="ns05-%E9%8C%AF%E8%AA%A4%E9%A0%90%E9%98%B2-error-prevention">NS05 錯誤預防 (Error Prevention)</h2>
<blockquote>
<p><em>“Even better than good error messages is a careful design which prevents a problem from occurring in the first place.”</em></p>
</blockquote>
<ul>
<li data-marpit-fragment="1">
<blockquote>
<p><em>「比優秀的錯誤訊息更理想的，是一開始就防患於未然、 <strong>防止問題發生</strong> 的謹慎設計。」</em></p>
</blockquote>
</li>
</ul>
<div class="card">
<h3 id="%E6%A0%B8%E5%BF%83%E6%A6%82%E5%BF%B5%E9%A0%90%E9%98%B2%E5%8B%9D%E6%96%BC%E6%B2%BB%E7%99%82">核心概念：預防勝於治療</h3>
<ul>
<li>比「友善的報錯訊息」更優秀的是： <strong>一開始就設計成不可能犯錯</strong> ！</li>
</ul>
<ul>
<li data-marpit-fragment="2">策略一： <strong>限制輸入條件（Constraints）</strong> （如禁用過去日期、只能輸入數字）。</li>
<li data-marpit-fragment="3">策略二： <strong>危險操作二次確認（Confirmation）</strong> （不可逆刪除需再次確認）。</li>
<li data-marpit-fragment="4">策略三： <strong>智慧提醒與預測</strong> （如偵測到內文寫「附件」卻未上傳檔案時主動提醒）。</li>
</ul>
</div>
<footer>薛念林 教授 | 逢甲大學資訊工程學系</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="29" data-paginate="true" data-footer="薛念林 教授 | 逢甲大學資訊工程學系" data-header="NS05 錯誤預防 (Error Prevention)" data-theme="ux-theme" lang="C" data-marpit-pagination="29" style="--paginate:true;--footer:薛念林 教授 | 逢甲大學資訊工程學系;--header:NS05 錯誤預防 (Error Prevention);--theme:ux-theme;" data-marpit-pagination-total="99" data-transition-back="{&quot;name&quot;:&quot;fade&quot;,&quot;builtinFallback&quot;:true}" data-transition="{&quot;name&quot;:&quot;fade&quot;,&quot;builtinFallback&quot;:true}" data-size="16:9">
<header>NS05 錯誤預防 (Error Prevention)</header>
<h3 id="ns05-%E6%A1%88%E4%BE%8B%E8%A7%A3%E6%9E%90%E8%A1%A8%E5%96%AE%E9%98%B2%E5%91%86%E8%88%87%E5%8D%B3%E6%99%82%E7%B4%84%E6%9D%9F">NS05 案例解析：表單防呆與即時約束</h3>
<div class="two-columns">
<div class="card" data-marpit-fragment>
<h3 id="%E8%A1%A8%E5%96%AE%E8%BC%B8%E5%85%A5%E5%B1%AC%E6%80%A7%E9%98%B2%E5%91%86">表單輸入屬性防呆</h3>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-html"><span class="hljs-tag">&lt;<span class="hljs-name">label</span> <span class="hljs-attr">for</span>=<span class="hljs-string">&quot;weight&quot;</span>&gt;</span>Weight (kg):<span class="hljs-tag">&lt;/<span class="hljs-name">label</span>&gt;</span>
<span class="hljs-tag">&lt;<span class="hljs-name">input</span> <span class="hljs-attr">type</span>=<span class="hljs-string">&quot;number&quot;</span> <span class="hljs-attr">id</span>=<span class="hljs-string">&quot;weight&quot;</span> 
 <span class="hljs-attr">name</span>=<span class="hljs-string">&quot;weight&quot;</span> <span class="hljs-attr">value</span>=<span class="hljs-string">&quot;60&quot;</span> 
 <span class="hljs-attr">min</span>=<span class="hljs-string">&quot;30&quot;</span> <span class="hljs-attr">max</span>=<span class="hljs-string">&quot;300&quot;</span> <span class="hljs-attr">required</span>&gt;</span>
</code></pre>
<ul>
<li>限制只能輸入數值，並設定合理的範圍 <code>[30, 300]</code>，防止輸入負數或異常數字。</li>
</ul>
</div>
<div class="card" data-marpit-fragment>
<h3 id="%E9%97%9C%E9%8D%B5%E6%93%8D%E4%BD%9C%E7%A2%BA%E8%AA%8D">關鍵操作確認</h3>
<ul>
<li><img class="emoji" draggable="false" alt="⚠️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/26a0.svg" data-marp-twemoji=""/> <code>你確認要刪除此帳號嗎？資料將無法復原。</code></li>
<li><img class="emoji" draggable="false" alt="⚠️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/26a0.svg" data-marp-twemoji=""/> <code>您似乎在信中提到了附件，但尚未添加附件，確定要傳送嗎？</code></li>
<li>密碼設定時，即時顯示 8 碼英數混合之驗證狀態條。</li>
</ul>
</div>
</div>
<footer>薛念林 教授 | 逢甲大學資訊工程學系</footer>
</section>

<header>NS05 錯誤預防 (Error Prevention)</header>
<h3 id="ai-for-uxns05-%E9%8C%AF%E8%AA%A4%E9%A0%90%E9%98%B2-error-prevention">AI for UX：NS05 錯誤預防 (Error Prevention)</h3>
<div class="two-columns">
<div class="prompt-box" data-marpit-fragment>
<h3 id="%F0%9F%92%A1-prompt-%E8%A8%AD%E8%A8%88%E6%A1%86%E6%9E%B6-4"><img class="emoji" draggable="false" alt="💡" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4a1.svg" data-marp-twemoji=""/> Prompt 設計框架</h3>
<ul>
<li><strong>角色 (Role)</strong>: 資深系統架構師與防呆專家。</li>
<li><strong>任務 (Task)</strong>: 設計破壞性操作與表單輸入的錯誤預防機制。</li>
<li><strong>約束 (Constraint)</strong>: 必須在錯誤發生前即時防禦（如輸入驗證、二次確認輸入名稱）；避免事後才拋出報錯警告。</li>
</ul>
</div>
<div class="prompt-box" data-marpit-fragment>
<h3 id="%F0%9F%93%9D-%E6%8F%90%E7%A4%BA%E8%A9%9E%E7%AF%84%E6%9C%AC-4"><img class="emoji" draggable="false" alt="📝" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4dd.svg" data-marp-twemoji=""/> 提示詞範本</h3>
<blockquote>
<p>你是一位系統防呆專家。請設計此專案的安全機制。當使用者點擊刪除時，不要直接執行，而是彈出一個二次確認視窗，要求使用者手動輸入專案名稱（例如輸入 &quot;MyProject&quot;）才能啟用刪除按鈕。避免讓使用者因誤觸按鈕而導致資料遺失，同時要偵測檢查可能的誤用狀況。</p>
</blockquote>
</div>
</div>
<footer>薛念林 教授 | 逢甲大學資訊工程學系</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="32" data-paginate="true" data-footer="薛念林 教授 | 逢甲大學資訊工程學系" data-header="NS05 錯誤預防 (Error Prevention)" data-class="full-img" data-theme="ux-theme" lang="C" class="full-img" data-marpit-pagination="32" style="--paginate:true;--footer:薛念林 教授 | 逢甲大學資訊工程學系;--header:NS05 錯誤預防 (Error Prevention);--class:full-img;--theme:ux-theme;" data-marpit-pagination-total="99" data-transition-back="{&quot;name&quot;:&quot;fade&quot;,&quot;builtinFallback&quot;:true}" data-transition="{&quot;name&quot;:&quot;fade&quot;,&quot;builtinFallback&quot;:true}" data-size="16:9">

</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="33" data-paginate="true" data-footer="薛念林 教授 | 逢甲大學資訊工程學系" data-header="NS05 錯誤預防 (Error Prevention)" data-theme="ux-theme" lang="C" data-marpit-pagination="33" style="--paginate:true;--footer:薛念林 教授 | 逢甲大學資訊工程學系;--header:NS05 錯誤預防 (Error Prevention);--theme:ux-theme;" data-marpit-pagination-total="99" data-transition-back="{&quot;name&quot;:&quot;fade&quot;,&quot;builtinFallback&quot;:true}" data-transition="{&quot;name&quot;:&quot;fade&quot;,&quot;builtinFallback&quot;:true}" data-size="16:9">
<header>NS05 錯誤預防 (Error Prevention)</header>

<h3 id="%F0%9F%99%8B-%E6%A6%82%E5%BF%B5%E6%A0%B8%E5%B0%8D%E5%95%8F%E7%AD%94-ccq1"><img class="emoji" draggable="false" alt="🙋" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f64b.svg" data-marp-twemoji=""/> 概念核對問答 (CCQ1)</h3>
<div class="two-columns-64">
<div class="card">
<h3 id="%E9%8C%AF%E8%AA%A4%E9%A0%90%E9%98%B2-ns05">錯誤預防 (NS05)</h3>
<p><strong>[ 是 / 否 ]</strong></p>
<blockquote>
<p>「為了徹底落實錯誤預防，系統在使用者執行『任何』可能修改資料的操作（包括編輯個人暱稱、切換深色模式）時，都強制彈出確認視窗要求點擊『確定修改』，這是兼顧安全性與可用性的最佳實踐。」</p>
</blockquote>
<p><a href="https://nlhsueh.github.io/nickedupocket/#/student/ux-ch02-ccq1">線上作答</a></p>
</div>
<div class="card-img">
<p><a href="https://nlhsueh.github.io/nickedupocket/#/student/ux-ch02-ccq1" target="_blank"><img src="../../img/ch02/ux-ch02-ccq1.png" alt="QR Code" style="max-height: 280px;" /></a></p>
</div>
</div>
<footer>薛念林 教授 | 逢甲大學資訊工程學系</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="34" data-marpit-fragments="3" data-paginate="true" data-footer="薛念林 教授 | 逢甲大學資訊工程學系" data-header="NS06 易於識別而非記憶 (Recognition)" data-theme="ux-theme" lang="C" data-marpit-pagination="34" style="--paginate:true;--footer:薛念林 教授 | 逢甲大學資訊工程學系;--header:NS06 易於識別而非記憶 (Recognition);--theme:ux-theme;" data-marpit-pagination-total="99" data-transition-back="{&quot;name&quot;:&quot;fade&quot;,&quot;builtinFallback&quot;:true}" data-transition="{&quot;name&quot;:&quot;fade&quot;,&quot;builtinFallback&quot;:true}" data-size="16:9">
<header>NS06 易於識別而非記憶 (Recognition)</header>

<h2 id="ns06-%E6%98%93%E6%96%BC%E8%AD%98%E5%88%A5%E8%80%8C%E9%9D%9E%E8%A8%98%E6%86%B6-recognition-rather-than-recall">NS06 易於識別而非記憶 (Recognition Rather Than Recall)</h2>
<blockquote>
<p><em>“Minimize the user’s memory load by making objects, actions, and options visible. Instructions should be easily retrievable.”</em></p>
</blockquote>
<ul>
<li data-marpit-fragment="1">
<blockquote>
<p><em>「藉由讓物件、操作與選項清晰可見，最大程度減輕使用者的 <strong>記憶負荷</strong> 。操作說明應隨處易於檢索。」</em></p>
</blockquote>
</li>
</ul>
<div class="card">
<h3 id="%E6%A0%B8%E5%BF%83%E6%A6%82%E5%BF%B5%E7%9C%8B%E5%88%B0%E5%B0%B1%E9%81%B8%E4%B8%8D%E8%A6%81%E8%80%83%E9%A9%97%E5%A4%A7%E8%85%A6%E8%A8%98%E6%86%B6">核心概念：看到就選，不要考驗大腦記憶</h3>
<ul>
<li>選擇題遠比問答題容易：</li>
<li><img class="emoji" draggable="false" alt="👎" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f44e.svg" data-marp-twemoji=""/> 「葡萄牙的首都是哪座城市？」（需提取記憶 Recall）</li>
</ul>
<ul>
<li data-marpit-fragment="2"><img class="emoji" draggable="false" alt="👍" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f44d.svg" data-marp-twemoji=""/> 「里斯本是葡萄牙的首都嗎？」（只需辨識 Recognition）</li>
<li data-marpit-fragment="3">操作指引與選項隨處可見，使用者不需要在各畫面間切換記憶。</li>
</ul>
</div>
<footer>薛念林 教授 | 逢甲大學資訊工程學系</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="35" data-paginate="true" data-footer="薛念林 教授 | 逢甲大學資訊工程學系" data-header="NS06 易於識別而非記憶 (Recognition)" data-theme="ux-theme" lang="C" data-marpit-pagination="35" style="--paginate:true;--footer:薛念林 教授 | 逢甲大學資訊工程學系;--header:NS06 易於識別而非記憶 (Recognition);--theme:ux-theme;" data-marpit-pagination-total="99" data-transition-back="{&quot;name&quot;:&quot;fade&quot;,&quot;builtinFallback&quot;:true}" data-transition="{&quot;name&quot;:&quot;fade&quot;,&quot;builtinFallback&quot;:true}" data-size="16:9">
<header>NS06 易於識別而非記憶 (Recognition)</header>
<h3 id="ns06-%E6%A1%88%E4%BE%8B%E8%A7%A3%E6%9E%90%E9%99%8D%E4%BD%8E%E8%AA%8D%E7%9F%A5%E8%B2%A0%E6%93%94">NS06 案例解析：降低認知負擔</h3>
<div class="three-columns">
<div class="card" data-marpit-fragment>
<h3 id="%E6%90%9C%E5%B0%8B%E9%97%9C%E9%8D%B5%E5%AD%97%E4%BF%9D%E7%95%99">搜尋關鍵字保留</h3>
<ul>
<li>搜尋結果頁上方保留剛剛輸入的關鍵字：<br />
<code>&quot;user experience design&quot;</code><br />
讓使用者不必費心記憶。</li>
</ul>
</div>
<div class="card" data-marpit-fragment>
<h3 id="apple-%E7%94%A2%E5%93%81%E8%A6%8F%E6%A0%BC%E6%AF%94%E8%BC%83%E8%A1%A8">Apple 產品規格比較表</h3>
<ul>
<li>iPad Pro / Air / Mini 並列比較螢幕、晶片、鏡頭規格。</li>
<li>消除跨頁對比記憶負擔。</li>
</ul>
</div>
<div class="card" data-marpit-fragment>
<h3 id="%E5%B7%B2%E6%8B%9C%E8%A8%AA%E9%80%A3%E7%B5%90%E8%AE%8A%E8%89%B2">已拜訪連結變色</h3>
<ul>
<li>搜尋引擎將已點擊過的連結以紫色標示。</li>
<li>清楚識別拜訪記錄。</li>
</ul>
</div>
</div>
<footer>薛念林 教授 | 逢甲大學資訊工程學系</footer>
</section>

<header>NS06 易於識別而非記憶 (Recognition)</header>
<h3 id="ai-for-uxns06-%E8%BE%A8%E8%AD%98%E8%80%8C%E9%9D%9E%E5%9B%9E%E6%86%B6-recognition-rather-than-recall">AI for UX：NS06 辨識而非回憶 (Recognition Rather Than Recall)</h3>
<div class="two-columns">
<div class="prompt-box" data-marpit-fragment>
<h3 id="%F0%9F%92%A1-prompt-%E8%A8%AD%E8%A8%88%E6%A1%86%E6%9E%B6-5"><img class="emoji" draggable="false" alt="💡" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4a1.svg" data-marp-twemoji=""/> Prompt 設計框架</h3>
<ul>
<li><strong>角色 (Role)</strong>: 認知心理學與介面設計專家。</li>
<li><strong>任務 (Task)</strong>: 設計搜尋與表單選單以降低使用者的記憶負荷。</li>
<li><strong>約束 (Constraint)</strong>: 必須將歷史紀錄與選項外顯化（如自動完成、最近搜尋）；避免考驗使用者回想之前的輸入。</li>
</ul>
</div>
<div class="prompt-box" data-marpit-fragment>
<h3 id="%F0%9F%93%9D-%E6%8F%90%E7%A4%BA%E8%A9%9E%E7%AF%84%E6%9C%AC-5"><img class="emoji" draggable="false" alt="📝" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4dd.svg" data-marp-twemoji=""/> 提示詞範本</h3>
<blockquote>
<p>你是一位介面設計師。當使用者點擊搜尋框時，請顯示一個浮動視窗，列出 &quot;最近搜尋項目&quot; 與 &quot;熱門推薦標籤&quot;，讓使用者可以直接點擊。避免讓使用者必須自己去回想上一次輸入的關鍵字。</p>
</blockquote>
</div>
</div>
<footer>薛念林 教授 | 逢甲大學資訊工程學系</footer>
</section>

</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="40" data-marpit-fragments="4" data-paginate="true" data-footer="薛念林 教授 | 逢甲大學資訊工程學系" data-header="NS07 彈性與使用效率 (Efficiency)" data-theme="ux-theme" lang="C" data-marpit-pagination="40" style="--paginate:true;--footer:薛念林 教授 | 逢甲大學資訊工程學系;--header:NS07 彈性與使用效率 (Efficiency);--theme:ux-theme;" data-marpit-pagination-total="99" data-transition-back="{&quot;name&quot;:&quot;fade&quot;,&quot;builtinFallback&quot;:true}" data-transition="{&quot;name&quot;:&quot;fade&quot;,&quot;builtinFallback&quot;:true}" data-size="16:9">
<header>NS07 彈性與使用效率 (Efficiency)</header>

<h2 id="ns07-%E5%BD%88%E6%80%A7%E8%88%87%E4%BD%BF%E7%94%A8%E6%95%88%E7%8E%87-flexibility-and-efficiency-of-use">NS07 彈性與使用效率 (Flexibility and Efficiency of Use)</h2>
<blockquote>
<p><em>“Accelerators — unseen by the novice user — may often speed up the interaction for the expert user. Allow users to tailor frequent actions.”</em></p>
</blockquote>
<ul>
<li data-marpit-fragment="1">
<blockquote>
<p><em>「新手不易察覺的『加速器』能大幅提升專家的操作效率。系統應允許使用者 <strong>自訂</strong> 與 <strong>快捷</strong> 常用操作。」</em></p>
</blockquote>
</li>
</ul>
<div class="card">
<h3 id="%E6%A0%B8%E5%BF%83%E6%A6%82%E5%BF%B5%E6%96%B0%E6%89%8B%E5%A5%BD%E4%B8%8A%E6%89%8B%E5%B0%88%E5%AE%B6%E6%9B%B4%E8%BF%85%E9%80%9F">核心概念：新手好上手，專家更迅速</h3>
<ul>
<li>系統應兼顧新手與資深使用者的需求。</li>
</ul>
<ul>
<li data-marpit-fragment="2"><strong>加速器（Accelerators）</strong> ：提供鍵盤快捷鍵、自訂巨集、右鍵快顯功能。</li>
<li data-marpit-fragment="3"><strong>個人化 (Personalization)</strong> ：系統依據使用者歷史行為自動調整（如推薦片單）。</li>
<li data-marpit-fragment="4"><strong>客製化 (Customization)</strong> ：使用者自主調整偏好設定（如 VS Code / Gmail 設定）。</li>
</ul>
</div>
<footer>薛念林 教授 | 逢甲大學資訊工程學系</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="41" data-paginate="true" data-footer="薛念林 教授 | 逢甲大學資訊工程學系" data-header="NS07 彈性與使用效率 (Efficiency)" data-theme="ux-theme" lang="C" data-marpit-pagination="41" style="--paginate:true;--footer:薛念林 教授 | 逢甲大學資訊工程學系;--header:NS07 彈性與使用效率 (Efficiency);--theme:ux-theme;" data-marpit-pagination-total="99" data-transition-back="{&quot;name&quot;:&quot;fade&quot;,&quot;builtinFallback&quot;:true}" data-transition="{&quot;name&quot;:&quot;fade&quot;,&quot;builtinFallback&quot;:true}" data-size="16:9">
<header>NS07 彈性與使用效率 (Efficiency)</header>
<h3 id="ns07-%E6%A1%88%E4%BE%8B%E8%A7%A3%E6%9E%90%E5%BF%AB%E6%8D%B7%E9%8D%B5%E8%88%87%E5%80%8B%E4%BA%BA%E5%8C%96%E8%A8%AD%E5%AE%9A">NS07 案例解析：快捷鍵與個人化設定</h3>
<div class="two-columns">
<div class="card" data-marpit-fragment>
<h3 id="%E5%BF%AB%E6%8D%B7%E9%8D%B5%E8%88%87%E5%BF%AB%E6%8D%B7%E6%89%8B%E5%8B%A2">快捷鍵與快捷手勢</h3>
<ul>
<li>Instagram 雙擊照片快速點讚 <img class="emoji" draggable="false" alt="❤️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/2764.svg" data-marp-twemoji=""/></li>
<li>終端機與 IDE 的程式碼片段 (Code Snippets)</li>
<li>簡易計算機一鍵切換成科學計算機</li>
</ul>
</div>
<div class="card" data-marpit-fragment>
<h3 id="%E5%80%8B%E4%BA%BA%E5%8C%96-vs-%E5%AE%A2%E8%A3%BD%E5%8C%96">個人化 vs 客製化</h3>
<ul>
<li><strong>個人化</strong> ：依角色顯示不同面板（管理者 vs 學生），或智慧推薦。</li>
<li><strong>客製化</strong> ：自訂最愛工具列、深色模式切換、批次選取操作。</li>
</ul>
</div>
</div>
<footer>薛念林 教授 | 逢甲大學資訊工程學系</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="42" data-paginate="true" data-footer="薛念林 教授 | 逢甲大學資訊工程學系" data-header="NS07 彈性與使用效率 (Efficiency)" data-class="full-img" data-theme="ux-theme" lang="C" class="full-img" data-marpit-pagination="42" style="--paginate:true;--footer:薛念林 教授 | 逢甲大學資訊工程學系;--header:NS07 彈性與使用效率 (Efficiency);--class:full-img;--theme:ux-theme;" data-marpit-pagination-total="99" data-transition-back="{&quot;name&quot;:&quot;fade&quot;,&quot;builtinFallback&quot;:true}" data-transition="{&quot;name&quot;:&quot;fade&quot;,&quot;builtinFallback&quot;:true}" data-size="16:9">

<header>NS07 彈性與使用效率 (Efficiency)</header>
<h3 id="ai-for-uxns07-%E4%BD%BF%E7%94%A8%E7%9A%84%E5%BD%88%E6%80%A7%E8%88%87%E6%95%88%E7%8E%87-flexibility--efficiency-of-use">AI for UX：NS07 使用的彈性與效率 (Flexibility &amp; Efficiency of Use)</h3>

<li><strong>約束 (Constraint)</strong>: 必須提供加速器（如快捷鍵、批次操作、自訂範本）；避免所有操作皆須逐步點擊而降低效率。</li>

<header>NS08 優雅簡潔的設計 (Minimalist)</header>

<h2 id="ns08-%E5%84%AA%E9%9B%85%E7%B0%A1%E6%BD%94%E7%9A%84%E8%A8%AD%E8%A8%88-aesthetic--minimalist-design">NS08 優雅簡潔的設計 (Aesthetic &amp; Minimalist Design)</h2>
<blockquote>
<p><em>“Dialogues should not contain information which is irrelevant or rarely needed. Every extra unit of information diminishes relative visibility.”</em></p>
</blockquote>
<ul>
<li data-marpit-fragment="1">
<blockquote>
<p><em>「對話框與介面不應包含 <strong>不相關</strong> 或 <strong>極少需要</strong> 的資訊。每一筆多餘的資訊單位，都會削弱 <strong>重要資訊</strong> 的相對可見度。」</em></p>
</blockquote>
</li>
</ul>
<div class="card">
<h3 id="%E6%A0%B8%E5%BF%83%E6%A6%82%E5%BF%B5%E5%B0%91%E5%8D%B3%E6%98%AF%E5%A4%9A%E6%B6%88%E6%BB%85%E8%A6%96%E8%A6%BA%E5%99%AA%E9%9F%B3">核心概念：少即是多，消滅視覺噪音</h3>
<ul>
<li>對話框與頁面不應包含不相關或極低頻率的訊息。</li>
</ul>
<ul>
<li data-marpit-fragment="2">每多一個多餘元素，都會削弱重要資訊的可見度。</li>
<li data-marpit-fragment="3"><strong>以圖表取代冗長文字</strong> ，使用精準用詞，適度留白。</li>
</ul>
</div>
<footer>薛念林 教授 | 逢甲大學資訊工程學系</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="46" data-paginate="true" data-footer="薛念林 教授 | 逢甲大學資訊工程學系" data-header="NS08 優雅簡潔的設計 (Minimalist)" data-theme="ux-theme" lang="C" data-marpit-pagination="46" style="--paginate:true;--footer:薛念林 教授 | 逢甲大學資訊工程學系;--header:NS08 優雅簡潔的設計 (Minimalist);--theme:ux-theme;" data-marpit-pagination-total="99" data-transition-back="{&quot;name&quot;:&quot;fade&quot;,&quot;builtinFallback&quot;:true}" data-transition="{&quot;name&quot;:&quot;fade&quot;,&quot;builtinFallback&quot;:true}" data-size="16:9">
<header>NS08 優雅簡潔的設計 (Minimalist)</header>
<h3 id="ns08-%E6%A1%88%E4%BE%8B%E8%A7%A3%E6%9E%90%E6%A5%B5%E7%B0%A1%E4%B8%BB%E7%BE%A9%E7%9A%84%E5%8A%9B%E9%87%8F">NS08 案例解析：極簡主義的力量</h3>
<div class="two-columns">
<div class="card" data-marpit-fragment>
<h3 id="google-%E6%90%9C%E5%B0%8B%E9%A6%96%E9%A0%81">Google 搜尋首頁</h3>
<ul>
<li>首頁只有中央乾淨的搜尋框與 Logo，極度專注。</li>
<li>簡約不代表功能簡單，背後需要更強大的智慧技術支持。</li>
<li>網址列直接兼具搜尋功能。</li>
</ul>
</div>
<div class="card" data-marpit-fragment>
<h3 id="%E6%BC%B8%E9%80%B2%E5%BC%8F%E9%81%B8%E5%96%AE%E8%88%87%E5%9C%96%E8%A1%A8%E8%A6%96%E8%A6%BA%E5%8C%96">漸進式選單與圖表視覺化</h3>
<ul>
<li>首頁僅呈現核心指標，點擊後才展開細部進階功能。</li>
<li>健康資訊以視覺化圓餅圖或柱狀圖呈現，一目了然。</li>
</ul>
</div>
</div>
<footer>薛念林 教授 | 逢甲大學資訊工程學系</footer>
</section>

<header>NS08 優雅簡潔的設計 (Minimalist)</header>
<h3 id="ai-for-uxns08-%E6%A5%B5%E7%B0%A1%E8%88%87%E7%BE%8E%E8%A7%80%E8%A8%AD%E8%A8%88-aesthetic--minimalist-design">AI for UX：NS08 極簡與美觀設計 (Aesthetic &amp; Minimalist Design)</h3>
<div class="two-columns">
<div class="prompt-box" data-marpit-fragment>
<h3 id="%F0%9F%92%A1-prompt-%E8%A8%AD%E8%A8%88%E6%A1%86%E6%9E%B6-7"><img class="emoji" draggable="false" alt="💡" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4a1.svg" data-marp-twemoji=""/> Prompt 設計框架</h3>
<ul>
<li><strong>角色 (Role)</strong>: 視覺傳達與 UI 設計師。</li>
<li><strong>任務 (Task)</strong>: 重新梳理儀表板介面以達成簡潔優雅的資訊架構。</li>
<li><strong>約束 (Constraint)</strong>: 必須保留足夠留白並收納 80% 次要低頻數據；避免單一畫面塞入過量圖表造成 <strong>視覺噪音</strong> 。</li>
</ul>
</div>
<div class="prompt-box" data-marpit-fragment>
<h3 id="%F0%9F%93%9D-%E6%8F%90%E7%A4%BA%E8%A9%9E%E7%AF%84%E6%9C%AC-7"><img class="emoji" draggable="false" alt="📝" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4dd.svg" data-marp-twemoji=""/> 提示詞範本</h3>
<blockquote>
<p>你是一位追求極簡主義的 UI 設計師。請重新設計這個儀表板。請過濾掉 80% 的次要監控數據，僅保留最重要的 3 個指標，並使用大字體與大量的留白（White Space）。其餘次要數據應收納至 &quot;詳細報告&quot; 展開按鈕中。避免把所有圖表和數字擠在同一頁。</p>
</blockquote>
</div>
</div>
<footer>薛念林 教授 | 逢甲大學資訊工程學系</footer>

<header>NS08 優雅簡潔的設計 (Minimalist)</header>

<h3 id="%F0%9F%99%8B-%E6%A6%82%E5%BF%B5%E6%A0%B8%E5%B0%8D%E5%95%8F%E7%AD%94-ccq2"><img class="emoji" draggable="false" alt="🙋" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f64b.svg" data-marp-twemoji=""/> 概念核對問答 (CCQ2)</h3>
<div class="two-columns-64">
<div class="card">
<h3 id="%E7%B0%A1%E6%BD%94%E8%A8%AD%E8%A8%88-ns08">簡潔設計 (NS08)</h3>
<p><strong>[ 是 / 否 ]</strong></p>
<blockquote>
<p>「為了實現極致簡潔的視覺體驗，將資料表格中的操作按鈕（編輯/刪除/下載）全數隱藏，改為僅在使用者將滑鼠 Hover 懸停於該列時才浮現，這在所有裝置與情境下都是最推薦的做法。」</p>
</blockquote>
<p><a href="https://nlhsueh.github.io/nickedupocket/#/student/ux-ch02-ccq2">線上作答</a></p>
</div>
<div class="card-img">

</div>
</div>

</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="52" data-marpit-fragments="6" data-paginate="true" data-footer="薛念林 教授 | 逢甲大學資訊工程學系" data-header="NS09 清楚的錯誤處理 (Recover Errors)" data-theme="ux-theme" lang="C" data-marpit-pagination="52" style="--paginate:true;--footer:薛念林 教授 | 逢甲大學資訊工程學系;--header:NS09 清楚的錯誤處理 (Recover Errors);--theme:ux-theme;" data-marpit-pagination-total="99" data-transition-back="{&quot;name&quot;:&quot;fade&quot;,&quot;builtinFallback&quot;:true}" data-transition="{&quot;name&quot;:&quot;fade&quot;,&quot;builtinFallback&quot;:true}" data-size="16:9">
<header>NS09 清楚的錯誤處理 (Recover Errors)</header>

<h2 id="ns09-%E6%B8%85%E6%A5%9A%E7%9A%84%E9%8C%AF%E8%AA%A4%E8%99%95%E7%90%86-help-users-recover-from-errors">NS09 清楚的錯誤處理 (Help Users Recover from Errors)</h2>
<blockquote>
<p><em>“Error messages should be expressed in plain language (no codes), precisely indicate the problem, and constructively suggest a solution.”</em></p>
</blockquote>
<ul>
<li data-marpit-fragment="1">
<blockquote>
<p><em>「錯誤訊息應以 <strong>通俗直白</strong> 的語言表達（不顯示難懂的錯誤碼），精準指出問題所在，並提出 <strong>建設性</strong> 的解決方案。」</em></p>
</blockquote>
</li>
</ul>
<div class="card">
<h3 id="%E6%A0%B8%E5%BF%83%E6%A6%82%E5%BF%B5%E9%80%9A%E4%BF%97%E8%AA%9E%E8%A8%80%E7%B2%BE%E6%BA%96%E5%AE%9A%E4%BD%8D%E5%BB%BA%E8%A8%AD%E6%80%A7%E5%BB%BA%E8%AD%B0">核心概念：通俗語言、精準定位、建設性建議</h3>
<ul>
<li data-marpit-fragment="2"><strong>明晰的 (Explicit)</strong> ：有錯誤必須明確提示，不能默默失敗。</li>
<li data-marpit-fragment="3"><strong>精準的 (Precise)</strong> ：指出究竟是哪個環節出錯。</li>
<li data-marpit-fragment="4"><strong>白話文 (Readable)</strong> ：嚴禁向一般使用者丟出 <code>Error 0x80070057</code> 或 <code>SQL Exception</code>。</li>
<li data-marpit-fragment="5"><strong>客氣有禮 (Polite)</strong> ：不要責怪使用者。</li>
<li data-marpit-fragment="6"><strong>具建設性 (Constructive)</strong> ：給予明確的下一步修復方案。</li>
</ul>
</div>
<footer>薛念林 教授 | 逢甲大學資訊工程學系</footer>

<header>NS09 清楚的錯誤處理 (Recover Errors)</header>
<h3 id="ai-for-uxns09-%E5%8D%94%E5%8A%A9%E4%BD%BF%E7%94%A8%E8%80%85%E8%BE%A8%E8%AD%98%E8%A8%BA%E6%96%B7%E4%B8%A6%E5%BE%9E%E9%8C%AF%E8%AA%A4%E4%B8%AD%E5%BE%A9%E5%8E%9F-help-users-recognize-diagnose--recover-from-errors">AI for UX：NS09 協助使用者辨識、診斷並從錯誤中復原 (Help Users Recognize, Diagnose, &amp; Recover from Errors)</h3>
<div class="two-columns">
<div class="prompt-box" data-marpit-fragment>
<h3 id="%F0%9F%92%A1-prompt-%E8%A8%AD%E8%A8%88%E6%A1%86%E6%9E%B6-8"><img class="emoji" draggable="false" alt="💡" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4a1.svg" data-marp-twemoji=""/> Prompt 設計框架</h3>
<ul>
<li><strong>角色 (Role)</strong>: 客服體驗與 UX 技術 Writer。</li>
<li><strong>任務 (Task)</strong>: 撰寫系統異常與操作失敗時的錯誤提示文案。</li>
<li><strong>約束 (Constraint)</strong>: 必須以白話文清楚說明原因並給予具體解決步驟；避免僅顯示模糊錯誤碼（如 <code>0x80070005</code>）。</li>
</ul>
</div>
<div class="prompt-box" data-marpit-fragment>
<h3 id="%F0%9F%93%9D-%E6%8F%90%E7%A4%BA%E8%A9%9E%E7%AF%84%E6%9C%AC-8"><img class="emoji" draggable="false" alt="📝" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4dd.svg" data-marp-twemoji=""/> 提示詞範本</h3>
<blockquote>
<p>你是一位軟體易用性專家。請重寫上傳檔案失敗的錯誤提示。如果使用者上傳了不支援的格式（如 PDF，而系統只接受 PNG/JPG），請顯示：&quot;上傳失敗：不支援此檔案格式。我們只接受 PNG 或 JPG 格式（最大 5MB）。請將您的檔案轉檔後重新上傳，或點此 [查看支援格式說明] 連結。&quot; 避免使用 &quot;Format invalid&quot; 這種無建設性的文字。</p>
</blockquote>
</div>
</div>
<footer>薛念林 教授 | 逢甲大學資訊工程學系</footer>

<div class="two-columns-64">
<div class="card">
<h3 id="%E2%9D%93-api-%E4%BE%8B%E5%A4%96%E8%99%95%E7%90%86%E8%88%87%E4%BD%BF%E7%94%A8%E8%80%85%E6%84%9F%E7%9F%A5-ns09"><img class="emoji" draggable="false" alt="❓" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/2753.svg" data-marp-twemoji=""/> API 例外處理與使用者感知 (NS09)</h3>

<blockquote>
<p>「在要求 AI 生成前端資料請求組件時，提示詞明確要求『當 API 發生 500 伺服器錯誤時，必須使用 <code>try...catch</code> 捕捉並在控制台輸出 <code>console.error(err)</code>』，在軟體工程與 UX 層面上已完整滿足了 NS09（協助辨識與復原錯誤）的要求。」</p>

<h2 id="ns10-%E8%AA%AA%E6%98%8E%E8%88%87%E6%96%87%E4%BB%B6-help-and-documentation">NS10 說明與文件 (Help and Documentation)</h2>
<blockquote>
<p><em>“Even though it is better if the system can be used without documentation, it may be necessary to provide help and documentation. It should be easy to search and list concrete steps.”</em></p>
</blockquote>
<ul>
<li data-marpit-fragment="1">
<blockquote>
<p><em>「雖然理想的系統最好不需說明文件即可直覺使用，但仍有必要提供說明與文件。這些文件應易於搜尋，並列出具體的執行步驟。」</em></p>
</blockquote>
</li>
</ul>
<div class="card">
<h3 id="%E6%A0%B8%E5%BF%83%E6%A6%82%E5%BF%B5%E6%98%93%E6%96%BC%E6%AA%A2%E7%B4%A2%E5%B0%88%E6%B3%A8%E4%BB%BB%E5%8B%99%E6%AD%A5%E9%A9%9F%E5%85%B7%E9%AB%94">核心概念：易於檢索、專注任務、步驟具體</h3>
<ul>
<li>最理想的系統是無須說明就能直覺使用，但針對複雜業務仍需具備完善說明。</li>
</ul>
<ul>
<li data-marpit-fragment="2"><strong>被動式協助</strong> ：使用者有疑問時可搜尋的 Help Center / FAQ。</li>
<li data-marpit-fragment="3"><strong>主動式協助</strong> ：新功能/新手導覽、多樣化樣板 (Templates)。</li>
<li data-marpit-fragment="4"><img class="emoji" draggable="false" alt="⚠️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/26a0.svg" data-marp-twemoji=""/> <strong>避免多餘的干擾導覽</strong> （例如在極度直覺的日曆新增介面彈出長篇教學）。</li>
</ul>
</div>
<footer>薛念林 教授 | 逢甲大學資訊工程學系</footer>

<header>NS10 說明與文件 (Help &amp; Docs)</header>
<h3 id="ai-for-uxns10-%E8%AA%AA%E6%98%8E%E6%96%87%E4%BB%B6%E8%88%87%E8%BC%94%E5%8A%A9%E8%AA%AA%E6%98%8E-help--documentation">AI for UX：NS10 說明文件與輔助說明 (Help &amp; Documentation)</h3>
<div class="two-columns">
<div class="prompt-box" data-marpit-fragment>
<h3 id="%F0%9F%92%A1-prompt-%E8%A8%AD%E8%A8%88%E6%A1%86%E6%9E%B6-9"><img class="emoji" draggable="false" alt="💡" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4a1.svg" data-marp-twemoji=""/> Prompt 設計框架</h3>
<ul>
<li><strong>角色 (Role)</strong>: 技術寫作與引導設計專家。</li>
<li><strong>任務 (Task)</strong>: 為複雜功能設計情境式步驟導覽與常見問答索引。</li>
<li><strong>約束 (Constraint)</strong>: 必須簡明、任務導向且隨處易檢索；避免提供冗長無趣的整本手冊或缺乏情境說明。</li>
</ul>
</div>
<div class="prompt-box" data-marpit-fragment>
<h3 id="%F0%9F%93%9D-%E6%8F%90%E7%A4%BA%E8%A9%9E%E7%AF%84%E6%9C%AC-9"><img class="emoji" draggable="false" alt="📝" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4dd.svg" data-marp-twemoji=""/> 提示詞範本</h3>
<blockquote>
<p>你是一位新手引導設計專家。請為我們的 [智慧報稅系統] 設計一個系統說明的引導方案。當使用者首次進入『薪資申報』頁面時，設計一個輕量級的步驟引導 (Walkthrough Tooltip) 說明如何匯入扣繳憑單，並提供常見問答連結，避免拋出冗長的說明書讓使用者自己閱讀。</p>
</blockquote>
</div>
</div>

<header>尼爾森 10 大原則總結對照</header>

<h2 id="%E5%B0%BC%E7%88%BE%E6%A3%AE-10-%E5%A4%A7%E5%8F%AF%E7%94%A8%E6%80%A7%E5%8E%9F%E5%89%87%E7%B8%BD%E7%B5%90%E5%B0%8D%E7%85%A7%E8%A1%A8">尼爾森 10 大可用性原則總結對照表</h2>
<table>
<thead>
<tr>
<th style="text-align:center">代號</th>
<th style="text-align:center">原則名稱</th>
<th style="text-align:left">核心目標</th>
<th style="text-align:left">典型範例</th>
</tr>
</thead>
<tbody>
<tr>
<td style="text-align:center"><strong>NS01</strong></td>
<td style="text-align:center">清楚的系統狀態</td>
<td style="text-align:left">消除等待焦慮，進度即時反饋</td>
<td style="text-align:left">上傳進度條、Loading 動畫</td>
</tr>
<tr>
<td style="text-align:center"><strong>NS02</strong></td>
<td style="text-align:center">與真實世界對應</td>
<td style="text-align:left">使用通俗語言與物理隱喻</td>
<td style="text-align:left">丟入垃圾桶、日常詞彙</td>
</tr>
<tr>
<td style="text-align:center"><strong>NS03</strong></td>
<td style="text-align:center">使用者擁有控制權</td>
<td style="text-align:left">提供反悔機會與緊急出口</td>
<td style="text-align:left">Undo 復原、Cancel 取消</td>
</tr>
<tr>
<td style="text-align:center"><strong>NS04</strong></td>
<td style="text-align:center">一致的風格與標準</td>
<td style="text-align:left">降低學習成本，排版用詞統一</td>
<td style="text-align:left">遵循 iOS/Material 慣例</td>
</tr>
<tr>
<td style="text-align:center"><strong>NS05</strong></td>
<td style="text-align:center">錯誤預防</td>
<td style="text-align:left">預防勝於治療，輸入防呆</td>
<td style="text-align:left">禁用過去日期、刪除確認</td>
</tr>
<tr>
<td style="text-align:center"><strong>NS06</strong></td>
<td style="text-align:center">易於識別而非記憶</td>
<td style="text-align:left">降低認知負擔，看到即選</td>
<td style="text-align:left">歷史搜尋記號、產品比較表</td>
</tr>
<tr>
<td style="text-align:center"><strong>NS07</strong></td>
<td style="text-align:center">彈性與使用效率</td>
<td style="text-align:left">兼顧新手與資深用戶速度</td>
<td style="text-align:left">鍵盤快捷鍵、批次操作</td>
</tr>
<tr>
<td style="text-align:center"><strong>NS08</strong></td>
<td style="text-align:center">優雅簡潔的設計</td>
<td style="text-align:left">消除干擾資訊，強調核心重點</td>
<td style="text-align:left">Google 極簡首頁、圖表化</td>
</tr>
<tr>
<td style="text-align:center"><strong>NS09</strong></td>
<td style="text-align:center">清楚的錯誤處理</td>
<td style="text-align:left">白話說明問題並給予復原指引</td>
<td style="text-align:left">附帶重設連結的密碼報錯</td>
</tr>
<tr>
<td style="text-align:center"><strong>NS10</strong></td>
<td style="text-align:center">適當的說明與文件</td>
<td style="text-align:left">任務導向教學，易於檢索搜尋</td>
<td style="text-align:left">步驟引導、豐富樣板庫</td>
</tr>
</tbody>
</table>
<footer>薛念林 教授 | 逢甲大學資訊工程學系</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="64" data-marpit-scope-XjelOuzw="" data-paginate="true" data-footer="薛念林 教授 | 逢甲大學資訊工程學系" data-header="尼爾森 10 大原則總結對照" data-theme="ux-theme" lang="C" data-marpit-pagination="64" style="--paginate:true;--footer:薛念林 教授 | 逢甲大學資訊工程學系;--header:尼爾森 10 大原則總結對照;--theme:ux-theme;" data-marpit-pagination-total="99" data-transition-back="{&quot;name&quot;:&quot;fade&quot;,&quot;builtinFallback&quot;:true}" data-transition="{&quot;name&quot;:&quot;fade&quot;,&quot;builtinFallback&quot;:true}" data-size="16:9">
<header>尼爾森 10 大原則總結對照</header>
<h2 id="%E4%BA%92%E5%8B%95%E5%B0%8E%E5%BC%95%E6%96%9C%E7%B7%9A%E6%8C%87%E4%BB%A4%E5%AF%A6%E6%88%B0-antigravity%E8%87%AA%E4%B8%BB%E6%8E%A8%E9%80%B2%E8%88%87%E7%B6%93%E9%A9%97%E5%9B%BA%E5%8C%96%E6%87%89%E7%94%A8">互動導引：斜線指令實戰 (Antigravity自主推進與經驗固化應用)</h2>
<div class="two-columns">
<div class="card" data-marpit-fragment>
<h3 id="%F0%9F%8E%AF-goal%E8%87%AA%E4%B8%BB%E9%95%B7%E4%BB%BB%E5%8B%99%E6%8E%A8%E9%80%B2"><img class="emoji" draggable="false" alt="🎯" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f3af.svg" data-marp-twemoji=""/> <code>/goal</code>：自主長任務推進</h3>
<ul>
<li><strong>核心機制</strong> ：給定高階目標，Agent 自主展開多步驟推演、跨檔案重構、排錯與驗證，直到徹底達標。</li>
<li><strong>實戰指令範例</strong> ：</li>
<li><strong>全站表單與元件防呆健檢 (NS01, NS05)</strong></li>
</ul>
 <div class="cmd-box">/goal 走查整站結帳流程，替所有送出按鈕補齊防連點 Disabled 與 Loading 狀態，並加入斷線重試機制。</div>
<ul>
<li><strong>WCAG AA 無障礙體驗升級</strong></li>
</ul>
 <div class="cmd-box">/goal 掃描全站導覽與對話框，補齊 ARIA 標籤與鍵盤焦點輪廓 (Focus Ring)，確保純鍵盤可順暢操作。</div>
<ul>
<li><strong>設計系統全域變數重構 (NS04)</strong></li>
</ul>
 <div class="cmd-box">/goal 依據 tokens.css，將寫死 hex 色碼全面替換為語意化變數，並自動驗證深淺色切換對比度。</div>
</div>
<div class="card" data-marpit-fragment>
<h3 id="%F0%9F%A7%A0-learn%E7%B6%93%E9%A9%97%E5%9B%BA%E5%8C%96%E8%88%87%E8%A6%8F%E7%AF%84%E6%B2%89%E6%BE%B1"><img class="emoji" draggable="false" alt="🧠" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f9e0.svg" data-marp-twemoji=""/> <code>/learn</code>：經驗固化與規範沉澱</h3>
<ul>
<li><strong>核心機制</strong> ：當人類在對話中糾正 Agent 或確立偏好時，下達 <code>/learn</code> 將經驗沉澱為全專案的長期記憶與規範。</li>
<li><strong>實戰指令範例</strong> ：</li>
<li><strong>軟體工程與專業術語規範</strong></li>
</ul>
 <div class="cmd-box">/learn 本教材遵循臺灣繁體中文規範，嚴格禁用「代碼」，一律改用「程式碼」，錯誤碼與狀態碼除外。</div>
<ul>
<li><strong>UX 與視覺排版一致性 (NS04)</strong></li>
</ul>
 <div class="cmd-box">/learn 尼爾森 10 大可用性原則總結對照表表格請置中（投影片內所有 Markdown 表格一律強制水平置中）。</div>
<ul>
<li><strong>破壞性操作防呆準則 (NS05)</strong></li>
</ul>
 <div class="cmd-box">/learn 凡涉及刪除、清空或覆蓋操作，前端一律必須彈出二次確認 Modal，且危險按鈕需以警示紅標註。</div>
</div>
</div>
<footer>薛念林 教授 | 逢甲大學資訊工程學系</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="65" data-paginate="true" data-footer="薛念林 教授 | 逢甲大學資訊工程學系" data-header="尼爾森 10 大原則總結對照" data-theme="ux-theme" lang="C" data-marpit-pagination="65" style="--paginate:true;--footer:薛念林 教授 | 逢甲大學資訊工程學系;--header:尼爾森 10 大原則總結對照;--theme:ux-theme;" data-marpit-pagination-total="99" data-transition-back="{&quot;name&quot;:&quot;fade&quot;,&quot;builtinFallback&quot;:true}" data-transition="{&quot;name&quot;:&quot;fade&quot;,&quot;builtinFallback&quot;:true}" data-size="16:9">
<header>尼爾森 10 大原則總結對照</header>

<h3 id="%F0%9F%99%8B-%E6%A6%82%E5%BF%B5%E6%A0%B8%E5%B0%8D%E5%95%8F%E7%AD%94-ccq4"><img class="emoji" draggable="false" alt="🙋" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f64b.svg" data-marp-twemoji=""/> 概念核對問答 (CCQ4)</h3>
<div class="two-columns-64">
<div class="card">
<h3 id="%E5%B0%BC%E7%88%BE%E6%A3%AE%E5%8E%9F%E5%89%87%E7%B6%9C%E5%90%88%E4%BA%A4%E5%8F%89%E6%87%89%E7%94%A8">尼爾森原則綜合交叉應用</h3>
<p>電商結帳頁在輸入信用卡時，自動依卡號長度在每 4 碼插入空格（<code>4111 2222 3333 4444</code>），並在辨識出卡別後即時於右側點亮 Visa 圖示。這項設計最直接體現了哪兩項原則的結合？</p>
<ul>
<li><strong>(A)</strong> NS05 (錯誤預防) 與 NS06 (易於識別而非記憶)</li>
<li><strong>(B)</strong> NS03 (控制權) 與 NS07 (彈性與使用效率)</li>
<li><strong>(C)</strong> NS04 (一致性) 與 NS09 (清楚的錯誤處理)</li>
<li><strong>(D)</strong> NS08 (優雅簡潔的設計) 與 NS10 (適當的說明與文件)</li>
</ul>
<p><a href="https://nlhsueh.github.io/nickedupocket/#/student/ux-ch02-ccq3">線上作答</a></p>
</div>
<div class="card-img">
<p><a href="https://nlhsueh.github.io/nickedupocket/#/student/ux-ch02-ccq3" target="_blank"><img src="../../img/ch02/ux-ch02-ccq3.png" alt="QR Code" style="max-height: 280px;" /></a></p>
</div>
</div>
<footer>薛念林 教授 | 逢甲大學資訊工程學系</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="66" data-paginate="true" data-footer="薛念林 教授 | 逢甲大學資訊工程學系" data-header="尼爾森 10 大原則總結對照" data-theme="ux-theme" lang="C" data-marpit-pagination="66" style="--paginate:true;--footer:薛念林 教授 | 逢甲大學資訊工程學系;--header:尼爾森 10 大原則總結對照;--theme:ux-theme;" data-marpit-pagination-total="99" data-transition-back="{&quot;name&quot;:&quot;fade&quot;,&quot;builtinFallback&quot;:true}" data-transition="{&quot;name&quot;:&quot;fade&quot;,&quot;builtinFallback&quot;:true}" data-size="16:9">
<header>尼爾森 10 大原則總結對照</header>

<h3 id="%F0%9F%99%8B-%E6%A6%82%E5%BF%B5%E6%A0%B8%E5%B0%8D%E5%95%8F%E7%AD%94-ccq5"><img class="emoji" draggable="false" alt="🙋" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f64b.svg" data-marp-twemoji=""/> 概念核對問答 (CCQ5)</h3>
<div class="two-columns-64">
<div class="card">
<h3 id="%E5%B0%BC%E7%88%BE%E6%A3%AE%E5%8E%9F%E5%89%87%E7%B6%9C%E5%90%88%E4%BA%A4%E5%8F%89%E6%87%89%E7%94%A8-1">尼爾森原則綜合交叉應用</h3>
<p>使用者在 Gmail 內文提及「如附件企劃書」，但在未附加檔案時點擊「傳送」，系統即時攔截並提示：<em>「您提及了附件但未附加檔案，是否仍要傳送？」</em> ，並提供「取消」與「直接傳送」。這最直接體現了哪兩項原則的結合？</p>
<ul>
<li><strong>(A)</strong> NS05 (錯誤預防) 與 NS03 (使用者控制與自由)</li>
<li><strong>(B)</strong> NS01 (系統狀態能見度) 與 NS08 (優雅簡潔的設計)</li>
<li><strong>(C)</strong> NS02 (與真實世界對應) 與 NS06 (易於識別而非記憶)</li>
<li><strong>(D)</strong> NS04 (一致性與標準) 與 NS10 (適當的說明與文件)</li>
</ul>
<p><a href="https://nlhsueh.github.io/nickedupocket/#/student/ux-ch02-ccq4">線上作答</a></p>
</div>
<div class="card-img">
<p><a href="https://nlhsueh.github.io/nickedupocket/#/student/ux-ch02-ccq4" target="_blank"><img src="../../img/ch02/ux-ch02-ccq4.png" alt="QR Code" style="max-height: 280px;" /></a></p>
</div>
</div>
<footer>薛念林 教授 | 逢甲大學資訊工程學系</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="67" data-paginate="true" data-footer="薛念林 教授 | 逢甲大學資訊工程學系" data-header="尼爾森 10 大原則總結對照" data-theme="ux-theme" lang="C" data-marpit-pagination="67" style="--paginate:true;--footer:薛念林 教授 | 逢甲大學資訊工程學系;--header:尼爾森 10 大原則總結對照;--theme:ux-theme;" data-marpit-pagination-total="99" data-transition-back="{&quot;name&quot;:&quot;fade&quot;,&quot;builtinFallback&quot;:true}" data-transition="{&quot;name&quot;:&quot;fade&quot;,&quot;builtinFallback&quot;:true}" data-size="16:9">
<header>尼爾森 10 大原則總結對照</header>

<h3 id="%F0%9F%99%8B-%E6%A6%82%E5%BF%B5%E6%A0%B8%E5%B0%8D%E5%95%8F%E7%AD%94-ccq6"><img class="emoji" draggable="false" alt="🙋" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f64b.svg" data-marp-twemoji=""/> 概念核對問答 (CCQ6)</h3>
<div class="two-columns-64">
<div class="card">
<h3 id="%E2%9D%93-%E9%AB%98%E4%BF%9D%E7%9C%9F%E6%8F%90%E7%A4%BA%E8%A9%9E%E7%9A%84%E5%A4%9A%E7%B6%AD%E5%BA%A6-ux-%E7%B4%84%E6%9D%9F"><img class="emoji" draggable="false" alt="❓" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/2753.svg" data-marp-twemoji=""/> 高保真提示詞的多維度 UX 約束</h3>
<p>在要求 AI 生成「多步驟註冊表單」時，以下哪一段提示詞最能同時滿足 <strong>NS01 (狀態)</strong> 、 <strong>NS03 (控制權)</strong> 與 <strong>NS05 (錯誤預防)</strong> ？</p>
<ul>
<li><strong>(A)</strong> 「請用 React + Tailwind 寫一個美觀的註冊表單，支援深色模式。」</li>
<li><strong>(B)</strong> 「提供步驟進度條；每步均有『上一步』且保留資料；欄位 blur 時即時驗證並禁用未過關的『下一步』按鈕。」</li>
<li><strong>(C)</strong> 「表單最後提供送出按鈕，送出失敗時彈出 Toast <code>Submission failed</code>。」</li>
<li><strong>(D)</strong> 「使用 LocalStorage 快取所有欄位，並提供一鍵重設按鈕。」</li>
</ul>
<p><a href="https://nlhsueh.github.io/nickedupocket/#/student/ux-ch03-ccq2">線上作答</a></p>
</div>
<div class="card-img">
<p><a href="https://nlhsueh.github.io/nickedupocket/#/student/ux-ch03-ccq2" target="_blank"><img src="../../img/ch03/ux-ch03-ccq2.png" alt="QR Code" style="max-height: 280px;" /></a></p>
</div>
</div>
<footer>薛念林 教授 | 逢甲大學資訊工程學系</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="68" data-paginate="true" data-footer="薛念林 教授 | 逢甲大學資訊工程學系" data-header="課堂遊戲：尼爾森原則闖關挑戰" data-theme="ux-theme" lang="C" data-marpit-pagination="68" style="--paginate:true;--footer:薛念林 教授 | 逢甲大學資訊工程學系;--header:課堂遊戲：尼爾森原則闖關挑戰;--theme:ux-theme;" data-marpit-pagination-total="99" data-transition-back="{&quot;name&quot;:&quot;fade&quot;,&quot;builtinFallback&quot;:true}" data-transition="{&quot;name&quot;:&quot;fade&quot;,&quot;builtinFallback&quot;:true}" data-size="16:9">
<header>課堂遊戲：尼爾森原則闖關挑戰</header>

<h2 id="%F0%9F%99%8B-%E8%AA%B2%E5%A0%82%E9%81%8A%E6%88%B2%E5%B0%BC%E7%88%BE%E6%A3%AE-10-%E5%A4%A7%E5%8E%9F%E5%89%87%E9%97%96%E9%97%9C%E5%A4%A7%E6%8C%91%E6%88%B0-game01"><img class="emoji" draggable="false" alt="🙋" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f64b.svg" data-marp-twemoji=""/> 課堂遊戲：尼爾森 10 大原則闖關大挑戰 (Game01)</h2>
<div class="two-columns-64">
<div class="card">
<h3 id="%F0%9F%8F%86-%E9%81%8A%E6%88%B2%E4%BB%BB%E5%8B%99%E8%AA%AA%E6%98%8E"><img class="emoji" draggable="false" alt="🏆" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f3c6.svg" data-marp-twemoji=""/> 遊戲任務說明</h3>
