<header>課程大綱與核心概念</header>
<h2 id="%E8%AC%9B%E7%BE%A9%E5%A4%A7%E7%B6%B1">講義大綱</h2>
<div class="two-columns">
<div class="card" data-marpit-fragment>
<h3 id="%F0%9F%8E%AF-%E5%89%8D%E5%8D%8A%E9%83%A8%E8%A7%80%E5%BF%B5%E8%88%87%E5%B7%A5%E5%85%B7%E8%A7%A3%E6%9E%90"><img class="emoji" draggable="false" alt="🎯" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f3af.svg" data-marp-twemoji=""/> 前半部：觀念與工具解析</h3>
<ul>
<li><strong>Part 1: 為什麼前期確認 (Early Validation) 是關鍵？</strong>
<ul>
<li>軟體開發的「溝通代溝」</li>
<li>1-10-100 成本法則</li>
<li>雛形層次：從 Low-fi 到 High-fi 可操作程式碼</li>
</ul>
</li>
<li><strong>Part 2: 現代 AI 雛形生成工具深度盤點</strong>
<ul>
<li>程式碼互動型：<code>v0.dev</code>、<code>Lovable</code>、<code>Bolt.new</code></li>
<li>設計畫布型：<code>Uizard</code>、<code>Galileo AI</code>、<code>Relume</code></li>
<li>輕量預覽型：<code>Claude Artifacts</code>、<code>ChatGPT Canvas</code></li>
</ul>
</li>
</ul>
</div>
<div class="card" data-marpit-fragment>
<h3 id="%F0%9F%9A%80-%E5%BE%8C%E5%8D%8A%E9%83%A8%E6%B5%81%E7%A8%8B%E8%88%87%E5%AF%A6%E6%88%B0%E6%87%89%E7%94%A8"><img class="emoji" draggable="false" alt="🚀" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f680.svg" data-marp-twemoji=""/> 後半部：流程與實戰應用</h3>
<ul>
<li><strong>Part 3: AI 驅動的 UI/UX 前期確認作業流程</strong>
<ul>
<li>需求梳理與 User Story 提取</li>
<li>資訊架構 (IA) 與線框圖快速成型</li>
<li>結合尼爾森原則的啟發式走查 (Walkthrough)</li>
<li>利害關係人實機體驗與 5 分鐘即時迭代</li>
</ul>
</li>
<li><strong>Part 4: 實戰 Prompt 技巧與避坑指南</strong>
<ul>
<li>高保真 Prototyping Prompt 撰寫公式</li>
<li>實務練習：15 分鐘建立互動借還書系統</li>
</ul>
</li>
</ul>
</div>
</div>
<footer>薛念林 教授 | 逢甲大學資訊工程學系</footer>

<header>Part 1: 為什麼前期確認是關鍵？</header>

<h1 id="part-1-%E7%82%BA%E4%BB%80%E9%BA%BC%E5%89%8D%E6%9C%9F%E7%A2%BA%E8%AA%8D%E6%98%AF%E9%97%9C%E9%8D%B5">Part 1: 為什麼前期確認是關鍵？</h1>
<h2 id="%E5%BE%9E%E7%9C%8B%E6%96%87%E5%AD%97%E6%86%91%E7%A9%BA%E6%83%B3%E5%83%8F%E5%88%B0%E5%8B%95%E6%89%8B%E6%93%8D%E4%BD%9C%E7%9C%9F%E5%AF%A6%E9%AB%94%E9%A9%97">從「看文字憑空想像」到「動手操作真實體驗」</h2>
<footer>薛念林 教授 | 逢甲大學資訊工程學系</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="5" data-paginate="true" data-footer="薛念林 教授 | 逢甲大學資訊工程學系" data-header="Part 1: 為什麼前期確認是關鍵？" data-theme="ux-theme" lang="C" data-marpit-pagination="5" style="--paginate:true;--footer:薛念林 教授 | 逢甲大學資訊工程學系;--header:Part 1: 為什麼前期確認是關鍵？;--theme:ux-theme;" data-marpit-pagination-total="40" data-transition-back="{&quot;name&quot;:&quot;fade&quot;,&quot;builtinFallback&quot;:true}" data-transition="{&quot;name&quot;:&quot;fade&quot;,&quot;builtinFallback&quot;:true}" data-size="16:9">
<header>Part 1: 為什麼前期確認是關鍵？</header>
<h2 id="%E5%82%B3%E7%B5%B1%E8%BB%9F%E9%AB%94%E9%96%8B%E7%99%BC%E7%9A%84%E6%BA%9D%E9%80%9A%E4%BB%A3%E6%BA%9D">傳統軟體開發的「溝通代溝」</h2>
<div class="two-columns">
<div class="card" data-marpit-fragment>
<h3 id="%E5%82%B3%E7%B5%B1%E7%80%91%E5%B8%83%E6%88%96%E5%8F%A3%E9%A0%AD%E6%BA%9D%E9%80%9A%E6%A8%A1%E5%BC%8F">傳統瀑布或口頭溝通模式</h3>
<ul>
<li><img class="emoji" draggable="false" alt="📝" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4dd.svg" data-marp-twemoji=""/> <strong>需求規格書 (PRD)</strong> ：厚達數十頁的抽象文字與流程圖。</li>
<li><img class="emoji" draggable="false" alt="🗣️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f5e3.svg" data-marp-twemoji=""/> <strong>客戶/使用者</strong> ：「我看文字覺得都可以，做出來再看看。」</li>
<li><img class="emoji" draggable="false" alt="💻" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4bb.svg" data-marp-twemoji=""/> <strong>工程團隊</strong> ：埋頭苦幹 3 個月，依照規格逐條實作。</li>
<li><img class="emoji" draggable="false" alt="💥" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4a5.svg" data-marp-twemoji=""/> <strong>交付成果 Demo</strong> ：「這跟我當初想像的完全不一樣！按鈕怎麼在這裡？操作太反人類了！」</li>
</ul>
</div>
<div class="card" data-marpit-fragment>
<h3 id="%E5%82%B3%E7%B5%B1%E6%BA%9D%E9%80%9A%E5%B8%B6%E4%BE%86%E7%9A%84%E5%B7%A8%E5%A4%A7%E7%97%9B%E9%BB%9E">傳統溝通帶來的巨大痛點</h3>
<ul>
<li><strong>文字的語意歧義</strong> ：每個人對「友善的搜尋介面」定義不同。</li>
<li><strong>無法預測實際互動</strong> ：看不到資料載入延遲、表單欄位跳轉、錯誤訊息位置。</li>
<li><strong>修改成本隨時間呈指數級上升</strong> ：後期的任何介面變動都伴隨資料庫與後端邏輯的重構。</li>
</ul>
</div>
</div>
<footer>薛念林 教授 | 逢甲大學資訊工程學系</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="6" data-paginate="true" data-footer="薛念林 教授 | 逢甲大學資訊工程學系" data-header="Part 1: 為什麼前期確認是關鍵？" data-theme="ux-theme" lang="C" data-marpit-pagination="6" style="--paginate:true;--footer:薛念林 教授 | 逢甲大學資訊工程學系;--header:Part 1: 為什麼前期確認是關鍵？;--theme:ux-theme;" data-marpit-pagination-total="40" data-transition-back="{&quot;name&quot;:&quot;fade&quot;,&quot;builtinFallback&quot;:true}" data-transition="{&quot;name&quot;:&quot;fade&quot;,&quot;builtinFallback&quot;:true}" data-size="16:9">

<h2 id="%E7%95%B6%E4%BA%A4%E4%BB%98%E6%88%90%E6%9E%9C%E8%88%87%E6%83%B3%E5%83%8F%E5%A4%A9%E5%B7%AE%E5%9C%B0%E5%88%A5-%F0%9F%98%B1">當交付成果與想像天差地別… <img class="emoji" draggable="false" alt="😱" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f631.svg" data-marp-twemoji=""/></h2>

</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="7" data-paginate="true" data-footer="薛念林 教授 | 逢甲大學資訊工程學系" data-header="Part 1: 為什麼前期確認是關鍵？" data-theme="ux-theme" lang="C" data-marpit-pagination="7" style="--paginate:true;--footer:薛念林 教授 | 逢甲大學資訊工程學系;--header:Part 1: 為什麼前期確認是關鍵？;--theme:ux-theme;" data-marpit-pagination-total="40" data-transition-back="{&quot;name&quot;:&quot;fade&quot;,&quot;builtinFallback&quot;:true}" data-transition="{&quot;name&quot;:&quot;fade&quot;,&quot;builtinFallback&quot;:true}" data-size="16:9">
<header>Part 1: 為什麼前期確認是關鍵？</header>
<h2 id="%E8%BB%9F%E9%AB%94%E5%B7%A5%E7%A8%8B%E7%9A%84%E9%BB%83%E9%87%91%E6%B3%95%E5%89%871-10-100-%E6%B3%95%E5%89%87">軟體工程的黃金法則：1-10-100 法則</h2>
<div class="card" data-marpit-fragment>
<blockquote>
<p><strong>「在需求確認階段花 1 元修改的錯誤，到了開發階段要花 10 元，上線營運後要花 100 元甚至更多！」</strong></p>
</blockquote>
</div>
<div class="three-columns" style="margin-top: 16px;">
<div class="card" data-marpit-fragment>
<h3 id="%F0%9F%92%A1-%E9%9C%80%E6%B1%82%E8%88%87%E9%9B%9B%E5%BD%A2%E9%9A%8E%E6%AE%B5-1x"><img class="emoji" draggable="false" alt="💡" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4a1.svg" data-marp-twemoji=""/> 需求與雛形階段 (1x)</h3>
<ul>
<li><strong>成本</strong> ：低（數分鐘到數小時）</li>
<li><strong>方式</strong> ：AI 生成可互動雛形</li>
<li><strong>價值</strong> ：5 分鐘推翻重來毫無負擔，快速收斂真正需求。</li>
</ul>
</div>
<div class="card" data-marpit-fragment>
<h3 id="%E2%9A%99%EF%B8%8F-%E9%96%8B%E7%99%BC%E8%88%87%E7%B7%A8%E7%A8%8B%E9%9A%8E%E6%AE%B5-10x"><img class="emoji" draggable="false" alt="⚙️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/2699.svg" data-marp-twemoji=""/> 開發與編程階段 (10x)</h3>
<ul>
<li><strong>成本</strong> ：中（數天到數週）</li>
<li><strong>方式</strong> ：重寫前端元件、重調 API</li>
<li><strong>痛點</strong> ：需協調前端、後端、QA 測試，進度嚴重延宕。</li>
</ul>
</div>
<div class="card" data-marpit-fragment>
<h3 id="%F0%9F%94%A5-%E4%B8%8A%E7%B7%9A%E8%88%87%E7%87%9F%E9%81%8B%E9%9A%8E%E6%AE%B5-100x"><img class="emoji" draggable="false" alt="🔥" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f525.svg" data-marp-twemoji=""/> 上線與營運階段 (100x+)</h3>
<ul>
<li><strong>成本</strong> ：極高（數月 + 品牌信譽）</li>
<li><strong>方式</strong> ：緊急 Hotfix、資料遷移</li>
<li><strong>痛點</strong> ：使用者流失、客訴爆棚、甚至造成資安或財務損失。</li>
</ul>
</div>
</div>
<footer>薛念林 教授 | 逢甲大學資訊工程學系</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="8" data-paginate="true" data-footer="薛念林 教授 | 逢甲大學資訊工程學系" data-header="Part 1: 為什麼前期確認是關鍵？" data-theme="ux-theme" lang="C" data-marpit-pagination="8" style="--paginate:true;--footer:薛念林 教授 | 逢甲大學資訊工程學系;--header:Part 1: 為什麼前期確認是關鍵？;--theme:ux-theme;" data-marpit-pagination-total="40" data-transition-back="{&quot;name&quot;:&quot;fade&quot;,&quot;builtinFallback&quot;:true}" data-transition="{&quot;name&quot;:&quot;fade&quot;,&quot;builtinFallback&quot;:true}" data-size="16:9">
<header>Part 1: 為什麼前期確認是關鍵？</header>
<h2 id="%E9%9B%9B%E5%BD%A2%E4%BF%9D%E7%9C%9F%E5%BA%A6%E7%9A%84%E6%BC%94%E9%80%B2-fidelity-spectrum">雛形保真度的演進 (Fidelity Spectrum)</h2>
<div class="three-columns">
<div class="card" data-marpit-fragment>
<h3 id="1-%E4%BD%8E%E4%BF%9D%E7%9C%9F-low-fi">1. 低保真 (Low-Fi)</h3>
<ul>
<li><strong>形式</strong> ：紙筆草圖、灰階線框圖 (Wireframe)。</li>
<li><strong>目的</strong> ：確認資訊架構 (IA) 與頁面排版佈局。</li>
<li><strong>限制</strong> ：缺乏視覺美感與真實動態互動。</li>
</ul>
</div>
<div class="card" data-marpit-fragment>
<h3 id="2-%E4%B8%AD%E4%BF%9D%E7%9C%9F-mid-fi">2. 中保真 (Mid-Fi)</h3>
<ul>
<li><strong>形式</strong> ：Figma 靜態設計稿、頁面跳轉流程。</li>
<li><strong>目的</strong> ：確認視覺階層、品牌色調與流程跳轉。</li>
<li><strong>限制</strong> ：無法輸入真實資料，動態狀態有限。</li>
</ul>
</div>
<div class="card" data-marpit-fragment>
<h3 id="3-%E9%AB%98%E4%BF%9D%E7%9C%9F-high-fi--code">3. 高保真 (High-Fi / Code)</h3>
<ul>
<li><strong>形式</strong> ：可互動程式碼原型 (React / Vue / HTML)。</li>
<li>**目的 ** ： <strong>100% 還原真實操作體驗</strong> ，包含即時驗證、動畫與資料連動。</li>
<li><strong>AI 賦能 ** ： ** 過去需耗費數週，現在 AI 數十秒即刻產出！</strong></li>
</ul>
</div>
</div>
<footer>薛念林 教授 | 逢甲大學資訊工程學系</footer>
</section>

<header>Part 1: 為什麼前期確認是關鍵？</header>
<h2 id="1-wireframe-%E4%BD%8E%E4%BF%9D%E7%9C%9F%E7%B7%9A%E6%A1%86%E5%9C%96%E8%B3%87%E8%A8%8A%E9%AA%A8%E6%9E%B6%E8%88%87-ai-%E5%8D%94%E4%BD%9C">1. Wireframe (低保真線框圖)：資訊骨架與 AI 協作</h2>
<div class="two-columns">
<div class="card" data-marpit-fragment>
<h3 id="%E4%BB%80%E9%BA%BC%E6%98%AF-wireframe">什麼是 Wireframe？</h3>
<ul>
<li><img class="emoji" draggable="false" alt="📐" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4d0.svg" data-marp-twemoji=""/> <strong>產品結構藍圖</strong> ：使用灰階方塊、線條與佔位符，排除顏色與美工干擾。</li>
<li><img class="emoji" draggable="false" alt="🎯" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f3af.svg" data-marp-twemoji=""/> <strong>核心目標 ** ：專注於 ** 資訊架構 (IA)</strong> 、功能位置與內容優先級。</li>
<li><img class="emoji" draggable="false" alt="🧠" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f9e0.svg" data-marp-twemoji=""/> <strong>降低認知干擾</strong> ：在早期討論中，避免團隊分心於按鈕顏色等表面細節。</li>
<li><img class="emoji" draggable="false" alt="⚡" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/26a1.svg" data-marp-twemoji=""/> <strong>低成本快速試錯</strong> ：紙筆手繪或數位排版皆可，推翻重構成本趨近於零。</li>
</ul>
</div>
<div class="card" data-marpit-fragment>
<h3 id="%F0%9F%A4%96-ai-%E8%B3%A6%E8%83%BD%E8%88%87%E5%8D%94%E4%BD%9C%E6%A8%A1%E5%BC%8F"><img class="emoji" draggable="false" alt="🤖" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f916.svg" data-marp-twemoji=""/> AI 賦能與協作模式</h3>
<ul>
<li><strong>Prompt-to-Wireframe</strong> ：輸入一句業務需求，AI（如 <code>Relume</code>、<code>Uizard</code>）自動生成全站 Sitemap 與頁面模組。</li>
<li><strong>手繪草圖數位化</strong> ：白板隨手手繪線框拍照，AI 自動向量化轉為可編輯組件。</li>
<li><strong>智能 UX 文案生成</strong> ：告別無意義的 <code>Lorem Ipsum</code>，AI 自動填入真實業務文字。</li>
</ul>
</div>
</div>
<footer>薛念林 教授 | 逢甲大學資訊工程學系</footer>
</section>

<header>Part 1: 為什麼前期確認是關鍵？</header>
<h2 id="%E7%B7%B4%E7%BF%92-%F0%9F%8F%84%F0%9F%8F%BB%E2%80%8D%E2%99%80%EF%B8%8F%E4%BD%BF%E7%94%A8-relume-%E8%A8%AD%E8%A8%88%E8%BE%A6%E5%85%AC%E5%AE%A4%E9%BB%9E%E9%A4%90%E7%B3%BB%E7%B5%B1wireframe">練習 <img class="emoji" draggable="false" alt="🏄🏻‍♀️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f3c4-1f3fb-200d-2640-fe0f.svg" data-marp-twemoji=""/>：使用 Relume 設計「辦公室點餐系統」Wireframe</h2>
<div class="card" data-marpit-fragment>
<h3 id="%F0%9F%8E%AF-%E4%BB%BB%E5%8B%99%E7%9B%AE%E6%A8%99%E9%81%8B%E7%94%A8-relume-ai-%E5%9C%A8-10-%E5%88%86%E9%90%98%E5%85%A7%E5%BB%BA%E7%AB%8B%E4%B8%A6%E5%BE%AE%E8%AA%BF%E5%87%BA%E7%90%86%E6%83%B3%E7%9A%84%E8%BE%A6%E5%85%AC%E5%AE%A4%E4%B8%8B%E5%8D%88%E8%8C%B6%E4%BE%BF%E7%95%B6%E9%BB%9E%E9%A4%90%E7%B7%9A%E6%A1%86%E5%9C%96"><img class="emoji" draggable="false" alt="🎯" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f3af.svg" data-marp-twemoji=""/> 任務目標：運用 Relume AI 在 10 分鐘內建立並微調出理想的辦公室下午茶/便當點餐線框圖</h3>
</div>
<div class="two-columns" style="margin-top: 14px;">
<div class="card" data-marpit-fragment>
<h3 id="%F0%9F%93%9D-%E5%AF%A6%E4%BD%9C%E6%AD%A5%E9%A9%9F"><img class="emoji" draggable="false" alt="📝" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4dd.svg" data-marp-twemoji=""/> 實作步驟</h3>
<ol>
<li><img class="emoji" draggable="false" alt="🌐" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f310.svg" data-marp-twemoji=""/> 開啟 <strong><a href="https://www.relume.ai/">Relume.ai</a></strong> 建立免費專案。</li>
<li><img class="emoji" draggable="false" alt="💬" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4ac.svg" data-marp-twemoji=""/> 輸入提示詞描述業務需求：
<ul>
<li><em>「設計一個辦公室團隊點餐系統，包含今日推薦菜單、客製化選項（甜度/冰塊/加料）、個人購物車、以及主揪即時匯總統計看板。」</em></li>
</ul>
</li>
<li><img class="emoji" draggable="false" alt="📐" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4d0.svg" data-marp-twemoji=""/> 檢視 AI 自動生成的 Sitemap 與 Wireframe 線框圖。</li>
<li><img class="emoji" draggable="false" alt="🔄" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f504.svg" data-marp-twemoji=""/> <strong>調整至少兩個區塊/圖形</strong> ：
<ul>
<li>替換或重新生成不符合想像的排版模組；</li>
<li>調整元件順序與文案，直到完全符合你的設計想像！</li>
</ul>
</li>
</ol>
</div>
<div class="card" data-marpit-fragment>
<h3 id="%F0%9F%92%A1-%E8%A9%95%E4%BC%B0%E8%88%87%E5%8F%8D%E6%80%9D%E8%A6%81%E9%BB%9E"><img class="emoji" draggable="false" alt="💡" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4a1.svg" data-marp-twemoji=""/> 評估與反思要點</h3>
<ul>
<li><strong>資訊階層</strong> ：菜單名稱、價格與「加入點餐」按鈕是否足夠顯眼？</li>
<li><strong>狀態能見度 (NS01)</strong> ：是否能即時看見目前「已點餐人數 / 總人數」進度？</li>
<li><strong>錯誤預防 (NS05)</strong> ：是否有防呆機制避免重複送出或遺漏必填選項？</li>
<li><img class="emoji" draggable="false" alt="🚀" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f680.svg" data-marp-twemoji=""/> <strong>體驗心得</strong> ：比起傳統從零手繪，AI 幫你省下了多少構思與對齊架構的時間？</li>
</ul>
</div>
</div>
<footer>薛念林 教授 | 逢甲大學資訊工程學系</footer>
</section>

<header>Part 1: 為什麼前期確認是關鍵？</header>
<h2 id="2-figma%E8%A8%AD%E8%A8%88%E7%B3%BB%E7%B5%B1%E8%88%87%E8%A6%96%E8%A6%BA%E4%BA%92%E5%8B%95%E5%8E%9F%E5%9E%8B%E6%A8%99%E6%BA%96">2. Figma：設計系統與視覺互動原型標準</h2>
<div class="two-columns">
<div class="card" data-marpit-fragment>
<h3 id="%E4%BB%80%E9%BA%BC%E6%98%AF-figma">什麼是 Figma？</h3>
<ul>
<li><img class="emoji" draggable="false" alt="🎨" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f3a8.svg" data-marp-twemoji=""/> <strong>UI/UX 設計與協作標準</strong> ：向量設計、Design System、Auto-layout 與元件變體 (Variants)。</li>
<li><img class="emoji" draggable="false" alt="🔗" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f517.svg" data-marp-twemoji=""/> <strong>互動原型 (Prototyping)</strong> ：模擬頁面點擊跳轉、轉場動畫、彈窗與 Hover 狀態。</li>
<li><img class="emoji" draggable="false" alt="👥" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f465.svg" data-marp-twemoji=""/> <strong>多人即時協作</strong> ：設計師、工程師與 PM 可即時留言標註與共同編輯。</li>
</ul>
</div>
<div class="card" data-marpit-fragment>
<h3 id="%F0%9F%AA%84-ai-%E8%B3%A6%E8%83%BD%E8%88%87%E7%94%9F%E6%85%8B%E7%B3%BB%E5%8D%94%E4%BD%9C"><img class="emoji" draggable="false" alt="🪄" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1fa84.svg" data-marp-twemoji=""/> AI 賦能與生態系協作</h3>
<ul>
<li><strong>Figma AI 原生功能</strong> ：一鍵生成多版型設計稿、AI 智能圖層重命名與自動翻譯。</li>
<li><strong>真實 Mockup 資料</strong> ：AI 插件秒級填入真實人名、照片、商品價格與數據。</li>
<li><strong>雙向程式碼轉換</strong> ：<code>Relume (Sitemap) ➔ Figma ➔ Locofy/Anima (Code)</code> 無縫銜接。</li>
</ul>
</div>
</div>
<footer>薛念林 教授 | 逢甲大學資訊工程學系</footer>

<header>Part 1: 為什麼前期確認是關鍵？</header>

<header>Part 1: 為什麼前期確認是關鍵？</header>
<h2 id="3-react--vue--html%E5%8F%AF%E5%9F%B7%E8%A1%8C%E7%9A%84%E7%9C%9F%E5%AF%A6%E7%A8%8B%E5%BC%8F%E7%A2%BC%E5%8E%9F%E5%9E%8B">3. React / Vue / HTML：可執行的真實程式碼原型</h2>
<div class="two-columns">
<div class="card" data-marpit-fragment>
<h3 id="%E4%BB%80%E9%BA%BC%E6%98%AF%E5%89%8D%E7%AB%AF%E7%A8%8B%E5%BC%8F%E7%A2%BC%E5%8E%9F%E5%9E%8B">什麼是前端程式碼原型？</h3>
<ul>
<li><img class="emoji" draggable="false" alt="💻" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4bb.svg" data-marp-twemoji=""/> <strong>真實運行的動態 Web 應用</strong> ：具備真正狀態管理 (<code>useState</code>, <code>Pinia</code>)、資料綁定與表單邏輯。</li>
<li><img class="emoji" draggable="false" alt="🚀" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f680.svg" data-marp-twemoji=""/> <strong>100% 真實體驗</strong> ：支援鍵盤打字、API 非同步載入、動畫反饋與響應式切版 (RWD)。</li>
<li><img class="emoji" draggable="false" alt="🏆" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f3c6.svg" data-marp-twemoji=""/> <strong>原型即產出物 (Zero Waste)</strong> ：確認程式碼直接由工程團隊接手，零重寫浪費！</li>
</ul>
</div>
<div class="card" data-marpit-fragment>
<h3 id="%E2%9A%A1-ai-%E8%B3%A6%E8%83%BD%E8%88%87-prompt-to-code"><img class="emoji" draggable="false" alt="⚡" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/26a1.svg" data-marp-twemoji=""/> AI 賦能與 Prompt-to-Code</h3>
<ul>
<li><strong>現代程式碼生成神器</strong> ：<code>v0.dev</code>、<code>Lovable</code>、<code>Bolt.new</code> 打造端到端開發體驗。</li>
<li><strong>即時錯誤自癒 (Self-healing)</strong> ：AI 自動讀取 Console Log 報錯並秒級修復。</li>
<li><strong>全功能 MVP 即刻上線</strong> ：整合 Supabase 一鍵完成會員認證與真實 CRUD 資料庫。</li>
</ul>
</div>
</div>

</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="15" data-paginate="true" data-footer="薛念林 教授 | 逢甲大學資訊工程學系" data-header="Part 1: 為什麼前期確認是關鍵？" data-theme="ux-theme" lang="C" data-marpit-pagination="15" style="--paginate:true;--footer:薛念林 教授 | 逢甲大學資訊工程學系;--header:Part 1: 為什麼前期確認是關鍵？;--theme:ux-theme;" data-marpit-pagination-total="40" data-transition-back="{&quot;name&quot;:&quot;fade&quot;,&quot;builtinFallback&quot;:true}" data-transition="{&quot;name&quot;:&quot;fade&quot;,&quot;builtinFallback&quot;:true}" data-size="16:9">
<header>Part 1: 為什麼前期確認是關鍵？</header>

<td style="text-align:left">**互動體驗深度 **</td>

<td style="text-align:left">**修改與試錯速度 **</td>

<td style="text-align:left"><img class="emoji" draggable="false" alt="⏱️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/23f1.svg" data-marp-twemoji=""/> 分鐘級調整視覺與排版</td>
<td style="text-align:left"><img class="emoji" draggable="false" alt="🚀" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f680.svg" data-marp-twemoji=""/><strong>AI 賦能下已可達成分鐘級即時重構</strong></td>

<tr>

<tr>
<td style="text-align:left">**AI 賦能最大價值 **</td>

<header>Part 2: 現代 AI 雛形生成工具深度盤點</header>

<h1 id="part-2-%E7%8F%BE%E4%BB%A3-ai-%E9%9B%9B%E5%BD%A2%E7%94%9F%E6%88%90%E5%B7%A5%E5%85%B7%E6%B7%B1%E5%BA%A6%E7%9B%A4%E9%BB%9E">Part 2: 現代 AI 雛形生成工具深度盤點</h1>
<h2 id="%E5%BE%9E-prompt-to-code-%E5%88%B0-prompt-to-design">從 Prompt-to-Code 到 Prompt-to-Design</h2>
<footer>薛念林 教授 | 逢甲大學資訊工程學系</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="18" data-paginate="true" data-footer="薛念林 教授 | 逢甲大學資訊工程學系" data-header="Part 2: 現代 AI 雛形生成工具深度盤點" data-theme="ux-theme" lang="C" data-marpit-pagination="18" style="--paginate:true;--footer:薛念林 教授 | 逢甲大學資訊工程學系;--header:Part 2: 現代 AI 雛形生成工具深度盤點;--theme:ux-theme;" data-marpit-pagination-total="40" data-transition-back="{&quot;name&quot;:&quot;fade&quot;,&quot;builtinFallback&quot;:true}" data-transition="{&quot;name&quot;:&quot;fade&quot;,&quot;builtinFallback&quot;:true}" data-size="16:9">
<header>Part 2: 現代 AI 雛形生成工具深度盤點</header>
<h2 id="ai-%E9%9B%9B%E5%BD%A2%E5%B7%A5%E5%85%B7%E5%85%A8%E6%99%AF%E5%88%86%E9%A1%9E-tool-landscape">AI 雛形工具全景分類 (Tool Landscape)</h2>
<div class="two-columns">
<div class="card" data-marpit-fragment>
<h3 id="%F0%9F%9B%A0%EF%B8%8F-1-%E5%85%A8%E7%AB%AF%E7%A8%8B%E5%BC%8F%E7%A2%BC%E5%9E%8B%E9%9B%9B%E5%BD%A2-code-first"><img class="emoji" draggable="false" alt="🛠️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f6e0.svg" data-marp-twemoji=""/> 1. 全端/程式碼型雛形 (Code-First)</h3>
<p>直接生成可運行的 Web/React 前端程式碼，支援真實點擊、狀態管理與資料輸入：</p>
<ul>
<li><strong><code>v0 by Vercel</code></strong> （React + Tailwind + Shadcn UI）</li>
<li><strong><code>Lovable.dev</code></strong> （Fullstack App + Supabase 資料庫）</li>
<li><strong><code>Bolt.new</code></strong> （瀏覽器原生 Fullstack WebContainer）</li>
<li><strong><code>Claude Artifacts / ChatGPT Canvas</code></strong> （輕量級單頁快速預覽）</li>
</ul>
</div>
<div class="card" data-marpit-fragment>
<h3 id="%F0%9F%8E%A8-2-%E8%A8%AD%E8%A8%88%E7%95%AB%E5%B8%83%E5%9E%8B%E9%9B%9B%E5%BD%A2-design-first"><img class="emoji" draggable="false" alt="🎨" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f3a8.svg" data-marp-twemoji=""/> 2. 設計/畫布型雛形 (Design-First)</h3>
<p>專注於視覺設計稿、線框圖、Figma 整合與整體站點規劃：</p>
<ul>
<li><strong><code>Uizard</code></strong> （手繪草圖轉 UI + AI 易用性熱區圖）</li>
<li><strong><code>Galileo AI</code></strong> （高保真 UI 向量設計稿生成）</li>
<li><strong><code>Relume</code></strong> （Sitemap 規劃 + 線框圖無縫匯入 Figma）</li>
<li><strong><code>Figma AI</code></strong> （原生畫布自動排版與元件填充）</li>
</ul>
</div>
</div>
<footer>薛念林 教授 | 逢甲大學資訊工程學系</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="19" data-paginate="true" data-footer="薛念林 教授 | 逢甲大學資訊工程學系" data-header="Part 2: 現代 AI 雛形生成工具深度盤點" data-theme="ux-theme" lang="C" data-marpit-pagination="19" style="--paginate:true;--footer:薛念林 教授 | 逢甲大學資訊工程學系;--header:Part 2: 現代 AI 雛形生成工具深度盤點;--theme:ux-theme;" data-marpit-pagination-total="40" data-transition-back="{&quot;name&quot;:&quot;fade&quot;,&quot;builtinFallback&quot;:true}" data-transition="{&quot;name&quot;:&quot;fade&quot;,&quot;builtinFallback&quot;:true}" data-size="16:9">
<header>Part 2: 現代 AI 雛形生成工具深度盤點</header>
<h2 id="%E5%B7%A5%E5%85%B7-1-v0-by-vercel-%E5%89%8D%E7%AB%AF%E7%B5%84%E4%BB%B6%E7%B4%9A%E7%8E%8B%E8%80%85">工具 1: v0 by Vercel (前端組件級王者)</h2>
<div class="two-columns-64">
<div class="card" data-marpit-fragment>
<h3 id="%E6%A0%B8%E5%BF%83%E7%89%B9%E6%80%A7%E8%88%87%E5%84%AA%E5%8B%A2">核心特性與優勢</h3>
<ul>
<li><strong>技術棧</strong> ：React + Tailwind CSS + Lucide Icons + <code>shadcn/ui</code>。</li>
<li><strong>精準區塊編輯</strong> ：可圈選畫面上任一特定按鈕或卡片，單獨下指令修改。</li>
<li><strong>無縫工程交接</strong> ：產出乾淨、符合現代前端最佳實踐的 React 原始碼，一鍵 <code>npx shadcn add</code> 複製。</li>
<li><strong>版本時光機</strong> ：隨時比對每次 Prompt 迭代的介面差異並支援回退。</li>
</ul>
<h3 id="%E9%81%A9%E7%94%A8%E6%83%85%E5%A2%83">適用情境</h3>
<ul>
<li>Dashboard 後台管理系統、複雜表單輸入、SaaS 產品介面。</li>
</ul>
</div>
<div class="prompt-box" style="font-size: 17px;" data-marpit-fragment>
<h3 id="%F0%9F%92%A1-%E5%AF%A6%E6%88%B0-prompt-%E7%AF%84%E4%BE%8B"><img class="emoji" draggable="false" alt="💡" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4a1.svg" data-marp-twemoji=""/> 實戰 Prompt 範例</h3>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-text">請設計一個「智慧會議室預約系統」的 Dashboard。
包含：
1. 頂部搜尋欄與日期選擇器
2. 左右雙欄：左側會議室即時狀態卡片
   （容納人數、設備標籤、空閒/使用中）
3. 右側時間軸甘特圖（可拖曳時段預約）
4. 點擊預約時跳出 Modal，需具備衝突防呆提示
請使用乾淨洗鍊的現代深藍與白配色。
</code></pre>
</div>
</div>
<footer>薛念林 教授 | 逢甲大學資訊工程學系</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="20" data-paginate="true" data-footer="薛念林 教授 | 逢甲大學資訊工程學系" data-header="Part 2: 現代 AI 雛形生成工具深度盤點" data-theme="ux-theme" lang="C" data-marpit-pagination="20" style="--paginate:true;--footer:薛念林 教授 | 逢甲大學資訊工程學系;--header:Part 2: 現代 AI 雛形生成工具深度盤點;--theme:ux-theme;" data-marpit-pagination-total="40" data-transition-back="{&quot;name&quot;:&quot;fade&quot;,&quot;builtinFallback&quot;:true}" data-transition="{&quot;name&quot;:&quot;fade&quot;,&quot;builtinFallback&quot;:true}" data-size="16:9">
<header>Part 2: 現代 AI 雛形生成工具深度盤點</header>
<h2 id="%E5%B7%A5%E5%85%B7-2-lovabledev-%E5%85%A8%E5%8A%9F%E8%83%BD-web-app-%E7%94%A2%E5%87%BA%E5%99%A8">工具 2: Lovable.dev (全功能 Web App 產出器)</h2>
<div class="two-columns">
<div class="card" data-marpit-fragment>
<h3 id="%E6%A0%B8%E5%BF%83%E7%89%B9%E8%89%B2">核心特色</h3>
<ul>
<li><img class="emoji" draggable="false" alt="🚀" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f680.svg" data-marp-twemoji=""/> <strong>超高保真</strong> ：不只是靜態切版，而是完整具備邏輯、狀態路由與資料持久化的 Web App。</li>
<li><img class="emoji" draggable="false" alt="🗄️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f5c4.svg" data-marp-twemoji=""/> <strong>一鍵整合資料庫</strong> ：內建 Supabase 支援，點擊即可啟用使用者認證 (Auth) 與真實 CRUD。</li>
<li><img class="emoji" draggable="false" alt="🌐" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f310.svg" data-marp-twemoji=""/> <strong>即時雲端部署</strong> ：幾秒內產生公開網址，直接傳給利害關係人進行手機/電腦實機測試。</li>
<li><img class="emoji" draggable="false" alt="💬" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4ac.svg" data-marp-twemoji=""/> <strong>自然語言迭代</strong> ：「把側邊欄改成抽屜式」、「增加匯出 CSV 功能」，AI 自動修改程式碼並熱重載。</li>
</ul>
</div>
<div class="card" data-marpit-fragment>
<h3 id="%E9%81%A9%E5%90%88%E7%9A%84%E5%89%8D%E6%9C%9F%E7%A2%BA%E8%AA%8D%E5%A0%B4%E6%99%AF">適合的前期確認場景</h3>
<ul>
<li>需要驗證完整使用者旅程（註冊 ➔ 填寫資料 ➔ 結帳付款 ➔ 收到通知）。</li>
<li>向老闆、投資人或非技術客戶進行真實可操作的產品概念驗證 (PoC)。</li>
<li>團隊在未配置專職前端工程師時，快速驗證產品商業價值。</li>
</ul>
</div>
</div>
<footer>薛念林 教授 | 逢甲大學資訊工程學系</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="21" data-paginate="true" data-footer="薛念林 教授 | 逢甲大學資訊工程學系" data-header="Part 2: 現代 AI 雛形生成工具深度盤點" data-theme="ux-theme" lang="C" data-marpit-pagination="21" style="--paginate:true;--footer:薛念林 教授 | 逢甲大學資訊工程學系;--header:Part 2: 現代 AI 雛形生成工具深度盤點;--theme:ux-theme;" data-marpit-pagination-total="40" data-transition-back="{&quot;name&quot;:&quot;fade&quot;,&quot;builtinFallback&quot;:true}" data-transition="{&quot;name&quot;:&quot;fade&quot;,&quot;builtinFallback&quot;:true}" data-size="16:9">
<header>Part 2: 現代 AI 雛形生成工具深度盤點</header>
<h2 id="%E5%B7%A5%E5%85%B7-3-boltnew-%E7%80%8F%E8%A6%BD%E5%99%A8%E7%AB%AF%E5%AE%8C%E6%95%B4%E9%96%8B%E7%99%BC%E7%92%B0%E5%A2%83">工具 3: Bolt.new (瀏覽器端完整開發環境)</h2>
<div class="two-columns">
<div class="card" data-marpit-fragment>
<h3 id="%E6%A0%B8%E5%BF%83%E7%89%B9%E8%89%B2-1">核心特色</h3>
<ul>
<li><img class="emoji" draggable="false" alt="⚡" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/26a1.svg" data-marp-twemoji=""/> <strong>Node.js in Browser</strong> ：基於 WebContainers 技術，直接在瀏覽器執行 npm 套件與後端伺服器。</li>
<li><img class="emoji" draggable="false" alt="📦" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4e6.svg" data-marp-twemoji=""/> <strong>全套技術棧任選</strong> ：Next.js、Vite、Remix、Astro、Vue、Svelte 皆可一鍵生成。</li>
<li><img class="emoji" draggable="false" alt="🔍" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f50d.svg" data-marp-twemoji=""/> <strong>完整專案目錄樹</strong> ：直接查看與編輯所有原始碼檔案（<code>package.json</code>、組件、API Route）。</li>
<li><img class="emoji" draggable="false" alt="🛠️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f6e0.svg" data-marp-twemoji=""/> <strong>自動修復報錯</strong> ：當終端機或建置出錯時，AI 會主動讀取 Error Log 並一鍵修復。</li>
</ul>
</div>
<div class="card" data-marpit-fragment>
<h3 id="%E9%81%A9%E5%90%88%E7%9A%84%E5%89%8D%E6%9C%9F%E7%A2%BA%E8%AA%8D%E5%A0%B4%E6%99%AF-1">適合的前期確認場景</h3>
<ul>
<li>工程團隊進行技術可行性評估 (Technical Spike)。</li>
<li>需要使用特定 NPM 前端套件（如 Recharts 圖表庫、Leaflet 地圖庫）的複雜互動原型。</li>
<li>雛形確認後可直接下載 Zip 或推送至 GitHub 繼續開發。</li>
</ul>
</div>
</div>
<footer>薛念林 教授 | 逢甲大學資訊工程學系</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="22" data-paginate="true" data-footer="薛念林 教授 | 逢甲大學資訊工程學系" data-header="Part 2: 現代 AI 雛形生成工具深度盤點" data-theme="ux-theme" lang="C" data-marpit-pagination="22" style="--paginate:true;--footer:薛念林 教授 | 逢甲大學資訊工程學系;--header:Part 2: 現代 AI 雛形生成工具深度盤點;--theme:ux-theme;" data-marpit-pagination-total="40" data-transition-back="{&quot;name&quot;:&quot;fade&quot;,&quot;builtinFallback&quot;:true}" data-transition="{&quot;name&quot;:&quot;fade&quot;,&quot;builtinFallback&quot;:true}" data-size="16:9">
<header>Part 2: 現代 AI 雛形生成工具深度盤點</header>
<h2 id="%E5%B7%A5%E5%85%B7-4-uizard-%E8%A8%AD%E8%A8%88%E8%8D%89%E5%9C%96%E8%88%87%E6%98%93%E7%94%A8%E6%80%A7%E5%88%86%E6%9E%90%E5%B0%88%E5%AE%B6">工具 4: Uizard (設計草圖與易用性分析專家)</h2>
<div class="two-columns">
<div class="card" data-marpit-fragment>
<h3 id="%E6%A0%B8%E5%BF%83%E7%89%B9%E8%89%B2-2">核心特色</h3>
<ul>
<li>✍️ <strong>Sketch-to-UI</strong> ：在白板或紙上畫手繪草圖，拍照上傳後 AI 自動轉為高保真 UI 設計稿！</li>
<li><img class="emoji" draggable="false" alt="📸" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4f8.svg" data-marp-twemoji=""/> <strong>Screenshot-to-Design</strong> ：截圖既有 App 或競品頁面，AI 逆向工程解析為可編輯的設計組件。</li>
<li><img class="emoji" draggable="false" alt="🧠" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f9e0.svg" data-marp-twemoji=""/> <strong>AI Attention Heatmap (視覺焦點熱區)</strong> ：
<ul>
<li><strong>內建預測眼動儀演算法</strong> ；</li>
<li>自動分析使用者視線最先被哪顆按鈕或標題吸引；</li>
<li>前期即可評估 CTA (Call to Action) 是否夠顯眼！</li>
</ul>
</li>
</ul>
</div>
<div class="card" data-marpit-fragment>
<h3 id="%E9%81%A9%E5%90%88%E7%9A%84%E5%89%8D%E6%9C%9F%E7%A2%BA%E8%AA%8D%E5%A0%B4%E6%99%AF-2">適合的前期確認場景</h3>
<ul>
<li>設計衝刺 (Design Sprint) 工作坊。</li>
<li>將團隊頭腦風暴的紙上手繪即時數位化。</li>
<li>評估頁面資訊階層 (Visual Hierarchy) 與眼球停留熱點。</li>
</ul>
</div>
</div>
<footer>薛念林 教授 | 逢甲大學資訊工程學系</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="23" data-paginate="true" data-footer="薛念林 教授 | 逢甲大學資訊工程學系" data-header="Part 2: 現代 AI 雛形生成工具深度盤點" data-theme="ux-theme" lang="C" data-marpit-pagination="23" style="--paginate:true;--footer:薛念林 教授 | 逢甲大學資訊工程學系;--header:Part 2: 現代 AI 雛形生成工具深度盤點;--theme:ux-theme;" data-marpit-pagination-total="40" data-transition-back="{&quot;name&quot;:&quot;fade&quot;,&quot;builtinFallback&quot;:true}" data-transition="{&quot;name&quot;:&quot;fade&quot;,&quot;builtinFallback&quot;:true}" data-size="16:9">
<header>Part 2: 現代 AI 雛形生成工具深度盤點</header>
<h2 id="%E5%B7%A5%E5%85%B7-5-relume-%E7%B6%B2%E7%AB%99%E8%B3%87%E8%A8%8A%E6%9E%B6%E6%A7%8B%E8%88%87%E7%B7%9A%E6%A1%86%E5%9C%96%E7%A5%9E%E5%99%A8">工具 5: Relume (網站資訊架構與線框圖神器)</h2>
<div class="two-columns">
<div class="card" data-marpit-fragment>
<h3 id="%E6%A0%B8%E5%BF%83%E7%89%B9%E8%89%B2-3">核心特色</h3>
<ul>
<li><img class="emoji" draggable="false" alt="🗺️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f5fa.svg" data-marp-twemoji=""/> <strong>AI Sitemap Builder</strong> ：輸入一句產品描述，自動規劃完整的站點地圖與頁面從屬架構。</li>
<li><img class="emoji" draggable="false" alt="🧱" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f9f1.svg" data-marp-twemoji=""/> <strong>Wireframe 頁面模組化</strong> ：自動為每個頁面安排 Hero Banner、功能列表、定價表、FAQ 等區塊。</li>
<li><img class="emoji" draggable="false" alt="📝" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4dd.svg" data-marp-twemoji=""/> <strong>自動撰寫 UX 文案</strong> ：消除死板的 <code>Lorem Ipsum</code>，生成符合業務場景的真實文案。</li>
<li><img class="emoji" draggable="false" alt="🔗" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f517.svg" data-marp-twemoji=""/> <strong>一鍵匯入 Figma / Webflow</strong> ：直接生成整套已 Auto-layout 且命名規範的 Figma 畫布。</li>
</ul>
</div>
<div class="card" data-marpit-fragment>
<h3 id="%E9%81%A9%E5%90%88%E7%9A%84%E5%89%8D%E6%9C%9F%E7%A2%BA%E8%AA%8D%E5%A0%B4%E6%99%AF-3">適合的前期確認場景</h3>
<ul>
<li>官方網站、品牌門戶、SaaS 產品首頁的前期結構確認。</li>
<li>與客戶快速達成「需要做哪些頁面」、「每頁放什麼內容」的共識。</li>
<li>大幅減少從零繪製線框圖的時間。</li>
</ul>
</div>
</div>
<footer>薛念林 教授 | 逢甲大學資訊工程學系</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="24" data-paginate="true" data-footer="薛念林 教授 | 逢甲大學資訊工程學系" data-header="Part 2: 現代 AI 雛形生成工具深度盤點" data-theme="ux-theme" lang="C" data-marpit-pagination="24" style="--paginate:true;--footer:薛念林 教授 | 逢甲大學資訊工程學系;--header:Part 2: 現代 AI 雛形生成工具深度盤點;--theme:ux-theme;" data-marpit-pagination-total="40" data-transition-back="{&quot;name&quot;:&quot;fade&quot;,&quot;builtinFallback&quot;:true}" data-transition="{&quot;name&quot;:&quot;fade&quot;,&quot;builtinFallback&quot;:true}" data-size="16:9">
<header>Part 2: 現代 AI 雛形生成工具深度盤點</header>
<h2 id="%E5%B7%A5%E5%85%B7-6-claude-artifacts--chatgpt-canvas">工具 6: Claude Artifacts / ChatGPT Canvas</h2>
<div class="two-columns">
<div class="card" data-marpit-fragment>
<h3 id="%E6%A0%B8%E5%BF%83%E7%89%B9%E8%89%B2-4">核心特色</h3>
<ul>
<li><img class="emoji" draggable="false" alt="⚡" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/26a1.svg" data-marp-twemoji=""/> <strong>即問即看</strong> ：在對話視窗右側即時渲染 React / HTML / SVG 動態元件。</li>
<li><img class="emoji" draggable="false" alt="🎯" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f3af.svg" data-marp-twemoji=""/> <strong>超低門檻</strong> ：無需建立專案、無需登入複雜平台，一般對話即可產出。</li>
<li><img class="emoji" draggable="false" alt="🔀" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f500.svg" data-marp-twemoji=""/> <strong>多方案快速比較</strong> ：可讓 AI 同時生成「方案 A：分步表單」與「方案 B：單頁滑動表單」，即時切換比對。</li>
</ul>
</div>
<div class="card" data-marpit-fragment>
<h3 id="%E9%81%A9%E5%90%88%E7%9A%84%E5%89%8D%E6%9C%9F%E7%A2%BA%E8%AA%8D%E5%A0%B4%E6%99%AF-4">適合的前期確認場景</h3>
<ul>
<li>單一複雜 UI 元件的互動驗證（例如：三層連動下拉選單、自訂日期範圍篩選器）。</li>
<li>演算法視覺化或動態邏輯展示。</li>
<li>團隊會議中即時討論與即興驗證。</li>
</ul>
</div>
</div>
<footer>薛念林 教授 | 逢甲大學資訊工程學系</footer>
</section>

<header>Part 3: AI 驅動的前期確認作業流程</header>
<h2 id="%E7%AB%AF%E5%88%B0%E7%AB%AF-end-to-end-%E5%89%8D%E6%9C%9F%E9%A9%97%E8%AD%89%E4%BD%9C%E6%A5%AD%E6%B5%81%E7%A8%8B">端到端 (End-to-End) 前期驗證作業流程</h2>
<div class="card-img">
<img src="../../img/workflow_e2e_prototype.jpg" alt="5-Step End-to-End UI/UX Prototyping Workflow" />
</div>
<div class="card" style="margin-top: 10px; font-size: 17px; padding: 10px 14px; text-align: center;">
<p><strong>五大階段閉環</strong> ：① 需求訪談 ➔ ② 資訊架構 (IA) ➔ ③ AI 快速雛形 ➔ ④ 啟發式評估 ➔ ⑤ 實機驗收交付</p>

<header>Part 3: AI 驅動的前期確認作業流程</header>
<h2 id="step-1-%E9%9C%80%E6%B1%82%E8%A8%AA%E8%AB%87%E8%88%87-user-story-%E6%A2%B3%E7%90%86">Step 1: 需求訪談與 User Story 梳理</h2>
<div class="two-columns">
<div class="card" data-marpit-fragment>
<h3 id="%E5%82%B3%E7%B5%B1%E5%81%9A%E6%B3%95-vs-ai-%E8%B3%A6%E8%83%BD">傳統做法 vs AI 賦能</h3>
<ul>
<li>傳統：手寫訪談筆記，整理需求需耗費 1~2 天。</li>
<li><strong>AI 賦能</strong> ：將使用者訪談錄音逐字稿餵給 AI，由 AI 自動萃取痛點、Persona 與 User Stories。</li>
</ul>
<h3 id="%E6%A0%B8%E5%BF%83%E7%94%A2%E5%87%BA%E7%89%A9">核心產出物</h3>
<ul>
<li><strong>使用者角色 (Persona)</strong> ：目標族群、痛點、動機。</li>
<li><strong>使用者故事 (User Stories)</strong> ：
<ul>
<li><code>作為一個 [角色]，我想要 [功能]，以便於 [達成目標]。</code></li>
</ul>
</li>
<li><strong>驗收準則 (Acceptance Criteria / Gherkin)</strong> 。</li>
</ul>
</div>
<div class="prompt-box" style="font-size: 17px;" data-marpit-fragment>
<h3 id="%F0%9F%92%A1-ai-%E8%BC%94%E5%8A%A9%E5%88%86%E6%9E%90-prompt-%E7%AF%84%E4%BE%8B"><img class="emoji" draggable="false" alt="💡" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4a1.svg" data-marp-twemoji=""/> AI 輔助分析 Prompt 範例</h3>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-text">你是一位資深 UX 研究員。以下是一段「學生選課系統」的使用者訪談逐字稿。
請幫我：
1. 列出使用者的 3 大核心痛點。
2. 產出 5 個關鍵的 User Stories (含 As a/I want/So that)。
3. 為每個 User Story 定義明確的 Given-When-Then 驗收標準。
</code></pre>
</div>
</div>
<footer>薛念林 教授 | 逢甲大學資訊工程學系</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="29" data-paginate="true" data-footer="薛念林 教授 | 逢甲大學資訊工程學系" data-header="Part 3: AI 驅動的前期確認作業流程" data-theme="ux-theme" lang="C" data-marpit-pagination="29" style="--paginate:true;--footer:薛念林 教授 | 逢甲大學資訊工程學系;--header:Part 3: AI 驅動的前期確認作業流程;--theme:ux-theme;" data-marpit-pagination-total="40" data-transition-back="{&quot;name&quot;:&quot;fade&quot;,&quot;builtinFallback&quot;:true}" data-transition="{&quot;name&quot;:&quot;fade&quot;,&quot;builtinFallback&quot;:true}" data-size="16:9">
<header>Part 3: AI 驅動的前期確認作業流程</header>
<h2 id="step-2-%E8%B3%87%E8%A8%8A%E6%9E%B6%E6%A7%8B-ia-%E8%88%87-sitemap-%E8%A6%8F%E5%8A%83">Step 2: 資訊架構 (IA) 與 Sitemap 規劃</h2>
<div class="two-columns">
<div class="card">
<h3 id="%E9%87%8D%E9%BB%9E%E5%85%88%E5%AE%9A%E7%BE%A9%E9%AA%A8%E6%9E%B6%E5%86%8D%E5%A1%AB%E5%85%85%E8%A1%80%E8%82%89">重點：先定義骨架，再填充血肉</h3>
<ul>
<li>在動手畫介面之前，必須先確定 <strong>頁面層級 (Hierarchy)</strong> 與 ** 導覽路徑 (Navigation Flow)** 。</li>
<li>避免出現「找不到入口」或「孤島頁面」的導覽死角。</li>
</ul>
<h3 id="%E5%B7%A5%E5%85%B7%E6%90%AD%E9%85%8D%E8%88%87%E7%94%A2%E5%87%BA">工具搭配與產出</h3>
<ul>
<li>使用 <strong><code>Relume</code></strong> 或 <strong><code>ChatGPT</code></strong> 自動產生樹狀結構。</li>
<li>輸出清晰的樹狀結構圖或 Markdown 清單，先與團隊確認各模組歸屬與跳轉 Modal。</li>
</ul>
</div>
<div class="card-img">
<img src="../../img/ia_sitemap_concept.jpg" alt="Information Architecture and Sitemap Hierarchy Tree" />
</div>
</div>
<footer>薛念林 教授 | 逢甲大學資訊工程學系</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="30" data-paginate="true" data-footer="薛念林 教授 | 逢甲大學資訊工程學系" data-header="Part 3: AI 驅動的前期確認作業流程" data-theme="ux-theme" lang="C" data-marpit-pagination="30" style="--paginate:true;--footer:薛念林 教授 | 逢甲大學資訊工程學系;--header:Part 3: AI 驅動的前期確認作業流程;--theme:ux-theme;" data-marpit-pagination-total="40" data-transition-back="{&quot;name&quot;:&quot;fade&quot;,&quot;builtinFallback&quot;:true}" data-transition="{&quot;name&quot;:&quot;fade&quot;,&quot;builtinFallback&quot;:true}" data-size="16:9">
<header>Part 3: AI 驅動的前期確認作業流程</header>
<h2 id="step-3-ai-%E5%BF%AB%E9%80%9F%E7%94%9F%E6%88%90%E9%AB%98%E4%BF%9D%E7%9C%9F%E4%BA%92%E5%8B%95%E9%9B%9B%E5%BD%A2">Step 3: AI 快速生成高保真互動雛形</h2>
<div class="two-columns">
<div class="card" data-marpit-fragment>
<h3 id="%E6%A0%B8%E5%BF%83%E5%BF%83%E6%B3%95%E7%B5%90%E6%A7%8B%E5%8C%96%E6%8F%90%E7%A4%BA-structured-prompting">核心心法：結構化提示 (Structured Prompting)</h3>
<ul>
<li>避免給予模糊指令（如：「給我一個漂亮的後台」）。</li>
<li><strong>採用黃金 5 要素</strong> ：
<ol>
<li><img class="emoji" draggable="false" alt="🏢" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f3e2.svg" data-marp-twemoji=""/> <strong>角色與場景</strong> （誰在用？在哪裡用？）</li>
<li><img class="emoji" draggable="false" alt="📐" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4d0.svg" data-marp-twemoji=""/> <strong>佈局規範</strong> （Navbar、Sidebar、卡片網格、雙欄）</li>
<li><img class="emoji" draggable="false" alt="🎨" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f3a8.svg" data-marp-twemoji=""/> <strong>視覺風格</strong> （現代極簡、Tailwind 配色、暗色模式）</li>
<li><img class="emoji" draggable="false" alt="🔄" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f504.svg" data-marp-twemoji=""/> <strong>動態與互動</strong> （點擊彈窗、Tab 切換、篩選即時連動）</li>
<li><img class="emoji" draggable="false" alt="⚠️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/26a0.svg" data-marp-twemoji=""/> <strong>邊界與防呆</strong> （空狀態 Empty State、錯誤提示、Loading 動畫）</li>
</ol>
</li>
</ul>
</div>
<div class="card" data-marpit-fragment>
<h3 id="%E5%B7%A5%E5%85%B7%E9%81%B8%E6%93%87%E5%BB%BA%E8%AD%B0">工具選擇建議</h3>
<ul>
<li><strong>需要純元件展示</strong> ➔ <code>v0.dev</code></li>
<li><strong>需要完整多頁流程與資料庫</strong> ➔ <code>Lovable.dev</code></li>
<li><strong>需要對外分享至手機操作</strong> ➔ <code>Lovable</code> 部署網址</li>
</ul>
<blockquote>
<p><img class="emoji" draggable="false" alt="💡" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4a1.svg" data-marp-twemoji=""/> <strong>小秘訣</strong> ：第一版先生成 80% 骨架，再針對局部區塊逐步提示優化，切忌一次塞入過多需求。</p>
</blockquote>
</div>
</div>
<footer>薛念林 教授 | 逢甲大學資訊工程學系</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="31" data-paginate="true" data-footer="薛念林 教授 | 逢甲大學資訊工程學系" data-header="Part 3: AI 驅動的前期確認作業流程" data-theme="ux-theme" lang="C" data-marpit-pagination="31" style="--paginate:true;--footer:薛念林 教授 | 逢甲大學資訊工程學系;--header:Part 3: AI 驅動的前期確認作業流程;--theme:ux-theme;" data-marpit-pagination-total="40" data-transition-back="{&quot;name&quot;:&quot;fade&quot;,&quot;builtinFallback&quot;:true}" data-transition="{&quot;name&quot;:&quot;fade&quot;,&quot;builtinFallback&quot;:true}" data-size="16:9">
<header>Part 3: AI 驅動的前期確認作業流程</header>
<h2 id="step-4-%E5%95%9F%E7%99%BC%E5%BC%8F%E8%A9%95%E4%BC%B0-heuristic-walkthrough">Step 4: 啟發式評估 (Heuristic Walkthrough)</h2>
<div class="card" data-marpit-fragment>
<h3 id="%E5%9C%A8%E5%B1%95%E7%A4%BA%E7%B5%A6%E5%AE%A2%E6%88%B6%E5%89%8D%E5%85%88%E7%94%A8%E5%B0%BC%E7%88%BE%E6%A3%AE-10-%E5%A4%A7%E5%8E%9F%E5%89%87%E9%80%B2%E8%A1%8C%E5%85%A7%E9%83%A8%E5%81%A5%E5%BA%B7%E6%AA%A2%E6%9F%A5">在展示給客戶前，先用「尼爾森 10 大原則」進行內部健康檢查！</h3>
</div>
<div class="two-columns" style="margin-top: 14px;">
<div class="card" data-marpit-fragment>
<h3 id="%F0%9F%94%8D-%E5%85%A7%E9%83%A8%E8%B5%B0%E6%9F%A5%E6%AA%A2%E6%9F%A5%E6%B8%85%E5%96%AE-checklist"><img class="emoji" draggable="false" alt="🔍" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f50d.svg" data-marp-twemoji=""/> 內部走查檢查清單 (Checklist)</h3>
<ul>
<li><img class="emoji" draggable="false" alt="✅" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/2705.svg" data-marp-twemoji=""/> <strong>NS01 系統狀態</strong> ：按鈕點擊後是否有 Loading 指示？</li>
<li><img class="emoji" draggable="false" alt="✅" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/2705.svg" data-marp-twemoji=""/> <strong>NS02 真實對應</strong> ：詞彙是否通俗？圖示是否直覺？</li>
<li><img class="emoji" draggable="false" alt="✅" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/2705.svg" data-marp-twemoji=""/> <strong>NS03 使用者控制</strong> ：是否有 Cancel / Undo / 關閉按鈕？</li>
<li><img class="emoji" draggable="false" alt="✅" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/2705.svg" data-marp-twemoji=""/> <strong>NS05 錯誤預防</strong> ：必填欄位是否有明確標記與格式防呆？</li>
<li><img class="emoji" draggable="false" alt="✅" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/2705.svg" data-marp-twemoji=""/> <strong>NS08 極簡設計</strong> ：畫面是否有過多雜訊干擾？</li>
<li><img class="emoji" draggable="false" alt="✅" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/2705.svg" data-marp-twemoji=""/> <strong>NS09 友善報錯</strong> ：錯誤訊息是否具備具體修復建議？</li>
</ul>
</div>
<div class="prompt-box" style="font-size: 17px;" data-marpit-fragment>
<h3 id="%F0%9F%92%A1-ai-%E8%87%AA%E6%AA%A2-prompt-%E7%AF%84%E4%BE%8B"><img class="emoji" draggable="false" alt="💡" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4a1.svg" data-marp-twemoji=""/> AI 自檢 Prompt 範例</h3>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-text">請檢視目前生成的「預約表單介面」程式碼。
請依據 Nielsen&#x27;s 10 Heuristics 原則，
找出 3 個潛在的可用性問題（例如缺乏 Loading 狀態、
缺少取消按鈕、或錯誤提示不夠具體），
並直接給出修改後的優化程式碼。
</code></pre>
</div>
</div>
<footer>薛念林 教授 | 逢甲大學資訊工程學系</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="32" data-paginate="true" data-footer="薛念林 教授 | 逢甲大學資訊工程學系" data-header="Part 3: AI 驅動的前期確認作業流程" data-theme="ux-theme" lang="C" data-marpit-pagination="32" style="--paginate:true;--footer:薛念林 教授 | 逢甲大學資訊工程學系;--header:Part 3: AI 驅動的前期確認作業流程;--theme:ux-theme;" data-marpit-pagination-total="40" data-transition-back="{&quot;name&quot;:&quot;fade&quot;,&quot;builtinFallback&quot;:true}" data-transition="{&quot;name&quot;:&quot;fade&quot;,&quot;builtinFallback&quot;:true}" data-size="16:9">
<header>Part 3: AI 驅動的前期確認作業流程</header>
<h2 id="step-5-%E9%AB%94%E9%A9%97%E9%96%89%E7%92%B0%E8%88%87%E5%B7%A5%E7%A8%8B%E4%BA%A4%E4%BB%98-handoff">Step 5: 體驗閉環與工程交付 (Handoff)</h2>
<div class="two-columns">
<div class="card" data-marpit-fragment>
<h3 id="1-%E5%88%A9%E5%AE%B3%E9%97%9C%E4%BF%82%E4%BA%BA-stakeholder-%E5%AF%A6%E6%A9%9F%E6%B8%AC%E8%A9%A6">1. 利害關係人 (Stakeholder) 實機測試</h3>
<ul>
<li>將可點擊的 Prototype 網址直接發送給真實使用者。</li>
<li>觀察使用者在「未經解說」的情況下能否順利完成目標任務。</li>
<li>記錄卡關點， <strong>在會議現場直接透過 AI 在 5 分鐘內完成修訂並重新整理</strong> ！</li>
</ul>
</div>
<div class="card" data-marpit-fragment>
<h3 id="2-%E9%A0%86%E6%9A%A2%E4%BA%A4%E6%8E%A5%E7%B5%A6%E9%96%8B%E7%99%BC%E5%9C%98%E9%9A%8A">2. 順暢交接給開發團隊</h3>
<ul>
<li>傳統：工程師對著靜態圖猜測響應式寬度與動畫時間。</li>
<li><strong>AI 賦能交接</strong> ：
<ul>
<li>提供 Clean Code (React/Tailwind 元件)；</li>
<li>提供 Design Tokens (顏色、字體、間距變數)；</li>
<li>附帶清晰的驗收條件與邊界處理邏輯。</li>
</ul>
</li>
</ul>
</div>
</div>
<footer>薛念林 教授 | 逢甲大學資訊工程學系</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="33" data-paginate="true" data-footer="薛念林 教授 | 逢甲大學資訊工程學系" data-header="Part 4: 實戰 Prompt 技巧與避坑指南" data-class="part-cover" data-theme="ux-theme" lang="C" class="part-cover" data-marpit-pagination="33" style="--paginate:true;--footer:薛念林 教授 | 逢甲大學資訊工程學系;--header:Part 4: 實戰 Prompt 技巧與避坑指南;--class:part-cover;--theme:ux-theme;" data-marpit-pagination-total="40" data-transition-back="{&quot;name&quot;:&quot;fade&quot;,&quot;builtinFallback&quot;:true}" data-transition="{&quot;name&quot;:&quot;fade&quot;,&quot;builtinFallback&quot;:true}" data-size="16:9">
<header>Part 4: 實戰 Prompt 技巧與避坑指南</header>

<h1 id="part-4-%E5%AF%A6%E6%88%B0-prompt-%E6%8A%80%E5%B7%A7%E8%88%87%E9%81%BF%E5%9D%91%E6%8C%87%E5%8D%97">Part 4: 實戰 Prompt 技巧與避坑指南</h1>
<h2 id="%E6%8E%8C%E6%8F%A1-ai-%E9%9B%9B%E5%BD%A2%E8%A8%AD%E8%A8%88%E7%9A%84%E9%AD%94%E6%B3%95%E5%92%92%E8%AA%9E">掌握 AI 雛形設計的魔法咒語</h2>
<footer>薛念林 教授 | 逢甲大學資訊工程學系</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="34" data-paginate="true" data-footer="薛念林 教授 | 逢甲大學資訊工程學系" data-header="Part 4: 實戰 Prompt 技巧與避坑指南" data-theme="ux-theme" lang="C" data-marpit-pagination="34" style="--paginate:true;--footer:薛念林 教授 | 逢甲大學資訊工程學系;--header:Part 4: 實戰 Prompt 技巧與避坑指南;--theme:ux-theme;" data-marpit-pagination-total="40" data-transition-back="{&quot;name&quot;:&quot;fade&quot;,&quot;builtinFallback&quot;:true}" data-transition="{&quot;name&quot;:&quot;fade&quot;,&quot;builtinFallback&quot;:true}" data-size="16:9">
<header>Part 4: 實戰 Prompt 技巧與避坑指南</header>
<h2 id="%E9%AB%98%E8%B3%AA%E9%87%8F-ui-prototyping-prompt-%E8%A8%AD%E8%A8%88%E5%85%AC%E5%BC%8F">高質量 UI Prototyping Prompt 設計公式</h2>
<div class="card">
<h3 id="%F0%9F%A7%B1-%E7%B5%90%E6%A7%8B%E5%8C%96-prompt-%E8%90%AC%E7%94%A8%E6%A8%A1%E6%9D%BF-master-formula"><img class="emoji" draggable="false" alt="🧱" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f9f1.svg" data-marp-twemoji=""/> 結構化 Prompt 萬用模板 (Master Formula)</h3>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-text">[角色設定] 你是一位專精於 Tailwind CSS 與 React 的資深 UI/UX 設計師。
[產品背景] 請為一個「[系統名稱/業務場景]」設計 [頁面名稱/功能模組]。
[使用者目標] 目標使用者是 [目標族群]，他們的核心任務是 [主要任務]。
[版面結構]
  - 頂部導航 (Navbar)：包含 [Logo, 模組選單, 使用者頭像與通知]
  - 主要工作區 (Main)：採用 [兩欄式 / 三欄卡片網格]，左側為 [...]，右側為 [...]
[關鍵互動]
  - 狀態 1 (Default)：顯示 [...]
  - 狀態 2 (Active/Hover)：當點擊 [...] 時，觸發 [Modal 彈窗 / 側邊抽屜]
  - 狀態 3 (Empty/Error)：當查無資料時，顯示 [友善插圖與建立按鈕]
[設計風格] 採用現代乾淨的配色風格，字體階層分明，善用 Badge 標籤與細微陰影。
</code></pre>
</div>
<footer>薛念林 教授 | 逢甲大學資訊工程學系</footer>
</section>

<header>Part 4: 實戰 Prompt 技巧與避坑指南</header>
<h2 id="%E5%AF%A6%E6%88%B0%E7%AF%84%E4%BE%8B%E5%84%80%E8%A1%A8%E6%9D%BF-dashboard-%E9%9B%9B%E5%BD%A2-prompt">實戰範例：儀表板 (Dashboard) 雛形 Prompt</h2>
<div class="prompt-box">
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-text">你是一位資深前端 UI/UX 工程師。請使用 React、Tailwind CSS 與 Lucide Icons
設計一個「線上學習平台 - 教師分析後台 (Teacher Analytics Dashboard)」。

【版面架構】
1. 頂部列：顯示班級切換下拉選單、學期篩選器、以及「匯出報表」按鈕。
2. 頂部 KPI 卡片區（4 欄）：
   - 總選課人數 (含較上週成長率綠色 Badge)
   - 作業繳交率 (進度環形條)
   - 平均測驗成績
   - 需關懷學生數 (紅色警示 Badge)
3. 主要圖表區 (雙欄 7:3)：
   - 左側：每週作業提交趨勢折線圖
   - 右側：待批改作業清單（附帶一鍵批改按鈕與倒數提醒）
4. 底部：學生成績分佈表格（具備排序、分頁與搜尋過濾功能）。

【互動與防呆要求】
- 滑鼠懸停於表格時需有背景高亮反饋。
- 若無待批改作業，右側需顯示「目前全部批改完成 <img class="emoji" draggable="false" alt="🎉" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f389.svg" data-marp-twemoji=""/>」的 Empty State。
</code></pre>

<header>Part 4: 實戰 Prompt 技巧與避坑指南</header>
<h2 id="ai-%E9%9B%9B%E5%BD%A2%E7%94%9F%E6%88%90%E7%9A%84%E5%B8%B8%E8%A6%8B%E7%9B%B2%E9%BB%9E%E8%88%87%E9%81%BF%E5%9D%91%E6%8C%87%E5%8D%97">AI 雛形生成的常見盲點與避坑指南</h2>
<div class="three-columns">
<div class="card" data-marpit-fragment>
<h3 id="%E2%9D%8C-%E7%9B%B2%E9%BB%9E-1-%E5%8F%AA%E9%A1%A7%E5%A5%BD%E7%9C%8B%E5%BF%BD%E7%95%A5%E7%9C%9F%E5%AF%A6%E8%B3%87%E6%96%99"><img class="emoji" draggable="false" alt="❌" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/274c.svg" data-marp-twemoji=""/> 盲點 1: 只顧好看，忽略真實資料</h3>
<ul>
<li><strong>問題</strong> ：AI 常填入完美長度的假文字，畫面很美；但真實用戶名字超長或內容破千字時直接破版。</li>
<li><strong>解法 ** ：在 Prompt 中要求處理 ** 文字截斷 (Truncation)</strong> 、省略號 <code>...</code> 與換行。</li>
</ul>
</div>
<div class="card" data-marpit-fragment>
<h3 id="%E2%9D%8C-%E7%9B%B2%E9%BB%9E-2-%E7%BC%BA%E4%B9%8F%E6%A5%B5%E7%AB%AF%E7%8B%80%E6%85%8B-edge-cases"><img class="emoji" draggable="false" alt="❌" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/274c.svg" data-marp-twemoji=""/> 盲點 2: 缺乏極端狀態 (Edge Cases)</h3>
<ul>
<li><strong>問題</strong> ：只設計最理想的成功狀態，完全遺漏「網路斷線」、「查無結果」、「無權限」等狀態。</li>
<li>**解法 ** ：明確要求 AI 生成 <strong>Empty State</strong> 、 <strong>Error State</strong> 與 <strong>Loading Skeleton</strong> 。</li>
</ul>
</div>
<div class="card" data-marpit-fragment>
<h3 id="%E2%9D%8C-%E7%9B%B2%E9%BB%9E-3-%E7%94%A2%E7%94%9F%E7%84%A1%E6%95%88%E6%88%96%E9%9B%A3%E7%B6%AD%E8%AD%B7%E7%A8%8B%E5%BC%8F%E7%A2%BC"><img class="emoji" draggable="false" alt="❌" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/274c.svg" data-marp-twemoji=""/> 盲點 3: 產生無效或難維護程式碼</h3>
<ul>
<li><strong>問題</strong> ：AI 可能拼湊出過度巢狀的 CSS 或過時的 JavaScript 寫法。</li>
<li><strong>解法</strong> ：限定使用具備 Design System 規範的組件庫（如 <code>shadcn/ui</code> 或 <code>Tailwind</code>）。</li>
</ul>
</div>
</div>
<footer>薛念林 教授 | 逢甲大學資訊工程學系</footer>
</section>

<header>Part 5: 課堂實戰演練與總結</header>

<h1 id="part-5-%E8%AA%B2%E5%A0%82%E5%AF%A6%E6%88%B0%E6%BC%94%E7%B7%B4%E8%88%87%E7%B8%BD%E7%B5%90">Part 5: 課堂實戰演練與總結</h1>
<h2 id="15-%E5%88%86%E9%90%98%E6%89%93%E9%80%A0%E5%8F%AF%E4%BA%92%E5%8B%95%E9%A9%97%E8%AD%89%E5%8E%9F%E5%9E%8B">15 分鐘打造可互動驗證原型</h2>
<footer>薛念林 教授 | 逢甲大學資訊工程學系</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="38" data-paginate="true" data-footer="薛念林 教授 | 逢甲大學資訊工程學系" data-header="Part 5: 課堂實戰演練與總結" data-theme="ux-theme" lang="C" data-marpit-pagination="38" style="--paginate:true;--footer:薛念林 教授 | 逢甲大學資訊工程學系;--header:Part 5: 課堂實戰演練與總結;--theme:ux-theme;" data-marpit-pagination-total="40" data-transition-back="{&quot;name&quot;:&quot;fade&quot;,&quot;builtinFallback&quot;:true}" data-transition="{&quot;name&quot;:&quot;fade&quot;,&quot;builtinFallback&quot;:true}" data-size="16:9">
<header>Part 5: 課堂實戰演練與總結</header>
<h2 id="%E7%B7%B4%E7%BF%92-%F0%9F%8F%84%F0%9F%8F%BB%E2%80%8D%E2%99%80%EF%B8%8F15-%E5%88%86%E9%90%98-ai-%E9%9B%9B%E5%BD%A2%E5%BF%AB%E9%80%9F%E9%A9%97%E8%AD%89%E6%8C%91%E6%88%B0">練習 <img class="emoji" draggable="false" alt="🏄🏻‍♀️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f3c4-1f3fb-200d-2640-fe0f.svg" data-marp-twemoji=""/>：15 分鐘 AI 雛形快速驗證挑戰</h2>
<div class="card" data-marpit-fragment>
<h3 id="%F0%9F%8E%AF-%E4%BB%BB%E5%8B%99%E7%9B%AE%E6%A8%99%E7%82%BA%E9%80%A2%E7%94%B2%E6%99%BA%E6%85%A7%E4%BA%8C%E6%89%8B%E6%9B%B8%E8%A8%AD%E5%82%99%E5%80%9F%E9%82%84%E5%B9%B3%E5%8F%B0%E6%89%93%E9%80%A0%E5%8F%AF%E4%BA%92%E5%8B%95%E5%8E%9F%E5%9E%8B"><img class="emoji" draggable="false" alt="🎯" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f3af.svg" data-marp-twemoji=""/> 任務目標：為「逢甲智慧二手書/設備借還平台」打造可互動原型</h3>
</div>
<div class="two-columns" style="margin-top: 14px;">
<div class="card" data-marpit-fragment>
<h3 id="%F0%9F%93%9D-%E5%AF%A6%E4%BD%9C%E6%AD%A5%E9%A9%9F-1"><img class="emoji" draggable="false" alt="📝" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4dd.svg" data-marp-twemoji=""/> 實作步驟</h3>
<ol>
<li><strong>選擇工具</strong> ：開啟 <code>v0.dev</code>、<code>Lovable</code> 或 <code>Claude Artifacts</code>。</li>
<li><strong>編寫結構化 Prompt</strong> ：
<ul>
<li>定義使用者（學生/助教）；</li>
<li>設計搜尋篩選、物品卡片、預約借用 Modal；</li>
<li>包含狀態反饋（借用成功、已被預約）。</li>
</ul>
</li>
<li><strong>啟發式走查</strong> ：自我檢核是否符合 NS01 (狀態)、NS03 (控制)、NS05 (防呆)。</li>
<li><strong>同儕測試</strong> ：同桌同學互換網址操作，記錄 1 個可改進之處並即時優化！</li>
</ol>
</div>
<div class="card" data-marpit-fragment>
<h3 id="%F0%9F%8F%86-%E8%A9%95%E5%88%86%E8%88%87%E9%A9%97%E6%94%B6%E6%A8%99%E6%BA%96"><img class="emoji" draggable="false" alt="🏆" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f3c6.svg" data-marp-twemoji=""/> 評分與驗收標準</h3>
<ul>
<li><strong>資訊架構清晰度</strong> ：搜尋與分類是否一目了然？</li>
<li><strong>防呆與錯誤處理</strong> ：已被借走的物品是否明確禁用按鈕？</li>
<li><strong>視覺層次與美感</strong> ：是否具備現代感與合理的留白？</li>
<li><strong>迭代速度</strong> ：能否在收到回饋後 3 分鐘內修正完成？</li>
</ul>
</div>
</div>
<footer>薛念林 教授 | 逢甲大學資訊工程學系</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="39" data-paginate="true" data-footer="薛念林 教授 | 逢甲大學資訊工程學系" data-header="Part 5: 課堂實戰演練與總結" data-theme="ux-theme" lang="C" data-marpit-pagination="39" style="--paginate:true;--footer:薛念林 教授 | 逢甲大學資訊工程學系;--header:Part 5: 課堂實戰演練與總結;--theme:ux-theme;" data-marpit-pagination-total="40" data-transition-back="{&quot;name&quot;:&quot;fade&quot;,&quot;builtinFallback&quot;:true}" data-transition="{&quot;name&quot;:&quot;fade&quot;,&quot;builtinFallback&quot;:true}" data-size="16:9">
<header>Part 5: 課堂實戰演練與總結</header>
<h2 id="%E8%AA%B2%E7%A8%8B%E6%A0%B8%E5%BF%83%E7%B8%BD%E7%B5%90-key-takeaways">課程核心總結 (Key Takeaways)</h2>
<div class="card" data-marpit-fragment>
<h3 id="%F0%9F%92%A1-ai-%E4%B8%8D%E6%9C%83%E5%8F%96%E4%BB%A3-ux-%E8%A8%AD%E8%A8%88%E5%B8%AB%E8%88%87%E5%B7%A5%E7%A8%8B%E5%B8%AB%E4%BD%86%E5%96%84%E7%94%A8-ai-%E5%BF%AB%E9%80%9F%E9%A9%97%E8%AD%89%E9%AB%94%E9%A9%97%E7%9A%84%E5%9C%98%E9%9A%8A%E5%B0%87%E6%B7%98%E6%B1%B0%E5%82%B3%E7%B5%B1%E5%9C%98%E9%9A%8A"><img class="emoji" draggable="false" alt="💡" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4a1.svg" data-marp-twemoji=""/> AI 不會取代 UX 設計師與工程師，但「善用 AI 快速驗證體驗」的團隊將淘汰傳統團隊！</h3>
</div>
<div class="three-columns" style="margin-top: 16px;">
<div class="card" data-marpit-fragment>
<h3 id="1-%E9%80%9F%E5%BA%A6%E5%8D%B3%E7%AB%B6%E7%88%AD%E5%8A%9B">1. 速度即競爭力</h3>
<p>將雛形驗證週期從 <strong>「數週」壓縮至「數十分鐘」</strong> ，大幅降低溝通與試錯成本。</p>
</div>
<div class="card" data-marpit-fragment>
<h3 id="2-%E7%9C%9F%E5%AF%A6%E6%93%8D%E4%BD%9C%E5%8B%9D%E9%81%8E%E5%8D%83%E8%A8%80%E8%90%AC%E8%AA%9E">2. 真實操作勝過千言萬語</h3>
<p>讓利害關係人「親手點擊」真實原型，在程式碼落地的第一天就消滅所有需求誤解。</p>
</div>
<div class="card" data-marpit-fragment>
<h3 id="3-%E6%B0%B8%E9%81%A0%E4%BB%A5%E4%BA%BA%E7%82%BA%E6%9C%AC">3. 永遠以人為本</h3>
<p>工具再快，核心依然是 <strong>以使用者為中心的 UX 原則</strong> （Nielsen 10 大原則、心理學與無障礙設計）。</p>
</div>
</div>
<footer>薛念林 教授 | 逢甲大學資訊工程學系</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="40" data-paginate="true" data-footer="薛念林 教授 | 逢甲大學資訊工程學系" data-class="lead" data-theme="ux-theme" lang="C" class="lead" data-marpit-pagination="40" style="--paginate:true;--footer:薛念林 教授 | 逢甲大學資訊工程學系;--class:lead;--theme:ux-theme;" data-marpit-pagination-total="40" data-transition-back="{&quot;name&quot;:&quot;fade&quot;,&quot;builtinFallback&quot;:true}" data-transition="{&quot;name&quot;:&quot;fade&quot;,&quot;builtinFallback&quot;:true}" data-size="16:9">
<h1 id="q--a-%E6%99%82%E9%96%93">Q &amp; A 時間</h1>
<h2 id="%E6%AD%A1%E8%BF%8E%E6%8F%90%E5%87%BA%E8%A8%8E%E8%AB%96%E8%88%87%E4%BA%A4%E6%B5%81">歡迎提出討論與交流！</h2>
<p><strong>講義編製：薛念林 教授</strong><br />
逢甲大學 資訊工程學系</p>
<script>
(function() {
  function initHeaderDropdown() {
    const sections = [];
    const seenTitles = new Set();
    const slideSections = document.querySelectorAll('section[id]');
    
    // 1. Scan unique section titles and their slide IDs
    slideSections.forEach(sec => {
      const header = sec.querySelector('header');
      if (!header) return;
      
      let title = header.textContent.trim();
      title = title.replace(/^[◄◀]\s*/, '').replace(/\s*[►▶]$/, '').trim();
      if (!title || seenTitles.has(title)) return;
      
      seenTitles.add(title);
      sections.push({
        id: sec.id,
        title: title
      });
    });

    if (sections.length === 0) return;

    // Helper to create the dropdown DOM
    function createDropdownWrapper(currentTitle) {
      const wrapper = document.createElement('span');
      wrapper.className = 'header-nav-wrapper';
      
      const titleSpan = document.createElement('span');
      titleSpan.className = 'header-nav-title';
      titleSpan.title = '點擊固定或懸停查看所有章節快速跳轉';
      titleSpan.innerHTML = currentTitle + '<span class="nav-caret"> ▾</span>';
      
      titleSpan.addEventListener('click', function(e) {
        e.stopPropagation();
        const wasOpen = wrapper.classList.contains('is-open');
        document.querySelectorAll('.header-nav-wrapper.is-open').forEach(w => w.classList.remove('is-open'));
        if (!wasOpen) {
          wrapper.classList.add('is-open');
        }
      });
      
      const dropdown = document.createElement('div');
      dropdown.className = 'nav-dropdown';
      
      dropdown.addEventListener('click', function(e) {
        e.stopPropagation();
      });
      
      const dropHeader = document.createElement('div');
      dropHeader.className = 'nav-dropdown-header';
      dropHeader.innerHTML = '<span>📑 快速跳轉章節目錄</span><span style="font-size:11px;font-weight:normal;color:#64748b;">共 ' + sections.length + ' 個章節</span>';
      dropdown.appendChild(dropHeader);
      
      const grid = document.createElement('div');
      grid.className = 'nav-dropdown-grid';
      
      sections.forEach(s => {
        const item = document.createElement('a');
        const isActive = (s.title === currentTitle);
        item.className = 'nav-dropdown-item' + (isActive ? ' active' : '');
        item.href = '#' + s.id;
        item.innerHTML = '<span class="badge">#' + s.id.padStart(2, '0') + '</span><span class="item-text" title="' + s.title + '">' + s.title + '</span>';
        
        item.addEventListener('click', function(e) {
          wrapper.classList.remove('is-open');
          dropdown.style.display = 'none';
          window.location.hash = '#' + s.id;
          setTimeout(() => { dropdown.style.display = ''; }, 350);
        });
        
        grid.appendChild(item);
      });
      
      dropdown.appendChild(grid);
      wrapper.appendChild(titleSpan);
      wrapper.appendChild(dropdown);
      return wrapper;
    }

    // Close any pinned dropdown when clicking anywhere outside
    document.addEventListener('click', function(e) {
      if (!e.target.closest('.header-nav-wrapper')) {
        document.querySelectorAll('.header-nav-wrapper.is-open').forEach(w => w.classList.remove('is-open'));
      }
    });

    // 2. Enhance each header element across all slides
    slideSections.forEach(sec => {
      const header = sec.querySelector('header');
      if (!header || header.dataset.navEnhanced) return;
      header.dataset.navEnhanced = 'true';
      
      let title = header.textContent.trim();
      title = title.replace(/^[◄◀]\s*/, '').replace(/\s*[►▶]$/, '').trim();
      if (!title) return;
      
      header.innerHTML = '';
      const wrapper = createDropdownWrapper(title);
      header.appendChild(wrapper);
    });
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', initHeaderDropdown);
  } else {
    initHeaderDropdown();
  }
  setTimeout(initHeaderDropdown, 400);
})();
</script>
