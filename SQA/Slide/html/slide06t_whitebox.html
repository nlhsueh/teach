<h1 id="%E8%BB%9F%E9%AB%94%E5%93%81%E8%B3%AA%E8%88%87%E6%B8%AC%E8%A9%A6">軟體品質與測試</h1>
<h3 id="%E7%AC%AC-6-%E7%AB%A0%E7%99%BD%E7%AE%B1%E6%B8%AC%E8%A9%A6%E6%8E%A7%E5%88%B6%E6%B5%81%E8%B7%AF%E5%BE%91%E5%88%86%E6%9E%90%E8%88%87%E8%AE%8A%E7%95%B0%E6%B8%AC%E8%A9%A6-mutation-testing">第 6 章：白箱測試、控制流路徑分析與變異測試 (Mutation Testing)</h3>
<p>授課教師：薛念林 教授</p>
<blockquote>
<p>黑箱測試檢驗系統「做什麼」，白箱測試則是程式碼層級的顯微鏡——<br />
深入控制流、資料流與邏輯分支，度量每一行程式碼被驗證的深度。<br />
「100% 覆蓋率只是起點；唯有能殺死變異體的斷言，才是真正的品質防線。」</p>
</blockquote>
<footer>Ch06 白箱測試</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="2" data-paginate="true" data-header="本章大綱 (Outline)" data-footer="Ch06 白箱測試" data-class="outline-slide" data-theme="sqa-theme" lang="C" class="outline-slide" data-marpit-pagination="2" style="--paginate:true;--header:本章大綱 (Outline);--footer:Ch06 白箱測試;--class:outline-slide;--theme:sqa-theme;" data-marpit-pagination-total="51">
<header>本章大綱 (Outline)</header>

<h2 id="%E6%9C%AC%E7%AB%A0%E9%87%8D%E9%BB%9E%E5%B0%8E%E8%AE%80-key-highlights">本章重點導讀 (Key Highlights)</h2>
<div class="outline-columns">
<div>
<h3 id="%F0%9F%A7%AD-%E6%B6%B5%E8%93%8B%E5%BA%A6%E9%9A%8E%E6%A2%AF%E8%88%87%E5%B7%A5%E5%85%B7%E6%8F%92%E6%A8%81"><img class="emoji" draggable="false" alt="🧭" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f9ed.svg" data-marp-twemoji=""/> 涵蓋度階梯與工具插樁</h3>
<ul>
<li><strong>6.1 白箱測試基礎與 JaCoCo 動態插樁</strong>：
<ul>
<li>玻璃盒測試思維、黑箱 vs. 白箱雙軌協同、V-Model 定位</li>
<li>原始碼插樁 vs. 位元組碼動態插樁 (Java Agent) 與六大計數器 (CCQ 1)</li>
<li>IntelliJ Run with Coverage 與 Maven Quality Gate 自動阻斷</li>
</ul>
</li>
<li><strong>6.2 邏輯測試涵蓋度階梯與實戰案例 (Coverage Criteria)</strong>：
<ul>
<li>敘述 (SC) ➔ 分支 (BC) ➔ 條件 (CC) ➔ 短路求值黃色鑽石解密 (CCQ 2)</li>
<li>多重條件 (MCC)、路徑爆炸、<strong>MC/DC (DO-178C / ISO 26262)</strong> 推導 (CCQ 3)</li>
<li><img class="emoji" draggable="false" alt="🧪" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f9ea.svg" data-marp-twemoji=""/> <em>實戰推演：<code>Triangle</code> 死分支之謎、<code>BinarySearch</code>、<code>BMI</code>、<code>LoanCalculator</code></em></li>
<li>破解「100% 覆蓋率等於高品質」的三大工程迷思</li>
</ul>
</li>
</ul>
</div>
<div>
<h3 id="%F0%9F%93%90-%E7%B5%90%E6%A7%8B%E8%B7%AF%E5%BE%91%E8%AE%8A%E7%95%B0%E6%B8%AC%E8%A9%A6%E8%88%87-ai-%E5%8D%94%E5%90%8C"><img class="emoji" draggable="false" alt="📐" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4d0.svg" data-marp-twemoji=""/> 結構路徑、變異測試與 AI 協同</h3>
<ul>
<li><strong>6.3 基本路徑測試與複雜度度量 (Basis Path)</strong>：
<ul>
<li>控制流程圖 (CFG) 四大基本結構與複合條件拆解</li>
<li><strong>McCabe 圈複雜度 V(G)</strong> 三大公式、<code>computeAverage</code> 與 <code>NextDate</code> 完整推演 (CCQ 4)</li>
<li>迴圈測試 (Loop Testing)、資料流測試 (DU-Path) 與認知複雜度重構 (<code>CogC</code> / <code>WMC</code>)</li>
</ul>
</li>
<li><strong>6.4 變異測試 (Mutation Testing — 測試你的測試)</strong>：
<ul>
<li>兩大理論假設 (CPH / Coupling Effect)、變異算子與 RIPR 模型</li>
<li>變異得分 <code>MS = K / (M - E)</code> 與<strong>等價變異體</strong>辨析 (CCQ 5)</li>
<li><img class="emoji" draggable="false" alt="🧪" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f9ea.svg" data-marp-twemoji=""/> <em>獵殺實戰：<code>TriangleMuTest</code>、<code>BinarySearch (bs02/bs03)</code>、<code>func(X,Y)</code> 與 PITest</em></li>
</ul>
</li>
<li><strong>6.5 AI 輔助白箱測試、符號執行與模糊測試</strong>：
<ul>
<li>符號執行 (SMT/Z3)、覆蓋率引導 Fuzzing 與人機協同 SOP (CCQ 6)</li>
</ul>
</li>
</ul>
</div>
</div>
<footer>Ch06 白箱測試</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="3" data-paginate="true" data-header="6.1 測試涵蓋度階梯與邏輯覆蓋" data-footer="Ch06 白箱測試" data-class="lead" data-theme="sqa-theme" lang="C" class="lead" data-marpit-pagination="3" style="--paginate:true;--header:6.1 測試涵蓋度階梯與邏輯覆蓋;--footer:Ch06 白箱測試;--class:lead;--theme:sqa-theme;" data-marpit-pagination-total="51">
<header>6.1 測試涵蓋度階梯與邏輯覆蓋</header>

<h1 id="61-%E6%B8%AC%E8%A9%A6%E6%B6%B5%E8%93%8B%E5%BA%A6%E9%9A%8E%E6%A2%AF%E8%88%87%E9%82%8F%E8%BC%AF%E8%A6%86%E8%93%8B-coverage-criteria"><strong>6.1 測試涵蓋度階梯與邏輯覆蓋 (Coverage Criteria)</strong></h1>
<blockquote>
<p>「從最基礎的敘述涵蓋，一路攀升至波音與 NASA 採用的 MC/DC 航太標準；<br />
理解每一層涵蓋度的邏輯強度與邊界盲區，建立嚴密的白箱測試防線。」</p>
</blockquote>
<footer>Ch06 白箱測試</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="4" data-paginate="true" data-header="6.1 測試涵蓋度階梯 (Coverage Criteria)" data-footer="Ch06 白箱測試" data-theme="sqa-theme" lang="C" data-marpit-pagination="4" style="--paginate:true;--header:6.1 測試涵蓋度階梯 (Coverage Criteria);--footer:Ch06 白箱測試;--theme:sqa-theme;" data-marpit-pagination-total="51">
<header>6.1 測試涵蓋度階梯 (Coverage Criteria)</header>

<h2 id="%E4%BB%80%E9%BA%BC%E6%98%AF%E7%99%BD%E7%AE%B1%E6%B8%AC%E8%A9%A6-white-box-testing">什麼是白箱測試 (White-Box Testing)？</h2>
<div class="card-deck">
<blockquote>
<p><img class="emoji" draggable="false" alt="💡" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4a1.svg" data-marp-twemoji=""/> 白箱測試（又稱結構測試 Structural Testing、玻璃盒測試 Glass-Box Testing）是在<strong>完全透明掌握程式內部邏輯與結構</strong>的前提下進行的測試。</p>
</blockquote>
<div class="two-columns">
<div class="card">
<h3 id="%F0%9F%94%8D-%E7%99%BD%E7%AE%B1%E6%B8%AC%E8%A9%A6%E7%9A%84%E6%A0%B8%E5%BF%83%E4%BD%BF%E5%91%BD"><img class="emoji" draggable="false" alt="🔍" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f50d.svg" data-marp-twemoji=""/> 白箱測試的核心使命</h3>
<ul>
<li><strong>透視內部工作機制</strong>：
<ul>
<li>直接針對原始碼的<strong>陳述句 (Statements)</strong>、<strong>邏輯分支 (Branches)</strong>、<strong>布林條件 (Conditions)</strong> 與<strong>執行路徑 (Paths)</strong> 設計測資。</li>
</ul>
</li>
<li><strong>量化測試充分性 (Test Adequacy)</strong>：
<ul>
<li>回答工程師最關鍵的問題：「<em>我們的測試套件到底走過了多少比例的程式碼？還有哪些角落從未被觸發？</em>」</li>
</ul>
</li>
<li><strong>揪出結構性暗疾</strong>：
<ul>
<li>捕捉永遠不會執行的死碼 (Dead Code)、考慮不周的 <code>else</code> 分支、邊界差一錯誤 (OBOB) 與變數未初始化風險。</li>
</ul>
</li>
</ul>
</div>
<div class="card">
<h3 id="%E2%9A%96%EF%B8%8F-%E9%BB%91%E7%AE%B1-ch05-vs-%E7%99%BD%E7%AE%B1-ch06-%E9%BB%83%E9%87%91%E4%BA%92%E8%A3%9C"><img class="emoji" draggable="false" alt="⚖️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/2696.svg" data-marp-twemoji=""/> 黑箱 (Ch05) vs. 白箱 (Ch06) 黃金互補</h3>
<table>
<thead>
<tr>
<th style="text-align:left">比較維度</th>
<th style="text-align:left">黑箱測試 (Black-Box)</th>
<th style="text-align:left">白箱測試 (White-Box)</th>
</tr>
</thead>
<tbody>
<tr>
<td style="text-align:left"><strong>設計依據</strong></td>
<td style="text-align:left">需求規格書 (SRS)、業務契約</td>
<td style="text-align:left">原始碼結構、控制流圖 (CFG)</td>
</tr>
<tr>
<td style="text-align:left"><strong>核心焦點</strong></td>
<td style="text-align:left">驗證 <strong>What</strong> (外顯行為)</td>
<td style="text-align:left">驗證 <strong>How</strong> (內部實作路徑)</td>
</tr>
<tr>
<td style="text-align:left"><strong>最大優勢</strong></td>
<td style="text-align:left">能抓出「<strong>遺漏的需求</strong>」</td>
<td style="text-align:left">能抓出「<strong>未預期的隱藏分支/死碼</strong>」</td>
</tr>
<tr>
<td style="text-align:left"><strong>致命盲點</strong></td>
<td style="text-align:left">測不到規格未寫的內部邏輯</td>
<td style="text-align:left"><strong>規格漏寫的功能，覆蓋率 100% 也測不出！</strong></td>
</tr>
<tr>
<td style="text-align:left"><strong>實務協同</strong></td>
<td style="text-align:left"><strong>先以黑箱 (EP/BVA) 設計基線測資</strong> ➔ <strong>再以白箱 (JaCoCo) 檢查漏網分支補彈！</strong></td>
<td style="text-align:left"></td>
</tr>
</tbody>
</table>
</div>
</div>
</div>
<footer>Ch06 白箱測試</footer>
</section>

<header>6.1 測試涵蓋度階梯 (Coverage Criteria)</header>

<h2 id="%E7%82%BA%E4%BB%80%E9%BA%BC%E5%85%89%E9%9D%A0%E9%BB%91%E7%AE%B1%E6%88%96%E7%99%BD%E7%AE%B1%E9%83%BD%E4%B8%8D%E5%A4%A0%E8%A6%8F%E6%A0%BC-vs-%E5%AF%A6%E4%BD%9C%E5%9B%9B%E8%B1%A1%E9%99%90%E7%9B%B2%E5%8D%80">為什麼光靠黑箱或白箱都不夠？「規格 vs. 實作」四象限盲區</h2>
<div class="card-deck">
<blockquote>
<p><img class="emoji" draggable="false" alt="💡" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4a1.svg" data-marp-twemoji=""/> 軟體缺陷往往躲在「<strong>規格要求 (Specification)</strong>」與「<strong>實際程式碼 (Implementation)</strong>」不一致的夾縫中。</p>
</blockquote>
<div class="two-columns">
<div class="card">
<h3 id="%F0%9F%93%8A-%E8%A6%8F%E6%A0%BC%E8%88%87%E5%AF%A6%E4%BD%9C%E7%9A%84%E4%B8%80%E8%87%B4%E6%80%A7%E5%9B%9B%E8%B1%A1%E9%99%90%E7%9F%A9%E9%99%A3"><img class="emoji" draggable="false" alt="📊" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4ca.svg" data-marp-twemoji=""/> 規格與實作的一致性四象限矩陣</h3>
<table>
<thead>
<tr>
<th style="text-align:left">象限情境</th>
<th style="text-align:center">規格有定義？</th>
<th style="text-align:center">程式有實作？</th>
<th style="text-align:center">單靠黑箱測試</th>
<th style="text-align:center">單靠白箱測試</th>
</tr>
</thead>
<tbody>
<tr>
<td style="text-align:left"><strong>1. 核心正常功能</strong></td>
<td style="text-align:center"><img class="emoji" draggable="false" alt="✅" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/2705.svg" data-marp-twemoji=""/> 有</td>
<td style="text-align:center"><img class="emoji" draggable="false" alt="✅" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/2705.svg" data-marp-twemoji=""/> 有</td>
<td style="text-align:center"><img class="emoji" draggable="false" alt="✅" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/2705.svg" data-marp-twemoji=""/> 可驗證</td>
<td style="text-align:center"><img class="emoji" draggable="false" alt="✅" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/2705.svg" data-marp-twemoji=""/> 可覆蓋</td>
</tr>
<tr>
<td style="text-align:left"><strong>2. 遺漏的需求</strong><br />(Missing Requirement)</td>
<td style="text-align:center"><img class="emoji" draggable="false" alt="✅" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/2705.svg" data-marp-twemoji=""/> <strong>有</strong></td>
<td style="text-align:center"><img class="emoji" draggable="false" alt="❌" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/274c.svg" data-marp-twemoji=""/> <strong>漏寫</strong></td>
<td style="text-align:center"><img class="emoji" draggable="false" alt="✅" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/2705.svg" data-marp-twemoji=""/> <strong>一測就抓到！</strong></td>
<td style="text-align:center"><img class="emoji" draggable="false" alt="❌" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/274c.svg" data-marp-twemoji=""/> <strong>100% 覆蓋也完全瞎掉！</strong></td>
</tr>
<tr>
<td style="text-align:left"><strong>3. 暗藏的多餘程式</strong><br />(Extra / Trojan Code)</td>
<td style="text-align:center"><img class="emoji" draggable="false" alt="❌" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/274c.svg" data-marp-twemoji=""/> <strong>無</strong></td>
<td style="text-align:center"><img class="emoji" draggable="false" alt="✅" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/2705.svg" data-marp-twemoji=""/> <strong>私自多寫</strong></td>
<td style="text-align:center"><img class="emoji" draggable="false" alt="❌" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/274c.svg" data-marp-twemoji=""/> <strong>沒規格根本不會去測！</strong></td>
<td style="text-align:center"><img class="emoji" draggable="false" alt="✅" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/2705.svg" data-marp-twemoji=""/> <strong>紅燈立刻暴行蹤！</strong></td>
</tr>
<tr>
<td style="text-align:left"><strong>4. 實作邊界小瑕疵</strong><br />(<code>&gt;=</code> 誤寫為 <code>&gt;</code>)</td>
<td style="text-align:center"><img class="emoji" draggable="false" alt="✅" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/2705.svg" data-marp-twemoji=""/> 有</td>
<td style="text-align:center"><img class="emoji" draggable="false" alt="⚠️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/26a0.svg" data-marp-twemoji=""/> 實作偏差</td>
<td style="text-align:center"><img class="emoji" draggable="false" alt="⚠️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/26a0.svg" data-marp-twemoji=""/> 隨機測資易漏抓</td>
<td style="text-align:center"><img class="emoji" draggable="false" alt="✅" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/2705.svg" data-marp-twemoji=""/> <strong>條件/變異測試精準鎖定</strong></td>
</tr>
</tbody>
</table>
</div>
<div class="card">
<h3 id="%F0%9F%9B%A1%EF%B8%8F-%E9%9B%99%E5%8A%8D%E5%90%88%E7%92%A7%E7%9A%84%E6%A8%99%E6%BA%96%E5%B7%A5%E7%A8%8B%E7%AD%96%E7%95%A5-hybrid-strategy"><img class="emoji" draggable="false" alt="🛡️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f6e1.svg" data-marp-twemoji=""/> 雙劍合璧的標準工程策略 (Hybrid Strategy)</h3>
<ul>
<li><strong>Step 1：黑箱先行（正向與邊界基線）</strong>：
<ul>
<li>根據需求規格書（SRS），運用 Ch05 的<strong>等價分割 (EP)</strong>、<strong>邊界值分析 (BVA)</strong> 與<strong>決策表</strong>設計第一波測試案例。</li>
</ul>
</li>
<li><strong>Step 2：白箱診斷（開啟覆蓋率顯微鏡）</strong>：
<ul>
<li>執行黑箱測試集並掛載 <strong>JaCoCo</strong>，檢查有哪些分支、異常處理或邊界條件呈現<strong>紅色或黃色</strong>。</li>
</ul>
</li>
<li><strong>Step 3：逆向補彈與清理死碼</strong>：
<ul>
<li>若未覆蓋分支屬於合法業務情境 ➔ <strong>補充白箱測試案例</strong>；</li>
<li>若未覆蓋分支屬於永遠不可能發生的冗餘邏輯 ➔ <strong>重構刪除死碼 (Dead Code)</strong>！</li>
</ul>
</li>
</ul>
</div>
</div>
</div>
<footer>Ch06 白箱測試</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="6" data-paginate="true" data-header="6.1 測試涵蓋度階梯 (Coverage Criteria)" data-footer="Ch06 白箱測試" data-theme="sqa-theme" lang="C" data-marpit-pagination="6" style="--paginate:true;--header:6.1 測試涵蓋度階梯 (Coverage Criteria);--footer:Ch06 白箱測試;--theme:sqa-theme;" data-marpit-pagination-total="51">
<header>6.1 測試涵蓋度階梯 (Coverage Criteria)</header>

<h2 id="%E6%B8%AC%E8%A9%A6%E6%B6%B5%E8%93%8B%E5%BA%A6%E7%B8%BD%E8%A6%BD%E8%88%87%E7%B6%93%E5%85%B8%E5%8F%97%E6%B8%AC%E7%AF%84%E4%BE%8B">測試涵蓋度總覽與經典受測範例</h2>
<div class="card-deck">
<blockquote>
<p><img class="emoji" draggable="false" alt="💡" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4a1.svg" data-marp-twemoji=""/> 不同的涵蓋度標準（Coverage Criteria）代表不同等級的測試濾網密度。我們以經典雙判斷式程式貫穿比較：</p>
</blockquote>
<div class="content-columns">
<div class="content-text">
<h3 id="%F0%9F%92%BB-%E8%AA%B2%E5%A0%82%E7%B6%93%E5%85%B8%E5%8F%97%E6%B8%AC%E7%A8%8B%E5%BC%8F%E7%89%87%E6%AE%B5"><img class="emoji" draggable="false" alt="💻" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4bb.svg" data-marp-twemoji=""/> 課堂經典受測程式片段</h3>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-number">1</span>: input A, B, X
<span class="hljs-number">2</span>: <span class="hljs-keyword">if</span> (A &gt; <span class="hljs-number">1</span>) and (B == <span class="hljs-number">0</span>) then
<span class="hljs-number">3</span>:     Y = A
<span class="hljs-number">4</span>: <span class="hljs-keyword">if</span> (A == <span class="hljs-number">2</span>) or (X &gt; <span class="hljs-number">1</span>) then
<span class="hljs-number">5</span>:     Y = X
<span class="hljs-number">6</span>: print Y
</code></pre>
<ul>
<li><strong>2 個決策分支 (Decisions / Branches)</strong>：
<ul>
<li><code>D1</code>: <code>(A &gt; 1) and (B == 0)</code> ｜ <code>D2</code>: <code>(A == 2) or (X &gt; 1)</code></li>
</ul>
</li>
<li><strong>4 個獨立條件 (Atomic Conditions)</strong>：
<ul>
<li><code>C1</code>: <code>A &gt; 1</code>、<code>C2</code>: <code>B == 0</code>、<code>C3</code>: <code>A == 2</code>、<code>C4</code>: <code>X &gt; 1</code></li>
</ul>
</li>
<li><strong>強度階梯</strong>：敘述 ➔ 分支/條件 ➔ MC/DC ➔ 多重條件 ➔ 路徑涵蓋。</li>
</ul>
</div>
<div class="content-figure">
<p><img src="../../img/ch06/BJgLrcZVT.png" alt="Coverage Hierarchy" /></p>
</div>
</div>
</div>
<footer>Ch06 白箱測試</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="7" data-paginate="true" data-header="6.1 測試涵蓋度階梯 (Coverage Criteria)" data-footer="Ch06 白箱測試" data-theme="sqa-theme" lang="C" data-marpit-pagination="7" style="--paginate:true;--header:6.1 測試涵蓋度階梯 (Coverage Criteria);--footer:Ch06 白箱測試;--theme:sqa-theme;" data-marpit-pagination-total="51">
<header>6.1 測試涵蓋度階梯 (Coverage Criteria)</header>

<h2 id="611-%E6%95%98%E8%BF%B0%E6%B6%B5%E8%93%8B%E5%BA%A6-statement-coverage-sc">6.1.1 敘述涵蓋度 (Statement Coverage, SC)</h2>
<div class="card-deck">
<blockquote>
<p><img class="emoji" draggable="false" alt="💡" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4a1.svg" data-marp-twemoji=""/> <strong>定義</strong>：設計測試案例，使程式中的<strong>每一條可執行指令敘述（Executable Statement）至少被執行一次</strong>。</p>
</blockquote>
<div class="two-columns">
<div class="card">
<h3 id="%F0%9F%8E%AF-%E9%81%94%E6%88%90-100-%E6%95%98%E8%BF%B0%E6%B6%B5%E8%93%8B%E5%8F%AA%E9%9C%80-1-%E7%AD%86%E6%B8%AC%E8%B3%87"><img class="emoji" draggable="false" alt="🎯" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f3af.svg" data-marp-twemoji=""/> 達成 100% 敘述涵蓋只需 1 筆測資</h3>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-number">1</span>: input A, B, X
<span class="hljs-number">2</span>: <span class="hljs-keyword">if</span> (A &gt; <span class="hljs-number">1</span>) and (B == <span class="hljs-number">0</span>) then
<span class="hljs-number">3</span>:     Y = A          <span class="hljs-comment">// 需進入此行</span>
<span class="hljs-number">4</span>: <span class="hljs-keyword">if</span> (A == <span class="hljs-number">2</span>) or (X &gt; <span class="hljs-number">1</span>) then
<span class="hljs-number">5</span>:     Y = X          <span class="hljs-comment">// 需進入此行</span>
<span class="hljs-number">6</span>: print Y
</code></pre>
<ul>
<li><strong>測試案例</strong>：取 <strong><code>(A, B, X) = (2, 0, 3)</code></strong>
<ul>
<li>第 2 行：<code>(2 &gt; 1) and (0 == 0)</code> 為 True ➔ 執行第 3 行 <code>Y = 2</code>。</li>
<li>第 4 行：<code>(2 == 2) or (3 &gt; 1)</code> 為 True ➔ 執行第 5 行 <code>Y = 3</code>。</li>
<li>第 6 行：印出 <code>Y = 3</code>。</li>
<li><strong>結果</strong>：第 1～6 行全部執行過，<strong>Statement Coverage = 100%！</strong></li>
</ul>
</li>
</ul>
</div>
<div class="card">
<h3 id="%E2%9A%A0%EF%B8%8F-%E7%82%BA%E4%BB%80%E9%BA%BC%E6%95%98%E8%BF%B0%E6%B6%B5%E8%93%8B%E5%BA%A6%E6%98%AF%E6%9C%80%E5%BC%B1%E7%9A%84%E6%A8%99%E6%BA%96"><img class="emoji" draggable="false" alt="⚠️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/26a0.svg" data-marp-twemoji=""/> 為什麼敘述涵蓋度是最弱的標準？</h3>
<p>即便達成 <strong>100% 敘述涵蓋</strong>，若程式存在以下嚴重 Bug，測資 <code>(2, 0, 3)</code> <strong>完全抓不出來</strong>（輸出依然是 <code>3</code>）：</p>
<ul>
<li><img class="emoji" draggable="false" alt="❌" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/274c.svg" data-marp-twemoji=""/> <strong>錯誤 1</strong>：第 2 行把 <code>and</code> 誤寫成 <code>or</code>。</li>
<li><img class="emoji" draggable="false" alt="❌" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/274c.svg" data-marp-twemoji=""/> <strong>錯誤 2</strong>：第 3 行 <code>Y = A</code> 誤寫成 <code>Y = 999</code>（因為馬上被第 5 行 <code>Y = X</code> 覆寫遮蔽了！）。</li>
<li><img class="emoji" draggable="false" alt="❌" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/274c.svg" data-marp-twemoji=""/> <strong>錯誤 3</strong>：第 4 行把 <code>X &gt; 1</code> 誤寫成 <code>X &gt; 0</code>。</li>
<li><img class="emoji" draggable="false" alt="📌" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4cc.svg" data-marp-twemoji=""/> <strong>工程結論</strong>：
<ul>
<li>敘述涵蓋完全沒有測試「判斷為 False（不進入 <code>if</code>）」的隱含空分支。它是白箱測試的<strong>最低底線</strong>，絕非安全終點！</li>
</ul>
</li>
</ul>
</div>
</div>
</div>
<footer>Ch06 白箱測試</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="8" data-paginate="true" data-header="6.1 測試涵蓋度階梯 (Coverage Criteria)" data-footer="Ch06 白箱測試" data-theme="sqa-theme" lang="C" data-marpit-pagination="8" style="--paginate:true;--header:6.1 測試涵蓋度階梯 (Coverage Criteria);--footer:Ch06 白箱測試;--theme:sqa-theme;" data-marpit-pagination-total="51">
<header>6.1 測試涵蓋度階梯 (Coverage Criteria)</header>

<h2 id="612-%E5%88%86%E6%94%AF%E6%B6%B5%E8%93%8B%E5%BA%A6-branch--decision-coverage-bc">6.1.2 分支涵蓋度 (Branch / Decision Coverage, BC)</h2>
<div class="card-deck">
<blockquote>
<p><img class="emoji" draggable="false" alt="💡" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4a1.svg" data-marp-twemoji=""/> <strong>定義</strong>：又稱決策涵蓋度（Decision Coverage），要求程式中<strong>每一個判斷式（Decision）的 True 分支與 False 分支都至少執行一次</strong>。</p>
</blockquote>
<div class="two-columns">
<div class="card">
<h3 id="%F0%9F%93%8A-%E9%9B%99%E5%88%86%E6%94%AF%E7%9C%9F%E5%81%87%E8%A6%86%E8%93%8B%E8%A8%AD%E8%A8%88"><img class="emoji" draggable="false" alt="📊" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4ca.svg" data-marp-twemoji=""/> 雙分支真假覆蓋設計</h3>
<ul>
<li>待測程式有兩個決策點：
<ul>
<li><code>D1</code>: <code>(A &gt; 1) AND (B == 0)</code></li>
<li><code>D2</code>: <code>(A == 2) OR (X &gt; 1)</code></li>
</ul>
</li>
<li>設計 <strong>2 組測試資料</strong> 即可讓兩個決策都經歷 True 與 False：</li>
</ul>
<table>
<thead>
<tr>
<th style="text-align:center">測試案例 <code>(A, B, X)</code></th>
<th style="text-align:center"><code>D1: (A&gt;1) AND (B=0)</code></th>
<th style="text-align:center"><code>D2: (A=2) OR (X&gt;1)</code></th>
<th style="text-align:center">執行路徑</th>
</tr>
</thead>
<tbody>
<tr>
<td style="text-align:center"><strong><code>t1 = (3, 0, 3)</code></strong></td>
<td style="text-align:center"><strong>True</strong> <img class="emoji" draggable="false" alt="✅" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/2705.svg" data-marp-twemoji=""/></td>
<td style="text-align:center"><strong>True</strong> <img class="emoji" draggable="false" alt="✅" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/2705.svg" data-marp-twemoji=""/></td>
<td style="text-align:center"><code>a ➔ c ➔ e</code></td>
</tr>
<tr>
<td style="text-align:center"><strong><code>t2 = (2, 1, 1)</code></strong> 或 <strong><code>(3, 1, 1)</code></strong></td>
<td style="text-align:center"><strong>False</strong> <img class="emoji" draggable="false" alt="✅" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/2705.svg" data-marp-twemoji=""/> (<code>(3,1,1)</code>)</td>
<td style="text-align:center"><strong>False</strong> <img class="emoji" draggable="false" alt="✅" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/2705.svg" data-marp-twemoji=""/> (<code>(3,1,1)</code>)</td>
<td style="text-align:center"><code>a ➔ b ➔ d</code></td>
</tr>
</tbody>
</table>
</div>
<div class="card">
<h3 id="%F0%9F%94%8D-%E5%88%86%E6%94%AF%E6%B6%B5%E8%93%8B%E7%9A%84%E7%89%B9%E6%80%A7%E8%88%87%E7%9B%B2%E9%BB%9E"><img class="emoji" draggable="false" alt="🔍" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f50d.svg" data-marp-twemoji=""/> 分支涵蓋的特性與盲點</h3>
<ul>
<li><strong>涵蓋關係定理</strong>：
<ul>
<li><strong>100% 分支涵蓋度 ➔ 必然保證 100% 敘述涵蓋度</strong>（反之不成立）。</li>
</ul>
</li>
<li><strong>分支涵蓋仍有的盲區</strong>：
<ul>
<li>複合條件內部可能只有單一子條件主導結果。</li>
<li>例如在 <code>t1=(3,0,3)</code> 與 <code>t2=(3,1,1)</code> 中：
<ul>
<li>第一個條件 <code>A &gt; 1</code> 在兩筆測資中<strong>永遠都是 True</strong>（<code>3 &gt; 1</code>）！</li>
<li>第二個決策中的 <code>A == 2</code> 在兩筆測資中<strong>永遠都是 False</strong>（<code>3 != 2</code>）！</li>
</ul>
</li>
<li>若工程師把 <code>A == 2</code> 誤寫成 <code>A == 99</code>，這組 100% 分支覆蓋的測資依然無法發現錯誤！</li>
</ul>
</li>
</ul>
</div>
</div>
</div>
<footer>Ch06 白箱測試</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="9" data-paginate="true" data-header="6.1 測試涵蓋度階梯 (Coverage Criteria)" data-footer="Ch06 白箱測試" data-theme="sqa-theme" lang="C" data-marpit-pagination="9" style="--paginate:true;--header:6.1 測試涵蓋度階梯 (Coverage Criteria);--footer:Ch06 白箱測試;--theme:sqa-theme;" data-marpit-pagination-total="51">
<header>6.1 測試涵蓋度階梯 (Coverage Criteria)</header>

<h2 id="613-%E6%A2%9D%E4%BB%B6%E6%B6%B5%E8%93%8B%E5%BA%A6-condition-coverage-cc">6.1.3 條件涵蓋度 (Condition Coverage, CC)</h2>
<div class="card-deck">
<blockquote>
<p><img class="emoji" draggable="false" alt="💡" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4a1.svg" data-marp-twemoji=""/> <strong>定義</strong>：聚焦於決策式內部的「個別原子條件（Atomic Condition）」，要求<strong>每個個別布林條件的 True 與 False 都至少被評估一次</strong>。</p>
</blockquote>
<div class="two-columns">
<div class="card">
<h3 id="%F0%9F%A7%A9-%E6%8B%86%E8%A7%A3-4-%E5%80%8B%E5%8E%9F%E5%AD%90%E6%A2%9D%E4%BB%B6%E8%88%87-8-%E7%A8%AE%E7%9C%9F%E5%81%87%E7%8B%80%E6%85%8B"><img class="emoji" draggable="false" alt="🧩" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f9e9.svg" data-marp-twemoji=""/> 拆解 4 個原子條件與 8 種真假狀態</h3>
<ul>
<li><code>D1</code>: <code>c1 (A &gt; 1)</code>、<code>c2 (B == 0)</code></li>
<li><code>D2</code>: <code>c3 (A == 2)</code>、<code>c4 (X &gt; 1)</code></li>
<li>欲使 4 個條件皆經歷 T 與 F（共 8 個目標）：
<ul>
<li><code>(1) A &gt; 1, (2) A &lt;= 1</code> ｜ <code>(3) B == 0, (4) B != 0</code></li>
<li><code>(5) A == 2, (6) A != 2</code> ｜ <code>(7) X &gt; 1,  (8) X &lt;= 1</code></li>
</ul>
</li>
<li><strong>僅需 2 筆測資即可達成 100% 條件涵蓋</strong>：
<ul>
<li><strong><code>t1 = (2, 0, 3)</code></strong> ➔ 滿足 <code>c1=T, c2=T, c3=T, c4=T</code></li>
<li><strong><code>t2 = (1, 1, 1)</code></strong> ➔ 滿足 <code>c1=F, c2=F, c3=F, c4=F</code></li>
</ul>
</li>
</ul>
</div>
<div class="card">
<h3 id="%E2%9A%A0%EF%B8%8F-%E9%97%9C%E9%8D%B5%E9%99%B7%E9%98%B1100-%E6%A2%9D%E4%BB%B6%E6%B6%B5%E8%93%8B-%E2%89%A0-100-%E5%88%86%E6%94%AF%E6%B6%B5%E8%93%8B"><img class="emoji" draggable="false" alt="⚠️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/26a0.svg" data-marp-twemoji=""/> 關鍵陷阱：100% 條件涵蓋 ≠ 100% 分支涵蓋！</h3>
<p>考慮判斷式 <code>if (p &amp;&amp; q)</code>（非短路求值下）：</p>
<table>
<thead>
<tr>
<th style="text-align:center">測試案例</th>
<th style="text-align:center">條件 <code>p</code></th>
<th style="text-align:center">條件 <code>q</code></th>
<th style="text-align:center">決策結果 <code>p &amp;&amp; q</code></th>
</tr>
</thead>
<tbody>
<tr>
<td style="text-align:center"><strong><code>t1</code></strong></td>
<td style="text-align:center"><strong>True</strong></td>
<td style="text-align:center"><strong>False</strong></td>
<td style="text-align:center"><strong>False</strong></td>
</tr>
<tr>
<td style="text-align:center"><strong><code>t2</code></strong></td>
<td style="text-align:center"><strong>False</strong></td>
<td style="text-align:center"><strong>True</strong></td>
<td style="text-align:center"><strong>False</strong></td>
</tr>
</tbody>
</table>
<ul>
<li><strong>驚人發現</strong>：
<ul>
<li>條件 <code>p</code> 有 T 有 F <img class="emoji" draggable="false" alt="✅" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/2705.svg" data-marp-twemoji=""/>；條件 <code>q</code> 有 F 有 T <img class="emoji" draggable="false" alt="✅" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/2705.svg" data-marp-twemoji=""/> ➔ <strong>條件涵蓋度 = 100%</strong>！</li>
<li>但整個決策 <code>p &amp;&amp; q</code> 的結果<strong>永遠是 False</strong> <img class="emoji" draggable="false" alt="❌" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/274c.svg" data-marp-twemoji=""/> ➔ <strong>分支涵蓋度只有 50%</strong>（甚至連 <code>if</code> 內部的敘述都沒執行到，<strong>SC 也未達 100%</strong>）！</li>
</ul>
</li>
</ul>
</div>
</div>
</div>
<footer>Ch06 白箱測試</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="10" data-paginate="true" data-header="6.1 測試涵蓋度階梯 (Coverage Criteria)" data-footer="Ch06 白箱測試" data-theme="sqa-theme" lang="C" data-marpit-pagination="10" style="--paginate:true;--header:6.1 測試涵蓋度階梯 (Coverage Criteria);--footer:Ch06 白箱測試;--theme:sqa-theme;" data-marpit-pagination-total="51">
<header>6.1 測試涵蓋度階梯 (Coverage Criteria)</header>

<h2 id="%E7%9F%AD%E8%B7%AF%E6%B1%82%E5%80%BC-short-circuit-%E8%88%87%E5%AF%A6%E5%8B%99%E5%B7%A5%E5%85%B7%E7%9A%84%E9%BB%83%E8%89%B2%E9%91%BD%E7%9F%B3%E4%B9%8B%E8%AC%8E">短路求值 (Short-Circuit) 與實務工具的「黃色鑽石」之謎</h2>
<div class="card-deck">
<blockquote>
<p><img class="emoji" draggable="false" alt="💡" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4a1.svg" data-marp-twemoji=""/> 在 Java / C / Python 中，<code>&amp;&amp;</code> 與 <code>||</code> 採用<strong>短路求值（Short-circuit evaluation）</strong>，這直接改變了條件與分支的涵蓋行為！</p>
</blockquote>
<div class="two-columns">
<div class="card">
<h3 id="%E2%9A%A1-%E7%9F%AD%E8%B7%AF%E6%B1%82%E5%80%BC%E5%A6%82%E4%BD%95%E5%BD%B1%E9%9F%BF%E6%A2%9D%E4%BB%B6%E6%B6%B5%E8%93%8B"><img class="emoji" draggable="false" alt="⚡" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/26a1.svg" data-marp-twemoji=""/> 短路求值如何影響條件涵蓋？</h3>
<ul>
<li>在 <code>if (p &amp;&amp; q)</code> 中，當 <strong><code>p</code> 為 False</strong> 時，CPU <strong>根本不會去計算 <code>q</code> 的值</strong>（直接跳過短路）！</li>
</ul>
<table>
<thead>
<tr>
<th style="text-align:center">測試案例</th>
<th style="text-align:center">條件 <code>p</code></th>
<th style="text-align:center">條件 <code>q</code> (實際執行)</th>
<th style="text-align:center">決策 <code>p &amp;&amp; q</code></th>
</tr>
</thead>
<tbody>
<tr>
<td style="text-align:center"><strong><code>t1</code></strong></td>
<td style="text-align:center"><strong>True</strong></td>
<td style="text-align:center"><strong>False</strong></td>
<td style="text-align:center"><strong>False</strong></td>
</tr>
<tr>
<td style="text-align:center"><strong><code>t2</code></strong></td>
<td style="text-align:center"><strong>False</strong></td>
<td style="text-align:center"><strong><code>x</code> (被短路未執行!)</strong></td>
<td style="text-align:center"><strong>False</strong></td>
</tr>
<tr>
<td style="text-align:center"><strong><code>t3</code></strong></td>
<td style="text-align:center"><strong>True</strong></td>
<td style="text-align:center"><strong>True</strong></td>
<td style="text-align:center"><strong>True</strong></td>
</tr>
</tbody>
</table>
<ul>
<li><strong>重要定理</strong>：在短路求值下，若要真正讓 <code>q</code> 被執行並測到 True 與 False，前提是 <code>p</code> 必須為 True；這將連帶迫使 <code>p &amp;&amp; q</code> 經歷 True 與 False！</li>
<li>因此：<strong>短路求值下若達成 100% 條件涵蓋，必同時滿足 100% 分支涵蓋</strong>！</li>
</ul>
</div>
<div class="card">
<h3 id="%F0%9F%92%8E-%E7%A0%B4%E8%A7%A3-jacoco75-%E5%88%86%E6%94%AF%E6%B6%B5%E8%93%8B-%E9%BB%83%E8%89%B2%E9%91%BD%E7%9F%B3%E8%BF%B7%E6%80%9D"><img class="emoji" draggable="false" alt="💎" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f48e.svg" data-marp-twemoji=""/> 破解 JaCoCo「75% 分支涵蓋 (黃色鑽石)」迷思</h3>
<ul>
<li><strong>為什麼我測了 <code>if (A &amp;&amp; B)</code> 的 True 與 False，JaCoCo 卻顯示黃色鑽石 (3/4 = 75%)？</strong>
<ul>
<li><strong>學術定義</strong>：把整個 <code>if (A &amp;&amp; B)</code> 當作 1 個決策（2 個分支）。</li>
<li><strong>JaCoCo 實作</strong>：在 <strong>Bytecode 層級</strong>分析！編譯器把 <code>if (A &amp;&amp; B)</code> 拆成兩個跳轉指令（<code>IFEQ A</code> 與 <code>IFEQ B</code>），共 <strong>2 × 2 = 4 個位元組碼分支</strong>。</li>
<li>若只測 <code>(A=T, B=T)</code> 與 <code>(A=F, 短路)</code>：
<ul>
<li><code>A</code> 的 T/F 都走過了 (2/2)，<code>B</code> 的 T 走過了 (1/2)，但 <strong><code>B</code> 為 False 的分支從未被觸發</strong>！</li>
<li>所以 JaCoCo 判定為 <strong>3 / 4 = 75% 分支覆蓋</strong>！</li>
</ul>
</li>
</ul>
</li>
</ul>
</div>
</div>
</div>
<footer>Ch06 白箱測試</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="11" data-paginate="true" data-header="6.1 測試涵蓋度階梯 (Coverage Criteria)" data-footer="Ch06 白箱測試" data-theme="sqa-theme" lang="C" data-marpit-pagination="11" style="--paginate:true;--header:6.1 測試涵蓋度階梯 (Coverage Criteria);--footer:Ch06 白箱測試;--theme:sqa-theme;" data-marpit-pagination-total="51">
<header>6.1 測試涵蓋度階梯 (Coverage Criteria)</header>

<h2 id="%E6%A6%82%E5%BF%B5%E6%A0%B8%E5%B0%8D%E5%95%8F%E7%AD%94-ccq-2">概念核對問答 (CCQ 2)</h2>
<div class="ccq-columns">
<div class="ccq-text">

<p><strong>問題情境</strong>：<br />
在包含短路求值 (Short-circuit evaluation) 的條件句 <code>if (A &amp;&amp; B)</code> 中，若我們設計的測試案例集達到了學術定義的 <strong>100% 分支涵蓋度 (Decision Coverage，即整個 <code>if</code> 經歷過 True 與 False)</strong>，是否必定能達成 <strong>100% 條件涵蓋度 (Condition Coverage)</strong>？</p>
<ul>
<li><strong>A)</strong> 必定可以，因為分支涵蓋度的邏輯強度高於條件涵蓋度</li>
<li><strong>B)</strong> 不一定，因為短路求值可能使第二個條件 B 在 False 分支案例中被跳過未執行，導致其 False 狀態未被覆蓋</li>
<li><strong>C)</strong> 必定不可以，因為兩者沒有任何邏輯交集關係</li>
<li><strong>D)</strong> 完全取決於作業系統排程，與短路求值無關</li>
</ul>
</div>
<div class="ccq-logo">
<p><a href="https://nlhsueh.github.io/nickedupocket/#/student/sqa-ch06-ccq2" target="_blank"><img src="../../img/ch06/sqa-ch06-ccq2.png" alt="QR Code" /></a></p>
</div>
</div>
<footer>Ch06 白箱測試</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="12" data-paginate="true" data-header="6.1 測試涵蓋度階梯 (Coverage Criteria)" data-footer="Ch06 白箱測試" data-theme="sqa-theme" lang="C" data-marpit-pagination="12" style="--paginate:true;--header:6.1 測試涵蓋度階梯 (Coverage Criteria);--footer:Ch06 白箱測試;--theme:sqa-theme;" data-marpit-pagination-total="51">
<header>6.1 測試涵蓋度階梯 (Coverage Criteria)</header>

<h2 id="614-%E5%88%86%E6%94%AF%E8%88%87%E6%A2%9D%E4%BB%B6%E6%B6%B5%E8%93%8B-%EF%BC%86-%E5%AF%A6%E6%88%B0%E6%8E%A8%E6%BC%94-sample-code-01">6.1.4 分支與條件涵蓋 ＆ 實戰推演 (<code>sample-code-01</code>)</h2>
<div class="card-deck">
<blockquote>
<p><img class="emoji" draggable="false" alt="💡" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4a1.svg" data-marp-twemoji=""/> <strong>分支與條件涵蓋度 (Branch/Condition Coverage, B/CC)</strong>：同時要求每個原子條件經歷 T/F，且每個整體決策也經歷 T/F。</p>
</blockquote>
<div class="two-columns">
<div class="card">
<h3 id="%F0%9F%92%BB-%E8%AA%B2%E5%A0%82%E6%8E%A8%E6%BC%94%E6%8C%91%E6%88%B0-sample-code-01"><img class="emoji" draggable="false" alt="💻" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4bb.svg" data-marp-twemoji=""/> 課堂推演挑戰 (<code>sample-code-01</code>)</h3>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-number">1</span>: read(X, Y)
<span class="hljs-number">2</span>: <span class="hljs-keyword">if</span> ((X &gt; <span class="hljs-number">10</span>) &amp;&amp; (Y == <span class="hljs-number">1</span>))  <span class="hljs-comment">// c1: X&gt;10, c2: Y==1, b1: c1&amp;&amp;c2</span>
<span class="hljs-number">3</span>:     X = <span class="hljs-number">1</span>;
<span class="hljs-number">4</span>: <span class="hljs-keyword">else</span> <span class="hljs-keyword">if</span> ((X - Y) &lt; <span class="hljs-number">2</span>)      <span class="hljs-comment">// c3 (b2): (X-Y) &lt; 2</span>
<span class="hljs-number">5</span>:     X = <span class="hljs-number">2</span>;
<span class="hljs-number">6</span>: <span class="hljs-keyword">if</span> (Y &gt; <span class="hljs-number">10</span>)                <span class="hljs-comment">// c4 (b3): Y &gt; 10</span>
<span class="hljs-number">7</span>:     X = <span class="hljs-number">3</span>;

<header>6.1 測試涵蓋度階梯 (Coverage Criteria)</header>

<h2 id="615-%E5%A4%9A%E9%87%8D%E6%A2%9D%E4%BB%B6%E7%B5%84%E5%90%88%E6%B6%B5%E8%93%8B-mcc-%E8%88%87-616-%E8%B7%AF%E5%BE%91%E6%B6%B5%E8%93%8B-path-coverage">6.1.5 多重條件組合涵蓋 (MCC) 與 6.1.6 路徑涵蓋 (Path Coverage)</h2>
<div class="card-deck">
<blockquote>
<p><img class="emoji" draggable="false" alt="💡" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4a1.svg" data-marp-twemoji=""/> 當我們要求窮舉單一決策內的所有條件真值表組合（MCC），或窮舉跨決策的所有路徑組合（Path Coverage）時，測試成本將急遽上升。</p>
</blockquote>
<div class="two-columns">
<div class="card">
<h3 id="%F0%9F%A7%AE-%E5%A4%9A%E9%87%8D%E6%A2%9D%E4%BB%B6%E7%B5%84%E5%90%88%E6%B6%B5%E8%93%8B-multiple-condition-mcc"><img class="emoji" draggable="false" alt="🧮" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f9ee.svg" data-marp-twemoji=""/> 多重條件組合涵蓋 (Multiple Condition, MCC)</h3>
<ul>
<li><strong>定義</strong>：每個決策內部的 n 個原子條件，其 <strong>2<sup>n</sup> 種真值表組合</strong>皆須測試。</li>
<li>以課堂程式為例：
<ul>
<li><code>D1: (A&gt;1) and (B=0)</code> 有 2<sup>2</sup> = 4 種組合：<code>(T,T), (T,F), (F,T), (F,F)</code>。</li>
<li><code>D2: (A=2) or (X&gt;1)</code> 也有 2<sup>2</sup> = 4 種組合。</li>
</ul>
</li>
<li><strong>配對壓縮後需 4 組測資</strong>：
<ul>
<li><code>(2, 0, 4)</code> ➔ 滿足 <code>D1(T,T)</code> 與 <code>D2(T,T)</code></li>
<li><code>(2, 1, 1)</code> ➔ 滿足 <code>D1(T,F)</code> 與 <code>D2(T,F)</code></li>
<li><code>(1, 0, 2)</code> ➔ 滿足 <code>D1(F,T)</code> 與 <code>D2(F,T)</code></li>
<li><code>(1, 1, 1)</code> ➔ 滿足 <code>D1(F,F)</code> 與 <code>D2(F,F)</code></li>
</ul>
</li>
</ul>
</div>
<div class="card">
<h3 id="%F0%9F%9B%A3%EF%B8%8F-%E8%B7%AF%E5%BE%91%E6%B6%B5%E8%93%8B%E5%BA%A6-path-coverage-%E8%88%87%E8%B7%AF%E5%BE%91%E7%88%86%E7%82%B8"><img class="emoji" draggable="false" alt="🛣️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f6e3.svg" data-marp-twemoji=""/> 路徑涵蓋度 (Path Coverage) 與路徑爆炸</h3>
<ul>
<li>即使上述 4 組測資達成了 <strong>100% MCC</strong>，觀察流程圖路徑：
<ul>
<li><code>(2, 0, 4)</code> 走 <strong><code>a - c - e</code></strong></li>
<li><code>(2, 1, 1)</code> 與 <code>(1, 0, 2)</code> 皆走 <strong><code>a - b - e</code></strong></li>
<li><code>(1, 1, 1)</code> 走 <strong><code>a - b - d</code></strong></li>
<li><img class="emoji" draggable="false" alt="⚠️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/26a0.svg" data-marp-twemoji=""/> <strong>漏掉了路徑 <code>a - c - d</code></strong>（需補測資如 <code>(3, 0, 1)</code>）！</li>
</ul>
</li>
<li><strong>迴圈導致的路徑組合爆炸</strong>：
<ul>
<li>若程式包含一個執行 20 次的迴圈，且迴圈內有 4 條分支路徑，總路徑數高達 <strong>4<sup>20</sup> = 2<sup>40</sup> ≈ 1.1 × 10<sup>12</sup>（一兆條路徑）</strong>！因此實務上不可能執行 All-Path 窮盡測試。</li>
</ul>
</li>
</ul>
</div>
</div>
</div>
<footer>Ch06 白箱測試</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="14" data-paginate="true" data-header="6.1 測試涵蓋度階梯 (Coverage Criteria)" data-footer="Ch06 白箱測試" data-theme="sqa-theme" lang="C" data-marpit-pagination="14" style="--paginate:true;--header:6.1 測試涵蓋度階梯 (Coverage Criteria);--footer:Ch06 白箱測試;--theme:sqa-theme;" data-marpit-pagination-total="51">
<header>6.1 測試涵蓋度階梯 (Coverage Criteria)</header>

<h2 id="617-%E8%88%AA%E5%A4%AA%E5%AE%89%E5%85%A8%E9%97%9C%E9%8D%B5%E6%A8%99%E6%BA%96mcdc-%E6%B6%B5%E8%93%8B%E5%BA%A6-do-178c-level-a">6.1.7 航太安全關鍵標準：MC/DC 涵蓋度 (DO-178C Level A)</h2>
<div class="card-deck">
<blockquote>
<p><img class="emoji" draggable="false" alt="💡" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4a1.svg" data-marp-twemoji=""/> <strong>MC/DC (Modified Condition/Decision Coverage，修改條件/決策涵蓋)</strong>：波音、空中巴士飛控系統（DO-178B/C Level A）與車用電子（ISO 26262 ASIL D）強制要求的最高白箱標準！</p>
</blockquote>
<div class="two-columns">
<div class="card">
<h3 id="%E2%9C%88%EF%B8%8F-%E7%82%BA%E4%BB%80%E9%BA%BC%E9%9C%80%E8%A6%81-mcdc"><img class="emoji" draggable="false" alt="✈️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/2708.svg" data-marp-twemoji=""/> 為什麼需要 MC/DC？</h3>
<ul>
<li><strong>痛點</strong>：若一個飛控判斷式包含 6 個條件 <code>if (C1 &amp;&amp; C2 &amp;&amp; ... &amp;&amp; C6)</code>：
<ul>
<li><strong>多重條件組合 (MCC)</strong> 需要 <strong>2<sup>6</sup> = 64 組</strong>測試（若 10 個條件則需 1,024 組），成本過高。</li>
<li><strong>一般分支/條件涵蓋</strong> 又太弱，無法防止條件之間的遮蔽效應（Masking Effect）。</li>
</ul>
</li>
<li><strong>MC/DC 的革命性突破</strong>：
<ul>
<li>要求證明「<strong>每一個原子條件 C<sub>i</sub> 都能獨立影響整個決策的最終結果</strong>」！</li>
<li>測試案例數從指數級 <strong>2<sup>n</sup></strong> 奇蹟般壓縮為線性級的 <strong><code>n + 1</code>（最少 <code>n + 1</code> 個，最多 <code>2n</code> 個）</strong>！</li>
</ul>
</li>
</ul>
</div>
<div class="card">
<h3 id="%F0%9F%93%8F-mcdc-%E7%9A%84%E5%9B%9B%E5%A4%A7%E6%A0%B8%E5%BF%83%E6%A7%8B%E6%88%90%E8%A6%81%E4%BB%B6"><img class="emoji" draggable="false" alt="📏" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4cf.svg" data-marp-twemoji=""/> MC/DC 的四大核心構成要件</h3>
<ol>
<li><strong>敘述與分支涵蓋</strong>：每個決策的 True 與 False 結果都至少出現一次。</li>
<li><strong>條件涵蓋</strong>：決策中的每個條件 C<sub>i</sub> 都曾取過 True 與 False。</li>
<li><strong>獨立影響對 (Independence Pair) —— 核心靈魂</strong>：
<ul>
<li>對於決策中的<strong>每一個條件 C<sub>i</sub></strong>，都必須在測試集中找到<strong>一對測試案例 (Test Pair)</strong>：
<ul>
<li><img class="emoji" draggable="false" alt="📌" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4cc.svg" data-marp-twemoji=""/> <strong>唯一變因</strong>：在這對案例中，<strong>只有 C<sub>i</sub> 的真假值翻轉（T ↔ F），其餘所有條件的值保持固定不變</strong>；</li>
<li><img class="emoji" draggable="false" alt="📌" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4cc.svg" data-marp-twemoji=""/> <strong>結果翻轉</strong>：同時，<strong>整個決策的最終輸出結果也隨之翻轉（T ↔ F）</strong>！</li>
</ul>
</li>
</ul>
</li>
</ol>
</div>
</div>
</div>
<footer>Ch06 白箱測試</footer>
</section>

<div class="card">
<h3 id="%F0%9F%94%8D-%E9%80%90%E4%B8%80%E6%AA%A2%E9%A9%97%E4%B8%89%E5%80%8B%E6%A2%9D%E4%BB%B6%E7%9A%84%E7%8D%A8%E7%AB%8B%E5%BD%B1%E9%9F%BF%E5%B0%8D"><img class="emoji" draggable="false" alt="🔍" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f50d.svg" data-marp-twemoji=""/> 逐一檢驗三個條件的獨立影響對</h3>
<ul>
<li><strong>1. 檢驗 <code>A</code> ➔ 配對 <code>(#2, #6)</code></strong>：<code>#2(F,F,T)➔F</code> vs <code>#6(T,F,T)➔T</code>
<ul>
<li>固定 <code>B=F, C=T</code>，僅 <code>A</code> 翻轉，決策隨之翻轉 <img class="emoji" draggable="false" alt="✅" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/2705.svg" data-marp-twemoji=""/></li>
</ul>
</li>
<li><strong>2. 檢驗 <code>B</code> ➔ 配對 <code>(#2, #4)</code></strong>：<code>#2(F,F,T)➔F</code> vs <code>#4(F,T,T)➔T</code>
<ul>
<li>固定 <code>A=F, C=T</code>，僅 <code>B</code> 翻轉，決策隨之翻轉 <img class="emoji" draggable="false" alt="✅" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/2705.svg" data-marp-twemoji=""/></li>
</ul>
</li>
<li><strong>3. 檢驗 <code>C</code> ➔ 配對 <code>(#5, #6)</code></strong>：<code>#5(T,F,F)➔F</code> vs <code>#6(T,F,T)➔T</code>
<ul>
<li>固定 <code>A=T, B=F</code>，僅 <code>C</code> 翻轉，決策隨之翻轉 <img class="emoji" draggable="false" alt="✅" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/2705.svg" data-marp-twemoji=""/></li>
</ul>
</li>
<li><img class="emoji" draggable="false" alt="🏆" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f3c6.svg" data-marp-twemoji=""/> <strong>結論</strong>：僅需 <strong><code>{#2, #4, #5, #6}</code> 共 4 組 (n+1)</strong>！</li>
</ul>
</div>
</div>
</div>
<footer>Ch06 白箱測試</footer>

<header>6.1 測試涵蓋度階梯 (Coverage Criteria)</header>

<h2 id="%E5%9C%8B%E9%9A%9B%E5%8A%9F%E8%83%BD%E5%AE%89%E5%85%A8%E6%B3%95%E8%A6%8F%E6%A8%99%E6%BA%96do-178c-%E8%88%AA%E5%A4%AA-%E8%88%87-iso-26262-%E8%BB%8A%E8%A6%8F">國際功能安全法規標準：DO-178C (航太) 與 ISO 26262 (車規)</h2>
<div class="card-deck">
<blockquote>
<p><img class="emoji" draggable="false" alt="💡" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4a1.svg" data-marp-twemoji=""/> 在人命關天的安全關鍵系統（Safety-Critical Systems）中，你寫的軟體若沒達到法規指定的白箱覆蓋率，飛機不能起飛、電動車不能上市！</p>
</blockquote>
<div class="two-columns">
<div class="card">
<h3 id="%E2%9C%88%EF%B8%8F-%E8%88%AA%E5%A4%AA%E8%88%87%E8%BB%8A%E7%94%A8%E5%8A%9F%E8%83%BD%E5%AE%89%E5%85%A8%E7%AD%89%E7%B4%9A%E5%B0%8D%E7%85%A7%E8%A1%A8"><img class="emoji" draggable="false" alt="✈️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/2708.svg" data-marp-twemoji=""/> 航太與車用功能安全等級對照表</h3>
<table>
<thead>
<tr>
<th style="text-align:left">安全失效後果</th>
<th style="text-align:center">航太 DO-178C 等級</th>
<th style="text-align:center">車用 ISO 26262 等級</th>
<th style="text-align:left">強制要求之白箱覆蓋標準</th>
</tr>
</thead>
<tbody>
<tr>
<td style="text-align:left"><strong>災難性 (Catastrophic)</strong><br />機毀人亡 / 轉向煞車失控</td>
<td style="text-align:center"><strong>DAL A</strong></td>
<td style="text-align:center"><strong>ASIL D</strong></td>
<td style="text-align:left"><strong>100% SC + 100% BC + 100% MC/DC</strong> <img class="emoji" draggable="false" alt="🏆" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f3c6.svg" data-marp-twemoji=""/></td>
</tr>
<tr>
<td style="text-align:left"><strong>危險/嚴重 (Hazardous)</strong><br />重傷或關鍵系統失效</td>
<td style="text-align:center"><strong>DAL B</strong></td>
<td style="text-align:center"><strong>ASIL C</strong></td>
<td style="text-align:left"><strong>100% SC + 100% BC</strong> (車規高度建議 MC/DC)</td>
</tr>
<tr>
<td style="text-align:left"><strong>主要 (Major)</strong><br />系統功能降級或輕傷</td>
<td style="text-align:center"><strong>DAL C</strong></td>
<td style="text-align:center"><strong>ASIL B / A</strong></td>
<td style="text-align:left"><strong>100% SC</strong> (車規 ASIL B 要求 100% BC)</td>
</tr>
<tr>
<td style="text-align:left"><strong>輕微/無影響 (Minor)</strong></td>
<td style="text-align:center"><strong>DAL D / E</strong></td>
<td style="text-align:center"><strong>QM</strong></td>
<td style="text-align:left">無強制結構覆蓋要求</td>
</tr>
</tbody>
</table>
</div>
<div class="card">
<h3 id="%F0%9F%94%AC-unique-cause-vs-masking-mcdc"><img class="emoji" draggable="false" alt="🔬" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f52c.svg" data-marp-twemoji=""/> Unique-Cause vs. Masking MC/DC</h3>
<ul>
<li><strong>1. 唯一原因型 (Unique-Cause MC/DC)</strong>：
<ul>
<li>經典定義：測試對中<strong>嚴格只允許待測條件 C<sub>i</sub> 翻轉</strong>，其他條件字面值完全固定不變。</li>
<li>痛點：當同一個變數在決策中出現兩次（<strong>耦合條件 Coupled Conditions</strong>，如 <code>(A &amp;&amp; B) || (!A &amp;&amp; C)</code>）時，改變 <code>A</code> 必然同時改變 <code>!A</code>，無法構造 Unique-Cause 配對！</li>
</ul>
</li>
<li><strong>2. 遮蔽型 (Masking MC/DC)</strong>：
<ul>
<li>工程界與 FAA 認證認可的廣義標準：只要讓其他子表達式被短路或邏輯遮蔽（不會影響最終輸出），即允許耦合條件翻轉，解決了重複變數無法配對的難題！</li>
</ul>
</li>
</ul>
</div>
</div>
</div>
<footer>Ch06 白箱測試</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="17" data-paginate="true" data-header="6.1 測試涵蓋度階梯 (Coverage Criteria)" data-footer="Ch06 白箱測試" data-theme="sqa-theme" lang="C" data-marpit-pagination="17" style="--paginate:true;--header:6.1 測試涵蓋度階梯 (Coverage Criteria);--footer:Ch06 白箱測試;--theme:sqa-theme;" data-marpit-pagination-total="51">
<header>6.1 測試涵蓋度階梯 (Coverage Criteria)</header>

<h2 id="%E6%A6%82%E5%BF%B5%E6%A0%B8%E5%B0%8D%E5%95%8F%E7%AD%94-ccq-3">概念核對問答 (CCQ 3)</h2>
<div class="ccq-columns">
<div class="ccq-text">

<p><strong>問題情境</strong>：<br />
考慮一個包含 n 個彼此獨立之布林條件的複雜判斷式（例如 <code>A &amp;&amp; B &amp;&amp; C</code>，n = 3）。若要滿足航太級 <strong>MC/DC (Modified Condition/Decision Coverage)</strong> 覆蓋率標準，最少與最多分別需要設計幾個測試案例？</p>
<ul>
<li><strong>A)</strong> 最少 n + 1 個，最多 2n 個</li>
<li><strong>B)</strong> 最少 n + 1 個，最多 2<sup>n</sup> 個</li>
<li><strong>C)</strong> 最少 2<sup>n</sup> 個，最多 2<sup>n</sup> 個</li>
<li><strong>D)</strong> 最少 2n 個，最多 2<sup>n</sup> 個</li>
</ul>
</div>
<div class="ccq-logo">
<p><a href="https://nlhsueh.github.io/nickedupocket/#/student/sqa-ch06-ccq3" target="_blank"><img src="../../img/ch06/sqa-ch06-ccq3.png" alt="QR Code" /></a></p>
</div>
</div>
<footer>Ch06 白箱測試</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="18" data-paginate="true" data-header="6.1 測試涵蓋度階梯 (Coverage Criteria)" data-footer="Ch06 白箱測試" data-theme="sqa-theme" lang="C" data-marpit-pagination="18" style="--paginate:true;--header:6.1 測試涵蓋度階梯 (Coverage Criteria);--footer:Ch06 白箱測試;--theme:sqa-theme;" data-marpit-pagination-total="51">
<header>6.1 測試涵蓋度階梯 (Coverage Criteria)</header>

<h2 id="618-%E7%A0%B4%E8%A7%A3%E7%99%BE%E5%88%86%E7%99%BE%E6%B6%B5%E8%93%8B%E5%BA%A6-100-coverage%E7%9A%84%E4%B8%89%E5%A4%A7%E8%BF%B7%E6%80%9D">6.1.8 破解「百分百涵蓋度 (100% Coverage)」的三大迷思</h2>
<div class="card-deck">
<blockquote>
<p><img class="emoji" draggable="false" alt="💡" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4a1.svg" data-marp-twemoji=""/> 「<strong>程式碼覆蓋率是一個發現未測盲區的指標，而不是盲目追求的硬性目標。</strong>」—— 當覆蓋率成為 KPI 時，根據古德哈特定律（Goodhart's Law），它就不再是個好指標。</p>
</blockquote>
<div class="three-columns">
<div class="card">
<h3 id="%F0%9F%93%89-1-%E9%82%8A%E9%9A%9B%E6%95%88%E7%9B%8A%E9%81%9E%E6%B8%9B-roi-%E5%B4%A9%E8%B7%8C"><img class="emoji" draggable="false" alt="📉" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4c9.svg" data-marp-twemoji=""/> 1. 邊際效益遞減 (ROI 崩跌)</h3>
<ul>
<li><strong>0% ➔ 85%</strong>：
<ul>
<li>投入產出比極高，能迅速攔截絕大多數核心業務缺陷。</li>
</ul>
</li>
<li><strong>95% ➔ 100%</strong>：
<ul>
<li>耗費的時間與 Mock 複雜度呈<strong>指數級暴增</strong>！</li>
<li>為了湊滿最後 5%（如極罕見的 OS 底層 IO 異常、防禦性 <code>default</code> 分支、Getter/Setter），寫出大量脆弱且難以維護的測試，得不償失。</li>
</ul>
</li>
</ul>
</div>
<div class="card">
<h3 id="%F0%9F%8E%AD-2-%E5%9F%B7%E8%A1%8C%E9%81%8E-%E2%89%A0-%E9%A9%97%E8%AD%89%E6%AD%A3%E7%A2%BA-%E7%84%A1%E6%96%B7%E8%A8%80%E6%B8%AC%E8%A9%A6"><img class="emoji" draggable="false" alt="🎭" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f3ad.svg" data-marp-twemoji=""/> 2. 執行過 ≠ 驗證正確 (無斷言測試)</h3>
<ul>
<li><strong>覆蓋率只看「有沒有跑過那一行」</strong>：
<ul>
<li>工程師若寫出<strong>沒有 <code>assertEquals</code> 的測試（Assertion-free Test）</strong>，或者斷言條件極度敷衍（只寫 <code>assertNotNull</code>），覆蓋率一樣衝上 100%！</li>
</ul>
</li>
<li><strong>無法抓出算式寫反</strong>：
<ul>
<li>若 <code>a + b</code> 誤寫為 <code>a * b</code>，測資給 <code>(2, 2)</code>，100% 覆蓋且通過，但邏輯卻是錯的（需靠 <strong>6.4 變異測試</strong> 破解）。</li>
</ul>
</li>
</ul>
</div>
<div class="card">
<h3 id="%F0%9F%95%B3%EF%B8%8F-3-%E6%B8%AC%E4%B8%8D%E5%87%BA%E9%81%BA%E6%BC%8F%E7%9A%84%E8%A6%8F%E6%A0%BC-missing-code"><img class="emoji" draggable="false" alt="🕳️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f573.svg" data-marp-twemoji=""/> 3. 測不出「遺漏的規格 (Missing Code)」</h3>
<ul>
<li><strong>白箱只能測「已經寫出來的程式碼」</strong>：
<ul>
<li>如果需求規定「VIP 生日當月享 5 折」，但工程師<strong>根本忘了寫這個 <code>if</code> 判斷式</strong>；</li>
<li>現有程式碼依然能輕鬆跑出 <strong>100% Line &amp; Branch Coverage</strong>！</li>
</ul>
</li>
<li><strong>最佳實務策略</strong>：
<ul>
<li>設定務實門檻（<strong>核心業務模組 85%～90%，全專案 75%～80%</strong>），結合黑箱邊界與變異測試！</li>
</ul>
</li>
</ul>
</div>
</div>
</div>
<footer>Ch06 白箱測試</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="19" data-paginate="true" data-header="6.1 測試涵蓋度階梯 (Coverage Criteria)" data-footer="Ch06 白箱測試" data-theme="sqa-theme" lang="C" data-marpit-pagination="19" style="--paginate:true;--header:6.1 測試涵蓋度階梯 (Coverage Criteria);--footer:Ch06 白箱測試;--theme:sqa-theme;" data-marpit-pagination-total="51">
<header>6.1 測試涵蓋度階梯 (Coverage Criteria)</header>

<h2 id="%F0%9F%A7%AA-%E5%AF%A6%E6%88%B0%E6%A1%88%E4%BE%8B-1trianglejava-%E8%A4%87%E5%90%88%E6%A2%9D%E4%BB%B6%E8%88%87%E6%B0%B8%E9%81%A0-83-%E7%9A%84%E6%AD%BB%E5%88%86%E6%94%AF%E8%A7%A3%E5%AF%86"><img class="emoji" draggable="false" alt="🧪" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f9ea.svg" data-marp-twemoji=""/> 實戰案例 1：<code>Triangle.java</code> 複合條件與「永遠 83% 的死分支」解密</h2>
<div class="card-deck">
<blockquote>
<p><img class="emoji" draggable="false" alt="💡" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4a1.svg" data-marp-twemoji=""/> <img class="emoji" draggable="false" alt="📄" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4c4.svg" data-marp-twemoji=""/> 實習手冊：[whitebox_test.md#lab-1](file:///Users/nick-mini-26/oTeach/SQA/LabDemo/docs/u06_wbtesting/whitebox_test.md#lab-1-triangle-三角形測試與覆蓋度分析) ｜ <img class="emoji" draggable="false" alt="💻" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4bb.svg" data-marp-twemoji=""/> 待測原始碼：[Triangle.java](file:///Users/nick-mini-26/oTeach/SQA/LabDemo/src/main/java/u06_coverage/Triangle.java)</p>
</blockquote>
<div class="two-columns">
<div class="card">
<h3 id="%F0%9F%92%BB-trianglejava-%E5%8E%9F%E5%A7%8B%E7%A2%BC%E8%88%87-bytecode-%E5%88%86%E6%94%AF%E7%B5%B1%E8%A8%88"><img class="emoji" draggable="false" alt="💻" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4bb.svg" data-marp-twemoji=""/> <code>Triangle.java</code> 原始碼與 Bytecode 分支統計</h3>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-keyword">public</span> <span class="hljs-keyword">static</span> String <span class="hljs-title function_">getTriangleType</span><span class="hljs-params">(<span class="hljs-type">int</span> a, <span class="hljs-type">int</span> b, <span class="hljs-type">int</span> c)</span> {
    <span class="hljs-comment">// 決策 1：6 個子條件 = 12 個 Bytecode 分支</span>
    <span class="hljs-keyword">if</span> (a &lt;= <span class="hljs-number">0</span> || b &lt;= <span class="hljs-number">0</span> || c &lt;= <span class="hljs-number">0</span> ||
        a + b &lt;= c || a + c &lt;= b || b + c &lt;= a) {
        <span class="hljs-keyword">return</span> <span class="hljs-string">&quot;非三角形&quot;</span>;
    }
    <span class="hljs-comment">// 決策 2：3 個子條件 = 6 個 Bytecode 分支 (⚠ 陷阱!)</span>
    <span class="hljs-keyword">if</span> (a == b &amp;&amp; b == c &amp;&amp; a == c) {
        <span class="hljs-keyword">return</span> <span class="hljs-string">&quot;正三角形&quot;</span>;
    }
    <span class="hljs-comment">// 決策 3：3 個子條件 = 6 個 Bytecode 分支</span>
    <span class="hljs-keyword">if</span> (a == b || b == c || a == c) {
        <span class="hljs-keyword">return</span> <span class="hljs-string">&quot;等腰三角形&quot;</span>;
    }
    <span class="hljs-keyword">return</span> <span class="hljs-string">&quot;一般三角形&quot;</span>;
}
</code></pre>
</div>
<div class="card">
<h3 id="%F0%9F%94%8D-%E6%95%B8%E5%AD%B8%E9%81%9E%E7%A7%BB%E5%BE%8B%E4%B8%8D%E5%8F%AF%E9%81%94%E6%AD%BB%E5%88%86%E6%94%AF-%EF%BC%86-%F0%9F%8E%AF-%E5%AF%A6%E4%BD%9C%E4%BB%BB%E5%8B%99"><img class="emoji" draggable="false" alt="🔍" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f50d.svg" data-marp-twemoji=""/> 數學遞移律不可達死分支 ＆ <img class="emoji" draggable="false" alt="🎯" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f3af.svg" data-marp-twemoji=""/> 實作任務</h3>
<ul>
<li><strong>觀察決策 2</strong>：<code>if (a == b &amp;&amp; b == c &amp;&amp; a == c)</code>
<ul>
<li>要評估第 3 個條件 <code>a == c</code>，前提是 <code>a == b</code> 與 <code>b == c</code> 皆成立！</li>
<li>根據數學<strong>遞移律 (Transitivity)</strong>：<code>a == c</code> <strong>恆為 True</strong>！</li>
<li>故 <code>a == c</code> 為 False 的分支在宇宙中永遠不可能發生（<strong>Infeasible Branch</strong>），JaCoCo 永遠停在 <strong>5/6 = 83.3%</strong>！</li>
</ul>

<li><img class="emoji" draggable="false" alt="🎯" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f3af.svg" data-marp-twemoji=""/> <strong>Lab 3 實作任務</strong>：

</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="20" data-paginate="true" data-header="6.2 JaCoCo 動態插樁與涵蓋度度量" data-footer="Ch06 白箱測試" data-theme="sqa-theme" lang="C" data-marpit-pagination="20" style="--paginate:true;--header:6.2 JaCoCo 動態插樁與涵蓋度度量;--footer:Ch06 白箱測試;--theme:sqa-theme;" data-marpit-pagination-total="51">
<header>6.2 JaCoCo 動態插樁與涵蓋度度量</header>

<h2 id="%E7%A8%8B%E5%BC%8F%E7%A2%BC%E6%8F%92%E6%A8%81-code-instrumentation-%E4%B8%89%E5%A4%A7%E6%8A%80%E8%A1%93%E6%B5%81%E6%B4%BE%E6%AF%94%E8%BC%83">程式碼插樁 (Code Instrumentation) 三大技術流派比較</h2>
<div class="card-deck">
<blockquote>
<p><img class="emoji" draggable="false" alt="💡" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4a1.svg" data-marp-twemoji=""/> 覆蓋率工具是如何知道「哪一行被執行過」的？底層核心技術稱為<strong>探針插樁（Probe Instrumentation）</strong>。</p>
</blockquote>
<div class="three-columns">
<div class="card">
<h3 id="%F0%9F%93%9D-1-%E5%8E%9F%E5%A7%8B%E7%A2%BC%E6%8F%92%E6%A8%81"><img class="emoji" draggable="false" alt="📝" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4dd.svg" data-marp-twemoji=""/> 1. 原始碼插樁</h3>
<p><strong>(Source-Level Instrumentation)</strong></p>
<ul>
<li><strong>運作方式</strong>：
<ul>
<li>在編譯前先透過預處理器修改 <code>.java</code> / <code>.c</code> 原始碼，在每個分支插入 <code>count[i]++</code> 後再編譯。</li>
</ul>
</li>
<li><strong>代表工具</strong>：Gcov (C/C++)、早期 Clover。</li>
<li><strong>優缺點</strong>：
<ul>
<li><img class="emoji" draggable="false" alt="✅" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/2705.svg" data-marp-twemoji=""/> 概念直覺、可跨執行環境。</li>
<li><img class="emoji" draggable="false" alt="❌" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/274c.svg" data-marp-twemoji=""/> <strong>嚴重污染原始碼目錄</strong>、編譯時間翻倍，且可能改變行號與執行時序。</li>
</ul>
</li>
</ul>
</div>
<div class="card">
<h3 id="%F0%9F%93%A6-2-%E9%9B%A2%E7%B7%9A%E4%BD%8D%E5%85%83%E7%B5%84%E7%A2%BC%E6%8F%92%E6%A8%81"><img class="emoji" draggable="false" alt="📦" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4e6.svg" data-marp-twemoji=""/> 2. 離線位元組碼插樁</h3>
<p><strong>(Offline Bytecode Instrumentation)</strong></p>
<ul>
<li><strong>運作方式</strong>：
<ul>
<li><code>javac</code> 編譯出 <code>.class</code> 後，先執行一道專用的插樁指令改寫磁碟上的 <code>.class</code> 檔，再啟動測試。</li>
</ul>
</li>
<li><strong>代表工具</strong>：Cobertura、JaCoCo Offline 模式。</li>
<li><strong>優缺點</strong>：
<ul>
<li><img class="emoji" draggable="false" alt="✅" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/2705.svg" data-marp-twemoji=""/> 支援不允許掛載 <code>-javaagent</code> 的受限環境（如早期 Android Dalvik）。</li>
<li><img class="emoji" draggable="false" alt="❌" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/274c.svg" data-marp-twemoji=""/> 磁碟上的 <code>.class</code> 被改寫，若忘記重新編譯可能把探針打包進正式環境 JAR！</li>
</ul>
</li>
</ul>
</div>
<div class="card">
<h3 id="%E2%9A%A1-3-%E5%8B%95%E6%85%8B%E8%A8%98%E6%86%B6%E9%AB%94%E6%8F%92%E6%A8%81-%E4%B8%BB%E6%B5%81"><img class="emoji" draggable="false" alt="⚡" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/26a1.svg" data-marp-twemoji=""/> 3. 動態記憶體插樁 (主流!)</h3>
<p><strong>(On-the-fly Java Agent)</strong></p>
<ul>
<li><strong>運作方式</strong>：
<ul>
<li>磁碟上的 <code>.java</code> 與 <code>.class</code> <strong>完全保持原樣</strong>！</li>
<li>僅在 JVM 啟動測試時透過 <code>-javaagent</code> 於記憶體載入瞬間動態注入 <code>boolean[]</code> 探針。</li>
</ul>
</li>
<li><strong>代表工具</strong>：<strong>JaCoCo 預設模式</strong>、IntelliJ Runner。</li>
<li><strong>優缺點</strong>：
<ul>
<li><img class="emoji" draggable="false" alt="✅" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/2705.svg" data-marp-twemoji=""/> <strong>零原始碼污染、零磁碟 <code>.class</code> 污染</strong>、速度極快（僅約 3%~5% 記憶體開銷）！</li>
</ul>
</li>
</ul>
</div>
</div>
</div>
<footer>Ch06 白箱測試</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="21" data-paginate="true" data-header="6.2 JaCoCo 動態插樁與涵蓋度度量" data-footer="Ch06 白箱測試" data-theme="sqa-theme" lang="C" data-marpit-pagination="21" style="--paginate:true;--header:6.2 JaCoCo 動態插樁與涵蓋度度量;--footer:Ch06 白箱測試;--theme:sqa-theme;" data-marpit-pagination-total="51">
<header>6.2 JaCoCo 動態插樁與涵蓋度度量</header>

<h2 id="%E7%8F%BE%E4%BB%A3%E8%A6%86%E8%93%8B%E7%8E%87%E5%BC%95%E6%93%8Ejacoco-%E5%8B%95%E6%85%8B%E4%BD%8D%E5%85%83%E7%B5%84%E7%A2%BC%E6%8F%92%E6%A8%81%E5%8E%9F%E7%90%86">現代覆蓋率引擎：JaCoCo 動態位元組碼插樁原理</h2>
<div class="card-deck">
<blockquote>
<p><img class="emoji" draggable="false" alt="💡" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4a1.svg" data-marp-twemoji=""/> <strong>JaCoCo (Java Code Coverage)</strong> 不會修改你的 <code>.java</code> 原始碼，而是利用 <strong>Java Agent</strong> 在記憶體載入階段動態注入探針 (Probes)。</p>
</blockquote>
<div class="two-columns">
<div class="card">
<h3 id="%E2%9A%99%EF%B8%8F-on-the-fly-bytecode-instrumentation"><img class="emoji" draggable="false" alt="⚙️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/2699.svg" data-marp-twemoji=""/> On-the-fly Bytecode Instrumentation</h3>
<ul>
<li><strong>1. 編譯階段不干預</strong>：
<ul>
<li><code>javac</code> 正常將 <code>.java</code> 編譯為乾淨的 <code>.class</code> 位元組碼。</li>
</ul>
</li>
<li><strong>2. JVM 載入期動態插樁</strong>：
<ul>
<li>啟動測試時掛載 <code>-javaagent:jacocoagent.jar</code>。</li>
<li>當 ClassLoader 載入 <code>.class</code> 時，ASM 框架即時在基本區塊與跳轉指令間插入布林陣列探針（<code>boolean[] $jacocoData</code>）。</li>
</ul>
</li>
<li><strong>3. 執行期零磁碟開銷</strong>：
<ul>
<li>程式執行經過某區塊時，將對應陣列元素設為 <code>true</code>；測試結束時匯出 <code>jacoco.exec</code> 並渲染 HTML 報表。</li>
</ul>
</li>
</ul>
</div>
<div class="card">
<h3 id="%F0%9F%9A%A6-ide-%E8%88%87%E5%A0%B1%E8%A1%A8%E4%B8%AD%E7%9A%84%E4%B8%89%E8%89%B2%E7%87%88%E8%99%9F%E8%88%87%E9%91%BD%E7%9F%B3%E6%A8%99%E8%A8%98"><img class="emoji" draggable="false" alt="🚦" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f6a6.svg" data-marp-twemoji=""/> IDE 與報表中的三色燈號與鑽石標記</h3>
<ul>
<li><img class="emoji" draggable="false" alt="🟩" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f7e9.svg" data-marp-twemoji=""/> <strong>綠色背景 (Fully Covered)</strong>：
<ul>
<li>該行指令已執行，且若為判斷式，其所有真假分支皆已完整走過。</li>
</ul>
</li>
<li><img class="emoji" draggable="false" alt="🟥" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f7e5.svg" data-marp-twemoji=""/> <strong>紅色背景 (Uncovered)</strong>：
<ul>
<li>該行程式碼在整場測試中<strong>從未被執行過 (0 次)</strong>，屬於測試盲區！</li>
</ul>
</li>
<li><img class="emoji" draggable="false" alt="🟨" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f7e8.svg" data-marp-twemoji=""/> <strong>黃色背景 + 黃色鑽石 (Partially Covered)</strong>：
<ul>
<li>該行有執行，但內部的<strong>條件分支僅部分被觸發</strong>（例如 <code>if (A &amp;&amp; B)</code> 只測了 True 分支，或因短路求值漏掉了某個子條件分支）。</li>
</ul>
</li>
</ul>
</div>
</div>
</div>
<footer>Ch06 白箱測試</footer>
</section>

</blockquote>
<div class="two-columns">

<h3 id="%F0%9F%9B%A0%EF%B8%8F-%E5%AF%A6%E7%BF%92%E5%9F%B7%E8%A1%8C%E6%8C%87%E4%BB%A4%E8%88%87%E5%A0%B1%E8%A1%A8%E6%8C%87%E6%A8%99%E8%A7%A3%E8%AE%80"><img class="emoji" draggable="false" alt="🛠️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f6e0.svg" data-marp-twemoji=""/> 實習執行指令與報表指標解讀</h3>

<h2 id="jacoco-%E5%85%AD%E5%A4%A7%E8%A8%88%E6%95%B8%E5%99%A8-counters-%E8%88%87-cicd-%E5%93%81%E8%B3%AA%E9%96%80%E6%AA%BB%E8%87%AA%E5%8B%95%E9%98%BB%E6%96%B7">JaCoCo 六大計數器 (Counters) 與 CI/CD 品質門檻自動阻斷</h2>
<div class="card-deck">
<blockquote>
<p><img class="emoji" draggable="false" alt="💡" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4a1.svg" data-marp-twemoji=""/> JaCoCo 報表提供 6 種不同粒度的計數器（Counters），並支援透過 <code>jacoco:check</code> 在覆蓋率低於門檻時自動讓 Maven Build Fail！</p>
</blockquote>
<div class="two-columns">
<div class="card">
<h3 id="%F0%9F%93%8A-jacoco-%E5%85%AD%E5%A4%A7%E8%A6%86%E8%93%8B%E7%8E%87%E8%A8%88%E6%95%B8%E5%99%A8%E7%B2%BE%E7%A2%BA%E5%AE%9A%E7%BE%A9"><img class="emoji" draggable="false" alt="📊" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4ca.svg" data-marp-twemoji=""/> JaCoCo 六大覆蓋率計數器精確定義</h3>
<table>
<thead>
<tr>
<th style="text-align:left">計數器名稱</th>
<th style="text-align:center">度量粒度</th>
<th style="text-align:left">計算規則與工程實務意義</th>
</tr>
</thead>
<tbody>
<tr>
<td style="text-align:left"><strong><code>INSTRUCTION</code></strong></td>
<td style="text-align:center">最細 (C<sub>0</sub>)</td>
<td style="text-align:left">JVM Bytecode 指令執行比例，不受原始碼換行排版影響</td>
</tr>
<tr>
<td style="text-align:left"><strong><code>LINE</code></strong></td>
<td style="text-align:center">行級</td>
<td style="text-align:left">一行原始碼中<strong>只要有任一個 Bytecode 指令被執行</strong>即算該行已覆蓋</td>
</tr>
<tr>
<td style="text-align:left"><strong><code>BRANCH</code></strong></td>
<td style="text-align:center"><strong>最關鍵 (C<sub>1</sub>)</strong></td>
<td style="text-align:left">統計所有 <code>if / switch</code> 跳轉分支（含短路拆解分支）；<strong>全走過為綠鑽石、部分走過為黃鑽石、未執行為紅鑽石</strong></td>
</tr>
<tr>
<td style="text-align:left"><strong><code>COMPLEXITY</code></strong></td>
<td style="text-align:center">路徑級</td>
<td style="text-align:left">統計每個方法的 McCabe 圈複雜度 <code>V(G)</code> 與已覆蓋之獨立路徑數</td>
</tr>
<tr>
<td style="text-align:left"><strong><code>METHOD / CLASS</code></strong></td>
<td style="text-align:center">粗粒度</td>
<td style="text-align:left">方法或類別中只要有任一行指令被執行，即視為已覆蓋</td>
</tr>
</tbody>
</table>
</div>
<div class="card">
<h3 id="%F0%9F%9A%A7-cicd-%E8%87%AA%E5%8B%95%E5%93%81%E8%B3%AA%E9%96%80%E6%AA%BB-jacococheck"><img class="emoji" draggable="false" alt="🚧" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f6a7.svg" data-marp-twemoji=""/> CI/CD 自動品質門檻 (<code>jacoco:check</code>)</h3>
<p>在 <code>pom.xml</code> 加入 <code>check</code> Goal，當 PR 測試覆蓋率不達標時直接阻斷合併：</p>

<header>6.3 基本路徑測試與複雜度度量</header>

<h1 id="63-%E5%9F%BA%E6%9C%AC%E8%B7%AF%E5%BE%91%E6%B8%AC%E8%A9%A6%E8%88%87%E8%A4%87%E9%9B%9C%E5%BA%A6%E5%BA%A6%E9%87%8F"><strong>6.3 基本路徑測試與複雜度度量</strong></h1>
<blockquote>
<p>「Thomas McCabe 將圖論引入軟體工程——<br />
用圈複雜度 V(G) 量化程式的混亂程度，用線性獨立基本路徑精準鎖定最少測試集。」</p>
</blockquote>

</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="25" data-paginate="true" data-header="6.3 基本路徑測試與複雜度度量" data-footer="Ch06 白箱測試" data-theme="sqa-theme" lang="C" data-marpit-pagination="25" style="--paginate:true;--header:6.3 基本路徑測試與複雜度度量;--footer:Ch06 白箱測試;--theme:sqa-theme;" data-marpit-pagination-total="51">
<header>6.3 基本路徑測試與複雜度度量</header>

<h2 id="%E5%9F%BA%E6%9C%AC%E8%B7%AF%E5%BE%91%E6%B8%AC%E8%A9%A6-basis-path-testing-%E5%9B%9B%E6%AD%A5%E6%A8%99%E6%BA%96%E6%B5%81%E7%A8%8B">基本路徑測試 (Basis Path Testing) 四步標準流程</h2>
<div class="card-deck">
<blockquote>
<p><img class="emoji" draggable="false" alt="💡" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4a1.svg" data-marp-twemoji=""/> 由 <strong>Thomas J. McCabe (1976)</strong> 提出，透過控制流程圖（CFG）找出「線性獨立路徑基底」，達成 <strong>100% 敘述與分支涵蓋</strong>。</p>
</blockquote>
<div class="content-columns">
<div class="content-text">
<h3 id="%F0%9F%A7%AD-%E5%9F%BA%E6%9C%AC%E8%B7%AF%E5%BE%91%E6%B8%AC%E8%A9%A6%E5%9B%9B%E6%AD%A5%E9%A9%9F-%EF%BC%86-%E5%9C%88%E8%A4%87%E9%9B%9C%E5%BA%A6-vg-%E4%B8%89%E5%A4%A7%E5%85%AC%E5%BC%8F"><img class="emoji" draggable="false" alt="🧭" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f9ed.svg" data-marp-twemoji=""/> 基本路徑測試四步驟 ＆ 圈複雜度 <code>V(G)</code> 三大公式</h3>
<ul>
<li><strong>Step 1：繪製控制流程圖 (CFG)</strong>：將複合條件（如 <code>if (A &amp;&amp; B)</code>）<strong>拆解為單一判斷節點</strong>。</li>
<li><strong>Step 2：計算圈複雜度 <code>V(G)</code></strong>（決定線性獨立路徑數上限）：
<ol>
<li><strong>區域空間公式</strong>：<strong><code>V(G) = R</code></strong>（封閉區域數 + 外部無限區域 1）。</li>
<li><strong>圖論邊點公式</strong>：<strong><code>V(G) = E - N + 2</code></strong>（<code>E</code> 為邊數，<code>N</code> 為節點數）。</li>
<li><strong>判定節點公式</strong>：<strong><code>V(G) = P + 1</code></strong>（<code>P</code> 為二元判定節點數；無判斷時 <code>V(G) = 1</code>）。</li>
</ol>
</li>
<li><strong>Step 3：導出基本獨立路徑集</strong>：找出 <code>V(G)</code> 條每次至少走一條新邊的獨立路徑。</li>
<li><strong>Step 4：設計測試案例</strong>：為每條路徑設計輸入資料，並排查不可行路徑。</li>
</ul>
</div>
<div class="content-figure">
<p><img src="../../img/ch06/rkj3qfofkx.png" alt="Linear vs Branch CFG" /></p>
</div>
</div>
</div>
<footer>Ch06 白箱測試</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="26" data-paginate="true" data-header="6.3 基本路徑測試與複雜度度量" data-footer="Ch06 白箱測試" data-theme="sqa-theme" lang="C" data-marpit-pagination="26" style="--paginate:true;--header:6.3 基本路徑測試與複雜度度量;--footer:Ch06 白箱測試;--theme:sqa-theme;" data-marpit-pagination-total="51">
<header>6.3 基本路徑測試與複雜度度量</header>

<h2 id="%E6%8E%A7%E5%88%B6%E6%B5%81%E7%A8%8B%E5%9C%96-cfg-%E5%9B%9B%E5%A4%A7%E5%9F%BA%E6%9C%AC%E7%B5%90%E6%A7%8B%E8%88%87%E8%A4%87%E5%90%88%E6%A2%9D%E4%BB%B6%E6%8B%86%E8%A7%A3%E8%A6%8F%E5%89%87">控制流程圖 (CFG) 四大基本結構與複合條件拆解規則</h2>
<div class="card-deck">
<blockquote>
<p><img class="emoji" draggable="false" alt="💡" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4a1.svg" data-marp-twemoji=""/> 繪製正確的控制流程圖（Control Flow Graph, CFG）是計算圈複雜度 <code>V(G)</code> 的第一步。所有結構化程式皆由四大基本圖塊組成：</p>
</blockquote>
<div class="two-columns">
<div class="card">
<h3 id="%F0%9F%A7%B1-%E7%B5%90%E6%A7%8B%E5%8C%96%E7%A8%8B%E5%BC%8F%E7%9A%84%E5%9B%9B%E5%A4%A7-cfg-%E5%9F%BA%E6%9C%AC%E6%A7%8B%E4%BB%B6"><img class="emoji" draggable="false" alt="🧱" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f9f1.svg" data-marp-twemoji=""/> 結構化程式的四大 CFG 基本構件</h3>
<table>
<thead>
<tr>
<th style="text-align:left">結構類型</th>
<th style="text-align:left">節點與邊特徵</th>
<th style="text-align:center">對 <code>V(G)</code> 的貢獻 (<code>+P</code>)</th>
</tr>
</thead>
<tbody>
<tr>
<td style="text-align:left"><strong>1. 循序 (Sequence)</strong></td>
<td style="text-align:left">連續無分支的多行賦值指令，可合併為<strong>單一基本區塊節點 (Basic Block)</strong></td>
<td style="text-align:center"><strong><code>+ 0</code></strong></td>
</tr>
<tr>
<td style="text-align:left"><strong>2. 雙向選擇 (<code>if-else</code>)</strong></td>
<td style="text-align:left">1 個二元判定節點（Predicate Node），分出 True 與 False 兩條有向邊匯合</td>
<td style="text-align:center"><strong><code>+ 1</code></strong></td>
</tr>
<tr>
<td style="text-align:left"><strong>3. 迴圈 (<code>while / for</code>)</strong></td>
<td style="text-align:left">迴圈條件為 1 個判定節點，True 進入迴圈體並拉回條邊，False 跳出迴圈</td>
<td style="text-align:center"><strong><code>+ 1</code></strong></td>
</tr>
<tr>
<td style="text-align:left"><strong>4. 多向選擇 (<code>switch</code>)</strong></td>
<td style="text-align:left">包含 <code>k</code> 個 <code>case</code>（不含 <code>default</code>）相當於 <code>k</code> 次串接二元判斷</td>
<td style="text-align:center"><strong><code>+ k</code></strong></td>
</tr>
</tbody>
</table>
</div>
<div class="card">
<h3 id="%E2%9A%A1-%E9%97%9C%E9%8D%B5%E6%B3%95%E5%89%87%E8%A4%87%E5%90%88%E6%A2%9D%E4%BB%B6%E5%BF%85%E9%A0%88%E6%8B%86%E8%A7%A3%E7%82%BA%E7%8D%A8%E7%AB%8B%E7%AF%80%E9%BB%9E"><img class="emoji" draggable="false" alt="⚡" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/26a1.svg" data-marp-twemoji=""/> 關鍵法則：複合條件必須拆解為獨立節點！</h3>
<ul>
<li><strong>為什麼 <code>if (A &amp;&amp; B)</code> 不能畫成 1 個節點？</strong>
<ul>
<li>在短路求值下，<code>A &amp;&amp; B</code> 實際上有 <strong>3 條不同出口路徑</strong>：
<ol>
<li><code>A = False</code> ➔ 直接跳至 <code>else</code>（未執行 <code>B</code>）</li>
<li><code>A = True, B = False</code> ➔ 跳至 <code>else</code></li>
<li><code>A = True, B = True</code> ➔ 進入 <code>if</code> 主體</li>
</ol>
</li>
</ul>
</li>
<li><strong>拆解公式</strong>：
<ul>
<li>包含 <code>m</code> 個邏輯連接詞（<code>&amp;&amp;</code> 或 <code>||</code>）的複合判斷式，必須拆解為 <strong><code>m + 1</code> 個獨立的二元判定節點</strong>，貢獻 <strong><code>+ (m + 1)</code></strong> 的圈複雜度！</li>
</ul>
</li>
</ul>
</div>
</div>
</div>
<footer>Ch06 白箱測試</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="27" data-paginate="true" data-header="6.3 基本路徑測試與複雜度度量" data-footer="Ch06 白箱測試" data-theme="sqa-theme" lang="C" data-marpit-pagination="27" style="--paginate:true;--header:6.3 基本路徑測試與複雜度度量;--footer:Ch06 白箱測試;--theme:sqa-theme;" data-marpit-pagination-total="51">
<header>6.3 基本路徑測試與複雜度度量</header>

<h2 id="%E5%AF%A6%E6%88%B0%E6%A1%88%E4%BE%8B%E6%8E%A8%E6%BC%94-1%E5%AD%B8%E7%94%9F%E6%88%90%E7%B8%BE%E5%B9%B3%E5%9D%87%E8%A8%88%E7%AE%97-computeaverage">實戰案例推演 1：學生成績平均計算 (<code>computeAverage</code>)</h2>
<div class="card-deck">
<blockquote>
<p><img class="emoji" draggable="false" alt="💡" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4a1.svg" data-marp-twemoji=""/> <img class="emoji" draggable="false" alt="📄" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4c4.svg" data-marp-twemoji=""/> 實習手冊：[metrics.md](file:///Users/nick-mini-26/oTeach/SQA/LabDemo/docs/u06_wbtesting/metrics.md) ｜ <img class="emoji" draggable="false" alt="💻" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4bb.svg" data-marp-twemoji=""/> 原始碼：[GradeAverage.java](file:///Users/nick-mini-26/oTeach/SQA/LabDemo/src/main/java/u06_coverage/GradeAverage.java) ｜ <img class="emoji" draggable="false" alt="🧪" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f9ea.svg" data-marp-twemoji=""/> 測試檔：[GradeAverageBasisPathTest.java](file:///Users/nick-mini-26/oTeach/SQA/LabDemo/src/test/java/u06_coverage/GradeAverageBasisPathTest.java)（含複合條件拆解節點 <code>(1)</code>～<code>(12)</code>，<code>V(G) = 5 + 1 = 6</code>）</p>
</blockquote>
<div class="content-columns">
<div class="content-text">
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-keyword">public</span> <span class="hljs-type">double</span> <span class="hljs-title function_">computeAverage</span><span class="hljs-params">(<span class="hljs-type">int</span>[] grade)</span> {
    <span class="hljs-type">int</span> <span class="hljs-variable">sum</span> <span class="hljs-operator">=</span> <span class="hljs-number">0</span>, max = <span class="hljs-number">100</span>, min = <span class="hljs-number">10</span>, valid = <span class="hljs-number">0</span>, index = <span class="hljs-number">0</span>; <span class="hljs-comment">// (1)</span>
    <span class="hljs-type">double</span> average;
    <span class="hljs-keyword">while</span> (grade[index] != -<span class="hljs-number">999</span> &amp;&amp; index &lt; <span class="hljs-number">50</span>) {    <span class="hljs-comment">// 判定節點 (2), (3)</span>
        <span class="hljs-keyword">if</span> (grade[index] &gt;= min &amp;&amp; grade[index] &lt;= max) { <span class="hljs-comment">// 判定 (4), (5)</span>
            sum += grade[index]; valid++;           <span class="hljs-comment">// 節點 (6)</span>
        } <span class="hljs-keyword">else</span> {
            System.out.println(<span class="hljs-string">&quot;成績範圍錯誤&quot;</span>);      <span class="hljs-comment">// 節點 (7)</span>
        }
        index++;                                    <span class="hljs-comment">// 節點 (8)</span>
    }
    <span class="hljs-keyword">if</span> (valid &gt; <span class="hljs-number">0</span>) average = (<span class="hljs-type">double</span>) sum / valid;  <span class="hljs-comment">// 判定 (9) ➔ (10)</span>
    <span class="hljs-keyword">else</span> average = -<span class="hljs-number">999</span>;                            <span class="hljs-comment">// 節點 (11)</span>
    <span class="hljs-keyword">return</span> average;                                 <span class="hljs-comment">// 節點 (12)</span>
}
</code></pre>
</div>
<div class="content-figure">
<p><img src="../../img/ch06/H1iSmLifyl.png" alt="GradeAverage CFG" /></p>
</div>
</div>
</div>
---

<header>6.3 基本路徑測試與複雜度度量</header>

<h2 id="%E5%AF%A6%E6%88%B0%E6%A1%88%E4%BE%8B%E6%8E%A8%E6%BC%94-2nextdatem-d-%E9%9A%94%E6%97%A5%E8%A8%88%E7%AE%97%E8%88%87%E5%9C%88%E8%A4%87%E9%9B%9C%E5%BA%A6%E5%89%96%E6%9E%90-%E8%AC%9B%E7%BE%A9-662">實戰案例推演 2：<code>NextDate(m, d)</code> 隔日計算與圈複雜度剖析 (講義 6.6.2)</h2>
<div class="card-deck">
<blockquote>
<p><img class="emoji" draggable="false" alt="💡" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4a1.svg" data-marp-twemoji=""/> 對照講義 6.6.2 壓軸題：給定非閏年之月份 <code>m</code> 與日期 <code>d</code>，計算隔天日期 <code>NextDate(m, d)</code> 的圈複雜度 <code>V(G)</code> 與基本路徑！</p>
</blockquote>
<div class="two-columns">
<div class="card">
<h3 id="%F0%9F%92%BB-nextdateint-m-int-d-%E7%B5%90%E6%A7%8B%E5%8C%96%E7%A8%8B%E5%BC%8F%E7%A2%BC"><img class="emoji" draggable="false" alt="💻" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4bb.svg" data-marp-twemoji=""/> <code>nextDate(int m, int d)</code> 結構化程式碼</h3>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-keyword">public</span> String <span class="hljs-title function_">nextDate</span><span class="hljs-params">(<span class="hljs-type">int</span> m, <span class="hljs-type">int</span> d)</span> {
    <span class="hljs-keyword">if</span> (m &lt; <span class="hljs-number">1</span> || m &gt; <span class="hljs-number">12</span> || d &lt; <span class="hljs-number">1</span> || d &gt; <span class="hljs-number">31</span>) <span class="hljs-comment">// 判定 P1~P4 (4個)</span>
        <span class="hljs-keyword">return</span> <span class="hljs-string">&quot;Invalid&quot;</span>;
    <span class="hljs-type">int</span> <span class="hljs-variable">maxDays</span> <span class="hljs-operator">=</span> <span class="hljs-number">31</span>;
    <span class="hljs-keyword">if</span> (m == <span class="hljs-number">4</span> || m == <span class="hljs-number">6</span> || m == <span class="hljs-number">9</span> || m == <span class="hljs-number">11</span>) <span class="hljs-comment">// P5~P8 (4個)</span>
        maxDays = <span class="hljs-number">30</span>;
    <span class="hljs-keyword">else</span> <span class="hljs-keyword">if</span> (m == <span class="hljs-number">2</span>)                           <span class="hljs-comment">// P9 (1個)</span>
        maxDays = <span class="hljs-number">28</span>;
    <span class="hljs-keyword">if</span> (d &gt; maxDays) <span class="hljs-keyword">return</span> <span class="hljs-string">&quot;Invalid&quot;</span>;         <span class="hljs-comment">// P10 (1個)</span>
    <span class="hljs-keyword">if</span> (d &lt; maxDays) <span class="hljs-keyword">return</span> m + <span class="hljs-string">&quot;/&quot;</span> + (d + <span class="hljs-number">1</span>); <span class="hljs-comment">// P11 (1個)</span>
    <span class="hljs-keyword">else</span> <span class="hljs-keyword">if</span> (m == <span class="hljs-number">12</span>) <span class="hljs-keyword">return</span> <span class="hljs-string">&quot;1/1&quot;</span>;            <span class="hljs-comment">// P12 (1個)</span>
    <span class="hljs-keyword">else</span> <span class="hljs-keyword">return</span> (m + <span class="hljs-number">1</span>) + <span class="hljs-string">&quot;/1&quot;</span>;
}
</code></pre>
</div>
<div class="card">
<h3 id="%F0%9F%A7%AE-%E5%85%A9%E7%A8%AE%E7%B2%92%E5%BA%A6%E8%A8%88%E7%AE%97%E5%9C%88%E8%A4%87%E9%9B%9C%E5%BA%A6-vg"><img class="emoji" draggable="false" alt="🧮" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f9ee.svg" data-marp-twemoji=""/> 兩種粒度計算圈複雜度 <code>V(G)</code></h3>
<ul>
<li><strong>1. 決策區塊級 (Decision-level，把每個 <code>if</code> 視為 1 個判定點)</strong>：
<ul>
<li>共有 <strong>6 個 <code>if / else if</code> 決策點</strong> ➔ <strong><code>V(G) = 6 + 1 = 7</code> 條主幹路徑</strong>！</li>
</ul>
</li>
<li><strong>2. 子條件拆解級 (Condition-level，拆解所有 <code>||</code>)</strong>：
<ul>
<li>輸入範圍檢查：4 個子條件 (<code>P1~P4</code>)</li>
<li>小月判斷 (<code>4, 6, 9, 11</code>)：4 個子條件 (<code>P5~P8</code>)</li>
<li>二月判斷 (<code>m == 2</code>)：1 個 (<code>P9</code>)</li>
<li>超過當月天數 (<code>d &gt; maxDays</code>)：1 個 (<code>P10</code>)</li>
<li>月中加一 vs. 跨年 vs. 跨月：2 個 (<code>P11, P12</code>)</li>
<li>總計 <code>P = 12</code> ➔ 細部 <strong><code>V(G) = 12 + 1 = 13</code> 條獨立路徑</strong>！</li>
</ul>
</li>
</ul>
</div>
</div>
</div>

<header>6.3 基本路徑測試與複雜度度量</header>

<h2 id="%E6%A6%82%E5%BF%B5%E6%A0%B8%E5%B0%8D%E5%95%8F%E7%AD%94-ccq-4">概念核對問答 (CCQ 4)</h2>
<div class="ccq-columns">
<div class="ccq-text">

<p><strong>問題情境</strong>：<br />
關於 McCabe 圈複雜度 (Cyclomatic Complexity, CC) 的計算與基本路徑測試 (Basis Path Testing)，下列敘述何者<strong>錯誤</strong>？</p>
<ul>
<li><strong>A)</strong> 圈複雜度定義了該方法之控制流程圖中，線性獨立路徑（Linearly Independent Paths）數量的上限</li>
<li><strong>B)</strong> 若一個方法完全不包含任何決策或判斷敘述（如 <code>if</code>、<code>while</code>），則其圈複雜度為 0</li>
<li><strong>C)</strong> 圈複雜度可以透過公式 <code>V(G) = P + 1</code> 計算，其中 P 是二元判定節點（Predicate Nodes）的數量</li>
<li><strong>D)</strong> 將複合條件拆解後，基本路徑測試設計出的可行測試案例集可保證 100% 分支涵蓋度與 100% 敘述涵蓋度</li>
</ul>
</div>

</div>
</div>
