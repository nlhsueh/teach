<header>6.3 基本路徑測試與複雜度度量</header>

<h2 id="%E9%80%B2%E9%9A%8E%E7%99%BD%E7%AE%B1%E6%8A%80%E8%A1%93%E8%A3%9C%E5%85%85-1%E7%B5%90%E6%A7%8B%E5%8C%96%E8%BF%B4%E5%9C%88%E6%B8%AC%E8%A9%A6%E7%AD%96%E7%95%A5-loop-testing">進階白箱技術補充 (1)：結構化迴圈測試策略 (Loop Testing)</h2>
<div class="card-deck">
<blockquote>
<p><img class="emoji" draggable="false" alt="💡" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4a1.svg" data-marp-twemoji=""/> 迴圈是演算法複雜度與差一錯誤（Off-by-one Bug）的大本營。Boris Beizer 與 Glenford Myers 提出了針對迴圈邊界的 <strong>7 點結構化測試法</strong>：</p>
</blockquote>
<div class="two-columns">
<div class="card">
<h3 id="%F0%9F%94%84-%E7%B0%A1%E5%96%AE%E8%BF%B4%E5%9C%88-simple-loops%E6%9C%80%E5%A4%A7%E6%AC%A1%E6%95%B8%E7%82%BA-n"><img class="emoji" draggable="false" alt="🔄" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f504.svg" data-marp-twemoji=""/> 簡單迴圈 (Simple Loops，最大次數為 <code>n</code>)</h3>
<p>針對 <code>for (int i = 0; i &lt; n; i++)</code> 或 <code>while</code> 迴圈，應設計以下 <strong>7 種迭代次數</strong>以獵捕迴圈邊界缺陷：</p>
<ol>
<li><strong>跳過迴圈 (0 次)</strong>：起始條件即不成立，直接略過迴圈主體。</li>
<li><strong>只執行 1 次</strong>：檢驗迴圈初始化與單次迭代邊界。</li>
<li><strong>只執行 2 次</strong>：檢驗變數在迭代間的狀態傳遞是否正確。</li>
<li><strong>執行 <code>m</code> 次 (<code>m &lt; n</code>)</strong>：典型中間正常次數測試。</li>
<li><strong>執行 <code>n - 1</code> 次</strong>：上限前一步（In 點）。</li>
<li><strong>執行剛好 <code>n</code> 次</strong>：最大允許次數（On 點，極易發生 <code>&lt;=</code> 越界）。</li>
<li><strong>嘗試執行 <code>n + 1</code> 次</strong>：越過上限防禦驗證（Off 點）。</li>
</ol>
</div>
<div class="card">
<h3 id="%F0%9F%AA%86-%E5%B7%A2%E7%8B%80%E8%BF%B4%E5%9C%88-nested-loops-%E8%88%87%E4%B8%B2%E6%8E%A5%E8%BF%B4%E5%9C%88"><img class="emoji" draggable="false" alt="🪆" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1fa86.svg" data-marp-twemoji=""/> 巢狀迴圈 (Nested Loops) 與串接迴圈</h3>
<ul>
<li><strong>痛點</strong>：若雙層或三層巢狀迴圈皆做 7 點測試，測試次數將高達 7<sup>2</sup> = 49 或 7<sup>3</sup> = 343 次！</li>
<li><strong>Beizer 巢狀迴圈降維測試法（由內而外）</strong>：
<ol>
<li><strong>固定外層為最小值 (1 次)</strong>，對<strong>最內層迴圈</strong>執行完整簡單迴圈測試（0, 1, 2, m, n-1, n）。</li>
<li><strong>由內向外推進</strong>：測試外層迴圈時，將內層迴圈固定為典型次數 <code>m</code> 次。</li>
</ol>
</li>
<li><strong>串接迴圈 (Concatenated Loops)</strong>：
<ul>
<li>若兩迴圈彼此獨立，分別視為簡單迴圈測試；若上方迴圈的計數器作為下方迴圈的初始值，則視同巢狀迴圈處理！</li>
</ul>
</li>
</ul>
</div>
</div>
</div>
<footer>Ch06 白箱測試</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="32" data-paginate="true" data-header="6.3 基本路徑測試與複雜度度量" data-footer="Ch06 白箱測試" data-theme="sqa-theme" lang="C" data-marpit-pagination="32" style="--paginate:true;--header:6.3 基本路徑測試與複雜度度量;--footer:Ch06 白箱測試;--theme:sqa-theme;" data-marpit-pagination-total="51">
<header>6.3 基本路徑測試與複雜度度量</header>

<h2 id="%E9%80%B2%E9%9A%8E%E7%99%BD%E7%AE%B1%E6%8A%80%E8%A1%93%E8%A3%9C%E5%85%85-2%E8%B3%87%E6%96%99%E6%B5%81%E6%B8%AC%E8%A9%A6-data-flow-testing">進階白箱技術補充 (2)：資料流測試 (Data Flow Testing)</h2>
<div class="card-deck">
<blockquote>
<p><img class="emoji" draggable="false" alt="💡" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4a1.svg" data-marp-twemoji=""/> 控制流只關心「路徑有沒有走過」，<strong>資料流測試（Data Flow Testing）</strong> 則追蹤「<strong>變數從賦值定義 (Definition) 到被讀取使用 (Use) 的生命週期</strong>」！</p>
</blockquote>
<div class="content-columns">
<div class="content-text">
<h3 id="%F0%9F%94%97-%E5%AE%9A%E7%BE%A9-%E4%BD%BF%E7%94%A8%E5%B0%8D-definition-use-pairs-du-pairs"><img class="emoji" draggable="false" alt="🔗" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f517.svg" data-marp-twemoji=""/> 定義-使用對 (Definition-Use Pairs, DU-Pairs)</h3>
<ul>
<li><strong>1. 定義點 (<code>def</code>)</strong>：變數被賦予新值或修改的節點（如 <code>x = 10</code>、<code>read(x)</code>、傳入參數）。</li>
<li><strong>2. 使用點 (<code>use</code>)</strong>：變數值被讀取但未修改的節點：
<ul>
<li><strong>計算使用 (<code>c-use</code>)</strong>：用於算術賦值或回傳（如 <code>y = x + 1</code>、<code>return x</code>）。</li>
<li><strong>判定使用 (<code>p-use</code>)</strong>：用於條件分支判斷（如 <code>if (x &gt; 0)</code>）。</li>
</ul>
</li>
<li><strong>3. 無重定義路徑 (Def-Clear Path)</strong>：從 <code>def</code> 到 <code>use</code> 之間未再次覆寫該變數的路徑。</li>
<li><strong>4. 四大涵蓋準則</strong>：<strong>All-Defs</strong> ➔ <strong>All-C-Uses / All-P-Uses</strong> ➔ <strong>All-DU-Paths</strong>（專抓未初始化與誤覆寫缺陷）。</li>
</ul>
</div>
<div class="content-figure">
<p><img src="../../img/ch06/r1nTL5-4p.png" alt="Data Flow Def-Use" /></p>
</div>
</div>
</div>
<footer>Ch06 白箱測試</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="33" data-paginate="true" data-header="6.3 基本路徑測試與複雜度度量" data-footer="Ch06 白箱測試" data-theme="sqa-theme" lang="C" data-marpit-pagination="33" style="--paginate:true;--header:6.3 基本路徑測試與複雜度度量;--footer:Ch06 白箱測試;--theme:sqa-theme;" data-marpit-pagination-total="51">
<header>6.3 基本路徑測試與複雜度度量</header>

<h2 id="%E8%B3%87%E6%96%99%E6%B5%81%E6%B8%AC%E8%A9%A6%E5%AF%A6%E6%88%B0%E6%8E%A8%E6%BC%94%E8%A8%88%E7%AE%97-def--c-use--p-use-%E8%88%87%E4%B8%89%E5%A4%A7%E8%B3%87%E6%96%99%E6%B5%81%E7%95%B0%E5%B8%B8">資料流測試實戰推演：計算 <code>def / c-use / p-use</code> 與三大資料流異常</h2>
<div class="card-deck">
<blockquote>
<p><img class="emoji" draggable="false" alt="💡" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4a1.svg" data-marp-twemoji=""/> 靜態與動態資料流分析能抓出控制流完全看不見的「<strong>變數未初始化 (<code>ur</code>)</strong>」與「<strong>無效重複賦值 (<code>dd</code>)</strong>」缺陷！</p>
</blockquote>
<div class="two-columns">
<div class="card">
<h3 id="%F0%9F%92%BB-%E8%AE%8A%E6%95%B8-x-%E7%9A%84-du-pairs-%E5%AF%A6%E6%88%B0%E8%BF%BD%E8%B9%A4"><img class="emoji" draggable="false" alt="💻" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4bb.svg" data-marp-twemoji=""/> 變數 <code>x</code> 的 DU-Pairs 實戰追蹤</h3>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-number">1</span>: <span class="hljs-keyword">public</span> <span class="hljs-type">int</span> <span class="hljs-title function_">calcDiscount</span><span class="hljs-params">(<span class="hljs-type">int</span> price, <span class="hljs-type">boolean</span> isVip)</span> {
<span class="hljs-number">2</span>:     <span class="hljs-type">int</span> <span class="hljs-variable">x</span> <span class="hljs-operator">=</span> <span class="hljs-number">0</span>;               <span class="hljs-comment">// def(x) 於行 2</span>
<span class="hljs-number">3</span>:     <span class="hljs-keyword">if</span> (isVip) {             <span class="hljs-comment">// p-use(isVip)</span>
<span class="hljs-number">4</span>:         x = <span class="hljs-number">100</span>;             <span class="hljs-comment">// def(x) 於行 4</span>
<span class="hljs-number">5</span>:     }
<span class="hljs-number">6</span>:     <span class="hljs-keyword">if</span> (x &gt; <span class="hljs-number">50</span>) {            <span class="hljs-comment">// p-use(x) 於行 6</span>
<span class="hljs-number">7</span>:         <span class="hljs-keyword">return</span> price - x;    <span class="hljs-comment">// c-use(x) 於行 7</span>
<span class="hljs-number">8</span>:     }
<span class="hljs-number">9</span>:     <span class="hljs-keyword">return</span> price;
<span class="hljs-number">10</span>: }
</code></pre>
<ul>
<li><strong>變數 <code>x</code> 的無重定義路徑 (Def-Clear DU-Paths)</strong>：
<ul>
<li>從 <code>def(2)</code> 到 <code>p-use(6)</code>：路徑 <code>2 ➔ 3(F) ➔ 6</code>（注意：若走 <code>3(T) ➔ 4</code>，第 2 行的定義即被第 4 行殺死重定義！）</li>
<li>從 <code>def(4)</code> 到 <code>p-use(6)</code> 與 <code>c-use(7)</code>：路徑 <code>4 ➔ 6(T) ➔ 7</code></li>
</ul>
</li>
</ul>
</div>
<div class="card">
<h3 id="%F0%9F%9A%A8-%E9%9D%9C%E6%85%8B%E8%B3%87%E6%96%99%E6%B5%81%E5%88%86%E6%9E%90%E7%9A%84%E4%B8%89%E5%A4%A7%E7%94%9F%E5%91%BD%E9%80%B1%E6%9C%9F%E7%95%B0%E5%B8%B8"><img class="emoji" draggable="false" alt="🚨" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f6a8.svg" data-marp-twemoji=""/> 靜態資料流分析的三大生命週期異常</h3>
<p>設變數狀態：<code>d</code> = Defined（已賦值）、<code>u</code> = Used（被讀取）、<code>k</code> = Killed/Undefined（未定義或已釋放）：</p>
<table>
<thead>
<tr>
<th style="text-align:center">狀態轉移序列</th>
<th style="text-align:center">正常 / 異常判定</th>
<th style="text-align:left">代表之典型程式碼缺陷 (Code Smell / Bug)</th>
</tr>
</thead>
<tbody>
<tr>
<td style="text-align:center"><strong><code>d ➔ u</code></strong></td>
<td style="text-align:center"><img class="emoji" draggable="false" alt="✅" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/2705.svg" data-marp-twemoji=""/> <strong>正常 (Normal)</strong></td>
<td style="text-align:left">變數賦值後正常被讀取計算或判斷</td>
</tr>
<tr>
<td style="text-align:center"><strong><code>d ➔ d</code> (<code>dd</code>)</strong></td>
<td style="text-align:center"><img class="emoji" draggable="false" alt="⚠️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/26a0.svg" data-marp-twemoji=""/> <strong>可疑異常 (Harmless / Bug)</strong></td>
<td style="text-align:left"><strong>連續賦值兩次卻從未在中間讀取</strong>（第一次賦值為冗餘死碼，或漏寫了中間運算！）</td>
</tr>
<tr>
<td style="text-align:center"><strong><code>k ➔ u</code> (<code>ur</code>)</strong></td>
<td style="text-align:center"><img class="emoji" draggable="false" alt="❌" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/274c.svg" data-marp-twemoji=""/> <strong>嚴重錯誤 (Critical Bug)</strong></td>
<td style="text-align:left"><strong>未定義/未初始化就先讀取使用</strong>（或釋放指標後再次讀取 Use-After-Free）</td>
</tr>
<tr>
<td style="text-align:center"><strong><code>d ➔ k</code> (<code>dk</code>)</strong></td>
<td style="text-align:center"><img class="emoji" draggable="false" alt="⚠️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/26a0.svg" data-marp-twemoji=""/> <strong>可疑異常 (Dead Store)</strong></td>
<td style="text-align:left">變數賦值後直到離開作用域消亡都<strong>從未被使用過</strong>（Unused Variable）</td>
</tr>
</tbody>
</table>
</div>
</div>
</div>
<footer>Ch06 白箱測試</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="34" data-paginate="true" data-header="6.3 基本路徑測試與複雜度度量" data-footer="Ch06 白箱測試" data-theme="sqa-theme" lang="C" data-marpit-pagination="34" style="--paginate:true;--header:6.3 基本路徑測試與複雜度度量;--footer:Ch06 白箱測試;--theme:sqa-theme;" data-marpit-pagination-total="51">
<header>6.3 基本路徑測試與複雜度度量</header>

<h2 id="%E7%A8%8B%E5%BC%8F%E7%A2%BC%E5%93%81%E8%B3%AA%E8%88%87%E8%A4%87%E9%9B%9C%E5%BA%A6%E5%BA%A6%E9%87%8F%E6%8C%87%E6%A8%99-u06_wbtestingmetricsmd">程式碼品質與複雜度度量指標 (<code>u06_wbtesting/metrics.md</code>)</h2>
<div class="card-deck">
<blockquote>
<p><img class="emoji" draggable="false" alt="💡" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4a1.svg" data-marp-twemoji=""/> 搭配 IntelliJ <code>MetricsReloaded</code> / SonarQube，從單一方法到整個類別全面監控結構複雜度與可測試性。</p>
</blockquote>
<table>
<thead>
<tr>
<th style="text-align:left">度量指標縮寫與名稱</th>
<th style="text-align:left">核心計算定義</th>
<th style="text-align:center">工業界警戒門檻</th>
<th style="text-align:left">指標過高反映之架構問題與重構對策</th>
</tr>
</thead>
<tbody>
<tr>
<td style="text-align:left"><strong><code>v(G)</code> 圈複雜度</strong><br />(Cyclomatic Complexity)</td>
<td style="text-align:left">單一方法內線性獨立路徑數 (<code>P + 1</code>)</td>
<td style="text-align:center"><strong>&lt;= 10</strong></td>
<td style="text-align:left">單一方法條件分支過多、難以寫足單元測試 ➔ <strong>萃取方法 (Extract Method)</strong> 或以多型取代條件式</td>
</tr>
<tr>
<td style="text-align:left"><strong><code>CogC</code> 認知複雜度</strong><br />(Cognitive Complexity)</td>
<td style="text-align:left">考量<strong>人類閱讀難度</strong>：對深層巢狀 (<code>if</code> 內嵌 <code>loop</code>) 與流程中斷 (<code>break/continue</code>) 加重計罰</td>
<td style="text-align:center"><strong>&lt;= 15</strong></td>
<td style="text-align:left">巢狀過深（Arrow Anti-Pattern），人腦極易在除錯時迷航 ➔ 改用<strong>衛語句 (Guard Clauses)</strong> 提早回傳扁平化</td>
</tr>
<tr>
<td style="text-align:left"><strong><code>WMC</code> 類別加權方法數</strong><br />(Weighted Methods / Class)</td>
<td style="text-align:left">類別內所有方法的 <code>v(G)</code> 圈複雜度總和 (<code>sum(v(G))</code>)</td>
<td style="text-align:center"><strong>&lt;= 30 ~ 40</strong></td>
<td style="text-align:left">類別承擔過多職責，形成<strong>上帝類別 (God Class)</strong>，違反單一職責原則 (SRP) ➔ <strong>拆分類別 (Extract Class)</strong></td>
</tr>
<tr>
<td style="text-align:left"><strong><code>OCavg</code> 平均方法複雜度</strong></td>
<td style="text-align:left"><code>WMC / 類別方法總數</code></td>
<td style="text-align:center"><strong>&lt;= 3 ~ 5</strong></td>
<td style="text-align:left">若 <code>WMC</code> 高且 <code>OCavg</code> 高，代表類別內充滿龐大複雜的方法；若 <code>OCavg</code> 低則僅少數方法需重構</td>
</tr>
<tr>
<td style="text-align:left"><strong><code>LOC</code> 實質程式碼行數</strong></td>
<td style="text-align:left">不含空行與註解之物理程式碼行數</td>
<td style="text-align:center">方法 <strong>&lt;= 30~50</strong></td>
<td style="text-align:left">長方法難以一眼掌握全貌，常伴隨高 <code>v(G)</code> 與高重複率</td>
</tr>
</tbody>
</table>
</div>
<footer>Ch06 白箱測試</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="35" data-paginate="true" data-header="6.3 基本路徑測試與複雜度度量" data-footer="Ch06 白箱測試" data-theme="sqa-theme" lang="C" data-marpit-pagination="35" style="--paginate:true;--header:6.3 基本路徑測試與複雜度度量;--footer:Ch06 白箱測試;--theme:sqa-theme;" data-marpit-pagination-total="51">
<header>6.3 基本路徑測試與複雜度度量</header>

<h2 id="%E7%82%BA%E4%BB%80%E9%BA%BC%E5%85%89%E7%9C%8B-vg-%E4%B8%8D%E5%A4%A0%E5%9C%88%E8%A4%87%E9%9B%9C%E5%BA%A6-vs-%E8%AA%8D%E7%9F%A5%E8%A4%87%E9%9B%9C%E5%BA%A6-cogc-%E9%87%8D%E6%A7%8B%E5%B0%8D%E6%B1%BA">為什麼光看 <code>v(G)</code> 不夠？圈複雜度 vs. 認知複雜度 (<code>CogC</code>) 重構對決</h2>
<div class="card-deck">
<blockquote>
<p><img class="emoji" draggable="false" alt="💡" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4a1.svg" data-marp-twemoji=""/> <strong>McCabe <code>v(G)</code> 的盲點</strong>：只計算分支數量，卻忽略了「<strong>巢狀深度（Nesting Depth）</strong>」對人類大腦造成的閱讀災難！</p>
</blockquote>
<div class="two-columns">
<div class="card">
<h3 id="%F0%9F%98%B5-%E7%89%87%E6%AE%B5-a%E4%B8%89%E5%B1%A4%E6%B3%A2%E5%8B%95%E6%8B%B3%E5%B7%A2%E7%8B%80-vg--4-cogc--6"><img class="emoji" draggable="false" alt="😵" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f635.svg" data-marp-twemoji=""/> 片段 A：三層波動拳巢狀 (<code>v(G) = 4</code>, <code>CogC = 6</code>)</h3>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-type">int</span> <span class="hljs-title function_">sumPrimes</span><span class="hljs-params">(<span class="hljs-type">int</span> max)</span> {
    <span class="hljs-type">int</span> <span class="hljs-variable">total</span> <span class="hljs-operator">=</span> <span class="hljs-number">0</span>;
    <span class="hljs-keyword">for</span> (<span class="hljs-type">int</span> <span class="hljs-variable">i</span> <span class="hljs-operator">=</span> <span class="hljs-number">1</span>; i &lt;= max; i++) {     <span class="hljs-comment">// +1 (巢狀=0)</span>
        <span class="hljs-keyword">for</span> (<span class="hljs-type">int</span> <span class="hljs-variable">j</span> <span class="hljs-operator">=</span> <span class="hljs-number">2</span>; j &lt; i; j++) {    <span class="hljs-comment">// +2 (基礎1 + 巢狀1)</span>
            <span class="hljs-keyword">if</span> (i % j == <span class="hljs-number">0</span>) {            <span class="hljs-comment">// +3 (基礎1 + 巢狀2)</span>
                <span class="hljs-keyword">continue</span>;
            }
        }
        total += i;
    }
    <span class="hljs-keyword">return</span> total;
} <span class="hljs-comment">// v(G) = 3 + 1 = 4 ｜ 認知複雜度 CogC = 1 + 2 + 3 = 6!</span>
</code></pre>
</div>
<div class="card">
<h3 id="%F0%9F%98%8A-%E7%89%87%E6%AE%B5-b%E5%B9%B3%E5%9D%A6%E5%A4%9A%E5%88%86%E6%94%AF--%E8%A1%9B%E8%AA%9E%E5%8F%A5-vg--4-cogc--1"><img class="emoji" draggable="false" alt="😊" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f60a.svg" data-marp-twemoji=""/> 片段 B：平坦多分支 / 衛語句 (<code>v(G) = 4</code>, <code>CogC = 1</code>)</h3>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java">String <span class="hljs-title function_">getSymbol</span><span class="hljs-params">(<span class="hljs-type">int</span> num)</span> {
    <span class="hljs-keyword">switch</span> (num) {                       <span class="hljs-comment">// 整個 switch 僅 +1!</span>
        <span class="hljs-keyword">case</span> <span class="hljs-number">1</span>: <span class="hljs-keyword">return</span> <span class="hljs-string">&quot;One&quot;</span>;            <span class="hljs-comment">// McCabe +1</span>
        <span class="hljs-keyword">case</span> <span class="hljs-number">2</span>: <span class="hljs-keyword">return</span> <span class="hljs-string">&quot;Two&quot;</span>;            <span class="hljs-comment">// McCabe +1</span>
        <span class="hljs-keyword">case</span> <span class="hljs-number">3</span>: <span class="hljs-keyword">return</span> <span class="hljs-string">&quot;Three&quot;</span>;          <span class="hljs-comment">// McCabe +1</span>
        <span class="hljs-keyword">default</span>: <span class="hljs-keyword">return</span> <span class="hljs-string">&quot;Many&quot;</span>;
    }
} <span class="hljs-comment">// v(G) = 3 + 1 = 4 ｜ 認知複雜度 CogC = 1!</span>
</code></pre>
<ul>
<li><strong>重構啟示</strong>：
<ul>
<li>兩段程式碼的 <strong><code>v(G)</code> 都是 4</strong>（都需要 4 個測試案例）；</li>
<li>但片段 A 的理解難度是片段 B 的 <strong>6 倍</strong>！利用 <strong>Guard Clauses（衛語句提早 return）</strong> 與 <strong>Extract Method</strong> 可大幅降低 <code>CogC</code>。</li>
</ul>
</li>
</ul>
</div>
</div>
</div>

故意在程式中植入人造缺陷（變異體），檢驗你的測試斷言是否夠敏銳將其一舉獵殺！」</p>

</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="37" data-paginate="true" data-header="6.4 變異測試 (Mutation Testing)" data-footer="Ch06 白箱測試" data-theme="sqa-theme" lang="C" data-marpit-pagination="37" style="--paginate:true;--header:6.4 變異測試 (Mutation Testing);--footer:Ch06 白箱測試;--theme:sqa-theme;" data-marpit-pagination-total="51">
<header>6.4 變異測試 (Mutation Testing)</header>

<h2 id="%E8%AE%8A%E7%95%B0%E6%B8%AC%E8%A9%A6%E7%9A%84%E6%A0%B8%E5%BF%83%E5%93%B2%E5%AD%B8%E6%B8%AC%E8%A9%A6%E4%BD%A0%E7%9A%84%E6%B8%AC%E8%A9%A6-test-the-tests">變異測試的核心哲學：測試你的測試 (Test the Tests)</h2>
<div class="card-deck">
<blockquote>
<p><img class="emoji" draggable="false" alt="💡" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4a1.svg" data-marp-twemoji=""/> 傳統測試是用測試資料 <code>T</code> 去考驗程式 <code>P</code>；<strong>變異測試（Mutation Testing）</strong> 則是利用人造變異體 <code>P'</code> 來反向考驗<strong>測試資料集 <code>T</code> 的抓錯能力</strong>！</p>
</blockquote>
<div class="content-columns">
<div class="content-text">
<h3 id="%F0%9F%A7%AC-%E8%AE%8A%E7%95%B0%E6%B8%AC%E8%A9%A6%E7%9A%84%E9%81%8B%E4%BD%9C%E6%A9%9F%E5%88%B6"><img class="emoji" draggable="false" alt="🧬" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f9ec.svg" data-marp-twemoji=""/> 變異測試的運作機制</h3>
<ul>
<li><strong>1. 植入微小突變 (Mutants)</strong>：
<ul>
<li>將受測程式 <code>P</code> 透過<strong>變異算子 (Mutation Operators)</strong> 微幅修改單一語法（例如將 <code>a &gt;= 2</code> 改為 <code>a &gt; 2</code>），產生一群變異體 <code>P', P'', P'''</code>。</li>
</ul>
</li>
<li><strong>2. 執行測試集 <code>T</code> 比對輸出</strong>：
<ul>
<li>將現有測試套件 <code>T</code> 同時跑在原程式 <code>P</code> 與變異體 <code>P'</code> 上。</li>
</ul>
</li>
<li><strong>3. 判定獵殺或存活</strong>：
<ul>
<li><img class="emoji" draggable="false" alt="⚔️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/2694.svg" data-marp-twemoji=""/> <strong>已刪除變異體 (Killed Mutant)</strong>：若存在測資 <code>t ∈ T</code> 使得 <strong><code>P(t) != P'(t)</code></strong>（測試亮紅燈失敗），代表測試成功揪出該缺陷！</li>
<li><img class="emoji" draggable="false" alt="🧟" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f9df.svg" data-marp-twemoji=""/> <strong>存活變異體 (Alive / Survived Mutant)</strong>：若所有測資跑完 <strong><code>P(t) == P'(t)</code></strong>（測試依然全綠燈），代表<strong>現有測試案例太弱或斷言不足</strong>，必須補充新測資（如邊界值 <code>a = 2</code>）！</li>
</ul>
</li>
</ul>
</div>
<div class="content-figure">
<p><img src="../../img/ch06/H1ft65b4a.png" alt="Mutation Concept" /></p>
</div>
</div>
</div>
<footer>Ch06 白箱測試</footer>
</section>

<header>6.4 變異測試 (Mutation Testing)</header>

<h2 id="%E8%AE%8A%E7%95%B0%E6%B8%AC%E8%A9%A6%E7%9A%84%E5%85%A9%E5%A4%A7%E7%90%86%E8%AB%96%E5%9F%BA%E7%9F%B3%E7%82%BA%E4%BB%80%E9%BA%BC%E5%96%AE%E9%BB%9E%E5%BE%AE%E5%B0%8F%E7%AA%81%E8%AE%8A%E5%B0%B1%E5%A4%A0%E4%BA%86">變異測試的兩大理論基石：為什麼「單點微小突變」就夠了？</h2>
<div class="card-deck">
<blockquote>
<p><img class="emoji" draggable="false" alt="💡" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4a1.svg" data-marp-twemoji=""/> 有人常問：「<em>真實世界的 Bug 可能很複雜，為什麼變異測試每次只改一個小符號（First-Order Mutant）就能代表真實缺陷？</em>」這源自軟體測試理論的兩大著名假設（DeMillo et al., 1978；Offutt, 1992）：</p>
</blockquote>
<div class="two-columns">
<div class="card">
<h3 id="%F0%9F%91%A8%E2%80%8D%F0%9F%92%BB-1-%E7%A8%B1%E8%81%B7%E7%A8%8B%E5%BC%8F%E8%A8%AD%E8%A8%88%E5%B8%AB%E5%81%87%E8%A8%AD"><img class="emoji" draggable="false" alt="👨‍💻" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f468-200d-1f4bb.svg" data-marp-twemoji=""/> 1. 稱職程式設計師假設</h3>
<p><strong>(Competent Programmer Hypothesis, CPH)</strong></p>
<ul>
<li><strong>核心內涵</strong>：
<ul>
<li>訓練有素的工程師在拿到規格後，寫出來的程式碼<strong>不會是隨機亂湊的垃圾</strong>，而是已經非常接近正確版本（在語法樹空間上距離極近）。</li>
</ul>
</li>
<li><strong>推論</strong>：
<ul>
<li>絕大多數殘留的真實缺陷，正是源自微小的<strong>思慮疏忽（Typo / Off-by-one）</strong>：例如把 <code>&lt;=</code> 寫成 <code>&lt;</code>、<code>&amp;&amp;</code> 寫成 <code>||</code>、變數名拿錯，恰好對應變異算子的微小修改！</li>
</ul>
</li>
</ul>
</div>
<div class="card">
<h3 id="%F0%9F%94%97-2-%E8%80%A6%E5%90%88%E6%95%88%E6%87%89%E5%AE%9A%E5%BE%8B"><img class="emoji" draggable="false" alt="🔗" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f517.svg" data-marp-twemoji=""/> 2. 耦合效應定律</h3>
<p><strong>(The Coupling Effect Hypothesis)</strong></p>
<ul>
<li><strong>核心內涵</strong>：
<ul>
<li>「<strong>複雜的高階複合錯誤（Higher-order faults）與簡單的一階單點錯誤（Simple faults）在執行路徑與狀態空間上高度耦合！</strong>」</li>
</ul>
</li>
<li><strong>Offutt (1992) 實證結論</strong>：
<ul>
<li>能夠 100% 殺死所有「<strong>一階單點變異體 (First-Order Mutants)</strong>」的敏銳測試案例集，在實驗中同時能殺死 <strong>99.5% 以上的二階與三階複合變異體</strong>！因此實務上無須產生組合爆炸的高階變異體。</li>
</ul>
</li>
</ul>
</div>
</div>
</div>
<footer>Ch06 白箱測試</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="39" data-paginate="true" data-header="6.4 變異測試 (Mutation Testing)" data-footer="Ch06 白箱測試" data-theme="sqa-theme" lang="C" data-marpit-pagination="39" style="--paginate:true;--header:6.4 變異測試 (Mutation Testing);--footer:Ch06 白箱測試;--theme:sqa-theme;" data-marpit-pagination-total="51">
<header>6.4 變異測試 (Mutation Testing)</header>

<h2 id="641-%E5%B8%B8%E8%A6%8B%E8%AE%8A%E7%95%B0%E7%AE%97%E5%AD%90-mutation-operators-%E8%88%87%E5%BC%B1%E6%B8%AC%E8%B3%87%E6%9A%B4%E9%9C%B2">6.4.1 常見變異算子 (Mutation Operators) 與弱測資暴露</h2>
<div class="card-deck">
<blockquote>
<p><img class="emoji" draggable="false" alt="💡" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4a1.svg" data-marp-twemoji=""/> 變異算子模擬了真實工程師最常犯下的語法與邊界失誤（對應主流框架 <strong>PITest</strong> 的內建 Mutators）。</p>
</blockquote>
<div class="two-columns">
<div class="card">
<h3 id="%F0%9F%9B%A0%EF%B8%8F-%E5%9B%9B%E5%A4%A7%E7%B6%93%E5%85%B8%E8%AE%8A%E7%95%B0%E7%AE%97%E5%AD%90%E9%A1%9E%E5%88%A5"><img class="emoji" draggable="false" alt="🛠️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f6e0.svg" data-marp-twemoji=""/> 四大經典變異算子類別</h3>
<ol>
<li><strong>關係運算元替換 (ROR / Conditionals Boundary)</strong>：
<ul>
<li>把 <code>&gt;</code> 換成 <code>&gt;=</code>、<code>&lt;</code>、<code>==</code> 或 <code>!=</code>。</li>
<li>專抓未落實 BVA 邊界值（On/Off 點）的鬆散測試！</li>
</ul>
</li>
<li><strong>邏輯與條件反轉 (COR / Negate Conditionals)</strong>：
<ul>
<li>把 <code>&amp;&amp;</code> 換成 <code>||</code>，或把條件句加上 <code>!</code> 反轉、替換為 <code>true/false</code>。</li>
</ul>
</li>
<li><strong>算術運算元替換 (AOR / Math Mutator)</strong>：
<ul>
<li>把 <code>+</code> 換成 <code>-</code>、<code>*</code> 換成 <code>/</code>，或將 <code>x</code> 改為 <code>x + 1</code>、<code>index++</code> 改為 <code>index--</code>。</li>
</ul>
</li>
<li><strong>回傳值與無回傳呼叫移除 (Return Values / Void Method Calls)</strong>：
<ul>
<li>把回傳布林值反轉、整數回傳改為 <code>0</code>，或刪除一行狀態修改指令。</li>
</ul>
</li>
</ol>
</div>
<div class="card">
<h3 id="%F0%9F%92%BB-%E5%AF%A6%E4%BE%8Bgetmaxx-y-%E7%82%BA%E4%BD%95-100-%E8%A6%86%E8%93%8B%E4%BB%8D%E6%9C%83%E6%BC%8F%E6%8A%93-bug"><img class="emoji" draggable="false" alt="💻" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4bb.svg" data-marp-twemoji=""/> 實例：<code>getMax(x, y)</code> 為何 100% 覆蓋仍會漏抓 Bug？</h3>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-comment">// 原始程式 P                 // 變異體 P&#x27; (&gt; 突變為 &lt;)</span>
<span class="hljs-type">int</span> <span class="hljs-title function_">getMax</span><span class="hljs-params">(<span class="hljs-type">int</span> x, <span class="hljs-type">int</span> y)</span> {    <span class="hljs-type">int</span> <span class="hljs-title function_">getMax2</span><span class="hljs-params">(<span class="hljs-type">int</span> x, <span class="hljs-type">int</span> y)</span> {
    <span class="hljs-type">int</span> max;                      <span class="hljs-type">int</span> max;
    <span class="hljs-keyword">if</span> (x &gt; y) max = x;           <span class="hljs-keyword">if</span> (x &lt; y) max = x; <span class="hljs-comment">// 突變點!</span>
    <span class="hljs-keyword">else</span> max = y;                 <span class="hljs-keyword">else</span> max = y;
    <span class="hljs-keyword">return</span> max;                   <span class="hljs-keyword">return</span> max;
}                             }
</code></pre>
<ul>
<li><strong>盲點剖析</strong>：
<ul>
<li>若測試人員只提供測資 <strong><code>t1 = (x=1, y=1)</code></strong>：
<ul>
<li><code>getMax(1, 1)</code> 回傳 <code>1</code>；變異體 <code>getMax2(1, 1)</code> <strong>也回傳 <code>1</code></strong>！</li>
<li>變異體 <code>P'</code> <strong>存活 (Survived)</strong>！必須補入 <code>x != y</code>（如 <code>(5, 2)</code>）才能將其 Kill！</li>
</ul>
</li>
</ul>
</li>
</ul>
</div>
</div>
</div>

<header>6.4 變異測試 (Mutation Testing)</header>

<h2 id="642-%E8%AE%8A%E7%95%B0%E6%B8%AC%E8%A9%A6%E6%A8%99%E6%BA%96%E6%B5%81%E7%A8%8B%E8%88%87%E8%AA%B2%E5%A0%82%E7%8D%B5%E6%AE%BA%E5%AF%A6%E6%88%B0">6.4.2 變異測試標準流程與課堂獵殺實戰</h2>
<div class="card-deck">
<blockquote>
<p><img class="emoji" draggable="false" alt="💡" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4a1.svg" data-marp-twemoji=""/> 透過比較 <code>P(t)</code> 與 <code>P_i(t)</code> 的輸出差異，逐步擴充測試案例直到消滅所有非等價之存活變異體。</p>
</blockquote>
<div class="two-columns">
<div class="card">
<h3 id="%F0%9F%92%BB-%E8%AA%B2%E5%A0%82%E7%8D%B5%E6%AE%BA%E6%8E%A8%E6%BC%94%E9%A1%8C-readx-y"><img class="emoji" draggable="false" alt="💻" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4bb.svg" data-marp-twemoji=""/> 課堂獵殺推演題 (<code>read(X, Y)</code>)</h3>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java">read(X, Y)
<span class="hljs-keyword">if</span> ((X &gt;= <span class="hljs-number">10</span>) &amp;&amp; (Y == <span class="hljs-number">1</span>)) <span class="hljs-comment">// P1: 把 &amp;&amp; 改為 ||</span>
    X = <span class="hljs-number">1</span>;                 <span class="hljs-comment">// P2: 把 == 改為 &lt;=</span>
<span class="hljs-keyword">else</span> <span class="hljs-keyword">if</span> ((X - Y) &lt; <span class="hljs-number">2</span>)
    X = <span class="hljs-number">2</span>;
<span class="hljs-keyword">if</span> (Y &gt; <span class="hljs-number">10</span>)
    X = <span class="hljs-number">3</span>;
print X
</code></pre>
<ul>
<li><strong>問題 1</strong>：測試案例 <strong><code>t1 = (X=10, Y=10)</code></strong> 能 Kill 哪個變異體？</li>
<li><strong>問題 2</strong>：針對存活的變異體，應補充哪一筆測資將其消滅？</li>
</ul>
</div>
<div class="card">
<h3 id="%F0%9F%8E%AF-%E6%8E%A8%E6%BC%94%E8%A7%A3%E6%9E%90%E8%88%87%E8%A3%9C%E5%BD%88%E9%81%8E%E7%A8%8B"><img class="emoji" draggable="false" alt="🎯" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f3af.svg" data-marp-twemoji=""/> 推演解析與補彈過程</h3>
<table>
<thead>
<tr>
<th style="text-align:center">測試案例 <code>(X, Y)</code></th>
<th style="text-align:center">原程式 <code>P</code> 輸出</th>
<th style="text-align:center">變異體 <code>P1</code> (<code>&amp;&amp;</code>➔<code>||</code>)</th>
<th style="text-align:center">變異體 <code>P2</code> (<code>==</code>➔<code>&lt;=</code>)</th>
<th style="text-align:left">獵殺結果判定</th>
</tr>
</thead>
<tbody>
<tr>
<td style="text-align:center"><strong><code>t1 = (10, 10)</code></strong></td>
<td style="text-align:center"><strong><code>X = 2</code></strong><br />(<code>10-10 &lt; 2</code>)</td>
<td style="text-align:center"><strong><code>X = 1</code></strong> <img class="emoji" draggable="false" alt="⚡" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/26a1.svg" data-marp-twemoji=""/><br />(<code>X&gt;=10</code> 成立!)</td>
<td style="text-align:center"><strong><code>X = 2</code></strong> <img class="emoji" draggable="false" alt="🧟" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f9df.svg" data-marp-twemoji=""/><br />(<code>10&lt;=1</code> 為 F)</td>
<td style="text-align:left"><strong>成功 Kill <code>P1</code></strong> <img class="emoji" draggable="false" alt="✅" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/2705.svg" data-marp-twemoji=""/><br />(<code>P2</code> 依然存活!)</td>
</tr>
<tr>
<td style="text-align:center"><strong><code>t2 = (10, 0)</code></strong> 或 <strong><code>(10, -1)</code></strong></td>
<td style="text-align:center"><strong><code>X = 10</code></strong><br />(皆不進入)</td>
<td style="text-align:center">(已死)</td>
<td style="text-align:center"><strong><code>X = 1</code></strong> <img class="emoji" draggable="false" alt="⚡" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/26a1.svg" data-marp-twemoji=""/><br />(<code>0 &lt;= 1</code> 成立!)</td>
<td style="text-align:left"><strong>成功 Kill <code>P2</code></strong> <img class="emoji" draggable="false" alt="✅" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/2705.svg" data-marp-twemoji=""/><br />(全數消滅!)</td>

<ul>
<li><img class="emoji" draggable="false" alt="📌" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4cc.svg" data-marp-twemoji=""/> <strong>註</strong>：若依講義取 <code>(10, 1)</code> 且 <code>P2</code> 將 <code>Y==1</code> 突變為 <code>Y&lt;1</code>，則 <code>P(10,1)=1</code> 而 <code>P2(10,1)=10</code>，同樣能因輸出不同而 Kill <code>P2</code>！</li>

<header>6.4 變異測試 (Mutation Testing)</header>

<h2 id="%E9%80%B2%E9%9A%8E%E7%90%86%E8%AB%96%E8%A3%9C%E5%85%85%E5%BC%B7%E8%AE%8A%E7%95%B0-vs-%E5%BC%B1%E8%AE%8A%E7%95%B0--ripr-%E6%95%85%E9%9A%9C%E5%82%B3%E6%92%AD%E6%A8%A1%E5%9E%8B">進階理論補充：強變異 vs. 弱變異 —— RIPR 故障傳播模型</h2>
<div class="card-deck">
<blockquote>
<p><img class="emoji" draggable="false" alt="💡" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4a1.svg" data-marp-twemoji=""/> 為什麼測試執行到了突變行，變異體卻依然存活（Survived）？<strong>RIPR 模型</strong>揭示了殺死變異體必經的四道關卡：</p>
</blockquote>
<div class="two-columns">
<div class="card">
<h3 id="%E2%9B%93%EF%B8%8F-%E6%AE%BA%E6%AD%BB%E8%AE%8A%E7%95%B0%E9%AB%94%E5%BF%85%E7%B6%93%E7%9A%84-ripr-%E5%9B%9B%E9%9A%8E%E6%AE%B5%E9%8F%88"><img class="emoji" draggable="false" alt="⛓️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/26d3.svg" data-marp-twemoji=""/> 殺死變異體必經的 RIPR 四階段鏈</h3>
<ol>
<li><strong>R — Reachability (可達性)</strong>：
<ul>
<li>控制流必須<strong>實際執行到</strong>包含變異算子的那一行指令（等同敘述涵蓋）。</li>
</ul>
</li>
<li><strong>I — Infection (感染性 / 弱變異)</strong>：
<ul>
<li>執行突變指令後，緊接著的<strong>內部區域狀態必須與原程式產生差異</strong>（如 <code>x &gt; 2</code> 改 <code>x &gt;= 2</code>，輸入 <code>x = 2</code>）。</li>
</ul>
</li>
<li><strong>P — Propagation (傳播性)</strong>：
<ul>
<li>內部差異未被中途覆寫掩蓋，一路<strong>傳播到方法的最終輸出</strong>。</li>
</ul>
</li>
<li><strong>R — Revealability (可揭露性 / 強變異)</strong>：
<ul>
<li>測試中的 <strong><code>assertEquals</code> 斷言</strong> 真正檢查到該輸出差異並報錯！</li>
</ul>
</li>
</ol>
</div>
<div class="card">
<h3 id="%F0%9F%94%8D-%E8%AE%8A%E7%95%B0%E9%AB%94%E5%AD%98%E6%B4%BB-survived-%E4%B8%89%E5%A4%A7%E6%A0%B9%E5%9B%A0%E8%A8%BA%E6%96%B7"><img class="emoji" draggable="false" alt="🔍" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f50d.svg" data-marp-twemoji=""/> 變異體存活 (SURVIVED) 三大根因診斷</h3>
<ul>
<li><strong>1. 卡在 Reachability (<code>NO_COVERAGE</code>)</strong>：
<ul>
<li>測試根本沒走到那一行 ➔ <strong>需補足分支/路徑覆蓋率</strong>。</li>
</ul>
</li>
<li><strong>2. 卡在 Infection</strong>：
<ul>
<li>走到了該行，但測資不是邊界值（如 <code>a &gt;= 2</code> 給 <code>a = 5</code>），突變前後結果相同 ➔ <strong>需補足 BVA 邊界測資 (<code>a = 2</code>)</strong>。</li>
</ul>
</li>
<li><strong>3. 卡在 Propagation 或 Revealability</strong>：
<ul>
<li>輸出其實已經變了，但<strong>測試忘了寫對應的 <code>assertEquals</code> 斷言</strong> ➔ <strong>需強化單元測試的斷言品質</strong>！</li>
</ul>
</li>
</ul>
</div>
</div>
</div>
<footer>Ch06 白箱測試</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="42" data-paginate="true" data-header="6.4 變異測試 (Mutation Testing)" data-footer="Ch06 白箱測試" data-theme="sqa-theme" lang="C" data-marpit-pagination="42" style="--paginate:true;--header:6.4 變異測試 (Mutation Testing);--footer:Ch06 白箱測試;--theme:sqa-theme;" data-marpit-pagination-total="51">
<header>6.4 變異測試 (Mutation Testing)</header>

<h2 id="643-%E8%AE%8A%E7%95%B0%E5%88%AA%E9%99%A4%E7%8E%87-mutation-score-%E8%88%87-644-%E7%AD%89%E5%83%B9%E8%AE%8A%E7%95%B0%E9%AB%94">6.4.3 變異刪除率 (Mutation Score) 與 6.4.4 等價變異體</h2>
<div class="card-deck">
<blockquote>
<p><img class="emoji" draggable="false" alt="💡" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4a1.svg" data-marp-twemoji=""/> 並非所有突變都能被殺死！有些突變雖然改變了語法，但<strong>在數學與邏輯語意上與原程式 100% 等價</strong>。</p>
</blockquote>
<div class="two-columns">
<div class="card">
<h3 id="%F0%9F%93%88-%E8%AE%8A%E7%95%B0%E5%88%AA%E9%99%A4%E7%8E%87-mutation-score-ms-%E5%85%AC%E5%BC%8F"><img class="emoji" draggable="false" alt="📈" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4c8.svg" data-marp-twemoji=""/> 變異刪除率 (Mutation Score, MS) 公式</h3>
<ul>
<li>衡量測試套件強度的黃金指標：
<ul>
<li><strong><code>MS = K / (M - E)</code></strong></li>
<li><strong><code>M</code> (Total Mutants)</strong>：產生的變異體總數。</li>
<li><strong><code>K</code> (Killed Mutants)</strong>：被測試套件成功殺死的變異體數量。</li>
<li><strong><code>E</code> (Equivalent Mutants)</strong>：<strong>等價變異體</strong>的數量（必須從分母中扣除！）。</li>
</ul>
</li>
<li><strong>品質意義</strong>：
<ul>
<li>Branch Coverage 100% 的測試集，其 Mutation Score 可能只有 60%；唯有高 MS 才能證明測試斷言具備真實防禦力。</li>
</ul>
</li>
</ul>
</div>
<div class="card">
<h3 id="%F0%9F%91%AF-%E4%BB%80%E9%BA%BC%E6%98%AF%E7%AD%89%E5%83%B9%E8%AE%8A%E7%95%B0%E9%AB%94-equivalent-mutants"><img class="emoji" draggable="false" alt="👯" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f46f.svg" data-marp-twemoji=""/> 什麼是等價變異體 (Equivalent Mutants)？</h3>
<ul>
<li><strong>定義</strong>：變異體 <code>P'</code> 的原始碼（AST）雖然與 <code>P</code> 不同，但在<strong>所有可能的合法輸入下，其輸出行為永遠與原程式 <code>P</code> 完全一致</strong>，世界上不存在任何測資能將其殺死！</li>
<li><strong>經典範例 1（整數運算等價）</strong>：<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-pascal">原程式 P : <span class="hljs-keyword">if</span> (a &lt; b)      <span class="hljs-keyword">then</span> c := a; <span class="hljs-comment">// a, b 為整數</span>
變異體 p1: <span class="hljs-keyword">if</span> (a &lt;= b - <span class="hljs-number">1</span>) <span class="hljs-keyword">then</span> c := a; <span class="hljs-comment">// 語意完全等價!</span>
變異體 p2: <span class="hljs-keyword">if</span> (a + <span class="hljs-number">1</span> &lt;= b) <span class="hljs-keyword">then</span> c := a; <span class="hljs-comment">// 語意完全等價!</span>
變異體 p3: <span class="hljs-keyword">if</span> (a &lt; b)      <span class="hljs-keyword">then</span> c := a + <span class="hljs-number">0</span>; <span class="hljs-comment">// 等價!</span>
</code></pre>
</li>
<li><strong>經典範例 2（迴圈遞增中斷等價）</strong>：
<ul>
<li><code>index</code> 從 <code>0</code> 每次 <code>+1</code>，<code>if (index == 10) break;</code> 突變為 <code>if (index &gt;= 10) break;</code>，因由下往上遞增必先撞到 <code>10</code>，兩者行為完全等價！</li>
</ul>
</li>
</ul>
</div>
</div>
</div>
<footer>Ch06 白箱測試</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="43" data-paginate="true" data-header="6.4 變異測試 (Mutation Testing)" data-footer="Ch06 白箱測試" data-theme="sqa-theme" lang="C" data-marpit-pagination="43" style="--paginate:true;--header:6.4 變異測試 (Mutation Testing);--footer:Ch06 白箱測試;--theme:sqa-theme;" data-marpit-pagination-total="51">
<header>6.4 變異測試 (Mutation Testing)</header>

<h2 id="%E6%A6%82%E5%BF%B5%E6%A0%B8%E5%B0%8D%E5%95%8F%E7%AD%94-ccq-5">概念核對問答 (CCQ 5)</h2>
<div class="ccq-columns">
<div class="ccq-text">

<p><strong>問題情境</strong>：<br />
關於變異測試 (Mutation Testing) 中的「等價變異體 (Equivalent Mutants)」，下列敘述何者<strong>正確</strong>？</p>
<ul>
<li><strong>A)</strong> 等價變異體是指與原程式的語法完全相同，因此兩者的抽象語法樹 (AST) 沒有任何差異</li>
<li><strong>B)</strong> 等價變異體在所有可能的測試輸入下，其輸出行為都與原程式完全相同，因此無法被任何測試案例殺死 (Kill)</li>
<li><strong>C)</strong> 等價變異體是由於編譯器最佳化產生的，只要關閉編譯器最佳化即可順利殺死</li>
<li><strong>D)</strong> 在計算變異分數 <code>MS = K / (M - E)</code> 時，等價變異體應直接計入分子的被殺死變異體 (K) 數量中</li>
</ul>
</div>
<div class="ccq-logo">
<p><a href="https://nlhsueh.github.io/nickedupocket/#/student/sqa-ch06-ccq5" target="_blank"><img src="../../img/ch06/sqa-ch06-ccq5.png" alt="QR Code" /></a></p>
</div>
</div>
<footer>Ch06 白箱測試</footer>
</section>

<header>6.4 變異測試 (Mutation Testing)</header>

<h2 id="%E8%AA%B2%E5%A0%82%E7%B6%9C%E5%90%88%E6%8E%A8%E6%BC%94-ex_mutation_test%E9%99%A3%E5%88%97%E6%9C%80%E5%A4%A7%E5%80%BC%E7%B4%A2%E5%BC%95%E7%A8%8B%E5%BC%8F">課堂綜合推演 (<code>ex_mutation_test</code>)：陣列最大值索引程式</h2>
<div class="card-deck">
<blockquote>
<p><img class="emoji" draggable="false" alt="💡" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4a1.svg" data-marp-twemoji=""/> 針對尋找長度為 3 陣列最大值索引之 <code>p(a)</code> 與 4 個變異體 <code>p1 ~ p4</code>，檢驗 <code>T = {t1=[1,2,3], t2=[1,2,1], t3=[3,1,2]}</code> 的獵殺成效！</p>
</blockquote>
<div class="two-columns">
<div class="card">
<h3 id="%F0%9F%90%8D-%E5%8E%9F%E7%A8%8B%E5%BC%8F-pa-%E8%88%87%E5%9B%9B%E5%80%8B%E8%AE%8A%E7%95%B0%E9%AB%94"><img class="emoji" draggable="false" alt="🐍" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f40d.svg" data-marp-twemoji=""/> 原程式 <code>p(a)</code> 與四個變異體</h3>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-python"><span class="hljs-keyword">def</span> <span class="hljs-title function_">p</span>(<span class="hljs-params">a</span>): <span class="hljs-comment"># 回傳最大值所在索引 r</span>
    r = <span class="hljs-number">0</span>
    <span class="hljs-keyword">for</span> i <span class="hljs-keyword">in</span> [<span class="hljs-number">1</span>, <span class="hljs-number">2</span>]:
        <span class="hljs-keyword">if</span> a[i] &gt; a[r]: r = i
    <span class="hljs-keyword">return</span> r
<span class="hljs-comment"># P1: for i in [0, 1, 2]    (多測 i=0)</span>
<span class="hljs-comment"># P2: if i &gt; a[r]: r = i    (錯拿索引比值)</span>
<span class="hljs-comment"># P3: if a[i] &gt;= a[r]: r = i(&gt; 改 &gt;=)</span>
<span class="hljs-comment"># P4: if True: r = i        (固定回傳 2)</span>
</code></pre>
<ul>
<li><strong>等價與存活分析</strong>：
<ul>
<li><strong><code>P1</code> 為等價變異 (E)</strong>：<code>i=0</code> 時 <code>a[0]&gt;a[0]</code> 為 F，輸出不變。</li>
<li><strong><code>P3</code> 存活 (Alive)</strong>：補 <strong><code>t4=[2,2,1]</code></strong>，<code>P</code> 得 <code>0</code>、<code>P3</code> 得 <code>1</code> 即可 Kill！</li>
<li>補前 <code>MS = 2/(4-1) = 66.7%</code> ➔ 補後 <strong><code>MS = 100%</code></strong>！</li>
</ul>
</li>
</ul>

<h2 id="%E8%AA%B2%E5%A0%82%E5%A3%93%E8%BB%B8%E6%8E%A8%E6%BC%94-ex-mutation-xy%E4%BA%94%E5%80%8B%E8%AE%8A%E7%95%B0%E9%AB%94%E7%8D%B5%E6%AE%BA%E7%9F%A9%E9%99%A3%E8%88%87%E8%A8%88%E5%88%86%E6%BC%94%E7%AE%97%E6%B3%95-%E8%AC%9B%E7%BE%A9-663">課堂壓軸推演 (<code>ex-mutation-xy</code>)：五個變異體獵殺矩陣與計分演算法 (講義 6.6.3)</h2>
<div class="card-deck">
<blockquote>
<p><img class="emoji" draggable="false" alt="💡" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4a1.svg" data-marp-twemoji=""/> 對照講義 6.6.3 壓軸題：給定 <code>func(X, Y)</code>、5 個變異體 <code>P1~P5</code>（皆非等價）與 <code>T = {t1=(12,1), t2=(6,5), t3=(7,11)}</code>，計算變異得分！</p>

<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-type">int</span> <span class="hljs-title function_">func</span><span class="hljs-params">(<span class="hljs-type">int</span> X, <span class="hljs-type">int</span> Y)</span> {
    <span class="hljs-keyword">if</span> ((X &gt; <span class="hljs-number">10</span>) &amp;&amp; (Y == <span class="hljs-number">1</span>))  <span class="hljs-comment">// P1: X &gt; 10 改 X &gt;= 10</span>
        X = <span class="hljs-number">1</span>;                 <span class="hljs-comment">// P2: &amp;&amp;     改 ||</span>
    <span class="hljs-keyword">else</span> <span class="hljs-keyword">if</span> ((X - Y) &lt; <span class="hljs-number">2</span>)      <span class="hljs-comment">// P3: &lt; 2    改 &lt;= 2</span>
        X = <span class="hljs-number">2</span>;
    <span class="hljs-keyword">if</span> (Y &gt; <span class="hljs-number">10</span>)                <span class="hljs-comment">// P4: Y &gt; 10 改 Y &gt;= 10</span>
        X = <span class="hljs-number">3</span>;                 <span class="hljs-comment">// P5: X = 3  改 X = 4</span>
    <span class="hljs-keyword">return</span> X;
}
</code></pre>

</ul>

<h2 id="%F0%9F%A7%AA-labdemo-%E5%AF%A6%E6%88%B0-1trianglemutestjava-%E4%B8%89%E5%A4%A7%E7%AA%81%E8%AE%8A%E9%AB%94%E7%8D%B5%E6%AE%BA%E6%BC%94%E9%80%B2"><img class="emoji" draggable="false" alt="🧪" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f9ea.svg" data-marp-twemoji=""/> LabDemo 實戰 1：<code>TriangleMuTest.java</code> 三大突變體獵殺演進</h2>
<div class="card-deck">
<blockquote>
<p><img class="emoji" draggable="false" alt="💡" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4a1.svg" data-marp-twemoji=""/> <img class="emoji" draggable="false" alt="📄" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4c4.svg" data-marp-twemoji=""/> 實習手冊：[mutation_test.md#triangle](file:///Users/nick-mini-26/oTeach/SQA/LabDemo/docs/u07_mutation/mutation_test.md#triangle) ｜ <img class="emoji" draggable="false" alt="💻" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4bb.svg" data-marp-twemoji=""/> 待測檔：[Triangle.java](file:///Users/nick-mini-26/oTeach/SQA/LabDemo/src/main/java/u06_coverage/Triangle.java) ｜ <img class="emoji" draggable="false" alt="🧪" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f9ea.svg" data-marp-twemoji=""/> 測試檔：[TriangleCoverageTest.java](file:///Users/nick-mini-26/oTeach/SQA/LabDemo/src/test/java/u06_coverage/TriangleCoverageTest.java)</p>
</blockquote>
<div class="two-columns">
<div class="card">
<h3 id="%F0%9F%92%BB-trianglemutestjava-%E6%A0%B8%E5%BF%83%E7%8D%B5%E6%AE%BA%E6%9E%B6%E6%A7%8B"><img class="emoji" draggable="false" alt="💻" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4bb.svg" data-marp-twemoji=""/> <code>TriangleMuTest.java</code> 核心獵殺架構</h3>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-keyword">public</span> <span class="hljs-keyword">class</span> <span class="hljs-title class_">TriangleMuTest</span> {
    ArrayList&lt;String&gt; mutations = <span class="hljs-keyword">new</span> <span class="hljs-title class_">ArrayList</span>&lt;&gt;();
    <span class="hljs-comment">// r1: 原程式 ｜ r2: Triangle02 (a&lt;=0 改 a&lt;0)</span>
    <span class="hljs-comment">// r3: Triangle03 (正三角 a==b 改 a!=b)</span>
    <span class="hljs-comment">// r4: Triangle04 (等腰三角 a==b 改 a!=b)</span>
    <span class="hljs-keyword">void</span> <span class="hljs-title function_">muTest</span><span class="hljs-params">(<span class="hljs-type">int</span> a, <span class="hljs-type">int</span> b, <span class="hljs-type">int</span> c)</span> {
        <span class="hljs-type">String</span> <span class="hljs-variable">r1</span> <span class="hljs-operator">=</span> Triangle.getTriangleType(a, b, c);
        <span class="hljs-type">String</span> <span class="hljs-variable">r2</span> <span class="hljs-operator">=</span> Triangle02.getTriangleType(a, b, c);
        <span class="hljs-keyword">if</span> (!r1.equals(r2)) {
            System.out.println(<span class="hljs-string">&quot;\t r2 is killed&quot;</span>);
            mutations.remove(<span class="hljs-string">&quot;r2&quot;</span>);

<h2 id="%E4%BA%BA%E6%A9%9F%E5%8D%94%E5%90%8C%E5%96%AE%E5%85%83%E6%B8%AC%E8%A9%A6%E4%BA%94%E5%A4%A7%E6%A8%99%E6%BA%96%E9%9A%8E%E6%AE%B5-human-ai-testing-sop">人機協同單元測試五大標準階段 (Human-AI Testing SOP)</h2>
<div class="card-deck">
<blockquote>
<p><img class="emoji" draggable="false" alt="💡" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4a1.svg" data-marp-twemoji=""/> AI 極度擅長「看程式碼湊出 100% 覆蓋率」，但極易陷入<strong>合理化現有 Bug 的自我印證偏誤（假綠燈）</strong>。</p>
</blockquote>
<div class="content-columns">
<div class="content-text">
<h3 id="%F0%9F%9B%A1%EF%B8%8F-%E4%BA%94%E9%9A%8E%E6%AE%B5%E6%A8%99%E6%BA%96%E4%BD%9C%E6%A5%AD%E7%A8%8B%E5%BA%8F-sop"><img class="emoji" draggable="false" alt="🛡️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f6e1.svg" data-marp-twemoji=""/> 五階段標準作業程序 (SOP)</h3>
<ul>
<li><strong>Step 1：提供待測碼與契約</strong>：將 Java 原始碼與介面契約提供給 AI。</li>
<li><strong>Step 2：AI 靜態分析與測試生成</strong>：AI 解析控制流程圖 (CFG)，自動生成基線 JUnit 測試套件。</li>
<li><strong>Step 3：JaCoCo 覆蓋率度量與補彈</strong>：若覆蓋率未達標（如 <code>&lt; 85%</code>），將未覆蓋之紅/黃色分支反饋給 AI 逆向合成邊界測資。</li>
<li><strong>Step 4：人類工程師手動審查 (關鍵防線!)</strong>：人類專家親自核對 <code>assertEquals</code> 斷言是否符合真實領域規格，嚴防 AI 產生自我印證的「假綠燈」！</li>
<li><strong>Step 5：併入 CI/CD Quality Gate</strong>：通過驗證後合併入主線守護回歸品質。</li>
</ul>
</div>

<div class="card-deck">
<blockquote>
<p><img class="emoji" draggable="false" alt="💡" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4a1.svg" data-marp-twemoji=""/> 沒有單一指標能涵蓋所有風險——依據模組的風險等級（一般業務 vs. 核心計費 vs. 生命安全）選擇對應強度的白箱防線。</p>
</blockquote>
<table>
<thead>
<tr>
<th style="text-align:left">白箱方法 / 涵蓋準則</th>
<th style="text-align:left">數學與結構要求</th>
<th style="text-align:center">測資規模 (n 為條件數)</th>
<th style="text-align:left">主要獵捕之缺陷類型</th>
<th style="text-align:left">工程實務定位與建議門檻</th>
</tr>
</thead>
<tbody>
<tr>
<td style="text-align:left"><strong>敘述涵蓋 (Statement, SC)</strong></td>
<td style="text-align:left">每行可執行指令至少執行 1 次</td>
<td style="text-align:center">極少 (<code>1 ~ 2</code>)</td>
<td style="text-align:left">完全無法到達的死碼 (Dead Code)</td>
<td style="text-align:left"><strong>最低及格底線</strong>（低於 80% 代表測試嚴重不足）</td>
</tr>
<tr>
<td style="text-align:left"><strong>分支涵蓋 (Branch, BC)</strong></td>
<td style="text-align:left">每個決策真假分支皆執行 1 次</td>
<td style="text-align:center">少 (<code>2</code>)</td>
<td style="text-align:left">漏測 <code>else</code> 分支、異常處理遺漏</td>
<td style="text-align:left"><strong>業界 CI/CD 主流標準</strong>（建議核心模組 &gt;= 85%）</td>
</tr>
<tr>
<td style="text-align:left"><strong>條件涵蓋 (Condition, CC)</strong></td>
<td style="text-align:left">每個原子條件皆取過 T 與 F</td>
<td style="text-align:center">少 (<code>2 ~ 3</code>)</td>
<td style="text-align:left">複合判斷式中特定子條件失效</td>
<td style="text-align:left">搭配短路求值（JaCoCo Bytecode Branch）一併把關</td>
</tr>
<tr>
<td style="text-align:left"><strong>MC/DC (修改條件/決策)</strong></td>
<td style="text-align:left">每個條件皆具<strong>獨立影響決策結果</strong>之配對</td>
<td style="text-align:center"><strong>線性 (<code>n + 1</code>)</strong></td>
<td style="text-align:left">複雜布林邏輯遮蔽、飛控/車規致命誤判</td>
<td style="text-align:left"><strong>航太 (DO-178C) / 車規 (ISO 26262) 強制標準</strong></td>
</tr>
<tr>
<td style="text-align:left"><strong>基本路徑測試 (Basis Path)</strong></td>
<td style="text-align:left">覆蓋 <code>V(G)</code> 條線性獨立控制流路徑</td>
<td style="text-align:center"><strong><code>V(G) = P + 1</code></strong></td>
<td style="text-align:left">控制流迴圈與多分支組合邏輯漏洞</td>
<td style="text-align:left">單一方法 <code>V(G)</code> 嚴格控制在 <strong>&lt;= 10</strong> 以確保可測試性</td>
</tr>
<tr>
<td style="text-align:left"><strong>變異測試 (Mutation)</strong></td>
<td style="text-align:left">植入金絲雀突變體，檢驗 <code>MS = K/(M-E)</code></td>
<td style="text-align:center">依突變數而定</td>
<td style="text-align:left"><strong>無效斷言 (假綠燈)</strong>、邊界值漏測 (<code>&gt;</code> vs <code>&gt;=</code>)</td>
<td style="text-align:left"><strong>測試套件的照妖鏡</strong>（針對核心演算法追求高 MS）</td>
</tr>
</tbody>
</table>
</div>

<h2 id="%E9%99%84%E9%8C%84%E8%AA%B2%E5%A0%82%E4%BA%92%E5%8B%95%E5%8F%83%E8%80%83%E8%A7%A3%E7%AD%94">附錄：課堂互動參考解答</h2>
<div class="card-deck">
<blockquote>
<p><img class="emoji" draggable="false" alt="💡" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4a1.svg" data-marp-twemoji=""/> 本章課堂互動 (CCQ 1 ～ CCQ 6) 官方標準解答與核心觀念解析總整理。</p>
</blockquote>
<div class="two-columns">
<div class="card">
<h3 id="%F0%9F%A7%AD-ccq-1--3%E6%8F%92%E6%A8%81%E7%9F%AD%E8%B7%AF%E8%88%87-mcdc"><img class="emoji" draggable="false" alt="🧭" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f9ed.svg" data-marp-twemoji=""/> CCQ 1 ～ 3：插樁、短路與 MC/DC</h3>
<ul>
<li><strong>CCQ 1【錯誤 (B)】</strong>：JaCoCo 不修改 <code>.java</code> 原始碼，而是透過 Java Agent 在 JVM 載入時期對 <code>.class</code> 位元組碼進行動態插樁（On-the-fly Instrumentation）。</li>
<li><strong>CCQ 2【不一定 (B)】</strong>：在 <code>if (A &amp;&amp; B)</code> 中，若測資為 <code>(A=T, B=T)</code> 與 <code>(A=F, B=任意)</code>，雖已達成 100% 決策分支涵蓋，但因 <code>A=F</code> 短路跳過 <code>B</code>，導致 <code>B</code> 的 False 狀態從未被評估，故未達成 100% 條件涵蓋。</li>
<li><strong>CCQ 3【最少 n+1 個，最多 2n 個 (A)】</strong>：MC/DC 藉由共用基準案例構造獨立影響對，將 n 個條件所需的測試案例數由 2<sup>n</sup> 壓縮為線性的 <code>n + 1</code>（至多 <code>2n</code>）。</li>
</ul>
</div>
<div class="card">
<h3 id="%F0%9F%8E%AF-ccq-4--6%E5%9C%88%E8%A4%87%E9%9B%9C%E5%BA%A6%E7%AD%89%E5%83%B9%E8%AE%8A%E7%95%B0%E8%88%87-ai-%E5%8D%94%E5%90%8C"><img class="emoji" draggable="false" alt="🎯" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f3af.svg" data-marp-twemoji=""/> CCQ 4 ～ 6：圈複雜度、等價變異與 AI 協同</h3>
<ul>
<li><strong>CCQ 4【圈複雜度為 0 是錯誤的 (B)】</strong>：完全不含判斷敘述的線性方法，依然有一條從頭到尾的執行路徑，由 <code>V(G) = P + 1 = 0 + 1 = 1</code> 知其圈複雜度必為 <strong>1</strong>。</li>
<li><strong>CCQ 5【輸出行為完全相同無法殺死 (B)】</strong>：等價變異體語法結構不同，但在所有輸入下語意與輸出皆與原程式一致，無法被任何測試殺死，計算 MS 時須從分母扣除 (<code>M - E</code>)。</li>

<script>
(function() {
  function initHeaderDropdown() {
    var sections = [];
    var seenTitles = new Set();
    var slideSections = document.querySelectorAll("section[id]");
    
    // 1. Scan unique section titles and their slide IDs
    slideSections.forEach(function(sec) {
      var header = sec.querySelector("header");
      if (!header) return;
      
      var title = header.textContent.trim();
      title = title.replace(/^[◄◀]\s*/, "").replace(/\s*[►▶]$/, "").trim();
      if (!title || seenTitles.has(title)) return;
      
      seenTitles.add(title);
      sections.push({
        id: sec.id,
        title: title
      });
    });

    if (sections.length === 0) return;

    // Helper to create the dropdown DOM
    function createDropdownWrapper(currentTitle) {
      var wrapper = document.createElement("span");
      wrapper.className = "header-nav-wrapper";
      
      var titleSpan = document.createElement("span");
      titleSpan.className = "header-nav-title";
      titleSpan.title = "點擊固定或懸停查看所有章節快速跳轉";
      
      var textNode = document.createTextNode(currentTitle);
      var caretSpan = document.createElement("span");
      caretSpan.className = "nav-caret";
      caretSpan.textContent = " ▾";
      titleSpan.appendChild(textNode);
      titleSpan.appendChild(caretSpan);
      
      titleSpan.addEventListener("click", function(e) {
        e.stopPropagation();
        var wasOpen = wrapper.classList.contains("is-open");
        document.querySelectorAll(".header-nav-wrapper.is-open").forEach(function(w) {
          w.classList.remove("is-open");
        });
        if (!wasOpen) {
          wrapper.classList.add("is-open");
        }
      });
      
      var dropdown = document.createElement("div");
      dropdown.className = "nav-dropdown";
      
      dropdown.addEventListener("click", function(e) {
        e.stopPropagation();
      });
      
      var dropHeader = document.createElement("div");
      dropHeader.className = "nav-dropdown-header";
      var titlePart = document.createElement("span");
      titlePart.textContent = "📑 快速跳轉章節目錄";
      var countPart = document.createElement("span");
      countPart.style.fontSize = "11px";
      countPart.style.fontWeight = "normal";
      countPart.style.color = "#64748b";
      countPart.textContent = "共 " + sections.length + " 個章節";
      dropHeader.appendChild(titlePart);
      dropHeader.appendChild(countPart);
      dropdown.appendChild(dropHeader);
      
      var grid = document.createElement("div");
      grid.className = "nav-dropdown-grid";
      
      sections.forEach(function(s) {
        var item = document.createElement("a");
        var isActive = (s.title === currentTitle);
        item.className = "nav-dropdown-item" + (isActive ? " active" : "");
        item.href = "#" + s.id;
        
        var badge = document.createElement("span");
        badge.className = "badge";
        badge.textContent = "#" + s.id.padStart(2, "0");
        
        var itemText = document.createElement("span");
        itemText.className = "item-text";
        itemText.title = s.title;
        itemText.textContent = s.title;
        
        item.appendChild(badge);
        item.appendChild(itemText);
        
        item.addEventListener("click", function(e) {
          wrapper.classList.remove("is-open");
          dropdown.style.display = "none";
          window.location.hash = "#" + s.id;
          setTimeout(function() { dropdown.style.display = ""; }, 350);
        });
        
        grid.appendChild(item);
      });
      
      dropdown.appendChild(grid);
      wrapper.appendChild(titleSpan);
      wrapper.appendChild(dropdown);
      return wrapper;
    }

    // Close any pinned dropdown when clicking anywhere outside
    document.addEventListener("click", function(e) {
      if (!e.target.closest(".header-nav-wrapper")) {
        document.querySelectorAll(".header-nav-wrapper.is-open").forEach(function(w) {
          w.classList.remove("is-open");
        });
      }
    });

    // 2. Enhance each header element across all slides
    slideSections.forEach(function(sec) {
      var header = sec.querySelector("header");
      if (!header || header.dataset.navEnhanced) return;
      header.dataset.navEnhanced = "true";
      
      var title = header.textContent.trim();
      title = title.replace(/^[◄◀]\s*/, "").replace(/\s*[►▶]$/, "").trim();
      if (!title) return;
      
      header.innerHTML = "";
      var wrapper = createDropdownWrapper(title);
      header.appendChild(wrapper);
    });
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", initHeaderDropdown);
  } else {
    initHeaderDropdown();
  }
  setTimeout(initHeaderDropdown, 400);
})();
</script>
