<h1 id="%E8%BB%9F%E9%AB%94%E5%93%81%E8%B3%AA%E8%88%87%E6%B8%AC%E8%A9%A6">軟體品質與測試</h1>
<h3 id="%E7%AC%AC-8-%E7%AB%A0%E7%B3%BB%E7%B5%B1%E6%B8%AC%E8%A9%A6-system-testing%E8%A1%8C%E7%82%BA%E9%A9%85%E5%8B%95%E9%96%8B%E7%99%BC-bdd-%E8%88%87%E7%8F%BE%E4%BB%A3%E9%9D%9E%E5%8A%9F%E8%83%BD%E6%80%A7%E9%A9%97%E8%AD%89">第 8 章：系統測試 (System Testing)、行為驅動開發 (BDD) 與現代非功能性驗證</h3>
<p>授課教師：薛念林 教授</p>
<blockquote>
<p>「單元測試關心內部零件，整合測試關心齒輪銜接，<br />
而系統測試關注的是整部車能否在暴風雨中以 120km/h 載客安全奔馳。」<br />
從業務使用案例、BDD 活文件，到效能飽和點、混沌工程與安全防線，打造經得起真實世界考驗的強韌系統。</p>
</blockquote>
<footer>Ch08 系統測試、BDD 與非功能性驗證</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="2" data-paginate="true" data-header="本章大綱 (Outline)" data-footer="Ch08 系統測試、BDD 與非功能性驗證" data-class="outline-slide" data-theme="sqa-theme" lang="C" class="outline-slide" data-marpit-pagination="2" style="--paginate:true;--header:本章大綱 (Outline);--footer:Ch08 系統測試、BDD 與非功能性驗證;--class:outline-slide;--theme:sqa-theme;" data-marpit-pagination-total="27">
<header>本章大綱 (Outline)</header>

<h2 id="%E6%9C%AC%E7%AB%A0%E9%87%8D%E9%BB%9E%E5%B0%8E%E8%AE%80-key-highlights">本章重點導讀 (Key Highlights)</h2>
<div class="outline-columns">
<div>
<h3 id="%F0%9F%8E%AF-%E6%A5%AD%E5%8B%99%E6%B5%81%E7%A8%8B%E8%88%87%E8%A1%8C%E7%82%BA%E9%A9%85%E5%8B%95%E6%B8%AC%E8%A9%A6"><img class="emoji" draggable="false" alt="🎯" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f3af.svg" data-marp-twemoji=""/> 業務流程與行為驅動測試</h3>
<ul>
<li><strong>8.1 使用案例與流程測試 (Use Case Testing)</strong>：
<ul>
<li>端到端使用者視角、基本流 (Basic Flow) 與替代/例外流</li>
<li>圖書館借書案例、情境矩陣分析與測試套件衍生</li>
</ul>
</li>
<li><strong>8.2 行為驅動開發與 Cucumber 測試 (BDD)</strong>：
<ul>
<li>活文件 (Living Doc) 哲學、三方共識 (3 Amigos)</li>
<li>Gherkin 語法 (<code>Given-When-Then</code>)、BMI 情境大綱與範例表格</li>
<li>Java Step Definitions 參數自動映射實戰 (CCQ 1)</li>
</ul>
</li>
<li><strong>8.3 微服務契約、Playwright 與 AI 畫面模擬</strong>：
<ul>
<li>微服務分散式 API 漂移與 Pact 契約測試 (Consumer-Driven)</li>
<li>Playwright 現代 Web E2E (自動等待、Trace Viewer)</li>
<li>AI 測試代理人 (Browser Subagent) 與無頭瀏覽器演進 (CCQ 2)</li>
</ul>
</li>
</ul>
</div>
<div>
<h3 id="%F0%9F%9B%A1%EF%B8%8F-%E5%85%A8%E6%96%B9%E4%BD%8D%E9%9D%9E%E5%8A%9F%E8%83%BD%E6%80%A7%E6%B8%AC%E8%A9%A6%E5%B7%A5%E7%A8%8B"><img class="emoji" draggable="false" alt="🛡️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f6e1.svg" data-marp-twemoji=""/> 全方位非功能性測試工程</h3>
<ul>
<li><strong>8.4 可用性測試 (Usability Testing)</strong>：
<ul>
<li>Jakob Nielsen 十大可用性啟發原則、Hallway 走道測試</li>
<li>A/B 測試法、統計顯著性與假說驗證</li>
</ul>
</li>
<li><strong>8.5 效能測試與負載工程 (Performance Testing)</strong>：
<ul>
<li>負載 vs. 壓力 vs. 突波 vs. 浸泡四大測試型態</li>
<li>三組黃金指標（RPS, P95/P99 延遲, Error Rate）、飽和點急彎</li>
<li>k6 自動化壓測腳本與品質門檻 (Thresholds) 阻斷</li>
</ul>
</li>
<li><strong>8.6 相容性測試 (Compatibility)</strong>：跨 OS、跨瀏覽器、響應式</li>
<li><strong>8.7 安全性測試 (Security)</strong>：攻擊者思維、SAST/DAST/IAST/SCA</li>
<li><strong>8.8 回復性與彈性測試 (Resilience)</strong>：RTO/RPO/MTBF/MTTR、混沌工程</li>
<li><strong>8.9 課堂實習導讀 (LabDemo)</strong>：Cucumber, Playwright, k6</li>
</ul>
</div>
</div>
<footer>Ch08 系統測試、BDD 與非功能性驗證</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="3" data-paginate="true" data-header="8.1 使用案例與流程測試" data-footer="Ch08 系統測試、BDD 與非功能性驗證" data-theme="sqa-theme" lang="C" data-marpit-pagination="3" style="--paginate:true;--header:8.1 使用案例與流程測試;--footer:Ch08 系統測試、BDD 與非功能性驗證;--theme:sqa-theme;" data-marpit-pagination-total="27">
<header>8.1 使用案例與流程測試</header>

<h2 id="81-%E4%BB%80%E9%BA%BC%E6%98%AF%E4%BD%BF%E7%94%A8%E6%A1%88%E4%BE%8B-use-case-%E8%88%87%E6%B5%81%E7%A8%8B%E6%B8%AC%E8%A9%A6">8.1 什麼是使用案例 (Use Case) 與流程測試？</h2>
<div class="split73">
<div class="left">
<h4 id="%F0%9F%91%A4-%E7%AB%AF%E5%88%B0%E7%AB%AF%E4%BD%BF%E7%94%A8%E8%80%85%E8%A6%96%E8%A7%92-end-to-end-user-perspective"><img class="emoji" draggable="false" alt="👤" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f464.svg" data-marp-twemoji=""/> 端到端使用者視角 (End-to-End User Perspective)</h4>
<ul>
<li><strong>使用案例 (Use Case)</strong>：描述「特定參與者 (Actor)」為了達成「明確業務目標」，與軟體系統進行的一連串互動步驟。</li>
<li><strong>特點</strong>：
<ul>
<li>不涉及內部資料庫欄位或程式碼類別名稱。</li>
<li>完全從<strong>外部黑箱視角</strong>出發，聚焦於系統輸入與對應回應。</li>
</ul>
</li>
</ul>
<h4 id="%F0%9F%8C%8A-%E6%B5%81%E7%A8%8B%E5%88%86%E9%A1%9E%E5%9F%BA%E6%9C%AC%E6%B5%81%E6%9B%BF%E4%BB%A3%E6%B5%81%E8%88%87%E4%BE%8B%E5%A4%96%E6%B5%81"><img class="emoji" draggable="false" alt="🌊" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f30a.svg" data-marp-twemoji=""/> 流程分類：基本流、替代流與例外流</h4>
<ol>
<li><strong>基本流 (Basic Flow / Happy Path)</strong>：
<ul>
<li>最順利、沒有任何錯誤或干擾的主幹成功路徑。</li>
</ul>
</li>
<li><strong>替代流 (Alternative Flow)</strong>：
<ul>
<li>達到相同目標，但選擇了不同的業務分支（例如改用 LINE Pay 或使用優惠券折抵）。</li>
</ul>
</li>
<li><strong>例外流 (Exception Flow)</strong>：
<ul>
<li>遇到阻礙無法達成目標的失敗路徑（例如信用卡餘額不足、帳號被凍結）。</li>
</ul>
</li>
</ol>
</div>
<div class="right">
<p><img src="../../img/ch08/B1y5_kSV6.png" alt="Use Case Flow" /></p>
</div>
</div>
<footer>Ch08 系統測試、BDD 與非功能性驗證</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="4" data-paginate="true" data-header="8.1 使用案例與流程測試" data-footer="Ch08 系統測試、BDD 與非功能性驗證" data-theme="sqa-theme" lang="C" data-marpit-pagination="4" style="--paginate:true;--header:8.1 使用案例與流程測試;--footer:Ch08 系統測試、BDD 與非功能性驗證;--theme:sqa-theme;" data-marpit-pagination-total="27">
<header>8.1 使用案例與流程測試</header>

<h2 id="811-%E6%A1%88%E4%BE%8B%E6%8E%A8%E6%BC%94%E5%9C%96%E6%9B%B8%E9%A4%A8%E9%A0%90%E5%80%9F%E5%9C%96%E6%9B%B8%E7%B3%BB%E7%B5%B1">8.1.1 案例推演：圖書館預借圖書系統</h2>
<div class="split55">
<div class="left">
<h4 id="%F0%9F%93%9A-%E6%A5%AD%E5%8B%99%E8%A6%8F%E6%A0%BC%E6%83%85%E5%A2%83%E8%AA%AA%E6%98%8E"><img class="emoji" draggable="false" alt="📚" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4da.svg" data-marp-twemoji=""/> 業務規格情境說明</h4>
<ul>
<li><strong>參與者</strong>：讀者 (Student / Faculty)</li>
<li><strong>基本流 (Happy Path)</strong>：
<ol>
<li>讀者登入圖書館系統</li>
<li>搜尋館藏圖書並點擊「預借」</li>
<li>系統檢查無借書逾期罰款且預借配額未滿</li>
<li>系統產生取書通知並將圖書狀態標記為「保留中」</li>
</ol>
</li>
<li><strong>替代流 A1 (配額滿載)</strong>：
<ul>
<li>步驟 3 發現預借已達上限 5 本 ➔ 系統顯示提示並拒絕預借</li>
</ul>
</li>
<li><strong>例外流 E1 (讀者欠款)</strong>：
<ul>
<li>步驟 3 發現逾期罰金未繳 ➔ 系統提示「帳號凍結」並導向繳費頁面</li>
</ul>
</li>
</ul>
</div>
<div class="right">
<h4 id="%F0%9F%A7%AA-%E6%B8%AC%E8%A9%A6%E6%A1%88%E4%BE%8B%E6%83%85%E5%A2%83%E7%9F%A9%E9%99%A3%E8%A8%AD%E8%A8%88"><img class="emoji" draggable="false" alt="🧪" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f9ea.svg" data-marp-twemoji=""/> 測試案例情境矩陣設計</h4>
<table>
<thead>
<tr>
<th style="text-align:left">案例編號</th>
<th style="text-align:left">測試情境名稱</th>
<th style="text-align:left">涵蓋路徑</th>
<th style="text-align:left">預期測試結果</th>
</tr>
</thead>
<tbody>
<tr>
<td style="text-align:left"><strong>TC-01</strong></td>
<td style="text-align:left">正常成功預借</td>
<td style="text-align:left">基本流</td>
<td style="text-align:left">產生預約單號，狀態為保留中</td>
</tr>
<tr>
<td style="text-align:left"><strong>TC-02</strong></td>
<td style="text-align:left">預借上限阻擋</td>
<td style="text-align:left">基本流 ➔ A1</td>

<blockquote>
<p><img class="emoji" draggable="false" alt="🎯" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f3af.svg" data-marp-twemoji=""/> <strong>設計準則</strong>：<br />
必須確保 100% 覆蓋基本流，且<strong>每一個替代流與例外流至少被一個獨立測試案例走過一次</strong>！</p>

<header>8.2 行為驅動開發與 Cucumber 測試</header>

<h2 id="82-%E8%A1%8C%E7%82%BA%E9%A9%85%E5%8B%95%E9%96%8B%E7%99%BC-bdd-%E8%88%87%E6%B4%BB%E6%96%87%E4%BB%B6%E5%93%B2%E5%AD%B8">8.2 行為驅動開發 (BDD) 與活文件哲學</h2>
<div class="split73">
<div class="left">
<h4 id="%F0%9F%A4%9D-%E7%A0%B4%E9%99%A4%E6%BA%9D%E9%80%9A%E5%B7%B4%E5%88%A5%E5%A1%94%E4%B8%89%E6%96%B9%E5%85%B1%E8%AD%98-3-amigos"><img class="emoji" draggable="false" alt="🤝" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f91d.svg" data-marp-twemoji=""/> 破除溝通巴別塔：三方共識 (3 Amigos)</h4>
<p>傳統開發中，產品經理 (PO)、開發工程師 (Dev)、測試工程師 (QA) 對需求的理解往往不同調：</p>
<ul>
<li><strong>BDD (Behavior-Driven Development)</strong> 提倡以「領域通用語言 (Ubiquitous Language)」共同撰寫<strong>可執行的規格書</strong>。</li>
<li><strong>活文件 (Living Documentation)</strong>：
<ul>
<li>規格即測試，測試即文件。</li>
<li>當系統功能變更時，測試案例同步更新，文件永不過期！</li>
</ul>
</li>
</ul>
<h4 id="%F0%9F%A5%92-cucumber-%E8%88%87-gherkin-%E8%AA%9E%E6%B3%95"><img class="emoji" draggable="false" alt="🥒" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f952.svg" data-marp-twemoji=""/> Cucumber 與 Gherkin 語法</h4>
<ul>
<li>Cucumber 是 BDD 領域最普及的開源自動化框架。</li>
<li>採用 <strong>Gherkin 語法</strong>，以自然語言格式描述測試情境。</li>
</ul>
</div>
<div class="right">
<p><img src="../../img/ch08/HJkRVZhH6.png" alt="BDD Lifecycle" /></p>
</div>
</div>
<footer>Ch08 系統測試、BDD 與非功能性驗證</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="6" data-paginate="true" data-header="8.2 行為驅動開發與 Cucumber 測試" data-footer="Ch08 系統測試、BDD 與非功能性驗證" data-theme="sqa-theme" lang="C" data-marpit-pagination="6" style="--paginate:true;--header:8.2 行為驅動開發與 Cucumber 測試;--footer:Ch08 系統測試、BDD 與非功能性驗證;--theme:sqa-theme;" data-marpit-pagination-total="27">
<header>8.2 行為驅動開發與 Cucumber 測試</header>

<h2 id="821-gherkin-%E6%A0%B8%E5%BF%83%E8%AA%9E%E6%B3%95%E8%88%87%E4%BA%94%E5%A4%A7%E9%97%9C%E9%8D%B5%E5%AD%97">8.2.1 Gherkin 核心語法與五大關鍵字</h2>
<div class="split55">
<div class="left">
<h4 id="%F0%9F%94%91-gherkin-%E4%BA%94%E5%A4%A7%E6%A0%B8%E5%BF%83%E7%B5%90%E6%A7%8B%E9%97%9C%E9%8D%B5%E5%AD%97"><img class="emoji" draggable="false" alt="🔑" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f511.svg" data-marp-twemoji=""/> Gherkin 五大核心結構關鍵字</h4>
<ol>
<li><strong><code>Feature</code> (功能特徵)</strong>：高階商業價值描述，定義這份文件的目標。</li>
<li><strong><code>Scenario</code> (具體情境)</strong>：一個獨立的端到端業務使用案例。</li>
<li><strong><code>Given</code> (前提條件)</strong>：設定系統的初始狀態與前置條件。</li>
<li><strong><code>When</code> (觸發動作)</strong>：使用者執行的關鍵操作或事件。</li>
<li><strong><code>Then</code> (預期結果)</strong>：系統產生的可觀察結果與斷言驗證。</li>
<li><strong><code>And / But</code></strong>：串接多個條件或斷言，保持語意流暢。</li>
</ol>
</div>
<div class="right">
<h4 id="%F0%9F%9B%92-%E7%AF%84%E4%BE%8B%E8%B3%BC%E7%89%A9%E8%BB%8A%E6%BB%BF%E5%8D%83%E6%8A%98%E7%99%BE%E4%BF%83%E9%8A%B7"><img class="emoji" draggable="false" alt="🛒" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f6d2.svg" data-marp-twemoji=""/> 範例：購物車滿千折百促銷</h4>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-gherkin"><span class="hljs-keyword">Feature</span>: 購物車結帳促銷計算
  身為一名線上消費者
  為了節省開銷
  我希望在購物滿額時獲得系統自動折扣

  <span class="hljs-keyword">Scenario</span>: 購物金額滿千享有 100 元折扣
    <span class="hljs-keyword">Given</span> 購物車內已有商品如下:
      |<span class="hljs-string"> 商品名稱 </span>|<span class="hljs-string"> 單價 </span>|<span class="hljs-string"> 數量 </span>|
      |<span class="hljs-string"> Java 測試指南 </span>|<span class="hljs-string"> 600 </span>|<span class="hljs-string"> 1 </span>|
      |<span class="hljs-string"> Clean Code  </span>|<span class="hljs-string"> 500 </span>|<span class="hljs-string"> 1 </span>|
    <span class="hljs-keyword">When</span> 使用者進入結帳確認頁面
    <span class="hljs-keyword">Then</span> 原始總金額應為 1100 元
    <span class="hljs-keyword">And</span> 系統自動套用滿千折扣 100 元
    <span class="hljs-keyword">And</span> 最終應付金額應為 1000 元
</code></pre>
</div>
</div>
<footer>Ch08 系統測試、BDD 與非功能性驗證</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="7" data-paginate="true" data-header="8.2 行為驅動開發與 Cucumber 測試" data-footer="Ch08 系統測試、BDD 與非功能性驗證" data-theme="sqa-theme" lang="C" data-marpit-pagination="7" style="--paginate:true;--header:8.2 行為驅動開發與 Cucumber 測試;--footer:Ch08 系統測試、BDD 與非功能性驗證;--theme:sqa-theme;" data-marpit-pagination-total="27">
<header>8.2 行為驅動開發與 Cucumber 測試</header>

<h2 id="822-%E5%8F%83%E6%95%B8%E5%8C%96%E6%B8%AC%E8%A9%A6scenario-outline-%E8%88%87-examples">8.2.2 參數化測試：Scenario Outline 與 Examples</h2>
<div class="split55">
<div class="left">
<h4 id="%F0%9F%93%8A-%E7%82%BA%E4%BB%80%E9%BA%BC%E9%9C%80%E8%A6%81-scenario-outline"><img class="emoji" draggable="false" alt="📊" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4ca.svg" data-marp-twemoji=""/> 為什麼需要 Scenario Outline？</h4>
<p>當同一個測試情境需要驗證<strong>多組不同的邊界輸入與輸出</strong>時，複製貼上 Scenario 會造成大量重複程式碼。</p>
<h4 id="%F0%9F%92%A1-%E6%83%85%E5%A2%83%E5%A4%A7%E7%B6%B1%E8%88%87%E8%B3%87%E6%96%99%E8%A1%A8%E6%A0%BC"><img class="emoji" draggable="false" alt="💡" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4a1.svg" data-marp-twemoji=""/> 情境大綱與資料表格</h4>
<ul>
<li>使用 <code>&lt;變數名稱&gt;</code> 作為預留位置。</li>
<li>在下方附帶 <code>Examples:</code> 表格，Cucumber 會自動為每一列資料重複執行一次情境！</li>
</ul>
<blockquote>
<p><img class="emoji" draggable="false" alt="🌟" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f31f.svg" data-marp-twemoji=""/> <strong>好處</strong>：<br />
測試邏輯只寫一次，資料擴充極其直覺，連非技術背景的產品經理都能直接在表格新增測試資料！</p>
</blockquote>
</div>
<div class="right">
<h4 id="%F0%9F%8F%83-%E5%AF%A6%E6%88%B0%E6%A1%88%E4%BE%8Bbmi-%E5%81%A5%E5%BA%B7%E9%AB%94%E6%85%8B%E5%88%A4%E5%AE%9A"><img class="emoji" draggable="false" alt="🏃" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f3c3.svg" data-marp-twemoji=""/> 實戰案例：BMI 健康體態判定</h4>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-gherkin"><span class="hljs-keyword">Feature</span>: 體態評估計算機 (BMI Calculator)

  <span class="hljs-keyword">Scenario</span> <span class="hljs-keyword">Outline</span>: 驗證不同身高體重的體態判定分類
    <span class="hljs-keyword">Given</span> 測試使用者的身高為 <span class="hljs-variable">&lt;height&gt;</span> 公分
    <span class="hljs-keyword">And</span> 體重為 <span class="hljs-variable">&lt;weight&gt;</span> 公斤
    <span class="hljs-keyword">When</span> 系統計算其身體質量指數
    <span class="hljs-keyword">Then</span> 計算出的 BMI 值應為 <span class="hljs-variable">&lt;expected_bmi&gt;</span>
    <span class="hljs-keyword">And</span> 體態判定結果應為 <span class="hljs-string">&quot;&lt;category&gt;&quot;</span>

    <span class="hljs-keyword">Examples</span>:
      |<span class="hljs-string"> height </span>|<span class="hljs-string"> weight </span>|<span class="hljs-string"> expected_bmi </span>|<span class="hljs-string"> category </span>|
      |<span class="hljs-string"> 170    </span>|<span class="hljs-string"> 50     </span>|<span class="hljs-string"> 17.3         </span>|<span class="hljs-string"> 體重過輕 </span>|
      |<span class="hljs-string"> 170    </span>|<span class="hljs-string"> 65     </span>|<span class="hljs-string"> 22.5         </span>|<span class="hljs-string"> 正常範圍 </span>|
      |<span class="hljs-string"> 170    </span>|<span class="hljs-string"> 75     </span>|<span class="hljs-string"> 26.0         </span>|<span class="hljs-string"> 體重過重 </span>|
      |<span class="hljs-string"> 170    </span>|<span class="hljs-string"> 95     </span>|<span class="hljs-string"> 32.9         </span>|<span class="hljs-string"> 中度肥胖 </span>|
</code></pre>
</div>
</div>
<footer>Ch08 系統測試、BDD 與非功能性驗證</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="8" data-paginate="true" data-header="8.2 行為驅動開發與 Cucumber 測試" data-footer="Ch08 系統測試、BDD 與非功能性驗證" data-theme="sqa-theme" lang="C" data-marpit-pagination="8" style="--paginate:true;--header:8.2 行為驅動開發與 Cucumber 測試;--footer:Ch08 系統測試、BDD 與非功能性驗證;--theme:sqa-theme;" data-marpit-pagination-total="27">
<header>8.2 行為驅動開發與 Cucumber 測試</header>

<h2 id="823-java-%E6%AD%A5%E9%A9%9F%E5%AE%9A%E7%BE%A9-step-definitions-%E7%A8%8B%E5%BC%8F%E5%AF%A6%E4%BD%9C">8.2.3 Java 步驟定義 (Step Definitions) 程式實作</h2>
<div class="split55">
<div class="left">
<h4 id="%F0%9F%A7%A9-%E6%AD%A5%E9%A9%9F%E5%AE%9A%E7%BE%A9%E5%A6%82%E4%BD%95%E8%88%87-gherkin-%E7%B6%81%E5%AE%9A"><img class="emoji" draggable="false" alt="🧩" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f9e9.svg" data-marp-twemoji=""/> 步驟定義如何與 Gherkin 綁定？</h4>
<p>Cucumber-JVM 透過正則表達式或 Cucumber Expressions（如 <code>{int}</code>, <code>{double}</code>, <code>{string}</code>）將文字自動轉換為 Java 方法參數：</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-keyword">public</span> <span class="hljs-keyword">class</span> <span class="hljs-title class_">BmiStepDefinitions</span> {
    <span class="hljs-keyword">private</span> <span class="hljs-type">double</span> height;
    <span class="hljs-keyword">private</span> <span class="hljs-type">double</span> weight;
    <span class="hljs-keyword">private</span> <span class="hljs-type">double</span> actualBmi;
    <span class="hljs-keyword">private</span> String actualCategory;

    <span class="hljs-meta">@Given(&quot;測試使用者的身高為 {double} 公分&quot;)</span>
    <span class="hljs-keyword">public</span> <span class="hljs-keyword">void</span> <span class="hljs-title function_">setHeight</span><span class="hljs-params">(<span class="hljs-type">double</span> h)</span> {
        <span class="hljs-built_in">this</span>.height = h;
    }

    <span class="hljs-meta">@Given(&quot;體重為 {double} 公斤&quot;)</span>
    <span class="hljs-keyword">public</span> <span class="hljs-keyword">void</span> <span class="hljs-title function_">setWeight</span><span class="hljs-params">(<span class="hljs-type">double</span> w)</span> {
        <span class="hljs-built_in">this</span>.weight = w;
    }
</code></pre>
</div>
<div class="right">
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java">    <span class="hljs-meta">@When(&quot;系統計算其身體質量指數&quot;)</span>
    <span class="hljs-keyword">public</span> <span class="hljs-keyword">void</span> <span class="hljs-title function_">calculateBmi</span><span class="hljs-params">()</span> {
        <span class="hljs-type">BmiCalculator</span> <span class="hljs-variable">calc</span> <span class="hljs-operator">=</span> <span class="hljs-keyword">new</span> <span class="hljs-title class_">BmiCalculator</span>();
        <span class="hljs-built_in">this</span>.actualBmi = calc.compute(height, weight);
        <span class="hljs-built_in">this</span>.actualCategory = calc.classify(actualBmi);
    }

    <span class="hljs-meta">@Then(&quot;計算出的 BMI 值應為 {double}&quot;)</span>
    <span class="hljs-keyword">public</span> <span class="hljs-keyword">void</span> <span class="hljs-title function_">verifyBmi</span><span class="hljs-params">(<span class="hljs-type">double</span> expected)</span> {
        assertEquals(expected, actualBmi, <span class="hljs-number">0.1</span>);
    }

    <span class="hljs-meta">@Then(&quot;體態判定結果應為 {string}&quot;)</span>
    <span class="hljs-keyword">public</span> <span class="hljs-keyword">void</span> <span class="hljs-title function_">verifyCategory</span><span class="hljs-params">(String expectedCat)</span> {
        assertEquals(expectedCat, actualCategory);
    }
}
</code></pre>
<blockquote>
<p><img class="emoji" draggable="false" alt="📂" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4c2.svg" data-marp-twemoji=""/> <strong>LabDemo 對應檔案</strong>：<br />
<code>LabDemo/src/test/resources/u08_cucumber/bmi.feature</code><br />
<code>LabDemo/src/test/java/u08_cucumber/BmiSteps.java</code></p>
</blockquote>
</div>
</div>
<footer>Ch08 系統測試、BDD 與非功能性驗證</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="9" data-paginate="true" data-header="8.2 行為驅動開發與 Cucumber 測試" data-footer="Ch08 系統測試、BDD 與非功能性驗證" data-theme="sqa-theme" lang="C" data-marpit-pagination="9" style="--paginate:true;--header:8.2 行為驅動開發與 Cucumber 測試;--footer:Ch08 系統測試、BDD 與非功能性驗證;--theme:sqa-theme;" data-marpit-pagination-total="27">
<header>8.2 行為驅動開發與 Cucumber 測試</header>

<h2 id="%E6%A6%82%E5%BF%B5%E6%A0%B8%E5%B0%8D%E5%95%8F%E7%AD%94-ccq-1">概念核對問答 (CCQ 1)</h2>
<div class="ccq-box">
<div class="ccq-text">
<p>敏捷團隊在導入行為驅動開發 (BDD) 與 Cucumber 框架時，一位新加入的工程師抱怨：「用 Gherkin 寫 Given-When-Then 還要額外寫 Step Definitions 映射到 Java 程式碼，比我直接在 JUnit 裡面寫 <code>assertEquals(calc.bmi(170, 65), 22.5)</code> 繁瑣多了，這根本是在浪費時間！」針對這位工程師的疑慮，下列哪一項反駁最符合 BDD 的核心價值？</p>
<ul>
<li>A. Cucumber 執行速度比 JUnit 單元測試快很多，能節省 CI/CD 流水線時間</li>
<li>B. Gherkin 語法能編譯成高效能原生機器碼，比 Java 程式碼更不容易出錯</li>
<li>C. BDD 的核心在於建立團隊間的活文件共識，讓規格能被利害關係人閱讀驗證</li>
<li>D. 只有 Cucumber 能做到參數化測試，JUnit 5 的 <code>@ParameterizedTest</code> 無法做到</li>
</ul>
</div>
</div>
<details class="quiz-details">
<summary>👉 點擊查看解答與詳細解析</summary>
<blockquote>
<p><strong>正確答案：C</strong><br />
<strong>解析</strong>：</p>
<ul>
<li><strong>選項 C 正確</strong>：BDD 的初衷從來不是為了讓工程師少打幾個字，而是建立「業務利害關係人、開發者、測試者」三方共同認可的<strong>活文件 (Living Documentation)</strong>，消弭需求溝通落差！</li>
<li><strong>選項 A 錯誤</strong>：Cucumber 需動態剖析 Gherkin 文字與反射綁定，執行速度通常比純 JUnit 單元測試慢。</li>
<li><strong>選項 B 錯誤</strong>：Gherkin 是文字解析框架，不會編譯為機器碼。</li>
<li><strong>選項 D 錯誤</strong>：JUnit 5 本身就原生支援強大的 <code>@ParameterizedTest</code> 與 <code>@CsvSource</code>。</li>
</ul>
</blockquote>
</details>
<footer>Ch08 系統測試、BDD 與非功能性驗證</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="10" data-paginate="true" data-header="8.3 微服務契約、Playwright 與 AI 畫面模擬" data-footer="Ch08 系統測試、BDD 與非功能性驗證" data-theme="sqa-theme" lang="C" data-marpit-pagination="10" style="--paginate:true;--header:8.3 微服務契約、Playwright 與 AI 畫面模擬;--footer:Ch08 系統測試、BDD 與非功能性驗證;--theme:sqa-theme;" data-marpit-pagination-total="27">
<header>8.3 微服務契約、Playwright 與 AI 畫面模擬</header>

<h2 id="83-%E5%BE%AE%E6%9C%8D%E5%8B%99%E5%A5%91%E7%B4%84%E6%B8%AC%E8%A9%A6%E8%88%87%E7%8F%BE%E4%BB%A3-e2e-%E6%8C%91%E6%88%B0">8.3 微服務契約測試與現代 E2E 挑戰</h2>
<div class="split55">
<div class="left">
<h4 id="%F0%9F%95%B8%EF%B8%8F-%E5%BE%AE%E6%9C%8D%E5%8B%99%E6%95%B4%E5%90%88%E5%9C%B0%E7%8D%84-integration-hell"><img class="emoji" draggable="false" alt="🕸️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f578.svg" data-marp-twemoji=""/> 微服務整合地獄 (Integration Hell)</h4>
<ul>
<li>當系統拆分為數十個微服務時，若每一項測試都要把所有微服務與資料庫同時啟動跑 E2E，會面臨：
<ul>
<li><strong>環境脆弱</strong>：只要其中一個服務連線不穩定，整個 E2E 全部報錯。</li>
<li><strong>速度極慢</strong>：跑一次完整迴歸需數小時。</li>
<li><strong>難以定位</strong>：無法一眼看出是 API 規格變更還是網路問題。</li>
</ul>
</li>
</ul>
<h4 id="%F0%9F%93%9C-%E5%A5%91%E7%B4%84%E6%B8%AC%E8%A9%A6-contract-testing-%E8%88%87-pact"><img class="emoji" draggable="false" alt="📜" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4dc.svg" data-marp-twemoji=""/> 契約測試 (Contract Testing) 與 Pact</h4>
<ul>
<li><strong>消費者驅動契約 (Consumer-Driven Contract)</strong>：
<ul>
<li>前端/呼叫端定義一份期望的 JSON 規格書（Pact 契約）。</li>
<li>後端獨立驗證自己的 API 是否符合這份契約。</li>
<li><strong>無須同時啟動所有真實微服務，即可保證 API 介面零漂移！</strong></li>
</ul>
</li>
</ul>
</div>
<div class="right">
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-mermaid">sequenceDiagram
    autonumber
    participant Consumer as 前端 / 消費者 (Consumer)
    participant Broker as Pact Broker 契約倉儲
    participant Provider as 後端 / 提供者 (Provider)

    Consumer-&gt;&gt;Consumer: 撰寫消費者測試生成 contract.json
    Consumer-&gt;&gt;Broker: 發布契約至 Broker 註冊
    Provider-&gt;&gt;Broker: CI 拉取最新的合約檔案
    Provider-&gt;&gt;Provider: 在本地回放驗證 API 格式
    Provider-&gt;&gt;Broker: 回報驗證成功 (can-i-deploy)
</code></pre>
<blockquote>
<p><img class="emoji" draggable="false" alt="🎯" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f3af.svg" data-marp-twemoji=""/> <strong>核心優勢</strong>：在雙方完全解耦的情況下，徹底防範「後端改了欄位名、前端上線才當機」的悲劇！</p>
</blockquote>
</div>
</div>
<footer>Ch08 系統測試、BDD 與非功能性驗證</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="11" data-paginate="true" data-header="8.3 微服務契約、Playwright 與 AI 畫面模擬" data-footer="Ch08 系統測試、BDD 與非功能性驗證" data-theme="sqa-theme" lang="C" data-marpit-pagination="11" style="--paginate:true;--header:8.3 微服務契約、Playwright 與 AI 畫面模擬;--footer:Ch08 系統測試、BDD 與非功能性驗證;--theme:sqa-theme;" data-marpit-pagination-total="27">
<header>8.3 微服務契約、Playwright 與 AI 畫面模擬</header>

<h2 id="831-%E7%8F%BE%E4%BB%A3-web-e2e-%E6%B8%AC%E8%A9%A6%E5%88%A9%E5%99%A8playwright">8.3.1 現代 Web E2E 測試利器：Playwright</h2>
<div class="split55">
<div class="left">
<h4 id="%F0%9F%A5%8A-%E5%82%B3%E7%B5%B1-selenium-vs-%E7%8F%BE%E4%BB%A3-playwright"><img class="emoji" draggable="false" alt="🥊" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f94a.svg" data-marp-twemoji=""/> 傳統 Selenium vs. 現代 Playwright</h4>
<ul>
<li><strong>傳統 Selenium 的痛點</strong>：
<ul>
<li>需手動撰寫 <code>Thread.sleep()</code> 或繁瑣的 <code>WebDriverWait</code>。</li>
<li>動態 SPA (React/Vue) 渲染慢時頻繁出現「找不到元素」假警報。</li>
</ul>
</li>
<li><strong>微軟 Playwright 的革命性突破</strong>：
<ol>
<li><strong>原生自動等待 (Auto-Waiting)</strong>：點擊前自動確認元素已可見、已就緒且無遮蔽。</li>
<li><strong>跨瀏覽器單一 API</strong>：原生驅動 Chromium, Firefox, WebKit (Safari)。</li>
<li><strong>強大的 Trace Viewer</strong>：自動錄製測試執行過程的 DOM 影片與時序快照，除錯極度輕鬆！</li>
</ol>
</li>
</ul>
</div>
<div class="right">
<h4 id="%F0%9F%92%BB-playwright-%E7%B0%A1%E6%BD%94%E5%AF%A6%E6%88%B0%E8%AA%9E%E6%B3%95"><img class="emoji" draggable="false" alt="💻" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4bb.svg" data-marp-twemoji=""/> Playwright 簡潔實戰語法</h4>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-typescript"><span class="hljs-keyword">import</span> { test, expect } <span class="hljs-keyword">from</span> <span class="hljs-string">&#x27;@playwright/test&#x27;</span>;

<span class="hljs-title function_">test</span>(<span class="hljs-string">&#x27;測試購物車結帳流程&#x27;</span>, <span class="hljs-title function_">async</span> ({ page }) =&gt; {
  <span class="hljs-comment">// 導向電商首頁</span>
  <span class="hljs-keyword">await</span> page.<span class="hljs-title function_">goto</span>(<span class="hljs-string">&#x27;https://shop.example.com&#x27;</span>);

  <span class="hljs-comment">// 搜尋並加入購物車 (自動等待按鈕可點擊)</span>
  <span class="hljs-keyword">await</span> page.<span class="hljs-title function_">fill</span>(<span class="hljs-string">&#x27;input[name=&quot;search&quot;]&#x27;</span>, <span class="hljs-string">&#x27;MacBook&#x27;</span>);
  <span class="hljs-keyword">await</span> page.<span class="hljs-title function_">click</span>(<span class="hljs-string">&#x27;button:has-text(&quot;搜尋&quot;)&#x27;</span>);
  <span class="hljs-keyword">await</span> page.<span class="hljs-title function_">click</span>(<span class="hljs-string">&#x27;button.add-to-cart&#x27;</span>);

  <span class="hljs-comment">// 前往購物車斷言金額</span>
  <span class="hljs-keyword">await</span> page.<span class="hljs-title function_">click</span>(<span class="hljs-string">&#x27;#cart-icon&#x27;</span>);
  <span class="hljs-keyword">const</span> total = page.<span class="hljs-title function_">locator</span>(<span class="hljs-string">&#x27;.cart-total-price&#x27;</span>);
  <span class="hljs-keyword">await</span> <span class="hljs-title function_">expect</span>(total).<span class="hljs-title function_">toHaveText</span>(<span class="hljs-string">&#x27;$39,900&#x27;</span>);
});
</code></pre>
</div>
</div>
<footer>Ch08 系統測試、BDD 與非功能性驗證</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="12" data-paginate="true" data-header="8.3 微服務契約、Playwright 與 AI 畫面模擬" data-footer="Ch08 系統測試、BDD 與非功能性驗證" data-theme="sqa-theme" lang="C" data-marpit-pagination="12" style="--paginate:true;--header:8.3 微服務契約、Playwright 與 AI 畫面模擬;--footer:Ch08 系統測試、BDD 與非功能性驗證;--theme:sqa-theme;" data-marpit-pagination-total="27">
<header>8.3 微服務契約、Playwright 與 AI 畫面模擬</header>

<h2 id="832-ai-%E6%B8%AC%E8%A9%A6%E4%BB%A3%E7%90%86%E4%BA%BA%E7%95%AB%E9%9D%A2%E6%A8%A1%E6%93%AC%E6%A9%9F%E5%88%B6-ai-browser-agent">8.3.2 AI 測試代理人畫面模擬機制 (AI Browser Agent)</h2>
<div class="split55">
<div class="left">
<h4 id="%F0%9F%A4%96-%E5%BE%9E%E8%85%B3%E6%9C%AC%E8%87%AA%E5%8B%95%E5%8C%96%E5%88%B0ai-%E8%A6%96%E8%A6%BA%E8%88%87%E8%87%AA%E9%81%A9%E6%87%89%E6%93%8D%E4%BD%9C"><img class="emoji" draggable="false" alt="🤖" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f916.svg" data-marp-twemoji=""/> 從腳本自動化到「AI 視覺與自適應操作」</h4>
<ul>
<li>傳統自動化依賴脆弱的 XPath 或 CSS Selector，前端一改 Class Name 測試就全壞。</li>
<li><strong>AI 畫面模擬 (AI Browser-Subagent)</strong>：
<ul>
<li>透過 Chrome DevTools Protocol (CDP) 連線無頭瀏覽器。</li>
<li>AI 結合 <strong>DOM 語意樹分析</strong> 與 <strong>電腦視覺截圖 (Screenshot Multi-modal)</strong>。</li>
<li>像真實人類一樣理解畫面：「左上角有一個藍色的結帳按鈕」。</li>
</ul>
</li>
</ul>
<h4 id="%F0%9F%9A%80-%E5%A4%9A%E7%AB%AF%E8%87%AA%E5%8B%95%E5%8C%96%E6%8A%80%E8%A1%93%E6%BC%94%E9%80%B2%E6%A2%AF%E9%9A%8A"><img class="emoji" draggable="false" alt="🚀" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f680.svg" data-marp-twemoji=""/> 多端自動化技術演進梯隊</h4>
<ol>
<li><strong>無頭網頁 (Headless)</strong>：Puppeteer / Playwright。</li>
<li><strong>桌面應用 (Desktop)</strong>：Electron + Spectron。</li>
<li><strong>AI 智慧自適應代理人</strong>：自動探索動態路徑與自愈測試 (Self-healing Tests)。</li>
</ol>
</div>
<div class="right">
<table>
<thead>
<tr>
<th style="text-align:left">技術世代</th>
<th style="text-align:left">驅動方式</th>
<th style="text-align:left">元素定位模式</th>
<th style="text-align:left">維護成本</th>
<th style="text-align:left">應對 UI 變動能力</th>
</tr>
</thead>
<tbody>
<tr>
<td style="text-align:left"><strong>第一代</strong> (Selenium)</td>
<td style="text-align:left">WebDriver HTTP</td>
<td style="text-align:left">硬編碼 XPath / ID</td>
<td style="text-align:left">高 (易脆)</td>
<td style="text-align:left">極差 (需手動修腳本)</td>
</tr>
<tr>
<td style="text-align:left"><strong>第二代</strong> (Playwright)</td>
<td style="text-align:left">CDP 雙向通訊</td>
<td style="text-align:left">自動等待 + 語意 Selector</td>
<td style="text-align:left">中等</td>
<td style="text-align:left">良好 (具彈性重試)</td>
</tr>
<tr>
<td style="text-align:left"><strong>第三代</strong> (AI Subagent)</td>
<td style="text-align:left">多模態視覺 + CDP</td>
<td style="text-align:left">語意目標導向與自愈</td>
<td style="text-align:left">極低</td>
<td style="text-align:left"><strong>極強 (自動識別新位置)</strong></td>
</tr>
</tbody>
</table>
<blockquote>
<p><img class="emoji" draggable="false" alt="📌" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4cc.svg" data-marp-twemoji=""/> <strong>深度理解</strong>：AI 測試代理人不是替代 Playwright，而是作為「大腦」驅動現代無頭瀏覽器，實現自主測試探索！</p>
</blockquote>
</div>
</div>
<footer>Ch08 系統測試、BDD 與非功能性驗證</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="13" data-paginate="true" data-header="8.3 微服務契約、Playwright 與 AI 畫面模擬" data-footer="Ch08 系統測試、BDD 與非功能性驗證" data-theme="sqa-theme" lang="C" data-marpit-pagination="13" style="--paginate:true;--header:8.3 微服務契約、Playwright 與 AI 畫面模擬;--footer:Ch08 系統測試、BDD 與非功能性驗證;--theme:sqa-theme;" data-marpit-pagination-total="27">
<header>8.3 微服務契約、Playwright 與 AI 畫面模擬</header>

<h2 id="%E6%A6%82%E5%BF%B5%E6%A0%B8%E5%B0%8D%E5%95%8F%E7%AD%94-ccq-2">概念核對問答 (CCQ 2)</h2>
<div class="ccq-box">
<div class="ccq-text">
<p>現代系統測試中廣泛運用「無頭瀏覽器 (Headless Browser)」與「AI 畫面模擬代理人 (AI Browser-Subagent)」技術。關於無頭瀏覽器與 AI 代理人的本質與運作機制，下列哪一項敘述是<strong>最正確</strong>的？</p>
<ul>
<li>A. 無頭瀏覽器沒有瀏覽器核心引擎，純粹用正則表達式快速剖析 HTML 標籤</li>
<li>B. AI 測試代理人操作無頭瀏覽器時，完全不消耗任何本機 CPU 與記憶體資源</li>
<li>C. 無頭瀏覽器具備完整的排版與 JavaScript 執行引擎，僅省略了螢幕像素繪製</li>
<li>D. AI 測試代理人執行點擊操作時，本質上是透過修改記憶體資料庫的狀態達成</li>
</ul>
</div>
</div>
<details class="quiz-details">
<summary>👉 點擊查看解答與詳細解析</summary>
<blockquote>
<p><strong>正確答案：C</strong><br />
<strong>解析</strong>：</p>
<ul>
<li><strong>選項 C 正確</strong>：無頭瀏覽器（如 Headless Chromium）內部依然擁有完整的 Blink 排版引擎與 V8 JavaScript 引擎，能完整解析 DOM、執行 CSS 與 JS 腳本，只是不呼叫作業系統的圖形介面視窗進行實體螢幕像素渲染，因此執行速度飛快！</li>
<li><strong>選項 A 錯誤</strong>：無頭瀏覽器不是純文字剖析，而是完整的真實瀏覽器核心。</li>
<li><strong>選項 B 錯誤</strong>：AI 視覺推論與無頭瀏覽器運行需要消耗計算資源。</li>
<li><strong>選項 D 錯誤</strong>：AI 代理人是透過 CDP 發送真實的鍵盤與滑鼠事件，走的是真正的外部介面。</li>
</ul>
</blockquote>
</details>
<footer>Ch08 系統測試、BDD 與非功能性驗證</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="14" data-paginate="true" data-header="8.4 可用性測試 (Usability Testing)" data-footer="Ch08 系統測試、BDD 與非功能性驗證" data-theme="sqa-theme" lang="C" data-marpit-pagination="14" style="--paginate:true;--header:8.4 可用性測試 (Usability Testing);--footer:Ch08 系統測試、BDD 與非功能性驗證;--theme:sqa-theme;" data-marpit-pagination-total="27">
<header>8.4 可用性測試 (Usability Testing)</header>

<h2 id="84-%E5%8F%AF%E7%94%A8%E6%80%A7%E6%B8%AC%E8%A9%A6jakob-nielsen-10-%E5%A4%A7%E5%95%9F%E7%99%BC%E5%BC%8F%E5%8E%9F%E5%89%87">8.4 可用性測試：Jakob Nielsen 10 大啟發式原則</h2>
<div class="split55">
<div class="left">
<h4 id="%F0%9F%A7%A0-%E7%B3%BB%E7%B5%B1%E6%98%AF%E5%90%A6%E7%AC%A6%E5%90%88%E4%BA%BA%E6%9C%AC%E6%80%9D%E7%B6%AD"><img class="emoji" draggable="false" alt="🧠" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f9e0.svg" data-marp-twemoji=""/> 系統是否符合「人本思維」？</h4>
<p>可用性 (Usability) 衡量的是使用者能否<strong>高效率、滿意且無障礙地</strong>完成任務。</p>
<h4 id="%F0%9F%8F%86-nielsen-%E5%8D%81%E5%A4%A7%E5%95%9F%E7%99%BC%E5%BC%8F%E5%8F%AF%E7%94%A8%E6%80%A7%E5%8E%9F%E5%89%87%E7%B2%BE%E8%8F%AF"><img class="emoji" draggable="false" alt="🏆" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f3c6.svg" data-marp-twemoji=""/> Nielsen 十大啟發式可用性原則精華</h4>
<ol>
<li><strong>系統狀態能見度</strong>：例如上傳檔案時顯示即時進度條。</li>
<li><strong>符合真實世界情境</strong>：使用使用者熟悉的詞彙，而非內部工程代碼。</li>
<li><strong>使用者控制與自由度</strong>：提供明確的「復原 (Undo)」與「取消」途徑。</li>
<li><strong>一致性與標準化</strong>：全站按鈕樣式與行為邏輯應保持統一。</li>
<li><strong>預防錯誤發生</strong>：在危險操作前提供二次確認，或防止輸入非法字元。</li>
</ol>
</div>
<div class="right">
<ol start="6">
<li><strong>重現而非回憶</strong>：介面物件與操作選項應清晰可見，降低認知負擔。</li>
<li><strong>彈性與使用效率</strong>：為新手提供引導，為老手提供快捷鍵。</li>
<li><strong>極簡與美學設計</strong>：去除無關資訊，避免喧賓奪主。</li>
<li><strong>協助使用者辨識與修復錯誤</strong>：錯誤訊息應指出原因並提供解決建議。</li>
<li><strong>說明與文件支援</strong>：提供易於搜尋且專注於任務的說明文件。</li>
</ol>
<blockquote>
<p><img class="emoji" draggable="false" alt="💡" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4a1.svg" data-marp-twemoji=""/> <strong>經典實證法則：Hallway 走道測試</strong><br />
Jakob Nielsen 研究指出：<strong>只要邀請 5 位具代表性的使用者進行走道測試，就能發現超過 85% 的重大可用性缺陷！</strong></p>
</blockquote>
</div>
</div>
<footer>Ch08 系統測試、BDD 與非功能性驗證</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="15" data-paginate="true" data-header="8.4 可用性測試 (Usability Testing)" data-footer="Ch08 系統測試、BDD 與非功能性驗證" data-theme="sqa-theme" lang="C" data-marpit-pagination="15" style="--paginate:true;--header:8.4 可用性測試 (Usability Testing);--footer:Ch08 系統測試、BDD 與非功能性驗證;--theme:sqa-theme;" data-marpit-pagination-total="27">
<header>8.4 可用性測試 (Usability Testing)</header>

<h2 id="841-ab-%E6%B8%AC%E8%A9%A6%E6%B3%95%E8%88%87%E6%95%B8%E6%93%9A%E9%A9%85%E5%8B%95%E9%A9%97%E8%AD%89">8.4.1 A/B 測試法與數據驅動驗證</h2>
<div class="split55">
<div class="left">
<h4 id="%F0%9F%94%AC-%E4%BB%80%E9%BA%BC%E6%98%AF-ab-%E6%B8%AC%E8%A9%A6-ab-testing"><img class="emoji" draggable="false" alt="🔬" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f52c.svg" data-marp-twemoji=""/> 什麼是 A/B 測試 (A/B Testing)？</h4>
<ul>
<li>將線上真實使用者隨機分流為兩組（或多組）：
<ul>
<li><strong>控制組 (Control Group - A)</strong>：當前現行版本。</li>
<li><strong>實驗組 (Variant Group - B)</strong>：改變單一變因的新設計（例如按鈕改為橘色、文案簡化）。</li>
</ul>
</li>
<li><strong>關鍵流程</strong>：
<ol>
<li>提出可被證偽的<strong>商業假說 (Hypothesis)</strong>。</li>
<li>設定<strong>核心評估指標 (OEC)</strong>：點擊率 (CTR)、購買轉換率 (CVR)。</li>
<li>蒐集足夠樣本數後進行<strong>統計顯著性檢定 (p-value &lt; 0.05)</strong>。</li>
</ol>
</li>
</ul>
</div>
<div class="right">
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-mermaid">flowchart TD
    Users[&quot;所有訪問使用者&quot;]
    Splitter{&quot;隨機分流閘道 (50% / 50%)&quot;}
    
    A[&quot;版本 A (現有結帳按鈕 - 灰色)&quot;]
    B[&quot;版本 B (新版結帳按鈕 - 亮橘色)&quot;]
    
    MetricA[&quot;轉換率: 2.1%&quot;]
    MetricB[&quot;轉換率: 3.8% (顯著提升)&quot;]
    
    Users --&gt; Splitter
    Splitter --&gt;|組別 A| A --&gt; MetricA
    Splitter --&gt;|組別 B| B --&gt; MetricB
</code></pre>
<blockquote>
<p><img class="emoji" draggable="false" alt="⚠️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/26a0.svg" data-marp-twemoji=""/> <strong>避坑指南</strong>：</p>
<ul>
<li>嚴禁同時改動多個變因（否則無法歸因）。</li>
<li>嚴禁在樣本數不足時提前宣布勝利（避免偽陽性偏差）。</li>
</ul>
</blockquote>
</div>
</div>
<footer>Ch08 系統測試、BDD 與非功能性驗證</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="16" data-paginate="true" data-header="8.5 效能測試與負載工程" data-footer="Ch08 系統測試、BDD 與非功能性驗證" data-theme="sqa-theme" lang="C" data-marpit-pagination="16" style="--paginate:true;--header:8.5 效能測試與負載工程;--footer:Ch08 系統測試、BDD 與非功能性驗證;--theme:sqa-theme;" data-marpit-pagination-total="27">
<header>8.5 效能測試與負載工程</header>

<h2 id="85-%E6%95%88%E8%83%BD%E6%B8%AC%E8%A9%A6%E5%9B%9B%E5%A4%A7%E9%A1%9E%E5%9E%8B-performance-testing-types">8.5 效能測試四大類型 (Performance Testing Types)</h2>
<div class="split55">
<div class="left">
<h4 id="1-%E8%B2%A0%E8%BC%89%E6%B8%AC%E8%A9%A6-load-testing">1. 負載測試 (Load Testing)</h4>
<ul>
<li><strong>目的</strong>：驗證系統在<strong>預期的正常工作負載</strong>下的運作行為。</li>
<li><strong>目標</strong>：確認回應時間與吞吐量是否符合 SLA 承諾。</li>
</ul>
<h4 id="2-%E5%A3%93%E5%8A%9B%E6%B8%AC%E8%A9%A6-stress-testing">2. 壓力測試 (Stress Testing)</h4>
<ul>
<li><strong>目的</strong>：持續加壓超越設計極限，直到系統崩潰為止。</li>
<li><strong>目標</strong>：尋找系統破裂點 (Breaking Point)，檢驗是否有優雅降級 (Graceful Degradation) 還是直接當機。</li>
</ul>
</div>
<div class="right">
<h4 id="3-%E7%AA%81%E6%B3%A2%E6%B8%AC%E8%A9%A6-spike-testing">3. 突波測試 (Spike Testing)</h4>
<ul>
<li><strong>目的</strong>：在極短時間內突然湧入暴量請求（如演唱會開賣搶票）。</li>
<li><strong>目標</strong>：驗證系統自動水平擴展 (Auto-scaling) 的反應速度與抗衝擊力。</li>
</ul>
<h4 id="4-%E6%B5%B8%E6%B3%A1%E8%80%90%E4%B9%85%E6%B8%AC%E8%A9%A6-soak--endurance-testing">4. 浸泡/耐久測試 (Soak / Endurance Testing)</h4>
<ul>
<li><strong>目的</strong>：在標準負載下<strong>連續長時間運行 24~72 小時</strong>。</li>
<li><strong>目標</strong>：揪出深層的<strong>記憶體洩漏 (Memory Leak)</strong>、資料庫連線池耗盡與磁碟記錄檔暴增問題。</li>
</ul>
</div>
</div>
<footer>Ch08 系統測試、BDD 與非功能性驗證</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="17" data-paginate="true" data-header="8.5 效能測試與負載工程" data-footer="Ch08 系統測試、BDD 與非功能性驗證" data-theme="sqa-theme" lang="C" data-marpit-pagination="17" style="--paginate:true;--header:8.5 效能測試與負載工程;--footer:Ch08 系統測試、BDD 與非功能性驗證;--theme:sqa-theme;" data-marpit-pagination-total="27">
<header>8.5 效能測試與負載工程</header>

<h2 id="851-%E6%95%88%E8%83%BD%E5%B7%A5%E7%A8%8B%E4%B8%89%E7%B5%84%E9%BB%83%E9%87%91%E5%BA%A6%E9%87%8F%E6%8C%87%E6%A8%99">8.5.1 效能工程三組黃金度量指標</h2>
<div class="split73">
<div class="left">
<h4 id="%F0%9F%A5%87-%E6%95%88%E8%83%BD%E4%B8%89%E6%9C%AC%E6%9F%B1-three-golden-metrics"><img class="emoji" draggable="false" alt="🥇" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f947.svg" data-marp-twemoji=""/> 效能三本柱 (Three Golden Metrics)</h4>
<ol>
<li><strong>吞吐量 (Throughput / RPS)</strong>：
<ul>
<li>每秒系統成功處理的請求數量 (Requests Per Second)。</li>
</ul>
</li>
<li><strong>回應延遲 (Latency / Response Time)</strong>：
<ul>
<li>絕不能只看「平均值」(會被離群值掩蓋)！</li>
<li>必須監控百分位數：<strong>P50 (中位數)</strong>、<strong>P95 (95% 使用者感受)</strong>、<strong>P99 (最慢 1% 臨界體驗)</strong>。</li>
</ul>
</li>
<li><strong>錯誤率 (Error Rate)</strong>：
<ul>
<li>HTTP 5xx 伺服器錯誤與連線逾時 (Timeout) 佔全部請求的百分比（通常要求 &lt; 0.1%）。</li>
</ul>
</li>
</ol>
</div>
<div class="right">
<p><img src="../../img/ch08/performance_testing_three_golden_metrics.jpg" alt="Performance Golden Metrics" /></p>
</div>
</div>
<footer>Ch08 系統測試、BDD 與非功能性驗證</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="18" data-paginate="true" data-header="8.5 效能測試與負載工程" data-footer="Ch08 系統測試、BDD 與非功能性驗證" data-theme="sqa-theme" lang="C" data-marpit-pagination="18" style="--paginate:true;--header:8.5 效能測試與負載工程;--footer:Ch08 系統測試、BDD 與非功能性驗證;--theme:sqa-theme;" data-marpit-pagination-total="27">
<header>8.5 效能測試與負載工程</header>

<h2 id="852-%E7%B3%BB%E7%B5%B1%E9%A3%BD%E5%92%8C%E9%BB%9E-saturation-point-%E8%88%87%E6%80%A5%E5%BD%8E%E5%88%86%E6%9E%90">8.5.2 系統飽和點 (Saturation Point) 與急彎分析</h2>
<div class="split55">
<div class="left">
<h4 id="%F0%9F%93%89-%E7%82%BA%E4%BB%80%E9%BA%BC%E5%BB%B6%E9%81%B2%E6%9C%83%E5%9C%A8%E7%9E%AC%E9%96%93%E6%8C%87%E6%95%B8%E7%B4%9A%E6%9A%B4%E5%A2%9E"><img class="emoji" draggable="false" alt="📉" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4c9.svg" data-marp-twemoji=""/> 為什麼延遲會在瞬間指數級暴增？</h4>
<p>當並發使用者持續增加時，系統表現通常歷經三階段：</p>
<ol>
<li><strong>線性穩定區 (Linear Region)</strong>：
<ul>
<li>吞吐量隨人數線性增長，延遲幾乎平坦不變。</li>
</ul>
</li>
<li><strong>轉折飽和點 (Saturation Point / Knee)</strong>：
<ul>
<li>CPU、記憶體或資料庫連線池達到 100% 滿載。</li>
</ul>
</li>
<li><strong>崩潰排隊區 (Queueing Region)</strong>：
<ul>
<li>新請求開始在佇列中嚴重積壓等待，<strong>回應延遲呈現垂直向上急彎飆升</strong>，吞吐量甚至雪崩下跌！</li>
</ul>
</li>
</ol>
</div>
<div class="right">
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-mermaid">xychart-beta
    title &quot;並發負載 vs. 回應延遲與吞吐量轉折曲線&quot;
    x-axis [&quot;50人&quot;, &quot;100人&quot;, &quot;200人&quot;, &quot;500人&quot;, &quot;1000人(飽和點)&quot;, &quot;1500人&quot;, &quot;2000人&quot;]
    y-axis &quot;數值指標趨勢&quot; 0 --&gt; 100
    line [10, 20, 40, 80, 95, 92, 60]
    line [5, 6, 8, 12, 25, 65, 98]
</code></pre>
<ul>
<li><img class="emoji" draggable="false" alt="🔵" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f535.svg" data-marp-twemoji=""/> <strong>藍線 (吞吐量 RPS)</strong>：達到飽和點後開始停滯或下降。</li>
<li><img class="emoji" draggable="false" alt="🟠" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f7e0.svg" data-marp-twemoji=""/> <strong>橘線 (延遲毫秒)</strong>：超越飽和點後發生連鎖排隊效應，迅速飆向逾時崩潰！</li>
</ul>
</div>
</div>
<footer>Ch08 系統測試、BDD 與非功能性驗證</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="19" data-paginate="true" data-header="8.5 效能測試與負載工程" data-footer="Ch08 系統測試、BDD 與非功能性驗證" data-theme="sqa-theme" lang="C" data-marpit-pagination="19" style="--paginate:true;--header:8.5 效能測試與負載工程;--footer:Ch08 系統測試、BDD 與非功能性驗證;--theme:sqa-theme;" data-marpit-pagination-total="27">
<header>8.5 效能測試與負載工程</header>

<h2 id="853-%E7%8F%BE%E4%BB%A3%E7%8F%BE%E4%BB%A3%E5%8C%96%E5%A3%93%E6%B8%AC%E5%B7%A5%E5%85%B7k6-%E5%AF%A6%E6%88%B0%E8%88%87%E9%96%80%E6%AA%BB%E8%87%AA%E5%8B%95%E5%8C%96">8.5.3 現代現代化壓測工具：k6 實戰與門檻自動化</h2>
<div class="split55">
<div class="left">
<h4 id="%E2%9A%A1-grafana-k6%E9%96%8B%E7%99%BC%E8%80%85%E5%8F%8B%E5%96%84%E7%9A%84%E6%95%88%E8%83%BD%E5%88%A9%E5%99%A8"><img class="emoji" draggable="false" alt="⚡" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/26a1.svg" data-marp-twemoji=""/> Grafana k6：開發者友善的效能利器</h4>
<ul>
<li>使用純 JavaScript 撰寫測試腳本，底層由 Go 語言編譯的高效能非同步引擎驅動。</li>
<li>支援以代碼定義 <strong>門檻 (Thresholds)</strong>，可在 CI/CD 中作為品質守門員自動阻斷不良部署！</li>
</ul>
<h4 id="%F0%9F%8F%83-k6-%E5%AF%A6%E6%88%B0%E7%AF%84%E4%BE%8B%E8%85%B3%E6%9C%AC-load_testjs"><img class="emoji" draggable="false" alt="🏃" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f3c3.svg" data-marp-twemoji=""/> k6 實戰範例腳本 (<code>load_test.js</code>)</h4>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-javascript"><span class="hljs-keyword">import</span> http <span class="hljs-keyword">from</span> <span class="hljs-string">&#x27;k6/http&#x27;</span>;
<span class="hljs-keyword">import</span> { check, sleep } <span class="hljs-keyword">from</span> <span class="hljs-string">&#x27;k6&#x27;</span>;

<span class="hljs-comment">// 測試階段規劃：負載爬升與持續</span>
<span class="hljs-keyword">export</span> <span class="hljs-keyword">const</span> options = {
  <span class="hljs-attr">stages</span>: [
    { <span class="hljs-attr">duration</span>: <span class="hljs-string">&#x27;30s&#x27;</span>, <span class="hljs-attr">target</span>: <span class="hljs-number">50</span> },  <span class="hljs-comment">// 30秒爬升到 50 人</span>
    { <span class="hljs-attr">duration</span>: <span class="hljs-string">&#x27;1m&#x27;</span>, <span class="hljs-attr">target</span>: <span class="hljs-number">50</span> },   <span class="hljs-comment">// 維持 50 人持續加壓</span>
    { <span class="hljs-attr">duration</span>: <span class="hljs-string">&#x27;10s&#x27;</span>, <span class="hljs-attr">target</span>: <span class="hljs-number">0</span> },   <span class="hljs-comment">// 10秒降載</span>
  ],
  <span class="hljs-attr">thresholds</span>: {
    <span class="hljs-comment">// 嚴格品質守門員：95% 請求必須在 200ms 內完成</span>
    <span class="hljs-attr">http_req_duration</span>: [<span class="hljs-string">&#x27;p(95)&lt;200&#x27;</span>],
    <span class="hljs-comment">// 失敗率必須低於 1%</span>
    <span class="hljs-attr">http_req_failed</span>: [<span class="hljs-string">&#x27;rate&lt;0.01&#x27;</span>],
  },
};
</code></pre>
</div>
<div class="right">
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-javascript"><span class="hljs-keyword">export</span> <span class="hljs-keyword">default</span> <span class="hljs-keyword">function</span> (<span class="hljs-params"></span>) {
  <span class="hljs-keyword">const</span> res = http.<span class="hljs-title function_">get</span>(<span class="hljs-string">&#x27;http://localhost:8080/api/primes/calculate?max=100&#x27;</span>);
  
  <span class="hljs-comment">// 檢查點斷言</span>
  <span class="hljs-title function_">check</span>(res, {
    <span class="hljs-string">&#x27;狀態碼為 200&#x27;</span>: <span class="hljs-function">(<span class="hljs-params">r</span>) =&gt;</span> r.<span class="hljs-property">status</span> === <span class="hljs-number">200</span>,
    <span class="hljs-string">&#x27;回應時間小於 150ms&#x27;</span>: <span class="hljs-function">(<span class="hljs-params">r</span>) =&gt;</span> r.<span class="hljs-property">timings</span>.<span class="hljs-property">duration</span> &lt; <span class="hljs-number">150</span>,
  });

  <span class="hljs-title function_">sleep</span>(<span class="hljs-number">1</span>); <span class="hljs-comment">// 模擬真實使用者思考時間 (Think Time)</span>
}
</code></pre>
<h4 id="%F0%9F%92%BB-%E5%9F%B7%E8%A1%8C%E6%8C%87%E4%BB%A4"><img class="emoji" draggable="false" alt="💻" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4bb.svg" data-marp-twemoji=""/> 執行指令</h4>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-bash"><span class="hljs-comment"># 執行 k6 測試並輸出彩色報告</span>
k6 run load_test.js
</code></pre>
<blockquote>
<p><img class="emoji" draggable="false" alt="🎯" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f3af.svg" data-marp-twemoji=""/> <strong>實務指標</strong>：若延遲突破 Threshold，k6 會以非零退出碼結束，直接在 GitHub Actions 中中止部署流程！</p>

</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="20" data-paginate="true" data-header="8.6 相容性測試" data-footer="Ch08 系統測試、BDD 與非功能性驗證" data-theme="sqa-theme" lang="C" data-marpit-pagination="20" style="--paginate:true;--header:8.6 相容性測試;--footer:Ch08 系統測試、BDD 與非功能性驗證;--theme:sqa-theme;" data-marpit-pagination-total="27">
<header>8.6 相容性測試</header>

<h2 id="86-%E7%9B%B8%E5%AE%B9%E6%80%A7%E6%B8%AC%E8%A9%A6-compatibility-testing">8.6 相容性測試 (Compatibility Testing)</h2>
<div class="split55">
<div class="left">
<h4 id="%F0%9F%8C%90-%E7%A2%8E%E7%89%87%E5%8C%96%E7%92%B0%E5%A2%83%E4%B8%8B%E7%9A%84%E5%93%81%E8%B3%AA%E6%8C%91%E6%88%B0"><img class="emoji" draggable="false" alt="🌐" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f310.svg" data-marp-twemoji=""/> 碎片化環境下的品質挑戰</h4>
<p>系統在開發機上運作正常，但在終端使用者的真實裝置上卻可能殘缺不全：</p>
<ol>
<li><strong>跨作業系統 (Cross-OS)</strong>：
<ul>
<li>Windows 11, macOS (Apple Silicon / Intel), Linux (Ubuntu, RHEL), iOS, Android。</li>
</ul>
</li>
<li><strong>跨瀏覽器排版引擎 (Cross-Browser Engine)</strong>：
<ul>
<li>Blink (Chrome, Edge)</li>
<li>WebKit (Safari, iOS 所有瀏覽器底層)</li>
<li>Gecko (Firefox)</li>
</ul>
</li>
<li><strong>跨螢幕解析度與 RWD 響應式斷點</strong>：
<ul>
<li>手機直式 (390px)、平板 (768px)、桌機 (1920px)、4K 螢幕。</li>
</ul>
</li>
</ol>
</div>
<div class="right">
<h4 id="%F0%9F%A7%A9-%E8%B7%A8%E7%80%8F%E8%A6%BD%E5%99%A8%E6%B8%AC%E8%A9%A6%E7%9F%A9%E9%99%A3-testing-matrix"><img class="emoji" draggable="false" alt="🧩" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f9e9.svg" data-marp-twemoji=""/> 跨瀏覽器測試矩陣 (Testing Matrix)</h4>
<table>
<thead>
<tr>
<th style="text-align:left">作業系統</th>
<th style="text-align:left">瀏覽器引擎</th>
<th style="text-align:left">關鍵檢驗標的</th>
</tr>
</thead>
<tbody>
<tr>
<td style="text-align:left"><strong>macOS</strong></td>
<td style="text-align:left">Safari (WebKit)</td>
<td style="text-align:left">自訂色彩 CSS 濾鏡、影片解碼、TouchID 支援</td>
</tr>
<tr>
<td style="text-align:left"><strong>Windows</strong></td>
<td style="text-align:left">Chrome (Blink)</td>
<td style="text-align:left">滾動軸寬度、字型渲染平滑度、檔案路徑跳脫</td>
</tr>
<tr>
<td style="text-align:left"><strong>Android</strong></td>
<td style="text-align:left">Mobile Chrome</td>
<td style="text-align:left">虛擬鍵盤彈出時版面遮蔽、低記憶體分頁釋放</td>
</tr>
<tr>
<td style="text-align:left"><strong>iOS</strong></td>
<td style="text-align:left">Mobile Safari</td>
<td style="text-align:left">底部導覽安全區 (Safe Area Insets)、橡皮筋回彈</td>
</tr>
</tbody>
</table>
<blockquote>
<p><img class="emoji" draggable="false" alt="💡" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4a1.svg" data-marp-twemoji=""/> <strong>自動化解法</strong>：利用 Playwright 一次性定義矩陣，並發執行於三大引擎與多解析度裝置模擬中！</p>
</blockquote>
</div>
</div>
<footer>Ch08 系統測試、BDD 與非功能性驗證</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="21" data-paginate="true" data-header="8.7 安全性測試" data-footer="Ch08 系統測試、BDD 與非功能性驗證" data-theme="sqa-theme" lang="C" data-marpit-pagination="21" style="--paginate:true;--header:8.7 安全性測試;--footer:Ch08 系統測試、BDD 與非功能性驗證;--theme:sqa-theme;" data-marpit-pagination-total="27">
<header>8.7 安全性測試</header>

<h2 id="87-%E5%AE%89%E5%85%A8%E6%80%A7%E6%B8%AC%E8%A9%A6%E5%88%87%E6%8F%9B%E7%82%BA%E6%94%BB%E6%93%8A%E8%80%85%E6%80%9D%E7%B6%AD">8.7 安全性測試：切換為攻擊者思維</h2>
<div class="split73">
<div class="left">
<h4 id="%F0%9F%95%B5%EF%B8%8F-%E6%A0%B8%E5%BF%83%E6%80%9D%E7%B6%AD%E8%BD%89%E8%AE%8A%E5%BE%9E%E9%98%B2%E5%AE%88%E5%88%B0%E6%94%BB%E6%93%8A">🕵️ 核心思維轉變：從「防守」到「攻擊」</h4>
<ul>
<li><strong>功能測試思維</strong>：「輸入正確帳密，能否順利登入？」</li>
<li><strong>安全測試思維</strong>：「輸入 <code>' OR '1'='1</code> 或 10,000 個字元，系統會不會吐出資料庫密碼或直接癱瘓？」</li>
</ul>
<h4 id="%F0%9F%9B%A1%EF%B8%8F-%E5%AE%89%E5%85%A8%E9%98%B2%E8%AD%B7%E5%9B%9B%E5%A4%A7%E7%B8%B1%E6%B7%B1%E9%AB%94%E7%B3%BB"><img class="emoji" draggable="false" alt="🛡️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f6e1.svg" data-marp-twemoji=""/> 安全防護四大縱深體系</h4>
<ol>
<li><strong>SAST (靜態應用安全測試)</strong>：掃描原始碼中的已知安全漏洞（如 SQL Injection、密碼硬編碼）。</li>
<li><strong>DAST (動態應用安全測試)</strong>：從外部對運行中的 Web 發動模糊測試與攻擊（如 OWASP ZAP）。</li>
<li><strong>SCA (軟體組成分析)</strong>：掃描依賴套件中的已知 CVE 漏洞（如 Log4j 災難）。</li>
<li><strong>滲透測試 (Penetration Testing)</strong>：模擬真實黑客手動發動複合式攻擊。</li>
</ol>
</div>
<div class="right">
<p><img src="../../img/ch08/security_testing_pipeline.jpg" alt="Security Pipeline" /></p>
</div>
</div>
<footer>Ch08 系統測試、BDD 與非功能性驗證</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="22" data-paginate="true" data-header="8.7 安全性測試" data-footer="Ch08 系統測試、BDD 與非功能性驗證" data-theme="sqa-theme" lang="C" data-marpit-pagination="22" style="--paginate:true;--header:8.7 安全性測試;--footer:Ch08 系統測試、BDD 與非功能性驗證;--theme:sqa-theme;" data-marpit-pagination-total="27">
<header>8.7 安全性測試</header>

<h2 id="871-owasp-top-10-%E8%88%87%E5%B8%B8%E8%A6%8B%E6%94%BB%E6%93%8A%E6%89%8B%E5%86%8A">8.7.1 OWASP Top 10 與常見攻擊手冊</h2>
<div class="split55">
<div class="left">
<h4 id="%F0%9F%9A%A8-owasp-top-10-%E6%A0%B8%E5%BF%83%E9%A2%A8%E9%9A%AA%E7%B2%BE%E8%8F%AF"><img class="emoji" draggable="false" alt="🚨" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f6a8.svg" data-marp-twemoji=""/> OWASP Top 10 核心風險精華</h4>
<ol>
<li><strong>權限控制失效 (Broken Access Control)</strong>：
<ul>
<li>使用者透過竄改 URL 參數（如 <code>/api/orders/999</code> 換成 <code>1000</code>）偷看他人訂單。</li>
</ul>
</li>
<li><strong>密碼編譯失敗 (Cryptographic Failures)</strong>：
<ul>
<li>傳輸未使用 HTTPS，或密碼未採用 BCrypt/Argon2 加鹽雜湊。</li>
</ul>
</li>
<li><strong>注入式攻擊 (Injection)</strong>：
<ul>
<li>SQL Injection、XSS (跨站腳本攻擊)、OS Command Injection。</li>
</ul>
</li>
<li><strong>不安全設計 (Insecure Design)</strong>：
<ul>
<li>忘記設計密碼重設速率限制，遭到暴力破解。</li>
</ul>
</li>
</ol>
</div>
<div class="right">
<h4 id="%F0%9F%92%89-%E7%B6%93%E5%85%B8%E9%98%B2%E7%A6%A6%E5%8F%83%E6%95%B8%E5%8C%96%E6%9F%A5%E8%A9%A2%E9%98%B2%E6%AD%A2-sql-injection"><img class="emoji" draggable="false" alt="💉" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f489.svg" data-marp-twemoji=""/> 經典防禦：參數化查詢防止 SQL Injection</h4>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-comment">// <img class="emoji" draggable="false" alt="❌" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/274c.svg" data-marp-twemoji=""/> 致命危險寫法：字串拼接 SQL (立即被注入攻擊)</span>
<span class="hljs-type">String</span> <span class="hljs-variable">sql</span> <span class="hljs-operator">=</span> <span class="hljs-string">&quot;SELECT * FROM users WHERE user = &#x27;&quot;</span> + 
             userInput + <span class="hljs-string">&quot;&#x27; AND pass = &#x27;&quot;</span> + pass + <span class="hljs-string">&quot;&#x27;&quot;</span>;

<span class="hljs-comment">// <img class="emoji" draggable="false" alt="✅" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/2705.svg" data-marp-twemoji=""/> 安全寫法：參數化預編譯 (PreparedStatement)</span>
<span class="hljs-type">String</span> <span class="hljs-variable">sql</span> <span class="hljs-operator">=</span> <span class="hljs-string">&quot;SELECT * FROM users WHERE user = ? AND pass = ?&quot;</span>;
<span class="hljs-type">PreparedStatement</span> <span class="hljs-variable">stmt</span> <span class="hljs-operator">=</span> conn.prepareStatement(sql);
stmt.setString(<span class="hljs-number">1</span>, userInput);
stmt.setString(<span class="hljs-number">2</span>, pass);
<span class="hljs-type">ResultSet</span> <span class="hljs-variable">rs</span> <span class="hljs-operator">=</span> stmt.executeQuery();
</code></pre>
<blockquote>
<p><img class="emoji" draggable="false" alt="📌" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4cc.svg" data-marp-twemoji=""/> <strong>黃金原則</strong>：永不信任任何來自使用者的輸入，所有外部資料一律視為潛在惡意攻擊負載！</p>
</blockquote>
</div>
</div>
<footer>Ch08 系統測試、BDD 與非功能性驗證</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="23" data-paginate="true" data-header="8.8 回復性與彈性測試" data-footer="Ch08 系統測試、BDD 與非功能性驗證" data-theme="sqa-theme" lang="C" data-marpit-pagination="23" style="--paginate:true;--header:8.8 回復性與彈性測試;--footer:Ch08 系統測試、BDD 與非功能性驗證;--theme:sqa-theme;" data-marpit-pagination-total="27">
<header>8.8 回復性與彈性測試</header>

<h2 id="88-%E5%9B%9E%E5%BE%A9%E6%80%A7%E8%88%87%E5%BD%88%E6%80%A7%E6%B8%AC%E8%A9%A6-resilience--chaos">8.8 回復性與彈性測試 (Resilience &amp; Chaos)</h2>
<div class="split73">
<div class="left">
<h4 id="%F0%9F%8C%8B-%E5%81%87%E8%A8%AD%E8%90%AC%E7%89%A9%E7%9A%86%E6%9C%83%E6%AF%80%E6%BB%85-design-for-failure"><img class="emoji" draggable="false" alt="🌋" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f30b.svg" data-marp-twemoji=""/> 假設萬物皆會毀滅 (Design for Failure)</h4>
<p>在雲端分散式架構中，硬體故障、網路中斷、雲端可用區斷電是必然發生的日常。</p>
<ul>
<li><strong>回復性測試 (Recoverability Testing)</strong>：檢驗系統在災難或崩潰後，能否在規定時間內復原並保持資料一致性。</li>
</ul>
<h4 id="%E2%8F%B1%EF%B8%8F-%E5%AE%B9%E9%8C%AF%E5%9B%9B%E5%A4%A7%E9%BB%83%E9%87%91%E6%8C%87%E6%A8%99"><img class="emoji" draggable="false" alt="⏱️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/23f1.svg" data-marp-twemoji=""/> 容錯四大黃金指標</h4>
<ul>
<li><strong>RTO (Recovery Time Objective)</strong>：從發生中斷到系統完全恢復正常服務的<strong>最大容許時間</strong>。</li>
<li><strong>RPO (Recovery Point Objective)</strong>：災難發生時，系統<strong>最大容許遺失的資料時間量</strong>。</li>
<li><strong>MTBF (平均無故障時間)</strong>：系統穩定運行的平均長度。</li>
<li><strong>MTTR (平均修復時間)</strong>：故障發生到排障完成的平均耗時。</li>
</ul>
</div>
<div class="right">
<p><img src="../../img/ch08/system_resilience_timeline_metrics.jpg" alt="Resilience Timeline" /></p>
</div>
</div>
<footer>Ch08 系統測試、BDD 與非功能性驗證</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="24" data-paginate="true" data-header="8.8 回復性與彈性測試" data-footer="Ch08 系統測試、BDD 與非功能性驗證" data-theme="sqa-theme" lang="C" data-marpit-pagination="24" style="--paginate:true;--header:8.8 回復性與彈性測試;--footer:Ch08 系統測試、BDD 與非功能性驗證;--theme:sqa-theme;" data-marpit-pagination-total="27">
<header>8.8 回復性與彈性測試</header>

<h2 id="881-%E6%B7%B7%E6%B2%8C%E5%B7%A5%E7%A8%8B-chaos-engineering-%E8%88%87%E6%95%85%E9%9A%9C%E6%B3%A8%E5%85%A5">8.8.1 混沌工程 (Chaos Engineering) 與故障注入</h2>
<div class="split55">
<div class="left">
<h4 id="%F0%9F%90%92-netflix-%E6%B7%B7%E4%BA%82%E7%8C%B4%E5%AD%90-chaos-monkey-%E5%93%B2%E5%AD%B8"><img class="emoji" draggable="false" alt="🐒" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f412.svg" data-marp-twemoji=""/> Netflix 混亂猴子 (Chaos Monkey) 哲學</h4>
<blockquote>
<p>「如果系統會在凌晨三點意外崩潰，不如我們在週二上午工程師都在辦公室時，主動隨機殺掉一台伺服器！」</p>
</blockquote>
<ul>
<li><strong>混沌工程原則</strong>：
<ol>
<li>建立衡量正常系統狀態的基準線 (Steady State)。</li>
<li>提出假說：「即便 Kubernetes 叢集隨機掛掉 20% Pods，使用者結帳流程依然正常」。</li>
<li>在受控環境注入真實故障，驗證彈性自我修復機制。</li>
</ol>
</li>
</ul>
</div>
<div class="right">
<h4 id="%F0%9F%9B%A0%EF%B8%8F-%E5%B8%B8%E8%A6%8B%E6%95%85%E9%9A%9C%E6%B3%A8%E5%85%A5%E6%89%8B%E6%B3%95-fault-injection"><img class="emoji" draggable="false" alt="🛠️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f6e0.svg" data-marp-twemoji=""/> 常見故障注入手法 (Fault Injection)</h4>
<ul>
<li><strong>網路延遲注入</strong>：模擬跨可用區跨國網路延遲 2000ms（檢驗 Timeout 與 Circuit Breaker 熔斷器是否啟動）。</li>
<li><strong>磁碟空間滿載</strong>：檢驗資料庫是否會噴出未處理例外導致鎖死。</li>
<li><strong>單點殺死 (Kill Pod)</strong>：驗證服務註冊中心 (Consul/Eureka) 能否在 5 秒內將流量導離失效節點。</li>
</ul>

(function() {
  function initHeaderDropdown() {
    var slideSections = document.querySelectorAll(".marp-slide");
    if (!slideSections || slideSections.length === 0) return;

    var sections = [];
    var seenTitles = new Set();
    
    slideSections.forEach(function(sec, idx) {
      var h2 = sec.querySelector("h2");
      if (!h2) return;
      var title = h2.textContent.trim();
      title = title.replace(/^[◄◀]\s*/, "").replace(/\s*[►▶]$/, "").trim();
      if (!title || title.length > 40) return;
      if (seenTitles.has(title)) return;
      
      seenTitles.add(title);
      sections.push({
        id: String(idx + 1),
        title: title
      });
    });

    if (sections.length === 0) return;

    function createDropdownWrapper(currentTitle) {
      var wrapper = document.createElement("div");
      wrapper.className = "header-nav-wrapper";
      
      var titleSpan = document.createElement("span");
      titleSpan.className = "nav-title";
      titleSpan.textContent = currentTitle;
      
      var icon = document.createElement("span");
      icon.className = "dropdown-icon";
      icon.textContent = " ▼";
      titleSpan.appendChild(icon);
      
      var dropdown = document.createElement("div");
      dropdown.className = "nav-dropdown";
      
      var grid = document.createElement("div");
      grid.className = "dropdown-grid";
      
      sections.forEach(function(s) {
        var item = document.createElement("a");
        item.className = "dropdown-item";
        item.href = "#" + s.id;
        
        var badge = document.createElement("span");
        badge.className = "badge";
        badge.textContent = "#" + s.id.padStart(2, "0");
        
        var itemText = document.createElement("span");
        itemText.className = "item-text";
        itemText.title = s.title;
        itemText.textContent = s.title;
        
        item.appendChild(badge);
        item.appendChild(itemText);
        
        item.addEventListener("click", function(e) {
          wrapper.classList.remove("is-open");
          dropdown.style.display = "none";
          window.location.hash = "#" + s.id;
          setTimeout(function() { dropdown.style.display = ""; }, 350);
        });
        
        grid.appendChild(item);
      });
      
      dropdown.appendChild(grid);
      wrapper.appendChild(titleSpan);
      wrapper.appendChild(dropdown);
      return wrapper;
    }

    document.addEventListener("click", function(e) {
      if (!e.target.closest(".header-nav-wrapper")) {
        document.querySelectorAll(".header-nav-wrapper.is-open").forEach(function(w) {
          w.classList.remove("is-open");
        });
      }
    });

    slideSections.forEach(function(sec) {
      var header = sec.querySelector("header");
      if (!header || header.dataset.navEnhanced) return;
      header.dataset.navEnhanced = "true";
      
      var title = header.textContent.trim();
      title = title.replace(/^[◄◀]\s*/, "").replace(/\s*[►▶]$/, "").trim();
      if (!title) return;
      
      header.innerHTML = "";
      var wrapper = createDropdownWrapper(title);
      header.appendChild(wrapper);
    });
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", initHeaderDropdown);
  } else {
    initHeaderDropdown();
  }
  setTimeout(initHeaderDropdown, 400);
})();
</script>
