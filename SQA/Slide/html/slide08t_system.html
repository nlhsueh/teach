<p>「單元測試關心內部零件，整合測試關心齒輪銜接，<br />

</blockquote>

<h2 id="%E6%9C%AC%E7%AB%A0%E9%87%8D%E9%BB%9E%E5%B0%8E%E8%AE%80-key-highlights">本章重點導讀 (Key Highlights)</h2>
<div class="outline-columns">
<div>
<h3 id="%F0%9F%8E%AF-%E6%A5%AD%E5%8B%99%E6%B5%81%E7%A8%8Bbdd-%E8%88%87%E7%8F%BE%E4%BB%A3-e2e-%E9%A9%97%E8%AD%89"><img class="emoji" draggable="false" alt="🎯" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f3af.svg" data-marp-twemoji=""/> 業務流程、BDD 與現代 E2E 驗證</h3>
<ul>
<li><a href="#3"><strong>8.1 使用案例與流程測試 (Use Case Testing)</strong></a>：
<ul>
<li>端到端使用者視角、對話式事件流（圖書館預借媒體）</li>
<li>基本流 (BF) 與替代流 (AF<sub>1</sub>, AF<sub>2</sub>) 路徑組合設計與 ATM 演練</li>
</ul>
</li>
<li><a href="#7"><strong>8.2 行為驅動開發 (BDD) 與 Cucumber 測試</strong></a>：
<ul>

<li>Gherkin 語法 (<code>Given-When-Then</code>、<code>Scenario Outline</code> + <code>Examples</code>)</li>
<li>Java <code>BMICalculatorStepDefs</code> 參數自動映射實戰 (CCQ 1)</li>
</ul>
</li>
<li><a href="#12"><strong>8.3 微服務契約、Playwright 與 AI 畫面模擬</strong></a>：
<ul>
<li>微服務 API 漂移與 <strong>Pact 消費者驅動契約測試</strong></li>
<li><strong>Playwright</strong> 現代 Web E2E、<strong>Headless 無頭光柵化</strong>與 <strong>Spectron / Electron</strong></li>
<li><strong>AI 瀏覽器代理人 (Browser Subagent)</strong> 多模態雙軌感知與三代演進 (CCQ 2)</li>
</ul>
</li>
</ul>
</div>
<div>
<h3 id="%F0%9F%9B%A1%EF%B8%8F-%E5%85%A8%E6%96%B9%E4%BD%8D%E9%9D%9E%E5%8A%9F%E8%83%BD%E6%80%A7%E6%B8%AC%E8%A9%A6%E5%B7%A5%E7%A8%8B"><img class="emoji" draggable="false" alt="🛡️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f6e1.svg" data-marp-twemoji=""/> 全方位非功能性測試工程</h3>
<ul>
<li><a href="#18"><strong>8.4 可用性測試 (Usability Testing)</strong></a>：
<ul>
<li>iPhone 計算機 <code>77 - 38.5 = 0</code> 之謎與 <strong>Nielsen 十大可用性原則</strong></li>
<li>Hallway 走道測試與 <strong>A/B 測試法</strong>線上分流驗證 (CCQ 3)</li>
</ul>
</li>
<li><a href="#23"><strong>8.5 效能測試與負載工程 (Performance &amp; Load)</strong></a>：

<li><a href="#31"><strong>8.6 相容性測試 (Compatibility)</strong></a>：跨環境/瀏覽器與官方認證測試</li>

<li><a href="#37"><strong>8.8 回復性與彈性測試 (Resilience)</strong></a>：<strong>MTBF/RPO/RTO/MTTR</strong>、WAL 回滾、Resilience4j 斷路器與混沌工程四步程序 (CCQ 6)</li>
<li><a href="#41"><strong>8.9 課堂實習與六大真實系統測試選型演練</strong></a></li>
</ul>
</div>
</div>

<header>8.1 使用案例與流程測試</header>

<h1 id="81-%E4%BD%BF%E7%94%A8%E6%A1%88%E4%BE%8B%E8%88%87%E6%B5%81%E7%A8%8B%E6%B8%AC%E8%A9%A6-use-case-testing"><strong>8.1 使用案例與流程測試 (Use Case Testing)</strong></h1>
<blockquote>
<p>「系統測試不是去驗證單一的小按鈕或獨立 API，<br />
而是站在真實使用者的角度，檢驗一整段端到端的使用流程能否順暢完成。」</p>
</blockquote>
<footer>Ch08 系統測試、BDD 與非功能性驗證</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="4" data-paginate="true" data-header="8.1 使用案例與流程測試" data-footer="Ch08 系統測試、BDD 與非功能性驗證" data-theme="sqa-theme" lang="C" data-marpit-pagination="4" style="--paginate:true;--header:8.1 使用案例與流程測試;--footer:Ch08 系統測試、BDD 與非功能性驗證;--theme:sqa-theme;" data-marpit-pagination-total="44">
<header>8.1 使用案例與流程測試</header>

<h2 id="%E7%B3%BB%E7%B5%B1%E6%B8%AC%E8%A9%A6%E7%9A%84%E6%A0%B8%E5%BF%83%E5%AE%9A%E4%BD%8D%E7%AB%AF%E5%88%B0%E7%AB%AF%E4%BD%BF%E7%94%A8%E6%B5%81%E7%A8%8B-usage-flow">系統測試的核心定位：端到端使用流程 (Usage Flow)</h2>
<div class="card-deck">
<blockquote>
<p><img class="emoji" draggable="false" alt="💡" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4a1.svg" data-marp-twemoji=""/> <strong>System Testing (系統測試)</strong>：對完整整合之軟硬體系統進行的端到端全面評估，驗證系統是否符合其指定之功能與非功能需求規格。</p>
</blockquote>
<div class="two-columns">
<div class="card">
<h3 id="%F0%9F%94%8D-%E5%96%AE%E5%85%83%E6%95%B4%E5%90%88%E6%B8%AC%E8%A9%A6-vs-%E7%B3%BB%E7%B5%B1%E6%B8%AC%E8%A9%A6%E8%A6%96%E8%A7%92%E5%B7%AE%E7%95%B0"><img class="emoji" draggable="false" alt="🔍" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f50d.svg" data-marp-twemoji=""/> 單元/整合測試 vs. 系統測試視角差異</h3>
<ul>
<li><strong>單一功能測試（局部視角）</strong>：
<ul>
<li>驗證「點擊購買按鈕是否有反應」或「呼叫 <code>insertOrder()</code> 能否寫入資料表」。</li>
</ul>
</li>
<li><strong>系統流程測試（端到端使用者視角）</strong>：
<ul>
<li>關心完整的<strong>連續價值鏈 (End-to-End Journey)</strong>：</li>
<li><code>登入帳號 ➔ 搜尋商品 ➔ 加入購物車 ➔ 填寫收件資訊 ➔ 付款結帳 ➔ 收到訂單確認信</code></li>
</ul>
</li>
<li><strong>為什麼局部綠燈不等於系統可用？</strong>
<ul>
<li>單一模組各自通過測試，串聯起來仍可能發生 Session 遺失、狀態不同步或跨頁導向斷裂！</li>
</ul>
</li>
</ul>
</div>
<div class="card">
<h3 id="%F0%9F%93%9C-%E4%BB%80%E9%BA%BC%E6%98%AF%E4%BD%BF%E7%94%A8%E6%A1%88%E4%BE%8B-use-case"><img class="emoji" draggable="false" alt="📜" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4dc.svg" data-marp-twemoji=""/> 什麼是使用案例 (Use Case)？</h3>
<ul>
<li><strong>核心定義</strong>：
<ul>
<li>描述<strong>參與者 (Actor，使用者或外部系統)</strong> 為了達成特定業務目標，與<strong>系統 (System)</strong> 進行的一系列對話互動過程。</li>
</ul>
</li>
<li><strong>黑箱規格精神</strong>：
<ul>
<li>如同使用者與系統之間的「<strong>對話腳本</strong>」，專注於系統外部可見的「<strong>做什麼 (What)</strong>」，而非內部「如何實作 (How)」。</li>
</ul>
</li>
<li><strong>圖書館系統「查詢並預借媒體」對話腳本</strong>：
<table>
<thead>
<tr>
<th style="text-align:center">步驟</th>
<th style="text-align:left">使用者動作 (Actor)</th>
<th style="text-align:left">系統反應 (System)</th>
</tr>
</thead>
<tbody>
<tr>
<td style="text-align:center"><strong>1</strong></td>
<td style="text-align:left">點選「查詢並預借媒體」</td>
<td style="text-align:left">顯示查詢方式（關鍵字、列出所有媒體）</td>
</tr>
<tr>
<td style="text-align:center"><strong>2</strong></td>
<td style="text-align:left">選擇「列出所有媒體」</td>
<td style="text-align:left">列出媒體名稱、數量、租借狀況與「預借」鈕</td>
</tr>
<tr>
<td style="text-align:center"><strong>3</strong></td>
<td style="text-align:left">按下特定媒體旁「預借」鈕</td>
<td style="text-align:left">檢查借閱權限，符合則顯示「租借成功」</td>
</tr>
</tbody>
</table>
</li>
</ul>
</div>
</div>
</div>
<footer>Ch08 系統測試、BDD 與非功能性驗證</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="5" data-paginate="true" data-header="8.1 使用案例與流程測試" data-footer="Ch08 系統測試、BDD 與非功能性驗證" data-theme="sqa-theme" lang="C" data-marpit-pagination="5" style="--paginate:true;--header:8.1 使用案例與流程測試;--footer:Ch08 系統測試、BDD 與非功能性驗證;--theme:sqa-theme;" data-marpit-pagination-total="44">
<header>8.1 使用案例與流程測試</header>

<h2 id="%E5%9F%BA%E6%9C%AC%E6%B5%81%E8%88%87%E6%9B%BF%E4%BB%A3%E6%B5%81%E5%A6%82%E4%BD%95%E8%A1%8D%E7%94%9F%E5%AE%8C%E6%95%B4%E6%B5%81%E7%A8%8B%E6%B8%AC%E8%A9%A6%E6%83%85%E5%A2%83">基本流與替代流：如何衍生完整流程測試情境？</h2>
<div class="card-deck">
<blockquote>
<p><img class="emoji" draggable="false" alt="💡" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4a1.svg" data-marp-twemoji=""/> 使用者操作系統除了走最順利的成功主幹，必然會遭遇庫存不足、權限受限等分支狀況；流程測試必須系統性覆蓋所有分支組合！</p>
</blockquote>
<div class="content-columns">
<div class="content-text">
<h3 id="%F0%9F%8C%8A-%E5%85%A9%E5%A4%A7%E4%BA%8B%E4%BB%B6%E6%B5%81%E7%B5%90%E6%A7%8B%E8%88%87%E8%B7%AF%E5%BE%91%E7%B5%84%E5%90%88"><img class="emoji" draggable="false" alt="🌊" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f30a.svg" data-marp-twemoji=""/> 兩大事件流結構與路徑組合</h3>
<ul>
<li><strong>1. 基本流 (Basic Flow, BF / Happy Path)</strong>：
<ul>
<li>最順利、最常見的主幹成功路徑（如順利完成圖書預借）。</li>
</ul>
</li>
<li><strong>2. 替代流 (Alternative Flows, AF<sub>1</sub>, AF<sub>2</sub> / Exception Paths)</strong>：
<ul>
<li>分支或異常處理路徑：
<ul>
<li><strong>AF<sub>1</sub>（書已被借走）</strong>：顯示「目前無庫存，已加入預約排隊清單」。</li>
<li><strong>AF<sub>2</sub>（權限不足 / 重複預借）</strong>：顯示「借書數已達上限或重複預借，無法預借」。</li>
</ul>
</li>
</ul>
</li>
<li><strong>3. 由流程圖衍生四大測試情境 (Scenarios)</strong>：
<ul>
<li><strong>情境一 (Happy Path)</strong>：執行 <code>BF</code>（驗證基本預借成功）。</li>
<li><strong>情境二 (分支驗證 1)</strong>：執行 <code>BF ➔ AF1</code>（驗證書籍已外借之預約排隊處理）。</li>
<li><strong>情境三 (分支驗證 2)</strong>：執行 <code>BF ➔ AF2</code>（驗證重複預借或超額之防呆阻擋）。</li>
<li><strong>情境四 (複合分支驗證)</strong>：執行 <code>BF ➔ AF1 ➔ AF2</code>（驗證多重分支交互路徑）。</li>
</ul>
</li>
</ul>
</div>
<div class="content-figure">
<p><img src="../../img/ch08/B1y5_kSV6.png" alt="Use Case Flows" /></p>
</div>
</div>
</div>
<footer>Ch08 系統測試、BDD 與非功能性驗證</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="6" data-paginate="true" data-header="8.1 使用案例與流程測試" data-footer="Ch08 系統測試、BDD 與非功能性驗證" data-theme="sqa-theme" lang="C" data-marpit-pagination="6" style="--paginate:true;--header:8.1 使用案例與流程測試;--footer:Ch08 系統測試、BDD 與非功能性驗證;--theme:sqa-theme;" data-marpit-pagination-total="44">
<header>8.1 使用案例與流程測試</header>

<h2 id="81-%E8%AA%B2%E5%A0%82%E6%80%9D%E8%BE%A8%E8%88%87%E5%AF%A6%E6%88%B0%E6%BC%94%E7%B7%B4%E4%BD%BF%E7%94%A8%E6%A1%88%E4%BE%8B%E8%A7%80%E5%BF%B5%E8%BE%A8%E6%9E%90%E8%88%87-atm-%E6%8F%90%E6%AC%BE">8.1 課堂思辨與實戰演練：使用案例觀念辨析與 ATM 提款</h2>
<div class="card-deck">
<blockquote>
<p><img class="emoji" draggable="false" alt="💡" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4a1.svg" data-marp-twemoji=""/> 檢驗你對「使用案例測試」的時機、本質與對話式腳本設計是否真正融會貫通！</p>
</blockquote>
<div class="two-columns">
<div class="card">
<h3 id="%F0%9F%A7%AD-%E4%BD%BF%E7%94%A8%E6%A1%88%E4%BE%8B%E6%B8%AC%E8%A9%A6%E4%BA%94%E5%A4%A7%E8%BF%B7%E6%80%9D%E5%BF%AB%E7%AF%A9%E6%98%AF%E9%9D%9E%E8%BE%A8%E6%9E%90"><img class="emoji" draggable="false" alt="🧭" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f9ed.svg" data-marp-twemoji=""/> 使用案例測試五大迷思快篩（是非辨析）</h3>
<ul>
<li><img class="emoji" draggable="false" alt="❌" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/274c.svg" data-marp-twemoji=""/> <strong>迷思 1：「使用案例通常在整合測試結束、系統測試開始時才撰寫」</strong>
<ul>
<li><strong>正解</strong>：錯！使用案例在<strong>需求分析階段</strong>就應建立，作為後續開發與系統測試的共同依據。</li>
</ul>
</li>
<li><img class="emoji" draggable="false" alt="✅" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/2705.svg" data-marp-twemoji=""/> <strong>觀念 2：「使用案例強調使用者操作的情境與先後順序」</strong>
<ul>
<li><strong>正解</strong>：對！聚焦端到端事件流時序。</li>
</ul>
</li>
<li><img class="emoji" draggable="false" alt="❌" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/274c.svg" data-marp-twemoji=""/> <strong>迷思 3：「對話式使用案例是指必須有兩人以上參與設計才完整」</strong>
<ul>
<li><strong>正解</strong>：錯！「對話式」是指 <strong>Actor（使用者動作）與 System（系統回應）一問一答</strong>的互動格式。</li>
</ul>
</li>
<li><img class="emoji" draggable="false" alt="❌" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/274c.svg" data-marp-twemoji=""/> <strong>迷思 4：「替代流與基本流兩者二選一來做測試即可」</strong>
<ul>
<li><strong>正解</strong>：錯！基本流與所有替代流都必須納入測試套件完整覆蓋。</li>
</ul>
</li>
<li><img class="emoji" draggable="false" alt="✅" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/2705.svg" data-marp-twemoji=""/> <strong>觀念 5：「使用案例測試是一種系統層級測試」</strong> —— 對！</li>
</ul>
</div>
<div class="card">
<h3 id="%F0%9F%8F%A7-%E5%AF%A6%E6%88%B0%E6%BC%94%E7%B7%B4atm-%E6%8F%90%E6%AC%BE%E5%B0%8D%E8%A9%B1%E5%BC%8F%E4%BD%BF%E7%94%A8%E6%A1%88%E4%BE%8B%E8%88%87%E6%9B%BF%E4%BB%A3%E6%B5%81"><img class="emoji" draggable="false" alt="🏧" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f3e7.svg" data-marp-twemoji=""/> 實戰演練：ATM 提款對話式使用案例與替代流</h3>
<table>

</li>

<header>8.2 行為驅動開發與 Cucumber 測試</header>

<h1 id="82-%E8%A1%8C%E7%82%BA%E9%A9%85%E5%8B%95%E9%96%8B%E7%99%BC-bdd-%E8%88%87-cucumber-%E6%B8%AC%E8%A9%A6"><strong>8.2 行為驅動開發 (BDD) 與 Cucumber 測試</strong></h1>
<blockquote>
<p>「用業務人員、開發人員與測試人員都能讀懂的自然語言撰寫規格；<br />
讓需求文件本身就能直接按下執行鍵，成為永不過期的活文件 (Living Documentation)。」</p>
</blockquote>

</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="8" data-paginate="true" data-header="8.2 行為驅動開發與 Cucumber 測試" data-footer="Ch08 系統測試、BDD 與非功能性驗證" data-theme="sqa-theme" lang="C" data-marpit-pagination="8" style="--paginate:true;--header:8.2 行為驅動開發與 Cucumber 測試;--footer:Ch08 系統測試、BDD 與非功能性驗證;--theme:sqa-theme;" data-marpit-pagination-total="44">
<header>8.2 行為驅動開發與 Cucumber 測試</header>

<h2 id="%E8%A1%8C%E7%82%BA%E9%A9%85%E5%8B%95%E9%96%8B%E7%99%BC-bdd-%E8%88%87-cucumber-%E6%A0%B8%E5%BF%83%E6%9E%B6%E6%A7%8B">行為驅動開發 (BDD) 與 Cucumber 核心架構</h2>
<div class="card-deck">
<blockquote>
<p><img class="emoji" draggable="false" alt="💡" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4a1.svg" data-marp-twemoji=""/> <a href="https://cucumber.io/">Cucumber</a> 是支援行為驅動開發 (Behavior-Driven Development, BDD) 的主流工具，將自然語言需求規格直接轉化為自動化驗收測試。</p>
</blockquote>
<div class="content-columns">
<div class="content-text">
<h3 id="%F0%9F%A5%92-%E5%9B%9B%E5%A4%A7%E6%A0%B8%E5%BF%83%E6%A6%82%E5%BF%B5%E8%88%87%E4%BA%94%E5%A4%A7%E5%B7%A5%E7%A8%8B%E6%95%88%E7%9B%8A"><img class="emoji" draggable="false" alt="🥒" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f952.svg" data-marp-twemoji=""/> 四大核心概念與五大工程效益</h3>
<ul>
<li><strong>四大核心構成</strong>：
<ol>
<li><strong>BDD 通用語言 (Gherkin)</strong>：以結構化自然語言（支援中文/英文等數十種語言）描述系統預期行為。</li>
<li><strong>特性文件 (<code>Feature Files</code>, <code>.feature</code>)</strong>：儲存業務場景與測試步驟，作為團隊單一事實來源。</li>
<li><strong>步驟定義 (<code>Step Definitions</code>)</strong>：將 Gherkin 每一行文字自動映射至底層實作程式碼（Java、Python、JS、Ruby）。</li>
<li><strong>跨框架整合</strong>：可無縫結合 JUnit 5、Playwright、Selenium、Appium 或 REST Assured 驅動各層受測系統。</li>
</ol>
</li>
<li><strong>五大核心效益</strong>：
<ul>
<li><strong>促進三方溝通協作 (PO / Dev / QA)</strong>、<strong>高可讀性與易維護性</strong>、<strong>端到端自動化執行</strong>、<strong>視覺化即時測試報告反饋</strong>、<strong>高度可擴展性（活文件 Living Documentation）</strong>。</li>
</ul>
</li>
</ul>
</div>
<div class="content-figure">
<p><img src="../../img/ch08/HJkRVZhH6.png" alt="Cucumber BDD" /></p>
</div>
</div>
</div>
<footer>Ch08 系統測試、BDD 與非功能性驗證</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="9" data-paginate="true" data-header="8.2 行為驅動開發與 Cucumber 測試" data-footer="Ch08 系統測試、BDD 與非功能性驗證" data-theme="sqa-theme" lang="C" data-marpit-pagination="9" style="--paginate:true;--header:8.2 行為驅動開發與 Cucumber 測試;--footer:Ch08 系統測試、BDD 與非功能性驗證;--theme:sqa-theme;" data-marpit-pagination-total="44">
<header>8.2 行為驅動開發與 Cucumber 測試</header>

<h2 id="gherkin-%E8%AA%9E%E6%B3%95%E5%AF%A6%E6%88%B0-1%E5%9F%BA%E7%A4%8E-scenario-%E8%88%87%E5%8F%83%E6%95%B8%E5%8C%96-scenario-outline">Gherkin 語法實戰 (1)：基礎 Scenario 與參數化 Scenario Outline</h2>
<div class="card-deck">
<blockquote>
<p><img class="emoji" draggable="false" alt="💡" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4a1.svg" data-marp-twemoji=""/> Gherkin 透過 <strong><code>Given-When-Then</code></strong> 對應單元測試的 <strong><code>Arrange-Act-Assert (3A)</code></strong>，並以 <strong><code>Scenario Outline + Examples</code></strong> 優雅解決多組測資重複問題！</p>
</blockquote>
<div class="two-columns">
<div class="card">
<h3 id="1%EF%B8%8F%E2%83%A3-%E5%9F%BA%E7%A4%8E%E6%83%85%E5%A2%83-scenario%E8%BC%B8%E5%85%A5%E8%88%87%E9%A0%90%E6%9C%9F%E8%BC%B8%E5%87%BA"><img class="emoji" draggable="false" alt="1️⃣" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/31-20e3.svg" data-marp-twemoji=""/> 基礎情境 (<code>Scenario</code>)：輸入與預期輸出</h3>
<ul>
<li><strong><code>Given</code> (前提條件 / 初始輸入狀態)</strong>：設定測試前置資料。</li>
<li><strong><code>When</code> (觸發事件 / 輸入操作)</strong>：描述使用者或系統關鍵動作。</li>
<li><strong><code>Then</code> (預期結果 / 輸出驗證)</strong>：定義預期輸出與斷言。</li>
<li><em>(補充：<code>Background</code> 則用於抽取同一 Feature 下所有 Scenario 共用的前置步驟，如「Given 使用者已登入系統」)</em>。</li>
</ul>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-gherkin"><span class="hljs-keyword">Feature</span><span class="hljs-punctuation">:</span> 購物車結帳功能

  <span class="hljs-keyword">Scenario</span><span class="hljs-punctuation">:</span> 計算購物車商品總價
    <span class="hljs-keyword">Given</span> 使用者的購物車中有一件 100 元的商品與一件 200 元的商品
    <span class="hljs-keyword">When</span> 使用者點擊「前往結帳」
    <span class="hljs-keyword">Then</span> 系統應顯示商品總價為 300 元
</code></pre>
</div>
<div class="card">
<h3 id="2%EF%B8%8F%E2%83%A3-%E5%8F%83%E6%95%B8%E5%8C%96%E6%83%85%E5%A2%83%E5%A4%A7%E7%B6%B1-scenario-outline--examples"><img class="emoji" draggable="false" alt="2️⃣" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/32-20e3.svg" data-marp-twemoji=""/> 參數化情境大綱 (<code>Scenario Outline &amp; Examples</code>)</h3>
<ul>
<li>當需以<strong>同一套步驟測試多組輸入與預期輸出</strong>時，使用 <code>&lt;變數&gt;</code> 佔位符搭配 <code>Examples:</code> 資料表（每列自動執行一次）：</li>
</ul>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-gherkin"><span class="hljs-keyword">Feature</span><span class="hljs-punctuation">:</span> BMI 計算器
  <span class="hljs-keyword">Scenario Outline</span><span class="hljs-punctuation">:</span> 計算不同身高體重的 BMI 值與評級
    <span class="hljs-keyword">Given</span> 使用者的身高為 <span class="hljs-variable">&lt;height&gt;</span> 公分，體重為 <span class="hljs-variable">&lt;weight&gt;</span> 公斤
    <span class="hljs-keyword">When</span> 系統進行 BMI 計算
    <span class="hljs-keyword">Then</span> 系統計算出的 BMI 值應為 <span class="hljs-variable">&lt;expected_bmi&gt;</span>
    <span class="hljs-keyword">And</span> 系統顯示的體重評級應為 <span class="hljs-string">&quot;&lt;expected_category&gt;&quot;</span>

    <span class="hljs-keyword">Examples</span><span class="hljs-punctuation">:</span>
      |<span class="hljs-string"> height </span>|<span class="hljs-string"> weight </span>|<span class="hljs-string"> expected_bmi </span>|<span class="hljs-string"> expected_category </span>|
      |<span class="hljs-string"> 170    </span>|<span class="hljs-string"> 60     </span>|<span class="hljs-string"> 20.8         </span>|<span class="hljs-string"> 正常體重          </span>|
      |<span class="hljs-string"> 160    </span>|<span class="hljs-string"> 80     </span>|<span class="hljs-string"> 31.3         </span>|<span class="hljs-string"> 肥胖              </span>|
      |<span class="hljs-string"> 180    </span>|<span class="hljs-string"> 50     </span>|<span class="hljs-string"> 15.4         </span>|<span class="hljs-string"> 體重過輕          </span>|
</code></pre>
</div>
</div>
</div>
<footer>Ch08 系統測試、BDD 與非功能性驗證</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="10" data-paginate="true" data-header="8.2 行為驅動開發與 Cucumber 測試" data-footer="Ch08 系統測試、BDD 與非功能性驗證" data-theme="sqa-theme" lang="C" data-marpit-pagination="10" style="--paginate:true;--header:8.2 行為驅動開發與 Cucumber 測試;--footer:Ch08 系統測試、BDD 與非功能性驗證;--theme:sqa-theme;" data-marpit-pagination-total="44">
<header>8.2 行為驅動開發與 Cucumber 測試</header>

<h2 id="gherkin-%E8%AA%9E%E6%B3%95%E5%AF%A6%E6%88%B0-2java-step-definitions-%E5%8F%83%E6%95%B8%E8%87%AA%E5%8B%95%E6%98%A0%E5%B0%84">Gherkin 語法實戰 (2)：Java Step Definitions 參數自動映射</h2>
<div class="card-deck">
<blockquote>
<p><img class="emoji" draggable="false" alt="💡" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4a1.svg" data-marp-twemoji=""/> 透過 Cucumber Expressions（如 <code>{double}</code>, <code>{int}</code>, <code>{string}</code>），Cucumber-JVM 能自動擷取 Gherkin 句子中的數值與字串，注入 Java 方法參數並執行 JUnit 斷言！</p>
</blockquote>
<div class="two-columns">
<div class="card">
<h3 id="%F0%9F%A7%A9-%E6%AD%A5%E9%A9%9F%E4%B8%80given-%E8%88%87-when-%E7%8B%80%E6%85%8B%E6%8E%A5%E6%94%B6%E8%88%87%E5%9F%B7%E8%A1%8C"><img class="emoji" draggable="false" alt="🧩" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f9e9.svg" data-marp-twemoji=""/> 步驟一：<code>@Given</code> 與 <code>@When</code> 狀態接收與執行</h3>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-keyword">package</span> bmi.cucumber;
<span class="hljs-keyword">import</span> io.cucumber.java.en.*;
<span class="hljs-keyword">import</span> <span class="hljs-keyword">static</span> org.junit.jupiter.api.Assertions.assertEquals;

<span class="hljs-keyword">public</span> <span class="hljs-keyword">class</span> <span class="hljs-title class_">BMICalculatorStepDefs</span> {
    <span class="hljs-keyword">private</span> <span class="hljs-type">double</span> height, weight;
    <span class="hljs-keyword">private</span> <span class="hljs-type">double</span> calculatedBmi;
    <span class="hljs-keyword">private</span> String calculatedCategory;

    <span class="hljs-meta">@Given(&quot;使用者的身高為 {double} 公分，體重為 {double} 公斤&quot;)</span>
    <span class="hljs-keyword">public</span> <span class="hljs-type">void</span> <span class="hljs-title function_">setHeightAndWeight</span><span class="hljs-params">(<span class="hljs-type">double</span> height, <span class="hljs-type">double</span> weight)</span> {
        <span class="hljs-built_in">this</span>.height = height; <span class="hljs-comment">// 自動綁定 &lt;height&gt;</span>
        <span class="hljs-built_in">this</span>.weight = weight; <span class="hljs-comment">// 自動綁定 &lt;weight&gt;</span>
    }

    <span class="hljs-meta">@When(&quot;系統進行 BMI 計算&quot;)</span>
    <span class="hljs-keyword">public</span> <span class="hljs-type">void</span> <span class="hljs-title function_">calculateBMI</span><span class="hljs-params">()</span> {
        <span class="hljs-type">double</span> <span class="hljs-variable">hMeters</span> <span class="hljs-operator">=</span> <span class="hljs-built_in">this</span>.height / <span class="hljs-number">100.0</span>;
        <span class="hljs-built_in">this</span>.calculatedBmi = Math.round(
            (<span class="hljs-built_in">this</span>.weight / (hMeters * hMeters)) * <span class="hljs-number">10.0</span>) / <span class="hljs-number">10.0</span>;
        <span class="hljs-keyword">if</span> (<span class="hljs-built_in">this</span>.calculatedBmi &lt; <span class="hljs-number">18.5</span>)
            <span class="hljs-built_in">this</span>.calculatedCategory = <span class="hljs-string">&quot;體重過輕&quot;</span>;
        <span class="hljs-keyword">else</span> <span class="hljs-keyword">if</span> (<span class="hljs-built_in">this</span>.calculatedBmi &lt; <span class="hljs-number">24.0</span>)
            <span class="hljs-built_in">this</span>.calculatedCategory = <span class="hljs-string">&quot;正常體重&quot;</span>;
        <span class="hljs-keyword">else</span>
            <span class="hljs-built_in">this</span>.calculatedCategory = <span class="hljs-string">&quot;肥胖&quot;</span>;
    }
</code></pre>
</div>
<div class="card">
<h3 id="%E2%9C%85-%E6%AD%A5%E9%A9%9F%E4%BA%8Cthen-%E9%A0%90%E6%9C%9F%E8%BC%B8%E5%87%BA%E6%96%B7%E8%A8%80%E8%88%87-labdemo-%E5%B0%8D%E7%85%A7"><img class="emoji" draggable="false" alt="✅" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/2705.svg" data-marp-twemoji=""/> 步驟二：<code>@Then</code> 預期輸出斷言與 LabDemo 對照</h3>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java">    <span class="hljs-meta">@Then(&quot;系統計算出的 BMI 值應為 {double}&quot;)</span>
    <span class="hljs-keyword">public</span> <span class="hljs-type">void</span> <span class="hljs-title function_">verifyBMI</span><span class="hljs-params">(<span class="hljs-type">double</span> expectedBmi)</span> {
        <span class="hljs-comment">// 驗證實際輸出是否等於 Examples 表中的 &lt;expected_bmi&gt;</span>
        assertEquals(expectedBmi, <span class="hljs-built_in">this</span>.calculatedBmi, <span class="hljs-number">0.05</span>,
            <span class="hljs-string">&quot;BMI 計算結果不符合預期！&quot;</span>);
    }

    <span class="hljs-meta">@Then(&quot;系統顯示的體重評級應為 {string}&quot;)</span>
    <span class="hljs-keyword">public</span> <span class="hljs-type">void</span> <span class="hljs-title function_">verifyCategory</span><span class="hljs-params">(String expectedCategory)</span> {
        <span class="hljs-comment">// 驗證評級字串是否等於 &quot;&lt;expected_category&gt;&quot;</span>
        assertEquals(expectedCategory, <span class="hljs-built_in">this</span>.calculatedCategory,
            <span class="hljs-string">&quot;體重評級不符合預期！&quot;</span>);
    }
}
</code></pre>
<ul>
<li><strong><img class="emoji" draggable="false" alt="🧪" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f9ea.svg" data-marp-twemoji=""/> 課堂實習對應 (<a href="../../lab.html?file=LabDemo/docs/u09_cucumber_bdd/bmi_cucumber.md"><code>bmi_cucumber.md</code></a>)</strong>：
<ul>
<li><strong>BMI 範例</strong>：<a href="../../lab.html?file=LabDemo/src/test/java/u08_cucumber/bmi/BMICalculatorStepDefs.java"><code>BMICalculatorStepDefs.java</code></a> 與 <a href="../../lab.html?file=LabDemo/src/test/java/u08_cucumber/bmi/RunCucumberTest.java"><code>RunCucumberTest.java</code></a></li>

<header>8.3 微服務契約、Playwright 與 AI 畫面模擬</header>

<h1 id="83-%E5%BE%AE%E6%9C%8D%E5%8B%99%E5%A5%91%E7%B4%84%E6%B8%AC%E8%A9%A6%E7%8F%BE%E4%BB%A3-e2e-%E8%88%87-ai-%E7%95%AB%E9%9D%A2%E6%A8%A1%E6%93%AC"><strong>8.3 微服務契約測試、現代 E2E 與 AI 畫面模擬</strong></h1>
<blockquote>
<p>「從微服務間的 Pact 合約防線、Playwright 零閃爍自動化，<br />
到結合多模態視覺 (VLM) 與無頭光柵化的 AI 瀏覽器代理人 (Browser Subagent)！」</p>
</blockquote>
<footer>Ch08 系統測試、BDD 與非功能性驗證</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="13" data-paginate="true" data-header="8.3 微服務契約、Playwright 與 AI 畫面模擬" data-footer="Ch08 系統測試、BDD 與非功能性驗證" data-theme="sqa-theme" lang="C" data-marpit-pagination="13" style="--paginate:true;--header:8.3 微服務契約、Playwright 與 AI 畫面模擬;--footer:Ch08 系統測試、BDD 與非功能性驗證;--theme:sqa-theme;" data-marpit-pagination-total="44">
<header>8.3 微服務契約、Playwright 與 AI 畫面模擬</header>

<h2 id="%E5%BE%AE%E6%9C%8D%E5%8B%99-api-%E6%95%B4%E5%90%88%E6%8C%91%E6%88%B0%E8%88%87-pact-%E6%B6%88%E8%B2%BB%E8%80%85%E9%A9%85%E5%8B%95%E5%A5%91%E7%B4%84%E6%B8%AC%E8%A9%A6">微服務 API 整合挑戰與 Pact 消費者驅動契約測試</h2>
<div class="card-deck">
<blockquote>
<p><img class="emoji" draggable="false" alt="💡" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4a1.svg" data-marp-twemoji=""/> 在微服務或前後端分離架構中，Provider 若擅自修改 <code>/api/user/{id}</code> 欄位名稱（如 <code>user_id</code> 改為 <code>userId</code>），Consumer 呼叫時將瞬間崩潰！</p>
</blockquote>
<div class="two-columns">
<div class="card">
<h3 id="%F0%9F%A4%9D-%E6%B6%88%E8%B2%BB%E8%80%85%E9%A9%85%E5%8B%95%E5%A5%91%E7%B4%84%E6%B8%AC%E8%A9%A6-consumer-driven-contract-pact"><img class="emoji" draggable="false" alt="🤝" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f91d.svg" data-marp-twemoji=""/> 消費者驅動契約測試 (Consumer-Driven Contract, Pact)</h3>
<ul>
<li><strong>為什麼傳統整合測試不夠？</strong>
<ul>
<li>同時啟動數十個真實微服務進行對接極度緩慢、環境脆弱且難以定位破壞點。</li>
</ul>
</li>
<li><strong>Pact 三步解耦驗證工作流</strong>：
<ol>
<li><strong>Consumer 撰寫測試產生契約</strong>：前端/呼叫端定義對 API 請求與回應 JSON 結構的期望，自動產出 <strong><code>pact.json</code> 契約文件</strong>。</li>
<li><strong>發布至 Pact Broker</strong>：將契約上傳至共用契約中心。</li>
<li><strong>Provider 下載契約本地回放驗證</strong>：後端在 CI 流程中從 Broker 拉取契約，對自身控制層發送請求，驗證輸出格式 100% 符合 Consumer 期待！</li>
</ol>
</li>
<li><strong>核心效益</strong>：<strong>無須啟動雙方真實連線</strong>，在 CI 階段秒級攔截破壞性變更 (Breaking Changes)！</li>
</ul>
</div>
<div class="card">
<h3 id="%F0%9F%92%BB-pact-consumer-%E5%A5%91%E7%B4%84%E5%AE%9A%E7%BE%A9%E5%AF%A6%E6%88%B0-lab-11"><img class="emoji" draggable="false" alt="💻" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4bb.svg" data-marp-twemoji=""/> Pact Consumer 契約定義實戰 (<code>Lab 11</code>)</h3>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-meta">@ExtendWith(PactConsumerTestExt.class)</span>
<span class="hljs-meta">@PactTestFor(providerName = &quot;UserService&quot;)</span>
<span class="hljs-keyword">public</span> <span class="hljs-keyword">class</span> <span class="hljs-title class_">UserConsumerContractTest</span> {

    <span class="hljs-meta">@Pact(consumer = &quot;FrontendApp&quot;)</span>
    <span class="hljs-keyword">public</span> <span class="hljs-type">V4Pact</span> <span class="hljs-title function_">createContract</span><span class="hljs-params">(PactDslWithProvider builder)</span> {
        <span class="hljs-keyword">return</span> builder
            .given(<span class="hljs-string">&quot;使用者 ID 123 存在&quot;</span>)
            .uponReceiving(<span class="hljs-string">&quot;查詢使用者 123 的請求&quot;</span>)
                .path(<span class="hljs-string">&quot;/api/v1/users/123&quot;</span>).method(<span class="hljs-string">&quot;GET&quot;</span>)
            .willRespondWith()
                .status(<span class="hljs-number">200</span>)
                .body(<span class="hljs-keyword">new</span> <span class="hljs-title class_">PactDslJsonBody</span>()
                    .integerType(<span class="hljs-string">&quot;id&quot;</span>, <span class="hljs-number">123</span>)
                    .stringType(<span class="hljs-string">&quot;username&quot;</span>, <span class="hljs-string">&quot;alice&quot;</span>)
                    .stringMatcher(<span class="hljs-string">&quot;email&quot;</span>, <span class="hljs-string">&quot;.*@.*&quot;</span>, <span class="hljs-string">&quot;a@b.com&quot;</span>))
            .toPact(); <span class="hljs-comment">// 自動生成 pact.json 契約檔！</span>
    }
}
</code></pre>
</div>
</div>
</div>
<footer>Ch08 系統測試、BDD 與非功能性驗證</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="14" data-paginate="true" data-header="8.3 微服務契約、Playwright 與 AI 畫面模擬" data-footer="Ch08 系統測試、BDD 與非功能性驗證" data-theme="sqa-theme" lang="C" data-marpit-pagination="14" style="--paginate:true;--header:8.3 微服務契約、Playwright 與 AI 畫面模擬;--footer:Ch08 系統測試、BDD 與非功能性驗證;--theme:sqa-theme;" data-marpit-pagination-total="44">
<header>8.3 微服務契約、Playwright 與 AI 畫面模擬</header>

<h2 id="%E7%8F%BE%E4%BB%A3-web-e2e-%E6%B8%AC%E8%A9%A6%E5%88%A9%E5%99%A8%E7%82%BA%E4%BB%80%E9%BA%BC%E5%BE%9E-selenium-%E8%BD%89%E5%90%91-playwright">現代 Web E2E 測試利器：為什麼從 Selenium 轉向 Playwright？</h2>
<div class="card-deck">
<blockquote>
<p><img class="emoji" draggable="false" alt="💡" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4a1.svg" data-marp-twemoji=""/> 當需要驗證「從前端 UI 一路到底層資料庫」的完整業務旅程時，現代專案普遍以 <strong>Playwright</strong> 取代傳統緩慢且易閃爍 (Flaky) 的 Selenium。</p>
</blockquote>
<div class="two-columns">
<div class="card">
<h3 id="%E2%9A%A1-playwright-%E4%B8%89%E5%A4%A7%E5%B7%A5%E7%A8%8B%E7%AA%81%E7%A0%B4"><img class="emoji" draggable="false" alt="⚡" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/26a1.svg" data-marp-twemoji=""/> Playwright 三大工程突破</h3>
<ul>
<li><strong>傳統 Selenium 的三大痛點</strong>：
<ul>
<li>透過 WebDriver HTTP 中轉啟動慢、非同步等待困難（充斥 <code>Thread.sleep()</code>）、測試極易隨機失敗 (Flaky Tests)。</li>
</ul>
</li>
<li><strong>Playwright 的三大核心優勢</strong>：
<ol>
<li><strong>原生智慧自動等待 (Auto-waiting)</strong>：
<ul>
<li>點擊或填入前，自動等待元素可見、啟用且停止動畫，大幅消除網路延遲造成的假警報。</li>
</ul>
</li>
<li><strong>抗網路波動與 HTTP 攔截 Mocking</strong>：
<ul>
<li>支援在 E2E 測試中攔截並 Mock 部分緩慢或不穩定的外部第三方 API。</li>
</ul>
</li>
<li><strong>強大工具鏈 (<code>Trace Viewer</code>)</strong>：
<ul>
<li>自動保存測試錄影、截圖與 DOM 時序快照；CI 失敗時可逐幀 (Frame-by-Frame) 回放查看 DOM 與網路請求！</li>
</ul>
</li>
</ol>
</li>
</ul>
</div>
<div class="card">
<h3 id="%F0%9F%92%BB-playwright-java-e2e-%E6%B8%AC%E8%A9%A6%E5%AF%A6%E6%88%B0"><img class="emoji" draggable="false" alt="💻" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4bb.svg" data-marp-twemoji=""/> Playwright (Java) E2E 測試實戰</h3>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-keyword">package</span> lab.sqa.e2e;
<span class="hljs-keyword">import</span> com.microsoft.playwright.*;
<span class="hljs-keyword">import</span> org.junit.jupiter.api.*;
<span class="hljs-keyword">import</span> <span class="hljs-keyword">static</span> org.junit.jupiter.api.Assertions.*;

<span class="hljs-keyword">public</span> <span class="hljs-keyword">class</span> <span class="hljs-title class_">WebLoginE2ETest</span> {
    <span class="hljs-keyword">static</span> Playwright playwright;
    <span class="hljs-keyword">static</span> Browser browser;

    <span class="hljs-meta">@BeforeAll</span>
    <span class="hljs-keyword">static</span> <span class="hljs-type">void</span> <span class="hljs-title function_">setUp</span><span class="hljs-params">()</span> {
        playwright = Playwright.create();
        browser = playwright.chromium().launch(
            <span class="hljs-keyword">new</span> <span class="hljs-title class_">BrowserType</span>.LaunchOptions().setHeadless(<span class="hljs-literal">true</span>));
    }

    <span class="hljs-meta">@Test</span>
    <span class="hljs-type">void</span> <span class="hljs-title function_">testUserLogin</span><span class="hljs-params">()</span> {
        <span class="hljs-type">Page</span> <span class="hljs-variable">page</span> <span class="hljs-operator">=</span> browser.newContext().newPage();
        page.navigate(<span class="hljs-string">&quot;http://localhost:8080/login&quot;</span>);
        page.fill(<span class="hljs-string">&quot;#username&quot;</span>, <span class="hljs-string">&quot;alice&quot;</span>);      <span class="hljs-comment">// 自動等待輸入框就緒</span>
        page.fill(<span class="hljs-string">&quot;#password&quot;</span>, <span class="hljs-string">&quot;password123&quot;</span>);
        page.click(<span class="hljs-string">&quot;#login-button&quot;</span>);          <span class="hljs-comment">// 自動等待按鈕可點擊</span>
        assertEquals(<span class="hljs-string">&quot;歡迎回來，alice&quot;</span>,
                     page.textContent(<span class="hljs-string">&quot;#welcome-banner&quot;</span>));
    }
}
</code></pre>
</div>
</div>
</div>
<footer>Ch08 系統測試、BDD 與非功能性驗證</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="15" data-paginate="true" data-header="8.3 微服務契約、Playwright 與 AI 畫面模擬" data-footer="Ch08 系統測試、BDD 與非功能性驗證" data-theme="sqa-theme" lang="C" data-marpit-pagination="15" style="--paginate:true;--header:8.3 微服務契約、Playwright 與 AI 畫面模擬;--footer:Ch08 系統測試、BDD 與非功能性驗證;--theme:sqa-theme;" data-marpit-pagination-total="44">
<header>8.3 微服務契約、Playwright 與 AI 畫面模擬</header>

<h2 id="%E7%84%A1%E9%A0%AD%E7%80%8F%E8%A6%BD%E5%99%A8-headless-%E8%88%87%E6%A1%8C%E9%9D%A2%E7%AB%AF%E8%B7%A8%E8%A1%8C%E7%A8%8B%E8%87%AA%E5%8B%95%E5%8C%96-spectron--electron">無頭瀏覽器 (Headless) 與桌面端跨行程自動化 (Spectron / Electron)</h2>
<div class="card-deck">
<blockquote>
<p><img class="emoji" draggable="false" alt="💡" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4a1.svg" data-marp-twemoji=""/> 無頭瀏覽器絕非「不載入 CSS 的簡易文字爬蟲」，而是將完整像素光柵化於記憶體緩衝區的真實瀏覽器核心！</p>
</blockquote>
<div class="two-columns">
<div class="card">
<h3 id="%F0%9F%96%A5%EF%B8%8F-1-%E7%84%A1%E9%A0%AD%E7%B6%B2%E9%A0%81%E6%8A%80%E8%A1%93-headless-web-automation"><img class="emoji" draggable="false" alt="🖥️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f5a5.svg" data-marp-twemoji=""/> 1. 無頭網頁技術 (Headless Web Automation)</h3>
<ul>
<li><strong>技術本質</strong>：
<ul>
<li>如 Headless Chromium / WebKit，是在<strong>沒有作業系統圖形視窗介面 (No GUI Display)</strong> 下運行的<strong>完整真實瀏覽器核心</strong>。</li>
</ul>
</li>
<li><strong>三大底層運作機制</strong>：
<ol>
<li><strong>完整引擎運算</strong>：Blink 排版引擎與 V8 JS 引擎照常執行完整 DOM 解析、CSS 樣式計算、Layout 版面配置與 Repaint 重繪。</li>
<li><strong>記憶體畫布光柵化 (In-Memory Rasterization)</strong>：畫面像素渲染至虛擬記憶體緩衝區 (Framebuffer)，而非實體顯卡螢幕。</li>
<li><strong>CDP (<code>Chrome DevTools Protocol</code>)</strong>：透過 WebSocket 直接向瀏覽器核心發送底層指令（網路攔截、DOM 查詢、模擬點擊與 60fps 視訊流擷取）。</li>
</ol>
</li>
<li><strong>優勢</strong>：大幅降低 GPU/記憶體開銷，在 Linux 無 GUI 容器中高速產出像素級截圖與錄影。</li>
</ul>
</div>
<div class="card">
<h3 id="%F0%9F%AA%9F-2-%E6%A1%8C%E9%9D%A2%E6%87%89%E7%94%A8%E7%A8%8B%E5%BC%8F%E7%95%AB%E9%9D%A2%E6%A8%A1%E6%93%ACspectron-%E8%88%87-electron"><img class="emoji" draggable="false" alt="🪟" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1fa9f.svg" data-marp-twemoji=""/> 2. 桌面應用程式畫面模擬：Spectron 與 Electron</h3>
<ul>
<li><strong>Electron 混合桌面架構挑戰</strong>：
<ul>
<li>VS Code、Slack 與現代 AI IDE 皆採用 Electron（<strong>Node.js 主行程 Main Process + Chromium 渲染行程 Renderer Process</strong>），傳統 Web 工具無法穿透控制原生視窗。</li>
</ul>
</li>
<li><strong>Spectron 框架原理</strong>：
<ul>
<li>由 Electron 官方打造，結合 <strong>ChromeDriver + WebDriverIO</strong>，<strong>同時接管 Main Process 與 Renderer Process</strong>：</li>
<li>既能模擬視窗內 HTML/CSS 點擊，更能檢驗<strong>跨行程通訊 (IPC)</strong>、<strong>系統檔案對話框 (File Dialogs)</strong> 與<strong>原生選單 (Native Menus)</strong>。</li>
</ul>
</li>
<li><strong>現代演進 (<code>Playwright for Electron</code>)</strong>：
<ul>
<li>隨 Spectron 停止維護，現代桌面 E2E 已全面轉移至 Playwright <code>_electron.launch()</code>，延續跨主行程注入並具備自動等待與 Trace 錄影。</li>
</ul>
</li>
</ul>
</div>
</div>
</div>
<footer>Ch08 系統測試、BDD 與非功能性驗證</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="16" data-paginate="true" data-header="8.3 微服務契約、Playwright 與 AI 畫面模擬" data-footer="Ch08 系統測試、BDD 與非功能性驗證" data-theme="sqa-theme" lang="C" data-marpit-pagination="16" style="--paginate:true;--header:8.3 微服務契約、Playwright 與 AI 畫面模擬;--footer:Ch08 系統測試、BDD 與非功能性驗證;--theme:sqa-theme;" data-marpit-pagination-total="44">
<header>8.3 微服務契約、Playwright 與 AI 畫面模擬</header>

<h2 id="ai-%E6%B8%AC%E8%A9%A6%E4%BB%A3%E7%90%86%E4%BA%BA%E7%95%AB%E9%9D%A2%E6%A8%A1%E6%93%AC-browser-subagent-%E8%88%87%E4%B8%89%E4%BB%A3%E6%8A%80%E8%A1%93%E6%BC%94%E9%80%B2">AI 測試代理人畫面模擬 (Browser Subagent) 與三代技術演進</h2>
<div class="card-deck">
<blockquote>
<p><img class="emoji" draggable="false" alt="💡" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4a1.svg" data-marp-twemoji=""/> 以 <strong>Google Antigravity Browser-Subagent</strong> 為代表的新一代 AI 代理人，結合多模態視覺 (VLM) 與 DOM 感知，徹底擺脫傳統脆弱定位器 (Brittle Locators)！</p>
</blockquote>
<div class="two-columns-64">
<div class="card">
<h3 id="%F0%9F%A4%96-ai-browser-subagent-%E4%B8%89%E5%A4%A7%E6%A0%B8%E5%BF%83%E8%83%BD%E5%8A%9B"><img class="emoji" draggable="false" alt="🤖" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f916.svg" data-marp-twemoji=""/> AI Browser-Subagent 三大核心能力</h3>
<ul>
<li><strong>1. 多模態視覺與 DOM 雙軌感知 (Multimodal Dual-Loop)</strong>：
<ul>
<li>同時讀取 Accessibility/DOM 樹並截取渲染畫面送交<strong>視覺語言模型 (VLM)</strong>。</li>
<li><strong>攻克脆弱定位器 (Brittle Locators)</strong>：前端修改 Tailwind class 或 div 階層不再導致測試崩潰；AI 以「人類視覺意圖」辨識「購物車圖示」或「藍色下一步按鈕」。</li>
</ul>
</li>
<li><strong>2. 自主探索測試 (Autonomous Exploratory Testing)</strong>：
<ul>
<li>僅需下達高階目標提示詞（如「<em>以管理員登入，嘗試未填品名建立商品，驗證防呆提示是否跳出</em>」），Subagent 自主規劃「導航 ➔ 觀察 ➔ 點擊 ➔ 驗證」閉環。</li>
</ul>
</li>
<li><strong>3. 自動化會話錄影與測試工件 (Session Artifacts)</strong>：
<ul>
<li>在無頭模式下自動將操作過程編碼為 <strong>WebP / MP4 動態影片</strong>，連同 DOM 快照與網路請求存為工件供回放除錯。</li>
</ul>
</li>
</ul>
</div>
<div class="card">
<h3 id="%F0%9F%93%8A-%E7%95%AB%E9%9D%A2%E6%A8%A1%E6%93%AC%E6%8A%80%E8%A1%93%E4%B8%89%E4%BB%A3%E6%BC%94%E9%80%B2%E5%B0%8D%E6%AF%94%E7%9F%A9%E9%99%A3"><img class="emoji" draggable="false" alt="📊" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4ca.svg" data-marp-twemoji=""/> 畫面模擬技術三代演進對比矩陣</h3>
<table>
<thead>
<tr>
<th style="text-align:left">演進階段與代表工具</th>
<th style="text-align:left">操作驅動依據</th>
<th style="text-align:left">強健度與維護成本</th>
</tr>
</thead>
<tbody>
<tr>
<td style="text-align:left"><strong>第一代：錄製回放</strong><br /><em>(Selenium IDE, Rapi)</em></td>
<td style="text-align:left">絕對座標或靜態 DOM 路徑</td>
<td style="text-align:left"><img class="emoji" draggable="false" alt="🔴" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f534.svg" data-marp-twemoji=""/> <strong>極脆弱 / 高成本</strong><br /><em>(版面微調即全數崩潰)</em></td>
</tr>
<tr>
<td style="text-align:left"><strong>第二代：腳本與無頭</strong><br /><em>(Playwright, Spectron)</em></td>
<td style="text-align:left">工程師手寫 CSS / XPath / Role</td>
<td style="text-align:left"><img class="emoji" draggable="false" alt="🟡" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f7e1.svg" data-marp-twemoji=""/> <strong>中強健 / 中成本</strong><br /><em>(具自動等待，仍受重構影響)</em></td>
</tr>
<tr>
<td style="text-align:left"><strong>第三代：AI 代理人</strong><br /><em>(Antigravity Subagent)</em></td>
<td style="text-align:left"><strong>VLM 視覺語意 + 動態目標推理</strong></td>
<td style="text-align:left"><img class="emoji" draggable="false" alt="🟢" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f7e2.svg" data-marp-twemoji=""/> <strong>極高強健 / 低成本</strong><br /><em>(自我修復、自動產出錄影工件)</em></td>
</tr>
</tbody>
</table>
</div>
</div>
</div>
<footer>Ch08 系統測試、BDD 與非功能性驗證</footer>
</section>

<header>8.3 微服務契約、Playwright 與 AI 畫面模擬</header>

<h2 id="%E6%A6%82%E5%BF%B5%E6%A0%B8%E5%B0%8D%E5%95%8F%E7%AD%94-ccq-2">概念核對問答 (CCQ 2)</h2>
<div class="ccq-columns">
<div class="ccq-text">

<p><strong>問題情境</strong>：<br />
在現代 E2E 系統測試架構中，關於無頭瀏覽器 (Headless Browser)、桌面端自動化框架 (Spectron) 與 AI 瀏覽器代理人 (Browser Subagent) 的技術原理，下列敘述何者<strong>最正確</strong>？</p>
<ul>
<li><strong>A)</strong> 無頭瀏覽器因無 GUI 介面，執行測試時不會載入 CSS 與排版引擎，僅執行純 JS 邏輯運算</li>
<li><strong>B)</strong> Spectron 僅用於純 Web 壓測，無法跨入 Electron 主行程控制桌面原生選單與對話框</li>
<li><strong>C)</strong> Browser Subagent 結合 VLM 視覺與 DOM 感知，能改善前端結構調整造成的定位器斷裂問題</li>
<li><strong>D)</strong> AI 瀏覽器代理人必須在實體螢幕有頭視窗中顯示，無法於 Linux 容器中輸出 WebP 錄影工件</li>
</ul>
</div>
<div class="ccq-logo">
<p><a href="https://nlhsueh.github.io/nickedupocket/#/student/sqa-ch08-ccq2" target="_blank"><img src="../../img/ch08/sqa-ch08-ccq2.png" alt="QR Code" /></a></p>
</div>
</div>
<footer>Ch08 系統測試、BDD 與非功能性驗證</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="18" data-paginate="true" data-header="8.4 可用性測試 (Usability Testing)" data-footer="Ch08 系統測試、BDD 與非功能性驗證" data-class="lead" data-theme="sqa-theme" lang="C" class="lead" data-marpit-pagination="18" style="--paginate:true;--header:8.4 可用性測試 (Usability Testing);--footer:Ch08 系統測試、BDD 與非功能性驗證;--class:lead;--theme:sqa-theme;" data-marpit-pagination-total="44">
<header>8.4 可用性測試 (Usability Testing)</header>

<h1 id="84-%E5%8F%AF%E7%94%A8%E6%80%A7%E6%B8%AC%E8%A9%A6-usability-testing"><strong>8.4 可用性測試 (Usability Testing)</strong></h1>
<blockquote>
<p>「拿出你的 iPhone 手機計算機，依序按下 <code>77 - 38.5 =</code>，看看答案是多少？<br />
咦，竟然是 <code>0</code>？！你能從可用性工程解釋為什麼嗎？」</p>
</blockquote>
<footer>Ch08 系統測試、BDD 與非功能性驗證</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="19" data-paginate="true" data-header="8.4 可用性測試 (Usability Testing)" data-footer="Ch08 系統測試、BDD 與非功能性驗證" data-theme="sqa-theme" lang="C" data-marpit-pagination="19" style="--paginate:true;--header:8.4 可用性測試 (Usability Testing);--footer:Ch08 系統測試、BDD 與非功能性驗證;--theme:sqa-theme;" data-marpit-pagination-total="44">
<header>8.4 可用性測試 (Usability Testing)</header>

<h2 id="%E7%A0%B4%E5%86%B0%E6%A1%88%E4%BE%8B%E8%A7%A3%E5%AF%86%E8%88%87-jakob-nielsen-%E5%8D%81%E5%A4%A7%E5%95%9F%E7%99%BC%E5%BC%8F%E5%8E%9F%E5%89%87-1--5">破冰案例解密與 Jakob Nielsen 十大啟發式原則 (1 ~ 5)</h2>
<div class="card-deck">
<blockquote>
<p><img class="emoji" draggable="false" alt="💡" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4a1.svg" data-marp-twemoji=""/> <strong>為什麼 iPhone 計算機算 <code>77 - 38.5</code> 常按出 <code>0</code>？</strong> 因為使用者習慣連按兩次 <code>C/AC</code> 清空，當小數點按錯或未看清狀態時，介面缺乏清晰的算式歷程可見性（直到新版 iOS 才補上頂部算式列）！</p>
</blockquote>
<div class="two-columns">
<div class="card">
<h3 id="%F0%9F%8E%AF-%E5%8F%AF%E7%94%A8%E6%80%A7%E6%B8%AC%E8%A9%A6%E6%9C%AC%E8%B3%AA%E8%88%87-nielsen-%E5%8E%9F%E5%89%87-1--2"><img class="emoji" draggable="false" alt="🎯" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f3af.svg" data-marp-twemoji=""/> 可用性測試本質與 Nielsen 原則 (1 ~ 2)</h3>
<ul>
<li><strong>可用性測試 (Usability Testing)</strong>：
<ul>
<li>評估真實使用者操作系統時是否<strong>容易上手、容易學習、有效率、少犯錯且滿意度高</strong>。</li>
</ul>
</li>
<li><strong>1. 系統狀態可見性 (Visibility of system status)</strong>：
<ul>
<li>系統應隨時透過適當回饋讓使用者知道目前進度與狀態（如上傳進度條、計算機輸入算式列）。</li>
</ul>
</li>
<li><strong>2. 系統與真實世界相符 (Match between system and real world)</strong>：
<ul>
<li>使用使用者熟悉的語言、詞彙與生活隱喻（如購物車、垃圾桶圖示），而非內部工程代碼（如 <code>ERR_DB_CONN_0x84</code>）。</li>
</ul>
</li>
</ul>
</div>
<div class="card">
<h3 id="%F0%9F%9B%A1%EF%B8%8F-nielsen-%E5%95%9F%E7%99%BC%E5%BC%8F%E5%8F%AF%E7%94%A8%E6%80%A7%E5%8E%9F%E5%89%87-3--5"><img class="emoji" draggable="false" alt="🛡️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f6e1.svg" data-marp-twemoji=""/> Nielsen 啟發式可用性原則 (3 ~ 5)</h3>
<ul>
<li><strong>3. 使用者控制與自由 (User control and freedom)</strong>：
<ul>
<li>使用者常誤觸功能，系統必須提供明確的「<strong>緊急出口 (Emergency Exit)</strong>」，支援輕鬆 <strong>Undo（復原）/ Redo（重做）</strong> 與取消操作。</li>
</ul>
</li>
<li><strong>4. 一致性與標準 (Consistency and standards)</strong>：
<ul>
<li>遵循平台通用規範；<strong>不同頁面的「儲存」或「確認」按鈕樣式、位置與詞彙應保持一致</strong>，不讓使用者困惑。</li>
</ul>
</li>
<li><strong>5. 預防錯誤 (Error prevention)</strong>：
<ul>
<li>比提供好錯誤訊息更重要的是「<strong>在犯錯前預先防範</strong>」（如 Format 格式化磁碟或刪除帳號前，強制跳出二次確認對話框）。</li>
</ul>
</li>
</ul>
</div>
</div>
</div>
<footer>Ch08 系統測試、BDD 與非功能性驗證</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="20" data-paginate="true" data-header="8.4 可用性測試 (Usability Testing)" data-footer="Ch08 系統測試、BDD 與非功能性驗證" data-theme="sqa-theme" lang="C" data-marpit-pagination="20" style="--paginate:true;--header:8.4 可用性測試 (Usability Testing);--footer:Ch08 系統測試、BDD 與非功能性驗證;--theme:sqa-theme;" data-marpit-pagination-total="44">
<header>8.4 可用性測試 (Usability Testing)</header>

<h2 id="nielsen-%E5%8D%81%E5%A4%A7%E5%95%9F%E7%99%BC%E5%BC%8F%E5%8E%9F%E5%89%87-6--10-%E8%88%87%E5%AF%A6%E5%8B%99%E6%83%85%E5%A2%83%E9%80%A3%E9%80%A3%E7%9C%8B">Nielsen 十大啟發式原則 (6 ~ 10) 與實務情境連連看</h2>
<div class="card-deck">
<blockquote>
<p><img class="emoji" draggable="false" alt="💡" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4a1.svg" data-marp-twemoji=""/> 將真實介面設計缺失或特色，精準對應至 Jakob Nielsen 的十大可用性啟發準則！</p>
</blockquote>
<div class="two-columns">
<div class="card">
<h3 id="%F0%9F%8F%86-nielsen-%E5%95%9F%E7%99%BC%E5%BC%8F%E5%8F%AF%E7%94%A8%E6%80%A7%E5%8E%9F%E5%89%87-6--10"><img class="emoji" draggable="false" alt="🏆" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f3c6.svg" data-marp-twemoji=""/> Nielsen 啟發式可用性原則 (6 ~ 10)</h3>
<ul>
<li><strong>6. 辨識勝於記憶 (Recognition rather than recall)</strong>：
<ul>
<li>讓物件、動作與選項清晰可見（如提供視覺化選單而非背誦指令），降低短期記憶負荷。</li>
</ul>
</li>
<li><strong>7. 彈性與使用效率 (Flexibility and efficiency of use)</strong>：
<ul>
<li>為新手提供清晰引導，同時為<strong>專家提供快捷鍵 (Accelerators / Shortcuts)</strong> 與自訂巨集。</li>
</ul>
</li>
<li><strong>8. 美學與極簡設計 (Aesthetic and minimalist design)</strong>：
<ul>
<li>介面不應塞滿無關或罕用的功能；每多一個冗餘資訊，都會稀釋重要資訊的能見度。</li>
</ul>
</li>
<li><strong>9. 幫助使用者辨識、診斷並修復錯誤 (Help users recover)</strong>：
<ul>
<li>錯誤訊息應以淺顯語言指出問題，並<strong>具體給出建設性解決方法</strong>。</li>
</ul>
</li>
<li><strong>10. 說明文件與線上協助 (Help and documentation)</strong>：
<ul>
<li>必要時提供易搜尋、以使用者任務為導向的具體步驟說明。</li>
</ul>
</li>
</ul>
</div>
<div class="card">
<h3 id="%F0%9F%94%8D-%E8%AA%B2%E5%A0%82%E7%B7%B4%E7%BF%92-89%E4%BB%8B%E9%9D%A2%E6%83%85%E5%A2%83%E5%B0%8D%E6%87%89%E5%93%AA%E4%B8%80%E6%A2%9D-nielsen-%E5%8E%9F%E5%89%87"><img class="emoji" draggable="false" alt="🔍" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f50d.svg" data-marp-twemoji=""/> 課堂練習 (8.9)：介面情境對應哪一條 Nielsen 原則？</h3>
<table>
<thead>
<tr>
<th style="text-align:left">介面設計現象 / 問題情境</th>
<th style="text-align:left">對應之 Nielsen 啟發原則</th>
</tr>
</thead>
<tbody>
<tr>
<td style="text-align:left">1. 不同頁面「資料儲存」的按鈕樣式不同</td>
<td style="text-align:left"><strong>#4 一致性與標準</strong> <em>(違反)</em></td>
</tr>
<tr>
<td style="text-align:left">2. 編輯器具備 <code>Undo</code> (復原) 功能</td>
<td style="text-align:left"><strong>#3 使用者控制與自由</strong> <em>(符合)</em></td>
</tr>
<tr>
<td style="text-align:left">3. 一個畫面充斥過多無關緊要的功能</td>
<td style="text-align:left"><strong>#8 美學與極簡設計</strong> <em>(違反)</em></td>
</tr>
<tr>
<td style="text-align:left">4. 為熟練用戶提供 <code>Ctrl+S</code> 快捷鍵</td>
<td style="text-align:left"><strong>#7 彈性與使用效率</strong> <em>(符合)</em></td>
</tr>
<tr>
<td style="text-align:left">5. 應用真實世界直覺 Icon 表達功能</td>
<td style="text-align:left"><strong>#2 與真實世界相符 / #6 辨識勝於記憶</strong></td>
</tr>
<tr>
<td style="text-align:left">6. Format 磁碟前提醒使用者再次確認</td>
<td style="text-align:left"><strong>#5 預防錯誤</strong> <em>(符合)</em></td>
</tr>
<tr>
<td style="text-align:left">7. 僅告知「密碼強度不足」卻沒說少什麼</td>
<td style="text-align:left"><strong>#9 幫助辨識、診斷並修復錯誤</strong> <em>(違反)</em></td>
</tr>
</tbody>
</table>
</div>
</div>
</div>
<footer>Ch08 系統測試、BDD 與非功能性驗證</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="21" data-paginate="true" data-header="8.4 可用性測試 (Usability Testing)" data-footer="Ch08 系統測試、BDD 與非功能性驗證" data-theme="sqa-theme" lang="C" data-marpit-pagination="21" style="--paginate:true;--header:8.4 可用性測試 (Usability Testing);--footer:Ch08 系統測試、BDD 與非功能性驗證;--theme:sqa-theme;" data-marpit-pagination-total="44">
<header>8.4 可用性測試 (Usability Testing)</header>

<h2 id="%E4%B8%89%E5%A4%A7%E5%8F%AF%E7%94%A8%E6%80%A7%E8%A9%95%E4%BC%B0%E6%96%B9%E6%B3%95%E5%95%9F%E7%99%BC%E5%BC%8F%E6%AA%A2%E8%A6%96%E8%B5%B0%E9%81%93%E6%B8%AC%E8%A9%A6%E8%88%87-ab-%E6%B8%AC%E8%A9%A6">三大可用性評估方法：啟發式檢視、走道測試與 A/B 測試</h2>
<div class="card-deck">
<blockquote>
<p><img class="emoji" draggable="false" alt="💡" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4a1.svg" data-marp-twemoji=""/> 可用性測試不一定要花費百萬打造眼動儀實驗室；結合專家檢視、低成本走道測試與線上數據分流，即可全面把關體驗！</p>
</blockquote>
<div class="content-columns">
<div class="content-text">
<h3 id="%F0%9F%A7%AA-%E4%B8%89%E7%A8%AE%E7%B6%93%E5%85%B8%E5%8F%AF%E7%94%A8%E6%80%A7%E6%B8%AC%E8%A9%A6%E6%96%B9%E5%BC%8F"><img class="emoji" draggable="false" alt="🧪" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f9ea.svg" data-marp-twemoji=""/> 三種經典可用性測試方式</h3>
<ol>
<li><strong>啟發式評估 (Heuristic Evaluation)</strong>：
<ul>
<li>由 3~5 位 UX 專家依據 <strong>Nielsen 十大原則</strong>逐項檢視介面並標記違規嚴重度。</li>
</ul>
</li>
<li><strong>Hallway 走道測試 (Hallway Testing)</strong>：
<ul>
<li>隨機邀請辦公室走道經過的 <strong>5~6 位非專案相關人員</strong>親自操作新功能並「放聲思考 (Think Aloud)」。</li>
<li><strong>Nielsen 實證定律</strong>：只需測試 <strong>5 位使用者</strong>，即可在極低成本下揪出 <strong>80% 以上</strong>最嚴重的可用性盲點！</li>
</ul>
</li>
<li><strong>A/B 測試法 (A/B Testing)</strong>：
<ul>
<li>針對某項介面設計（如結帳按鈕位置、配色或文案）準備 <strong>A（控制組）與 B（實驗組）</strong> 兩版本進行線上隨機流量分流。</li>
<li>透過真實使用者的<strong>點擊率 (CTR) 與轉換率 (CVR)</strong> 統計顯著性，以客觀數據決定最佳設計！</li>
</ul>
</li>
</ol>
</div>
<div class="content-figure">
<p><img src="../../img/ch08/Hk6D9yr4T.png" alt="A/B Testing" /></p>
</div>
</div>
</div>
<footer>Ch08 系統測試、BDD 與非功能性驗證</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="22" data-paginate="true" data-header="8.4 可用性測試 (Usability Testing)" data-footer="Ch08 系統測試、BDD 與非功能性驗證" data-theme="sqa-theme" lang="C" data-marpit-pagination="22" style="--paginate:true;--header:8.4 可用性測試 (Usability Testing);--footer:Ch08 系統測試、BDD 與非功能性驗證;--theme:sqa-theme;" data-marpit-pagination-total="44">
<header>8.4 可用性測試 (Usability Testing)</header>

<h2 id="%E6%A6%82%E5%BF%B5%E6%A0%B8%E5%B0%8D%E5%95%8F%E7%AD%94-ccq-3">概念核對問答 (CCQ 3)</h2>
<div class="ccq-columns">
<div class="ccq-text">

<p><strong>問題情境</strong>：<br />
使用者在某網站註冊設定密碼時，系統僅冷冰冰地跳出紅字「<img class="emoji" draggable="false" alt="❌" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/274c.svg" data-marp-twemoji=""/> 密碼設定強度不足！」，卻沒有說明究竟是「長度未滿 8 碼」、「缺少大寫字母」還是「缺少特殊符號」，導致使用者反覆盲目重試。請問這主要違反了 Jakob Nielsen 十大可用性原則中的哪一項？</p>
<ul>
<li><strong>A)</strong> 原則 3：使用者控制與自由 (User control and freedom)</li>
<li><strong>B)</strong> 原則 7：彈性與使用效率 (Flexibility and efficiency of use)</li>
<li><strong>C)</strong> 原則 8：美學與極簡設計 (Aesthetic and minimalist design)</li>
<li><strong>D)</strong> 原則 9：幫助使用者辨識、診斷並修復錯誤 (Help users recover from errors)</li>
</ul>
</div>
<div class="ccq-logo">
<p><a href="https://nlhsueh.github.io/nickedupocket/#/student/sqa-ch08-ccq3" target="_blank"><img src="../../img/ch08/sqa-ch08-ccq3.png" alt="QR Code" /></a></p>
</div>
</div>
<footer>Ch08 系統測試、BDD 與非功能性驗證</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="23" data-paginate="true" data-header="8.5 效能測試與負載工程" data-footer="Ch08 系統測試、BDD 與非功能性驗證" data-class="lead" data-theme="sqa-theme" lang="C" class="lead" data-marpit-pagination="23" style="--paginate:true;--header:8.5 效能測試與負載工程;--footer:Ch08 系統測試、BDD 與非功能性驗證;--class:lead;--theme:sqa-theme;" data-marpit-pagination-total="44">
<header>8.5 效能測試與負載工程</header>

<h1 id="85-%E6%95%88%E8%83%BD%E6%B8%AC%E8%A9%A6%E8%88%87%E8%B2%A0%E8%BC%89%E5%B7%A5%E7%A8%8B-performance--load-testing"><strong>8.5 效能測試與負載工程 (Performance &amp; Load Testing)</strong></h1>
<blockquote>
<p>「功能正確只是入場券；當雙 11 零點 10 萬人同時按下結帳時，<br />
系統是優雅承載，還是瞬間雪崩當機？這就是效能工程的戰場。」</p>
</blockquote>
<footer>Ch08 系統測試、BDD 與非功能性驗證</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="24" data-paginate="true" data-header="8.5 效能測試與負載工程" data-footer="Ch08 系統測試、BDD 與非功能性驗證" data-theme="sqa-theme" lang="C" data-marpit-pagination="24" style="--paginate:true;--header:8.5 效能測試與負載工程;--footer:Ch08 系統測試、BDD 與非功能性驗證;--theme:sqa-theme;" data-marpit-pagination-total="44">
<header>8.5 效能測試與負載工程</header>

<h2 id="%E6%95%88%E8%83%BD%E6%B8%AC%E8%A9%A6%E5%9B%9B%E5%A4%A7%E9%A1%9E%E5%9E%8B%E8%88%87%E5%9B%9B%E5%A4%A7%E6%A0%B8%E5%BF%83%E8%A1%93%E8%AA%9E">效能測試四大類型與四大核心術語</h2>
<div class="card-deck">
<blockquote>
<p><img class="emoji" draggable="false" alt="💡" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4a1.svg" data-marp-twemoji=""/> 釐清「負載測試」與「壓力測試」的本質差異，並掌握回應時間、延遲、吞吐量與延展性四大核心指標。</p>
</blockquote>
<div class="two-columns">
<div class="card">
<h3 id="%F0%9F%93%8A-%E6%95%88%E8%83%BD%E6%B8%AC%E8%A9%A6%E5%9B%9B%E5%A4%A7%E6%B8%AC%E8%A9%A6%E5%9E%8B%E6%85%8B%E5%B0%8D%E6%AF%94"><img class="emoji" draggable="false" alt="📊" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4ca.svg" data-marp-twemoji=""/> 效能測試四大測試型態對比</h3>
<ul>
<li><strong>1. 負載測試 (Load Testing)</strong>：
<ul>
<li>驗證系統能否承受<strong>預期的特定目標負載</strong>（如購物網預估 100,000 人同時上線），確認回應時間與吞吐量符合 SLA。</li>
</ul>
</li>
<li><strong>2. 壓力測試 (Stress Testing)</strong>：
<ul>
<li>超越設計負荷持續加壓以<strong>測試系統極限</strong>，觀察系統到哪個階段開始回應遲緩或當機崩潰，以及崩潰後能否平穩降級與復原。</li>
</ul>
</li>
<li><strong>3. 突波測試 (Spike Testing)</strong>：
<ul>
<li>模擬瞬間湧入的極端洪峰流量（如演唱會門票開賣、整點搶購）。</li>
</ul>
</li>
<li><strong>4. 浸泡 / 耐久測試 (Soak / Endurance Testing)</strong>：
<ul>
<li>在常態負載下長時間連續運行（如 24~72 小時），專門抓出<strong>記憶體洩漏 (Memory Leak)</strong> 與連線池耗盡。</li>
</ul>
</li>
</ul>
</div>
<div class="card">
<h3 id="%F0%9F%94%91-%E6%95%88%E8%83%BD%E6%B8%AC%E8%A9%A6%E5%9B%9B%E5%A4%A7%E6%A0%B8%E5%BF%83%E5%90%8D%E8%A9%9E"><img class="emoji" draggable="false" alt="🔑" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f511.svg" data-marp-twemoji=""/> 效能測試四大核心名詞</h3>
<ul>
<li><strong>回應時間 (Response Time)</strong>：
<ul>
<li>系統處理一個請求所需的總時間（電商黃金法則：超過 <strong>8 秒</strong>使用者放棄購買比例大幅飆升）。</li>
</ul>
</li>
<li><strong>網路延遲 (Latency)</strong>：
<ul>
<li>請求在網路傳輸耗費的時間；若網路慢不能怪罪演算法，須從網路架構或 CDN / 代理伺服器改善。</li>
</ul>
</li>
<li><strong>吞吐量 (Throughput / Workload)</strong>：
<ul>
<li>系統每秒可成功處理的交易量 (RPS / TPS) 而不發生錯誤。</li>
</ul>
</li>
<li><strong>延展性 (Scalability)</strong>：
<ul>
<li><strong>垂直延展 (Vertically Up)</strong>：升級單機硬體（Better Machine）。</li>
<li><strong>水平延展 (Horizontally Out)</strong>：增加更多機器（More Machines + NLB 網路負載平衡器）。<img class="emoji" draggable="false" alt="⚠️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/26a0.svg" data-marp-twemoji=""/> <em>注意：若瓶頸在資料庫，盲目加機器會導致雙 DB 資料不一致，系統仍延展不開！</em></li>
</ul>
</li>
</ul>
</div>
</div>
</div>
<footer>Ch08 系統測試、BDD 與非功能性驗證</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="25" data-paginate="true" data-header="8.5 效能測試與負載工程" data-footer="Ch08 系統測試、BDD 與非功能性驗證" data-theme="sqa-theme" lang="C" data-marpit-pagination="25" style="--paginate:true;--header:8.5 效能測試與負載工程;--footer:Ch08 系統測試、BDD 與非功能性驗證;--theme:sqa-theme;" data-marpit-pagination-total="44">
<header>8.5 效能測試與負載工程</header>

<h2 id="%E7%82%BA%E4%BB%80%E9%BA%BC%E6%95%88%E8%83%BD%E6%B8%AC%E8%A9%A6%E6%97%A2%E6%98%82%E8%B2%B4%E5%8F%88%E5%9B%B0%E9%9B%A3%E4%BD%95%E6%99%82%E8%A9%B2%E9%96%8B%E5%A7%8B%E5%9F%B7%E8%A1%8C">為什麼效能測試既昂貴又困難？何時該開始執行？</h2>
<div class="card-deck">
<blockquote>
<p><img class="emoji" draggable="false" alt="💡" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4a1.svg" data-marp-twemoji=""/> 許多團隊低估了效能測試的工程複雜度，直到上線前夕才倉促加壓而釀成災難。</p>
</blockquote>
<div class="two-columns">
<div class="card">
<h3 id="%F0%9F%92%B0-%E7%82%BA%E4%BB%80%E9%BA%BC%E6%95%88%E8%83%BD%E6%B8%AC%E8%A9%A6%E4%B8%A6%E4%B8%8D%E4%BE%BF%E5%AE%9C"><img class="emoji" draggable="false" alt="💰" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4b0.svg" data-marp-twemoji=""/> 為什麼效能測試「並不便宜」？</h3>
<ol>
<li><strong>商用壓測工具與雲端發壓節點昂貴</strong>。</li>
<li><strong>準備擬真測試資料極度耗時</strong>（如百萬筆不重複的會員與訂單資料，避免全部命中資料庫快取而失真）。</li>
<li><strong>建置等比例測試環境 (Staging) 成本高昂</strong>：
<ul>
<li>若生產環境是大型主機或高規叢集，很難再買一套一模一樣的硬體專供測試。</li>
</ul>
</li>
<li><strong>執行壓測時需獨佔資源</strong>：
<ul>
<li>壓測期間往往必須暫停其他團隊對共用測試環境與網路的使用。</li>
</ul>
</li>
<li><strong>跨職能專家協同成本高</strong>：
<ul>
<li>必須動員 <strong>DBA（資料庫管理師）、網管人員、後端開發者与測試工程師</strong>共同監控與調校。</li>
</ul>
</li>
</ol>
</div>
<div class="card">
<h3 id="%F0%9F%A7%A9-%E7%82%BA%E4%BB%80%E9%BA%BC%E6%95%88%E8%83%BD%E6%B8%AC%E8%A9%A6%E4%B8%A6%E4%B8%8D%E5%AE%B9%E6%98%93%E4%BD%95%E6%99%82%E5%9F%B7%E8%A1%8C"><img class="emoji" draggable="false" alt="🧩" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f9e9.svg" data-marp-twemoji=""/> 為什麼效能測試「並不容易」？何時執行？</h3>
<ul>
<li><strong>四大工程難點</strong>：
<ol>
<li><strong>軟體必須是最終版本</strong>：微小的程式碼修改都可能劇烈改變效能表現。</li>
<li><strong>真實行為模擬不易</strong>：必須考慮使用者的<strong>思考時間 (Think Time，如線上考試閱讀題目的停頓)</strong>，並釐清檔案上下傳考驗的是系統效能還是網路頻寬。</li>
<li><strong>瓶頸歸因困難</strong>：當效能低落時，瓶頸究竟在 CPU、記憶體、DB 鎖定、網路，還是壓測軟體本身？</li>
<li><strong>跨角色溝通挑戰</strong>：如何說服管理層採購硬體？如何拿數據說服工程師重構慢查詢？</li>
</ol>
</li>
<li><strong><img class="emoji" draggable="false" alt="⏱️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/23f1.svg" data-marp-twemoji=""/> 何時開始？</strong> 雖屬系統測試，但應<strong>盡早於模組開發期先行檢測核心瓶頸</strong>；正式系統壓測則在軟硬體與網路環境皆安裝就緒後，「<strong>壓測 ➔ 調校 (Tuning) ➔ 再壓測</strong>」反覆迭代進行！</li>
</ul>
</div>
</div>
</div>
<footer>Ch08 系統測試、BDD 與非功能性驗證</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="26" data-paginate="true" data-header="8.5 效能測試與負載工程" data-footer="Ch08 系統測試、BDD 與非功能性驗證" data-theme="sqa-theme" lang="C" data-marpit-pagination="26" style="--paginate:true;--header:8.5 效能測試與負載工程;--footer:Ch08 系統測試、BDD 與非功能性驗證;--theme:sqa-theme;" data-marpit-pagination-total="44">
<header>8.5 效能測試與負載工程</header>

<h2 id="%E7%B6%B2%E8%B7%AF%E6%B5%81%E9%87%8F%E5%BA%A6%E9%87%8F%E6%8C%87%E6%A8%99%E8%88%87%E5%88%86%E6%95%A3%E5%BC%8F%E8%99%9B%E6%93%AC%E4%BD%BF%E7%94%A8%E8%80%85-virtual-users">網路流量度量指標與分散式虛擬使用者 (Virtual Users)</h2>
<div class="card-deck">
<blockquote>
<p><img class="emoji" draggable="false" alt="💡" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4a1.svg" data-marp-twemoji=""/> 進行工作負載建模前，必須先釐清 Visit、Session、Page View 與 Hit 的精確定義，並透過分散式負載產生器模擬併發流量。</p>
</blockquote>
<div class="two-columns-64">
<div class="card">
<h3 id="%F0%9F%93%8F-%E5%B8%B8%E7%94%A8%E6%B5%81%E9%87%8F%E8%88%87%E6%9C%83%E8%A9%B1%E5%BA%A6%E9%87%8F%E6%8C%87%E6%A8%99"><img class="emoji" draggable="false" alt="📏" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4cf.svg" data-marp-twemoji=""/> 常用流量與會話度量指標</h3>
<ul>
<li><strong>四大核心流量計量辨析（必考重點！）</strong>：
<ul>
<li><strong>拜訪人數 (Visits / Unique Visitors)</strong>：獨立造訪的使用者<strong>人數</strong>（Visit 越高，代表不同使用者進入系統的次數越高）。</li>
<li><strong>會話人次 (Sessions)</strong>：使用者進入系統完成一連串操作的<strong>人次</strong>（通常以 30 分鐘無動作為 Session 超時）。</li>
<li><strong>頁面瀏覽數 (Page Views)</strong>：被觀看之<strong>網頁數量</strong>（注意：<strong>Page View 代表頁數，而非拜訪人次</strong>！<code>Page Views / Session</code> 越高，代表每次進入系統瀏覽越多頁）。</li>
<li><strong>請求 / 點擊數 (Requests / Hits)</strong>：載入單一頁面所觸發的所有 HTML、JS、CSS、圖片與 API <strong>HTTP 請求總數</strong>（1 個 Page View 可能產生 30 個 Hits，故 <strong>Hit 高不代表人數多</strong>！）。</li>
</ul>
</li>
<li><strong>其他關鍵統計</strong>：每小時平均/尖峰 Session 數、每頁平均停留時間 (Think Time)、新舊用戶比值、單位時間最高同時上線數 (Concurrent Users)。</li>
</ul>
</div>
<div class="card">
<h3 id="%F0%9F%A4%96-%E8%99%9B%E6%93%AC%E4%BD%BF%E7%94%A8%E8%80%85-vus-%E8%88%87%E5%88%86%E6%95%A3%E5%BC%8F%E5%8A%A0%E5%A3%93"><img class="emoji" draggable="false" alt="🤖" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f916.svg" data-marp-twemoji=""/> 虛擬使用者 (VUs) 與分散式加壓</h3>
<ul>
<li><strong>Load Generator (負載產生器)</strong>：以執行緒或協程模擬成千上萬名 <strong>Virtual Users (VUs)</strong> 並發送出請求。</li>
<li>當單機網卡或 CPU 不足以產生十萬併發時，採用 <strong>Master-Slave 多台負載產生器分散式加壓</strong>：</li>
</ul>
<p><img src="../../img/ch08/HJEFskS4T.png" alt="Virtual Users" /><br />
<img src="../../img/ch08/BkJb3JSET.png" alt="Distributed Load Generators" /></p>
</div>
</div>
</div>
<footer>Ch08 系統測試、BDD 與非功能性驗證</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="27" data-paginate="true" data-header="8.5 效能測試與負載工程" data-footer="Ch08 系統測試、BDD 與非功能性驗證" data-theme="sqa-theme" lang="C" data-marpit-pagination="27" style="--paginate:true;--header:8.5 效能測試與負載工程;--footer:Ch08 系統測試、BDD 與非功能性驗證;--theme:sqa-theme;" data-marpit-pagination-total="44">
<header>8.5 效能測試與負載工程</header>

<h2 id="%E6%95%88%E8%83%BD%E6%B8%AC%E8%A9%A6%E4%B8%89%E9%9A%8E%E6%AE%B5%E7%94%9F%E5%91%BD%E9%80%B1%E6%9C%9F-1%E8%A6%8F%E5%8A%83%E9%9A%8E%E6%AE%B5%E8%88%87%E5%B7%A5%E4%BD%9C%E8%B2%A0%E8%BC%89%E5%BB%BA%E6%A8%A1">效能測試三階段生命週期 (1)：規劃階段與工作負載建模</h2>
<div class="card-deck">
<blockquote>
<p><img class="emoji" draggable="false" alt="💡" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4a1.svg" data-marp-twemoji=""/> 效能測試分為「<strong>規劃 (Planning) ➔ 測試執行 (Execution) ➔ 結果分析 (Analysis)</strong>」三大階段；壓測成敗取決於工作負載的真實度！</p>
</blockquote>
<div class="two-columns">
<div class="card">
<h3 id="%F0%9F%93%8B-1-%E4%BD%BF%E7%94%A8%E8%BC%AA%E5%BB%93-usage-profile-%E8%88%87%E8%B2%A0%E8%BC%89%E5%BB%BA%E6%A8%A1"><img class="emoji" draggable="false" alt="📋" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4cb.svg" data-marp-twemoji=""/> 1. 使用輪廓 (Usage Profile) 與負載建模</h3>
<ul>
<li><strong>為什麼不能只拿單一 API 暴力狂轟？</strong>
<ul>
<li>真實系統中不同角色的操作比例截然不同；單點狂轟無法反映真實資料庫鎖定與快取命中率。</li>
</ul>
</li>
<li><strong>使用輪廓 (Usage Profile) 設計範例</strong>：
<ul>
<li><strong>電商網站平時輪廓</strong>：瀏覽首頁與商品 <code>70%</code>、搜尋商品 <code>20%</code>、加入購物車與結帳下單 <code>10%</code>。</li>
<li><strong><img class="emoji" draggable="false" alt="📝" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4dd.svg" data-marp-twemoji=""/> 課堂演練（線上考試系統使用輪廓）</strong>：
<ul>
<li><strong>開考前 3 分鐘（尖峰突波）</strong>：<code>90%</code> 學生集中執行「登入驗證 + 載入試卷題目」（高併發讀取與 Session 建立）。</li>
<li><strong>考試進行中（持壓期）</strong>：每隔 30~60 秒（<strong>必須加入測驗題思考時間 Think Time！</strong>）送出「單題作答暫存 API」。</li>
<li><strong>考試結束前 1 分鐘（寫入洪峰）</strong>：<code>85%</code> 學生同時按下「交卷批改與成績寫入」（高併發 DB 交易寫入）。</li>
</ul>
</li>
</ul>
</li>
</ul>
</div>
<div class="card">
<h3 id="%F0%9F%93%88-2-%E4%B8%89%E6%AE%B5%E5%BC%8F%E5%8A%A0%E5%A3%93%E6%9B%B2%E7%B7%9A%E8%A6%8F%E5%8A%83-ramping-strategy"><img class="emoji" draggable="false" alt="📈" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4c8.svg" data-marp-twemoji=""/> 2. 三段式加壓曲線規劃 (Ramping Strategy)</h3>
<ol>
<li><strong>上線暖身期 (Ramp-up)</strong>：
<ul>
<li>模擬使用者逐步上線，流量平滑爬升（如 2 分鐘內從 <code>0</code> 線性升至 <code>500 VUs</code>），觀察系統隨負載增加的變化。</li>
</ul>
</li>
<li><strong>高峰持壓期 (Peak Load / Steady State)</strong>：
<ul>
<li>維持目標尖峰流量持續一段時間（如維持 <code>500 VUs</code> 連續 10 分鐘），檢驗穩定態表現。</li>
</ul>
</li>
<li><strong>散場冷卻期 (Ramp-down / Cooldown)</strong>：
<ul>
<li>流量逐步歸零，檢驗記憶體、執行緒與 DB 連線池是否正常釋放。</li>
</ul>
</li>
</ol>
<ul>
<li><strong><img class="emoji" draggable="false" alt="🛡️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f6e1.svg" data-marp-twemoji=""/> 執行階段鐵律 (<code>Load as Code</code>)</strong>：
<ul>
<li><strong>壓測必須與系統監控同步進行</strong>（同時監控 Server CPU、RAM、DB Pool 與網路，絕不可將壓測與監控分開！），並在腳本中設定硬性 <strong>品質門檻 (Thresholds)</strong>。</li>
</ul>
</li>
</ul>
</div>
</div>
</div>
<footer>Ch08 系統測試、BDD 與非功能性驗證</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="28" data-paginate="true" data-header="8.5 效能測試與負載工程" data-footer="Ch08 系統測試、BDD 與非功能性驗證" data-theme="sqa-theme" lang="C" data-marpit-pagination="28" style="--paginate:true;--header:8.5 效能測試與負載工程;--footer:Ch08 系統測試、BDD 與非功能性驗證;--theme:sqa-theme;" data-marpit-pagination-total="44">
<header>8.5 效能測試與負載工程</header>

<h2 id="%E6%95%88%E8%83%BD%E6%B8%AC%E8%A9%A6%E4%B8%89%E9%9A%8E%E6%AE%B5%E7%94%9F%E5%91%BD%E9%80%B1%E6%9C%9F-2%E4%B8%89%E5%A4%A7%E9%BB%83%E9%87%91%E6%8C%87%E6%A8%99%E8%88%87%E9%A3%BD%E5%92%8C%E9%BB%9E%E5%88%86%E6%9E%90">效能測試三階段生命週期 (2)：三大黃金指標與飽和點分析</h2>
<div class="card-deck">
<blockquote>
<p><img class="emoji" draggable="false" alt="💡" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4a1.svg" data-marp-twemoji=""/> 分析壓測報告時，必須揚棄「平均數陷阱」，從<strong>延遲分位數 (P<sub>95</sub>/P<sub>99</sub>)</strong>、<strong>吞吐量高原</strong>與<strong>錯誤率</strong>找出系統飽和點 (Saturation Point)！</p>
</blockquote>
<div class="two-columns-64">
<div class="card">
<h3 id="%F0%9F%A5%87-%E4%B8%89%E5%A4%A7%E9%BB%83%E9%87%91%E6%8C%87%E6%A8%99%E8%88%87%E9%A3%BD%E5%92%8C%E9%BB%9E%E6%8B%90%E9%BB%9E-saturation-point"><img class="emoji" draggable="false" alt="🥇" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f947.svg" data-marp-twemoji=""/> 三大黃金指標與飽和點拐點 (<code>Saturation Point</code>)</h3>
<ol>
<li><strong>回應時間延遲分位數 (<code>P95</code> / <code>P99</code> Latency)</strong>：
<ul>
<li>平均值易被掩蓋；<strong>P<sub>95</sub> (95% 請求之最大延遲)</strong> 與 <strong>P<sub>99</sub> 長尾延遲</strong>才能反映高壓下使用者的真實痛苦。</li>
</ul>
</li>
<li><strong>系統吞吐量與飽和點 (<code>Throughput RPS &amp; Saturation</code>)</strong>：
<ul>
<li>隨並發人數增加，當 <strong>RPS 達到高原不再上升，且回應時間出現指數級急彎飆升</strong>時，該臨界點即為系統容量極限（<strong>飽和點</strong>）。</li>
</ul>
</li>
<li><strong>系統錯誤率 (<code>Total Error Rate</code>)</strong>：
<ul>
<li>監控 HTTP 5xx 崩潰、Timeout 逾時與拒絕連線比例。</li>
</ul>
</li>
</ol>
<ul>
<li><strong><img class="emoji" draggable="false" alt="🔍" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f50d.svg" data-marp-twemoji=""/> 伺服器與資料庫關聯排查</strong>：
<ul>
<li>比對飽和點發生瞬間，<strong>CPU 使用率是否突破 80%</strong>、記憶體是否頻繁 GC、資料庫是否出現<strong>慢查詢 (Slow Queries)</strong> 或鎖定等待 (Lock Contention)。</li>
</ul>
</li>
</ul>
</div>
<div class="card">
<p><img src="../../img/ch08/performance_testing_three_golden_metrics.jpg" alt="Three Golden Metrics" /></p>
<div class="two-columns">
<div>
<p><img src="../../img/ch08/rkdcnyBET.png" alt="Response Time Curve" /></p>
</div>
<div>
<p><img src="../../img/ch08/BJpnnkBVa.png" alt="CPU vs Response Time" /></p>
</div>
</div>
</div>
</div>
</div>
<footer>Ch08 系統測試、BDD 與非功能性驗證</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="29" data-paginate="true" data-header="8.5 效能測試與負載工程" data-footer="Ch08 系統測試、BDD 與非功能性驗證" data-theme="sqa-theme" lang="C" data-marpit-pagination="29" style="--paginate:true;--header:8.5 效能測試與負載工程;--footer:Ch08 系統測試、BDD 與非功能性驗證;--theme:sqa-theme;" data-marpit-pagination-total="44">
<header>8.5 效能測試與負載工程</header>

<h2 id="%E7%8F%BE%E4%BB%A3%E5%A3%93%E6%B8%AC%E9%9B%99%E6%B5%81%E6%B4%BE%E5%B0%8D%E6%B1%BAgrafana-k6-load-as-code-vs-apache-jmeter">現代壓測雙流派對決：Grafana k6 (Load as Code) vs. Apache JMeter</h2>
<div class="card-deck">
<blockquote>
<p><img class="emoji" draggable="false" alt="💡" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4a1.svg" data-marp-twemoji=""/> 掌握雲原生程式化壓測 <strong>k6</strong> 與企業級 GUI 壓測 <strong>Apache JMeter</strong> 的雙軌實戰技能！</p>
</blockquote>
<div class="two-columns">
<div class="card">
<h3 id="%F0%9F%9A%80-%E7%8F%BE%E4%BB%A3%E9%9B%B2%E5%8E%9F%E7%94%9F%E6%B5%81%E6%B4%BEk6-load-as-code"><img class="emoji" draggable="false" alt="🚀" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f680.svg" data-marp-twemoji=""/> 現代雲原生流派：k6 (<code>Load as Code</code>)</h3>
<ul>
<li><strong>核心優勢</strong>：以 JS/TS 撰寫腳本納入 Git 版控、Go 引擎單機輕鬆產生上萬 VUs、原生支援 CI/CD <strong><code>thresholds</code> 自動阻斷</strong>！</li>
</ul>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-javascript"><span class="hljs-keyword">import</span> http <span class="hljs-keyword">from</span> <span class="hljs-string">&#x27;k6/http&#x27;</span>;
<span class="hljs-keyword">import</span> { check, sleep } <span class="hljs-keyword">from</span> <span class="hljs-string">&#x27;k6&#x27;</span>;

<span class="hljs-keyword">export</span> <span class="hljs-keyword">const</span> options = {
  <span class="hljs-attr">stages</span>: [
    { <span class="hljs-attr">duration</span>: <span class="hljs-string">&#x27;30s&#x27;</span>, <span class="hljs-attr">target</span>: <span class="hljs-number">20</span> },  <span class="hljs-comment">// Ramp-up 暖身爬升</span>
    { <span class="hljs-attr">duration</span>: <span class="hljs-string">&#x27;1m&#x27;</span>,  <span class="hljs-attr">target</span>: <span class="hljs-number">100</span> }, <span class="hljs-comment">// Peak Load 高峰持壓</span>
    { <span class="hljs-attr">duration</span>: <span class="hljs-string">&#x27;20s&#x27;</span>, <span class="hljs-attr">target</span>: <span class="hljs-number">0</span> },   <span class="hljs-comment">// Ramp-down 散場降載</span>
  ],
  <span class="hljs-attr">thresholds</span>: { <span class="hljs-comment">// CI/CD 品質守門員：超標自動亮紅燈！</span>
    <span class="hljs-attr">http_req_duration</span>: [<span class="hljs-string">&#x27;p(95)&lt;250&#x27;</span>, <span class="hljs-string">&#x27;p(99)&lt;500&#x27;</span>],
    <span class="hljs-attr">http_req_failed</span>: [<span class="hljs-string">&#x27;rate&lt;0.01&#x27;</span>],
  },
};
<span class="hljs-keyword">export</span> <span class="hljs-keyword">default</span> <span class="hljs-keyword">function</span> (<span class="hljs-params"></span>) {
  <span class="hljs-keyword">const</span> res = http.<span class="hljs-title function_">post</span>(<span class="hljs-string">&#x27;http://localhost:8080/api/v1/orders&#x27;</span>);
  <span class="hljs-title function_">check</span>(res, { <span class="hljs-string">&#x27;狀態碼 200&#x27;</span>: <span class="hljs-function">(<span class="hljs-params">r</span>) =&gt;</span> r.<span class="hljs-property">status</span> === <span class="hljs-number">200</span> });
  <span class="hljs-title function_">sleep</span>(<span class="hljs-number">0.1</span>); <span class="hljs-comment">// 模擬使用者思考時間 (Think Time)</span>
}
</code></pre>
</div>
<div class="card">
<h3 id="%F0%9F%96%A5%EF%B8%8F-%E7%B6%93%E5%85%B8%E4%BC%81%E6%A5%AD%E7%B4%9A%E6%B5%81%E6%B4%BEapache-jmeter"><img class="emoji" draggable="false" alt="🖥️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f5a5.svg" data-marp-twemoji=""/> 經典企業級流派：Apache JMeter</h3>
<ul>
<li><strong>JMeter 核心特性與觀念辨析</strong>：
<ul>
<li>由 <strong>Apache 軟體基金會</strong>開發之開源 Java 壓測工具（非 GitHub 開發）。</li>
<li><strong>Thread Group (執行緒群組)</strong>：代表<strong>壓測端模擬的虛擬使用者並發數</strong>（而非受測系統是否開啟多工模式！）。</li>
<li><strong>HTTP(S) Test Script Recorder</strong>：內建 HTTP Proxy <strong>錄製與回放 (Record &amp; Replay)</strong> 功能，可搭配正則表達式過濾 <code>.jpg</code>/<code>.gif</code> 等靜態資源。</li>
<li><strong>Listeners (監聽器)</strong>：提供多元圖表、彙總報告與回應時間分佈樹。</li>
</ul>
</li>
<li><strong><img class="emoji" draggable="false" alt="🛠️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f6e0.svg" data-marp-twemoji=""/> JMeter 標準四步壓測實務 (<code>Lab 12 補充</code>)</strong>：
<ol>
<li><strong>設計擬真劇本</strong>（依不同角色與情境比重配置）。</li>
<li><strong>應用錄製器擷取基礎劇本</strong>並參數化擴充。</li>
<li><strong>結合監控軟體</strong>（同步監控 AP 伺服器、壓測端、網路與 DB）。</li>
<li><strong>綜合瓶頸分析</strong>（交叉比對不同壓力下之 AP 與資料庫表現）。</li>
</ol>
</li>
</ul>
</div>
</div>
</div>
<footer>Ch08 系統測試、BDD 與非功能性驗證</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="30" data-paginate="true" data-header="8.5 效能測試與負載工程" data-footer="Ch08 系統測試、BDD 與非功能性驗證" data-theme="sqa-theme" lang="C" data-marpit-pagination="30" style="--paginate:true;--header:8.5 效能測試與負載工程;--footer:Ch08 系統測試、BDD 與非功能性驗證;--theme:sqa-theme;" data-marpit-pagination-total="44">
<header>8.5 效能測試與負載工程</header>

<h2 id="%E6%A6%82%E5%BF%B5%E6%A0%B8%E5%B0%8D%E5%95%8F%E7%AD%94-ccq-4">概念核對問答 (CCQ 4)</h2>
<div class="ccq-columns">
<div class="ccq-text">

<p><strong>問題情境</strong>：<br />
在規劃與執行 Web 系統的效能與壓力測試時，關於工作負載指標與測試執行原則，下列哪一項敘述是<strong>最正確</strong>的？</p>
<ul>
<li><strong>A)</strong> 網站的 Hit (請求點擊數) 越高代表獨立造訪人數越多，且壓力測試應與伺服器系統監控分開執行以免干擾數據</li>
<li><strong>B)</strong> 使用輪廓 (Usage Profile) 是設計工作流量的重要依據，且 <code>Page View / Session</code> 越高代表每次進入系統瀏覽越多網頁</li>
<li><strong>C)</strong> JMeter 中的 Thread (執行緒) 數量是指受測伺服器端是否開啟多工模式，且 JMeter 不具備錄製回放 (Record &amp; Replay) 功能</li>
<li><strong>D)</strong> 當系統達到飽和點 (Saturation Point) 時，吞吐量 (RPS) 會持續線性暴增，而回應時間則會保持平坦不變</li>
</ul>
</div>

</div>
</div>
