</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="31" data-paginate="true" data-header="8.6 相容性測試" data-footer="Ch08 系統測試、BDD 與非功能性驗證" data-class="lead" data-theme="sqa-theme" lang="C" class="lead" data-marpit-pagination="31" style="--paginate:true;--header:8.6 相容性測試;--footer:Ch08 系統測試、BDD 與非功能性驗證;--class:lead;--theme:sqa-theme;" data-marpit-pagination-total="44">
<header>8.6 相容性測試</header>

<h1 id="86-%E7%9B%B8%E5%AE%B9%E6%80%A7%E6%B8%AC%E8%A9%A6-compatibility-testing"><strong>8.6 相容性測試 (Compatibility Testing)</strong></h1>
<blockquote>
<p>「在開發者的 MacBook Chrome 上完美運行，<br />
不代表在客戶的 Windows Edge、iPhone Safari 或舊版資料庫上不會版面崩壞！」</p>
</blockquote>
<footer>Ch08 系統測試、BDD 與非功能性驗證</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="32" data-paginate="true" data-header="8.6 相容性測試" data-footer="Ch08 系統測試、BDD 與非功能性驗證" data-theme="sqa-theme" lang="C" data-marpit-pagination="32" style="--paginate:true;--header:8.6 相容性測試;--footer:Ch08 系統測試、BDD 與非功能性驗證;--theme:sqa-theme;" data-marpit-pagination-total="44">
<header>8.6 相容性測試</header>

<h2 id="%E8%B7%A8%E7%92%B0%E5%A2%83%E7%9B%B8%E5%AE%B9%E6%80%A7%E6%B8%AC%E8%A9%A6%E8%88%87%E5%AE%98%E6%96%B9%E8%AA%8D%E8%AD%89%E6%B8%AC%E8%A9%A6-certification-testing">跨環境相容性測試與官方認證測試 (Certification Testing)</h2>
<div class="card-deck">
<blockquote>
<p><img class="emoji" draggable="false" alt="💡" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4a1.svg" data-marp-twemoji=""/> 檢驗系統在各種硬體機器、作業系統、資料庫、網頁伺服器、瀏覽器與不同軟體版本間的交互運作一致性。</p>
</blockquote>
<div class="two-columns">
<div class="card">
<h3 id="%F0%9F%8C%90-%E5%A4%9A%E7%B6%AD%E5%BA%A6%E7%92%B0%E5%A2%83%E8%88%87%E7%B6%B2%E9%A0%81%E7%9B%B8%E5%AE%B9%E6%80%A7%E6%B8%AC%E8%A9%A6"><img class="emoji" draggable="false" alt="🌐" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f310.svg" data-marp-twemoji=""/> 多維度環境與網頁相容性測試</h3>
<ul>
<li><strong>1. 系統基礎設施相容性</strong>：
<ul>
<li><strong>硬體與主機</strong>：從大型主機（IBM 360, HP 9000）到現代 x86 / ARM (Apple Silicon) 架構。</li>
<li><strong>作業系統與中介軟體</strong>：Linux, Windows, macOS；資料庫（Oracle, SQL Server, PostgreSQL）；網頁伺服器（Apache, Nginx, Tomcat）。</li>
<li><strong>版本向後/向前相容</strong>：同款軟體不同版本（如舊版瀏覽器或舊版 OS API）常存在相容性斷裂。</li>
</ul>
</li>
<li><strong>2. 網頁與行動端相容性五大要求</strong>：
<ul>
<li><strong>跨瀏覽器視覺一致</strong>：Chrome (Blink)、Safari (WebKit)、Firefox (Gecko) 渲染體驗一致。</li>
<li><strong>跨瀏覽器功能一致</strong>：JS 事件與表單回應行為一致。</li>
<li><strong>電信商與網路相容</strong>：支援不同電信網路環境（4G/5G/弱網）。</li>
<li><strong>行動裝置硬體碎片化</strong>：不同手機型號、螢幕尺寸與解析度 (RWD)。</li>
</ul>
</li>
</ul>
</div>
<div class="card">
<h3 id="%F0%9F%8F%85-%E7%89%B9%E6%AE%8A%E9%A1%9E%E5%9E%8B%E8%AA%8D%E8%AD%89%E6%B8%AC%E8%A9%A6-certification-testing"><img class="emoji" draggable="false" alt="🏅" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f3c5.svg" data-marp-twemoji=""/> 特殊類型：認證測試 (Certification Testing)</h3>
<ul>
<li><strong>什麼是認證測試？</strong>
<ul>
<li>主要由<strong>產品發行廠商 (Vendor)</strong> 執行的嚴格相容性驗證，旨在向企業客戶保證其軟體產品能穩定運行於哪些特定硬體與作業系統組合上。</li>
</ul>
</li>
<li><strong>企業實務案例</strong>：
<ul>
<li>如 <strong>Microsoft SQL Server</strong> 或 <strong>Oracle Database</strong> 發行新版本時，原廠會在各種伺服器硬體與 Linux/Windows 版本上進行詳盡測試，並於官網發布<strong>官方相容性認證矩陣 (Compatibility Matrix)</strong>。</li>
<li>企業與軟體公司在<strong>採購硬體或規劃系統升級時</strong>，皆以此認證清單作為合規與維運保障的關鍵依據！</li>
</ul>
</li>
<li><strong>自動化相容性策略</strong>：
<ul>
<li>結合 <strong>Playwright 多瀏覽器矩陣 (Projects)</strong> 與雲端真機農場（BrowserStack / Sauce Labs）在 CI 中平行驗證。</li>
</ul>
</li>
</ul>
</div>
</div>
</div>
<footer>Ch08 系統測試、BDD 與非功能性驗證</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="33" data-paginate="true" data-header="8.7 安全性測試 (Security Testing)" data-footer="Ch08 系統測試、BDD 與非功能性驗證" data-class="lead" data-theme="sqa-theme" lang="C" class="lead" data-marpit-pagination="33" style="--paginate:true;--header:8.7 安全性測試 (Security Testing);--footer:Ch08 系統測試、BDD 與非功能性驗證;--class:lead;--theme:sqa-theme;" data-marpit-pagination-total="44">
<header>8.7 安全性測試 (Security Testing)</header>

<h1 id="87-%E5%AE%89%E5%85%A8%E6%80%A7%E6%B8%AC%E8%A9%A6-security-testing"><strong>8.7 安全性測試 (Security Testing)</strong></h1>
<blockquote>
<p>「功能測試驗證系統『做了該做的事 (Happy Path)』；<br />
安全性測試則是切換為攻擊者思維，驗證系統『無法被誘導去做不該做的事』！」</p>
</blockquote>
<footer>Ch08 系統測試、BDD 與非功能性驗證</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="34" data-paginate="true" data-header="8.7 安全性測試 (Security Testing)" data-footer="Ch08 系統測試、BDD 與非功能性驗證" data-theme="sqa-theme" lang="C" data-marpit-pagination="34" style="--paginate:true;--header:8.7 安全性測試 (Security Testing);--footer:Ch08 系統測試、BDD 與非功能性驗證;--theme:sqa-theme;" data-marpit-pagination-total="44">
<header>8.7 安全性測試 (Security Testing)</header>

<h2 id="%E6%94%BB%E6%93%8A%E8%80%85%E6%80%9D%E7%B6%ADiso-25010-%E5%AE%89%E5%85%A8%E5%85%AD%E7%B6%AD%E5%BA%A6%E8%88%87-owasp-top-10">攻擊者思維、ISO 25010 安全六維度與 OWASP Top 10</h2>
<div class="card-deck">
<blockquote>
<p><img class="emoji" draggable="false" alt="💡" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4a1.svg" data-marp-twemoji=""/> 在 ISO 25010 品質模型中，安全性涵蓋<strong>機密性 (Confidentiality)、完整性 (Integrity)、不可否認性 (Non-repudiation)、可歸責性 (Accountability)、真實性 (Authenticity)</strong> 與抗拒授權漏洞。</p>
</blockquote>
<div class="two-columns">
<div class="card">
<h3 id="%F0%9F%9A%A8-owasp-top-10-%E6%A0%B8%E5%BF%83-web-%E9%A2%A8%E9%9A%AA%E7%B2%BE%E6%9E%90"><img class="emoji" draggable="false" alt="🚨" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f6a8.svg" data-marp-twemoji=""/> OWASP Top 10 核心 Web 風險精析</h3>
<ol>
<li><strong>A01: 失效的存取控制 (Broken Access Control)</strong>：
<ul>
<li><strong>水平越權</strong>（A 用戶偷看 B 用戶訂單）與<strong>垂直越權</strong>（一般用戶直接呼叫管理員 API）。</li>
</ul>
</li>
<li><strong>A02: 加密機制失效 (Cryptographic Failures)</strong>：
<ul>
<li>明文儲存密碼、使用已被破解之弱雜湊（MD5/SHA1）、未強制啟用 HTTPS/TLS。</li>
</ul>
</li>
<li><strong>A03: 注入攻擊 (Injection)</strong>：
<ul>
<li><strong>SQL Injection</strong>、Command Injection、<strong>XSS (跨站腳本攻擊)</strong>。</li>
</ul>
</li>
<li><strong>A04: 不安全設計 (Insecure Design)</strong>：
<ul>
<li>缺乏威脅建模與業務防禦邏輯（如未限制密碼重設嘗試次數）。</li>
</ul>
</li>
<li><strong>A05: 安全設定缺陷 (Security Misconfiguration)</strong>：
<ul>
<li>未改預設密碼、生產環境未關閉 Debug 模式暴露 Stack Trace。</li>
</ul>
</li>
<li><strong>A06: 易受攻擊與過時組件 (Outdated Components)</strong>：
<ul>
<li>引入含已知 <strong>CVE</strong> 漏洞的第三方開源套件（如 <code>Log4j</code> 核彈級漏洞）。</li>
</ul>
</li>
</ol>
</div>
<div class="card">
<h3 id="%F0%9F%92%89-%E7%B6%93%E5%85%B8%E6%94%BB%E9%98%B2%E5%B0%8D%E7%85%A7sql-injection-%E8%88%87%E5%8F%83%E6%95%B8%E5%8C%96%E6%9F%A5%E8%A9%A2"><img class="emoji" draggable="false" alt="💉" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f489.svg" data-marp-twemoji=""/> 經典攻防對照：SQL Injection 與參數化查詢</h3>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-comment">// <img class="emoji" draggable="false" alt="❌" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/274c.svg" data-marp-twemoji=""/> 致命危險寫法：字串直接拼接 SQL</span>
<span class="hljs-comment">// 若攻擊者輸入 userInput = &quot;&#x27; OR &#x27;1&#x27;=&#x27;1&quot;</span>
<span class="hljs-comment">// 條件恆為真，無須密碼直接繞過登入！</span>
<span class="hljs-type">String</span> <span class="hljs-variable">sql</span> <span class="hljs-operator">=</span> <span class="hljs-string">&quot;SELECT * FROM users WHERE user = &#x27;&quot;</span> +
             userInput + <span class="hljs-string">&quot;&#x27; AND pass = &#x27;&quot;</span> + pass + <span class="hljs-string">&quot;&#x27;&quot;</span>;

<span class="hljs-comment">// <img class="emoji" draggable="false" alt="✅" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/2705.svg" data-marp-twemoji=""/> 安全防禦寫法：PreparedStatement 參數化預編譯</span>
<span class="hljs-comment">// 外部輸入一律被視為純文字參數，絕不改變 SQL 語法樹！</span>
<span class="hljs-type">String</span> <span class="hljs-variable">sql</span> <span class="hljs-operator">=</span> <span class="hljs-string">&quot;SELECT * FROM users WHERE user = ? AND pass = ?&quot;</span>;
<span class="hljs-type">PreparedStatement</span> <span class="hljs-variable">pstmt</span> <span class="hljs-operator">=</span> conn.prepareStatement(sql);
pstmt.setString(<span class="hljs-number">1</span>, userInput);
pstmt.setString(<span class="hljs-number">2</span>, pass);
<span class="hljs-type">ResultSet</span> <span class="hljs-variable">rs</span> <span class="hljs-operator">=</span> pstmt.executeQuery();
</code></pre>
<ul>
<li><strong>黃金安全鐵律</strong>：<strong>永不信任任何外部輸入 (Never Trust User Input)</strong>！所有輸入皆須經過白名單驗證、編碼跳脫與參數化處理。</li>
</ul>
</div>
</div>
</div>
<footer>Ch08 系統測試、BDD 與非功能性驗證</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="35" data-paginate="true" data-header="8.7 安全性測試 (Security Testing)" data-footer="Ch08 系統測試、BDD 與非功能性驗證" data-theme="sqa-theme" lang="C" data-marpit-pagination="35" style="--paginate:true;--header:8.7 安全性測試 (Security Testing);--footer:Ch08 系統測試、BDD 與非功能性驗證;--theme:sqa-theme;" data-marpit-pagination-total="44">
<header>8.7 安全性測試 (Security Testing)</header>

<h2 id="%E5%AE%89%E5%85%A8%E6%B8%AC%E8%A9%A6%E5%9B%9B%E5%A4%A7%E6%A0%B8%E5%BF%83%E4%BD%9C%E6%B3%95%E8%88%87%E6%A8%99%E6%BA%96%E5%9B%9B%E6%AD%A5%E5%9F%B7%E8%A1%8C%E7%A8%8B%E5%BA%8F">安全測試四大核心作法與標準四步執行程序</h2>
<div class="card-deck">
<blockquote>
<p><img class="emoji" draggable="false" alt="💡" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4a1.svg" data-marp-twemoji=""/> 將安全防線左移 (Shift-Left Security / DevSecOps)，結合靜態、動態、供應鏈與模糊測試，並依循 STRIDE 與 CVSS 標準把關！</p>
</blockquote>
<div class="two-columns-64">
<div class="card">
<h3 id="%F0%9F%9B%A1%EF%B8%8F-%E5%9B%9B%E5%A4%A7%E5%AE%89%E5%85%A8%E6%B8%AC%E8%A9%A6%E6%8A%80%E8%A1%93-sast--dast--sca--fuzzing"><img class="emoji" draggable="false" alt="🛡️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f6e1.svg" data-marp-twemoji=""/> 四大安全測試技術 (SAST / DAST / SCA / Fuzzing)</h3>
<ol>
<li><strong>SAST (<code>Static Application Security Testing</code>，靜態白箱)</strong>：
<ul>
<li>於編譯期掃描原始碼，揪出硬編碼金鑰 (Hardcoded Secrets)、SQL 字串拼接或危險 API。</li>
</ul>
</li>
<li><strong>DAST (<code>Dynamic Application Security Testing</code>，動態黑箱)</strong>：
<ul>
<li>系統運行時從外部 HTTP 介面模擬駭客發送惡意 Payload（如 <code>' OR 1=1 --</code>、<code>&lt;script&gt;</code>），檢驗是否被攻破（如 OWASP ZAP）。</li>
</ul>
</li>
<li><strong>SCA (<code>Software Composition Analysis</code>，軟體成分分析)</strong>：
<ul>
<li>掃描 <code>pom.xml</code> / <code>package.json</code> 第三方依賴，比對 <strong>NVD (國家漏洞資料庫)</strong> 攔截含 <strong>CVE</strong> 漏洞之套件。</li>
</ul>
</li>
<li><strong>Fuzzing (<code>Coverage-guided Fuzzing</code>，模糊安全測試)</strong>：
<ul>
<li>如 <strong>Google Jazzer</strong>，利用位元組碼插樁自動生成突變 Byte 陣列餵給解析器，挖掘 NPE、OOM 或未捕獲崩潰（<code>Lab 13</code>）。</li>
</ul>
</li>
</ol>
</div>
<div class="card">
<p><img src="../../img/ch08/security_testing_pipeline.jpg" alt="Security Testing Pipeline" /></p>
<h3 id="%F0%9F%93%8B-%E5%AE%89%E5%85%A8%E6%B8%AC%E8%A9%A6%E6%A8%99%E6%BA%96%E5%9B%9B%E6%AD%A5%E7%A8%8B%E5%BA%8F"><img class="emoji" draggable="false" alt="📋" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4cb.svg" data-marp-twemoji=""/> 安全測試標準四步程序</h3>
<ul>
<li><strong>Step 1：STRIDE 威脅建模</strong>：分析 <strong>S</strong>poofing(假冒)、<strong>T</strong>ampering(篡改)、<strong>R</strong>epudiation(抵賴)、<strong>I</strong>nfo Disclosure(外洩)、<strong>D</strong>oS(阻斷)、<strong>E</strong>levation of Privilege(提權)。</li>
<li><strong>Step 2：定義安全基準</strong>：依循 <strong>OWASP ASVS</strong> 規範密碼、Session 與防重放。</li>
<li><strong>Step 3：CI/CD 多維掃描 + 滲透測試</strong>。</li>
<li><strong>Step 4：CVSS 漏洞分級門檻</strong>：依 <strong>CVSS (0~10分)</strong>，凡屬 <strong>Critical (&gt;9.0) 或 High (&gt;7.0)</strong> 強制阻斷發布！</li>
</ul>
</div>
</div>
</div>
<footer>Ch08 系統測試、BDD 與非功能性驗證</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="36" data-paginate="true" data-header="8.7 安全性測試 (Security Testing)" data-footer="Ch08 系統測試、BDD 與非功能性驗證" data-theme="sqa-theme" lang="C" data-marpit-pagination="36" style="--paginate:true;--header:8.7 安全性測試 (Security Testing);--footer:Ch08 系統測試、BDD 與非功能性驗證;--theme:sqa-theme;" data-marpit-pagination-total="44">
<header>8.7 安全性測試 (Security Testing)</header>

</ul>
</div>

<h1 id="88-%E5%9B%9E%E5%BE%A9%E6%80%A7%E8%88%87%E5%BD%88%E6%80%A7%E6%B8%AC%E8%A9%A6-recoverability--resilience-testing"><strong>8.8 回復性與彈性測試 (Recoverability &amp; Resilience Testing)</strong></h1>

</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="38" data-paginate="true" data-header="8.8 回復性與彈性測試 (Resilience)" data-footer="Ch08 系統測試、BDD 與非功能性驗證" data-theme="sqa-theme" lang="C" data-marpit-pagination="38" style="--paginate:true;--header:8.8 回復性與彈性測試 (Resilience);--footer:Ch08 系統測試、BDD 與非功能性驗證;--theme:sqa-theme;" data-marpit-pagination-total="44">
<header>8.8 回復性與彈性測試 (Resilience)</header>

<h2 id="%E5%9B%9E%E5%BE%A9%E6%80%A7%E6%B8%AC%E8%A9%A6%E6%A0%B8%E5%BF%83%E8%A7%80%E5%BF%B5%E8%88%87%E5%9B%9B%E5%A4%A7%E9%97%9C%E9%8D%B5%E6%99%82%E9%96%93%E8%BB%B8%E6%8C%87%E6%A8%99">回復性測試核心觀念與四大關鍵時間軸指標</h2>
<div class="card-deck">
<blockquote>
<p><img class="emoji" draggable="false" alt="💡" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4a1.svg" data-marp-twemoji=""/> 回復性測試檢驗系統遭遇斷電、網路分區或 DB 當機時，能否保護資料一致性並在時限內恢復正常服務。</p>
</blockquote>
<div class="two-columns-64">
<div class="card">
<h3 id="%E2%8F%B1%EF%B8%8F-%E9%AB%98%E5%8F%AF%E7%94%A8%E8%88%87%E7%81%BD%E9%9B%A3%E5%BE%A9%E5%8E%9F%E5%9B%9B%E5%A4%A7%E9%BB%83%E9%87%91%E6%8C%87%E6%A8%99-mtbf--rpo--rto--mttr"><img class="emoji" draggable="false" alt="⏱️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/23f1.svg" data-marp-twemoji=""/> 高可用與災難復原四大黃金指標 (<code>MTBF / RPO / RTO / MTTR</code>)</h3>
<ol>
<li><strong>MTBF (<code>Mean Time Between Failures</code>，平均故障間隔時間)</strong>：
<ul>
<li>兩次故障之間的<strong>平均正常穩定運轉時間</strong>（衡量系統可靠度 Stability，<strong>愈長愈穩定</strong>）。</li>
</ul>
</li>
<li><strong>RPO (<code>Recovery Point Objective</code>，復原點目標 — 往前回溯資料面)</strong>：
<ul>
<li>災難發生時，業務能容忍的<strong>最大資料遺失時間窗口</strong>（例如 <code>RPO = 0</code> 代表金融系統不允許遺失任何一筆已確認交易；決定備份與同步頻率）。</li>
</ul>
</li>
<li><strong>RTO (<code>Recovery Time Objective</code>，復原時間目標 — 往後推算服務面)</strong>：
<ul>
<li>災難發生後，業務能容忍的<strong>最大停機時間上限</strong>（例如 <code>RTO = 5 分鐘</code> 代表系統必須在 5 分鐘內完成備援切換並恢復對外服務）。</li>
</ul>
</li>
<li><strong>MTTR (<code>Mean Time to Recovery</code>，平均修復時間 — 實際耗時)</strong>：
<ul>
<li>工程團隊或自動自癒機制從故障發生到完全恢復服務的<strong>實際平均耗時</strong>（必須確保 <strong><code>MTTR ≤ RTO</code></strong>，現代雲原生追求秒級自癒）。</li>
</ul>
</li>
</ol>
</div>
<div class="card">
<p><img src="../../img/ch08/system_resilience_timeline_metrics.jpg" alt="Resilience Timeline Metrics" /></p>
<blockquote>
<p><img class="emoji" draggable="false" alt="🎯" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f3af.svg" data-marp-twemoji=""/> <strong>一眼分清 RPO vs. RTO</strong>：</p>
<ul>
<li><strong>RPO 看過去（資料遺失量）</strong>：「最多能丟掉幾分鐘前的資料？」</li>
<li><strong>RTO 看未來（停機容忍度）</strong>：「最多能停機幾分鐘不服務？」</li>
</ul>
</blockquote>
</div>
</div>
</div>
<footer>Ch08 系統測試、BDD 與非功能性驗證</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="39" data-paginate="true" data-header="8.8 回復性與彈性測試 (Resilience)" data-footer="Ch08 系統測試、BDD 與非功能性驗證" data-theme="sqa-theme" lang="C" data-marpit-pagination="39" style="--paginate:true;--header:8.8 回復性與彈性測試 (Resilience);--footer:Ch08 系統測試、BDD 與非功能性驗證;--theme:sqa-theme;" data-marpit-pagination-total="44">
<header>8.8 回復性與彈性測試 (Resilience)</header>

<h2 id="%E5%9B%9E%E5%BE%A9%E6%80%A7%E6%B8%AC%E8%A9%A6%E5%9B%9B%E5%A4%A7%E5%AF%A6%E6%96%BD%E4%BD%9C%E6%B3%95%E8%88%87%E6%A8%99%E6%BA%96%E5%9B%9B%E6%AD%A5%E5%9F%B7%E8%A1%8C%E7%A8%8B%E5%BA%8F">回復性測試四大實施作法與標準四步執行程序</h2>
<div class="card-deck">
<blockquote>
<p><img class="emoji" draggable="false" alt="💡" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4a1.svg" data-marp-twemoji=""/> 若系統要具備優異的回復度，架構設計時必須內建 <strong>WAL 交易日誌、斷路器熔斷降級、主從自動容錯移轉</strong>，並透過混沌工程主動驗證！</p>
</blockquote>
<div class="two-columns">
<div class="card">
<h3 id="%F0%9F%9B%A0%EF%B8%8F-%E5%9B%9E%E5%BE%A9%E6%80%A7%E6%B8%AC%E8%A9%A6%E5%9B%9B%E5%A4%A7%E5%AF%A6%E6%88%B0%E4%BD%9C%E6%B3%95"><img class="emoji" draggable="false" alt="🛠️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f6e0.svg" data-marp-twemoji=""/> 回復性測試四大實戰作法</h3>
<ol>
<li><strong>資料庫交易回滾測試 (<code>Transaction Rollback &amp; WAL</code>)</strong>：
<ul>
<li>於跨表轉帳第 2 步強行切斷 DB 連線，驗證能否靠 <strong>WAL (<code>Write-Ahead Logging</code>)</strong> 與 ACID 交易正確回滾，杜絕「A 扣款但 B 未入帳」！</li>
</ul>
</li>
<li><strong>斷路器與服務降級測試 (<code>Circuit Breaker &amp; Fallback</code>)</strong>：
<ul>
<li>以 <strong>Resilience4j</strong> 在下游支付超時或錯誤率 &gt; 50% 時自動熔斷並切換 Fallback 降級隊列，保護主系統不被拖垮。</li>
</ul>
</li>
<li><strong>故障轉移與主從切換測試 (<code>Failover Testing</code>)</strong>：
<ul>
<li>直接殺死 Primary DB，驗證 Sentinel 能否在數秒內將 Replica 升為主節點且客戶端自動重連。</li>
</ul>
</li>
<li><strong>混沌工程故障注入 (<code>Chaos Engineering</code>)</strong>：
<ul>
<li>主動隨機殺死 Pod、注入 3000ms 延遲或模擬磁碟滿載。</li>
</ul>
</li>
</ol>
</div>
<div class="card">
<h3 id="%F0%9F%94%84-%E5%9B%9E%E5%BE%A9%E6%80%A7%E6%B8%AC%E8%A9%A6%E5%9B%9B%E6%AD%A5%E6%A8%99%E6%BA%96%E7%A8%8B%E5%BA%8F--resilience4j-%E5%AF%A6%E6%88%B0"><img class="emoji" draggable="false" alt="🔄" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f504.svg" data-marp-twemoji=""/> 回復性測試四步標準程序 &amp; Resilience4j 實戰</h3>
<ol>
<li><strong>Step 1：建立穩態假說 (<code>Steady State Hypothesis</code>)</strong>：定義正常指標（如 <code>500 RPS</code>, <code>P99 &lt; 200ms</code>, <code>Error &lt; 0.1%</code>）。</li>
<li><strong>Step 2：注入真實故障 (<code>Inject Faults</code>)</strong>：模擬斷網、斷電、OOM、第三方支付癱瘓。</li>
<li><strong>Step 3：驗證自癒與量測 <code>MTTR</code> (<code>Observe &amp; Measure</code>)</strong>。</li>
<li><strong>Step 4：稽核資料一致性 (<code>Audit Data Consistency</code>)</strong>：確認無髒資料或雙重扣款。</li>
</ol>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-comment">// Lab 13: Resilience4j 斷路器與重試自癒防線</span>
<span class="hljs-meta">@CircuitBreaker(name = &quot;paymentSvc&quot;, fallbackMethod = &quot;fallback&quot;)</span>
<span class="hljs-meta">@Retry(name = &quot;paymentSvc&quot;)</span>
<span class="hljs-keyword">public</span> <span class="hljs-type">OrderResult</span> <span class="hljs-title function_">processOrder</span><span class="hljs-params">(Order order)</span> {
    <span class="hljs-keyword">return</span> paymentClient.charge(order);
}
<span class="hljs-keyword">public</span> <span class="hljs-type">OrderResult</span> <span class="hljs-title function_">fallback</span><span class="hljs-params">(Order order, Throwable t)</span> {
    <span class="hljs-keyword">return</span> <span class="hljs-keyword">new</span> <span class="hljs-title class_">OrderResult</span>(order.getId(), PENDING_QUEUE, <span class="hljs-string">&quot;進入非同步隊列&quot;</span>);
}
</code></pre>
</div>
</div>
</div>
<footer>Ch08 系統測試、BDD 與非功能性驗證</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="40" data-paginate="true" data-header="8.8 回復性與彈性測試 (Resilience)" data-footer="Ch08 系統測試、BDD 與非功能性驗證" data-theme="sqa-theme" lang="C" data-marpit-pagination="40" style="--paginate:true;--header:8.8 回復性與彈性測試 (Resilience);--footer:Ch08 系統測試、BDD 與非功能性驗證;--theme:sqa-theme;" data-marpit-pagination-total="44">
<header>8.8 回復性與彈性測試 (Resilience)</header>

<h2 id="%E6%A6%82%E5%BF%B5%E6%A0%B8%E5%B0%8D%E5%95%8F%E7%AD%94-ccq-6">概念核對問答 (CCQ 6)</h2>
<div class="ccq-columns">
<div class="ccq-text">

<p><strong>問題情境</strong>：<br />
某銀行核心轉帳系統在災難復原規格書中規定：「當主機房發生斷電災難時，備援機房必須在 <strong>3 分鐘內</strong>完成切換並恢復對外轉帳服務；且已確認之交易紀錄<strong>不允許遺失任何一筆（0 秒資料遺失）</strong>。」請問這兩項要求依序對應至哪兩個回復性指標？</p>
<ul>
<li><strong>A)</strong> MTBF = 3 分鐘，MTTR = 0 秒</li>
<li><strong>B)</strong> RPO = 3 分鐘，RTO = 0 秒</li>
<li><strong>C)</strong> RTO = 3 分鐘，RPO = 0 秒</li>
<li><strong>D)</strong> MTTR = 3 分鐘，MTBF = 0 秒</li>
</ul>
</div>

</div>
</div>

</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="41" data-paginate="true" data-header="8.9 課堂實習與綜合演練" data-footer="Ch08 系統測試、BDD 與非功能性驗證" data-theme="sqa-theme" lang="C" data-marpit-pagination="41" style="--paginate:true;--header:8.9 課堂實習與綜合演練;--footer:Ch08 系統測試、BDD 與非功能性驗證;--theme:sqa-theme;" data-marpit-pagination-total="44">
<header>8.9 課堂實習與綜合演練</header>

<h2 id="%F0%9F%A7%AA-89-%E8%AA%B2%E5%A0%82%E5%AF%A6%E7%BF%92%E6%8C%87%E5%BC%95-labdemo-ch08-%E5%85%A8%E5%A5%97%E5%AF%A6%E6%88%B0%E6%BC%94%E7%B7%B4"><img class="emoji" draggable="false" alt="🧪" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f9ea.svg" data-marp-twemoji=""/> 8.9 課堂實習指引 (LabDemo Ch08 全套實戰演練)</h2>
<div class="card-deck">
<blockquote>
<p><img class="emoji" draggable="false" alt="💡" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4a1.svg" data-marp-twemoji=""/> 本章對應 <code>LabDemo</code> 四大現代系統測試實習模組，從 BDD 活文件、微服務契約與 Playwright，一路涵蓋 k6 壓測、Jazzer 模糊測試與混沌工程！</p>
</blockquote>
<div class="two-columns">
<div class="card">
<h3 id="%F0%9F%A5%92-%E5%AF%A6%E7%BF%92-abdd%E5%A5%91%E7%B4%84%E8%88%87-web-e2e-u08--u09"><img class="emoji" draggable="false" alt="🥒" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f952.svg" data-marp-twemoji=""/> 實習 A：BDD、契約與 Web E2E (<code>u08 / u09</code>)</h3>
<ul>
<li><strong>1. Cucumber BDD 活文件實戰 (<a href="../../lab.html?file=LabDemo/docs/u09_cucumber_bdd/bmi_cucumber.md"><code>bmi_cucumber.md</code></a>)</strong>：
<ul>
<li>執行 <a href="../../lab.html?file=LabDemo/src/test/java/u08_cucumber/bmi/RunCucumberTest.java"><code>RunCucumberTest.java</code></a> 與 <a href="../../lab.html?file=LabDemo/src/test/java/u08_cucumber/bmi/BMICalculatorStepDefs.java"><code>BMICalculatorStepDefs.java</code></a>，觀察 <code>Scenario Outline</code> 表格如何自動驅動測試。</li>
<li>延伸體驗電商註冊 (<a href="../../lab.html?file=LabDemo/src/test/java/u08_cucumber/ecommerce/Register.java"><code>Register.java</code></a>)、登入 (<a href="../../lab.html?file=LabDemo/src/test/java/u08_cucumber/ecommerce/Login.java"><code>Login.java</code></a>) 與購物車 (<a href="../../lab.html?file=LabDemo/src/test/java/u08_cucumber/ecommerce/Cart.java"><code>Cart.java</code></a>) BDD 劇本。</li>
</ul>
</li>
<li><strong>2. Pact 契約與 Playwright E2E (<code>Lab 11</code>)</strong>：
<ul>
<li>手冊：<a href="../../lab.html?file=LabDemo/docs/u09_cucumber_bdd/pact_and_playwright.md">pact_and_playwright.md</a></li>
<li>演練 Consumer-Driven <code>V4Pact</code> 契約生成，以及 <a href="../../lab.html?file=LabDemo/src/test/java/u09_web/bmi/BMICalculatorTest.java"><code>BMICalculatorTest.java</code></a> 與 Playwright 自動等待、Trace 錄影！</li>
</ul>
</li>
</ul>
</div>
<div class="card">
<h3 id="%E2%9A%A1-%E5%AF%A6%E7%BF%92-bk6-%E9%AB%98%E4%BD%B5%E7%99%BC%E5%A3%93%E6%B8%AC%E8%88%87%E6%B7%B7%E6%B2%8C%E6%A8%A1%E7%B3%8A%E6%B8%AC%E8%A9%A6-u10"><img class="emoji" draggable="false" alt="⚡" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/26a1.svg" data-marp-twemoji=""/> 實習 B：k6 高併發壓測與混沌模糊測試 (<code>u10</code>)</h3>
<ul>
<li><strong>3. k6 Load as Code 效能工程 (<code>Lab 12</code>)</strong>：
<ul>

<header>8.9 課堂實習與綜合演練</header>

<h2 id="%E7%B6%9C%E5%90%88%E6%83%85%E5%A2%83%E6%BC%94%E7%B7%B4%E5%85%AD%E5%A4%A7%E7%9C%9F%E5%AF%A6%E7%B3%BB%E7%B5%B1%E4%B9%8B%E7%B3%BB%E7%B5%B1%E6%B8%AC%E8%A9%A6%E5%BC%B7%E5%8C%96%E9%87%8D%E9%BB%9E">綜合情境演練：六大真實系統之系統測試強化重點</h2>
<div class="card-deck">
<blockquote>
<p><img class="emoji" draggable="false" alt="💡" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4a1.svg" data-marp-twemoji=""/> 不同業務屬性的系統，其風險命脈截然不同！請分析下列六大真實系統，討論各自最應優先強化的系統測試項目：</p>
</blockquote>
<table>
<thead>
<tr>
<th style="text-align:left">受測系統名稱</th>
<th style="text-align:left">首要強化之系統測試維度</th>
<th style="text-align:left">核心風險與測試設計關鍵考量</th>
</tr>
</thead>
<tbody>
<tr>
<td style="text-align:left"><strong>1. 數位照片網路沖洗系統</strong></td>
<td style="text-align:left"><strong>可用性 + 效能(大檔吞吐) + 相容性</strong></td>
<td style="text-align:left">一般民眾操作需直覺防呆（照片裁切預覽可見性）；大量高解析照片同時上傳之網路頻寬與儲存吞吐量；跨手機/瀏覽器相容。</td>
</tr>
<tr>
<td style="text-align:left"><strong>2. 台北捷運換幣系統</strong></td>
<td style="text-align:left"><strong>可用性 + 實體硬體容錯回復 + 壓力</strong></td>
<td style="text-align:left">旅客匆忙操作介面須極簡零學習成本；卡幣、缺鈔、斷電時之<strong>硬體狀態回復 (Recoverability)</strong> 與帳務一致；尖峰時段連續操作耐久度。</td>
</tr>
<tr>
<td style="text-align:left"><strong>3. 自動提款機 (ATM)</strong></td>
<td style="text-align:left"><strong>安全性 + 回復性 (RPO=0) + 流程替代流</strong></td>
<td style="text-align:left">金融防竄改與通訊加密 (<strong>Security</strong>)；斷電/斷網時<strong>交易絕對原子性與沖正回滾 (WAL, RPO=0)</strong>；密碼錯誤鎖卡、逾時回收鈔券等替代流。</td>
</tr>
<tr>
<td style="text-align:left"><strong>4. 線上遊戲系統 (LOL)</strong></td>
<td style="text-align:left"><strong>極限效能(低延遲 P<sub>99</sub>) + 突波 + 安全性</strong></td>
<td style="text-align:left">10 人即時對戰對<strong>網路延遲 (Latency)</strong> 極度敏感；新賽季開服瞬間之<strong>突波測試 (Spike)</strong> 與長時間浸泡測試；防外掛封包竄改 (<strong>Security</strong>)。</td>
</tr>
<tr>
<td style="text-align:left"><strong>5. 大學聯考電腦閱卷系統</strong></td>
<td style="text-align:left"><strong>功能精準度 (100%) + 批次吞吐 + 回復性</strong></td>
<td style="text-align:left">計分規則與劃卡異常識別（污損、雙重劃記替代流）<strong>零容錯</strong>；全國數十萬考生試卷集中批次處理效能；閱卷中斷之檢查點續跑回復。</td>
</tr>
<tr>
<td style="text-align:left"><strong>6. 監理所車輛管理系統</strong></td>
<td style="text-align:left"><strong>安全性(個資/權限) + 整合相容 + 負載</strong></td>
<td style="text-align:left">涵蓋全國車籍與違規個資，嚴防<strong>越權存取 (Broken Access Control) 與 SQLi</strong>；與警政、稅務、保險跨機關介面契約相容與月底繳稅尖峰負載。</td>
</tr>
</tbody>
</table>
</div>

<header>附錄：課堂互動參考解答</header>

<h2 id="%E9%99%84%E9%8C%84%E8%AA%B2%E5%A0%82%E4%BA%92%E5%8B%95%E5%8F%83%E8%80%83%E8%A7%A3%E7%AD%94">附錄：課堂互動參考解答</h2>
<div class="card-deck">
<blockquote>
<p><img class="emoji" draggable="false" alt="💡" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4a1.svg" data-marp-twemoji=""/> 本章課堂互動 (CCQ 1 ～ CCQ 6) 官方標準解答與核心觀念解析總整理。</p>
</blockquote>
<div class="two-columns">
<div class="card">
<h3 id="%F0%9F%A7%AD-ccq-1--3bddai-%E7%95%AB%E9%9D%A2%E6%A8%A1%E6%93%AC%E8%88%87%E5%8F%AF%E7%94%A8%E6%80%A7"><img class="emoji" draggable="false" alt="🧭" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f9ed.svg" data-marp-twemoji=""/> CCQ 1 ～ 3：BDD、AI 畫面模擬與可用性</h3>
<ul>
<li><strong>CCQ 1【錯誤 (B)】</strong>：在 Cucumber 中進行多組輸入/輸出參數化測試，應使用 <strong><code>Scenario Outline</code>（情境大綱）搭配 <code>Examples</code>（範例表格）</strong>；<code>Background</code> 是用於抽取各情境共用的前置步驟。</li>
<li><strong>CCQ 2【Browser Subagent 結合 VLM 與 DOM 感知 (C)】</strong>：無頭瀏覽器仍會完整載入 CSS 與 Layout 並光柵化至記憶體；Spectron 專用於跨 Electron 主行程與渲染行程；AI Browser Subagent 結合 VLM 視覺與 DOM 語意，有效攻克脆弱定位器問題。</li>
<li><strong>CCQ 3【原則 9：幫助辨識、診斷並修復錯誤 (D)】</strong>：錯誤訊息只告知「密碼強度不足」卻未指出具體缺少的條件與解決方式，違反 Nielsen 第 9 條原則。</li>
</ul>
</div>
<div class="card">
<h3 id="%F0%9F%8E%AF-ccq-4--6%E6%95%88%E8%83%BD%E5%A3%93%E6%B8%AC%E8%B3%87%E5%AE%89%E8%88%87%E7%81%BD%E9%9B%A3%E5%9B%9E%E5%BE%A9"><img class="emoji" draggable="false" alt="🎯" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f3af.svg" data-marp-twemoji=""/> CCQ 4 ～ 6：效能壓測、資安與災難回復</h3>
<ul>
<li><strong>CCQ 4【使用輪廓與 Page View/Session (B)】</strong>：Hit 是一頁觸發的所有請求數，Hit 高不代表人數多；壓測必須與系統監控同步進行；JMeter Thread 代表模擬的虛擬使用者數且內建錄製回放；飽和點後 RPS 停滯且延遲指數飆升。</li>
<li><strong>CCQ 5【SCA 軟體成分分析 (C)】</strong>：檢查 <code>pom.xml</code> 第三方開源套件是否含已知 CVE 漏洞（如 Log4j）屬於 <strong>SCA (Software Composition Analysis)</strong>；SAST 掃描自有原始碼，DAST 則從外部動態攻擊。</li>
<li><strong>CCQ 6【RTO = 3 分鐘，RPO = 0 秒 (C)】</strong>：<strong>RTO (Recovery Time Objective)</strong> 為最大容許停機時間（3 分鐘內恢復服務）；<strong>RPO (Recovery Point Objective)</strong> 為最大容許資料遺失量（0 秒零遺失）。</li>
</ul>
</div>
</div>
</div>
<script>
(function() {
  function initHeaderDropdown() {
    var sections = [];
    var seenTitles = new Set();
    var slideSections = document.querySelectorAll("section[id]");
    
    // 1. Scan unique section titles and their slide IDs
    slideSections.forEach(function(sec) {
      var header = sec.querySelector("header");
      if (!header) return;
      
      var title = header.textContent.trim();
      title = title.replace(/^[◄◀]\s*/, "").replace(/\s*[►▶]$/, "").trim();
      if (!title || seenTitles.has(title)) return;
      
      seenTitles.add(title);
      sections.push({
        id: sec.id,
        title: title
      });
    });

    if (sections.length === 0) return;

    // Helper to create the dropdown DOM
    function createDropdownWrapper(currentTitle) {
      var wrapper = document.createElement("span");
      wrapper.className = "header-nav-wrapper";
      
      var titleSpan = document.createElement("span");
      titleSpan.className = "header-nav-title";
      titleSpan.title = "點擊固定或懸停查看所有章節快速跳轉";
      
      var textNode = document.createTextNode(currentTitle);
      var caretSpan = document.createElement("span");
      caretSpan.className = "nav-caret";
      caretSpan.textContent = " ▾";
      titleSpan.appendChild(textNode);
      titleSpan.appendChild(caretSpan);
      
      titleSpan.addEventListener("click", function(e) {
        e.stopPropagation();
        var wasOpen = wrapper.classList.contains("is-open");
        document.querySelectorAll(".header-nav-wrapper.is-open").forEach(function(w) {
          w.classList.remove("is-open");
        });
        if (!wasOpen) {
          wrapper.classList.add("is-open");
        }
      });
      
      var dropdown = document.createElement("div");
      dropdown.className = "nav-dropdown";
      
      dropdown.addEventListener("click", function(e) {
        e.stopPropagation();
      });
      
      var dropHeader = document.createElement("div");
      dropHeader.className = "nav-dropdown-header";
      var titlePart = document.createElement("span");
      titlePart.textContent = "📑 快速跳轉章節目錄";
      var countPart = document.createElement("span");
      countPart.style.fontSize = "11px";
      countPart.style.fontWeight = "normal";
      countPart.style.color = "#64748b";
      countPart.textContent = "共 " + sections.length + " 個章節";
      dropHeader.appendChild(titlePart);
      dropHeader.appendChild(countPart);
      dropdown.appendChild(dropHeader);
      
      var grid = document.createElement("div");
      grid.className = "nav-dropdown-grid";
      
      sections.forEach(function(s) {
        var item = document.createElement("a");
        var isActive = (s.title === currentTitle);
        item.className = "nav-dropdown-item" + (isActive ? " active" : "");
        item.href = "#" + s.id;
        
        var badge = document.createElement("span");
        badge.className = "badge";
        badge.textContent = "#" + s.id.padStart(2, "0");
        
        var itemText = document.createElement("span");
        itemText.className = "item-text";
        itemText.title = s.title;
        itemText.textContent = s.title;
        
        item.appendChild(badge);
        item.appendChild(itemText);
        
        item.addEventListener("click", function(e) {
          wrapper.classList.remove("is-open");
          dropdown.style.display = "none";
          window.location.hash = "#" + s.id;
          setTimeout(function() { dropdown.style.display = ""; }, 350);
        });
        
        grid.appendChild(item);
      });
      
      dropdown.appendChild(grid);
      wrapper.appendChild(titleSpan);
      wrapper.appendChild(dropdown);
      return wrapper;
    }

    // Close any pinned dropdown when clicking anywhere outside
    document.addEventListener("click", function(e) {
      if (!e.target.closest(".header-nav-wrapper")) {
        document.querySelectorAll(".header-nav-wrapper.is-open").forEach(function(w) {
          w.classList.remove("is-open");
        });
      }
    });

    // 2. Enhance each header element across all slides
    slideSections.forEach(function(sec) {
      var header = sec.querySelector("header");
      if (!header || header.dataset.navEnhanced) return;
      header.dataset.navEnhanced = "true";
      
      var title = header.textContent.trim();
      title = title.replace(/^[◄◀]\s*/, "").replace(/\s*[►▶]$/, "").trim();
      if (!title) return;
      
      header.innerHTML = "";
      var wrapper = createDropdownWrapper(title);
      header.appendChild(wrapper);
    });

    // 3. Auto-link and calibrate section items on the Outline slide (Slide 2)
    var secByNum = {};
    sections.forEach(function(s) {
      var m = s.title.match(/^(\d+\.\d+)\b/);
      if (m && !secByNum[m[1]]) {
        secByNum[m[1]] = s.id;
      }
    });
    var outlineSlide = document.querySelector("section.outline-slide, section[id=\"2\"]");
    if (outlineSlide) {
      outlineSlide.querySelectorAll("li").forEach(function(li) {
        var existingLink = li.querySelector(":scope > a, :scope > strong > a");
        if (existingLink) {
          var m = existingLink.textContent.trim().match(/^(\d+\.\d+)\b/);
          if (m && secByNum[m[1]]) {
            existingLink.href = "#" + secByNum[m[1]];
          }
          return;
        }
        var strong = li.querySelector(":scope > strong, :scope > b");
        if (strong) {
          var m = strong.textContent.trim().match(/^(\d+\.\d+)\b/);
          if (m && secByNum[m[1]]) {
            var a = document.createElement("a");
            a.href = "#" + secByNum[m[1]];
            strong.parentNode.insertBefore(a, strong);
            a.appendChild(strong);
          }
        }
      });
    }

    // 4. Auto-clamp hover zoom scale (--zoom-scale) so enlarged images never exceed slide (1280x720)
    function updateImgZoomScale(img) {
      var sec = img.closest("section");
      if (!sec) return;
      var w = img.offsetWidth;
      var h = img.offsetHeight;
      if (!w || !h) return;
      var x = 0, y = 0, cur = img;
      while (cur && cur !== sec && sec.contains(cur)) {
        x += cur.offsetLeft;
        y += cur.offsetTop;
        cur = cur.offsetParent;
      }
      var secW = sec.offsetWidth || 1280;
      var secH = sec.offsetHeight || 720;
      var padSide = 36;
      var padTop = 30;
      var isLeftOrigin = img.closest(":is(.two-columns, .two-columns-64, .two-columns-73, .three-columns) > .card:first-child");
      var availW = isLeftOrigin ? (secW - padSide - x) : ((x + w) - padSide);
      var availH = (y + h) - padTop;
      var tag = img.tagName ? img.tagName.toLowerCase() : "";
      var cap = (tag === "pre" || tag === "marp-pre") ? 1.42 : 2.0;
      var maxS = Math.min(cap, availW / w, availH / h, (secH - 60) / h);
      if (maxS < 1.0) maxS = 1.0;
      img.style.setProperty("--zoom-scale", maxS.toFixed(3));
    }
    document.querySelectorAll(".card img:not(.emoji), div.content-figure img:not(.emoji), .card pre, .card marp-pre").forEach(function(img) {
      if (img.dataset.zoomBound) return;
      img.dataset.zoomBound = "true";
      img.addEventListener("mouseenter", function() { updateImgZoomScale(img); });
      img.addEventListener("load", function() { updateImgZoomScale(img); });
      updateImgZoomScale(img);
    });
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", initHeaderDropdown);
  } else {
    initHeaderDropdown();
  }
  setTimeout(initHeaderDropdown, 400);
})();
</script>
