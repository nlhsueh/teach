<h1 id="%E8%BB%9F%E9%AB%94%E5%93%81%E8%B3%AA%E8%88%87%E6%B8%AC%E8%A9%A6">軟體品質與測試</h1>
<h3 id="%E7%AC%AC-7-%E7%AB%A0%E6%95%B4%E5%90%88%E6%B8%AC%E8%A9%A6-integration-testing-%E8%88%87%E6%B8%AC%E8%A9%A6%E6%9B%BF%E8%BA%AB%E6%9E%B6%E6%A7%8B">第 7 章：整合測試 (Integration Testing) 與測試替身架構</h3>
<p>授課教師：薛念林 教授</p>
<blockquote>
<p>「單元測試證明了零件的完好，整合測試則驗證了齒輪的嚙合。」<br />
當獨立模組跨越程序、網路或資料庫邊界協同運作時，介面契約、型態失配與時序競爭才是系統穩定性的真正試金石。</p>
</blockquote>
<footer>Ch07 整合測試與測試替身</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="2" data-paginate="true" data-header="本章大綱 (Outline)" data-footer="Ch07 整合測試與測試替身" data-class="outline-slide" data-theme="sqa-theme" lang="C" class="outline-slide" data-marpit-pagination="2" style="--paginate:true;--header:本章大綱 (Outline);--footer:Ch07 整合測試與測試替身;--class:outline-slide;--theme:sqa-theme;" data-marpit-pagination-total="29">
<header>本章大綱 (Outline)</header>

<h2 id="%E6%9C%AC%E7%AB%A0%E9%87%8D%E9%BB%9E%E5%B0%8E%E8%AE%80-key-highlights">本章重點導讀 (Key Highlights)</h2>
<div class="outline-columns">
<div>
<h3 id="%F0%9F%A7%A9-%E6%95%B4%E5%90%88%E7%AD%96%E7%95%A5%E8%88%87%E6%9E%B6%E6%A7%8B%E6%BC%94%E9%80%B2"><img class="emoji" draggable="false" alt="🧩" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f9e9.svg" data-marp-twemoji=""/> 整合策略與架構演進</h3>
<ul>
<li><strong>7.1 整合測試與 V 模型 (V-Model)</strong>：
<ul>
<li>單元測試通過後的介面斷裂危機、V-Model 階層定位</li>
<li>介面錯誤四大分類：型別失配、順序錯亂、資源競爭、語意歧異</li>
<li>Spring Boot 經典分層架構（Controller ➔ Service ➔ Repository）</li>
</ul>
</li>
<li><strong>7.2 由下而上整合 (Bottom-Up)</strong>：
<ul>
<li>核心哲學、測試驅動程式 (Test Driver) 設計、<code>isPrime</code> 驅動實務</li>
<li>Spring Boot <code>@DataJpaTest</code> 與底層向上推進</li>
</ul>
</li>
<li><strong>7.3 由上而下整合 (Top-Down)</strong>：
<ul>
<li>核心哲學、測試假程式 (Test Stub) 設計、<code>allPrime</code> 樁實務</li>
<li>Spring Boot <code>@WebMvcTest</code> + <code>@MockBean</code> 控制器切片測試</li>
</ul>
</li>
<li><strong>7.4 整合策略大比拼 (Comparison)</strong>：
<ul>
<li>Big Bang、Top-Down、Bottom-Up 與 Sandwich（三明治/混合式）</li>
<li>成本、定位精度、原型可見度多維度評估矩陣 (CCQ 1)</li>
</ul>
</li>
</ul>
</div>
<div>
<h3 id="%F0%9F%8E%AD-%E6%B8%AC%E8%A9%A6%E6%9B%BF%E8%BA%AB%E8%88%87%E7%8F%BE%E4%BB%A3%E5%AF%A6%E6%88%B0"><img class="emoji" draggable="false" alt="🎭" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f3ad.svg" data-marp-twemoji=""/> 測試替身與現代實戰</h3>
<ul>
<li><strong>7.5 隔離架構與測試替身 (Test Double)</strong>：
<ul>
<li>Gerard Meszaros 5 大替身：Dummy, Stub, Spy, Mock, Fake</li>
<li>何時用 Mock vs. 不用 Mock、脆化測試 (Brittle Tests) 與三大反模式 (CCQ 2)</li>
</ul>
</li>
<li><strong>7.6 Mockito 實戰與行為驗證</strong>：
<ul>
<li><code>mock()</code> vs. <code>spy()</code>、<code>when().thenReturn()</code>、<code>verify()</code></li>
<li><code>ArgumentCaptor</code> 深度參數捕獲、<code>PrimeService</code> 模擬實戰</li>
</ul>
</li>
<li><strong>7.7 Spring Boot 整合測試實務</strong>：
<ul>
<li><code>@SpringBootTest</code> 全量整合 vs. 切片測試</li>
<li><code>MockMvc</code> HTTP 請求模擬、JSONPath 斷言與質數 API 實戰</li>
</ul>
</li>
<li><strong>7.8 現代真實環境整合：Testcontainers</strong>：
<ul>
<li>記憶體資料庫 (H2) 的「假綠燈幻覺」與方言陷阱</li>
<li>Docker 動態拉起真實 DB、<code>@DynamicPropertySource</code> 配置</li>
</ul>
</li>
<li><strong>7.9 課堂實習與練習 (LabDemo)</strong>：
<ul>
<li><code>u07_mockito</code> 實作、<code>u08_integration</code> 案例與作業任務</li>
</ul>
</li>
</ul>
</div>
</div>
<footer>Ch07 整合測試與測試替身</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="3" data-paginate="true" data-header="7.1 整合測試與 V 開發模型" data-footer="Ch07 整合測試與測試替身" data-theme="sqa-theme" lang="C" data-marpit-pagination="3" style="--paginate:true;--header:7.1 整合測試與 V 開發模型;--footer:Ch07 整合測試與測試替身;--theme:sqa-theme;" data-marpit-pagination-total="29">
<header>7.1 整合測試與 V 開發模型</header>

<h2 id="71-%E7%82%BA%E4%BB%80%E9%BA%BC%E5%96%AE%E5%85%83%E6%B8%AC%E8%A9%A6%E9%81%8E%E4%BA%86%E7%B3%BB%E7%B5%B1%E9%82%84%E6%98%AF%E6%9C%83%E5%B4%A9%E6%BD%B0">7.1 為什麼單元測試過了，系統還是會崩潰？</h2>
<div class="split73">
<div class="left">
<h4 id="%F0%9F%A7%A9-%E6%95%B4%E5%90%88%E6%B8%AC%E8%A9%A6-integration-testing-%E7%9A%84%E6%9C%AC%E8%B3%AA"><img class="emoji" draggable="false" alt="🧩" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f9e9.svg" data-marp-twemoji=""/> 整合測試 (Integration Testing) 的本質</h4>
<ul>
<li><strong>單元測試 (Unit Test)</strong>：檢驗個別函式或類別在<strong>完全隔離</strong>環境下的邏輯正確性。</li>
<li><strong>整合測試 (Integration Test)</strong>：檢驗多個模組、子系統或元件<strong>相互組合、溝通與傳遞資料時的行為</strong>。</li>
</ul>
<blockquote>
<p><img class="emoji" draggable="false" alt="💡" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4a1.svg" data-marp-twemoji=""/> <strong>經典現實比喻：</strong><br />
兩把鎖的把手單獨旋轉都很順暢（單元測試 100% 通過），但安裝在同一扇雙開門上時，兩把把手互相卡死，門根本推不開！</p>
</blockquote>
<h4 id="%E2%9A%A0%EF%B8%8F-%E6%95%B4%E5%90%88%E9%9A%8E%E6%AE%B5%E5%B8%B8%E8%A6%8B%E7%9A%84%E4%BB%8B%E9%9D%A2%E9%8C%AF%E8%AA%A4%E5%9B%9B%E5%A4%A7%E5%85%83%E5%87%B6"><img class="emoji" draggable="false" alt="⚠️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/26a0.svg" data-marp-twemoji=""/> 整合階段常見的「介面錯誤」四大元凶：</h4>
<ol>
<li><strong>型態與協定失配</strong>：前端傳送字串 <code>&quot;100&quot;</code>，後端預期數值 <code>100</code>；或 Date 格式時區偏差。</li>
<li><strong>呼叫時序與前置條件錯亂</strong>：必須先 <code>login()</code> 才能 <code>checkout()</code>，但 API 未防護而拋出 NPE。</li>
<li><strong>並行與資源競爭 (Race Condition)</strong>：單執行緒測試安全，但在多連線下發生資料庫 Deadlock。</li>
<li><strong>環境與網路依賴差異</strong>：連線逾時、交易未 Commit、快取與 DB 資料不一致。</li>
</ol>
</div>
<div class="right">
<p><img src="../../img/ch07/BknjbJHVT.png" alt="V-Model" /></p>
</div>
</div>
<footer>Ch07 整合測試與測試替身</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="4" data-paginate="true" data-header="7.1 整合測試與 V 開發模型" data-footer="Ch07 整合測試與測試替身" data-theme="sqa-theme" lang="C" data-marpit-pagination="4" style="--paginate:true;--header:7.1 整合測試與 V 開發模型;--footer:Ch07 整合測試與測試替身;--theme:sqa-theme;" data-marpit-pagination-total="29">
<header>7.1 整合測試與 V 開發模型</header>

<h2 id="711-v-%E9%96%8B%E7%99%BC%E6%A8%A1%E5%9E%8B%E8%88%87%E6%B8%AC%E8%A9%A6%E5%B1%A4%E7%B4%9A%E5%B0%8D%E6%87%89">7.1.1 V 開發模型與測試層級對應</h2>
<div class="split64">
<div class="left">
<h4 id="%F0%9F%93%90-v-%E9%96%8B%E7%99%BC%E6%A8%A1%E5%9E%8B-v-model-%E7%9A%84%E5%B0%8D%E7%A8%B1%E5%93%B2%E5%AD%B8"><img class="emoji" draggable="false" alt="📐" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4d0.svg" data-marp-twemoji=""/> V 開發模型 (V-Model) 的對稱哲學</h4>
<ul>
<li>左側為<strong>規格與架構設計</strong>階段，右側為<strong>驗證與確認 (V&amp;V)</strong> 階段。</li>
<li>每一層測試，都有其對應的規格基準：
<ul>
<li><strong>單元測試 (Unit Testing)</strong> ➔ 對應<strong>詳細設計 (Detailed Design)</strong></li>
<li><strong>整合測試 (Integration Testing)</strong> ➔ 對應<strong>架構與介面設計 (Architecture &amp; Interface Design)</strong></li>
<li><strong>系統測試 (System Testing)</strong> ➔ 對應<strong>系統需求分析 (System Requirements)</strong></li>
<li><strong>驗收測試 (Acceptance Testing)</strong> ➔ 對應<strong>使用者需求規格 (User Needs)</strong></li>
</ul>
</li>
</ul>
<h4 id="%F0%9F%8E%AF-%E6%95%B4%E5%90%88%E6%B8%AC%E8%A9%A6%E7%9A%84%E6%A0%B8%E5%BF%83%E9%A9%97%E8%AD%89%E6%A8%99%E7%9A%84"><img class="emoji" draggable="false" alt="🎯" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f3af.svg" data-marp-twemoji=""/> 整合測試的核心驗證標的</h4>
<ul>
<li>模組與模組之間的 <strong>API 呼叫契約 (API Contract)</strong>。</li>
<li>業務流程在跨層傳遞時的<strong>資料完整性與交易邊界 (Transaction Rollback)</strong>。</li>
<li>外部服務（Message Queue、Cache、Database）的連線與錯誤降級機制。</li>
</ul>
</div>
<div class="right">
<table>
<thead>
<tr>
<th style="text-align:left">測試層級</th>
<th style="text-align:left">測試對象</th>
<th style="text-align:left">核心關注點</th>
<th style="text-align:left">執行速度</th>
<th style="text-align:left">缺陷定位成本</th>
</tr>
</thead>
<tbody>
<tr>
<td style="text-align:left"><strong>單元測試</strong></td>
<td style="text-align:left">獨立類別 / 函式</td>
<td style="text-align:left">內部邏輯分支</td>
<td style="text-align:left">毫秒級 (極快)</td>
<td style="text-align:left">極低 (行層級)</td>
</tr>
<tr>
<td style="text-align:left"><strong>整合測試</strong></td>
<td style="text-align:left">模組間介面 / DB</td>
<td style="text-align:left">資料傳遞與契約</td>
<td style="text-align:left">秒級 (中等)</td>
<td style="text-align:left">中等 (模組層級)</td>
</tr>
<tr>
<td style="text-align:left"><strong>系統測試</strong></td>
<td style="text-align:left">完整運行系統</td>
<td style="text-align:left">端到端業務情境</td>
<td style="text-align:left">分鐘級 (較慢)</td>
<td style="text-align:left">較高 (系統層級)</td>
</tr>
<tr>
<td style="text-align:left"><strong>驗收測試</strong></td>
<td style="text-align:left">終端使用者環境</td>
<td style="text-align:left">使用者滿意度</td>
<td style="text-align:left">人工 / E2E</td>
<td style="text-align:left">極高 (跨端回溯)</td>
</tr>
</tbody>
</table>
<blockquote>
<p><img class="emoji" draggable="false" alt="📌" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4cc.svg" data-marp-twemoji=""/> <strong>黃金法則</strong>：越早在底層（單元、整合）捕捉介面契約變更，修復成本就比驗收階段低數十倍！</p>
</blockquote>
</div>

</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="5" data-paginate="true" data-header="7.1 整合測試與 V 開發模型" data-footer="Ch07 整合測試與測試替身" data-theme="sqa-theme" lang="C" data-marpit-pagination="5" style="--paginate:true;--header:7.1 整合測試與 V 開發模型;--footer:Ch07 整合測試與測試替身;--theme:sqa-theme;" data-marpit-pagination-total="29">
<header>7.1 整合測試與 V 開發模型</header>

<h2 id="712-%E5%AF%A6%E5%8B%99%E6%A1%88%E4%BE%8B%E6%9E%B6%E6%A7%8Bspring-boot-%E4%B8%89%E5%B1%A4%E6%9E%B6%E6%A7%8B">7.1.2 實務案例架構：Spring Boot 三層架構</h2>
<div class="split55">
<div class="left">
<h4 id="%F0%9F%8F%9B%EF%B8%8F-%E7%B6%93%E5%85%B8-mvc--layered-architecture"><img class="emoji" draggable="false" alt="🏛️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f3db.svg" data-marp-twemoji=""/> 經典 MVC / Layered Architecture</h4>
<p>現代後端企業應用（如 Spring Boot）通常劃分為嚴格的三層架構：</p>
<ol>
<li><strong>控制器層 (Controller Layer / Web Layer)</strong>
<ul>
<li>負責處理 HTTP 請求、路由配對、URL 參數驗證、序列化/反序列化 JSON。</li>
</ul>
</li>
<li><strong>服務層 (Service Layer / Business Logic)</strong>
<ul>
<li>負責核心商業邏輯運算、交易控制 (<code>@Transactional</code>)、跨多個 Repository 協同。</li>
</ul>
</li>
<li><strong>資料存取層 (Repository Layer / Persistence)</strong>
<ul>
<li>負責與關聯式資料庫 (JPA/Hibernate) 溝通、執行 SQL 查詢與持久化對象映射。</li>
</ul>
</li>
</ol>
<h4 id="%E2%9A%A1-%E4%BB%8B%E9%9D%A2%E6%96%B7%E8%A3%82%E7%9A%84%E7%9C%9F%E5%AF%A6%E5%A0%B4%E6%99%AF"><img class="emoji" draggable="false" alt="⚡" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/26a1.svg" data-marp-twemoji=""/> 介面斷裂的真實場景</h4>
<ul>
<li>Controller 傳給 Service 的 DTO 欄位名稱少了一個字母 ➔ Service 拿到 <code>null</code>。</li>
<li>Service 在交易失敗時未拋出 RuntimeException ➔ Repository 照常 Commit 導致髒資料。</li>
</ul>
</div>
<div class="right">
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-mermaid">flowchart TD
    Client[&quot;客戶端 Client (Browser / App)&quot;]
    
    subgraph SpringBootApp [&quot;Spring Boot 應用程式邊界&quot;]
        Controller[&quot;1. Controller 層 (Web / REST API)&quot;]
        Service[&quot;2. Service 層 (商業邏輯業務)&quot;]
        Repository[&quot;3. Repository 層 (Spring Data JPA)&quot;]
    end
    
    DB[(&quot;外部實體資料庫 (PostgreSQL / MySQL)&quot;)]
    
    Client --&gt;|&quot;HTTP POST /api/primes&quot;| Controller
    Controller --&gt;|&quot;DTO 呼叫 calcPrime()&quot;| Service
    Service --&gt;|&quot;JPA 實體操作 findById()&quot;| Repository
    Repository --&gt;|&quot;JDBC / SQL 查詢&quot;| DB
    
    style Controller fill:#e1f5fe,stroke:#0288d1,stroke-width:2px
    style Service fill:#e8f5e9,stroke:#388e3c,stroke-width:2px

</code></pre>
</div>
</div>

</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="6" data-paginate="true" data-header="7.2 由下而上整合 (Bottom-Up Integration)" data-footer="Ch07 整合測試與測試替身" data-theme="sqa-theme" lang="C" data-marpit-pagination="6" style="--paginate:true;--header:7.2 由下而上整合 (Bottom-Up Integration);--footer:Ch07 整合測試與測試替身;--theme:sqa-theme;" data-marpit-pagination-total="29">
<header>7.2 由下而上整合 (Bottom-Up Integration)</header>

<h2 id="72-%E7%94%B1%E4%B8%8B%E8%80%8C%E4%B8%8A%E6%95%B4%E5%90%88%E6%B8%AC%E8%A9%A6-bottom-up-integration">7.2 由下而上整合測試 (Bottom-Up Integration)</h2>
<div class="split73">
<div class="left">
<h4 id="%F0%9F%A7%B1-%E6%A0%B8%E5%BF%83%E5%93%B2%E5%AD%B8%E6%AD%A5%E6%AD%A5%E7%82%BA%E7%87%9F%E5%9C%B0%E5%9F%BA%E5%85%88%E5%9B%BA"><img class="emoji" draggable="false" alt="🧱" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f9f1.svg" data-marp-twemoji=""/> 核心哲學：步步為營，地基先固</h4>
<ul>
<li><strong>整合順序</strong>：從依賴圖中最底層的葉節點模組（無任何依賴者）開始測試，驗證無誤後，再逐層向上加入上一層呼叫者。</li>
<li><strong>關鍵工具：測試驅動程式 (Test Driver)</strong>
<ul>
<li>由於高層模組尚未參與測試，必須撰寫一個<strong>專用的輔助程式 (Driver)</strong> 來主動呼叫受測底層模組、傳入測試資料並印出或驗證輸出結果。</li>
</ul>
</li>
</ul>
<h4 id="%F0%9F%8C%9F-%E7%94%B1%E4%B8%8B%E8%80%8C%E4%B8%8A%E6%B8%AC%E8%A9%A6%E7%9A%84%E4%B8%89%E5%A4%A7%E5%84%AA%E9%BB%9E"><img class="emoji" draggable="false" alt="🌟" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f31f.svg" data-marp-twemoji=""/> 由下而上測試的三大優點</h4>
<ol>
<li><strong>缺陷定位精確</strong>：底層模組若有錯，在第一時間就會暴露；若組裝上一層失敗，錯誤必然發生在剛加入的那層或其介面銜接處。</li>
<li><strong>無需撰寫複雜的 Stubs</strong>：因為被呼叫者都是真實且已經通過測試的模組。</li>
<li><strong>利於早期自動化回歸測試</strong>：底層函式庫穩定後即可持續自動執行。</li>
</ol>
</div>
<div class="right">
<p><img src="../../img/ch07/HyQJGyS4T.png" alt="Bottom-Up" /></p>
</div>
</div>
<footer>Ch07 整合測試與測試替身</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="7" data-paginate="true" data-header="7.2 由下而上整合 (Bottom-Up Integration)" data-footer="Ch07 整合測試與測試替身" data-theme="sqa-theme" lang="C" data-marpit-pagination="7" style="--paginate:true;--header:7.2 由下而上整合 (Bottom-Up Integration);--footer:Ch07 整合測試與測試替身;--theme:sqa-theme;" data-marpit-pagination-total="29">
<header>7.2 由下而上整合 (Bottom-Up Integration)</header>

<h2 id="721-%E5%BA%95%E5%B1%A4%E6%A8%A1%E7%B5%84%E8%88%87-test-driver-%E7%A8%8B%E5%BC%8F%E7%A2%BC%E7%AF%84%E4%BE%8B">7.2.1 底層模組與 Test Driver 程式碼範例</h2>
<div class="split55">
<div class="left">
<h4 id="1-%E5%8F%97%E6%B8%AC%E5%BA%95%E5%B1%A4%E6%A8%A1%E7%B5%84-primeutiljava">1. 受測底層模組 (<code>PrimeUtil.java</code>)</h4>
<p>最底層的質數判斷工具類別，完全不依賴任何其他外部模組：</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-keyword">public</span> <span class="hljs-keyword">class</span> <span class="hljs-title class_">PrimeUtil</span> {
    <span class="hljs-comment">// 判斷整數 n 是否為質數</span>
    <span class="hljs-keyword">public</span> <span class="hljs-keyword">static</span> <span class="hljs-type">boolean</span> <span class="hljs-title function_">isPrime</span><span class="hljs-params">(<span class="hljs-type">int</span> n)</span> {
        <span class="hljs-keyword">if</span> (n &lt;= <span class="hljs-number">1</span>) <span class="hljs-keyword">return</span> <span class="hljs-literal">false</span>;
        <span class="hljs-keyword">for</span> (<span class="hljs-type">int</span> <span class="hljs-variable">i</span> <span class="hljs-operator">=</span> <span class="hljs-number">2</span>; i * i &lt;= n; i++) {
            <span class="hljs-keyword">if</span> (n % i == <span class="hljs-number">0</span>) <span class="hljs-keyword">return</span> <span class="hljs-literal">false</span>;
        }
        <span class="hljs-keyword">return</span> <span class="hljs-literal">true</span>;
    }
}
</code></pre>
<ul>
<li>該模組位於系統最基層。</li>
<li>只要給定輸入整數，即返回 boolean。</li>
</ul>
</div>
<div class="right">
<h4 id="2-%E6%B8%AC%E8%A9%A6%E9%A9%85%E5%8B%95%E7%A8%8B%E5%BC%8F-primedriverjava">2. 測試驅動程式 (<code>PrimeDriver.java</code>)</h4>
<p>撰寫專屬 Driver 模擬上層呼叫並進行斷言驗證：</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-keyword">public</span> <span class="hljs-keyword">class</span> <span class="hljs-title class_">PrimeDriver</span> {
    <span class="hljs-keyword">public</span> <span class="hljs-keyword">static</span> <span class="hljs-keyword">void</span> <span class="hljs-title function_">main</span><span class="hljs-params">(String[] args)</span> {
        System.out.println(<span class="hljs-string">&quot;=== 啟動 PrimeUtil 測試驅動程式 ===&quot;</span>);
        <span class="hljs-type">int</span>[] testCases = {-<span class="hljs-number">5</span>, <span class="hljs-number">0</span>, <span class="hljs-number">1</span>, <span class="hljs-number">2</span>, <span class="hljs-number">3</span>, <span class="hljs-number">4</span>, <span class="hljs-number">17</span>, <span class="hljs-number">20</span>};
        <span class="hljs-type">boolean</span>[] expected = {<span class="hljs-literal">false</span>, <span class="hljs-literal">false</span>, <span class="hljs-literal">false</span>, <span class="hljs-literal">true</span>, <span class="hljs-literal">true</span>, <span class="hljs-literal">false</span>, <span class="hljs-literal">true</span>, <span class="hljs-literal">false</span>};

        <span class="hljs-keyword">for</span> (<span class="hljs-type">int</span> <span class="hljs-variable">i</span> <span class="hljs-operator">=</span> <span class="hljs-number">0</span>; i &lt; testCases.length; i++) {
            <span class="hljs-type">boolean</span> <span class="hljs-variable">actual</span> <span class="hljs-operator">=</span> PrimeUtil.isPrime(testCases[i]);
            <span class="hljs-keyword">assert</span> actual == expected[i] : 
                <span class="hljs-string">&quot;<img class="emoji" draggable="false" alt="❌" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/274c.svg" data-marp-twemoji=""/> 失敗: 輸入 &quot;</span> + testCases[i] + <span class="hljs-string">&quot; 預期 &quot;</span> + expected[i];
            System.out.println(<span class="hljs-string">&quot;<img class="emoji" draggable="false" alt="✅" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/2705.svg" data-marp-twemoji=""/> 通過: 輸入 &quot;</span> + testCases[i] + <span class="hljs-string">&quot; ➔ &quot;</span> + actual);
        }
        System.out.println(<span class="hljs-string">&quot;<img class="emoji" draggable="false" alt="🎉" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f389.svg" data-marp-twemoji=""/> 底層 PrimeUtil 驗證全數通過！&quot;</span>);
    }
}
</code></pre>
</div>
</div>
<footer>Ch07 整合測試與測試替身</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="8" data-paginate="true" data-header="7.2 由下而上整合 (Bottom-Up Integration)" data-footer="Ch07 整合測試與測試替身" data-theme="sqa-theme" lang="C" data-marpit-pagination="8" style="--paginate:true;--header:7.2 由下而上整合 (Bottom-Up Integration);--footer:Ch07 整合測試與測試替身;--theme:sqa-theme;" data-marpit-pagination-total="29">
<header>7.2 由下而上整合 (Bottom-Up Integration)</header>

<h2 id="722-spring-boot-%E4%B8%AD%E7%9A%84%E7%94%B1%E4%B8%8B%E8%80%8C%E4%B8%8A%E5%AF%A6%E8%B8%90%E4%B8%89%E6%AD%A5%E9%A9%9F">7.2.2 Spring Boot 中的由下而上實踐三步驟</h2>
<div class="split55">
<div class="left">
<h4 id="%E6%AD%A5%E9%A9%9F-1%E6%B8%AC%E8%A9%A6%E6%9C%80%E5%BA%95%E5%B1%A4-repository-datajpatest">步驟 1：測試最底層 Repository (<code>@DataJpaTest</code>)</h4>
<p>直接連接 H2 或 Testcontainers，驗證 SQL 與實體關聯：</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-meta">@DataJpaTest</span>
<span class="hljs-keyword">public</span> <span class="hljs-keyword">class</span> <span class="hljs-title class_">UserRepositoryTest</span> {
    <span class="hljs-meta">@Autowired</span> <span class="hljs-keyword">private</span> UserRepository userRepo;

    <span class="hljs-meta">@Test</span>
    <span class="hljs-keyword">void</span> <span class="hljs-title function_">testSaveAndFindByUsername</span><span class="hljs-params">()</span> {
        <span class="hljs-type">User</span> <span class="hljs-variable">u</span> <span class="hljs-operator">=</span> <span class="hljs-keyword">new</span> <span class="hljs-title class_">User</span>(<span class="hljs-string">&quot;alice&quot;</span>, <span class="hljs-string">&quot;alice@example.com&quot;</span>);
        userRepo.save(u);
        Optional&lt;User&gt; found = userRepo.findByUsername(<span class="hljs-string">&quot;alice&quot;</span>);
        assertTrue(found.isPresent());
        assertEquals(<span class="hljs-string">&quot;alice@example.com&quot;</span>, found.get().getEmail());
    }
}
</code></pre>
<ul>
<li>底層資料存取完全驗證正確後，才向上整合。</li>
</ul>
</div>
<div class="right">
<h4 id="%E6%AD%A5%E9%A9%9F-2-%E2%9E%94-%E6%AD%A5%E9%A9%9F-3%E5%90%91%E4%B8%8A%E7%B5%84%E8%A3%9D-service-%E8%88%87-controller">步驟 2 ➔ 步驟 3：向上組裝 Service 與 Controller</h4>
<ul>
<li><strong>步驟 2：整合業務服務層 (Service Layer)</strong>
<ul>
<li>引入真實通過測試的 <code>UserRepository</code>。</li>
<li>驗證商業邏輯與交易回滾 (<code>@Transactional</code>)。</li>
</ul>
</li>
<li><strong>步驟 3：整合控制層 (Controller Layer)</strong>
<ul>
<li>啟動完整的 Spring 上下文 (<code>@SpringBootTest(webEnvironment = RANDOM_PORT)</code>)。</li>
<li>使用 <code>TestRestTemplate</code> 發送真實 HTTP 請求打擊 Controller，一路貫穿到 Service 與 Repository。</li>
</ul>
</li>
</ul>
<blockquote>
<p><img class="emoji" draggable="false" alt="⚠️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/26a0.svg" data-marp-twemoji=""/> <strong>由下而上的最大痛點</strong>：<br />
直到最後一步，產品經理與使用者才能看到「系統的真正雛形」，UI 與高階流程架構的重大缺陷會被延遲至最後才發現！</p>
</blockquote>
</div>
</div>
<footer>Ch07 整合測試與測試替身</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="9" data-paginate="true" data-header="7.3 由上而下整合 (Top-Down Integration)" data-footer="Ch07 整合測試與測試替身" data-theme="sqa-theme" lang="C" data-marpit-pagination="9" style="--paginate:true;--header:7.3 由上而下整合 (Top-Down Integration);--footer:Ch07 整合測試與測試替身;--theme:sqa-theme;" data-marpit-pagination-total="29">
<header>7.3 由上而下整合 (Top-Down Integration)</header>

<h2 id="73-%E7%94%B1%E4%B8%8A%E8%80%8C%E4%B8%8B%E6%95%B4%E5%90%88%E6%B8%AC%E8%A9%A6-top-down-integration">7.3 由上而下整合測試 (Top-Down Integration)</h2>
<div class="split73">
<div class="left">
<h4 id="%F0%9F%8F%9B%EF%B8%8F-%E6%A0%B8%E5%BF%83%E5%93%B2%E5%AD%B8%E9%AA%A8%E6%9E%B6%E5%85%88%E8%A1%8C%E8%87%AA%E9%A0%82%E5%90%91%E4%B8%8B"><img class="emoji" draggable="false" alt="🏛️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f3db.svg" data-marp-twemoji=""/> 核心哲學：骨架先行，自頂向下</h4>
<ul>
<li><strong>整合順序</strong>：從系統最頂層的控制模組（例如主流程、UI 控制器）開始測試，其所依賴的所有下層模組均使用<strong>假程式 (Stubs)</strong> 代替。</li>
<li><strong>關鍵工具：測試假程式 (Test Stub)</strong>
<ul>
<li>為了讓頂層程式碼能夠跑起來，必須為未實作或未驗證的下層模組撰寫簡化的 Stubs，傳回固定或預先錄製的假資料。</li>
</ul>
</li>
</ul>
<h4 id="%F0%9F%8C%9F-%E7%94%B1%E4%B8%8A%E8%80%8C%E4%B8%8B%E6%B8%AC%E8%A9%A6%E7%9A%84%E5%85%A9%E5%A4%A7%E4%BA%AE%E9%BB%9E"><img class="emoji" draggable="false" alt="🌟" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f31f.svg" data-marp-twemoji=""/> 由上而下測試的兩大亮點</h4>
<ol>
<li><strong>早期展現系統骨架</strong>：管理層與利害關係人很早就能看到工作雛形 (Working Prototype)。</li>
<li><strong>優先驗證重大設計決策</strong>：在初期即可驗證控制流程、架構溝通與例外處理策略。</li>
</ol>
</div>
<div class="right">
<p><img src="../../img/ch07/Sye8GJrVT.png" alt="Top-Down" /></p>
</div>
</div>
<footer>Ch07 整合測試與測試替身</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="10" data-paginate="true" data-header="7.3 由上而下整合 (Top-Down Integration)" data-footer="Ch07 整合測試與測試替身" data-theme="sqa-theme" lang="C" data-marpit-pagination="10" style="--paginate:true;--header:7.3 由上而下整合 (Top-Down Integration);--footer:Ch07 整合測試與測試替身;--theme:sqa-theme;" data-marpit-pagination-total="29">
<header>7.3 由上而下整合 (Top-Down Integration)</header>

<h2 id="731-%E9%AB%98%E9%9A%8E%E6%A8%A1%E7%B5%84%E8%88%87-test-stub-%E7%A8%8B%E5%BC%8F%E7%A2%BC%E7%AF%84%E4%BE%8B">7.3.1 高階模組與 Test Stub 程式碼範例</h2>
<div class="split55">
<div class="left">
<h4 id="1-%E5%8F%97%E6%B8%AC%E9%AB%98%E9%9A%8E%E6%8E%A7%E5%88%B6%E6%A8%A1%E7%B5%84-primeappjava">1. 受測高階控制模組 (<code>PrimeApp.java</code>)</h4>
<p>負責印出 1 到 n 之間的所有質數，依賴底層判斷：</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-keyword">public</span> <span class="hljs-keyword">class</span> <span class="hljs-title class_">PrimeApp</span> {
    <span class="hljs-comment">// 依賴一個質數判斷介面</span>
    <span class="hljs-keyword">private</span> <span class="hljs-keyword">final</span> PrimeChecker checker;

    <span class="hljs-keyword">public</span> <span class="hljs-title function_">PrimeApp</span><span class="hljs-params">(PrimeChecker checker)</span> {
        <span class="hljs-built_in">this</span>.checker = checker;
    }

    <span class="hljs-keyword">public</span> List&lt;Integer&gt; <span class="hljs-title function_">getAllPrimes</span><span class="hljs-params">(<span class="hljs-type">int</span> max)</span> {
        List&lt;Integer&gt; result = <span class="hljs-keyword">new</span> <span class="hljs-title class_">ArrayList</span>&lt;&gt;();
        <span class="hljs-keyword">for</span> (<span class="hljs-type">int</span> <span class="hljs-variable">i</span> <span class="hljs-operator">=</span> <span class="hljs-number">1</span>; i &lt;= max; i++) {
            <span class="hljs-keyword">if</span> (checker.isPrime(i)) { <span class="hljs-comment">// 呼叫下層介面</span>
                result.add(i);
            }
        }
        <span class="hljs-keyword">return</span> result;
    }
}
</code></pre>
</div>
<div class="right">
<h4 id="2-%E6%B8%AC%E8%A9%A6%E5%81%87%E7%A8%8B%E5%BC%8F-primecheckerstubjava">2. 測試假程式 (<code>PrimeCheckerStub.java</code>)</h4>
<p>底層算法尚未實作或正在開發中，先寫一個固定 Stub：</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-keyword">public</span> <span class="hljs-keyword">class</span> <span class="hljs-title class_">PrimeCheckerStub</span> <span class="hljs-keyword">implements</span> <span class="hljs-title class_">PrimeChecker</span> {
    <span class="hljs-meta">@Override</span>
    <span class="hljs-keyword">public</span> <span class="hljs-type">boolean</span> <span class="hljs-title function_">isPrime</span><span class="hljs-params">(<span class="hljs-type">int</span> n)</span> {
        <span class="hljs-comment">// 固定樁：硬編碼已知質數，模擬下層模組回傳</span>
        <span class="hljs-keyword">return</span> (n == <span class="hljs-number">2</span> || n == <span class="hljs-number">3</span> || n == <span class="hljs-number">5</span> || n == <span class="hljs-number">7</span>);
    }
}

<span class="hljs-comment">// 測試案例驗證頂層控制邏輯：</span>
<span class="hljs-meta">@Test</span>
<span class="hljs-keyword">void</span> <span class="hljs-title function_">testGetAllPrimesTopDown</span><span class="hljs-params">()</span> {
    <span class="hljs-type">PrimeChecker</span> <span class="hljs-variable">stub</span> <span class="hljs-operator">=</span> <span class="hljs-keyword">new</span> <span class="hljs-title class_">PrimeCheckerStub</span>();
    <span class="hljs-type">PrimeApp</span> <span class="hljs-variable">app</span> <span class="hljs-operator">=</span> <span class="hljs-keyword">new</span> <span class="hljs-title class_">PrimeApp</span>(stub);
    
    List&lt;Integer&gt; primes = app.getAllPrimes(<span class="hljs-number">10</span>);
    assertEquals(List.of(<span class="hljs-number">2</span>, <span class="hljs-number">3</span>, <span class="hljs-number">5</span>, <span class="hljs-number">7</span>), primes);
}
</code></pre>
</div>
</div>
<footer>Ch07 整合測試與測試替身</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="11" data-paginate="true" data-header="7.3 由上而下整合 (Top-Down Integration)" data-footer="Ch07 整合測試與測試替身" data-theme="sqa-theme" lang="C" data-marpit-pagination="11" style="--paginate:true;--header:7.3 由上而下整合 (Top-Down Integration);--footer:Ch07 整合測試與測試替身;--theme:sqa-theme;" data-marpit-pagination-total="29">
<header>7.3 由上而下整合 (Top-Down Integration)</header>

<h2 id="732-spring-boot-%E4%B8%AD%E7%9A%84%E7%94%B1%E4%B8%8A%E8%80%8C%E4%B8%8B%E5%88%87%E7%89%87%E5%AF%A6%E8%B8%90">7.3.2 Spring Boot 中的由上而下切片實踐</h2>
<div class="split55">
<div class="left">
<h4 id="%E6%AD%A5%E9%A9%9F-1%E9%9A%94%E9%9B%A2%E6%B8%AC%E8%A9%A6%E6%9C%80%E9%AB%98%E9%9A%8E-controller-webmvctest">步驟 1：隔離測試最高階 Controller (<code>@WebMvcTest</code>)</h4>
<p>完全不安裝底層 Service 與 DB，只載入 Web MVC 切片：</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-meta">@WebMvcTest(PrimeController.class)</span>
<span class="hljs-keyword">public</span> <span class="hljs-keyword">class</span> <span class="hljs-title class_">PrimeControllerTopDownTest</span> {
    <span class="hljs-meta">@Autowired</span> <span class="hljs-keyword">private</span> MockMvc mockMvc;

    <span class="hljs-meta">@MockBean</span> <span class="hljs-comment">// 自動注入 Spring 管理的測試樁 (Stub/Mock)</span>
    <span class="hljs-keyword">private</span> PrimeService primeService;

    <span class="hljs-meta">@Test</span>
    <span class="hljs-keyword">void</span> <span class="hljs-title function_">testGetPrimesEndpoint</span><span class="hljs-params">()</span> <span class="hljs-keyword">throws</span> Exception {
        <span class="hljs-comment">// 定義 Stub 行為：無論底層如何算，強制回傳 [2, 3, 5]</span>
        Mockito.<span class="hljs-keyword">when</span>(primeService.findPrimes(<span class="hljs-number">5</span>))
               .thenReturn(List.of(<span class="hljs-number">2</span>, <span class="hljs-number">3</span>, <span class="hljs-number">5</span>));

        mockMvc.perform(get(<span class="hljs-string">&quot;/api/primes?max=5&quot;</span>))
               .andExpect(status().isOk())
               .andExpect(jsonPath(<span class="hljs-string">&quot;$.length()&quot;</span>).value(<span class="hljs-number">3</span>))
               .andExpect(jsonPath(<span class="hljs-string">&quot;$[0]&quot;</span>).value(<span class="hljs-number">2</span>));
    }
}
</code></pre>
</div>
<div class="right">
<h4 id="%E6%AD%A5%E9%A9%9F-2-%E2%9E%94-%E6%AD%A5%E9%A9%9F-3%E9%80%90%E6%AD%A5%E5%90%91%E4%B8%8B%E6%9B%BF%E6%8F%9B%E7%9C%9F%E5%AF%A6%E6%A8%A1%E7%B5%84">步驟 2 ➔ 步驟 3：逐步向下替換真實模組</h4>
<ul>
<li><strong>漸進式替換 (Incremental Replacement)</strong>：
<ul>
<li>先驗證完 Controller 的 HTTP 協定、狀態碼與 JSON 反序列化。</li>
<li>接著實作 <code>PrimeService</code>，拿掉 <code>@MockBean</code>，改以真實 Service 協同。</li>
<li>最後整合底層 Repository。</li>
</ul>
</li>
</ul>
<blockquote>
<p><img class="emoji" draggable="false" alt="⚠️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/26a0.svg" data-marp-twemoji=""/> <strong>由上而下的致命挑戰</strong>：</p>
<ol>
<li><strong>撰寫 Stub 成本極高</strong>：如果底層模組回傳的資料結構極度繁複，編造合法的 Stub 資料非常費時。</li>
<li><strong>假假成真風險</strong>：若 Stub 的假設與未來真實底層實作不符，高層測試全部 Pass，換上真實模組時依然當場崩盤！</li>
</ol>
</blockquote>
</div>
</div>
<footer>Ch07 整合測試與測試替身</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="12" data-paginate="true" data-header="7.4 整合測試策略大比拼" data-footer="Ch07 整合測試與測試替身" data-theme="sqa-theme" lang="C" data-marpit-pagination="12" style="--paginate:true;--header:7.4 整合測試策略大比拼;--footer:Ch07 整合測試與測試替身;--theme:sqa-theme;" data-marpit-pagination-total="29">
<header>7.4 整合測試策略大比拼</header>

<h2 id="74-%E5%9B%9B%E5%A4%A7%E6%95%B4%E5%90%88%E6%B8%AC%E8%A9%A6%E7%AD%96%E7%95%A5%E7%B6%9C%E5%90%88%E8%A9%95%E6%AF%94">7.4 四大整合測試策略綜合評比</h2>
<table>
<thead>
<tr>
<th style="text-align:left">評估維度</th>
<th style="text-align:left">大霹靂整合 (Big Bang)</th>
<th style="text-align:left">由上而下 (Top-Down)</th>
<th style="text-align:left">由下而上 (Bottom-Up)</th>
<th style="text-align:left">三明治整合 (Sandwich / Hybrid)</th>
</tr>
</thead>
<tbody>
<tr>
<td style="text-align:left"><strong>整合概念</strong></td>
<td style="text-align:left">全部模組寫完後一次拼裝</td>
<td style="text-align:left">從根節點往下逐步測試</td>
<td style="text-align:left">從葉節點往上逐步測試</td>
<td style="text-align:left">中間層為界，上下雙向夾擊</td>
</tr>
<tr>
<td style="text-align:left"><strong>輔助程式碼需求</strong></td>
<td style="text-align:left">無 (看似省事)</td>
<td style="text-align:left">需大量 <strong>Stubs</strong></td>
<td style="text-align:left">需大量 <strong>Drivers</strong></td>
<td style="text-align:left">同時需要少量 Stubs 與 Drivers</td>
</tr>
<tr>
<td style="text-align:left"><strong>缺陷定位難易度</strong></td>
<td style="text-align:left"><strong>極其困難 (災難)</strong></td>
<td style="text-align:left">容易 (歸咎於新加入模組)</td>
<td style="text-align:left">容易 (歸咎於底層或新呼叫)</td>
<td style="text-align:left">良好 (核心中介層定位清楚)</td>
</tr>
<tr>
<td style="text-align:left"><strong>系統雛形可見度</strong></td>
<td style="text-align:left">最晚 (最後一天才見到)</td>
<td style="text-align:left"><strong>最早 (前期即可見骨架)</strong></td>
<td style="text-align:left">較晚 (底層先完成)</td>
<td style="text-align:left">中等 (關鍵業務功能先串通)</td>
</tr>
<tr>
<td style="text-align:left"><strong>硬體/環境相依度</strong></td>
<td style="text-align:left">需所有環境完全就緒</td>
<td style="text-align:left">前期可完全依賴虛擬假樁</td>
<td style="text-align:left">初期直接依賴底層硬體/DB</td>
<td style="text-align:left">平衡兼顧</td>
</tr>
<tr>
<td style="text-align:left"><strong>適用團隊規模</strong></td>
<td style="text-align:left">極小型玩具專案</td>
<td style="text-align:left">架構驅動、重前端/展示型</td>
<td style="text-align:left">資料驅動、底層演算法核心</td>
<td style="text-align:left"><strong>現代大型敏捷企業專案 (推薦)</strong></td>
</tr>
</tbody>
</table>
<blockquote>
<p><img class="emoji" draggable="false" alt="📌" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4cc.svg" data-marp-twemoji=""/> <strong>三明治整合 (Sandwich Testing)</strong>：以系統中最關鍵的「業務服務層 (Service Layer)」為中界線，底層使用真實資料庫由下而上推進，頂層 UI 控制器則由上而下使用 Mock 替身收斂，兼具效率與品質！</p>
</blockquote>
<footer>Ch07 整合測試與測試替身</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="13" data-paginate="true" data-header="7.4 整合測試策略大比拼" data-footer="Ch07 整合測試與測試替身" data-theme="sqa-theme" lang="C" data-marpit-pagination="13" style="--paginate:true;--header:7.4 整合測試策略大比拼;--footer:Ch07 整合測試與測試替身;--theme:sqa-theme;" data-marpit-pagination-total="29">
<header>7.4 整合測試策略大比拼</header>

<h2 id="%E6%A6%82%E5%BF%B5%E6%A0%B8%E5%B0%8D%E5%95%8F%E7%AD%94-ccq-1">概念核對問答 (CCQ 1)</h2>
<div class="ccq-box">
<div class="ccq-text">
<p>你們團隊正在開發一套無人自動駕駛車輛控制系統。底層是直接與 CAN 匯流排感測器（光達、雷達、輪速計）通訊的高頻硬體通訊驅動模組，頂層是決策與路徑規劃演算法。硬體部門回報感測器實體電路板極為敏感脆弱且容易過熱故障。軟體測試工程師此時若要展開整合測試，最合理的策略應為何？</p>
<ul>
<li>A. 採用大霹靂整合，等待整車硬體與車載電腦全部組裝完畢後直接上路進行道路測試</li>
<li>B. 採用由下而上整合，直接在真實車輛上長時間持續讀取實體 CAN 匯流排感測器訊號</li>
<li>C. 採用由上而下整合，先為脆弱的底層硬體撰寫 Stubs 模擬雷達資料以驗證高層演算法</li>
<li>D. 完全不進行任何整合測試，只要感測器模組單元測試全數覆蓋即可直接出廠</li>
</ul>
</div>
</div>
<details class="quiz-details">
<summary>👉 點擊查看解答與詳細解析</summary>
<blockquote>
<p><strong>正確答案：C</strong><br />
<strong>解析</strong>：</p>
<ul>
<li><strong>選項 C 正確</strong>：底層硬體尚未穩定且容易過熱毀損時，採用「由上而下 (Top-Down)」策略，撰寫感測器模擬樁 (Stubs) 餵給決策與路徑規劃演算法，能夠在確保硬體安全的前提下，優先驗證高層關鍵決策邏輯！</li>
<li><strong>選項 A 錯誤</strong>：大霹靂整合在複雜系統中無異於自殺，一旦發生車禍完全無法分辨是演算法 Bug 還是感測器硬體訊號異常。</li>
<li><strong>選項 B 錯誤</strong>：硬體極為脆弱，直接由下而上密集測試可能導致硬體燒毀，測試受阻。</li>
<li><strong>選項 D 錯誤</strong>：單元測試無法驗證時序延遲與資料封包格式，不測整合必釀致命災難。</li>
</ul>
</blockquote>
</details>
<footer>Ch07 整合測試與測試替身</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="14" data-paginate="true" data-header="7.5 隔離架構與測試替身原則" data-footer="Ch07 整合測試與測試替身" data-theme="sqa-theme" lang="C" data-marpit-pagination="14" style="--paginate:true;--header:7.5 隔離架構與測試替身原則;--footer:Ch07 整合測試與測試替身;--theme:sqa-theme;" data-marpit-pagination-total="29">
<header>7.5 隔離架構與測試替身原則</header>

<h2 id="75-%E9%9A%94%E9%9B%A2%E6%9E%B6%E6%A7%8B%E8%88%87%E6%B8%AC%E8%A9%A6%E6%9B%BF%E8%BA%AB-test-double">7.5 隔離架構與測試替身 (Test Double)</h2>
<div class="split73">
<div class="left">
<h4 id="%F0%9F%8E%AD-%E7%82%BA%E4%BB%80%E9%BA%BC%E9%9C%80%E8%A6%81%E6%B8%AC%E8%A9%A6%E6%9B%BF%E8%BA%AB-test-double"><img class="emoji" draggable="false" alt="🎭" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f3ad.svg" data-marp-twemoji=""/> 為什麼需要測試替身 (Test Double)？</h4>
<p>在單元與整合測試中，真實相依元件往往具備下列<strong>五大惡劣特質</strong>：</p>
<ol>
<li><strong>速度極慢</strong>：連線真實關聯式資料庫或跨國 REST API 耗時數秒。</li>
<li><strong>行為不可預測</strong>：依賴伺服器當前系統時間 (<code>LocalDateTime.now()</code>) 或隨機亂數。</li>
<li><strong>不可重現的特殊故障</strong>：例如模擬「硬碟空間滿載 (Disk Full)」、「網路逾時 (Timeout)」。</li>
<li><strong>具備破壞性副作用</strong>：例如發送真實信用卡扣款、寄出真實促銷 Email。</li>
<li><strong>尚未開發完成</strong>：協同開發的另一組團隊 API 尚未交付。</li>
</ol>
<blockquote>
<p><img class="emoji" draggable="false" alt="💡" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4a1.svg" data-marp-twemoji=""/> <strong>名詞由來</strong>：Gerard Meszaros 在經典著作《xUnit Test Patterns》中，將電影中的「替身演員 (Stunt Double)」概念引進軟體工程，統稱為 <strong>Test Double</strong>。</p>
</blockquote>
</div>
<div class="right">
<p><img src="../../img/ch07/H1h-71BNp.png" alt="Test Double Family" /></p>
</div>
</div>
<footer>Ch07 整合測試與測試替身</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="15" data-paginate="true" data-header="7.5 隔離架構與測試替身原則" data-footer="Ch07 整合測試與測試替身" data-theme="sqa-theme" lang="C" data-marpit-pagination="15" style="--paginate:true;--header:7.5 隔離架構與測試替身原則;--footer:Ch07 整合測試與測試替身;--theme:sqa-theme;" data-marpit-pagination-total="29">
<header>7.5 隔離架構與測試替身原則</header>

<h2 id="751-gerard-meszaros-5-%E5%A4%A7%E6%B8%AC%E8%A9%A6%E6%9B%BF%E8%BA%AB%E5%AE%9A%E7%BE%A9">7.5.1 Gerard Meszaros 5 大測試替身定義</h2>
<div class="split55">
<div class="left">
<h4 id="1-%E8%99%9B%E8%A8%AD%E7%89%A9%E4%BB%B6-dummy-object">1. 虛設物件 (Dummy Object)</h4>
<ul>
<li><strong>用途</strong>：僅用於<strong>填塞方法參數簽名</strong>，受測邏輯內部根本從未呼叫它的任何方法。</li>
<li><strong>範例</strong>：<code>new User(&quot;test&quot;, null /* DummyAddress */);</code></li>
</ul>
<h4 id="2-%E6%B8%AC%E8%A9%A6%E6%A8%81-test-stub">2. 測試樁 (Test Stub)</h4>
<ul>
<li><strong>用途</strong>：提供<strong>固定的預設回傳值</strong>，支援受測目標的「間接輸入 (Indirect Input)」。</li>
<li><strong>特徵</strong>：內部沒有真實邏輯，呼叫 <code>stub.getBalance()</code> 一律固定回傳 <code>1000</code>。</li>
</ul>
<h4 id="3-%E6%B8%AC%E8%A9%A6%E9%96%93%E8%AB%9C-test-spy">3. 測試間諜 (Test Spy)</h4>
<ul>
<li><strong>用途</strong>：除了像 Stub 可以回傳假資料，更會<strong>秘密記錄方法被呼叫的次數與參數</strong>。</li>
<li><strong>範例</strong>：記錄 <code>sendEmail()</code> 是否被呼叫過、收件者地址為何。</li>
</ul>
</div>
<div class="right">
<h4 id="4-%E6%A8%A1%E6%93%AC%E7%89%A9%E4%BB%B6-mock-object">4. 模擬物件 (Mock Object)</h4>
<ul>
<li><strong>用途</strong>：具備<strong>嚴格的預期期望 (Expectation)</strong>，內建行為驗證邏輯。</li>
<li><strong>特徵</strong>：若未被呼叫到預期次數，或呼叫順序不對，測試直接拋出異常宣告失敗！</li>
</ul>
<h4 id="5-%E5%81%BD%E8%A3%9D%E7%89%A9%E4%BB%B6-fake-object">5. 偽裝物件 (Fake Object)</h4>
<ul>
<li><strong>用途</strong>：具備<strong>真實可運作的簡化版商業邏輯</strong>，但因效能或成本不適用於生產環境。</li>
<li><strong>範例</strong>：
<ul>
<li>使用記憶體 <code>HashMap</code> 實作的 <code>FakeUserRepository</code>。</li>
<li>H2 記憶體資料庫、LocalStack 模擬 AWS S3。</li>
</ul>
</li>
</ul>
</div>
</div>
<footer>Ch07 整合測試與測試替身</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="16" data-paginate="true" data-header="7.5 隔離架構與測試替身原則" data-footer="Ch07 整合測試與測試替身" data-theme="sqa-theme" lang="C" data-marpit-pagination="16" style="--paginate:true;--header:7.5 隔離架構與測試替身原則;--footer:Ch07 整合測試與測試替身;--theme:sqa-theme;" data-marpit-pagination-total="29">
<header>7.5 隔離架構與測試替身原則</header>

<h2 id="752-%E6%B8%AC%E8%A9%A6%E6%9B%BF%E8%BA%AB%E4%BA%94%E5%85%84%E5%BC%9F%E9%80%9F%E6%9F%A5%E8%88%87%E5%B0%8D%E6%AF%94%E8%A1%A8">7.5.2 測試替身五兄弟速查與對比表</h2>
<table>
<thead>
<tr>
<th style="text-align:left">替身類型</th>
<th style="text-align:left">核心使命</th>
<th style="text-align:left">是否有商業邏輯？</th>
<th style="text-align:left">是否驗證呼叫歷程？</th>
<th style="text-align:left">代表性使用情境</th>
</tr>
</thead>
<tbody>
<tr>
<td style="text-align:left"><strong>Dummy</strong></td>
<td style="text-align:left">填補非必要參數</td>
<td style="text-align:left"><img class="emoji" draggable="false" alt="❌" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/274c.svg" data-marp-twemoji=""/> 完全沒有</td>
<td style="text-align:left"><img class="emoji" draggable="false" alt="❌" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/274c.svg" data-marp-twemoji=""/> 不關心</td>
<td style="text-align:left">建構子必須傳入非空 Context，但本次測試不用</td>
</tr>
<tr>
<td style="text-align:left"><strong>Stub</strong></td>
<td style="text-align:left">餵入固定間接資料</td>
<td style="text-align:left"><img class="emoji" draggable="false" alt="❌" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/274c.svg" data-marp-twemoji=""/> 固定寫死</td>
<td style="text-align:left"><img class="emoji" draggable="false" alt="❌" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/274c.svg" data-marp-twemoji=""/> 不關心</td>
<td style="text-align:left">強制查詢服務回傳「商品庫存 = 0」，測試缺貨邏輯</td>
</tr>
<tr>
<td style="text-align:left"><strong>Spy</strong></td>
<td style="text-align:left">暗中刺探紀錄</td>
<td style="text-align:left"><img class="emoji" draggable="false" alt="⚠️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/26a0.svg" data-marp-twemoji=""/> 可封裝真實物件</td>
<td style="text-align:left"><img class="emoji" draggable="false" alt="✅" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/2705.svg" data-marp-twemoji=""/> 事後主動查詢歷程</td>
<td style="text-align:left">記錄是否有呼叫日誌記錄器、記下發送的 SMS 驗證碼</td>
</tr>
<tr>
<td style="text-align:left"><strong>Mock</strong></td>
<td style="text-align:left">嚴格行為契約檢查</td>
<td style="text-align:left"><img class="emoji" draggable="false" alt="❌" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/274c.svg" data-marp-twemoji=""/> 依宣告回應</td>
<td style="text-align:left"><img class="emoji" draggable="false" alt="✅" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/2705.svg" data-marp-twemoji=""/> 事前設定違背即死</td>
<td style="text-align:left">驗證 <code>paymentGateway.charge()</code> <strong>必須且僅能呼叫一次</strong></td>
</tr>
<tr>
<td style="text-align:left"><strong>Fake</strong></td>
<td style="text-align:left">輕量化快速替代品</td>
<td style="text-align:left"><img class="emoji" draggable="false" alt="✅" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/2705.svg" data-marp-twemoji=""/> 具備簡化邏輯</td>
<td style="text-align:left"><img class="emoji" draggable="false" alt="❌" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/274c.svg" data-marp-twemoji=""/> 不主動驗證</td>
<td style="text-align:left">用 <code>ConcurrentHashMap</code> 充當記憶體資料庫快速跑測試</td>
</tr>
</tbody>
</table>
<blockquote>
<p><img class="emoji" draggable="false" alt="🎯" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f3af.svg" data-marp-twemoji=""/> <strong>口訣記憶法</strong>：</p>
<ul>
<li><strong>Dummy</strong> 是啞巴木頭（純佔位）</li>
<li><strong>Stub</strong> 是錄音機（按播放就給固定聲音）</li>
<li><strong>Spy</strong> 是監視器（只錄影記錄，事後調閱）</li>
<li><strong>Mock</strong> 是嚴苛教官（事前規定好一切，走錯一步就嗶嗶）</li>
<li><strong>Fake</strong> 是替代役（真能做事，但裝備較簡陋）</li>
</ul>
</blockquote>
<footer>Ch07 整合測試與測試替身</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="17" data-paginate="true" data-header="7.5 隔離架構與測試替身原則" data-footer="Ch07 整合測試與測試替身" data-theme="sqa-theme" lang="C" data-marpit-pagination="17" style="--paginate:true;--header:7.5 隔離架構與測試替身原則;--footer:Ch07 整合測試與測試替身;--theme:sqa-theme;" data-marpit-pagination-total="29">
<header>7.5 隔離架構與測試替身原則</header>

<h2 id="753-%E8%84%86%E5%8C%96%E6%B8%AC%E8%A9%A6-brittle-tests-%E8%88%87%E9%81%8E%E5%BA%A6-mock-%E7%9A%84%E4%B8%89%E5%A4%A7%E5%8F%8D%E6%A8%A1%E5%BC%8F">7.5.3 脆化測試 (Brittle Tests) 與過度 Mock 的三大反模式</h2>
<div class="split55">
<div class="left">
<h4 id="%E2%9A%A0%EF%B8%8F-%E4%BB%80%E9%BA%BC%E6%98%AF%E8%84%86%E5%8C%96%E6%B8%AC%E8%A9%A6-brittle-tests"><img class="emoji" draggable="false" alt="⚠️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/26a0.svg" data-marp-twemoji=""/> 什麼是脆化測試 (Brittle Tests)？</h4>
<blockquote>
<p>「程式碼重構後功能完全正常、業務結果分毫不差，但測試案例卻紅成一片！」</p>
</blockquote>
<p>當測試案例過度深究受測目標的<strong>內部實作細節 (Implementation Details)</strong>，而非關注其<strong>最終公開輸出結果 (Observable State)</strong> 時，測試就會變得極度脆弱。</p>
<h4 id="%F0%9F%9A%AB-%E5%8F%8D%E6%A8%A1%E5%BC%8F-1%E5%9A%B4%E6%A0%BC%E9%A9%97%E8%AD%89%E5%85%A7%E9%83%A8%E5%91%BC%E5%8F%AB%E9%A0%86%E5%BA%8F"><img class="emoji" draggable="false" alt="🚫" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f6ab.svg" data-marp-twemoji=""/> 反模式 1：嚴格驗證內部呼叫順序</h4>
<ul>
<li>測試碼：<code>inOrder.verify(repo).findA(); inOrder.verify(repo).findB();</code></li>
<li>災難：工程師僅僅將兩行無相依性的資料庫查詢順序對調進行優化，測試立刻失敗！</li>
</ul>
</div>
<div class="right">
<h4 id="%F0%9F%9A%AB-%E5%8F%8D%E6%A8%A1%E5%BC%8F-2mock-%E4%BA%86%E9%8C%AF%E8%AA%A4%E7%9A%84%E4%BB%8B%E9%9D%A2%E5%A5%91%E7%B4%84"><img class="emoji" draggable="false" alt="🚫" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f6ab.svg" data-marp-twemoji=""/> 反模式 2：Mock 了錯誤的介面契約</h4>
<ul>
<li>開發者用 Mock 設定第三方程式庫回傳 <code>List.of()</code>。</li>
<li>真實環境中，第三方套件在查無資料時拋出 <code>ResourceNotFoundException</code>。</li>
<li><strong>結果</strong>：單元測試全面綠燈，一上線當天噴出未捕捉例外造成伺服器重啟！</li>
</ul>
<h4 id="%F0%9F%9A%AB-%E5%8F%8D%E6%A8%A1%E5%BC%8F-3%E9%81%8D%E5%9C%B0%E6%98%AF-mock%E5%AE%9B%E5%A6%82%E7%9A%87%E5%B8%9D%E7%9A%84%E6%96%B0%E8%A1%A3"><img class="emoji" draggable="false" alt="🚫" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f6ab.svg" data-marp-twemoji=""/> 反模式 3：遍地是 Mock，宛如皇帝的新衣</h4>
<ul>
<li>每個類別的依賴全部被 Mock 掉。</li>
<li>測試只不過是把受測類別裡面的程式碼用 Mockito 語法「重新抄寫了一遍」。</li>
<li><strong>下場</strong>：重構時痛不欲生，真正出問題的跨層整合卻完全沒測到。</li>
</ul>
</div>
</div>
<footer>Ch07 整合測試與測試替身</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="18" data-paginate="true" data-header="7.5 隔離架構與測試替身原則" data-footer="Ch07 整合測試與測試替身" data-theme="sqa-theme" lang="C" data-marpit-pagination="18" style="--paginate:true;--header:7.5 隔離架構與測試替身原則;--footer:Ch07 整合測試與測試替身;--theme:sqa-theme;" data-marpit-pagination-total="29">
<header>7.5 隔離架構與測試替身原則</header>

<h2 id="%E6%A6%82%E5%BF%B5%E6%A0%B8%E5%B0%8D%E5%95%8F%E7%AD%94-ccq-2">概念核對問答 (CCQ 2)</h2>
<div class="ccq-box">
<div class="ccq-text">
<p>資深架構師在審查小明的單元測試時，發現小明在測試 <code>OrderCheckoutService</code>（結帳服務）時，將底層的 <code>TaxCalculator</code>、<code>DiscountRuleEngine</code>、<code>InventoryClient</code> 全部使用 Mock 嚴格設定，甚至使用 <code>verify(taxCalculator, times(1)).calculate(...)</code>。架構師給予建議「不要過度 Mocking，應優先採用真實物件或 Fake 物件」。下列哪一項<strong>不是</strong>過度 Mock 帶來的缺點？</p>
<ul>
<li>A. 重構內部私有變數或調用結構時容易造成測試非預期脆化</li>
<li>B. Mockito 的動態代理反射機制會稍微增加測試執行時間</li>
<li>C. 容易忽略外部依賴升級或真實行為契約變動所帶來的崩潰</li>
<li>D. 測試案例能有效且精準地度量系統於高併發下的死結狀況</li>
</ul>
</div>
</div>
<details class="quiz-details">
<summary>👉 點擊查看解答與詳細解析</summary>
<blockquote>
<p><strong>正確答案：D</strong><br />
<strong>解析</strong>：</p>
<ul>
<li><strong>選項 D 為本題所求</strong>：「能精準度量高併發死結」完全不是 Mock 的特性，反而是過度 Mock <strong>絕對無法達成</strong>的事情！Mock 只是純記憶體虛擬物件，沒有真實資料庫鎖或交易隔離層，根本測不出 Deadlock。</li>
<li><strong>選項 A 是過度 Mock 缺點</strong>：與內部實作細節高度耦合，重構易脆化。</li>
<li><strong>選項 B 是缺點</strong>：過多 CGLIB / ByteBuddy 動態代理生成會增加測試運行開銷。</li>
<li><strong>選項 C 是致命缺點</strong>：Mock 往往隱蔽了真實套件的異常行為，形成假綠燈幻覺。</li>
</ul>
</blockquote>
</details>
<footer>Ch07 整合測試與測試替身</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="19" data-paginate="true" data-header="7.6 Mockito 實戰與行為驗證" data-footer="Ch07 整合測試與測試替身" data-theme="sqa-theme" lang="C" data-marpit-pagination="19" style="--paginate:true;--header:7.6 Mockito 實戰與行為驗證;--footer:Ch07 整合測試與測試替身;--theme:sqa-theme;" data-marpit-pagination-total="29">
<header>7.6 Mockito 實戰與行為驗證</header>

<h2 id="76-mockito-%E6%A0%B8%E5%BF%83%E8%AA%9E%E6%B3%95%E8%88%87-api-%E5%B0%8E%E8%A6%BD">7.6 Mockito 核心語法與 API 導覽</h2>
<div class="split55">
<div class="left">
<h4 id="%F0%9F%9B%A0%EF%B8%8F-mockito-%E6%98%AF%E4%BB%80%E9%BA%BC"><img class="emoji" draggable="false" alt="🛠️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f6e0.svg" data-marp-twemoji=""/> Mockito 是什麼？</h4>
<p>Java 生態系中最主流的 Mock 框架，語法優雅、接近自然語言可讀性。</p>
<h4 id="1-%E5%AE%A3%E5%91%8A%E8%88%87%E5%BB%BA%E7%AB%8B-mock-%E7%89%A9%E4%BB%B6">1. 宣告與建立 Mock 物件</h4>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-comment">// 手動建立</span>
<span class="hljs-type">OrderRepository</span> <span class="hljs-variable">mockRepo</span> <span class="hljs-operator">=</span> Mockito.mock(OrderRepository.class);

<span class="hljs-comment">// 或透過 JUnit 5 擴充註解</span>
<span class="hljs-meta">@ExtendWith(MockitoExtension.class)</span>
<span class="hljs-keyword">public</span> <span class="hljs-keyword">class</span> <span class="hljs-title class_">OrderServiceTest</span> {
    <span class="hljs-meta">@Mock</span> <span class="hljs-keyword">private</span> OrderRepository orderRepo;       <span class="hljs-comment">// 替身</span>
    <span class="hljs-meta">@Mock</span> <span class="hljs-keyword">private</span> PaymentClient paymentClient;     <span class="hljs-comment">// 替身</span>
    <span class="hljs-meta">@InjectMocks</span> <span class="hljs-keyword">private</span> OrderService orderService;<span class="hljs-comment">// 自動注入上方替身</span>
}
</code></pre>
</div>
<div class="right">
<h4 id="2-%E5%AE%9A%E7%BE%A9%E6%89%93%E6%A8%81%E8%A1%8C%E7%82%BA-stubbing">2. 定義打樁行為 (Stubbing)</h4>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-comment">// 當呼叫特定方法傳入特定參數時，回傳指定結果</span>
<span class="hljs-keyword">when</span>(orderRepo.findById(<span class="hljs-number">101L</span>))
    .thenReturn(Optional.of(<span class="hljs-keyword">new</span> <span class="hljs-title class_">Order</span>(<span class="hljs-number">101L</span>, <span class="hljs-string">&quot;Book&quot;</span>)));

<span class="hljs-comment">// 模擬拋出例外</span>
<span class="hljs-keyword">when</span>(paymentClient.charge(anyDouble()))
    .thenThrow(<span class="hljs-keyword">new</span> <span class="hljs-title class_">InsufficientFundsException</span>(<span class="hljs-string">&quot;餘額不足&quot;</span>));

<span class="hljs-comment">// 參數匹配器 (Argument Matchers)</span>
<span class="hljs-keyword">when</span>(orderRepo.save(any(Order.class)))
    .thenAnswer(invocation -&gt; invocation.getArgument(<span class="hljs-number">0</span>));
</code></pre>
<blockquote>
<p><img class="emoji" draggable="false" alt="⚠️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/26a0.svg" data-marp-twemoji=""/> <strong>注意</strong>：一旦用了 <code>any()</code>，同一方法的所有參數都必須使用 Matcher！</p>
</blockquote>
</div>
</div>
<footer>Ch07 整合測試與測試替身</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="20" data-paginate="true" data-header="7.6 Mockito 實戰與行為驗證" data-footer="Ch07 整合測試與測試替身" data-theme="sqa-theme" lang="C" data-marpit-pagination="20" style="--paginate:true;--header:7.6 Mockito 實戰與行為驗證;--footer:Ch07 整合測試與測試替身;--theme:sqa-theme;" data-marpit-pagination-total="29">
<header>7.6 Mockito 實戰與行為驗證</header>

<h2 id="761-mock-vs-spy-%E7%9A%84%E8%A1%8C%E7%82%BA%E5%B7%AE%E7%95%B0">7.6.1 Mock vs. Spy 的行為差異</h2>
<div class="split55">
<div class="left">
<h4 id="%F0%9F%8E%AD-mock-%E5%85%A8%E8%99%9B%E6%93%AC%E6%9B%BF%E8%BA%AB"><img class="emoji" draggable="false" alt="🎭" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f3ad.svg" data-marp-twemoji=""/> Mock (全虛擬替身)</h4>
<ul>
<li>預設情況下，Mock 物件的所有方法<strong>都不會執行真實程式碼</strong>。</li>
<li>若未對方法進行 <code>when().thenReturn()</code> 打樁：
<ul>
<li>物件型態回傳 <code>null</code></li>
<li>數值型態回傳 <code>0</code></li>
<li>布林型態回傳 <code>false</code></li>
<li>集合型態回傳空集合 <code>Collections.emptyList()</code></li>
</ul>
</li>
</ul>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java">List&lt;String&gt; mockList = mock(ArrayList.class);
mockList.add(<span class="hljs-string">&quot;Apple&quot;</span>); <span class="hljs-comment">// 什麼事都沒做！</span>
assertEquals(<span class="hljs-number">0</span>, mockList.size()); <span class="hljs-comment">// 通過！size() 預設回傳 0</span>
</code></pre>
</div>
<div class="right">
<h4 id="%F0%9F%95%B5%EF%B8%8F-spy-%E5%B1%80%E9%83%A8%E9%96%93%E8%AB%9C%E5%8C%85%E8%A3%9D">🕵️ Spy (局部間諜包裝)</h4>
<ul>
<li>Spy 封裝<strong>真實存在的實體物件</strong>。</li>
<li>預設情況下，會<strong>真實執行其底層方法</strong>，同時暗中記錄呼叫歷程！</li>
<li>只有被明確打樁的方法才會被攔截替換。</li>
</ul>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java">List&lt;String&gt; realList = <span class="hljs-keyword">new</span> <span class="hljs-title class_">ArrayList</span>&lt;&gt;();
List&lt;String&gt; spyList = spy(realList);

spyList.add(<span class="hljs-string">&quot;Apple&quot;</span>); <span class="hljs-comment">// 真實呼叫 ArrayList.add()</span>
assertEquals(<span class="hljs-number">1</span>, spyList.size()); <span class="hljs-comment">// 通過！真實大小為 1</span>

<span class="hljs-comment">// 對特定方法打樁 (需用 doReturn 避免先執行一次真實方法)</span>
doReturn(<span class="hljs-number">100</span>).<span class="hljs-keyword">when</span>(spyList).size();
assertEquals(<span class="hljs-number">100</span>, spyList.size()); <span class="hljs-comment">// size() 被篡改為 100</span>
</code></pre>
</div>
</div>
<footer>Ch07 整合測試與測試替身</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="21" data-paginate="true" data-header="7.6 Mockito 實戰與行為驗證" data-footer="Ch07 整合測試與測試替身" data-theme="sqa-theme" lang="C" data-marpit-pagination="21" style="--paginate:true;--header:7.6 Mockito 實戰與行為驗證;--footer:Ch07 整合測試與測試替身;--theme:sqa-theme;" data-marpit-pagination-total="29">
<header>7.6 Mockito 實戰與行為驗證</header>

<h2 id="762-verify-%E8%A1%8C%E7%82%BA%E9%A9%97%E8%AD%89%E8%88%87-argumentcaptor">7.6.2 Verify 行為驗證與 ArgumentCaptor</h2>
<div class="split55">
<div class="left">
<h4 id="%F0%9F%94%8D-%E9%A9%97%E8%AD%89%E6%96%B9%E6%B3%95%E6%98%AF%E5%90%A6%E8%A2%AB%E5%91%BC%E5%8F%AB-verify"><img class="emoji" draggable="false" alt="🔍" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f50d.svg" data-marp-twemoji=""/> 驗證方法是否被呼叫 (Verify)</h4>
<p>單元測試不只要測回傳值，有時更需要驗證「是否有正確委派動作」：</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-comment">// 驗證 save() 恰好被呼叫了 1 次</span>
verify(orderRepo, times(<span class="hljs-number">1</span>)).save(any(Order.class));

<span class="hljs-comment">// 驗證從未發送退款通知</span>
verify(notificationService, never()).sendRefund(any());

<span class="hljs-comment">// 驗證呼叫至少 2 次</span>
verify(auditLogger, atLeast(<span class="hljs-number">2</span>)).log(anyString());

<span class="hljs-comment">// 驗證除上述之外，該 mock 沒有其他額外交互</span>
verifyNoMoreInteractions(notificationService);
</code></pre>
</div>
<div class="right">
<h4 id="%F0%9F%8E%AF-%E5%8F%83%E6%95%B8%E6%8D%95%E7%8D%B2%E5%99%A8-argumentcaptor"><img class="emoji" draggable="false" alt="🎯" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f3af.svg" data-marp-twemoji=""/> 參數捕獲器 (ArgumentCaptor)</h4>
<p>當受測方法在內部組裝了物件傳入依賴模組時，可使用 Captor 攔截並深入斷言其內容：</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-meta">@Test</span>
<span class="hljs-keyword">void</span> <span class="hljs-title function_">testOrderCreationSetsDefaultStatus</span><span class="hljs-params">()</span> {
    orderService.createOrder(<span class="hljs-string">&quot;Alice&quot;</span>, <span class="hljs-number">500</span>);

    <span class="hljs-comment">// 建立 Order 型別的捕獲器</span>
    ArgumentCaptor&lt;Order&gt; captor = 
        ArgumentCaptor.forClass(Order.class);
    
    <span class="hljs-comment">// 攔截 orderRepo.save() 所收到的真實參數</span>
    verify(orderRepo).save(captor.capture());
    
    <span class="hljs-type">Order</span> <span class="hljs-variable">savedOrder</span> <span class="hljs-operator">=</span> captor.getValue();
    assertEquals(<span class="hljs-string">&quot;Alice&quot;</span>, savedOrder.getCustomer());
    assertEquals(OrderStatus.PENDING, savedOrder.getStatus());
}
</code></pre>
</div>
</div>
<footer>Ch07 整合測試與測試替身</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="22" data-paginate="true" data-header="7.6 Mockito 實戰與行為驗證" data-footer="Ch07 整合測試與測試替身" data-theme="sqa-theme" lang="C" data-marpit-pagination="22" style="--paginate:true;--header:7.6 Mockito 實戰與行為驗證;--footer:Ch07 整合測試與測試替身;--theme:sqa-theme;" data-marpit-pagination-total="29">
<header>7.6 Mockito 實戰與行為驗證</header>

<h2 id="763-labdemo-%E5%AF%A6%E6%88%B0%E5%B0%8E%E8%AE%80u07_mockito">7.6.3 LabDemo 實戰導讀：<code>u07_mockito</code></h2>
<div class="split55">
<div class="left">
<h4 id="%F0%9F%93%82-%E7%AF%84%E4%BE%8B%E5%B0%88%E6%A1%88%E8%B7%AF%E5%BE%91"><img class="emoji" draggable="false" alt="📂" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4c2.svg" data-marp-twemoji=""/> 範例專案路徑</h4>
<ul>
<li><strong>業務類別</strong>：<code>LabDemo/src/main/java/u07_mockito/PrimeService.java</code></li>
<li><strong>測試類別</strong>：<code>LabDemo/src/test/java/u07_mockito/PrimeServiceTest.java</code></li>
<li><strong>輔助案例</strong>：<code>OrderServiceTest.java</code> (訂單與庫存連動)</li>
</ul>
<h4 id="%F0%9F%A7%AA-%E6%B8%AC%E8%A9%A6%E7%9B%AE%E6%A8%99%E8%A7%A3%E6%9E%90"><img class="emoji" draggable="false" alt="🧪" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f9ea.svg" data-marp-twemoji=""/> 測試目標解析</h4>
<p>驗證 <code>PrimeService</code> 在計算範圍質數時，如何依賴外部的 <code>PrimeValidator</code>：</p>
<ol>
<li>正常質數過濾邏輯</li>
<li>當外部 Validator 拋出異常時的降級處理</li>
<li>驗證是否針對負數跳過驗證呼叫 (短路優化)</li>
</ol>
</div>
<div class="right">
<h4 id="%F0%9F%92%BB-%E7%B5%82%E7%AB%AF%E6%A9%9F%E5%9F%B7%E8%A1%8C%E6%8C%87%E4%BB%A4"><img class="emoji" draggable="false" alt="💻" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4bb.svg" data-marp-twemoji=""/> 終端機執行指令</h4>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-bash"><span class="hljs-comment"># 進入 LabDemo 專案目錄</span>
<span class="hljs-built_in">cd</span> SQA/LabDemo

<span class="hljs-comment"># 專門執行 u07_mockito 測試套件</span>
mvn <span class="hljs-built_in">test</span> -Dtest=PrimeServiceTest

<span class="hljs-comment"># 執行所有 mockito 相關測試</span>
mvn <span class="hljs-built_in">test</span> -Dtest=*Mockito*
</code></pre>
<blockquote>
<p><img class="emoji" draggable="false" alt="💡" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4a1.svg" data-marp-twemoji=""/> <strong>課堂任務</strong>：<br />
請打開 <code>PrimeServiceTest.java</code>，觀察 <code>@ExtendWith(MockitoExtension.class)</code> 如何與 <code>@InjectMocks</code> 協同工作，並嘗試新增一個負數邊界的 Mock 測試！</p>
</blockquote>
</div>
</div>
<footer>Ch07 整合測試與測試替身</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="23" data-paginate="true" data-header="7.7 Spring Boot 整合測試實務" data-footer="Ch07 整合測試與測試替身" data-theme="sqa-theme" lang="C" data-marpit-pagination="23" style="--paginate:true;--header:7.7 Spring Boot 整合測試實務;--footer:Ch07 整合測試與測試替身;--theme:sqa-theme;" data-marpit-pagination-total="29">
<header>7.7 Spring Boot 整合測試實務</header>

<h2 id="77-spring-boot-%E6%95%B4%E5%90%88%E6%B8%AC%E8%A9%A6%E5%AF%A6%E5%8B%99-integration-testing">7.7 Spring Boot 整合測試實務 (Integration Testing)</h2>
<div class="split55">
<div class="left">
<h4 id="%F0%9F%8F%97%EF%B8%8F-spring-%E6%B8%AC%E8%A9%A6%E4%B8%89%E5%A4%A7%E7%A5%9E%E5%99%A8%E6%AF%94%E8%BC%83"><img class="emoji" draggable="false" alt="🏗️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f3d7.svg" data-marp-twemoji=""/> Spring 測試三大神器比較</h4>
<ol>
<li><strong><code>@SpringBootTest</code> (全量整合)</strong>
<ul>
<li>載入完整的 ApplicationContext、所有 Bean、設定檔。</li>
<li>成本最高、耗時最久，但最貼近真實運行狀態。</li>
</ul>
</li>
<li><strong><code>@WebMvcTest</code> (控制層切片)</strong>
<ul>
<li>只載入 Spring MVC 元件（Controller、Filter、Converter）。</li>
<li>不載入 Service 與 Repository，需搭配 <code>@MockBean</code>。</li>
</ul>
</li>
<li><strong><code>@DataJpaTest</code> (持久層切片)</strong>
<ul>
<li>只載入實體類別與 Spring Data JPA Repository。</li>
<li>預設會自動連向記憶體資料庫 (H2)，每筆測試自動 Rollback。</li>
</ul>
</li>
</ol>
</div>
<div class="right">
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-mermaid">flowchart TD
    subgraph FullContext [&quot;全量環境 @SpringBootTest&quot;]
        C1[&quot;Controller&quot;]
        S1[&quot;Service&quot;]
        R1[&quot;Repository&quot;]
        C1 --&gt; S1 --&gt; R1
    end
    
    subgraph WebSlice [&quot;切片環境 @WebMvcTest&quot;]
        C2[&quot;Controller&quot;]
        M2[&quot;@MockBean Service&quot;]
        C2 --&gt; M2
    end
    
    subgraph DataSlice [&quot;切片環境 @DataJpaTest&quot;]
        R3[&quot;Repository&quot;]
        H3[(&quot;Embedded H2 DB&quot;)]
        R3 --&gt; H3
    end
</code></pre>
</div>
</div>
<footer>Ch07 整合測試與測試替身</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="24" data-paginate="true" data-header="7.7 Spring Boot 整合測試實務" data-footer="Ch07 整合測試與測試替身" data-theme="sqa-theme" lang="C" data-marpit-pagination="24" style="--paginate:true;--header:7.7 Spring Boot 整合測試實務;--footer:Ch07 整合測試與測試替身;--theme:sqa-theme;" data-marpit-pagination-total="29">
<header>7.7 Spring Boot 整合測試實務</header>

<h2 id="771-%E8%B3%AA%E6%95%B8%E8%A8%88%E7%AE%97-api-%E6%95%B4%E5%90%88%E6%B8%AC%E8%A9%A6%E7%AF%84%E4%BE%8B">7.7.1 質數計算 API 整合測試範例</h2>
<div class="split55">
<div class="left">
<h4 id="1-%E6%8E%A7%E5%88%B6%E5%99%A8%E7%AB%AF%E9%BB%9E-primecontrollerjava">1. 控制器端點 (<code>PrimeController.java</code>)</h4>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-meta">@RestController</span>
<span class="hljs-meta">@RequestMapping(&quot;/api/primes&quot;)</span>
<span class="hljs-keyword">public</span> <span class="hljs-keyword">class</span> <span class="hljs-title class_">PrimeController</span> {
    <span class="hljs-meta">@Autowired</span> <span class="hljs-keyword">private</span> PrimeService primeService;

    <span class="hljs-meta">@PostMapping(&quot;/calculate&quot;)</span>
    <span class="hljs-keyword">public</span> ResponseEntity&lt;PrimeResponse&gt; <span class="hljs-title function_">calculate</span><span class="hljs-params">(
            <span class="hljs-meta">@RequestBody</span> <span class="hljs-meta">@Valid</span> PrimeRequest req)</span> {
        List&lt;Integer&gt; primes = 
            primeService.getPrimesUpTo(req.getMaxNumber());
        <span class="hljs-keyword">return</span> ResponseEntity.ok(
            <span class="hljs-keyword">new</span> <span class="hljs-title class_">PrimeResponse</span>(primes, primes.size()));
    }
}
</code></pre>
<ul>
<li>接收 JSON 請求：<code>{&quot;maxNumber&quot;: 10}</code></li>
<li>輸出 JSON 回應：<code>{&quot;primes&quot;: [2, 3, 5, 7], &quot;count&quot;: 4}</code></li>
</ul>
</div>
<div class="right">
<h4 id="2-mockmvc-%E6%95%B4%E5%90%88%E6%B8%AC%E8%A9%A6-primeintegrationtestjava">2. MockMvc 整合測試 (<code>PrimeIntegrationTest.java</code>)</h4>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-meta">@SpringBootTest</span>

</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="25" data-paginate="true" data-header="7.8 現代真實環境整合：Testcontainers" data-footer="Ch07 整合測試與測試替身" data-theme="sqa-theme" lang="C" data-marpit-pagination="25" style="--paginate:true;--header:7.8 現代真實環境整合：Testcontainers;--footer:Ch07 整合測試與測試替身;--theme:sqa-theme;" data-marpit-pagination-total="29">
<header>7.8 現代真實環境整合：Testcontainers</header>

<h2 id="78-%E7%8F%BE%E4%BB%A3%E7%9C%9F%E5%AF%A6%E7%92%B0%E5%A2%83%E6%95%B4%E5%90%88testcontainers">7.8 現代真實環境整合：Testcontainers</h2>
<div class="split73">
<div class="left">
<h4 id="%F0%9F%92%A3-%E8%A8%98%E6%86%B6%E9%AB%94%E8%B3%87%E6%96%99%E5%BA%AB-h2sqlite-%E7%9A%84%E5%81%87%E7%B6%A0%E7%87%88%E5%B9%BB%E8%A6%BA"><img class="emoji" draggable="false" alt="💣" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4a3.svg" data-marp-twemoji=""/> 記憶體資料庫 (H2/SQLite) 的「假綠燈幻覺」</h4>
<p>許多團隊為了跑測試快速，在測試環境使用 H2，上線卻用 PostgreSQL / MySQL，導致無數災難：</p>
<ol>
<li><strong>SQL 方言與專屬函式</strong>：Postgres 的 <code>jsonb_extract_path</code> 或 MySQL 的 <code>ON DUPLICATE KEY UPDATE</code>，H2 根本不支援！</li>
<li><strong>序列與自增主鍵策略</strong>：跨事務處理與鎖定語法差異巨大。</li>
<li><strong>大小寫敏感度與字元編碼</strong>：Windows/Linux 或 H2/MySQL 的表名大小寫行為完全不同。</li>
</ol>
<blockquote>
<p><img class="emoji" draggable="false" alt="💡" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4a1.svg" data-marp-twemoji=""/> <strong>救星：Testcontainers！</strong><br />
透過 Docker Java API，在跑 JUnit 測試前<strong>動態拉起 100% 真實的 PostgreSQL / Redis 容器</strong>，跑完立即銷毀，徹底告別環境漂移！</p>
</blockquote>
</div>
<div class="right">
<p><img src="../../img/ch07/testcontainers_architecture_flow.jpg" alt="Testcontainers Architecture" /></p>
</div>
</div>
<footer>Ch07 整合測試與測試替身</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="26" data-paginate="true" data-header="7.8 現代真實環境整合：Testcontainers" data-footer="Ch07 整合測試與測試替身" data-theme="sqa-theme" lang="C" data-marpit-pagination="26" style="--paginate:true;--header:7.8 現代真實環境整合：Testcontainers;--footer:Ch07 整合測試與測試替身;--theme:sqa-theme;" data-marpit-pagination-total="29">
<header>7.8 現代真實環境整合：Testcontainers</header>

<h2 id="781-spring-boot--testcontainers-%E5%AF%A6%E6%88%B0%E9%85%8D%E7%BD%AE">7.8.1 Spring Boot + Testcontainers 實戰配置</h2>
<div class="split55">
<div class="left">
<h4 id="%F0%9F%93%A6-junit-5--postgresql-%E5%AE%B9%E5%99%A8%E5%AE%A3%E5%91%8A"><img class="emoji" draggable="false" alt="📦" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4e6.svg" data-marp-twemoji=""/> JUnit 5 + PostgreSQL 容器宣告</h4>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-meta">@SpringBootTest(webEnvironment = SpringBootTest.WebEnvironment.RANDOM_PORT)</span>
<span class="hljs-meta">@Testcontainers</span> <span class="hljs-comment">// 啟用 Testcontainers 生命週期</span>
<span class="hljs-keyword">public</span> <span class="hljs-keyword">class</span> <span class="hljs-title class_">OrderRepositoryIntegrationTest</span> {

    <span class="hljs-comment">// 定義動態容器，指定與生產環境完全相同的映像檔標籤</span>
    <span class="hljs-meta">@Container</span>
    <span class="hljs-keyword">static</span> PostgreSQLContainer&lt;?&gt; postgres = 
        <span class="hljs-keyword">new</span> <span class="hljs-title class_">PostgreSQLContainer</span>&lt;&gt;(<span class="hljs-string">&quot;postgres:15-alpine&quot;</span>)
            .withDatabaseName(<span class="hljs-string">&quot;testdb&quot;</span>)
            .withUsername(<span class="hljs-string">&quot;testuser&quot;</span>)
            .withPassword(<span class="hljs-string">&quot;testpass&quot;</span>);

    <span class="hljs-comment">// 動態覆寫 Spring Boot 資料庫連線屬性</span>
    <span class="hljs-meta">@DynamicPropertySource</span>
    <span class="hljs-keyword">static</span> <span class="hljs-keyword">void</span> <span class="hljs-title function_">configureProperties</span><span class="hljs-params">(DynamicPropertyRegistry registry)</span> {
        registry.add(<span class="hljs-string">&quot;spring.datasource.url&quot;</span>, postgres::getJdbcUrl);
        registry.add(<span class="hljs-string">&quot;spring.datasource.username&quot;</span>, postgres::getUsername);
        registry.add(<span class="hljs-string">&quot;spring.datasource.password&quot;</span>, postgres::getPassword);
    }
    <span class="hljs-comment">// ...</span>
</code></pre>
</div>
<div class="right">
<h4 id="%F0%9F%8C%9F-%E6%A0%B8%E5%BF%83%E9%81%8B%E8%A1%8C%E7%94%9F%E5%91%BD%E9%80%B1%E6%9C%9F"><img class="emoji" draggable="false" alt="🌟" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f31f.svg" data-marp-twemoji=""/> 核心運行生命週期</h4>
<ol>
<li><strong>測試啟動</strong>：Testcontainers 偵測 Docker Daemon，自動 <code>docker pull postgres:15-alpine</code>。</li>
<li><strong>隨機埠綁定</strong>：容器主機埠隨機映射（避免本機 <code>5432</code> 埠衝突）。</li>
<li><strong>連線注入</strong>：透過 <code>@DynamicPropertySource</code> 將動態 JDBC URL 注入 Spring Context。</li>
<li><strong>執行測試</strong>：執行 Flyway 資料庫遷移與真實 CRUD 測試。</li>
<li><strong>銷毀回收</strong>：測試結束後由 <strong>Ryuk 守護程序</strong>自動終止並刪除容器，環境不留任何垃圾！</li>
</ol>
<blockquote>
<p><img class="emoji" draggable="false" alt="📌" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4cc.svg" data-marp-twemoji=""/> <strong>相關手冊參閱</strong>：<code>LabDemo/docs/u08_integration/testcontainers_spring.md</code></p>
</blockquote>
</div>
</div>
<footer>Ch07 整合測試與測試替身</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="27" data-paginate="true" data-header="7.9 課堂實習與練習 (Lab &amp; Exercises)" data-footer="Ch07 整合測試與測試替身" data-theme="sqa-theme" lang="C" data-marpit-pagination="27" style="--paginate:true;--header:7.9 課堂實習與練習 (Lab &amp; Exercises);--footer:Ch07 整合測試與測試替身;--theme:sqa-theme;" data-marpit-pagination-total="29">
<header>7.9 課堂實習與練習 (Lab &amp; Exercises)</header>

<h2 id="79-%E6%9C%AC%E7%AB%A0%E5%AF%A6%E7%BF%92%E4%BB%BB%E5%8B%99%E8%88%87%E8%AA%B2%E5%BE%8C%E7%B7%B4%E7%BF%92">7.9 本章實習任務與課後練習</h2>
<div class="split55">
<div class="left">
<h4 id="%F0%9F%93%9D-%E5%AF%A6%E7%BF%92-1mockito-%E6%9C%8D%E5%8B%99%E9%9A%94%E9%9B%A2%E5%AF%A6%E4%BD%9C"><img class="emoji" draggable="false" alt="📝" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4dd.svg" data-marp-twemoji=""/> 實習 1：Mockito 服務隔離實作</h4>
<ul>
<li><strong>目標</strong>：完成 <code>PrimeServiceTest.java</code>。</li>
<li><strong>任務清單</strong>：
<ol>
<li>使用 <code>@Mock</code> 模擬 <code>PrimeValidator</code>。</li>
<li>練習 <code>when().thenReturn()</code> 與 <code>thenThrow()</code> 測試負數與邊界狀況。</li>
<li>使用 <code>ArgumentCaptor</code> 捕獲傳入驗證器的數值並進行屬性斷言。</li>
</ol>
</li>
</ul>
<h4 id="%F0%9F%93%9D-%E5%AF%A6%E7%BF%92-2spring-boot-mockmvc-api-%E6%95%B4%E5%90%88%E6%B8%AC%E8%A9%A6"><img class="emoji" draggable="false" alt="📝" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4dd.svg" data-marp-twemoji=""/> 實習 2：Spring Boot MockMvc API 整合測試</h4>
<ul>
<li><strong>目標</strong>：測試 <code>/api/primes/calculate</code> REST 端點。</li>
<li><strong>任務清單</strong>：
<ol>
<li>發送包含無效格式之 JSON 負載（如字串而非數字），驗證 HTTP 400 Bad Request。</li>
<li>使用 JSONPath 驗證回傳之質數陣列元素與長度。</li>
</ol>
</li>
</ul>
</div>
<div class="right">
<h4 id="%F0%9F%93%9D-%E8%AA%B2%E5%BE%8C%E6%8C%91%E6%88%B0%E4%B8%89%E6%98%8E%E6%B2%BB%E6%95%B4%E5%90%88%E5%AF%A6%E6%88%B0%E8%A8%AD%E8%A8%88"><img class="emoji" draggable="false" alt="📝" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4dd.svg" data-marp-twemoji=""/> 課後挑戰：三明治整合實戰設計</h4>
<p>假設你接手一間連鎖書店的電商結帳系統，包含：</p>
<ul>
<li><strong>Web UI</strong> (購物車頁面)</li>
<li><strong>OrderService</strong> (訂單計算與折扣)</li>
<li><strong>PaymentGateway</strong> (第三方金流)</li>
<li><strong>InventoryDB</strong> (庫存資料庫)</li>
</ul>
<p>請撰寫一份 1 頁整合測試規劃：</p>
<ol>
<li>哪些層級該用 <strong>Testcontainers</strong>？</li>
<li>哪些外部服務必須用 <strong>Mock / Stub</strong>？</li>
<li>如何防止測試脆化 (Brittle Test)？</li>
</ol>
<blockquote>
<p><img class="emoji" draggable="false" alt="🚀" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f680.svg" data-marp-twemoji=""/> <strong>LabDemo 快速連結</strong>：<br />
[u07_mockito 源碼目錄](file:///Users/nick-mini-26/oTeach/SQA/LabDemo/src/test/java/u07_mockito)<br />
[Spring 整合測試講義](file:///Users/nick-mini-26/oTeach/SQA/LabDemo/docs/u08_integration/Spring.md)</p>
</blockquote>
</div>
</div>
<footer>Ch07 整合測試與測試替身</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="28" data-paginate="true" data-footer="Ch07 整合測試與測試替身" data-class="lead" data-theme="sqa-theme" lang="C" class="lead" data-marpit-pagination="28" style="--paginate:true;--footer:Ch07 整合測試與測試替身;--class:lead;--theme:sqa-theme;" data-marpit-pagination-total="29">
<h1 id="%E7%B8%BD%E7%B5%90-summary">總結 (Summary)</h1>
<h3 id="%E6%95%B4%E5%90%88%E6%B8%AC%E8%A9%A6%E6%98%AF%E5%BE%9E%E7%A8%8B%E5%BC%8F%E7%A2%BC%E5%85%83%E4%BB%B6%E9%80%9A%E5%BE%80%E5%8F%AF%E9%9D%A0%E8%BB%9F%E9%AB%94%E7%B3%BB%E7%B5%B1%E7%9A%84%E5%BF%85%E7%B6%93%E4%B9%8B%E6%A9%8B">整合測試是從「程式碼元件」通往「可靠軟體系統」的必經之橋</h3>
<ol>
<li><strong>V 模型對應</strong>：單元測詳細設計，整合測試驗證架構與介面契約。</li>
<li><strong>策略選擇</strong>：由上而下重雛形但 Stubs 成本高；由下而上重穩定但驗證晚；企業推薦「三明治整合」。</li>
<li><strong>測試替身藝術</strong>：分清 Dummy, Stub, Spy, Mock, Fake 的職責；警惕過度 Mocking 造成的測試脆化。</li>
<li><strong>現代實踐標準</strong>：Spring Boot 切片測試 + Testcontainers 真實容器化測試，消除環境漂移與假綠燈幻覺！</li>
</ol>
<footer>Ch07 整合測試與測試替身</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="29" data-paginate="true" data-footer="Ch07 整合測試與測試替身" data-theme="sqa-theme" lang="C" data-marpit-pagination="29" style="--paginate:true;--footer:Ch07 整合測試與測試替身;--theme:sqa-theme;" data-marpit-pagination-total="29"><script>
(function() {
  function initHeaderDropdown() {
    var slideSections = document.querySelectorAll(".marp-slide");
    if (!slideSections || slideSections.length === 0) return;

    var sections = [];
    var seenTitles = new Set();
    
    slideSections.forEach(function(sec, idx) {
      var h2 = sec.querySelector("h2");
      if (!h2) return;
      var title = h2.textContent.trim();
      title = title.replace(/^[◄◀]\s*/, "").replace(/\s*[►▶]$/, "").trim();
      if (!title || title.length > 40) return;
      if (seenTitles.has(title)) return;
      
      seenTitles.add(title);
      sections.push({
        id: String(idx + 1),
        title: title
      });
    });

    if (sections.length === 0) return;

    function createDropdownWrapper(currentTitle) {
      var wrapper = document.createElement("div");
      wrapper.className = "header-nav-wrapper";
      
      var titleSpan = document.createElement("span");
      titleSpan.className = "nav-title";
      titleSpan.textContent = currentTitle;
      
      var icon = document.createElement("span");
      icon.className = "dropdown-icon";
      icon.textContent = " ▼";
      titleSpan.appendChild(icon);
      
      var dropdown = document.createElement("div");
      dropdown.className = "nav-dropdown";
      
      var grid = document.createElement("div");
      grid.className = "dropdown-grid";
      
      sections.forEach(function(s) {
        var item = document.createElement("a");
        item.className = "dropdown-item";
        item.href = "#" + s.id;
        
        var badge = document.createElement("span");
        badge.className = "badge";
        badge.textContent = "#" + s.id.padStart(2, "0");
        
        var itemText = document.createElement("span");
        itemText.className = "item-text";
        itemText.title = s.title;
        itemText.textContent = s.title;
        
        item.appendChild(badge);
        item.appendChild(itemText);
        
        item.addEventListener("click", function(e) {
          wrapper.classList.remove("is-open");
          dropdown.style.display = "none";
          window.location.hash = "#" + s.id;
          setTimeout(function() { dropdown.style.display = ""; }, 350);
        });
        
        grid.appendChild(item);
      });
      
      dropdown.appendChild(grid);
      wrapper.appendChild(titleSpan);
      wrapper.appendChild(dropdown);
      return wrapper;
    }

    document.addEventListener("click", function(e) {
      if (!e.target.closest(".header-nav-wrapper")) {
        document.querySelectorAll(".header-nav-wrapper.is-open").forEach(function(w) {
          w.classList.remove("is-open");
        });
      }
    });

    slideSections.forEach(function(sec) {
      var header = sec.querySelector("header");
      if (!header || header.dataset.navEnhanced) return;
      header.dataset.navEnhanced = "true";
      
      var title = header.textContent.trim();
      title = title.replace(/^[◄◀]\s*/, "").replace(/\s*[►▶]$/, "").trim();
      if (!title) return;
      
      header.innerHTML = "";
      var wrapper = createDropdownWrapper(title);
      header.appendChild(wrapper);
    });
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", initHeaderDropdown);
  } else {
    initHeaderDropdown();
  }
  setTimeout(initHeaderDropdown, 400);
})();
</script>
