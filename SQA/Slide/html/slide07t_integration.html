<h1 id="%E8%BB%9F%E9%AB%94%E5%93%81%E8%B3%AA%E8%88%87%E6%B8%AC%E8%A9%A6">軟體品質與測試</h1>
<h3 id="%E7%AC%AC-7-%E7%AB%A0%E6%95%B4%E5%90%88%E6%B8%AC%E8%A9%A6-integration-testing-%E8%88%87%E6%B8%AC%E8%A9%A6%E6%9B%BF%E8%BA%AB%E6%9E%B6%E6%A7%8B">第 7 章：整合測試 (Integration Testing) 與測試替身架構</h3>
<p>授課教師：薛念林 教授</p>
<blockquote>
<p>「單元測試證明了零件的完好，整合測試則驗證了齒輪的嚙合。」<br />
從純 Java 建構子依賴注入 (<code>Constructor DI</code>) 出發，親手實作 Top-Down (Stub)、Bottom-Up (Driver)、Mockito 測試替身與 <strong>Testcontainers 容器化資料庫實戰</strong>！</p>
</blockquote>
<footer>Ch07 整合測試與測試替身</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="2" data-paginate="true" data-header="本章大綱 (Outline)" data-footer="Ch07 整合測試與測試替身" data-class="outline-slide" data-theme="sqa-theme" lang="C" class="outline-slide" data-marpit-pagination="2" style="--paginate:true;--header:本章大綱 (Outline);--footer:Ch07 整合測試與測試替身;--class:outline-slide;--theme:sqa-theme;" data-marpit-pagination-total="31">

<h2 id="%E6%9C%AC%E7%AB%A0%E9%87%8D%E9%BB%9E%E5%B0%8E%E8%AE%80-key-highlights">本章重點導讀 (Key Highlights)</h2>
<div class="outline-columns">
<div>
<h3 id="%F0%9F%A7%A9-%E7%B4%94-java-%E6%BC%B8%E9%80%B2%E5%BC%8F%E6%95%B4%E5%90%88%E7%AD%96%E7%95%A5"><img class="emoji" draggable="false" alt="🧩" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f9e9.svg" data-marp-twemoji=""/> 純 Java 漸進式整合策略</h3>
<ul>
<li><a href="#3"><strong>7.1 整合測試與 V 開發模型 (V-Model)</strong></a>：
<ul>
<li>為什麼單元測試全綠燈，組裝起來卻崩潰？六大介面錯誤</li>
<li>純 Java 實戰剖析：<code>Calculator</code> 除以零之<strong>前後置契約失配</strong></li>
<li>建構子依賴注入 (<code>Constructor Injection</code>) 與三層架構呼叫鏈</li>
</ul>
</li>
<li><a href="#7"><strong>7.2 由下而上整合 (Bottom-Up Integration)</strong></a>：
<ul>
<li>核心哲學、測試驅動程式 (<strong>Test Driver</strong>) 與五步推進流程</li>
<li>純 Java 實戰：<code>RealPrimeChecker</code> ➔ <code>Prime</code> 真實組裝演練</li>
</ul>
</li>
<li><a href="#10"><strong>7.3 由上而下整合 (Top-Down Integration)</strong></a>：
<ul>
<li>核心哲學、測試存根 (<strong>Test Stub</strong>) 與質數列印三模組推演</li>
<li>純 Java 實戰：手寫 <code>MockPrimeChecker</code> Stub 隔離頂層測試</li>
</ul>
</li>
<li><a href="#12"><strong>7.4 整合測試策略比較 (Comparison)</strong></a>：
<ul>
<li>Big Bang、Top-Down、Bottom-Up 與三明治整合 (Sandwich) 評比</li>
<li><img class="emoji" draggable="false" alt="🎮" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f3ae.svg" data-marp-twemoji=""/> <em>互動模擬：四大整合策略演進與 Driver/Stub 動態追蹤</em> (CCQ 1)</li>
</ul>
</li>
</ul>
</div>
<div>
<h3 id="%F0%9F%8E%AD-%E6%B8%AC%E8%A9%A6%E6%9B%BF%E8%BA%ABmockito-%E8%88%87%E5%AE%B9%E5%99%A8%E5%8C%96%E5%AF%A6%E6%88%B0"><img class="emoji" draggable="false" alt="🎭" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f3ad.svg" data-marp-twemoji=""/> 測試替身、Mockito 與容器化實戰</h3>
<ul>
<li><a href="#16"><strong>7.5 隔離架構與測試替身原則 (Test Doubles)</strong></a>：
<ul>
<li>從 Driver/Stub 到 <strong>5 大替身</strong>（Dummy, Stub, Spy, Mock, Fake）</li>
<li>何時用 Mock vs. 真實物件（<code>Market</code> 台積電股價）、脆化測試反模式</li>
<li><img class="emoji" draggable="false" alt="🎯" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f3af.svg" data-marp-twemoji=""/> <em>互動練習：五大測試替身情境判別挑戰</em> (CCQ 2)</li>
</ul>
</li>
<li><a href="#22"><strong>7.6 Lab: Mockito 測試驅動與模擬 (<code>u07_mockito</code>)</strong></a>：
<ul>
<li><code>mock()</code>、<code>@Mock</code> + <code>@InjectMocks</code>、<code>spy()</code> 局部修補、<code>verify()</code> 抓漏</li>
</ul>
</li>
<li><a href="#26"><strong>7.7 Testcontainers 容器化資料庫實戰 (<code>u07_testcontainers</code>)</strong></a>：
<ul>
<li>H2 記憶體資料庫的「假綠燈幻覺」（JSONB、Upsert、約束碼）</li>
<li>純 Java JDBC + <code>@Testcontainers</code> 動態啟動真實 PostgreSQL 16</li>
<li><img class="emoji" draggable="false" alt="🎮" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f3ae.svg" data-marp-twemoji=""/> <em>互動模擬：H2 陷阱對照 ＆ Docker 容器 5 步生命週期</em></li>
</ul>
</li>
<li><a href="#30"><strong>7.8 課堂實習與綜合練習 (<code>LabDemo</code>)</strong></a>：
<ul>
<li><code>u07_mockito</code> 三大模組 + <code>u07_testcontainers</code> 實戰與必考快篩</li>
</ul>
</li>
</ul>
</div>
</div>

<header>7.1 整合測試與 V 開發模型</header>

<h1 id="71-%E6%95%B4%E5%90%88%E6%B8%AC%E8%A9%A6%E8%88%87-v-%E9%96%8B%E7%99%BC%E6%A8%A1%E5%9E%8B-v-model"><strong>7.1 整合測試與 V 開發模型 (V-Model)</strong></h1>
<blockquote>
<p>「兩把門鎖把手單獨旋轉都很順暢（單元測試 100% 通過），<br />
但安裝在同一扇雙開門上卻互相卡死——這就是為什麼我們需要整合測試。」</p>
</blockquote>
<footer>Ch07 整合測試與測試替身</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="4" data-paginate="true" data-header="7.1 整合測試與 V 開發模型" data-footer="Ch07 整合測試與測試替身" data-theme="sqa-theme" lang="C" data-marpit-pagination="4" style="--paginate:true;--header:7.1 整合測試與 V 開發模型;--footer:Ch07 整合測試與測試替身;--theme:sqa-theme;" data-marpit-pagination-total="31">
<header>7.1 整合測試與 V 開發模型</header>

<h2 id="%E7%82%BA%E4%BB%80%E9%BA%BC%E5%96%AE%E5%85%83%E6%B8%AC%E8%A9%A6%E5%85%A8%E9%81%8E%E7%B5%84%E8%A3%9D%E8%B5%B7%E4%BE%86%E5%8D%BB%E5%B4%A9%E6%BD%B0v-%E6%A8%A1%E5%9E%8B%E8%88%87%E6%B8%AC%E8%A9%A6%E5%B1%A4%E7%B4%9A">為什麼單元測試全過，組裝起來卻崩潰？V 模型與測試層級</h2>
<div class="card-deck">
<blockquote>
<p><img class="emoji" draggable="false" alt="💡" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4a1.svg" data-marp-twemoji=""/> 整合測試（Integration Testing）聚焦於檢驗多個類別、模組或服務在<strong>協同作業與介面傳遞</strong>時的交互正確性。</p>
</blockquote>
<div class="content-columns">
<div class="content-text">
<ul>
<li><strong>三大測試層級定位</strong>：
<ol>
<li><strong>單元測試</strong>：檢視個別類別或單一方法之內部邏輯（對應詳細設計）。</li>
<li><strong>整合測試 (Integration Testing)</strong>：檢驗多個模組之間的<strong>介面組合與參數契約</strong>。</li>
<li><strong>系統測試 (System Testing)</strong>：檢驗完整軟硬體系統整體行為與非功能品質（對應系統需求）。</li>
</ol>
</li>
<li><strong><img class="emoji" draggable="false" alt="⚠️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/26a0.svg" data-marp-twemoji=""/> 整合階段常見的六大錯誤</strong>：
<ol>
<li><strong>版本管理問題</strong>（A 模組升級了介面，B 模組仍用舊版）</li>
<li><strong>遺漏、重複或互相衝突的功能</strong>（雙方都沒做防呆，或重複扣款）</li>
<li><strong>不正確或不一致的資料結構</strong>（回傳陣列順序或單位定義不同）</li>
<li><strong>Client 送來的資料違反 Server 的前置條件 (Precondition)</strong></li>
<li><strong>錯誤的參數值傳遞</strong>（如寬高參數順序傳反）</li>
<li><strong>多執行緒 (Threads) 之間的資源互相衝突與死結</strong></li>
</ol>
</li>
</ul>
</div>
<div class="content-figure">
<p><img src="../../img/ch07/BknjbJHVT.png" alt="V-Model" /></p>
</div>
</div>
</div>
<footer>Ch07 整合測試與測試替身</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="5" data-paginate="true" data-header="7.1 整合測試與 V 開發模型" data-footer="Ch07 整合測試與測試替身" data-theme="sqa-theme" lang="C" data-marpit-pagination="5" style="--paginate:true;--header:7.1 整合測試與 V 開發模型;--footer:Ch07 整合測試與測試替身;--theme:sqa-theme;" data-marpit-pagination-total="31">
<header>7.1 整合測試與 V 開發模型</header>

<h2 id="%E7%B4%94-java-%E5%AF%A6%E6%88%B0%E6%A1%88%E4%BE%8B%E7%82%BA%E4%BB%80%E9%BA%BC%E5%85%A9%E5%80%8B-100-%E7%B6%A0%E7%87%88%E7%9A%84%E9%A1%9E%E5%88%A5%E6%95%B4%E5%90%88%E5%BE%8C%E5%8D%BB%E5%B4%A9%E6%BD%B0">純 Java 實戰案例：為什麼兩個 100% 綠燈的類別整合後卻崩潰？</h2>
<div class="card-deck">
<blockquote>
<p><img class="emoji" draggable="false" alt="💡" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4a1.svg" data-marp-twemoji=""/> See <a href="../../lab.html?file=LabDemo/src/main/java/u07_mockito/calculator/Calculator.java">Calculator.java</a> 與 <a href="../../lab.html?file=LabDemo/src/main/java/u07_mockito/calculator/RealCalculatorService.java">RealCalculatorService.java</a>: 「<strong>介面契約推諉 (Contract Mismatch)</strong>」！</p>
</blockquote>
<div class="two-columns">
<div class="card">
<h5 id="%F0%9F%92%BB-%E5%85%A9%E5%80%8B%E5%90%84%E8%87%AA%E7%8D%A8%E7%AB%8B%E9%96%8B%E7%99%BC%E7%9A%84%E7%B4%94-java-%E9%A1%9E%E5%88%A5"><img class="emoji" draggable="false" alt="💻" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4bb.svg" data-marp-twemoji=""/> 兩個各自獨立開發的純 Java 類別</h5>
<ul>
<li><strong>上層呼叫者 (<code>Calculator.java</code>，由工程師 A 開發)</strong>：<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-keyword">public</span> <span class="hljs-keyword">class</span> <span class="hljs-title class_">Calculator</span> {
    <span class="hljs-keyword">private</span> <span class="hljs-keyword">final</span> CalculatorService service;
    <span class="hljs-comment">// 透過建構子依賴注入 (Constructor DI)</span>
    <span class="hljs-keyword">public</span> <span class="hljs-title function_">Calculator</span><span class="hljs-params">(CalculatorService service)</span> {
        <span class="hljs-built_in">this</span>.service = service;
    }
    <span class="hljs-keyword">public</span> <span class="hljs-type">int</span> <span class="hljs-title function_">divide</span><span class="hljs-params">(<span class="hljs-type">int</span> a, <span class="hljs-type">int</span> b)</span> {
        <span class="hljs-comment">// 工程師 A 心想：「除以 0 的防呆應該由底層 Service 負責拋出</span>
        <span class="hljs-comment">// IllegalArgumentException 吧！」所以直接轉交：</span>
        <span class="hljs-keyword">return</span> service.divide(a, b);
    ...
</code></pre>
</li>
<li><strong>底層實作 (<code>RealCalculatorService.java</code>，by 工程師 B)</strong>：<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-keyword">public</span> <span class="hljs-keyword">class</span> <span class="hljs-title class_">RealCalculatorService</span> <span class="hljs-keyword">implements</span> <span class="hljs-title class_">CalculatorService</span> {
    <span class="hljs-meta">@Override</span>
    <span class="hljs-keyword">public</span> <span class="hljs-type">int</span> <span class="hljs-title function_">divide</span><span class="hljs-params">(<span class="hljs-type">int</span> a, <span class="hljs-type">int</span> b)</span> {
        <span class="hljs-comment">// 工程師 B 心想：「上層傳進來前一定已經檢查過 b != 0 了！」</span>
        <span class="hljs-keyword">return</span> a / b; <span class="hljs-comment">// 直接相除！</span>
    ...
</code></pre>
</li>
</ul>
</div>
<div class="card">
<h5 id="%F0%9F%92%A5-%E5%96%AE%E5%85%83%E6%B8%AC%E8%A9%A6%E5%85%A8%E7%B6%A0%E7%87%88-vs-%E7%9C%9F%E5%AF%A6%E6%95%B4%E5%90%88%E5%A4%A7%E7%88%86%E7%82%B8"><img class="emoji" draggable="false" alt="💥" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4a5.svg" data-marp-twemoji=""/> 單元測試全綠燈 vs. 真實整合大爆炸！</h5>
<ul>
<li><strong>1. A 做單元測試 (<a href="../../lab.html?file=LabDemo/src/test/java/u07_mockito/calculator/CalculatorTest.java#L87">CalculatorTest.java</a>)</strong> — <img class="emoji" draggable="false" alt="🟩" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f7e9.svg" data-marp-twemoji=""/> <strong>綠燈！</strong><pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-comment">// A 用 Mock 假設底層除以 0 會乖乖拋出 IllegalArgumentException：</span>
<span class="hljs-keyword">when</span>(calculatorService.divide(<span class="hljs-number">6</span>, <span class="hljs-number">0</span>))
    .thenThrow(IllegalArgumentException.class);
assertThrows(IllegalArgumentException.class,
    () -&gt; calculator.divide(<span class="hljs-number">6</span>, <span class="hljs-number">0</span>)); <span class="hljs-comment">// <img class="emoji" draggable="false" alt="✅" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/2705.svg" data-marp-twemoji=""/> 單元測試通過！</span>
</code></pre>
</li>
<li><strong>2. B 做單元測試 (<a href="../../lab.html?file=LabDemo/src/test/java/u07_mockito/calculator/RealCalculatorTest.java">RealCalculatorTest.java</a>)</strong> — <img class="emoji" draggable="false" alt="🟩" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f7e9.svg" data-marp-twemoji=""/> <strong>綠燈！</strong>
<ul>
<li>B 只測了正常數值 <code>divide(6,3)==2</code>，單元測試也通過！</li>
</ul>
</li>
<li><strong>3. 真實整合測試</strong> — <img class="emoji" draggable="false" alt="🟥" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f7e5.svg" data-marp-twemoji=""/> <strong>崩潰！</strong><pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-type">Calculator</span> <span class="hljs-variable">realCalc</span> <span class="hljs-operator">=</span> <span class="hljs-keyword">new</span> <span class="hljs-title class_">Calculator</span>(<span class="hljs-keyword">new</span> <span class="hljs-title class_">RealCalculatorService</span>());
realCalc.divide(<span class="hljs-number">6</span>, <span class="hljs-number">0</span>);
<span class="hljs-comment">// <img class="emoji" draggable="false" alt="💥" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4a5.svg" data-marp-twemoji=""/> 炸出 ArithmeticException: / by zero！而非預期的 IllegalArgumentException！</span>
</code></pre>
</li>
<li>單元測試用 Mock 只驗證了「你以為的假設」；唯有真實整合測試，才能抓出模組間「誰該負責檢查前置條件」的契約斷裂！</li>
</ul>
</div>
</div>
</div>
<footer>Ch07 整合測試與測試替身</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="6" data-paginate="true" data-header="7.1 整合測試與 V 開發模型" data-footer="Ch07 整合測試與測試替身" data-theme="sqa-theme" lang="C" data-marpit-pagination="6" style="--paginate:true;--header:7.1 整合測試與 V 開發模型;--footer:Ch07 整合測試與測試替身;--theme:sqa-theme;" data-marpit-pagination-total="31">
<header>7.1 整合測試與 V 開發模型</header>

<h2 id="%E6%94%AF%E6%8F%B4%E6%95%B4%E5%90%88%E6%B8%AC%E8%A9%A6%E7%9A%84%E7%A8%8B%E5%BC%8F%E8%A8%AD%E8%A8%88%E5%9F%BA%E7%9F%B3%E5%BB%BA%E6%A7%8B%E5%AD%90%E4%BE%9D%E8%B3%B4%E6%B3%A8%E5%85%A5-constructor-di">支援整合測試的程式設計基石：建構子依賴注入 (Constructor DI)</h2>
<div class="card-deck">
<div class="two-columns">
<div class="card">
<h4 id="%E2%9D%8C-%E5%85%A7%E9%83%A8%E7%A1%AC%E7%B7%A8%E7%A2%BC-new%E7%84%A1%E6%B3%95%E9%9A%94%E9%9B%A2%E8%88%87%E6%BC%B8%E9%80%B2%E6%95%B4%E5%90%88"><img class="emoji" draggable="false" alt="❌" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/274c.svg" data-marp-twemoji=""/> 內部硬編碼 <code>new</code>（無法隔離與漸進整合）</h4>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-keyword">public</span> <span class="hljs-keyword">class</span> <span class="hljs-title class_">Prime</span> {
    <span class="hljs-comment">// <img class="emoji" draggable="false" alt="❌" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/274c.svg" data-marp-twemoji=""/> 致命寫法：把底層實作死鎖在類別內部！</span>
    <span class="hljs-keyword">private</span> <span class="hljs-keyword">final</span> <span class="hljs-type">PrimeChecker</span> <span class="hljs-variable">checker</span> <span class="hljs-operator">=</span> <span class="hljs-keyword">new</span> <span class="hljs-title class_">RealPrimeChecker</span>();

    <span class="hljs-keyword">public</span> <span class="hljs-type">int</span>[] allPrime(<span class="hljs-type">int</span> n) { ... }
}
</code></pre>
<ul>
<li><strong>為什麼這樣寫會讓測試寸步難行？</strong>
<ol>
<li>若 <code>RealPrimeChecker</code> 還沒寫完，或內部需要連線真實資料庫，<code>Prime</code> 就<strong>完全無法單獨編譯與測試</strong>！</li>
<li>無法在由上而下測試時換成假程式 (<code>Stub</code>)，也無法在單元測試時注入 <code>Mockito</code> 替身。</li>
</ol>
</li>
</ul>
</div>
<div class="card">
<h4 id="%E2%9C%85-%E4%BE%9D%E8%B3%B4%E4%BB%8B%E9%9D%A2--%E5%BB%BA%E6%A7%8B%E5%AD%90%E6%B3%A8%E5%85%A5"><img class="emoji" draggable="false" alt="✅" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/2705.svg" data-marp-twemoji=""/> 依賴介面 + 建構子注入</h4>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-keyword">public</span> <span class="hljs-keyword">class</span> <span class="hljs-title class_">Prime</span> {
    <span class="hljs-keyword">private</span> <span class="hljs-keyword">final</span> PrimeChecker primeChecker; <span class="hljs-comment">// 依賴抽象介面</span>
    <span class="hljs-comment">// <img class="emoji" draggable="false" alt="✅" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/2705.svg" data-marp-twemoji=""/> 由外部決定要傳入「假樁 (Stub)」還是「真實物件 (Real)」！</span>
    <span class="hljs-keyword">public</span> <span class="hljs-title function_">Prime</span><span class="hljs-params">(PrimeChecker primeChecker)</span> {
        <span class="hljs-built_in">this</span>.primeChecker = primeChecker;
    }
    <span class="hljs-keyword">public</span> <span class="hljs-type">int</span>[] allPrime(<span class="hljs-type">int</span> n) { ... }
}
</code></pre>
<ul>
<li><strong>一套程式碼，支援三種測試階段自由插拔</strong>：
<ol>
<li><strong>由上而下測試 (Top-Down)</strong>：<code>new Prime(new MockPrimeChecker())</code> <em>(手寫 Stub)</em></li>
<li><strong>Mockito 動態模擬</strong>：<code>new Prime(mock(PrimeChecker.class))</code> <em>(動態 Mock)</em></li>
<li><strong>由下而上真實整合 (Bottom-Up)</strong>：<code>new Prime(new RealPrimeChecker())</code> <em>(真實組裝)</em></li>
</ol>
</li>
</ul>
</div>
</div>
</div>
<footer>Ch07 整合測試與測試替身</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="7" data-paginate="true" data-header="7.2 由下而上整合 (Bottom-Up)" data-footer="Ch07 整合測試與測試替身" data-class="lead" data-theme="sqa-theme" lang="C" class="lead" data-marpit-pagination="7" style="--paginate:true;--header:7.2 由下而上整合 (Bottom-Up);--footer:Ch07 整合測試與測試替身;--class:lead;--theme:sqa-theme;" data-marpit-pagination-total="31">
<header>7.2 由下而上整合 (Bottom-Up)</header>

<h1 id="72-%E7%94%B1%E4%B8%8B%E8%80%8C%E4%B8%8A%E6%95%B4%E5%90%88%E6%B8%AC%E8%A9%A6-bottom-up-integration"><strong>7.2 由下而上整合測試 (Bottom-Up Integration)</strong></h1>
<blockquote>
<p>「從最底層不依賴任何人的基礎模組測起；<br />
關鍵在於設計『測試驅動程式 (Test Driver)』主動餵入參數，地基穩固後再逐層往上真實組裝！」</p>
</blockquote>
<footer>Ch07 整合測試與測試替身</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="8" data-paginate="true" data-header="7.2 由下而上整合 (Bottom-Up)" data-footer="Ch07 整合測試與測試替身" data-theme="sqa-theme" lang="C" data-marpit-pagination="8" style="--paginate:true;--header:7.2 由下而上整合 (Bottom-Up);--footer:Ch07 整合測試與測試替身;--theme:sqa-theme;" data-marpit-pagination-total="31">
<header>7.2 由下而上整合 (Bottom-Up)</header>

<h2 id="%E7%94%B1%E4%B8%8B%E8%80%8C%E4%B8%8A%E6%95%B4%E5%90%88%E6%B8%AC%E8%A9%A6%E5%8E%9F%E7%90%86%E8%88%87%E4%BA%94%E6%AD%A5%E6%BC%B8%E9%80%B2%E6%8E%A8%E6%BC%94">由下而上整合測試原理與五步漸進推演</h2>
<div class="card-deck">
<div class="content-columns">
<div class="content-text">
<h4 id="%F0%9F%A7%B1-%E4%BA%94%E6%AD%A5%E6%BC%B8%E9%80%B2%E5%BC%8F%E7%94%B1%E4%B8%8B%E8%80%8C%E4%B8%8A%E6%95%B4%E5%90%88%E6%B5%81%E7%A8%8B"><img class="emoji" draggable="false" alt="🧱" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f9f1.svg" data-marp-twemoji=""/> 五步漸進式由下而上整合流程</h4>
<ol>
<li><strong>步驟 1（測試最底層葉節點）</strong>：
<ul>
<li>分別撰寫 <code>b</code>, <code>c</code>, <code>a</code> 等 <strong>Test Driver</strong>，測試模組 <strong>E, F, G, D</strong> 是否正常。</li>
</ul>
</li>
<li><strong>步驟 2（組裝第一層子系統）</strong>：
<ul>
<li>用真實模組 <strong>B</strong> 替換掉假驅動 <code>b</code>，改由上一層 Driver <code>a</code> 驅動測試 <strong>B-E-F</strong> 三者的真實互動！</li>
</ul>
</li>
<li><strong>步驟 3</strong>：用真實 <strong>C</strong> 替換 <code>c</code>，利用 Driver <code>a</code> 測試 <strong>B-C</strong> 溝通。</li>
<li><strong>步驟 4</strong>：用真實 <strong>D</strong> 替換 <code>d</code>，利用 Driver <code>a</code> 測試 <strong>B-C-D</strong> 溝通。</li>
<li><strong>步驟 5（全系統合龍）</strong>：
<ul>
<li>用最頂層真實模組 <strong>A</strong> 替換 <code>a</code>，利用測試驅動 <code>x</code> 測試 <strong>A-B, A-C, A-D</strong> 整體協作！</li>
</ul>
</li>
</ol>
<blockquote>
<p><img class="emoji" draggable="false" alt="🎯" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f3af.svg" data-marp-twemoji=""/> <strong>現代關鍵觀念</strong>：在 JUnit 時代，我們不需要另外寫 <code>main()</code> 當 Driver——<strong>每一個 <code>@Test</code> 測試方法本身就是一個標準的 Test Driver！</strong></p>
</blockquote>
</div>
<div class="content-figure">
<p><img src="../../img/ch07/HyQJGyS4T.png" alt="Bottom-Up Integration" /></p>
</div>
</div>
</div>
<footer>Ch07 整合測試與測試替身</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="9" data-paginate="true" data-header="7.2 由下而上整合 (Bottom-Up)" data-footer="Ch07 整合測試與測試替身" data-theme="sqa-theme" lang="C" data-marpit-pagination="9" style="--paginate:true;--header:7.2 由下而上整合 (Bottom-Up);--footer:Ch07 整合測試與測試替身;--theme:sqa-theme;" data-marpit-pagination-total="31">
<header>7.2 由下而上整合 (Bottom-Up)</header>

<h2 id="%E7%B4%94-java-%E7%94%B1%E4%B8%8B%E8%80%8C%E4%B8%8A%E5%AF%A6%E6%88%B0realprimechecker-%E2%9E%94-prime-%E6%BC%B8%E9%80%B2%E7%B5%84%E8%A3%9D">純 Java 由下而上實戰：<code>RealPrimeChecker</code> ➔ <code>Prime</code> 漸進組裝</h2>
<div class="card-deck">
<blockquote>
<p><img class="emoji" draggable="false" alt="💡" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4a1.svg" data-marp-twemoji=""/> 對照 <a href="../../lab.html?file=LabDemo/src/main/java/u07_mockito/prime/RealPrimeChecker.java">RealPrimeChecker.java</a>、<a href="../../lab.html?file=LabDemo/src/main/java/u07_mockito/prime/Prime.java">Prime.java</a> 與 <a href="../../lab.html?file=LabDemo/src/test/java/u07_mockito/prime/PrimeTest.java#L85">PrimeTest.java</a>，體驗零 Mock 的由下而上真實整合！</p>
</blockquote>
<div class="two-columns">
<div class="card">
<h5 id="1%EF%B8%8F%E2%83%A3-%E4%BB%A5-junit-driver-%E6%B8%AC%E8%A9%A6%E6%9C%80%E5%BA%95%E5%B1%A4-realprimechecker"><img class="emoji" draggable="false" alt="1️⃣" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/31-20e3.svg" data-marp-twemoji=""/> 以 JUnit Driver 測試最底層 <code>RealPrimeChecker</code></h5>
<ul>
<li><strong>底層葉節點</strong>：不依賴任何其他類別。<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-keyword">public</span> <span class="hljs-keyword">class</span> <span class="hljs-title class_">RealPrimeChecker</span> <span class="hljs-keyword">implements</span> <span class="hljs-title class_">PrimeChecker</span> {
    <span class="hljs-keyword">public</span> <span class="hljs-type">boolean</span> <span class="hljs-title function_">isPrime</span><span class="hljs-params">(<span class="hljs-type">int</span> num)</span> {
        <span class="hljs-keyword">if</span> (num &lt; <span class="hljs-number">2</span>) <span class="hljs-keyword">return</span> <span class="hljs-literal">false</span>;
        <span class="hljs-keyword">for</span> (<span class="hljs-type">int</span> <span class="hljs-variable">i</span> <span class="hljs-operator">=</span> <span class="hljs-number">2</span>; i * i &lt;= num; i++) {
            <span class="hljs-keyword">if</span> (num % i == <span class="hljs-number">0</span>) <span class="hljs-keyword">return</span> <span class="hljs-literal">false</span>;
        }
        <span class="hljs-keyword">return</span> <span class="hljs-literal">true</span>;
    }
}
</code></pre>
</li>
<li><strong>撰寫 Test Driver (<code>@Test</code>) 先把地基測穩</strong>：<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-meta">@Test</span> <span class="hljs-comment">// JUnit 測試方法即 Test Driver，主動丟參數給底層模組</span>
<span class="hljs-keyword">public</span> <span class="hljs-keyword">void</span> <span class="hljs-title function_">testRealIsPrimeDriver</span><span class="hljs-params">()</span> {
    <span class="hljs-type">RealPrimeChecker</span> <span class="hljs-variable">checker</span> <span class="hljs-operator">=</span> <span class="hljs-keyword">new</span> <span class="hljs-title class_">RealPrimeChecker</span>();
    assertTrue(checker.isPrime(<span class="hljs-number">2</span>));
    assertFalse(checker.isPrime(<span class="hljs-number">10</span>));
}
</code></pre>
</li>
</ul>
</div>
<div class="card">
<h5 id="2%EF%B8%8F%E2%83%A3-%E5%BA%95%E5%B1%A4%E9%80%9A%E9%81%8E%E5%BE%8C%E5%90%91%E4%B8%8A%E8%88%87%E7%9C%9F%E5%AF%A6-prime-%E7%B5%84%E8%A3%9D%E6%95%B4%E5%90%88"><img class="emoji" draggable="false" alt="2️⃣" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/32-20e3.svg" data-marp-twemoji=""/> 底層通過後，向上與真實 <code>Prime</code> 組裝整合！</h5>
<ul>
<li><strong>中層業務模組</strong>：呼叫 <code>isPrime(i)</code> 篩出所有質數。<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-keyword">public</span> <span class="hljs-keyword">class</span> <span class="hljs-title class_">Prime</span> {
    <span class="hljs-keyword">private</span> <span class="hljs-keyword">final</span> PrimeChecker primeChecker;
    <span class="hljs-keyword">public</span> <span class="hljs-title function_">Prime</span><span class="hljs-params">(PrimeChecker primeChecker)</span> {
        <span class="hljs-built_in">this</span>.primeChecker = primeChecker;
    }
    <span class="hljs-keyword">public</span> <span class="hljs-type">int</span>[] allPrime(<span class="hljs-type">int</span> n) {
        ArrayList&lt;Integer&gt; primes = <span class="hljs-keyword">new</span> <span class="hljs-title class_">ArrayList</span>&lt;&gt;();
        <span class="hljs-keyword">for</span> (<span class="hljs-type">int</span> <span class="hljs-variable">i</span> <span class="hljs-operator">=</span> <span class="hljs-number">2</span>; i &lt;= n; i++) {
            <span class="hljs-keyword">if</span> (primeChecker.isPrime(i)) primes.add(i);
        }
        <span class="hljs-keyword">return</span> primes.stream().mapToInt(i -&gt; i).toArray();
    }
}
</code></pre>
</li>
<li><strong>由下而上整合測試</strong>：<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-meta">@Test</span> <span class="hljs-comment">// 完全不用 Stub/Mock！直接把已驗證的真實底層裝進 Prime</span>
<span class="hljs-keyword">public</span> <span class="hljs-keyword">void</span> <span class="hljs-title function_">testAllPrimeWithRealPrimeChecker</span><span class="hljs-params">()</span> {
    <span class="hljs-type">PrimeChecker</span> <span class="hljs-variable">realCheck</span> <span class="hljs-operator">=</span> <span class="hljs-keyword">new</span> <span class="hljs-title class_">RealPrimeChecker</span>();
    <span class="hljs-type">Prime</span> <span class="hljs-variable">prime</span> <span class="hljs-operator">=</span> <span class="hljs-keyword">new</span> <span class="hljs-title class_">Prime</span>(realCheck); <span class="hljs-comment">// 真實組裝 B + E</span>
    assertArrayEquals(<span class="hljs-keyword">new</span> <span class="hljs-title class_">int</span>[]{<span class="hljs-number">2</span>, <span class="hljs-number">3</span>, <span class="hljs-number">5</span>, <span class="hljs-number">7</span>}, prime.allPrime(<span class="hljs-number">10</span>));
}
</code></pre>
</li>
</ul>
</div>
</div>
</div>
<footer>Ch07 整合測試與測試替身</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="10" data-paginate="true" data-header="7.3 由上而下整合 (Top-Down)" data-footer="Ch07 整合測試與測試替身" data-class="lead" data-theme="sqa-theme" lang="C" class="lead" data-marpit-pagination="10" style="--paginate:true;--header:7.3 由上而下整合 (Top-Down);--footer:Ch07 整合測試與測試替身;--class:lead;--theme:sqa-theme;" data-marpit-pagination-total="31">
<header>7.3 由上而下整合 (Top-Down)</header>

<h1 id="73-%E7%94%B1%E4%B8%8A%E8%80%8C%E4%B8%8B%E6%95%B4%E5%90%88%E6%B8%AC%E8%A9%A6-top-down-integration"><strong>7.3 由上而下整合測試 (Top-Down Integration)</strong></h1>
<blockquote>
<p>「當底層演算法或資料庫還沒寫好，但上層邏輯急需先行驗證時——<br />
先接上一個極簡的『假程式 / 存根 (Test Stub)』，讓高階模組能立刻跑起來！」</p>
</blockquote>
<footer>Ch07 整合測試與測試替身</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="11" data-paginate="true" data-header="7.3 由上而下整合 (Top-Down)" data-footer="Ch07 整合測試與測試替身" data-theme="sqa-theme" lang="C" data-marpit-pagination="11" style="--paginate:true;--header:7.3 由上而下整合 (Top-Down);--footer:Ch07 整合測試與測試替身;--theme:sqa-theme;" data-marpit-pagination-total="31">
<header>7.3 由上而下整合 (Top-Down)</header>

<h2 id="%E7%94%B1%E4%B8%8A%E8%80%8C%E4%B8%8B%E6%95%B4%E5%90%88%E6%B8%AC%E8%A9%A6%E5%8E%9F%E7%90%86%E8%88%87%E8%B3%AA%E6%95%B8%E5%88%97%E5%8D%B0%E4%B8%89%E6%A8%A1%E7%B5%84%E6%8E%A8%E6%BC%94">由上而下整合測試原理與「質數列印」三模組推演</h2>
<div class="card-deck">
<blockquote>
<p><img class="emoji" draggable="false" alt="💡" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4a1.svg" data-marp-twemoji=""/> <strong>Stubs (測試存根 / 假程式)</strong>：著重介面吻合、回傳固定假資料，不寫真實演算法！</p>
</blockquote>
<div class="two-columns-64">
<div class="card">
<h3 id="%E5%B9%B3%E8%A1%8C%E9%96%8B%E7%99%BC%E8%B3%AA%E6%95%B8%E5%88%97%E5%8D%B0-displayer-%E2%9E%94-allprime-%E2%9E%94-isprime">平行開發「質數列印 (<code>Displayer</code> ➔ <code>allPrime</code> ➔ <code>isPrime</code>)」</h3>
<ol>
<li><strong>階段一：先測最頂層 <code>display()</code>（此時 <code>allPrime</code> 還沒寫好）</strong>：
<ul>
<li>撰寫 <code>allPrime</code> 的 <strong>Stub</strong>，固定回傳 <code>{2,3,5,7}</code> 讓 <code>display()</code> 先行測試版面：</li>
</ul>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-type">int</span>[] allPrime(<span class="hljs-type">int</span> n) { <span class="hljs-keyword">return</span> <span class="hljs-keyword">new</span> <span class="hljs-title class_">int</span>[]{<span class="hljs-number">2</span>, <span class="hljs-number">3</span>, <span class="hljs-number">5</span>, <span class="hljs-number">7</span>}; } <span class="hljs-comment">// &lt;-- Stub 假程式</span>
</code></pre>
</li>
<li><strong>階段二：換上真實 <code>allPrime()</code>，搭配底層 <code>isPrime</code> 的手寫 Stub</strong>：<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-keyword">public</span> <span class="hljs-keyword">class</span> <span class="hljs-title class_">MockPrimeChecker</span> <span class="hljs-keyword">implements</span> <span class="hljs-title class_">PrimeChecker</span> { <span class="hljs-comment">// 手寫 Stub 類別</span>
    <span class="hljs-keyword">public</span> <span class="hljs-type">boolean</span> <span class="hljs-title function_">isPrime</span><span class="hljs-params">(<span class="hljs-type">int</span> n)</span> {
        <span class="hljs-keyword">return</span> (n == <span class="hljs-number">2</span> || n == <span class="hljs-number">3</span> || n == <span class="hljs-number">5</span>); <span class="hljs-comment">// 僅硬編碼 2, 3, 5 為質數！</span>
    }
}
<span class="hljs-meta">@Test</span> <span class="hljs-keyword">void</span> <span class="hljs-title function_">testAllPrimeWithMyMock</span><span class="hljs-params">()</span> {
    <span class="hljs-type">Prime</span> <span class="hljs-variable">prime</span> <span class="hljs-operator">=</span> <span class="hljs-keyword">new</span> <span class="hljs-title class_">Prime</span>(<span class="hljs-keyword">new</span> <span class="hljs-title class_">MockPrimeChecker</span>()); <span class="hljs-comment">// 注入手寫 Stub</span>
    assertArrayEquals(<span class="hljs-keyword">new</span> <span class="hljs-title class_">int</span>[]{<span class="hljs-number">2</span>, <span class="hljs-number">3</span>, <span class="hljs-number">5</span>}, prime.allPrime(<span class="hljs-number">5</span>)); <span class="hljs-comment">// <img class="emoji" draggable="false" alt="✅" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/2705.svg" data-marp-twemoji=""/> 通過！</span>
}
</code></pre>
</li>
<li><strong>階段三：最後才換成真實的 <code>RealPrimeChecker</code> 完成全系統整合！</strong></li>
</ol>
</div>
<div class="card">
<h3 id="%F0%9F%8F%9B%EF%B8%8F-%E7%94%B1%E4%B8%8A%E8%80%8C%E4%B8%8B%E4%BA%94%E6%AD%A5%E6%95%B4%E5%90%88%E6%B5%81%E7%A8%8B"><img class="emoji" draggable="false" alt="🏛️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f3db.svg" data-marp-twemoji=""/> 由上而下五步整合流程</h3>
<ul>
<li>先為底層撰寫 <code>b, c, d</code> <strong>Stubs</strong> 測試頂層 <strong>A</strong>；</li>
<li>再用真實 <strong>B, C, D</strong> 替換 <code>b, c, d</code>，並為更底層撰寫 <code>e, f, g</code> Stubs；</li>
<li>逐層往下替換，直到全部換成真模組！</li>
</ul>
<p><img src="../../img/ch07/Sye8GJrVT.png" alt="Top-Down Integration" /></p>
</div>
</div>
</div>
<footer>Ch07 整合測試與測試替身</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="12" data-paginate="true" data-header="7.4 整合測試策略大比拼" data-footer="Ch07 整合測試與測試替身" data-class="lead" data-theme="sqa-theme" lang="C" class="lead" data-marpit-pagination="12" style="--paginate:true;--header:7.4 整合測試策略大比拼;--footer:Ch07 整合測試與測試替身;--class:lead;--theme:sqa-theme;" data-marpit-pagination-total="31">
<header>7.4 整合測試策略大比拼</header>

<h1 id="74-%E6%95%B4%E5%90%88%E6%B8%AC%E8%A9%A6%E7%AD%96%E7%95%A5%E6%AF%94%E8%BC%83%E8%88%87%E4%B8%89%E6%98%8E%E6%B2%BB%E6%95%B4%E5%90%88%E6%B3%95"><strong>7.4 整合測試策略比較與三明治整合法</strong></h1>
<blockquote>
<p>「由上而下能提早確認高階流程但手寫 Stub 很累；由下而上 Driver 好寫但高階介面太晚驗證——<br />
實務上最常將兩者折衷結合，採用上下夾擊的『三明治整合法 (Sandwich Integration)』！」</p>
</blockquote>
<footer>Ch07 整合測試與測試替身</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="13" data-paginate="true" data-header="7.4 整合測試策略大比拼" data-footer="Ch07 整合測試與測試替身" data-theme="sqa-theme" lang="C" data-marpit-pagination="13" style="--paginate:true;--header:7.4 整合測試策略大比拼;--footer:Ch07 整合測試與測試替身;--theme:sqa-theme;" data-marpit-pagination-total="31">
<header>7.4 整合測試策略大比拼</header>

<h2 id="%E5%9B%9B%E5%A4%A7%E6%95%B4%E5%90%88%E6%B8%AC%E8%A9%A6%E7%AD%96%E7%95%A5%E5%85%A8%E6%96%B9%E4%BD%8D%E5%B0%8D%E6%AF%94%E7%9F%A9%E9%99%A3">四大整合測試策略全方位對比矩陣</h2>
<div class="card-deck">
<blockquote>
<p><img class="emoji" draggable="false" alt="💡" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4a1.svg" data-marp-twemoji=""/> 為什麼從剛才的 <code>MockPrimeChecker</code> 可以看出「<strong>設計 Stub 比設計 Driver 困難</strong>」？因為 <code>MockPrimeChecker</code> 只硬編碼到 5，一旦上層改測 <code>allPrime(10)</code> 就會因漏掉 7 而失靈！</p>
</blockquote>
<table>
<thead>
<tr>
<th style="text-align:left">評估維度</th>
<th style="text-align:left">大霹靂整合 (Big Bang)</th>
<th style="text-align:left">由上而下 (Top-Down)</th>
<th style="text-align:left">由下而上 (Bottom-Up)</th>
<th style="text-align:left">三明治整合 (Sandwich / 混合式)</th>
</tr>
</thead>
<tbody>
<tr>
<td style="text-align:left"><strong>核心整合方向</strong></td>
<td style="text-align:left">所有類別寫完一次全部拼裝</td>
<td style="text-align:left">從頂層主控/UI 往下逐步整合</td>
<td style="text-align:left">從底層基礎工具/DAO 往上整合</td>
<td style="text-align:left">以中間核心業務層為目標，上下夾擊</td>
</tr>
<tr>
<td style="text-align:left"><strong>所需輔助程式</strong></td>
<td style="text-align:left">無（看似省事，實則災難）</td>
<td style="text-align:left">需設計大量 <strong>Stubs（較困難）</strong></td>
<td style="text-align:left">需設計 <strong>Drivers（JUnit 即 Driver，較容易）</strong></td>
<td style="text-align:left">頂層用少量 Stubs，底層用 Drivers</td>
</tr>
<tr>
<td style="text-align:left"><strong>最大優勢</strong></td>
<td style="text-align:left">無須撰寫額外替身輔助碼</td>
<td style="text-align:left"><strong>儘早向使用者展示並確認系統介面與高階控制流程</strong></td>
<td style="text-align:left"><strong>底層地基穩固、Driver 易於以 JUnit 撰寫、錯誤易定位</strong></td>
<td style="text-align:left">兼顧早期高階流程確認與底層演算法穩定度</td>
</tr>
<tr>
<td style="text-align:left"><strong>主要缺點 / 風險</strong></td>
<td style="text-align:left">錯誤全混在一起，<strong>缺陷極難定位</strong></td>
<td style="text-align:left">手寫 Stub 難以模擬複雜狀態（如 <code>allPrime(10)</code> 漏掉 <code>7</code>）</td>
<td style="text-align:left"><strong>高階業務與 UI 最晚才成型</strong>，若需求變更將引發大幅重工</td>
<td style="text-align:left">需較周密的雙向測試規劃與團隊分工</td>
</tr>
<tr>
<td style="text-align:left"><strong>純 Java <code>Prime</code> 對應</strong></td>
<td style="text-align:left">全部寫完才第一次跑 <code>main()</code></td>
<td style="text-align:left"><code>new Prime(new MockPrimeChecker())</code></td>
<td style="text-align:left"><code>RealPrimeChecker</code> ➔ <code>new Prime(new RealPrimeChecker())</code></td>
<td style="text-align:left">頂層 UI 配 Stub、底層算術配 JUnit，於 <code>Prime</code> 層會師</td>
</tr>
</tbody>
</table>
</div>
<footer>Ch07 整合測試與測試替身</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="14" data-paginate="true" data-header="7.4 整合測試策略大比拼" data-footer="Ch07 整合測試與測試替身" data-theme="sqa-theme" lang="C" data-marpit-pagination="14" style="--paginate:true;--header:7.4 整合測試策略大比拼;--footer:Ch07 整合測試與測試替身;--theme:sqa-theme;" data-marpit-pagination-total="31">
<header>7.4 整合測試策略大比拼</header>

<header>7.4 整合測試策略大比拼</header>

<h2 id="%E6%A6%82%E5%BF%B5%E6%A0%B8%E5%B0%8D%E5%95%8F%E7%AD%94-ccq-1">概念核對問答 (CCQ 1)</h2>
<div class="ccq-columns">
<div class="ccq-text">

<p><strong>問題情境</strong>：<br />
團隊正在開發一套無人自動駕駛控制系統：底層是直接與感測器（光達、雷達）通訊的高頻硬體驅動模組，頂層是決策與路徑規劃演算法。硬體部門回報感測器實體電路板目前極為脆弱且容易過熱故障。軟體測試工程師此時若要展開整合測試，最合理的策略應為何？</p>
<ul>
<li><strong>A)</strong> 採用大霹靂整合，等待整車硬體與車載電腦全部組裝完畢後直接上路進行道路測試</li>
<li><strong>B)</strong> 採用由下而上整合，直接在真實車輛上長時間持續讀取實體匯流排感測器訊號</li>
<li><strong>C)</strong> 採用由上而下整合，先為脆弱的底層硬體撰寫 Stubs 模擬雷達資料以驗證高層演算法</li>
<li><strong>D)</strong> 完全不進行任何整合測試，只要感測器模組單元測試全數覆蓋即可直接出廠</li>
</ul>
</div>
<div class="ccq-logo">
<p><a href="https://nlhsueh.github.io/nickedupocket/#/student/sqa-ch07-ccq1" target="_blank"><img src="../../img/ch07/sqa-ch07-ccq1.png" alt="QR Code" /></a></p>
</div>
</div>
<footer>Ch07 整合測試與測試替身</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="16" data-paginate="true" data-header="7.5 隔離架構與測試替身原則" data-footer="Ch07 整合測試與測試替身" data-class="lead" data-theme="sqa-theme" lang="C" class="lead" data-marpit-pagination="16" style="--paginate:true;--header:7.5 隔離架構與測試替身原則;--footer:Ch07 整合測試與測試替身;--class:lead;--theme:sqa-theme;" data-marpit-pagination-total="31">
<header>7.5 隔離架構與測試替身原則</header>

<h1 id="75-%E9%9A%94%E9%9B%A2%E6%9E%B6%E6%A7%8B%E8%88%87%E6%B8%AC%E8%A9%A6%E6%9B%BF%E8%BA%AB%E5%8E%9F%E5%89%87-test-doubles"><strong>7.5 隔離架構與測試替身原則 (Test Doubles)</strong></h1>
<blockquote>
<p>「剛才為了測 <code>Prime</code> 還得自己手寫一個 <code>MockPrimeChecker.java</code> 類別，太麻煩了！<br />
現代測試架構將這種替代品統稱為『測試替身 (Test Double)』，並由 Mockito 動態生成！」</p>
</blockquote>
<footer>Ch07 整合測試與測試替身</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="17" data-paginate="true" data-header="7.5 隔離架構與測試替身原則" data-footer="Ch07 整合測試與測試替身" data-theme="sqa-theme" lang="C" data-marpit-pagination="17" style="--paginate:true;--header:7.5 隔離架構與測試替身原則;--footer:Ch07 整合測試與測試替身;--theme:sqa-theme;" data-marpit-pagination-total="31">
<header>7.5 隔離架構與測試替身原則</header>

<h2 id="%E9%82%8F%E8%BC%AF%E4%B8%B2%E6%8E%A5%E5%BE%9E-stubsdrivers-%E5%88%B0-gerard-meszaros-%E4%BA%94%E5%A4%A7%E6%B8%AC%E8%A9%A6%E6%9B%BF%E8%BA%AB">邏輯串接：從 Stubs/Drivers 到 Gerard Meszaros 五大測試替身</h2>
<div class="card-deck">
<blockquote>
<p><img class="emoji" draggable="false" alt="💡" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4a1.svg" data-marp-twemoji=""/> 在現代 JUnit 5 架構中，<strong><code>@Test</code> 本身就是 Driver</strong>；而用來隔離真實依賴的五種替代品則統稱為 <strong>Test Double（測試替身，源自電影替身演員 Stunt Double）</strong>！</p>
</blockquote>
<div class="two-columns-64">
<div class="card">
<ol>
<li><strong>Dummy Object (虛設物件)</strong>：僅用來<strong>填充建構子或方法的必填參數列表</strong>，測試過程中完全不會被調用（通常直接傳入 <code>null</code> 或空物件）。</li>
<li><strong>Stub (樁物件 / 填補物件)</strong>：
<ul>
<li>為受測物件提供<strong>硬編碼或預設的固定回傳值</strong>（如<code>when(checker.isPrime(3)).thenReturn(true)</code>），專司「提供間接輸入」。</li>
</ul>
</li>
<li><strong>Spy (間諜物件)</strong>：包裹真實物件（或部分實作物件），未打樁時執行原本邏輯，同時<strong>秘密記錄被調用的次數與參數</strong>。</li>
<li><strong>Mock Object (模擬物件)</strong>：
<ul>
<li>專注於<strong>行為驗證 (Behavior Verification)</strong>，透過 <code>verify()</code> 檢驗 SUT 是否依預期次數、參數與順序呼叫依賴項。</li>
</ul>
</li>
<li><strong>Fake Object (偽物件)</strong>：
<ul>
<li>擁有<strong>真實可運作但簡化的邏輯實作</strong>（如用 Java <code>HashMap</code> 實作的記憶體資料庫 <code>FakeUserRepository</code>），有狀態且會動，但不適合正式生產環境。</li>
</ul>
</li>
</ol>
</div>
<div class="card">
<h3 id="%F0%9F%93%8A-%E4%BA%94%E5%A4%A7%E6%B8%AC%E8%A9%A6%E6%9B%BF%E8%BA%AB%E9%80%9F%E6%9F%A5%E8%A1%A8"><img class="emoji" draggable="false" alt="📊" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4ca.svg" data-marp-twemoji=""/> 五大測試替身速查表</h3>
<table>
<thead>
<tr>
<th style="text-align:left">替身種類</th>
<th style="text-align:left">核心職責與口訣</th>
<th style="text-align:center">驗證焦點</th>
</tr>
</thead>
<tbody>
<tr>
<td style="text-align:left"><strong>Dummy</strong></td>
<td style="text-align:left">純湊數佔位參數（啞巴木頭）</td>
<td style="text-align:center">無</td>
</tr>
<tr>
<td style="text-align:left"><strong>Stub</strong></td>
<td style="text-align:left">提供固定預設回傳值（錄音機）</td>
<td style="text-align:center"><strong>狀態驗證</strong><br /><em>(State)</em></td>
</tr>
<tr>
<td style="text-align:left"><strong>Spy</strong></td>
<td style="text-align:left">包裝真實物件並局部打樁（監視器）</td>
<td style="text-align:center">狀態 + 行為</td>
</tr>
<tr>
<td style="text-align:left"><strong>Mock</strong></td>
<td style="text-align:left">驗證互動次數與參數（嚴格教官）</td>
<td style="text-align:center"><strong>行為驗證</strong><br /><em>(Behavior)</em></td>
</tr>
<tr>
<td style="text-align:left"><strong>Fake</strong></td>
<td style="text-align:left">輕量簡化版可用實作（<code>HashMap</code> DB）</td>
<td style="text-align:center"><strong>狀態驗證</strong><br /><em>(State)</em></td>
</tr>
</tbody>
</table>
</div>
</div>
</div>
<footer>Ch07 整合測試與測試替身</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="18" data-paginate="true" data-header="7.5 隔離架構與測試替身原則" data-footer="Ch07 整合測試與測試替身" data-theme="sqa-theme" lang="C" data-marpit-pagination="18" style="--paginate:true;--header:7.5 隔離架構與測試替身原則;--footer:Ch07 整合測試與測試替身;--theme:sqa-theme;" data-marpit-pagination-total="31">
<header>7.5 隔離架構與測試替身原則</header>

<h2 id="%E7%82%BA%E4%BB%80%E9%BA%BC%E9%9C%80%E8%A6%81%E6%B8%AC%E8%A9%A6%E6%9B%BF%E8%BA%AB%E4%BB%A5-labdemo-%E8%82%A1%E7%A5%A8%E5%B8%82%E5%80%BC%E8%A8%88%E7%AE%97-markettest-%E7%82%BA%E4%BE%8B">為什麼需要測試替身？以 <code>LabDemo</code> 股票市值計算 (<code>MarketTest</code>) 為例</h2>
<div class="card-deck">
<blockquote>
<p><img class="emoji" draggable="false" alt="💡" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4a1.svg" data-marp-twemoji=""/> <a href="../../lab.html?file=LabDemo/src/main/java/u07_mockito/stock/Market.java">Market.java</a> 與 <a href="../../lab.html?file=LabDemo/src/test/java/u07_mockito/stock/MarketTest.java">MarketTest.java</a>：如果 <code>Market.getMarketValue()</code> 直接連線證交所 API 抓台積電 (<code>2330</code>) 即時股價?</p>
</blockquote>
<div class="two-columns">
<div class="card">
<h3 id="%F0%9F%93%88-%E7%82%BA%E4%BB%80%E9%BA%BC%E7%9C%9F%E5%AF%A6%E8%82%A1%E5%83%B9-api-%E4%B8%8D%E8%83%BD%E7%9B%B4%E6%8E%A5%E6%8B%BF%E4%BE%86%E8%B7%91%E5%96%AE%E5%85%83%E6%B8%AC%E8%A9%A6"><img class="emoji" draggable="false" alt="📈" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4c8.svg" data-marp-twemoji=""/> 為什麼真實股價 API 不能直接拿來跑單元測試？</h3>
<ul>
<li><strong>1. 股價每秒跳動（不確定性 Non-deterministic）</strong>：
<ul>
<li>早上測台積電 <code>1035</code> 元通過，下午漲到 <code>1050</code> 元，<code>assertEquals(29850, marketValue)</code> 當場紅燈失敗！</li>
</ul>
</li>
<li><strong>2. 外部網路緩慢、收盤或斷線（環境脆弱）</strong>。</li>
<li><strong><img class="emoji" draggable="false" alt="💻" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4bb.svg" data-marp-twemoji=""/> <code>Market.java</code> 待測業務邏輯</strong>：<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-keyword">public</span> <span class="hljs-keyword">class</span> <span class="hljs-title class_">Market</span> {
    <span class="hljs-keyword">private</span> StockService stockService; <span class="hljs-comment">// 外部股價查詢介面</span>
    <span class="hljs-keyword">private</span> List&lt;Stock&gt; stocks;        <span class="hljs-comment">// 持股清單 (股票代號, 股數)</span>

    <span class="hljs-keyword">public</span> <span class="hljs-type">double</span> <span class="hljs-title function_">getMarketValue</span><span class="hljs-params">()</span> {
        <span class="hljs-type">double</span> <span class="hljs-variable">marketValue</span> <span class="hljs-operator">=</span> <span class="hljs-number">0.0</span>;
        <span class="hljs-keyword">for</span> (Stock stock : stocks) {
            <span class="hljs-comment">// 呼叫外部服務取得單價 × 持有股數</span>
            marketValue += stockService.getPrice(stock)
                         * stock.getQuantity();
        }
        <span class="hljs-keyword">return</span> marketValue;
    }
}
</code></pre>
</li>
</ul>
</div>
<div class="card">
<h3 id="%F0%9F%A7%AA-markettestjava%E7%94%A8-stub-%E5%87%8D%E7%B5%90%E5%A4%96%E9%83%A8%E8%82%A1%E5%83%B9"><img class="emoji" draggable="false" alt="🧪" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f9ea.svg" data-marp-twemoji=""/> <code>MarketTest.java</code>：用 Stub 凍結外部股價！</h3>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-keyword">public</span> <span class="hljs-keyword">class</span> <span class="hljs-title class_">MarketTest</span> {
    <span class="hljs-meta">@Test</span>
    <span class="hljs-keyword">public</span> <span class="hljs-keyword">void</span> <span class="hljs-title function_">testMarketValue</span><span class="hljs-params">()</span> {
        <span class="hljs-type">Market</span> <span class="hljs-variable">market</span> <span class="hljs-operator">=</span> <span class="hljs-keyword">new</span> <span class="hljs-title class_">Market</span>();
        <span class="hljs-comment">// 1. 建立外部 StockService 的替身物件</span>
        <span class="hljs-type">StockService</span> <span class="hljs-variable">stockService</span> <span class="hljs-operator">=</span> mock(StockService.class);
        market.setStockService(stockService);

        <span class="hljs-comment">// 2. 準備持股：10 股台積電 (2330) + 100 股元大台灣50 (0050)</span>
        <span class="hljs-type">Stock</span> <span class="hljs-variable">tsmc</span> <span class="hljs-operator">=</span> <span class="hljs-keyword">new</span> <span class="hljs-title class_">Stock</span>(<span class="hljs-string">&quot;2330&quot;</span>, <span class="hljs-string">&quot;TSMC&quot;</span>, <span class="hljs-number">10</span>);
        <span class="hljs-type">Stock</span> <span class="hljs-variable">etf0050</span> <span class="hljs-operator">=</span> <span class="hljs-keyword">new</span> <span class="hljs-title class_">Stock</span>(<span class="hljs-string">&quot;0050&quot;</span>, <span class="hljs-string">&quot;0050&quot;</span>, <span class="hljs-number">100</span>);
        market.setStocks(List.of(tsmc, etf0050));

        <span class="hljs-comment">// 3. 佈樁 (Stubbing)：固定回傳假設股價，徹底隔離證交所網路！</span>
        <span class="hljs-keyword">when</span>(stockService.getPrice(tsmc)).thenReturn(<span class="hljs-number">1035.0</span>);
        <span class="hljs-keyword">when</span>(stockService.getPrice(etf0050)).thenReturn(<span class="hljs-number">195.0</span>);

        <span class="hljs-comment">// 4. 斷言總市值：1035*10 + 195*100 = 10350 + 19500 = 29850</span>
        assertEquals(<span class="hljs-number">29850.0</span>, market.getMarketValue());
    }
}
</code></pre>
<blockquote>
<p><img class="emoji" draggable="false" alt="🎯" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f3af.svg" data-marp-twemoji=""/> <strong>注意到嗎？</strong> 這裡我們對 <code>StockService</code>（外部網路依賴）用了 <strong>Mock/Stub</strong>，但對 <code>Stock</code>（純資料實體）與 <code>ArrayList</code> 則是直接 <code>new</code> <strong>真實物件</strong>！</p>
</blockquote>
</div>

</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="19" data-paginate="true" data-header="7.5 隔離架構與測試替身原則" data-footer="Ch07 整合測試與測試替身" data-theme="sqa-theme" lang="C" data-marpit-pagination="19" style="--paginate:true;--header:7.5 隔離架構與測試替身原則;--footer:Ch07 整合測試與測試替身;--theme:sqa-theme;" data-marpit-pagination-total="31">
<header>7.5 隔離架構與測試替身原則</header>

<h2 id="%E4%BD%95%E6%99%82%E8%A9%B2%E7%94%A8-mock%E4%BD%95%E6%99%82%E4%B8%8D%E8%A9%B2%E7%94%A8%E8%AD%A6%E6%83%95%E8%84%86%E5%8C%96%E6%B8%AC%E8%A9%A6-brittle-tests">何時該用 Mock？何時不該用？警惕「脆化測試 (Brittle Tests)」</h2>
<div class="card-deck">
<blockquote>
<p><img class="emoji" draggable="false" alt="💡" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4a1.svg" data-marp-twemoji=""/> <strong>測試應專注於外顯行為 (Behavior-centric)，而非內部實作細節 (Implementation-centric)</strong>！濫用 Mock 將使測試淪為重構的絆腳石。</p>
</blockquote>
<div class="two-columns">
<div class="card">
<ul>
<li>
<p><strong><img class="emoji" draggable="false" alt="✅" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/2705.svg" data-marp-twemoji=""/> 適合使用 Mock / Stub 的四大情境</strong>：</p>
<ol>
<li><strong>外部或第三方依賴</strong>：如 <code>StockService</code> 股價 API、簡訊發送、信用卡扣款閘道。</li>
<li><strong>共享或緩慢的外部資源</strong>：遠端資料庫查詢、檔案系統 I/O。</li>
<li><strong>尚未開發完成的協同模組</strong>：如平行開發中尚未寫好的 <code>PrimeChecker</code>。</li>
<li><strong>非確定性行為 (Non-deterministic)</strong>：系統時間 (<code>LocalDateTime.now()</code>)、隨機亂數。</li>
</ol>
</li>
<li>
<p><strong><img class="emoji" draggable="false" alt="❌" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/274c.svg" data-marp-twemoji=""/> 不應使用 Mock 的三大情境（請直接 <code>new</code> 物件！）</strong>：</p>
<ol>
<li><strong>純領域邏輯與演算法</strong>：排序、金額加減、字串處理。</li>
<li><strong>值物件與資料實體 (Value Objects / Entities)</strong>：如 <code>new Stock(&quot;2330&quot;, &quot;TSMC&quot;, 10)</code></li>
<li><strong>Java 標準庫容器</strong>：切勿 Mock <code>List</code>、<code>ArrayList</code> 或 <code>Map</code>。</li>
</ol>
</li>
</ul>
</div>
<div class="card">
<h3 id="%F0%9F%9A%A8-%E8%84%86%E5%8C%96%E6%B8%AC%E8%A9%A6%E8%88%87%E9%81%8E%E5%BA%A6-mock-%E4%B8%89%E5%A4%A7%E5%8F%8D%E6%A8%A1%E5%BC%8F"><img class="emoji" draggable="false" alt="🚨" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f6a8.svg" data-marp-twemoji=""/> 脆化測試與過度 Mock 三大反模式</h3>
<ul>
<li><strong>什麼是脆化測試 (Brittle Tests)？</strong>
<ul>
<li>當你重構了生產程式碼的<strong>內部實作細節</strong>（例如將 <code>for</code> 迴圈改寫為 Stream，或調整內部呼叫順序），在<strong>公開業務行為與輸出結果完全正確</strong>的前提下，測試案例卻突然大面積紅燈失敗！</li>
</ul>
</li>
<li><strong>過度 Mock (Over-Mocking) 三大反模式</strong>：
<ol>
<li><strong>Mock Everything（Mock 所有東西）</strong>：一個測試 mock 了七八個物件並塞滿 <code>when().thenReturn()</code>，等於只是把生產程式碼用 Mockito 抄寫一遍。</li>
<li><strong>緊密耦合內部細節</strong>：過度使用 <code>verify()</code> 綁死內部非公開步驟的呼叫次數，一重構就斷裂。</li>
<li><strong>Test Oracle 迷失（假綠燈）</strong>：如 7.1 的 <code>CalculatorTest</code>，只驗證自己幻想的 Mock 例外，結果真實整合時當場炸出 <code>ArithmeticException</code>！</li>
</ol>
</li>
</ul>
</div>
</div>
</div>
<footer>Ch07 整合測試與測試替身</footer>
</section>

<h2 id="%E4%BA%92%E5%8B%95%E5%AF%A6%E4%BD%9C%E7%B7%B4%E7%BF%92%E4%BA%94%E5%A4%A7%E6%B8%AC%E8%A9%A6%E6%9B%BF%E8%BA%AB-test-double-%E6%83%85%E5%A2%83%E5%88%A4%E5%88%A5%E6%8C%91%E6%88%B0">互動實作練習：五大測試替身 (Test Double) 情境判別挑戰</h2>

<div class="td-quiz-list">
  <div class="td-quiz-row" data-ans="Dummy">
    <div class="td-q-text"><strong>Q1.</strong> 建構子 <code>new OrderService(repo, logger)</code> 必填 <code>logger</code>，但此測試完全不印日誌，只傳空物件佔位。
      <div class="td-q-explain">💡 <strong>Dummy</strong>：僅為了通過編譯填塞參數列表，過程中從未被呼叫。</div>
    </div>
    <div class="td-opts"><button type="button" class="td-opt-btn">Dummy</button><button type="button" class="td-opt-btn">Stub</button><button type="button" class="td-opt-btn">Spy</button><button type="button" class="td-opt-btn">Mock</button><button type="button" class="td-opt-btn">Fake</button></div>
  </div>

      <div class="td-q-explain">💡 <strong>Stub</strong>：專責提供固定預設回傳值（間接輸入），不驗證呼叫次數。</div>
    </div>

  </div>
  <div class="td-quiz-row" data-ans="Spy">

      <div class="td-q-explain">💡 <strong>Spy</strong>：包裹真實物件執行原程式碼，僅局部覆寫特定方法並記錄呼叫。</div>
    </div>
    <div class="td-opts"><button type="button" class="td-opt-btn">Dummy</button><button type="button" class="td-opt-btn">Stub</button><button type="button" class="td-opt-btn">Spy</button><button type="button" class="td-opt-btn">Mock</button><button type="button" class="td-opt-btn">Fake</button></div>
  </div>

      <div class="td-q-explain">💡 <strong>Mock</strong>：核心為「行為驗證 (Behavior Verification)」，檢驗互動次數與參數。</div>
    </div>

<header>7.5 隔離架構與測試替身原則</header>

<h2 id="%E6%A6%82%E5%BF%B5%E6%A0%B8%E5%B0%8D%E5%95%8F%E7%AD%94-ccq-2">概念核對問答 (CCQ 2)</h2>
<div class="ccq-columns">
<div class="ccq-text">

<p><strong>問題情境</strong>：<br />
資深架構師在審查小明的測試程式碼時，發現小明在測試 <code>OrderCheckoutService</code> 時，將內部的 <code>TaxCalculator</code>、<code>DiscountRuleEngine</code> 與 <code>OrderEntity</code> 全部使用 Mock 嚴格設定並逐行 <code>verify()</code>，因而提醒他「避免過度 Mocking，應優先採用真實物件或 Fake 物件」。請問下列哪一項<strong>不是</strong>過度 Mock 帶來的缺點？</p>
<ul>
<li><strong>A)</strong> 重構內部輔助方法或調用順序時，極易造成測試非預期失敗（脆化測試 Brittle Tests）</li>
<li><strong>B)</strong> 測試案例過度綁定內部實作細節，如同把生產程式碼用 Mockito 語法重抄一遍</li>
<li><strong>C)</strong> 容易掩蓋外部依賴真實行為契約變動，產生「單元測試全綠、上線卻崩潰」的假綠燈幻覺</li>
<li><strong>D)</strong> 測試案例能自動啟動真實資料庫鎖定機制，精準抓出高併發交易下的死結 (Deadlock)</li>
</ul>
</div>

</div>
</div>

<header>7.6 Mockito 實戰與行為驗證</header>

<h1 id="76-lab-mockito-%E6%B8%AC%E8%A9%A6%E9%A9%85%E5%8B%95%E8%88%87%E6%A8%A1%E6%93%AC-u07_mockito"><strong>7.6 Lab: Mockito 測試驅動與模擬 (<code>u07_mockito</code>)</strong></h1>
<blockquote>
<p>「打開 <code>LabDemo/src/test/java/u07_mockito</code>，直接點擊綠色三角形 <img class="emoji" draggable="false" alt="▶️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/25b6.svg" data-marp-twemoji=""/>：<br />
體驗從手寫 <code>MockPrimeChecker</code> 進化至動態 <code>mock()</code>、<code>@InjectMocks</code>、<code>spy()</code> 與 <code>verify()</code>！」</p>
</blockquote>
<footer>Ch07 整合測試與測試替身</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="23" data-paginate="true" data-header="7.6 Mockito 實戰與行為驗證" data-footer="Ch07 整合測試與測試替身" data-theme="sqa-theme" lang="C" data-marpit-pagination="23" style="--paginate:true;--header:7.6 Mockito 實戰與行為驗證;--footer:Ch07 整合測試與測試替身;--theme:sqa-theme;" data-marpit-pagination-total="31">
<header>7.6 Mockito 實戰與行為驗證</header>

<h2 id="mockito-%E6%A0%B8%E5%BF%83%E5%AF%A6%E6%88%B0-1%E5%8B%95%E6%85%8B-mock-%E8%88%87-mock--injectmocks-%E8%A8%BB%E8%A7%A3">Mockito 核心實戰 (1)：動態 <code>mock()</code> 與 <code>@Mock / @InjectMocks</code> 註解</h2>
<div class="card-deck">
<blockquote>
<p><img class="emoji" draggable="false" alt="💡" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4a1.svg" data-marp-twemoji=""/> <a href="../../lab.html?file=LabDemo/src/test/java/u07_mockito/prime/PrimeTest.java">PrimeTest.java</a> 與 <a href="../../lab.html?file=LabDemo/src/test/java/u07_mockito/prime/PrimePlusTest.java">PrimePlusTest.java</a>：無須再手寫 <code>MockPrimeChecker.java</code> 類別，一行 <code>mock(PrimeChecker.class)</code> 搞定！</p>
</blockquote>
<div class="two-columns">
<div class="card">
<h3 id="%F0%9F%92%BB-%E5%AF%AB%E6%B3%95-a%E5%BB%BA%E6%A7%8B%E5%AD%90%E6%B3%A8%E5%85%A5"><img class="emoji" draggable="false" alt="💻" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4bb.svg" data-marp-twemoji=""/> 寫法 A：建構子注入</h3>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-keyword">public</span> <span class="hljs-keyword">class</span> <span class="hljs-title class_">PrimeTest</span> {
    <span class="hljs-meta">@Test</span>
    <span class="hljs-keyword">public</span> <span class="hljs-keyword">void</span> <span class="hljs-title function_">testAllPrime</span><span class="hljs-params">()</span> {
        <span class="hljs-comment">// 1. 動態建立 PrimeChecker 介面的 Mock 替身</span>
        <span class="hljs-type">PrimeChecker</span> <span class="hljs-variable">mockChecker</span> <span class="hljs-operator">=</span> mock(PrimeChecker.class);

        <span class="hljs-comment">// 2. 佈樁 (Stubbing)：指定 2~5 的回傳值</span>
        <span class="hljs-keyword">when</span>(mockChecker.isPrime(<span class="hljs-number">2</span>)).thenReturn(<span class="hljs-literal">true</span>);
        <span class="hljs-keyword">when</span>(mockChecker.isPrime(<span class="hljs-number">3</span>)).thenReturn(<span class="hljs-literal">true</span>);
        <span class="hljs-keyword">when</span>(mockChecker.isPrime(<span class="hljs-number">4</span>)).thenReturn(<span class="hljs-literal">false</span>);
        <span class="hljs-keyword">when</span>(mockChecker.isPrime(<span class="hljs-number">5</span>)).thenReturn(<span class="hljs-literal">true</span>);

        <span class="hljs-comment">// 3. 透過建構子注入替身並驗證結果</span>
        <span class="hljs-type">Prime</span> <span class="hljs-variable">prime</span> <span class="hljs-operator">=</span> <span class="hljs-keyword">new</span> <span class="hljs-title class_">Prime</span>(mockChecker);
        assertArrayEquals(<span class="hljs-keyword">new</span> <span class="hljs-title class_">int</span>[]{<span class="hljs-number">2</span>, <span class="hljs-number">3</span>, <span class="hljs-number">5</span>}, prime.allPrime(<span class="hljs-number">5</span>));
    }

    <span class="hljs-meta">@Test</span> <span class="hljs-comment">// 模擬當輸入超過 100 時拋出防禦性例外 (thenThrow)</span>
    <span class="hljs-keyword">public</span> <span class="hljs-keyword">void</span> <span class="hljs-title function_">testMockException</span><span class="hljs-params">()</span> {
        <span class="hljs-type">PrimeChecker</span> <span class="hljs-variable">mockChecker</span> <span class="hljs-operator">=</span> mock(PrimeChecker.class);
        <span class="hljs-keyword">when</span>(mockChecker.isPrime(<span class="hljs-number">101</span>)).thenThrow(
            <span class="hljs-keyword">new</span> <span class="hljs-title class_">IllegalArgumentException</span>(<span class="hljs-string">&quot;Should &lt;= 100&quot;</span>));
        <span class="hljs-type">Prime</span> <span class="hljs-variable">prime</span> <span class="hljs-operator">=</span> <span class="hljs-keyword">new</span> <span class="hljs-title class_">Prime</span>(mockChecker);
        assertThrows(IllegalArgumentException.class,
            () -&gt; prime.allPrime(<span class="hljs-number">101</span>));
    }
}
</code></pre>
</div>
<div class="card">
<h3 id="%E2%9C%A8-%E5%AF%AB%E6%B3%95-b%E8%A8%BB%E8%A7%A3%E8%87%AA%E5%8B%95%E6%B3%A8%E5%85%A5-primeplustestjava"><img class="emoji" draggable="false" alt="✨" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/2728.svg" data-marp-twemoji=""/> 寫法 B：註解自動注入 (<code>PrimePlusTest.java</code>)</h3>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-comment">// 啟用 JUnit 5 Mockito 擴充引擎，自動初始化註解欄位</span>
<span class="hljs-meta">@ExtendWith(MockitoExtension.class)</span>
<span class="hljs-keyword">public</span> <span class="hljs-keyword">class</span> <span class="hljs-title class_">PrimePlusTest</span> {

    <span class="hljs-meta">@Mock</span> <span class="hljs-comment">// 1. 自動建立 PrimeChecker 的模擬替身</span>
    PrimeChecker mockChecker;

    <span class="hljs-meta">@InjectMocks</span> <span class="hljs-comment">// 2. 自動呼叫 new Prime(mockChecker) 完成注入！</span>
    Prime prime;

    <span class="hljs-meta">@Test</span>
    <span class="hljs-keyword">public</span> <span class="hljs-keyword">void</span> <span class="hljs-title function_">testAllPrime</span><span class="hljs-params">()</span> {
        <span class="hljs-keyword">when</span>(mockChecker.isPrime(<span class="hljs-number">2</span>)).thenReturn(<span class="hljs-literal">true</span>);
        <span class="hljs-keyword">when</span>(mockChecker.isPrime(<span class="hljs-number">3</span>)).thenReturn(<span class="hljs-literal">true</span>);
        <span class="hljs-keyword">when</span>(mockChecker.isPrime(<span class="hljs-number">4</span>)).thenReturn(<span class="hljs-literal">false</span>);
        <span class="hljs-keyword">when</span>(mockChecker.isPrime(<span class="hljs-number">5</span>)).thenReturn(<span class="hljs-literal">true</span>);

        assertArrayEquals(<span class="hljs-keyword">new</span> <span class="hljs-title class_">int</span>[]{<span class="hljs-number">2</span>, <span class="hljs-number">3</span>, <span class="hljs-number">5</span>}, prime.allPrime(<span class="hljs-number">5</span>));

        <span class="hljs-comment">// 3. 行為驗證：確認 2, 3, 4, 5 各被呼叫恰好 1 次！</span>
        verify(mockChecker, times(<span class="hljs-number">1</span>)).isPrime(<span class="hljs-number">2</span>);
        verify(mockChecker, times(<span class="hljs-number">1</span>)).isPrime(<span class="hljs-number">3</span>);
        verify(mockChecker, times(<span class="hljs-number">1</span>)).isPrime(<span class="hljs-number">4</span>);
        verify(mockChecker, times(<span class="hljs-number">1</span>)).isPrime(<span class="hljs-number">5</span>);
    }
}
</code></pre>
</div>
</div>
</div>
<footer>Ch07 整合測試與測試替身</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="24" data-paginate="true" data-header="7.6 Mockito 實戰與行為驗證" data-footer="Ch07 整合測試與測試替身" data-theme="sqa-theme" lang="C" data-marpit-pagination="24" style="--paginate:true;--header:7.6 Mockito 實戰與行為驗證;--footer:Ch07 整合測試與測試替身;--theme:sqa-theme;" data-marpit-pagination-total="31">
<header>7.6 Mockito 實戰與行為驗證</header>

<h2 id="mockito-%E6%A0%B8%E5%BF%83%E5%AF%A6%E6%88%B0-2mock-vs-spy-%E5%B7%AE%E7%95%B0">Mockito 核心實戰 (2)：<code>mock()</code> vs. <code>spy()</code> 差異</h2>
<div class="card-deck">
<blockquote>
<p><img class="emoji" draggable="false" alt="💡" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4a1.svg" data-marp-twemoji=""/> <a href="../../lab.html?file=LabDemo/src/test/java/u07_mockito/prime/PrimeSpyTest.java">PrimeSpyTest.java</a>：未設定 <code>when</code>，在 <code>mock()</code> 一律回傳預設值 (<code>0/false/null</code>)；在 <code>spy()</code> 則會呼叫真實物件程式碼！</p>
</blockquote>
<div class="two-columns">
<div class="card">
<h5 id="%F0%9F%8E%AD-mockappclass-vs-spyappclass"><img class="emoji" draggable="false" alt="🎭" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f3ad.svg" data-marp-twemoji=""/> <code>mock(App.class)</code> vs. <code>spy(App.class)</code></h5>
<ul>
<li><strong>1. <code>mock()</code>（全虛擬空殼）</strong>：<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-type">App</span> <span class="hljs-variable">a</span> <span class="hljs-operator">=</span> mock(App.class);
<span class="hljs-keyword">when</span>(a.add(<span class="hljs-number">1</span>, <span class="hljs-number">1</span>)).thenReturn(<span class="hljs-number">2</span>);
assertEquals(<span class="hljs-number">2</span>, a.add(<span class="hljs-number">1</span>, <span class="hljs-number">1</span>)); <span class="hljs-comment">// <img class="emoji" draggable="false" alt="✅" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/2705.svg" data-marp-twemoji=""/> 通過 (有打樁)</span>
assertEquals(<span class="hljs-number">4</span>, a.add(<span class="hljs-number">2</span>, <span class="hljs-number">2</span>)); <span class="hljs-comment">// <img class="emoji" draggable="false" alt="❌" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/274c.svg" data-marp-twemoji=""/> 失敗! 未打樁預設回傳 0</span>
</code></pre>
</li>
<li><strong>2. <code>spy()</code>（包裹真實物件，僅局部覆寫 Partial Mock）</strong>：<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-type">App</span> <span class="hljs-variable">a</span> <span class="hljs-operator">=</span> spy(<span class="hljs-keyword">new</span> <span class="hljs-title class_">App</span>());
<span class="hljs-keyword">when</span>(a.add(<span class="hljs-number">1</span>, <span class="hljs-number">1</span>)).thenReturn(<span class="hljs-number">2</span>);
assertEquals(<span class="hljs-number">2</span>, a.add(<span class="hljs-number">1</span>, <span class="hljs-number">1</span>)); <span class="hljs-comment">// <img class="emoji" draggable="false" alt="✅" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/2705.svg" data-marp-twemoji=""/> 通過 (走打樁值)</span>
assertEquals(<span class="hljs-number">4</span>, a.add(<span class="hljs-number">2</span>, <span class="hljs-number">2</span>)); <span class="hljs-comment">// <img class="emoji" draggable="false" alt="✅" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/2705.svg" data-marp-twemoji=""/> 通過! 執行真實 add(2,2) 回傳 4</span>
</code></pre>
</li>
</ul>
</div>
<div class="card">
<h5 id="%F0%9F%95%B5%EF%B8%8F-%E7%94%A8-spy-%E5%B1%80%E9%83%A8%E4%BF%AE%E8%A3%9C%E4%B8%8D%E5%AE%8C%E6%95%B4%E7%9A%84-mockprimechecker">🕵️ 用 <code>spy()</code> 局部修補不完整的 <code>MockPrimeChecker</code></h5>
<p>還記得手寫的 <code>MockPrimeChecker</code> 只寫到 <code>5</code>、忘了寫 <code>7</code> 嗎？看 <a href="../../lab.html?file=LabDemo/src/test/java/u07_mockito/prime/PrimeSpyTest.java">PrimeSpyTest.java</a> 如何用 <strong><code>spy()</code></strong> 局部打補丁：</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-keyword">public</span> <span class="hljs-keyword">class</span> <span class="hljs-title class_">PrimeSpyTest</span> {
    <span class="hljs-meta">@Test</span>
    <span class="hljs-keyword">public</span> <span class="hljs-keyword">void</span> <span class="hljs-title function_">testWithSpy</span><span class="hljs-params">()</span> {
        <span class="hljs-comment">// 1. 以半成品的真實物件 MockPrimeChecker 建立 Spy 間諜</span>
        <span class="hljs-type">PrimeChecker</span> <span class="hljs-variable">checker</span> <span class="hljs-operator">=</span> <span class="hljs-keyword">new</span> <span class="hljs-title class_">MockPrimeChecker</span>();
        <span class="hljs-type">PrimeChecker</span> <span class="hljs-variable">spyChecker</span> <span class="hljs-operator">=</span> spy(checker);

        <span class="hljs-comment">// 2. 僅針對漏寫的 7 進行局部打樁 (2, 3, 5 仍走原物件程式碼!)</span>
        doReturn(<span class="hljs-literal">true</span>).<span class="hljs-keyword">when</span>(spyChecker).isPrime(<span class="hljs-number">7</span>);

        <span class="hljs-comment">// 3. 注入 spyChecker 並測試 1~10 的質數</span>
        <span class="hljs-type">Prime</span> <span class="hljs-variable">prime</span> <span class="hljs-operator">=</span> <span class="hljs-keyword">new</span> <span class="hljs-title class_">Prime</span>(spyChecker);
        <span class="hljs-type">int</span>[] result = prime.allPrime(<span class="hljs-number">10</span>);

        <span class="hljs-comment">// 2, 3, 5 來自原物件，7 來自 Spy 補丁 ➔ 完美湊齊 {2, 3, 5, 7}！</span>
        assertArrayEquals(<span class="hljs-keyword">new</span> <span class="hljs-title class_">int</span>[]{<span class="hljs-number">2</span>, <span class="hljs-number">3</span>, <span class="hljs-number">5</span>, <span class="hljs-number">7</span>}, result);
    }
}
</code></pre>
</div>
</div>
</div>
<footer>Ch07 整合測試與測試替身</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="25" data-paginate="true" data-header="7.6 Mockito 實戰與行為驗證" data-footer="Ch07 整合測試與測試替身" data-theme="sqa-theme" lang="C" data-marpit-pagination="25" style="--paginate:true;--header:7.6 Mockito 實戰與行為驗證;--footer:Ch07 整合測試與測試替身;--theme:sqa-theme;" data-marpit-pagination-total="31">
<header>7.6 Mockito 實戰與行為驗證</header>

<h2 id="mockito-%E6%A0%B8%E5%BF%83%E5%AF%A6%E6%88%B0-3verify-%E6%AC%A1%E6%95%B8%E9%A9%97%E8%AD%89%E8%88%87-primetest">Mockito 核心實戰 (3)：<code>verify()</code> 次數驗證與 <code>PrimeTest</code></h2>
<div class="card-deck">
<blockquote>
<p><a href="../../lab.html?file=LabDemo/src/test/java/u07_mockito/prime/PrimeTest.java#L21">PrimeTest.java</a> 執行 <code>testAllPrimeWithMockedIsPrime()</code>，為什麼 verify(mockChecker, times(1)).isPrime(1) 會亮紅燈失敗？</p>
</blockquote>
<div class="two-columns">
<div class="card">
<h5 id="%F0%9F%94%8D-verify-%E5%A6%82%E4%BD%95%E6%8A%93%E5%87%BA%E5%91%BC%E5%8F%AB%E5%A5%91%E7%B4%84%E8%90%BD%E5%B7%AE"><img class="emoji" draggable="false" alt="🔍" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f50d.svg" data-marp-twemoji=""/> <code>verify()</code> 如何抓出呼叫契約落差？</h5>
<ul>
<li><strong>看看 <code>PrimeTest.java</code> 第 37~41 行寫了什麼</strong>：<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-type">int</span>[] result = prime.allPrime(<span class="hljs-number">10</span>);
assertArrayEquals(<span class="hljs-keyword">new</span> <span class="hljs-title class_">int</span>[]{<span class="hljs-number">2</span>, <span class="hljs-number">3</span>, <span class="hljs-number">5</span>, <span class="hljs-number">7</span>}, result); <span class="hljs-comment">// <img class="emoji" draggable="false" alt="✅" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/2705.svg" data-marp-twemoji=""/> 狀態斷言通過！</span>

<span class="hljs-comment">// <img class="emoji" draggable="false" alt="💥" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4a5.svg" data-marp-twemoji=""/> 但是下面這行行為驗證卻亮紅燈：Wanted but not invoked!</span>
verify(mockChecker, times(<span class="hljs-number">1</span>)).isPrime(<span class="hljs-number">1</span>); <span class="hljs-comment">// !! 為什麼失敗？</span>
</code></pre>
</li>
<li><strong>原因剖析</strong>：
<ul>
<li>打開 <code>Prime.allPrime(n)</code> 原始碼：<code>for (int i = 2; i &lt;= n; i++)</code> —— 迴圈直接從 <strong><code>i = 2</code></strong> 開始，<strong>根本沒有呼叫過 <code>mockChecker.isPrime(1)</code></strong>！</li>
<li>此外，<code>allPrime(10)</code> 會呼叫 <code>isPrime(2) ~ isPrime(10)</code>，因為 <code>6, 8, 9, 10</code> 沒打樁而預設回傳 <code>false</code>，所以狀態斷言 <code>{2, 3, 5, 7}</code> 剛好通過，但 <strong><code>verify()</code> 卻能精準監督內部互動次數</strong>！</li>
</ul>
</li>
</ul>
</div>
<div class="card">
<h5 id="%F0%9F%93%8B-verify-%E5%B8%B8%E7%94%A8%E6%AC%A1%E6%95%B8%E6%AA%A2%E9%A9%97%E8%AA%9E%E6%B3%95%E5%A4%A7%E5%85%A8"><img class="emoji" draggable="false" alt="📋" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4cb.svg" data-marp-twemoji=""/> <code>verify()</code> 常用次數檢驗語法大全</h5>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-comment">// 1. 預設驗證恰好呼叫 1 次 (等效於 times(1))</span>
verify(mockedList).add(<span class="hljs-string">&quot;1&quot;</span>);
verify(mockedList, times(<span class="hljs-number">1</span>)).add(<span class="hljs-string">&quot;1&quot;</span>);

<span class="hljs-comment">// 2. 驗證特定呼叫次數</span>
verify(mockedList, times(<span class="hljs-number">2</span>)).add(<span class="hljs-string">&quot;2&quot;</span>);
verify(mockedList, times(<span class="hljs-number">3</span>)).add(<span class="hljs-string">&quot;3&quot;</span>);

<span class="hljs-comment">// 3. 驗證從未被呼叫過 (等效於 times(0))</span>
verify(mockedList, never()).add(<span class="hljs-string">&quot;4&quot;</span>);

<span class="hljs-comment">// 4. 驗證至少 / 至多呼叫次數</span>
verify(mockedList, atLeastOnce()).add(<span class="hljs-string">&quot;3&quot;</span>);
verify(mockedList, atLeast(<span class="hljs-number">2</span>)).add(<span class="hljs-string">&quot;3&quot;</span>);
verify(mockedList, atMost(<span class="hljs-number">5</span>)).add(<span class="hljs-string">&quot;3&quot;</span>);
</code></pre>
</div>
</div>
</div>
<footer>Ch07 整合測試與測試替身</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="26" data-paginate="true" data-header="7.7 Testcontainers 容器化資料庫實戰" data-footer="Ch07 整合測試與測試替身" data-class="lead" data-theme="sqa-theme" lang="C" class="lead" data-marpit-pagination="26" style="--paginate:true;--header:7.7 Testcontainers 容器化資料庫實戰;--footer:Ch07 整合測試與測試替身;--class:lead;--theme:sqa-theme;" data-marpit-pagination-total="31">
<header>7.7 Testcontainers 容器化資料庫實戰</header>

<h1 id="77-testcontainers-%E5%AE%B9%E5%99%A8%E5%8C%96%E8%B3%87%E6%96%99%E5%BA%AB%E5%AF%A6%E6%88%B0-u07_testcontainers"><strong>7.7 Testcontainers 容器化資料庫實戰 (<code>u07_testcontainers</code>)</strong></h1>
<blockquote>
<p>「Mock 與 H2 記憶體資料庫常製造『本機全綠、上線爆炸』的假綠燈幻覺——<br />
用純 Java JDBC + Docker <strong>Testcontainers</strong>，在 JUnit 5 中一鍵拉起 100% 真實 PostgreSQL！」</p>
</blockquote>
<footer>Ch07 整合測試與測試替身</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="27" data-paginate="true" data-header="7.7 Testcontainers 容器化資料庫實戰" data-footer="Ch07 整合測試與測試替身" data-theme="sqa-theme" lang="C" data-marpit-pagination="27" style="--paginate:true;--header:7.7 Testcontainers 容器化資料庫實戰;--footer:Ch07 整合測試與測試替身;--theme:sqa-theme;" data-marpit-pagination-total="31">
<header>7.7 Testcontainers 容器化資料庫實戰</header>

<h2 id="%E7%82%BA%E4%BB%80%E9%BA%BC%E8%A6%81%E6%B7%98%E6%B1%B0-h2-%E8%A8%98%E6%86%B6%E9%AB%94%E8%B3%87%E6%96%99%E5%BA%ABtestcontainers-%E6%9E%B6%E6%A7%8B%E5%8E%9F%E7%90%86">為什麼要淘汰 H2 記憶體資料庫？Testcontainers 架構原理</h2>
<div class="card-deck">
<blockquote>
<p><img class="emoji" draggable="false" alt="💡" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4a1.svg" data-marp-twemoji=""/> <strong>環境一致性 (Environment Parity)</strong>：整合測試若連的是簡化版 H2 記憶體庫，永遠無法保證真實 PostgreSQL / MySQL 上線時不會炸裂！</p>
</blockquote>
<div class="content-columns">
<div class="content-text">
<ul>
<li><strong><img class="emoji" draggable="false" alt="💣" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4a3.svg" data-marp-twemoji=""/> H2 記憶體資料庫的三大「假綠燈幻覺」</strong>：
<ol>
<li><strong>SQL 方言與原生型別失配</strong>：PostgreSQL 的 <code>JSONB</code>、<code>RETURNING id</code>、<code>ON CONFLICT DO UPDATE</code> 在 H2 中不支援或行為不同。</li>
<li><strong>約束與錯誤碼落差</strong>：真實 PostgreSQL 唯一鍵衝突回傳 <code>SQLState = 23505</code>，H2 與 MySQL 錯誤細節各異。</li>
<li><strong>併發鎖定與交易隔離</strong>：記憶體單線程假資料庫無法重現真實死結 (<code>Deadlock</code>) 與行級鎖 (<code>FOR UPDATE</code>)。</li>
</ol>
</li>
<li><strong><img class="emoji" draggable="false" alt="🐳" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f433.svg" data-marp-twemoji=""/> Testcontainers 三大核心優勢（免裝任何框架！）</strong>：
<ol>
<li><strong>純 Java + JUnit 5 直接驅動</strong>：不需 Spring Boot，只要建構子注入 <code>postgres.getJdbcUrl()</code> 即可。</li>
<li><strong>動態隨機 Port 防衝突</strong>：自動映射主機隨機埠，CI/CD 平行跑測試零碰撞。</li>
<li><strong>Ryuk 守護容器自動銷毀</strong>：測完自動清除容器與資料，不留任何髒環境！</li>
</ol>
</li>
</ul>
</div>
<div class="content-figure">
<p><img src="../../img/ch07/testcontainers_architecture_flow.jpg" alt="Testcontainers Architecture" /></p>
</div>
</div>
</div>
<footer>Ch07 整合測試與測試替身</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="28" data-paginate="true" data-header="7.7 Testcontainers 容器化資料庫實戰" data-footer="Ch07 整合測試與測試替身" data-theme="sqa-theme" lang="C" data-marpit-pagination="28" style="--paginate:true;--header:7.7 Testcontainers 容器化資料庫實戰;--footer:Ch07 整合測試與測試替身;--theme:sqa-theme;" data-marpit-pagination-total="31">
<header>7.7 Testcontainers 容器化資料庫實戰</header>

<h2 id="%E7%B4%94-java-jdbc--testcontainers-%E5%AF%A6%E6%88%B0-u07_testcontainers">純 Java JDBC + Testcontainers 實戰 (<code>u07_testcontainers</code>)</h2>
<div class="card-deck">
<blockquote>
<p><img class="emoji" draggable="false" alt="💡" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4a1.svg" data-marp-twemoji=""/> 對應 <a href="../../lab.html?file=LabDemo/src/main/java/u07_testcontainers/UserRepository.java">UserRepository.java</a> 與 <a href="../../lab.html?file=LabDemo/src/test/java/u07_testcontainers/UserRepositoryTestcontainersTest.java">UserRepositoryTestcontainersTest.java</a>（零 Spring Boot，直接 <code>mvn test -Dtest=UserRepositoryTestcontainersTest</code>！）</p>
</blockquote>
<div class="two-columns">
<div class="card">
<h5 id="1%EF%B8%8F%E2%83%A3-%E5%BE%85%E6%B8%AC%E7%A8%8B%E5%BC%8Fuserrepositoryjava-constructor-di"><img class="emoji" draggable="false" alt="1️⃣" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/31-20e3.svg" data-marp-twemoji=""/> 待測程式：<code>UserRepository.java</code> (Constructor DI)</h5>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-keyword">public</span> <span class="hljs-keyword">class</span> <span class="hljs-title class_">UserRepository</span> {
    <span class="hljs-keyword">private</span> <span class="hljs-keyword">final</span> String jdbcUrl, username, password;
    <span class="hljs-comment">// <img class="emoji" draggable="false" alt="✅" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/2705.svg" data-marp-twemoji=""/> 透過建構子注入容器動態連線資訊（免 Spring）</span>
    <span class="hljs-keyword">public</span> <span class="hljs-title function_">UserRepository</span><span class="hljs-params">(String url, String user, String pass)</span> {
        <span class="hljs-built_in">this</span>.jdbcUrl = url; <span class="hljs-built_in">this</span>.username = user; <span class="hljs-built_in">this</span>.password = pass;
    }
    <span class="hljs-comment">// 使用 PostgreSQL 原生 JSONB 與 RETURNING id</span>
    <span class="hljs-keyword">public</span> <span class="hljs-type">long</span> <span class="hljs-title function_">save</span><span class="hljs-params">(String name, String email, String json)</span>
            <span class="hljs-keyword">throws</span> SQLException {
        <span class="hljs-type">String</span> <span class="hljs-variable">sql</span> <span class="hljs-operator">=</span> <span class="hljs-string">&quot;INSERT INTO users (name, email, metadata) &quot;</span>
                   + <span class="hljs-string">&quot;VALUES (?, ?, CAST(? AS jsonb)) RETURNING id&quot;</span>;

<header>附錄：課堂互動參考解答</header>

<h2 id="%E9%99%84%E9%8C%84%E8%AA%B2%E5%A0%82%E4%BA%92%E5%8B%95%E5%8F%83%E8%80%83%E8%A7%A3%E7%AD%94">附錄：課堂互動參考解答</h2>
<div class="card-deck">
<blockquote>
<p><img class="emoji" draggable="false" alt="💡" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4a1.svg" data-marp-twemoji=""/> 本章課堂互動 (CCQ 1 ～ CCQ 2) 官方標準解答與核心觀念解析總整理。</p>
</blockquote>
<div class="two-columns">
<div class="card">
<h3 id="%F0%9F%A7%AD-ccq-1%E7%94%B1%E4%B8%8A%E8%80%8C%E4%B8%8B%E6%95%B4%E5%90%88%E8%88%87-test-stubs"><img class="emoji" draggable="false" alt="🧭" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f9ed.svg" data-marp-twemoji=""/> CCQ 1：由上而下整合與 Test Stubs</h3>
<ul>
<li><strong>CCQ 1【採用由上而下整合，先寫 Stubs 模擬感測器 (C)】</strong>：
<ul>
<li><strong>解析</strong>：當底層硬體尚未穩定、昂貴或容易過熱毀損時，採用「<strong>由上而下 (Top-Down)</strong>」策略，為底層硬體撰寫模擬樁 (<strong>Test Stubs</strong>) 回傳測試訊號餵給高層決策演算法，能在保護脆弱硬體的前提下，提早驗證核心控制與路徑規劃邏輯！</li>
<li>大霹靂整合 (A) 無法定位錯誤；由下而上 (B) 會直接損毀硬體；完全不測整合 (D) 則無法抓出介面協定與時序問題。</li>
</ul>
</li>
</ul>
</div>
<div class="card">
<h3 id="%F0%9F%8E%AF-ccq-2%E9%81%8E%E5%BA%A6-mocking-%E8%88%87%E8%84%86%E5%8C%96%E6%B8%AC%E8%A9%A6-brittle-tests"><img class="emoji" draggable="false" alt="🎯" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f3af.svg" data-marp-twemoji=""/> CCQ 2：過度 Mocking 與脆化測試 (Brittle Tests)</h3>
<ul>
<li><strong>CCQ 2【能精準抓出高併發死結不是過度 Mock 的特性 (D)】</strong>：
<ul>
<li><strong>解析</strong>：Mock 只是純記憶體中的虛擬空殼物件，沒有真實資料庫鎖定或交易隔離機制，<strong>完全不可能測出高併發 Deadlock</strong>（這正是過度依賴 Mock 的盲區，必須靠真實模組與真實環境整合測試才能檢驗）。</li>
<li>選項 A（重構易斷裂之<strong>脆化測試 Brittle Tests</strong>）、選項 B（把生產碼重抄一遍）、選項 C（掩蓋外部依賴契約變更造成<strong>假綠燈</strong>）皆為過度 Mocking 的典型致命缺點！</li>
</ul>
</li>
</ul>
</div>
</div>
</div>
<script>
(function() {
  function initHeaderDropdown() {

    var slideSections = document.querySelectorAll("section[id]");
