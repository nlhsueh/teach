<h1 id="%E8%BB%9F%E9%AB%94%E5%93%81%E8%B3%AA%E8%88%87%E6%B8%AC%E8%A9%A6">軟體品質與測試</h1>
<h3 id="%E7%AC%AC-5-%E7%AB%A0%E9%BB%91%E7%AE%B1%E6%B8%AC%E8%A9%A6%E7%AD%89%E5%83%B9%E5%88%86%E5%89%B2%E8%88%87%E5%B1%AC%E6%80%A7%E5%9F%BA%E7%A4%8E%E6%B8%AC%E8%A9%A6-pbt">第 5 章：黑箱測試、等價分割與屬性基礎測試 (PBT)</h3>
<p>授課教師：薛念林 教授</p>
<blockquote>
<p>系統內部就像一個黑盒子，我們不探究它「如何做」，<br />
而是嚴格驗證它在各種極端輸入下，究竟「做了什麼」。<br />
錯誤永遠隱藏在角落——掌握邊界與等價，方能以最小成本擊中最多缺陷。</p>
</blockquote>
<footer>Ch05 黑箱測試</footer>
</section>

<header>本章大綱 (Outline)</header>

<h2 id="%E6%9C%AC%E7%AB%A0%E9%87%8D%E9%BB%9E%E5%B0%8E%E8%AE%80-key-highlights">本章重點導讀 (Key Highlights)</h2>
<div class="outline-columns">
<div>
<h3 id="%F0%9F%A7%AD-%E6%A0%B8%E5%BF%83%E6%A6%82%E5%BF%B5%E8%88%87%E8%BC%B8%E5%85%A5%E5%9F%9F%E5%8A%83%E5%88%86"><img class="emoji" draggable="false" alt="🧭" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f9ed.svg" data-marp-twemoji=""/> 核心概念與輸入域劃分</h3>
<ul>
<li><strong>5.1 黑箱測試本質與核心思想</strong>：
<ul>
<li>黑箱 vs. 白箱思維、窮舉之不可能、Glenford Myers 測試哲學</li>
</ul>
</li>
<li><strong>5.2 單元測試與 JUnit 5 快速入門</strong>：
<ul>
<li>3A 原則、@Test 基礎、內容值等價 vs. 記憶體同一性 (CCQ 1)</li>
<li><img class="emoji" draggable="false" alt="🧪" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f9ea.svg" data-marp-twemoji=""/> <em>Lab: CalculatorTest &amp; 基礎斷言操作</em></li>
</ul>
</li>
<li><strong>5.3 邊界值分析 (Boundary Value Analysis, BVA)</strong>：
<ul>
<li>單一錯誤假設、獨立與最壞情況、@ValueSource 與 assertAll (CCQ 2)</li>
<li><img class="emoji" draggable="false" alt="🧪" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f9ea.svg" data-marp-twemoji=""/> <em>Lab: Triangle 邊界檢查與數值邊界練習</em></li>
</ul>
</li>
<li><strong>5.4 等價類分割測試 (Equivalence Partitioning, EP)</strong>：
<ul>
<li>有效/無效類、單一無效原則、assertThrows 與 @CsvSource (CCQ 3)</li>
<li><img class="emoji" draggable="false" alt="🧪" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f9ea.svg" data-marp-twemoji=""/> <em>Lab: ParamDemoTest 等價資料驅動與練習</em></li>
</ul>
</li>
<li><strong>5.5 全成對組合測試 (Pairwise / All-Pairs)</strong>：
<ul>
<li>2-Way 交互作用、AllPairs4J 與 @TestFactory 動態工廠 (CCQ 4)</li>
<li><img class="emoji" draggable="false" alt="🧪" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f9ea.svg" data-marp-twemoji=""/> <em>Lab: LoanCalculatorPairwiseTest 動態展開</em></li>
</ul>
</li>
</ul>
</div>
<div>
<h3 id="%F0%9F%93%90-%E7%B5%90%E6%A7%8B%E6%83%85%E5%A2%83%E8%88%87%E5%89%8D%E6%B2%BF%E6%B8%AC%E8%A9%A6"><img class="emoji" draggable="false" alt="📐" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4d0.svg" data-marp-twemoji=""/> 結構、情境與前沿測試</h3>
<ul>
<li><strong>5.6 案例優化與分類樹方法 (CTM)</strong>：
<ul>
<li>Daimler-Benz 分類樹、@DisplayName 繁中活規格與 @Nested (CCQ 5)</li>
<li><img class="emoji" draggable="false" alt="🧪" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f9ea.svg" data-marp-twemoji=""/> <em>Lab: DisplayNameTest 與分類樹規格映射</em></li>
</ul>
</li>
<li><strong>5.7 因果圖法與決策表測試 (Decision Table)</strong>：
<ul>
<li>布林邏輯網絡、CAR 表化簡、決策表直出 CSV 與多動作斷言 (CCQ 6)</li>
<li><img class="emoji" draggable="false" alt="🧪" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f9ea.svg" data-marp-twemoji=""/> <em>Lab: 促銷決策表直出與多重驗收練習</em></li>
</ul>
</li>
<li><strong>5.8 狀態轉換測試 (State Transition Testing)</strong>：
<ul>
<li>航空訂票狀態機、@BeforeEach 狀態重置與 @Nested 狀態建模 (CCQ 7)</li>
<li><img class="emoji" draggable="false" alt="🧪" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f9ea.svg" data-marp-twemoji=""/> <em>Lab: StackTest 物件狀態機與例外練習</em></li>
</ul>
</li>
<li><strong>5.9 使用案例與情境測試 (Use Case Testing)</strong>：
<ul>
<li>基本流、替代流與例外流測試矩陣</li>
<li><img class="emoji" draggable="false" alt="🧪" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f9ea.svg" data-marp-twemoji=""/> <em>Lab: ATM 提款交易與連續錯誤鎖卡防衛練習</em></li>
</ul>
</li>
<li><strong>5.10 經驗基礎測試：錯誤猜測與探索性測試</strong>：
<ul>
<li>缺陷防禦清單、探索性測試 (ET) 與任務段管理 (SBTM)</li>
<li><img class="emoji" draggable="false" alt="🧪" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f9ea.svg" data-marp-twemoji=""/> <em>Lab: 破壞性邊界探針與畸形輸入防護練習</em></li>
</ul>
</li>
<li><strong>5.11 屬性基礎測試 (PBT) 與 變質測試 (Metamorphic)</strong>：
<ul>
<li>數學不變量規格 (jqwik)、四大變質關係 (MR) 與 LLM 評測 (CCQ 8)</li>
<li><img class="emoji" draggable="false" alt="🧪" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f9ea.svg" data-marp-twemoji=""/> <em>Lab: 隨機測資收縮與搜尋引擎變質對稱性</em></li>
</ul>
</li>
</ul>
</div>
</div>
<footer>Ch05 黑箱測試</footer>
</section>

<header>5.1 黑箱測試本質與核心思想</header>

<h1 id="51-%E9%BB%91%E7%AE%B1%E6%B8%AC%E8%A9%A6%E6%9C%AC%E8%B3%AA%E8%88%87%E6%A0%B8%E5%BF%83%E6%80%9D%E6%83%B3"><strong>5.1 黑箱測試本質與核心思想</strong></h1>
<blockquote>
<p>「不窺探程式碼內部結構，純粹依據規格契約驗證系統外顯行為。<br />
面對無限的輸入空間，以科學化工程方法獵捕邊界缺陷。」</p>
</blockquote>
<footer>Ch05 黑箱測試</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="4" data-paginate="true" data-header="5.1 黑箱測試本質與核心思想" data-footer="Ch05 黑箱測試" data-theme="sqa-theme" lang="C" data-marpit-pagination="4" style="--paginate:true;--header:5.1 黑箱測試本質與核心思想;--footer:Ch05 黑箱測試;--theme:sqa-theme;" data-marpit-pagination-total="88">
<header>5.1 黑箱測試本質與核心思想</header>

<h2 id="%E9%BB%91%E7%AE%B1%E6%B8%AC%E8%A9%A6-black-box-testing-%E6%A6%82%E5%BF%B5%E6%9E%B6%E6%A7%8B">黑箱測試 (Black-Box Testing) 概念架構</h2>
<div class="card-deck">
<blockquote>
<p><img class="emoji" draggable="false" alt="💡" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4a1.svg" data-marp-twemoji=""/> 黑箱測試（功能測試/規格測試）聚焦於系統「做什麼 (What)」，而非「如何做 (How)」。</p>
</blockquote>
<div class="content-columns">
<div class="content-text">
<h3 id="%F0%9F%93%A6-%E9%BB%91%E7%AE%B1%E6%B8%AC%E8%A9%A6%E4%B8%89%E5%A4%A7%E6%A0%B8%E5%BF%83%E8%A6%81%E4%BB%B6"><img class="emoji" draggable="false" alt="📦" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4e6.svg" data-marp-twemoji=""/> 黑箱測試三大核心要件</h3>
<ul>
<li><strong>1. 測試輸入 (Input Data)</strong>：
<ul>
<li>涵蓋合法資料 (Valid Inputs)、邊界極端值 (Boundary Values) 與格式錯誤的非法資料 (Invalid Inputs)。</li>
</ul>
</li>
<li><strong>2. 受測系統 (System Under Test, SUT)</strong>：
<ul>
<li>內部原始碼與資料結構對測試人員隱藏（不透明黑盒），完全依據介面規格操作。</li>
</ul>
</li>
<li><strong>3. 輸出驗證 (Expected vs. Actual Output)</strong>：
<ul>
<li>比對實際輸出與需求規格所定義之預期結果是否完全吻合。</li>
</ul>
</li>
</ul>
</div>
<div class="content-figure">
<p><img src="../../img/ch05/black_box_testing_concept.jpg" alt="Black-Box Testing" /></p>
</div>
</div>
</div>
<footer>Ch05 黑箱測試</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="5" data-paginate="true" data-header="5.1 黑箱測試本質與核心思想" data-footer="Ch05 黑箱測試" data-theme="sqa-theme" lang="C" data-marpit-pagination="5" style="--paginate:true;--header:5.1 黑箱測試本質與核心思想;--footer:Ch05 黑箱測試;--theme:sqa-theme;" data-marpit-pagination-total="88">
<header>5.1 黑箱測試本質與核心思想</header>

<h2 id="%E9%BB%91%E7%AE%B1%E6%B8%AC%E8%A9%A6-vs-%E7%99%BD%E7%AE%B1%E6%B8%AC%E8%A9%A6%E6%80%9D%E7%B6%AD%E8%88%87%E8%A6%96%E9%87%8E%E5%B0%8D%E6%AF%94">黑箱測試 vs. 白箱測試：思維與視野對比</h2>
<div class="card-deck">
<blockquote>
<p><img class="emoji" draggable="false" alt="💡" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4a1.svg" data-marp-twemoji=""/> 黑箱與白箱並非對立，而是軟體品質保證中視角互補的兩大支柱。</p>
</blockquote>
<div class="two-columns">
<div class="card" data-marpit-fragment>
<h3 id="%F0%9F%93%A6-%E9%BB%91%E7%AE%B1%E6%B8%AC%E8%A9%A6-black-box--%E8%A6%8F%E6%A0%BC%E5%B0%8E%E5%90%91"><img class="emoji" draggable="false" alt="📦" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4e6.svg" data-marp-twemoji=""/> 黑箱測試 (Black-Box / 規格導向)</h3>
<ul>
<li><strong>測試依據</strong>：需求規格書 (SRS)、使用者合約與介面定義。</li>
<li><strong>核心關注</strong>：<strong>「What」</strong>——系統是否達成承諾的外顯功能。</li>
<li><strong>關鍵優勢</strong>：
<ul>
<li>測試與內部實作徹底解耦，<strong>內部重構、效能優化時測試零破壞</strong>。</li>
<li>能站在終端使用者角度發現規格設計上的矛盾。</li>
</ul>
</li>
<li><strong>盲點局限</strong>：
<ul>
<li>無法發現隱藏在內部但規格未提及的後門或冗餘死碼。</li>
</ul>
</li>
</ul>
</div>
<div class="card" data-marpit-fragment>
<h3 id="%F0%9F%94%8D-%E7%99%BD%E7%AE%B1%E6%B8%AC%E8%A9%A6-white-box--%E7%B5%90%E6%A7%8B%E5%B0%8E%E5%90%91"><img class="emoji" draggable="false" alt="🔍" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f50d.svg" data-marp-twemoji=""/> 白箱測試 (White-Box / 結構導向)</h3>
<ul>
<li><strong>測試依據</strong>：原始程式碼、控制流圖 (CFG) 與邏輯分支。</li>
<li><strong>核心關注</strong>：<strong>「How」</strong>——程式碼內部每一行分支與條件是否被執行。</li>
<li><strong>關鍵優勢</strong>：
<ul>
<li>精準衡量覆蓋率（語句、分支、路徑覆蓋），捕捉未預期死碼。</li>
<li>能發現記憶體洩漏、空指標與未初始化變數。</li>
</ul>
</li>
<li><strong>盲點局限</strong>：
<ul>
<li><strong>無法發現遺漏的需求 (Missing Requirements)</strong>——規格漏寫的功能，程式碼沒有，白箱測試覆蓋率 100% 也測不出來！</li>
</ul>
</li>
</ul>
</div>
</div>
</div>
<footer>Ch05 黑箱測試</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="6" data-paginate="true" data-header="5.1 黑箱測試本質與核心思想" data-footer="Ch05 黑箱測試" data-theme="sqa-theme" lang="C" data-marpit-pagination="6" style="--paginate:true;--header:5.1 黑箱測試本質與核心思想;--footer:Ch05 黑箱測試;--theme:sqa-theme;" data-marpit-pagination-total="88">
<header>5.1 黑箱測試本質與核心思想</header>

<h2 id="%E9%BB%91%E7%AE%B1%E6%B8%AC%E8%A9%A6%E7%9A%84%E7%B5%82%E6%A5%B5%E6%8C%91%E6%88%B0%E7%AA%AE%E8%88%89%E6%B8%AC%E8%A9%A6%E4%B9%8B%E4%B8%8D%E5%8F%AF%E8%83%BD">黑箱測試的終極挑戰：窮舉測試之不可能</h2>
<div class="card-deck">
<blockquote>
<p><img class="emoji" draggable="false" alt="💡" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4a1.svg" data-marp-twemoji=""/> 軟體測試第一公理：Exhaustive Testing is Impossible（窮盡測試是不可能的）！</p>
</blockquote>
<div class="two-columns">
<div class="card" data-marpit-fragment>
<h3 id="%F0%9F%92%A5-%E8%BC%B8%E5%85%A5%E7%A9%BA%E9%96%93%E7%9A%84%E7%B5%84%E5%90%88%E7%88%86%E7%82%B8-combinatorial-explosion"><img class="emoji" draggable="false" alt="💥" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4a5.svg" data-marp-twemoji=""/> 輸入空間的組合爆炸 (Combinatorial Explosion)</h3>
<ul>
<li><strong>看似簡單的加法函式</strong>：
<ul>
<li>一個雙整數加法 <code>int add(int a, int b)</code>。</li>
<li>32 位元整數空間：2^32 × 2^32 = 2^64 ≈ 1.84 × 10^19 種輸入組合！</li>
</ul>
</li>
<li><strong>時間代價</strong>：
<ul>
<li>假設極速測試機每秒能跑 <strong>10 億次 (1 GHz)</strong> 測試；</li>
<li>窮舉測完這一個加法函式需要：<strong>584 年</strong>！</li>
</ul>
</li>
<li><strong>盲目測試的無效性</strong>：
<ul>
<li>隨機抽樣百萬個案例，對如此龐大的空間而言依然是九牛一毛，極容易漏掉關鍵缺陷。</li>
</ul>
</li>
</ul>
</div>
<div class="card" data-marpit-fragment>
<h3 id="%F0%9F%8E%AF-%E9%BB%91%E7%AE%B1%E5%B7%A5%E7%A8%8B%E6%96%B9%E6%B3%95%E7%9A%84%E7%9C%9F%E6%AD%A3%E4%BD%BF%E5%91%BD"><img class="emoji" draggable="false" alt="🎯" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f3af.svg" data-marp-twemoji=""/> 黑箱工程方法的真正使命</h3>
<ul>
<li><strong>測試的核心智慧</strong>：
<ul>
<li>「在有限的時間與成本下，<strong>以最小代表性測試子集，捕捉最大缺陷機率</strong>」。</li>
</ul>
</li>
<li><strong>科學化子集選取策略</strong>：
<ul>
<li><strong>5.3 邊界值分析 (BVA)</strong>：鎖定極易出錯的臨界邊界。</li>
<li><strong>5.4 等價類分割 (EP)</strong>：代表點取代全集合，避免重複無效測試。</li>
<li><strong>5.5 全成對測試 (Pairwise)</strong>：以成對覆蓋破解多維度組合爆炸。</li>
<li><strong>5.7 決策表測試</strong>：釐清錯綜複雜的商務規則制約。</li>
<li><strong>5.8 狀態機測試</strong>：驗證有記憶系統的時序與生命週期。</li>
</ul>
</li>
</ul>
</div>
</div>
</div>
<footer>Ch05 黑箱測試</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="7" data-paginate="true" data-header="5.1 黑箱測試本質與核心思想" data-footer="Ch05 黑箱測試" data-theme="sqa-theme" lang="C" data-marpit-pagination="7" style="--paginate:true;--header:5.1 黑箱測試本質與核心思想;--footer:Ch05 黑箱測試;--theme:sqa-theme;" data-marpit-pagination-total="88">
<header>5.1 黑箱測試本質與核心思想</header>

<h2 id="%E8%BB%9F%E9%AB%94%E6%B8%AC%E8%A9%A6%E4%B9%8B%E7%88%B6glenford-j-myers">軟體測試之父：Glenford J. Myers</h2>
<div class="card-deck">
<blockquote>
<p><img class="emoji" draggable="false" alt="💡" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4a1.svg" data-marp-twemoji=""/> 1979 年出版《The Art of Software Testing》，奠定黑箱測試、等價分割與邊界值分析的理論基石。</p>
</blockquote>
<div class="content-columns">
<div class="content-text">
<ul>
<li><strong>測試哲學的革命性定義</strong>：
<ul>
<li>「<strong>測試是為了發現錯誤而執行程式的過程</strong>，而不是為了證明程式沒有錯誤。」</li>
<li>破除「測試通過即系統完美」的迷思，將測試從被動驗收昇華為積極尋找缺陷的工程學。</li>
</ul>
</li>
<li><strong>黑箱測試三大經典方法奠基者</strong>：
<ul>
<li>率先系統化定義 <strong>等價類分割 (EP)</strong>、<strong>邊界值分析 (BVA)</strong> 與 <strong>錯誤猜測 (Error Guessing)</strong>。</li>
<li>主張「測試案例必須包含<strong>預期輸出</strong>」，否則測試員容易將錯誤輸出誤認為正常。</li>
</ul>
</li>
<li><strong>經典範例：三角形問題 (The Triangle Problem)</strong>：
<ul>
<li>提出聞名全球的「三邊長判斷三角形」測試題目，揭示最簡單的規格也常隱藏大量邊界與例外漏洞。</li>
</ul>
</li>
</ul>
</div>
<div class="content-figure">
  <div class="name-card">
    <img src="../../img/ch05/glenford_myers.jpg" alt="Glenford J. Myers" />
    <div class="name-card-caption">
      <span class="name-card-name">Glenford J. Myers (格倫福德·邁爾斯)</span>
      <span class="name-card-cc"><a href="https://en.wikipedia.org/wiki/Glenford_Myers" target="_blank" rel="noopener">Author: The Art of Software Testing</a></span>
    </div>
  </div>
</div>
</div>
</div>
<footer>Ch05 黑箱測試</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="8" data-paginate="true" data-header="5.2 單元測試與 JUnit 5 快速入門" data-footer="Ch05 黑箱測試" data-class="lead" data-theme="sqa-theme" lang="C" class="lead" data-marpit-pagination="8" style="--paginate:true;--header:5.2 單元測試與 JUnit 5 快速入門;--footer:Ch05 黑箱測試;--class:lead;--theme:sqa-theme;" data-marpit-pagination-total="88">
<header>5.2 單元測試與 JUnit 5 快速入門</header>

<h1 id="52-%E5%96%AE%E5%85%83%E6%B8%AC%E8%A9%A6%E8%88%87-junit-5-%E5%BF%AB%E9%80%9F%E5%85%A5%E9%96%80"><strong>5.2 單元測試與 JUnit 5 快速入門</strong></h1>
<blockquote>
<p>「設計 ➔ 寫測試 ➔ 寫程式 ➔ 自動回歸。<br />
讓測試成為可重複執行的安全防護網。」</p>
</blockquote>
<footer>Ch05 黑箱測試</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="9" data-paginate="true" data-header="5.2 單元測試與 JUnit 5 快速入門" data-footer="Ch05 黑箱測試" data-theme="sqa-theme" lang="C" data-marpit-pagination="9" style="--paginate:true;--header:5.2 單元測試與 JUnit 5 快速入門;--footer:Ch05 黑箱測試;--theme:sqa-theme;" data-marpit-pagination-total="88">
<header>5.2 單元測試與 JUnit 5 快速入門</header>

<h2 id="%E7%82%BA%E4%BB%80%E9%BA%BC%E9%9C%80%E8%A6%81%E8%87%AA%E5%8B%95%E5%8C%96%E5%96%AE%E5%85%83%E6%B8%AC%E8%A9%A6%E8%88%87-3a-%E5%8E%9F%E5%89%87">為什麼需要自動化單元測試？與 3A 原則</h2>
<div class="card-deck">
<blockquote>
<p><img class="emoji" draggable="false" alt="💡" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4a1.svg" data-marp-twemoji=""/> 手動點擊驗收耗時且無法回歸；自動化測試以毫秒級速度驗證最小程式單元（類別或函式）。</p>
</blockquote>
<div class="two-columns">
<div class="card" data-marpit-fragment>
<h3 id="%F0%9F%94%84-test-first-%E6%B8%AC%E8%A9%A6%E9%A9%85%E5%8B%95%E6%80%9D%E7%B6%AD"><img class="emoji" draggable="false" alt="🔄" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f504.svg" data-marp-twemoji=""/> Test-First 測試驅動思維</h3>
<ul>
<li><strong>傳統開發</strong>：
<ul>
<li>設計 ➔ 寫程式 ➔ 手動測試 ➔ 害怕修改重構。</li>
</ul>
</li>
<li><strong>現代軟體工程 (Test-First / 3A)</strong>：
<ul>
<li>先根據規格設計測試案例，再撰寫程式碼；</li>
<li>隨著程式逐步完善，測試案例從紅燈（失敗）全數轉為綠燈（通過）！</li>
</ul>
</li>
<li><strong>可重複回歸性 (Regression)</strong>：
<ul>
<li>每次改動程式碼，一鍵自動重跑數千個單元測試，秒級確認舊功能未被破壞。</li>
</ul>
</li>
</ul>
</div>
<div class="card" data-marpit-fragment>
<h3 id="%F0%9F%93%90-%E5%96%AE%E5%85%83%E6%B8%AC%E8%A9%A6%E4%B8%89%E5%A4%A7%E6%AD%A5%E9%A9%9F3a-%E5%8E%9F%E5%89%87"><img class="emoji" draggable="false" alt="📐" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4d0.svg" data-marp-twemoji=""/> 單元測試三大步驟：3A 原則</h3>
<ul>
<li><strong>1. Arrange (安排準備)</strong>：
<ul>
<li>建立受測物件實體、準備測試輸入參數與環境。</li>
</ul>
</li>
<li><strong>2. Act (執行呼叫)</strong>：
<ul>
<li>呼叫待測方法，獲取系統的實際回傳值或激發動作。</li>
</ul>
</li>
<li><strong>3. Assert (驗證結果)</strong>：
<ul>
<li>比對實際輸出與預期規格是否完全一致。</li>
</ul>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-comment">// 1. Arrange: 準備計算機實體</span>
<span class="hljs-type">Calculator</span> <span class="hljs-variable">calc</span> <span class="hljs-operator">=</span> <span class="hljs-keyword">new</span> <span class="hljs-title class_">Calculator</span>();
<span class="hljs-comment">// 2. Act: 執行加法</span>
<span class="hljs-type">int</span> <span class="hljs-variable">result</span> <span class="hljs-operator">=</span> calc.add(<span class="hljs-number">2</span>, <span class="hljs-number">3</span>);
<span class="hljs-comment">// 3. Assert: 驗證輸出是否為 5</span>
assertEquals(<span class="hljs-number">5</span>, result);
</code></pre>
</li>
</ul>
</div>
</div>
</div>
<footer>Ch05 黑箱測試</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="10" data-paginate="true" data-header="5.2 單元測試與 JUnit 5 快速入門" data-footer="Ch05 黑箱測試" data-theme="sqa-theme" lang="C" data-marpit-pagination="10" style="--paginate:true;--header:5.2 單元測試與 JUnit 5 快速入門;--footer:Ch05 黑箱測試;--theme:sqa-theme;" data-marpit-pagination-total="88">
<header>5.2 單元測試與 JUnit 5 快速入門</header>

<h2 id="junit-5-%E6%A0%B8%E5%BF%83%E7%B5%90%E6%A7%8B%E8%88%87%E5%9F%BA%E6%9C%AC%E6%96%B7%E8%A8%80%E6%A9%9F%E5%88%B6">JUnit 5 核心結構與基本斷言機制</h2>
<div class="card-deck">
<blockquote>
<p><img class="emoji" draggable="false" alt="💡" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4a1.svg" data-marp-twemoji=""/> JUnit 5 是 Java 現代測試標準。透過標註宣告測試方法，由測試引擎自動執行並呈現綠燈。</p>
</blockquote>
<div class="two-columns">
<div class="card" data-marpit-fragment>
<h3 id="%F0%9F%8F%B7%EF%B8%8F-%E6%B8%AC%E8%A9%A6%E6%A0%B8%E5%BF%83%E7%B5%90%E6%A7%8B-test"><img class="emoji" draggable="false" alt="🏷️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f3f7.svg" data-marp-twemoji=""/> 測試核心結構 (<code>@Test</code>)</h3>
<ul>
<li><strong>無參數且無回傳值的測試方法</strong>：
<ul>
<li>只要加上 <code>@Test</code> 標註，JUnit 引擎便會自動探索並執行該方法。</li>
</ul>
</li>
<li><strong>獨立執行隔離</strong>：
<ul>
<li>每個測試方法執行時，框架都會建立新的測試類別實體，保證測試彼此獨立、無先後狀態污染。</li>
</ul>
</li>
</ul>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-keyword">class</span> <span class="hljs-title class_">CalculatorTest</span> {
    <span class="hljs-keyword">private</span> <span class="hljs-keyword">final</span> <span class="hljs-type">Calculator</span> <span class="hljs-variable">calc</span> <span class="hljs-operator">=</span> <span class="hljs-keyword">new</span> <span class="hljs-title class_">Calculator</span>();

    <span class="hljs-meta">@Test</span>
    <span class="hljs-type">void</span> <span class="hljs-title function_">testAdd</span><span class="hljs-params">()</span> {
        assertEquals(<span class="hljs-number">5</span>, calc.add(<span class="hljs-number">2</span>, <span class="hljs-number">3</span>));
    }
}
</code></pre>
</div>
<div class="card" data-marpit-fragment>
<h3 id="%E2%9A%96%EF%B8%8F-%E5%B8%B8%E7%94%A8%E5%9F%BA%E6%9C%AC%E6%96%B7%E8%A8%80%E6%96%B9%E6%B3%95"><img class="emoji" draggable="false" alt="⚖️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/2696.svg" data-marp-twemoji=""/> 常用基本斷言方法</h3>
<ul>
<li><strong>相等比對</strong>：
<ul>
<li><code>assertEquals(expected, actual)</code>：驗證實際值等於預期值。</li>
<li><code>assertNotEquals(unexpected, actual)</code>：驗證兩者不相等。</li>
</ul>
</li>
<li><strong>布林條件</strong>：
<ul>
<li><code>assertTrue(condition)</code>：條件必須為 true。</li>
<li><code>assertFalse(condition)</code>：條件必須為 false。</li>
</ul>
</li>
<li><strong>非空檢驗</strong>：
<ul>
<li><code>assertNotNull(object)</code>：確認物件已被正確建立。</li>
</ul>
</li>
<li><strong>失敗提示訊息</strong>：
<ul>
<li>斷言最後一個參數可傳入自訂錯誤訊息字串。</li>
</ul>
</li>
</ul>
</div>
</div>
</div>
<footer>Ch05 黑箱測試</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="11" data-paginate="true" data-header="5.2 單元測試與 JUnit 5 快速入門" data-footer="Ch05 黑箱測試" data-theme="sqa-theme" lang="C" data-marpit-pagination="11" style="--paginate:true;--header:5.2 單元測試與 JUnit 5 快速入門;--footer:Ch05 黑箱測試;--theme:sqa-theme;" data-marpit-pagination-total="88">
<header>5.2 單元測試與 JUnit 5 快速入門</header>

<h2 id="%E6%96%B7%E8%A8%80%E6%A9%9F%E5%88%B6%E7%9A%84%E9%97%9C%E9%8D%B5%E6%80%9D%E7%B6%AD%E5%85%A7%E5%AE%B9%E7%AD%89%E5%83%B9-vs-%E8%A8%98%E6%86%B6%E9%AB%94%E5%90%8C%E4%B8%80%E6%80%A7">斷言機制的關鍵思維：內容等價 vs. 記憶體同一性</h2>
<div class="card-deck">
<blockquote>
<p><img class="emoji" draggable="false" alt="💡" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4a1.svg" data-marp-twemoji=""/> 在所有自動化測試斷言中，驗證物件時必須釐清「值相同」與「同一個實體」的本質差別。</p>
</blockquote>
<div class="two-columns">
<div class="card" data-marpit-fragment>
<h3 id="%E2%9A%96%EF%B8%8F-assertequals%E5%85%A7%E5%AE%B9%E5%80%BC%E7%AD%89%E5%83%B9-value-equality"><img class="emoji" draggable="false" alt="⚖️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/2696.svg" data-marp-twemoji=""/> assertEquals：內容值等價 (Value Equality)</h3>
<ul>
<li><strong>概念本質</strong>：
<ul>
<li>檢驗兩個獨立物件內部所承載的<strong>資料內容是否相等</strong>。</li>
</ul>
</li>
<li><strong>底層運作機制</strong>：
<ul>
<li>內部呼叫物件的 <code>equals()</code> 方法。</li>
</ul>
</li>
<li><strong>黑箱測試適用情境</strong>：
<ul>
<li>計算結果比對、字串傳回值、自訂資料物件 (DTO) 欄位驗證。</li>
</ul>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java"><span class="hljs-type">String</span> <span class="hljs-variable">s1</span> <span class="hljs-operator">=</span> <span class="hljs-keyword">new</span> <span class="hljs-title class_">String</span>(<span class="hljs-string">&quot;SQA&quot;</span>);
<span class="hljs-type">String</span> <span class="hljs-variable">s2</span> <span class="hljs-operator">=</span> <span class="hljs-keyword">new</span> <span class="hljs-title class_">String</span>(<span class="hljs-string">&quot;SQA&quot;</span>);
assertEquals(s1, s2); <span class="hljs-comment">// <img class="emoji" draggable="false" alt="✅" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/2705.svg" data-marp-twemoji=""/> 通過 (內容完全相同)</span>
</code></pre>
</li>
</ul>
</div>
<div class="card" data-marpit-fragment>
<h3 id="%F0%9F%8E%AF-assertsame%E8%A8%98%E6%86%B6%E9%AB%94%E5%90%8C%E4%B8%80%E6%80%A7-reference-identity"><img class="emoji" draggable="false" alt="🎯" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f3af.svg" data-marp-twemoji=""/> assertSame：記憶體同一性 (Reference Identity)</h3>
<ul>
<li><strong>概念本質</strong>：
<ul>
<li>檢驗兩個參照變數是否指向 Heap 中的<strong>同一個實體位址</strong>。</li>
</ul>
</li>
<li><strong>底層運作機制</strong>：
<ul>
<li>直接比對記憶體指標位址（即 <code>==</code> 指標比對）。</li>
</ul>
</li>
<li><strong>黑箱測試適用情境</strong>：
<ul>
<li>單例模式 (Singleton) 驗證、連線池/快取重用、物件共享檢驗。</li>
</ul>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-java">assertSame(s1, s2);   <span class="hljs-comment">// <img class="emoji" draggable="false" alt="❌" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/274c.svg" data-marp-twemoji=""/> 失敗 (不同記憶體物件)</span>
<span class="hljs-type">String</span> <span class="hljs-variable">s3</span> <span class="hljs-operator">=</span> s1;
assertSame(s1, s3);   <span class="hljs-comment">// <img class="emoji" draggable="false" alt="✅" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/2705.svg" data-marp-twemoji=""/> 通過 (指向同一位址)</span>
</code></pre>
</li>
</ul>
</div>
</div>
</div>
<footer>Ch05 黑箱測試</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="12" data-paginate="true" data-header="5.2 單元測試與 JUnit 5 快速入門" data-footer="Ch05 黑箱測試" data-theme="sqa-theme" lang="C" data-marpit-pagination="12" style="--paginate:true;--header:5.2 單元測試與 JUnit 5 快速入門;--footer:Ch05 黑箱測試;--theme:sqa-theme;" data-marpit-pagination-total="88">

<h2 id="%E6%A6%82%E5%BF%B5%E6%A0%B8%E5%B0%8D%E5%95%8F%E7%AD%94-ccq-1">概念核對問答 (CCQ 1)</h2>
<div class="ccq-columns">
<div class="ccq-text">

<p><strong>問題情境</strong>：<br />
【是非題】在單元測試斷言機制中，「記憶體同一性 (Reference Identity)」驗證的作用與「內容值等價 (Value Equality)」驗證完全相同，兩者都是在比對兩個物件內部的資料欄位是否相等。</p>
<ul>
<li><strong>A)</strong> 正確 (True)</li>
<li><strong>B)</strong> 錯誤 (False)</li>
</ul>
</div>
<div class="ccq-logo">
<p><a href="https://nlhsueh.github.io/nickedupocket/#/student/sqa-ch05-ccq1" target="_blank"><img src="../../img/ch05/sqa-ch05-ccq1.png" alt="QR Code" /></a></p>
</div>

</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="14" data-paginate="true" data-header="5.3 邊界值分析 (BVA)" data-footer="Ch05 黑箱測試" data-class="lead" data-theme="sqa-theme" lang="C" class="lead" data-marpit-pagination="14" style="--paginate:true;--header:5.3 邊界值分析 (BVA);--footer:Ch05 黑箱測試;--class:lead;--theme:sqa-theme;" data-marpit-pagination-total="88">
<header>5.3 邊界值分析 (BVA)</header>

<h1 id="53-%E9%82%8A%E7%95%8C%E5%80%BC%E5%88%86%E6%9E%90-bva"><strong>5.3 邊界值分析 (BVA)</strong></h1>
<blockquote>
<p>「錯誤都隱藏在角落！<br />
大多數的程式缺陷，都發生在邊界條件差之毫釐的瞬間。」</p>
</blockquote>
<footer>Ch05 黑箱測試</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="15" data-paginate="true" data-header="5.3 邊界值分析 (BVA)" data-footer="Ch05 黑箱測試" data-theme="sqa-theme" lang="C" data-marpit-pagination="15" style="--paginate:true;--header:5.3 邊界值分析 (BVA);--footer:Ch05 黑箱測試;--theme:sqa-theme;" data-marpit-pagination-total="88">
<header>5.3 邊界值分析 (BVA)</header>

<h2 id="%E9%82%8A%E7%95%8C%E5%80%BC%E5%88%86%E6%9E%90-bva-%E6%A0%B8%E5%BF%83%E5%93%B2%E5%AD%B8">邊界值分析 (BVA) 核心哲學</h2>
<div class="card-deck">
<blockquote>
<p><img class="emoji" draggable="false" alt="💡" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4a1.svg" data-marp-twemoji=""/> 軟體工程界公認：輸入範圍的邊緣（極大值、極小值）比中間值更容易觸發 Off-by-one 缺陷。</p>
</blockquote>
<div class="two-columns">
<div class="card" data-marpit-fragment>
<h3 id="%F0%9F%9A%A9-%E7%82%BA%E4%BB%80%E9%BA%BC%E9%8C%AF%E8%AA%A4%E9%9A%B1%E8%97%8F%E5%9C%A8%E8%A7%92%E8%90%BD"><img class="emoji" draggable="false" alt="🚩" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f6a9.svg" data-marp-twemoji=""/> 為什麼錯誤隱藏在角落？</h3>
<ul>
<li><strong>運算子誤用陷阱</strong>：
<ul>
<li>程式設計師常在 <code>&lt;</code> 與 <code>&lt;=</code>、<code>&gt;</code> 與 <code>&gt;=</code> 之間犯錯。</li>
</ul>
</li>
<li><strong>程式碼良劣對照</strong>：
<table>
<thead>
<tr>
<th style="text-align:left">程式碼寫法</th>
<th style="text-align:left">缺陷本質</th>
<th style="text-align:left">測試結果</th>
</tr>
</thead>
<tbody>
<tr>
<td style="text-align:left"><code>if (input &lt;= 10)</code></td>
<td style="text-align:left">無缺陷，邊界完整包含</td>
<td style="text-align:left">input=10 通過</td>
</tr>
<tr>
<td style="text-align:left"><code>if (input &lt; 10)</code></td>
<td style="text-align:left">致命缺陷：10 被遺漏</td>
<td style="text-align:left"><strong>input=10 測試失敗</strong></td>
</tr>
</tbody>
</table>
</li>
<li><strong>結論</strong>：測試邊界點能以極高精準度曝光邊界比較缺陷。</li>
</ul>
</div>
<div class="card" data-marpit-fragment>
<h3 id="%F0%9F%9B%A1%EF%B8%8F-%E5%96%AE%E4%B8%80%E9%8C%AF%E8%AA%A4%E5%81%87%E8%A8%AD-single-fault-assumption"><img class="emoji" draggable="false" alt="🛡️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f6e1.svg" data-marp-twemoji=""/> 單一錯誤假設 (Single Fault Assumption)</h3>
<ul>
<li><strong>核心假設前提</strong>：
<ul>
<li>在獨立變數系統中，絕大多數錯誤只需單一變數發生邊界異常即可彰顯，無需多個變數同時在邊界出錯。</li>
</ul>
</li>
<li><strong>取樣五大關鍵點</strong>：
<ul>
<li>對於範圍 [min, max]，測試點取：
<ul>
<li><strong><code>min</code></strong> (最小值)</li>
<li><strong><code>min+</code></strong> (略大於最小值)</li>
<li><strong><code>norm</code></strong> (區間內正常代表值)</li>
<li><strong><code>max-</code></strong> (略小於最大值)</li>
<li><strong><code>max</code></strong> (最大值)</li>
</ul>
</li>
</ul>
</li>
</ul>
</div>
</div>
</div>
<footer>Ch05 黑箱測試</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="16" data-marpit-fragments="1" data-paginate="true" data-header="5.3 邊界值分析 (BVA)" data-footer="Ch05 黑箱測試" data-theme="sqa-theme" lang="C" data-marpit-pagination="16" style="--paginate:true;--header:5.3 邊界值分析 (BVA);--footer:Ch05 黑箱測試;--theme:sqa-theme;" data-marpit-pagination-total="88">
<header>5.3 邊界值分析 (BVA)</header>

<h2 id="%E7%8D%A8%E7%AB%8B%E5%9E%8B%E9%82%8A%E7%95%8C%E6%B8%AC%E8%A9%A64n--1-%E5%85%AC%E5%BC%8F">獨立型邊界測試：4n + 1 公式</h2>
<div class="card-deck">
<ul>
<li data-marpit-fragment="1">
<blockquote>
<p><img class="emoji" draggable="false" alt="💡" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4a1.svg" data-marp-twemoji=""/> 針對 n 個彼此獨立的輸入變數，每次只讓 1 個變數處於邊界，其餘變數皆維持正常值 (norm)。</p>
</blockquote>
</li>
</ul>
<div class="two-columns">
<div class="card" data-marpit-fragment>
<h3 id="%F0%9F%93%90-4n--1-%E8%A8%88%E7%AE%97%E5%8E%9F%E7%90%86"><img class="emoji" draggable="false" alt="📐" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4d0.svg" data-marp-twemoji=""/> 4n + 1 計算原理</h3>
<ul>
<li><strong>每個變數貢獻 4 個邊界案例</strong>：
<ul>
<li><code>min</code>, <code>min+</code>, <code>max-</code>, <code>max</code>（此時其他 n-1 個變數皆取 <code>norm</code>）。</li>
</ul>
</li>
<li><strong>加上 1 個全員正常中心點</strong>：
<ul>
<li>所有 n 個變數皆取 <code>norm</code> 的基準案例。</li>
</ul>
</li>
<li><strong>案例總數公式</strong>：
<blockquote>
<p><img class="emoji" draggable="false" alt="📐" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4d0.svg" data-marp-twemoji=""/> <strong>Total Test Cases = 4n + 1</strong></p>
</blockquote>
</li>
<li><strong>案例範例</strong>：若系統有 3 個獨立輸入變數，則測試案例數為 4 × 3 + 1 = <strong>13</strong> 個。</li>
</ul>
</div>
<div class="card" data-marpit-fragment>
<h3 id="%F0%9F%94%BA-%E4%B8%89%E8%A7%92%E5%BD%A2%E7%A8%8B%E5%BC%8F%E5%AF%A6%E6%88%B0%E6%A1%88%E4%BE%8B-a-b-c-%E2%88%88-1-200"><img class="emoji" draggable="false" alt="🔺" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f53a.svg" data-marp-twemoji=""/> 三角形程式實戰案例 (a, b, c ∈ [1, 200])</h3>
<ul>
<li>固定 b = 100, c = 100，變動 a：
<ul>
<li>(1, 100, 100), (2, 100, 100), (199, 100, 100), (200, 100, 100)</li>
</ul>
</li>
<li>固定 a = 100, c = 100，變動 b (4 個案例)</li>
<li>固定 a = 100, b = 100，變動 c (4 個案例)</li>
<li>全員正常基準案例：
<ul>
<li>(100, 100, 100) 正三角形</li>
</ul>
</li>
<li>總計剛好 13 個測試案例。</li>
</ul>
</div>
</div>
</div>
<footer>Ch05 黑箱測試</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="17" data-paginate="true" data-header="5.3 邊界值分析 (BVA)" data-footer="Ch05 黑箱測試" data-theme="sqa-theme" lang="C" data-marpit-pagination="17" style="--paginate:true;--header:5.3 邊界值分析 (BVA);--footer:Ch05 黑箱測試;--theme:sqa-theme;" data-marpit-pagination-total="88">
<header>5.3 邊界值分析 (BVA)</header>

<h2 id="%E7%8D%A8%E7%AB%8B%E5%9E%8B%E5%BC%B7%E5%9B%BA%E9%82%8A%E7%95%8C%E6%B8%AC%E8%A9%A66n--1-%E5%85%AC%E5%BC%8F">獨立型強固邊界測試：6n + 1 公式</h2>
<div class="card-deck">
<blockquote>
<p><img class="emoji" draggable="false" alt="💡" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4a1.svg" data-marp-twemoji=""/> 強固邊界測試 (Robust BVA) 擴充考慮「極限例外值」，驗證系統遭遇非法越界時的防禦容錯力。</p>
</blockquote>
<div class="content-columns">
<div class="content-text">
<h3 id="%F0%9F%9B%A1%EF%B8%8F-%E5%BC%95%E5%85%A5%E4%BE%8B%E5%A4%96%E9%82%8A%E7%95%8C-min--max"><img class="emoji" draggable="false" alt="🛡️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f6e1.svg" data-marp-twemoji=""/> 引入例外邊界 (min-, max+)</h3>
<ul>
<li><strong>每個變數擴充為 6 個邊界點</strong>：
<ul>
<li><strong><code>min-</code></strong> (略小於合法下界，如 0) ➔ 觸發例外</li>
<li><code>min</code> (下界 1)、<code>min+</code> (2)</li>
<li><code>max-</code> (199)、<code>max</code> (上界 200)</li>
<li><strong><code>max+</code></strong> (略大於合法上界，如 201) ➔ 觸發例外</li>
</ul>
</li>
<li><strong>案例總數公式</strong>：
<blockquote>
<p><img class="emoji" draggable="false" alt="📐" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4d0.svg" data-marp-twemoji=""/> <strong>Total Test Cases = 6n + 1</strong></p>
</blockquote>
</li>
<li>若 n=3，測試案例數為 6 × 3 + 1 = <strong>19</strong> 個。</li>
</ul>
</div>
<div class="content-figure">
<p><img src="../../img/ch05/robust_bva.png" alt="Robust BVA" /></p>
</div>
</div>
</div>
<footer>Ch05 黑箱測試</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="18" data-paginate="true" data-header="5.3 邊界值分析 (BVA)" data-footer="Ch05 黑箱測試" data-theme="sqa-theme" lang="C" data-marpit-pagination="18" style="--paginate:true;--header:5.3 邊界值分析 (BVA);--footer:Ch05 黑箱測試;--theme:sqa-theme;" data-marpit-pagination-total="88">
<header>5.3 邊界值分析 (BVA)</header>

<h2 id="%E9%9D%9E%E7%8D%A8%E7%AB%8B%E5%9E%8B%E9%82%8A%E7%95%8C%E6%B8%AC%E8%A9%A6-worst-case-testing--non-independent-bva">非獨立型邊界測試 (Worst-Case Testing / Non-Independent BVA)</h2>
<div class="card-deck">
<blockquote>
<p><img class="emoji" draggable="false" alt="💡" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4a1.svg" data-marp-twemoji=""/> 當變數之間高度相依、打破「單一錯誤假設 (Single-Fault Assumption)」時，必須採用全笛卡爾積 (Cartesian Product) 進行「最壞情況測試 (Worst-Case Testing)」。</p>
</blockquote>
<div class="content-columns">
<div class="content-text">
<h3 id="%F0%9F%92%A5-%E4%B9%98%E7%A9%8D%E7%B5%84%E5%90%88%E7%88%86%E7%82%B8-combinatorial-explosion"><img class="emoji" draggable="false" alt="💥" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4a5.svg" data-marp-twemoji=""/> 乘積組合爆炸 (Combinatorial Explosion)</h3>
<ul>
<li><strong>非獨立型一般邊界測試 (Worst-Case Normal BVA)</strong>：
<ul>
<li>每個變數取 5 個值 (<code>min</code>, <code>min+</code>, <code>norm</code>, <code>max-</code>, <code>max</code>)。</li>
<li>總數為 <strong>5^n</strong>（若 n=3，需 5^3 = <strong>125</strong> 個案例；若 n=5，需 <strong>3,125</strong> 個）。</li>
</ul>
</li>
<li><strong>非獨立型強固邊界測試 (Worst-Case Robust BVA)</strong>：
<ul>
<li>每個變數取 7 個值 (含 <code>min-</code>, <code>max+</code>)。</li>
<li>總數為 <strong>7^n</strong>（若 n=3，需 7^3 = <strong>343</strong> 個；若 n=5，需 <strong>16,807</strong> 個案例！）。</li>
</ul>
</li>
<li><strong>核心假設</strong>：基於多重錯誤假設 (Multiple-Fault Assumption)。</li>
</ul>
</div>
<div class="content-figure">
<p><img src="../../img/ch05/worst_case_bva.png" alt="Worst Case BVA" /></p>
</div>
</div>
</div>
<footer>Ch05 黑箱測試</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="19" data-marpit-fragments="1" data-paginate="true" data-header="5.3 邊界值分析 (BVA)" data-footer="Ch05 黑箱測試" data-theme="sqa-theme" lang="C" data-marpit-pagination="19" style="--paginate:true;--header:5.3 邊界值分析 (BVA);--footer:Ch05 黑箱測試;--theme:sqa-theme;" data-marpit-pagination-total="88">
<header>5.3 邊界值分析 (BVA)</header>

<h2 id="%E9%82%8A%E7%95%8C%E5%80%BC%E6%B8%AC%E8%A9%A6%E6%96%B9%E6%B3%95%E5%85%A8%E6%99%AF%E7%B8%BD%E7%B5%90">邊界值測試方法全景總結</h2>
<div class="card-deck">
<ul>
<li data-marpit-fragment="1">
<blockquote>
<p><img class="emoji" draggable="false" alt="💡" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4a1.svg" data-marp-twemoji=""/> 四種邊界測試方法的案例數量與強度對比矩陣。</p>
</blockquote>
</li>
</ul>
<div class="two-columns">
<div class="card" data-marpit-fragment>
<h3 id="%F0%9F%93%8A-%E6%B8%AC%E8%A9%A6%E6%A1%88%E4%BE%8B%E6%95%B8%E9%87%8F%E7%9F%A9%E9%99%A3"><img class="emoji" draggable="false" alt="📊" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4ca.svg" data-marp-twemoji=""/> 測試案例數量矩陣</h3>
<table>
<thead>
<tr>
<th style="text-align:left">測試策略</th>
<th style="text-align:left">單一錯誤假設 (獨立型)</th>
<th style="text-align:left">多重錯誤假設 (非獨立/最壞情況)</th>
</tr>
</thead>
<tbody>
<tr>
<td style="text-align:left"><strong>標準邊界</strong> (無越界)</td>
<td style="text-align:left"><strong>4n + 1</strong> (線性增長)</td>
<td style="text-align:left"><strong>5^n</strong> (指數級增長)</td>
</tr>
<tr>
<td style="text-align:left"><strong>強固邊界</strong> (含越界)</td>
<td style="text-align:left"><strong>6n + 1</strong> (線性增長)</td>
<td style="text-align:left"><strong>7^n</strong> (指數組合爆炸)</td>
</tr>
</tbody>
</table>
<ul>
<li><strong>適用指標</strong>：
<ul>
<li>數字型連續變數（年齡、分數、金額、溫度）。</li>
<li>對邏輯性識別碼（如身分證字號、電話號碼）較不適用。</li>
</ul>
</li>
</ul>
</div>
<div class="card" data-marpit-fragment>
<h3 id="%F0%9F%8E%AF-%E5%B7%A5%E7%A8%8B%E9%81%B8%E5%9E%8B%E5%BB%BA%E8%AD%B0"><img class="emoji" draggable="false" alt="🎯" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f3af.svg" data-marp-twemoji=""/> 工程選型建議</h3>
<ul>
<li><strong>常規模組首選</strong>：
<ul>
<li><strong>獨立型強固邊界測試 (6n+1)</strong>：在極低案例成本下，兼顧常態邊界與異常例外攔截。</li>
</ul>
</li>
<li><strong>高危關鍵金融/航太核心</strong>：
<ul>
<li><strong>最壞情況測試 (5^n)</strong>：只針對 2~3 個強關聯變數進行局部乘積，其餘變數維持獨立型，避免組合爆炸。</li>
</ul>
</li>
</ul>
</div>
</div>
</div>
<footer>Ch05 黑箱測試</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="20" data-paginate="true" data-header="5.3 邊界值分析 (BVA)" data-footer="Ch05 黑箱測試" data-theme="sqa-theme" lang="C" data-marpit-pagination="20" style="--paginate:true;--header:5.3 邊界值分析 (BVA);--footer:Ch05 黑箱測試;--theme:sqa-theme;" data-marpit-pagination-total="88">
<header>5.3 邊界值分析 (BVA)</header>

<h2 id="%E9%82%8A%E7%95%8C%E5%80%BC%E5%88%86%E6%9E%90-bva-%E5%B8%B8%E8%A6%8B%E5%95%8F%E7%AD%94-faq">邊界值分析 (BVA) 常見問答 (FAQ)</h2>
<div class="card-deck">
<blockquote>
<p><img class="emoji" draggable="false" alt="💡" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4a1.svg" data-marp-twemoji=""/> 實務邊界陷阱與混淆點解析：掌握關鍵邊界細節，避免測試盲區。</p>
</blockquote>
<div class="two-columns">
<div class="card" data-marpit-fragment>
<h3 id="%E2%9D%93-q1-%E9%82%8A%E7%95%8C%E6%B8%AC%E8%A9%A6%E6%87%89%E5%8F%96-2-%E9%BB%9E%E4%B8%8A%E5%A4%96%E9%82%84%E6%98%AF-3-%E9%BB%9E%E5%A4%96%E4%B8%8A%E5%85%A7"><img class="emoji" draggable="false" alt="❓" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/2753.svg" data-marp-twemoji=""/> Q1: 邊界測試應取 2 點（上、外）還是 3 點（外、上、內）？</h3>
<ul>
<li><strong>傳統 2 點法</strong>：
<ul>
<li>僅測試邊界點 B 與越界點 B ± 1（如 100 與 101），用於快速精簡案例。</li>
</ul>
</li>
<li><strong>現代 3 點法 (Out-On-In)</strong>：
<ul>
<li>ISO/IEC/IEEE 29119 標準推薦：同時涵蓋<strong>外部 (Out)、邊界上 (On)、內部 (In)</strong>（如 99, 100, 101）。</li>
</ul>
</li>
<li><strong>關鍵價值</strong>：
<ul>
<li>遇到開區間（如 x &gt; 0）或複雜防禦條件時，3 點法能 100% 偵測出 Off-by-one 符號筆誤（如把 <code>&gt;</code> 誤寫為 <code>&gt;=</code>）。</li>
</ul>
</li>
</ul>
</div>
<div class="card" data-marpit-fragment>
<h3 id="%E2%9D%93-q2-%E6%B5%AE%E9%BB%9E%E6%95%B8%E6%88%96%E9%80%A3%E7%BA%8C%E6%95%B8%E5%80%BCdouble%E7%9A%84%E7%9B%B8%E9%84%B0%E5%80%BC%E8%A9%B2%E5%A6%82%E4%BD%95%E5%8F%96"><img class="emoji" draggable="false" alt="❓" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/2753.svg" data-marp-twemoji=""/> Q2: 浮點數或連續數值（Double）的「相鄰值」該如何取？</h3>
<ul>
<li><strong>實務痛點</strong>：
<ul>
<li>浮點數無法像整數直接 ± 1，若隨意取 ± 0.00001 容易失真或受限精度。</li>
</ul>
</li>
<li><strong>標準解法</strong>：
<ul>
<li><strong>業務刻度原則 (Business Resolution)</strong>：依規格書最小跳動單位決定（如金額最小單位為分，取 ± 0.01；成績取 ± 0.1）。</li>
<li><strong>底層機器精度</strong>：在 Java 單元測試中，可直接調用 <code>Math.nextUp(x)</code> 與 <code>Math.nextDown(x)</code> 取得 IEEE 754 最小物理相鄰浮點數。</li>
</ul>
</li>
</ul>
</div>
</div>
</div>
<footer>Ch05 黑箱測試</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="21" data-paginate="true" data-header="5.3 邊界值分析 (BVA)" data-footer="Ch05 黑箱測試" data-theme="sqa-theme" lang="C" data-marpit-pagination="21" style="--paginate:true;--header:5.3 邊界值分析 (BVA);--footer:Ch05 黑箱測試;--theme:sqa-theme;" data-marpit-pagination-total="88">
<header>5.3 邊界值分析 (BVA)</header>

<h2 id="%E9%82%8A%E7%95%8C%E5%80%BC%E5%88%86%E6%9E%90%E7%9A%84-junit-5-%E8%90%BD%E5%9C%B0%E5%8F%83%E6%95%B8%E5%8C%96%E8%88%87%E7%BE%A4%E7%B5%84%E6%96%B7%E8%A8%80">邊界值分析的 JUnit 5 落地：參數化與群組斷言</h2>
<div class="card-deck">
<blockquote>
<p><img class="emoji" draggable="false" alt="💡" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4a1.svg" data-marp-twemoji=""/> 邊界測試的工程挑戰：臨界測資密集。若單純連續斷言，前面失敗會直接中斷後面所有邊界檢驗！</p>
</blockquote>
<div class="two-columns">
<div class="card" data-marpit-fragment>
<h3 id="%F0%9F%94%A2-%E5%8F%83%E6%95%B8%E5%8C%96%E6%B8%AC%E8%A9%A6%E5%A4%9A%E9%82%8A%E7%95%8C%E9%BB%9E%E6%89%B9%E6%AC%A1%E6%B3%A8%E5%85%A5"><img class="emoji" draggable="false" alt="🔢" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f522.svg" data-marp-twemoji=""/> 參數化測試：多邊界點批次注入</h3>
<ul>
<li><strong>單一邏輯，多點驗證</strong>：
<ul>
<li>BVA 通常產生 min-, min, min+, nom, max-, max, max+ 等多個連續臨界點。</li>
<li>傳統做法若寫 7 個獨立測試方法，將造成巨大重複樣板負擔。</li>
</ul>
</li>
<li><strong>JUnit 5 解決方案 (Parameterized)</strong>：
<ul>
<li>使用 <code>@ParameterizedTest</code> 搭配 <code>@ValueSource(ints = {...})</code>；</li>
<li>測試方法只寫一套驗證邏輯，框架自動將整組邊界值逐一注入執行，並在測試報告中列出每個臨界點的獨立判定！</li>
</ul>
</li>
</ul>
</div>
<div class="card" data-marpit-fragment>
<h3 id="%F0%9F%9B%A1%EF%B8%8F-%E7%BE%A4%E7%B5%84%E8%81%9A%E5%90%88%E6%96%B7%E8%A8%80%E4%B8%80%E6%AC%A1%E6%94%B6%E9%9B%86%E6%89%80%E6%9C%89%E9%82%8A%E7%95%8C%E7%BC%BA%E9%99%B7"><img class="emoji" draggable="false" alt="🛡️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f6e1.svg" data-marp-twemoji=""/> 群組聚合斷言：一次收集所有邊界缺陷</h3>
<ul>
<li><strong>早期中斷 (Early Abort) 陷阱</strong>：
<ul>
<li>若在同一個測試方法中連續寫多行斷言，當第一個 min- 斷言失敗時，測試方法會立即拋錯終止，後續 max 邊界完全沒機會執行！</li>
</ul>
</li>
<li><strong>JUnit 5 解決方案 (<code>assertAll</code>)</strong>：
<ul>
<li>將多組邊界檢驗包裝在 <code>assertAll</code> 區塊中（如 LabDemo <code>AssertionsDemoTest</code> &amp; <code>TriangleBlackBoxTest</code>）；</li>
<li><strong>所有邊界斷言皆保證被完整執行</strong>，一次性報告所有崩潰點，大幅縮短修復與回歸週期！</li>
</ul>
</li>
</ul>
</div>
</div>
</div>

<blockquote>
<p><img class="emoji" draggable="false" alt="💡" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4a1.svg" data-marp-twemoji=""/> 邊界測試的精髓：親自體驗使用 JUnit 5 參數化與群組斷言，秒級捕捉邊界缺陷。</p>
</blockquote>
<div class="two-columns">
<div class="card">
<h3 id="%F0%9F%92%BB-%E9%AB%94%E9%A9%97%E7%AF%84%E4%BE%8B%E7%A8%8B%E5%BC%8F%E7%A2%BC-demo-walkthrough-1"><img class="emoji" draggable="false" alt="💻" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4bb.svg" data-marp-twemoji=""/> 體驗範例程式碼 (Demo Walkthrough)</h3>
<ul>
<li><strong>1. 邊界測試示範類別</strong>：
<ul>
<li>開啟 <code>u05_input/bva/TriangleBvaDemoTest.java</code></li>

<li><strong>2. 群組斷言避免 Early Abort</strong>：

<header>5.4 等價類分割測試 (EP)</header>

<h1 id="54-%E7%AD%89%E5%83%B9%E9%A1%9E%E5%88%86%E5%89%B2%E6%B8%AC%E8%A9%A6-ep"><strong>5.4 等價類分割測試 (EP)</strong></h1>
<blockquote>
<p>「把無限的輸入空間劃分為有限的等價群組；<br />
測試其中一個代表，就等於測試了整個群體。」</p>
</blockquote>
<footer>Ch05 黑箱測試</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="25" data-marpit-fragments="1" data-paginate="true" data-header="5.4 等價類分割測試 (EP)" data-footer="Ch05 黑箱測試" data-theme="sqa-theme" lang="C" data-marpit-pagination="25" style="--paginate:true;--header:5.4 等價類分割測試 (EP);--footer:Ch05 黑箱測試;--theme:sqa-theme;" data-marpit-pagination-total="88">
<header>5.4 等價類分割測試 (EP)</header>

<h2 id="%E7%AD%89%E5%83%B9%E9%A1%9E%E5%88%86%E5%89%B2%E6%B8%AC%E8%A9%A6-equivalence-partitioning">等價類分割測試 (Equivalence Partitioning)</h2>
<div class="card-deck">
<ul>
<li data-marpit-fragment="1">
<blockquote>
<p><img class="emoji" draggable="false" alt="💡" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4a1.svg" data-marp-twemoji=""/> 等價類的核心定義：同一個群組內的任意資料，若一個能找出 Bug，其他也必定能找出 Bug。</p>
</blockquote>
</li>
</ul>
<div class="two-columns">
<div class="card" data-marpit-fragment>
<h3 id="%F0%9F%A7%A9-%E7%AD%89%E5%83%B9%E5%88%86%E5%89%B2%E6%A0%B8%E5%BF%83%E5%8B%95%E6%A9%9F"><img class="emoji" draggable="false" alt="🧩" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f9e9.svg" data-marp-twemoji=""/> 等價分割核心動機</h3>
<ul>
<li><strong>達成完整測試</strong>：確保每個業務分支與邏輯區間都有代表被測試到，避免盲區。</li>
<li><strong>消除冗餘重複</strong>：在同一個等價區間內測試 100 次只是浪費時間，挑選 1 個代表即可。</li>
<li><strong>兩大等價類別</strong>：
<ul>
<li><strong>有效等價類 (Valid Class)</strong>：符合規格的合理合法輸入集合。</li>
<li><strong>無效等價類 (Invalid Class)</strong>：超出範圍或格式異常的非法集合。</li>
</ul>
</li>
</ul>
</div>
<div class="card" data-marpit-fragment>
<h3 id="%F0%9F%8E%AF-%E5%8A%83%E5%88%86%E7%B6%AD%E5%BA%A6%E8%88%87%E6%8A%80%E5%B7%A7"><img class="emoji" draggable="false" alt="🎯" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f3af.svg" data-marp-twemoji=""/> 劃分維度與技巧</h3>
<ul>
<li><strong>依輸入劃分</strong>：
<ul>
<li>數值範圍（如 0 ≤ score ≤ 100 ➔ &lt;0, [0, 100], &gt;100）。</li>
<li>輸入個數（如「陣列為空」、「單一元素」、「多元素」）。</li>
</ul>
</li>
<li><strong>依輸出反推</strong>：
<ul>
<li>規格要求輸出 A, B, C, D ➔ 倒推需要哪些輸入組合才能覆蓋這四種產出！</li>
</ul>
</li>
</ul>
</div>
</div>
</div>
<footer>Ch05 黑箱測試</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="26" data-paginate="true" data-header="5.4 等價類分割測試 (EP)" data-footer="Ch05 黑箱測試" data-theme="sqa-theme" lang="C" data-marpit-pagination="26" style="--paginate:true;--header:5.4 等價類分割測試 (EP);--footer:Ch05 黑箱測試;--theme:sqa-theme;" data-marpit-pagination-total="88">
<header>5.4 等價類分割測試 (EP)</header>

<h2 id="%E5%BC%B1%E6%B6%B5%E8%93%8B-vs-%E5%BC%B7%E6%B6%B5%E8%93%8B%E7%AD%89%E5%83%B9%E6%B8%AC%E8%A9%A6">弱涵蓋 vs. 強涵蓋等價測試</h2>
<div class="card-deck">
<blockquote>
<p><img class="emoji" draggable="false" alt="💡" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4a1.svg" data-marp-twemoji=""/> 單一錯誤假設 vs. 多重錯誤假設在等價劃分中的延伸。</p>
</blockquote>
<div class="content-columns">
<div class="content-text">
<h3 id="%E2%9A%96%EF%B8%8F-%E6%B6%B5%E8%93%8B%E5%BC%B7%E5%BA%A6%E6%B7%B1%E5%BA%A6%E6%AF%94%E8%BC%83"><img class="emoji" draggable="false" alt="⚖️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/2696.svg" data-marp-twemoji=""/> 涵蓋強度深度比較</h3>
<ul>
<li><strong>弱涵蓋測試 (Weak Coverage)</strong>：
<ul>
<li><strong>單一錯誤假設</strong>：要求每個變數的每個等價區間，在所有案例中<strong>至少出現過一次</strong>即可。</li>
<li>測試案例數等於<strong>各變數分割數中的最大值</strong> (max(m_i))。</li>
</ul>
</li>
<li><strong>強涵蓋測試 (Strong Coverage)</strong>：
<ul>
<li><strong>多重錯誤假設</strong>：要求測試所有變數等價區間的<strong>笛卡爾積組合</strong>（全部配對到）。</li>
<li>測試案例數為所有變數分割數的<strong>乘積</strong> (∏ m_i)。</li>
</ul>
</li>
</ul>
</div>
<div class="content-figure">
<p><img src="../../img/ch05/equivalence_partition.png" alt="Equivalence Partition" /></p>
</div>
</div>
</div>
<footer>Ch05 黑箱測試</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="27" data-marpit-fragments="1" data-paginate="true" data-header="5.4 等價類分割測試 (EP)" data-footer="Ch05 黑箱測試" data-theme="sqa-theme" lang="C" data-marpit-pagination="27" style="--paginate:true;--header:5.4 等價類分割測試 (EP);--footer:Ch05 黑箱測試;--theme:sqa-theme;" data-marpit-pagination-total="88">
<header>5.4 等價類分割測試 (EP)</header>

<h2 id="binary-search-%E5%AF%A6%E6%88%B0%E7%AD%89%E5%83%B9%E5%8A%83%E5%88%86%E6%A1%88%E4%BE%8B">Binary Search 實戰等價劃分案例</h2>
<div class="card-deck">
<ul>
<li data-marpit-fragment="1">
<blockquote>
<p><img class="emoji" draggable="false" alt="💡" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4a1.svg" data-marp-twemoji=""/> 二元搜尋的等價分割不僅看輸入 Key，更必須深入考量陣列長度與命中位置的等價關係。</p>
</blockquote>
</li>
</ul>
<div class="two-columns">
<div class="card" data-marpit-fragment>
<h3 id="%F0%9F%93%8B-%E7%B5%90%E6%A7%8B%E5%8C%96%E7%AD%89%E5%83%B9%E5%8A%83%E5%88%86%E8%A8%AD%E8%A8%88"><img class="emoji" draggable="false" alt="📋" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4cb.svg" data-marp-twemoji=""/> 結構化等價劃分設計</h3>
<ul>
<li><strong>陣列長度維度 (A)</strong>：
<ul>
<li>a<sup>0</sup>：空陣列 (長度 0)</li>
<li>a<sup>1</sup>：單一元素陣列</li>
<li>a<sup>*</sup>：多元素陣列（可再細分奇數與偶數）</li>
</ul>
</li>
<li><strong>搜尋結果與位置維度 (F, C)</strong>：
<ul>
<li>f<sup>t</sup> 找到：命中於頭部 (c<sup>1</sup>)、中間 (c<sup>m</sup>)、尾部 (c<sup>l</sup>)</li>
<li>f<sup>f</sup> 未找到：元素不存在於陣列中</li>
</ul>
</li>
<li><strong>輸入合法性維度 (K)</strong>：
<ul>
<li>k：合法整數；k!：非整數例外</li>
</ul>
</li>
</ul>
</div>
<div class="card" data-marpit-fragment>
<h3 id="%F0%9F%8E%AF-%E5%BC%B1%E6%B6%B5%E8%93%8B-8-%E5%A4%A7%E4%BB%A3%E8%A1%A8%E6%A1%88%E4%BE%8B"><img class="emoji" draggable="false" alt="🎯" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f3af.svg" data-marp-twemoji=""/> 弱涵蓋 8 大代表案例</h3>
<ul>
<li>R_1: 單元素，有找到 (k=7, A=[7])</li>
<li>R_2: 單元素，沒找到 (k=7, A=[8])</li>
<li>R_3: 多元素，命中頭部 (k=7, A=[7, 9, 11])</li>
<li>R_4: 多元素，命中中間 (k=9, A=[7, 9, 11])</li>
<li>R_5: 多元素，命中尾部 (k=11, A=[7, 9, 11])</li>
<li>R_6: 多元素，沒找到 (k=8, A=[7, 9, 11])</li>
<li>R_7: 空陣列，沒找到 (k=7, A=[])</li>
<li>R_8: 非法輸入，拋出例外 (k=&quot;abc&quot;)</li>
</ul>
<footer>Ch05 黑箱測試</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="28" data-paginate="true" data-header="5.4 等價類分割測試 (EP)" data-footer="Ch05 黑箱測試" data-theme="sqa-theme" lang="C" data-marpit-pagination="28" style="--paginate:true;--header:5.4 等價類分割測試 (EP);--footer:Ch05 黑箱測試;--theme:sqa-theme;" data-marpit-pagination-total="88">
<header>5.4 等價類分割測試 (EP)</header>

<h2 id="binary-search-%E5%BC%B1%E6%B6%B5%E8%93%8B%E6%B8%AC%E8%A9%A6%E6%A1%88%E4%BE%8B%E8%A6%8F%E6%A0%BC%E8%A1%A8">Binary Search 弱涵蓋測試案例規格表</h2>

<header>5.4 等價類分割測試 (EP)</header>

<h2 id="%E9%A0%98%E5%9F%9F%E8%A6%8F%E5%89%87%E5%B0%8E%E5%90%91%E7%AD%89%E5%83%B9%E5%88%86%E5%89%B2nextdate">領域規則導向等價分割：NextDate()</h2>
<div class="card-deck">
<ul>
<li data-marpit-fragment="1">
<blockquote>
<p><img class="emoji" draggable="false" alt="💡" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4a1.svg" data-marp-twemoji=""/> 單純考慮數值範圍是不夠的；優質的等價劃分必須深入融入業務規則（如大小月與閏年）。</p>
</blockquote>
</li>
</ul>
<div class="two-columns">
<div class="card" data-marpit-fragment>
<h3 id="%E2%9D%8C-%E8%86%9A%E6%B7%BA%E7%9A%84%E7%B0%A1%E6%98%93%E5%88%86%E5%89%B2-%E6%95%88%E8%83%BD%E6%A5%B5%E4%BD%8E"><img class="emoji" draggable="false" alt="❌" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/274c.svg" data-marp-twemoji=""/> 膚淺的簡易分割 (效能極低)</h3>
<ul>
<li><strong>Month</strong>：&lt;1, 1 ~ 12, &gt;12 (3 類)</li>
<li><strong>Day</strong>：&lt;1, 1 ~ 31, &gt;31 (3 類)</li>
<li><strong>Year</strong>：&lt;1812, 1812 ~ 2024, &gt;2024 (3 類)</li>
<li><strong>致命盲點</strong>：
<ul>
<li>4/31 根本不存在！2/29 只有閏年合法！</li>
<li>盲目數值劃分無法捕捉 2 月與大小月的核心業務跳日邏輯。</li>
</ul>
</li>
</ul>
</div>
<div class="card" data-marpit-fragment>
<h3 id="%E2%9A%A0%EF%B8%8F-%E7%AC%AC%E4%B8%80%E7%89%88%E9%A0%98%E5%9F%9F%E5%8A%83%E5%88%86-%E5%88%9D%E6%AD%A5%E5%98%97%E8%A9%A6"><img class="emoji" draggable="false" alt="⚠️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/26a0.svg" data-marp-twemoji=""/> 第一版領域劃分 (初步嘗試)</h3>
<ul>
<li><strong>月份 (M)</strong>：
<ul>
<li>M_1: 30 天月 (4, 6, 9, 11)</li>
<li>M_2: 31 天月 (1, 3, 5, 7, 8, 10, 12)</li>
<li>M_3: 二月 (特殊處理)</li>
</ul>
</li>
<li><strong>日期 (D)</strong>：
<ul>
<li>D_1: 1 ~ 27, D_2: 28, D_3: 29, D_4: 30, D_5: 31</li>
</ul>
</li>
<li><strong>年份 (Y)</strong>：
<ul>
<li>Y_1: 閏年 (4 整除且非百/或400整除), Y_2: 平年</li>
</ul>
</li>
</ul>
</div>
</div>
</div>
<footer>Ch05 黑箱測試</footer>
</section>

<header>5.4 等價類分割測試 (EP)</header>

<h2 id="nextdate-%E5%88%9D%E6%AD%A5%E6%B8%AC%E8%A9%A6%E9%A9%9A%E8%A6%8B12-%E6%9C%88%E8%B7%A8%E5%B9%B4%E7%95%B0%E5%B8%B8">NextDate() 初步測試：驚見「12 月跨年異常」</h2>
<div class="card-deck">
<blockquote>
<p><img class="emoji" draggable="false" alt="💡" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4a1.svg" data-marp-twemoji=""/> 當我們為第一版 M_2 (31天月) 挑選代表值時，隱藏的跨年致命漏洞浮出水面！</p>
</blockquote>
<div class="two-columns">
<div class="card" data-marpit-fragment>
<h3 id="%F0%9F%93%8B-%E7%AC%AC%E4%B8%80%E7%89%88%E5%BC%B1%E6%B6%B5%E8%93%8B%E9%81%B8%E5%8F%96%E4%BB%A3%E8%A1%A8%E6%A1%88%E4%BE%8B"><img class="emoji" draggable="false" alt="📋" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4cb.svg" data-marp-twemoji=""/> 第一版弱涵蓋選取代表案例</h3>
<table>
<thead>
<tr>
<th style="text-align:center">案例</th>
<th style="text-align:left">輸入 (Y, M, D)</th>
<th style="text-align:left">預期輸出</th>
<th style="text-align:left">涵蓋類別與說明</th>
</tr>
</thead>
<tbody>
<tr>
<td style="text-align:center"><strong>T_1</strong></td>
<td style="text-align:left"><code>2024/04/30</code></td>
<td style="text-align:left"><code>2024/05/01</code></td>
<td style="text-align:left">M_1 × D_4 (30 天月月底跳月，年不變)</td>
</tr>
<tr>
<td style="text-align:center"><strong>T_2</strong></td>
<td style="text-align:left"><code>2024/07/31</code></td>
<td style="text-align:left"><code>2024/08/01</code></td>
<td style="text-align:left">M_2 × D_5 (31 天月月底跳月，年不變)</td>
</tr>
<tr>
<td style="text-align:center"><strong>T_3</strong></td>
<td style="text-align:left"><code>2024/02/28</code></td>
<td style="text-align:left"><code>2024/02/29</code></td>
<td style="text-align:left">M_3 × D_2 × Y_1 (閏年 2 月進 29 日)</td>
</tr>
<tr>
<td style="text-align:center"><strong>T_4</strong></td>
<td style="text-align:left"><code>2023/02/28</code></td>
<td style="text-align:left"><code>2023/03/01</code></td>
<td style="text-align:left">M_3 × D_2 × Y_2 (平年 2 月跳 3/1)</td>
</tr>
</tbody>
</table>
<ul>
<li><strong>盲區曝光</strong>：若測試員挑選 T_2 (7/31)，M_2 就算完成覆蓋；但 <strong>12 月底 (12/31) 的跨年</strong> 就被徹底漏測！</li>
</ul>
</div>
<div class="card" data-marpit-fragment>
<h3 id="%F0%9F%92%A5-12-%E6%9C%88%E5%BA%95%E7%9A%84%E7%89%B9%E6%AE%8A%E6%80%A7-december-anomaly"><img class="emoji" draggable="false" alt="💥" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4a5.svg" data-marp-twemoji=""/> 12 月底的特殊性 (December Anomaly)</h3>
<ul>
<li><strong>一般 31 天月月底 (1, 3, 5, 7, 8, 10 月)</strong>：
<ul>
<li><code>Day = 1</code>, <code>Month = Month + 1</code>, <strong><code>Year 不變</code></strong>！</li>
</ul>
</li>
<li><strong>12 月底 (12/31) 獨特跨年邏輯</strong>：
<ul>
<li><code>Day = 1</code>, <strong><code>Month = 1 (重置)</code></strong>, <strong><code>Year = Year + 1 (跨年)</code></strong>！</li>
</ul>
</li>
<li><strong>等價性破滅 (Equivalence Broken)</strong>：
<ul>
<li>12 月與其他 31 天月在程式行為上<strong>根本不等價</strong>！</li>
<li>若混在同一個等價類，一旦選中 7/31，跨年 Year+1 的核心邏輯就會被<strong>完全漏測</strong>！</li>
</ul>
</li>
</ul>
</div>
</div>
</div>
<footer>Ch05 黑箱測試</footer>
</section>

<header>5.4 等價類分割測試 (EP)</header>

<h2 id="%E8%BF%AD%E4%BB%A3%E4%BF%AE%E6%AD%A3%E9%87%8D%E6%A7%8B-nextdate-%E7%AD%89%E5%83%B9%E9%A1%9E%E5%8A%83%E5%88%86">迭代修正：重構 NextDate() 等價類劃分</h2>
<div class="card-deck">
<blockquote>
<p><img class="emoji" draggable="false" alt="💡" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4a1.svg" data-marp-twemoji=""/> 等價類分割黃金法則：<strong>只有後續處理邏輯與狀態轉移完全同構的群組，才能被視為同一等價類！</strong></p>
</blockquote>
<div class="two-columns">
<div class="card" data-marpit-fragment>
<h3 id="%F0%9F%94%84-%E6%9C%88%E4%BB%BD%E7%AD%89%E5%83%B9%E9%A1%9E%E6%BC%94%E9%80%B2%E5%B0%8D%E6%AF%94"><img class="emoji" draggable="false" alt="🔄" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f504.svg" data-marp-twemoji=""/> 月份等價類演進對比</h3>
<ul>
<li><strong>第一版 (未考慮跨年，存在盲區)</strong>：
<ul>
<li>M_1: 30 天月 (4, 6, 9, 11)</li>
<li>M_2: 31 天月 (1, 3, 5, 7, 8, 10, 12) <img class="emoji" draggable="false" alt="❌" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/274c.svg" data-marp-twemoji=""/> <em>(12月混入)</em></li>
<li>M_3: 二月 (特殊處理)</li>
</ul>
</li>
<li><strong>第二版 (獨立 12 月跨年類別)</strong>：
<ul>
<li><strong>M_1</strong>: 30 天月 (4, 6, 9, 11) —— 換月不跨年</li>
<li><strong>M_2</strong>: 非 12 月之 31 天月 (1, 3, 5, 7, 8, 10) —— 換月不跨年</li>
<li><strong>M_4</strong>: <strong>十二月 (12) —— 獨佔跨年業務邏輯！</strong> <img class="emoji" draggable="false" alt="✅" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/2705.svg" data-marp-twemoji=""/></li>
<li><strong>M_3</strong>: 二月 (2) —— 閏平年跳動</li>
</ul>
</li>
</ul>
</div>
<div class="card" data-marpit-fragment>
<h3 id="%F0%9F%8E%AF-%E8%BB%9F%E9%AB%94%E5%B7%A5%E7%A8%8B%E6%B7%B1%E5%88%BB%E5%95%9F%E7%A4%BA"><img class="emoji" draggable="false" alt="🎯" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f3af.svg" data-marp-twemoji=""/> 軟體工程深刻啟示</h3>
<ul>
<li><strong>等價分割不是「生活日曆常識分類」</strong>：
<ul>
<li>日曆常識上 12 月確實是 31 天月；</li>
<li>但軟體工程上，<strong>程式碼控制流程相異就是不同等價類</strong>！</li>
</ul>
</li>
<li><strong>測試設計反向修補需求漏洞</strong>：
<ul>
<li>為等價類設計具體測試資料時，能反向逼迫團隊發現被遺漏的業務邊界（如跨年、跨世紀、千禧蟲 Y2K）。</li>
<li>將 12 月獨立為 M_4 後，<strong>測試案例集強迫必須包含跨年測試案例</strong>！</li>
</ul>
</li>
</ul>
</div>
</div>
</div>
<footer>Ch05 黑箱測試</footer>
</section>

<header>5.4 等價類分割測試 (EP)</header>

<h2 id="%E5%AF%A6%E5%8B%99%E9%97%9C%E9%8D%B5%E6%B3%95%E5%89%87%E5%96%AE%E4%B8%80%E7%84%A1%E6%95%88%E5%8E%9F%E5%89%87%E8%88%87%E9%8C%AF%E8%AA%A4%E9%81%AE%E8%94%BD-fault-masking">實務關鍵法則：單一無效原則與錯誤遮蔽 (Fault Masking)</h2>
<div class="card-deck">
<blockquote>
<p><img class="emoji" draggable="false" alt="💡" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4a1.svg" data-marp-twemoji=""/> 設計無效等價類測試案例時的鐵律：<strong>每次測試只允許包含一個無效等價類，其餘欄位必須全部合法！</strong></p>
</blockquote>
<div class="two-columns">
<div class="card" data-marpit-fragment>
<h3 id="%F0%9F%8E%AD-%E7%82%BA%E4%BB%80%E9%BA%BC%E7%A6%81%E6%AD%A2%E5%A4%9A%E5%80%8B%E7%84%A1%E6%95%88%E5%80%BC%E5%90%8C%E6%99%82%E8%BC%B8%E5%85%A5"><img class="emoji" draggable="false" alt="🎭" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f3ad.svg" data-marp-twemoji=""/> 為什麼禁止多個無效值同時輸入？</h3>
<ul>
<li><strong>錯誤遮蔽效應 (Fault Masking Effect)</strong>：
<ul>
<li>現代軟體通常採取「防禦性早退 (Early Exit)」或短路評估。</li>
<li>當系統遇到第一個非法欄位時，往往立即中斷執行或拋出例外，不再檢查後續欄位。</li>
</ul>
</li>
<li><strong>後果：缺陷被遮蔽隱藏</strong>：
<ul>
<li>若「密碼過短」與「信箱格式錯誤」同時輸入，程式在檢查密碼時拋錯中斷，後面的「信箱驗證 Bug」就永遠無法被觸發！</li>
</ul>
</li>
</ul>
</div>
<div class="card" data-marpit-fragment>
<h3 id="%F0%9F%93%90-%E6%9C%89%E6%95%88%E9%A1%9E-vs-%E7%84%A1%E6%95%88%E9%A1%9E%E6%B8%AC%E8%A9%A6%E7%AD%96%E7%95%A5%E5%B0%8D%E6%AF%94"><img class="emoji" draggable="false" alt="📐" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4d0.svg" data-marp-twemoji=""/> 有效類 vs. 無效類測試策略對比</h3>
<ul>
<li><strong>有效等價類 (Valid Classes) —— 盡量合併</strong>：
<ul>
<li>目標是驗證系統的正常運作路徑。</li>
<li>每個測試案例應盡可能<strong>涵蓋多個尚未測試的有效等價類</strong>，以最小案例數獲得最高覆蓋。</li>
</ul>
</li>
<li><strong>無效等價類 (Invalid Classes) —— 嚴格隔離</strong>：
<ul>
<li>目標是驗證各別錯誤防護與例外處理邏輯。</li>
<li>每個測試案例<strong>只能包含一個無效等價類</strong>，其餘輸入條件一律設為已知合法值（單一缺陷原則）。</li>
</ul>
</li>
</ul>
</div>
</div>
</div>
<footer>Ch05 黑箱測試</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="34" data-paginate="true" data-header="5.4 等價類分割測試 (EP)" data-footer="Ch05 黑箱測試" data-theme="sqa-theme" lang="C" data-marpit-pagination="34" style="--paginate:true;--header:5.4 等價類分割測試 (EP);--footer:Ch05 黑箱測試;--theme:sqa-theme;" data-marpit-pagination-total="88">
<header>5.4 等價類分割測試 (EP)</header>

<h2 id="ep-%E8%88%87-bva-%E6%95%B4%E5%90%88%E8%A6%8F%E5%8A%83%E9%82%8A%E7%95%8C%E4%B8%8D%E6%98%AF%E7%8D%A8%E7%AB%8B-partition">EP 與 BVA 整合規劃：邊界不是獨立 Partition</h2>
<div class="card-deck">
<blockquote>
<p><img class="emoji" draggable="false" alt="💡" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4a1.svg" data-marp-twemoji=""/> 測試架構迷思破解：BVA 不是獨立於 EP 之外的測試，而是「等價類在取樣時的邊界特化策略」。</p>
</blockquote>
<div class="two-columns">
<div class="card" data-marpit-fragment>
<h3 id="%F0%9F%A7%AD-%E8%A7%80%E5%BF%B5%E9%87%90%E6%B8%85%E9%82%8A%E7%95%8C%E7%B5%95%E9%9D%9E%E7%8D%A8%E7%AB%8B-partition"><img class="emoji" draggable="false" alt="🧭" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f9ed.svg" data-marp-twemoji=""/> 觀念釐清：邊界絕非獨立 Partition</h3>
<ul>
<li><strong>等價類 (Partition) 的嚴格定義</strong>：
<ul>
<li>代表「<strong>具相同商務語意與系統處理邏輯的集合</strong>」（例如：0 ≤ score ≤ 100 是合法成績）。</li>
</ul>
</li>
<li><strong>邊界的幾何本質</strong>：
<ul>
<li>邊界（0 與 100）只是等價類集合的「幾何邊緣」，並非另一種業務狀態，<strong>絕不可單獨切成獨立 Partition</strong>。</li>
</ul>
</li>
<li><strong>為什麼要在邊界取樣？</strong>
<ul>
<li>等價假設在邊界容易失效（工程師最常犯 <code>&lt;=</code> 誤寫成 <code>&lt;</code> 的 Off-by-one 符號錯誤）。</li>
<li>BVA 的本質是<strong>取代 EP 在區間內隨機抓值的盲目性</strong>！</li>
</ul>
</li>
</ul>
</div>
<div class="card" data-marpit-fragment>
<h3 id="%F0%9F%9B%A0%EF%B8%8F-%E5%85%A9%E8%80%85%E5%90%88%E9%AB%94%E8%A6%8F%E5%8A%83%E4%B8%89%E6%AD%A5-sop-%E6%8B%92%E7%B5%95%E9%87%8D%E8%A4%87"><img class="emoji" draggable="false" alt="🛠️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f6e0.svg" data-marp-twemoji=""/> 兩者合體規劃三步 SOP (拒絕重複)</h3>
<ul>
<li><strong>Step 1: 劃分等價類 (EP)</strong>：
<ul>
<li>依業務規格完整識別有效類（Valid）與無效類（Invalid）。</li>
</ul>
</li>
<li><strong>Step 2: 標記交接邊界 (Boundaries)</strong>：
<ul>
<li>找出相鄰等價類的交接處（如 0, 100）。</li>
</ul>
</li>
<li><strong>Step 3: 統一精準取點 (Integrated Sampling)</strong>：
<ul>
<li>每個連續等價類<strong>僅取兩類點</strong>，合而為一：
<ol>
<li><strong>邊界極值 (BVA On/Off-Points)</strong>：如 -1, 0, 100, 101（攔截運算子漏洞）。</li>
<li><strong>標稱典型值 (EP Nominal Point)</strong>：如 50（驗證常規核心業務路徑）。</li>
</ol>
</li>
<li><strong>綜效</strong>：以最少案例<strong>同時 100% 滿足 EP 與 BVA</strong>！</li>
</ul>
</li>
</ul>
</div>
</div>
</div>
<footer>Ch05 黑箱測試</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="35" data-paginate="true" data-header="5.4 等價類分割測試 (EP)" data-footer="Ch05 黑箱測試" data-theme="sqa-theme" lang="C" data-marpit-pagination="35" style="--paginate:true;--header:5.4 等價類分割測試 (EP);--footer:Ch05 黑箱測試;--theme:sqa-theme;" data-marpit-pagination-total="88">
<header>5.4 等價類分割測試 (EP)</header>

<h2 id="%E7%AD%89%E5%83%B9%E9%A1%9E%E5%88%86%E5%89%B2%E6%B8%AC%E8%A9%A6-ep-%E5%B8%B8%E8%A6%8B%E5%95%8F%E7%AD%94-faq">等價類分割測試 (EP) 常見問答 (FAQ)</h2>
<div class="card-deck">
<blockquote>
<p><img class="emoji" draggable="false" alt="💡" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4a1.svg" data-marp-twemoji=""/> 組合維度與涵蓋策略疑難：在測試成本與品質風險之間取得最佳平衡。</p>
</blockquote>
<div class="two-columns">
<div class="card" data-marpit-fragment>
<h3 id="%E2%9D%93-q1-%E4%BB%80%E9%BA%BC%E6%99%82%E5%80%99%E6%8E%A1%E7%94%A8%E5%BC%B1%E6%B6%B5%E8%93%8B%E4%BB%80%E9%BA%BC%E6%99%82%E5%80%99%E5%BF%85%E9%A0%88%E5%8D%87%E7%B4%9A%E7%82%BA%E5%BC%B7%E6%B6%B5%E8%93%8B"><img class="emoji" draggable="false" alt="❓" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/2753.svg" data-marp-twemoji=""/> Q1: 什麼時候採用弱涵蓋？什麼時候必須升級為強涵蓋？</h3>
<ul>
<li><strong>弱涵蓋 (Weak Coverage)</strong>：
<ul>
<li>適用於<strong>輸入參數彼此完全獨立</strong>的場景（如註冊表單中的暱稱、生日、血型）；</li>
<li>案例數少，能以最低成本確保每個等價類都被測試一次。</li>
</ul>
</li>
<li><strong>強涵蓋 (Strong Coverage) / 全成對 (Pairwise)</strong>：
<ul>
<li>適用於<strong>參數間存在緊密商務交互制約</strong>（如保險費率乘數、折扣與年資、貸款審核）；</li>
<li>若參數過多導致強涵蓋全乘積爆炸，直接升級為 <strong>5.4 全成對測試 (Pairwise)</strong> 是業界最佳解！</li>
</ul>
</li>
</ul>
</div>
<div class="card" data-marpit-fragment>
<h3 id="%E2%9D%93-q2-%E5%8F%AF%E4%BB%A5%E9%83%A8%E5%88%86%E8%AE%8A%E6%95%B8%E7%94%A8%E5%BC%B7%E6%B6%B5%E8%93%8B%E9%83%A8%E5%88%86%E8%AE%8A%E6%95%B8%E7%94%A8%E5%BC%B1%E6%B6%B5%E8%93%8B%E5%97%8E"><img class="emoji" draggable="false" alt="❓" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/2753.svg" data-marp-twemoji=""/> Q2: 可以部分變數用強涵蓋，部分變數用弱涵蓋嗎？</h3>
<ul>
<li><strong>實務主流：混合式涵蓋策略 (Hybrid Coverage)</strong>：
<ul>
<li><strong>完全可以，且高度推薦</strong>！全域強涵蓋會引發組合爆炸，全域弱涵蓋又會漏測關鍵耦合缺陷。</li>
</ul>
</li>
<li><strong>風險驅動的工程配置</strong>：
<ul>
<li><strong>局部強涵蓋</strong>：針對有強烈商務制約的 2~3 個核心變數（如年限 × 信用等級 × 青年）進行全乘積。</li>
<li><strong>局部弱涵蓋</strong>：針對其餘無耦合的周邊變數（如性別、聯絡方式），僅確保其各類別代表至少被選中一次填入。</li>
</ul>
</li>
<li><strong>更高階解法</strong>：直接運用 <strong>5.4 Pairwise</strong> 工具求解。</li>
</ul>
</div>
</div>
</div>
<footer>Ch05 黑箱測試</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="36" data-paginate="true" data-header="5.4 等價類分割測試 (EP)" data-footer="Ch05 黑箱測試" data-theme="sqa-theme" lang="C" data-marpit-pagination="36" style="--paginate:true;--header:5.4 等價類分割測試 (EP);--footer:Ch05 黑箱測試;--theme:sqa-theme;" data-marpit-pagination-total="88">
<header>5.4 等價類分割測試 (EP)</header>

<h2 id="%E7%AD%89%E5%83%B9%E9%A1%9E%E5%88%86%E5%89%B2%E7%9A%84-junit-5-%E8%90%BD%E5%9C%B0%E4%BE%8B%E5%A4%96%E9%98%B2%E7%A6%A6%E8%88%87-csv-%E8%B3%87%E6%96%99%E9%A9%85%E5%8B%95">等價類分割的 JUnit 5 落地：例外防禦與 CSV 資料驅動</h2>
<div class="card-deck">
<blockquote>
<p><img class="emoji" draggable="false" alt="💡" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4a1.svg" data-marp-twemoji=""/> 等價類測試的工程挑戰：無效等價類的外顯行為是「防禦防護」，有效等價類則需要管理多維度測試表格。</p>
</blockquote>
<div class="two-columns">
<div class="card" data-marpit-fragment>
<h3 id="%F0%9F%9A%A8-%E7%84%A1%E6%95%88%E7%AD%89%E5%83%B9%E9%A1%9E%E4%BE%8B%E5%A4%96%E6%96%B7%E8%A8%80-assertthrows"><img class="emoji" draggable="false" alt="🚨" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f6a8.svg" data-marp-twemoji=""/> 無效等價類：例外斷言 (<code>assertThrows</code>)</h3>
<ul>
<li><strong>單一無效原則之落實</strong>：
<ul>
<li>非法輸入（如負數邊長、空字串、超出規格之帳號長度）不得回傳正常值，而應觸發防禦性例外。</li>
</ul>
</li>
<li><strong>JUnit 5 解決方案 (assertThrows)</strong>：
<ul>
<li>驗證特定輸入是否精確拋出指定的異常類別（如 <code>IllegalArgumentException.class</code>）；</li>
<li>可進一步驗證錯誤訊息（<code>getMessage()</code>），確保防禦邏輯不僅攔截錯誤，還提供了清晰的除錯指引，杜絕系統假死或默默吃掉例外！</li>
</ul>
</li>
</ul>
</div>
<div class="card" data-marpit-fragment>
<h3 id="%F0%9F%93%8A-%E6%9C%89%E6%95%88%E7%AD%89%E5%83%B9%E9%A1%9E%E5%A4%96%E9%83%A8%E8%B3%87%E6%96%99%E9%A9%85%E5%8B%95-csvfilesource"><img class="emoji" draggable="false" alt="📊" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4ca.svg" data-marp-twemoji=""/> 有效等價類：外部資料驅動 (<code>@CsvFileSource</code>)</h3>
<ul>
<li><strong>測試邏輯與數據分離</strong>：
<ul>
<li>當等價分割劃分出大量測試向量（正等價類、零值等價類、各級距代表值），將測資硬編碼在程式中會導致代碼臃腫且難以維護。</li>
</ul>
</li>
<li><strong>JUnit 5 解決方案 (CsvSource / CsvFileSource)</strong>：
<ul>
<li>將等價類代表值與預期分類標籤外置於 CSV 檔案（如 LabDemo <code>ParamDemoTest</code>）；</li>
<li>測試方法只需撰寫一套通用驗證流程，外部資料表可由測試工程師或業務分析師隨規格靈活擴充！</li>
</ul>
</li>
</ul>
</div>
</div>
</div>
<footer>Ch05 黑箱測試</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="37" data-paginate="true" data-header="5.4 等價類分割測試 (EP)" data-footer="Ch05 黑箱測試" data-theme="sqa-theme" lang="C" data-marpit-pagination="37" style="--paginate:true;--header:5.4 等價類分割測試 (EP);--footer:Ch05 黑箱測試;--theme:sqa-theme;" data-marpit-pagination-total="88">
<header>5.4 等價類分割測試 (EP)</header>

<h2 id="%E6%A6%82%E5%BF%B5%E6%A0%B8%E5%B0%8D%E5%95%8F%E7%AD%94-ccq-3">概念核對問答 (CCQ 3)</h2>
<div class="ccq-columns">
<div class="ccq-text">

<p><strong>問題情境</strong>：<br />
【單選題】在等價類分割測試 (Equivalence Partitioning) 中，「弱涵蓋 (Weak Coverage)」與「強涵蓋 (Strong Coverage)」分類法的主要區別是什麼？</p>
<ul>
<li><strong>A)</strong> 弱涵蓋只測試有效等價類，強涵蓋兼測有效與無效等價類</li>
<li><strong>B)</strong> 弱涵蓋基於單一錯誤假設，強涵蓋測試所有類別笛卡爾全組合</li>
<li><strong>C)</strong> 弱涵蓋不需軟體規格文件，強涵蓋必須嚴格遵照 SRS 文件執行</li>
<li><strong>D)</strong> 弱涵蓋產生的案例數較多，強涵蓋產生的測試案例數必然較少</li>
</ul>
</div>
<div class="ccq-logo">
<p><a href="https://nlhsueh.github.io/nickedupocket/#/student/sqa-ch05-ccq3" target="_blank"><img src="../../img/ch05/sqa-ch05-ccq3.png" alt="QR Code" /></a></p>
</div>
</div>
<footer>Ch05 黑箱測試</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="38" data-paginate="true" data-header="5.4 等價類分割測試 (EP)" data-footer="Ch05 黑箱測試" data-theme="sqa-theme" lang="C" data-marpit-pagination="38" style="--paginate:true;--header:5.4 等價類分割測試 (EP);--footer:Ch05 黑箱測試;--theme:sqa-theme;" data-marpit-pagination-total="88">
<header>5.4 等價類分割測試 (EP)</header>

<h2 id="%F0%9F%A7%AA-%E8%AA%B2%E5%A0%82%E5%AF%A6%E7%BF%92%E6%8C%87%E5%BC%95-labdemo-54-ep-%E7%AD%89%E5%83%B9%E9%A1%9E%E5%AF%A6%E6%88%B0"><img class="emoji" draggable="false" alt="🧪" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f9ea.svg" data-marp-twemoji=""/> 課堂實習指引 (LabDemo 5.4: EP 等價類實戰)</h2>
<div class="card-deck">
<blockquote>
<p><img class="emoji" draggable="false" alt="💡" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4a1.svg" data-marp-twemoji=""/> 等價類實戰重點：使用 @CsvSource 建立多維度測試表格，以 assertThrows 驗證非法輸入的防禦性邏輯。</p>
</blockquote>
<div class="two-columns">
<div class="card">
<h3 id="%F0%9F%92%BB-%E9%AB%94%E9%A9%97%E7%AF%84%E4%BE%8B%E7%A8%8B%E5%BC%8F%E7%A2%BC-demo-walkthrough-2"><img class="emoji" draggable="false" alt="💻" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4bb.svg" data-marp-twemoji=""/> 體驗範例程式碼 (Demo Walkthrough)</h3>
<ul>
<li><strong>1. 二元搜尋多維等價分割</strong>：
<ul>
<li>開啟 <code>u05_input/ep/BinarySearchEpDemoTest.java</code></li>

<h1 id="55-%E5%85%A8%E6%88%90%E5%B0%8D%E7%B5%84%E5%90%88%E6%B8%AC%E8%A9%A6-pairwise"><strong>5.5 全成對組合測試 (Pairwise)</strong></h1>
<blockquote>
<p>「當組合爆炸讓窮盡測試成為不可能，<br />
全成對測試用數學奇蹟，抓出 90% 的交互作用缺陷。」</p>
</blockquote>
<footer>Ch05 黑箱測試</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="40" data-marpit-fragments="1" data-paginate="true" data-header="5.5 全成對組合測試 (Pairwise)" data-footer="Ch05 黑箱測試" data-theme="sqa-theme" lang="C" data-marpit-pagination="40" style="--paginate:true;--header:5.5 全成對組合測試 (Pairwise);--footer:Ch05 黑箱測試;--theme:sqa-theme;" data-marpit-pagination-total="88">
<header>5.5 全成對組合測試 (Pairwise)</header>

<h2 id="%E7%B5%84%E5%90%88%E7%88%86%E7%82%B8%E9%9B%A3%E9%A1%8C%E8%88%87-2-way-%E4%BA%A4%E4%BA%92%E4%BD%9C%E7%94%A8%E7%90%86%E8%AB%96">組合爆炸難題與 2-Way 交互作用理論</h2>
<div class="card-deck">
<ul>
<li data-marpit-fragment="1">
<blockquote>
<p><img class="emoji" draggable="false" alt="💡" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4a1.svg" data-marp-twemoji=""/> 美國國家標準與技術研究院 (NIST) 研究：軟體系統中絕大多數缺陷皆由「單一變數」或「雙變數配對」所觸發。</p>
</blockquote>
</li>
</ul>
<div class="two-columns">
<div class="card" data-marpit-fragment>
<h3 id="%F0%9F%92%A5-%E7%B5%84%E5%90%88%E7%88%86%E7%82%B8%E7%9A%84%E6%AE%98%E9%85%B7%E7%8F%BE%E5%AF%A6"><img class="emoji" draggable="false" alt="💥" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4a5.svg" data-marp-twemoji=""/> 組合爆炸的殘酷現實</h3>
<ul>
<li><strong>多參數系統的災難</strong>：
<ul>
<li>假設系統有 10 個參數，每個參數各有 3 種可能值。</li>
<li>全乘積窮盡測試需要：
<blockquote>
<p><img class="emoji" draggable="false" alt="📐" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4d0.svg" data-marp-twemoji=""/> <strong>3^10 = <strong>59,049</strong> 個測試案例！</strong></p>
</blockquote>
</li>
<li>在工程實務上，根本沒有足夠的時間與預算執行窮盡測試。</li>
</ul>
</li>
</ul>
</div>
<div class="card" data-marpit-fragment>
<h3 id="%F0%9F%8E%AF-nist-%E5%AF%A6%E8%AD%89%E7%B6%93%E9%A9%97%E8%88%87%E6%88%90%E5%B0%8D%E5%81%87%E8%A8%AD"><img class="emoji" draggable="false" alt="🎯" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f3af.svg" data-marp-twemoji=""/> NIST 實證經驗與成對假設</h3>
<ul>
<li><strong>2-Way 交互作用理論</strong>：
<ul>
<li><strong>67% ~ 93%</strong> 的缺陷只要任意 2 個參數的交互作用就會觸發。</li>
<li>需要 3 個以上參數交互觸發的罕見缺陷不足 10%。</li>
</ul>
</li>
<li><strong>Pairwise (All-Pairs) 原則</strong>：
<ul>
<li><strong>只要任意兩個參數的所有可能取值組合都至少出現過一次即可</strong>！案例數從幾萬個劇降至數十個！</li>
</ul>
</li>
</ul>
</div>
</div>
</div>
<footer>Ch05 黑箱測試</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="41" data-marpit-fragments="1" data-paginate="true" data-header="5.5 全成對組合測試 (Pairwise)" data-footer="Ch05 黑箱測試" data-theme="sqa-theme" lang="C" data-marpit-pagination="41" style="--paginate:true;--header:5.5 全成對組合測試 (Pairwise);--footer:Ch05 黑箱測試;--theme:sqa-theme;" data-marpit-pagination-total="88">
<header>5.5 全成對組合測試 (Pairwise)</header>

<h2 id="%E6%B8%B8%E6%B3%B3%E6%B1%A0%E6%94%B6%E8%B2%BB%E7%B3%BB%E7%B5%B1%E5%85%A8%E6%88%90%E5%B0%8D%E5%AF%A6%E6%88%B0%E5%B0%8D%E7%85%A7">游泳池收費系統：全成對實戰對照</h2>
<div class="card-deck">
<ul>
<li data-marpit-fragment="1">
<blockquote>
<p><img class="emoji" draggable="false" alt="💡" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4a1.svg" data-marp-twemoji=""/> 透過交錯法與成對匹配，案例數量從全乘積的 12 個直接砍半至 6 個，覆蓋率絲毫不減。</p>
</blockquote>

<div class="two-columns">
<div class="card" data-marpit-fragment>
<h3 id="%F0%9F%8F%8A-%E5%8F%83%E6%95%B8%E7%B6%AD%E5%BA%A6%E5%AE%9A%E7%BE%A9"><img class="emoji" draggable="false" alt="🏊" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f3ca.svg" data-marp-twemoji=""/> 參數維度定義</h3>
<ul>
<li><strong>日期 (d, 2 種)</strong>：d_1 假日, d_2 平日</li>
<li><strong>時間 (t, 3 種)</strong>：t_1 清晨, t_2 中午, t_3 其他</li>
<li><strong>身分 (m, 2 種)</strong>：m_1 會員, m_2 非會員</li>
<li><strong>全乘積需求</strong>：2 × 3 × 2 = 12 個案例。</li>
</ul>
</div>
<div class="card" data-marpit-fragment>
<h3 id="%E2%9C%85-%E5%85%A8%E6%88%90%E5%B0%8D%E6%B8%AC%E8%A9%A6%E5%A5%97%E4%BB%B6-6-%E5%80%8B%E6%A1%88%E4%BE%8B"><img class="emoji" draggable="false" alt="✅" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/2705.svg" data-marp-twemoji=""/> 全成對測試套件 (6 個案例)</h3>

</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="42" data-paginate="true" data-header="5.5 全成對組合測試 (Pairwise)" data-footer="Ch05 黑箱測試" data-theme="sqa-theme" lang="C" data-marpit-pagination="42" style="--paginate:true;--header:5.5 全成對組合測試 (Pairwise);--footer:Ch05 黑箱測試;--theme:sqa-theme;" data-marpit-pagination-total="88">
<header>5.5 全成對組合測試 (Pairwise)</header>

<h2 id="%E7%82%BA%E4%BB%80%E9%BA%BC%E6%9C%80%E5%B0%8F%E6%88%90%E5%B0%8D%E6%B8%AC%E8%A9%A6%E9%9B%86%E6%98%AF-np-hard%E5%95%9F%E7%99%BC%E5%BC%8F%E7%94%9F%E6%88%90%E6%BC%94%E7%AE%97%E6%B3%95">為什麼最小成對測試集是 NP-Hard？啟發式生成演算法</h2>
<div class="card-deck">
<blockquote>
<p><img class="emoji" draggable="false" alt="💡" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4a1.svg" data-marp-twemoji=""/> 尋找數學上的「絕對最小成對測試集」等價於最小集合覆蓋問題，屬 NP-Hard 難題。</p>
</blockquote>
<div class="two-columns">
<div class="card" data-marpit-fragment>
<h3 id="%F0%9F%93%90-%E6%95%B8%E5%AD%B8%E6%9C%AC%E8%B3%AA%E6%9C%80%E5%B0%8F%E9%9B%86%E5%90%88%E8%A6%86%E8%93%8B-set-cover"><img class="emoji" draggable="false" alt="📐" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4d0.svg" data-marp-twemoji=""/> 數學本質：最小集合覆蓋 (Set Cover)</h3>
<ul>
<li><strong>問題歸約</strong>：
<ul>
<li>系統中有 k 個參數，全成對測試需涵蓋全部 ∑ (|V_i| × |V_j|) 個成對組合 (Pairs)。</li>
<li>每個測試案例最多能覆蓋 binom{k}{2} 個特定 Pair。</li>
<li><strong>尋找最少測試案例以覆蓋所有成對組合</strong>，在計算理論上等價於經典的 <strong>NP-Complete 最小集合覆蓋問題</strong>。</li>
</ul>
</li>
<li><strong>指數級計算爆炸</strong>：
<ul>
<li>隨參數與取值增加，窮舉搜尋全域絕對最佳解耗時天文數字，在工程實務上毫無效益。</li>
</ul>
</li>
</ul>
</div>
<div class="card" data-marpit-fragment>
<h3 id="%E2%9A%A1-%E7%8F%BE%E4%BB%A3%E5%B7%A5%E5%85%B7%E6%B1%82%E8%A7%A3%E7%AD%96%E7%95%A5%E8%B2%AA%E5%A9%AA%E5%95%9F%E7%99%BC%E5%BC%8F-heuristics"><img class="emoji" draggable="false" alt="⚡" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/26a1.svg" data-marp-twemoji=""/> 現代工具求解策略：貪婪啟發式 (Heuristics)</h3>
<ul>
<li><strong>貪婪覆蓋 (Greedy / AETG / IPO)</strong>：
<ul>
<li>每輪生成下一個測試案例時，貪婪選取「能同時涵蓋最多尚未配對 Pairs」的參數值。</li>
<li>在<strong>多項式時間內</strong>秒級產出極度逼近理論極限的測試矩陣。</li>
</ul>
</li>
<li><strong>約束求解與剪枝 (Constraints &amp; SAT)</strong>：
<ul>
<li>實務常有業務互斥（如 <code>OS=iOS</code> 不可配 <code>Browser=IE</code>）；</li>
<li>現代工具整合 SAT/SMT 求解器即時修剪非法狀態，確保每組案例皆合法可用。</li>
</ul>
</li>
</ul>
</div>
</div>
</div>
<footer>Ch05 黑箱測試</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="43" data-paginate="true" data-header="5.5 全成對組合測試 (Pairwise)" data-footer="Ch05 黑箱測試" data-theme="sqa-theme" lang="C" data-marpit-pagination="43" style="--paginate:true;--header:5.5 全成對組合測試 (Pairwise);--footer:Ch05 黑箱測試;--theme:sqa-theme;" data-marpit-pagination-total="88">
<header>5.5 全成對組合測試 (Pairwise)</header>

<h2 id="%E5%85%A8%E6%88%90%E5%B0%8D%E6%B8%AC%E8%A9%A6%E5%B7%A5%E5%85%B7%E8%88%87%E6%94%BE%E6%AC%BE%E8%A8%88%E7%AE%97%E6%A1%88%E4%BE%8B">全成對測試工具與放款計算案例</h2>
<div class="card-deck">
<blockquote>
<p><img class="emoji" draggable="false" alt="💡" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4a1.svg" data-marp-twemoji=""/> 實務工程皆採用啟發式工具秒級生成；本課程 LabDemo 已深度整合 Java 原生 AllPairs4J。</p>
</blockquote>
<div class="content-columns">
<div class="content-text">
<h3 id="%F0%9F%9B%A0%EF%B8%8F-%E4%B8%BB%E6%B5%81%E8%87%AA%E5%8B%95%E5%8C%96%E5%B7%A5%E5%85%B7%E9%81%B8%E5%9E%8B"><img class="emoji" draggable="false" alt="🛠️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f6e0.svg" data-marp-twemoji=""/> 主流自動化工具選型</h3>
<ul>
<li><strong>AllPairs4J (Java / JUnit 5 原生)</strong>：★ <em>LabDemo 首選</em>
<ul>
<li>純 Java 輕量庫，以 Fluent Builder API 直接在單元測試 <code>@TestFactory</code> 動態生成並執行測試矩陣！</li>
</ul>
</li>
<li><strong>PICT (微軟開源工具)</strong>：
<ul>
<li>業界最普及的 CLI 工具，支援自訂語法模型檔 (<code>.pict</code>)、條件約束與權重。</li>
</ul>
</li>
<li><strong>ACTS (NIST 開源工具)</strong>：
<ul>
<li>Java 原生 GUI/CLI 工具，支援高階 t-way 組合（如 3-way, 4-way）。</li>
</ul>
</li>
<li><strong>放款利率案例 (LoanCalculator)</strong>：
<ul>
<li>4 個維度全乘積需 3 × 3 × 2 × 2 = 36 組；</li>
<li>透過 AllPairs4J <strong>僅需 9 組成對案例</strong>即達成 100% 2-way 覆蓋！</li>
</ul>
</li>
</ul>
</div>
<div class="content-figure">
<p><img src="../../img/ch05/loan_calculator.jpg" alt="Loan Calculator" /></p>
</div>
</div>
</div>
<footer>Ch05 黑箱測試</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="44" data-paginate="true" data-header="5.5 全成對組合測試 (Pairwise)" data-footer="Ch05 黑箱測試" data-theme="sqa-theme" lang="C" data-marpit-pagination="44" style="--paginate:true;--header:5.5 全成對組合測試 (Pairwise);--footer:Ch05 黑箱測試;--theme:sqa-theme;" data-marpit-pagination-total="88">
<header>5.5 全成對組合測試 (Pairwise)</header>

<h2 id="%E5%85%A8%E6%88%90%E5%B0%8D%E6%B8%AC%E8%A9%A6%E7%9A%84-junit-5-%E8%90%BD%E5%9C%B0%E5%8B%95%E6%85%8B%E6%B8%AC%E8%A9%A6%E5%B7%A5%E5%BB%A0-testfactory">全成對測試的 JUnit 5 落地：動態測試工廠 (@TestFactory)</h2>
<div class="card-deck">
<blockquote>
<p><img class="emoji" draggable="false" alt="💡" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4a1.svg" data-marp-twemoji=""/> 成對測試的工程挑戰：案例矩陣是由演算法在執行期動態產生的，傳統靜態 <code>@Test</code> 無法彈性接收！</p>
</blockquote>
<div class="two-columns">
<div class="card" data-marpit-fragment>
<h3 id="%E2%9A%99%EF%B8%8F-%E5%8B%95%E6%85%8B%E6%B8%AC%E8%A9%A6%E5%B7%A5%E5%BB%A0%E6%A9%9F%E5%88%B6-testfactory"><img class="emoji" draggable="false" alt="⚙️" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/2699.svg" data-marp-twemoji=""/> 動態測試工廠機制 (<code>@TestFactory</code>)</h3>
<ul>
<li><strong>動態案例串流生成</strong>：
<ul>
<li>一般 <code>@Test</code> 必須在編譯期寫死；但 Pairwise 案例數量會隨參數維度調整（如 36 組壓縮為 9~10 組）。</li>
</ul>
</li>
<li><strong>JUnit 5 解決方案 (DynamicTest)</strong>：
<ul>
<li>使用 <code>@TestFactory</code> 傳回動態案例串流（如 LabDemo <code>LoanCalculatorPairwiseTest</code>）；</li>
<li>測試在執行時期呼叫 AllPairs4J 生成成對矩陣，並將每一組配對結果（年限、金額、身分）封裝為一個獨立的 <code>DynamicTest</code> 節點執行！</li>
</ul>
</li>
</ul>
</div>
<div class="card" data-marpit-fragment>
<h3 id="%F0%9F%93%88-%E5%B7%A5%E7%A8%8B%E6%95%88%E7%9B%8Aide-%E8%A6%96%E8%A6%BA%E5%8C%96%E8%88%87%E7%8D%A8%E7%AB%8B%E5%9B%9E%E6%AD%B8"><img class="emoji" draggable="false" alt="📈" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4c8.svg" data-marp-twemoji=""/> 工程效益：IDE 視覺化與獨立回歸</h3>
<ul>
<li><strong>每個成對案例皆具備獨立生命週期</strong>：
<ul>
<li>在 IDE 與 CI/CD 測試樹中，每個動態案例皆有清晰的自訂標籤與獨立通過/失敗狀態。</li>
</ul>
</li>
<li><strong>精準缺陷定位 (Fault Isolation)</strong>：
<ul>
<li>若第 4 組成對組合出錯，測試報告能秒級定位是「青年身分 × 30年期」的 2-Way 交互作用產生異常，其餘成對測試繼續執行不中斷，完美落實成對測試的工程價值！</li>
</ul>
</li>
</ul>
</div>
</div>
