<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 430 460" width="430" height="460">
  <defs>
    <marker id="arr-up" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#475569"/>
    </marker>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#0284c7"/>
    </marker>
  </defs>

  <!-- Card Background -->
  <rect x="0" y="0" width="430" height="460" rx="14" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>

  <!-- Header -->
  <rect x="0" y="0" width="430" height="38" rx="14" fill="#0b3c5d"/>
  <rect x="0" y="24" width="430" height="14" fill="#0b3c5d"/>
  <text x="215" y="24" font-family="PingFang TC, Noto Sans TC, sans-serif" font-size="13.5" font-weight="800" fill="#ffffff" text-anchor="middle">白箱涵蓋度強度階梯 (Subsumption Hierarchy)</text>

  <!-- Strength Axis on Left -->
  <line x1="28" y1="428" x2="28" y2="62" stroke="#94a3b8" stroke-width="2" marker-end="url(#arr-up)"/>
  <text x="28" y="55" font-family="PingFang TC, Noto Sans TC, sans-serif" font-size="10.5" font-weight="800" fill="#0f172a" text-anchor="middle">最強</text>
  <text x="28" y="443" font-family="PingFang TC, Noto Sans TC, sans-serif" font-size="10.5" font-weight="800" fill="#64748b" text-anchor="middle">最弱</text>

  <!-- Level 5: Path Coverage -->
  <rect x="78" y="54" width="320" height="52" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
  <text x="238" y="76" font-family="PingFang TC, Noto Sans TC, sans-serif" font-size="14" font-weight="800" fill="#5b21b6" text-anchor="middle">路徑涵蓋度 (Path Coverage)</text>
  <text x="238" y="96" font-family="PingFang TC, Noto Sans TC, sans-serif" font-size="11" font-weight="600" fill="#6d28d9" text-anchor="middle">窮舉跨決策所有路徑（含迴圈時路徑爆炸）</text>

  <!-- Arrow MCC -> Path -->
  <line x1="238" y1="130" x2="238" y2="110" stroke="#475569" stroke-width="2" marker-end="url(#arr-up)"/>

  <!-- Level 4: MCC -->
  <rect x="78" y="132" width="320" height="52" rx="10" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
  <text x="238" y="154" font-family="PingFang TC, Noto Sans TC, sans-serif" font-size="14" font-weight="800" fill="#0369a1" text-anchor="middle">多重條件組合涵蓋 (MCC)</text>
  <text x="238" y="174" font-family="Fira Code, PingFang TC, sans-serif" font-size="11" font-weight="600" fill="#0284c7" text-anchor="middle">單一決策 2ⁿ 真值表全組合</text>

  <!-- Arrow MC/DC -> MCC -->
  <line x1="238" y1="208" x2="238" y2="188" stroke="#475569" stroke-width="2" marker-end="url(#arr-up)"/>

  <!-- Level 3: MC/DC -->
  <rect x="78" y="210" width="320" height="52" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="238" y="232" font-family="PingFang TC, Noto Sans TC, sans-serif" font-size="14" font-weight="800" fill="#92400e" text-anchor="middle">航太級 MC/DC (DO-178C / ISO 26262)</text>
  <text x="238" y="252" font-family="Fira Code, PingFang TC, sans-serif" font-size="11" font-weight="600" fill="#b45309" text-anchor="middle">每條件皆具獨立影響對（線性 n + 1 筆）</text>

  <!-- Arrows BC & CC -> MC/DC -->
  <path d="M 152 294 L 152 278 L 238 278 L 238 266" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#arr-up)"/>
  <path d="M 324 294 L 324 278 L 238 278" stroke="#475569" stroke-width="2" fill="none"/>

  <!-- Level 2: BC & CC -->
  <rect x="78" y="296" width="148" height="58" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="152" y="319" font-family="PingFang TC, Noto Sans TC, sans-serif" font-size="13.5" font-weight="800" fill="#166534" text-anchor="middle">分支涵蓋度 (BC)</text>
  <text x="152" y="339" font-family="PingFang TC, Noto Sans TC, sans-serif" font-size="10.5" font-weight="600" fill="#15803d" text-anchor="middle">每個決策 T / F 全走</text>

  <rect x="250" y="296" width="148" height="58" rx="10" fill="#ecfeff" stroke="#0891b2" stroke-width="2"/>
  <text x="324" y="319" font-family="PingFang TC, Noto Sans TC, sans-serif" font-size="13.5" font-weight="800" fill="#155e75" text-anchor="middle">條件涵蓋度 (CC)</text>
  <text x="324" y="339" font-family="PingFang TC, Noto Sans TC, sans-serif" font-size="10.5" font-weight="600" fill="#0e7490" text-anchor="middle">每個原子條件 T / F</text>

  <!-- Arrow SC -> BC -->
  <path d="M 238 386 L 238 370 L 152 370 L 152 358" stroke="#0284c7" stroke-width="2.2" fill="none" marker-end="url(#arr-blue)"/>
  <text x="275" y="375" font-family="PingFang TC, Noto Sans TC, sans-serif" font-size="10" font-weight="700" fill="#0369a1" text-anchor="start">100% BC 必含 100% SC</text>

  <!-- Level 1: Statement Coverage -->
  <rect x="78" y="388" width="320" height="52" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
  <text x="238" y="410" font-family="PingFang TC, Noto Sans TC, sans-serif" font-size="14" font-weight="800" fill="#334155" text-anchor="middle">敘述涵蓋度 (Statement Coverage, SC)</text>
  <text x="238" y="430" font-family="PingFang TC, Noto Sans TC, sans-serif" font-size="11" font-weight="600" fill="#475569" text-anchor="middle">最低底線：每行可執行敘述至少執行 1 次</text>
</svg>
