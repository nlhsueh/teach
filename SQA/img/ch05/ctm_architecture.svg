<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 450" width="100%" height="100%">
  <defs>
    <style>
      .title-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans TC", sans-serif; font-size: 14px; font-weight: 700; fill: #0b3c5d; }
      .node-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans TC", sans-serif; font-size: 13px; font-weight: 600; text-anchor: middle; dominant-baseline: central; }
      .root-node { fill: #0b3c5d; rx: 8px; }
      .root-text { fill: #ffffff; font-size: 14px; font-weight: 700; text-anchor: middle; dominant-baseline: central; }
      .classif-node { fill: #328cc1; rx: 6px; }
      .classif-text { fill: #ffffff; font-size: 13px; font-weight: 600; text-anchor: middle; dominant-baseline: central; }
      .class-node { fill: #f0f7fb; stroke: #328cc1; stroke-width: 1.5; rx: 5px; }
      .class-text { fill: #0b3c5d; font-size: 12px; font-weight: 600; text-anchor: middle; dominant-baseline: central; }
      .tree-line { stroke: #6c757d; stroke-width: 1.5; fill: none; }
      .proj-line { stroke: #b0bec5; stroke-width: 1; stroke-dasharray: 3 3; }
      .table-hdr { fill: #e9ecef; stroke: #cfd8dc; stroke-width: 1; }
      .table-row-even { fill: #ffffff; stroke: #cfd8dc; stroke-width: 1; }
      .table-row-odd { fill: #f8f9fa; stroke: #cfd8dc; stroke-width: 1; }
      .tc-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12px; font-weight: 700; fill: #0b3c5d; text-anchor: middle; dominant-baseline: central; }
      .desc-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans TC", sans-serif; font-size: 11px; fill: #455a64; dominant-baseline: central; }
      .dot-marker { fill: #d32f2f; }
      .badge-bg { fill: #e8f4fd; stroke: #328cc1; stroke-width: 1; rx: 4px; }
      .badge-text { font-family: sans-serif; font-size: 11px; font-weight: 700; fill: #0b3c5d; }
    </style>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.1" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="840" height="450" fill="#ffffff" rx="10" stroke="#e2e8f0" stroke-width="1.5" />

  <!-- Top Zone: Classification Tree Header -->
  <rect x="20" y="14" width="220" height="24" class="badge-bg" />
  <text x="30" y="30" class="badge-text">🌳 1. 分類樹 (Classification Tree)</text>

  <!-- Tree Root Node -->
  <g filter="url(#shadow)">
    <rect x="330" y="16" width="180" height="34" class="root-node" />
    <text x="420" y="33" class="root-text">結帳折扣計算系統</text>
  </g>

  <!-- Connectors from Root to Classifications -->
  <path d="M 420 50 L 420 68 M 200 68 L 640 68 M 200 68 L 200 85 M 640 68 L 640 85" class="tree-line" />

  <!-- Classification 1: 會員等級 -->
  <g filter="url(#shadow)">
    <rect x="120" y="85" width="160" height="30" class="classif-node" />
    <text x="200" y="100" class="classif-text">分類一：會員身分</text>
  </g>

  <!-- Classification 2: 消費金額 -->
  <g filter="url(#shadow)">
    <rect x="560" y="85" width="160" height="30" class="classif-node" />
    <text x="640" y="100" class="classif-text">分類二：消費金額</text>
  </g>

  <!-- Connectors to Classes (Leaves) -->
  <!-- Left Branches -->
  <path d="M 200 115 L 200 130 M 80 130 L 320 130 M 80 130 L 80 145 M 200 130 L 200 145 M 320 130 L 320 145" class="tree-line" />
  <!-- Right Branches -->
  <path d="M 640 115 L 640 130 M 520 130 L 760 130 M 520 130 L 520 145 M 640 130 L 640 145 M 760 130 L 760 145" class="tree-line" />

  <!-- Classes (Leaf Nodes) -->
  <!-- Class 1-1: VIP -->
  <rect x="35" y="145" width="90" height="28" class="class-node" />
  <text x="80" y="159" class="class-text">VIP 會員</text>

  <!-- Class 1-2: 一般會員 -->
  <rect x="155" y="145" width="90" height="28" class="class-node" />
  <text x="200" y="159" class="class-text">一般會員</text>

  <!-- Class 1-3: 訪客 -->
  <rect x="275" y="145" width="90" height="28" class="class-node" />
  <text x="320" y="159" class="class-text">未註冊訪客</text>

  <!-- Class 2-1: < 1000 -->
  <rect x="475" y="145" width="90" height="28" class="class-node" />
  <text x="520" y="159" class="class-text">&lt; $1,000</text>

  <!-- Class 2-2: 1000~3000 -->
  <rect x="595" y="145" width="90" height="28" class="class-node" />
  <text x="640" y="159" class="class-text">$1,000~$3,000</text>

  <!-- Class 2-3: > 3000 -->
  <rect x="715" y="145" width="90" height="28" class="class-node" />
  <text x="760" y="159" class="class-text">&gt; $3,000</text>

  <!-- Vertical Projection Guidelines from Leaf Nodes down into Table Columns -->
  <line x1="80" y1="173" x2="80" y2="425" class="proj-line" />
  <line x1="200" y1="173" x2="200" y2="425" class="proj-line" />
  <line x1="320" y1="173" x2="320" y2="425" class="proj-line" />
  <line x1="520" y1="173" x2="520" y2="425" class="proj-line" />
  <line x1="640" y1="173" x2="640" y2="425" class="proj-line" />
  <line x1="760" y1="173" x2="760" y2="425" class="proj-line" />

  <!-- Bottom Zone: Combination Table Header -->
  <rect x="20" y="215" width="260" height="24" class="badge-bg" />
  <text x="30" y="231" class="badge-text">📊 2. 組合規格表 (Combination Table)</text>

  <!-- Table Structure -->
  <!-- Table Header Bar -->
  <rect x="25" y="248" width="790" height="30" class="table-hdr" />
  <text x="55" y="263" class="tc-text">測試案例</text>
  <text x="80" y="263" class="class-text">VIP</text>
  <text x="200" y="263" class="class-text">一般</text>
  <text x="320" y="263" class="class-text">訪客</text>
  <text x="520" y="263" class="class-text">&lt; 1K</text>
  <text x="640" y="263" class="class-text">1K~3K</text>
  <text x="760" y="263" class="class-text">&gt; 3K</text>

  <!-- Row 1: TC1 -->
  <rect x="25" y="278" width="790" height="36" class="table-row-even" />
  <text x="55" y="296" class="tc-text">TC 1</text>
  <!-- Dot at VIP -->
  <circle cx="80" cy="296" r="7" class="dot-marker" />
  <!-- Dot at > 3000 -->
  <circle cx="760" cy="296" r="7" class="dot-marker" />
  <text x="390" y="296" class="desc-text">選取 [VIP] + [&gt;$3,000] ➔ 折扣 8 折 + 滿額折 300</text>

  <!-- Row 2: TC2 -->
  <rect x="25" y="314" width="790" height="36" class="table-row-odd" />
  <text x="55" y="332" class="tc-text">TC 2</text>
  <!-- Dot at 一般會員 -->
  <circle cx="200" cy="332" r="7" class="dot-marker" />
  <!-- Dot at 1000~3000 -->
  <circle cx="640" cy="332" r="7" class="dot-marker" />
  <text x="390" y="332" class="desc-text">選取 [一般會員] + [$1,000~$3,000] ➔ 折扣 9 折 + 滿額折 100</text>

  <!-- Row 3: TC3 -->
  <rect x="25" y="350" width="790" height="36" class="table-row-even" />
  <text x="55" y="368" class="tc-text">TC 3</text>
  <!-- Dot at 訪客 -->
  <circle cx="320" cy="368" r="7" class="dot-marker" />
  <!-- Dot at < 1000 -->
  <circle cx="520" cy="368" r="7" class="dot-marker" />
  <text x="390" y="368" class="desc-text">選取 [訪客] + [&lt;$1,000] ➔ 無會員折扣 + 無滿額禮</text>

  <!-- Bottom Legend / Note -->
  <rect x="25" y="392" width="790" height="34" fill="#e8f5e9" stroke="#c8e6c9" rx="4" />
  <circle cx="45" cy="409" r="6" class="dot-marker" />
  <text x="60" y="409" class="desc-text" font-weight="700" fill="#2e7d32">黑點 (⚫) 意義：表示該測試案例選取上方對應的等價類別。僅需 3 個案例即達成 100% 弱等價覆蓋 (Weak EP Coverage)！</text>
</svg>
