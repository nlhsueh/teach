  <!-- Diagonal arrows highlighting seam collisions -->
  <path d="M 446 188 L 146 198" stroke="#ea580c" stroke-width="1.8" stroke-dasharray="3,2"/>
  <path d="M 506 188 L 206 198" stroke="#ea580c" stroke-width="1.8" stroke-dasharray="3,2"/>
  <path d="M 446 228 L 146 238" stroke="#ea580c" stroke-width="1.8" stroke-dasharray="3,2"/>
  <path d="M 506 228 L 206 238" stroke="#ea580c" stroke-width="1.8" stroke-dasharray="3,2"/>
  <path d="M 446 268 L 146 278" stroke="#ea580c" stroke-width="1.8" stroke-dasharray="3,2"/>
  <path d="M 506 268 L 206 278" stroke="#ea580c" stroke-width="1.8" stroke-dasharray="3,2"/>

  <!-- Bottom Legend / 3 Overlap Categories -->
  <rect x="24" y="320" width="552" height="100" rx="8" fill="#fff7ed" stroke="#fdba74" stroke-width="1.5"/>
  <text x="36" y="341" font-size="12" font-weight="800" fill="#9a3412">Where Are the 20 Duplicate / Redundant Points in 6 + 28 = 34?</text>
  <text x="36" y="362" font-size="10.8" font-weight="700" fill="#c2410c">• Orange (Seam Collision, -6 pts): V₁{3,4} == V₂{3,4}; V₂{12,13} == V₃{12,13}; V₃{64,65} == V₄{64,65}</text>
  <text x="36" y="383" font-size="10.8" font-weight="700" fill="#854d0e">• Yellow ★ (EP &amp; BVA Overlap, -6 pts): EP {2,8,30,80} &amp; {-5,130} duplicate BVA nom &amp; min-/max+</text>
  <text x="36" y="404" font-size="10.8" font-weight="700" fill="#475569">• Gray Dashed (Interior min+/max-, -8 pts): 2-Value BVA drops {1,2,5,11,14,63,66,119} → 14 pts!</text>
</svg>
