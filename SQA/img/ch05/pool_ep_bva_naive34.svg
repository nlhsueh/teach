    <text x="42" y="28" font-size="11" font-weight="800" fill="#dc2626" text-anchor="middle">age = -5</text>

    <rect x="92" y="0" width="84" height="34" rx="6" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/>
    <text x="134" y="14" font-size="10.5" font-weight="800" fill="#075985" text-anchor="middle">V₁ (0..3)</text>
    <text x="134" y="28" font-size="11" font-weight="800" fill="#0284c7" text-anchor="middle">age = 2</text>

    <rect x="184" y="0" width="84" height="34" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
    <text x="226" y="14" font-size="10.5" font-weight="800" fill="#166534" text-anchor="middle">V₂ (4..12)</text>
    <text x="226" y="28" font-size="11" font-weight="800" fill="#16a34a" text-anchor="middle">age = 8</text>

    <rect x="276" y="0" width="84" height="34" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
    <text x="318" y="14" font-size="10.5" font-weight="800" fill="#92400e" text-anchor="middle">V₃ (13..64)</text>
    <text x="318" y="28" font-size="11" font-weight="800" fill="#d97706" text-anchor="middle">age = 30</text>

    <rect x="368" y="0" width="84" height="34" rx="6" fill="#f3e8ff" stroke="#7c3aed" stroke-width="1.5"/>
    <text x="410" y="14" font-size="10.5" font-weight="800" fill="#5b21b6" text-anchor="middle">V₄ (65..120)</text>
    <text x="410" y="28" font-size="11" font-weight="800" fill="#7c3aed" text-anchor="middle">age = 80</text>

    <rect x="460" y="0" width="90" height="34" rx="6" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5"/>
    <text x="505" y="14" font-size="10.5" font-weight="800" fill="#991b1b" text-anchor="middle">I₂ (&gt; 120)</text>
    <text x="505" y="28" font-size="11" font-weight="800" fill="#dc2626" text-anchor="middle">age = 130</text>
  </g>

  <!-- Section B: Naive 7-Point Robust BVA per Valid Tier (4 x 7 = 28 Points) -->
  <text x="24" y="130" font-size="12.5" font-weight="800" fill="#1e293b">2. Naive 7-Point Robust BVA per Valid Tier: 4 Tiers × 7 Points = 28 Points</text>

  <!-- Column Headers -->
  <g transform="translate(24, 138)">
    <text x="45" y="14" font-size="10.5" font-weight="800" fill="#475569" text-anchor="middle">Valid Tier</text>
    <text x="122" y="14" font-size="10.5" font-weight="800" fill="#b91c1c" text-anchor="middle">min-</text>
    <text x="182" y="14" font-size="10.5" font-weight="800" fill="#0369a1" text-anchor="middle">min</text>
    <text x="242" y="14" font-size="10.5" font-weight="800" fill="#64748b" text-anchor="middle">min+</text>
    <text x="302" y="14" font-size="10.5" font-weight="800" fill="#a16207" text-anchor="middle">nom</text>
    <text x="362" y="14" font-size="10.5" font-weight="800" fill="#64748b" text-anchor="middle">max-</text>
    <text x="422" y="14" font-size="10.5" font-weight="800" fill="#0369a1" text-anchor="middle">max</text>
    <text x="482" y="14" font-size="10.5" font-weight="800" fill="#b91c1c" text-anchor="middle">max+</text>
    <text x="534" y="14" font-size="10.5" font-weight="800" fill="#475569" text-anchor="middle">Count</text>
