<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 440" width="600" height="440" font-family="'Inter', 'Noto Sans TC', -apple-system, sans-serif">
  <!-- Background matching slide #f5f5f5 -->
  <rect x="0" y="0" width="600" height="440" fill="#f5f5f5" rx="10" />

  <!-- Outer Card -->
