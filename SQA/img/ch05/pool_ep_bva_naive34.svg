    <text x="422" y="19" font-size="12" font-weight="800" fill="#c2410c" text-anchor="middle">64</text>

    <rect x="456" y="0" width="52" height="30" rx="5" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/>
    <text x="482" y="19" font-size="12" font-weight="800" fill="#c2410c" text-anchor="middle">65</text>

