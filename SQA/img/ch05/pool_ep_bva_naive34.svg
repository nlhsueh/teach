  <rect x="10" y="32" width="580" height="12" fill="#fef2f2" />
  <text x="26" y="31" font-size="14" font-weight="800" fill="#991b1b">Visualizing the Naive 34 Points &amp; Their 3 Duplicate Traps</text>

  <!-- Section A: Naive EP (6 Points) -->
  <text x="24" y="64" font-size="12.5" font-weight="800" fill="#1e293b">1. Naive EP Alone: 6 Equivalence Classes → 6 Representative Points</text>
