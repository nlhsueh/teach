    <rect x="96" y="0" width="52" height="30" rx="5" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/>
    <text x="122" y="19" font-size="12" font-weight="800" fill="#c2410c" text-anchor="middle">64</text>

    <rect x="156" y="0" width="52" height="30" rx="5" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/>
    <text x="182" y="19" font-size="12" font-weight="800" fill="#c2410c" text-anchor="middle">65</text>

    <rect x="216" y="0" width="52" height="30" rx="5" fill="#f8fafc" stroke="#94a3b8" stroke-dasharray="3,2"/>
    <text x="242" y="19" font-size="11.5" font-weight="700" fill="#64748b" text-anchor="middle">66</text>

    <rect x="276" y="0" width="52" height="30" rx="5" fill="#fef9c3" stroke="#ca8a04" stroke-width="1.5"/>
    <text x="302" y="19" font-size="12" font-weight="800" fill="#854d0e" text-anchor="middle">80 ★</text>

    <rect x="336" y="0" width="52" height="30" rx="5" fill="#f8fafc" stroke="#94a3b8" stroke-dasharray="3,2"/>
    <text x="362" y="19" font-size="11.5" font-weight="700" fill="#64748b" text-anchor="middle">119</text>

    <rect x="396" y="0" width="52" height="30" rx="5" fill="#f0f9ff" stroke="#0284c7" stroke-width="1.4"/>
    <text x="422" y="19" font-size="12" font-weight="800" fill="#0369a1" text-anchor="middle">120</text>

    <rect x="456" y="0" width="52" height="30" rx="5" fill="#fee2e2" stroke="#ef4444" stroke-width="1.4"/>
    <text x="482" y="19" font-size="12" font-weight="800" fill="#b91c1c" text-anchor="middle">121</text>

    <text x="534" y="19" font-size="11.5" font-weight="800" fill="#334155" text-anchor="middle">7 pts</text>
