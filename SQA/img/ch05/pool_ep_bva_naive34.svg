    <rect x="276" y="0" width="52" height="30" rx="5" fill="#fef9c3" stroke="#ca8a04" stroke-width="1.5"/>
    <text x="302" y="19" font-size="12" font-weight="800" fill="#854d0e" text-anchor="middle">2 ★</text>

