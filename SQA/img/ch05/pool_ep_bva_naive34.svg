    <rect x="396" y="0" width="52" height="30" rx="5" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/>
    <text x="422" y="19" font-size="12" font-weight="800" fill="#c2410c" text-anchor="middle">12</text>

    <rect x="456" y="0" width="52" height="30" rx="5" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/>
    <text x="482" y="19" font-size="12" font-weight="800" fill="#c2410c" text-anchor="middle">13</text>

    <text x="534" y="19" font-size="11.5" font-weight="800" fill="#334155" text-anchor="middle">7 pts</text>
  </g>

