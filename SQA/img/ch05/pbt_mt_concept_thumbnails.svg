<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 510" width="100%" height="100%">
  <defs>
    <style>
      .card-bg { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.8; rx: 12px; }
      .thumb-bg-blue { fill: #f0f9ff; stroke: #bae6fd; stroke-width: 1.2; rx: 8px; }
      .thumb-bg-indigo { fill: #eef2ff; stroke: #c7d2fe; stroke-width: 1.2; rx: 8px; }
      .thumb-bg-amber { fill: #fffbeb; stroke: #fde68a; stroke-width: 1.2; rx: 8px; }
      .thumb-bg-emerald { fill: #ecfdf5; stroke: #a7f3d0; stroke-width: 1.2; rx: 8px; }
      .thumb-bg-purple { fill: #faf5ff; stroke: #e9d5ff; stroke-width: 1.2; rx: 8px; }
      .thumb-bg-rose { fill: #fff1f2; stroke: #fecdd3; stroke-width: 1.2; rx: 8px; }
      .card-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans TC", sans-serif; font-size: 15px; font-weight: 800; fill: #0f172a; text-anchor: middle; }
      .card-sub { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans TC", sans-serif; font-size: 12px; font-weight: 600; fill: #475569; text-anchor: middle; }
      .card-formula { font-family: "Fira Code", "Consolas", monospace; font-size: 11.5px; font-weight: 700; text-anchor: middle; }
      .mini-label { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans TC", sans-serif; font-size: 11px; font-weight: 700; text-anchor: middle; }
      .code-text { font-family: "Fira Code", "Consolas", monospace; font-size: 11px; font-weight: 700; text-anchor: middle; }
    </style>
    <marker id="arr-b" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#0284c7" />
    </marker>
    <marker id="arr-i" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#4f46e5" />
    </marker>
    <marker id="arr-a" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#d97706" />
    </marker>
    <marker id="arr-g" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#059669" />
    </marker>
    <marker id="arr-p" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#7c3aed" />
    </marker>
    <marker id="arr-r" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#e11d48" />
    </marker>
  </defs>

  <!-- ==================== ROW 1: PBT CORE CONCEPTS (y=12..246) ==================== -->

  <!-- CARD 1: Property-Based Invariants (x=20..366) -->
  <g transform="translate(20, 12)">
    <rect width="346" height="232" class="card-bg" />
    <rect width="346" height="6" fill="#0284c7" rx="3" />
    <!-- Thumbnail graphic area -->
    <rect x="14" y="14" width="318" height="142" class="thumb-bg-blue" />

    <!-- Left side of thumb: EBT (3 sparse points) -->
    <rect x="24" y="24" width="130" height="122" fill="#ffffff" stroke="#bae6fd" rx="6" />
    <text x="89" y="40" class="mini-label" fill="#64748b">傳統 EBT (單點抽樣)</text>
    <circle cx="52" cy="70" r="5" fill="#16a34a" />
    <circle cx="85" cy="95" r="5" fill="#16a34a" />
    <circle cx="115" cy="65" r="5" fill="#16a34a" />
    <!-- Missed bug in corner -->
    <circle cx="132" cy="122" r="9" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5" />
    <text x="132" y="126" class="code-text" fill="#dc2626">!</text>
    <text x="75" y="136" font-family="sans-serif" font-size="10px" fill="#dc2626" text-anchor="middle">漏測極端邊界</text>

    <!-- Arrow EBT -> PBT -->
    <path d="M 158 85 L 180 85" stroke="#0284c7" stroke-width="2.2" marker-end="url(#arr-b)" />

    <!-- Right side of thumb: PBT (1000 points + Invariant shield) -->
    <rect x="184" y="24" width="138" height="122" fill="#ffffff" stroke="#0284c7" stroke-width="1.5" rx="6" />
    <text x="253" y="40" class="mini-label" fill="#0369a1">PBT (@ForAll 1000組)</text>
    <!-- Grid of random test points -->
    <circle cx="204" cy="58" r="3.5" fill="#0284c7" />
    <circle cx="224" cy="64" r="3.5" fill="#0284c7" />
    <circle cx="248" cy="56" r="3.5" fill="#0284c7" />
    <circle cx="272" cy="66" r="3.5" fill="#0284c7" />
    <circle cx="298" cy="58" r="3.5" fill="#0284c7" />
    <circle cx="212" cy="82" r="3.5" fill="#0284c7" />
    <circle cx="238" cy="78" r="3.5" fill="#0284c7" />
    <circle cx="262" cy="84" r="3.5" fill="#0284c7" />
    <circle cx="288" cy="76" r="3.5" fill="#0284c7" />
    <circle cx="306" cy="86" r="4.5" fill="#dc2626" />
    <!-- Invariant bar at bottom -->
    <rect x="194" y="102" width="118" height="34" fill="#0284c7" rx="5" />
    <text x="253" y="117" font-family="sans-serif" font-size="10.5px" font-weight="700" fill="#ffffff" text-anchor="middle">通用不變量護欄</text>
    <text x="253" y="131" font-family="monospace" font-size="10px" font-weight="700" fill="#e0f2fe" text-anchor="middle">Invariant(f(x)) == true</text>

    <!-- Bottom Caption -->
    <text x="173" y="178" class="card-title">① 屬性基礎測試 (PBT)</text>
    <text x="173" y="198" class="card-sub">不再手寫單一答案，改定義永恆成立的通用法則</text>
    <text x="173" y="218" class="card-formula" fill="#0284c7">@Property + @ForAll (1,000 次隨機轟炸)</text>
  </g>

  <!-- CARD 2: Round-Trip & Conservation Invariants (x=387..733) -->
  <g transform="translate(387, 12)">
    <rect width="346" height="232" class="card-bg" />
    <rect width="346" height="6" fill="#4f46e5" rx="3" />
    <!-- Thumbnail graphic area -->
    <rect x="14" y="14" width="318" height="142" class="thumb-bg-indigo" />

    <!-- Round-trip cycle diagram -->
    <rect x="28" y="60" width="76" height="44" fill="#ffffff" stroke="#4f46e5" stroke-width="2" rx="8" />
    <text x="66" y="79" class="mini-label" fill="#312e81">原始資料 x</text>
    <text x="66" y="95" class="code-text" fill="#4f46e5">[1, 2, 3]</text>

    <rect x="138" y="26" width="72" height="32" fill="#4f46e5" rx="6" />
    <text x="174" y="46" font-family="sans-serif" font-size="11px" font-weight="700" fill="#ffffff" text-anchor="middle">轉換 f(x)</text>

    <rect x="242" y="60" width="76" height="44" fill="#ffffff" stroke="#4f46e5" stroke-width="2" rx="8" />
    <text x="280" y="79" class="mini-label" fill="#312e81">中間狀態 y</text>
    <text x="280" y="95" class="code-text" fill="#4f46e5">[3, 2, 1]</text>

    <rect x="132" y="110" width="84" height="32" fill="#4338ca" rx="6" />
    <text x="174" y="130" font-family="sans-serif" font-size="11px" font-weight="700" fill="#ffffff" text-anchor="middle">逆轉換 f⁻¹(y)</text>

    <!-- Curved arrows for round-trip -->
    <path d="M 85 58 C 95 40, 115 40, 134 40" stroke="#4f46e5" stroke-width="2" fill="none" marker-end="url(#arr-i)" />
    <path d="M 212 40 C 235 40, 255 40, 265 56" stroke="#4f46e5" stroke-width="2" fill="none" marker-end="url(#arr-i)" />
    <path d="M 265 106 C 255 126, 235 126, 220 126" stroke="#4f46e5" stroke-width="2" fill="none" marker-end="url(#arr-i)" />
    <path d="M 130 126 C 110 126, 95 126, 85 108" stroke="#4f46e5" stroke-width="2" fill="none" marker-end="url(#arr-i)" />

    <!-- Bottom Caption -->
    <text x="173" y="178" class="card-title">② 往返可逆與結構守恆</text>
    <text x="173" y="198" class="card-sub">去了再回來必等於自己；排序前後長度與元素守恆</text>
    <text x="173" y="218" class="card-formula" fill="#4f46e5">decode(encode(x)) == x  |  size(sort(L)) == size(L)</text>
  </g>

  <!-- CARD 3: Test Case Shrinking (x=754..1100) -->
  <g transform="translate(754, 12)">
    <rect width="346" height="232" class="card-bg" />
    <rect width="346" height="6" fill="#d97706" rx="3" />
    <!-- Thumbnail graphic area -->
    <rect x="14" y="14" width="318" height="142" class="thumb-bg-amber" />

    <!-- Funnel Shrinking visual -->
    <polygon points="36,30 310,30 235,108 111,108" fill="#fef3c7" stroke="#d97706" stroke-width="1.8" />
    <!-- Step 1: Huge random input -->
    <rect x="64" y="36" width="218" height="22" fill="#ffffff" stroke="#f59e0b" rx="4" />
    <text x="173" y="51" class="code-text" fill="#92400e">隨機命中: amount = 48,752 (失敗)</text>
    <!-- Step 2: Binary shrink -->
    <rect x="98" y="64" width="150" height="20" fill="#ffffff" stroke="#f59e0b" rx="4" />
    <text x="173" y="78" class="code-text" fill="#b45309">折半收縮: 12,188 ➔ 3,047</text>
    <!-- Step 3: Minimal counterexample -->
    <path d="M 173 108 L 173 118" stroke="#d97706" stroke-width="2.2" marker-end="url(#arr-a)" />
    <rect x="78" y="120" width="190" height="28" fill="#dc2626" rx="6" />
    <text x="173" y="138" font-family="monospace" font-size="12px" font-weight="700" fill="#ffffff" text-anchor="middle">最小反例: amount = 2901</text>

    <!-- Bottom Caption -->
    <text x="173" y="178" class="card-title">③ 測資收縮 (Shrinking)</text>
    <text x="173" y="198" class="card-sub">抓到錯誤後自動折半簡化，1 秒定位臨界斷崖 Bug</text>
    <text x="173" y="218" class="card-formula" fill="#b45309">Random Failure ➔ Minimal Counterexample</text>
  </g>

  <!-- ==================== ROW 2: METAMORPHIC & AI TESTING (y=262..496) ==================== -->

  <!-- CARD 4: Metamorphic Testing (x=20..366) -->
  <g transform="translate(20, 262)">
    <rect width="346" height="232" class="card-bg" />
    <rect width="346" height="6" fill="#059669" rx="3" />
    <!-- Thumbnail graphic area -->
    <rect x="14" y="14" width="318" height="142" class="thumb-bg-emerald" />

    <!-- Top Track: Source Run -->
    <rect x="26" y="30" width="90" height="36" fill="#ffffff" stroke="#059669" stroke-width="1.8" rx="6" />
    <text x="71" y="46" class="mini-label" fill="#065f46">原始輸入 x</text>
    <text x="71" y="60" class="code-text" fill="#059669">"Java"</text>
    <path d="M 118 48 L 166 48" stroke="#059669" stroke-width="2" marker-end="url(#arr-g)" />
    <text x="142" y="41" class="code-text" fill="#047857">f(x)</text>
    <rect x="170" y="30" width="92" height="36" fill="#ffffff" stroke="#059669" stroke-width="1.8" rx="6" />
    <text x="216" y="46" class="mini-label" fill="#065f46">原始輸出 y</text>
    <text x="216" y="60" class="code-text" fill="#059669">3,842 筆結果</text>

    <!-- Transform T arrow on left -->
    <path d="M 71 68 L 71 98" stroke="#059669" stroke-width="2" stroke-dasharray="4 2" marker-end="url(#arr-g)" />
    <text x="46" y="88" class="mini-label" fill="#047857">變換 T</text>

    <!-- Bottom Track: Follow-up Run -->
    <rect x="26" y="102" width="90" height="36" fill="#ffffff" stroke="#059669" stroke-width="1.8" rx="6" />
    <text x="71" y="118" class="mini-label" fill="#065f46">衍生輸入 x'</text>
    <text x="71" y="132" class="code-text" fill="#059669">"Java SQA"</text>
    <path d="M 118 120 L 166 120" stroke="#059669" stroke-width="2" marker-end="url(#arr-g)" />
    <text x="142" y="113" class="code-text" fill="#047857">f(x')</text>
    <rect x="170" y="102" width="92" height="36" fill="#ffffff" stroke="#059669" stroke-width="1.8" rx="6" />
    <text x="216" y="118" class="mini-label" fill="#065f46">衍生輸出 y'</text>
    <text x="216" y="132" class="code-text" fill="#059669">128 筆子集</text>

    <!-- MR Check on right -->
    <path d="M 264 48 L 284 48 L 284 120 L 264 120" stroke="#059669" stroke-width="2" fill="none" />
    <rect x="272" y="70" width="54" height="28" fill="#059669" rx="5" />
    <text x="299" y="88" font-family="monospace" font-size="11.5px" font-weight="700" fill="#ffffff" text-anchor="middle">y' ⊆ y</text>

    <!-- Bottom Caption -->
    <text x="173" y="178" class="card-title">④ 變質測試 (Metamorphic Testing)</text>
    <text x="173" y="198" class="card-sub">不知單次答案時，執行兩次檢驗輸入變換與輸出關係</text>
    <text x="173" y="218" class="card-formula" fill="#059669">x' = T(x)  ➔  Verify MR( f(x), f(x') )</text>
  </g>

  <!-- CARD 5: Monotonicity & Symmetry Patterns (x=387..733) -->
  <g transform="translate(387, 262)">
    <rect width="346" height="232" class="card-bg" />
    <rect width="346" height="6" fill="#7c3aed" rx="3" />
    <!-- Thumbnail graphic area -->
    <rect x="14" y="14" width="318" height="142" class="thumb-bg-purple" />

    <!-- Left half: Tier Monotonicity Staircase -->
    <rect x="24" y="24" width="144" height="122" fill="#ffffff" stroke="#ddd6fe" rx="6" />
    <text x="96" y="40" class="mini-label" fill="#5b21b6">等級單調性 (不倒掛)</text>
    <!-- 3 bars: VIP <= Regular <= Guest -->
    <rect x="38" y="96" width="30" height="32" fill="#7c3aed" rx="3" />
    <text x="53" y="91" class="code-text" fill="#5b21b6">$800</text>
    <text x="53" y="141" font-family="sans-serif" font-size="10px" font-weight="700" fill="#5b21b6" text-anchor="middle">VIP</text>

    <rect x="82" y="80" width="30" height="48" fill="#8b5cf6" rx="3" />
    <text x="97" y="75" class="code-text" fill="#5b21b6">$900</text>
    <text x="97" y="141" font-family="sans-serif" font-size="10px" font-weight="700" fill="#5b21b6" text-anchor="middle">一般</text>

    <rect x="126" y="60" width="30" height="68" fill="#a78bfa" rx="3" />
    <text x="141" y="55" class="code-text" fill="#5b21b6">$1000</text>
    <text x="141" y="141" font-family="sans-serif" font-size="10px" font-weight="700" fill="#5b21b6" text-anchor="middle">訪客</text>

    <!-- Right half: Symmetry / Perturbation -->
    <rect x="178" y="24" width="144" height="122" fill="#ffffff" stroke="#ddd6fe" rx="6" />
    <text x="250" y="40" class="mini-label" fill="#5b21b6">對稱與抗擾動性</text>
    <rect x="190" y="52" width="120" height="26" fill="#f3e8ff" rx="4" />
    <text x="250" y="69" class="code-text" fill="#6b21a8">f(a,b,c) == f(b,c,a)</text>
    <rect x="190" y="86" width="120" height="26" fill="#f3e8ff" rx="4" />
    <text x="250" y="103" class="code-text" fill="#6b21a8">f("sqa") == f("SQA")</text>
    <text x="250" y="132" font-family="sans-serif" font-size="10.5px" font-weight="700" fill="#7c3aed" text-anchor="middle">排列/大小寫/空白不變</text>

    <!-- Bottom Caption -->
    <text x="173" y="178" class="card-title">⑤ 商業單調性與對稱變質模式</text>
    <text x="173" y="198" class="card-sub">VIP 應付必 ≤ 一般 ≤ 訪客；次序對調或微擾結果不變</text>
    <text x="173" y="218" class="card-formula" fill="#7c3aed">pay(VIP) ≤ pay(REG) ≤ pay(GUEST)</text>
  </g>

  <!-- CARD 6: Differential Testing & LLM-as-a-Judge (x=754..1100) -->
  <g transform="translate(754, 262)">
    <rect width="346" height="232" class="card-bg" />
    <rect width="346" height="6" fill="#e11d48" rx="3" />
    <!-- Thumbnail graphic area -->
    <rect x="14" y="14" width="318" height="142" class="thumb-bg-rose" />

    <!-- Input Prompt box -->
    <rect x="24" y="66" width="68" height="40" fill="#ffffff" stroke="#e11d48" stroke-width="1.8" rx="6" />
    <text x="58" y="84" class="mini-label" fill="#9f1239">測試輸入</text>
    <text x="58" y="98" class="code-text" fill="#e11d48">Prompt x</text>

    <!-- Split arrows to Model v1 and Model v2 -->
    <path d="M 92 78 L 126 48" stroke="#e11d48" stroke-width="1.8" marker-end="url(#arr-r)" />
    <path d="M 92 94 L 126 122" stroke="#e11d48" stroke-width="1.8" marker-end="url(#arr-r)" />

    <rect x="130" y="28" width="88" height="36" fill="#ffffff" stroke="#fb7185" stroke-width="1.6" rx="6" />
    <text x="174" y="44" class="mini-label" fill="#881337">舊版/基準模型</text>
    <text x="174" y="58" class="code-text" fill="#e11d48">Model A(x)</text>

    <rect x="130" y="106" width="88" height="36" fill="#ffffff" stroke="#fb7185" stroke-width="1.6" rx="6" />
    <text x="174" y="122" class="mini-label" fill="#881337">新版待測模型</text>
    <text x="174" y="136" class="code-text" fill="#e11d48">Model B(x)</text>

    <!-- Converge to Judge / Diff -->
    <path d="M 218 46 L 246 72" stroke="#e11d48" stroke-width="1.8" marker-end="url(#arr-r)" />
    <path d="M 218 124 L 246 98" stroke="#e11d48" stroke-width="1.8" marker-end="url(#arr-r)" />

    <rect x="248" y="52" width="74" height="66" fill="#e11d48" rx="8" />
    <text x="285" y="74" font-family="sans-serif" font-size="11px" font-weight="700" fill="#ffffff" text-anchor="middle">差分/裁判</text>
    <text x="285" y="91" font-family="monospace" font-size="10.5px" font-weight="700" fill="#ffe4e6" text-anchor="middle">Sim ≥ 0.85</text>
    <text x="285" y="107" font-family="sans-serif" font-size="10px" font-weight="700" fill="#ffffff" text-anchor="middle">Quality Gate</text>

    <!-- Bottom Caption -->
    <text x="173" y="178" class="card-title">⑥ 差分測試與 AI 裁判模型</text>
    <text x="173" y="198" class="card-sub">跨版本交叉打靶比對與 LLM-as-a-Judge 結構化驗收</text>
    <text x="173" y="218" class="card-formula" fill="#e11d48">Differential(v1, v2) + Judge Score ≥ 0.90</text>
  </g>
</svg>
