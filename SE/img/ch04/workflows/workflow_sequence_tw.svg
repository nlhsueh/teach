<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 400" width="100%" height="100%" style="background:#f5f5f5; font-family:'PingFang TC', 'Microsoft JhengHei', 'Helvetica Neue', Arial, sans-serif;">
