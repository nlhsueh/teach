<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1140 420" width="1140" height="420">
  <defs>
    <linearGradient id="thGradTw" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0b3c5d" />
      <stop offset="100%" stop-color="#1d5f8a" />
    </linearGradient>
  </defs>

  <!-- Table Column Header (Clean Flat Banner, No Outer Frame) -->
  <g transform="translate(0, 0)">
    <rect x="0" y="0" width="1140" height="38" rx="6" fill="url(#thGradTw)" />
    <text x="95" y="24" fill="#ffffff" font-family="'Noto Sans TC', sans-serif" font-size="13.5" font-weight="700" text-anchor="middle">視覺符號 (Visual)</text>
    <text x="285" y="24" fill="#ffffff" font-family="'Noto Sans TC', sans-serif" font-size="13.5" font-weight="700" text-anchor="middle">語法名稱 (Element Name)</text>
    <text x="750" y="24" fill="#ffffff" font-family="'Noto Sans TC', sans-serif" font-size="13.5" font-weight="700" text-anchor="middle">軟體工程語意與實務職責 (Engineering Semantics)</text>
  </g>

  <!-- ==================== ROW 1: System Boundary ==================== -->
  <g transform="translate(0, 48)">
    <rect x="0" y="0" width="1140" height="68" rx="6" fill="#f8fafc" />
    <line x1="0" y1="68" x2="1140" y2="68" stroke="#e2e8f0" stroke-width="1" />

    <!-- Visual Symbol -->
    <g transform="translate(15, 11)">
      <path d="M 0,0 L 95,0 A 3,3 0 0 1 98,3 L 102,10 L 155,10 A 3,3 0 0 1 158,13 L 158,40 A 3,3 0 0 1 155,43 L 0,43 A 3,3 0 0 1 -3,40 L -3,3 A 3,3 0 0 1 0,0" fill="#e8eff5" stroke="#0b3c5d" stroke-width="1.6" />
      <line x1="-3" y1="10" x2="102" y2="10" stroke="#0b3c5d" stroke-width="1.2" />
      <text x="5" y="8" fill="#0b3c5d" font-family="'Helvetica Neue', Arial, sans-serif" font-size="8" font-weight="700">System Boundary</text>
      <rect x="25" y="18" width="105" height="18" rx="3" fill="#ffffff" stroke="#328cc1" stroke-width="1" />
      <text x="77" y="31" fill="#1e293b" font-family="'Noto Sans TC', sans-serif" font-size="8.5" font-weight="600" text-anchor="middle">內部核心系統</text>
    </g>

    <!-- Name -->
    <text x="285" y="32" fill="#0b3c5d" font-family="'Noto Sans TC', sans-serif" font-size="14.5" font-weight="700" text-anchor="middle">系統架構邊界框</text>
    <text x="285" y="50" fill="#64748b" font-family="'Helvetica Neue', Arial, sans-serif" font-size="11.5" text-anchor="middle">System Boundary Box</text>

    <!-- Semantics -->
    <text x="400" y="28" fill="#1e293b" font-family="'Noto Sans TC', sans-serif" font-size="13" font-weight="600">
      • &lt;tspan fill="#0b3c5d"&gt;確立範疇（In-Scope）：&lt;/tspan&gt; 框內為我方團隊自主設計、開發與維運的程式碼與微服務。
    </text>
    <text x="400" y="50" fill="#475569" font-family="'Noto Sans TC', sans-serif" font-size="12.5">
      • &lt;tspan fill="#0b3c5d"&gt;排除外部實體：&lt;/tspan&gt; 框外為使用者與第三方服務，明確劃分交付責任、防範範疇蔓延 (Scope Creep)。
    </text>
  </g>

  <!-- ==================== ROW 2: Human Actor ==================== -->
  <g transform="translate(0, 122)">
    <rect x="0" y="0" width="1140" height="68" rx="6" fill="#ffffff" />
    <line x1="0" y1="68" x2="1140" y2="68" stroke="#e2e8f0" stroke-width="1" />

    <!-- Visual Symbol -->
    <g transform="translate(68, 7)">
      <ellipse cx="25" cy="8" rx="6.5" ry="6.5" fill="#d9b310" stroke="#0b3c5d" stroke-width="1.2" />
      <path d="M 25,15 L 25,32 M 13,21 L 37,21 M 25,32 L 15,46 M 25,32 L 35,46" stroke="#0b3c5d" stroke-width="1.4" fill="none" />
      <text x="25" y="56" fill="#0b3c5d" font-family="'Helvetica Neue', Arial, sans-serif" font-size="9" font-weight="700" text-anchor="middle">Customer</text>
    </g>

    <!-- Name -->
    <text x="285" y="32" fill="#0b3c5d" font-family="'Noto Sans TC', sans-serif" font-size="14.5" font-weight="700" text-anchor="middle">外部人類參與者</text>
    <text x="285" y="50" fill="#64748b" font-family="'Helvetica Neue', Arial, sans-serif" font-size="11.5" text-anchor="middle">Human Actor (User)</text>

    <!-- Semantics -->
    <text x="400" y="28" fill="#1e293b" font-family="'Noto Sans TC', sans-serif" font-size="13" font-weight="600">
      • &lt;tspan fill="#0b3c5d"&gt;真實使用者角色：&lt;/tspan&gt; 與系統具備明確互動介面的人類角色（顧客、外送員、餐廳商家）。
    </text>
    <text x="400" y="50" fill="#475569" font-family="'Noto Sans TC', sans-serif" font-size="12.5">
      • &lt;tspan fill="#0b3c5d"&gt;終端互動途徑：&lt;/tspan&gt; 透過特定終端客戶端（如 iOS/Android 原生 App 或商家 Web 後台）與系統溝通。
    </text>
  </g>

  <!-- ==================== ROW 3: External Cloud / Partner System ==================== -->
  <g transform="translate(0, 196)">
    <rect x="0" y="0" width="1140" height="68" rx="6" fill="#f8fafc" />
    <line x1="0" y1="68" x2="1140" y2="68" stroke="#e2e8f0" stroke-width="1" />

    <!-- Visual Symbol -->
    <g transform="translate(68, 7)">
      <ellipse cx="25" cy="8" rx="6.5" ry="6.5" fill="#38bdf8" stroke="#0b3c5d" stroke-width="1.2" />
      <path d="M 25,15 L 25,32 M 13,21 L 37,21 M 25,32 L 15,46 M 25,32 L 35,46" stroke="#0b3c5d" stroke-width="1.4" fill="none" />
      <text x="25" y="56" fill="#0b3c5d" font-family="'Helvetica Neue', Arial, sans-serif" font-size="8.5" font-weight="700" text-anchor="middle">Payment Cloud</text>
    </g>

    <!-- Name -->
    <text x="285" y="32" fill="#0b3c5d" font-family="'Noto Sans TC', sans-serif" font-size="14.5" font-weight="700" text-anchor="middle">外部系統 / 雲端服務</text>
    <text x="285" y="50" fill="#64748b" font-family="'Helvetica Neue', Arial, sans-serif" font-size="11.5" text-anchor="middle">External System / Cloud API</text>

    <!-- Semantics -->
    <text x="400" y="28" fill="#1e293b" font-family="'Noto Sans TC', sans-serif" font-size="13" font-weight="600">
      • &lt;tspan fill="#0b3c5d"&gt;第三方現成能力：&lt;/tspan&gt; 非團隊自主開發的外部現成服務（如 Stripe 金流、Google Maps、Firebase）。
    </text>
    <text x="400" y="50" fill="#475569" font-family="'Noto Sans TC', sans-serif" font-size="12.5">
      • &lt;tspan fill="#0b3c5d"&gt;SLA 與合規隔離：&lt;/tspan&gt; 早期評估供應商 SLA 可靠度與呼叫成本，並隔離資安審計責任（如 PCI-DSS）。
    </text>
  </g>

  <!-- ==================== ROW 4: Internal Subsystem / Component ==================== -->
  <g transform="translate(0, 270)">
    <rect x="0" y="0" width="1140" height="68" rx="6" fill="#ffffff" />
    <line x1="0" y1="68" x2="1140" y2="68" stroke="#e2e8f0" stroke-width="1" />

    <!-- Visual Symbol -->
    <g transform="translate(18, 14)">
      <rect x="0" y="0" width="150" height="38" rx="4" fill="#ffffff" stroke="#328cc1" stroke-width="1.4" />
      <rect x="134" y="6" width="11" height="7" fill="#ffffff" stroke="#328cc1" stroke-width="1.1" />
      <rect x="132" y="8" width="3" height="2" fill="#328cc1" />
      <rect x="132" y="10" width="3" height="2" fill="#328cc1" />
      <text x="65" y="18" fill="#0b3c5d" font-family="'Helvetica Neue', Arial, sans-serif" font-size="9.5" font-weight="700" text-anchor="middle">Order Engine</text>
      <text x="65" y="30" fill="#64748b" font-family="'Noto Sans TC', sans-serif" font-size="8.5" text-anchor="middle">(訂單與排程微服務)</text>
    </g>

    <!-- Name -->
    <text x="285" y="32" fill="#0b3c5d" font-family="'Noto Sans TC', sans-serif" font-size="14.5" font-weight="700" text-anchor="middle">內部核心構件 / 服務</text>
    <text x="285" y="50" fill="#64748b" font-family="'Helvetica Neue', Arial, sans-serif" font-size="11.5" text-anchor="middle">Internal Component / Service</text>

    <!-- Semantics -->
    <text x="400" y="28" fill="#1e293b" font-family="'Noto Sans TC', sans-serif" font-size="13" font-weight="600">
      • &lt;tspan fill="#0b3c5d"&gt;核心業務邏輯載體：&lt;/tspan&gt; 系統邊界內承載規則的核心微服務（如目錄服務、訂單引擎、即時追蹤）。
    </text>
    <text x="400" y="50" fill="#475569" font-family="'Noto Sans TC', sans-serif" font-size="12.5">
      • &lt;tspan fill="#0b3c5d"&gt;獨立模組單元：&lt;/tspan&gt; 右上角帶有 UML 構件圖示（小插槽箱），表示其為可獨立部署與維護的內部模組。
    </text>
  </g>

  <!-- ==================== ROW 5: Dependency Link / Communication Arrow ==================== -->
  <g transform="translate(0, 344)">
    <rect x="0" y="0" width="1140" height="68" rx="6" fill="#f8fafc" />

    <!-- Visual Symbol -->
    <g transform="translate(18, 16)">
      <line x1="5" y1="14" x2="140" y2="14" stroke="#0b3c5d" stroke-width="1.8" />
      <polygon points="146,14 136,9 139,14 136,19" fill="#0b3c5d" />
      <rect x="15" y="0" width="120" height="15" rx="3" fill="#e0f2fe" />
      <text x="75" y="11" fill="#0369a1" font-family="'Helvetica Neue', Arial, sans-serif" font-size="8" font-weight="700" text-anchor="middle">1. Browse &amp; order</text>
    </g>

    <!-- Name -->
    <text x="285" y="32" fill="#0b3c5d" font-family="'Noto Sans TC', sans-serif" font-size="14.5" font-weight="700" text-anchor="middle">相依與資料通訊關聯</text>
    <text x="285" y="50" fill="#64748b" font-family="'Helvetica Neue', Arial, sans-serif" font-size="11.5" text-anchor="middle">Communication Dependency</text>

    <!-- Semantics -->
    <text x="400" y="28" fill="#1e293b" font-family="'Noto Sans TC', sans-serif" font-size="13" font-weight="600">
      • &lt;tspan fill="#0b3c5d"&gt;通訊與依賴方向：&lt;/tspan&gt; 單向箭頭明確指出請求發起端與資料流向（誰呼叫誰、資料往哪走）。
    </text>
    <text x="400" y="50" fill="#475569" font-family="'Noto Sans TC', sans-serif" font-size="12.5">
      • &lt;tspan fill="#0b3c5d"&gt;具名業務動詞：&lt;/tspan&gt; 線條附帶序號與動作名稱，清楚標記該通道承載的具體商業活動與資料載荷。
    </text>
  </g>
</svg>