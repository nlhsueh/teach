<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1140 420" width="1140" height="420">
  <defs>
    <linearGradient id="thGradEn" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0b3c5d" />
      <stop offset="100%" stop-color="#1d5f8a" />
    </linearGradient>
  </defs>

  <!-- Table Column Header (Clean Flat Banner, No Outer Frame) -->
  <g transform="translate(0, 0)">
    <rect x="0" y="0" width="1140" height="38" rx="6" fill="url(#thGradEn)" />
    <text x="95" y="24" fill="#ffffff" font-family="'Helvetica Neue', Arial, sans-serif" font-size="13.5" font-weight="700" text-anchor="middle">Visual Notation</text>
    <text x="285" y="24" fill="#ffffff" font-family="'Helvetica Neue', Arial, sans-serif" font-size="13.5" font-weight="700" text-anchor="middle">Element Name</text>
    <text x="750" y="24" fill="#ffffff" font-family="'Helvetica Neue', Arial, sans-serif" font-size="13.5" font-weight="700" text-anchor="middle">Engineering Semantics &amp; Architectural Role</text>
  </g>

  <!-- ==================== ROW 1: System Boundary ==================== -->
  <g transform="translate(0, 48)">
    <rect x="0" y="0" width="1140" height="68" rx="6" fill="#f8fafc" />
    <line x1="0" y1="68" x2="1140" y2="68" stroke="#e2e8f0" stroke-width="1" />

    <!-- Visual Symbol -->
    <g transform="translate(15, 11)">
      <path d="M 0,0 L 95,0 A 3,3 0 0 1 98,3 L 102,10 L 155,10 A 3,3 0 0 1 158,13 L 158,40 A 3,3 0 0 1 155,43 L 0,43 A 3,3 0 0 1 -3,40 L -3,3 A 3,3 0 0 1 0,0" fill="#e8eff5" stroke="#0b3c5d" stroke-width="1.6" />
      <line x1="-3" y1="10" x2="102" y2="10" stroke="#0b3c5d" stroke-width="1.2" />
      <text x="5" y="8" fill="#0b3c5d" font-family="'Helvetica Neue', Arial, sans-serif" font-size="8" font-weight="700">System Boundary</text>
      <rect x="25" y="18" width="105" height="18" rx="3" fill="#ffffff" stroke="#328cc1" stroke-width="1" />
      <text x="77" y="31" fill="#1e293b" font-family="'Helvetica Neue', Arial, sans-serif" font-size="8.5" font-weight="600" text-anchor="middle">Internal Core System</text>
    </g>

    <!-- Name -->
    <text x="285" y="32" fill="#0b3c5d" font-family="'Helvetica Neue', Arial, sans-serif" font-size="14.5" font-weight="700" text-anchor="middle">System Boundary Box</text>
    <text x="285" y="50" fill="#64748b" font-family="'Helvetica Neue', Arial, sans-serif" font-size="11.5" text-anchor="middle">(Target System Perimeter)</text>

    <!-- Semantics -->
    <text x="400" y="28" fill="#1e293b" font-family="'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="600">
      • &lt;tspan fill="#0b3c5d"&gt;Defines In-Scope:&lt;/tspan&gt; Contains software designed, developed, and maintained by our engineering team.
    </text>
    <text x="400" y="50" fill="#475569" font-family="'Helvetica Neue', Arial, sans-serif" font-size="12">
      • &lt;tspan fill="#0b3c5d"&gt;Excludes External Entities:&lt;/tspan&gt; Clearly defines legal boundaries, prevents Scope Creep, and isolates liabilities.
    </text>
  </g>

  <!-- ==================== ROW 2: Human Actor ==================== -->
  <g transform="translate(0, 122)">
    <rect x="0" y="0" width="1140" height="68" rx="6" fill="#ffffff" />
    <line x1="0" y1="68" x2="1140" y2="68" stroke="#e2e8f0" stroke-width="1" />

    <!-- Visual Symbol -->
    <g transform="translate(68, 7)">
      <ellipse cx="25" cy="8" rx="6.5" ry="6.5" fill="#d9b310" stroke="#0b3c5d" stroke-width="1.2" />
      <path d="M 25,15 L 25,32 M 13,21 L 37,21 M 25,32 L 15,46 M 25,32 L 35,46" stroke="#0b3c5d" stroke-width="1.4" fill="none" />
      <text x="25" y="56" fill="#0b3c5d" font-family="'Helvetica Neue', Arial, sans-serif" font-size="9" font-weight="700" text-anchor="middle">Customer</text>
    </g>

    <!-- Name -->
    <text x="285" y="32" fill="#0b3c5d" font-family="'Helvetica Neue', Arial, sans-serif" font-size="14.5" font-weight="700" text-anchor="middle">Human User Roles</text>
    <text x="285" y="50" fill="#64748b" font-family="'Helvetica Neue', Arial, sans-serif" font-size="11.5" text-anchor="middle">Human Actor (Stick Figure)</text>

    <!-- Semantics -->
    <text x="400" y="28" fill="#1e293b" font-family="'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="600">
      • &lt;tspan fill="#0b3c5d"&gt;Real-World Users:&lt;/tspan&gt; Direct human roles interacting with the platform (Customer, Courier, Restaurant).
    </text>
    <text x="400" y="50" fill="#475569" font-family="'Helvetica Neue', Arial, sans-serif" font-size="12">
      • &lt;tspan fill="#0b3c5d"&gt;Touchpoint Clients:&lt;/tspan&gt; Connects via dedicated clients (iOS/Android mobile apps or merchant portals).
    </text>
  </g>

  <!-- ==================== ROW 3: External Cloud / Partner System ==================== -->
  <g transform="translate(0, 196)">
    <rect x="0" y="0" width="1140" height="68" rx="6" fill="#f8fafc" />
    <line x1="0" y1="68" x2="1140" y2="68" stroke="#e2e8f0" stroke-width="1" />

    <!-- Visual Symbol -->
    <g transform="translate(68, 7)">
      <ellipse cx="25" cy="8" rx="6.5" ry="6.5" fill="#38bdf8" stroke="#0b3c5d" stroke-width="1.2" />
      <path d="M 25,15 L 25,32 M 13,21 L 37,21 M 25,32 L 15,46 M 25,32 L 35,46" stroke="#0b3c5d" stroke-width="1.4" fill="none" />
      <text x="25" y="56" fill="#0b3c5d" font-family="'Helvetica Neue', Arial, sans-serif" font-size="8.5" font-weight="700" text-anchor="middle">Payment Cloud</text>
    </g>

    <!-- Name -->
    <text x="285" y="32" fill="#0b3c5d" font-family="'Helvetica Neue', Arial, sans-serif" font-size="14.5" font-weight="700" text-anchor="middle">External Cloud APIs</text>
    <text x="285" y="50" fill="#64748b" font-family="'Helvetica Neue', Arial, sans-serif" font-size="11.5" text-anchor="middle">External System / Cloud Actor</text>

    <!-- Semantics -->
    <text x="400" y="28" fill="#1e293b" font-family="'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="600">
      • &lt;tspan fill="#0b3c5d"&gt;Third-Party Capabilities:&lt;/tspan&gt; External platforms integrated via REST/gRPC (Stripe, Google Maps, Firebase).
    </text>
    <text x="400" y="50" fill="#475569" font-family="'Helvetica Neue', Arial, sans-serif" font-size="12">
      • &lt;tspan fill="#0b3c5d"&gt;SLA &amp; Compliance Isolation:&lt;/tspan&gt; Evaluates vendor SLAs, API costs, and isolates security scopes (PCI-DSS).
    </text>
  </g>

  <!-- ==================== ROW 4: Internal Subsystem / Component ==================== -->
  <g transform="translate(0, 270)">
    <rect x="0" y="0" width="1140" height="68" rx="6" fill="#ffffff" />
    <line x1="0" y1="68" x2="1140" y2="68" stroke="#e2e8f0" stroke-width="1" />

    <!-- Visual Symbol -->
    <g transform="translate(18, 14)">
      <rect x="0" y="0" width="150" height="38" rx="4" fill="#ffffff" stroke="#328cc1" stroke-width="1.4" />
      <rect x="134" y="6" width="11" height="7" fill="#ffffff" stroke="#328cc1" stroke-width="1.1" />
      <rect x="132" y="8" width="3" height="2" fill="#328cc1" />
      <rect x="132" y="10" width="3" height="2" fill="#328cc1" />
      <text x="65" y="18" fill="#0b3c5d" font-family="'Helvetica Neue', Arial, sans-serif" font-size="9.5" font-weight="700" text-anchor="middle">Order Engine</text>
      <text x="65" y="30" fill="#64748b" font-family="'Helvetica Neue', Arial, sans-serif" font-size="8.5" text-anchor="middle">(Core Microservice)</text>
    </g>

    <!-- Name -->
    <text x="285" y="32" fill="#0b3c5d" font-family="'Helvetica Neue', Arial, sans-serif" font-size="14.5" font-weight="700" text-anchor="middle">Internal Components</text>
    <text x="285" y="50" fill="#64748b" font-family="'Helvetica Neue', Arial, sans-serif" font-size="11.5" text-anchor="middle">Internal Subsystem / Service</text>

    <!-- Semantics -->
    <text x="400" y="28" fill="#1e293b" font-family="'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="600">
      • &lt;tspan fill="#0b3c5d"&gt;Core Business Logic:&lt;/tspan&gt; Subsystems hosting domain rules (Catalog, Order Matching Engine, Live Tracking).
    </text>
    <text x="400" y="50" fill="#475569" font-family="'Helvetica Neue', Arial, sans-serif" font-size="12">
      • &lt;tspan fill="#0b3c5d"&gt;Modular Deployment Units:&lt;/tspan&gt; Marked with the standard UML component icon for independent deployment.
    </text>
  </g>

  <!-- ==================== ROW 5: Dependency Link / Communication Arrow ==================== -->
  <g transform="translate(0, 344)">
    <rect x="0" y="0" width="1140" height="68" rx="6" fill="#f8fafc" />

    <!-- Visual Symbol -->
    <g transform="translate(18, 16)">
      <line x1="5" y1="14" x2="140" y2="14" stroke="#0b3c5d" stroke-width="1.8" />
      <polygon points="146,14 136,9 139,14 136,19" fill="#0b3c5d" />
      <rect x="15" y="0" width="120" height="15" rx="3" fill="#e0f2fe" />
      <text x="75" y="11" fill="#0369a1" font-family="'Helvetica Neue', Arial, sans-serif" font-size="8" font-weight="700" text-anchor="middle">1. Browse &amp; order</text>
    </g>

    <!-- Name -->
    <text x="285" y="32" fill="#0b3c5d" font-family="'Helvetica Neue', Arial, sans-serif" font-size="14.5" font-weight="700" text-anchor="middle">Communication Link</text>
    <text x="285" y="50" fill="#64748b" font-family="'Helvetica Neue', Arial, sans-serif" font-size="11.5" text-anchor="middle">Directed Dependency Arrow</text>

    <!-- Semantics -->
    <text x="400" y="28" fill="#1e293b" font-family="'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="600">
      • &lt;tspan fill="#0b3c5d"&gt;Interaction Direction:&lt;/tspan&gt; Directed arrows explicitly denote request origins and data dependencies.
    </text>
    <text x="400" y="50" fill="#475569" font-family="'Helvetica Neue', Arial, sans-serif" font-size="12">
      • &lt;tspan fill="#0b3c5d"&gt;Semantic Action Labels:&lt;/tspan&gt; Annotated with numbered verb phrases detailing data transactions and protocols.
    </text>
  </g>
</svg>