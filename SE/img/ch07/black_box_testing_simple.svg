<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 460" width="100%" height="100%">
  <defs>
    <style>
      .box-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 16px; font-weight: 800; text-anchor: middle; }
      .box-sub { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12px; font-weight: 600; fill: #475569; text-anchor: middle; }
      .pill-text { font-family: "Fira Code", "Consolas", monospace; font-size: 12px; font-weight: 800; text-anchor: middle; }
    </style>
    <marker id="bb-arr-blue" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#0284c7" />
    </marker>
    <marker id="bb-arr-green" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#059669" />
    </marker>
    <filter id="bb-shadow" x="-6%" y="-6%" width="112%" height="114%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.1" />
    </filter>
  </defs>

  <!-- 1. TOP CARD: TEST INPUTS (EP & BVA) -->
  <g transform="translate(24, 14)" filter="url(#bb-shadow)">
    <rect width="332" height="108" rx="14" fill="#ffffff" stroke="#0284c7" stroke-width="2.2" />
    <rect width="332" height="8" rx="4" fill="#0284c7" />
    <text x="166" y="34" class="box-title" fill="#0b3c5d">1. Test Inputs (x)</text>
    <text x="166" y="54" class="box-sub">Sampled from Specification Domain</text>

    <!-- 3 Clean Input Pills -->
    <rect x="16" y="66" width="92" height="28" rx="7" fill="#e0f2fe" stroke="#38bdf8" stroke-width="1.4" />
    <text x="62" y="84" class="pill-text" fill="#0369a1">Valid (EP)</text>

    <rect x="120" y="66" width="92" height="28" rx="7" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.4" />
    <text x="166" y="84" class="pill-text" fill="#b45309">Edge (BVA)</text>

    <rect x="224" y="66" width="92" height="28" rx="7" fill="#ffe4e6" stroke="#f43f5e" stroke-width="1.4" />
    <text x="270" y="84" class="pill-text" fill="#be123c">Invalid</text>
  </g>

  <!-- Arrow 1 -> 2 -->
  <path d="M 190 124 L 190 156" stroke="#0284c7" stroke-width="3.5" marker-end="url(#bb-arr-blue)" />

  <!-- 2. MIDDLE CARD: OPAQUE BLACK BOX SUT -->
  <g transform="translate(24, 162)" filter="url(#bb-shadow)">
    <rect width="332" height="136" rx="16" fill="#0f172a" stroke="#334155" stroke-width="2.5" />
    <!-- Lock Icon on Left -->
    <circle cx="66" cy="68" r="34" fill="#1e293b" stroke="#38bdf8" stroke-width="2" />
    <rect x="53" y="64" width="26" height="20" rx="4" fill="#38bdf8" />
    <path d="M 58 64 L 58 55 C 58 47, 74 47, 74 55 L 74 64" fill="none" stroke="#38bdf8" stroke-width="3" />
    <text x="66" y="118" font-family="monospace" font-size="11" font-weight="800" fill="#f43f5e" text-anchor="middle">CODE HIDDEN</text>

    <!-- Text on Right -->
    <text x="214" y="44" class="box-title" fill="#ffffff" font-size="18">2. System Under Test</text>
    <text x="214" y="68" font-family="sans-serif" font-size="14" font-weight="800" fill="#38bdf8" text-anchor="middle">Opaque "Black Box"</text>
    <rect x="118" y="82" width="192" height="34" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1.4" />
    <text x="214" y="103" class="pill-text" fill="#e2e8f0">Tests WHAT, Not HOW</text>
  </g>

  <!-- Arrow 2 -> 3 -->
  <path d="M 190 300 L 190 332" stroke="#059669" stroke-width="3.5" marker-end="url(#bb-arr-green)" />

  <!-- 3. BOTTOM CARD: TEST ORACLE VERIFICATION -->
  <g transform="translate(24, 338)" filter="url(#bb-shadow)">
    <rect width="332" height="108" rx="14" fill="#ffffff" stroke="#059669" stroke-width="2.2" />
    <rect width="332" height="8" rx="4" fill="#059669" />
    <text x="166" y="34" class="box-title" fill="#065f46">3. Test Oracle Check</text>
    <text x="166" y="54" class="box-sub">Actual Output (y) == Expected Spec (y*)</text>

    <!-- Pass vs Fail Badges -->
    <rect x="28" y="66" width="128" height="28" rx="7" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5" />
    <text x="92" y="84" class="pill-text" fill="#15803d">✓ Match: PASS</text>

    <rect x="176" y="66" width="128" height="28" rx="7" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5" />
    <text x="240" y="84" class="pill-text" fill="#b91c1c">✗ Diff: FAIL</text>
  </g>
</svg>
