<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 520" width="100%" height="100%">
  <defs>
    <style>
      .font-sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
      .font-mono { font-family: "Fira Code", "Consolas", monospace; }
    </style>
    <marker id="arr-sub" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#0284c7" />
    </marker>
  </defs>

  <!-- Title pill -->
  <rect x="50" y="10" width="380" height="34" rx="17" fill="#0f172a" />
  <text x="240" y="32" class="font-sans" font-size="14.5" font-weight="800" fill="#ffffff" text-anchor="middle">Coverage Subsumption Hierarchy (A → B)</text>

  <!-- Level 1: All-Paths Coverage -->
  <g transform="translate(115, 62)">
    <rect width="250" height="54" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="2.2" />
    <text x="125" y="24" class="font-sans" font-size="15" font-weight="800" fill="#991b1b" text-anchor="middle">All-Paths Coverage</text>
    <text x="125" y="43" class="font-mono" font-size="11.5" font-weight="700" fill="#dc2626" text-anchor="middle">Strongest (Exponential in Loops)</text>
  </g>

  <line x1="240" y1="116" x2="240" y2="146" stroke="#0284c7" stroke-width="2.8" marker-end="url(#arr-sub)" />

  <!-- Level 2: Multiple Condition Coverage (MCC) -->
  <g transform="translate(105, 152)">
    <rect width="270" height="54" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="2.2" />
    <text x="135" y="24" class="font-sans" font-size="15" font-weight="800" fill="#92400e" text-anchor="middle">Multiple Condition (MCC)</text>
    <text x="135" y="43" class="font-mono" font-size="11.5" font-weight="700" fill="#b45309" text-anchor="middle">2ⁿ Truth Table per Decision</text>
  </g>

  <line x1="240" y1="206" x2="240" y2="236" stroke="#0284c7" stroke-width="2.8" marker-end="url(#arr-sub)" />

  <!-- Level 3: MC/DC & Branch/Condition Coverage -->
  <g transform="translate(80, 242)">
    <rect width="320" height="58" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="2.2" />
    <text x="160" y="24" class="font-sans" font-size="15" font-weight="800" fill="#065f46" text-anchor="middle">MC/DC (n + 1) &amp; Branch/Condition</text>
    <text x="160" y="44" class="font-mono" font-size="11.5" font-weight="700" fill="#059669" text-anchor="middle">DO-178C Avionics Gold Standard</text>
  </g>

  <!-- Split arrows to Branch Coverage (Left) and Condition Coverage (Right) -->
  <path d="M 180 300 L 115 338" fill="none" stroke="#0284c7" stroke-width="2.8" marker-end="url(#arr-sub)" />
  <path d="M 300 300 L 365 338" fill="none" stroke="#0284c7" stroke-width="2.8" marker-end="url(#arr-sub)" />

  <!-- Level 4 Left: Branch / Decision Coverage (BC) -->
  <g transform="translate(15, 344)">
    <rect width="205" height="62" rx="10" fill="#f0f9ff" stroke="#0284c7" stroke-width="2.2" />
    <text x="102" y="26" class="font-sans" font-size="14.5" font-weight="800" fill="#0369a1" text-anchor="middle">Branch Coverage (BC)</text>
    <text x="102" y="46" class="font-mono" font-size="11.5" font-weight="700" fill="#0284c7" text-anchor="middle">Every Decision T &amp; F</text>
  </g>

  <!-- Not Equivalent Badge between BC and CC -->
  <text x="240" y="380" class="font-mono" font-size="16" font-weight="900" fill="#dc2626" text-anchor="middle">⊄</text>

  <!-- Level 4 Right: Condition Coverage (CC) -->
  <g transform="translate(260, 344)">
    <rect width="205" height="62" rx="10" fill="#f0f9ff" stroke="#0284c7" stroke-width="2.2" />
    <text x="102" y="26" class="font-sans" font-size="14.5" font-weight="800" fill="#0369a1" text-anchor="middle">Condition Coverage (CC)</text>
    <text x="102" y="46" class="font-mono" font-size="11.5" font-weight="700" fill="#0284c7" text-anchor="middle">Every Atomic Cond T &amp; F</text>
  </g>

  <!-- Arrow from Branch Coverage ONLY to Statement Coverage -->
  <path d="M 117 406 L 195 446" fill="none" stroke="#0284c7" stroke-width="2.8" marker-end="url(#arr-sub)" />

  <!-- Level 5: Statement Coverage (SC) -->
  <g transform="translate(115, 452)">
    <rect width="250" height="54" rx="10" fill="#f8fafc" stroke="#64748b" stroke-width="2.2" />
    <text x="125" y="24" class="font-sans" font-size="15" font-weight="800" fill="#1e293b" text-anchor="middle">Statement Coverage (SC)</text>
    <text x="125" y="43" class="font-mono" font-size="11.5" font-weight="700" fill="#64748b" text-anchor="middle">Weakest Baseline (Every Line ≥ 1x)</text>
  </g>
</svg>
