<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 440" width="600" height="440" font-family="'Inter', 'Noto Sans TC', -apple-system, sans-serif">
  <!-- Background matching slide #f5f5f5 -->
  <rect x="0" y="0" width="600" height="440" fill="#f5f5f5" rx="10" />

  <!-- Outer Card -->
  <rect x="10" y="8" width="580" height="424" rx="12" fill="#ffffff" stroke="#059669" stroke-width="2" />
  <rect x="10" y="8" width="580" height="36" rx="12" fill="#ecfdf5" />
  <rect x="10" y="32" width="580" height="12" fill="#ecfdf5" />
  <text x="26" y="31" font-size="14" font-weight="800" fill="#065f46">3-Step Unified EP + 2-Value BVA Number Line (14 Exact Points)</text>

  <!-- Step 1: 6 Contiguous EP Partitions -->
  <text x="24" y="66" font-size="12.5" font-weight="800" fill="#0f172a">Step 1 (EP): Partition Input Domain into 4 Valid Tiers + 2 Outer Invalid Zones</text>
  <g transform="translate(22, 76)">
    <!-- I1 -->
    <rect x="0" y="0" width="66" height="54" rx="7" fill="#fef2f2" stroke="#ef4444" stroke-width="1.8" stroke-dasharray="4,2"/>
    <text x="33" y="21" font-size="12" font-weight="800" fill="#b91c1c" text-anchor="middle">I₁ (&lt; 0)</text>
    <text x="33" y="40" font-size="10.5" font-weight="700" fill="#dc2626" text-anchor="middle">Exception</text>

    <!-- V1 -->
    <rect x="70" y="0" width="100" height="54" rx="7" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
    <text x="120" y="21" font-size="12" font-weight="800" fill="#0369a1" text-anchor="middle">V₁ [0..3]</text>
    <text x="120" y="40" font-size="11" font-weight="800" fill="#0284c7" text-anchor="middle">FREE ($0)</text>

    <!-- V2 -->
    <rect x="174" y="0" width="100" height="54" rx="7" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
    <text x="224" y="21" font-size="12" font-weight="800" fill="#15803d" text-anchor="middle">V₂ [4..12]</text>
    <text x="224" y="40" font-size="11" font-weight="800" fill="#16a34a" text-anchor="middle">CHILD ($100)</text>

    <!-- V3 -->
    <rect x="278" y="0" width="100" height="54" rx="7" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
    <text x="328" y="21" font-size="12" font-weight="800" fill="#b45309" text-anchor="middle">V₃ [13..64]</text>
    <text x="328" y="40" font-size="11" font-weight="800" fill="#d97706" text-anchor="middle">ADULT ($250)</text>

    <!-- V4 -->
    <rect x="382" y="0" width="100" height="54" rx="7" fill="#f3e8ff" stroke="#7c3aed" stroke-width="2"/>
    <text x="432" y="21" font-size="12" font-weight="800" fill="#6d28d9" text-anchor="middle">V₄ [65..120]</text>
    <text x="432" y="40" font-size="11" font-weight="800" fill="#7c3aed" text-anchor="middle">SENIOR ($120)</text>

    <!-- I2 -->
    <rect x="486" y="0" width="70" height="54" rx="7" fill="#fef2f2" stroke="#ef4444" stroke-width="1.8" stroke-dasharray="4,2"/>
    <text x="521" y="21" font-size="12" font-weight="800" fill="#b91c1c" text-anchor="middle">I₂ (&gt; 120)</text>
    <text x="521" y="40" font-size="10.5" font-weight="700" fill="#dc2626" text-anchor="middle">Exception</text>
  </g>

  <!-- Step 2 & Step 3: Seam Alignment & 14 Points on Number Line -->
  <text x="24" y="158" font-size="12.5" font-weight="800" fill="#0f172a">Step 2 &amp; 3: Mark Seams &amp; Sample {min, nom, max} per Tier + 2 Outer Bounds</text>

  <g transform="translate(22, 174)">
    <!-- Vertical seam guidelines -->
    <line x1="68" y1="-34" x2="68" y2="66" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="3,3"/>
    <line x1="172" y1="-34" x2="172" y2="66" stroke="#ea580c" stroke-width="1.8" stroke-dasharray="3,3"/>
    <line x1="276" y1="-34" x2="276" y2="66" stroke="#ea580c" stroke-width="1.8" stroke-dasharray="3,3"/>
    <line x1="380" y1="-34" x2="380" y2="66" stroke="#ea580c" stroke-width="1.8" stroke-dasharray="3,3"/>
    <line x1="484" y1="-34" x2="484" y2="66" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="3,3"/>

    <!-- Number Line Axis -->
    <line x1="8" y1="28" x2="548" y2="28" stroke="#334155" stroke-width="3" />

    <!-- 14 Sample Dots -->
    <!-- 1: -1 -->
    <circle cx="48" cy="28" r="10.5" fill="#ef4444" stroke="#ffffff" stroke-width="1.8"/>
    <text x="48" y="32" font-size="10.5" font-weight="800" fill="#ffffff" text-anchor="middle">-1</text>
    <text x="48" y="52" font-size="10" font-weight="800" fill="#b91c1c" text-anchor="middle">min-</text>

    <!-- 2: 0 -->
    <circle cx="84" cy="28" r="10.5" fill="#0284c7" stroke="#ffffff" stroke-width="1.8"/>
    <text x="84" y="32" font-size="10.5" font-weight="800" fill="#ffffff" text-anchor="middle">0</text>
    <text x="84" y="52" font-size="10" font-weight="800" fill="#0369a1" text-anchor="middle">min</text>

    <!-- 3: 2 -->
    <circle cx="120" cy="28" r="10.5" fill="#0f766e" stroke="#ffffff" stroke-width="1.8"/>
    <text x="120" y="32" font-size="10.5" font-weight="800" fill="#ffffff" text-anchor="middle">2</text>
    <text x="120" y="52" font-size="10" font-weight="800" fill="#0f766e" text-anchor="middle">nom</text>

    <!-- 4: 3 -->
    <circle cx="156" cy="28" r="10.5" fill="#ea580c" stroke="#ffffff" stroke-width="1.8"/>
    <text x="156" y="32" font-size="10.5" font-weight="800" fill="#ffffff" text-anchor="middle">3</text>
    <text x="156" y="52" font-size="10" font-weight="800" fill="#c2410c" text-anchor="middle">max</text>

    <!-- 5: 4 -->
    <circle cx="188" cy="28" r="10.5" fill="#ea580c" stroke="#ffffff" stroke-width="1.8"/>
    <text x="188" y="32" font-size="10.5" font-weight="800" fill="#ffffff" text-anchor="middle">4</text>
    <text x="188" y="52" font-size="10" font-weight="800" fill="#c2410c" text-anchor="middle">min</text>

    <!-- 6: 8 -->
    <circle cx="224" cy="28" r="10.5" fill="#0f766e" stroke="#ffffff" stroke-width="1.8"/>
    <text x="224" y="32" font-size="10.5" font-weight="800" fill="#ffffff" text-anchor="middle">8</text>
    <text x="224" y="52" font-size="10" font-weight="800" fill="#0f766e" text-anchor="middle">nom</text>

    <!-- 7: 12 -->
    <circle cx="260" cy="28" r="10.5" fill="#ea580c" stroke="#ffffff" stroke-width="1.8"/>
    <text x="260" y="32" font-size="10.5" font-weight="800" fill="#ffffff" text-anchor="middle">12</text>
    <text x="260" y="52" font-size="10" font-weight="800" fill="#c2410c" text-anchor="middle">max</text>

    <!-- 8: 13 -->
    <circle cx="292" cy="28" r="10.5" fill="#ea580c" stroke="#ffffff" stroke-width="1.8"/>
    <text x="292" y="32" font-size="10.5" font-weight="800" fill="#ffffff" text-anchor="middle">13</text>
    <text x="292" y="52" font-size="10" font-weight="800" fill="#c2410c" text-anchor="middle">min</text>

    <!-- 9: 30 -->
    <circle cx="328" cy="28" r="10.5" fill="#0f766e" stroke="#ffffff" stroke-width="1.8"/>
    <text x="328" y="32" font-size="10.5" font-weight="800" fill="#ffffff" text-anchor="middle">30</text>
    <text x="328" y="52" font-size="10" font-weight="800" fill="#0f766e" text-anchor="middle">nom</text>

    <!-- 10: 64 -->
    <circle cx="364" cy="28" r="10.5" fill="#ea580c" stroke="#ffffff" stroke-width="1.8"/>
    <text x="364" y="32" font-size="10.5" font-weight="800" fill="#ffffff" text-anchor="middle">64</text>
    <text x="364" y="52" font-size="10" font-weight="800" fill="#c2410c" text-anchor="middle">max</text>

    <!-- 11: 65 -->
    <circle cx="396" cy="28" r="10.5" fill="#ea580c" stroke="#ffffff" stroke-width="1.8"/>
    <text x="396" y="32" font-size="10.5" font-weight="800" fill="#ffffff" text-anchor="middle">65</text>
    <text x="396" y="52" font-size="10" font-weight="800" fill="#c2410c" text-anchor="middle">min</text>

    <!-- 12: 80 -->
    <circle cx="432" cy="28" r="10.5" fill="#0f766e" stroke="#ffffff" stroke-width="1.8"/>
    <text x="432" y="32" font-size="10.5" font-weight="800" fill="#ffffff" text-anchor="middle">80</text>
    <text x="432" y="52" font-size="10" font-weight="800" fill="#0f766e" text-anchor="middle">nom</text>

    <!-- 13: 120 -->
    <circle cx="468" cy="28" r="10.5" fill="#0284c7" stroke="#ffffff" stroke-width="1.8"/>
    <text x="468" y="32" font-size="9.5" font-weight="800" fill="#ffffff" text-anchor="middle">120</text>
    <text x="468" y="52" font-size="10" font-weight="800" fill="#0369a1" text-anchor="middle">max</text>

    <!-- 14: 121 -->
    <circle cx="504" cy="28" r="10.5" fill="#ef4444" stroke="#ffffff" stroke-width="1.8"/>
    <text x="504" y="32" font-size="9.5" font-weight="800" fill="#ffffff" text-anchor="middle">121</text>
    <text x="504" y="52" font-size="10" font-weight="800" fill="#b91c1c" text-anchor="middle">max+</text>

    <!-- Seam Badges -->
    <rect x="139" y="62" width="66" height="22" rx="5" fill="#fff7ed" stroke="#ea580c" stroke-width="1.4"/>
    <text x="172" y="77" font-size="10" font-weight="800" fill="#c2410c" text-anchor="middle">Seam 3 | 4</text>

    <rect x="241" y="62" width="70" height="22" rx="5" fill="#fff7ed" stroke="#ea580c" stroke-width="1.4"/>
    <text x="276" y="77" font-size="10" font-weight="800" fill="#c2410c" text-anchor="middle">Seam 12 | 13</text>

    <rect x="345" y="62" width="70" height="22" rx="5" fill="#fff7ed" stroke="#ea580c" stroke-width="1.4"/>
    <text x="380" y="77" font-size="10" font-weight="800" fill="#c2410c" text-anchor="middle">Seam 64 | 65</text>
  </g>

  <!-- Visual Deduplication Proof Box -->
  <rect x="24" y="276" width="552" height="142" rx="8" fill="#f0fdf4" stroke="#22c55e" stroke-width="1.8"/>
  <text x="36" y="298" font-size="12.5" font-weight="800" fill="#166534">How the 3-Step SOP Eliminates All 20 Redundant Points (34 → 14):</text>
  <text x="36" y="322" font-size="11" font-weight="700" fill="#15803d">1. Merge EP Nominals into BVA Centers (-4 pts): {2, 8, 30, 80} cover EP V₁..V₄ &amp; BVA nom.</text>
  <text x="36" y="344" font-size="11" font-weight="700" fill="#15803d">2. Merge Outer Invalids into Off-Points (-2 pts): {-1, 121} cover EP I₁, I₂ &amp; BVA min-, max+.</text>
  <text x="36" y="366" font-size="11" font-weight="700" fill="#15803d">3. Deduplicate Internal Seams (-6 pts): Seams {3|4, 12|13, 64|65} are tested ONCE, not twice!</text>
  <text x="36" y="388" font-size="11" font-weight="700" fill="#15803d">4. Use 2-Value BVA on Seams (-8 pts): Drop interior min+/max- {1, 2, 5, 11, 14, 63, 66, 119}.</text>
  <text x="36" y="408" font-size="11.5" font-weight="800" fill="#065f46">★ Final Count: 4 Valid Tiers × 3 pts {min, nom, max} (12) + 2 Outer Invalid {-1, 121} (2) = 14 pts!</text>
</svg>
