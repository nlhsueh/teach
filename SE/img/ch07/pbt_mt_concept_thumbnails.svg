<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 510" width="100%" height="100%">
  <defs>
    <style>
      .card-bg { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.8; rx: 12px; }
      .thumb-bg-blue { fill: #f0f9ff; stroke: #bae6fd; stroke-width: 1.2; rx: 8px; }
      .thumb-bg-indigo { fill: #eef2ff; stroke: #c7d2fe; stroke-width: 1.2; rx: 8px; }
      .thumb-bg-amber { fill: #fffbeb; stroke: #fde68a; stroke-width: 1.2; rx: 8px; }
      .thumb-bg-emerald { fill: #ecfdf5; stroke: #a7f3d0; stroke-width: 1.2; rx: 8px; }
      .thumb-bg-purple { fill: #faf5ff; stroke: #e9d5ff; stroke-width: 1.2; rx: 8px; }
      .thumb-bg-rose { fill: #fff1f2; stroke: #fecdd3; stroke-width: 1.2; rx: 8px; }
      .card-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 14px; font-weight: 800; fill: #0f172a; text-anchor: middle; }
      .card-sub { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; font-weight: 600; fill: #475569; text-anchor: middle; }
      .card-formula { font-family: "Fira Code", "Consolas", monospace; font-size: 10.5px; font-weight: 700; text-anchor: middle; }
      .mini-label { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 10.5px; font-weight: 700; text-anchor: middle; }
      .code-text { font-family: "Fira Code", "Consolas", monospace; font-size: 10.5px; font-weight: 700; text-anchor: middle; }
    </style>
    <marker id="arr-b" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#0284c7" />
    </marker>
    <marker id="arr-i" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#4f46e5" />
    </marker>
    <marker id="arr-a" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#d97706" />
    </marker>
    <marker id="arr-g" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#059669" />
    </marker>
    <marker id="arr-r" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#e11d48" />
    </marker>
  </defs>

  <!-- ==================== ROW 1: PBT CORE CONCEPTS (y=12..246) ==================== -->

  <!-- CARD 1: Property-Based Invariants (x=20..366) -->
  <g transform="translate(20, 12)">
    <rect width="346" height="232" class="card-bg" />
    <rect width="346" height="6" fill="#0284c7" rx="3" />
    <rect x="14" y="14" width="318" height="142" class="thumb-bg-blue" />

    <!-- Left side: Traditional EBT -->
    <rect x="24" y="24" width="130" height="122" fill="#ffffff" stroke="#bae6fd" rx="6" />
    <text x="89" y="40" class="mini-label" fill="#64748b">EBT (3 Fixed Points)</text>
    <circle cx="52" cy="70" r="5" fill="#16a34a" />
    <circle cx="85" cy="95" r="5" fill="#16a34a" />
    <circle cx="115" cy="65" r="5" fill="#16a34a" />
    <circle cx="132" cy="122" r="9" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5" />
    <text x="132" y="126" class="code-text" fill="#dc2626">!</text>
    <text x="72" y="136" font-family="sans-serif" font-size="10px" font-weight="700" fill="#dc2626" text-anchor="middle">Misses Edge Cliff</text>

    <path d="M 158 85 L 180 85" stroke="#0284c7" stroke-width="2.2" marker-end="url(#arr-b)" />

    <!-- Right side: PBT (1000 points + Invariant shield) -->
    <rect x="184" y="24" width="138" height="122" fill="#ffffff" stroke="#0284c7" stroke-width="1.5" rx="6" />
    <text x="253" y="40" class="mini-label" fill="#0369a1">PBT (@ForAll 1,000x)</text>
    <circle cx="204" cy="58" r="3.5" fill="#0284c7" />
    <circle cx="224" cy="64" r="3.5" fill="#0284c7" />
    <circle cx="248" cy="56" r="3.5" fill="#0284c7" />
    <circle cx="272" cy="66" r="3.5" fill="#0284c7" />
    <circle cx="298" cy="58" r="3.5" fill="#0284c7" />
    <circle cx="212" cy="82" r="3.5" fill="#0284c7" />
    <circle cx="238" cy="78" r="3.5" fill="#0284c7" />
    <circle cx="262" cy="84" r="3.5" fill="#0284c7" />
    <circle cx="288" cy="76" r="3.5" fill="#0284c7" />
    <circle cx="306" cy="86" r="4.5" fill="#dc2626" />
    <rect x="194" y="102" width="118" height="34" fill="#0284c7" rx="5" />
    <text x="253" y="116" font-family="sans-serif" font-size="10px" font-weight="700" fill="#ffffff" text-anchor="middle">Universal Invariant</text>
    <text x="253" y="131" font-family="monospace" font-size="9.5px" font-weight="700" fill="#e0f2fe" text-anchor="middle">Invariant(f(x)) == true</text>

    <text x="173" y="177" class="card-title">1. Property-Based Testing (PBT)</text>
    <text x="173" y="196" class="card-sub">Verifies universal invariants over 1,000+ inputs</text>
    <text x="173" y="216" class="card-formula" fill="#0284c7">@Property + @ForAll (1,000 Random Trials)</text>
  </g>

  <!-- CARD 2: Round-Trip & Conservation Invariants (x=387..733) -->
  <g transform="translate(387, 12)">
    <rect width="346" height="232" class="card-bg" />
    <rect width="346" height="6" fill="#4f46e5" rx="3" />
    <rect x="14" y="14" width="318" height="142" class="thumb-bg-indigo" />

    <rect x="28" y="60" width="78" height="44" fill="#ffffff" stroke="#4f46e5" stroke-width="2" rx="8" />
    <text x="67" y="79" class="mini-label" fill="#312e81">Original x</text>
    <text x="67" y="95" class="code-text" fill="#4f46e5">[1, 2, 3]</text>

    <rect x="136" y="26" width="76" height="32" fill="#4f46e5" rx="6" />
    <text x="174" y="46" font-family="sans-serif" font-size="10.5px" font-weight="700" fill="#ffffff" text-anchor="middle">Encode f(x)</text>

    <rect x="240" y="60" width="78" height="44" fill="#ffffff" stroke="#4f46e5" stroke-width="2" rx="8" />
    <text x="279" y="79" class="mini-label" fill="#312e81">Encoded y</text>
    <text x="279" y="95" class="code-text" fill="#4f46e5">[3, 2, 1]</text>

    <rect x="130" y="110" width="88" height="32" fill="#4338ca" rx="6" />
    <text x="174" y="130" font-family="sans-serif" font-size="10.5px" font-weight="700" fill="#ffffff" text-anchor="middle">Decode f⁻¹(y)</text>

    <path d="M 85 58 C 95 40, 115 40, 132 40" stroke="#4f46e5" stroke-width="2" fill="none" marker-end="url(#arr-i)" />
    <path d="M 214 40 C 235 40, 255 40, 265 56" stroke="#4f46e5" stroke-width="2" fill="none" marker-end="url(#arr-i)" />
    <path d="M 265 106 C 255 126, 235 126, 222 126" stroke="#4f46e5" stroke-width="2" fill="none" marker-end="url(#arr-i)" />
    <path d="M 128 126 C 110 126, 95 126, 85 108" stroke="#4f46e5" stroke-width="2" fill="none" marker-end="url(#arr-i)" />

    <text x="173" y="177" class="card-title">2. Round-Trip &amp; Conservation</text>
    <text x="173" y="196" class="card-sub">Encode-decode restores x; sort preserves elements</text>
    <text x="173" y="216" class="card-formula" fill="#4f46e5">decode(encode(x)) == x | size(sort(L)) == size(L)</text>
  </g>

  <!-- CARD 3: Test Case Shrinking (x=754..1100) -->
  <g transform="translate(754, 12)">
    <rect width="346" height="232" class="card-bg" />
    <rect width="346" height="6" fill="#d97706" rx="3" />
    <rect x="14" y="14" width="318" height="142" class="thumb-bg-amber" />

    <polygon points="36,30 310,30 235,108 111,108" fill="#fef3c7" stroke="#d97706" stroke-width="1.8" />
    <rect x="58" y="36" width="230" height="22" fill="#ffffff" stroke="#f59e0b" rx="4" />
    <text x="173" y="51" class="code-text" fill="#92400e">Random Hit: amount = 48,752 (FAIL)</text>
    <rect x="92" y="64" width="162" height="20" fill="#ffffff" stroke="#f59e0b" rx="4" />
    <text x="173" y="78" class="code-text" fill="#b45309">Shrink: 12,188 → 3,047</text>
    <path d="M 173 108 L 173 118" stroke="#d97706" stroke-width="2.2" marker-end="url(#arr-a)" />
    <rect x="70" y="120" width="206" height="28" fill="#dc2626" rx="6" />
    <text x="173" y="138" font-family="monospace" font-size="11.5px" font-weight="700" fill="#ffffff" text-anchor="middle">Minimal Seed: amount = 2901</text>

    <text x="173" y="177" class="card-title">3. Automatic Test Case Shrinking</text>
    <text x="173" y="196" class="card-sub">Binary-shrinks failing inputs to minimal edge seed</text>
    <text x="173" y="216" class="card-formula" fill="#b45309">Random Failure → Minimal Counterexample</text>
  </g>

  <!-- ==================== ROW 2: METAMORPHIC & AI TESTING (y=262..496) ==================== -->

  <!-- CARD 4: Metamorphic Testing (x=20..366) -->
  <g transform="translate(20, 262)">
    <rect width="346" height="232" class="card-bg" />
    <rect width="346" height="6" fill="#059669" rx="3" />
    <rect x="14" y="14" width="318" height="142" class="thumb-bg-emerald" />

    <!-- Top Track: Source Run -->
    <rect x="24" y="30" width="92" height="36" fill="#ffffff" stroke="#059669" stroke-width="1.8" rx="6" />
    <text x="70" y="45" class="mini-label" fill="#065f46">Source Input x</text>
    <text x="70" y="60" class="code-text" fill="#059669">"Java"</text>
    <path d="M 118 48 L 166 48" stroke="#059669" stroke-width="2" marker-end="url(#arr-g)" />
    <text x="142" y="41" class="code-text" fill="#047857">f(x)</text>
    <rect x="170" y="30" width="94" height="36" fill="#ffffff" stroke="#059669" stroke-width="1.8" rx="6" />
    <text x="217" y="45" class="mini-label" fill="#065f46">Output y</text>
    <text x="217" y="60" class="code-text" fill="#059669">3,842 Hits</text>

    <!-- Transform T arrow -->
    <path d="M 70 68 L 70 98" stroke="#059669" stroke-width="2" stroke-dasharray="4 2" marker-end="url(#arr-g)" />
    <text x="44" y="88" class="mini-label" fill="#047857">Trans T</text>

    <!-- Bottom Track: Follow-up Run -->
    <rect x="24" y="102" width="92" height="36" fill="#ffffff" stroke="#059669" stroke-width="1.8" rx="6" />
    <text x="70" y="117" class="mini-label" fill="#065f46">Follow-up x'</text>
    <text x="70" y="132" class="code-text" fill="#059669">"Java SQA"</text>
    <path d="M 118 120 L 166 120" stroke="#059669" stroke-width="2" marker-end="url(#arr-g)" />
    <text x="142" y="113" class="code-text" fill="#047857">f(x')</text>
    <rect x="170" y="102" width="94" height="36" fill="#ffffff" stroke="#059669" stroke-width="1.8" rx="6" />
    <text x="217" y="117" class="mini-label" fill="#065f46">Output y'</text>
    <text x="217" y="132" class="code-text" fill="#059669">128 Subset</text>

    <path d="M 266 48 L 284 48 L 284 120 L 266 120" stroke="#059669" stroke-width="2" fill="none" />
    <rect x="272" y="70" width="54" height="28" fill="#059669" rx="5" />
    <text x="299" y="88" font-family="monospace" font-size="11.5px" font-weight="700" fill="#ffffff" text-anchor="middle">y' ⊆ y</text>

    <text x="173" y="177" class="card-title">4. Metamorphic Testing (MT)</text>
    <text x="173" y="196" class="card-sub">Runs x and x'=T(x) to verify output relation MR</text>
    <text x="173" y="216" class="card-formula" fill="#059669">x' = T(x)  →  Verify MR( f(x), f(x') )</text>
  </g>

  <!-- CARD 5: Monotonicity & Symmetry Patterns (x=387..733) -->
  <g transform="translate(387, 262)">
    <rect width="346" height="232" class="card-bg" />
    <rect width="346" height="6" fill="#7c3aed" rx="3" />
    <rect x="14" y="14" width="318" height="142" class="thumb-bg-purple" />

    <!-- Left half: Tier Monotonicity Staircase -->
    <rect x="24" y="24" width="144" height="122" fill="#ffffff" stroke="#ddd6fe" rx="6" />
    <text x="96" y="40" class="mini-label" fill="#5b21b6">Tier Monotonicity</text>
    <rect x="38" y="96" width="30" height="32" fill="#7c3aed" rx="3" />
    <text x="53" y="91" class="code-text" fill="#5b21b6">$800</text>
    <text x="53" y="141" font-family="sans-serif" font-size="9.5px" font-weight="700" fill="#5b21b6" text-anchor="middle">VIP</text>

    <rect x="82" y="80" width="30" height="48" fill="#8b5cf6" rx="3" />
    <text x="97" y="75" class="code-text" fill="#5b21b6">$900</text>
    <text x="97" y="141" font-family="sans-serif" font-size="9.5px" font-weight="700" fill="#5b21b6" text-anchor="middle">REG</text>

    <rect x="126" y="60" width="30" height="68" fill="#a78bfa" rx="3" />
    <text x="141" y="55" class="code-text" fill="#5b21b6">$1000</text>
    <text x="141" y="141" font-family="sans-serif" font-size="9.5px" font-weight="700" fill="#5b21b6" text-anchor="middle">GUEST</text>

    <!-- Right half: Symmetry / Perturbation -->
    <rect x="178" y="24" width="144" height="122" fill="#ffffff" stroke="#ddd6fe" rx="6" />
    <text x="250" y="40" class="mini-label" fill="#5b21b6">Symmetry &amp; Noise</text>
    <rect x="190" y="52" width="120" height="26" fill="#f3e8ff" rx="4" />
    <text x="250" y="69" class="code-text" fill="#6b21a8">f(a,b,c) == f(b,c,a)</text>
    <rect x="190" y="86" width="120" height="26" fill="#f3e8ff" rx="4" />
    <text x="250" y="103" class="code-text" fill="#6b21a8">f("sqa") == f("SQA")</text>
    <text x="250" y="132" font-family="sans-serif" font-size="10px" font-weight="700" fill="#7c3aed" text-anchor="middle">Permutation / Case Invariant</text>

    <text x="173" y="177" class="card-title">5. Monotonicity &amp; Symmetry MRs</text>
    <text x="173" y="196" class="card-sub">VIP ≤ Regular ≤ Guest; order/case keeps output</text>
    <text x="173" y="216" class="card-formula" fill="#7c3aed">pay(VIP) ≤ pay(REG) ≤ pay(GUEST)</text>
  </g>

  <!-- CARD 6: Differential Testing & LLM-as-a-Judge (x=754..1100) -->
  <g transform="translate(754, 262)">
    <rect width="346" height="232" class="card-bg" />
    <rect width="346" height="6" fill="#e11d48" rx="3" />
    <rect x="14" y="14" width="318" height="142" class="thumb-bg-rose" />

    <rect x="24" y="66" width="68" height="40" fill="#ffffff" stroke="#e11d48" stroke-width="1.8" rx="6" />
    <text x="58" y="83" class="mini-label" fill="#9f1239">Test Input</text>
    <text x="58" y="98" class="code-text" fill="#e11d48">Prompt x</text>

    <path d="M 92 78 L 126 48" stroke="#e11d48" stroke-width="1.8" marker-end="url(#arr-r)" />
    <path d="M 92 94 L 126 122" stroke="#e11d48" stroke-width="1.8" marker-end="url(#arr-r)" />

    <rect x="130" y="28" width="88" height="36" fill="#ffffff" stroke="#fb7185" stroke-width="1.6" rx="6" />
    <text x="174" y="43" class="mini-label" fill="#881337">Baseline v1</text>
    <text x="174" y="58" class="code-text" fill="#e11d48">Model A(x)</text>

    <rect x="130" y="106" width="88" height="36" fill="#ffffff" stroke="#fb7185" stroke-width="1.6" rx="6" />
    <text x="174" y="121" class="mini-label" fill="#881337">Candidate v2</text>
    <text x="174" y="136" class="code-text" fill="#e11d48">Model B(x)</text>

    <path d="M 218 46 L 246 72" stroke="#e11d48" stroke-width="1.8" marker-end="url(#arr-r)" />
    <path d="M 218 124 L 246 98" stroke="#e11d48" stroke-width="1.8" marker-end="url(#arr-r)" />

    <rect x="248" y="52" width="74" height="66" fill="#e11d48" rx="8" />
    <text x="285" y="73" font-family="sans-serif" font-size="10.5px" font-weight="700" fill="#ffffff" text-anchor="middle">Diff / Judge</text>
    <text x="285" y="90" font-family="monospace" font-size="10.5px" font-weight="700" fill="#ffe4e6" text-anchor="middle">Sim ≥ 0.85</text>
    <text x="285" y="106" font-family="sans-serif" font-size="9.5px" font-weight="700" fill="#ffffff" text-anchor="middle">Quality Gate</text>

    <text x="173" y="177" class="card-title">6. Differential &amp; LLM-as-a-Judge</text>
    <text x="173" y="196" class="card-sub">Cross-model diff check &amp; rubric AI evaluation</text>
    <text x="173" y="216" class="card-formula" fill="#e11d48">Differential(v1, v2) + Judge Score ≥ 0.90</text>
  </g>
</svg>
