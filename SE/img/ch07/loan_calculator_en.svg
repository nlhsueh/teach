<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 580" width="440" height="580">
  <defs>
    <filter id="card-shadow" x="-8%" y="-6%" width="116%" height="114%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#0f172a" flood-opacity="0.08" />
    </filter>
    <linearGradient id="btn-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>
  </defs>

  <!-- Background Card -->
  <rect x="10" y="10" width="420" height="560" rx="18" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.8" filter="url(#card-shadow)" />

  <!-- Top Decorative Header Bar -->
  <rect x="10" y="10" width="420" height="8" rx="4" fill="#0284c7" />

  <!-- Main Title -->
  <text x="220" y="58" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="21" font-weight="800" fill="#0f2742" text-anchor="middle">Mortgage Interest Rate Calculator</text>

  <!-- Field 1: Loan Amount -->
  <g transform="translate(36, 88)">
    <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#334155">Loan Amount</text>
    <rect x="0" y="10" width="368" height="46" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.4" />
    <text x="16" y="40" font-family="'Fira Code', 'SF Mono', Consolas, monospace" font-size="18" font-weight="700" fill="#0f172a">$ 10,000,000</text>
    <rect x="296" y="18" width="60" height="30" rx="6" fill="#e2e8f0" />
    <text x="326" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#475569" text-anchor="middle">USD</text>
  </g>

  <!-- Field 2: Repayment Term -->
  <g transform="translate(36, 172)">
    <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#334155">Repayment Term</text>
    <rect x="0" y="10" width="368" height="46" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.4" />
    <text x="16" y="40" font-family="'Fira Code', 'SF Mono', Consolas, monospace" font-size="18" font-weight="700" fill="#0f172a">20</text>
    <rect x="286" y="18" width="70" height="30" rx="6" fill="#e2e8f0" />
    <text x="321" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#475569" text-anchor="middle">Years</text>
  </g>

  <!-- Switch 1: Club Membership -->
  <g transform="translate(36, 258)">
    <circle cx="10" cy="18" r="7" fill="#ef4444" />
    <text x="28" y="23" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#1e293b">Club Membership (<tspan font-family="'Fira Code', monospace" font-size="13" fill="#0284c7">isMember</tspan>)</text>
    <!-- Toggle Switch (ON) -->
    <rect x="296" y="3" width="72" height="32" rx="16" fill="#0284c7" />
    <text x="320" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="800" fill="#ffffff">YES</text>
    <circle cx="352" cy="19" r="12" fill="#ffffff" />
  </g>

  <!-- Switch 2: Youth Mortgage Benefit -->
  <g transform="translate(36, 314)">
    <circle cx="10" cy="18" r="7" fill="#f59e0b" />
    <text x="28" y="23" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#1e293b">Youth Benefit (<tspan font-family="'Fira Code', monospace" font-size="13" fill="#0284c7">isYouth</tspan>)</text>
    <!-- Toggle Switch (ON) -->
    <rect x="296" y="3" width="72" height="32" rx="16" fill="#0284c7" />
    <text x="320" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="800" fill="#ffffff">YES</text>
    <circle cx="352" cy="19" r="12" fill="#ffffff" />
  </g>

  <!-- Action Button -->
  <g transform="translate(36, 372)">
    <rect x="0" y="0" width="368" height="48" rx="24" fill="url(#btn-grad)" />
    <text x="184" y="30" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16.5" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="0.5">Calculate Lending Rate</text>
  </g>

  <!-- Result Box -->
  <g transform="translate(36, 442)">
    <rect x="0" y="0" width="368" height="74" rx="12" fill="#f0f9ff" stroke="#bae6fd" stroke-width="1.5" />
    <text x="184" y="36" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#0369a1" text-anchor="middle">Calculated Lending Rate : <tspan font-size="23" font-weight="900" fill="#0284c7">1.85%</tspan></text>
    <text x="184" y="58" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#64748b" text-anchor="middle">*For illustration only, subject to final credit approval</text>
  </g>

  <!-- Footnote -->
  <text x="220" y="546" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#0284c7" text-anchor="middle">Input Domain: 3 × 3 × 2 × 2 = 36 Combinations → 9 Pairwise Cases</text>
</svg>
