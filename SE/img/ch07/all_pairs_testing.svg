<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 500" width="100%" height="100%">
  <defs>
    <style>
      .font-sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
      .font-mono { font-family: "Fira Code", "Consolas", monospace; }
    </style>
    <marker id="arr-down" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#0284c7" />
    </marker>
  </defs>

  <!-- ================= TOP CARD: EXHAUSTIVE 3D COMBINATORIAL GRID ================= -->
  <g transform="translate(15, 10)">
    <rect width="490" height="190" rx="14" fill="#ffffff" stroke="#fca5a5" stroke-width="2.2" />
    <path d="M 0 14 Q 0 0 14 0 L 476 0 Q 490 0 490 14 L 490 36 L 0 36 Z" fill="#ef4444" />
    <text x="245" y="24" class="font-sans" font-size="14.5" font-weight="800" fill="#ffffff" text-anchor="middle">Exhaustive 3-Way Grid (3 × 2 × 2 = 12 Combinations)</text>

    <!-- 3 Layers of 3x2 Grids (Showing all 12 Cartesian nodes) -->
    <!-- Layer 1: Time = Morning (t1) -->
    <g transform="translate(32, 54)">
      <rect width="128" height="118" rx="8" fill="#fef2f2" stroke="#fecaca" stroke-width="1.5" />
      <text x="64" y="20" class="font-sans" font-size="12" font-weight="800" fill="#b91c1c" text-anchor="middle">Morning (t₁)</text>
      <!-- 2x2 grid for Day x Member -->
      <circle cx="42" cy="52" r="11" fill="#ef4444" />
      <circle cx="86" cy="52" r="11" fill="#ef4444" />
      <circle cx="42" cy="92" r="11" fill="#ef4444" />
      <circle cx="86" cy="92" r="11" fill="#ef4444" />
      <line x1="42" y1="52" x2="86" y2="52" stroke="#fca5a5" stroke-width="1.5" />
      <line x1="42" y1="92" x2="86" y2="92" stroke="#fca5a5" stroke-width="1.5" />
      <line x1="42" y1="52" x2="42" y2="92" stroke="#fca5a5" stroke-width="1.5" />
      <line x1="86" y1="52" x2="86" y2="92" stroke="#fca5a5" stroke-width="1.5" />
    </g>

    <!-- Layer 2: Time = Noon (t2) -->
    <g transform="translate(181, 54)">
      <rect width="128" height="118" rx="8" fill="#fef2f2" stroke="#fecaca" stroke-width="1.5" />
      <text x="64" y="20" class="font-sans" font-size="12" font-weight="800" fill="#b91c1c" text-anchor="middle">Noon (t₂)</text>
      <circle cx="42" cy="52" r="11" fill="#ef4444" />
      <circle cx="86" cy="52" r="11" fill="#ef4444" />
      <circle cx="42" cy="92" r="11" fill="#ef4444" />
      <circle cx="86" cy="92" r="11" fill="#ef4444" />
      <line x1="42" y1="52" x2="86" y2="52" stroke="#fca5a5" stroke-width="1.5" />
      <line x1="42" y1="92" x2="86" y2="92" stroke="#fca5a5" stroke-width="1.5" />
      <line x1="42" y1="52" x2="42" y2="92" stroke="#fca5a5" stroke-width="1.5" />
      <line x1="86" y1="52" x2="86" y2="92" stroke="#fca5a5" stroke-width="1.5" />
    </g>

    <!-- Layer 3: Time = Other (t3) -->
    <g transform="translate(330, 54)">
      <rect width="128" height="118" rx="8" fill="#fef2f2" stroke="#fecaca" stroke-width="1.5" />
      <text x="64" y="20" class="font-sans" font-size="12" font-weight="800" fill="#b91c1c" text-anchor="middle">Other (t₃)</text>
      <circle cx="42" cy="52" r="11" fill="#ef4444" />
      <circle cx="86" cy="52" r="11" fill="#ef4444" />
      <circle cx="42" cy="92" r="11" fill="#ef4444" />
      <circle cx="86" cy="92" r="11" fill="#ef4444" />
      <line x1="42" y1="52" x2="86" y2="52" stroke="#fca5a5" stroke-width="1.5" />
      <line x1="42" y1="92" x2="86" y2="92" stroke="#fca5a5" stroke-width="1.5" />
      <line x1="42" y1="52" x2="42" y2="92" stroke="#fca5a5" stroke-width="1.5" />
      <line x1="86" y1="52" x2="86" y2="92" stroke="#fca5a5" stroke-width="1.5" />
    </g>
  </g>

  <!-- ================= CENTER COMPRESSION ARROW ================= -->
  <g transform="translate(260, 206)">
    <line x1="0" y1="0" x2="0" y2="36" stroke="#0284c7" stroke-width="4" marker-end="url(#arr-down)" />
    <rect x="-135" y="5" width="270" height="26" rx="13" fill="#0284c7" />
    <text x="0" y="22" class="font-sans" font-size="12.5" font-weight="800" fill="#ffffff" text-anchor="middle">2-Way Pairwise Sampling (-50%)</text>
  </g>

  <!-- ================= BOTTOM CARD: PAIRWISE 2-WAY SCHEMATIC ================= -->
  <g transform="translate(15, 252)">
    <rect width="490" height="236" rx="14" fill="#ffffff" stroke="#10b981" stroke-width="2.2" />
    <path d="M 0 14 Q 0 0 14 0 L 476 0 Q 490 0 490 14 L 490 36 L 0 36 Z" fill="#059669" />
    <text x="245" y="24" class="font-sans" font-size="14.5" font-weight="800" fill="#ffffff" text-anchor="middle">Pairwise Selection (Only 6 Diagonal Dots Cover All 16 Pairs!)</text>

    <!-- Layer 1: Morning (t1) — Diagonal Pick (d1,m1) & (d2,m2) -->
    <g transform="translate(32, 52)">
      <rect width="128" height="126" rx="8" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="1.5" />
      <text x="64" y="20" class="font-sans" font-size="12" font-weight="800" fill="#065f46" text-anchor="middle">Morning (t₁)</text>
      <text x="42" y="38" class="font-mono" font-size="10" font-weight="700" fill="#64748b" text-anchor="middle">m₁</text>
      <text x="86" y="38" class="font-mono" font-size="10" font-weight="700" fill="#64748b" text-anchor="middle">m₂</text>
      <text x="16" y="60" class="font-mono" font-size="10" font-weight="700" fill="#64748b" text-anchor="middle">d₁</text>
      <text x="16" y="100" class="font-mono" font-size="10" font-weight="700" fill="#64748b" text-anchor="middle">d₂</text>

      <!-- Selected: (d1, m1) and (d2, m2) -->
      <circle cx="42" cy="56" r="12" fill="#10b981" stroke="#047857" stroke-width="2" />
      <text x="42" y="60" class="font-sans" font-size="11" font-weight="900" fill="#ffffff" text-anchor="middle">✓</text>
      <circle cx="86" cy="56" r="10" fill="none" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="3 3" />

      <circle cx="42" cy="96" r="10" fill="none" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="3 3" />
      <circle cx="86" cy="96" r="12" fill="#10b981" stroke="#047857" stroke-width="2" />
      <text x="86" y="100" class="font-sans" font-size="11" font-weight="900" fill="#ffffff" text-anchor="middle">✓</text>
    </g>

    <!-- Layer 2: Noon (t2) — Opposite Diagonal Pick (d1,m2) & (d2,m1) -->
    <g transform="translate(181, 52)">
      <rect width="128" height="126" rx="8" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="1.5" />
      <text x="64" y="20" class="font-sans" font-size="12" font-weight="800" fill="#065f46" text-anchor="middle">Noon (t₂)</text>
      <text x="42" y="38" class="font-mono" font-size="10" font-weight="700" fill="#64748b" text-anchor="middle">m₁</text>
      <text x="86" y="38" class="font-mono" font-size="10" font-weight="700" fill="#64748b" text-anchor="middle">m₂</text>

      <circle cx="42" cy="56" r="10" fill="none" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="3 3" />
      <circle cx="86" cy="56" r="12" fill="#10b981" stroke="#047857" stroke-width="2" />
      <text x="86" y="60" class="font-sans" font-size="11" font-weight="900" fill="#ffffff" text-anchor="middle">✓</text>

      <circle cx="42" cy="96" r="12" fill="#10b981" stroke="#047857" stroke-width="2" />
      <text x="42" y="100" class="font-sans" font-size="11" font-weight="900" fill="#ffffff" text-anchor="middle">✓</text>
      <circle cx="86" cy="96" r="10" fill="none" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="3 3" />
    </g>

    <!-- Layer 3: Other (t3) — Diagonal Pick (d1,m1) & (d2,m2) -->
    <g transform="translate(330, 52)">
      <rect width="128" height="126" rx="8" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="1.5" />
      <text x="64" y="20" class="font-sans" font-size="12" font-weight="800" fill="#065f46" text-anchor="middle">Other (t₃)</text>
      <text x="42" y="38" class="font-mono" font-size="10" font-weight="700" fill="#64748b" text-anchor="middle">m₁</text>
      <text x="86" y="38" class="font-mono" font-size="10" font-weight="700" fill="#64748b" text-anchor="middle">m₂</text>

      <circle cx="42" cy="56" r="12" fill="#10b981" stroke="#047857" stroke-width="2" />
      <text x="42" y="60" class="font-sans" font-size="11" font-weight="900" fill="#ffffff" text-anchor="middle">✓</text>
      <circle cx="86" cy="56" r="10" fill="none" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="3 3" />

      <circle cx="42" cy="96" r="10" fill="none" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="3 3" />
      <circle cx="86" cy="96" r="12" fill="#10b981" stroke="#047857" stroke-width="2" />
      <text x="86" y="100" class="font-sans" font-size="11" font-weight="900" fill="#ffffff" text-anchor="middle">✓</text>
    </g>

    <!-- Bottom 2-Way Coverage Proof Badges -->
    <g transform="translate(32, 190)">
      <rect width="134" height="32" rx="8" fill="#d1fae5" stroke="#10b981" stroke-width="1.5" />
      <text x="67" y="21" class="font-sans" font-size="12" font-weight="800" fill="#065f46" text-anchor="middle">✓ Time × Day (6/6)</text>
    </g>
    <g transform="translate(178, 190)">
      <rect width="134" height="32" rx="8" fill="#d1fae5" stroke="#10b981" stroke-width="1.5" />
      <text x="67" y="21" class="font-sans" font-size="12" font-weight="800" fill="#065f46" text-anchor="middle">✓ Time × Mem (6/6)</text>
    </g>
    <g transform="translate(324, 190)">
      <rect width="134" height="32" rx="8" fill="#d1fae5" stroke="#10b981" stroke-width="1.5" />
      <text x="67" y="21" class="font-sans" font-size="12" font-weight="800" fill="#065f46" text-anchor="middle">✓ Day × Mem (4/4)</text>
    </g>
  </g>
</svg>
