<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 540" width="100%" height="100%">
  <defs>
    <style>
      .font-sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
      .font-mono { font-family: "Fira Code", "Consolas", monospace; }
      .panel-verify { fill: #ffffff; stroke: #38bdf8; stroke-width: 2.5; rx: 16px; }
      .panel-valid  { fill: #ffffff; stroke: #10b981; stroke-width: 2.5; rx: 16px; }
      .pill-verify  { fill: #f0f9ff; stroke: #bae6fd; stroke-width: 1.5; rx: 10px; }
      .pill-valid   { fill: #ecfdf5; stroke: #a7f3d0; stroke-width: 1.5; rx: 10px; }
    </style>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#0284c7" />
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#059669" />
    </marker>
  </defs>

  <!-- ================= LEFT PANEL: VERIFICATION ================= -->
  <g transform="translate(20, 15)">
    <rect width="555" height="510" class="panel-verify" />
    <!-- Top Accent Header -->
    <path d="M 0 16 Q 0 0 16 0 L 539 0 Q 555 0 555 16 L 555 82 L 0 82 Z" fill="#0284c7" />
    <text x="277" y="34" class="font-sans" font-size="23" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="1">VERIFICATION (Process &amp; Spec Focus)</text>
    <text x="277" y="64" class="font-sans" font-size="18" font-weight="600" fill="#e0f2fe" text-anchor="middle" font-style="italic">“Are we building the product right?”</text>

    <!-- Visual Schematic Area -->
    <rect x="24" y="98" width="507" height="205" rx="12" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5" />

    <!-- Left Node: SRS / Blueprint Specification -->
    <g transform="translate(46, 118)">
      <rect width="142" height="162" rx="10" fill="#ffffff" stroke="#0284c7" stroke-width="2.2" />
      <rect x="0" y="0" width="142" height="32" rx="8" fill="#e0f2fe" />
      <text x="71" y="21" class="font-sans" font-size="13.5" font-weight="800" fill="#0369a1" text-anchor="middle">SRS &amp; Design Spec</text>
      <!-- Blueprint lines -->
      <rect x="16" y="46" width="22" height="14" rx="3" fill="#0284c7" />
      <text x="27" y="57" class="font-mono" font-size="9.5" font-weight="700" fill="#ffffff" text-anchor="middle">R1</text>
      <rect x="46" y="49" width="78" height="8" rx="4" fill="#94a3b8" />

      <rect x="16" y="72" width="22" height="14" rx="3" fill="#0284c7" />
      <text x="27" y="83" class="font-mono" font-size="9.5" font-weight="700" fill="#ffffff" text-anchor="middle">R2</text>
      <rect x="46" y="75" width="68" height="8" rx="4" fill="#94a3b8" />

      <rect x="16" y="98" width="22" height="14" rx="3" fill="#0284c7" />
      <text x="27" y="109" class="font-mono" font-size="9.5" font-weight="700" fill="#ffffff" text-anchor="middle">R3</text>
      <rect x="46" y="101" width="74" height="8" rx="4" fill="#94a3b8" />

      <text x="71" y="144" class="font-sans" font-size="12" font-weight="700" fill="#475569" text-anchor="middle">Upstream Baseline</text>
    </g>

    <!-- Center Verification Arrow & Inspector Badge -->
    <g transform="translate(202, 165)">
      <line x1="0" y1="35" x2="142" y2="35" stroke="#0284c7" stroke-width="3.5" marker-end="url(#arrow-blue)" />
      <rect x="16" y="-8" width="114" height="32" rx="16" fill="#0284c7" />
      <text x="73" y="13" class="font-sans" font-size="12.5" font-weight="800" fill="#ffffff" text-anchor="middle">Conforms?</text>
      <text x="73" y="60" class="font-sans" font-size="11.5" font-weight="700" fill="#0369a1" text-anchor="middle">Review / Static / Unit</text>
    </g>

    <!-- Right Node: Source Code & Implementation Artifact -->
    <g transform="translate(362, 118)">
      <rect width="146" height="162" rx="10" fill="#ffffff" stroke="#0284c7" stroke-width="2.2" />
      <rect x="0" y="0" width="146" height="32" rx="8" fill="#0f172a" />
      <circle cx="16" cy="16" r="4.5" fill="#ef4444" />
      <circle cx="30" cy="16" r="4.5" fill="#f59e0b" />
      <circle cx="44" cy="16" r="4.5" fill="#10b981" />
      <text x="95" y="21" class="font-mono" font-size="11.5" font-weight="700" fill="#e2e8f0" text-anchor="middle">Module.java</text>

      <text x="16" y="56" class="font-mono" font-size="12" font-weight="700" fill="#0284c7">if (valid) {</text>
      <text x="26" y="76" class="font-mono" font-size="12" font-weight="700" fill="#334155">exec(R1, R2);</text>
      <text x="26" y="96" class="font-mono" font-size="12" font-weight="700" fill="#15803d">return PASS;</text>
      <text x="16" y="114" class="font-mono" font-size="12" font-weight="700" fill="#0284c7">}</text>

      <!-- Checkmark badge -->
      <circle cx="118" cy="108" r="16" fill="#dcfce7" stroke="#16a34a" stroke-width="2" />
      <path d="M 111 108 L 116 114 L 126 102" fill="none" stroke="#16a34a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
      <text x="73" y="144" class="font-sans" font-size="12" font-weight="700" fill="#475569" text-anchor="middle">Built Artifact</text>
    </g>

    <!-- 3 Key Dimension Pills -->
    <g transform="translate(24, 320)">
      <rect width="507" height="50" class="pill-verify" />
      <text x="18" y="22" class="font-sans" font-size="13.5" font-weight="800" fill="#0369a1">1. Evaluation Target</text>
      <text x="18" y="41" class="font-sans" font-size="13.5" font-weight="600" fill="#334155">Checks design docs, code &amp; modules against upstream specifications</text>
    </g>
    <g transform="translate(24, 380)">
      <rect width="507" height="50" class="pill-verify" />
      <text x="18" y="22" class="font-sans" font-size="13.5" font-weight="800" fill="#0369a1">2. Core Engineering Techniques</text>
      <text x="18" y="41" class="font-sans" font-size="13.5" font-weight="600" fill="#334155">Inspections, peer code reviews, static analysis (AST), unit &amp; API tests</text>
    </g>
    <g transform="translate(24, 440)">
      <rect width="507" height="50" class="pill-verify" />
      <text x="18" y="22" class="font-sans" font-size="13.5" font-weight="800" fill="#0369a1">3. Lifecycle Timing &amp; Cost</text>
      <text x="18" y="41" class="font-sans" font-size="13.5" font-weight="600" fill="#334155">Continuous across all SDLC phases (Shift-Left; lowest defect fix cost)</text>
    </g>
  </g>

  <!-- ================= CENTER VS BADGE ================= -->
  <g transform="translate(600, 270)">
    <circle cx="0" cy="0" r="24" fill="#0f172a" stroke="#ffffff" stroke-width="3" />
    <text x="0" y="6" class="font-sans" font-size="16" font-weight="900" fill="#ffffff" text-anchor="middle">VS</text>
  </g>

  <!-- ================= RIGHT PANEL: VALIDATION ================= -->
  <g transform="translate(625, 15)">
    <rect width="555" height="510" class="panel-valid" />
    <!-- Top Accent Header -->
    <path d="M 0 16 Q 0 0 16 0 L 539 0 Q 555 0 555 16 L 555 82 L 0 82 Z" fill="#059669" />
    <text x="277" y="34" class="font-sans" font-size="23" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="1">VALIDATION (Product &amp; User Value)</text>
    <text x="277" y="64" class="font-sans" font-size="18" font-weight="600" fill="#d1fae5" text-anchor="middle" font-style="italic">“Are we building the right product?”</text>

    <!-- Visual Schematic Area -->
    <rect x="24" y="98" width="507" height="205" rx="12" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5" />

    <!-- Left Node: Deployed Running System -->
    <g transform="translate(46, 118)">
      <rect width="146" height="162" rx="10" fill="#ffffff" stroke="#059669" stroke-width="2.2" />
      <rect x="0" y="0" width="146" height="32" rx="8" fill="#d1fae5" />
      <text x="73" y="21" class="font-sans" font-size="13.5" font-weight="800" fill="#065f46" text-anchor="middle">Running Product</text>
      <!-- App UI Window schematic -->
      <rect x="16" y="44" width="114" height="34" rx="6" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="1.5" />
      <text x="73" y="65" class="font-sans" font-size="12" font-weight="700" fill="#047857" text-anchor="middle">End-to-End Flow</text>
      <rect x="24" y="90" width="98" height="26" rx="13" fill="#10b981" />
      <text x="73" y="107" class="font-sans" font-size="12" font-weight="800" fill="#ffffff" text-anchor="middle">Deliver Value</text>
      <text x="73" y="144" class="font-sans" font-size="12" font-weight="700" fill="#475569" text-anchor="middle">Integrated System</text>
    </g>

    <!-- Center Validation Arrow -->
    <g transform="translate(206, 165)">
      <line x1="0" y1="35" x2="142" y2="35" stroke="#059669" stroke-width="3.5" marker-end="url(#arrow-green)" />
      <rect x="14" y="-8" width="118" height="32" rx="16" fill="#059669" />
      <text x="73" y="13" class="font-sans" font-size="12.5" font-weight="800" fill="#ffffff" text-anchor="middle">Solves Need?</text>
      <text x="73" y="60" class="font-sans" font-size="11.5" font-weight="700" fill="#047857" text-anchor="middle">UAT / Beta / Field Use</text>
    </g>

    <!-- Right Node: Real User & Operational Environment -->
    <g transform="translate(362, 118)">
      <rect width="146" height="162" rx="10" fill="#ffffff" stroke="#059669" stroke-width="2.2" />
      <rect x="0" y="0" width="146" height="32" rx="8" fill="#d1fae5" />
      <text x="73" y="21" class="font-sans" font-size="13.5" font-weight="800" fill="#065f46" text-anchor="middle">Customer &amp; Context</text>

      <!-- Clean User Avatar Icon -->
      <circle cx="73" cy="64" r="18" fill="#10b981" />
      <path d="M 43 114 C 43 92, 103 92, 103 114 Z" fill="#10b981" />

      <!-- Approval Star / Check Badge -->
      <circle cx="114" cy="60" r="15" fill="#fef3c7" stroke="#f59e0b" stroke-width="2" />
      <path d="M 108 60 L 113 65 L 121 54" fill="none" stroke="#d97706" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" />

      <text x="73" y="144" class="font-sans" font-size="12" font-weight="700" fill="#475569" text-anchor="middle">Real User Workflow</text>
    </g>

    <!-- 3 Key Dimension Pills -->
    <g transform="translate(24, 320)">
      <rect width="507" height="50" class="pill-valid" />
      <text x="18" y="22" class="font-sans" font-size="13.5" font-weight="800" fill="#065f46">1. Evaluation Target</text>
      <text x="18" y="41" class="font-sans" font-size="13.5" font-weight="600" fill="#334155">Validates the actual running product against real user needs &amp; context</text>
    </g>
    <g transform="translate(24, 380)">
      <rect width="507" height="50" class="pill-valid" />
      <text x="18" y="22" class="font-sans" font-size="13.5" font-weight="800" fill="#065f46">2. Core Engineering Techniques</text>
      <text x="18" y="41" class="font-sans" font-size="13.5" font-weight="600" fill="#334155">User Acceptance Testing (UAT), Beta field trials, usability &amp; scenario tests</text>
    </g>
    <g transform="translate(24, 440)">
      <rect width="507" height="50" class="pill-valid" />
      <text x="18" y="22" class="font-sans" font-size="13.5" font-weight="800" fill="#065f46">3. Classic Failure Warning (Principle 7)</text>
      <text x="18" y="41" class="font-sans" font-size="13.5" font-weight="600" fill="#334155">100% verified against an outdated spec still fails if users cannot use it!</text>
    </g>
  </g>
</svg>
