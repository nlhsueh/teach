<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 500" width="100%" height="100%">
  <defs>
    <linearGradient id="sky-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f0f9ff" />
      <stop offset="100%" stop-color="#e0f2fe" />
    </linearGradient>
    <linearGradient id="sea-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0369a1" />
      <stop offset="45%" stop-color="#0b3c5d" />
      <stop offset="100%" stop-color="#082032" />
    </linearGradient>
    <linearGradient id="ice-top" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#bae6fd" />
    </linearGradient>
    <linearGradient id="ice-sub" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.88" />
      <stop offset="60%" stop-color="#0284c7" stop-opacity="0.82" />
      <stop offset="100%" stop-color="#1e3a8a" stop-opacity="0.88" />
    </linearGradient>
  </defs>

  <!-- Outer Rounded Portrait Card -->
  <rect x="8" y="8" width="404" height="484" rx="18" fill="url(#sky-grad)" stroke="#cbd5e1" stroke-width="2" />

  <!-- Deep Sea Bottom Section (y=176..492) -->
  <path d="M 8 176 L 412 176 L 412 474 A 18 18 0 0 1 394 492 L 26 492 A 18 18 0 0 1 8 474 Z" fill="url(#sea-grad)" />

  <!-- Top Section Header Pill -->
  <rect x="24" y="20" width="215" height="24" rx="12" fill="#0284c7" />
  <text x="131" y="36" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="800" fill="#ffffff" text-anchor="middle">ABOVE WATER (~20%): DYNAMIC TEST</text>

  <!-- Iceberg Tip (Above Waterline y=58..176) -->
  <polygon points="150,176 184,96 208,112 232,64 265,118 282,110 315,176" fill="url(#ice-top)" stroke="#38bdf8" stroke-width="2" stroke-linejoin="round" />
  <polygon points="232,64 224,122 252,176 315,176 282,110 265,118" fill="#7dd3fc" fill-opacity="0.55" />

  <!-- Above-Water Concise Labels -->
  <g transform="translate(22, 60)">
    <rect width="146" height="42" rx="8" fill="#ffffff" stroke="#7dd3fc" stroke-width="1.5" />
    <text x="73" y="18" font-family="sans-serif" font-size="12" font-weight="800" fill="#0369a1" text-anchor="middle">Runtime Failures</text>
    <text x="73" y="34" font-family="sans-serif" font-size="10.5" font-weight="600" fill="#475569" text-anchor="middle">Crashes &amp; Wrong Outputs</text>
  </g>
  <g transform="translate(262, 60)">
    <rect width="136" height="42" rx="8" fill="#ffffff" stroke="#7dd3fc" stroke-width="1.5" />
    <text x="68" y="18" font-family="sans-serif" font-size="12" font-weight="800" fill="#0369a1" text-anchor="middle">Executed Paths</text>
    <text x="68" y="34" font-family="sans-serif" font-size="10.5" font-weight="600" fill="#475569" text-anchor="middle">Input-Triggered Only</text>
  </g>

  <!-- Waterline Divider -->
  <line x1="12" y1="176" x2="408" y2="176" stroke="#38bdf8" stroke-width="3.5" stroke-dasharray="8 4" />
  <rect x="148" y="165" width="124" height="22" rx="11" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5" />
  <text x="210" y="180" font-family="monospace" font-size="11" font-weight="800" fill="#38bdf8" text-anchor="middle">~ WATERLINE ~</text>

  <!-- Massive Submerged Iceberg Mass (Below Waterline y=176..470) -->
  <polygon points="150,176 92,238 78,318 112,402 174,454 218,476 276,438 332,372 346,274 315,176" fill="url(#ice-sub)" stroke="#38bdf8" stroke-width="2" stroke-linejoin="round" />
  <!-- Internal Facet Lines -->
  <polyline points="184,176 146,270 174,454" fill="none" stroke="#bae6fd" stroke-width="1.2" stroke-opacity="0.45" />
  <polyline points="262,176 284,292 218,476" fill="none" stroke="#bae6fd" stroke-width="1.2" stroke-opacity="0.45" />
  <line x1="92" y1="238" x2="346" y2="274" stroke="#bae6fd" stroke-width="1" stroke-opacity="0.3" />
  <line x1="78" y1="318" x2="332" y2="372" stroke="#bae6fd" stroke-width="1" stroke-opacity="0.3" />

  <!-- Submerged Section Header Pill -->
  <rect x="24" y="196" width="236" height="24" rx="12" fill="#f59e0b" />
  <text x="142" y="212" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="800" fill="#0f172a" text-anchor="middle">BELOW WATER (~80%): STATIC REVIEW</text>

  <!-- 4 Concise Submerged Defect Badges Inside / Across Iceberg -->
  <g transform="translate(36, 232)">
    <rect width="166" height="50" rx="9" fill="#0f172a" fill-opacity="0.86" stroke="#38bdf8" stroke-width="1.5" />
    <text x="83" y="21" font-family="sans-serif" font-size="12.5" font-weight="800" fill="#38bdf8" text-anchor="middle">1. SRS &amp; Design Flaws</text>
    <text x="83" y="38" font-family="sans-serif" font-size="10.5" font-weight="600" fill="#e2e8f0" text-anchor="middle">Missing / Ambiguous Specs</text>
  </g>

  <g transform="translate(218, 232)">
    <rect width="166" height="50" rx="9" fill="#0f172a" fill-opacity="0.86" stroke="#38bdf8" stroke-width="1.5" />
    <text x="83" y="21" font-family="sans-serif" font-size="12.5" font-weight="800" fill="#38bdf8" text-anchor="middle">2. Unexecuted Paths</text>
    <text x="83" y="38" font-family="sans-serif" font-size="10.5" font-weight="600" fill="#e2e8f0" text-anchor="middle">Masked Off-by-One &amp; Branches</text>
  </g>

  <g transform="translate(36, 296)">
    <rect width="166" height="50" rx="9" fill="#0f172a" fill-opacity="0.86" stroke="#fbbf24" stroke-width="1.5" />
    <text x="83" y="21" font-family="sans-serif" font-size="12.5" font-weight="800" fill="#fde047" text-anchor="middle">3. Code Smells &amp; Debt</text>
    <text x="83" y="38" font-family="sans-serif" font-size="10.5" font-weight="600" fill="#e2e8f0" text-anchor="middle">God Classes &amp; Duplication</text>
  </g>

  <g transform="translate(218, 296)">
    <rect width="166" height="50" rx="9" fill="#0f172a" fill-opacity="0.86" stroke="#f87171" stroke-width="1.5" />
    <text x="83" y="21" font-family="sans-serif" font-size="12.5" font-weight="800" fill="#fca5a5" text-anchor="middle">4. Latent Security Bugs</text>
    <text x="83" y="38" font-family="sans-serif" font-size="10.5" font-weight="600" fill="#e2e8f0" text-anchor="middle">OWASP SQLi, Leaks &amp; Races</text>
  </g>

  <!-- Bottom Takeaway Banner -->
  <g transform="translate(36, 366)">
    <rect width="348" height="44" rx="10" fill="#0284c7" fill-opacity="0.35" stroke="#7dd3fc" stroke-width="1.5" />
    <text x="174" y="19" font-family="sans-serif" font-size="12" font-weight="800" fill="#ffffff" text-anchor="middle">Static Inspection Drains the Waterline</text>
    <text x="174" y="35" font-family="monospace" font-size="11" font-weight="700" fill="#bae6fd" text-anchor="middle">Removes ~70% of Defects Before Execution!</text>
  </g>
</svg>
