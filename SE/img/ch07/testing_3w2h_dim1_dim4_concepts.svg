<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 510" width="100%" height="100%">
  <defs>
    <style>
      .frame-bg { fill: #ffffff; stroke-width: 2.2; rx: 14px; }
      .sub-card { fill: #ffffff; stroke-width: 1.6; rx: 10px; }
      .frame-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 14px; font-weight: 800; fill: #ffffff; }
      .frame-sub { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11.5px; font-weight: 700; }
      .card-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13.5px; font-weight: 800; fill: #0f172a; text-anchor: middle; }
      .card-sub { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 10.5px; font-weight: 600; fill: #475569; text-anchor: middle; }
      .badge-text { font-family: "Fira Code", "Consolas", monospace; font-size: 10px; font-weight: 700; text-anchor: middle; }
    </style>
    <marker id="arr-b" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#0284c7" />
    </marker>
    <marker id="arr-p" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#7c3aed" />
    </marker>
  </defs>

  <!-- =========================================================================
       TOP UNIFIED FRAME: DIMENSION 1 — WHO TESTS? (Roles & Independence Spectrum)
       ========================================================================= -->
  <g transform="translate(16, 8)">
    <!-- Outer Big Frame -->
    <rect width="1088" height="238" class="frame-bg" fill="#f0f9ff" stroke="#0284c7" />
    <!-- Top Header Bar -->
    <rect width="1088" height="34" rx="12" fill="#0284c7" />
    <rect y="18" width="1088" height="16" fill="#0284c7" />
    <text x="20" y="22" class="frame-title">DIMENSION 1: WHO TESTS? — Tester Roles &amp; Psychological Independence Spectrum</text>
    <text x="1068" y="22" class="frame-sub" fill="#e0f2fe" text-anchor="end">Low Independence (Glass-Box)  ➔  High Independence (Real World)</text>

    <!-- CARD 1: Developers (x=18, y=44, w=336, h=182) -->
    <g transform="translate(18, 44)">
      <rect width="336" height="182" class="sub-card" stroke="#7dd3fc" />
      <rect width="336" height="98" rx="9" fill="#f0f9ff" />

      <!-- Developer Avatar + Laptop Graphic -->
      <g transform="translate(168, 52)">
        <!-- Glow Halo -->
        <circle cx="-46" cy="-4" r="32" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.8" />
        <!-- Person Head & Shoulders -->
        <circle cx="-46" cy="-14" r="10" fill="#0284c7" />
        <path d="M -64 12 C -64 -1, -28 -1, -28 12 Z" fill="#0284c7" />
        <!-- Glasses -->
        <rect x="-54" y="-17" width="7" height="5" rx="1" fill="none" stroke="#ffffff" stroke-width="1.4" />
        <rect x="-45" y="-17" width="7" height="5" rx="1" fill="none" stroke="#ffffff" stroke-width="1.4" />
        <!-- Laptop with < /> Code Screen -->
        <rect x="6" y="-24" width="66" height="42" rx="5" fill="#0f172a" stroke="#0284c7" stroke-width="2" />
        <text x="39" y="2" font-family="monospace" font-size="15" font-weight="900" fill="#38bdf8" text-anchor="middle">&lt;/&gt;</text>
        <path d="M -2 18 L 80 18 L 74 24 L 4 24 Z" fill="#64748b" />
      </g>

      <text x="168" y="118" class="card-title">1. Developers (Unit &amp; TDD)</text>
      <text x="168" y="136" class="card-sub">Fastest feedback &amp; white-box code intimacy</text>
      <text x="168" y="151" class="card-sub">(Beware author cognitive blind spots)</text>
      <rect x="28" y="159" width="280" height="17" rx="8" fill="#e0f2fe" />
      <text x="168" y="171" class="badge-text" fill="#0369a1">JUnit 5 • TDD Red-Green-Refactor</text>
    </g>

    <!-- Arrow 1 -> 2 -->
    <path d="M 358 135 L 372 135" stroke="#0284c7" stroke-width="2.2" marker-end="url(#arr-b)" />

    <!-- CARD 2: Peers & Dedicated QA (x=376, y=44, w=336, h=182) -->
    <g transform="translate(376, 44)">
      <rect width="336" height="182" class="sub-card" stroke="#6ee7b7" />
      <rect width="336" height="98" rx="9" fill="#ecfdf5" />

      <!-- Two Peers + QA Magnifying Shield Graphic -->
      <g transform="translate(168, 52)">
        <!-- Left Peer Avatar -->
        <circle cx="-54" cy="-4" r="28" fill="#d1fae5" stroke="#059669" stroke-width="1.6" />
        <circle cx="-54" cy="-12" r="8.5" fill="#059669" />
        <path d="M -69 10 C -69 -1, -39 -1, -39 10 Z" fill="#059669" />
        <!-- Right QA Avatar -->
        <circle cx="-6" cy="-4" r="28" fill="#a7f3d0" stroke="#047857" stroke-width="1.6" />
        <circle cx="-6" cy="-12" r="8.5" fill="#047857" />
        <path d="M -21 10 C -21 -1, 9 -1, 9 10 Z" fill="#047857" />
        <!-- Magnifying Glass & Shield Badge -->
        <circle cx="48" cy="-6" r="18" fill="#ffffff" stroke="#059669" stroke-width="3" />
        <path d="M 41 -6 L 46 -1 L 56 -11" fill="none" stroke="#059669" stroke-width="2.6" stroke-linecap="round" />
        <line x1="61" y1="7" x2="73" y2="19" stroke="#047857" stroke-width="4" stroke-linecap="round" />
      </g>

      <text x="168" y="118" class="card-title">2. Peers &amp; QA (Review &amp; Alpha)</text>
      <text x="168" y="136" class="card-sub">Independent Fagan inspection, CI system tests</text>
      <text x="168" y="151" class="card-sub">&amp; in-house Alpha staging verification</text>
      <rect x="28" y="159" width="280" height="17" rx="8" fill="#d1fae5" />
      <text x="168" y="171" class="badge-text" fill="#047857">Code Review • Alpha Staging Lab</text>
    </g>

    <!-- Arrow 2 -> 3 -->
    <path d="M 716 135 L 730 135" stroke="#0284c7" stroke-width="2.2" marker-end="url(#arr-b)" />

    <!-- CARD 3: Customers & End Users (x=734, y=44, w=336, h=182) -->
    <g transform="translate(734, 44)">
      <rect width="336" height="182" class="sub-card" stroke="#fcd34d" />
      <rect width="336" height="98" rx="9" fill="#fffbeb" />

      <!-- Customer Crowd + Globe Graphic -->
      <g transform="translate(168, 52)">
        <!-- Left User -->
        <circle cx="-60" cy="-2" r="24" fill="#fef3c7" stroke="#d97706" stroke-width="1.5" />
        <circle cx="-60" cy="-9" r="7" fill="#d97706" />
        <path d="M -72 9 C -72 0, -48 0, -48 9 Z" fill="#d97706" />
        <!-- Center Lead Customer (Crown/Star badge) -->
        <circle cx="-18" cy="-4" r="28" fill="#fde68a" stroke="#b45309" stroke-width="1.8" />
        <circle cx="-18" cy="-12" r="8.5" fill="#b45309" />
        <path d="M -33 10 C -33 -1, -3 -1, -3 10 Z" fill="#b45309" />
        <!-- Globe / Real-World Field Icon -->
        <circle cx="46" cy="-4" r="22" fill="#ffffff" stroke="#d97706" stroke-width="2.2" />
        <ellipse cx="46" cy="-4" rx="10" ry="22" fill="none" stroke="#d97706" stroke-width="1.5" />
        <line x1="24" y1="-4" x2="68" y2="-4" stroke="#d97706" stroke-width="1.5" />
        <line x1="27" y1="-13" x2="65" y2="-13" stroke="#d97706" stroke-width="1.2" />
        <line x1="27" y1="5" x2="65" y2="5" stroke="#d97706" stroke-width="1.2" />
      </g>

      <text x="168" y="118" class="card-title">3. Customers &amp; Users (UAT &amp; Beta)</text>
      <text x="168" y="136" class="card-sub">Business validation by Product Owners (UAT)</text>
      <text x="168" y="151" class="card-sub">&amp; real-world Beta trials by end customers</text>
      <rect x="28" y="159" width="280" height="17" rx="8" fill="#fef3c7" />
      <text x="168" y="171" class="badge-text" fill="#b45309">Business UAT • Real-World Beta</text>
    </g>
  </g>

  <!-- =========================================================================
       BOTTOM UNIFIED FRAME: DIMENSION 4 — HOW TO EXECUTE? (Execution Paradigms)
       ========================================================================= -->
  <g transform="translate(16, 262)">
    <!-- Outer Big Frame -->
    <rect width="1088" height="238" class="frame-bg" fill="#faf5ff" stroke="#7c3aed" />
    <!-- Top Header Bar -->
    <rect width="1088" height="34" rx="12" fill="#7c3aed" />
    <rect y="18" width="1088" height="16" fill="#7c3aed" />
    <text x="20" y="22" class="frame-title">DIMENSION 4: HOW TO EXECUTE? — Test Execution Paradigms &amp; Automation Spectrum</text>
    <text x="1068" y="22" class="frame-sub" fill="#f3e8ff" text-anchor="end">Deterministic Scripts  •  Human Discovery  •  Chaos &amp; Trace Replay</text>

    <!-- CARD 4: Scripted CI/CD Automation (x=18, y=44, w=336, h=182) -->
    <g transform="translate(18, 44)">
      <rect width="336" height="182" class="sub-card" stroke="#c7d2fe" />
      <rect width="336" height="98" rx="9" fill="#eef2ff" />

      <!-- Robot Gear + CI Checklists Graphic -->
      <g transform="translate(168, 50)">
        <!-- Robot / Gear Badge -->
        <rect x="-74" y="-24" width="52" height="46" rx="10" fill="#4f46e5" />
        <line x1="-48" y1="-32" x2="-48" y2="-24" stroke="#4f46e5" stroke-width="3" />
        <circle cx="-48" cy="-34" r="3.5" fill="#818cf8" />
        <circle cx="-58" cy="-8" r="4.5" fill="#ffffff" />
        <circle cx="-38" cy="-8" r="4.5" fill="#ffffff" />
        <rect x="-60" y="6" width="24" height="5" rx="2.5" fill="#a5b4fc" />
        <!-- Automated Pipeline Check Bars -->
        <rect x="-8" y="-22" width="84" height="14" rx="4" fill="#ffffff" stroke="#818cf8" stroke-width="1.4" />
        <circle cx="2" cy="-15" r="4" fill="#16a34a" />
        <line x1="12" y1="-15" x2="66" y2="-15" stroke="#4f46e5" stroke-width="3" stroke-linecap="round" />

        <rect x="-8" y="-4" width="84" height="14" rx="4" fill="#ffffff" stroke="#818cf8" stroke-width="1.4" />
        <circle cx="2" cy="3" r="4" fill="#16a34a" />
        <line x1="12" y1="3" x2="58" y2="3" stroke="#4f46e5" stroke-width="3" stroke-linecap="round" />

        <rect x="-8" y="14" width="84" height="14" rx="4" fill="#ffffff" stroke="#818cf8" stroke-width="1.4" />
        <circle cx="2" cy="21" r="4" fill="#16a34a" />
        <line x1="12" y1="21" x2="62" y2="21" stroke="#4f46e5" stroke-width="3" stroke-linecap="round" />
      </g>

      <text x="168" y="118" class="card-title">1. Scripted CI/CD Automation</text>
      <text x="168" y="136" class="card-sub">Deterministic regression scripts executed</text>
      <text x="168" y="151" class="card-sub">automatically on every Git commit</text>
      <rect x="28" y="159" width="280" height="17" rx="8" fill="#e0e7ff" />
      <text x="168" y="171" class="badge-text" fill="#4338ca">JUnit 5 • Playwright • GitHub Actions</text>
    </g>

    <!-- CARD 5: Exploratory Testing (x=376, y=44, w=336, h=182) -->
    <g transform="translate(376, 44)">
      <rect width="336" height="182" class="sub-card" stroke="#d8b4fe" />
      <rect width="336" height="98" rx="9" fill="#faf5ff" />

      <!-- Compass + Lightbulb Discovery Graphic -->
      <g transform="translate(168, 50)">
        <!-- Compass Icon -->
        <circle cx="-38" cy="0" r="27" fill="#ffffff" stroke="#7c3aed" stroke-width="2.5" />
        <circle cx="-38" cy="0" r="21" fill="none" stroke="#ddd6fe" stroke-width="1.2" stroke-dasharray="3 3" />
        <!-- Compass Needle -->
        <polygon points="-38,-17 -32,0 -38,-3 -44,0" fill="#e11d48" />
        <polygon points="-38,17 -32,0 -38,3 -44,0" fill="#7c3aed" />
        <circle cx="-38" cy="0" r="3" fill="#0f172a" />

        <!-- Idea Lightbulb + Loop Arrow -->
        <circle cx="38" cy="-4" r="24" fill="#f3e8ff" stroke="#7c3aed" stroke-width="1.8" />
        <path d="M 30 -2 C 26 -12, 50 -12, 46 -2 C 44 2, 43 5, 43 8 L 33 8 C 33 5, 32 2, 30 -2 Z" fill="#fde047" stroke="#ca8a04" stroke-width="1.5" />
        <rect x="33" y="9" width="10" height="4" rx="1.5" fill="#64748b" />
        <path d="M -4 -6 L 8 -6" stroke="#7c3aed" stroke-width="2.2" marker-end="url(#arr-p)" />
      </g>

      <text x="168" y="118" class="card-title">2. Exploratory Testing</text>
      <text x="168" y="136" class="card-sub">Time-boxed human investigation uniting</text>
      <text x="168" y="151" class="card-sub">learning, test design &amp; adversarial probing</text>
      <rect x="28" y="159" width="280" height="17" rx="8" fill="#f3e8ff" />
      <text x="168" y="171" class="badge-text" fill="#6d28d9">Session Charters • Breaks Pesticide Paradox</text>
    </g>

    <!-- CARD 6: Fuzzing & Record/Replay (x=734, y=44, w=336, h=182) -->
    <g transform="translate(734, 44)">
      <rect width="336" height="182" class="sub-card" stroke="#fda4af" />
      <rect width="336" height="98" rx="9" fill="#fff1f2" />

      <!-- Lightning Fuzz Bolt + Record/Play Graphic -->
      <g transform="translate(168, 50)">
        <!-- Left: Fuzzing Lightning Bomb -->
        <circle cx="-40" cy="0" r="26" fill="#ffe4e6" stroke="#e11d48" stroke-width="2" />
        <polygon points="-36,-16 -50,2 -39,2 -44,17 -27,-3 -38,-3" fill="#e11d48" />
        <!-- Right: Record (REC) -> Replay Button -->
        <rect x="4" y="-22" width="72" height="44" rx="9" fill="#ffffff" stroke="#e11d48" stroke-width="2" />
        <circle cx="24" cy="0" r="9" fill="#e11d48" />
        <text x="24" y="3" font-family="sans-serif" font-size="6.5" font-weight="900" fill="#ffffff" text-anchor="middle">REC</text>
        <polygon points="48,-10 48,10 64,0" fill="#0f172a" />
      </g>

      <text x="168" y="118" class="card-title">3. Fuzzing &amp; Record / Replay</text>
      <text x="168" y="136" class="card-sub">Random mutated payload bombardment &amp;</text>
      <text x="168" y="151" class="card-sub">capturing live UI traces into replay scripts</text>
      <rect x="28" y="159" width="280" height="17" rx="8" fill="#ffe4e6" />
      <text x="168" y="171" class="badge-text" fill="#be123c">AFL++ / Jazzer • Playwright Codegen</text>
    </g>
  </g>
</svg>
