<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1140 550" width="100%" height="100%">
  <defs>
    <filter id="mmShadow" x="-5%" y="-10%" width="110%" height="125%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.08" />
    </filter>
    <linearGradient id="rootGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>
    <linearGradient id="tcExceptionGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff1f2" />
      <stop offset="100%" stop-color="#ffe4e6" />
    </linearGradient>
    <linearGradient id="tcNormalGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#eff6ff" />
      <stop offset="100%" stop-color="#dbeafe" />
    </linearGradient>
    <linearGradient id="dataGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0fdf4" />
      <stop offset="100%" stop-color="#dcfce7" />
    </linearGradient>
    <linearGradient id="oracleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#faf5ff" />
      <stop offset="100%" stop-color="#f3e8ff" />
    </linearGradient>
  </defs>

  <!-- TOP LEGEND BAR -->
  <g transform="translate(110, 14)">
    <rect x="0" y="0" width="920" height="42" rx="21" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" filter="url(#mmShadow)" />

    <!-- Legend 1: Test Case -->
    <rect x="24" y="12" width="18" height="18" rx="4" fill="#dbeafe" stroke="#2563eb" stroke-width="2" />
    <text x="50" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13.5" font-weight="800" fill="#1e293b">Test Case (Logical Partition Tree)</text>

    <!-- Legend 2: Test Data -->
    <rect x="330" y="12" width="18" height="18" rx="4" fill="#dcfce7" stroke="#16a34a" stroke-width="2" />
    <text x="356" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13.5" font-weight="800" fill="#1e293b">Test Data (Concrete Input Tuple)</text>

    <!-- Legend 3: Test Oracle -->
    <rect x="635" y="12" width="18" height="18" rx="4" fill="#f3e8ff" stroke="#9333ea" stroke-width="2" />
    <text x="661" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13.5" font-weight="800" fill="#1e293b">Expected Oracle (Assertion Baseline)</text>
  </g>

  <!-- CONNECTING BEZIER LINES -->
  <path d="M 180 285 C 215 285, 215 134, 250 134" fill="none" stroke="#f43f5e" stroke-width="2.5" stroke-dasharray="5,4" />
  <path d="M 180 285 C 215 285, 215 355, 250 355" fill="none" stroke="#3b82f6" stroke-width="2.5" />

  <!-- TC-01 to Data to Oracle -->
  <path d="M 440 134 L 478 134" fill="none" stroke="#64748b" stroke-width="2" stroke-linecap="round" />
  <path d="M 698 134 L 736 134" fill="none" stroke="#64748b" stroke-width="2" stroke-linecap="round" />

  <!-- Normal Root to TC-02 & TC-03 -->
  <path d="M 420 355 C 445 355, 445 250, 470 250" fill="none" stroke="#3b82f6" stroke-width="2" />
  <path d="M 420 355 C 445 355, 445 420, 470 420" fill="none" stroke="#3b82f6" stroke-width="2" />

  <!-- TC-02 to Data to Oracle -->
  <path d="M 635 250 L 668 250" fill="none" stroke="#64748b" stroke-width="2" stroke-linecap="round" />
  <path d="M 858 250 L 892 250" fill="none" stroke="#64748b" stroke-width="2" stroke-linecap="round" />

  <!-- TC-03 to TC-03a & TC-03b -->
  <path d="M 635 420 C 655 420, 655 370, 675 370" fill="none" stroke="#3b82f6" stroke-width="1.8" />
  <path d="M 635 420 C 655 420, 655 470, 675 470" fill="none" stroke="#3b82f6" stroke-width="1.8" />

  <!-- TC-03a to Data to Oracle -->
  <path d="M 825 370 L 850 370" fill="none" stroke="#64748b" stroke-width="1.8" stroke-linecap="round" />
  <path d="M 990 370 L 1014 370" fill="none" stroke="#64748b" stroke-width="1.8" stroke-linecap="round" />

  <!-- TC-03b to Data to Oracle -->
  <path d="M 825 470 L 850 470" fill="none" stroke="#64748b" stroke-width="1.8" stroke-linecap="round" />
  <path d="M 990 470 L 1014 470" fill="none" stroke="#64748b" stroke-width="1.8" stroke-linecap="round" />

  <!-- ==================== NODES ==================== -->
  <!-- 1. ROOT NODE: divide(a, b) -->
  <g transform="translate(25, 250)" filter="url(#mmShadow)">
    <rect x="0" y="0" width="155" height="70" rx="14" fill="url(#rootGrad)" stroke="#0f172a" stroke-width="2" />
    <text x="77.5" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="700" fill="#94a3b8" text-anchor="middle">Function Under Test</text>
    <text x="77.5" y="50" font-family="'Fira Code', Consolas, monospace" font-size="15.5" font-weight="800" fill="#38bdf8" text-anchor="middle">divide(a, b)</text>
  </g>

  <!-- ================= BRANCH 1: Divisor == 0 (Exception Path) ================= -->
  <g transform="translate(250, 108)" filter="url(#mmShadow)">
    <rect x="0" y="0" width="190" height="52" rx="10" fill="url(#tcExceptionGrad)" stroke="#f43f5e" stroke-width="2" />
    <text x="14" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="900" fill="#e11d48">TC-01 [Exception Path]</text>
    <text x="14" y="41" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="800" fill="#9f1239">Divisor is Zero (b == 0)</text>
  </g>

  <g transform="translate(478, 110)" filter="url(#mmShadow)">
    <rect x="0" y="0" width="220" height="48" rx="8" fill="url(#dataGrad)" stroke="#16a34a" stroke-width="1.8" />
    <text x="14" y="19" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="800" fill="#15803d">[Test Data Instance]</text>
    <text x="14" y="38" font-family="'Fira Code', Consolas, monospace" font-size="13.5" font-weight="800" fill="#14532d">a = 5.0, b = 0.0</text>
  </g>

  <g transform="translate(736, 110)" filter="url(#mmShadow)">
    <rect x="0" y="0" width="350" height="48" rx="8" fill="url(#oracleGrad)" stroke="#9333ea" stroke-width="1.8" />
    <text x="14" y="19" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="800" fill="#7e22ce">[Expected Oracle]</text>
    <text x="14" y="38" font-family="'Fira Code', Consolas, monospace" font-size="12.5" font-weight="800" fill="#581c87">throws IllegalArgumentException</text>
  </g>

  <!-- ================= BRANCH 2: Divisor != 0 (Normal Path) ================= -->
  <g transform="translate(250, 329)" filter="url(#mmShadow)">
    <rect x="0" y="0" width="170" height="52" rx="10" fill="url(#tcNormalGrad)" stroke="#2563eb" stroke-width="2" />
    <text x="14" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="900" fill="#1d4ed8">[Normal Path Spec]</text>
    <text x="14" y="41" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="800" fill="#1e40af">Divisor != 0 (b != 0)</text>
  </g>

  <!-- SUB-CASE 2A: Exact Division -->
  <g transform="translate(470, 225)" filter="url(#mmShadow)">
    <rect x="0" y="0" width="165" height="50" rx="9" fill="url(#tcNormalGrad)" stroke="#3b82f6" stroke-width="1.8" />
    <text x="12" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="900" fill="#1d4ed8">TC-02 Specification</text>
    <text x="12" y="39" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="800" fill="#1e3a8a">Exact (rem == 0)</text>
  </g>

  <g transform="translate(668, 226)" filter="url(#mmShadow)">
    <rect x="0" y="0" width="190" height="48" rx="8" fill="url(#dataGrad)" stroke="#16a34a" stroke-width="1.8" />
    <text x="12" y="19" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="800" fill="#15803d">[Test Data]</text>
    <text x="12" y="38" font-family="'Fira Code', Consolas, monospace" font-size="13" font-weight="800" fill="#14532d">a = 4.0, b = 2.0</text>
  </g>

  <g transform="translate(892, 226)" filter="url(#mmShadow)">
    <rect x="0" y="0" width="190" height="48" rx="8" fill="url(#oracleGrad)" stroke="#9333ea" stroke-width="1.8" />
    <text x="14" y="19" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="800" fill="#7e22ce">[Expected Oracle]</text>
    <text x="14" y="38" font-family="'Fira Code', Consolas, monospace" font-size="14" font-weight="900" fill="#581c87">2.0</text>
  </g>

  <!-- SUB-CASE 2B: Non-Exact Division -->
  <g transform="translate(470, 395)" filter="url(#mmShadow)">
    <rect x="0" y="0" width="165" height="50" rx="9" fill="url(#tcNormalGrad)" stroke="#3b82f6" stroke-width="1.8" />
    <text x="12" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="900" fill="#1d4ed8">TC-03 Spec Group</text>
    <text x="12" y="39" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="800" fill="#1e3a8a">Non-Exact (rem != 0)</text>
  </g>

  <!-- Sub-sub-case 2B-1: Terminating Decimal -->
  <g transform="translate(675, 346)" filter="url(#mmShadow)">
    <rect x="0" y="0" width="150" height="48" rx="8" fill="#f8fafc" stroke="#64748b" stroke-width="1.5" />
    <text x="12" y="19" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="800" fill="#475569">TC-03a Logic</text>
    <text x="12" y="37" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#0f172a">Terminating Decimal</text>
  </g>

  <g transform="translate(850, 348)" filter="url(#mmShadow)">
    <rect x="0" y="0" width="140" height="44" rx="7" fill="url(#dataGrad)" stroke="#16a34a" stroke-width="1.5" />
    <text x="10" y="17" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="800" fill="#15803d">[Test Data]</text>
    <text x="10" y="34" font-family="'Fira Code', Consolas, monospace" font-size="12" font-weight="800" fill="#14532d">a=5.1, b=3.0</text>
  </g>

  <g transform="translate(1014, 348)" filter="url(#mmShadow)">
    <rect x="0" y="0" width="110" height="44" rx="7" fill="url(#oracleGrad)" stroke="#9333ea" stroke-width="1.5" />
    <text x="10" y="17" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="800" fill="#7e22ce">[Oracle]</text>
    <text x="10" y="34" font-family="'Fira Code', Consolas, monospace" font-size="13" font-weight="900" fill="#581c87">1.7</text>
  </g>

  <!-- Sub-sub-case 2B-2: Repeating / Rounded Decimal -->
  <g transform="translate(675, 446)" filter="url(#mmShadow)">
    <rect x="0" y="0" width="150" height="48" rx="8" fill="#f8fafc" stroke="#64748b" stroke-width="1.5" />
    <text x="12" y="19" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="800" fill="#475569">TC-03b Logic</text>
    <text x="12" y="37" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#0f172a">Repeating Rounding</text>
  </g>

  <g transform="translate(850, 448)" filter="url(#mmShadow)">
    <rect x="0" y="0" width="140" height="44" rx="7" fill="url(#dataGrad)" stroke="#16a34a" stroke-width="1.5" />
    <text x="10" y="17" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="800" fill="#15803d">[Test Data]</text>
    <text x="10" y="34" font-family="'Fira Code', Consolas, monospace" font-size="12" font-weight="800" fill="#14532d">a=4.0, b=3.0</text>
  </g>

  <g transform="translate(1014, 448)" filter="url(#mmShadow)">
    <rect x="0" y="0" width="110" height="44" rx="7" fill="url(#oracleGrad)" stroke="#9333ea" stroke-width="1.5" />
    <text x="10" y="17" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="800" fill="#7e22ce">[Oracle]</text>
    <text x="10" y="34" font-family="'Fira Code', Consolas, monospace" font-size="13" font-weight="900" fill="#581c87">1.33</text>
  </g>

  <!-- Bottom Insight Footer -->
  <g transform="translate(120, 508)">
    <rect x="0" y="0" width="900" height="32" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2" />
    <text x="450" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#475569" text-anchor="middle">
      <tspan fill="#2563eb" font-weight="800">Core Distinction:</tspan> A Test Case is the logical partition specification tree; Test Data is the concrete leaf value tuple!
    </text>
  </g>
</svg>
