<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #f5f5f5; }
      .title { font-family: 'Inter', 'Helvetica Neue', Arial, sans-serif; font-size: 21px; font-weight: 800; fill: #0b3c5d; text-anchor: middle; }
      .subtitle { font-family: 'Inter', 'Helvetica Neue', Arial, sans-serif; font-size: 13px; font-weight: 600; fill: #475569; text-anchor: middle; }
      .panel { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2; rx: 12; }
      .panel-title { font-family: 'Inter', 'Helvetica Neue', Arial, sans-serif; font-size: 15px; font-weight: 800; fill: #0b3c5d; }
      .hdr-w { font-family: 'Inter', 'Helvetica Neue', Arial, sans-serif; font-size: 13px; font-weight: 800; fill: #ffffff; }
      .lbl-b { font-family: 'Inter', 'Helvetica Neue', Arial, sans-serif; font-size: 13px; font-weight: 800; fill: #1e293b; }
      .lbl-m { font-family: 'Inter', 'Helvetica Neue', Arial, sans-serif; font-size: 12px; font-weight: 700; fill: #334155; }
      .lbl-s { font-family: 'Inter', 'Helvetica Neue', Arial, sans-serif; font-size: 11px; font-weight: 600; fill: #475569; }
      .mono { font-family: 'JetBrains Mono', 'SFMono-Regular', Consolas, monospace; font-size: 11px; font-weight: 700; }
    </style>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#2563eb" />
    </marker>
    <marker id="arr-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#0d9488" />
    </marker>
    <marker id="arr-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#d97706" />
    </marker>
    <marker id="arr-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#dc2626" />
    </marker>
    <marker id="arr-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#7c3aed" />
    </marker>
  </defs>
  <rect width="1200" height="620" class="bg" />

  <text x="600" y="30" class="title">Norman's Triad of Models &amp; Sweller's Cognitive Load Architecture</text>
  <text x="600" y="50" class="subtitle">Aligning the System Image with the User's Mental Model (Left) &amp; Eliminating Extraneous Working Memory Load (Right)</text>

  <!-- LEFT PANEL: NORMAN'S TRIAD OF MODELS -->
  <rect x="24" y="68" width="565" height="530" class="panel" />
  <text x="306" y="96" class="panel-title" text-anchor="middle">1. NORMAN'S TRIAD: DESIGNER MODEL vs. USER MENTAL MODEL</text>
  <text x="306" y="114" class="lbl-s" text-anchor="middle">Designers NEVER communicate directly with users—only through the System Image!</text>

  <!-- Designer's Model -->
  <rect x="48" y="150" width="225" height="145" fill="#eff6ff" stroke="#2563eb" stroke-width="2" rx="10" />
  <rect x="48" y="150" width="225" height="32" fill="#2563eb" rx="8" />
  <text x="160" y="171" class="hdr-w" text-anchor="middle">DESIGNER'S MODEL</text>
  <text x="160" y="198" class="lbl-b" fill="#1e40af" text-anchor="middle">(Implementation View)</text>
  <text x="62" y="220" class="lbl-s">• Normalized SQL Foreign Keys</text>
  <text x="62" y="238" class="lbl-s">• Kafka Outbox Partition Shards</text>
  <text x="62" y="256" class="lbl-s">• Git SHA-1 Merkle DAG Blobs</text>
  <text x="62" y="274" class="lbl-s">• REST JSON Status Codes</text>

  <!-- User's Mental Model -->
  <rect x="338" y="150" width="225" height="145" fill="#ecfdf5" stroke="#0d9488" stroke-width="2" rx="10" />
  <rect x="338" y="150" width="225" height="32" fill="#0d9488" rx="8" />
  <text x="450" y="171" class="hdr-w" text-anchor="middle">USER'S MENTAL MODEL</text>
  <text x="450" y="198" class="lbl-b" fill="#115e59" text-anchor="middle">(Everyday Domain View)</text>
  <text x="352" y="220" class="lbl-s">• Shopping Cart &amp; Receipt</text>
  <text x="352" y="238" class="lbl-s">• Kitchen Preparing My Meal</text>
  <text x="352" y="256" class="lbl-s">• Folders &amp; Trash Can on Desk</text>
  <text x="352" y="274" class="lbl-s">• Instant Undo When I Slip</text>

  <!-- Forbidden Direct Arrow -->
  <line x1="275" y1="215" x2="335" y2="215" stroke="#dc2626" stroke-width="2.5" stroke-dasharray="4,4" />
  <text x="305" y="205" class="mono" fill="#dc2626" text-anchor="middle">NO DIRECT</text>
  <text x="305" y="235" class="mono" fill="#dc2626" text-anchor="middle">TELEPATHY!</text>

  <!-- System Image at Bottom Center -->
  <rect x="116" y="348" width="380" height="135" fill="#fffbeb" stroke="#d97706" stroke-width="2.5" rx="12" />
  <rect x="116" y="348" width="380" height="34" fill="#d97706" rx="10" />
  <text x="306" y="370" class="hdr-w" text-anchor="middle">THE SYSTEM IMAGE (The Only Bridge)</text>
  <text x="306" y="398" class="lbl-b" fill="#92400e" text-anchor="middle">Visible UI + Affordances + Labels + Feedback + Errors</text>
  <text x="136" y="420" class="lbl-s" fill="#047857">[Good UX]: Translates DB state into human concepts ("Card Expired")</text>
  <text x="136" y="440" class="lbl-s" fill="#dc2626">[Implementation Leak]: Exposes "SQLSTATE[23505] idx_users_uq"</text>
  <text x="136" y="460" class="mono" fill="#b45309">Rule: Design the System Image to match the User's Mental Model!</text>

  <!-- Arrows Designer -> System Image <-> User -->
  <path d="M 160 295 L 230 346" stroke="#2563eb" stroke-width="2.5" fill="none" marker-end="url(#arr-blue)" />
  <text x="155" y="328" class="mono" fill="#1e40af">Encodes</text>
  <path d="M 380 346 L 450 297" stroke="#0d9488" stroke-width="2.5" fill="none" marker-end="url(#arr-teal)" />
  <text x="455" y="328" class="mono" fill="#0f766e">Perceives &amp; Acts</text>

  <rect x="48" y="502" width="515" height="76" fill="#fef2f2" stroke="#ef4444" stroke-width="1.5" rx="8" />
  <text x="306" y="524" class="lbl-b" fill="#b91c1c" text-anchor="middle">Why "Implementation Leaks" Cause Severe User Errors:</text>
  <text x="306" y="544" class="lbl-s" text-anchor="middle">When engineers expose backend tables, flags, or RPC timeouts directly in the UI,</text>
  <text x="306" y="562" class="lbl-s" text-anchor="middle">users form broken Mental Models and make catastrophic Mistakes (Heuristic #2 &amp; #5).</text>

  <!-- RIGHT PANEL: SWELLER'S COGNITIVE LOAD THEORY -->
  <rect x="610" y="68" width="566" height="530" class="panel" />
  <text x="893" y="96" class="panel-title" text-anchor="middle">2. SWELLER'S COGNITIVE LOAD &amp; WORKING MEMORY LIMITS</text>
  <text x="893" y="114" class="lbl-s" text-anchor="middle">Human Working Memory holds only 4 ± 1 active chunks (Cowan, 2001) for ~20 seconds</text>

  <!-- Bar 1: Bad UI (Cognitive Overload) -->
  <text x="636" y="152" class="lbl-b" fill="#dc2626">Scenario A: Cluttered, Jargon-Heavy UI (Cognitive Overload!)</text>
  <rect x="636" y="164" width="514" height="58" fill="#f1f5f9" stroke="#64748b" stroke-width="2" rx="8" />
  <!-- Intrinsic -->
  <rect x="638" y="166" width="150" height="54" fill="#3b82f6" rx="6" />
  <text x="713" y="191" class="hdr-w" text-anchor="middle">1. Intrinsic Load</text>
  <text x="713" y="207" class="mono" fill="#dbeafe" text-anchor="middle">(Core Task: 30%)</text>
  <!-- Extraneous (Huge!) -->
  <rect x="790" y="166" width="358" height="54" fill="#ef4444" rx="6" />
  <text x="969" y="191" class="hdr-w" text-anchor="middle">2. EXTRANEOUS LOAD (Bad UI Friction: 75% — OVERFLOW!)</text>
  <text x="969" y="207" class="mono" fill="#fee2e2" text-anchor="middle">Visual noise, memorizing promo codes, inconsistent menus</text>
  <!-- Capacity Limit Line -->
  <line x1="1060" y1="154" x2="1060" y2="232" stroke="#0f172a" stroke-width="3" stroke-dasharray="4,3" />
  <text x="1060" y="246" class="mono" fill="#dc2626" text-anchor="middle">Max Working Memory Limit (100%)</text>

  <!-- Bar 2: Good UX Engineering (Optimized) -->
  <text x="636" y="284" class="lbl-b" fill="#047857">Scenario B: Well-Engineered UX (Extraneous Load Minimized!)</text>
  <rect x="636" y="296" width="424" height="58" fill="#f1f5f9" stroke="#0f172a" stroke-width="2" rx="8" />
  <!-- Intrinsic -->
  <rect x="638" y="298" width="150" height="54" fill="#3b82f6" rx="6" />
  <text x="713" y="323" class="hdr-w" text-anchor="middle">1. Intrinsic Load</text>
  <text x="713" y="339" class="mono" fill="#dbeafe" text-anchor="middle">(Chunked Wizard)</text>
  <!-- Extraneous (Tiny) -->
  <rect x="790" y="298" width="65" height="54" fill="#f59e0b" rx="4" />
  <text x="822" y="323" class="hdr-w" text-anchor="middle" font-size="10">Extraneous</text>
  <text x="822" y="339" class="mono" fill="#fef3c7" text-anchor="middle">(~10%)</text>
  <!-- Germane -->
  <rect x="857" y="298" width="120" height="54" fill="#10b981" rx="6" />
  <text x="917" y="323" class="hdr-w" text-anchor="middle">3. Germane Load</text>
  <text x="917" y="339" class="mono" fill="#d1fae5" text-anchor="middle">(Learning Schema)</text>
  <!-- Free Headroom -->
  <text x="1018" y="328" class="mono" fill="#059669" text-anchor="middle">Safe Buffer</text>

  <!-- 3 Concrete Engineering Tactics Box -->
  <rect x="636" y="378" width="514" height="200" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.8" rx="10" />
  <text x="893" y="402" class="lbl-b" fill="#0b3c5d" text-anchor="middle">3 UX Engineering Tactics to Slash Cognitive Load</text>
  <line x1="652" y1="412" x2="1134" y2="412" stroke="#e2e8f0" stroke-width="1.5" />

  <text x="652" y="436" class="lbl-b" fill="#1e40af">1. Recognition Over Recall (Heuristic #6):</text>
  <text x="668" y="454" class="lbl-s">Display clickable recent addresses, dish photos &amp; one-tap coupons instead of typing codes from memory.</text>

  <text x="652" y="482" class="lbl-b" fill="#0f766e">2. Progressive Disclosure &amp; Chunking (Hick's Law):</text>
  <text x="668" y="500" class="lbl-s">Break 16-field registration into a 3-step progress bar (4 fields per screen) matching the 4 ± 1 chunk limit.</text>

  <text x="652" y="528" class="lbl-b" fill="#7c3aed">3. Defeat Change Blindness (Foveal Attention ~2° Visual Angle):</text>
  <text x="668" y="546" class="lbl-s">Place inline validation errors &amp; spinners right next to the clicked button—never in a distant corner!</text>
</svg>
