<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #f5f5f5; }
      .title { font-family: 'Inter', 'Helvetica Neue', Arial, sans-serif; font-size: 21px; font-weight: 800; fill: #0b3c5d; text-anchor: middle; }
      .subtitle { font-family: 'Inter', 'Helvetica Neue', Arial, sans-serif; font-size: 13px; font-weight: 600; fill: #475569; text-anchor: middle; }
      .panel { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2; rx: 12; }
      .panel-title { font-family: 'Inter', 'Helvetica Neue', Arial, sans-serif; font-size: 15px; font-weight: 800; fill: #0b3c5d; }
      .hdr-w { font-family: 'Inter', 'Helvetica Neue', Arial, sans-serif; font-size: 13px; font-weight: 800; fill: #ffffff; }
      .lbl-b { font-family: 'Inter', 'Helvetica Neue', Arial, sans-serif; font-size: 13px; font-weight: 800; fill: #1e293b; }
      .lbl-m { font-family: 'Inter', 'Helvetica Neue', Arial, sans-serif; font-size: 12px; font-weight: 700; fill: #334155; }
      .lbl-s { font-family: 'Inter', 'Helvetica Neue', Arial, sans-serif; font-size: 11px; font-weight: 600; fill: #475569; }
      .mono { font-family: 'JetBrains Mono', 'SFMono-Regular', Consolas, monospace; font-size: 11px; font-weight: 700; }
    </style>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#2563eb" />
    </marker>
    <marker id="arr-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#0d9488" />
    </marker>
    <marker id="arr-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#d97706" />
    </marker>
    <marker id="arr-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#dc2626" />
    </marker>
    <marker id="arr-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#7c3aed" />
    </marker>
  </defs>
  <rect width="1200" height="620" class="bg" />

  <text x="600" y="30" class="title">Customer Journey Map &amp; Emotional Curve: Food Delivery Group Order</text>
  <text x="600" y="50" class="subtitle">Mapping Touchpoints, User Thoughts, Emotional Valleys &amp; Software Architecture Opportunities Across Time</text>

  <rect x="20" y="68" width="1160" height="530" class="panel" />

  <!-- Stage Headers (5 Columns) -->
  <rect x="150" y="84" width="196" height="40" fill="#1e40af" rx="6" />
  <text x="248" y="109" class="hdr-w" text-anchor="middle">Stage 1: Group Setup</text>

  <rect x="356" y="84" width="196" height="40" fill="#2563eb" rx="6" />
  <text x="454" y="109" class="hdr-w" text-anchor="middle">Stage 2: Shared Cart</text>

  <rect x="562" y="84" width="196" height="40" fill="#d97706" rx="6" />
  <text x="660" y="109" class="hdr-w" text-anchor="middle">Stage 3: Checkout &amp; Pay</text>

  <rect x="768" y="84" width="196" height="40" fill="#dc2626" rx="6" />
  <text x="866" y="109" class="hdr-w" text-anchor="middle">Stage 4: Kitchen Wait</text>

  <rect x="974" y="84" width="190" height="40" fill="#0d9488" rx="6" />
  <text x="1069" y="109" class="hdr-w" text-anchor="middle">Stage 5: Live Arrival</text>

  <!-- Row 1: User Actions & Touchpoints -->
  <rect x="32" y="134" width="108" height="90" fill="#f1f5f9" stroke="#cbd5e1" rx="6" />
  <text x="86" y="175" class="lbl-b" text-anchor="middle">1. User</text>
  <text x="86" y="193" class="lbl-b" text-anchor="middle">Actions</text>

  <rect x="150" y="134" width="196" height="90" fill="#f8fafc" stroke="#cbd5e1" rx="6" />
  <text x="162" y="156" class="lbl-s">• Picks restaurant at 7:45 PM</text>
  <text x="162" y="176" class="lbl-s">• Taps [+ Group Order]</text>
  <text x="162" y="196" class="lbl-s">• Shares deep link on Slack</text>

  <rect x="356" y="134" width="196" height="90" fill="#f8fafc" stroke="#cbd5e1" rx="6" />
  <text x="368" y="156" class="lbl-s">• 3 coworkers add dumplings</text>
  <text x="368" y="176" class="lbl-s">• 1 coworker walks away</text>
  <text x="368" y="196" class="lbl-s">• Host checks who is ready</text>

  <rect x="562" y="134" width="196" height="90" fill="#f8fafc" stroke="#cbd5e1" rx="6" />
  <text x="574" y="156" class="lbl-s">• Applies promo code</text>
  <text x="574" y="176" class="lbl-s">• Reviews $25/person cap</text>
  <text x="574" y="196" class="lbl-s">• Pays via Apple Pay</text>

  <rect x="768" y="134" width="196" height="90" fill="#fef2f2" stroke="#fca5a5" rx="6" />
  <text x="780" y="156" class="lbl-s" fill="#991b1b">• Waits 25 mins hungry</text>
  <text x="780" y="176" class="lbl-s" fill="#991b1b">• Checks phone 6 times</text>
  <text x="780" y="196" class="lbl-s" fill="#991b1b">• "Did the store get it?!"</text>

  <rect x="974" y="134" width="190" height="90" fill="#ecfdf5" stroke="#6ee7b7" rx="6" />
  <text x="986" y="156" class="lbl-s">• Watches rider on GPS map</text>
  <text x="986" y="176" class="lbl-s">• Meets rider at lobby</text>
  <text x="986" y="196" class="lbl-s">• 1-tap auto-split receipt</text>

  <!-- Row 2: Emotional Curve (Visual Graph) -->
  <rect x="32" y="234" width="108" height="170" fill="#f1f5f9" stroke="#cbd5e1" rx="6" />
  <text x="86" y="295" class="lbl-b" text-anchor="middle">2. Emotion</text>
  <text x="86" y="313" class="lbl-b" text-anchor="middle">Curve</text>
  <text x="86" y="335" class="mono" fill="#059669" text-anchor="middle">(+) Delight</text>
  <text x="86" y="375" class="mono" fill="#dc2626" text-anchor="middle">(-) Anxiety</text>

  <rect x="150" y="234" width="1014" height="170" fill="#ffffff" stroke="#cbd5e1" rx="6" />
  <line x1="150" y1="319" x2="1164" y2="319" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4,4" />
  <text x="180" y="312" class="mono" fill="#64748b">Neutral Baseline</text>

  <!-- Emotion Curve Path -->
  <path d="M 248 270 C 330 275, 390 340, 454 335 C 520 330, 590 280, 660 285 C 730 290, 800 385, 866 382 C 935 380, 1000 255, 1069 258" stroke="#2563eb" stroke-width="4" fill="none" />

  <!-- Points on Curve -->
  <circle cx="248" cy="270" r="8" fill="#059669" />
  <text x="248" y="254" class="lbl-m" fill="#047857" text-anchor="middle">Excited (+): Fast 1-Tap Share</text>

  <circle cx="454" cy="335" r="8" fill="#d97706" />
  <text x="454" y="362" class="lbl-m" fill="#b45309" text-anchor="middle">Friction (-): 1 Member Stalls Cart</text>

  <circle cx="660" cy="285" r="8" fill="#2563eb" />
  <text x="660" y="268" class="lbl-m" fill="#1d4ed8" text-anchor="middle">Relieved (+): Biometric Pay</text>

  <circle cx="866" cy="382" r="10" fill="#dc2626" />
  <text x="866" y="356" class="lbl-b" fill="#dc2626" text-anchor="middle">ANXIETY VALLEY ( Heuristic #1 Gap! )</text>
  <text x="866" y="399" class="mono" fill="#b91c1c" text-anchor="middle">"Black-Box Post-Payment Silence"</text>

  <circle cx="1069" cy="258" r="8" fill="#059669" />
  <text x="1069" y="245" class="lbl-m" fill="#047857" text-anchor="middle">Peak Delight (+): Live Map</text>

  <!-- Row 3: UX & Software Architecture Opportunities -->
  <rect x="32" y="416" width="108" height="164" fill="#0b3c5d" rx="6" />
  <text x="86" y="485" class="hdr-w" text-anchor="middle">3. SE &amp; UX</text>
  <text x="86" y="505" class="hdr-w" text-anchor="middle">Solutions</text>

  <rect x="150" y="416" width="196" height="164" fill="#eff6ff" stroke="#93c5fd" rx="6" />
  <text x="248" y="438" class="lbl-b" fill="#1e40af" text-anchor="middle">IA &amp; First-Click Fix</text>
  <text x="162" y="460" class="lbl-s">• Place [+ Group Order] in</text>
  <text x="162" y="478" class="lbl-s">  Restaurant Menu Header</text>
  <text x="162" y="500" class="lbl-s">• Auto-generate QR + Web</text>
  <text x="162" y="518" class="lbl-s">  deep link (No app install</text>
  <text x="162" y="536" class="lbl-s">  required for guests!)</text>

  <rect x="356" y="416" width="196" height="164" fill="#fffbeb" stroke="#fcd34d" rx="6" />
  <text x="454" y="438" class="lbl-b" fill="#92400e" text-anchor="middle">Edge-State Wireframe</text>
  <text x="368" y="460" class="lbl-s">• Show real-time badges:</text>
  <text x="368" y="478" class="mono" fill="#b45309">  [ Picking... ] vs [ Ready ✓ ]</text>
  <text x="368" y="500" class="lbl-s">• Add Countdown Timer +</text>
  <text x="368" y="518" class="lbl-s">  [Lock Cart &amp; Checkout]</text>
  <text x="368" y="536" class="lbl-s">  host override button!</text>

  <rect x="562" y="416" width="196" height="164" fill="#f5f3ff" stroke="#c4b5fd" rx="6" />
  <text x="660" y="438" class="lbl-b" fill="#5b21b6" text-anchor="middle">Hick's &amp; Tesler's Laws</text>
  <text x="574" y="460" class="lbl-s">• Pre-select best coupon</text>
  <text x="574" y="478" class="lbl-s">  automatically in code</text>
  <text x="574" y="500" class="lbl-s">• Default to last-used</text>
  <text x="574" y="518" class="lbl-s">  1-tap payment method</text>
  <text x="574" y="536" class="lbl-s">• Upfront fee transparency</text>

  <rect x="768" y="416" width="196" height="164" fill="#fef2f2" stroke="#f87171" stroke-width="2" rx="6" />
  <text x="866" y="438" class="lbl-b" fill="#b91c1c" text-anchor="middle">Healing the Anxiety Valley</text>
  <text x="780" y="460" class="lbl-s">• Push WebSocket events:</text>
  <text x="780" y="478" class="mono" fill="#dc2626">  Confirmed → Wok → Packed</text>
  <text x="780" y="500" class="lbl-s">• Show dynamic ETA range</text>
  <text x="780" y="518" class="lbl-s">• Provide 60s Undo/Cancel</text>
  <text x="780" y="536" class="lbl-s">  window (Heuristic #1 &amp; #3)</text>

  <rect x="974" y="416" width="190" height="164" fill="#ecfdf5" stroke="#6ee7b7" rx="6" />
  <text x="1069" y="438" class="lbl-b" fill="#047857" text-anchor="middle">Peak-End Rule Delight</text>
  <text x="986" y="460" class="lbl-s">• Stream Redis GeoHash</text>
  <text x="986" y="478" class="lbl-s">  rider coordinates (&lt;5ms)</text>
  <text x="986" y="500" class="lbl-s">• Photo proof at drop-off</text>
  <text x="986" y="518" class="lbl-s">• Auto-email itemized bill</text>
  <text x="986" y="536" class="lbl-s">  to each group member</text>
</svg>
