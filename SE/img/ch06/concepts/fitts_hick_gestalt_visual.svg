<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #f5f5f5; }
      .title { font-family: 'Inter', 'Helvetica Neue', Arial, sans-serif; font-size: 21px; font-weight: 800; fill: #0b3c5d; text-anchor: middle; }
      .subtitle { font-family: 'Inter', 'Helvetica Neue', Arial, sans-serif; font-size: 13px; font-weight: 600; fill: #475569; text-anchor: middle; }
      .panel { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2; rx: 12; }
      .panel-title { font-family: 'Inter', 'Helvetica Neue', Arial, sans-serif; font-size: 15px; font-weight: 800; fill: #0b3c5d; }
      .hdr-w { font-family: 'Inter', 'Helvetica Neue', Arial, sans-serif; font-size: 13px; font-weight: 800; fill: #ffffff; }
      .lbl-b { font-family: 'Inter', 'Helvetica Neue', Arial, sans-serif; font-size: 13px; font-weight: 800; fill: #1e293b; }
      .lbl-m { font-family: 'Inter', 'Helvetica Neue', Arial, sans-serif; font-size: 12px; font-weight: 700; fill: #334155; }
      .lbl-s { font-family: 'Inter', 'Helvetica Neue', Arial, sans-serif; font-size: 11px; font-weight: 600; fill: #475569; }
      .mono { font-family: 'JetBrains Mono', 'SFMono-Regular', Consolas, monospace; font-size: 11px; font-weight: 700; }
    </style>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#2563eb" />
    </marker>
    <marker id="arr-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#0d9488" />
    </marker>
    <marker id="arr-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#d97706" />
    </marker>
    <marker id="arr-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#dc2626" />
    </marker>
    <marker id="arr-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#7c3aed" />
    </marker>
  </defs>
  <rect width="1200" height="620" class="bg" />

  <text x="600" y="30" class="title">Quantitative Laws of Interaction (Fitts &amp; Hick) &amp; Gestalt Visual Perception</text>
  <text x="600" y="50" class="subtitle">Mathematical Optimization of Pointing Speed (Left), Choice Reaction Time (Center) &amp; Perceptual Grouping (Right)</text>

  <!-- PANEL 1: FITTS'S LAW -->
  <rect x="20" y="68" width="380" height="530" class="panel" />
  <text x="210" y="95" class="panel-title" text-anchor="middle">1. FITTS'S LAW (Motor Pointing)</text>
  <rect x="40" y="106" width="340" height="32" fill="#eff6ff" stroke="#93c5fd" rx="6" />
  <text x="210" y="127" class="mono" fill="#1e40af" text-anchor="middle" font-size="13">MT = a + b · log2( D / W + 1 )</text>

  <!-- Cursor to Button Diagram -->
  <rect x="40" y="150" width="340" height="155" fill="#f8fafc" stroke="#cbd5e1" rx="8" />
  <!-- Magic Corner at Top-Right -->
  <rect x="280" y="150" width="100" height="24" fill="#0d9488" rx="2" />
  <text x="330" y="166" class="mono" fill="#ffffff" text-anchor="middle" font-size="10">Edge W = ∞</text>
  <!-- Start Cursor -->
  <circle cx="72" cy="255" r="10" fill="#1e293b" />
  <text x="72" y="280" class="mono" fill="#334155" text-anchor="middle">Cursor</text>
  <!-- Distance D Line -->
  <line x1="84" y1="248" x2="245" y2="215" stroke="#2563eb" stroke-width="2.5" stroke-dasharray="5,3" marker-end="url(#arr-blue)" />
  <text x="160" y="218" class="mono" fill="#2563eb" text-anchor="middle">Distance (D)</text>
  <!-- Target Button W -->
  <rect x="250" y="190" width="110" height="48" fill="#2563eb" rx="8" />
  <text x="305" y="218" class="hdr-w" text-anchor="middle">Place Order</text>
  <line x1="250" y1="250" x2="360" y2="250" stroke="#1e40af" stroke-width="2" />
  <text x="305" y="266" class="mono" fill="#1e40af" text-anchor="middle">Width (W &gt;= 48dp)</text>

  <!-- Mobile Thumb Zone Diagram -->
  <text x="210" y="328" class="lbl-b" fill="#0b3c5d" text-anchor="middle">Mobile One-Handed Thumb Ergonomics</text>
  <rect x="115" y="340" width="190" height="238" fill="#1e293b" rx="20" />
  <rect x="123" y="352" width="174" height="214" fill="#ffffff" rx="12" />
  <!-- Top Stretch Zone (Red) -->
  <rect x="125" y="354" width="170" height="58" fill="#fee2e2" rx="8" />
  <text x="210" y="378" class="mono" fill="#b91c1c" text-anchor="middle">HARD STRETCH ZONE (High D)</text>
  <text x="210" y="396" class="lbl-s" fill="#991b1b" text-anchor="middle">Put destructive / rare actions here</text>
  <!-- Middle Okay Zone (Amber) -->
  <rect x="125" y="416" width="170" height="65" fill="#fef3c7" rx="4" />
  <text x="210" y="452" class="mono" fill="#b45309" text-anchor="middle">NATURAL SWEEP ZONE</text>
  <!-- Bottom Easy Thumb Zone (Green) -->
  <rect x="125" y="485" width="170" height="79" fill="#d1fae5" rx="8" />
  <text x="210" y="512" class="mono" fill="#047857" text-anchor="middle">EASY THUMB ZONE (Low D)</text>
  <rect x="137" y="524" width="146" height="32" fill="#059669" rx="6" />
  <text x="210" y="545" class="hdr-w" text-anchor="middle" font-size="11">Primary CTA Bar (Large W)</text>

  <!-- PANEL 2: HICK-HYMAN LAW -->
  <rect x="415" y="68" width="370" height="530" class="panel" />
  <text x="600" y="95" class="panel-title" text-anchor="middle">2. HICK-HYMAN LAW (Decision Time)</text>
  <rect x="435" y="106" width="330" height="32" fill="#f5f3ff" stroke="#c4b5fd" rx="6" />
  <text x="600" y="127" class="mono" fill="#5b21b6" text-anchor="middle" font-size="13">RT = a + b · log2( n + 1 )</text>

  <!-- Log Curve Graph -->
  <rect x="435" y="150" width="330" height="165" fill="#f8fafc" stroke="#cbd5e1" rx="8" />
  <line x1="475" y1="285" x2="740" y2="285" stroke="#475569" stroke-width="2" />
  <line x1="475" y1="285" x2="475" y2="168" stroke="#475569" stroke-width="2" />
  <text x="610" y="304" class="lbl-s" text-anchor="middle">Number of Choices (n)</text>
  <text x="452" y="228" class="lbl-s" transform="rotate(-90 452,228)" text-anchor="middle">Reaction Time (RT)</text>
  <!-- Logarithmic curve -->
  <path d="M 475 280 Q 515 195 730 178" stroke="#7c3aed" stroke-width="3.5" fill="none" />
  <circle cx="515" cy="232" r="5" fill="#059669" />
  <text x="535" y="248" class="mono" fill="#047857">n = 3–5 (Fast!)</text>
  <circle cx="705" cy="181" r="5" fill="#dc2626" />
  <text x="655" y="202" class="mono" fill="#dc2626">n = 28 (Paralysis!)</text>

  <!-- Progressive Disclosure Comparison -->
  <text x="600" y="340" class="lbl-b" fill="#0b3c5d" text-anchor="middle">Solution: Progressive Disclosure &amp; Smart Defaults</text>
  <rect x="435" y="352" width="155" height="224" fill="#fef2f2" stroke="#f87171" rx="8" />
  <text x="512" y="372" class="mono" fill="#b91c1c" text-anchor="middle">[Anti-Pattern] n=28</text>
  <text x="447" y="392" class="lbl-s">○ Bank 01  ○ Bank 15</text>
  <text x="447" y="410" class="lbl-s">○ Bank 02  ○ Bank 16</text>
  <text x="447" y="428" class="lbl-s">○ Bank 03  ○ Wallet A</text>
  <text x="447" y="446" class="lbl-s">○ Bank 04  ○ Wallet B</text>
  <text x="447" y="464" class="lbl-s">○ Bank 05  ○ Wallet C</text>
  <text x="447" y="482" class="lbl-s">○ Bank 06  ○ Voucher</text>
  <text x="447" y="500" class="lbl-s">○ Bank 07  ○ Crypto</text>
  <text x="512" y="555" class="mono" fill="#dc2626" text-anchor="middle">Linear Scan Overload!</text>

  <rect x="605" y="352" width="160" height="224" fill="#ecfdf5" stroke="#34d399" rx="8" />
  <text x="685" y="372" class="mono" fill="#047857" text-anchor="middle">[Best Practice] n=3</text>
  <rect x="617" y="386" width="136" height="44" fill="#d1fae5" stroke="#059669" rx="6" />
  <text x="685" y="405" class="lbl-m" fill="#065f46" text-anchor="middle">● Apple Pay [Default]</text>
  <text x="685" y="421" class="lbl-s" fill="#047857" text-anchor="middle">1-Tap Biometric</text>
  <rect x="617" y="438" width="136" height="34" fill="#ffffff" stroke="#cbd5e1" rx="6" />
  <text x="685" y="459" class="lbl-s" text-anchor="middle">○ Saved Visa ••4210</text>
  <rect x="617" y="480" width="136" height="34" fill="#ffffff" stroke="#cbd5e1" rx="6" />
  <text x="685" y="501" class="lbl-s" text-anchor="middle">▸ More Methods (26)...</text>
  <text x="685" y="555" class="mono" fill="#047857" text-anchor="middle">Decision Time &lt; 1.2s!</text>

  <!-- PANEL 3: GESTALT PRINCIPLES -->
  <rect x="800" y="68" width="380" height="530" class="panel" />
  <text x="990" y="95" class="panel-title" text-anchor="middle">3. GESTALT VISUAL GROUPING LAWS</text>
  <text x="990" y="114" class="lbl-s" text-anchor="middle">How the visual cortex groups UI controls without clutter</text>

  <!-- 1. Proximity -->
  <rect x="820" y="130" width="340" height="98" fill="#f8fafc" stroke="#cbd5e1" rx="8" />
  <text x="834" y="150" class="lbl-b" fill="#1e40af">1. Law of Proximity (Whitespace Grouping)</text>
  <text x="834" y="170" class="lbl-s" fill="#334155">Delivery Address (4px gap to input)</text>
  <rect x="834" y="175" width="145" height="22" fill="#ffffff" stroke="#2563eb" rx="4" />
  <text x="1000" y="170" class="lbl-s" fill="#334155"> Courier Note (20px separation)</text>
  <rect x="1000" y="175" width="145" height="22" fill="#ffffff" stroke="#2563eb" rx="4" />
  <text x="834" y="215" class="mono" fill="#475569">Closer items = Same group (No heavy boxes needed!)</text>

  <!-- 2. Similarity -->
  <rect x="820" y="240" width="340" height="98" fill="#f8fafc" stroke="#cbd5e1" rx="8" />
  <text x="834" y="260" class="lbl-b" fill="#0f766e">2. Law of Similarity (Visual Consistency)</text>
  <rect x="834" y="272" width="90" height="28" fill="#2563eb" rx="6" />
  <text x="879" y="290" class="hdr-w" text-anchor="middle" font-size="11">Add +</text>
  <rect x="936" y="272" width="90" height="28" fill="#2563eb" rx="6" />
  <text x="981" y="290" class="hdr-w" text-anchor="middle" font-size="11">Pay Now</text>
  <rect x="1038" y="272" width="106" height="28" fill="#f1f5f9" stroke="#94a3b8" rx="6" />
  <text x="1091" y="290" class="lbl-s" text-anchor="middle">Cancel</text>
  <text x="834" y="324" class="mono" fill="#475569">Same color/shape = Same interactive behavior</text>

  <!-- 3. Common Region & Closure -->
  <rect x="820" y="350" width="340" height="110" fill="#f8fafc" stroke="#cbd5e1" rx="8" />
  <text x="834" y="370" class="lbl-b" fill="#7c3aed">3. Common Region (Cards) &amp; 4. Closure</text>
  <rect x="834" y="380" width="130" height="50" fill="#ffffff" stroke="#94a3b8" rx="6" />
  <text x="899" y="409" class="lbl-s" text-anchor="middle">Card 1 (Enclosed)</text>
  <rect x="974" y="380" width="130" height="50" fill="#ffffff" stroke="#94a3b8" rx="6" />
  <text x="1039" y="409" class="lbl-s" text-anchor="middle">Card 2 (Enclosed)</text>
  <rect x="1114" y="380" width="45" height="50" fill="#ede9fe" stroke="#7c3aed" rx="4" />
  <text x="1136" y="409" class="mono" fill="#6d28d9" text-anchor="middle">C3..</text>
  <text x="834" y="448" class="mono" fill="#475569">Clipped 3rd card triggers Closure → "Scroll right!"</text>

  <!-- 5. Figure-Ground & WCAG -->
  <rect x="820" y="472" width="340" height="106" fill="#f8fafc" stroke="#cbd5e1" rx="8" />
  <text x="834" y="492" class="lbl-b" fill="#b45309">5. Figure-Ground &amp; WCAG 2.2 Contrast</text>
  <text x="834" y="514" class="lbl-s">• Modal backdrop dimming separates Figure from Ground</text>
  <text x="834" y="534" class="lbl-s">• WCAG Level AA requires &gt;= 4.5 : 1 text contrast</text>
  <text x="834" y="554" class="mono" fill="#dc2626">• Never use Red/Green color alone: Add [!] Icon + Text!</text>
</svg>
