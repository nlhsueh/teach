<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="960" height="480">
  <defs>
    <!-- Gradients -->
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0b3c5d" />
      <stop offset="100%" stop-color="#1d5f8a" />
    </linearGradient>
    <linearGradient id="rowAlt" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f8fafc" />
    </linearGradient>
    <linearGradient id="rowLight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f0f9ff" />
      <stop offset="100%" stop-color="#e0f2fe" />
    </linearGradient>
    <!-- Drop Shadow Filter -->
    <filter id="rowShadow" x="-2%" y="-2%" width="104%" height="108%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0b3c5d" flood-opacity="0.06" />
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="960" height="480" rx="14" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" />

  <!-- Header Banner -->
  <rect x="0" y="0" width="960" height="54" rx="14" fill="url(#headerGrad)" />
  <rect x="0" y="38" width="960" height="16" fill="url(#headerGrad)" />
  <text x="480" y="34" fill="#ffffff" font-family="'Noto Sans TC', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="700" text-anchor="middle" letter-spacing="0.8">
    📐 系統環境圖 (System Context Diagram)：核心符號圖例與語意對照表
  </text>

  <!-- Table Headers -->
  <g transform="translate(20, 64)">
    <rect x="0" y="0" width="920" height="34" rx="6" fill="#0b3c5d" opacity="0.9" />
    <text x="110" y="22" fill="#ffffff" font-family="'Noto Sans TC', sans-serif" font-size="13" font-weight="700" text-anchor="middle">視覺符號 (Visual Notation)</text>
    <text x="310" y="22" fill="#ffffff" font-family="'Noto Sans TC', sans-serif" font-size="13" font-weight="700" text-anchor="middle">語法名稱 (Element Name)</text>
    <text x="650" y="22" fill="#ffffff" font-family="'Noto Sans TC', sans-serif" font-size="13" font-weight="700" text-anchor="middle">軟體工程語意與實務職責 (Engineering Semantics)</text>
  </g>

  <!-- ==================== ROW 1: System Boundary ==================== -->
  <g transform="translate(20, 105)" filter="url(#rowShadow)">
    <rect x="0" y="0" width="920" height="66" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" />
    
    <!-- Visual Symbol -->
    <g transform="translate(20, 10)">
      <!-- Boundary box with folder tab -->
      <path d="M 0,0 L 110,0 A 4,4 0 0 1 114,4 L 118,12 L 175,12 A 4,4 0 0 1 179,16 L 179,44 A 4,4 0 0 1 175,48 L 0,48 A 4,4 0 0 1 -4,44 L -4,4 A 4,4 0 0 1 0,0" fill="#e8eff5" stroke="#0b3c5d" stroke-width="1.8" />
      <line x1="-4" y1="12" x2="118" y2="12" stroke="#0b3c5d" stroke-width="1.5" />
      <text x="5" y="9" fill="#0b3c5d" font-family="'Helvetica Neue', Arial, sans-serif" font-size="8.5" font-weight="700">System Boundary</text>
      <!-- Inside mini core -->
      <rect x="30" y="20" width="115" height="20" rx="3" fill="#ffffff" stroke="#328cc1" stroke-width="1" />
      <text x="87" y="34" fill="#1e293b" font-family="'Noto Sans TC', sans-serif" font-size="8.5" font-weight="600" text-anchor="middle">內部核心系統</text>
    </g>

    <!-- Name -->
    <text x="310" y="30" fill="#0b3c5d" font-family="'Noto Sans TC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">系統架構邊界</text>
    <text x="310" y="48" fill="#64748b" font-family="'Helvetica Neue', Arial, sans-serif" font-size="11.5" text-anchor="middle">System Boundary Box</text>

    <!-- Semantics -->
    <text x="440" y="28" fill="#1e293b" font-family="'Noto Sans TC', sans-serif" font-size="12.5" font-weight="600">
      • <tspan fill="#0b3c5d">確立範疇（In-Scope）：</tspan> 框內為我方團隊自主設計、開發與維運的程式碼與微服務。
    </text>
    <text x="440" y="48" fill="#475569" font-family="'Noto Sans TC', sans-serif" font-size="12">
      • 框外為外部人類角色與第三方服務，明確劃分法律責任、成本核算與防範範疇蔓延 (Scope Creep)。
    </text>
  </g>

  <!-- ==================== ROW 2: Human Actor ==================== -->
  <g transform="translate(20, 178)" filter="url(#rowShadow)">
    <rect x="0" y="0" width="920" height="66" rx="8" fill="url(#rowAlt)" stroke="#e2e8f0" stroke-width="1" />
    
    <!-- Visual Symbol -->
    <g transform="translate(70, 8)">
      <ellipse cx="40" cy="9" rx="7" ry="7" fill="#d9b310" stroke="#0b3c5d" stroke-width="1.2" />
      <path d="M 40,16 L 40,32 M 28,22 L 52,22 M 40,32 L 30,46 M 40,32 L 50,46" stroke="#0b3c5d" stroke-width="1.4" fill="none" />
      <text x="40" y="56" fill="#0b3c5d" font-family="'Helvetica Neue', Arial, sans-serif" font-size="9" font-weight="700" text-anchor="middle">Customer</text>
    </g>

    <!-- Name -->
    <text x="310" y="30" fill="#0b3c5d" font-family="'Noto Sans TC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">外部人類參與者</text>
    <text x="310" y="48" fill="#64748b" font-family="'Helvetica Neue', Arial, sans-serif" font-size="11.5" text-anchor="middle">Human Actor (User)</text>

    <!-- Semantics -->
    <text x="440" y="28" fill="#1e293b" font-family="'Noto Sans TC', sans-serif" font-size="12.5" font-weight="600">
      • <tspan fill="#0b3c5d">真實使用者角色：</tspan> 與系統具備明確互動介面的人類角色（顧客、外送員、餐廳商家）。
    </text>
    <text x="440" y="48" fill="#475569" font-family="'Noto Sans TC', sans-serif" font-size="12">
      • 通常透過特定客戶端終端（如 iOS/Android 原生 App 或商家 Web 後台）與核心系統溝通。
    </text>
  </g>

  <!-- ==================== ROW 3: External Cloud / Partner System ==================== -->
  <g transform="translate(20, 251)" filter="url(#rowShadow)">
    <rect x="0" y="0" width="920" height="66" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" />
    
    <!-- Visual Symbol -->
    <g transform="translate(70, 8)">
      <!-- Cloud shape + Actor -->
      <ellipse cx="40" cy="9" rx="7" ry="7" fill="#38bdf8" stroke="#0b3c5d" stroke-width="1.2" />
      <path d="M 40,16 L 40,32 M 28,22 L 52,22 M 40,32 L 30,46 M 40,32 L 50,46" stroke="#0b3c5d" stroke-width="1.4" fill="none" />
      <text x="40" y="56" fill="#0b3c5d" font-family="'Helvetica Neue', Arial, sans-serif" font-size="9" font-weight="700" text-anchor="middle">Payment Gateway</text>
    </g>

    <!-- Name -->
    <text x="310" y="30" fill="#0b3c5d" font-family="'Noto Sans TC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">外部系統 / 雲端服務</text>
    <text x="310" y="48" fill="#64748b" font-family="'Helvetica Neue', Arial, sans-serif" font-size="11.5" text-anchor="middle">External System / Cloud API</text>

    <!-- Semantics -->
    <text x="440" y="28" fill="#1e293b" font-family="'Noto Sans TC', sans-serif" font-size="12.5" font-weight="600">
      • <tspan fill="#0b3c5d">第三方現成能力：</tspan> 非團隊自主開發的外部現成服務（如 Stripe 金流、Google Maps、Firebase）。
    </text>
    <text x="440" y="48" fill="#475569" font-family="'Noto Sans TC', sans-serif" font-size="12">
      • 透過 Web API / Webhook 介接；需早期評估 SLA 可用性、計費成本與合規隔離（如 PCI-DSS）。
    </text>
  </g>

  <!-- ==================== ROW 4: Internal Subsystem / Component ==================== -->
  <g transform="translate(20, 324)" filter="url(#rowShadow)">
    <rect x="0" y="0" width="920" height="66" rx="8" fill="url(#rowAlt)" stroke="#e2e8f0" stroke-width="1" />
    
    <!-- Visual Symbol -->
    <g transform="translate(30, 14)">
      <rect x="0" y="0" width="160" height="38" rx="4" fill="#ffffff" stroke="#328cc1" stroke-width="1.5" />
      <!-- Component Icon tabs -->
      <rect x="142" y="5" width="12" height="8" fill="#ffffff" stroke="#328cc1" stroke-width="1.2" />
      <rect x="140" y="7" width="4" height="2" fill="#328cc1" />
      <rect x="140" y="10" width="4" height="2" fill="#328cc1" />
      <text x="70" y="18" fill="#0b3c5d" font-family="'Helvetica Neue', Arial, sans-serif" font-size="10" font-weight="700" text-anchor="middle">Order Engine</text>
      <text x="70" y="30" fill="#64748b" font-family="'Noto Sans TC', sans-serif" font-size="8.5" text-anchor="middle">(訂單與排程微服務)</text>
    </g>

    <!-- Name -->
    <text x="310" y="30" fill="#0b3c5d" font-family="'Noto Sans TC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">內部核心構件 / 服務</text>
    <text x="310" y="48" fill="#64748b" font-family="'Helvetica Neue', Arial, sans-serif" font-size="11.5" text-anchor="middle">Internal Component / Service</text>

    <!-- Semantics -->
    <text x="440" y="28" fill="#1e293b" font-family="'Noto Sans TC', sans-serif" font-size="12.5" font-weight="600">
      • <tspan fill="#0b3c5d">核心業務邏輯載體：</tspan> 系統邊界內承載業務規則的核心微服務（如目錄服務、訂單引擎、即時追蹤）。
    </text>
    <text x="440" y="48" fill="#475569" font-family="'Noto Sans TC', sans-serif" font-size="12">
      • 右上角帶有 UML 構件符號（小插槽箱），表示其為可獨立部署與維護的內部模組單元。
    </text>
  </g>

  <!-- ==================== ROW 5: Dependency Link / Communication Arrow ==================== -->
  <g transform="translate(20, 397)" filter="url(#rowShadow)">
    <rect x="0" y="0" width="920" height="66" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" />
    
    <!-- Visual Symbol -->
    <g transform="translate(25, 20)">
      <line x1="5" y1="12" x2="155" y2="12" stroke="#0b3c5d" stroke-width="1.8" />
      <polygon points="162,12 152,7 155,12 152,17" fill="#0b3c5d" />
      <rect x="18" y="0" width="130" height="15" rx="3" fill="#e0f2fe" opacity="0.9" />
      <text x="83" y="11" fill="#0369a1" font-family="'Helvetica Neue', Arial, sans-serif" font-size="8.5" font-weight="700" text-anchor="middle">1. Browse menu &amp; order</text>
    </g>

    <!-- Name -->
    <text x="310" y="30" fill="#0b3c5d" font-family="'Noto Sans TC', sans-serif" font-size="14" font-weight="700" text-anchor="middle">相依與資料通訊關聯</text>
    <text x="310" y="48" fill="#64748b" font-family="'Helvetica Neue', Arial, sans-serif" font-size="11.5" text-anchor="middle">Communication Dependency</text>

    <!-- Semantics -->
    <text x="440" y="28" fill="#1e293b" font-family="'Noto Sans TC', sans-serif" font-size="12.5" font-weight="600">
      • <tspan fill="#0b3c5d">通訊與依賴方向：</tspan> 箭頭方向代表請求發起端或資料相依流向，明確標示誰呼叫誰。
    </text>
    <text x="440" y="48" fill="#475569" font-family="'Noto Sans TC', sans-serif" font-size="12">
      • 線條附帶具名動詞短語與序號，清楚描述該通道所承載的具體商業活動或資料流。
    </text>
  </g>
</svg>
