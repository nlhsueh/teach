<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 340" width="100%" height="100%">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.08" />
    </filter>
    <marker id="arrow-down" viewBox="0 0 10 10" refX="5" refY="8" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 1 0 L 5 10 L 9 0 z" fill="#0284c7" />
    </marker>
  </defs>

  <rect width="880" height="340" fill="#f8fafc" rx="12" stroke="#e2e8f0" stroke-width="1.5" />

  <!-- Pattern Header Badge -->
  <rect x="24" y="16" width="260" height="28" rx="6" fill="#e0f2fe" stroke="#0284c7" stroke-width="1" />
  <text x="34" y="35" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#0369a1">ARCHITECTURAL PATTERN</text>
  <text x="180" y="35" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#64748b">02 / LAYERED</text>

  <!-- Left: 4 Stacked Layers -->
  <!-- Layer 1: Presentation -->
  <g transform="translate(40, 56)">
    <rect width="520" height="54" rx="8" fill="#ffffff" stroke="#0284c7" stroke-width="1.8" filter="url(#shadow)" />
    <rect x="0" y="0" width="140" height="54" rx="8" fill="#0284c7" />
    <rect x="130" y="0" width="10" height="54" fill="#0284c7" />
    <text x="70" y="27" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">展示層</text>
    <text x="70" y="42" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#e0f2fe" text-anchor="middle">Presentation</text>
    <text x="160" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#0f172a">使用者介面 (UI)、Web 頁面、Mobile App、REST API 控制器</text>
  </g>

  <!-- Layer 2: Application / Service -->
  <g transform="translate(40, 124)">
    <rect width="520" height="54" rx="8" fill="#ffffff" stroke="#6366f1" stroke-width="1.8" filter="url(#shadow)" />
    <rect x="0" y="0" width="140" height="54" rx="8" fill="#6366f1" />
    <rect x="130" y="0" width="10" height="54" fill="#6366f1" />
    <text x="70" y="27" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">應用 / 服務層</text>
    <text x="70" y="42" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#e0e7ff" text-anchor="middle">Service / App</text>
    <text x="160" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#0f172a">使用案例流程編排 (Use Cases)、跨領域事務邊界 (Transactions)</text>
  </g>

  <!-- Layer 3: Domain / Business -->
  <g transform="translate(40, 192)">
    <rect width="520" height="54" rx="8" fill="#ffffff" stroke="#059669" stroke-width="1.8" filter="url(#shadow)" />
    <rect x="0" y="0" width="140" height="54" rx="8" fill="#059669" />
    <rect x="130" y="0" width="10" height="54" fill="#059669" />
    <text x="70" y="27" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">領域 / 業務層</text>
    <text x="70" y="42" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#d1fae5" text-anchor="middle">Domain Logic</text>
    <text x="160" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#0f172a">核心商業規則、領域實體 (Entities)、業務演算法 (無框架依賴)</text>
  </g>

  <!-- Layer 4: Infrastructure / DB -->
  <g transform="translate(40, 260)">
    <rect width="520" height="54" rx="8" fill="#ffffff" stroke="#d97706" stroke-width="1.8" filter="url(#shadow)" />
    <rect x="0" y="0" width="140" height="54" rx="8" fill="#d97706" />
    <rect x="130" y="0" width="10" height="54" fill="#d97706" />
    <text x="70" y="27" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">基礎設施層</text>
    <text x="70" y="42" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#fef3c7" text-anchor="middle">Infrastructure</text>
    <text x="160" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#0f172a">資料庫 (SQL/NoSQL)、檔案儲存、第三方外部 API、訊息佇列</text>
  </g>

  <!-- Downward Dependency Indicators -->
  <line x1="575" y1="83" x2="575" y2="116" stroke="#0284c7" stroke-width="2.5" marker-end="url(#arrow-down)" />
  <line x1="575" y1="151" x2="575" y2="184" stroke="#0284c7" stroke-width="2.5" marker-end="url(#arrow-down)" />
  <line x1="575" y1="219" x2="575" y2="252" stroke="#0284c7" stroke-width="2.5" marker-end="url(#arrow-down)" />

  <!-- Right: Architecture Insights Card -->
  <g transform="translate(615, 56)">
    <rect width="235" height="258" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" filter="url(#shadow)" />
    <rect x="0" y="0" width="235" height="34" rx="10" fill="#f1f5f9" />
    <rect x="0" y="24" width="235" height="10" fill="#f1f5f9" />
    <text x="117" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#334155" text-anchor="middle">核心架構準則</text>

    <text x="16" y="58" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#0284c7">單向相依原則：</text>
    <text x="16" y="76" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#475569">每層僅依賴其正下方層級，</text>
    <text x="16" y="92" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#475569">嚴禁逆向或越級跨層呼叫。</text>

    <line x1="16" y1="110" x2="219" y2="110" stroke="#f1f5f9" stroke-width="1.5" />

    <text x="16" y="132" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#059669">變更隔離價值：</text>
    <text x="16" y="150" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#475569">換資料庫（如 MySQL 換至</text>
    <text x="16" y="166" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#475569">DynamoDB）只需修改最底層，</text>
    <text x="16" y="182" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#475569">核心商業領域邏輯零衝擊！</text>

    <line x1="16" y1="198" x2="219" y2="198" stroke="#f1f5f9" stroke-width="1.5" />

    <text x="16" y="220" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#d97706">架構權衡代價：</text>
    <text x="16" y="238" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#475569">層層物件轉換可能帶來些許</text>
    <text x="16" y="254" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#475569">呼叫開銷 (Overhead)。</text>
  </g>
</svg>
