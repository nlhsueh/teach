<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 350" width="100%" height="100%">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.08" />
    </filter>
    <marker id="arrow-down" viewBox="0 0 10 10" refX="5" refY="8" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 1 0 L 5 10 L 9 0 z" fill="#0284c7" />
    </marker>
  </defs>

  <rect width="880" height="350" fill="#f5f5f5" />
  <rect x="8" y="8" width="864" height="334" fill="#f8fafc" rx="12" stroke="#cbd5e1" stroke-width="1.5" />

  <!-- Pattern Header Badge -->
  <rect x="24" y="20" width="275" height="28" rx="6" fill="#e0f2fe" stroke="#0284c7" stroke-width="1" />
  <text x="34" y="39" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="700" fill="#0369a1">ARCHITECTURAL PATTERN</text>
  <text x="200" y="39" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="700" fill="#64748b">02 / LAYERED</text>

  <!-- Left: 4 Stacked Layers -->
  <!-- Layer 1: Presentation -->
  <g transform="translate(36, 60)">
    <rect width="535" height="54" rx="8" fill="#ffffff" stroke="#0284c7" stroke-width="1.8" filter="url(#shadow)" />
    <rect x="0" y="0" width="150" height="54" rx="8" fill="#0284c7" />
    <rect x="140" y="0" width="10" height="54" fill="#0284c7" />
    <text x="75" y="25" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">Presentation</text>
    <text x="75" y="42" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" fill="#e0f2fe" text-anchor="middle">UI / API Layer</text>
    <text x="166" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#0f172a">Web Views, Mobile UI, REST / GraphQL Controllers</text>
  </g>

  <!-- Layer 2: Application / Service -->
  <g transform="translate(36, 128)">
    <rect width="535" height="54" rx="8" fill="#ffffff" stroke="#6366f1" stroke-width="1.8" filter="url(#shadow)" />
    <rect x="0" y="0" width="150" height="54" rx="8" fill="#6366f1" />
    <rect x="140" y="0" width="10" height="54" fill="#6366f1" />
    <text x="75" y="25" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">Application</text>
    <text x="75" y="42" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" fill="#e0e7ff" text-anchor="middle">Service Layer</text>
    <text x="166" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#0f172a">Use-Case Orchestration, Auth, Transaction Boundaries</text>
  </g>

  <!-- Layer 3: Domain / Business -->
  <g transform="translate(36, 196)">
    <rect width="535" height="54" rx="8" fill="#ffffff" stroke="#059669" stroke-width="1.8" filter="url(#shadow)" />
    <rect x="0" y="0" width="150" height="54" rx="8" fill="#059669" />
    <rect x="140" y="0" width="10" height="54" fill="#059669" />
    <text x="75" y="25" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">Business / Domain</text>
    <text x="75" y="42" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" fill="#d1fae5" text-anchor="middle">Core Logic Layer</text>
    <text x="166" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#0f172a">Domain Entities, Business Rules, Core Algorithms</text>
  </g>

  <!-- Layer 4: Persistence / Infrastructure -->
  <g transform="translate(36, 264)">
    <rect width="535" height="54" rx="8" fill="#ffffff" stroke="#d97706" stroke-width="1.8" filter="url(#shadow)" />
    <rect x="0" y="0" width="150" height="54" rx="8" fill="#d97706" />
    <rect x="140" y="0" width="10" height="54" fill="#d97706" />
    <text x="75" y="25" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">Persistence</text>
    <text x="75" y="42" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" fill="#fef3c7" text-anchor="middle">Infrastructure</text>
    <text x="166" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#0f172a">Repositories, SQL/NoSQL Databases, External Adapters</text>
  </g>

  <!-- Downward Dependency Indicators -->
  <line x1="588" y1="87" x2="588" y2="120" stroke="#0284c7" stroke-width="2.5" marker-end="url(#arrow-down)" />
  <line x1="588" y1="155" x2="588" y2="188" stroke="#0284c7" stroke-width="2.5" marker-end="url(#arrow-down)" />
  <line x1="588" y1="223" x2="588" y2="256" stroke="#0284c7" stroke-width="2.5" marker-end="url(#arrow-down)" />

  <!-- Right: Architecture Insights Card -->
  <g transform="translate(612, 60)">
    <rect width="236" height="258" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" filter="url(#shadow)" />
    <rect x="0" y="0" width="236" height="34" rx="10" fill="#f1f5f9" />
    <rect x="0" y="24" width="236" height="10" fill="#f1f5f9" />
    <text x="118" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#334155" text-anchor="middle">Architectural Rules</text>

    <text x="16" y="56" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#0284c7">Strict Downward Calls:</text>
    <text x="16" y="73" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#475569">Layer N only calls Layer N-1;</text>
    <text x="16" y="89" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#475569">no upward or skipped-layer calls.</text>

    <line x1="16" y1="104" x2="220" y2="104" stroke="#f1f5f9" stroke-width="1.5" />

    <text x="16" y="124" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#059669">Change Isolation:</text>
    <text x="16" y="141" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#475569">Swapping MySQL for DynamoDB</text>
    <text x="16" y="157" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#475569">only touches Persistence; core</text>
    <text x="16" y="173" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#475569">Domain Logic stays untouched.</text>

    <line x1="16" y1="188" x2="220" y2="188" stroke="#f1f5f9" stroke-width="1.5" />

    <text x="16" y="208" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#d97706">Sinkhole Anti-Pattern:</text>
    <text x="16" y="225" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#475569">Pass-through requests across</text>
    <text x="16" y="241" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#475569">all layers add latency overhead.</text>
  </g>
</svg>
