<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 350" width="100%" height="100%">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.08" />
    </filter>
    <marker id="arrow-repo" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0284c7" />
    </marker>
  </defs>

  <rect width="880" height="350" fill="#f5f5f5" />
  <rect x="8" y="8" width="864" height="334" fill="#f8fafc" rx="12" stroke="#cbd5e1" stroke-width="1.5" />

  <!-- Pattern Header Badge -->
  <rect x="24" y="20" width="290" height="28" rx="6" fill="#e0f2fe" stroke="#0284c7" stroke-width="1" />
  <text x="34" y="39" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="700" fill="#0369a1">ARCHITECTURAL PATTERN</text>
  <text x="200" y="39" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="700" fill="#64748b">03 / REPOSITORY</text>

  <!-- Central Repository Cylinder/Box -->
  <g transform="translate(225, 95)">
    <rect width="205" height="175" rx="12" fill="#ffffff" stroke="#0284c7" stroke-width="2.5" filter="url(#shadow)" />
    <!-- Cylinder Top -->
    <path d="M 30 35 C 30 15, 175 15, 175 35 C 175 55, 30 55, 30 35 Z" fill="#e0f2fe" stroke="#0284c7" stroke-width="2" />
    <path d="M 30 35 L 30 75 C 30 95, 175 95, 175 75 L 175 35" fill="#f0f9ff" stroke="#0284c7" stroke-width="2" />
    <path d="M 30 75 L 30 115 C 30 135, 175 135, 175 115 L 175 75" fill="#e0f2fe" stroke="#0284c7" stroke-width="2" />
    <text x="102" y="40" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="700" fill="#0369a1" text-anchor="middle">Central Repository</text>
    <text x="102" y="80" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#0284c7" text-anchor="middle">Shared Data Store</text>
    <text x="102" y="148" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#334155" text-anchor="middle">Authoritative State</text>
    <text x="102" y="164" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#64748b" text-anchor="middle">(e.g., IDE AST / Shared DB)</text>
  </g>

  <!-- Surrounding Subsystems -->
  <!-- Subsystem 1: Editor (Top Left) -->
  <g transform="translate(28, 60)">
    <rect width="142" height="62" rx="8" fill="#ffffff" stroke="#6366f1" stroke-width="1.8" filter="url(#shadow)" />
    <text x="71" y="28" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#312e81" text-anchor="middle">Code Editor</text>
    <text x="71" y="45" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#6366f1" text-anchor="middle">Syntax Highlighting</text>
  </g>
  <line x1="170" y1="98" x2="225" y2="138" stroke="#0284c7" stroke-width="2" marker-end="url(#arrow-repo)" marker-start="url(#arrow-repo)" />

  <!-- Subsystem 2: Compiler (Bottom Left) -->
  <g transform="translate(28, 218)">
    <rect width="142" height="62" rx="8" fill="#ffffff" stroke="#059669" stroke-width="1.8" filter="url(#shadow)" />
    <text x="71" y="28" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#064e3b" text-anchor="middle">Compiler &amp; Parser</text>
    <text x="71" y="45" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#059669" text-anchor="middle">AST Code Generation</text>
  </g>
  <line x1="170" y1="240" x2="225" y2="208" stroke="#0284c7" stroke-width="2" marker-end="url(#arrow-repo)" marker-start="url(#arrow-repo)" />

  <!-- Subsystem 3: Linter (Top Right of Repo) -->
  <g transform="translate(485, 60)">
    <rect width="142" height="62" rx="8" fill="#ffffff" stroke="#d97706" stroke-width="1.8" filter="url(#shadow)" />
    <text x="71" y="28" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#78350f" text-anchor="middle">Static Analyzer</text>
    <text x="71" y="45" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#d97706" text-anchor="middle">Linter &amp; Type Checker</text>
  </g>
  <line x1="485" y1="98" x2="430" y2="138" stroke="#0284c7" stroke-width="2" marker-end="url(#arrow-repo)" marker-start="url(#arrow-repo)" />

  <!-- Subsystem 4: Debugger (Bottom Right of Repo) -->
  <g transform="translate(485, 218)">
    <rect width="142" height="62" rx="8" fill="#ffffff" stroke="#e11d48" stroke-width="1.8" filter="url(#shadow)" />
    <text x="71" y="28" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#881337" text-anchor="middle">Interactive Debugger</text>
    <text x="71" y="45" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#e11d48" text-anchor="middle">Symbol Inspection</text>
  </g>
  <line x1="485" y1="240" x2="430" y2="208" stroke="#0284c7" stroke-width="2" marker-end="url(#arrow-repo)" marker-start="url(#arrow-repo)" />

  <!-- Right: Insights Card -->
  <g transform="translate(648, 60)">
    <rect width="204" height="258" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" filter="url(#shadow)" />
    <rect x="0" y="0" width="204" height="34" rx="10" fill="#f1f5f9" />
    <rect x="0" y="24" width="204" height="10" fill="#f1f5f9" />
    <text x="102" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#334155" text-anchor="middle">Key Characteristics</text>

    <text x="14" y="56" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#0284c7">Hub-and-Spoke Topology:</text>
    <text x="14" y="73" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#475569">Subsystems never call each</text>
    <text x="14" y="89" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#475569">other directly; all data is</text>
    <text x="14" y="105" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#475569">exchanged via the repository.</text>

    <line x1="14" y1="120" x2="190" y2="120" stroke="#f1f5f9" stroke-width="1.5" />

    <text x="14" y="140" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#059669">Primary Strength:</text>
    <text x="14" y="157" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#475569">Fast sharing of large data</text>
    <text x="14" y="173" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#475569">models; easy to plug in tools.</text>

    <line x1="14" y1="188" x2="190" y2="188" stroke="#f1f5f9" stroke-width="1.5" />

    <text x="14" y="208" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#e11d48">Single Point of Failure:</text>
    <text x="14" y="225" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#475569">Repository crash or lock</text>
    <text x="14" y="241" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#475569">halts all connected tools.</text>
  </g>
</svg>
