<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 350" width="100%" height="100%">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.08" />
    </filter>
    <marker id="arrow-ms" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0284c7" />
    </marker>
    <marker id="arrow-event" viewBox="0 0 10 10" refX="5" refY="8" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 1 0 L 5 10 L 9 0 z" fill="#6366f1" />
    </marker>
  </defs>

  <rect width="880" height="350" fill="#f5f5f5" />
  <rect x="8" y="8" width="864" height="334" fill="#f8fafc" rx="12" stroke="#cbd5e1" stroke-width="1.5" />

  <!-- Pattern Header Badge -->
  <rect x="24" y="20" width="330" height="28" rx="6" fill="#e0f2fe" stroke="#0284c7" stroke-width="1" />
  <text x="34" y="39" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="700" fill="#0369a1">ARCHITECTURAL PATTERN</text>
  <text x="200" y="39" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="700" fill="#64748b">06 / MICROSERVICES</text>

  <!-- Left: API Gateway -->
  <g transform="translate(32, 62)">
    <rect width="120" height="196" rx="10" fill="#ffffff" stroke="#0284c7" stroke-width="2" filter="url(#shadow)" />
    <rect x="0" y="0" width="120" height="30" rx="10" fill="#0284c7" />
    <rect x="0" y="20" width="120" height="10" fill="#0284c7" />
    <text x="60" y="20" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">API Gateway</text>
    <text x="60" y="54" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="700" fill="#0f172a" text-anchor="middle">Unified Entrypoint</text>
    <text x="60" y="82" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#475569" text-anchor="middle">• Request Routing</text>
    <text x="60" y="102" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#475569" text-anchor="middle">• Auth &amp; JWT Verify</text>
    <text x="60" y="122" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#475569" text-anchor="middle">• Rate Limiting</text>
    <text x="60" y="142" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#475569" text-anchor="middle">• Load Balancing</text>
    <text x="60" y="174" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5" font-weight="700" fill="#0284c7" text-anchor="middle">(Kong / Envoy)</text>
  </g>

  <!-- Middle: 3 Autonomous Microservice Pods -->
  <!-- Service 1: User Service -->
  <g transform="translate(192, 62)">
    <rect width="136" height="196" rx="8" fill="#ffffff" stroke="#6366f1" stroke-width="1.8" filter="url(#shadow)" />
    <rect x="0" y="0" width="136" height="26" rx="8" fill="#6366f1" />
    <rect x="0" y="16" width="136" height="10" fill="#6366f1" />
    <text x="68" y="17" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">User Service</text>
    <text x="68" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600" fill="#312e81" text-anchor="middle">Node.js / Go</text>
    <text x="68" y="60" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5" fill="#64748b" text-anchor="middle">Isolated Container</text>

    <!-- DB 1 -->
    <g transform="translate(18, 80)">
      <rect width="100" height="50" rx="6" fill="#f5f3ff" stroke="#a78bfa" stroke-width="1.5" />
      <text x="50" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700" fill="#4c1d95" text-anchor="middle">Private DB</text>
      <text x="50" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" fill="#6d28d9" text-anchor="middle">Postgres (Users)</text>
    </g>
    <text x="68" y="152" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" fill="#64748b" text-anchor="middle">No Cross-DB Joins!</text>
    <text x="68" y="175" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5" font-weight="700" fill="#6366f1" text-anchor="middle">Independent CI/CD</text>
  </g>
  <line x1="152" y1="92" x2="187" y2="92" stroke="#0284c7" stroke-width="2" marker-end="url(#arrow-ms)" />

  <!-- Service 2: Order Service -->
  <g transform="translate(342, 62)">
    <rect width="136" height="196" rx="8" fill="#ffffff" stroke="#059669" stroke-width="1.8" filter="url(#shadow)" />
    <rect x="0" y="0" width="136" height="26" rx="8" fill="#059669" />
    <rect x="0" y="16" width="136" height="10" fill="#059669" />
    <text x="68" y="17" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">Order Service</text>
    <text x="68" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600" fill="#064e3b" text-anchor="middle">Java Spring Boot</text>
    <text x="68" y="60" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5" fill="#64748b" text-anchor="middle">Isolated Container</text>

    <!-- DB 2 -->
    <g transform="translate(18, 80)">
      <rect width="100" height="50" rx="6" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="1.5" />
      <text x="50" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700" fill="#064e3b" text-anchor="middle">Private DB</text>
      <text x="50" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" fill="#047857" text-anchor="middle">MongoDB (Orders)</text>
    </g>
    <text x="68" y="152" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" fill="#64748b" text-anchor="middle">Saga Distributed Tx</text>
    <text x="68" y="175" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5" font-weight="700" fill="#059669" text-anchor="middle">Auto-Scaling Pods</text>
  </g>
  <line x1="152" y1="132" x2="337" y2="132" stroke="#0284c7" stroke-width="2" marker-end="url(#arrow-ms)" />

  <!-- Service 3: Payment Service -->
  <g transform="translate(492, 62)">
    <rect width="136" height="196" rx="8" fill="#ffffff" stroke="#d97706" stroke-width="1.8" filter="url(#shadow)" />
    <rect x="0" y="0" width="136" height="26" rx="8" fill="#d97706" />
    <rect x="0" y="16" width="136" height="10" fill="#d97706" />
    <text x="68" y="17" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">Payment Service</text>
    <text x="68" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600" fill="#78350f" text-anchor="middle">Python / FastAPI</text>
    <text x="68" y="60" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5" fill="#64748b" text-anchor="middle">PCI-DSS Isolated</text>

    <!-- DB 3 -->
    <g transform="translate(18, 80)">
      <rect width="100" height="50" rx="6" fill="#fffbeb" stroke="#fcd34d" stroke-width="1.5" />
      <text x="50" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700" fill="#78350f" text-anchor="middle">Private DB</text>
      <text x="50" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" fill="#b45309" text-anchor="middle">MySQL (Payments)</text>
    </g>
    <text x="68" y="152" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" fill="#64748b" text-anchor="middle">Blast-Radius Guard</text>
    <text x="68" y="175" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5" font-weight="700" fill="#d97706" text-anchor="middle">Polyglot Tech Stack</text>
  </g>
  <line x1="152" y1="172" x2="487" y2="172" stroke="#0284c7" stroke-width="2" marker-end="url(#arrow-ms)" />

  <!-- Bottom: Event Broker Bus (Kafka) -->
  <g transform="translate(192, 272)">
    <rect width="436" height="48" rx="8" fill="#1e1b4b" filter="url(#shadow)" />
    <text x="218" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#a5b4fc" text-anchor="middle">Asynchronous Event Broker (Kafka / RabbitMQ Message Bus)</text>
    <text x="218" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5" fill="#e0e7ff" text-anchor="middle">Pub/Sub Domain Events (e.g., OrderCreatedEvent → triggers Payment &amp; Notification)</text>
  </g>
  <!-- Event Connections -->
  <line x1="260" y1="258" x2="260" y2="267" stroke="#6366f1" stroke-width="2" marker-end="url(#arrow-event)" />
  <line x1="410" y1="258" x2="410" y2="267" stroke="#059669" stroke-width="2" marker-end="url(#arrow-event)" />
  <line x1="560" y1="258" x2="560" y2="267" stroke="#d97706" stroke-width="2" marker-end="url(#arrow-event)" />

  <!-- Right: Insights Card -->
  <g transform="translate(644, 62)">
    <rect width="208" height="258" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" filter="url(#shadow)" />
    <rect x="0" y="0" width="208" height="34" rx="10" fill="#f1f5f9" />
    <rect x="0" y="24" width="208" height="10" fill="#f1f5f9" />
    <text x="104" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#334155" text-anchor="middle">MSA Core Trade-offs</text>

    <text x="14" y="56" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#059669">Key Advantages:</text>
    <text x="14" y="74" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" fill="#475569">• Team &amp; CI/CD autonomy</text>
    <text x="14" y="90" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" fill="#475569">• Fault isolation (local crash</text>
    <text x="14" y="106" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" fill="#475569">  does not bring down site)</text>
    <text x="14" y="122" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" fill="#475569">• Polyglot stack freedom</text>

    <line x1="14" y1="136" x2="194" y2="136" stroke="#f1f5f9" stroke-width="1.5" />

    <text x="14" y="156" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#e11d48">Severe Challenges:</text>
    <text x="14" y="174" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" fill="#475569">• Distributed network latency</text>
    <text x="14" y="190" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" fill="#475569">• Eventual consistency (Saga)</text>
    <text x="14" y="206" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" fill="#475569">• Complex distributed tracing</text>
    <text x="14" y="222" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" fill="#475569">• High Kubernetes/DevOps cost</text>
  </g>
</svg>
