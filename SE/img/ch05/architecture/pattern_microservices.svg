<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 340" width="100%" height="100%">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.08" />
    </filter>
    <marker id="arrow-ms" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0284c7" />
    </marker>
    <marker id="arrow-event" viewBox="0 0 10 10" refX="5" refY="8" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 1 0 L 5 10 L 9 0 z" fill="#6366f1" />
    </marker>
  </defs>

  <rect width="880" height="340" fill="#f8fafc" rx="12" stroke="#e2e8f0" stroke-width="1.5" />

  <!-- Pattern Header Badge -->
  <rect x="24" y="16" width="320" height="28" rx="6" fill="#e0f2fe" stroke="#0284c7" stroke-width="1" />
  <text x="34" y="35" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#0369a1">ARCHITECTURAL PATTERN</text>
  <text x="180" y="35" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#64748b">06 / MICROSERVICES</text>

  <!-- Left: API Gateway -->
  <g transform="translate(35, 60)">
    <rect width="115" height="195" rx="10" fill="#ffffff" stroke="#0284c7" stroke-width="2" filter="url(#shadow)" />
    <rect x="0" y="0" width="115" height="30" rx="10" fill="#0284c7" />
    <rect x="0" y="20" width="115" height="10" fill="#0284c7" />
    <text x="57" y="20" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">API 閘道器</text>
    <text x="57" y="55" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#0f172a" text-anchor="middle">API Gateway</text>
    <text x="57" y="85" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#64748b" text-anchor="middle">• 單一入口路由</text>
    <text x="57" y="105" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#64748b" text-anchor="middle">• 權限身分驗證</text>
    <text x="57" y="125" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#64748b" text-anchor="middle">• 速率流量限制</text>
    <text x="57" y="145" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#64748b" text-anchor="middle">• 協定轉發轉換</text>
    <text x="57" y="175" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="700" fill="#0284c7" text-anchor="middle">(Kong / Envoy)</text>
  </g>

  <!-- Middle: 3 Autonomous Microservice Pods -->
  <!-- Service 1: User Service -->
  <g transform="translate(195, 60)">
    <rect width="135" height="195" rx="8" fill="#ffffff" stroke="#6366f1" stroke-width="1.8" filter="url(#shadow)" />
    <rect x="0" y="0" width="135" height="26" rx="8" fill="#6366f1" />
    <rect x="0" y="16" width="135" height="10" fill="#6366f1" />
    <text x="67" y="17" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">會員服務 (User)</text>
    <text x="67" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600" fill="#312e81" text-anchor="middle">Node.js / Go</text>
    <text x="67" y="60" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" fill="#64748b" text-anchor="middle">獨立 Docker 容器</text>

    <!-- DB 1 -->
    <g transform="translate(20, 80)">
      <rect width="95" height="50" rx="6" fill="#f5f3ff" stroke="#a78bfa" stroke-width="1.5" />
      <text x="47" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700" fill="#4c1d95" text-anchor="middle">私有資料庫</text>
      <text x="47" y="40" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" fill="#6d28d9" text-anchor="middle">Postgres (User)</text>
    </g>
    <text x="67" y="152" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" fill="#64748b" text-anchor="middle">嚴禁他服務直連！</text>
    <text x="67" y="175" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="700" fill="#6366f1" text-anchor="middle">獨立 CI/CD 部署</text>
  </g>
  <!-- Gateway to Svc 1 -->
  <line x1="150" y1="90" x2="190" y2="90" stroke="#0284c7" stroke-width="2" marker-end="url(#arrow-ms)" />

  <!-- Service 2: Order Service -->
  <g transform="translate(345, 60)">
    <rect width="135" height="195" rx="8" fill="#ffffff" stroke="#059669" stroke-width="1.8" filter="url(#shadow)" />
    <rect x="0" y="0" width="135" height="26" rx="8" fill="#059669" />
    <rect x="0" y="16" width="135" height="10" fill="#059669" />
    <text x="67" y="17" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">訂單服務 (Order)</text>
    <text x="67" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600" fill="#064e3b" text-anchor="middle">Java Spring Boot</text>
    <text x="67" y="60" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" fill="#64748b" text-anchor="middle">獨立 Docker 容器</text>

    <!-- DB 2 -->
    <g transform="translate(20, 80)">
      <rect width="95" height="50" rx="6" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="1.5" />
      <text x="47" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700" fill="#064e3b" text-anchor="middle">私有資料庫</text>
      <text x="47" y="40" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" fill="#047857" text-anchor="middle">MongoDB (Order)</text>
    </g>
    <text x="67" y="152" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" fill="#64748b" text-anchor="middle">跨服務交易走 Saga</text>
    <text x="67" y="175" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="700" fill="#059669" text-anchor="middle">水平獨立彈性擴充</text>
  </g>
  <!-- Gateway to Svc 2 -->
  <line x1="150" y1="130" x2="340" y2="130" stroke="#0284c7" stroke-width="2" marker-end="url(#arrow-ms)" />

  <!-- Service 3: Payment Service -->
  <g transform="translate(495, 60)">
    <rect width="135" height="195" rx="8" fill="#ffffff" stroke="#d97706" stroke-width="1.8" filter="url(#shadow)" />
    <rect x="0" y="0" width="135" height="26" rx="8" fill="#d97706" />
    <rect x="0" y="16" width="135" height="10" fill="#d97706" />
    <text x="67" y="17" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">支付服務 (Pay)</text>
    <text x="67" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600" fill="#78350f" text-anchor="middle">Python / FastAPI</text>
    <text x="67" y="60" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" fill="#64748b" text-anchor="middle">PCI-DSS 資安隔離</text>

    <!-- DB 3 -->
    <g transform="translate(20, 80)">
      <rect width="95" height="50" rx="6" fill="#fffbeb" stroke="#fcd34d" stroke-width="1.5" />
      <text x="47" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700" fill="#78350f" text-anchor="middle">私有資料庫</text>
      <text x="47" y="40" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" fill="#b45309" text-anchor="middle">MySQL (Payment)</text>
    </g>
    <text x="67" y="152" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" fill="#64748b" text-anchor="middle">最高資安防護壁壘</text>
    <text x="67" y="175" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="700" fill="#d97706" text-anchor="middle">異質語言架構彈性</text>
  </g>
  <!-- Gateway to Svc 3 -->
  <line x1="150" y1="170" x2="490" y2="170" stroke="#0284c7" stroke-width="2" marker-end="url(#arrow-ms)" />

  <!-- Bottom: Event Broker Bus (Kafka) -->
  <g transform="translate(195, 270)">
    <rect width="435" height="48" rx="8" fill="#1e1b4b" filter="url(#shadow)" />
    <text x="217" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#a5b4fc" text-anchor="middle">非同步事件中介匯流排 (Kafka / RabbitMQ Event Bus)</text>
    <text x="217" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" fill="#e0e7ff" text-anchor="middle">訂閱發布解耦事件 (如: OrderCreatedEvent → 通知支付與發票服務)</text>
  </g>
  <!-- Event Connections -->
  <line x1="262" y1="255" x2="262" y2="265" stroke="#6366f1" stroke-width="2" marker-end="url(#arrow-event)" />
  <line x1="412" y1="255" x2="412" y2="265" stroke="#059669" stroke-width="2" marker-end="url(#arrow-event)" />
  <line x1="562" y1="255" x2="562" y2="265" stroke="#d97706" stroke-width="2" marker-end="url(#arrow-event)" />

  <!-- Right: Insights Card -->
  <g transform="translate(645, 60)">
    <rect width="210" height="258" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" filter="url(#shadow)" />
    <rect x="0" y="0" width="210" height="34" rx="10" fill="#f1f5f9" />
    <rect x="0" y="24" width="210" height="10" fill="#f1f5f9" />
    <text x="105" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#334155" text-anchor="middle">微服務架構核心權衡</text>

    <text x="14" y="58" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#059669">核心優勢：</text>
    <text x="14" y="76" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#475569">• 團隊自治與獨立 CI/CD</text>
    <text x="14" y="92" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#475569">• 故障隔離（單一服務掛掉</text>
    <text x="14" y="108" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#475569">  不致造成全站雪崩崩潰）</text>
    <text x="14" y="124" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#475569">• 異質技術棧自由選用</text>

    <line x1="14" y1="138" x2="196" y2="138" stroke="#f1f5f9" stroke-width="1.5" />

    <text x="14" y="160" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#e11d48">嚴峻挑戰 (代價)：</text>
    <text x="14" y="178" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#475569">• 分散式系統極為複雜</text>
    <text x="14" y="194" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#475569">• 跨庫資料最終一致性 (Saga)</text>
    <text x="14" y="210" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#475569">• 網路延遲與除錯極為困難</text>
    <text x="14" y="226" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#475569">• DevOps 與維運成本飆升</text>
  </g>
</svg>
