<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 360" width="100%" height="100%">
  <defs>
    <filter id="shadow" x="-4%" y="-4%" width="108%" height="112%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#0f172a" flood-opacity="0.07" />
    </filter>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0284c7" />
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#059669" />
    </marker>
    <marker id="arr-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#d97706" />
    </marker>
    <marker id="arr-indigo" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#4f46e5" />
    </marker>
  </defs>

  <!-- Outer background matching slide #f5f5f5 -->
  <rect width="920" height="360" fill="#f5f5f5" />
  <rect x="6" y="6" width="908" height="348" fill="#f8fafc" rx="12" stroke="#cbd5e1" stroke-width="1.5" />

  <!-- Top Title Banner -->
  <rect x="20" y="16" width="520" height="26" rx="6" fill="#e0f2fe" stroke="#0284c7" stroke-width="1" />
  <text x="30" y="33" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="800" fill="#0369a1">CASE STUDY SYNTHESIS</text>
  <text x="182" y="33" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="700" fill="#334155">FOOD DELIVERY PLATFORM — 6 PATTERNS WORKING TOGETHER</text>

  <!-- =========================================================================
       ZONE 1 (LEFT): CLIENT-SERVER & MVC (EDGE CLIENTS)
       ========================================================================= -->
  <g transform="translate(20, 50)">
    <rect width="218" height="292" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5,3" filter="url(#shadow)" />
    <!-- Badge: #4 Client-Server -->
    <rect x="10" y="10" width="198" height="24" rx="5" fill="#0284c7" />
    <text x="109" y="26" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">[4] CLIENT-SERVER (Edge Tier)</text>

    <!-- Customer App with MVC Zoom-in -->
    <g transform="translate(10, 42)">
      <rect width="198" height="134" rx="7" fill="#fffbeb" stroke="#d97706" stroke-width="1.6" />
      <rect width="198" height="22" rx="7" fill="#fef3c7" />
      <text x="99" y="15" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10.5" font-weight="700" fill="#92400e" text-anchor="middle">Customer App → [1] MVC Pattern</text>

      <!-- Mini MVC Triangle -->
      <rect x="12" y="30" width="76" height="32" rx="4" fill="#ffffff" stroke="#0284c7" stroke-width="1.3" />
      <text x="50" y="44" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9.5" font-weight="700" fill="#0369a1" text-anchor="middle">Controller</text>
      <text x="50" y="56" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="8.5" fill="#64748b" text-anchor="middle">Checkout / Tap</text>

      <rect x="110" y="30" width="76" height="32" rx="4" fill="#ffffff" stroke="#d97706" stroke-width="1.3" />
      <text x="148" y="44" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9.5" font-weight="700" fill="#b45309" text-anchor="middle">Views</text>
      <text x="148" y="56" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="8.5" fill="#64748b" text-anchor="middle">Map &amp; Status UI</text>

      <rect x="44" y="82" width="110" height="34" rx="4" fill="#ffffff" stroke="#059669" stroke-width="1.3" />
      <text x="99" y="96" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9.5" font-weight="700" fill="#047857" text-anchor="middle">Model (Cart / Order)</text>
      <text x="99" y="108" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="8.5" fill="#64748b" text-anchor="middle">State &amp; ETA Data</text>

      <line x1="56" y1="62" x2="72" y2="80" stroke="#0284c7" stroke-width="1.5" marker-end="url(#arr-blue)" />
      <line x1="126" y1="80" x2="142" y2="64" stroke="#059669" stroke-width="1.5" marker-end="url(#arr-green)" />
      <text x="99" y="127" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9" font-weight="600" fill="#92400e" text-anchor="middle">1 Model drives Map + Progress Views</text>
    </g>

    <!-- Other Clients -->
    <g transform="translate(10, 184)">
      <rect width="198" height="44" rx="6" fill="#f8fafc" stroke="#64748b" stroke-width="1.3" />
      <text x="99" y="19" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10.5" font-weight="700" fill="#1e293b" text-anchor="middle">Merchant POS Tablet</text>
      <text x="99" y="34" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9" fill="#64748b" text-anchor="middle">Accepts orders &amp; kitchen prep status</text>
    </g>

    <g transform="translate(10, 236)">
      <rect width="198" height="44" rx="6" fill="#f8fafc" stroke="#64748b" stroke-width="1.3" />
      <text x="99" y="19" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10.5" font-weight="700" fill="#1e293b" text-anchor="middle">Courier / Rider App</text>
      <text x="99" y="34" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9" fill="#0284c7" text-anchor="middle">Streams live GPS every 2 seconds</text>
    </g>
  </g>

  <!-- Client-Server Network Arrow -->
  <line x1="238" y1="145" x2="274" y2="145" stroke="#0284c7" stroke-width="2.2" marker-end="url(#arr-blue)" marker-start="url(#arr-blue)" />
  <text x="256" y="135" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="8.5" font-weight="700" fill="#0284c7" text-anchor="middle">HTTPS</text>
  <text x="256" y="160" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="8.5" font-weight="700" fill="#0284c7" text-anchor="middle">REST</text>

  <!-- =========================================================================
       ZONE 2 (CENTER): MICROSERVICES & LAYERED ARCHITECTURE
       ========================================================================= -->
  <g transform="translate(278, 50)">
    <rect width="340" height="292" rx="10" fill="#ffffff" stroke="#059669" stroke-width="1.8" filter="url(#shadow)" />
    <!-- Badge: #6 Microservices -->
    <rect x="10" y="10" width="320" height="24" rx="5" fill="#059669" />
    <text x="170" y="26" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">[6] MICROSERVICES (Autonomous Backend Domains)</text>

    <!-- API Gateway Bar -->
    <rect x="10" y="42" width="320" height="26" rx="5" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.3" />
    <text x="170" y="59" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10.5" font-weight="700" fill="#0369a1" text-anchor="middle">API Gateway (Auth, Routing, Rate Limiting)</text>

    <!-- Left Sub-column: Menu & Payment Microservices -->
    <g transform="translate(10, 76)">
      <rect width="115" height="72" rx="6" fill="#f5f3ff" stroke="#6366f1" stroke-width="1.4" />
      <text x="57" y="18" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" font-weight="700" fill="#312e81" text-anchor="middle">Menu Service</text>
      <text x="57" y="33" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="8.5" fill="#475569" text-anchor="middle">Catalog &amp; Search</text>
      <rect x="12" y="42" width="91" height="22" rx="4" fill="#ede9fe" stroke="#8b5cf6" stroke-width="1" />
      <text x="57" y="56" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="8.5" font-weight="700" fill="#5b21b6" text-anchor="middle">MongoDB (Menu)</text>
    </g>

    <g transform="translate(10, 156)">
      <rect width="115" height="72" rx="6" fill="#fffbeb" stroke="#d97706" stroke-width="1.4" />
      <text x="57" y="18" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" font-weight="700" fill="#78350f" text-anchor="middle">Payment Service</text>
      <text x="57" y="33" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="8.5" fill="#475569" text-anchor="middle">PCI-DSS Isolated</text>
      <rect x="12" y="42" width="91" height="22" rx="4" fill="#fef3c7" stroke="#f59e0b" stroke-width="1" />
      <text x="57" y="56" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="8.5" font-weight="700" fill="#92400e" text-anchor="middle">MySQL (Ledger)</text>
    </g>

    <!-- Right Sub-column: Order Service Zoomed-In showing [2] LAYERED ARCHITECTURE -->
    <g transform="translate(133, 76)">
      <rect width="197" height="152" rx="6" fill="#f0fdf4" stroke="#059669" stroke-width="1.6" />
      <rect width="197" height="22" rx="6" fill="#dcfce7" />
      <text x="98" y="15" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9.5" font-weight="700" fill="#065f46" text-anchor="middle">Order Service → [2] LAYERED</text>

      <!-- 4 Mini Layers -->
      <rect x="10" y="28" width="177" height="23" rx="4" fill="#ffffff" stroke="#0284c7" stroke-width="1.2" />
      <text x="98" y="43" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9" font-weight="700" fill="#0369a1" text-anchor="middle">1. Presentation (OrderController)</text>

      <rect x="10" y="56" width="177" height="23" rx="4" fill="#ffffff" stroke="#6366f1" stroke-width="1.2" />
      <text x="98" y="71" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9" font-weight="700" fill="#4338ca" text-anchor="middle">2. Application (OrderWorkflow)</text>

      <rect x="10" y="84" width="177" height="23" rx="4" fill="#ffffff" stroke="#059669" stroke-width="1.2" />
      <text x="98" y="99" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9" font-weight="700" fill="#047857" text-anchor="middle">3. Domain (Fee &amp; Promo Rules)</text>

      <rect x="10" y="112" width="177" height="23" rx="4" fill="#ffffff" stroke="#d97706" stroke-width="1.2" />
      <text x="98" y="127" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9" font-weight="700" fill="#b45309" text-anchor="middle">4. Persistence (OrderRepo + DB)</text>
    </g>

    <!-- Bottom Event Bus -->
    <g transform="translate(10, 238)">
      <rect width="320" height="42" rx="6" fill="#1e1b4b" />
      <text x="160" y="18" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" font-weight="700" fill="#a5b4fc" text-anchor="middle">Kafka Event Bus (OrderPlaced → Payment → Dispatch)</text>
      <text x="160" y="33" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="8.5" fill="#e0e7ff" text-anchor="middle">Decouples microservices &amp; feeds real-time dispatch pipelines</text>
    </g>
  </g>

  <!-- Arrows from Center to Right Zones -->
  <line x1="618" y1="115" x2="642" y2="115" stroke="#d97706" stroke-width="2" marker-end="url(#arr-amber)" />
  <line x1="618" y1="265" x2="642" y2="265" stroke="#4f46e5" stroke-width="2" marker-end="url(#arr-indigo)" />

  <!-- =========================================================================
       ZONE 3A (TOP RIGHT): PIPE & FILTER (GPS & ETA STREAM PIPELINE)
       ========================================================================= -->
  <g transform="translate(644, 50)">
    <rect width="256" height="136" rx="10" fill="#ffffff" stroke="#d97706" stroke-width="1.8" filter="url(#shadow)" />
    <rect x="10" y="10" width="236" height="24" rx="5" fill="#d97706" />
    <text x="128" y="26" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10.5" font-weight="700" fill="#ffffff" text-anchor="middle">[5] PIPE &amp; FILTER (Telemetry Stream)</text>

    <!-- 3 Filters connected by Pipes -->
    <g transform="translate(10, 44)">
      <rect width="68" height="54" rx="5" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.3" />
      <text x="34" y="19" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9" font-weight="700" fill="#92400e" text-anchor="middle">Filter 1</text>
      <text x="34" y="33" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="8.5" fill="#475569" text-anchor="middle">GPS Denoise</text>
      <text x="34" y="45" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="8" fill="#64748b" text-anchor="middle">Drop outliers</text>
    </g>

    <line x1="78" y1="71" x2="92" y2="71" stroke="#d97706" stroke-width="2" marker-end="url(#arr-amber)" />

    <g transform="translate(94, 44)">
      <rect width="68" height="54" rx="5" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.3" />
      <text x="34" y="19" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9" font-weight="700" fill="#92400e" text-anchor="middle">Filter 2</text>
      <text x="34" y="33" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="8.5" fill="#475569" text-anchor="middle">Map Match</text>
      <text x="34" y="45" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="8" fill="#64748b" text-anchor="middle">Snap to road</text>
    </g>

    <line x1="162" y1="71" x2="176" y2="71" stroke="#d97706" stroke-width="2" marker-end="url(#arr-amber)" />

    <g transform="translate(178, 44)">
      <rect width="68" height="54" rx="5" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.3" />
      <text x="34" y="19" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9" font-weight="700" fill="#92400e" text-anchor="middle">Filter 3</text>
      <text x="34" y="33" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="8.5" fill="#475569" text-anchor="middle">ETA Compute</text>
      <text x="34" y="45" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="8" fill="#64748b" text-anchor="middle">Traffic model</text>
    </g>

    <text x="128" y="118" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9" font-weight="600" fill="#92400e" text-anchor="middle">Processes 100k+ live rider GPS pings/sec via pipes</text>
  </g>

  <!-- =========================================================================
       ZONE 3B (BOTTOM RIGHT): REPOSITORY (DISPATCH BLACKBOARD HUB)
       ========================================================================= -->
  <g transform="translate(644, 198)">
    <rect width="256" height="144" rx="10" fill="#ffffff" stroke="#4f46e5" stroke-width="1.8" filter="url(#shadow)" />
    <rect x="10" y="10" width="236" height="24" rx="5" fill="#4f46e5" />
    <text x="128" y="26" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10.5" font-weight="700" fill="#ffffff" text-anchor="middle">[3] REPOSITORY (AI Dispatch Hub)</text>

    <!-- Central Repository Box -->
    <g transform="translate(68, 42)">
      <rect width="120" height="44" rx="6" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.8" />
      <text x="60" y="19" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9.5" font-weight="700" fill="#312e81" text-anchor="middle">Geo-State Repository</text>
      <text x="60" y="34" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="8.5" fill="#4338ca" text-anchor="middle">Live Orders + Riders Map</text>
    </g>

    <!-- Surrounding Agents -->
    <g transform="translate(10, 100)">
      <rect width="74" height="32" rx="4" fill="#f8fafc" stroke="#6366f1" stroke-width="1.2" />
      <text x="37" y="14" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="8.5" font-weight="700" fill="#312e81" text-anchor="middle">Route Solver</text>
      <text x="37" y="26" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="7.5" fill="#64748b" text-anchor="middle">Shortest Path</text>
    </g>

    <g transform="translate(91, 100)">
      <rect width="74" height="32" rx="4" fill="#f8fafc" stroke="#6366f1" stroke-width="1.2" />
      <text x="37" y="14" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="8.5" font-weight="700" fill="#312e81" text-anchor="middle">Order Batcher</text>
      <text x="37" y="26" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="7.5" fill="#64748b" text-anchor="middle">Group Orders</text>
    </g>

    <g transform="translate(172, 100)">
      <rect width="74" height="32" rx="4" fill="#f8fafc" stroke="#6366f1" stroke-width="1.2" />
      <text x="37" y="14" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="8.5" font-weight="700" fill="#312e81" text-anchor="middle">Surge Pricer</text>
      <text x="37" y="26" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="7.5" fill="#64748b" text-anchor="middle">Supply/Demand</text>
    </g>

    <!-- Hub Arrows -->
    <line x1="47" y1="100" x2="92" y2="86" stroke="#4f46e5" stroke-width="1.4" marker-end="url(#arr-indigo)" />
    <line x1="128" y1="100" x2="128" y2="86" stroke="#4f46e5" stroke-width="1.4" marker-end="url(#arr-indigo)" />
    <line x1="209" y1="100" x2="164" y2="86" stroke="#4f46e5" stroke-width="1.4" marker-end="url(#arr-indigo)" />
  </g>
</svg>

