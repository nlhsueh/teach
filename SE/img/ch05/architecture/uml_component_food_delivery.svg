<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 580" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #f5f5f5; }
      .panel { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2; rx: 12; }
      .panel-header { fill: #0f172a; rx: 10; }
      .title { font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 16px; font-weight: 800; fill: #ffffff; }
      .subtitle { font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 12.5px; font-weight: 700; fill: #0f172a; }
      .comp-title { font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 13px; font-weight: 800; fill: #0f172a; }
      .desc { font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 11px; fill: #475569; }
      .mono { font-family: 'Consolas', 'Courier New', monospace; font-size: 11px; font-weight: 700; fill: #0f172a; }
      .iface { font-family: 'Consolas', 'Courier New', monospace; font-size: 11px; font-weight: 700; fill: #1d4ed8; }
      .stereo { font-family: 'Consolas', 'Courier New', monospace; font-size: 10.5px; font-style: italic; fill: #475569; }
      .comp-box-blue { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2.2; rx: 6; }
      .comp-box-green { fill: #ecfdf5; stroke: #047857; stroke-width: 2.2; rx: 6; }
      .comp-box-amber { fill: #fffbeb; stroke: #b45309; stroke-width: 2.2; rx: 6; }
      .comp-box-purple { fill: #f5f3ff; stroke: #6d28d9; stroke-width: 2.2; rx: 6; }
      .wire { stroke: #1e293b; stroke-width: 2.2; fill: none; }
      .lollipop { fill: #ffffff; stroke: #1d4ed8; stroke-width: 2.5; }
      .socket { fill: none; stroke: #b45309; stroke-width: 2.5; stroke-linecap: round; }
      .port { fill: #ffffff; stroke: #1d4ed8; stroke-width: 2; }
    </style>
    <!-- Reusable UML Component Icon (top-right corner symbol) -->
    <g id="comp-icon">
      <rect x="0" y="0" width="16" height="20" fill="#ffffff" stroke="#334155" stroke-width="1.6" rx="1" />
      <rect x="-5" y="3" width="9" height="5" fill="#ffffff" stroke="#334155" stroke-width="1.5" />
      <rect x="-5" y="12" width="9" height="5" fill="#ffffff" stroke="#334155" stroke-width="1.5" />
    </g>
    <marker id="delegate-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#475569" stroke-width="2" />
    </marker>
  </defs>

  <!-- Outer Background (#f5f5f5 per Rule 6) -->
  <rect width="1200" height="580" class="bg" />

  <!-- ================= LEFT PANEL: UML COMPONENT DIAGRAM NOTATION ================= -->
  <rect x="20" y="18" width="405" height="544" class="panel" />
  <rect x="20" y="18" width="405" height="38" class="panel-header" />
  <text x="222" y="42" text-anchor="middle" class="title">UML Component Diagram Notation Legend</text>

  <!-- 1. Component Classifier -->
  <rect x="36" y="68" width="373" height="104" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5" />
  <text x="48" y="88" class="subtitle">1. Component Classifier («component»)</text>
  <rect x="48" y="100" width="145" height="58" class="comp-box-blue" />
  <use href="#comp-icon" x="170" y="107" />
  <text x="112" y="120" text-anchor="middle" class="stereo">«component»</text>
  <text x="115" y="140" text-anchor="middle" class="comp-title">OrderService</text>
  <text x="206" y="114" class="desc">A modular, replaceable unit</text>
  <text x="206" y="130" class="desc">that encapsulates state &amp; behavior</text>
  <text x="206" y="146" class="desc">behind explicit interfaces.</text>
  <text x="206" y="162" class="desc" font-weight="700" fill="#1d4ed8">Icon: 2-tabbed box in top-right.</text>

  <!-- 2. Provided Interface (Lollipop) -->
  <rect x="36" y="182" width="373" height="94" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5" />
  <text x="48" y="202" class="subtitle">2. Provided Interface — "Lollipop / Ball" (—○)</text>
  <rect x="48" y="216" width="84" height="44" class="comp-box-green" />
  <text x="90" y="242" text-anchor="middle" class="mono">Provider</text>
  <line x1="132" y1="238" x2="178" y2="238" class="wire" />
  <circle cx="186" cy="238" r="8" class="lollipop" />
  <text x="186" y="222" text-anchor="middle" class="iface">IPaymentAPI</text>
  <text x="220" y="226" class="desc">Contract that the component</text>
  <text x="220" y="242" class="desc"><tspan font-weight="700" fill="#047857">realizes &amp; exposes</tspan> to clients</text>
  <text x="220" y="258" class="desc">(e.g., REST/gRPC/Service API).</text>

  <!-- 3. Required Interface (Socket) -->
  <rect x="36" y="286" width="373" height="94" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5" />
  <text x="48" y="306" class="subtitle">3. Required Interface — "Socket" (—( )</text>
  <rect x="48" y="320" width="84" height="44" class="comp-box-amber" />
  <text x="90" y="346" text-anchor="middle" class="mono">Consumer</text>
  <line x1="132" y1="342" x2="176" y2="342" class="wire" />
  <path d="M 188 330 A 12 12 0 0 0 188 354" class="socket" />
  <text x="185" y="324" text-anchor="middle" class="iface" fill="#b45309">IPaymentAPI</text>
  <text x="220" y="330" class="desc">Contract that the component</text>
  <text x="220" y="346" class="desc"><tspan font-weight="700" fill="#b45309">requires / depends on</tspan> from an</text>
  <text x="220" y="362" class="desc">external provider to operate.</text>

  <!-- 4. Assembly Connector & Port -->
  <rect x="36" y="390" width="373" height="156" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5" />
  <text x="48" y="410" class="subtitle" fill="#1d4ed8">4. Assembly Connector (Ball-and-Socket) &amp; Port (□)</text>
  <!-- Mini Assembly Diagram -->
  <rect x="48" y="424" width="82" height="40" class="comp-box-amber" />
  <rect x="124" y="438" width="12" height="12" class="port" />
  <text x="86" y="448" text-anchor="middle" class="mono">Order</text>
  <line x1="136" y1="444" x2="178" y2="444" class="wire" />
  <!-- Socket + Ball Mated -->
  <path d="M 190 432 A 12 12 0 0 0 190 456" class="socket" />
  <circle cx="190" cy="444" r="7.5" class="lollipop" />
  <line x1="198" y1="444" x2="240" y2="444" class="wire" />
  <rect x="240" y="424" width="86" height="40" class="comp-box-green" />
  <text x="283" y="448" text-anchor="middle" class="mono">StripePay</text>
  <text x="190" y="425" text-anchor="middle" class="iface">IPayment</text>
  <text x="336" y="448" class="desc" font-weight="700" fill="#047857">Plug &amp; Play!</text>
  <text x="48" y="484" class="desc">• <tspan font-weight="700">Assembly Connector —(○—</tspan>: Wires consumer socket to provider</text>
  <text x="48" y="500" class="desc">  lollipop. Consumer never knows provider's concrete class!</text>
  <text x="48" y="518" class="desc">• <tspan font-weight="700">Port (□ on edge)</tspan>: Explicit boundary endpoint isolating</text>
  <text x="48" y="534" class="desc">  external traffic &amp; delegating (`--&gt;`) to internal parts.</text>

  <!-- ================= RIGHT PANEL: FOOD DELIVERY COMPONENT DIAGRAM ================= -->
  <rect x="442" y="18" width="738" height="544" class="panel" />
  <rect x="442" y="18" width="738" height="38" class="panel-header" />
  <text x="811" y="42" text-anchor="middle" class="title">Food Delivery System — UML Component Diagram (Interface Contracts)</text>

  <!-- Entry Component: Mobile / Web BFF Gateway -->
  <rect x="464" y="82" width="166" height="76" class="comp-box-purple" />
  <use href="#comp-icon" x="606" y="89" />
  <text x="538" y="106" text-anchor="middle" class="stereo">«component»</text>
  <text x="538" y="126" text-anchor="middle" class="comp-title">API Gateway / BFF</text>
  <text x="538" y="144" text-anchor="middle" class="desc">(Auth, Rate-Limit, Routing)</text>
  <!-- Port on right of API Gateway -->
  <rect x="624" y="114" width="12" height="12" class="port" />

  <!-- Wire: API Gateway Required Socket -> Order Component Provided Lollipop -->
  <line x1="636" y1="120" x2="692" y2="120" class="wire" />
  <path d="M 704 108 A 12 12 0 0 0 704 132" class="socket" />
  <circle cx="704" cy="120" r="7.5" class="lollipop" />
  <line x1="712" y1="120" x2="764" y2="120" class="wire" />
  <text x="704" y="100" text-anchor="middle" class="iface">IOrderCheckoutAPI</text>

  <!-- Core Composite Component: Order Management Component -->
  <rect x="764" y="70" width="390" height="148" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2.4" />
  <use href="#comp-icon" x="1130" y="78" />
  <rect x="758" y="114" width="12" height="12" class="port" />
  <text x="950" y="92" text-anchor="middle" class="stereo">«component» (Composite Subsystem)</text>
  <text x="950" y="110" text-anchor="middle" class="comp-title" font-size="14">Order Management Component</text>

  <!-- Internal Sub-components inside Order Management -->
  <rect x="790" y="126" width="150" height="68" rx="5" fill="#ffffff" stroke="#3b82f6" stroke-width="1.8" />
  <text x="865" y="146" text-anchor="middle" class="stereo">«component»</text>
  <text x="865" y="164" text-anchor="middle" class="mono">OrderStateEngine</text>
  <text x="865" y="180" text-anchor="middle" class="desc">Saga Orchestrator</text>

  <rect x="980" y="126" width="154" height="68" rx="5" fill="#ffffff" stroke="#3b82f6" stroke-width="1.8" />
  <text x="1057" y="146" text-anchor="middle" class="stereo">«component»</text>
  <text x="1057" y="164" text-anchor="middle" class="mono">MenuPricingCalc</text>
  <text x="1057" y="180" text-anchor="middle" class="desc">Promo &amp; Surge Fee</text>

  <!-- Delegation arrow from Port to internal OrderStateEngine -->
  <line x1="770" y1="120" x2="790" y2="148" stroke="#475569" stroke-width="1.6" stroke-dasharray="4,3" marker-end="url(#delegate-arrow)" />
  <!-- Internal assembly between OrderStateEngine and MenuPricingCalc -->
  <line x1="940" y1="160" x2="956" y2="160" class="wire" />
  <path d="M 964 151 A 9 9 0 0 0 964 169" class="socket" />
  <circle cx="964" cy="160" r="6" class="lollipop" />
  <line x1="970" y1="160" x2="980" y2="160" class="wire" />

  <!-- Bottom Output Ports on Order Management Component -->
  <rect x="814" y="212" width="12" height="12" class="port" />
  <rect x="954" y="212" width="12" height="12" class="port" />
  <rect x="1084" y="212" width="12" height="12" class="port" />

  <!-- 1. Left Branch: Payment Component (with Plug-and-Play Swap Callout) -->
  <line x1="820" y1="224" x2="820" y2="272" class="wire" />
  <path d="M 808 284 A 12 12 0 0 0 832 284" class="socket" />
  <circle cx="820" cy="284" r="7.5" class="lollipop" />
  <line x1="820" y1="292" x2="820" y2="334" class="wire" />
  <text x="752" y="288" text-anchor="middle" class="iface">IPaymentGateway</text>

  <rect x="720" y="334" width="186" height="82" class="comp-box-green" />
  <use href="#comp-icon" x="882" y="341" />
  <text x="808" y="356" text-anchor="middle" class="stereo">«component»</text>
  <text x="808" y="376" text-anchor="middle" class="comp-title">Payment Component</text>
  <text x="808" y="396" text-anchor="middle" class="desc">(Stripe / ApplePay / LINE Pay)</text>

  <!-- Plug-and-Play Callout Box on Left -->
  <rect x="464" y="246" width="224" height="170" rx="8" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.8" />
  <text x="576" y="268" text-anchor="middle" class="subtitle" fill="#b45309">Why Ball-and-Socket Matters</text>
  <text x="476" y="290" class="desc" fill="#78350f">• <tspan font-weight="700">Order Component</tspan> only binds</text>
  <text x="476" y="306" class="desc" fill="#78350f">  to socket <tspan class="mono">IPaymentGateway</tspan>.</text>
  <text x="476" y="326" class="desc" fill="#78350f">• We can hot-swap <tspan font-weight="700">StripeAdapter</tspan></text>
  <text x="476" y="342" class="desc" fill="#78350f">  for <tspan font-weight="700">PayPal</tspan> or a <tspan font-weight="700">MockStub</tspan> in</text>
  <text x="476" y="358" class="desc" fill="#78350f">  CI testing with <tspan font-weight="700">zero changes</tspan></text>
  <text x="476" y="374" class="desc" fill="#78350f">  to Order Management!</text>
  <text x="476" y="398" class="mono" fill="#047857" font-size="10.5">✓ Loose Coupling + High Testability</text>

  <!-- 2. Middle Branch: Dispatch Engine Component -->
  <line x1="960" y1="224" x2="960" y2="272" class="wire" />
  <path d="M 948 284 A 12 12 0 0 0 972 284" class="socket" />
  <circle cx="960" cy="284" r="7.5" class="lollipop" />
  <line x1="960" y1="292" x2="960" y2="334" class="wire" />
  <text x="960" y="262" text-anchor="middle" class="iface">IDispatchMatcher</text>

  <rect x="920" y="334" width="234" height="82" class="comp-box-amber" />
  <use href="#comp-icon" x="1130" y="341" />
  <text x="1030" y="356" text-anchor="middle" class="stereo">«component»</text>
  <text x="1030" y="376" text-anchor="middle" class="comp-title">Rider Dispatch Engine</text>
  <text x="1030" y="396" text-anchor="middle" class="desc">(ETA Scoring &amp; Courier Pairing)</text>

  <!-- 3. Right Branch: Event Broker Component -->
  <line x1="1090" y1="224" x2="1090" y2="272" class="wire" />
  <path d="M 1078 284 A 12 12 0 0 0 1102 284" class="socket" />
  <circle cx="1090" cy="284" r="7.5" class="lollipop" />
  <line x1="1090" y1="292" x2="1090" y2="312" class="wire" />
  <text x="1115" y="255" text-anchor="middle" class="iface">IEventBus</text>

  <!-- Bottom Row: Geo-Spatial Tracker & Notification/Analytics -->
  <!-- Dispatch Engine requires IGeoSpatialQuery from Rider Geo-Index -->
  <line x1="1030" y1="416" x2="1030" y2="444" class="wire" />
  <path d="M 1018 456 A 12 12 0 0 0 1042 456" class="socket" />
  <circle cx="1030" cy="456" r="7.5" class="lollipop" />
  <line x1="1030" y1="464" x2="1030" y2="482" class="wire" />
  <text x="1098" y="458" text-anchor="middle" class="iface">IGeoSpatialIndex</text>

  <rect x="910" y="482" width="244" height="64" class="comp-box-purple" />
  <use href="#comp-icon" x="1130" y="489" />
  <text x="1025" y="504" text-anchor="middle" class="stereo">«component»</text>
  <text x="1025" y="523" text-anchor="middle" class="comp-title">Rider Geo-Location Tracker</text>
  <text x="1025" y="539" text-anchor="middle" class="desc">(Redis In-Memory Geo-Hash Grid)</text>

  <!-- Order Persistence Repository Component (Bottom Left) -->
  <line x1="810" y1="416" x2="810" y2="444" class="wire" />
  <path d="M 798 456 A 12 12 0 0 0 822 456" class="socket" />
  <circle cx="810" cy="456" r="7.5" class="lollipop" />
  <line x1="810" y1="464" x2="810" y2="482" class="wire" />
  <text x="740" y="458" text-anchor="middle" class="iface">ITransactionLedger</text>

  <rect x="680" y="482" width="210" height="64" class="comp-box-blue" />
  <use href="#comp-icon" x="866" y="489" />
  <text x="780" y="504" text-anchor="middle" class="stereo">«component»</text>
  <text x="780" y="523" text-anchor="middle" class="comp-title">Ledger Persistence</text>
  <text x="780" y="539" text-anchor="middle" class="desc">(ACID SQL Order &amp; Billing Store)</text>

  <!-- Summary Box Bottom Left -->
  <rect x="464" y="432" width="198" height="114" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5" />
  <text x="563" y="452" text-anchor="middle" class="subtitle">Architectural Purpose</text>
  <text x="476" y="472" class="desc">• Captures <tspan font-weight="700">modular runtime</tspan></text>
  <text x="476" y="488" class="desc">  units &amp; API boundaries.</text>
  <text x="476" y="508" class="desc">• Enforces <tspan font-weight="700" fill="#1d4ed8">Design by Contract</tspan></text>
  <text x="476" y="524" class="desc">  between service providers</text>
  <text x="476" y="538" class="desc">  and consumers.</text>
</svg>

