<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 350" width="100%" height="100%">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.08" />
    </filter>
    <marker id="arrow-cs-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0284c7" />
    </marker>
  </defs>

  <rect width="880" height="350" fill="#f5f5f5" />
  <rect x="8" y="8" width="864" height="334" fill="#f8fafc" rx="12" stroke="#cbd5e1" stroke-width="1.5" />

  <!-- Pattern Header Badge -->
  <rect x="24" y="20" width="315" height="28" rx="6" fill="#e0f2fe" stroke="#0284c7" stroke-width="1" />
  <text x="34" y="39" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="700" fill="#0369a1">ARCHITECTURAL PATTERN</text>
  <text x="200" y="39" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="700" fill="#64748b">04 / CLIENT-SERVER</text>

  <!-- Left: Diverse Clients Cluster -->
  <g transform="translate(36, 62)">
    <rect width="184" height="256" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="4,3" />
    <text x="92" y="23" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#475569" text-anchor="middle">Distributed Clients</text>

    <!-- Client 1: Web -->
    <g transform="translate(16, 36)">
      <rect width="152" height="58" rx="6" fill="#ffffff" stroke="#0284c7" stroke-width="1.5" filter="url(#shadow)" />
      <text x="76" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#0369a1" text-anchor="middle">Web Browser</text>
      <text x="76" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#64748b" text-anchor="middle">Chrome / Safari (SPA)</text>
    </g>

    <!-- Client 2: Mobile -->
    <g transform="translate(16, 106)">
      <rect width="152" height="58" rx="6" fill="#ffffff" stroke="#6366f1" stroke-width="1.5" filter="url(#shadow)" />
      <text x="76" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#312e81" text-anchor="middle">Mobile Native App</text>
      <text x="76" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#64748b" text-anchor="middle">iOS / Android</text>
    </g>

    <!-- Client 3: Desktop / CLI -->
    <g transform="translate(16, 176)">
      <rect width="152" height="58" rx="6" fill="#ffffff" stroke="#059669" stroke-width="1.5" filter="url(#shadow)" />
      <text x="76" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#064e3b" text-anchor="middle">Desktop / CLI Client</text>
      <text x="76" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#64748b" text-anchor="middle">POS Terminal / Partner API</text>
    </g>
  </g>

  <!-- Center: Network Cloud Boundary -->
  <g transform="translate(245, 122)">
    <rect width="142" height="132" rx="20" fill="#e0f2fe" stroke="#38bdf8" stroke-width="2" filter="url(#shadow)" />
    <text x="71" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#0369a1" text-anchor="middle">Network / WAN</text>
    <text x="71" y="64" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#0284c7" text-anchor="middle">Internet Boundary</text>
    <text x="71" y="92" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#0284c7" text-anchor="middle">HTTPS / REST / gRPC</text>
    <text x="71" y="108" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5" fill="#64748b" text-anchor="middle">(TLS &amp; Network Latency)</text>
  </g>

  <!-- Network Connecting Lines -->
  <line x1="220" y1="127" x2="245" y2="157" stroke="#0284c7" stroke-width="2" marker-end="url(#arrow-cs-blue)" />
  <line x1="220" y1="197" x2="245" y2="187" stroke="#0284c7" stroke-width="2" marker-end="url(#arrow-cs-blue)" />
  <line x1="387" y1="187" x2="415" y2="187" stroke="#0284c7" stroke-width="2.5" marker-end="url(#arrow-cs-blue)" />

  <!-- Right: Server Cluster -->
  <g transform="translate(420, 62)">
    <rect width="210" height="256" rx="10" fill="#ffffff" stroke="#0284c7" stroke-width="2" filter="url(#shadow)" />
    <rect x="0" y="0" width="210" height="34" rx="10" fill="#0284c7" />
    <rect x="0" y="24" width="210" height="10" fill="#0284c7" />
    <text x="105" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">Centralized Server Tier</text>

    <!-- Gateway Box -->
    <g transform="translate(15, 46)">
      <rect width="180" height="50" rx="6" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5" />
      <text x="90" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#0f172a" text-anchor="middle">Load Balancer / Gateway</text>
      <text x="90" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5" fill="#64748b" text-anchor="middle">Nginx / Cloud ALB</text>
    </g>

    <!-- App Logic Box -->
    <g transform="translate(15, 108)">
      <rect width="180" height="60" rx="6" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5" />
      <text x="90" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#0369a1" text-anchor="middle">Application Server Cluster</text>
      <text x="90" y="39" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#0284c7" text-anchor="middle">Stateless Compute Nodes</text>
      <text x="90" y="53" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" fill="#0369a1" text-anchor="middle">Horizontally Replicated (N Nodes)</text>
    </g>

    <!-- DB Box -->
    <g transform="translate(15, 180)">
      <rect width="180" height="56" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="1.5" />
      <text x="90" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#78350f" text-anchor="middle">Central Database &amp; Cache</text>
      <text x="90" y="42" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5" fill="#d97706" text-anchor="middle">PostgreSQL / Redis Cluster</text>
    </g>
  </g>

  <!-- Far Right: Insights Card -->
  <g transform="translate(648, 62)">
    <rect width="204" height="256" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" filter="url(#shadow)" />
    <rect x="0" y="0" width="204" height="34" rx="10" fill="#f1f5f9" />
    <rect x="0" y="24" width="204" height="10" fill="#f1f5f9" />
    <text x="102" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#334155" text-anchor="middle">Architectural Trade-offs</text>

    <text x="14" y="56" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#0284c7">Role Division:</text>
    <text x="14" y="73" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#475569">Clients handle UI interaction;</text>
    <text x="14" y="89" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#475569">servers enforce security, auth,</text>
    <text x="14" y="105" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#475569">and centralized data integrity.</text>

    <line x1="14" y1="120" x2="190" y2="120" stroke="#f1f5f9" stroke-width="1.5" />

    <text x="14" y="140" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#059669">Elastic Scaling:</text>
    <text x="14" y="157" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#475569">Stateless servers scale out</text>
    <text x="14" y="173" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#475569">smoothly behind load balancers.</text>

    <line x1="14" y1="188" x2="190" y2="188" stroke="#f1f5f9" stroke-width="1.5" />

    <text x="14" y="208" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#e11d48">Network Risks:</text>
    <text x="14" y="225" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#475569">Vulnerable to latency, packet</text>
    <text x="14" y="241" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#475569">loss, and DDoS server overload.</text>
  </g>
</svg>
