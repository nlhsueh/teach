<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 340" width="100%" height="100%">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.08" />
    </filter>
    <marker id="arrow-cs-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0284c7" />
    </marker>
    <marker id="arrow-cs-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#059669" />
    </marker>
  </defs>

  <rect width="880" height="340" fill="#f8fafc" rx="12" stroke="#e2e8f0" stroke-width="1.5" />

  <!-- Pattern Header Badge -->
  <rect x="24" y="16" width="300" height="28" rx="6" fill="#e0f2fe" stroke="#0284c7" stroke-width="1" />
  <text x="34" y="35" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#0369a1">ARCHITECTURAL PATTERN</text>
  <text x="180" y="35" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#64748b">04 / CLIENT-SERVER</text>

  <!-- Left: Diverse Clients Cluster -->
  <g transform="translate(40, 60)">
    <rect width="180" height="254" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="4,3" />
    <text x="90" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#475569" text-anchor="middle">多樣化客戶端 (Clients)</text>

    <!-- Client 1: Web -->
    <g transform="translate(15, 36)">
      <rect width="150" height="58" rx="6" fill="#ffffff" stroke="#0284c7" stroke-width="1.5" filter="url(#shadow)" />
      <text x="75" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#0369a1" text-anchor="middle">Web 瀏覽器</text>
      <text x="75" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#64748b" text-anchor="middle">Chrome / Safari (SPA)</text>
    </g>

    <!-- Client 2: Mobile -->
    <g transform="translate(15, 106)">
      <rect width="150" height="58" rx="6" fill="#ffffff" stroke="#6366f1" stroke-width="1.5" filter="url(#shadow)" />
      <text x="75" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#312e81" text-anchor="middle">行動原生 App</text>
      <text x="75" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#64748b" text-anchor="middle">iOS / Android</text>
    </g>

    <!-- Client 3: Desktop -->
    <g transform="translate(15, 176)">
      <rect width="150" height="58" rx="6" fill="#ffffff" stroke="#059669" stroke-width="1.5" filter="url(#shadow)" />
      <text x="75" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#064e3b" text-anchor="middle">桌面終端 / CLI</text>
      <text x="75" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#64748b" text-anchor="middle">POS 機 / 合作夥伴 API</text>
    </g>
  </g>

  <!-- Center: Network Cloud Boundary -->
  <g transform="translate(245, 120)">
    <rect width="140" height="130" rx="20" fill="#e0f2fe" stroke="#38bdf8" stroke-width="2" filter="url(#shadow)" />
    <text x="70" y="48" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#0369a1" text-anchor="middle">網際網路</text>
    <text x="70" y="66" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#0284c7" text-anchor="middle">Internet / WAN</text>
    <text x="70" y="94" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#0284c7" text-anchor="middle">HTTPS / REST / gRPC</text>
    <text x="70" y="108" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" fill="#64748b" text-anchor="middle">(網路延遲與傳輸加密)</text>
  </g>

  <!-- Network Connecting Lines -->
  <!-- Client to Cloud -->
  <line x1="220" y1="125" x2="245" y2="155" stroke="#0284c7" stroke-width="2" marker-end="url(#arrow-cs-blue)" />
  <line x1="220" y1="195" x2="245" y2="185" stroke="#0284c7" stroke-width="2" marker-end="url(#arrow-cs-blue)" />
  <!-- Cloud to Server -->
  <line x1="385" y1="185" x2="415" y2="185" stroke="#0284c7" stroke-width="2.5" marker-end="url(#arrow-cs-blue)" />

  <!-- Right: Server Cluster -->
  <g transform="translate(420, 60)">
    <rect width="210" height="254" rx="10" fill="#ffffff" stroke="#0284c7" stroke-width="2" filter="url(#shadow)" />
    <rect x="0" y="0" width="210" height="34" rx="10" fill="#0284c7" />
    <rect x="0" y="24" width="210" height="10" fill="#0284c7" />
    <text x="105" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">伺服器端 (Server Cluster)</text>

    <!-- Gateway Box -->
    <g transform="translate(15, 46)">
      <rect width="180" height="50" rx="6" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5" />
      <text x="90" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#0f172a" text-anchor="middle">API 負載平衡 / 閘道器</text>
      <text x="90" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" fill="#64748b" text-anchor="middle">Nginx / AWS ALB</text>
    </g>

    <!-- App Logic Box -->
    <g transform="translate(15, 108)">
      <rect width="180" height="60" rx="6" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5" />
      <text x="90" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#0369a1" text-anchor="middle">應用商務伺服器叢集</text>
      <text x="90" y="42" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#0284c7" text-anchor="middle">無狀態 (Stateless App)</text>
      <text x="90" y="54" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" fill="#0369a1" text-anchor="middle">水平擴展 N 台執行個體</text>
    </g>

    <!-- DB Box -->
    <g transform="translate(15, 180)">
      <rect width="180" height="56" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="1.5" />
      <text x="90" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#78350f" text-anchor="middle">中央資料庫與快取</text>
      <text x="90" y="42" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" fill="#d97706" text-anchor="middle">PostgreSQL / Redis 叢集</text>
    </g>
  </g>

  <!-- Far Right: Insights Card -->
  <g transform="translate(650, 60)">
    <rect width="205" height="254" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" filter="url(#shadow)" />
    <rect x="0" y="0" width="205" height="34" rx="10" fill="#f1f5f9" />
    <rect x="0" y="24" width="205" height="10" fill="#f1f5f9" />
    <text x="102" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#334155" text-anchor="middle">架構權衡重點</text>

    <text x="14" y="58" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#0284c7">職責精準分工：</text>
    <text x="14" y="76" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#475569">客戶端專注渲染互動，</text>
    <text x="14" y="92" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#475569">伺服器專注核心運算</text>
    <text x="14" y="108" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#475569">與機密資料資安防護。</text>

    <line x1="14" y1="124" x2="191" y2="124" stroke="#f1f5f9" stroke-width="1.5" />

    <text x="14" y="146" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#059669">水平彈性擴展：</text>
    <text x="14" y="164" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#475569">無狀態伺服器可隨流量</text>
    <text x="14" y="180" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#475569">彈性增減 VM 節點。</text>

    <line x1="14" y1="196" x2="191" y2="196" stroke="#f1f5f9" stroke-width="1.5" />

    <text x="14" y="218" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#e11d48">網路不可靠風險：</text>
    <text x="14" y="236" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#475569">受制於延遲、封包丟失</text>
    <text x="14" y="252" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#475569">與伺服器過載雪崩效應。</text>
  </g>
</svg>
