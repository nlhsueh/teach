<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #f5f5f5; }
      .title { font-family: 'Inter', 'Helvetica Neue', Arial, sans-serif; font-size: 21px; font-weight: 800; fill: #0f172a; text-anchor: middle; }
      .subtitle { font-family: 'Inter', 'Helvetica Neue', Arial, sans-serif; font-size: 12.5px; font-weight: 600; fill: #475569; text-anchor: middle; }
      .panel { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2; rx: 12; }
      .panel-title { font-family: 'Inter', 'Helvetica Neue', Arial, sans-serif; font-size: 14.5px; font-weight: 800; fill: #0f172a; }
      .hdr-w { font-family: 'Inter', 'Helvetica Neue', Arial, sans-serif; font-size: 12.5px; font-weight: 800; fill: #ffffff; }
      .mono-w { font-family: 'JetBrains Mono', 'Courier New', monospace; font-size: 10.5px; font-weight: 800; fill: #ffffff; }
      .lbl-b { font-family: 'Inter', 'Helvetica Neue', Arial, sans-serif; font-size: 12.5px; font-weight: 800; }
      .lbl-s { font-family: 'Inter', 'Helvetica Neue', Arial, sans-serif; font-size: 10.5px; font-weight: 600; }
      .mono { font-family: 'JetBrains Mono', 'Courier New', monospace; font-size: 10px; font-weight: 700; }
    </style>
    <marker id="arr-solid" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#2563eb" />
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#0d9488" />
    </marker>
    <marker id="arr-back" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#64748b" />
    </marker>
  </defs>

  <!-- Slide-matching background -->
  <rect width="1200" height="620" class="bg" />

  <!-- Header -->
  <text x="600" y="30" class="title">The 4-Stage Software Design Process &amp; Design Specifications (Chapter 5 Roadmap)</text>
  <text x="600" y="50" class="subtitle">Systematic Macro-to-Micro Engineering Workflow Transforming Requirements (What) into Actionable Design Blueprints (How)</text>

  <!-- ================================================================= -->
  <!-- LEFT PANEL: INPUTS FROM REQUIREMENTS ENGINEERING                  -->
  <!-- ================================================================= -->
  <rect x="20" y="68" width="185" height="425" fill="#eff6ff" stroke="#2563eb" stroke-width="2" rx="12" />
  <rect x="20" y="68" width="185" height="36" fill="#2563eb" rx="10" />
  <text x="112" y="91" class="hdr-w" text-anchor="middle">INPUT: Requirements</text>
  <text x="112" y="118" class="lbl-s" fill="#1e40af" text-anchor="middle">(From Chapters 3 &amp; 4)</text>

  <!-- Functional Requirements Box -->
  <rect x="32" y="132" width="161" height="145" fill="#ffffff" stroke="#93c5fd" stroke-width="1.5" rx="8" />
  <text x="112" y="152" class="lbl-b" fill="#1d4ed8" text-anchor="middle">1. Functional Specs</text>
  <text x="112" y="168" class="mono" fill="#2563eb" text-anchor="middle">(SRS &amp; Use Cases)</text>
  <line x1="42" y1="176" x2="182" y2="176" stroke="#dbeafe" stroke-width="1.5" />
  <text x="42" y="195" class="lbl-s" fill="#334155">• User Stories &amp; Flows</text>
  <text x="42" y="213" class="lbl-s" fill="#334155">• Domain Concepts</text>
  <text x="42" y="231" class="lbl-s" fill="#334155">• Business Rules</text>
  <text x="42" y="249" class="lbl-s" fill="#1e40af">e.g., Customer Checkout,</text>
  <text x="42" y="264" class="lbl-s" fill="#1e40af">Rider Order Dispatch</text>

  <!-- ASRs Box -->
  <rect x="32" y="292" width="161" height="185" fill="#ffffff" stroke="#93c5fd" stroke-width="1.5" rx="8" />
  <text x="112" y="312" class="lbl-b" fill="#1d4ed8" text-anchor="middle">2. Quality &amp; ASRs</text>
  <text x="112" y="328" class="mono" fill="#2563eb" text-anchor="middle">(Non-Functional Drivers)</text>
  <line x1="42" y1="336" x2="182" y2="336" stroke="#dbeafe" stroke-width="1.5" />
  <text x="42" y="355" class="lbl-s" fill="#334155">• Scalability (10k RPS)</text>
  <text x="42" y="373" class="lbl-s" fill="#334155">• Latency (&lt; 200ms SLA)</text>
  <text x="42" y="391" class="lbl-s" fill="#334155">• Availability (99.99%)</text>
  <text x="42" y="409" class="lbl-s" fill="#334155">• Security &amp; Compliance</text>
  <text x="42" y="432" class="lbl-s" fill="#b45309">★ Primary drivers of</text>
  <text x="42" y="447" class="lbl-s" fill="#b45309">architecture trade-offs!</text>

  <!-- Arrow from Inputs to Stage 1 -->
  <line x1="205" y1="265" x2="228" y2="265" stroke="#2563eb" stroke-width="3" marker-end="url(#arr-solid)" />

  <!-- ================================================================= -->
  <!-- CENTER PANEL: THE 4-STAGE ITERATIVE DESIGN PROCESS                -->
  <!-- ================================================================= -->
  <rect x="232" y="68" width="736" height="425" class="panel" />
  <text x="600" y="94" class="panel-title" text-anchor="middle">THE 4-STAGE ITERATIVE SOFTWARE DESIGN WORKFLOW (Macro Architecture → Micro Craftsmanship)</text>
  <text x="600" y="112" class="lbl-s" fill="#64748b" text-anchor="middle">Each design stage addresses a distinct level of abstraction and produces dedicated UML / Schema models</text>

  <!-- STAGE 1: ARCHITECTURAL DESIGN (5.3) -->
  <rect x="248" y="128" width="166" height="295" fill="#fffbeb" stroke="#d97706" stroke-width="2" rx="10" />
  <rect x="248" y="128" width="166" height="32" fill="#d97706" rx="8" />
  <text x="331" y="149" class="mono-w" text-anchor="middle">STAGE 1 · SECTION 5.3</text>
  <text x="331" y="180" class="lbl-b" fill="#b45309" text-anchor="middle">Architectural</text>
  <text x="331" y="197" class="lbl-b" fill="#b45309" text-anchor="middle">Design</text>
  <text x="331" y="214" class="lbl-s" fill="#92400e" text-anchor="middle">(Macro System Structure)</text>
  <line x1="260" y1="224" x2="402" y2="224" stroke="#fde68a" stroke-width="1.5" />
  <text x="258" y="244" class="lbl-s" fill="#334155">• Subsystem decomposition</text>
  <text x="258" y="262" class="lbl-s" fill="#334155">• Select &amp; combine</text>
  <text x="266" y="276" class="lbl-s" fill="#334155">Architectural Patterns</text>
  <text x="258" y="294" class="lbl-s" fill="#334155">• Evaluate quality attribute</text>
  <text x="266" y="308" class="lbl-s" fill="#334155">trade-offs via ATAM</text>
  <rect x="258" y="325" width="146" height="84" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5" rx="6" />
  <text x="331" y="343" class="mono" fill="#92400e" text-anchor="middle">UML Modeling (5.3):</text>
  <text x="331" y="361" class="lbl-s" fill="#78350f" text-anchor="middle">1. UML Package Diagram</text>
  <text x="331" y="375" class="mono" fill="#b45309" text-anchor="middle">(Source Imports)</text>
  <text x="331" y="393" class="lbl-s" fill="#78350f" text-anchor="middle">2. Deployment Diagram</text>
  <text x="331" y="405" class="mono" fill="#b45309" text-anchor="middle">(3D Cloud Nodes)</text>

  <line x1="414" y1="275" x2="428" y2="275" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arr-solid)" />

  <!-- STAGE 2: INTERFACE & CONTRACT SPECIFICATION (5.4) -->
  <rect x="432" y="128" width="166" height="295" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2" rx="10" />
  <rect x="432" y="128" width="166" height="32" fill="#7c3aed" rx="8" />
  <text x="515" y="149" class="mono-w" text-anchor="middle">STAGE 2 · SECTION 5.4</text>
  <text x="515" y="180" class="lbl-b" fill="#6d28d9" text-anchor="middle">Interface &amp; Contract</text>
  <text x="515" y="197" class="lbl-b" fill="#6d28d9" text-anchor="middle">Specification</text>
  <text x="515" y="214" class="lbl-s" fill="#5b21b6" text-anchor="middle">(Module Boundaries)</text>
  <line x1="444" y1="224" x2="586" y2="224" stroke="#ddd6fe" stroke-width="1.5" />
  <text x="442" y="244" class="lbl-s" fill="#334155">• Information hiding walls</text>
  <text x="442" y="262" class="lbl-s" fill="#334155">• Design by Contract (DbC):</text>
  <text x="450" y="276" class="mono" fill="#6d28d9">Pre, Post, Invariant</text>
  <text x="442" y="294" class="lbl-s" fill="#334155">• REST / gRPC / Event</text>
  <text x="450" y="308" class="lbl-s" fill="#334155">API specifications</text>
  <rect x="442" y="325" width="146" height="84" fill="#ede9fe" stroke="#8b5cf6" stroke-width="1.5" rx="6" />
  <text x="515" y="343" class="mono" fill="#5b21b6" text-anchor="middle">UML Modeling (5.4):</text>
  <text x="515" y="363" class="lbl-s" fill="#4c1d95" text-anchor="middle">UML Component Diagram</text>
  <text x="515" y="381" class="mono" fill="#6d28d9" text-anchor="middle">Lollipop (—○) &amp;</text>
  <text x="515" y="397" class="mono" fill="#6d28d9" text-anchor="middle">Socket (—( ) Contracts</text>

  <line x1="598" y1="275" x2="612" y2="275" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arr-solid)" />

  <!-- STAGE 3: COMPONENT & OO DESIGN (5.5) -->
  <rect x="616" y="128" width="166" height="295" fill="#f0fdf4" stroke="#16a34a" stroke-width="2" rx="10" />
  <rect x="616" y="128" width="166" height="32" fill="#16a34a" rx="8" />
  <text x="699" y="149" class="mono-w" text-anchor="middle">STAGE 3 · SECTION 5.5</text>
  <text x="699" y="180" class="lbl-b" fill="#15803d" text-anchor="middle">Component &amp;</text>
  <text x="699" y="197" class="lbl-b" fill="#15803d" text-anchor="middle">Detailed OO Design</text>
  <text x="699" y="214" class="lbl-s" fill="#166534" text-anchor="middle">(Internal Class Craft)</text>
  <line x1="628" y1="224" x2="770" y2="224" stroke="#bbf7d0" stroke-width="1.5" />
  <text x="626" y="244" class="lbl-s" fill="#334155">• Internal class hierarchies</text>
  <text x="626" y="262" class="lbl-s" fill="#334155">• GoF 23 Design Patterns</text>
  <text x="634" y="276" class="lbl-s" fill="#334155">(Creational/Struct/Behav)</text>
  <text x="626" y="294" class="lbl-s" fill="#334155">• 5 SOLID OO Principles</text>
  <text x="634" y="308" class="mono" fill="#15803d">(SRP, OCP, LSP, ISP, DIP)</text>
  <rect x="626" y="325" width="146" height="84" fill="#dcfce7" stroke="#22c55e" stroke-width="1.5" rx="6" />
  <text x="699" y="343" class="mono" fill="#166534" text-anchor="middle">UML Modeling (5.5):</text>
  <text x="699" y="363" class="lbl-s" fill="#14532d" text-anchor="middle">UML Class &amp; Interface</text>
  <text x="699" y="379" class="lbl-s" fill="#14532d" text-anchor="middle">Diagrams</text>
  <text x="699" y="397" class="mono" fill="#15803d" text-anchor="middle">Realization (--|&gt;) &amp; DIP</text>

  <line x1="782" y1="275" x2="796" y2="275" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arr-solid)" />

  <!-- STAGE 4: DATA & PERSISTENCE DESIGN (5.6) -->
  <rect x="800" y="128" width="154" height="295" fill="#ecfeff" stroke="#0891b2" stroke-width="2" rx="10" />
  <rect x="800" y="128" width="154" height="32" fill="#0891b2" rx="8" />
  <text x="877" y="149" class="mono-w" text-anchor="middle">STAGE 4 · SECTION 5.6</text>
  <text x="877" y="180" class="lbl-b" fill="#0e7490" text-anchor="middle">Data &amp; Persistence</text>
  <text x="877" y="197" class="lbl-b" fill="#0e7490" text-anchor="middle">Design</text>
  <text x="877" y="214" class="lbl-s" fill="#155e75" text-anchor="middle">(Storage &amp; State)</text>
  <line x1="810" y1="224" x2="944" y2="224" stroke="#a5f3fc" stroke-width="1.5" />
  <text x="810" y="244" class="lbl-s" fill="#334155">• 3-Level Data Modeling</text>
  <text x="810" y="262" class="lbl-s" fill="#334155">• Normalization (3NF) vs.</text>
  <text x="818" y="276" class="lbl-s" fill="#334155">Read Denormalization</text>
  <text x="810" y="294" class="lbl-s" fill="#334155">• Polyglot Persistence:</text>
  <text x="818" y="308" class="mono" fill="#0e7490">SQL + Redis + Kafka</text>
  <rect x="810" y="325" width="134" height="84" fill="#cffafe" stroke="#06b6d4" stroke-width="1.5" rx="6" />
  <text x="877" y="343" class="mono" fill="#155e75" text-anchor="middle">Data Modeling (5.6):</text>
  <text x="877" y="363" class="lbl-s" fill="#164e63" text-anchor="middle">ERD / Data Schema</text>
  <text x="877" y="381" class="mono" fill="#0e7490" text-anchor="middle">PK / FK, Indexes,</text>
  <text x="877" y="397" class="mono" fill="#0e7490" text-anchor="middle">Shards &amp; Cache TTL</text>

  <!-- Iterative Feedback Loop -->
  <path d="M 877 423 L 877 468 L 331 468 L 331 428" fill="none" stroke="#64748b" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#arr-back)" />
  <rect x="440" y="454" width="320" height="24" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1" rx="6" />
  <text x="600" y="470" class="mono" fill="#334155" text-anchor="middle">Iterative Refinement &amp; Architectural Feedback Loop</text>

  <!-- Arrow from Center to Outputs -->
  <line x1="968" y1="265" x2="991" y2="265" stroke="#0d9488" stroke-width="3" marker-end="url(#arr-green)" />

  <!-- ================================================================= -->
  <!-- RIGHT PANEL: OUTPUT DELIVERABLES (SDS & ADR)                      -->
  <!-- ================================================================= -->
  <rect x="995" y="68" width="185" height="425" fill="#f0fdfa" stroke="#0d9488" stroke-width="2" rx="12" />
  <rect x="995" y="68" width="185" height="36" fill="#0d9488" rx="10" />
  <text x="1087" y="91" class="hdr-w" text-anchor="middle">OUTPUT: Design Specs</text>
  <text x="1087" y="118" class="mono" fill="#0f766e" text-anchor="middle">SDS (IEEE 1016) &amp; ADRs</text>

  <rect x="1007" y="130" width="161" height="75" fill="#ffffff" stroke="#5eead4" stroke-width="1.5" rx="6" />
  <text x="1087" y="149" class="lbl-b" fill="#0f766e" text-anchor="middle">1. Architecture Views</text>
  <text x="1015" y="167" class="lbl-s" fill="#334155">• Package &amp; Deployment</text>
  <text x="1015" y="183" class="lbl-s" fill="#334155">• Pattern Topology</text>

  <rect x="1007" y="213" width="161" height="75" fill="#ffffff" stroke="#5eead4" stroke-width="1.5" rx="6" />
  <text x="1087" y="232" class="lbl-b" fill="#0f766e" text-anchor="middle">2. Interface Contracts</text>
  <text x="1015" y="250" class="lbl-s" fill="#334155">• Component Diagrams</text>
  <text x="1015" y="266" class="lbl-s" fill="#334155">• DbC, OpenAPI / Proto</text>

  <rect x="1007" y="296" width="161" height="75" fill="#ffffff" stroke="#5eead4" stroke-width="1.5" rx="6" />
  <text x="1087" y="315" class="lbl-b" fill="#0f766e" text-anchor="middle">3. Class &amp; Data Specs</text>
  <text x="1015" y="333" class="lbl-s" fill="#334155">• SOLID Class Diagrams</text>
  <text x="1015" y="349" class="lbl-s" fill="#334155">• ERD, DDL &amp; Cache Spec</text>

  <rect x="1007" y="379" width="161" height="98" fill="#fef2f2" stroke="#f87171" stroke-width="1.5" rx="6" />
  <text x="1087" y="398" class="lbl-b" fill="#b91c1c" text-anchor="middle">4. ADRs (Why)</text>
  <text x="1087" y="413" class="mono" fill="#dc2626" text-anchor="middle">Decision Records</text>
  <text x="1015" y="431" class="lbl-s" fill="#334155">• Context &amp; Problem</text>
  <text x="1015" y="447" class="lbl-s" fill="#334155">• Chosen Decision</text>
  <text x="1015" y="463" class="lbl-s" fill="#334155">• Trade-off Consequences</text>

  <!-- ================================================================= -->
  <!-- BOTTOM FOUNDATION BARS (HIGH-CONTRAST LIGHT BACKGROUNDS!)         -->
  <!-- ================================================================= -->
  <rect x="20" y="508" width="760" height="94" fill="#eff6ff" stroke="#2563eb" stroke-width="2" rx="12" />
  <text x="400" y="534" class="lbl-b" fill="#1d4ed8" text-anchor="middle">FOUNDATIONAL BEDROCK (SECTION 5.2): Universal Software Design Principles</text>
  <text x="400" y="556" class="lbl-s" fill="#1e293b" text-anchor="middle">Governs all 4 stages above: Abstraction · Encapsulation &amp; Information Hiding · Separation of Concerns (SoC) · Modularity</text>
  <text x="400" y="580" class="mono" fill="#b45309" text-anchor="middle">★ THE GOLDEN LAW: Maximize Internal Cohesion (7 Levels) &amp; Minimize External Coupling (6 Levels) ★</text>

  <rect x="795" y="508" width="385" height="94" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2" rx="12" />
  <text x="987" y="534" class="lbl-b" fill="#6d28d9" text-anchor="middle">CROSS-CUTTING ENABLER (SECTIONS 5.7 &amp; 5.8)</text>
  <text x="987" y="556" class="lbl-b" fill="#0f172a" text-anchor="middle">AI-Augmented Design Copilot &amp; Synthesis</text>
  <text x="987" y="580" class="lbl-s" fill="#4c1d95" text-anchor="middle">AI assists across Stages 1–4; Human Architects own trade-offs!</text>
</svg>
