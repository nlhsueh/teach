<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 350" width="100%" height="100%">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.08" />
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0284c7" />
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#059669" />
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#d97706" />
    </marker>
    <marker id="arrow-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#64748b" />
    </marker>
  </defs>

  <rect width="880" height="350" fill="#f5f5f5" />
  <rect x="8" y="8" width="864" height="334" fill="#f8fafc" rx="12" stroke="#cbd5e1" stroke-width="1.5" />

  <!-- Pattern Header Badge -->
  <rect x="24" y="20" width="250" height="28" rx="6" fill="#e0f2fe" stroke="#0284c7" stroke-width="1" />
  <text x="34" y="39" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="700" fill="#0369a1">ARCHITECTURAL PATTERN</text>
  <text x="200" y="39" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="700" fill="#64748b">01 / MVC</text>

  <!-- User / Actor Node -->
  <g transform="translate(36, 115)">
    <rect width="120" height="115" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.8" filter="url(#shadow)" />
    <circle cx="60" cy="40" r="16" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5" />
    <path d="M 36 74 C 36 58, 84 58, 84 74" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5" />
    <text x="60" y="95" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#1e293b" text-anchor="middle">User / Client</text>
    <text x="60" y="109" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" fill="#64748b" text-anchor="middle">Browser / Mobile App</text>
  </g>

  <!-- Controller Node -->
  <g transform="translate(230, 58)">
    <rect width="275" height="106" rx="10" fill="#ffffff" stroke="#0284c7" stroke-width="2" filter="url(#shadow)" />
    <rect x="0" y="0" width="275" height="32" rx="10" fill="#0284c7" />
    <rect x="0" y="22" width="275" height="10" fill="#0284c7" />
    <text x="137" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">Controller (Input Orchestrator)</text>
    <text x="16" y="55" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#0f172a">• Intercepts user actions &amp; HTTP requests</text>
    <text x="16" y="74" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#0f172a">• Invokes Model to update domain state</text>
    <text x="16" y="93" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#0f172a">• Selects &amp; dispatches target View</text>
  </g>

  <!-- View Node -->
  <g transform="translate(575, 58)">
    <rect width="275" height="106" rx="10" fill="#ffffff" stroke="#d97706" stroke-width="2" filter="url(#shadow)" />
    <rect x="0" y="0" width="275" height="32" rx="10" fill="#d97706" />
    <rect x="0" y="22" width="275" height="10" fill="#d97706" />
    <text x="137" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">View (Presentation Layer)</text>
    <text x="16" y="55" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#0f172a">• Renders visual UI &amp; data formatting</text>
    <text x="16" y="74" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#0f172a">• Queries latest state from Model</text>
    <text x="16" y="93" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#0f172a">• Forwards user input events to Controller</text>
  </g>

  <!-- Model Node -->
  <g transform="translate(395, 212)">
    <rect width="290" height="108" rx="10" fill="#ffffff" stroke="#059669" stroke-width="2" filter="url(#shadow)" />
    <rect x="0" y="0" width="290" height="32" rx="10" fill="#059669" />
    <rect x="0" y="22" width="290" height="10" fill="#059669" />
    <text x="145" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">Model (Domain State &amp; Rules)</text>
    <text x="16" y="55" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#0f172a">• Encapsulates core business logic &amp; entities</text>
    <text x="16" y="74" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#0f172a">• Manages persistent data &amp; invariants</text>
    <text x="16" y="93" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#0f172a">• Notifies View observers on state change</text>
  </g>

  <!-- Flow Arrows -->
  <!-- User to Controller -->
  <path d="M 156 142 L 222 110" fill="none" stroke="#0284c7" stroke-width="2.2" marker-end="url(#arrow)" />
  <text x="182" y="114" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#0284c7" text-anchor="middle">1. User Action</text>

  <!-- View to User -->
  <path d="M 575 138 L 164 182" fill="none" stroke="#d97706" stroke-width="2" stroke-dasharray="5,4" marker-end="url(#arrow-amber)" />
  <text x="305" y="182" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#b45309">5. Render UI Display</text>

  <!-- Controller to View -->
  <path d="M 505 96 L 567 96" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#arrow-gray)" />
  <text x="536" y="87" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="700" fill="#475569" text-anchor="middle">Select View</text>

  <!-- Controller to Model -->
  <path d="M 355 164 L 355 262 L 387 262" fill="none" stroke="#0284c7" stroke-width="2.2" marker-end="url(#arrow)" />
  <text x="305" y="222" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#0284c7" text-anchor="middle">2. Update State</text>

  <!-- Model to View -->
  <path d="M 665 212 L 665 172" fill="none" stroke="#059669" stroke-width="2.2" marker-end="url(#arrow-green)" />
  <text x="722" y="196" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#059669">3. State Notification</text>

  <!-- View to Model -->
  <path d="M 605 164 L 605 204" fill="none" stroke="#64748b" stroke-width="1.8" stroke-dasharray="4,3" marker-end="url(#arrow-gray)" />
  <text x="556" y="196" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#64748b">4. Query Data</text>
</svg>
