<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 340" width="100%" height="100%">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.08" />
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0284c7" />
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#059669" />
    </marker>
    <marker id="arrow-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#64748b" />
    </marker>
  </defs>

  <rect width="880" height="340" fill="#f8fafc" rx="12" stroke="#e2e8f0" stroke-width="1.5" />

  <!-- Pattern Header Badge -->
  <rect x="24" y="16" width="220" height="28" rx="6" fill="#e0f2fe" stroke="#0284c7" stroke-width="1" />
  <text x="34" y="35" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#0369a1">ARCHITECTURAL PATTERN</text>
  <text x="180" y="35" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#64748b">01 / MVC</text>

  <!-- User / Actor Node -->
  <g transform="translate(40, 110)">
    <rect width="110" height="110" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5" filter="url(#shadow)" />
    <circle cx="55" cy="42" r="16" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5" />
    <path d="M 33 76 C 33 60, 77 60, 77 76" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5" />
    <text x="55" y="96" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#334155" text-anchor="middle">使用者 / 客戶端</text>
    <text x="55" y="108" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#64748b" text-anchor="middle">User / Browser</text>
  </g>

  <!-- Controller Node -->
  <g transform="translate(220, 60)">
    <rect width="260" height="100" rx="10" fill="#ffffff" stroke="#0284c7" stroke-width="2" filter="url(#shadow)" />
    <rect x="0" y="0" width="260" height="32" rx="10" fill="#0284c7" />
    <rect x="0" y="22" width="260" height="10" fill="#0284c7" />
    <text x="130" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">Controller (控制器)</text>
    <text x="20" y="55" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#0f172a">• 攔截使用者操作與 HTTP 請求</text>
    <text x="20" y="73" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#0f172a">• 呼叫 Model 執行商業狀態更新</text>
    <text x="20" y="91" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#0f172a">• 選派合適的 View 呈現結果</text>
  </g>

  <!-- View Node -->
  <g transform="translate(580, 60)">
    <rect width="260" height="100" rx="10" fill="#ffffff" stroke="#d97706" stroke-width="2" filter="url(#shadow)" />
    <rect x="0" y="0" width="260" height="32" rx="10" fill="#d97706" />
    <rect x="0" y="22" width="260" height="10" fill="#d97706" />
    <text x="130" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">View (視圖)</text>
    <text x="20" y="55" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#0f172a">• 渲染 UI 介面與資料視覺化</text>
    <text x="20" y="73" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#0f172a">• 向 Model 查詢最新狀態資料</text>
    <text x="20" y="91" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#0f172a">• 將輸入事件轉發予 Controller</text>
  </g>

  <!-- Model Node -->
  <g transform="translate(400, 210)">
    <rect width="260" height="100" rx="10" fill="#ffffff" stroke="#059669" stroke-width="2" filter="url(#shadow)" />
    <rect x="0" y="0" width="260" height="32" rx="10" fill="#059669" />
    <rect x="0" y="22" width="260" height="10" fill="#059669" />
    <text x="130" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">Model (模型)</text>
    <text x="20" y="55" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#0f172a">• 封裝核心業務邏輯與領域實體</text>
    <text x="20" y="73" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#0f172a">• 管理持久化資料狀態與驗證</text>
    <text x="20" y="91" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#0f172a">• 狀態變更時主動通知 View 刷新</text>
  </g>

  <!-- Flow Arrows -->
  <!-- User to Controller -->
  <path d="M 150 140 L 212 110" fill="none" stroke="#0284c7" stroke-width="2" marker-end="url(#arrow)" />
  <text x="180" y="118" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#0284c7">操作請求</text>

  <!-- View to User -->
  <path d="M 580 135 L 158 175" fill="none" stroke="#d97706" stroke-width="2" stroke-dasharray="5,4" marker-end="url(#arrow-gray)" />
  <text x="280" y="180" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#d97706">渲染畫面呈現</text>

  <!-- Controller to View -->
  <path d="M 480 95 L 572 95" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#arrow-gray)" />
  <text x="530" y="86" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#64748b" text-anchor="middle">選派視圖</text>

  <!-- Controller to Model -->
  <path d="M 350 160 L 350 250 L 392 250" fill="none" stroke="#0284c7" stroke-width="2" marker-end="url(#arrow)" />
  <text x="320" y="215" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#0284c7" text-anchor="middle">狀態更新</text>

  <!-- Model to View -->
  <path d="M 660 210 L 660 168" fill="none" stroke="#059669" stroke-width="2" marker-end="url(#arrow-green)" />
  <text x="695" y="195" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#059669">變更通知</text>

  <!-- View to Model -->
  <path d="M 610 160 L 610 202" fill="none" stroke="#64748b" stroke-width="1.8" stroke-dasharray="4,3" marker-end="url(#arrow-gray)" />
  <text x="575" y="195" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#64748b">查詢狀態</text>
</svg>
