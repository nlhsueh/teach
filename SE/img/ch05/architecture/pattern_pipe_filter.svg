<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 350" width="100%" height="100%">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.08" />
    </filter>
    <marker id="arrow-pf" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0284c7" />
    </marker>
  </defs>

  <rect width="880" height="350" fill="#f5f5f5" />
  <rect x="8" y="8" width="864" height="334" fill="#f8fafc" rx="12" stroke="#cbd5e1" stroke-width="1.5" />

  <!-- Pattern Header Badge -->
  <rect x="24" y="20" width="315" height="28" rx="6" fill="#e0f2fe" stroke="#0284c7" stroke-width="1" />
  <text x="34" y="39" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="700" fill="#0369a1">ARCHITECTURAL PATTERN</text>
  <text x="200" y="39" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="700" fill="#64748b">05 / PIPE &amp; FILTER</text>

  <!-- Top: Pipeline Diagram -->
  <g transform="translate(30, 68)">
    <!-- Source -->
    <g transform="translate(0, 25)">
      <rect width="102" height="72" rx="8" fill="#ffffff" stroke="#64748b" stroke-width="1.5" filter="url(#shadow)" />
      <text x="51" y="28" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#334155" text-anchor="middle">Data Source</text>
      <text x="51" y="45" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#64748b" text-anchor="middle">Raw Input</text>
      <text x="51" y="60" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5" fill="#0284c7" text-anchor="middle">(Files / Streams)</text>
    </g>

    <!-- Pipe 1 -->
    <g transform="translate(102, 48)">
      <line x1="0" y1="13" x2="35" y2="13" stroke="#0284c7" stroke-width="3" marker-end="url(#arrow-pf)" />
      <text x="18" y="6" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5" font-weight="700" fill="#0284c7" text-anchor="middle">Pipe</text>
    </g>

    <!-- Filter 1 -->
    <g transform="translate(145, 16)">
      <rect width="136" height="90" rx="8" fill="#ffffff" stroke="#0284c7" stroke-width="2" filter="url(#shadow)" />
      <rect x="0" y="0" width="136" height="26" rx="8" fill="#0284c7" />
      <rect x="0" y="16" width="136" height="10" fill="#0284c7" />
      <text x="68" y="17" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">Filter 1: Parse</text>
      <text x="68" y="45" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#0f172a" text-anchor="middle">Parser / Ingest</text>
      <text x="68" y="62" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#64748b" text-anchor="middle">Tokenize raw records</text>
      <text x="68" y="78" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5" fill="#0284c7" text-anchor="middle">e.g., JSON.parse()</text>
    </g>

    <!-- Pipe 2 -->
    <g transform="translate(281, 48)">
      <line x1="0" y1="13" x2="35" y2="13" stroke="#0284c7" stroke-width="3" marker-end="url(#arrow-pf)" />
      <text x="18" y="6" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5" font-weight="700" fill="#0284c7" text-anchor="middle">Pipe</text>
    </g>

    <!-- Filter 2 -->
    <g transform="translate(324, 16)">
      <rect width="136" height="90" rx="8" fill="#ffffff" stroke="#059669" stroke-width="2" filter="url(#shadow)" />
      <rect x="0" y="0" width="136" height="26" rx="8" fill="#059669" />
      <rect x="0" y="16" width="136" height="10" fill="#059669" />
      <text x="68" y="17" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">Filter 2: Cleanse</text>
      <text x="68" y="45" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#0f172a" text-anchor="middle">Filter / Validate</text>
      <text x="68" y="62" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#64748b" text-anchor="middle">Drop invalid entries</text>
      <text x="68" y="78" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5" fill="#059669" text-anchor="middle">e.g., grep / validate</text>
    </g>

    <!-- Pipe 3 -->
    <g transform="translate(460, 48)">
      <line x1="0" y1="13" x2="35" y2="13" stroke="#0284c7" stroke-width="3" marker-end="url(#arrow-pf)" />
      <text x="18" y="6" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5" font-weight="700" fill="#0284c7" text-anchor="middle">Pipe</text>
    </g>

    <!-- Filter 3 -->
    <g transform="translate(503, 16)">
      <rect width="136" height="90" rx="8" fill="#ffffff" stroke="#d97706" stroke-width="2" filter="url(#shadow)" />
      <rect x="0" y="0" width="136" height="26" rx="8" fill="#d97706" />
      <rect x="0" y="16" width="136" height="10" fill="#d97706" />
      <text x="68" y="17" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">Filter 3: Transform</text>
      <text x="68" y="45" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#0f172a" text-anchor="middle">Aggregate / Enrich</text>
      <text x="68" y="62" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#64748b" text-anchor="middle">Compute metrics</text>
      <text x="68" y="78" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5" fill="#d97706" text-anchor="middle">e.g., reduce / sort</text>
    </g>

    <!-- Pipe 4 -->
    <g transform="translate(639, 48)">
      <line x1="0" y1="13" x2="35" y2="13" stroke="#0284c7" stroke-width="3" marker-end="url(#arrow-pf)" />
      <text x="18" y="6" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5" font-weight="700" fill="#0284c7" text-anchor="middle">Pipe</text>
    </g>

    <!-- Sink -->
    <g transform="translate(682, 25)">
      <rect width="102" height="72" rx="8" fill="#ffffff" stroke="#64748b" stroke-width="1.5" filter="url(#shadow)" />
      <text x="51" y="28" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#334155" text-anchor="middle">Data Sink</text>
      <text x="51" y="45" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#64748b" text-anchor="middle">Final Output</text>
      <text x="51" y="60" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5" fill="#059669" text-anchor="middle">(Report / Warehouse)</text>
    </g>
  </g>

  <!-- Bottom: Unix CLI Analogy & Key Insights -->
  <g transform="translate(30, 198)">
    <!-- Unix Terminal Box -->
    <g transform="translate(0, 0)">
      <rect width="465" height="120" rx="8" fill="#1e293b" filter="url(#shadow)" />
      <rect x="0" y="0" width="465" height="24" rx="8" fill="#0f172a" />
      <circle cx="14" cy="12" r="4" fill="#ef4444" />
      <circle cx="28" cy="12" r="4" fill="#f59e0b" />
      <circle cx="42" cy="12" r="4" fill="#10b981" />
      <text x="62" y="16" font-family="Courier, monospace" font-size="11" fill="#94a3b8">Terminal (Unix Shell Pipe Analogy)</text>

      <text x="16" y="52" font-family="Courier, monospace" font-size="13" font-weight="700" fill="#38bdf8">$ cat access.log | grep "500" | sort | uniq -c</text>
      <text x="16" y="80" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#cbd5e1">Each filter is stateless and decoupled from upstream/downstream stages.</text>
      <text x="16" y="100" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#38bdf8">High Composability: Filters can be recombined or parallelized freely.</text>
    </g>

    <!-- Right: Architecture Insights Card -->
    <g transform="translate(485, 0)">
      <rect width="335" height="120" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" filter="url(#shadow)" />
      <text x="14" y="27" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="700" fill="#0284c7">Best Used For:</text>
      <text x="102" y="27" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#334155">ETL pipelines, compilers, stream processing</text>

      <line x1="14" y1="40" x2="320" y2="40" stroke="#f1f5f9" stroke-width="1.2" />

      <text x="14" y="62" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="700" fill="#059669">Key Strength:</text>
      <text x="102" y="62" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#334155">High reuse &amp; easy multi-core concurrency</text>

      <line x1="14" y1="75" x2="320" y2="75" stroke="#f1f5f9" stroke-width="1.2" />

      <text x="14" y="97" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="700" fill="#e11d48">Trade-off:</text>
      <text x="102" y="97" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#334155">Unfit for interactive UIs; parsing overhead</text>
    </g>
  </g>
</svg>
